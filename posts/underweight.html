  data-title="저체중과 건강하게 살 찌우기: 원인부터 확인, 하루 300~500kcal 더하기, 근력 운동으로 근육 붙이기"
  data-thumb="18.5|저체중 체질량지수 기준"
  data-summary="살을 빼는 이야기는 많지만, 살이 안 쪄서 고민인 사람도 적지 않아요. 저체중의 기준과 건강에 주는 영향, 먼저 확인할 숨은 원인, 과자와 패스트푸드가 아닌 방법으로 열량을 늘리는 요령, 적게 먹는 사람을 위한 식사 구성, 근력 운동의 중요성, 의도하지 않게 체중이 줄 때 진료가 필요한 신호를 정리했어요."
  data-tags="저체중,체중증가,근력운동,체질량지수,건강상식">
<p class="lead">"많이 먹는데도 살이 안 쪄요." "마르면 좋겠다는 말이 스트레스예요." 저체중인 사람들은 주변의 부러움 섞인 말과 달리 쉽게 지치고, 추위를 많이 타고, 잔병치레가 잦다고 호소하기도 해요. 건강하게 체중을 늘리는 것도 빼는 것만큼 계획이 필요해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>체질량지수 <strong>18.5 미만</strong>이면 저체중이에요.</li>
<li>갑자기 살이 빠졌거나 계속 빠진다면 <strong>갑상선, 당뇨, 소화기 질환, 우울</strong> 같은 원인을 먼저 확인해요.</li>
<li>하루 <strong>300~500kcal</strong>를 영양이 풍부한 음식으로 더하고, <strong>자주 나눠</strong> 먹어요.</li>
<li><strong>근력 운동</strong>을 함께 해야 지방이 아니라 근육으로 체중이 늘어요.</li>
</ul></div>

<h2>저체중의 기준과 건강 영향</h2>
<div class="tbl"><table>
<thead><tr><th>체질량지수(kg/m²)</th><th>분류</th></tr></thead>
<tbody>
<tr><td class="num">18.5 미만</td><td>저체중</td></tr>
<tr><td class="num">18.5~22.9</td><td>정상</td></tr>
<tr><td class="num">23~24.9</td><td>비만 전 단계</td></tr>
<tr><td class="num">25 이상</td><td>비만</td></tr>
</tbody>
<caption>대한비만학회 비만 진료지침 2022 한국인 체질량지수 기준. 체질량지수 = 체중(kg) ÷ 키(m)²</caption></table></div>
<ul>
<li><strong>뼈:</strong> 골밀도가 낮아 골다공증과 골절 위험이 커요.</li>
<li><strong>면역:</strong> 감염에 약하고 회복이 느릴 수 있어요.</li>
<li><strong>여성:</strong> 생리 불순, 무월경, 임신 때 저체중아 위험</li>
<li><strong>근육과 체력:</strong> 쉽게 지치고, 나이가 들면 근감소와 낙상 위험이 커요.</li>
<li>어르신은 저체중일 때 사망 위험이 높아진다는 연구가 많아요.</li>
</ul>

<h2>먼저 원인을 확인해요</h2>
<ul>
<li><strong>체질:</strong> 가족 모두 마른 편이고 건강에 문제가 없다면 체질일 수 있어요.</li>
<li><strong>먹는 양 부족:</strong> 바쁜 생활, 불규칙한 식사, 입이 짧음</li>
<li><strong>몸의 병:</strong> 갑상선 기능 항진증, 당뇨, 흡수 장애(셀리악병, 염증성 장질환), 결핵, 기생충, 암</li>
<li><strong>마음:</strong> 우울, 불안, 섭식 장애</li>
<li><strong>약과 습관:</strong> 일부 약, 흡연, 과한 카페인·음주</li>
</ul>

<div class="box warn"><span class="h">이럴 때는 진료를 받아요</span>
<ul>
<li>6~12개월 사이 <strong>체중이 5% 넘게</strong> 의도하지 않게 줄었어요.</li>
<li>살이 빠지면서 <strong>두근거림, 손 떨림, 땀</strong>이 늘었어요.</li>
<li>목마르고 소변이 많아졌어요.</li>
<li>설사, 혈변, 복통이 계속돼요.</li>
<li>열, 밤에 땀, 오래가는 기침이 있어요.</li>
<li>살찌는 것이 두려워 먹지 않거나, 먹고 나서 토해요.</li>
</ul></div>

<h2>건강하게 열량 더하기</h2>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>예</th></tr></thead>
<tbody>
<tr><td>하루 5~6번 나눠 먹기</td><td>세 끼 + 오전·오후·저녁 간식</td></tr>
<tr><td>영양이 촘촘한 간식</td><td>견과류 한 줌, 바나나와 땅콩버터, 치즈, 요거트, 삶은 달걀, 고구마</td></tr>
<tr><td>음식에 조금씩 더하기</td><td>밥에 들기름·참깨, 샐러드에 올리브유·견과, 죽에 달걀·두부</td></tr>
<tr><td>마시는 열량</td><td>우유, 두유, 과일·견과 스무디. 식사 직전보다 식사 사이에</td></tr>
<tr><td>단백질 매끼</td><td>달걀, 생선, 살코기, 두부, 콩</td></tr>
</tbody>
<caption>영국 국민보건서비스(NHS) Underweight adults, 대한영양사협회 자료를 바탕으로 정리</caption></table></div>
<p>과자, 탄산음료, 패스트푸드로 열량을 채우면 체중은 늘어도 내장지방과 혈당, 콜레스테롤이 나빠질 수 있어요. 마른 사람도 대사 건강을 챙겨야 해요.</p>

<h2>적게 먹는 사람을 위한 요령</h2>
<ul>
<li>식사 직전과 도중에 <strong>물을 많이 마시지 않아요.</strong> 배가 금방 불러요.</li>
<li>좋아하는 음식을 활용하고, 식사를 즐거운 시간으로 만들어요.</li>
<li>큰 접시보다 조금 작은 접시에 여러 번 담으면 부담이 덜해요.</li>
<li>식사 전 가볍게 산책하면 입맛이 돌아요.</li>
</ul>

<h2>근력 운동이 핵심</h2>
<p>먹기만 늘리면 주로 지방이 늘어요. <strong>주 2~3회 근력 운동</strong>(스쿼트, 팔굽혀펴기, 밴드·기구 운동)을 함께 하면 근육으로 체중이 늘고 체력과 뼈도 좋아져요. 유산소 운동은 적당히 유지하되, 너무 오래 하면 열량이 많이 소모돼요. 목표는 한 달에 <strong>0.5~1kg</strong> 정도로 천천히 늘리는 거예요.</p>

<div class="box"><span class="h">건강한 체중 늘리기 체크리스트</span>
<ol>
<li>원인 확인(갑상선·혈당·소화기)</li>
<li>하루 5~6번 나눠 먹기</li>
<li>매끼 단백질</li>
<li>견과·유제품·좋은 기름으로 열량 더하기</li>
<li>주 2~3회 근력 운동</li>
<li>한 달 0.5~1kg, 체중 기록</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>살찌는 약이나 보충제가 있나요?</dt>
<dd>식욕을 늘리는 약은 특정 질환에만 제한적으로 써요. 체중 증가용 보충제보다 식사와 근력 운동이 기본이에요. 식사가 너무 어렵다면 의사와 영양 보충 음료를 상의해요.</dd>
<dt>마른 비만은 뭔가요?</dt>
<dd>체중은 정상이거나 적은데 근육이 적고 체지방 비율이 높은 상태예요. 혈당과 콜레스테롤이 나쁠 수 있어 근력 운동과 균형 잡힌 식사가 필요해요.</dd>
<dt>아이가 너무 말랐어요.</dt>
<dd>성장 곡선에서 키와 몸무게가 꾸준히 따라가고 있다면 대개 괜찮아요. 곡선에서 떨어지거나 자주 아프면 소아청소년과와 상의해요.</dd>
</dl>
