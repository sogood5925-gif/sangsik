  data-thumb="135/85|가정혈압 기준"
  data-summary="병원에서 잰 혈압만으로는 평소 혈압을 알기 어려워요. 가정혈압이 중요한 이유, 백의고혈압과 가면고혈압, 측정 시간과 자세, 커프 크기와 혈압계 고르는 법, 가정혈압 진단 기준과 기록하는 요령, 응급으로 봐야 하는 혈압과 증상을 정리했어요."
  data-tags="가정혈압,고혈압,혈압측정,혈압계,건강상식">
<p class="lead">병원에만 가면 긴장해서 혈압이 오르는 사람이 있고, 반대로 병원에서는 정상인데 집이나 직장에서는 높은 사람도 있어요. 그래서 고혈압 진료 지침은 집에서 재는 <strong>가정혈압</strong>을 적극 권해요. 제대로 재기만 하면 진료실 혈압보다 평소 혈압을 더 잘 보여 줘요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>가정혈압은 <strong>135/85mmHg 이상</strong>이면 고혈압으로 봐요(진료실 기준 140/90보다 낮아요).</li>
<li><strong>아침</strong>(일어나 1시간 안, 소변 후, 약·식사 전)과 <strong>저녁</strong>(잠자기 전)에 <strong>두 번씩</strong> 재요.</li>
<li><strong>팔 위쪽(상완)에 감는</strong> 검증된 혈압계를, <strong>팔 둘레에 맞는 커프</strong>로 써요.</li>
<li>5분 쉬고, 등을 기대고, 팔은 심장 높이, 말하지 않고 재요.</li>
</ul></div>

<h2>가정혈압이 중요한 이유</h2>
<ul>
<li><strong>백의고혈압:</strong> 진료실에서만 높고 평소에는 정상이에요. 불필요한 약을 피할 수 있어요.</li>
<li><strong>가면고혈압:</strong> 진료실에서는 정상인데 평소에 높아요. 놓치기 쉽고 심혈관 위험이 커요.</li>
<li>여러 날 여러 번 잰 평균이라 <strong>한 번 측정보다 정확</strong>해요.</li>
<li>가정혈압은 심혈관 질환 위험을 진료실 혈압보다 더 잘 예측한다는 연구가 많아요.</li>
<li>약을 먹는 사람은 약 효과가 하루 종일 유지되는지 알 수 있어요.</li>
</ul>

<h2>언제 잴까</h2>
<div class="tbl"><table>
<thead><tr><th>시간</th><th>조건</th><th>횟수</th></tr></thead>
<tbody>
<tr><td>아침</td><td>일어나 1시간 안, 소변을 본 뒤, 혈압약과 아침 식사 전</td><td>1~2분 간격 2번</td></tr>
<tr><td>저녁</td><td>잠자리에 들기 전</td><td>1~2분 간격 2번</td></tr>
<tr><td>기간</td><td>진단이나 약 조절 때는 <strong>최소 5~7일</strong> 연속 측정해 평균을 내요</td><td>이후에는 주 1~2일 정도로 줄여도 돼요</td></tr>
</tbody>
<caption>대한고혈압학회 가정혈압 측정 권고를 바탕으로 정리</caption></table></div>

<h2>바르게 재는 법</h2>
<ol>
<li>측정 <strong>30분 전</strong>에는 커피, 담배, 운동, 목욕을 피해요.</li>
<li>등받이가 있는 의자에 <strong>5분</strong> 정도 편히 앉아 쉬어요.</li>
<li><strong>등을 기대고, 다리를 꼬지 않고, 발바닥을 바닥에</strong> 붙여요.</li>
<li>맨살이나 얇은 옷 위 <strong>팔 위쪽</strong>에 커프를 감아요. 걷어 올린 소매가 팔을 조이지 않게 해요.</li>
<li>커프 가운데가 <strong>심장 높이</strong>에 오도록 팔을 탁자에 편히 올려요.</li>
<li>재는 동안 <strong>말하거나 움직이지 않아요.</strong></li>
<li>1~2분 뒤 한 번 더 재고, 두 번 모두 기록해요.</li>
</ol>
<p>처음에는 양팔을 재 보고, 차이가 크면 높게 나오는 팔로 계속 재요. 양팔 차이가 계속 크다면 진료 때 알려요.</p>

<h2>혈압계와 커프 고르기</h2>
<ul>
<li><strong>팔 위쪽에 감는 자동 혈압계</strong>를 권해요. 손목형은 자세에 따라 오차가 커요.</li>
<li>정확도 검증을 받은 제품인지 확인해요.</li>
<li><strong>커프 크기</strong>가 중요해요. 팔이 굵은데 작은 커프를 쓰면 혈압이 높게 나오고, 팔이 가는데 큰 커프를 쓰면 낮게 나와요. 팔 둘레를 재서 맞는 크기를 골라요.</li>
<li>1~2년에 한 번쯤 병원 혈압계와 비교해 오차를 확인해요.</li>
</ul>

<h2>기록과 활용</h2>
<ul>
<li>날짜, 시간, 두 번의 혈압과 맥박을 적어요. 혈압계 기억 기능이나 앱을 써도 돼요.</li>
<li>진료 때 기록을 가져가면 약 조절에 큰 도움이 돼요.</li>
<li>한 번 높게 나왔다고 놀라지 말고 <strong>평균</strong>을 봐요. 너무 자주 재면 오히려 불안해질 수 있어요.</li>
<li>약은 가정혈압 결과를 보고 <strong>스스로 끊거나 늘리지 않아요.</strong></li>
</ul>

<div class="box warn"><span class="h">바로 진료나 119가 필요한 경우</span>
<ul>
<li>혈압이 <strong>180/110mmHg 이상</strong>이면서 <strong>심한 두통, 가슴 통증, 숨참, 시야 흐림, 한쪽 마비, 말이 어눌함</strong>이 있어요 → 119</li>
<li>증상 없이 180/110 이상이 반복돼요 → 빨리 진료</li>
<li>혈압이 너무 낮고(예: 90/60 미만) 어지러워 쓰러질 것 같아요 → 진료</li>
</ul></div>

<div class="box"><span class="h">가정혈압 체크리스트</span>
<ol>
<li>팔 위쪽형, 검증된 혈압계</li>
<li>팔 둘레에 맞는 커프</li>
<li>아침·저녁 두 번씩, 5~7일</li>
<li>5분 쉬고, 등 기대고, 팔은 심장 높이</li>
<li>기록해서 진료 때 가져가기</li>
<li>135/85 이상이 계속되면 상담</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>잴 때마다 숫자가 달라요.</dt>
<dd>혈압은 호흡, 긴장, 자세에 따라 계속 변해요. 몇 mmHg 차이는 정상이에요. 그래서 여러 번 잰 평균을 봐요.</dd>
<dt>약을 먹는데 가정혈압 목표는 얼마인가요?</dt>
<dd>일반적으로 진료실 목표보다 조금 낮게 잡아요. 나이, 당뇨, 콩팥병 등에 따라 달라서 주치의와 목표를 정해요.</dd>
<dt>아침 혈압이 특히 높아요.</dt>
<dd>아침에는 혈압이 오르기 쉽고, 아침 고혈압은 뇌졸중 위험과 관련이 있어요. 기록을 가져가 약 종류나 복용 시간을 상의해요.</dd>
</dl>
