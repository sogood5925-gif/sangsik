<template data-id="picky-eating" data-cat="nut" data-date="2026.09.30"
  data-title="아이 편식: 새 음식은 열 번 넘게 만나야 익숙해져요, 부모와 아이의 역할 나누기, 걱정해야 할 편식"
  data-thumb="8~15번|새 음식에 익숙해지는 횟수"
  data-summary="채소는 뱉고 좋아하는 음식만 찾는 편식은 2~6세 아이에게 흔한 발달 과정이에요. 편식이 생기는 이유, 억지로 먹이거나 상으로 달래는 방법이 역효과를 내는 까닭, 부모와 아이의 역할 나누기, 새 음식에 익숙해지게 돕는 방법, 우유·주스를 너무 많이 먹을 때, 진료가 필요한 편식의 신호를 정리했어요."
  data-tags="편식,아이식사,유아영양,식습관,영양소">
<p class="lead">어제는 잘 먹던 브로콜리를 오늘은 쳐다보지도 않고, 흰밥과 김만 찾는 아이. 매 끼니가 전쟁 같다는 부모가 많아요. 그런데 걸음마 이후 유아기의 편식은 대부분 자연스러운 발달 과정이에요. 조급함을 조금 내려놓고, 아이가 음식과 친해질 시간을 주는 것이 오히려 빠른 길이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>새 음식을 꺼리는 것은 <strong>2~6세</strong>에 흔한 발달 특성이에요.</li>
<li>새 음식은 <strong>8~15번 이상</strong> 보고, 만지고, 맛보며 익숙해져요. 한두 번 거부로 포기하지 않아요.</li>
<li><strong>무엇을, 언제, 어디서</strong>는 부모가, <strong>먹을지, 얼마나</strong>는 아이가 정해요.</li>
<li>억지로 먹이기, 디저트로 보상하기는 <strong>편식을 더 굳혀요.</strong></li>
</ul></div>

<h2>편식은 왜 생길까</h2>
<ul>
<li><strong>새 음식에 대한 경계:</strong> 처음 보는 것을 조심하는 본능이에요. 걸음마를 시작해 혼자 돌아다닐 즈음 강해져요.</li>
<li><strong>성장 속도 변화:</strong> 돌 이후에는 첫해보다 천천히 자라 식욕이 줄어드는 게 자연스러워요.</li>
<li><strong>쓴맛에 예민함:</strong> 아이는 어른보다 채소의 쓴맛을 더 강하게 느껴요.</li>
<li><strong>자기 주장:</strong> "싫어"라고 말하며 스스로 결정하고 싶어 하는 시기예요.</li>
<li><strong>식감:</strong> 물컹하거나 섞인 음식을 싫어하는 아이가 많아요.</li>
</ul>

<h2>부모와 아이의 역할</h2>
<div class="tbl"><table>
<thead><tr><th>부모가 정해요</th><th>아이가 정해요</th></tr></thead>
<tbody>
<tr><td>무엇을 차릴지(좋아하는 음식 한 가지 + 새 음식 조금)</td><td>먹을지 말지</td></tr>
<tr><td>언제 먹을지(정해진 식사·간식 시간)</td><td>얼마나 먹을지</td></tr>
<tr><td>어디서 먹을지(식탁에서 함께, 화면 끄고)</td><td>어떤 순서로, 얼마나 천천히 먹을지</td></tr>
</tbody>
<caption>엘린 새터(Ellyn Satter)의 식사 책임 분담 원칙, 미국소아과학회(AAP) 영유아 식습관 안내를 바탕으로 정리</caption></table></div>
<p>아이가 한 끼를 적게 먹어도, 하루나 일주일 단위로 보면 대개 필요한 만큼 먹어요. 성장 곡선을 따라 잘 자라고 있다면 한 끼의 양에 너무 신경 쓰지 않아도 돼요.</p>

<h2>새 음식과 친해지는 방법</h2>
<ul>
<li><strong>작게, 여러 번:</strong> 새 음식은 한두 조각만 접시 한쪽에. 먹지 않아도 괜찮다고 말해 줘요.</li>
<li><strong>좋아하는 음식과 함께:</strong> 익숙한 음식 옆에 새 음식을 두면 부담이 줄어요.</li>
<li><strong>같이 먹는 모습 보여 주기:</strong> 부모와 형제가 맛있게 먹는 모습이 가장 좋은 교육이에요.</li>
<li><strong>요리에 참여하기:</strong> 채소 씻기, 버섯 찢기, 김밥 말기. 자기가 만든 건 한 입이라도 먹어 봐요.</li>
<li><strong>모양과 식감 바꾸기:</strong> 삶은 당근을 싫어하면 구운 당근, 채 썬 당근으로</li>
<li><strong>칭찬은 가볍게:</strong> "한 입 맛봤네" 정도. 과한 칭찬과 보상은 오히려 음식을 '억지로 하는 일'로 만들어요.</li>
</ul>

<h2>역효과를 내는 방법</h2>
<div class="tbl"><table>
<thead><tr><th>흔한 방법</th><th>왜 역효과일까</th></tr></thead>
<tbody>
<tr><td>"다 먹어야 일어날 수 있어"</td><td>식탁이 싸움터가 되고, 배부름 신호를 무시하는 습관이 생겨요</td></tr>
<tr><td>"채소 먹으면 아이스크림 줄게"</td><td>채소는 참는 것, 디저트는 상이라고 배워요</td></tr>
<tr><td>따라다니며 먹이기, 영상 보며 먹이기</td><td>먹는 양은 늘어도 스스로 먹는 힘과 음식에 대한 관심이 자라지 않아요</td></tr>
<tr><td>안 먹으면 바로 다른 음식 만들어 주기</td><td>좋아하는 음식만 기다리게 돼요</td></tr>
<tr><td>식사 사이에 과자·우유를 계속 주기</td><td>식사 때 배가 고프지 않아요</td></tr>
</tbody>
<caption>미국소아과학회(AAP), 대한소아청소년과학회 부모 안내를 바탕으로 정리</caption></table></div>

<h2>우유와 주스가 너무 많다면</h2>
<p>우유를 하루 <strong>500mL 넘게</strong> 마시는 유아는 배가 불러 밥을 덜 먹고, 우유가 철 흡수를 방해해 <strong>철 결핍 빈혈</strong>이 생기기 쉬워요. 1~2세는 하루 우유 2컵(약 400~500mL) 안팎이면 충분해요. 과일 주스는 되도록 생과일로 바꾸고, 준다면 소량만 줘요. 물을 주로 마시게 해요.</p>

<div class="box warn"><span class="h">진료를 받아야 할 편식의 신호</span>
<ul>
<li><strong>체중이 줄거나</strong> 성장 곡선에서 크게 떨어져요.</li>
<li>먹는 음식이 <strong>20가지 이하</strong>로 매우 적고, 새 음식을 보면 토하거나 심하게 괴로워해요.</li>
<li>삼키기 어려워하거나 자주 사레들리고, 먹을 때마다 토해요.</li>
<li>변비, 설사, 복통이 계속되거나, 피곤하고 창백해 보여요.</li>
<li>발달이나 감각이 예민한 문제가 함께 있어요.</li>
</ul>
<p>회피적·제한적 음식 섭취 장애(ARFID)나 삼킴 문제, 알레르기 같은 원인이 있을 수 있어 소아청소년과와 상의해요.</p></div>

<div class="box"><span class="h">편식 대처 체크리스트</span>
<ol>
<li>정해진 시간에 식탁에서 함께 먹기</li>
<li>좋아하는 음식 + 새 음식 조금</li>
<li>억지로·보상으로 먹이지 않기</li>
<li>요리에 아이 참여시키기</li>
<li>우유는 하루 500mL 안쪽, 주스 줄이기</li>
<li>성장 곡선으로 전체 흐름 보기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>채소를 몰래 갈아 넣어도 되나요?</dt>
<dd>영양을 채우는 데는 도움이 돼요. 다만 채소 자체와 친해지는 기회도 필요하니, 채소가 보이는 반찬도 함께 내요.</dd>
<dt>편식하는 아이에게 영양제를 먹여야 하나요?</dt>
<dd>잘 자라고 있다면 대개 필요 없어요. 특정 영양소가 걱정되면 검사 뒤 의사와 상의해요.</dd>
<dt>언제쯤 좋아지나요?</dt>
<dd>대부분 초등학교에 들어갈 무렵 조금씩 나아져요. 부모가 느긋하게 기다려 줄수록 빨라지는 경우가 많아요.</dd>
</dl>
