  data-title="오래 앉아 있는 생활: 운동을 해도 앉은 시간은 따로 줄여야 하는 이유, 30분마다 일어나기"
  data-thumb="30분|일어날 간격"
  data-summary="하루 대부분을 앉아서 보내는 생활은 운동을 따로 해도 건강에 부담이 남을 수 있어요. 오래 앉기가 몸에 주는 영향, 연구가 말하는 운동량과 앉은 시간의 관계, 30분마다 일어나기 같은 사무실·집에서의 실천법, 서서 일하는 책상의 장단점, 앉은 자세 요령을 정리했어요."
  data-tags="좌식생활,앉아있는시간,사무직,신체활동,건강상식">
<p class="lead">출근해서 컴퓨터 앞에 앉고, 퇴근길 지하철에 앉고, 집에 와서 소파에 앉아요. 많은 사람이 깨어 있는 시간의 절반 이상을 앉아서 보내요. 저녁에 한 시간 운동을 해도, 나머지 열 시간 넘게 앉아 있는 생활은 따로 신경 써야 해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>오래 앉아 있는 시간이 길수록 <strong>심혈관 질환, 당뇨, 사망 위험</strong>이 높아져요.</li>
<li>하루 <strong>60~75분</strong> 정도의 중강도 신체활동은 오래 앉기의 위험을 크게 줄여요.</li>
<li>운동과 별개로 <strong>30분~1시간마다 일어나</strong> 몇 분 움직이면 혈당과 혈압에 도움이 돼요.</li>
<li>서서 일하는 책상은 <strong>앉기와 서기를 번갈아</strong> 쓸 때 의미가 있어요.</li>
</ul></div>

<h2>오래 앉으면 몸에 생기는 일</h2>
<ul>
<li>다리 근육이 거의 움직이지 않아 <strong>포도당과 지방을 쓰는 능력</strong>이 떨어져요. 식후 혈당과 중성지방이 더 오래 높게 유지돼요.</li>
<li>다리 혈액순환이 느려져 붓고, 오래 움직이지 않으면 혈전 위험이 커져요.</li>
<li>엉덩이와 허벅지 뒤 근육이 짧아지고, 허리와 목에 부담이 쌓여요.</li>
<li>하루 앉은 시간이 긴 사람은 심혈관 질환, 제2형 당뇨병, 일부 암, 사망 위험이 높았다는 연구가 많아요.</li>
</ul>

<h2>운동으로 상쇄할 수 있을까</h2>
<p>100만 명 이상을 모은 분석에서, 하루 <strong>60~75분 정도의 중강도 활동</strong>(빠르게 걷기 등)을 하는 사람은 오래 앉아 있어도 사망 위험 증가가 거의 사라졌어요. 반대로 활동량이 적은 사람에게서 앉은 시간의 위험이 가장 컸어요. 그래서 전략은 두 가지예요.</p>
<div class="tbl"><table>
<thead><tr><th>전략</th><th>목표</th></tr></thead>
<tbody>
<tr><td>움직이는 시간 늘리기</td><td>일주일에 중강도 150~300분(하루 20~40분 이상), 근력 운동 주 2회</td></tr>
<tr><td>앉은 시간 끊기</td><td>30분~1시간마다 일어나 2~5분 움직이기</td></tr>
<tr><td>앉은 시간 줄이기</td><td>화면 앞 여가 시간, 이동 중 앉는 시간을 줄여 가벼운 활동으로 바꾸기</td></tr>
</tbody>
<caption>세계보건기구(WHO) 신체활동·좌식행동 지침(2020), Ekelund U 외(Lancet 2016)를 바탕으로 정리</caption></table></div>
<p>세계보건기구는 앉아 있는 시간을 줄이고, 어떤 강도든 <strong>조금이라도 더 움직이는 것</strong>이 건강에 이롭다고 강조해요.</p>

<h2>사무실에서 실천하기</h2>
<ul>
<li><strong>타이머:</strong> 30~50분마다 알림을 맞추고, 울리면 일어나 물 한 잔, 스트레칭, 복도 한 바퀴.</li>
<li><strong>서서 하는 일:</strong> 전화 통화, 짧은 회의는 서서 해요.</li>
<li><strong>멀리 가기:</strong> 가까운 화장실·정수기 대신 조금 먼 곳을 이용해요.</li>
<li><strong>계단:</strong> 2~3층 정도는 계단을 써요.</li>
<li><strong>점심:</strong> 식사 후 10~15분 걸어요. 식후 혈당에도 좋아요.</li>
<li><strong>메신저 대신 걸어가기:</strong> 가까운 동료에게는 직접 찾아가 말해요.</li>
</ul>

<h2>집과 이동 중에</h2>
<ul>
<li>TV 광고나 드라마 한 편이 끝날 때마다 일어나 움직여요.</li>
<li>대중교통에서는 한 정거장 먼저 내려 걸어요.</li>
<li>운전을 오래 할 때는 1~2시간마다 휴게소에서 쉬고 걸어요.</li>
<li>장거리 비행에서는 자리에서 발목 돌리기, 까치발 들기를 하고, 가끔 통로를 걸어요.</li>
</ul>

<h2>서서 일하는 책상</h2>
<ul>
<li>하루 종일 서 있는 것도 다리 부종, 허리 통증, 하지정맥류 부담이 있어요.</li>
<li><strong>앉기와 서기를 30~60분 간격으로 번갈아</strong> 쓰는 것이 좋아요.</li>
<li>서서 일할 때 모니터는 눈높이, 팔꿈치는 90도, 발 받침이나 쿠션 매트를 써요.</li>
<li>서 있는 것 자체가 운동을 대신하지는 않아요. 걷고 움직이는 시간이 더 중요해요.</li>
</ul>

<h2>앉을 때 자세</h2>
<div class="tbl"><table>
<thead><tr><th>부위</th><th>요령</th></tr></thead>
<tbody>
<tr><td>허리</td><td>엉덩이를 의자 깊숙이 넣고 등받이에 기대요. 허리 뒤에 작은 쿠션을 대면 편해요</td></tr>
<tr><td>발</td><td>발바닥 전체가 바닥에 닿고 무릎은 엉덩이 높이와 비슷하게</td></tr>
<tr><td>모니터</td><td>화면 윗부분이 눈높이, 팔 길이 정도 거리</td></tr>
<tr><td>팔</td><td>키보드와 마우스는 팔꿈치가 90도쯤 되는 높이, 어깨 힘을 빼요</td></tr>
<tr><td>다리</td><td>다리를 오래 꼬지 않아요</td></tr>
</tbody></table></div>
<p>좋은 자세도 오래 유지하면 굳어요. 가장 좋은 자세는 '자주 바꾸는 자세'예요.</p>

<div class="box warn"><span class="h">이럴 때는 진료를 받아요</span>
<ul>
<li>오래 앉아 있거나 비행 뒤 <strong>한쪽 다리가 갑자기 붓고 아파요</strong>(혈전 가능성).</li>
<li>다리 부종과 함께 갑자기 숨이 차거나 가슴이 아파요(바로 119).</li>
<li>허리 통증이 다리로 뻗치고 저림이나 힘 빠짐이 있어요.</li>
</ul></div>

<div class="box"><span class="h">앉은 시간 줄이기 체크리스트</span>
<ol>
<li>30~50분마다 알림 맞추고 일어나기</li>
<li>통화·짧은 회의는 서서</li>
<li>점심 후 10~15분 걷기</li>
<li>TV 한 편마다 일어나 움직이기</li>
<li>하루 20~40분 이상 빠르게 걷기</li>
<li>주 2회 근력 운동</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>매일 헬스장에 가면 오래 앉아 있어도 괜찮나요?</dt>
<dd>운동을 충분히 하면 오래 앉기의 위험이 크게 줄어요. 그래도 몇 시간씩 꼼짝 않고 앉아 있으면 식후 혈당과 혈액순환에 불리하니 중간중간 일어나는 습관을 함께 가져요.</dd>
<dt>짧게 일어나는 것만으로 효과가 있나요?</dt>
<dd>연구에서 30분마다 몇 분씩 걷거나 가볍게 움직이면 식후 혈당과 인슐린이 줄었어요. 작은 움직임도 쌓이면 의미가 있어요.</dd>
<dt>의자 대신 짐볼에 앉으면 좋나요?</dt>
<dd>코어 근육을 쓰게 한다는 주장이 있지만 뚜렷한 이점은 확인되지 않았고, 오래 앉으면 오히려 불편할 수 있어요. 자주 일어나는 것이 더 효과적이에요.</dd>
</dl>
