  data-title="불안장애: 걱정이 멈추지 않을 때, 범불안장애·사회불안·공포증의 모습, 효과가 확인된 치료"
  data-thumb="6개월|범불안장애 판단 기간"
  data-summary="불안은 위험에 대비하게 하는 자연스러운 감정이지만, 이유보다 훨씬 크고 오래 이어져 생활을 흔들면 치료가 필요한 불안장애일 수 있어요. 범불안장애, 사회불안장애, 특정 공포증의 모습, 스스로 점검하는 질문, 인지행동치료와 약물 치료, 피하기가 불안을 키우는 이유, 오늘 해 볼 수 있는 방법을 정리했어요."
  data-tags="불안장애,범불안장애,사회불안,인지행동치료,질병">
<p class="lead">문을 잠갔는지, 가족에게 무슨 일이 생기지 않을지, 일이 잘못되지 않을지. 걱정이 꼬리를 물고 이어져 몸은 늘 긴장되어 있고 잠도 얕아요. 불안은 누구나 느끼는 감정이지만, 그 크기와 시간이 삶을 좁힐 만큼 커졌다면 도움을 받을 때예요. 불안장애는 흔하고, 치료 효과가 잘 확인된 병이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>불안이 <strong>상황보다 지나치게 크고 오래가며</strong> 생활에 지장을 주면 불안장애를 생각해요.</li>
<li><strong>범불안장애, 사회불안장애, 특정 공포증, 공황장애</strong> 등 여러 형태가 있어요.</li>
<li><strong>인지행동치료</strong>와 <strong>항우울제 계열 약</strong>이 효과가 확인된 치료예요.</li>
<li>불안한 상황을 계속 <strong>피하면</strong> 잠깐 편하지만 불안은 더 커져요.</li>
</ul></div>

<h2>불안장애의 여러 모습</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>특징</th></tr></thead>
<tbody>
<tr><td>범불안장애</td><td>일, 건강, 가족, 돈 등 여러 일에 대한 걱정이 <strong>6개월 이상</strong> 대부분의 날에 이어지고 조절이 어려워요. 피로, 근육 긴장, 집중 곤란, 수면 문제가 함께 와요</td></tr>
<tr><td>사회불안장애</td><td>남 앞에서 말하기, 식사, 발표처럼 평가받는 상황에서 창피당할까 봐 심하게 불안해 피하게 돼요</td></tr>
<tr><td>특정 공포증</td><td>높은 곳, 동물, 주사, 비행기 등 특정 대상을 지나치게 두려워해요</td></tr>
<tr><td>공황장애</td><td>갑작스러운 공황 발작이 반복되고, 또 올까 봐 걱정해요</td></tr>
<tr><td>광장공포증</td><td>도망치기 어려운 곳(대중교통, 붐비는 곳)을 두려워하고 피해요</td></tr>
</tbody>
<caption>미국정신의학회 정신질환 진단 및 통계 편람(DSM-5-TR), 대한불안의학회 자료를 바탕으로 정리</caption></table></div>

<h2>스스로 점검해 보기</h2>
<p>지난 2주 동안 아래 일이 얼마나 자주 있었는지 떠올려 보세요.</p>
<ul>
<li>초조하거나 불안하거나 조마조마하게 느꼈다.</li>
<li>걱정하는 것을 멈추거나 조절할 수 없었다.</li>
<li>여러 가지 것들에 대해 지나치게 걱정했다.</li>
<li>편하게 있기가 어려웠다.</li>
<li>쉽게 짜증이 나거나 쉽게 성을 냈다.</li>
</ul>
<p>이런 일이 절반 이상의 날에 있었고 생활이 힘들다면, 정신건강의학과나 정신건강복지센터에서 상담을 받아 보세요. 위 질문은 선별용이지 진단은 아니에요.</p>

<h2>몸에 나타나는 불안</h2>
<p>불안은 마음만의 일이 아니에요. 두근거림, 숨참, 가슴 답답함, 어지러움, 속 쓰림과 설사, 두통, 어깨 뭉침, 손 떨림이 흔해요. 그래서 여러 과를 돌며 검사를 받아도 이상이 없다는 말을 듣는 경우가 많아요. 물론 갑상선 기능 항진증, 부정맥, 빈혈처럼 비슷한 증상을 내는 몸의 병은 한 번 확인하는 것이 좋아요.</p>

<h2>치료</h2>
<div class="tbl"><table>
<thead><tr><th>치료</th><th>설명</th></tr></thead>
<tbody>
<tr><td>인지행동치료</td><td>불안을 키우는 생각의 흐름을 알아차리고, 피하던 상황에 조금씩 다가가는 노출 연습을 해요. 효과가 오래가요</td></tr>
<tr><td>항우울제(SSRI·SNRI 계열)</td><td>에스시탈로프람, 설트랄린, 벤라팍신 등. 효과가 나타나기까지 2~6주 걸리고, 좋아진 뒤에도 일정 기간 이어 가요</td></tr>
<tr><td>벤조디아제핀 계열 항불안제</td><td>빨리 효과가 나지만 의존 위험이 있어 짧게, 필요할 때만 써요</td></tr>
<tr><td>생활 습관</td><td>규칙적인 운동, 카페인·술 줄이기, 충분한 수면</td></tr>
</tbody>
<caption>영국 국립보건임상연구원(NICE) Generalised anxiety disorder and panic disorder in adults(CG113), 대한불안의학회 자료를 바탕으로 정리. 약은 의사와 상의해 시작하고 끊어요</caption></table></div>
<p>약을 먹기 시작한 처음 1~2주는 오히려 불안하거나 속이 불편할 수 있어요. 스스로 끊지 말고 의사에게 알려 조절해요. 오래 먹던 약은 천천히 줄여야 금단 증상이 적어요.</p>

<h2>피하면 커지는 불안</h2>
<p>불안한 상황을 피하면 그 순간은 편해요. 하지만 뇌는 '피해서 살았다'고 배워서 다음에는 더 크게 경보를 울려요. 그래서 치료에서는 두려운 상황을 작은 단계로 나눠 <strong>조금씩 머물러 보는 연습</strong>을 해요. 불안은 머물다 보면 저절로 줄어든다는 것을 몸이 경험하게 되는 거예요.</p>

<h2>오늘 해 볼 수 있는 것</h2>
<ul>
<li><strong>천천히 숨쉬기:</strong> 4초 들이마시고 6초 내쉬기를 몇 분간 반복해요.</li>
<li><strong>걱정 시간 정하기:</strong> 하루 15분을 정해 두고 걱정을 적어요. 그 밖의 시간에 떠오르면 '그 시간에 생각하자'고 미뤄요.</li>
<li><strong>몸 움직이기:</strong> 빠르게 걷기, 자전거처럼 숨이 약간 찰 정도의 운동</li>
<li><strong>카페인 줄이기:</strong> 커피, 에너지 음료가 두근거림과 불안을 키울 수 있어요.</li>
<li>뉴스와 사회관계망 서비스를 보는 시간을 정해요.</li>
</ul>

<div class="box warn"><span class="h">바로 도움을 청하세요</span>
<ul>
<li>불안과 함께 <strong>죽고 싶다는 생각</strong>이 들어요. 자살예방 상담전화 <strong>109</strong>(24시간), 정신건강 상담전화 <strong>1577-0199</strong></li>
<li>불안을 달래려고 술이나 약을 점점 더 찾게 돼요.</li>
<li>처음 겪는 가슴 통증, 숨참이 심하면 먼저 119로 몸의 응급 상황부터 확인해요.</li>
</ul></div>

<div class="box"><span class="h">불안 관리 체크리스트</span>
<ol>
<li>불안이 생활을 얼마나 막는지 적어 보기</li>
<li>몸의 병은 한 번 확인</li>
<li>인지행동치료·약물 치료 상담</li>
<li>피하던 상황에 작은 단계로 다가가기</li>
<li>운동, 카페인·술 줄이기</li>
<li>약은 스스로 끊지 않기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>원래 성격이 예민한 건데 치료가 필요할까요?</dt>
<dd>기질이 예민한 것과 불안장애는 달라요. 불안 때문에 하고 싶은 일을 못 하거나 몸과 잠이 계속 힘들다면 치료로 삶이 편해질 수 있어요.</dd>
<dt>정신건강의학과 기록이 남으면 불이익이 있나요?</dt>
<dd>진료 기록은 본인 동의 없이 다른 곳에 알려지지 않아요. 걱정된다면 첫 진료 때 궁금한 점을 직접 물어보세요.</dd>
<dt>약을 먹으면 평생 먹어야 하나요?</dt>
<dd>대개 좋아진 뒤 6~12개월 정도 유지하다 천천히 줄여요. 사람마다 달라 의사와 함께 정해요.</dd>
</dl>
