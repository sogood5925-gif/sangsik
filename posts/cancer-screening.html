  data-title="암 검진 총정리: 국가암검진 6가지의 대상·주기·방법, 결과지 읽고 다음 단계로, 증상은 검진을 기다리지 않기"
  data-thumb="6대 암|국가암검진"
  data-summary="국가암검진은 위암, 대장암, 간암, 유방암, 자궁경부암, 폐암을 증상이 없을 때 일찍 찾기 위한 제도예요. 암별 대상 나이와 주기, 검사 방법, 비용 구조, 대상 여부 확인과 예약 방법, 결과가 '이상'으로 나왔을 때 할 일, 검진 사이에 증상이 생기면 기다리지 말아야 하는 이유를 정리했어요."
  data-tags="암검진,국가암검진,대장내시경,유방촬영,건강상식">
<p class="lead">암은 일찍 발견할수록 치료가 쉽고 결과도 좋아요. 그런데 많은 암이 초기에는 아무 증상이 없어요. 그래서 나라에서는 흔하고 검진 효과가 확인된 여섯 가지 암에 대해 대상과 주기를 정해 검진을 지원해요. 올해 내가 어떤 검진 대상인지 한 번 확인해 보세요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>국가암검진은 <strong>위, 대장, 간, 유방, 자궁경부, 폐</strong> 여섯 가지 암이 대상이에요.</li>
<li>나이와 성별, 위험 요인에 따라 <strong>대상과 주기</strong>가 달라요.</li>
<li>비용은 <strong>무료이거나 일부만 본인이 부담</strong>하는 구조예요.</li>
<li>검진 결과가 정상이어도 <strong>증상이 생기면 바로 진료</strong>를 받아요.</li>
</ul></div>

<h2>국가암검진 한눈에</h2>
<div class="tbl"><table>
<thead><tr><th>암</th><th>대상</th><th>주기</th><th>검사 방법</th></tr></thead>
<tbody>
<tr><td>위암</td><td>40세 이상 남녀</td><td class="num">2년</td><td>위내시경(어려우면 위장조영검사)</td></tr>
<tr><td>대장암</td><td>50세 이상 남녀</td><td class="num">1년</td><td>분변잠혈검사 → 양성이면 대장내시경</td></tr>
<tr><td>간암</td><td>40세 이상 간암 고위험군(B형·C형간염 보유, 간경변 등)</td><td class="num">6개월</td><td>간 초음파 + 혈액 검사(알파태아단백)</td></tr>
<tr><td>유방암</td><td>40세 이상 여성</td><td class="num">2년</td><td>유방촬영술</td></tr>
<tr><td>자궁경부암</td><td>20세 이상 여성</td><td class="num">2년</td><td>자궁경부 세포검사</td></tr>
<tr><td>폐암</td><td>54~74세 고위험군(30갑년 이상 흡연력 현재 흡연자 등)</td><td class="num">2년</td><td>저선량 흉부 CT + 금연 상담</td></tr>
</tbody>
<caption>보건복지부·국립암센터 국가암검진 안내, 국민건강보험공단 자료를 바탕으로 정리. 세부 기준은 바뀔 수 있어요</caption></table></div>

<h2>비용과 신청</h2>
<ul>
<li>대부분 <strong>무료이거나 본인부담 10%</strong> 수준이에요. 의료급여 수급자와 건강보험료 하위 계층은 본인부담이 없어요. 자궁경부암·대장암 검진은 본인부담이 없어요.</li>
<li>대상 여부는 <strong>국민건강보험공단 누리집·앱</strong>이나 고객센터(1577-1000)에서 확인해요. 대상자에게 안내문이 발송돼요.</li>
<li>공단이 지정한 검진 기관에 예약하고, 신분증을 가져가요.</li>
<li>짝수·홀수 해 출생 연도 기준으로 대상이 정해지는 검진이 있어요. 해를 넘기면 다음 차례까지 기다려야 할 수 있어요.</li>
</ul>

<h2>검사 전 준비</h2>
<div class="tbl"><table>
<thead><tr><th>검사</th><th>준비</th></tr></thead>
<tbody>
<tr><td>위내시경</td><td>전날 저녁 가볍게 먹고 자정 이후 금식. 수면 내시경은 당일 운전 금지</td></tr>
<tr><td>분변잠혈검사</td><td>받은 용기에 대변을 조금 담아 제출. 치질 출혈이나 생리 중이면 결과에 영향</td></tr>
<tr><td>대장내시경</td><td>며칠 전부터 씨 있는 과일·잡곡 피하기, 전날 장 정결제 복용</td></tr>
<tr><td>유방촬영술</td><td>생리 1주 뒤쯤이 덜 아파요. 데오드란트·파우더는 바르지 않아요</td></tr>
<tr><td>자궁경부 세포검사</td><td>생리 중 피하기, 검사 1~2일 전 질 세정·성관계 피하기</td></tr>
<tr><td>공통</td><td>항응고제·당뇨약을 먹는다면 금식과 복용을 미리 병원과 상의</td></tr>
</tbody>
<caption>국립암센터, 대한소화기내시경학회 검진 준비 안내를 바탕으로 정리</caption></table></div>

<h2>결과지를 받았다면</h2>
<ul>
<li><strong>'이상 소견 없음'</strong>: 다음 주기에 다시 검진해요.</li>
<li><strong>'추가 검사 필요', '암 의심'</strong>: 대부분 암이 아니지만 <strong>미루지 말고</strong> 안내받은 검사를 받아요. 분변잠혈 양성이면 대장내시경, 유방촬영 이상이면 초음파나 조직검사를 해요.</li>
<li>용종, 결절, 치밀 유방 같은 소견은 권고된 추적 일정을 달력에 적어 둬요.</li>
<li>국가 검진에서 암이 확진되면 의료비 지원을 받을 수 있는 경우가 있어요. 보건소에 문의해요.</li>
</ul>

<div class="box warn"><span class="h">검진을 기다리지 말고 진료를 받아요</span>
<ul>
<li>이유 없는 <strong>체중 감소</strong>, 계속되는 피로</li>
<li>변에 피, 검은 변, 배변 습관이 갑자기 바뀜</li>
<li>삼키기 어려움, 계속되는 속쓰림과 명치 통증</li>
<li>유방이나 겨드랑이의 멍울, 유두 분비물</li>
<li>생리가 아닌 출혈, 폐경 뒤 출혈</li>
<li>3주 넘는 기침, 피 섞인 가래</li>
<li>황달, 소변이 콜라색</li>
</ul>
<p>검진은 증상이 없는 사람을 위한 거예요. 증상이 있다면 검진 주기와 상관없이 진료를 받아요.</p></div>

<h2>국가검진 외에 알아 둘 것</h2>
<ul>
<li><strong>가족력</strong>이 있으면 더 이른 나이부터, 더 자주 검사가 필요할 수 있어요. 예) 부모·형제가 젊은 나이에 대장암</li>
<li><strong>갑상선 초음파</strong>는 증상 없는 사람의 일상 검진으로 권하지 않는다는 권고가 있어요.</li>
<li><strong>전립선암 PSA 검사</strong>는 이점과 한계를 알고 의사와 결정해요.</li>
<li>비싼 전신 검사보다 <strong>나에게 맞는 검진을 제때</strong> 받는 것이 더 중요해요.</li>
</ul>

<div class="box"><span class="h">암 검진 체크리스트</span>
<ol>
<li>올해 내 검진 대상 확인</li>
<li>검진 기관 예약, 준비 사항 확인</li>
<li>결과지의 추가 검사 미루지 않기</li>
<li>추적 일정 달력에 적기</li>
<li>가족력 있으면 의사와 일정 상의</li>
<li>증상은 검진 기다리지 않고 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>대장내시경을 받았는데 분변잠혈검사도 해야 하나요?</dt>
<dd>최근 대장내시경에서 이상이 없었다면 의사가 권하는 간격(보통 몇 년)까지는 분변잠혈검사가 필요 없을 수 있어요. 결과지를 가지고 상의해요.</dd>
<dt>검진 대상 나이 전인데 받고 싶어요.</dt>
<dd>개인 비용으로 받을 수 있지만, 위험이 낮은 사람의 이른 검사는 이득보다 불필요한 추가 검사가 많을 수 있어요. 증상과 가족력을 기준으로 의사와 상의해요.</dd>
<dt>검진을 몇 년 빠뜨렸어요.</dt>
<dd>지금 대상이라면 바로 받으면 돼요. 빠뜨린 것을 걱정하기보다 오늘 예약하는 것이 중요해요.</dd>
</dl>
