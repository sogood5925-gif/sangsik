  data-title="자전거와 전동킥보드 안전: 안전모, 면허, 한 사람만 타기, 인도 주행 금지"
  data-thumb="1인|킥보드 승차 정원"
  data-summary="자전거와 전동킥보드는 가깝고 편한 이동 수단이지만, 넘어지면 머리를 다치기 쉬워요. 개인형 이동장치의 면허와 안전모 규정, 두 명이 타거나 인도로 달리면 안 되는 이유, 출발 전 점검, 야간 주행과 교차로에서 조심할 점을 정리했어요."
  data-tags="전동킥보드,자전거,안전모,개인형이동장치,생활정보">
<p class="lead">전동킥보드는 바퀴가 작고 무게 중심이 높아 작은 턱이나 구멍에도 쉽게 넘어져요. 자전거도 속도가 붙으면 부딪혔을 때 충격이 커요. 두 가지 모두 머리를 지키는 안전모와 기본 규칙이 사고를 크게 줄여요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>전동킥보드 등 개인형 이동장치는 <strong>원동기면허 이상</strong>이 있어야 타고, <strong>안전모는 필수</strong>예요.</li>
<li>개인형 이동장치는 <strong>한 사람만</strong> 타요. 두 명이 타면 균형을 잃기 쉬워요.</li>
<li><strong>인도로 달리지 않아요.</strong> 자전거도로나 차도 오른쪽 가장자리로 다녀요.</li>
<li>자전거도 안전모를 쓰고, 밤에는 <strong>앞등과 뒷등</strong>을 켜요.</li>
</ul></div>

<h2>개인형 이동장치 규칙</h2>
<div class="tbl"><table>
<thead><tr><th>규칙</th><th>내용</th></tr></thead>
<tbody>
<tr><td>면허</td><td>원동기장치자전거 면허 이상이 필요해요(만 16세 이상 취득 가능). 무면허 운전은 처벌받아요</td></tr>
<tr><td>안전모</td><td>운전자는 인명보호장구(안전모)를 반드시 써야 해요</td></tr>
<tr><td>승차 정원</td><td>전동킥보드는 1명이에요. 둘이 타면 위반이에요</td></tr>
<tr><td>통행 장소</td><td>자전거도로를 이용하고, 없으면 차도 오른쪽 가장자리로 다녀요. 인도 주행은 금지예요</td></tr>
<tr><td>음주</td><td>술을 마시고 타면 음주운전으로 처벌받아요</td></tr>
<tr><td>어린이</td><td>13세 미만 어린이가 운전하면 보호자에게 과태료가 부과돼요</td></tr>
</tbody>
<caption>「도로교통법」 개인형 이동장치 규정(2021년 개정)과 경찰청 안내를 바탕으로 정리. 범칙금 액수는 바뀔 수 있어요</caption></table></div>
<p>공유 킥보드를 빌릴 때도 면허 인증이 필요해요. 면허가 없는 청소년에게 계정을 빌려주는 것은 위험하고 법 위반이에요.</p>

<h2>왜 킥보드 사고가 잦을까</h2>
<ul>
<li>바퀴가 작아 <strong>보도블록 턱, 맨홀, 빗물 고인 곳</strong>에서 쉽게 걸려 넘어져요.</li>
<li>서서 타기 때문에 넘어지면 <strong>머리와 얼굴</strong>부터 땅에 닿기 쉬워요.</li>
<li>소리가 거의 나지 않아 보행자와 차가 다가오는 것을 알아채지 못해요.</li>
<li>두 명이 타면 무게 중심이 높아지고 브레이크 거리가 길어져요.</li>
</ul>

<h2>출발 전 점검</h2>
<div class="tbl"><table>
<thead><tr><th>점검</th><th>자전거</th><th>전동킥보드</th></tr></thead>
<tbody>
<tr><td>브레이크</td><td>앞뒤 브레이크를 잡아 바퀴가 확실히 서는지</td><td>브레이크 레버와 전자 브레이크 작동</td></tr>
<tr><td>타이어</td><td>공기압(손으로 눌러 단단한지), 찢어진 곳</td><td>공기압, 마모, 바퀴 흔들림</td></tr>
<tr><td>체인·접이부</td><td>체인이 헐겁지 않고 녹슬지 않았는지</td><td>접이식 잠금이 확실히 걸렸는지</td></tr>
<tr><td>등</td><td>앞 흰색 등, 뒤 붉은 등</td><td>앞등·뒷등 작동</td></tr>
<tr><td>배터리</td><td>(전기자전거) 잔량과 충전 상태</td><td>잔량, 외관 부풂·파손</td></tr>
</tbody></table></div>

<h2>안전모 제대로 쓰기</h2>
<ul>
<li>이마를 덮도록 <strong>눈썹 위 손가락 두 개</strong> 높이까지 내려 써요.</li>
<li>턱끈은 손가락 하나가 들어갈 정도로 조여요. 입을 크게 벌렸을 때 헬멧이 살짝 눌리는 느낌이면 잘 맞아요.</li>
<li>한 번 크게 부딪힌 헬멧은 겉이 멀쩡해도 속 충격 흡수재가 망가졌을 수 있어 바꿔요.</li>
<li>자전거도 도로교통법상 안전모 착용 의무가 있어요.</li>
</ul>

<h2>도로에서 지킬 것</h2>
<ul>
<li>차와 <strong>같은 방향</strong>으로 달려요. 역주행은 사고 위험이 크게 높아요.</li>
<li>교차로에서는 자동차 운전자와 <strong>눈을 맞추고</strong> 지나가요. 우회전하는 차의 사각지대를 조심해요.</li>
<li>횡단보도를 건널 때 자전거는 내려서 끌고 가요.</li>
<li>이어폰을 끼거나 휴대폰을 보면서 타지 않아요.</li>
<li>보행자가 많은 곳에서는 내려서 걸어요.</li>
<li>비 오는 날과 밤에는 속도를 줄이고, 밝은 옷을 입어요.</li>
</ul>

<div class="box warn"><span class="h">넘어진 뒤 조심할 신호</span>
<ul>
<li>의식을 잃었거나, 구토를 반복하거나, 두통이 점점 심해져요.</li>
<li>말이 어눌하거나 한쪽 팔다리에 힘이 빠져요.</li>
<li>목 통증과 팔다리 저림이 있어요.</li>
</ul>
<p>머리를 부딪혔다면 겉으로 멀쩡해도 몇 시간~하루 사이에 증상이 나타날 수 있어요. 이런 신호가 있으면 바로 응급실로 가요. 목을 다친 것 같으면 억지로 일으키지 말고 119를 불러요.</p></div>

<h2>세워 둘 때</h2>
<ul>
<li>공유 킥보드는 점자블록, 횡단보도 앞, 버스정류장, 지하철 출입구를 막지 않게 세워요. 시각장애인과 휠체어 이용자가 넘어질 수 있어요.</li>
<li>개인 킥보드·전기자전거는 현관이나 복도에서 충전하지 않아요(화재 시 대피로가 막혀요).</li>
</ul>

<h2>보험과 사고 처리</h2>
<p>개인형 이동장치로 보행자를 다치게 하면 큰 배상 책임이 생길 수 있어요. 공유 서비스는 보험 가입 범위를 확인하고, 개인 소유라면 개인형 이동장치 보장이 되는 보험이나 일상생활배상책임 특약을 확인해 두세요. 사고가 나면 다친 사람을 먼저 돌보고 112·119에 신고해요.</p>

<div class="box"><span class="h">출발 전 체크리스트</span>
<ol>
<li>면허 있는지(킥보드), 안전모 착용</li>
<li>브레이크·타이어·등 점검</li>
<li>킥보드는 혼자 타기</li>
<li>인도 말고 자전거도로·차도 가장자리</li>
<li>이어폰·휴대폰 보지 않기</li>
<li>술 마셨으면 타지 않기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>전기자전거도 면허가 필요한가요?</dt>
<dd>페달을 밟을 때만 모터가 돕는 방식(PAS)으로 기준 속도·무게 이하인 전기자전거는 자전거로 분류돼 면허가 필요 없어요. 손잡이만 돌려 달리는 방식(스로틀) 등은 개인형 이동장치나 원동기로 분류될 수 있어요. 구입할 때 분류를 확인해요.</dd>
<dt>킥보드로 인도를 천천히 가면 괜찮나요?</dt>
<dd>개인형 이동장치는 속도와 관계없이 인도 주행이 금지예요. 인도에서는 내려서 끌고 가요.</dd>
<dt>아이 자전거에도 안전모가 필요한가요?</dt>
<dd>네. 아이는 넘어질 때 머리를 먼저 부딪히기 쉬워요. 인라인스케이트, 킥보드(비전동)도 안전모와 보호대를 착용해요.</dd>
</dl>
