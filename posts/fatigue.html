  data-title="만성 피로: 쉬어도 풀리지 않는 피로, 먼저 확인할 원인들, 영양제보다 잠과 검사"
  data-thumb="6개월|만성 피로를 가르는 기간"
  data-summary="피곤한 날은 누구에게나 있지만, 몇 주에서 몇 달째 쉬어도 풀리지 않는 피로는 몸이 보내는 신호일 수 있어요. 피로의 흔한 원인인 수면·빈혈·갑상선·혈당·우울·약, 병원에서 받는 기본 검사, 활동 뒤 크게 악화되는 근육통성 뇌척수염/만성피로증후군, 피로를 줄이는 생활 습관, 바로 진료가 필요한 신호를 정리했어요."
  data-tags="만성피로,피로,빈혈,갑상선,건강상식">
<p class="lead">아침에 일어나도 개운하지 않고, 오후만 되면 몸이 천근만근이에요. 주말 내내 쉬었는데도 월요일이 버거워요. 피로는 너무 흔해서 '다들 그렇게 살지' 하고 넘기기 쉬워요. 하지만 한 달 넘게 이어지는 피로, 점점 심해지는 피로는 그냥 넘기지 말고 원인을 찾아볼 만해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>피로의 가장 흔한 원인은 <strong>수면 부족·수면 질환, 우울·불안, 생활 습관</strong>이에요.</li>
<li><strong>빈혈, 갑상선, 혈당, 비타민 B12·D</strong> 같은 몸의 원인은 간단한 혈액 검사로 확인할 수 있어요.</li>
<li>활동 뒤 며칠씩 크게 악화되는 피로가 <strong>6개월 이상</strong>이면 만성피로증후군을 생각해요.</li>
<li>피로 회복제나 영양제보다 <strong>원인 확인</strong>이 먼저예요.</li>
</ul></div>

<h2>피로의 흔한 원인</h2>
<div class="tbl"><table>
<thead><tr><th>분류</th><th>원인</th><th>함께 나타나는 신호</th></tr></thead>
<tbody>
<tr><td>수면</td><td>수면 부족, 불규칙한 생활, 수면무호흡증, 하지불안</td><td>코골이·숨 멈춤, 낮 졸음</td></tr>
<tr><td>마음</td><td>우울, 불안, 번아웃</td><td>의욕 저하, 흥미 상실, 잠 변화</td></tr>
<tr><td>혈액</td><td>철 결핍 빈혈, 비타민 B12 결핍</td><td>숨참, 어지러움, 창백함, 손발 저림</td></tr>
<tr><td>호르몬</td><td>갑상선 기능 저하증, 당뇨</td><td>추위 탐·체중 증가·변비 / 갈증·잦은 소변</td></tr>
<tr><td>장기 기능</td><td>간질환, 콩팥병, 심부전</td><td>황달, 부기, 숨참</td></tr>
<tr><td>감염 후</td><td>독감·코로나19 등 바이러스 감염 뒤</td><td>몇 주~몇 달 이어질 수 있어요</td></tr>
<tr><td>약·습관</td><td>수면제, 항히스타민제, 일부 혈압약, 술, 카페인 과다, 운동 부족</td><td>약을 바꾼 뒤 시작된 피로</td></tr>
</tbody>
<caption>대한가정의학회, 영국 국립보건임상연구원(NICE) Clinical Knowledge Summaries: Tiredness/fatigue in adults를 바탕으로 정리</caption></table></div>

<h2>병원에서 받는 기본 검사</h2>
<ul>
<li>혈색소와 철분(페리틴), 비타민 B12</li>
<li>갑상선 기능(TSH)</li>
<li>공복 혈당·당화혈색소</li>
<li>간 기능, 콩팥 기능, 염증 수치</li>
<li>필요하면 비타민 D, 소변 검사, 수면다원검사</li>
</ul>
<p>진료 전에 <strong>언제부터, 하루 중 언제 심한지, 잠·식사·기분·체중 변화, 먹는 약</strong>을 적어 가면 원인을 찾는 데 큰 도움이 돼요.</p>

<div class="box warn"><span class="h">바로 진료가 필요한 피로</span>
<ul>
<li>이유 없는 <strong>체중 감소</strong>, 밤에 흠뻑 젖는 땀, 계속되는 열</li>
<li><strong>숨참, 가슴 통증</strong>, 조금만 움직여도 심하게 숨이 차요.</li>
<li>검은 변이나 혈변, 생리량이 갑자기 많아짐</li>
<li>림프절이 커지거나 멍이 잘 들어요.</li>
<li>기분이 크게 가라앉고 <strong>죽고 싶다는 생각</strong>이 들어요. 자살예방 상담전화 109</li>
</ul></div>

<h2>근육통성 뇌척수염/만성피로증후군</h2>
<p>검사에서 뚜렷한 원인이 없는데 일상생활을 크게 줄여야 할 만큼의 피로가 <strong>6개월 이상</strong> 이어지고, 특히 <strong>조금 무리한 뒤 하루~며칠 늦게 증상이 크게 악화</strong>(활동 후 악화)된다면 이 병을 생각해요. 잠을 자도 개운하지 않고, 집중력·기억력 저하, 일어설 때 어지러움이 흔해요.</p>
<ul>
<li>게으름이나 마음가짐 문제가 아니라 실제 질환이에요.</li>
<li>무리하게 운동량을 늘리면 오히려 악화될 수 있어요. 에너지 한계 안에서 활동을 조절하는 <strong>'페이싱'</strong>이 중요해요.</li>
<li>잠, 통증, 기립 어지럼 등 증상별 치료를 받아요.</li>
</ul>

<h2>피로를 줄이는 생활</h2>
<div class="tbl"><table>
<thead><tr><th>영역</th><th>실천</th></tr></thead>
<tbody>
<tr><td>잠</td><td>매일 같은 시각에 일어나기, 7시간 안팎, 침대에서 휴대폰 멀리</td></tr>
<tr><td>움직임</td><td>하루 10분 걷기부터. 원인 모를 만성피로가 아니라면 규칙적인 운동이 피로를 줄여요</td></tr>
<tr><td>식사</td><td>끼니 거르지 않기, 단백질·채소 챙기기, 단 음식으로 버티지 않기</td></tr>
<tr><td>카페인·술</td><td>오후 카페인과 저녁 술 줄이기. 둘 다 잠의 질을 떨어뜨려요</td></tr>
<tr><td>쉼</td><td>일 중간 짧은 휴식, 일과 쉼의 경계 만들기</td></tr>
</tbody>
<caption>대한가정의학회, 미국 질병통제예방센터(CDC) ME/CFS 자료를 바탕으로 정리</caption></table></div>

<div class="box"><span class="h">피로 점검 체크리스트</span>
<ol>
<li>피로 일지(시작·시간대·잠·기분) 쓰기</li>
<li>기본 혈액 검사 받기</li>
<li>코골이·숨 멈춤 확인</li>
<li>최근 바꾼 약 점검</li>
<li>하루 10분 걷기부터</li>
<li>체중 감소·숨참은 바로 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>피로 회복제나 비타민 주사를 맞으면 좋아지나요?</dt>
<dd>부족한 영양소가 있다면 도움이 되지만, 원인이 다르면 잠깐 기분만 좋을 수 있어요. 카페인이 든 드링크는 잠을 방해해 피로를 키우기도 해요.</dd>
<dt>간 때문에 피곤한 건가요?</dt>
<dd>간질환이 피로를 일으키기도 하지만, 피로의 원인은 훨씬 다양해요. 혈액 검사로 간 수치를 확인해 보면 알 수 있어요.</dd>
<dt>검사가 다 정상인데 계속 피곤해요.</dt>
<dd>잠의 질, 스트레스, 기분, 생활 습관을 함께 살펴봐요. 수면 검사나 정신건강 상담이 도움이 될 수 있어요.</dd>
</dl>
