  data-title="폐암과 저선량 CT: 국가검진 대상인 '30갑년', 담배를 피우지 않아도 생기는 폐암, 결절이 보였을 때"
  data-thumb="30갑년|국가 폐암검진 기준"
  data-summary="폐암은 우리나라 암 사망 원인 1위이고, 증상이 나타났을 때는 이미 진행된 경우가 많아요. 흡연과 비흡연 폐암의 위험 요인, 국가 폐암검진 대상과 저선량 CT의 장점과 한계, 결절이 보였을 때의 뜻, 놓치지 말아야 할 증상, 수술·표적·면역 치료 흐름, 금연의 효과를 정리했어요."
  data-tags="폐암,저선량CT,폐결절,금연,질병">
<p class="lead">폐는 아픔을 잘 느끼지 못하는 장기라서, 폐암은 기침이나 숨참이 생겼을 때 이미 진행된 경우가 많아요. 그래서 위험이 높은 사람은 증상이 없을 때 저선량 CT로 미리 찾는 것이 중요해요. 한편 담배를 피운 적 없는 사람, 특히 여성의 폐암도 적지 않아요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>폐암의 가장 큰 원인은 <strong>흡연</strong>이지만, <strong>비흡연자 폐암</strong>도 늘고 있어요.</li>
<li>국가 폐암검진은 <strong>54~74세, 30갑년 이상 흡연한 현재 흡연자</strong> 등이 <strong>2년마다 저선량 CT</strong>를 받아요.</li>
<li>CT에서 보이는 <strong>폐결절 대부분은 암이 아니에요.</strong> 크기와 모양에 따라 추적해요.</li>
<li><strong>금연</strong>은 나이와 상관없이 폐암 위험을 줄여요.</li>
</ul></div>

<h2>위험 요인</h2>
<div class="tbl"><table>
<thead><tr><th>요인</th><th>설명</th></tr></thead>
<tbody>
<tr><td>흡연</td><td>피운 양과 기간이 길수록 위험이 커져요. 전자담배도 안전하다고 할 수 없어요</td></tr>
<tr><td>간접흡연</td><td>함께 사는 가족의 흡연</td></tr>
<tr><td>라돈</td><td>흡연 다음가는 원인으로 꼽혀요. 환기가 부족한 저층·지하 공간</td></tr>
<tr><td>직업 노출</td><td>석면, 디젤 배기가스, 일부 금속, 조리 과정의 연기(급식 종사자 등)</td></tr>
<tr><td>대기오염</td><td>초미세먼지에 오래 노출</td></tr>
<tr><td>가족력, 폐 질환</td><td>가족 중 폐암 환자, 만성폐쇄성폐질환, 폐섬유증</td></tr>
</tbody>
<caption>국가암정보센터, 국제암연구소(IARC) 발암 요인 분류를 바탕으로 정리</caption></table></div>

<h2>국가 폐암검진</h2>
<ul>
<li><strong>대상:</strong> 만 54~74세 중 <strong>30갑년 이상</strong> 흡연력이 있는 <strong>현재 흡연자</strong> 등 폐암 고위험군. 세부 기준은 국민건강보험공단 안내를 확인해요.</li>
<li><strong>갑년:</strong> 하루 피운 갑 수 × 피운 햇수. 하루 1갑씩 30년, 하루 2갑씩 15년이면 30갑년이에요.</li>
<li><strong>방법:</strong> 2년마다 저선량 흉부 CT, 그리고 <strong>금연 상담</strong>을 함께 받아요.</li>
<li>대상이 아니더라도 흡연력이 많거나 가족력이 있다면 의사와 검사 여부를 상의해요.</li>
</ul>

<h2>저선량 CT의 장점과 한계</h2>
<div class="tbl"><table>
<thead><tr><th>장점</th><th>한계</th></tr></thead>
<tbody>
<tr><td>일반 CT보다 방사선량이 적어요</td><td>그래도 방사선 노출이 있어 대상이 아니면 매년 찍을 필요는 없어요</td></tr>
<tr><td>흉부 엑스레이로 안 보이는 작은 암을 찾을 수 있어요</td><td>암이 아닌 결절도 많이 보여 추가 검사와 불안이 생길 수 있어요</td></tr>
<tr><td>고위험군에서 폐암 사망을 줄였다는 대규모 연구가 있어요</td><td>모든 폐암을 찾지는 못해요</td></tr>
</tbody>
<caption>미국 국가폐검진연구(NLST, 2011), 국립암센터 폐암 검진 권고안을 바탕으로 정리</caption></table></div>

<h2>결절이 보였다면</h2>
<p>폐결절은 폐 속의 작은 덩어리로, 예전 염증 흔적이나 양성 혹인 경우가 대부분이에요. 크기, 모양, 속이 찬 정도에 따라 <strong>몇 달 뒤 CT로 변화를 지켜보거나</strong>, PET-CT·조직검사를 해요. 간유리 음영처럼 천천히 자라는 결절은 몇 년에 걸쳐 추적하기도 해요. 결과지의 권고 일정대로 추적 검사를 빠뜨리지 않는 것이 중요해요.</p>

<div class="box warn"><span class="h">이런 증상은 검진을 기다리지 말고 진료</span>
<ul>
<li><strong>3주 넘게</strong> 이어지는 기침, 평소와 달라진 기침</li>
<li><strong>피 섞인 가래</strong>(객혈)</li>
<li>숨참, 쌕쌕거림, 가슴 통증</li>
<li>쉰 목소리가 몇 주 이상 이어짐</li>
<li>이유 없는 체중 감소, 반복되는 폐렴</li>
</ul></div>

<h2>치료의 흐름</h2>
<ul>
<li><strong>초기:</strong> 수술로 암이 있는 부분을 떼어 내요. 수술이 어려우면 정밀 방사선 치료를 해요.</li>
<li><strong>진행된 경우:</strong> 조직의 <strong>유전자 변이 검사</strong>(EGFR, ALK 등)를 해서 맞는 <strong>표적 치료제</strong>를 쓰거나, <strong>면역항암제</strong>, 항암 화학요법을 써요. 비흡연 아시아인 폐선암에서 EGFR 변이가 비교적 흔해요.</li>
<li>치료가 빠르게 발전하고 있어, 진행된 폐암도 오래 조절하는 사람이 늘고 있어요.</li>
</ul>

<h2>금연은 언제 해도 이득이에요</h2>
<p>금연하면 폐암 위험이 해가 갈수록 줄어요. 10~15년이 지나면 계속 피운 사람보다 크게 낮아져요. 폐암 진단 뒤에도 금연하면 치료 효과가 좋아지고 합병증이 줄어요. 보건소 금연클리닉과 금연 상담전화(1544-9030)를 이용할 수 있어요.</p>

<h2>비흡연자가 할 수 있는 것</h2>
<ul>
<li>집의 <strong>라돈</strong> 농도를 확인하고 자주 환기해요.</li>
<li>요리할 때 <strong>주방 후드</strong>를 켜고 창문을 열어요.</li>
<li>간접흡연을 피하고, 직업상 노출이 있다면 보호구를 써요.</li>
<li>가족력이 있다면 검진 여부를 의사와 상의해요.</li>
</ul>

<div class="box"><span class="h">폐 건강 체크리스트</span>
<ol>
<li>내 갑년 계산해 보기</li>
<li>대상이면 2년마다 저선량 CT</li>
<li>결절은 권고 일정대로 추적</li>
<li>3주 넘는 기침·객혈은 진료</li>
<li>오늘 금연 시작, 금연클리닉 활용</li>
<li>라돈 확인, 조리 때 후드와 환기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>담배를 끊은 지 오래됐는데 검진 대상인가요?</dt>
<dd>국가검진 기준은 바뀔 수 있고 세부 조건이 있어요. 국민건강보험공단에 확인하고, 대상이 아니어도 흡연력이 많다면 의사와 상의해요.</dd>
<dt>흉부 엑스레이가 정상이면 괜찮나요?</dt>
<dd>엑스레이는 작은 폐암을 놓칠 수 있어요. 고위험군이라면 저선량 CT가 권장돼요.</dd>
<dt>전자담배로 바꾸면 폐암 위험이 줄어드나요?</dt>
<dd>전자담배도 해로운 물질이 들어 있어 안전하다고 할 수 없어요. 완전히 끊는 것이 목표예요.</dd>
</dl>
