<p class="lead">같은 80세라도 혼자 시장을 보고 텃밭을 가꾸는 분이 있고, 몇 걸음만 걸어도 지쳐 주저앉는 분이 있어요. 이 차이를 만드는 것이 '노쇠'예요. 노쇠는 병 이름이라기보다 몸의 예비력이 줄어든 상태인데, 좋은 소식은 <strong>일찍 알아채면 늦추고, 일부는 되돌릴 수 있다</strong>는 거예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>노쇠는 <strong>체중 감소, 피로, 근력 저하, 느린 걸음, 활동 감소</strong>가 함께 오는 상태예요.</li>
<li>노쇠하면 감기, 넘어짐, 수술 같은 작은 일에도 <strong>입원, 장기 요양</strong>으로 이어지기 쉬워요.</li>
<li><strong>근력 운동과 충분한 단백질</strong>이 가장 효과적인 예방·회복 방법이에요.</li>
<li>먹는 약이 많다면 <strong>약 정리</strong>만으로도 기운과 넘어짐이 좋아질 수 있어요.</li>
</ul></div>

<h2>노쇠란</h2>
<p>나이가 들면 근육, 뼈, 심장, 폐, 면역 같은 여러 기관의 여유분(예비력)이 조금씩 줄어요. 여유분이 많이 줄면 평소에는 괜찮다가도 감기, 설사, 넘어짐 같은 작은 스트레스에 크게 무너져요. 이를 노쇠라고 해요. 노쇠 이전 단계(노쇠 전 단계)에서 발견하면 되돌리기가 훨씬 쉬워요.</p>

<h2>5가지 질문으로 점검하기</h2>
<div class="tbl"><table>
<thead><tr><th>질문</th><th>예 / 아니오</th></tr></thead>
<tbody>
<tr><td>지난 한 달 동안 대부분의 시간에 피곤했나요?</td><td>□ / □</td></tr>
<tr><td>도움 없이 쉬지 않고 계단 10개(한 층)를 오르기 어렵나요?</td><td>□ / □</td></tr>
<tr><td>도움 없이 300m(한 블록 정도)를 걷기 어렵나요?</td><td>□ / □</td></tr>
<tr><td>의사에게 진단받은 병이 5가지 이상인가요?</td><td>□ / □</td></tr>
<tr><td>지난 1년 동안 체중이 5% 이상 줄었나요?</td><td>□ / □</td></tr>
</tbody>
<caption>한국형 노쇠 척도(K-FRAIL)를 바탕으로 정리. '예'가 1~2개면 노쇠 전 단계, 3개 이상이면 노쇠 가능성이 높아요</caption></table></div>
<p>국가건강검진의 노인신체기능검사(일정 나이에 하는 '일어나 걷기' 검사 등)도 노쇠를 찾는 데 도움이 돼요. 결과를 꼭 확인하세요.</p>

<h2>노쇠가 불러오는 일</h2>
<ul>
<li><strong>낙상과 골절:</strong> 근력과 균형이 떨어져 넘어지기 쉬워요.</li>
<li><strong>입원과 회복 지연:</strong> 입원하면 며칠 누워 있는 사이 근육이 더 빠져요.</li>
<li><strong>일상 기능 저하:</strong> 목욕, 옷 입기, 장보기에 도움이 필요해져요.</li>
<li><strong>인지 저하, 우울</strong></li>
</ul>
<p>노쇠는 이런 일이 서로를 악화시키는 악순환을 만들어요. 그래서 한 가지라도 일찍 끊어 주는 것이 중요해요.</p>

<h2>노쇠를 늦추고 되돌리는 방법</h2>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>요령</th></tr></thead>
<tbody>
<tr><td>근력 운동</td><td>의자에서 일어나기, 벽 밀기, 밴드 운동, 까치발 들기를 주 2~3회. 가장 효과가 확인된 방법이에요</td></tr>
<tr><td>균형 운동</td><td>한 발 서기(벽이나 의자 잡고), 태극권. 넘어짐을 줄여요</td></tr>
<tr><td>걷기</td><td>하루 조금씩 늘려요. 쉬어 가며 걸어도 괜찮아요</td></tr>
<tr><td>단백질</td><td>끼니마다 달걀, 두부, 생선, 고기, 우유 중 하나. 어르신은 체중 1kg당 하루 1.0~1.2g을 권하는 전문가 의견이 많아요(콩팥병이 있다면 의사와 상의)</td></tr>
<tr><td>비타민 D</td><td>부족하면 근력과 뼈에 불리해요. 검사 후 보충을 상의해요</td></tr>
<tr><td>약 정리</td><td>5가지 이상 먹는다면 중복되거나 어지럼·졸림을 일으키는 약이 없는지 점검해요</td></tr>
<tr><td>구강·청력·시력</td><td>씹기 어려우면 영양이 떨어지고, 잘 안 들리면 외출과 대화가 줄어요</td></tr>
<tr><td>사회 활동</td><td>복지관, 경로당, 모임, 봉사로 몸과 마음을 함께 움직여요</td></tr>
</tbody>
<caption>대한노인병학회 노쇠 진료 권고, 세계노쇠학회(ICFSR) 임상 지침(2019)을 바탕으로 정리</caption></table></div>

<h2>잘 먹는 요령</h2>
<ul>
<li>입맛이 없다면 양을 줄이고 <strong>하루 4~5번</strong> 나눠 먹어요.</li>
<li>밥만 먹기보다 <strong>반찬의 단백질</strong>을 먼저 챙겨요.</li>
<li>씹기 어렵다면 두부, 달걀찜, 생선살, 다진 고기, 요구르트처럼 부드러운 단백질을 골라요.</li>
<li>혼자 먹으면 대충 먹기 쉬워요. 가능하면 함께 먹을 기회를 만들어요.</li>
<li>체중이 계속 줄면 원인(우울, 치아, 삼킴, 숨은 질환)을 확인해요.</li>
</ul>

<div class="box warn"><span class="h">진료가 필요한 신호</span>
<ul>
<li>몇 달 사이 이유 없이 체중이 크게 줄었어요.</li>
<li>최근 여러 번 넘어졌거나, 넘어질까 두려워 외출을 피해요.</li>
<li>기운이 없고 잠만 자며 식사량이 크게 줄었어요.</li>
<li>약을 먹은 뒤 어지럽거나 멍해졌어요.</li>
</ul>
<p>노인병 전문 진료(노인의학과, 가정의학과)나 보건소의 노인 건강 프로그램에서 종합적인 평가를 받을 수 있어요.</p></div>

<div class="box"><span class="h">노쇠 예방 체크리스트</span>
<ol>
<li>5가지 질문으로 자가 점검</li>
<li>근력·균형 운동 주 2~3회</li>
<li>끼니마다 단백질 반찬</li>
<li>먹는 약 목록 들고 약 점검</li>
<li>치아·청력·시력 확인</li>
<li>매주 사람 만나는 일정 만들기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>80대에 근력 운동을 시작해도 효과가 있나요?</dt>
<dd>네. 90대 노인에게서도 몇 주의 근력 운동으로 근력과 걷는 속도가 좋아졌다는 연구가 있어요. 가벼운 강도에서 시작해 조금씩 늘리면 돼요.</dd>
<dt>단백질 보충제를 먹어야 하나요?</dt>
<dd>식사로 충분히 먹기 어렵다면 도움이 될 수 있어요. 다만 운동 없이 보충제만으로는 근육이 크게 늘지 않아요. 콩팥 기능이 떨어졌다면 먼저 상의해요.</dd>
<dt>노쇠는 나이 들면 누구나 생기나요?</dt>
<dd>나이가 들수록 흔해지지만 모두에게 생기지는 않아요. 활동적인 생활과 영양, 질병 관리로 많이 늦출 수 있어요.</dd>
</dl>
