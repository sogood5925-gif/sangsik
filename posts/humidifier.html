  data-title="가습기 관리와 적정 습도: 40~60%, 매일 물 갈기, 살균제는 절대 넣지 않기"
  data-thumb="40~60%|실내 적정 습도"
  data-summary="겨울 실내가 건조하면 목과 피부가 먼저 불편해져요. 가습기 종류별 장단점, 물은 수돗물과 정수기 물 중 무엇이 좋은지, 매일·매주 청소법, 가습기에 살균제나 향료를 넣으면 안 되는 이유, 습도가 너무 높을 때 생기는 문제를 정리했어요."
  data-tags="가습기,습도,곰팡이,겨울철건강,생활정보">
<p class="lead">가습기는 잘 쓰면 겨울의 건조함을 덜어 주지만, 관리하지 않으면 물통 속 세균과 곰팡이를 공기 중으로 뿜어 내는 기계가 돼요. 핵심은 적당한 습도와 매일의 물 관리예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>실내 습도는 <strong>40~60%</strong>를 목표로 해요. 습도계를 두면 쉬워요.</li>
<li>물은 <strong>매일 새로 갈고</strong>, 남은 물은 버리고 물통을 말려요.</li>
<li>가습기 물에 <strong>살균제, 소독제, 향료, 아로마 오일을 넣지 않아요.</strong></li>
<li>60%를 넘는 습도가 계속되면 곰팡이와 집먼지진드기가 늘어요.</li>
</ul></div>

<h2>습도는 얼마가 좋을까</h2>
<p>겨울 난방을 하면 실내 습도가 20~30%까지 떨어지기도 해요. 너무 건조하면 코와 목 점막이 마르고 피부가 가려워져요. 반대로 너무 습하면 결로, 곰팡이, 집먼지진드기가 늘어요.</p>
<ul>
<li>일반적으로 <strong>40~60%</strong>를 권해요.</li>
<li>집먼지진드기 알레르기가 있다면 <strong>50% 안팎</strong>으로 조금 낮게 유지해요.</li>
<li>창문에 물방울이 맺히기 시작하면 습도가 높다는 신호예요.</li>
</ul>

<h2>가습기 종류별 특징</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>원리</th><th>좋은 점</th><th>주의할 점</th></tr></thead>
<tbody>
<tr><td>초음파식</td><td>진동으로 물을 잘게 쪼개 뿜어요</td><td>조용하고 전기를 적게 써요</td><td>물속 세균·미네랄도 함께 뿜어요. 매일 세척이 가장 중요해요</td></tr>
<tr><td>가열식</td><td>물을 끓여 수증기를 내요</td><td>끓이면서 세균이 줄어요</td><td>뜨거운 김과 물에 화상 위험, 전기를 많이 써요</td></tr>
<tr><td>자연기화식</td><td>젖은 필터에 바람을 불어 증발시켜요</td><td>과가습이 적고 입자가 작아요</td><td>필터에 곰팡이가 생기기 쉬워 필터 관리가 필요해요</td></tr>
<tr><td>복합식</td><td>물을 데운 뒤 초음파로 뿜어요</td><td>초음파식보다 세균 걱정이 적어요</td><td>제품마다 온도가 달라요. 세척은 똑같이 필요해요</td></tr>
</tbody></table></div>
<p>아이가 있는 집에서 가열식을 쓴다면 손이 닿지 않는 높은 곳에 두고, 넘어지지 않게 고정해요.</p>

<h2>수돗물? 정수기 물?</h2>
<ul>
<li><strong>수돗물</strong>에는 세균 번식을 늦추는 잔류 염소가 있어요. 다만 초음파식은 물속 미네랄이 하얀 가루로 가구에 앉을 수 있어요.</li>
<li><strong>정수기 물, 끓여 식힌 물</strong>은 미네랄이 적지만 염소가 없어 세균이 더 빨리 자랄 수 있어요.</li>
<li>어떤 물을 쓰든 <strong>매일 갈고 매일 헹구는 것</strong>이 더 중요해요. 제품 설명서에 권장하는 물이 있다면 그것을 따라요.</li>
</ul>

<div class="box warn"><span class="h">가습기에 넣으면 안 되는 것</span>
<p>국내에서는 가습기 물에 넣는 살균제 때문에 많은 사람이 폐 손상으로 숨지거나 다친 <strong>가습기살균제 참사</strong>가 있었어요. 물에 넣은 화학물질은 아주 작은 입자가 되어 폐 깊숙이 들어가요.</p>
<ul>
<li>살균제, 소독제, 락스</li>
<li>향료, 아로마 오일(전용 제품이 아닌 경우)</li>
<li>식초, 구연산 같은 세척제를 넣은 채 가동하기</li>
</ul>
<p>세척제는 청소할 때만 쓰고, 깨끗한 물로 여러 번 헹군 뒤 가동해요.</p></div>

<h2>청소 주기</h2>
<div class="tbl"><table>
<thead><tr><th>주기</th><th>할 일</th></tr></thead>
<tbody>
<tr><td>매일</td><td>남은 물 버리기 → 물통 헹구기 → 뚜껑 열어 말리기 → 새 물 채우기</td></tr>
<tr><td>2~3일마다</td><td>물통 안쪽과 진동판·수조를 부드러운 솔로 닦기</td></tr>
<tr><td>일주일마다</td><td>물때가 끼면 구연산이나 식초를 푼 물로 불린 뒤 닦고 여러 번 헹구기</td></tr>
<tr><td>시즌이 끝나면</td><td>완전히 분해해 씻고 바짝 말려 보관. 기화식은 필터 교체</td></tr>
</tbody>
<caption>한국소비자원·환경부 가습기 관리 안내와 일반적인 제조사 권장 사항을 바탕으로 정리. 제품 설명서를 먼저 따라요</caption></table></div>
<p>물통 입구가 좁아 속까지 손이 안 들어가는 제품은 청소가 어려워요. 새로 산다면 <strong>분해와 세척이 쉬운 구조</strong>인지 먼저 보세요.</p>

<h2>두는 위치</h2>
<ul>
<li>사람 얼굴을 향하지 않게, <strong>1.5~2m 이상</strong> 떨어뜨려 둬요.</li>
<li>바닥보다는 탁자 위처럼 조금 높은 곳에 두면 수증기가 고루 퍼져요.</li>
<li>벽, 커튼, 가구, 전자제품 바로 앞은 피해요. 그곳에 물기가 맺혀 곰팡이가 생겨요.</li>
<li>잠잘 때 밤새 틀어 둔다면 습도가 60%를 넘지 않는지 확인해요.</li>
</ul>

<h2>가습기 없이 습도 올리기</h2>
<ul>
<li>젖은 빨래를 실내에 널어요.</li>
<li>화분을 두거나 물을 담은 그릇을 난방기 근처에 둬요.</li>
<li>샤워 후 욕실 문을 잠깐 열어 둬요(곰팡이가 잘 생기는 집은 제외).</li>
<li>물을 자주 마시고, 코가 마르면 식염수 스프레이를 써요.</li>
</ul>

<h2>습도가 너무 높을 때</h2>
<p>습도가 계속 60%를 넘으면 벽 모서리와 창틀에 결로가 생기고, 곰팡이와 집먼지진드기가 늘어 천식과 비염을 악화시킬 수 있어요. 가습기를 끄고 하루 두세 번, 10분 정도 맞바람 환기를 해요.</p>

<div class="box"><span class="h">가습기 체크리스트</span>
<ol>
<li>습도계 두고 40~60% 유지</li>
<li>매일 물 버리고 헹궈 새 물 채우기</li>
<li>살균제·향료는 절대 넣지 않기</li>
<li>얼굴에서 1.5~2m 떨어뜨리기</li>
<li>창문 결로 생기면 가습 줄이고 환기</li>
<li>시즌 끝나면 완전히 말려 보관</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>가습기를 쓰면 감기에 덜 걸리나요?</dt>
<dd>적당한 습도는 코와 목 점막이 마르지 않게 해 불편함을 줄여 줘요. 일부 연구에서는 습도가 너무 낮을 때 독감 바이러스가 공기 중에서 더 오래 살아남는다고 해요. 하지만 손 씻기와 예방접종을 대신하지는 못해요.</dd>
<dt>하얀 가루가 가구에 쌓여요.</dt>
<dd>초음파식 가습기가 물속 미네랄을 함께 뿜어서 생기는 거예요. 미네랄이 적은 물을 쓰거나 다른 방식의 가습기를 고려해요. 가루가 많이 날리면 호흡기가 예민한 사람에게 자극이 될 수 있어요.</dd>
<dt>물통에 분홍색이나 검은 얼룩이 생겼어요.</dt>
<dd>세균이나 곰팡이가 자란 흔적이에요. 사용을 멈추고 완전히 분해해 닦은 뒤, 매일 물을 갈고 말리는 습관을 들여요.</dd>
</dl>
