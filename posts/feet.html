  data-title="발 건강과 신발: 무지외반증·내성발톱·무좀 관리, 당뇨가 있다면 매일 발 보기"
  data-thumb="오후|신발 사기 좋은 시간"
  data-summary="발은 하루 수천 걸음을 받치지만 아프기 전에는 잘 들여다보지 않게 돼요. 무지외반증, 굳은살과 티눈, 내성발톱, 무좀처럼 흔한 발 문제의 원인과 관리, 발톱 바르게 깎는 법, 발에 맞는 신발 고르는 법, 당뇨가 있는 사람이 매일 발을 살펴야 하는 이유를 정리했어요."
  data-tags="발건강,무지외반증,내성발톱,무좀,건강상식">
<p class="lead">발이 불편하면 걸음이 줄고, 걸음이 줄면 몸 전체가 약해져요. 발 건강의 상당 부분은 <strong>맞는 신발, 바르게 깎은 발톱, 마른 발</strong>에서 시작해요. 당뇨가 있다면 작은 상처 하나가 큰 문제로 커질 수 있어 매일 살피는 습관이 특히 중요해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>신발은 발이 부은 <strong>오후에</strong>, 양발을 신어 보고, 앞쪽에 <strong>엄지손가락 너비</strong> 여유가 있게 골라요.</li>
<li>발톱은 <strong>일자로</strong> 깎고 모서리를 너무 깊게 파지 않아요. 내성발톱을 막아요.</li>
<li>무좀은 <strong>습기</strong>를 좋아해요. 발가락 사이까지 말리고, 치료는 끝까지 해요.</li>
<li><strong>당뇨</strong>가 있으면 매일 발을 살피고, 상처나 색 변화가 있으면 바로 진료를 받아요.</li>
</ul></div>

<h2>흔한 발 문제</h2>
<div class="tbl"><table>
<thead><tr><th>문제</th><th>원인</th><th>관리</th></tr></thead>
<tbody>
<tr><td>무지외반증</td><td>엄지발가락이 새끼발가락 쪽으로 휘어요. 유전, 앞이 좁고 굽 높은 신발</td><td>앞볼 넓은 신발, 발가락 교정기·패드로 통증 완화. 통증과 변형이 심하면 수술</td></tr>
<tr><td>굳은살, 티눈</td><td>한 곳에 반복되는 압력과 마찰</td><td>맞는 신발, 쿠션 패드. 스스로 칼로 깎지 않아요(특히 당뇨)</td></tr>
<tr><td>내성발톱</td><td>발톱을 둥글게 깊이 깎음, 꽉 끼는 신발</td><td>일자로 깎기, 발톱 모서리 아래 솜 끼우기. 곪으면 진료</td></tr>
<tr><td>발 무좀</td><td>곰팡이. 습하고 땀 찬 환경</td><td>잘 말리기, 항진균제 연고를 증상이 사라진 뒤에도 1~2주 더</td></tr>
<tr><td>발톱 무좀</td><td>곰팡이가 발톱 속까지 들어감</td><td>먹는 약이나 바르는 약을 몇 달 이상. 진단 후 치료</td></tr>
<tr><td>족저근막염</td><td>뒤꿈치 쪽 족저근막의 반복된 부담</td><td>스트레칭, 쿠션 신발(따로 정리한 글 참고)</td></tr>
</tbody>
<caption>대한족부족관절학회, 대한피부과학회 건강 정보를 바탕으로 정리</caption></table></div>

<h2>발톱 바르게 깎기</h2>
<ol>
<li>샤워 후 발톱이 부드러울 때 깎아요.</li>
<li>발톱을 <strong>일자로</strong> 깎고, 발가락 끝과 비슷한 길이로 남겨요.</li>
<li>양쪽 모서리를 둥글게 깊이 파내지 않아요. 파낸 자리에 발톱이 살을 파고들며 자라요.</li>
<li>날카로운 모서리는 줄로 살짝 다듬어요.</li>
<li>시력이 나쁘거나 손이 떨리거나 당뇨가 있다면 가족의 도움이나 진료를 받아요.</li>
</ol>

<h2>무좀 관리</h2>
<ul>
<li>씻은 뒤 <strong>발가락 사이</strong>까지 수건으로 말리고, 필요하면 드라이어의 찬바람을 써요.</li>
<li>땀이 잘 흡수되는 양말을 신고, 땀이 차면 갈아 신어요.</li>
<li>신발은 하루 신었으면 하루 쉬게 번갈아 신어요.</li>
<li>공용 샤워실, 수영장에서는 슬리퍼를 신어요.</li>
<li>가족 간에 수건, 발수건, 슬리퍼를 따로 써요.</li>
<li>바르는 약은 가려움이 사라져도 <strong>1~2주 더</strong> 발라야 재발이 줄어요.</li>
<li>발톱 무좀은 겉으로 비슷한 다른 병(건선, 외상)도 있어 검사로 확인한 뒤 치료해요. 먹는 약은 간 기능과 다른 약과의 상호작용을 확인해요.</li>
</ul>

<h2>발에 맞는 신발 고르기</h2>
<div class="tbl"><table>
<thead><tr><th>확인할 것</th><th>요령</th></tr></thead>
<tbody>
<tr><td>시간</td><td>발이 조금 부은 <strong>오후나 저녁</strong>에 사요</td></tr>
<tr><td>길이</td><td>서서 신었을 때 가장 긴 발가락 앞에 <strong>엄지손가락 너비(약 1cm)</strong> 여유</td></tr>
<tr><td>앞볼 폭</td><td>발가락을 꼼지락거릴 수 있을 만큼 넓게</td></tr>
<tr><td>뒤꿈치</td><td>뒤꿈치 컵이 단단하고 걸을 때 헐떡이지 않게</td></tr>
<tr><td>굽</td><td>일상화는 2~4cm 정도. 높은 굽은 앞발 부담을 늘려요</td></tr>
<tr><td>밑창</td><td>적당한 쿠션과 미끄럼 방지</td></tr>
<tr><td>양쪽 발</td><td>양발 크기가 다른 경우가 많아요. 큰 발에 맞춰요</td></tr>
</tbody></table></div>
<p>운동화도 오래 신으면 쿠션이 꺼져요. 걷기·달리기용이라면 약 500~800km, 밑창이 한쪽으로 닳았다면 바꿔요.</p>

<h2>당뇨가 있다면 매일 발 보기</h2>
<div class="box warn"><span class="h">당뇨발 예방 수칙</span>
<p>당뇨가 오래되면 발의 감각이 둔해지고 혈액순환이 나빠져, 작은 상처를 모르고 지나쳐 궤양과 감염으로 커질 수 있어요.</p>
<ul>
<li><strong>매일 저녁</strong> 발바닥과 발가락 사이를 살펴요. 거울을 쓰거나 가족에게 부탁해요.</li>
<li>맨발로 다니지 않아요. 집 안에서도 실내화를 신어요.</li>
<li>신발을 신기 전 안에 이물질이 없는지 손으로 확인해요.</li>
<li>뜨거운 물, 전기장판, 핫팩에 발을 대지 않아요. 온도를 잘 못 느껴 화상을 입어요.</li>
<li>굳은살, 티눈을 스스로 칼로 깎지 않아요.</li>
<li><strong>상처, 물집, 색 변화(붉음·검음), 붓기, 고름, 냄새</strong>가 있으면 바로 진료를 받아요.</li>
<li>1년에 한 번 이상 병원에서 발 감각과 혈류 검사를 받아요.</li>
</ul></div>

<div class="box"><span class="h">발 건강 체크리스트</span>
<ol>
<li>발가락 사이까지 말리기</li>
<li>발톱은 일자로</li>
<li>신발은 오후에, 엄지 너비 여유</li>
<li>공용 샤워실에서 슬리퍼</li>
<li>무좀 약은 증상 사라진 뒤 1~2주 더</li>
<li>당뇨라면 매일 발 확인</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>발 냄새가 심해요.</dt>
<dd>땀이 세균에 분해되면서 냄새가 나요. 발을 매일 씻고 잘 말리고, 양말을 자주 갈아 신고, 신발을 번갈아 신어요. 땀이 아주 많다면 땀 억제제나 진료가 도움이 돼요.</dd>
<dt>평발이면 꼭 깔창을 해야 하나요?</dt>
<dd>통증이 없는 평발은 대부분 치료가 필요 없어요. 오래 걸을 때 발이나 무릎이 아프다면 아치를 받쳐 주는 깔창이 도움이 될 수 있어요.</dd>
<dt>무지외반증은 수술해야 하나요?</dt>
<dd>변형이 있어도 통증이 없고 신발을 신는 데 불편이 없다면 수술하지 않아요. 넓은 신발과 패드로 불편을 줄이고, 통증과 변형이 심해 생활이 어려우면 수술을 고려해요.</dd>
</dl>
