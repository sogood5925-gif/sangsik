<p class="lead">자다가 손이 저려서 깨고, 손을 털면 조금 나아져요. 운전대를 잡거나 휴대폰을 오래 들고 있으면 손가락 끝이 찌릿해요. 손목터널증후군은 손목 안쪽의 좁은 통로에서 신경이 눌려 생겨요. 일찍 알아채면 수술 없이도 좋아지는 경우가 많아요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>엄지, 검지, 중지, 약지 절반</strong>이 저리고 <strong>새끼손가락은 괜찮은</strong> 경우가 많아요.</li>
<li><strong>밤이나 새벽</strong>에 심하고, 손을 털면 나아지는 것이 특징이에요.</li>
<li>가벼우면 <strong>밤에 손목 보조기</strong>와 손목 쓰는 습관 조정으로 좋아질 수 있어요.</li>
<li><strong>엄지 밑 근육이 마르거나</strong> 감각이 계속 둔하면 늦기 전에 수술을 상의해요.</li>
</ul></div>

<h2>왜 생길까</h2>
<p>손목 안쪽에는 뼈와 두꺼운 인대로 둘러싸인 좁은 통로(손목터널)가 있어요. 이곳으로 손가락을 굽히는 힘줄 9개와 <strong>정중신경</strong>이 함께 지나가요. 힘줄 주변이 붓거나 통로가 좁아지면 신경이 눌려 저림과 통증이 생겨요. 정중신경은 엄지부터 약지 절반까지의 감각을 담당하기 때문에 새끼손가락은 대개 괜찮아요.</p>

<h2>잘 생기는 사람</h2>
<div class="tbl"><table>
<thead><tr><th>요인</th><th>예</th></tr></thead>
<tbody>
<tr><td>성별·나이</td><td>40~60대 여성에게 많아요</td></tr>
<tr><td>손목 사용</td><td>손목을 굽힌 채 반복하는 일, 진동 공구, 오래 쥐는 동작</td></tr>
<tr><td>몸의 변화</td><td>임신(부종), 폐경기, 비만</td></tr>
<tr><td>질환</td><td>당뇨, 갑상선 기능 저하증, 류마티스 관절염, 콩팥병으로 투석 중</td></tr>
<tr><td>손목 부상</td><td>손목 골절 뒤</td></tr>
</tbody>

<h2>증상의 흐름</h2>
<ul>
<li>처음에는 <strong>밤에만</strong> 저리고, 손을 털면 풀려요.</li>
<li>점점 낮에도 운전, 휴대폰, 머리 빗기처럼 손목을 굽히는 동작에서 저려요.</li>
<li>물건을 자주 떨어뜨리고, 단추 채우기가 어려워져요.</li>
<li>오래되면 엄지 밑 두툼한 근육이 <strong>납작하게 마르고</strong>, 감각이 계속 둔해요.</li>
</ul>

<h2>비슷한 병과의 구별</h2>
<div class="tbl"><table>
<thead><tr><th>질환</th><th>차이점</th></tr></thead>
<tbody>
<tr><td>목 디스크</td><td>목·어깨·팔을 따라 뻗치는 통증, 고개 움직임에 따라 심해져요</td></tr>
<tr><td>팔꿈치 척골신경 압박</td><td>새끼손가락과 약지 쪽이 저려요</td></tr>
<tr><td>당뇨 신경병증</td><td>양쪽 발끝부터 장갑·양말 모양으로 저려요</td></tr>
<tr><td>방아쇠 손가락</td><td>손가락을 굽혔다 펼 때 걸리고 딸깍 소리가 나요</td></tr>
</tbody>
<caption>대한수부외과학회, 대한재활의학회 자료를 바탕으로 정리. 신경전도 검사로 확인할 수 있어요</caption></table></div>

<h2>치료</h2>
<ul>
<li><strong>야간 손목 보조기:</strong> 자는 동안 손목을 곧게 펴 두면 신경 압박이 줄어요. 가벼운 경우 가장 먼저 해 볼 방법이에요.</li>
<li><strong>습관 조정:</strong> 손목을 오래 굽히거나 꽉 쥐는 동작을 줄이고, 중간중간 쉬어요. 자판과 마우스는 손목이 꺾이지 않는 높이로 맞춰요.</li>
<li><strong>스테로이드 주사:</strong> 손목터널 안에 주사해 부기를 줄여요. 효과가 일시적인 경우도 많아요.</li>
<li><strong>원인 질환 치료:</strong> 갑상선, 당뇨를 조절하면 나아지기도 해요. 임신 중 생긴 경우 출산 뒤 좋아지는 경우가 많아요.</li>
<li><strong>수술:</strong> 손목터널의 인대를 잘라 통로를 넓혀요. 보존 치료로 좋아지지 않거나, 근육 위축·감각 저하가 있을 때 고려해요.</li>
</ul>

<div class="box warn"><span class="h">늦지 않게 진료를 받아요</span>
<ul>
<li>엄지 밑 근육이 <strong>눈에 띄게 마르거나</strong> 엄지에 힘이 안 들어가요.</li>
<li>저림이 밤낮으로 <strong>계속되고 감각이 둔해요.</strong></li>
<li>보조기와 주사로 몇 달 관리했는데도 좋아지지 않아요.</li>
</ul>
<p>신경이 오래 눌리면 수술 뒤에도 회복이 덜 될 수 있어요. 한쪽 팔다리가 갑자기 저리고 힘이 빠지면 뇌졸중일 수 있어 바로 119를 불러요.</p></div>

<h2>손목을 아끼는 습관</h2>
<ul>
<li>휴대폰은 양손으로 들고, 오래 쓰지 않아요.</li>
<li>자판을 칠 때 손목을 책상 모서리에 누르지 않아요.</li>
<li>도구 손잡이는 두툼한 것을 써서 꽉 쥐지 않게 해요.</li>
<li>일하는 중간에 손목과 손가락을 가볍게 펴 주는 스트레칭을 해요.</li>
<li>잘 때 손목을 베개 밑에 넣거나 굽히고 자지 않아요.</li>
</ul>

<div class="box"><span class="h">손목터널증후군 체크리스트</span>
<ol>
<li>저린 손가락 범위 확인</li>
<li>밤에는 손목 보조기</li>
<li>손목 굽히는 동작 줄이기</li>
<li>당뇨·갑상선 검사</li>
<li>엄지 근육 마름은 바로 진료</li>
<li>몇 달 관리해도 그대로면 수술 상의</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>수술하면 금방 다시 쓸 수 있나요?</dt>
<dd>수술 뒤 저림은 비교적 빨리 좋아지는 경우가 많지만, 손바닥 통증과 힘은 회복에 몇 주~몇 달 걸려요. 무거운 일은 의사와 상의해 천천히 시작해요.</dd>
<dt>컴퓨터를 오래 써서 생긴 건가요?</dt>
<dd>컴퓨터 사용과의 관련은 생각보다 뚜렷하지 않아요. 진동 공구, 강하게 쥐는 반복 작업이 더 관련이 커요. 다만 손목 자세를 바로 하는 것은 증상을 줄이는 데 도움이 돼요.</dd>
<dt>양쪽 손이 다 저려요.</dt>
<dd>양쪽에 함께 생기기도 해요. 다만 발까지 저리면 당뇨 신경병증 같은 다른 원인을 확인해요.</dd>
</dl>
