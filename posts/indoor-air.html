<p class="lead">실내 공기는 바깥 공기보다 깨끗할 거라고 생각하기 쉬워요. 하지만 창문을 닫고 지내는 동안 건축 자재, 가구, 요리, 생활용품에서 나온 물질이 차곡차곡 쌓여요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>새 집과 새 가구에서는 <strong>포름알데히드와 휘발성 유기화합물</strong>이 나와 눈·코·목 자극, 두통을 일으켜요.</li>
<li><strong>라돈</strong>은 흡연 다음가는 폐암 원인이에요. 저층과 지하는 측정해 보는 게 좋아요.</li>
<li><strong>요리할 때</strong>는 레인지 후드를 켜고 창문을 열어요. 굽고 튀길 때 미세먼지가 크게 늘어요.</li>
<li>공기청정기는 환기를 <strong>대신하지 못해요.</strong> 하루 몇 번씩 창문을 열어 공기를 바꿔요.</li>
</ul></div>

<h2>새집증후군이란</h2>
<p>새로 짓거나 리모델링한 집, 새 가구를 들인 공간에서 머리가 아프고, 눈이 따갑고, 목이 칼칼하고, 피부가 가려운 증상이 생기는 것을 새집증후군이라고 해요. 주된 원인은 건축 자재와 가구, 접착제, 페인트, 벽지에서 나오는 화학물질이에요.</p>
<div class="tbl"><table>
<thead><tr><th>물질</th><th>주요 발생원</th><th>영향</th></tr></thead>
<tbody>
<tr><td>포름알데히드</td><td>합판·MDF 가구, 붙박이장, 접착제, 벽지</td><td>눈·코·목 자극, 기침, 피부염. 국제암연구소 1군 발암물질</td></tr>
<tr><td>휘발성 유기화합물 (톨루엔, 벤젠, 자일렌 등)</td><td>페인트, 접착제, 바닥재, 방향제, 세정제</td><td>두통, 어지러움, 메스꺼움, 호흡기 자극</td></tr>
</tbody></table></div>
<p>이 물질들은 입주 초기에 가장 많이 나오고 시간이 지나며 줄어들지만, 몇 달에서 몇 년까지 이어질 수 있어요. 온도와 습도가 높을수록 더 많이 방출돼요. 아이, 임신부, 천식이나 아토피가 있는 사람은 더 민감해요.</p>

<h2>새 집에 들어가기 전: 베이크아웃</h2>
<p>베이크아웃은 실내 온도를 높여 건축 자재 속 유해물질을 한꺼번에 방출시킨 뒤 환기로 내보내는 방법이에요.</p>
<ol>
<li>창문과 문을 모두 닫고, 가구의 문과 서랍을 열어둬요.</li>
<li>난방을 높여 실내 온도를 <strong>35~40°C 정도</strong>로 올리고 몇 시간(약 6~10시간) 유지해요.</li>
<li>창문을 모두 열어 <strong>1~2시간 이상</strong> 충분히 환기해요.</li>
<li>이 과정을 여러 번 반복해요.</li>
</ol>
<div class="box warn"><span class="h">베이크아웃할 때 주의</span>
<ul>
<li>진행하는 동안 <strong>사람과 반려동물은 집 밖에</strong> 있어요.</li>
<li>난방기 주변에 불에 타기 쉬운 물건을 두지 않아요.</li>
<li>전기 난방기를 무리하게 여러 대 쓰지 않아요.</li>
<li>입주 후에도 몇 달 동안은 자주 환기해요.</li>
</ul></div>
<p>신축 공동주택은 입주 전 실내공기질을 측정해 공개하도록 되어 있어요. 관리사무소나 지자체에서 측정 결과를 확인할 수 있어요.</p>

<h2>가구를 고를 때</h2>
<ul>
<li>국내 목질 판상 제품은 포름알데히드 방출량에 따라 등급을 매겨요. <strong>SE0, E0</strong> 등급이 방출량이 적은 편이에요.</li>
<li>새 가구는 포장을 뜯어 베란다나 환기가 잘 되는 곳에 며칠 두었다가 들여요.</li>
<li>친환경 인증 마크가 있는 페인트, 벽지, 바닥재를 고르면 도움이 돼요.</li>
</ul>

<h2>라돈: 보이지 않는 발암물질</h2>
<p>라돈은 흙과 바위 속 우라늄이 붕괴하면서 생기는 <strong>자연 방사성 기체</strong>예요. 색도 냄새도 없어서 측정하지 않으면 알 수 없어요. 세계보건기구는 라돈을 <strong>흡연 다음가는 폐암 원인</strong>으로 꼽고, 흡연자가 라돈에 노출되면 위험이 더 커진다고 알려요.</p>
<ul>
<li>땅과 가까운 <strong>지하, 1층, 단독주택</strong>에서 농도가 높기 쉬워요.</li>
<li>바닥과 벽의 균열, 배관 틈으로 들어와요.</li>
<li>화강암 지대에서 높을 수 있어요.</li>
<li>국내 공동주택의 실내 라돈 권고 기준은 <strong>148Bq/m³</strong>이에요.</li>
</ul>
<div class="box note"><span class="h">라돈 줄이는 법</span>
<ul>
<li>일부 지자체와 기관에서 <strong>라돈 측정기를 무료로 대여</strong>해요. 환경부 생활환경정보센터나 지자체에 문의해요.</li>
<li>하루 여러 번 <strong>환기</strong>하면 농도가 크게 떨어져요.</li>
<li>바닥과 벽의 균열, 배관 주변 틈을 메워요.</li>
<li>농도가 높다면 전문 저감 시공을 고려해요.</li>
</ul></div>

<h2>요리할 때 생기는 미세먼지</h2>
<p>고기를 굽거나 생선을 튀기거나 볶음 요리를 할 때, 실내 미세먼지 농도가 바깥의 '매우 나쁨' 수준보다 훨씬 높아질 수 있어요. 가스레인지를 쓰면 이산화질소 같은 연소 물질도 함께 나와요.</p>
<ul>
<li>요리 시작 전부터 <strong>레인지 후드</strong>를 켜고, 요리가 끝난 뒤에도 <strong>15~30분</strong> 더 켜둬요.</li>
<li>가능하면 <strong>창문을 함께 열어</strong> 공기가 빠져나갈 길을 만들어요.</li>
<li>뒤쪽 화구를 쓰면 후드가 연기를 더 잘 빨아들여요.</li>
<li>후드 필터를 정기적으로 청소해요.</li>
</ul>

<h2>생활용품에서 나오는 것들</h2>
<ul>
<li><strong>방향제, 디퓨저, 향초</strong>: 휘발성 유기화합물과 미세먼지를 내보내요. 향으로 냄새를 덮기보다 환기로 원인을 없애요.</li>
<li><strong>스프레이형 세정제·살균제</strong>: 미세한 방울을 들이마실 수 있어요. 천에 뿌려 닦고, 쓰는 동안 환기해요.</li>
<li><strong>담배</strong>: 실내 흡연은 가장 강력한 실내 오염원이에요. 베란다에서 피워도 집 안으로 들어와요.</li>
<li><strong>세탁소 비닐</strong>: 드라이클리닝 옷은 비닐을 벗겨 바람이 통하는 곳에 두었다가 옷장에 넣어요.</li>
</ul>

<h2>환기, 어떻게 할까</h2>
<div class="tbl"><table>
<thead><tr><th>상황</th><th>환기 방법</th></tr></thead>
<tbody>
<tr><td>평소</td><td>하루 2~3번, 마주 보는 창문을 열어 한 번에 10~30분</td></tr>
<tr><td>새 집, 새 가구</td><td>입주 후 몇 달 동안은 더 자주, 더 길게</td></tr>
<tr><td>요리·청소 후</td><td>바로 환기</td></tr>
<tr><td>미세먼지 나쁜 날</td><td>짧게(몇 분씩) 자주 환기하고 공기청정기를 함께. 요리할 때는 미세먼지가 나빠도 환기가 필요해요</td></tr>
<tr><td>겨울</td><td>짧고 강하게 맞바람 환기하면 벽과 바닥이 덜 식어요</td></tr>
</tbody></table></div>
<p>사람이 많은 방을 오래 닫아두면 이산화탄소 농도가 올라가 졸리고 머리가 무거워져요. 이 역시 환기로만 해결돼요.</p>

<h2>공기청정기와 식물</h2>
<ul>
<li><strong>공기청정기</strong>는 미세먼지 같은 입자를 잘 걸러요. 하지만 포름알데히드 같은 기체는 일부 필터만 제한적으로 줄이고, 이산화탄소는 줄이지 못해요. <strong>환기를 대신할 수 없어요.</strong> 필터는 제때 교체해요.</li>
<li><strong>공기정화 식물</strong>은 실험실의 밀폐 공간에서는 효과가 있었지만, 실제 집에서 의미 있는 효과를 내려면 방 하나에 매우 많은 화분이 필요하다는 분석이 있어요. 식물은 마음의 안정에 좋지만, 공기 정화는 환기에 맡겨요.</li>
</ul>

<div class="box"><span class="h">실내 공기 점검표</span>
<ol>
<li>하루 2~3번 창문 열어 환기하기</li>
<li>요리할 때 후드 켜고 요리 후 15분 더 켜두기</li>
<li>새 가구는 포장 벗겨 며칠 바람 쐬고 들이기</li>
<li>방향제·향초 줄이기</li>
<li>저층·단독주택이라면 라돈 측정해 보기</li>
<li>공기청정기 필터 교체 날짜 확인하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>숯이나 양파를 두면 새집 냄새가 빠지나요?</dt>
<dd>숯은 일부 냄새 물질을 흡착하지만 양이 제한적이에요. 양파는 효과가 확인되지 않았어요. 가장 확실한 방법은 베이크아웃과 꾸준한 환기예요.</dd>
<dt>새집증후군 증상은 얼마나 가나요?</dt>
<dd>보통 입주 후 몇 달이 가장 심하고 시간이 지나며 줄어요. 증상이 오래가거나 아이의 아토피와 천식이 심해진다면 환기를 늘리고 진료를 받아요.</dd>
<dt>라돈 측정 결과가 기준을 조금 넘었어요.</dt>
<dd>라돈 농도는 계절과 날씨에 따라 변해요. 여러 번 측정해 평균을 보고, 먼저 환기를 늘려 다시 측정해 보세요. 계속 높다면 저감 시공을 고려해요.</dd>
</dl>
