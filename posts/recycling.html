<p class="lead">재활용품은 한 번 섞이면 선별장에서 다시 골라내기 어렵고, 오염된 한 개가 한 묶음 전체를 쓰레기로 만들기도 해요. 버릴 때 몇 초만 더 쓰면 실제로 다시 쓰이는 양이 크게 늘어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>원칙은 <strong>비우고, 헹구고, 분리하고, 섞지 않기</strong> 네 가지예요.</li>
<li><strong>투명 페트병</strong>은 라벨을 떼고 찌그러뜨려 따로 모아요. 옷감 원료 같은 고품질 재활용이 가능해요.</li>
<li>동물 뼈, 조개껍데기, 달걀 껍데기, 딱딱한 씨는 <strong>음식물 쓰레기가 아니에요.</strong></li>
<li>세부 기준은 <strong>지자체마다 조금씩 달라요.</strong> 사는 곳 구청·군청 안내를 한 번 확인해 두세요.</li>
</ul></div>

<h2>분리배출 4원칙</h2>
<div class="tbl"><table>
<thead><tr><th>원칙</th><th>이렇게 해요</th></tr></thead>
<tbody>
<tr><td><strong>비우기</strong></td><td>용기 안의 내용물을 모두 비워요. 남은 음료, 소스, 화장품이 대표적인 오염원이에요</td></tr>
<tr><td><strong>헹구기</strong></td><td>음식물이 묻었다면 물로 가볍게 헹궈요. 기름기가 심해 잘 안 지워지면 일반쓰레기로 버려요</td></tr>
<tr><td><strong>분리하기</strong></td><td>라벨, 뚜껑, 스프링처럼 다른 재질은 떼어서 각각의 종류로 내놓아요</td></tr>
<tr><td><strong>섞지 않기</strong></td><td>종류별로 따로 모으고, 다른 재질을 한 봉투에 섞지 않아요</td></tr>
</tbody>
<caption>환경부(현 기후에너지환경부) 재활용품 분리배출 가이드라인을 바탕으로 정리</caption></table></div>

<h2>투명 페트병을 따로 모으는 이유</h2>
<p>투명 페트병은 색이 들어간 페트병이나 다른 플라스틱과 섞이지 않으면 <strong>옷감이나 다시 음료병을 만드는 원료</strong>가 될 수 있어요. 섞이면 품질이 떨어져 쓰임새가 줄어요. 그래서 아파트와 단독주택 모두 투명 페트병 별도 배출 제도가 시행되고 있어요.</p>
<ol>
<li>내용물을 비우고 헹궈요.</li>
<li><strong>라벨을 떼요.</strong> 절취선이 있는 라벨은 쉽게 벗겨져요.</li>
<li>찌그러뜨려 부피를 줄이고 뚜껑을 닫아요. 뚜껑은 함께 배출해도 선별 과정에서 분리돼요.</li>
<li>투명 페트병 전용 수거함이나 전용 봉투에 넣어요.</li>
</ol>
<p>생수병처럼 투명한 것만 해당돼요. 색이 들어간 음료병, 식용유병, 투명 플라스틱 반찬 용기는 일반 플라스틱으로 내놓아요.</p>

<h2>음식물 쓰레기가 아닌 것</h2>
<p>음식물 쓰레기는 대부분 사료나 퇴비로 쓰여요. 그래서 <strong>동물이 먹을 수 없거나 잘 썩지 않는 것</strong>은 음식물 쓰레기에 넣지 않아요.</p>
<div class="tbl"><table>
<thead><tr><th>일반쓰레기(종량제 봉투)로</th><th>이유</th></tr></thead>
<tbody>
<tr><td>닭뼈, 돼지뼈, 생선뼈</td><td>딱딱해서 사료로 쓸 수 없고 기계를 망가뜨려요</td></tr>
<tr><td>조개·굴·게 껍데기, 달걀 껍데기</td><td>잘 분해되지 않아요</td></tr>
<tr><td>복숭아·살구 씨처럼 딱딱한 씨</td><td>분쇄가 어려워요</td></tr>
<tr><td>양파·마늘의 마른 껍질, 옥수수 껍질과 대</td><td>섬유질이 질겨요</td></tr>
<tr><td>티백, 한약재 찌꺼기, 커피 찌꺼기</td><td>지자체마다 다르지만 일반쓰레기로 안내하는 곳이 많아요</td></tr>
</tbody>
<caption>지자체 음식물류 폐기물 배출 안내를 바탕으로 정리. 세부 기준은 지역마다 달라요</caption></table></div>
<p>물기는 최대한 빼서 버려요. 무게와 악취가 줄고 처리도 쉬워져요.</p>

<h2>헷갈리는 품목 모음</h2>
<ul>
<li><strong>아이스팩:</strong> 젤 형태(고흡수성수지)는 뜯지 말고 통째로 일반쓰레기로 버려요. 속이 물인 아이스팩은 물을 버리고 비닐류로 내놓아요. 지자체에 따라 아이스팩 전용 수거함을 두기도 해요.</li>
<li><strong>영수증:</strong> 대부분 감열지라서 종이류가 아니라 <strong>일반쓰레기</strong>예요.</li>
<li><strong>칫솔, 볼펜, 고무장갑:</strong> 여러 재질이 섞여 있어 일반쓰레기예요.</li>
<li><strong>과자·라면 봉지:</strong> 내용물을 털어 내고 비닐류로 내놓아요. 음식물이 잔뜩 묻은 비닐은 일반쓰레기예요.</li>
<li><strong>스티로폼:</strong> 깨끗한 흰 스티로폼만 재활용돼요. 테이프, 송장, 음식물이 묻은 것은 떼거나 일반쓰레기로 버려요.</li>
<li><strong>종이팩(우유팩):</strong> 헹궈서 펼쳐 말린 뒤 종이팩으로 따로 모아요. 일반 종이와 섞으면 재활용이 어려워요. 주민센터에서 종이팩을 모아 가면 휴지 등으로 바꿔 주는 지역도 있어요.</li>
<li><strong>깨진 유리와 사기그릇:</strong> 재활용되지 않아요. 신문지로 싸서 종량제 봉투에 넣고 '유리 조심'이라고 써요. 양이 많으면 불연성 쓰레기 전용 마대를 사서 버려요.</li>
</ul>

<h2>따로 버려야 하는 것</h2>
<div class="box warn"><span class="h">일반쓰레기에 넣으면 위험해요</span>
<ul>
<li><strong>폐건전지, 보조배터리:</strong> 쓰레기차나 처리장에서 눌려 불이 나는 사고가 이어지고 있어요. 주민센터나 아파트의 전용 수거함에 넣어요.</li>
<li><strong>폐형광등:</strong> 수은이 들어 있어요. 깨지지 않게 전용 수거함에 넣어요.</li>
<li><strong>부탄가스, 스프레이 캔:</strong> 내용물을 다 쓰고 바람이 잘 통하는 곳에서 남은 가스를 뺀 뒤 캔류로 내놓아요. 지자체 안내에 따라 구멍을 뚫기도 해요.</li>
</ul></div>
<ul>
<li><strong>폐의약품:</strong> 먹다 남은 약은 하수구나 종량제 봉투에 버리지 않아요. 약국, 보건소, 주민센터 등의 폐의약품 수거함에 가져가요. 알약은 포장을 벗겨 모으고, 물약은 한 병에 모아요. 수거 장소는 지자체마다 달라요.</li>
<li><strong>대형 가전:</strong> 냉장고, 세탁기, 에어컨처럼 큰 가전은 '폐가전 무상 방문수거' 서비스를 예약하면 무료로 가져가요. 작은 가전은 여러 개를 모으면 함께 수거해 주기도 해요.</li>
<li><strong>가구, 대형 생활폐기물:</strong> 구청·군청 홈페이지나 앱에서 신고하고 스티커(배출 필증)를 붙여 내놓아요.</li>
</ul>

<h2>플라스틱 번호와 재질 표시</h2>
<p>용기 바닥의 분리배출 표시(삼각형 안의 글자)는 어느 수거함에 넣을지 알려 줘요. 페트(PET), 플라스틱(HDPE, PP, PS 등), 비닐류, 캔류, 종이, 유리 표시를 보고 해당 칸에 넣으면 돼요. 표시가 없는 복합 재질은 일반쓰레기인 경우가 많아요.</p>

<h2>재활용보다 앞서는 것</h2>
<p>분리배출을 잘해도 모든 것이 다시 쓰이지는 않아요. 장바구니와 텀블러를 쓰고, 리필 제품을 고르고, 불필요한 포장을 줄이는 것이 쓰레기를 가장 확실하게 줄이는 방법이에요.</p>

<div class="box"><span class="h">부엌 분리배출 체크리스트</span>
<ol>
<li>투명 페트병 칸을 따로 만들기</li>
<li>용기는 비우고 한 번 헹구기</li>
<li>라벨·뚜껑·테이프 떼기</li>
<li>뼈·껍데기·딱딱한 씨는 일반쓰레기로</li>
<li>건전지·형광등·약은 전용 수거함으로</li>
<li>우리 동네 배출 요일과 기준 확인하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>배달 음식 용기는 어떻게 버려요?</dt>
<dd>남은 음식을 비우고 물로 헹궈 플라스틱으로 내놓아요. 기름이나 양념 색이 배어 지워지지 않으면 재활용 품질을 떨어뜨리니 일반쓰레기로 버리는 게 나아요.</dd>
<dt>기준이 헷갈릴 때는 어디서 확인하나요?</dt>
<dd>환경부가 만든 '내 손안의 분리배출' 앱이나 사는 지역 구청·군청 홈페이지의 배출 안내를 확인하면 품목별로 찾아볼 수 있어요.</dd>
<dt>재활용이 안 되는 걸 넣으면 어떻게 되나요?</dt>
<dd>선별장에서 사람이 골라내야 하고, 골라내지 못하면 함께 모인 재활용품의 품질이 떨어져요. 애매하면 일반쓰레기로 버리는 편이 전체 재활용에는 더 도움이 돼요.</dd>
</dl>
