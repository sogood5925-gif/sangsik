<template data-id="motion-sickness" data-cat="hea" data-date="2026.09.30"
  data-title="멀미: 눈과 귀가 다른 말을 할 때, 앞자리와 먼 곳 보기, 멀미약과 붙이는 패치 쓸 때 주의"
  data-thumb="30~60분|멀미약 미리 먹는 시간"
  data-summary="차, 배, 비행기에서 속이 울렁거리고 식은땀이 나는 멀미는 눈과 귓속 균형기관이 서로 다른 정보를 보낼 때 생겨요. 멀미가 생기는 원리, 잘 걸리는 사람, 자리 고르기와 시선 두는 법, 먹는 멀미약과 귀밑에 붙이는 패치의 차이와 주의점, 아이와 임신부의 멀미, 가상현실 멀미를 정리했어요."
  data-tags="멀미,차멀미,뱃멀미,멀미약,건강상식">
<p class="lead">차 뒷자리에서 휴대폰을 보다가 속이 메스꺼워지고, 배를 타면 얼굴이 하얗게 질리는 사람이 있어요. 멀미는 몸이 약해서 생기는 게 아니라, 뇌가 서로 다른 신호를 받아 혼란스러울 때 생기는 자연스러운 반응이에요. 원리를 알면 약에 기대지 않고도 꽤 줄일 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>멀미는 <strong>눈이 보는 움직임과 귓속 균형기관이 느끼는 움직임이 다를 때</strong> 생겨요.</li>
<li><strong>앞자리</strong>에 앉아 <strong>먼 곳 수평선</strong>을 보고, 휴대폰·책은 피해요.</li>
<li>멀미약은 <strong>출발 30분~1시간 전</strong>에 먹어야 효과가 있어요. 졸음이 올 수 있어요.</li>
<li>귀밑 패치는 <strong>어린이 사용 제한, 녹내장·전립선비대증</strong> 등 주의할 점이 있어요.</li>
</ul></div>

<h2>멀미는 왜 생길까</h2>
<p>차 안에서 책을 보면 눈은 '가만히 있다'고 느끼지만, 귓속 균형기관은 차의 흔들림을 '움직이고 있다'고 알려요. 뇌는 이 엇갈린 정보를 이상 신호로 받아들여 메스꺼움, 어지러움, 식은땀, 하품, 침 고임, 구토를 일으켜요. 가상현실이나 3D 영상처럼 눈만 움직임을 보는 경우에도 같은 원리로 멀미가 생겨요.</p>

<h2>잘 걸리는 사람</h2>
<ul>
<li><strong>2~12세 어린이</strong>(2세 미만은 드물어요)</li>
<li>여성, 특히 생리 기간이나 임신 중</li>
<li>편두통이 있는 사람</li>
<li>피곤하거나 잠이 부족할 때, 과식하거나 공복일 때</li>
<li>나이가 들수록 대개 줄어들어요.</li>
</ul>

<h2>약 없이 줄이는 방법</h2>
<div class="tbl"><table>
<thead><tr><th>교통수단</th><th>자리와 시선</th></tr></thead>
<tbody>
<tr><td>자동차</td><td>앞좌석에 앉거나 직접 운전해요. 앞 유리 너머 먼 곳을 봐요. 휴대폰·책은 피해요</td></tr>
<tr><td>버스</td><td>앞쪽, 창가 자리. 바퀴 위보다 앞바퀴 앞쪽이 덜 흔들려요</td></tr>
<tr><td>배</td><td>배의 가운데, 낮은 층. 갑판에서 수평선을 봐요</td></tr>
<tr><td>비행기</td><td>날개 위 좌석이 덜 흔들려요. 창밖이나 앞을 봐요</td></tr>
<tr><td>기차</td><td>진행 방향을 바라보는 좌석</td></tr>
</tbody>
<caption>미국 질병통제예방센터(CDC) Yellow Book: Motion Sickness를 바탕으로 정리</caption></table></div>
<ul>
<li>창문을 조금 열어 <strong>신선한 공기</strong>를 넣고, 강한 냄새(방향제, 음식)를 피해요.</li>
<li>출발 전 <strong>가볍게</strong> 먹어요. 과식, 기름진 음식, 술은 피해요.</li>
<li>머리를 등받이에 기대 흔들림을 줄이고, 눈을 감고 쉬는 것도 방법이에요.</li>
<li>생강이 조금 도움이 된다는 연구가 있어요.</li>
<li>같은 이동을 자주 하면 몸이 점차 적응하기도 해요.</li>
</ul>

<h2>멀미약 종류</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>쓰는 법</th><th>주의</th></tr></thead>
<tbody>
<tr><td>먹는 멀미약(디멘히드리네이트, 메클리진 등 항히스타민 성분)</td><td>출발 30분~1시간 전. 필요하면 정해진 간격으로 추가</td><td>졸음, 입마름. 운전하는 사람은 먹지 않아요</td></tr>
<tr><td>붙이는 패치(스코폴라민)</td><td>출발 4시간쯤 전 한쪽 귀 뒤에 붙여요. 효과가 오래가요</td><td>어린이는 연령 제한이 있어요. 녹내장, 전립선비대증 등에는 쓰지 않아요. 붙인 뒤 손을 씻어요</td></tr>
<tr><td>어린이용 멀미약</td><td>나이·체중에 맞는 제품과 용량</td><td>어른 약을 나눠 먹이지 않아요</td></tr>
</tbody>
<caption>식품의약품안전처 멀미약 안전 사용 안내를 바탕으로 정리. 복용 중인 약이 있다면 약사와 상의해요</caption></table></div>

<div class="box warn"><span class="h">패치 사용 뒤 이런 증상은 바로 떼고 진료</span>
<ul>
<li><strong>눈이 흐리고 동공이 커지거나</strong>, 눈이 아파요. 패치를 만진 손으로 눈을 비비면 한쪽 동공이 커질 수 있어요.</li>
<li><strong>혼란, 환각, 심한 어지러움</strong>, 소변이 나오지 않아요. 어르신과 어린이에게 더 잘 생겨요.</li>
<li>도착 뒤에는 패치를 떼고 붙였던 자리와 손을 씻어요.</li>
</ul>
<p>멀미가 아닌데 <strong>심한 두통과 구토, 어지럼이 계속되거나</strong> 말이 어눌하고 한쪽 팔다리에 힘이 빠진다면 다른 병일 수 있어 바로 119에 연락해요.</p></div>

<h2>아이와 임신부</h2>
<ul>
<li><strong>아이:</strong> 카시트를 높여 창밖을 볼 수 있게 하고, 영상 대신 노래나 대화를 해요. 자주 쉬어 가고, 비닐봉지와 물티슈를 챙겨요.</li>
<li><strong>임신부:</strong> 멀미약은 산부인과와 상의해요. 창문 열기, 가벼운 간식, 생강 같은 방법을 먼저 써 봐요.</li>
</ul>

<div class="box"><span class="h">멀미 예방 체크리스트</span>
<ol>
<li>앞자리, 먼 곳 보기</li>
<li>휴대폰·책 내려놓기</li>
<li>창문 열어 환기</li>
<li>가볍게 먹고 과식·술 피하기</li>
<li>약은 30분~1시간 전, 패치는 4시간쯤 전</li>
<li>패치 뒤 손 씻기, 눈 비비지 않기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>이미 멀미가 시작됐는데 약을 먹어도 되나요?</dt>
<dd>먹어도 되지만 효과가 늦게 나타나요. 토할 것 같으면 차를 세우고 바람을 쐬며 쉬는 것이 먼저예요.</dd>
<dt>손목 지압 밴드는 효과가 있나요?</dt>
<dd>연구 결과가 엇갈려요. 부작용이 없으니 써 보고 도움이 되면 계속 써도 괜찮아요.</dd>
<dt>가상현실 게임을 하면 어지러워요.</dt>
<dd>짧게 시작해 조금씩 늘리고, 어지러우면 바로 쉬어요. 화면 움직임이 빠른 콘텐츠는 피해요.</dd>
</dl>
