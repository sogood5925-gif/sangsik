<p class="lead">여름철 수영장과 학교에서 번지는 눈병, 봄마다 가려운 눈, 아침에 눈꺼풀이 붙을 만큼 끼는 눈곱. 모두 결막염이라고 부르지만 원인이 달라요. 원인을 알면 언제 병원에 가야 하는지, 가족에게 옮기지 않으려면 어떻게 해야 하는지가 보여요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>결막염은 <strong>바이러스, 세균, 알레르기</strong>가 흔한 원인이에요.</li>
<li><strong>유행성 각결막염</strong>(아데노바이러스)은 전염력이 강하고 2~3주 갈 수 있어요. 손 씻기와 수건 따로 쓰기가 기본이에요.</li>
<li>예전에 쓰던 <strong>남은 안약, 특히 스테로이드 안약</strong>을 함부로 넣지 않아요.</li>
<li><strong>시력 저하, 심한 통증, 빛에 눈부심</strong>이 있으면 결막염이 아닐 수 있어요. 바로 안과에 가요.</li>
</ul></div>

<h2>결막은 어디일까</h2>
<p>결막은 눈의 흰자위와 눈꺼풀 안쪽을 덮고 있는 얇고 투명한 막이에요. 여기에 염증이 생기면 핏줄이 도드라져 눈이 빨갛게 보이고, 눈곱과 눈물, 이물감, 가려움이 생겨요.</p>

<h2>원인별 차이</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>바이러스</th><th>세균</th><th>알레르기</th></tr></thead>
<tbody>
<tr><td>눈곱</td><td>맑고 물 같은 눈물이 많아요</td><td>노랗고 끈적한 고름. 아침에 눈꺼풀이 붙어요</td><td>맑거나 실 같은 점액</td></tr>
<tr><td>가려움</td><td>약간</td><td>적어요</td><td><strong>심해요</strong></td></tr>
<tr><td>양쪽 눈</td><td>한쪽에서 시작해 며칠 뒤 다른 쪽으로 옮겨 가요</td><td>한쪽 또는 양쪽</td><td>대개 양쪽 동시에</td></tr>
<tr><td>함께 오는 증상</td><td>감기 증상, 귀 앞 림프절 부종</td><td>눈꺼풀 부종</td><td>콧물, 재채기, 계절성</td></tr>

<h2>유행성 각결막염</h2>
<p>아데노바이러스가 원인인 유행성 각결막염은 흔히 '눈병'이라고 불러요. 여름과 초가을에 학교, 수영장, 가족 사이에서 잘 번져요.</p>
<ul>
<li>눈이 심하게 충혈되고, 눈물과 이물감이 많아요. 귀 앞 림프절이 붓기도 해요.</li>
<li>보통 <strong>2~3주</strong>에 걸쳐 좋아져요. 바이러스를 없애는 특효약은 없고, 인공눈물과 냉찜질로 증상을 덜어요.</li>
<li>일부는 각막에 작은 혼탁이 생겨 눈부심과 시야 흐림이 몇 주~몇 달 남을 수 있어요. 안과에서 경과를 확인해요.</li>
<li>증상이 시작된 뒤 약 2주 동안은 전염력이 있다고 보고 조심해요.</li>
</ul>
<div class="box note"><span class="h">가족과 친구에게 옮기지 않으려면</span>
<ul>
<li>눈을 만진 손은 바로 <strong>비누로 씻어요.</strong></li>
<li>수건, 베개, 세면도구, 화장품을 <strong>따로 써요.</strong></li>
<li>안약 병 입구가 눈에 닿지 않게 하고, 다른 사람과 나눠 쓰지 않아요.</li>
<li>수영장, 목욕탕 이용을 피해요.</li>
<li>학교와 직장은 전염력이 있는 동안 쉬는 것을 권해요. 복귀 시기는 진료 의사와 상의해요.</li>
</ul></div>

<h2>세균성 결막염</h2>
<p>노랗고 끈적한 눈곱이 계속 나오면 세균성일 가능성이 있어요. 항생제 안약을 쓰면 회복이 빨라지고 전염 기간이 줄어요. 콘택트렌즈를 끼는 사람은 각막염으로 번질 수 있어 더 조심해요.</p>

<h2>알레르기 결막염</h2>
<ul>
<li>꽃가루 철, 집먼지진드기, 반려동물 털 등에 반응해 <strong>양쪽 눈이 몹시 가려워요.</strong></li>
<li>눈을 비비면 더 심해져요. 차가운 수건으로 식히고 인공눈물로 씻어 내요.</li>
<li>항히스타민 안약이나 비만세포 안정제 안약을 써요. 비염이 함께 있으면 함께 치료해요.</li>
</ul>

<h2>남은 안약을 쓰면 안 되는 이유</h2>
<ul>
<li>개봉한 안약은 보통 <strong>한 달 정도</strong>가 지나면 오염될 수 있어 버려요. 일회용 안약은 한 번 쓰고 버려요.</li>
<li><strong>스테로이드 안약</strong>은 증상을 빨리 가라앉히지만, 헤르페스 각막염을 악화시키거나 오래 쓰면 안압이 올라 녹내장, 백내장을 일으킬 수 있어요. 반드시 진료 뒤 처방받아 써요.</li>
<li>다른 사람에게 처방된 안약은 쓰지 않아요.</li>
</ul>

<div class="box warn"><span class="h">결막염이 아닐 수 있어요: 바로 안과로</span>
<ul>
<li><strong>시력이 떨어지거나</strong> 뿌옇게 보여요.</li>
<li>눈이 <strong>심하게 아프거나</strong>, 빛을 보면 눈이 부시고 아파요.</li>
<li>콘택트렌즈를 끼다가 눈이 빨개지고 아파요(각막염 의심).</li>
<li>눈 주변 피부에 물집이 생겼어요(대상포진, 헤르페스).</li>
<li>심한 두통, 구역질과 함께 눈이 빨개졌어요(급성 녹내장 가능성).</li>
<li>신생아의 눈에서 고름이 나와요.</li>
</ul></div>

<h2>콘택트렌즈 사용자</h2>
<p>눈이 빨갛거나 불편하면 <strong>렌즈를 바로 빼고</strong> 증상이 다 나을 때까지 끼지 않아요. 결막염 동안 썼던 렌즈와 렌즈 통은 버리는 게 좋아요. 렌즈를 낀 채 자거나 수돗물로 헹구는 습관은 각막 감염 위험을 크게 높여요.</p>

<div class="box"><span class="h">눈이 빨개졌을 때 체크리스트</span>
<ol>
<li>눈곱 모양, 가려움, 한쪽·양쪽 확인</li>
<li>렌즈는 빼고, 눈 비비지 않기</li>
<li>손 씻기, 수건·베개 따로</li>
<li>남은 안약·스테로이드 안약 쓰지 않기</li>
<li>시력 저하·통증·눈부심은 즉시 안과</li>
<li>유행성 눈병은 전염 기간 동안 등교·출근 조절</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>눈병 걸린 사람과 눈을 마주치면 옮나요?</dt>
<dd>눈을 마주치는 것으로는 옮지 않아요. 눈물과 눈곱이 묻은 손, 수건, 물건을 통해 옮아요. 그래서 손 씻기가 가장 중요해요.</dd>
<dt>냉찜질과 온찜질 중 뭐가 좋아요?</dt>
<dd>충혈과 가려움, 부기에는 냉찜질이 도움이 돼요. 수건은 한 번 쓰고 빨아요.</dd>
<dt>결막하출혈과는 다른가요?</dt>
<dd>흰자위에 빨간 피멍이 번진 결막하출혈은 작은 혈관이 터진 거예요. 통증과 눈곱이 없고 보통 1~2주 안에 저절로 흡수돼요. 자주 반복되거나 다쳐서 생겼다면 진료를 받아요.</dd>
</dl>
