<p class="lead">햄버거 패티의 속이 분홍색이 아니라고 다 익은 걸까요? 고기 색은 신선도, 부위, 조리 방법에 따라 달라서 믿을 만한 기준이 아니에요. 식중독균을 없애는 건 결국 <strong>온도</strong>예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>닭·오리 등 가금류는 속까지 <strong>74°C</strong>, 다진 고기는 <strong>71°C</strong>까지 익혀요.</li>
<li>덩어리 소·돼지고기와 생선은 <strong>63°C</strong> 이상, 고기는 불을 끈 뒤 3분 정도 두어요.</li>
<li>국내에서는 중심 온도 <strong>75°C에서 1분 이상</strong> 가열을 기본으로 권해요.</li>
<li><strong>생닭은 씻지 않아요.</strong> 물이 튀면서 균이 주방에 퍼져요.</li>
</ul></div>

<h2>왜 온도가 중요할까</h2>
<p>날고기와 날달걀에는 살모넬라, 캄필로박터, 장출혈성 대장균 같은 식중독균이 있을 수 있어요. 이런 균은 충분한 온도에서 충분히 가열하면 대부분 죽어요. 문제는 <strong>겉은 익었는데 속이 덜 익는 경우</strong>예요. 두꺼운 고기, 다진 고기, 뼈 가까운 부분이 특히 그래요.</p>

<h2>식품별 안전 조리 온도</h2>
<div class="tbl"><table>
<thead><tr><th>식품</th><th class="num">가장 두꺼운 부분 온도</th><th>이유</th></tr></thead>
<tbody>
<tr><td>닭, 오리, 칠면조(통째·조각·다짐)</td><td class="num">74°C</td><td>캄필로박터, 살모넬라가 흔해요</td></tr>
<tr><td>다진 소·돼지고기, 햄버거 패티, 동그랑땡</td><td class="num">71°C</td><td>겉의 균이 다지는 과정에서 속까지 섞여요</td></tr>
<tr><td>소·돼지·양고기 덩어리(스테이크, 수육)</td><td class="num">63°C + 3분 휴지</td><td>균이 주로 겉에 있어요. 돼지고기는 속까지 익혀요</td></tr>
<tr><td>생선</td><td class="num">63°C</td><td>살이 불투명해지고 포크로 쉽게 갈라져요</td></tr>
<tr><td>달걀 요리(오믈렛, 달걀찜)</td><td class="num">71°C</td><td>노른자와 흰자가 모두 굳을 때까지</td></tr>
<tr><td>남은 음식 데우기</td><td class="num">74°C</td><td>보관 중 늘어난 균을 없애요</td></tr>
</tbody>
<caption>미국 농무부(USDA) Safe Minimum Internal Temperature Chart를 바탕으로 정리. 식품의약품안전처는 중심 온도 75°C 1분 이상(굴 등 패류는 85°C 1분 이상)을 권해요</caption></table></div>

<h2>색깔을 믿기 어려운 이유</h2>
<ul>
<li>다진 고기는 덜 익어도 갈색이 될 수 있고, 다 익어도 분홍빛이 남을 수 있어요.</li>
<li>훈제하거나 숯불에 구운 고기는 속까지 익어도 분홍색 띠가 생겨요.</li>
<li>닭고기 뼈 주변이 붉은 것은 뼈의 색소 때문일 수 있어요.</li>
</ul>
<p>그래서 가장 정확한 방법은 <strong>식품용 온도계</strong>예요. 온도계가 없다면 아래 신호를 함께 확인해요.</p>
<div class="tbl"><table>
<thead><tr><th>식품</th><th>다 익은 신호</th></tr></thead>
<tbody>
<tr><td>닭고기</td><td>가장 두꺼운 부분을 찔렀을 때 나오는 육즙이 맑고, 살에 붉은 기가 없어요</td></tr>
<tr><td>다진 고기 패티</td><td>가운데를 갈랐을 때 육즙이 맑고 속까지 뜨거워요</td></tr>
<tr><td>생선</td><td>살이 불투명하고 결대로 쉽게 부서져요</td></tr>
<tr><td>달걀</td><td>흰자와 노른자가 모두 굳었어요</td></tr>
<tr><td>조개류</td><td>껍데기가 열리고 몇 분 더 끓였어요. 끝까지 안 열리는 것은 버려요</td></tr>
</tbody></table></div>

<h2>온도계 쓰는 법</h2>
<ol>
<li>고기의 <strong>가장 두꺼운 부분 가운데</strong>에 꽂아요. 뼈나 기름 덩어리에 닿지 않게 해요.</li>
<li>얇은 패티는 옆에서 가운데 방향으로 꽂아요.</li>
<li>숫자가 멈출 때까지 몇 초 기다려요.</li>
<li>쓰고 나면 뜨거운 비눗물로 씻어요. 덜 익은 고기에 꽂았던 온도계는 다른 음식에 쓰기 전에 꼭 씻어요.</li>
</ol>

<h2>생닭은 씻지 않아요</h2>
<p>생닭을 물로 씻으면 균이 사라지는 게 아니라 물방울과 함께 <strong>싱크대, 주변 그릇, 옷</strong>에 튀어요. 균은 조리하면서 열로 없애는 거예요. 핏물이나 이물질이 신경 쓰이면 키친타월로 닦아 내요. 꼭 씻어야 한다면 물을 약하게 틀고, 씻은 뒤 싱크대와 주변을 세제로 닦아요.</p>

<h2>교차오염 막기</h2>
<ul>
<li><strong>칼과 도마를 나눠 써요.</strong> 날고기·생선용과 채소·과일용을 색이나 모양으로 구분해요.</li>
<li>순서를 정할 수 있다면 <strong>채소 → 육류 → 생선 → 닭고기</strong> 순서로 손질해요.</li>
<li>날고기를 만진 손으로 휴대폰, 양념통, 냉장고 손잡이를 만지지 않아요. 비누로 손을 씻어요.</li>
<li>고기를 재웠던 양념은 그대로 소스로 쓰지 말고, 끓여서 쓰거나 따로 덜어 둔 양념을 써요.</li>
<li>냉장고에서는 날고기를 <strong>맨 아래 칸</strong>에 두어 핏물이 다른 음식에 떨어지지 않게 해요.</li>
</ul>

<div class="box warn"><span class="h">덜 익은 음식을 특히 피해야 하는 사람</span>
<p><strong>임신부, 영유아, 어르신, 면역이 약한 사람</strong>은 식중독이 더 심하게 올 수 있어요. 반숙 달걀, 덜 익은 고기, 날생선, 육회를 피하는 것이 좋아요. 임신 중 리스테리아 감염은 태아에게 영향을 줄 수 있어요.</p></div>

<h2>돼지고기는 속까지 익혀야 할까</h2>
<p>과거에는 돼지고기의 기생충 때문에 바싹 익히라고 했어요. 지금은 사육 환경이 좋아져 기생충 위험은 크게 줄었지만, 살모넬라 같은 세균은 여전히 있을 수 있어요. 덩어리 고기는 63°C 이상에서 3분 두는 기준이 있지만, 가정에서는 온도계 없이 확인하기 어려우니 <strong>속까지 충분히 익히는 것</strong>이 안전해요. 다진 돼지고기는 71°C 이상이에요.</p>

<div class="box"><span class="h">안전 조리 체크리스트</span>
<ol>
<li>식품용 온도계 하나 마련하기</li>
<li>닭 74°C, 다진 고기 71°C 기억하기</li>
<li>생닭은 씻지 말고 닦기</li>
<li>날고기용 칼·도마 따로 쓰기</li>
<li>날고기 만진 뒤 비누로 손 씻기</li>
<li>남은 음식은 속까지 뜨겁게 데우기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>스테이크를 미디엄 레어로 먹어도 되나요?</dt>
<dd>덩어리 소고기는 균이 주로 겉면에 있어 겉을 충분히 구우면 위험이 낮아요. 다만 다진 고기로 만든 패티, 칼집을 많이 낸 고기, 연육제를 주입한 고기는 속까지 익혀야 해요. 임신부나 면역이 약한 사람은 충분히 익혀 먹어요.</dd>
<dt>반숙 달걀은 위험한가요?</dt>
<dd>건강한 성인에게는 위험이 낮은 편이지만 살모넬라 가능성이 있어요. 신선하고 금이 가지 않은 달걀을 냉장 보관해 쓰고, 영유아·임신부·어르신은 완숙으로 먹는 것이 좋아요.</dd>
<dt>전자레인지로 익힐 때 주의할 점은요?</dt>
<dd>전자레인지는 고르게 익지 않아 차가운 부분이 남기 쉬워요. 중간에 뒤집거나 섞고, 조리 후 1~2분 두어 열이 퍼지게 한 뒤 여러 곳의 온도를 확인해요.</dd>
</dl>
