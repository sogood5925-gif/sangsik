  data-title="모기와 진드기가 옮기는 병: 쯔쯔가무시증·SFTS·일본뇌염·말라리아 예방법"
  data-thumb="2주|야외활동 후 관찰"
  data-summary="가을 성묘와 등산, 캠핑 뒤 열이 난다면 진드기 매개 감염병을 떠올려야 해요. 모기와 진드기가 옮기는 국내 감염병의 특징과 시기, 기피제 고르는 법, 진드기를 안전하게 떼는 법, 야외활동 후 병원에 가야 하는 신호를 정리했어요."
  data-tags="진드기,모기,쯔쯔가무시,SFTS,생활정보">
<p class="lead">모기는 여름, 진드기는 봄부터 가을까지 활동해요. 대부분은 가려움으로 끝나지만, 일부는 고열과 심한 합병증을 일으키는 감염병을 옮겨요. 특히 가을철 풀숲 활동 뒤의 열은 가볍게 넘기지 않는 게 좋아요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>풀숲에 갈 때는 <strong>긴 옷, 기피제, 돗자리</strong>를 챙기고 풀밭에 바로 앉거나 눕지 않아요.</li>
<li>돌아오면 <strong>바로 샤워하고 옷을 세탁</strong>하며 몸에 진드기가 붙었는지 살펴요.</li>
<li>물린 진드기는 <strong>핀셋으로 머리 가까이 잡아 천천히</strong> 떼요.</li>
<li>야외활동 후 <strong>2주 안에 열이 나면</strong> 활동 사실을 알리고 진료를 받아요.</li>
</ul></div>

<h2>국내에서 알아 둘 감염병</h2>
<div class="tbl"><table>
<thead><tr><th>병</th><th>옮기는 것</th><th>많은 시기</th><th>특징</th></tr></thead>
<tbody>
<tr><td>쯔쯔가무시증</td><td>털진드기 유충</td><td>10~11월</td><td>발열, 발진, 물린 자리의 <strong>검은 딱지(가피)</strong>. 항생제로 치료돼요</td></tr>
<tr><td>중증열성혈소판감소증후군(SFTS)</td><td>작은소참진드기 등</td><td>4~11월</td><td>고열, 구토, 설사, 혈소판 감소. <strong>치명률이 높은 편</strong>이고 치료는 주로 증상을 조절하는 방식이에요</td></tr>
<tr><td>일본뇌염</td><td>작은빨간집모기</td><td>8~10월</td><td>대부분 증상이 없지만 드물게 뇌염으로 심각한 후유증이 남아요. 예방접종이 있어요</td></tr>
<tr><td>말라리아(삼일열)</td><td>얼룩날개모기</td><td>5~10월</td><td>경기·인천·강원 북부 접경 지역에서 주로 발생. 오한과 고열이 주기적으로 반복돼요</td></tr>
</tbody>
<caption>질병관리청 진드기·모기 매개 감염병 예방 수칙을 바탕으로 정리</caption></table></div>
<p>해외여행에서는 뎅기열, 치쿤구니야, 지카바이러스, 열대열 말라리아처럼 국내와 다른 모기 매개 감염병도 주의해야 해요.</p>

<h2>야외에 나가기 전</h2>
<ul>
<li><strong>긴 소매, 긴 바지</strong>를 입고 바지 끝을 양말 안에 넣어요. 밝은 색 옷을 입으면 진드기가 붙은 것이 잘 보여요.</li>
<li>드러난 피부와 옷에 <strong>기피제</strong>를 발라요.</li>
<li>풀밭에 앉을 때는 <strong>돗자리</strong>를 깔고, 쓴 뒤에는 털어서 햇볕에 말려요.</li>
<li>풀숲에 옷을 벗어 두거나 용변을 보지 않아요.</li>
<li>등산로를 벗어난 풀숲으로 들어가지 않아요.</li>
</ul>

<h2>기피제 고르는 법</h2>
<div class="tbl"><table>
<thead><tr><th>성분</th><th>특징</th></tr></thead>
<tbody>
<tr><td>디에틸톨루아미드(DEET)</td><td>오래 쓰인 성분으로 모기·진드기에 효과가 확인됐어요. 농도가 높을수록 지속 시간이 길어요</td></tr>
<tr><td>이카리딘</td><td>냄새와 끈적임이 적고 효과는 DEET와 비슷한 수준이에요</td></tr>
<tr><td>IR3535</td><td>자극이 적은 편이지만 지속 시간이 짧은 제품이 많아요</td></tr>
<tr><td>레몬 유칼립투스 오일(PMD)</td><td>식물 유래 성분이에요. 어린 아이에게는 쓰지 않도록 안내돼요</td></tr>
</tbody>
<caption>식품의약품안전처 기피제 안전 사용 안내, 미국 환경보호청(EPA) 기피제 정보를 바탕으로 정리</caption></table></div>
<ul>
<li>의약외품으로 허가된 제품인지 확인하고, <strong>사용 연령과 사용 횟수</strong> 표시를 지켜요. 어린 아기에게는 쓰지 않는 제품이 많아요.</li>
<li>눈, 입, 상처에는 바르지 않아요. 아이에게는 어른 손에 덜어 발라 줘요.</li>
<li>자외선 차단제를 함께 쓸 때는 <strong>차단제를 먼저</strong>, 기피제를 나중에 발라요.</li>
<li>집에 돌아오면 비누로 씻어 내요.</li>
</ul>

<h2>돌아온 뒤</h2>
<ol>
<li>입었던 옷은 털어서 바로 세탁해요.</li>
<li>샤워하면서 <strong>머리카락 속, 귀 뒤, 겨드랑이, 무릎 뒤, 사타구니, 허리 벨트 자리</strong>처럼 진드기가 잘 붙는 곳을 살펴요.</li>
<li>반려견과 함께 다녀왔다면 털 속도 확인해요.</li>
</ol>

<h2>진드기가 물고 있다면</h2>
<div class="box note"><span class="h">이렇게 떼요</span>
<ol>
<li>끝이 가는 <strong>핀셋</strong>으로 피부에 최대한 가까이, 진드기 머리 쪽을 잡아요.</li>
<li>비틀거나 짜지 말고 <strong>천천히 똑바로</strong> 당겨요.</li>
<li>떼어 낸 자리를 소독하고 손을 씻어요.</li>
<li>입 부분이 피부에 남았거나 떼기 어려우면 억지로 하지 말고 의원에서 제거해요.</li>
</ol>
<p>손으로 비틀어 떼거나 불, 알코올, 기름을 발라 떨어뜨리려 하면 진드기가 체액을 더 뱉어 낼 수 있어요.</p></div>

<h2>병원에 가야 하는 신호</h2>
<div class="box warn"><span class="h">야외활동 후 2주 안에 이런 증상이 있으면</span>
<ul>
<li><strong>38°C 이상의 열</strong>, 오한, 심한 피로</li>
<li>구토, 설사, 식욕 저하</li>
<li>온몸에 퍼지는 발진, 물린 자리의 검은 딱지</li>
<li>의식이 흐려지거나 심한 두통, 목이 뻣뻣함</li>
</ul>
<p>진료할 때 <strong>언제, 어디서 풀숲 활동이나 성묘·등산·캠핑·농작업을 했는지</strong> 꼭 알려 주세요. 감기로 오해해 진단이 늦어지는 경우가 많아요.</p></div>

<h2>모기 줄이기</h2>
<ul>
<li>방충망의 찢어진 곳을 막고, 모기장을 써요.</li>
<li>집 주변 화분 받침, 폐타이어, 빈 용기에 고인 물을 없애요. 모기는 고인 물에 알을 낳아요.</li>
<li>모기가 많은 새벽과 해 질 녘에는 야외활동을 줄여요.</li>
<li>어린이는 일본뇌염 국가예방접종을 일정에 맞게 받아요. 접종하지 않은 성인도 위험 지역에 가거나 농촌에 오래 머문다면 의사와 상담해요.</li>
</ul>

<div class="box"><span class="h">성묘·등산 전 체크리스트</span>
<ol>
<li>긴 옷, 밝은 색 옷, 바지 끝 양말 속에</li>
<li>기피제 챙기고 사용 연령 확인</li>
<li>돗자리 가져가 풀밭에 바로 앉지 않기</li>
<li>귀가 후 바로 샤워·세탁·몸 확인</li>
<li>2주 동안 열이 나면 활동 사실 알리고 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>진드기에 물리면 모두 병에 걸리나요?</dt>
<dd>아니에요. 감염병을 가진 진드기는 일부예요. 하지만 어떤 진드기인지 겉보기로 알 수 없으니 물린 뒤 2주 정도는 열과 몸 상태를 살펴요.</dd>
<dt>SFTS는 사람끼리도 옮나요?</dt>
<dd>일반적인 접촉으로는 잘 옮지 않지만, 환자의 혈액이나 체액에 직접 닿으면 옮은 사례가 있어요. 환자를 간병하거나 치료할 때는 장갑 등 보호 장비를 써요.</dd>
<dt>옷에 뿌리는 기피제는 효과가 있나요?</dt>
<dd>옷에 쓰도록 허가된 제품은 진드기가 옷을 타고 오르는 것을 줄이는 데 도움이 돼요. 제품 표시에 따라 옷과 피부 중 어디에 쓰는지 확인해요.</dd>
</dl>
