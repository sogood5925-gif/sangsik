  data-thumb="40mg/kg|아스파탐 일일섭취허용량"
  data-summary="제로 콜라, 무설탕 과자에 들어가는 감미료는 설탕을 줄이는 데 도움이 되지만 논란도 많아요. 아스파탐·수크랄로스·스테비아·알룰로스·에리스리톨 등 감미료별 특징과 일일섭취허용량, 2023년 아스파탐 발암 분류의 의미, 세계보건기구가 체중 조절용으로 권하지 않는 이유, 당알코올 설사와 페닐케톤뇨증 주의를 정리했어요."

<p class="lead">단맛은 그대로, 열량은 거의 없는 감미료는 설탕을 줄이려는 사람에게 반가운 선택이에요. 그런데 "아스파탐이 발암 물질이 됐다"는 뉴스 이후 제로 음료를 마셔도 되는지 걱정하는 사람도 많아요. 감미료는 종류마다 성격이 다르고, 위험의 크기도 '얼마나 먹느냐'에 따라 달라요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>국내에서 쓰이는 감미료는 <strong>일일섭취허용량(ADI)</strong> 안에서 안전하다고 평가돼요. 보통 섭취량은 이보다 훨씬 적어요.</li>
<li>2023년 아스파탐의 <strong>'발암 가능 물질(2B)' 분류</strong>는 근거가 제한적이라는 뜻이고, 허용량은 그대로 유지됐어요.</li>
<li>세계보건기구는 감미료를 <strong>체중 조절 목적으로 권하지 않아요.</strong> 장기적인 체중 감량 효과가 뚜렷하지 않기 때문이에요.</li>
<li>목표는 감미료로 바꾸는 것보다 <strong>단맛 자체에 익숙해진 입맛을 줄이는 것</strong>이에요.</li>
</ul></div>

<h2>감미료의 종류</h2>

<h2>일일섭취허용량은 얼마나 될까</h2>
<p>일일섭취허용량은 <strong>평생 매일 먹어도</strong> 건강에 문제가 없다고 판단되는 양이에요. 동물 실험에서 영향이 없던 양의 100분의 1 정도로 넉넉하게 여유를 두고 정해요.</p>
<ul>
<li>체중 60kg인 사람의 아스파탐 허용량은 하루 2,400mg이에요.</li>
<li>다이어트 콜라 한 캔에 든 아스파탐은 보통 200mg 안팎이라, 허용량에 이르려면 <strong>하루 10캔 이상</strong>을 매일 마셔야 해요.</li>
<li>식품의약품안전처 조사에서 한국인의 감미료 섭취량은 허용량보다 훨씬 낮은 수준이었어요.</li>
</ul>

<h2>아스파탐 발암 분류의 의미</h2>
<p>2023년 국제암연구소(IARC)는 아스파탐을 <strong>2B군(발암 가능 물질)</strong>으로 분류했어요. 2B군은 '사람에게 암을 일으킨다는 근거가 제한적'이라는 뜻으로, 같은 분류에 알로에 베라 추출물, 김치 같은 절임 채소도 있어요. 분류는 위험의 크기가 아니라 근거의 강도를 나타내요.</p>
<p>같은 시기 합동식품첨가물전문가위원회(JECFA)는 자료를 다시 검토하고 <strong>일일섭취허용량 40mg/kg을 그대로 유지</strong>했어요. 허용량 안에서 먹는다면 걱정할 수준은 아니라는 뜻이에요.</p>

<h2>체중 조절에는 왜 권하지 않을까</h2>
<p>세계보건기구는 2023년 지침에서 설탕 대체 감미료를 <strong>체중 조절이나 비감염성 질환 예방 목적으로 쓰지 않도록</strong> 권고했어요(조건부 권고).</p>
<ul>
<li>짧은 기간 연구에서는 체중이 조금 줄었지만, 긴 기간에는 뚜렷한 효과가 없었어요.</li>
<li>관찰 연구에서는 감미료를 많이 먹는 사람의 당뇨, 심혈관 질환 위험이 높았는데, 원래 건강 문제가 있는 사람이 감미료를 더 먹었을 가능성도 있어 해석에 주의가 필요해요.</li>
<li>단맛에 계속 익숙해져 단 음식을 찾는 습관이 유지될 수 있다는 우려도 있어요.</li>
</ul>
<p>당뇨가 있는 사람에게 설탕 음료 대신 제로 음료는 혈당 관리에 도움이 되는 선택이 될 수 있어요. 가장 좋은 건 물이나 무가당 차예요.</p>

<h2>알아 둘 주의점</h2>
<div class="box warn"><span class="h">이런 경우 조심해요</span>
<ul>
<li><strong>페닐케톤뇨증:</strong> 아스파탐은 페닐알라닌을 만들어 이 유전 질환이 있는 사람은 피해야 해요. 제품에 '페닐알라닌 함유' 표시가 있어요.</li>
<li><strong>당알코올·알룰로스:</strong> 한 번에 많이 먹으면 설사와 복통이 생겨요. 과민성 대장 증후군이 있으면 증상이 악화될 수 있어요.</li>
<li><strong>에리스리톨:</strong> 혈중 에리스리톨이 높은 사람의 혈전·심혈관 사건이 많았다는 연구(2023)가 있어요. 인과관계는 아직 확인되지 않았지만, 심혈관 질환이 있다면 많이 먹지 않는 게 좋아요.</li>
<li><strong>반려견:</strong> 자일리톨은 개에게 저혈당과 간 손상을 일으켜요. 자일리톨 껌과 과자를 반려견 손이 닿지 않게 둬요.</li>
</ul></div>

<h2>단맛 줄이기 연습</h2>
<ul>
<li>단 음료는 <strong>제로 음료 → 탄산수 → 물</strong> 순서로 단계적으로 바꿔요.</li>
<li>커피와 차에 넣는 시럽·설탕을 조금씩 줄여요. 2~3주면 입맛이 적응해요.</li>
<li>디저트는 과일이나 무가당 요구르트로 바꿔요.</li>
<li>'무설탕' 과자도 탄수화물과 열량이 있을 수 있어 영양성분표를 확인해요.</li>
</ul>

<div class="box"><span class="h">감미료 체크리스트</span>
<ol>
<li>설탕 음료 대신 제로 음료는 괜찮은 중간 단계</li>
<li>최종 목표는 물·무가당 차</li>
<li>당알코올은 한 번에 많이 먹지 않기</li>
<li>페닐케톤뇨증이면 아스파탐 표시 확인</li>
<li>무설탕 제품도 영양성분표 확인</li>
<li>자일리톨은 반려견에게서 멀리</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>제로 음료를 마시면 인슐린이 나오나요?</dt>
<dd>대부분의 연구에서 감미료만으로는 혈당과 인슐린이 거의 오르지 않았어요. 일부 연구는 장내 미생물이나 식욕에 영향을 줄 수 있다고 하지만 결과가 엇갈려요.</dd>
<dt>임신 중 감미료를 먹어도 되나요?</dt>
<dd>허용량 안의 섭취는 안전하다고 평가돼요. 다만 임신 중에는 물, 우유, 무가당 음료가 더 좋은 선택이에요. 사카린은 태반을 통과해 일부 기관은 임신 중 제한을 권하기도 해요.</dd>
<dt>스테비아는 천연이니 더 안전한가요?</dt>
<dd>'천연'이라는 사실이 더 안전하다는 뜻은 아니에요. 스테비아도 허용량이 정해진 첨가물이고, 대부분의 감미료가 허용량 안에서 안전하게 평가돼요.</dd>
</dl>
