  data-summary="집은 가장 편한 곳이지만, 어린이와 어르신 사고가 가장 많이 일어나는 곳이기도 해요. 창문 추락과 가구 넘어짐, 동전 건전지와 자석 삼킴, 욕조 익수, 영아 안전 수면, 어르신 낙상과 화재 예방, 응급안전안심서비스까지 방마다 점검할 것을 정리했어요."

<p class="lead">아이 사고는 어른이 잠깐 눈을 돌린 사이에, 어르신 사고는 익숙한 집 안에서 일어나요. 사고가 난 뒤에 대처하는 것보다 집을 한 번 둘러보고 위험을 치우는 것이 훨씬 쉬워요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>아이는 <strong>창문 추락, 가구 넘어짐, 삼킴, 익수, 화상</strong>을 조심해요.</li>
<li><strong>동전 모양 건전지</strong>와 <strong>자석</strong>을 삼키면 몇 시간 안에 심각한 손상이 생길 수 있어요. 바로 응급실이에요.</li>
<li>아기는 <strong>등을 대고, 단단하고 평평한 곳에서, 푹신한 물건 없이</strong> 재워요.</li>
<li>어르신은 <strong>욕실과 밤길 낙상</strong>, 화재와 저온 화상을 조심해요.</li>
</ul></div>

<h2>아이가 있는 집</h2>
<h3>추락</h3>
<ul>
<li>창문에 <strong>창문 잠금장치나 안전 방충망</strong>을 달아요. 방충망은 아이 체중을 버티지 못해요.</li>
<li>창가와 베란다 난간 근처에 <strong>침대, 소파, 의자, 화분대</strong>처럼 딛고 올라갈 수 있는 가구를 두지 않아요.</li>
<li>기저귀 교환대나 침대 위에 아기를 두고 잠깐이라도 자리를 비우지 않아요.</li>
<li>계단이 있다면 안전문을 달아요.</li>
</ul>
<h3>가구 넘어짐</h3>
<p>아이가 서랍을 계단처럼 딛고 오르거나 TV를 잡아당기다 가구가 넘어지는 사고가 반복돼요. <strong>서랍장, 책장, TV</strong>는 벽에 고정 장치로 고정해요. 무거운 물건은 아래 칸에 넣어요.</p>
<h3>삼킴과 질식</h3>
<div class="box warn"><span class="h">동전 건전지와 자석은 즉시 응급실</span>
<ul>
<li><strong>동전 모양 리튬 건전지</strong>는 식도에 걸리면 전류가 흘러 <strong>2시간 안에</strong> 심한 화상을 일으킬 수 있어요. 리모컨, 체중계, 장난감, 자동차 키에 많이 들어 있어요. 삼킨 것이 의심되면 증상이 없어도 바로 응급실로 가요.</li>
<li><strong>강한 자석</strong>을 두 개 이상 삼키면 장벽을 사이에 두고 서로 붙어 장에 구멍을 낼 수 있어요.</li>
</ul></div>
<ul>
<li>휴지심을 통과할 만큼 작은 물건은 아이가 삼킬 수 있다고 생각해요. 동전, 단추, 작은 장난감 부품을 바닥에 두지 않아요.</li>
<li>땅콩, 통포도, 방울토마토, 떡, 사탕은 어린아이에게 잘게 잘라 주고, 앉아서 먹게 해요.</li>
<li><strong>비닐봉지</strong>는 묶어서 보관하고, <strong>블라인드와 커튼 줄</strong>은 아이 손이 닿지 않게 짧게 감거나 고정해요. 줄이 목에 감기는 사고가 있어요.</li>
</ul>
<h3>물</h3>
<ul>
<li>아이는 <strong>몇 cm 깊이의 물</strong>에서도 소리 없이 빠질 수 있어요. 욕조에 물을 받아 둔 채 자리를 비우지 않고, 목욕 중에는 전화를 받으러 가지 않아요.</li>
<li>사용한 욕조와 대야의 물은 바로 빼요. 변기 뚜껑을 닫아 두어요.</li>
</ul>
<h3>화상</h3>
<ul>
<li>뜨거운 음료는 식탁 가장자리에 두지 않고, 아이를 안은 채 뜨거운 음료를 마시지 않아요. 식탁보는 아이가 잡아당길 수 있어요.</li>
<li>전기밥솥과 가습기의 <strong>뜨거운 증기</strong>, 다리미, 전기레인지 상판을 조심해요.</li>
<li>목욕물은 팔꿈치나 온도계로 확인하고 찬물부터 받아요.</li>
</ul>
<h3>중독</h3>
<ul>
<li>세제, 락스, 세탁 캡슐, 약, 담배와 <strong>전자담배 니코틴 액상</strong>은 잠금장치가 있는 높은 곳에 보관해요.</li>
<li>약을 사탕이라고 부르지 않아요.</li>
</ul>
<h3>그 밖에</h3>
<ul>
<li>콘센트 보호 마개, 문 끼임 방지 장치를 달아요.</li>
<li>차에서는 나이와 체격에 맞는 <strong>카시트</strong>를 뒷좌석에 설치해요.</li>
</ul>

<h2>아기의 안전한 잠자리</h2>
<div class="tbl"><table>
<thead><tr><th>이렇게</th><th>이건 피해요</th></tr></thead>
<tbody>
<tr><td><strong>등을 대고</strong> 똑바로 눕혀 재우기</td><td>엎드려 재우기, 옆으로 재우기</td></tr>
<tr><td><strong>단단하고 평평한</strong> 매트리스와 몸에 맞는 시트</td><td>푹신한 소파, 쿠션, 물침대, 어른 침대</td></tr>
<tr><td>아기 침대에는 <strong>아무것도 두지 않기</strong></td><td>베개, 이불, 범퍼, 인형</td></tr>
<tr><td>부모와 <strong>같은 방, 다른 침대</strong></td><td>어른과 한 침대에서 함께 자기 (특히 부모가 피곤하거나 술을 마셨을 때)</td></tr>
<tr><td>적당한 실내 온도, 너무 두껍지 않은 옷</td><td>과하게 싸매기, 모자 씌워 재우기</td></tr>
<tr><td>금연 환경</td><td>집 안 흡연</td></tr>
</tbody>
<caption>미국소아과학회(AAP) 영아 안전 수면 권고를 바탕으로 정리</caption></table></div>
<p>이 원칙은 영아 돌연사 증후군과 질식 사고의 위험을 줄여요. 아기가 스스로 뒤집을 수 있게 되더라도 처음에는 등을 대고 눕혀요.</p>

<h2>어르신이 있는 집</h2>
<h3>낙상 예방</h3>
<p>노인의 낙상은 골절, 입원, 거동 저하로 이어지는 경우가 많아요. 대부분 집 안에서 일어나요.</p>
<div class="tbl"><table>
<thead><tr><th>장소</th><th>점검할 것</th></tr></thead>
<tbody>
<tr><td>욕실</td><td>미끄럼 방지 매트나 타일 코팅, 변기와 욕조 옆 <strong>손잡이</strong>, 샤워 의자</td></tr>
<tr><td>침실</td><td>침대 높이(앉았을 때 발이 바닥에 닿게), 침대 옆 조명 스위치, 화장실 가는 길 <strong>야간등</strong></td></tr>
<tr><td>거실·복도</td><td>전선, 미끄러운 러그, 문턱, 바닥의 물건 치우기</td></tr>
<tr><td>계단·현관</td><td>양쪽 난간, 밝은 조명, 계단 끝 표시</td></tr>
<tr><td>주방</td><td>자주 쓰는 물건은 허리~눈높이에. 발판에 올라가지 않게</td></tr>
</tbody></table></div>
<ul>
<li>뒤꿈치가 있고 미끄럽지 않은 실내화를 신어요.</li>
<li>어지럼을 일으킬 수 있는 약(수면제, 일부 혈압약 등)을 의사·약사와 점검해요.</li>
<li>시력과 청력을 정기적으로 확인해요.</li>
<li>근력과 균형 운동을 꾸준히 해요.</li>
</ul>
<h3>화재와 화상</h3>
<ul>
<li>음식을 올려두고 잊는 사고를 막으려면 <strong>가스 타이머 콕</strong>이나 자동 소화 장치, 가스 자동 차단기를 달 수 있어요.</li>
<li>전기장판과 핫팩은 <strong>저온 화상</strong>을 일으킬 수 있어요. 낮은 온도로, 타이머를 맞추고, 직접 피부에 오래 닿지 않게 해요.</li>
<li>화재감지기를 설치하고 작동을 확인해요.</li>
</ul>
<h3>약과 건강 관리</h3>
<ul>
<li>요일별 약통과 알람으로 약을 빠뜨리거나 두 번 먹는 실수를 줄여요.</li>
<li>한여름과 한겨울에는 실내 온도를 적절히 유지하고 물을 자주 마시게 해요.</li>
</ul>
<h3>혼자 사는 어르신</h3>
<p>보건복지부의 <strong>응급안전안심서비스</strong>는 혼자 사는 어르신의 집에 화재·활동 감지 장치와 응급 호출 장치를 설치해, 위급할 때 119와 담당 기관에 자동으로 알리는 서비스예요. 대상과 신청 방법은 주민센터나 지역 노인복지기관에 문의해요. 가족과 이웃의 정기적인 안부 연락도 큰 안전망이에요.</p>

<div class="box"><span class="h">방마다 5분 점검표</span>
<ol>
<li>창가·베란다 난간 근처 가구 치우고 창문 잠금장치 확인</li>
<li>서랍장·책장·TV 벽 고정</li>
<li>동전 건전지가 든 리모컨·장난감의 배터리 덮개 나사 확인</li>
<li>세제·약·니코틴 액상 잠금 보관</li>
<li>욕실 미끄럼 방지와 손잡이, 복도 야간등</li>
<li>바닥의 전선·러그·문턱 정리</li>
<li>화재감지기 작동 버튼 눌러보기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>아이가 무언가를 삼켰는데 멀쩡해 보여요.</dt>
<dd>동전 건전지, 자석, 날카로운 물건, 세제는 증상이 없어도 바로 응급실로 가요. 그 밖의 작은 물건도 기침, 침 흘림, 삼키기 힘들어함, 구토가 있으면 진료를 받아요.</dd>
<dt>어르신이 넘어졌는데 혼자 일어나셨어요. 괜찮을까요?</dt>
<dd>엉덩이나 허리 통증이 계속되거나, 걷기가 불편하거나, 머리를 부딪쳤다면 진료를 받아요. 특히 항응고제를 드신다면 머리 부상 후 며칠 동안 두통, 졸림, 구토가 없는지 살펴요.</dd>
<dt>아기가 엎드려 자는 걸 더 좋아해요.</dt>
<dd>엎드려 자는 자세는 영아 돌연사 위험을 높여요. 잠들 때는 등을 대고 눕히고, 깨어 있을 때 어른이 지켜보는 가운데 엎드려 노는 시간(터미 타임)을 가지면 목과 어깨 근육 발달에 도움이 돼요.</dd>
</dl>
