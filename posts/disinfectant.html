  data-title="소독제·살균제 바르게 쓰기: 뿌리지 말고 닦기, 표백제 희석, 절대 섞으면 안 되는 조합"
  data-thumb="1:50|표백제 희석 예"
  data-summary="소독제는 병원균을 줄여 주지만 잘못 쓰면 우리 몸을 먼저 해칠 수 있어요. 세정과 소독과 살균의 차이, 염소계 표백제와 알코올을 쓰는 법과 희석 비율, 공기 중에 뿌리면 안 되는 이유, 섞으면 유독가스가 생기는 조합, 사고가 났을 때 대처, 제품 고를 때 확인할 표시를 정리했어요."
  data-tags="소독제,살균제,표백제,유독가스,생활정보">
<p class="lead">감염병이 돌 때마다 소독제 판매가 늘어요. 그런데 소독은 '많이, 세게' 할수록 좋은 일이 아니에요. 먼저 닦아 내고, 필요한 곳에만, 정해진 농도로 쓰는 것이 우리 가족의 호흡기와 피부를 지키면서 병원균도 줄이는 방법이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>평소 집 청소는 <strong>세제와 물로 닦는 것</strong>으로 충분한 경우가 많아요.</li>
<li>소독제는 <strong>뿌리지 말고 천에 적셔 닦아요.</strong> 공기나 사람에게 뿌리지 않아요.</li>
<li>염소계 표백제는 <strong>찬물에 희석</strong>하고, <strong>산성 세정제·암모니아와 절대 섞지 않아요.</strong></li>
<li>살균·소독을 내세운 제품은 <strong>승인 표시</strong>를 확인하고 사용법을 지켜요.</li>
</ul></div>

<h2>세정·소독·살균은 달라요</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>뜻</th><th>예</th></tr></thead>
<tbody>
<tr><td>세정(청소)</td><td>때와 먼지, 병원균을 물리적으로 닦아 없애요</td><td>세제와 물로 닦기</td></tr>
<tr><td>소독</td><td>표면의 병원균 수를 크게 줄여요</td><td>희석한 염소계 표백제, 알코올</td></tr>
<tr><td>살균·멸균</td><td>미생물을 죽이거나 모두 없애요</td><td>병원의 고압 증기 멸균 등</td></tr>
</tbody>
<caption>질병관리청 환경 청소·소독 안내, 미국 질병통제예방센터(CDC) 가정 소독 안내를 바탕으로 정리</caption></table></div>
<p>때와 기름이 묻은 표면에는 소독제가 잘 듣지 않아요. 그래서 <strong>먼저 닦고, 그다음 소독</strong>하는 순서가 중요해요.</p>

<h2>언제 소독이 필요할까</h2>
<ul>
<li>가족 중에 <strong>장염(노로바이러스 등)</strong> 환자가 생겨 구토물·설사를 치울 때</li>
<li>독감 등 감염병 환자가 있을 때 자주 만지는 곳(문손잡이, 스위치, 리모컨, 수도꼭지)</li>
<li>날고기를 손질한 도마와 조리대</li>
<li>평소에는 주 1~2회 자주 만지는 곳을 세제로 닦는 정도면 충분해요.</li>
</ul>

<h2>염소계 표백제 쓰는 법</h2>
<div class="tbl"><table>
<thead><tr><th>용도</th><th>농도</th><th>만드는 예(원액 약 4~5% 기준)</th></tr></thead>
<tbody>
<tr><td>일반 표면 소독</td><td class="num">약 0.1%(1,000ppm)</td><td>물 1L + 표백제 약 20mL(약 1:50)</td></tr>
<tr><td>구토물·설사 오염 부위</td><td class="num">약 0.1~0.5%</td><td>제품 설명과 방역 안내에 따라 더 진하게</td></tr>
<tr><td>식기·도마 담그기</td><td class="num">더 묽게</td><td>제품의 식기 소독 용법을 따르고 물로 충분히 헹궈요</td></tr>
</tbody>
<caption>질병관리청 감염병 환자 환경 소독 안내를 바탕으로 정리. 원액 농도는 제품마다 달라 라벨의 유효 염소 농도와 용법을 먼저 확인해요</caption></table></div>
<ul>
<li><strong>찬물</strong>에 희석해요. 뜨거운 물은 성분이 빨리 날아가요.</li>
<li>희석액은 시간이 지나면 효과가 떨어져요. <strong>그날 만들어 그날 써요.</strong></li>
<li>고무장갑, 마스크를 쓰고 창문을 열어요.</li>
<li>닦은 뒤 몇 분 두었다가 물걸레로 다시 닦아 내요. 금속은 부식될 수 있어요.</li>
<li>빈 음료수 병에 담지 않아요. 누가 마실 수 있어요.</li>
</ul>

<h2>알코올 소독제</h2>
<p>에탄올 농도 <strong>60~80%</strong>일 때 소독 효과가 좋아요. 휴대폰, 전자기기처럼 물을 쓰기 어려운 곳에 적당해요. 불이 잘 붙으니 가스레인지 근처에서 쓰지 않고, 쓴 뒤 완전히 마를 때까지 불을 가까이 하지 않아요. 손 소독제는 손이 눈에 띄게 더러울 때는 효과가 떨어져요. 이럴 때는 비누로 씻어요.</p>

<h2>뿌리지 말아야 하는 이유</h2>
<p>소독제를 공기 중에 분무하면 작은 방울이 코와 폐로 들어가요. 표면에 골고루 닿지도 않아 소독 효과도 떨어져요. 가습기 살균제 사고에서 보았듯, 표면에 쓰는 성분이라도 <strong>들이마시면 전혀 다른 피해</strong>를 줄 수 있어요. 소독제는 천에 적셔 닦는 방식으로 쓰고, 사람과 반려동물에게 뿌리지 않아요.</p>

<div class="box warn"><span class="h">절대 섞지 마세요</span>
<ul>
<li><strong>염소계 표백제 + 산성 세정제</strong>(곰팡이 제거제 일부, 변기 세정제, 식초, 구연산): 염소 가스가 생겨요.</li>
<li><strong>염소계 표백제 + 암모니아</strong>(일부 유리 세정제, 소변): 클로라민 가스가 생겨요.</li>
<li><strong>염소계 표백제 + 알코올</strong>: 유해 물질이 생길 수 있어요.</li>
</ul>
<p>섞은 뒤 <strong>눈물, 기침, 가슴 답답함</strong>이 생기면 즉시 밖으로 나가 신선한 공기를 마시고, 숨이 차면 119에 연락해요. 좁은 화장실에서 여러 세정제를 번갈아 쓸 때는 한 가지를 쓰고 충분히 헹군 뒤 다음 것을 써요.</p></div>

<h2>피부와 눈에 닿았을 때</h2>
<ul>
<li>피부: 흐르는 물로 15분 이상 씻어요. 따갑거나 붉어지면 진료를 받아요.</li>
<li>눈: 콘택트렌즈를 빼고 흐르는 물로 15분 이상 씻은 뒤 안과에 가요.</li>
<li>삼켰을 때: 억지로 토하게 하지 말고 제품을 들고 병원에 가요.</li>
</ul>

<h2>제품 고르기</h2>
<p>살균·소독 효과를 내세우는 생활 제품은 법에 따라 안전성과 효과를 확인받아야 해요. 환경부 초록누리 누리집에서 제품의 승인·신고 여부와 성분을 확인할 수 있어요. 손 소독제는 의약외품이라 식품의약품안전처 허가 표시를 확인해요. '인체 무해', '천연 살균' 같은 표현만 보고 고르지 않아요.</p>

<div class="box"><span class="h">소독 체크리스트</span>
<ol>
<li>먼저 세제로 닦고 필요한 곳만 소독</li>
<li>뿌리지 말고 천에 적셔 닦기</li>
<li>표백제는 찬물 희석, 그날 쓰기</li>
<li>산성 세정제·암모니아와 섞지 않기</li>
<li>장갑·마스크 쓰고 창문 열기</li>
<li>음료 병에 담지 않고 아이 손 닿지 않게</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>노로바이러스는 알코올로 소독되나요?</dt>
<dd>노로바이러스는 알코올에 잘 죽지 않아요. 구토물을 치운 뒤에는 희석한 염소계 표백제로 닦고, 손은 비누로 30초 이상 씻어요.</dd>
<dt>식초나 베이킹소다로 소독이 되나요?</dt>
<dd>청소와 냄새 제거에는 도움이 되지만, 소독제만큼 병원균을 줄이지는 못해요. 소독이 필요한 상황에서는 검증된 소독제를 써요.</dd>
<dt>소독용 티슈로 아이 장난감을 닦아도 되나요?</dt>
<dd>입에 넣는 장난감은 세제로 씻고 물로 헹구는 것이 좋아요. 소독했다면 물로 한 번 더 닦아 말려요.</dd>
</dl>
