<p class="lead">귀 안쪽 달팽이관에는 소리를 전기 신호로 바꾸는 작은 털세포가 있어요. 이 세포는 한 번 손상되면 다시 자라지 않아요. 그래서 청력은 잃기 전에 지키는 게 가장 중요해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>이어폰은 <strong>최대 볼륨의 60% 이하로, 한 번에 60분 이내</strong>로 쓰고 쉬어요.</li>
<li><strong>갑자기 한쪽 귀가 안 들리면</strong> 돌발성 난청일 수 있어요. 가능한 빨리 이비인후과로 가요.</li>
<li>중년의 청력 저하는 <strong>치매의 주요 위험 요인</strong>이에요. 보청기가 도움이 될 수 있어요.</li>
<li>귀지는 대부분 저절로 나와요. <strong>면봉으로 파지 않아요.</strong></li>
</ul></div>

<h2>소음은 어떻게 귀를 손상시킬까</h2>
<p>큰 소리는 달팽이관의 털세포를 지나치게 흔들어 손상시켜요. 공연장에서 나온 뒤 귀가 먹먹하고 삐 소리가 나는 건 털세포가 일시적으로 지친 신호예요. 이런 일이 반복되거나 아주 큰 소리에 노출되면 손상이 <strong>영구적</strong>으로 남아요. 소음성 난청은 아프지 않고 서서히 진행해서 알아차리기 어려워요.</p>
<h3>일상 소음의 크기</h3>
<div class="tbl"><table>
<thead><tr><th>소리</th><th>크기 (대략)</th></tr></thead>
<tbody>
<tr><td>조용한 대화</td><td class="num">60dB</td></tr>
<tr><td>도로 교통 소음</td><td class="num">70~85dB</td></tr>
<tr><td>지하철 안</td><td class="num">80~90dB</td></tr>
<tr><td>오토바이, 헤어드라이어 가까이</td><td class="num">90~95dB</td></tr>
<tr><td>콘서트, 클럽, 노래방</td><td class="num">100~110dB 이상</td></tr>
<tr><td>이어폰 최대 볼륨</td><td class="num">100dB 이상 가능</td></tr>
</tbody></table></div>
<p>데시벨은 3dB 오를 때마다 소리 에너지가 두 배가 돼요. 세계보건기구는 성인이 <strong>80dB</strong>에서 일주일 40시간 정도를 안전 한계로 보고, 소리가 커질수록 안전한 시간은 급격히 줄어든다고 설명해요.</p>

<h2>이어폰 안전하게 쓰기</h2>
<div class="box note"><span class="h">60·60 규칙</span>
<ul>
<li>볼륨은 <strong>최대의 60% 이하</strong>로</li>
<li>한 번에 <strong>60분 이내</strong>로 듣고 쉬기</li>
</ul></div>
<ul>
<li>지하철처럼 시끄러운 곳에서는 소음을 이기려고 볼륨을 올리게 돼요. <strong>노이즈 캔슬링</strong> 기능이 있는 이어폰은 낮은 볼륨으로도 잘 들려서 청력 보호에 도움이 돼요.</li>
<li>휴대폰의 <strong>음량 제한</strong>, <strong>청력 보호 알림</strong> 기능을 켜 두어요.</li>
<li>옆 사람에게 내 이어폰 소리가 들린다면 너무 큰 거예요.</li>
<li>잘 때 이어폰을 끼고 자지 않아요.</li>
<li>콘서트, 클럽에서는 <strong>귀마개</strong>를 쓰고, 스피커에서 떨어져 있어요.</li>
</ul>
<p>세계보건기구는 전 세계 청소년과 젊은 성인 상당수가 이어폰과 시끄러운 공연장 때문에 난청 위험에 놓여 있다고 경고해요.</p>

<h2>갑자기 안 들린다면: 돌발성 난청</h2>
<div class="box warn"><span class="h">돌발성 난청은 빨리 치료해야 해요</span>
<p>뚜렷한 이유 없이 <strong>갑자기(보통 한쪽) 귀가 잘 안 들리거나 먹먹해지는 것</strong>을 돌발성 난청이라고 해요. 이명이나 어지럼증이 함께 오기도 해요. 흔히 귀에 물이 찬 것 같다고 느껴 대수롭지 않게 넘기지만, <strong>가능한 빨리</strong>(며칠 안, 늦어도 2주 안) 스테로이드 치료를 시작해야 청력 회복 가능성이 높아져요. 이비인후과를 바로 찾아요.</p></div>

<h2>나이가 들며 오는 난청</h2>
<p>나이가 들면 달팽이관의 털세포가 서서히 줄어 <strong>노화성 난청</strong>이 생겨요. 주로 <strong>높은 음</strong>부터 잘 안 들려서 이런 변화가 나타나요.</p>
<ul>
<li>조용한 곳에서는 괜찮은데 <strong>시끄러운 곳에서 대화를 알아듣기 어려워요.</strong></li>
<li>"뭐라고?"라고 되묻는 일이 늘어요.</li>
<li>TV 볼륨이 점점 커져 가족이 불평해요.</li>
<li>여자와 아이의 높은 목소리가 잘 안 들려요.</li>
<li>전화 통화가 어려워요.</li>
</ul>

<h2>청력과 치매</h2>
<p>국제 학술지 랜싯의 치매 위원회는 <strong>청력 저하</strong>를 중년의 가장 큰 치매 위험 요인 중 하나로 꼽았어요. 잘 들리지 않으면 뇌가 소리를 해석하는 데 더 많은 힘을 쓰고, 대화를 피하면서 사회적으로 고립되기 쉬워요.</p>
<p>미국의 연구(ACHIEVE, 2023)에서는 치매 위험이 높은 노인에게 보청기 등 청력 관리를 제공하자 3년 동안 <strong>인지 기능 저하가 느려졌어요.</strong> 잘 들리는 것은 대화의 즐거움뿐 아니라 뇌 건강과도 연결돼 있어요.</p>

<h2>보청기</h2>
<ul>
<li>보청기는 빨리 시작할수록 적응이 쉬워요. 오래 안 들린 채 지내면 뇌가 소리를 해석하는 능력이 떨어져 적응이 어려워져요.</li>
<li>이비인후과에서 <strong>청력 검사</strong>를 받고 난청의 정도와 원인을 확인한 뒤 맞추는 게 좋아요.</li>
<li>처음 몇 주는 소리가 어색하게 들릴 수 있어요. 조절을 받으며 매일 착용해야 효과가 좋아요.</li>
<li>청각 장애로 등록되면 보청기 구입 비용을 건강보험에서 지원받을 수 있어요.</li>
</ul>

<h2>귀지와 면봉</h2>
<p>귀지는 귓속을 보호하는 역할을 하고, 턱을 움직이는 동안 <strong>저절로 밖으로</strong> 밀려 나와요. 면봉이나 귀이개로 파면 오히려 귀지를 안쪽으로 밀어 넣거나, 외이도에 상처를 내 염증(외이도염)을 일으키거나, 드물게 고막을 다치게 할 수 있어요.</p>
<ul>
<li>샤워 후에는 귀 입구만 수건으로 닦아요.</li>
<li>귀지가 막혀 먹먹하다면 이비인후과에서 제거해요.</li>
</ul>

<h2>이명</h2>
<p>귀에서 삐, 윙 하는 소리가 들리는 이명은 흔해요. 대부분 난청과 함께 있어요. 조용한 곳에서 더 크게 느껴지고, 스트레스와 피로에 따라 달라져요.</p>
<ul>
<li><strong>갑자기 생긴 이명</strong>, <strong>한쪽만의 이명</strong>, 심장 박동처럼 <strong>쿵쿵 뛰는 이명</strong>, 난청이나 어지럼이 함께 있는 이명은 진료를 받아요.</li>
<li>오래된 이명은 완전히 없애기 어렵지만, 소리 치료와 상담, 보청기 등으로 덜 괴롭게 지낼 수 있어요.</li>
</ul>

<div class="box"><span class="h">귀를 지키는 체크리스트</span>
<ol>
<li>이어폰 볼륨 60% 이하, 60분마다 쉬기</li>
<li>휴대폰 청력 보호 알림 켜기</li>
<li>공연장·시끄러운 작업장에서는 귀마개</li>
<li>갑자기 한쪽 귀가 안 들리면 바로 이비인후과</li>
<li>되묻는 일이 늘면 청력 검사</li>
<li>면봉으로 귀 파지 않기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>골전도 이어폰은 귀에 안전한가요?</dt>
<dd>골전도 이어폰은 고막을 거치지 않지만 결국 달팽이관으로 소리를 전달해요. 볼륨이 크면 똑같이 청력을 손상시킬 수 있어요. 주변 소리가 들려 안전에는 장점이 있지만, 볼륨 규칙은 똑같이 지켜요.</dd>
<dt>난청은 치료로 좋아지나요?</dt>
<dd>귀지, 중이염처럼 원인이 있는 난청은 치료하면 좋아질 수 있어요. 소음성 난청과 노화성 난청은 되돌리기 어렵지만, 보청기와 인공와우로 듣는 능력을 보완할 수 있어요.</dd>
<dt>아이도 청력 검사가 필요한가요?</dt>
<dd>신생아 청각 선별검사를 받고, 말이 늦거나 불러도 잘 반응하지 않으면 검사를 받아요. 청소년은 이어폰 사용 습관을 함께 점검해요.</dd>
</dl>
