  data-title="어린이 예방접종: 국가예방접종 일정 한눈에, 여러 백신 동시 접종, 접종 뒤 열과 주의할 반응"
  data-thumb="무료|국가예방접종"
  data-summary="어린이 국가예방접종은 보건소와 지정 의료기관에서 무료로 받을 수 있어요. 나이별 주요 접종 일정, 늦어졌을 때 따라잡기, 한 번에 여러 백신을 맞아도 되는 이유, 접종 전 알려야 할 것, 접종 뒤 흔한 반응과 해열제, 병원에 연락해야 하는 반응, 예방접종 기록 확인 방법을 정리했어요."
  data-tags="어린이예방접종,국가예방접종,백신,예방접종도우미,건강상식">
<p class="lead">아기가 태어나면 예방접종 일정표를 받게 되는데, 백신 이름도 많고 횟수도 복잡해서 헷갈리기 쉬워요. 예방접종은 아이 스스로 이겨 내기 어려운 심각한 감염병을 미리 막아 주는 가장 확실한 방법이에요. 전체 흐름만 알아 두면 일정 관리가 한결 쉬워요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>어린이 국가예방접종은 <strong>보건소와 지정 의료기관에서 무료</strong>예요.</li>
<li>접종 일정은 <strong>질병관리청 예방접종도우미</strong> 누리집·앱에서 아이별로 확인하고 알림을 받을 수 있어요.</li>
<li>여러 백신을 <strong>같은 날 맞아도</strong> 효과와 안전에 문제가 없어요.</li>
<li>접종 뒤 가벼운 열과 붓기는 흔해요. <strong>숨참, 온몸 두드러기, 경련</strong>은 바로 응급 진료예요.</li>
</ul></div>

<h2>나이별 주요 접종(요약)</h2>
<div class="tbl"><table>
<thead><tr><th>시기</th><th>주요 백신</th></tr></thead>
<tbody>
<tr><td>출생~1개월</td><td>B형간염 1차(출생 직후)·2차(1개월), 결핵(BCG, 4주 이내)</td></tr>
<tr><td>2개월</td><td>디프테리아·파상풍·백일해(DTaP), 폴리오(IPV), b형 헤모필루스 인플루엔자(Hib), 폐렴구균, 로타바이러스</td></tr>
<tr><td>4개월</td><td>DTaP, IPV, Hib, 폐렴구균, 로타바이러스</td></tr>
<tr><td>6개월</td><td>DTaP, IPV(6~18개월), Hib, 폐렴구균, B형간염 3차, 로타바이러스(백신 종류에 따라), 인플루엔자(6개월 이후 매년)</td></tr>
<tr><td>12~23개월</td><td>홍역·유행성이하선염·풍진(MMR), 수두, Hib·폐렴구균 추가, A형간염(2회), 일본뇌염, DTaP 4차(15~18개월)</td></tr>
<tr><td>4~6세</td><td>DTaP 5차, IPV 4차, MMR 2차, 일본뇌염 추가</td></tr>
<tr><td>11~12세</td><td>Tdap(또는 Td) 6차, 사람유두종바이러스(HPV, 여아), 일본뇌염 추가</td></tr>
</tbody>
<caption>질병관리청 표준 예방접종 일정표를 바탕으로 요약. 백신 종류(생백신·사백신 일본뇌염 등)에 따라 횟수와 간격이 달라 실제 일정은 예방접종도우미와 의료기관에서 확인해요</caption></table></div>

<h2>일정이 늦어졌다면</h2>
<p>예방접종 시기를 놓쳤더라도 <strong>처음부터 다시 맞을 필요는 없어요.</strong> 이미 맞은 것은 인정되고, 남은 접종을 이어서 맞으면 돼요. 나이에 따라 필요한 횟수가 줄어드는 백신도 있어요. 의료기관에 기록을 보여 주면 따라잡기 일정을 짜 줘요. 다만 늦어지는 동안에는 병에 걸릴 위험이 있으니 가능한 한 빨리 맞춰요.</p>

<h2>여러 백신을 한 번에 맞아도 될까</h2>
<p>아기의 면역계는 매일 수많은 세균과 바이러스를 만나며 반응하고 있어요. 백신 몇 가지를 같은 날 맞는 것은 면역계에 큰 부담이 되지 않고, 각 백신의 효과도 떨어지지 않아요. 오히려 나눠 맞으면 병원에 더 자주 가야 하고 보호받지 못하는 기간이 길어져요. 생백신끼리는 같은 날 맞거나, 다른 날이라면 4주 이상 간격을 둬요.</p>

<h2>접종 전 알려야 할 것</h2>
<ul>
<li>오늘 열이 나거나 아픈 곳이 있는지</li>
<li>이전 접종 뒤 심한 반응이 있었는지</li>
<li>달걀, 젤라틴, 라텍스 등 알레르기</li>
<li>면역 저하 질환, 스테로이드·면역억제제 복용, 최근 수혈이나 면역글로불린 투여</li>
<li>가벼운 콧물이나 기침만 있다면 대부분 접종할 수 있어요.</li>
</ul>

<h2>접종 뒤 반응</h2>
<div class="tbl"><table>
<thead><tr><th>반응</th><th>대처</th></tr></thead>
<tbody>
<tr><td>접종 부위 붓기, 붉어짐, 통증</td><td>시원한 수건을 대요. 대개 1~2일 안에 좋아져요</td></tr>
<tr><td>열, 보챔, 식욕 저하</td><td>수분을 충분히. 필요하면 몸무게에 맞춘 해열제(아세트아미노펜 등)</td></tr>
<tr><td>MMR·수두 접종 1~2주 뒤 가벼운 열이나 발진</td><td>흔한 반응이에요. 대개 며칠 안에 좋아져요</td></tr>
<tr><td>BCG 접종 부위 고름·작은 궤양</td><td>몇 주에 걸쳐 생겼다 아무는 정상 과정이에요. 짜지 말고 깨끗하게</td></tr>
</tbody>
<caption>질병관리청 예방접종 후 이상반응 안내를 바탕으로 정리</caption></table></div>

<div class="box warn"><span class="h">바로 응급 진료를 받아야 할 때</span>
<ul>
<li>접종 뒤 몇 분~몇 시간 안에 <strong>숨참, 쌕쌕거림, 온몸 두드러기, 얼굴 부기</strong></li>
<li><strong>경련</strong>, 깨우기 어려울 만큼 처짐</li>
<li>3시간 넘게 달래지지 않는 심한 울음</li>
<li>생후 3개월 미만 아기의 38°C 이상 열</li>
</ul>
<p>그래서 접종 뒤에는 <strong>20~30분 동안 접종 기관에 머물며</strong> 지켜봐요. 이상반응은 의료기관이나 보건소를 통해 신고할 수 있고, 피해 보상 제도도 있어요.</p></div>

<h2>기록 확인과 증명서</h2>
<ul>
<li>예방접종도우미 누리집·앱에서 아이의 접종 기록을 보고 <strong>예방접종 증명서</strong>를 발급받을 수 있어요.</li>
<li>어린이집·유치원·초등학교 입학 때 접종 확인을 해요. 빠진 접종이 있으면 이때 챙겨요.</li>
<li>해외에서 맞은 접종도 의료기관에 기록 등록을 요청할 수 있어요.</li>
</ul>

<div class="box"><span class="h">예방접종 체크리스트</span>
<ol>
<li>예방접종도우미에 아이 등록, 알림 받기</li>
<li>접종 전 아이 상태·알레르기 알리기</li>
<li>같은 날 여러 백신도 괜찮아요</li>
<li>접종 뒤 20~30분 기관에서 관찰</li>
<li>늦었으면 이어서 따라잡기</li>
<li>입학 전 빠진 접종 확인</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>백신이 자폐증을 일으키나요?</dt>
<dd>수많은 대규모 연구에서 MMR 등 백신과 자폐증 사이의 관련은 확인되지 않았어요. 이 주장의 시작이 된 논문은 조작으로 철회됐어요.</dd>
<dt>감기 기운이 있는데 접종해도 되나요?</dt>
<dd>열이 없는 가벼운 감기라면 대부분 접종할 수 있어요. 열이 나거나 많이 아프면 좋아진 뒤 맞아요.</dd>
<dt>선택 접종도 맞아야 하나요?</dt>
<dd>국가예방접종 외에도 수막구균 등 권장되는 백신이 있어요. 아이의 상황에 맞게 소아청소년과와 상의해요.</dd>
</dl>
