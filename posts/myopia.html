  data-title="어린이 근시: 하루 2시간 바깥 활동, 가까이 보는 시간 쉬어 주기, 진행을 늦추는 치료"
  data-thumb="2시간|하루 바깥 활동"

<p class="lead">"칠판 글씨가 잘 안 보여요." 아이가 이렇게 말하거나 텔레비전을 가까이 가서 보면 근시를 의심하게 돼요. 근시는 한번 생기면 되돌리기 어렵고, 아이가 자라는 동안 계속 진행해요. 그래서 어린이 근시는 '안경을 맞추면 끝'이 아니라 <strong>진행을 늦추는 것</strong>이 중요해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>근시는 눈의 앞뒤 길이가 길어져 생겨요. <strong>일찍 시작할수록</strong> 어른이 됐을 때 고도근시가 되기 쉬워요.</li>
<li><strong>하루 2시간 정도의 바깥 활동</strong>이 근시 발생을 줄인다는 연구가 많아요.</li>
<li>가까이 볼 때는 <strong>30cm 이상 거리</strong>, <strong>20~30분마다 먼 곳 보기</strong>를 습관으로 해요.</li>
<li>진행이 빠르면 <strong>저농도 아트로핀 안약, 드림렌즈, 근시 억제 안경</strong> 등을 안과와 상의해요.</li>
</ul></div>

<h2>근시는 왜 생길까</h2>
<p>근시는 눈으로 들어온 빛이 망막보다 앞에서 초점을 맺어 먼 곳이 흐려 보이는 상태예요. 어린이 근시의 대부분은 <strong>안구가 앞뒤로 길게 자라서</strong> 생겨요. 부모가 근시면 아이도 근시가 되기 쉽고, 가까운 곳을 오래 보는 생활과 부족한 바깥 활동이 함께 영향을 줘요. 동아시아 나라들에서 특히 빠르게 늘고 있어요.</p>

<h2>일찍 관리해야 하는 이유</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>내용</th></tr></thead>
<tbody>
<tr><td>진행 속도</td><td>대개 초등학생 시기에 가장 빠르게 진행하고, 10대 후반~20대 초반에 멈춰요</td></tr>
<tr><td>고도근시</td><td>보통 -6디옵터 이상. 어릴 때 시작한 근시일수록 고도근시가 되기 쉬워요</td></tr>
<tr><td>어른이 된 뒤의 위험</td><td>고도근시는 망막박리, 근시성 황반변성, 녹내장, 백내장 위험을 높여요</td></tr>
</tbody>
<caption>세계보건기구(WHO) 근시 보고서, 대한안과학회·대한소아안과학회 자료를 바탕으로 정리</caption></table></div>

<h2>첫 안과 검진</h2>
<ul>
<li>시력 검사에 협조할 수 있는 <strong>만 3~4세 무렵</strong> 한 번 안과 검진을 받는 것을 권해요. 약시·사시를 일찍 찾는 데도 중요해요.</li>
<li>근시가 있다면 보통 <strong>6개월마다</strong> 검사해 진행 속도를 확인해요.</li>
<li>정확한 도수를 재려면 조절 마비 안약을 넣고 검사하기도 해요.</li>
</ul>
<p>아이가 눈을 자주 찡그리거나, 고개를 기울여 보거나, 눈을 자주 비비면 검진을 앞당겨요.</p>

<h2>바깥 활동의 힘</h2>
<p>햇빛 아래에서 보내는 시간이 많은 아이는 근시가 덜 생긴다는 연구가 여러 나라에서 나왔어요. 밝은 햇빛이 눈의 길이 성장을 억제하는 것으로 추정돼요. 대만에서는 학교에서 쉬는 시간마다 아이들을 운동장에 내보내는 정책 이후 근시 유병률이 줄었다는 보고가 있어요.</p>
<ul>
<li>목표는 <strong>하루 합쳐 2시간 안팎</strong>의 바깥 활동이에요. 운동이 아니어도 밖에 있기만 해도 돼요.</li>
<li>한 번에 몰아서보다 나눠서도 괜찮아요. 등하굣길 걷기, 놀이터, 산책</li>
<li>한여름에는 모자와 자외선 차단제를 챙겨요.</li>
</ul>

<h2>가까이 보는 습관</h2>
<ul>
<li>책과 화면은 <strong>눈에서 30cm 이상</strong> 떨어뜨려요. 스마트폰은 특히 가까워지기 쉬워요.</li>
<li><strong>20~30분</strong> 가까이 봤다면 20초쯤 창밖 먼 곳을 봐요.</li>
<li>엎드리거나 누워서 보지 않고, 밝은 조명 아래에서 봐요.</li>
<li>만 2세 미만은 화면을 거의 보여 주지 않고, 어린이도 여가용 화면 시간을 정해요.</li>
</ul>

<h2>진행을 늦추는 치료</h2>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>설명</th><th>알아 둘 점</th></tr></thead>
<tbody>
<tr><td>저농도 아트로핀 안약</td><td>자기 전 하루 한 번 넣어요. 진행 속도를 늦춰요</td><td>눈부심, 가까운 곳이 조금 흐려질 수 있어요. 농도와 기간은 안과가 정해요</td></tr>
<tr><td>드림렌즈(각막 굴절 교정 렌즈)</td><td>밤에 끼고 자면 낮에 안경 없이 보이고, 진행도 늦춰요</td><td>위생 관리가 매우 중요해요. 각막 감염 위험</td></tr>
<tr><td>근시 억제 안경렌즈</td><td>주변부 초점을 조절하도록 설계된 렌즈</td><td>꾸준히 써야 효과가 있어요</td></tr>
<tr><td>근시 억제 소프트 콘택트렌즈</td><td>다초점 설계</td><td>렌즈 관리 능력이 필요해요</td></tr>
</tbody>
<caption>대한안과학회, 미국안과학회(AAO) Myopia Control 자료, 국제근시연구소(IMI) 보고서를 바탕으로 정리. 아이의 나이, 진행 속도, 생활에 맞춰 선택해요</caption></table></div>

<div class="box warn"><span class="h">바로 안과에 가야 할 때</span>
<ul>
<li>갑자기 <strong>눈앞에 날파리 같은 것이 많이 떠다니거나</strong> 번쩍이는 빛이 보여요.</li>
<li>시야 한쪽이 <strong>커튼이 드리운 것처럼</strong> 가려져요.</li>
<li>드림렌즈나 콘택트렌즈를 쓰는 아이가 눈이 빨갛고 아프고 눈부셔해요.</li>
</ul>
<p>고도근시가 있는 사람은 망막박리가 생길 수 있어요. 응급 치료가 필요해요.</p></div>

<div class="box"><span class="h">어린이 근시 체크리스트</span>
<ol>
<li>만 3~4세 첫 안과 검진</li>
<li>근시면 6개월마다 검사</li>
<li>하루 2시간 바깥 활동</li>
<li>30cm 거리, 20~30분마다 먼 곳 보기</li>
<li>화면 시간 정하기</li>
<li>진행이 빠르면 억제 치료 상의</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>안경을 쓰면 근시가 더 나빠지나요?</dt>
<dd>아니에요. 도수가 맞는 안경을 쓰지 않으면 오히려 불편하고 눈을 찡그리게 돼요. 흐리게 보이는 상태로 두는 것이 근시 진행을 막지도 않아요.</dd>
<dt>눈 운동이나 영양제로 근시가 좋아지나요?</dt>
<dd>근시를 되돌리거나 진행을 멈춘다는 근거가 확인되지 않았어요. 바깥 활동과 검증된 치료를 권해요.</dd>
<dt>라식·라섹은 언제 할 수 있나요?</dt>
<dd>근시 진행이 멈춘 성인이 된 뒤에 검사를 받고 결정해요. 수술을 해도 고도근시로 길어진 안구의 망막 위험은 그대로라 정기 검진이 필요해요.</dd>
</dl>
