  data-title="항생제 내성: 감기에 항생제를 먹으면 안 되는 이유와 올바른 항생제 사용"
  data-thumb="0|감기에 필요한 항생제"
  data-summary="항생제가 듣지 않는 세균이 늘어나면서 흔한 감염도 치료하기 어려워지고 있어요. 항생제가 듣는 감염과 듣지 않는 감염, 내성이 생기는 원리, 한국의 항생제 사용 현황, 처방받은 항생제를 올바르게 먹는 법, 페니실린 알레르기 표시에 대한 오해까지 정리했어요."
  data-tags="항생제,항생제내성,슈퍼박테리아,감기,감염">
<p class="lead">항생제는 20세기 의학의 가장 큰 발견 중 하나예요. 그런데 너무 흔하게 쓰면서, 항생제가 듣지 않는 세균이 점점 늘고 있어요. 이 문제는 먼 미래가 아니라 이미 병원에서 벌어지고 있는 일이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>항생제는 <strong>세균</strong>에만 효과가 있어요. 감기와 독감 같은 <strong>바이러스</strong> 감염에는 듣지 않아요.</li>
<li>불필요한 항생제는 내성균을 키우고, 설사 같은 부작용만 남겨요.</li>
<li>처방받은 항생제는 <strong>정해진 용량과 기간</strong>대로 먹고, 남은 약을 나중에 먹거나 나눠주지 않아요.</li>
<li>항생제 내성은 전 세계에서 해마다 <strong>100만 명 넘는</strong> 사망의 직접 원인으로 추정돼요.</li>
</ul></div>

<h2>항생제가 듣는 감염, 듣지 않는 감염</h2>
<div class="tbl"><table>
<thead><tr><th>항생제가 필요 없는 경우 (대부분 바이러스)</th><th>항생제가 필요할 수 있는 경우 (세균)</th></tr></thead>
<tbody>
<tr><td>감기, 독감, 코로나19</td><td>세균성 폐렴</td></tr>
<tr><td>대부분의 목감기(인후염)</td><td>연쇄상구균 인두염 (검사로 확인)</td></tr>
<tr><td>대부분의 급성 기관지염</td><td>요로감염, 방광염</td></tr>
<tr><td>대부분의 급성 장염 설사</td><td>세균성 부비동염 (10일 이상 지속되거나 악화될 때 등)</td></tr>
<tr><td>콧물이 누렇게 변한 것만으로는 세균 감염이 아님</td><td>봉와직염 같은 피부 감염</td></tr>
</tbody>
<caption>질병관리청·대한감염학회 항생제 적정사용 안내를 바탕으로 정리. 판단은 진찰과 검사로 의사가 해요.</caption></table></div>
<p>감기에 항생제를 먹으면 빨리 낫는 것 같지만, 실제로는 감기가 저절로 낫는 시기와 겹쳤을 뿐이에요. 연구에서 감기에 항생제를 먹어도 회복 기간은 줄지 않았고, 설사와 발진 같은 부작용만 늘었어요.</p>

<h2>내성은 어떻게 생길까</h2>
<p>세균은 아주 빠르게 번식하고, 번식하는 동안 우연히 항생제를 견디는 돌연변이가 생겨요. 항생제를 쓰면 약한 세균은 죽고 <strong>견디는 세균만 살아남아</strong> 다시 번식해요. 항생제를 자주, 불필요하게, 불충분하게 쓸수록 이 선택 과정이 반복돼 내성균이 늘어나요.</p>
<p>내성균은 사람에게서 사람으로, 병원과 요양시설, 가축과 환경을 통해 퍼져요. 그래서 항생제 내성은 한 사람의 문제가 아니라 공동체의 문제예요.</p>
<h3>이미 등장한 '슈퍼박테리아'</h3>
<ul>
<li><strong>MRSA</strong>: 메티실린 내성 황색포도상구균</li>
<li><strong>VRE</strong>: 반코마이신 내성 장알균</li>
<li><strong>CRE</strong>: 카바페넴 내성 장내세균 (최후의 항생제로 불리는 약에도 내성)</li>
</ul>
<p>이런 균에 감염되면 쓸 수 있는 약이 적고, 치료 기간이 길어지며, 사망 위험이 높아져요.</p>

<h2>얼마나 심각할까</h2>
<p>국제 연구(2022, Lancet)는 2019년 한 해 전 세계에서 <strong>약 127만 명</strong>이 항생제 내성균 감염으로 직접 사망했다고 추정했어요. 세계보건기구는 항생제 내성을 인류 건강을 위협하는 10대 요인 중 하나로 꼽아요.</p>
<p>한국은 OECD 국가 중 항생제 사용량이 많은 편에 속해요. 특히 감기 같은 급성 상기도 감염에 항생제가 처방되는 비율이 높다는 지적이 있어 정부가 항생제 적정 사용 정책을 펴고 있어요.</p>

<h2>처방받은 항생제 올바르게 먹기</h2>
<ul>
<li><strong>정해진 용량과 시간 간격</strong>을 지켜요. 하루 2번이면 12시간, 3번이면 8시간 간격이 기본이에요.</li>
<li><strong>의사가 정한 기간</strong>대로 먹어요. 증상이 좋아졌다고 스스로 끊지 않아요. 최근에는 필요한 만큼만 짧게 처방하는 추세라서, 처방 기간 자체가 이미 계산된 기간이에요.</li>
<li><strong>남은 항생제를 보관했다가</strong> 다음에 스스로 먹지 않아요. 다른 병에는 맞지 않는 약이고, 불충분한 양은 내성만 키워요.</li>
<li><strong>다른 사람과 나눠 먹지 않아요.</strong></li>
<li>의사에게 <strong>항생제를 요구하지 않아요.</strong> 필요하지 않다고 설명하면 이유를 물어보세요.</li>
<li>우유, 철분제, 칼슘제, 제산제와 함께 먹으면 흡수가 떨어지는 항생제가 있어요. 복용 방법을 약사에게 확인해요.</li>
</ul>

<h2>항생제의 부작용</h2>
<ul>
<li><strong>설사:</strong> 장내 좋은 세균까지 줄어들어 생겨요. 대부분 가볍지만, 심한 설사와 복통, 발열이 있다면 <strong>클로스트리디오이데스 디피실 감염</strong>일 수 있어 진료를 받아요.</li>
<li><strong>발진, 두드러기:</strong> 알레르기일 수 있어요. 숨이 차거나 얼굴·목이 부으면 응급이에요.</li>
<li><strong>질 칸디다증:</strong> 여성에게서 흔해요.</li>
<li><strong>약물 상호작용:</strong> 와파린, 일부 심장약과 상호작용이 있을 수 있어요.</li>
</ul>

<h2>페니실린 알레르기 표시, 정말일까</h2>
<p>'페니실린 알레르기'로 기록된 사람 중 실제로 검사해 보면 <strong>대부분은 알레르기가 아니라는</strong> 연구가 많아요. 어릴 때 항생제를 먹다 생긴 발진이 사실은 감염 때문이었거나, 시간이 지나 알레르기가 사라진 경우예요.</p>
<p>문제는 이 표시 때문에 더 효과가 좋고 안전한 페니실린 계열 대신 <strong>더 광범위한 항생제</strong>를 쓰게 되어 내성균과 부작용 위험이 커진다는 점이에요. 알레르기 기록이 있지만 구체적인 기억이 없다면 알레르기 전문 진료에서 확인해 볼 수 있어요.</p>

<h2>항생제가 필요 없는 감기, 이렇게 관리해요</h2>
<div class="box note"><span class="h">감기 대처법</span>
<ul>
<li>충분히 쉬고 물을 많이 마셔요.</li>
<li>열과 통증에는 해열진통제를, 코막힘에는 식염수 세척을 써볼 수 있어요.</li>
<li>보통 7~10일이면 좋아져요. 기침은 2~3주 갈 수도 있어요.</li>
<li><strong>이럴 때는 다시 진료:</strong> 10일 넘게 좋아지지 않을 때, 좋아지다가 다시 열이 날 때, 숨이 찰 때, 고열이 3일 넘게 이어질 때</li>
</ul></div>

<h2>감염 자체를 줄이는 것이 최선</h2>
<ul>
<li><strong>손 씻기:</strong> 가장 기본적인 감염 예방법</li>
<li><strong>예방접종:</strong> 독감, 폐렴구균 백신은 세균성 합병증과 항생제 사용을 줄여요.</li>
<li><strong>음식 위생:</strong> 식중독 예방</li>
<li><strong>기침 예절</strong>과 아플 때 쉬기</li>
</ul>

<div class="box"><span class="h">항생제 사용 체크리스트</span>
<ol>
<li>감기 증상에 항생제를 요구하지 않기</li>
<li>처방받은 항생제는 용량과 간격, 기간 지키기</li>
<li>남은 항생제는 폐의약품 수거함에 버리기</li>
<li>다른 사람에게 항생제 나눠주지 않기</li>
<li>과거 항생제 알레르기 반응을 정확히 기록해 두기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>누런 콧물이나 가래가 나오면 항생제가 필요한가요?</dt>
<dd>누런 콧물과 가래는 면역세포가 싸우는 흔적이라 바이러스 감염에서도 흔해요. 색깔만으로는 세균 감염을 판단할 수 없어요.</dd>
<dt>항생제를 먹을 때 유산균을 같이 먹으면 좋나요?</dt>
<dd>일부 연구에서 항생제 관련 설사를 줄이는 효과가 보고됐어요. 다만 균주마다 효과가 다르고, 면역이 크게 떨어진 사람은 주의가 필요해요. 항생제와는 몇 시간 간격을 두고 먹어요.</dd>
<dt>내 몸에 내성균이 생기는 건가요?</dt>
<dd>사람의 몸이 항생제에 내성을 갖는 게 아니라, 몸에 사는 <strong>세균</strong>이 내성을 갖게 되는 거예요. 그리고 그 세균은 다른 사람에게도 옮을 수 있어요.</dd>
</dl>
