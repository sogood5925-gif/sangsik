  data-title="가정 상비약 구급함: 꼭 필요한 약과 도구, 성분 중복 피하기, 개봉 후 사용 기간과 버리는 법"
  data-thumb="1년 1번|구급함 점검"
  data-summary="밤중에 열이 나거나 손을 베였을 때 집에 준비된 약과 도구가 있으면 한결 든든해요. 상비약으로 갖추면 좋은 성분별 약, 상처 처치 도구, 아이와 어르신이 있는 집의 차이, 같은 성분을 겹쳐 먹지 않는 법, 개봉 후 사용 기간과 보관, 오래된 약을 버리는 방법을 정리했어요."

<p class="lead">약장을 열면 언제 샀는지 모를 약과 이름이 지워진 약봉지가 섞여 있는 경우가 많아요. 상비약은 많이 갖추는 것보다 <strong>꼭 필요한 것을, 알아볼 수 있게, 기한 안에</strong> 두는 것이 중요해요. 한 번 정리해 두면 급할 때 헤매지 않아요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>해열진통제, 소화기 약, 알레르기 약, 상처 처치 도구, 체온계가 <strong>기본</strong>이에요.</li>
<li>약은 <strong>성분명</strong>을 보고 골라요. 감기약과 진통제를 함께 먹으면 <strong>같은 성분이 겹칠</strong> 수 있어요.</li>
<li>약은 <strong>원래 포장과 설명서</strong>와 함께, 아이 손이 닿지 않는 곳에 둬요.</li>
<li>1년에 한 번 점검하고, 오래된 약은 <strong>약국·보건소 등의 폐의약품 수거함</strong>에 버려요.</li>
</ul></div>

<h2>갖추면 좋은 약</h2>
<div class="tbl"><table>
<thead><tr><th>용도</th><th>성분 예</th><th>주의</th></tr></thead>
<tbody>
<tr><td>열, 통증</td><td>아세트아미노펜, 이부프로펜</td><td>아세트아미노펜은 술과 함께·과량 복용 시 간 손상. 이부프로펜은 위장 장애, 콩팥 질환·임신 후기 주의</td></tr>
<tr><td>소화불량</td><td>소화효소제, 제산제</td><td>반복되는 속쓰림은 진료를 받아요</td></tr>
<tr><td>설사</td><td>경구 수분 보충액, 로페라미드 등</td><td>열·혈변이 있으면 지사제보다 진료. 어린이는 지사제를 임의로 쓰지 않아요</td></tr>
<tr><td>알레르기, 가려움</td><td>세티리진, 로라타딘 등 항히스타민제</td><td>일부는 졸음이 와요. 운전 주의</td></tr>
<tr><td>상처</td><td>포비돈 요오드 소독제, 항생제 연고</td><td>깊은 상처, 동물에게 물린 상처는 진료</td></tr>
<tr><td>화상</td><td>화상 연고, 거즈</td><td>먼저 흐르는 물로 15~20분 식혀요</td></tr>
<tr><td>근육통, 삔 곳</td><td>파스(소염진통 성분)</td><td>같은 성분의 먹는 진통제와 겹치지 않게</td></tr>
</tbody>
<caption>식품의약품안전처 의약품 안전 사용 안내, 대한약사회 상비약 안내를 바탕으로 정리. 지병이 있거나 다른 약을 먹는다면 약사와 상의해 골라요</caption></table></div>

<h2>갖추면 좋은 도구</h2>
<ul>
<li>체온계, 일회용 밴드, 멸균 거즈, 붕대, 의료용 테이프</li>
<li>생리식염수(상처와 눈 씻기), 가위, 핀셋</li>
<li>일회용 장갑, 냉찜질 팩, 탄력 붕대</li>
<li>경구 수분 보충액(분말): 장염, 더위로 탈수가 올 때</li>
<li>가족의 복용 약 목록과 비상 연락처를 적은 종이</li>
</ul>

<h2>같은 성분을 겹치지 않기</h2>
<p>종합감기약에는 해열진통 성분(아세트아미노펜 등)이 들어 있는 경우가 많아요. 여기에 진통제를 또 먹으면 하루 최대량을 넘길 수 있어요. 아세트아미노펜은 여러 제품에 들어 있어 특히 조심해요.</p>
<ul>
<li>약을 먹기 전 <strong>포장의 성분명</strong>을 확인해요.</li>
<li>먹은 시각과 양을 메모해요. 가족이 여럿이 돌볼 때 겹쳐 먹이는 일을 막아요.</li>
<li>처방약을 먹고 있다면 일반약을 더할 때 약사에게 물어봐요.</li>
</ul>

<h2>개봉 후 사용 기간과 보관</h2>
<div class="tbl"><table>
<thead><tr><th>형태</th><th>보관·사용 기간(대략)</th></tr></thead>
<tbody>
<tr><td>알약(개별 포장)</td><td>포장에 적힌 사용 기한까지. 포장에서 꺼낸 약은 빨리 써요</td></tr>
<tr><td>조제약(약봉지)</td><td>처방받은 기간 동안 먹고 남은 약은 다시 쓰지 않아요</td></tr>
<tr><td>시럽</td><td>개봉 후 약 1개월 안팎. 처방 조제 시럽은 더 짧을 수 있어요</td></tr>
<tr><td>안약</td><td>개봉 후 약 1개월. 일회용은 한 번 쓰고 버려요</td></tr>
<tr><td>연고</td><td>개봉 후 약 6개월 안팎. 색·냄새·성상이 변하면 버려요</td></tr>
</tbody>
<caption>대한약사회, 식품의약품안전처 의약품 보관 안내를 바탕으로 정리. 제품 설명서의 보관 기간이 우선이에요</caption></table></div>
<ul>
<li>습기와 열이 많은 <strong>욕실보다</strong> 서늘하고 건조한 곳에 둬요.</li>
<li>설명서와 겉포장을 버리지 않아요. 성분과 용법을 다시 확인할 수 있어요.</li>
<li>다른 통에 옮겨 담지 않아요. 무슨 약인지 헷갈려요.</li>
</ul>

<div class="box warn"><span class="h">아이가 약을 삼켰다면</span>
<p>어린이는 알록달록한 약을 사탕으로 알고 먹을 수 있어요. 약을 삼킨 것 같으면 억지로 토하게 하지 말고 <strong>약 포장을 챙겨 바로 병원</strong>에 가거나 119에 연락해요. 철분제, 어른용 진통제, 혈압약, 당뇨약은 적은 양으로도 위험할 수 있어요. 약은 아이 눈높이보다 높은, 잠금이 있는 곳에 둬요.</p></div>

<h2>가족에 따라 더할 것</h2>
<ul>
<li><strong>영유아:</strong> 아이용 해열제(몸무게에 맞춘 용량과 계량 도구), 기저귀 발진 연고. 생후 3개월 미만 아기의 열은 약보다 진료가 먼저예요.</li>
<li><strong>어르신:</strong> 평소 먹는 약을 넉넉히, 약 목록 카드, 혈압계·혈당 측정기.</li>
<li><strong>알레르기가 심한 사람:</strong> 처방받은 에피네프린 자가주사.</li>
<li><strong>밤·휴일:</strong> 편의점에서 해열진통제, 감기약, 소화제, 파스 등 일부 안전상비의약품을 살 수 있어요.</li>
</ul>

<h2>오래된 약 버리기</h2>
<p>먹지 않는 약을 변기나 하수구에 버리면 물과 흙을 오염시켜요. 약국, 보건소, 일부 주민센터의 <strong>폐의약품 수거함</strong>에 넣어요. 지자체에 따라 우체통에 넣는 폐의약품 회수 봉투를 운영하기도 해요. 알약은 포장을 벗겨 모으고, 시럽은 한 병에 모아 새지 않게 막아요.</p>

<div class="box"><span class="h">구급함 점검 체크리스트</span>
<ol>
<li>1년에 한 번 사용 기한 확인</li>
<li>설명서와 원래 포장 함께 보관</li>
<li>성분명 확인하고 겹쳐 먹지 않기</li>
<li>남은 조제약은 다시 쓰지 않기</li>
<li>아이 손 닿지 않는 곳에</li>
<li>오래된 약은 폐의약품 수거함으로</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>남은 항생제를 다음에 또 먹어도 되나요?</dt>
<dd>안 돼요. 증상이 비슷해도 원인이 다를 수 있고, 남은 양으로는 치료가 부족해 내성균을 키울 수 있어요.</dd>
<dt>사용 기한이 조금 지난 약은 괜찮나요?</dt>
<dd>효과가 떨어지거나 성분이 변했을 수 있어요. 기한이 지난 약은 버리고 새로 준비해요.</dd>
<dt>아이 해열제 두 가지를 번갈아 먹여도 되나요?</dt>
<dd>의사가 권한 경우에만 해요. 성분과 시간을 헷갈려 과량이 되기 쉬워요. 한 가지로 충분한 경우가 많아요.</dd>
</dl>
