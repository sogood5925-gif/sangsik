<p class="lead">만성폐쇄성폐질환(COPD)은 폐의 공기 길이 좁아지고 폐포가 망가져 숨을 내쉬기가 점점 어려워지는 병이에요. 흔한 병이지만 많은 사람이 진단받지 못한 채 "나이가 들어서", "담배를 피워서 원래 그래"라며 지내요. 일찍 알수록 남은 폐를 지킬 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>가장 큰 원인은 <strong>흡연</strong>이고, 요리 연기·직업성 먼지도 원인이 돼요.</li>
<li><strong>폐기능 검사</strong>로 진단해요. 기관지 확장제 뒤에도 1초 동안 내쉰 양의 비율이 0.7 미만이면 COPD로 봐요.</li>
<li>치료의 기본은 <strong>금연, 흡입 기관지 확장제, 호흡재활, 예방접종</strong>이에요.</li>
<li>숨참이 갑자기 심해지고 가래가 늘거나 색이 변하면 <strong>급성 악화</strong>일 수 있어 빨리 진료를 받아요.</li>
</ul></div>

<h2>COPD는 어떤 병일까</h2>
<p>오랫동안 해로운 연기나 먼지를 마시면 기관지에 만성 염증이 생기고(만성 기관지염), 공기주머니인 폐포 벽이 무너져요(폐기종). 공기가 폐 안에 갇혀 잘 빠져나가지 못하니 숨을 쉬어도 답답하고 쉽게 지쳐요. 한번 손상된 폐는 되돌리기 어렵지만, 진행을 늦추고 증상을 크게 줄일 수 있어요.</p>

<h2>원인과 위험 요인</h2>
<ul>
<li><strong>흡연:</strong> 가장 큰 원인이에요. 간접흡연도 위험을 높여요.</li>
<li><strong>연기와 먼지:</strong> 환기가 안 되는 곳에서의 요리 연기, 난방 연료 연기, 광산·건설·공장 분진</li>
<li>대기오염, 어릴 때 잦은 호흡기 감염, 천식</li>
<li>드물게 유전 질환(알파1 항트립신 결핍)</li>
</ul>
<p>40세 이상이고 흡연 경력이 있으면서 숨참이나 만성 기침·가래가 있다면 폐기능 검사를 받아 보세요.</p>

<h2>증상</h2>
<ul>
<li>걷거나 계단을 오를 때 <strong>숨이 차요.</strong> 처음에는 힘든 활동에서만, 나중에는 옷을 입을 때도 차요.</li>
<li><strong>아침 기침과 가래</strong>가 몇 달씩 이어져요.</li>
<li>쌕쌕거리는 숨소리, 가슴 답답함</li>
<li>감기에 걸리면 오래 가고 숨참이 심해져요.</li>
</ul>
<div class="tbl"><table>
<thead><tr><th>단계</th><th>숨참 정도(mMRC 척도)</th></tr></thead>
<tbody>
<tr><td>0</td><td>힘든 운동을 할 때만 숨이 차요</td></tr>
<tr><td>1</td><td>평지를 빨리 걷거나 약간 오르막을 걸을 때 숨이 차요</td></tr>
<tr><td>2</td><td>숨이 차서 같은 나이 사람보다 평지를 천천히 걷거나, 내 속도로 걸어도 쉬어야 해요</td></tr>
<tr><td>3</td><td>평지를 100m쯤 걷거나 몇 분 걸으면 쉬어야 해요</td></tr>
<tr><td>4</td><td>숨이 차서 집 밖에 나가기 어렵거나, 옷을 입고 벗을 때도 숨이 차요</td></tr>
</tbody>
<caption>수정 영국 의학연구위원회(mMRC) 호흡곤란 척도, GOLD 2024 보고서를 바탕으로 정리</caption></table></div>

<h2>진단: 폐기능 검사</h2>
<p>숨을 최대한 들이마신 뒤 세게, 끝까지 내쉬어요. 기관지 확장제를 흡입한 뒤에도 <strong>1초 동안 내쉰 양(FEV1)을 전체 내쉰 양(FVC)으로 나눈 값이 0.7 미만</strong>이면 공기 흐름이 막혀 있다고 보고 COPD로 진단해요. 1초 동안 내쉰 양이 정상 예측치의 몇 %인지로 막힘 정도를 나눠요.</p>
<div class="tbl"><table>
<thead><tr><th>정도</th><th class="num">FEV1(예측치 대비)</th></tr></thead>
<tbody>
<tr><td>경증</td><td class="num">80% 이상</td></tr>
<tr><td>중등증</td><td class="num">50~79%</td></tr>
<tr><td>중증</td><td class="num">30~49%</td></tr>
<tr><td>최중증</td><td class="num">30% 미만</td></tr>
</tbody>
<caption>세계만성폐쇄성폐질환기구(GOLD) 2024 보고서를 바탕으로 정리</caption></table></div>
<p>흉부 엑스레이만으로는 초기 COPD를 알기 어려워요. 숨참이 있다면 폐기능 검사를 요청해 보세요.</p>

<h2>치료</h2>
<ul>
<li><strong>금연:</strong> 어떤 약보다 효과가 커요. 폐 기능이 떨어지는 속도를 늦추는 가장 확실한 방법이에요. 보건소 금연클리닉과 금연 치료 약의 도움을 받을 수 있어요.</li>
<li><strong>흡입 기관지 확장제:</strong> 지속형 항콜린제(티오트로피움 등)와 지속형 베타2 작용제(인다카테롤 등)를 단독 또는 함께 써서 숨참을 줄이고 악화를 예방해요.</li>
<li><strong>흡입 스테로이드:</strong> 악화가 잦고 혈액 호산구가 높은 사람 등 일부에게 함께 써요.</li>
<li><strong>호흡재활:</strong> 운동, 호흡법, 교육으로 이뤄진 프로그램이에요. 숨참과 삶의 질을 크게 좋아지게 해요.</li>
<li><strong>산소 치료:</strong> 혈중 산소가 많이 낮은 사람은 가정 산소 치료가 생존율을 높여요.</li>
</ul>
<p>흡입기는 쓰는 방법이 중요해요. 진료 때 직접 해 보며 확인받아요.</p>

<h2>예방접종</h2>
<ul>
<li>매년 <strong>독감</strong> 예방접종</li>
<li><strong>폐렴구균</strong> 예방접종</li>
<li>코로나19 예방접종 권고에 따르기</li>
<li>60세 이상은 <strong>RSV(호흡기세포융합바이러스)</strong> 예방접종을 의사와 상의</li>
</ul>

<div class="box warn"><span class="h">급성 악화 신호: 빨리 진료를</span>
<ul>
<li>평소보다 <strong>숨참이 갑자기 심해져요.</strong></li>
<li>가래 양이 늘거나 <strong>노랗고 초록색</strong>으로 변해요.</li>
<li>열이 나고, 흡입기를 써도 나아지지 않아요.</li>
</ul>
<p>입술이 파래지거나, 말하기 힘들 만큼 숨이 차거나, 졸리고 혼란스러우면 119를 불러요.</p></div>

<h2>생활 관리</h2>
<ul>
<li>매일 걷기처럼 <strong>꾸준히 몸을 움직여요.</strong> 숨이 찬다고 움직이지 않으면 근육이 약해져 숨참이 더 심해져요.</li>
<li><strong>입술 오므리기 호흡:</strong> 코로 들이마시고, 촛불을 끄듯 입술을 오므려 두 배 길게 내쉬면 숨참이 줄어요.</li>
<li>체중이 줄고 있다면 단백질과 열량을 충분히 먹어요.</li>
<li>미세먼지가 나쁜 날은 외출을 줄이고, 요리할 때 환기해요.</li>
</ul>

<div class="box"><span class="h">COPD 체크리스트</span>
<ol>
<li>40세 이상 흡연자, 숨참·가래 있으면 폐기능 검사</li>
<li>담배 끊기(금연클리닉 활용)</li>
<li>흡입기 매일, 사용법 확인</li>
<li>독감·폐렴구균 등 예방접종</li>
<li>호흡재활·매일 걷기</li>
<li>숨참·가래 변화는 빨리 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>천식과 COPD는 어떻게 달라요?</dt>
<dd>천식은 주로 어릴 때부터 시작하고 증상이 좋아졌다 나빠졌다 하며 치료로 폐 기능이 많이 회복돼요. COPD는 주로 40세 이후 흡연자에게 생기고 천천히 계속 진행해요. 두 병이 함께 있는 경우도 있어요.</dd>
<dt>이미 COPD인데 지금 금연해도 소용있나요?</dt>
<dd>네. 언제 끊어도 폐 기능이 떨어지는 속도가 느려지고, 악화와 사망 위험이 줄어요.</dd>
<dt>전자담배는 괜찮나요?</dt>
<dd>전자담배도 기도에 자극과 염증을 일으킬 수 있어 COPD 환자에게 권하지 않아요. 완전히 끊는 것이 목표예요.</dd>
</dl>
