  data-summary="아기의 뇌와 척수가 만들어지는 시기는 임신 사실을 알기 전인 경우가 많아요. 임신 전 엽산 복용 시기와 양, 풍진·수두·B형간염 등 확인할 예방접종, 임신 전에 바꿔야 할 수 있는 약, 당뇨·고혈압·갑상선 관리, 술·담배·카페인·생선, 남성의 준비, 난임 검사를 고려할 시기를 정리했어요."
  data-tags="임신준비,엽산,예방접종,난임,건강상식">
<p class="lead">임신을 확인하는 건 보통 임신 4~6주쯤이에요. 그런데 아기의 신경관(뇌와 척수의 시작)은 임신 3~4주에 이미 닫히기 시작해요. 그래서 임신 준비는 임신 테스트기에 두 줄이 보이기 전부터 시작하는 게 좋아요. 준비는 여성만의 일이 아니라 두 사람이 함께 하는 일이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>엽산 400μg</strong>을 임신 <strong>최소 1개월 전부터 임신 12주까지</strong> 매일 먹어요.</li>
<li><strong>풍진·수두 항체</strong>를 확인하고, 없으면 임신 전에 접종한 뒤 1개월은 피임해요.</li>
<li>먹고 있는 약은 <strong>임신 전에</strong> 의사와 점검해요. 스스로 끊지 않아요.</li>
<li>35세 미만은 1년, 35세 이상은 6개월 동안 임신이 안 되면 <strong>난임 검사</strong>를 받아요.</li>
</ul></div>

<h2>임신 전 준비 목록</h2>

<tr><td>풍진·수두 항체 검사와 접종</td><td>임신 3개월 이상 전</td><td>생백신이라 접종 후 <strong>1개월</strong>은 임신을 피해요</td></tr>

<h2>엽산은 왜 미리 먹을까</h2>
<p>엽산은 세포가 나뉘고 DNA를 만드는 데 필요해요. 임신 초기 엽산이 충분하면 아기의 <strong>신경관 결손(무뇌증, 척추갈림증)</strong> 위험을 크게 줄일 수 있어요. 신경관은 임신 사실을 알기 전에 닫히기 때문에 <strong>임신을 계획하는 순간부터</strong> 먹는 것이 중요해요. 임신부용 종합비타민에 엽산이 들어 있는지 확인해요.</p>

<h2>임신 전에 점검할 약</h2>
<div class="box warn"><span class="h">이런 약은 임신 전에 꼭 상의해요</span>
<ul>
<li><strong>혈압약 일부</strong>(ACE 억제제, 안지오텐신 수용체 차단제): 임신 중에는 다른 약으로 바꿔요.</li>
<li><strong>항경련제 일부</strong>(특히 발프로산): 기형 위험이 있어 약을 바꾸거나 조절해요.</li>
<li><strong>여드름 치료제 이소트레티노인</strong>: 심각한 기형 위험. 끊은 뒤에도 일정 기간 피임해요.</li>
<li><strong>와파린, 메토트렉세이트, 일부 탈모·전립선 약</strong>(두타스테리드 등)</li>
<li>한약, 건강기능식품, 고용량 비타민 A 제품</li>
</ul>
<p>약이 걱정된다고 <strong>스스로 끊으면</strong> 원래 병이 나빠져 엄마와 아기 모두 위험할 수 있어요. 임신 계획을 알리고 안전한 약으로 바꾸는 방법을 상의해요.</p></div>

<h2>만성질환 관리</h2>
<ul>
<li><strong>당뇨:</strong> 임신 전 당화혈색소를 가능하면 6.5% 미만으로 조절하면 기형과 유산 위험이 줄어요.</li>
<li><strong>고혈압:</strong> 임신 중에 쓸 수 있는 약으로 바꾸고 혈압을 안정시켜요.</li>
<li><strong>갑상선:</strong> 갑상선 기능 저하증이 있다면 임신 초기부터 약 용량을 늘려야 할 수 있어요.</li>
<li><strong>체중:</strong> 비만이나 저체중은 임신 합병증과 관련돼요. 무리한 다이어트 대신 조금씩 조절해요.</li>
</ul>

<h2>생활 습관</h2>
<ul>
<li><strong>술:</strong> 임신 중 안전한 음주량은 없어요. 계획 단계부터 끊는 것이 좋아요.</li>
<li><strong>담배:</strong> 여성과 남성 모두 끊어요. 간접흡연도 피해요.</li>
<li><strong>카페인:</strong> 임신 중에는 하루 200~300mg 이하로 줄여요(커피 2잔 안팎).</li>
<li><strong>생선:</strong> 생선은 좋은 영양원이지만 참치, 황새치 같은 큰 생선은 수은이 많아 양을 제한해요.</li>
<li><strong>감염 예방:</strong> 날고기, 비살균 유제품을 피하고, 고양이 배설물을 직접 치우지 않거나 장갑을 껴요(톡소플라스마).</li>
</ul>

<h2>남성의 준비</h2>
<ul>
<li>정자가 만들어지는 데 약 <strong>2~3개월</strong>이 걸려요. 준비는 그 전부터 시작해요.</li>
<li>금연, 절주, 적정 체중, 규칙적인 운동이 정자의 질에 도움이 돼요.</li>
<li>사우나, 무릎 위 노트북처럼 고환 온도를 높이는 습관을 줄여요.</li>
<li>근육 강화용 스테로이드와 테스토스테론 제제는 정자 생성을 크게 떨어뜨려요.</li>
<li>풍진, B형간염 등 예방접종 상태도 함께 확인해요.</li>
</ul>

<h2>난임 검사를 고려할 때</h2>
<p>피임 없이 규칙적으로 관계를 가졌는데도 <strong>35세 미만은 1년, 35세 이상은 6개월</strong> 동안 임신이 되지 않으면 검사를 받아요. 월경이 매우 불규칙하거나, 골반염·자궁내막증 병력이 있거나, 40세 이상이라면 더 일찍 상담해요. 남성 검사(정액 검사)도 함께 받아요. 보건소와 지자체에서 임신 준비 부부의 가임력 검사나 난임 시술 비용을 지원하는 사업이 있으니 거주지 보건소에 문의해 보세요.</p>

<div class="box"><span class="h">임신 준비 체크리스트</span>
<ol>
<li>엽산 400μg 오늘부터</li>
<li>풍진·수두·B형간염 항체 확인</li>
<li>먹는 약 모두 의사와 점검</li>
<li>당뇨·혈압·갑상선 조절</li>
<li>두 사람 모두 금연·금주</li>
<li>기간 지나도 임신 안 되면 둘 다 검사</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>임신인 줄 모르고 술을 마셨어요.</dt>
<dd>임신 초기에 모르고 조금 마신 경우가 많아요. 알게 된 순간부터 끊으면 돼요. 걱정되면 산부인과에서 상담받아요.</dd>
<dt>임신 전 검진은 어디서 받나요?</dt>
<dd>산부인과나 보건소에서 받을 수 있어요. 빈혈, 풍진 항체, B형간염, 갑상선, 혈당, 소변 검사 등을 확인해요.</dd>
<dt>엽산은 음식으로 충분하지 않나요?</dt>
<dd>녹색 채소, 콩, 과일에 엽산이 있지만, 신경관 결손 예방에 필요한 양을 음식만으로 꾸준히 채우기는 어려워요. 그래서 계획 단계부터 보충제를 권해요.</dd>
</dl>
