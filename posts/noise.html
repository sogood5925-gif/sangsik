<p class="lead">밤마다 들리는 쿵쿵 소리는 몸보다 마음을 먼저 지치게 해요. 반대로 나도 모르게 아랫집에 소음을 전하고 있을 수도 있어요. 층간소음은 누구 한쪽의 잘못이라기보다 건물 구조와 생활 습관이 함께 만드는 문제라서, 순서를 지켜 대화하는 것이 중요해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>뛰거나 걷는 <strong>직접충격 소음</strong>의 기준은 1분 평균 <strong>주간 39dB, 야간 34dB</strong>이에요.</li>
<li>우리 집에서는 <strong>매트, 실내화, 가구 다리 패드</strong>와 밤 시간 가전 사용 자제가 효과적이에요.</li>
<li>항의는 직접 찾아가기보다 <strong>관리사무소</strong>를 통해 시작해요.</li>
<li>해결이 안 되면 <strong>층간소음 이웃사이센터</strong>, <strong>분쟁조정위원회</strong>에 도움을 청할 수 있어요.</li>
</ul></div>

<h2>층간소음의 법적 기준</h2>
<p>공동주택 층간소음은 크게 두 가지로 나눠요. 뛰기, 걷기, 물건 떨어뜨리기처럼 바닥을 통해 전해지는 <strong>직접충격 소음</strong>과 TV, 악기, 오디오처럼 공기를 통해 전해지는 <strong>공기전달 소음</strong>이에요.</p>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>기준</th><th class="num">주간(06~22시)</th><th class="num">야간(22~06시)</th></tr></thead>
<tbody>
<tr><td rowspan="2">직접충격 소음</td><td>1분 등가소음도</td><td class="num">39dB</td><td class="num">34dB</td></tr>
<tr><td>최고소음도</td><td class="num">57dB</td><td class="num">52dB</td></tr>
<tr><td>공기전달 소음</td><td>5분 등가소음도</td><td class="num">45dB</td><td class="num">40dB</td></tr>
</tbody>
<caption>「공동주택 층간소음의 범위와 기준에 관한 규칙」(2023년 강화 기준)을 바탕으로 정리. 오래된 공동주택은 일부 기준 적용이 다를 수 있어요</caption></table></div>
<p>화장실 물 내리는 소리처럼 배관을 통해 나는 소리는 층간소음 기준에서 빠져 있어요. 기준을 넘는지는 전문 기관이 측정해야 알 수 있어요.</p>

<h2>우리 집 소음 줄이기</h2>
<ul>
<li><strong>매트:</strong> 아이가 주로 노는 거실과 복도에 두꺼운 층간소음 매트를 깔아요. 틈 없이 까는 게 효과적이에요.</li>
<li><strong>실내화:</strong> 뒤꿈치로 쿵쿵 걷는 발걸음 소리가 생각보다 커요. 쿠션 있는 실내화를 신어요.</li>
<li><strong>가구 다리 패드:</strong> 의자와 식탁 다리에 붙이면 끄는 소리가 줄어요.</li>
<li><strong>밤 시간 가전:</strong> 세탁기, 청소기, 운동기구는 밤 10시 이후와 이른 아침에 쓰지 않아요.</li>
<li><strong>문 닫기:</strong> 문을 쾅 닫지 않게 도어 완충 패드를 붙여요.</li>
<li><strong>운동:</strong> 줄넘기, 점프 운동은 집 밖에서 해요.</li>
<li><strong>반려견:</strong> 짖음이 계속되면 훈련과 산책 시간을 늘려요.</li>
</ul>

<h2>소음 때문에 힘들 때 대화 순서</h2>
<ol>
<li><strong>기록하기:</strong> 소음이 나는 날짜, 시간, 종류(뛰는 소리, 가구 끄는 소리)를 적어요. 녹음도 도움이 돼요.</li>
<li><strong>소리 출처 확인:</strong> 층간소음은 위아래뿐 아니라 옆집, 대각선 집에서 올 수도 있어요. 성급히 단정하지 않아요.</li>
<li><strong>관리사무소에 알리기:</strong> 관리사무소가 해당 세대에 사실을 알리고 조정을 권할 수 있어요. 공동주택관리법에 따라 층간소음 관리위원회를 두는 단지도 있어요.</li>
<li><strong>메모나 방문:</strong> 직접 이야기한다면 감정이 가라앉은 낮 시간에, 구체적인 시간대를 들어 부탁하는 방식으로 해요.</li>
</ol>
<div class="box warn"><span class="h">하지 말아야 할 것</span>
<ul>
<li>밤늦게 윗집 문을 두드리거나 초인종을 반복해서 누르기</li>
<li>천장을 두드리거나 스피커로 보복 소음 내기</li>
<li>욕설, 협박 메모, 현관문 앞 게시</li>
</ul>
<p>이런 행동은 갈등을 키우고, 오히려 법적 책임(주거침입, 협박, 스토킹 등)을 질 수 있어요.</p></div>

<h2>도움받는 곳</h2>

<p>이웃사이센터 상담은 대기 기간이 있을 수 있어요. 신청 방법은 한국환경공단 누리집에서 확인해요.</p>

<h2>소음이 건강에 미치는 영향</h2>
<p>밤 소음은 잠을 자주 깨게 하고, 쌓이면 피로, 두통, 예민함, 우울감으로 이어질 수 있어요. 세계보건기구도 야간 소음이 수면과 심혈관 건강에 영향을 줄 수 있다고 안내해요. 해결에 시간이 걸린다면 귀마개나 백색소음을 쓰고, 잠이 계속 망가지면 진료를 받아 보세요.</p>

<h2>이사 전에 확인할 것</h2>
<ul>
<li>낮과 밤, 평일과 주말에 한 번씩 방문해 소리를 들어 봐요.</li>
<li>관리사무소에 층간소음 민원이 잦은 동인지 물어봐요.</li>
<li>꼭대기 층이나 1층은 위아래 한쪽의 소음이 없어요. 대신 단열과 방범 등 다른 조건을 함께 따져요.</li>
</ul>

<div class="box"><span class="h">층간소음 예방 체크리스트</span>
<ol>
<li>거실·복도에 매트 깔기</li>
<li>쿠션 있는 실내화 신기</li>
<li>의자·식탁 다리에 패드 붙이기</li>
<li>밤 10시 이후 세탁기·청소기 쓰지 않기</li>
<li>문 닫힘 완충 패드 붙이기</li>
<li>항의는 관리사무소를 통해 시작하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>기준을 넘지 않으면 참아야 하나요?</dt>
<dd>기준은 분쟁 조정이나 배상 판단에 쓰이는 숫자예요. 기준 이하라도 불편하다면 관리사무소를 통해 이야기하고 서로 조심할 수 있어요. 다만 기준 이하의 생활 소음은 어느 정도 서로 감수해야 하는 부분도 있어요.</dd>
<dt>아랫집에서 계속 항의하는데 우리는 조용히 지내요.</dt>
<dd>옆집이나 다른 층의 소리가 우리 집 소리로 오해받는 경우가 많아요. 관리사무소에 소음 발생 시간에 우리 집이 비어 있었던 기록 등을 전달하고, 필요하면 이웃사이센터의 측정을 요청해 보세요.</dd>
<dt>임대 아파트도 도움을 받을 수 있나요?</dt>
<dd>네. 관리 주체와 이웃사이센터, 분쟁조정 절차는 공동주택이면 대부분 이용할 수 있어요.</dd>
</dl>
