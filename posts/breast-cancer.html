  data-title="유방암과 유방 검진: 40세부터 2년마다, 치밀유방과 결과지 읽는 법"
  data-thumb="40세|국가검진 시작"
  data-summary="유방암은 우리나라 여성에게 가장 흔한 암 가운데 하나이고, 서양보다 40~50대에 많이 생겨요. 알아 둘 증상, 위험 요인과 줄일 수 있는 요인, 국가 유방암 검진과 치밀유방에서 초음파의 역할, 검진 결과지의 BI-RADS 범주 읽는 법, 가족력과 유전자 검사를 정리했어요."
  data-tags="유방암,유방촬영술,치밀유방,암검진,질병">
<p class="lead">유방암은 일찍 발견하면 치료 성적이 아주 좋은 암이에요. 그래서 검진과 함께, 평소 내 가슴의 모양과 느낌을 알고 있다가 달라진 점을 알아채는 것이 중요해요. 우리나라 여성은 치밀유방이 많아 검진 결과를 읽는 법도 알아 두면 좋아요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>국가 유방암 검진은 <strong>40세 이상 여성, 2년마다 유방촬영술</strong>이에요.</li>
<li>한국 여성은 <strong>치밀유방</strong>이 많아, 결과지에 치밀유방이라고 나오면 초음파 추가를 의사와 상의해요.</li>
<li><strong>새로 만져지는 멍울, 피부 함몰, 유두 함몰·피 섞인 분비물</strong>은 검진 주기와 상관없이 바로 진료받아요.</li>
<li>가족 중 유방암·난소암 환자가 여럿이면 <strong>유전 상담</strong>을 고려해요.</li>
</ul></div>

<h2>알아 둘 증상</h2>
<ul>
<li>유방이나 겨드랑이에 <strong>새로 만져지는 멍울</strong>(대개 아프지 않고 단단해요)</li>
<li>피부가 <strong>보조개처럼 움푹 들어가거나</strong> 귤껍질처럼 두꺼워짐</li>
<li><strong>유두가 안으로 들어가거나</strong> 한쪽 유두에서만 피 섞인 분비물이 나옴</li>
<li>유방 크기나 모양의 새로운 변화, 유두 주변 피부의 습진 같은 변화가 낫지 않음</li>
<li>유방 피부가 넓게 붉어지고 붓고 열감이 있음(염증성 유방암은 드물지만 빠르게 진행해요)</li>
</ul>
<p>유방의 멍울은 대부분 양성(섬유선종, 낭종)이지만, 확인은 꼭 필요해요. 월경 전 양쪽 가슴이 붓고 아픈 것은 흔한 변화예요.</p>

<h2>위험 요인</h2>
<div class="tbl"><table>
<thead><tr><th>바꾸기 어려운 요인</th><th>줄일 수 있는 요인</th></tr></thead>
<tbody>
<tr><td>여성, 나이</td><td><strong>음주</strong>: 적은 양도 위험을 높여요</td></tr>
<tr><td>가족력(어머니, 자매, 딸)</td><td><strong>폐경 후 비만</strong></td></tr>
<tr><td>BRCA1·BRCA2 등 유전자 변이</td><td>신체 활동 부족</td></tr>
<tr><td>이른 초경, 늦은 폐경</td><td>여성호르몬·프로게스틴 병합 호르몬 치료를 오래 쓰는 것</td></tr>
<tr><td>출산 경험이 없거나 첫 출산이 늦음</td><td>모유 수유를 하면 위험이 조금 줄어요</td></tr>
<tr><td>치밀유방, 이전 흉부 방사선 치료</td><td></td></tr>
</tbody>
<caption>국가암정보센터, 한국유방암학회 유방암 위험 요인 정보를 바탕으로 정리</caption></table></div>

<h2>국가 유방암 검진</h2>
<ul>
<li><strong>대상:</strong> 40세 이상 여성</li>
<li><strong>주기:</strong> 2년마다</li>
<li><strong>방법:</strong> 유방촬영술(유방을 눌러 찍는 엑스레이)</li>
<li>검진 비용 지원 기준과 본인 부담은 해마다 안내되니 국민건강보험공단 대상자 조회에서 확인해요.</li>
</ul>
<p>유방촬영술은 유방을 판으로 눌러 찍어 잠깐 아플 수 있어요. 월경이 끝나고 일주일쯤 지나 유방이 덜 예민할 때 받으면 덜 아파요.</p>

<h2>치밀유방이란</h2>
<p>유방은 지방과 유선 조직으로 이뤄져 있어요. 유선 조직이 많은 유방을 <strong>치밀유방</strong>이라고 해요. 한국 여성, 특히 40~50대에 흔해요.</p>
<ul>
<li>치밀유방은 유방촬영술에서 하얗게 보여, 같은 하얀색으로 보이는 암을 가려 <strong>놓칠 가능성</strong>이 커져요.</li>
<li>치밀유방 자체가 유방암 위험을 조금 높이는 요인이기도 해요.</li>
<li>그래서 치밀유방인 경우 <strong>유방 초음파</strong>를 함께 받으면 발견율을 높일 수 있어요. 다만 초음파는 양성 병변도 많이 찾아 추가 검사가 늘어날 수 있어요. 개인의 위험도에 맞춰 의사와 상의해요.</li>
</ul>

<h2>결과지 읽는 법(BI-RADS)</h2>
<div class="tbl"><table>
<thead><tr><th>범주</th><th>뜻</th><th>다음 단계</th></tr></thead>
<tbody>
<tr><td>0</td><td>판정 보류</td><td>추가 촬영이나 초음파가 필요해요</td></tr>
<tr><td>1</td><td>정상</td><td>정기 검진</td></tr>
<tr><td>2</td><td>양성(낭종, 석회화 등)</td><td>정기 검진</td></tr>
<tr><td>3</td><td>양성 가능성 높음(암 가능성 약 2% 이하)</td><td>6개월 뒤 추적 검사</td></tr>
<tr><td>4</td><td>암 의심</td><td>조직 검사</td></tr>
<tr><td>5</td><td>암 가능성 높음</td><td>조직 검사</td></tr>
<tr><td>6</td><td>조직 검사로 암 확진</td><td>치료</td></tr>
</tbody>
<caption>미국영상의학회(ACR) BI-RADS 분류, 한국유방암학회 정보를 바탕으로 정리</caption></table></div>
<p>'0'이나 '3'이 나와도 대부분 암이 아니에요. 다만 안내받은 추가 검사와 추적 검사는 꼭 받아요.</p>

<h2>가족력과 유전자 검사</h2>
<p>다음과 같다면 유전 상담과 BRCA 유전자 검사를 고려해요.</p>
<ul>
<li>가족 중 유방암이나 난소암 환자가 여러 명 있어요.</li>
<li>가족 중 40세 이전에 유방암이 생긴 사람이 있어요.</li>
<li>남성 유방암, 양쪽 유방암, 유방암과 난소암을 함께 앓은 가족이 있어요.</li>
</ul>
<p>변이가 확인되면 더 이른 나이부터 MRI를 포함한 검진, 예방적 치료 등을 의사와 상의해요.</p>

<h2>스스로 알아 두기</h2>
<p>매달 정해진 방법으로 꼼꼼히 만지는 자가검진이 사망률을 낮춘다는 근거는 약해요. 대신 샤워할 때나 옷을 갈아입을 때 <strong>내 가슴이 평소 어떤지 알고 있다가 달라진 점</strong>을 알아채는 '유방 인식'이 중요해요. 변화가 있으면 다음 검진을 기다리지 말고 진료를 받아요.</p>

<div class="box"><span class="h">유방 건강 체크리스트</span>
<ol>
<li>40세부터 2년마다 유방촬영술</li>
<li>결과지의 치밀유방·BI-RADS 범주 확인</li>
<li>치밀유방이면 초음파 추가 상담</li>
<li>새 멍울·피부 함몰·유두 변화는 바로 진료</li>
<li>가족력이 강하면 유전 상담</li>
<li>절주, 운동, 폐경 후 체중 관리</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>40세 전에는 검진을 안 받아도 되나요?</dt>
<dd>위험이 평균적인 여성은 국가검진 시작 전 정기 검진이 꼭 필요하지는 않아요. 다만 증상이 있거나 가족력이 강하면 나이와 상관없이 진료를 받아요.</dd>
<dt>유방촬영술 방사선은 괜찮나요?</dt>
<dd>유방촬영술의 방사선량은 매우 적어, 검진으로 얻는 이익이 위험보다 훨씬 커요. 임신 가능성이 있다면 촬영 전에 알려요.</dd>
<dt>남성도 유방암에 걸리나요?</dt>
<dd>드물지만 생겨요. 유두 아래 단단한 멍울이나 유두 분비물이 있으면 진료를 받아요. BRCA2 변이가 있는 가족이라면 더 주의해요.</dd>
</dl>
