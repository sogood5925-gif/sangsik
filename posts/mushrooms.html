  data-title="버섯의 영양: 햇볕 쬔 버섯의 비타민 D, 베타글루칸, 팽이버섯은 꼭 익혀 먹기"

<p class="lead">버섯은 채소 코너에 있지만 식물이 아니라 균류예요. 그래서 채소에 없는 영양 특징이 있어요. 햇볕을 받으면 비타민 D를 만들고, 쫄깃한 식감과 감칠맛으로 고기 대신 요리의 중심이 되기도 해요. 영양을 잘 챙기면서 안전하게 먹는 법을 알아 둘게요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>재배 버섯은 <strong>열량이 낮고 식이섬유, 칼륨, 비타민 B군(나이아신·리보플라빈)</strong>이 풍부해요.</li>
<li>버섯은 <strong>자외선을 받으면 비타민 D</strong>가 늘어나요. 먹기 전 햇볕에 잠시 두면 도움이 돼요.</li>
<li><strong>팽이버섯은 반드시 익혀</strong> 먹어요. 리스테리아균이 검출된 적이 있어요.</li>
<li>야생 버섯은 채취하지 않고 <strong>재배 버섯을 사서</strong> 먹어요.</li>
</ul></div>

<h2>버섯별 특징</h2>
<div class="tbl"><table>
<thead><tr><th>버섯</th><th>특징</th><th>잘 어울리는 요리</th></tr></thead>
<tbody>
<tr><td>표고</td><td>감칠맛이 강하고 말리면 향이 짙어져요. 판토텐산, 구리</td><td>국물, 볶음, 전</td></tr>
<tr><td>느타리</td><td>부드럽고 나이아신, 식이섬유가 많아요</td><td>볶음, 전골</td></tr>
<tr><td>새송이</td><td>식감이 단단하고 수분이 적어 구이에 좋아요</td><td>구이, 장조림</td></tr>
<tr><td>팽이</td><td>식이섬유가 많고 아삭해요. 반드시 익혀 먹어요</td><td>찌개, 전골, 볶음</td></tr>
<tr><td>양송이</td><td>셀레늄, 칼륨. 날로 먹는 요리가 있지만 익히는 편이 안전해요</td><td>수프, 볶음</td></tr>
<tr><td>목이</td><td>식이섬유가 많고 꼬들꼬들해요</td><td>잡채, 볶음</td></tr>
</tbody>

<h2>햇볕과 비타민 D</h2>
<p>버섯에는 자외선을 받으면 비타민 D2로 바뀌는 물질(에르고스테롤)이 있어요. 어두운 곳에서 재배한 버섯은 비타민 D가 거의 없지만, <strong>갓 안쪽(주름)을 위로 향하게 해서 한낮 햇볕에 15분~1시간쯤</strong> 두면 비타민 D가 늘어난다는 연구가 있어요. 햇볕에 말린 표고도 비타민 D가 많아요. 다만 양이 들쭉날쭉해서, 비타민 D가 부족하다고 진단받았다면 의사와 보충 방법을 상의해요.</p>

<h2>베타글루칸, 기대와 근거</h2>
<p>버섯의 세포벽에는 <strong>베타글루칸</strong>이라는 식이섬유가 있어요. 면역 기능에 관여한다는 실험 연구가 많아 건강기능식품으로도 나와요. 하지만 버섯이나 버섯 추출물을 먹어서 감염이나 암을 예방한다는 사람 대상 근거는 아직 충분하지 않아요. 일부 버섯 유래 성분은 암 치료의 보조 약으로 연구되지만, 병원 치료를 대신할 수는 없어요. 음식으로 버섯을 자주 먹는 것 자체는 식이섬유와 영양 면에서 좋아요.</p>

<h2>팽이버섯은 꼭 익혀요</h2>
<div class="box warn"><span class="h">리스테리아 주의</span>
<p>2020년 미국에서 팽이버섯 때문에 <strong>리스테리아</strong> 식중독이 발생해 사망자가 나왔고, 이후 국내에서도 팽이버섯에 <strong>'가열 조리용'</strong> 표시를 하도록 했어요. 리스테리아는 냉장고 온도에서도 자라고, <strong>임신부, 신생아, 어르신, 면역이 약한 사람</strong>에게 특히 위험해요. 팽이버섯은 샐러드로 날로 먹지 말고 <strong>충분히 익혀</strong> 먹어요. 임신 중 열, 근육통, 설사가 생기면 진료 때 먹은 음식을 알려요.</p></div>

<h2>표고버섯 피부염</h2>
<p>덜 익힌 표고버섯을 먹은 뒤 하루 이틀 안에 몸에 <strong>채찍으로 맞은 듯한 줄무늬 발진</strong>이 생기는 경우가 있어요. 표고의 특정 성분에 대한 반응으로, 대개 1~2주 안에 좋아지지만 가렵고 불편해요. 표고는 충분히 익혀 먹고, 이런 발진이 생기면 피부과 진료를 받아요.</p>

<h2>고르고 보관하기</h2>
<div class="tbl"><table>
<thead><tr><th>단계</th><th>요령</th></tr></thead>
<tbody>
<tr><td>고르기</td><td>갓이 단단하고 탄력 있으며, 주름이 선명하고 물러지지 않은 것</td></tr>
<tr><td>씻기</td><td>먹기 직전에 가볍게 씻거나 젖은 행주로 닦아요. 오래 담그면 물을 먹어 맛이 떨어져요</td></tr>
<tr><td>냉장</td><td>종이 타월이나 종이봉투에 싸서 며칠 안에. 비닐에 꽉 싸면 물러져요</td></tr>
<tr><td>냉동·건조</td><td>썰어서 냉동하거나 말려요. 말린 표고는 불린 물도 육수로 써요</td></tr>
<tr><td>버리기</td><td>끈적이거나 냄새가 나고, 검게 물러진 것</td></tr>
</tbody>

<div class="box note"><span class="h">야생 버섯은 먹지 않아요</span>
<p>산에서 딴 버섯은 전문가도 독버섯과 구별하기 어려워요. 버섯은 재배되어 판매되는 것을 사서 먹어요.</p></div>

<div class="box"><span class="h">버섯 체크리스트</span>
<ol>
<li>여러 버섯을 번갈아 먹기</li>
<li>먹기 전 햇볕에 잠시 두기</li>
<li>팽이버섯은 꼭 익히기</li>
<li>표고는 충분히 익히기</li>
<li>먹기 직전에 씻기, 종이에 싸서 냉장</li>
<li>야생 버섯은 채취하지 않기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>버섯이 고기를 대신할 수 있나요?</dt>
<dd>식감과 감칠맛은 비슷하게 낼 수 있지만 단백질은 고기보다 훨씬 적어요. 채식을 한다면 콩, 두부와 함께 먹어요.</dd>
<dt>통풍이 있으면 버섯을 피해야 하나요?</dt>
<dd>버섯에 퓨린이 조금 있지만, 채소 속 퓨린은 통풍 위험을 크게 올리지 않는다는 연구가 많아요. 적당히 먹어도 괜찮아요.</dd>
<dt>버섯을 씻으면 영양이 빠지나요?</dt>
<dd>짧게 씻으면 영양 손실은 적어요. 오래 담가 두지만 않으면 돼요.</dd>
</dl>
