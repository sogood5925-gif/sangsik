  data-title="다낭성난소증후군: 불규칙한 생리, 여드름과 털, 인슐린 저항성까지 함께 보는 호르몬 질환"
  data-thumb="3가지 중 2|진단 기준"
  data-summary="다낭성난소증후군은 가임기 여성에게 흔한 호르몬 질환으로, 생리가 불규칙하고 여드름·털이 늘며 체중과 혈당에도 영향을 줘요. 진단 기준, 난소에 혹이 많다는 뜻의 오해, 오래 방치하면 생길 수 있는 자궁내막·당뇨 문제, 생활 습관과 약 치료, 임신을 원할 때의 선택지를 정리했어요."
  data-tags="다낭성난소증후군,생리불순,여드름,인슐린저항성,질병">
<p class="lead">두세 달에 한 번 생리를 하거나, 턱에 여드름이 계속 나고, 인중과 배에 털이 늘어요. 체중도 쉽게 늘고 잘 빠지지 않아요. 이런 모습이 함께 있다면 다낭성난소증후군일 수 있어요. 이름 때문에 '난소 병'으로만 생각하기 쉽지만, 실제로는 호르몬과 대사가 함께 얽힌 전신 질환에 가까워요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>배란 장애, 남성호르몬 과다, 초음파의 다낭성 난소</strong> 가운데 <strong>두 가지 이상</strong>이면 진단해요.</li>
<li>난소에 보이는 '낭'은 <strong>자라다 멈춘 난포</strong>로, 위험한 혹이 아니에요.</li>
<li><strong>인슐린 저항성</strong>이 흔해 당뇨, 지방간, 이상지질혈증 위험을 함께 확인해요.</li>
<li>생리가 오래 없으면 <strong>자궁내막 보호</strong>가 필요해요. 치료로 조절할 수 있어요.</li>
</ul></div>

<h2>진단 기준</h2>
<div class="tbl"><table>
<thead><tr><th>항목</th><th>모습</th></tr></thead>
<tbody>
<tr><td>배란 장애</td><td>생리 주기가 35일보다 길거나 1년에 8번 이하, 또는 아주 불규칙해요</td></tr>
<tr><td>남성호르몬 과다</td><td>여드름, 얼굴·가슴·배의 굵은 털(다모증), 정수리 탈모, 또는 혈액 검사에서 높은 수치</td></tr>
<tr><td>다낭성 난소</td><td>초음파에서 작은 난포가 많이 보이거나 난소가 커져 있어요. 혈액의 AMH 수치로 대신하기도 해요</td></tr>
</tbody>
<caption>2023 국제 다낭성난소증후군 진료지침(로테르담 기준 개정), 대한산부인과내분비학회 자료를 바탕으로 정리</caption></table></div>
<p>갑상선 질환, 고프로락틴혈증, 선천성 부신 과형성처럼 비슷한 증상을 내는 병을 먼저 가려내야 해요. 사춘기 초기에는 생리가 원래 불규칙할 수 있어 진단을 서두르지 않고 지켜보기도 해요.</p>

<h2>왜 생길까</h2>
<p>정확한 원인은 밝혀지지 않았지만, <strong>유전</strong>적 소인에 <strong>인슐린 저항성</strong>이 더해지는 경우가 많아요. 인슐린이 잘 듣지 않으면 몸이 인슐린을 더 많이 만들고, 높은 인슐린이 난소를 자극해 남성호르몬을 늘리고 배란을 방해해요. 마른 사람에게도 생기지만, 체중이 늘면 증상이 심해지는 경향이 있어요.</p>

<h2>함께 챙겨야 할 건강 문제</h2>
<div class="tbl"><table>
<thead><tr><th>문제</th><th>이유와 확인</th></tr></thead>
<tbody>
<tr><td>자궁내막 증식·암</td><td>배란이 없으면 자궁내막이 두꺼워진 채 떨어지지 않아요. 생리가 3개월 넘게 없으면 치료가 필요해요</td></tr>
<tr><td>당뇨·임신성 당뇨</td><td>정기적으로 혈당(필요하면 당부하 검사) 확인</td></tr>
<tr><td>이상지질혈증, 지방간, 고혈압</td><td>지질·간 수치·혈압 확인</td></tr>
<tr><td>수면무호흡증</td><td>코골이, 낮 졸림이 있으면 확인</td></tr>
<tr><td>우울·불안, 섭식 문제</td><td>외모 변화와 호르몬 영향으로 흔해요. 이야기해 주세요</td></tr>
<tr><td>난임</td><td>배란이 불규칙해 임신이 늦어질 수 있어요</td></tr>
</tbody>
<caption>2023 국제 다낭성난소증후군 진료지침을 바탕으로 정리</caption></table></div>

<h2>치료</h2>
<ul>
<li><strong>생활 습관:</strong> 체중이 많다면 <strong>5~10%</strong>만 줄여도 생리가 돌아오고 배란이 생기기도 해요. 규칙적인 운동은 체중과 상관없이 인슐린 저항성을 줄여요.</li>
<li><strong>복합 경구피임약:</strong> 생리 주기를 규칙적으로 만들고 자궁내막을 보호하며, 여드름과 털을 줄여요.</li>
<li><strong>프로게스틴 주기 요법:</strong> 피임약을 쓰기 어려울 때 주기적으로 생리를 나오게 해요.</li>
<li><strong>메트포르민:</strong> 인슐린 저항성이 크거나 체중·혈당 관리가 필요할 때 함께 써요.</li>
<li><strong>항안드로겐 약</strong>(스피로놀락톤 등), 레이저 제모: 다모증에. 임신 중 쓰면 안 되는 약이라 피임과 함께 써요.</li>
<li>약은 모두 의사와 상의해 고르고, 스스로 끊거나 바꾸지 않아요.</li>
</ul>

<h2>임신을 원한다면</h2>
<p>체중 관리와 함께 배란을 유도하는 약(레트로졸이 흔히 1차로 쓰여요)을 사용해요. 반응이 없으면 주사 치료, 시험관 시술 등으로 넘어가요. 다낭성난소증후군이 있어도 많은 사람이 임신에 성공해요. 임신 중에는 임신성 당뇨와 임신중독증 위험이 높아 산전 관리를 꼼꼼히 받아요.</p>

<div class="box warn"><span class="h">진료를 미루지 말아야 할 때</span>
<ul>
<li>생리가 <strong>3개월 넘게</strong> 없어요(임신이 아닐 때).</li>
<li>생리가 아닌 때 출혈이 반복되거나 출혈이 매우 많아요.</li>
<li>목소리가 굵어지거나 근육이 늘고 털이 <strong>빠르게</strong> 늘어요. 다른 호르몬 질환일 수 있어요.</li>
<li>기분이 크게 가라앉거나 먹는 것 때문에 괴로워요.</li>
</ul></div>

<div class="box"><span class="h">다낭성난소증후군 체크리스트</span>
<ol>
<li>생리 주기 앱이나 달력에 기록</li>
<li>3개월 넘게 없으면 진료</li>
<li>혈당·지질·간 수치 정기 확인</li>
<li>주 150분 운동, 근력 운동 더하기</li>
<li>체중이 많다면 5~10% 목표</li>
<li>임신 계획은 미리 상의</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>난소에 혹이 많다는데 수술해야 하나요?</dt>
<dd>다낭성 난소의 작은 낭은 자라다 멈춘 난포라서 떼어 낼 필요가 없어요. 난소 종양과는 다른 것이에요.</dd>
<dt>피임약을 오래 먹어도 되나요?</dt>
<dd>대부분 오래 써도 괜찮지만, 흡연, 편두통(전조 동반), 혈전 병력이 있으면 쓰기 어려울 수 있어요. 정기적으로 의사와 확인해요.</dd>
<dt>평생 가는 병인가요?</dt>
<dd>체질처럼 오래 이어지지만, 나이가 들며 생리가 규칙적으로 바뀌는 경우도 있어요. 대사 건강은 평생 챙기는 것이 좋아요.</dd>
</dl>
