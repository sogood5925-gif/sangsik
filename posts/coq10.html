<p class="lead">콜레스테롤 약(스타틴)을 먹기 시작하면서 코엔자임 Q10을 함께 권유받는 경우가 많아요. 스타틴이 몸속 코엔자임 Q10 생성을 줄인다는 사실은 맞지만, 보충제가 근육통을 줄여 준다는 근거는 생각보다 약해요. 무엇이 확인됐고 무엇이 아직인지 나눠 볼게요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>코엔자임 Q10은 <strong>몸에서 스스로 만드는</strong> 물질이라 필수 영양소는 아니에요.</li>
<li>스타틴은 코엔자임 Q10 생성을 줄이지만, 보충제가 <strong>스타틴 근육통을 줄인다는 근거는 엇갈려요.</strong></li>
<li>심부전 환자 일부 연구에서 도움이 됐다는 결과가 있지만 <strong>표준 치료를 대신하지 못해요.</strong></li>
<li><strong>와파린</strong>을 먹는다면 효과를 떨어뜨릴 수 있어 먼저 상의해요.</li>
</ul></div>

<h2>코엔자임 Q10은 어떤 물질일까</h2>
<p>코엔자임 Q10(유비퀴논)은 세포 안의 에너지 공장인 <strong>미토콘드리아</strong>에서 에너지를 만드는 과정에 쓰여요. 환원된 형태(유비퀴놀)는 세포막을 보호하는 항산화 역할도 해요. 심장, 간, 콩팥, 근육처럼 에너지를 많이 쓰는 기관에 많아요.</p>
<ul>
<li>몸에서 콜레스테롤과 같은 경로(메발론산 경로)로 만들어져요.</li>
<li>나이가 들면 일부 조직의 농도가 줄어든다고 알려져 있어요.</li>
<li>음식으로 먹는 양은 하루 몇 mg 정도로, 몸이 만드는 양에 비해 적어요.</li>
</ul>

<h2>음식 속 코엔자임 Q10</h2>

<tbody>

<tr><td>고등어, 정어리</td><td class="num">약 5~6mg</td></tr>
<tr><td>소고기</td><td class="num">약 3mg</td></tr>
<tr><td>닭고기</td><td class="num">약 1~2mg</td></tr>
<tr><td>땅콩, 참깨</td><td class="num">약 2~3mg</td></tr>
<tr><td>브로콜리, 시금치</td><td class="num">1mg 미만</td></tr>
</tbody>

<h2>스타틴과 근육통</h2>
<p>스타틴은 콜레스테롤을 만드는 효소를 막는데, 같은 경로로 만들어지는 코엔자임 Q10도 함께 줄어요. 그래서 스타틴 근육통의 원인이 코엔자임 Q10 부족이라는 가설이 나왔어요.</p>
<ul>
<li>여러 무작위 연구를 모은 분석에서 결과가 <strong>엇갈렸어요.</strong> 일부는 근육 증상이 줄었고, 일부는 위약과 차이가 없었어요.</li>
<li>스타틴을 먹는 사람이 호소하는 근육통의 상당수는 스타틴 때문이 아니라는 연구도 있어요(위약과 스타틴을 번갈아 먹은 연구에서 증상 차이가 거의 없었어요).</li>
<li>그래서 주요 학회는 스타틴 근육통에 코엔자임 Q10을 <strong>일상적으로 권하지 않아요.</strong> 먹어 보고 싶다면 해가 크지 않으니 의사와 상의해 시도해 볼 수는 있어요.</li>
</ul>
<div class="box warn"><span class="h">근육통이 있으면 먼저 확인할 것</span>
<p>스타틴을 먹는 중 <strong>근육이 심하게 아프고 힘이 빠지거나, 소변이 콜라색</strong>이면 드물지만 심한 근육 손상(횡문근융해증)일 수 있어요. 바로 진료를 받아요. 가벼운 근육통이라면 스스로 약을 끊지 말고 의사와 용량 조절, 약 변경을 상의해요. 갑상선 기능 저하, 비타민 D 부족, 과한 운동도 근육통의 원인이 될 수 있어요.</p></div>

<h2>다른 쓰임새의 근거</h2>
<div class="tbl"><table>
<thead><tr><th>목적</th><th>연구 결과 요약</th></tr></thead>
<tbody>
<tr><td>심부전</td><td>표준 치료에 더해 코엔자임 Q10을 먹은 연구(Q-SYMBIO)에서 심혈관 사건이 줄었지만 규모가 작아 확증은 아니에요</td></tr>
<tr><td>혈압</td><td>일부 분석에서 조금 낮아졌지만 연구 질이 낮아 결론을 내리기 어려워요</td></tr>
<tr><td>편두통 예방</td><td>일부 작은 연구에서 횟수가 줄었어요</td></tr>
<tr><td>피로, 운동 능력, 노화</td><td>건강한 사람에게 뚜렷한 효과는 확인되지 않았어요</td></tr>
<tr><td>미토콘드리아 질환</td><td>희귀 질환에서 치료의 일부로 쓰여요</td></tr>
</tbody>
<caption>미국 국립보건원(NIH) 국립보완통합건강센터, 코크란 체계적 문헌고찰, Mortensen 외 Q-SYMBIO(2014)를 바탕으로 정리</caption></table></div>

<h2>보충제를 먹는다면</h2>
<ul>
<li>기름에 녹는 성분이라 <strong>식사와 함께</strong> 먹으면 흡수가 좋아져요.</li>
<li>보통 하루 100~200mg 정도가 연구에 많이 쓰였어요. 부작용은 드물지만 속쓰림, 구역질, 불면이 생길 수 있어요.</li>
<li><strong>와파린</strong>의 효과를 떨어뜨릴 수 있어요. 함께 먹는다면 혈액 응고 수치(INR)를 확인해요.</li>
<li>혈압약, 당뇨약과 함께 먹으면 혈압과 혈당이 조금 더 내려갈 수 있어요.</li>
<li>유비퀴논과 유비퀴놀 형태 중 어느 쪽이 임상적으로 더 나은지는 분명하지 않아요.</li>
<li>임신·수유 중 안전성 자료는 부족해요.</li>
</ul>

<div class="box"><span class="h">코엔자임 Q10 체크리스트</span>
<ol>
<li>필수 영양소는 아니라는 점 기억하기</li>
<li>스타틴 근육통은 먼저 의사와 상의</li>
<li>심한 근육통·콜라색 소변은 즉시 진료</li>
<li>와파린 복용 중이면 먼저 확인</li>
<li>먹는다면 식사와 함께</li>
<li>효과 없으면 계속할지 다시 판단</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>나이가 들면 꼭 먹어야 하나요?</dt>
<dd>나이가 들며 일부 조직의 농도가 줄어든다는 자료는 있지만, 건강한 노인이 보충제를 먹어 질병이 예방된다는 근거는 없어요.</dd>
<dt>화장품의 코엔자임 Q10은 효과가 있나요?</dt>
<dd>피부 보습이나 주름에 대한 연구는 작고 제한적이에요. 자외선 차단과 보습이 먼저예요.</dd>
<dt>스타틴을 끊고 코엔자임 Q10만 먹으면 안 되나요?</dt>
<dd>코엔자임 Q10은 콜레스테롤을 낮추지 않고, 스타틴처럼 심근경색과 뇌졸중을 예방하는 효과가 없어요. 스타틴을 스스로 끊지 않아요.</dd>
</dl>
