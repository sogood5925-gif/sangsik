  data-thumb="50세|국가검진 시작"
  data-summary="대장암은 대부분 작은 용종에서 10년 넘게 천천히 자라요. 그래서 검진으로 미리 찾아 없애면 예방할 수 있는 암이에요. 국가 대장암 검진의 방법과 대상, 분변잠혈 양성의 의미, 가족력이 있을 때, 대장내시경 준비, 놓치기 쉬운 증상과 위험 요인을 정리했어요."
  data-tags="대장암,대장내시경,용종,분변잠혈검사,암검진">
<p class="lead">대장암은 국내에서 가장 흔한 암 중 하나지만, 동시에 검진으로 가장 확실하게 예방할 수 있는 암 중 하나예요. 암이 되기 전의 용종을 내시경으로 떼어낼 수 있기 때문이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>대장암의 대부분은 <strong>선종성 용종</strong>이 <strong>10년 이상</strong>에 걸쳐 암으로 자라요.</li>
<li>국가암검진은 <strong>50세 이상 매년 분변잠혈검사</strong>예요. <strong>양성이면 반드시 대장내시경</strong>을 받아요.</li>
<li>부모·형제가 대장암이면 <strong>40세 또는 더 일찍</strong> 대장내시경을 시작해요.</li>
<li><strong>혈변을 치질 탓으로</strong> 넘기지 말고, 배변 습관이 달라지면 검사를 받아요.</li>
</ul></div>

<h2>용종에서 암까지</h2>
<p>대장 안쪽 점막에 생기는 혹을 용종이라고 해요. 용종 중 <strong>선종</strong>은 시간이 지나며 일부가 암으로 변할 수 있어요. 이 과정은 보통 <strong>10년 이상</strong> 걸려요. 대장내시경 중에 용종을 발견하면 그 자리에서 떼어낼 수 있어서, 암이 되기 전에 막을 수 있어요.</p>
<p>대장암은 일찍 발견할수록 치료 결과가 매우 좋아요. 암이 대장에만 있을 때 발견하면 대부분 완치를 기대할 수 있지만, 다른 장기로 퍼진 뒤에는 치료가 훨씬 어려워져요.</p>

<h2>국가 대장암 검진</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th>주기</th><th>1차 검사</th><th>양성일 때</th></tr></thead>
<tbody>
<tr><td>50세 이상</td><td>1년</td><td>분변잠혈검사 (대변 속 보이지 않는 피 확인)</td><td>대장내시경 (또는 대장이중조영검사)</td></tr>
</tbody>
<caption>국립암센터·국민건강보험공단 국가암검진 기준</caption></table></div>
<h3>분변잠혈검사 양성의 의미</h3>
<p>양성이라고 모두 암은 아니에요. 치질, 용종, 염증으로도 양성이 나올 수 있어요. 하지만 양성인 사람 중 일부에서 진행성 선종이나 대장암이 발견돼요. <strong>양성이 나오고도 대장내시경을 받지 않으면 검진의 의미가 사라져요.</strong> 국가검진에서 양성이 나오면 대장내시경 비용도 지원돼요.</p>
<h3>대장내시경을 바로 받아도 될까</h3>
<p>분변잠혈검사 대신 처음부터 대장내시경을 받는 사람도 많아요. 대장내시경은 용종을 직접 보고 제거할 수 있어 가장 정확한 검사예요. 결과가 정상이면 보통 <strong>5~10년 뒤</strong>에 다시 받고, 용종이 있었다면 개수와 종류에 따라 의사가 다음 검사 시기를 정해요.</p>

<h2>더 일찍 검사해야 하는 사람</h2>
<ul>
<li><strong>부모, 형제자매, 자녀 중 대장암 환자</strong>가 있는 경우: 대개 40세, 또는 가족이 진단받은 나이보다 10년 일찍 대장내시경을 시작해요.</li>
<li>가족 중 여러 명이 젊은 나이에 대장암이나 자궁내막암 등을 겪은 경우: 유전성 대장암(린치 증후군 등) 상담이 필요해요.</li>
<li><strong>염증성 장질환</strong>(궤양성 대장염, 크론병)이 오래된 경우</li>
<li>이전에 선종이나 대장암이 있었던 경우</li>
</ul>

<h2>놓치기 쉬운 증상</h2>
<p>초기 대장암은 대부분 증상이 없어요. 그래서 검진이 중요해요. 진행하면 이런 증상이 나타날 수 있어요.</p>
<ul>
<li>대변에 피가 섞이거나 검붉은 변</li>
<li>변비나 설사처럼 <strong>배변 습관이 몇 주 넘게</strong> 달라짐</li>
<li>변이 가늘어짐, 봐도 개운하지 않음</li>
<li>이유 없는 빈혈, 피로</li>
<li>의도하지 않은 체중 감소</li>
<li>배가 자주 아프거나 덩어리가 만져짐</li>
</ul>
<div class="box warn"><span class="h">혈변을 치질로만 생각하지 마세요</span>
<p>치질이 있는 사람도 대장암이 함께 있을 수 있어요. 특히 <strong>40대 이후 처음 생긴 혈변</strong>, 변과 섞인 피, 배변 습관 변화나 빈혈이 함께 있다면 대장내시경으로 확인해요. 최근에는 50세 미만 젊은 층의 대장암이 늘고 있다는 보고가 많아, 나이가 젊어도 증상이 있으면 검사를 미루지 않아요.</p></div>

<h2>위험 요인과 예방</h2>
<div class="tbl"><table>
<thead><tr><th>위험을 높이는 것</th><th>위험을 낮추는 것</th></tr></thead>
<tbody>
<tr><td>가공육(햄, 소시지, 베이컨), 많은 붉은 고기</td><td>규칙적인 신체 활동</td></tr>
<tr><td>비만, 특히 복부비만</td><td>식이섬유가 많은 통곡물, 채소, 과일</td></tr>
<tr><td>음주</td><td>유제품과 칼슘</td></tr>
<tr><td>흡연</td><td>금연</td></tr>
<tr><td>운동 부족, 오래 앉아 있는 생활</td><td>건강한 체중 유지</td></tr>
<tr><td>나이, 가족력, 염증성 장질환</td><td>정기 검진으로 용종 제거</td></tr>
</tbody>
<caption>세계암연구기금(WCRF), 국립암센터 자료를 바탕으로 정리</caption></table></div>

<h2>대장내시경 준비와 과정</h2>
<ol>
<li><strong>2~3일 전:</strong> 씨가 있는 과일(수박, 참외, 포도, 키위), 잡곡, 김·미역 같은 해조류, 섬유질이 많은 채소를 피하고 흰죽이나 흰밥 위주로 먹어요.</li>
<li><strong>전날과 당일:</strong> 병원에서 받은 <strong>장정결제</strong>를 안내된 시간과 양대로 마셔요. 장이 깨끗해야 작은 용종도 놓치지 않아요.</li>
<li><strong>대변이 노란 물처럼 맑아지면</strong> 준비가 잘 된 거예요.</li>
<li><strong>복용 약 확인:</strong> 항응고제, 항혈소판제, 당뇨약은 미리 의사와 조절 여부를 상의해요.</li>
<li>수면(진정) 내시경을 받았다면 당일에는 운전하지 않아요.</li>
</ol>
<p>용종을 떼어낸 뒤 드물게 출혈이나 천공이 생길 수 있어요. 검사 후 며칠 안에 심한 복통, 많은 혈변, 열이 있으면 병원에 연락해요.</p>

<div class="box"><span class="h">대장 건강 체크리스트</span>
<ol>
<li>50세 이상이면 올해 분변잠혈검사 받았는지 확인하기</li>
<li>양성이 나왔다면 대장내시경 예약하기</li>
<li>가족 중 대장암이 있다면 40세 전후로 대장내시경 받기</li>
<li>가공육 줄이고 채소·통곡물 늘리기</li>
<li>하루 30분 몸 움직이기</li>
<li>혈변이나 배변 습관 변화가 있으면 나이와 관계없이 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>분변잠혈검사가 음성이면 안심해도 되나요?</dt>
<dd>음성이면 그해 대장암 가능성은 낮지만, 용종이나 일부 암은 피가 나지 않아 놓칠 수 있어요. 그래서 매년 반복하는 게 중요하고, 증상이 있다면 결과와 관계없이 진료를 받아요.</dd>
<dt>대장내시경은 몇 살까지 받아야 하나요?</dt>
<dd>일반적으로 75세 전후까지는 검진의 이득이 크다고 봐요. 그 이후는 건강 상태와 이전 검사 결과를 고려해 의사와 결정해요.</dd>
<dt>용종이 있었다면 암에 걸린 건가요?</dt>
<dd>아니에요. 용종을 발견해 떼어냈다면 오히려 암을 예방한 거예요. 다만 용종이 생기기 쉬운 체질일 수 있어 다음 검사를 좀 더 일찍 받아요.</dd>
</dl>
