  data-title="단백질 보충제: 누구에게 필요할까, 유청·카제인·식물성의 차이, 해외 직구 제품과 콩팥 주의"
  data-thumb="20~40g|한 번에 쓰이는 양"
  data-summary="운동하는 사람뿐 아니라 어르신과 다이어트하는 사람도 단백질 보충제를 많이 찾아요. 하루 단백질 필요량과 보충제가 도움이 되는 경우, 유청(WPC·WPI)·카제인·대두·완두 단백질의 차이, 한 번에 얼마나 먹을지, 콩팥 질환과 유당 불내증, 해외 직구 제품의 불법 성분 문제를 정리했어요."
  data-tags="단백질보충제,프로틴,유청단백,근감소증,영양소">
<p class="lead">헬스장뿐 아니라 편의점과 마트에서도 단백질 음료와 파우더를 쉽게 볼 수 있어요. 단백질 보충제는 음식으로 단백질을 채우기 어려운 사람에게 편리한 도구예요. 하지만 이미 충분히 먹고 있다면 더 먹는다고 근육이 더 붙지는 않아요. 내게 필요한지부터 따져 볼게요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>보통 성인은 체중 1kg당 하루 <strong>약 0.8g</strong>, 근력 운동을 꾸준히 하면 <strong>1.2~2.0g</strong> 정도면 충분해요.</li>
<li>보충제는 <strong>식사로 채우기 어려울 때</strong> 편리한 방법이에요. 음식보다 특별하지 않아요.</li>
<li><strong>콩팥병</strong>이 있다면 단백질을 늘리기 전에 의사와 상의해요.</li>
<li><strong>해외 직구 제품</strong>에는 스테로이드 같은 불법 성분이 섞여 적발된 사례가 있어요.</li>
</ul></div>

<h2>하루에 얼마나 필요할까</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th class="num">단백질(체중 1kg당 하루, 대략)</th></tr></thead>
<tbody>
<tr><td>일반 성인</td><td class="num">0.8g 안팎(권장섭취량 남성 60~65g, 여성 50~55g)</td></tr>
<tr><td>규칙적으로 근력·지구력 운동</td><td class="num">1.2~2.0g</td></tr>
<tr><td>65세 이상(근감소 예방)</td><td class="num">1.0~1.2g, 질병이 있으면 더 필요할 수 있어요</td></tr>
<tr><td>체중 감량 중</td><td class="num">근육 손실을 줄이려면 조금 더(1.2g 이상)</td></tr>
</tbody>
<caption>보건복지부·한국영양학회 2020 한국인 영양소 섭취기준, 국제스포츠영양학회(ISSN) 입장문(2017), 유럽임상영양대사학회(ESPEN)·PROT-AGE 권고를 바탕으로 정리</caption></table></div>
<p>예를 들어 체중 60kg인 사람이 근력 운동을 한다면 하루 70~120g 정도예요. 달걀 2개(약 12g), 두부 반 모(약 15g), 닭가슴살 100g(약 23g), 우유 한 컵(약 6g)을 더하면 식사로도 꽤 채울 수 있어요.</p>

<h2>보충제가 도움이 되는 경우</h2>
<ul>
<li>식사량이 적은 <strong>어르신</strong>, 근감소가 걱정될 때</li>
<li>입맛이 없거나 씹기 어려울 때, 수술이나 병을 앓은 뒤 회복기</li>
<li>근력 운동을 많이 하는데 식사로 채우기 어려울 때</li>
<li>체중 감량 중 식사를 줄이면서 단백질은 지키고 싶을 때</li>
<li>채식으로 단백질이 부족하기 쉬울 때</li>
</ul>

<h2>종류별 차이</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>특징</th><th>이런 사람에게</th></tr></thead>
<tbody>
<tr><td>유청 농축(WPC)</td><td>우유 유청 단백질. 흡수가 빠르고 류신이 많아요. 유당이 조금 있어요</td><td>일반적인 운동 후 보충</td></tr>
<tr><td>유청 분리(WPI)</td><td>유당과 지방을 더 걸러 단백질 비율이 높아요</td><td>우유를 마시면 배가 불편한 사람</td></tr>
<tr><td>카제인</td><td>천천히 소화돼 오래 공급돼요</td><td>자기 전, 식사 간격이 길 때</td></tr>
<tr><td>대두 단백</td><td>식물성 중 필수 아미노산 구성이 좋아요</td><td>채식, 우유 알레르기</td></tr>
<tr><td>완두·쌀 등 식물성 혼합</td><td>여러 식물성 단백질을 섞어 구성을 보완해요</td><td>채식, 대두·우유 알레르기</td></tr>
</tbody>
<caption>국제스포츠영양학회(ISSN) 단백질 입장문, 식품의약품안전처 건강기능식품 정보를 바탕으로 정리</caption></table></div>

<h2>먹는 방법</h2>
<ul>
<li>한 번에 <strong>20~40g</strong>을 하루 여러 끼에 나눠 먹는 것이 근육 합성에 유리해요. 한 번에 아주 많이 먹는다고 더 좋아지지 않아요.</li>
<li>운동 후 몇 시간 안에 먹으면 좋지만, 하루 전체 양이 더 중요해요.</li>
<li><strong>1회 제공량의 단백질과 열량, 당류</strong>를 확인해요. 맛을 낸 제품은 당이 많은 경우가 있어요.</li>
<li>보충제만 먹고 식사를 거르면 다른 영양소가 부족해져요. 식사를 보태는 용도로 써요.</li>
</ul>

<div class="box warn"><span class="h">이런 경우 조심해요</span>
<ul>
<li><strong>만성 콩팥병</strong>: 단백질을 많이 먹으면 콩팥에 부담이 될 수 있어요. 적정량을 의사·영양사와 정해요. 건강한 콩팥에 문제를 일으킨다는 근거는 뚜렷하지 않아요.</li>
<li><strong>우유·대두 알레르기</strong>: 원재료를 꼭 확인해요.</li>
<li><strong>해외 직구·인터넷 판매 제품</strong>: 근육 증가를 내세운 제품에서 스테로이드, 남성호르몬 유사 물질 같은 불법 성분이 적발된 적이 있어요. 식약처 '해외직구 위해식품 차단 정보'를 확인해요.</li>
<li>보충제를 먹은 뒤 <strong>여드름이 심해지거나 소변 색이 짙어지고 피로, 황달</strong>이 생기면 중단하고 진료를 받아요.</li>
</ul></div>

<h2>어르신에게 특히</h2>
<p>나이가 들면 같은 양의 단백질을 먹어도 근육이 덜 만들어져요. 아침 식사에 단백질이 적은 경우가 많으니 <strong>세 끼 모두 단백질 반찬</strong>을 챙기고, 부족하면 우유·두유나 단백질 보충 음료를 더해요. 단백질만으로는 근육이 늘지 않아요. <strong>근력 운동을 함께</strong> 해야 효과가 커요.</p>

<div class="box"><span class="h">단백질 보충제 체크리스트</span>
<ol>
<li>내 체중으로 필요량 계산하기</li>
<li>식사로 먼저 채우고 부족분만 보충</li>
<li>한 번 20~40g, 끼니마다 나누기</li>
<li>당류·열량 확인</li>
<li>콩팥병이면 의사와 상의</li>
<li>출처 불분명한 해외 제품 피하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>보충제를 먹으면 살이 찌나요?</dt>
<dd>보충제도 열량이 있어요. 식사에 더해 많이 먹으면 체중이 늘 수 있어요. 필요한 만큼만 먹어요.</dd>
<dt>여성이 먹으면 근육이 울퉁불퉁해지나요?</dt>
<dd>단백질만으로 근육이 크게 늘지는 않아요. 근육의 크기는 운동 방식, 호르몬, 유전에 따라 달라요.</dd>
<dt>우유를 마시면 배가 아픈데 유청 보충제는 괜찮을까요?</dt>
<dd>유당이 적은 유청 분리(WPI)나 식물성 단백질을 고르면 불편이 줄 수 있어요.</dd>
</dl>
