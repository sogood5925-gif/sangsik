<p class="lead">"원금 보장에 한 달 20% 수익", "유명 투자자가 직접 알려 주는 종목". 이런 말에 넘어갈 리 없다고 생각하지만, 사기범은 몇 주에서 몇 달에 걸쳐 친절하게 다가오고, 실제로 작은 수익을 보여 줘요. 그래서 똑똑하고 신중한 사람도 피해를 입어요. 흐름을 알아 두면 중간에 멈출 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>원금 보장과 높은 수익</strong>을 함께 약속하면 사기를 먼저 의심해요.</li>
<li>"출금하려면 <strong>세금·수수료·보증금</strong>을 먼저 내라"는 말은 전형적인 사기 신호예요.</li>
<li>투자 전에 금융감독원 <strong>'파인'</strong>에서 <strong>제도권 금융회사인지</strong> 확인해요.</li>
<li>돈을 보냈다면 즉시 <strong>보낸 은행과 112</strong>에 알리고, 금융감독원(1332)에 상담해요.</li>
</ul></div>

<h2>투자 사기는 이렇게 흘러가요</h2>
<div class="tbl"><table>
<thead><tr><th>단계</th><th>모습</th></tr></thead>
<tbody>
<tr><td>1. 접근</td><td>유명인 사진을 쓴 광고, 문자, 오픈 채팅방 초대, 잘못 보낸 척하는 메시지</td></tr>
<tr><td>2. 신뢰 쌓기</td><td>무료 종목 추천, 수익 인증 사진, 채팅방 속 다른 회원(대부분 바람잡이)의 감사 인사</td></tr>
<tr><td>3. 작은 성공</td><td>전용 앱·사이트에 소액을 넣게 하고, 수익을 보여 주며 출금도 한 번 허락해요</td></tr>
<tr><td>4. 큰 투자</td><td>"지금이 기회", "한정 공모주", "기관 전용"이라며 대출까지 권해요</td></tr>
<tr><td>5. 출금 차단</td><td>출금을 요청하면 세금, 수수료, 계좌 인증비, 보증금을 먼저 내라고 해요</td></tr>
<tr><td>6. 잠적</td><td>앱이 닫히고 연락이 끊겨요</td></tr>
</tbody>
<caption>금융감독원 불법 금융투자 사기 소비자 경보를 바탕으로 정리</caption></table></div>

<h2>로맨스 스캠</h2>
<p>사회관계망 서비스나 데이트 앱에서 만난 사람이 몇 주간 다정하게 연락하며 관계를 쌓은 뒤 돈 이야기를 꺼내요.</p>
<ul>
<li>해외 파병 군인, 의사, 사업가, 승무원 등 <strong>그럴듯한 직업</strong>을 내세워요.</li>
<li><strong>영상 통화나 직접 만남을 계속 피하거나</strong>, 짧은 영상만 보내요. 요즘은 얼굴 합성 영상도 써요.</li>
<li>"우리 미래를 위해"라며 <strong>코인·해외 투자 사이트</strong>를 권하거나, 선물 통관비·병원비·항공권을 부탁해요.</li>
<li>주변에 알리지 말라고 해요.</li>
</ul>
<p>온라인에서만 만난 사람이 돈이나 투자를 이야기하면, 감정과 상관없이 거기서 멈춰요.</p>

<h2>위험 신호</h2>
<div class="tbl"><table>
<thead><tr><th>이런 말·상황</th><th>왜 위험할까</th></tr></thead>
<tbody>
<tr><td>원금 보장 + 고수익</td><td>정상적인 투자는 수익이 높을수록 위험도 커요. 둘을 함께 약속하는 것은 법으로 금지된 유사수신일 수 있어요</td></tr>
<tr><td>유명인·금융회사 이름을 쓴 광고</td><td>허락 없이 사진과 이름을 도용한 경우가 많아요</td></tr>
<tr><td>메신저 방에서만 소통, 전용 앱 설치 요구</td><td>가짜 거래 화면으로 수익을 꾸며 보여 줘요</td></tr>
<tr><td>개인 명의 계좌로 입금</td><td>정상 금융회사는 개인 계좌로 투자금을 받지 않아요</td></tr>
<tr><td>출금 전에 돈을 더 내라</td><td>돌려줄 돈이 애초에 없다는 뜻이에요</td></tr>
<tr><td>서두르게 함, 비밀로 하라고 함</td><td>생각하고 상의할 시간을 빼앗는 수법이에요</td></tr>
</tbody>
<caption>금융감독원, 경찰청 사이버범죄 예방 안내를 바탕으로 정리</caption></table></div>

<h2>투자 전 확인하는 법</h2>
<ol>
<li>금융감독원 금융소비자 정보 포털 <strong>'파인'</strong>에서 <strong>제도권 금융회사 조회</strong>를 해요. 등록되지 않은 곳이면 투자하지 않아요.</li>
<li>회사 이름이 같아도 <strong>누리집 주소와 대표 전화</strong>가 공식과 같은지 확인해요. 가짜 사이트가 많아요.</li>
<li>유료 종목 추천 서비스는 금융위원회에 신고된 유사투자자문업자인지 확인해요. 신고됐더라도 1:1 투자 자문이나 투자금 운용은 할 수 없어요.</li>
<li>가족이나 믿을 만한 사람에게 <strong>한 번 이야기해 봐요.</strong> 제3자의 눈에는 이상한 점이 잘 보여요.</li>
</ol>

<div class="box warn"><span class="h">돈을 보냈다면 바로</span>
<ol>
<li><strong>돈을 보낸 은행(또는 받은 계좌의 은행)</strong> 고객센터에 연락해 지급 정지를 요청해요.</li>
<li><strong>112</strong>에 신고하고, 경찰청 사이버범죄 신고 시스템에 신고서를 내요.</li>
<li>금융감독원 <strong>1332</strong>에 상담하고 불법 금융 신고를 해요.</li>
<li>대화 내용, 입금 내역, 앱·사이트 주소, 광고 화면을 <strong>캡처해 보관</strong>해요.</li>
<li>'피해금을 찾아 준다'는 연락은 2차 사기일 수 있어요. 수수료를 먼저 요구하면 응하지 않아요.</li>
</ol></div>

<h2>내 계좌가 범죄에 쓰이지 않게</h2>
<ul>
<li>"통장만 빌려주면 돈을 준다", "환전 아르바이트"는 범죄 계좌를 모으는 수법이에요. 통장과 카드를 빌려주면 처벌받을 수 있어요.</li>
<li>신분증 사진, 인증번호를 보내지 않아요.</li>
<li>모르는 사람이 내 계좌로 돈을 보내고 되돌려 달라고 하면 은행에 먼저 알려요.</li>
</ul>

<div class="box"><span class="h">투자 사기 예방 체크리스트</span>
<ol>
<li>원금 보장 + 고수익이면 멈추기</li>
<li>파인에서 제도권 금융회사 조회</li>
<li>개인 계좌 입금 요구 거절</li>
<li>출금 전 수수료 요구는 사기 신호</li>
<li>온라인 연인이 돈 얘기하면 멈추기</li>
<li>가족과 먼저 상의하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>처음에 출금이 잘 됐는데도 사기일 수 있나요?</dt>
<dd>네, 작은 출금을 허락하는 것은 믿음을 사서 더 큰돈을 넣게 하려는 흔한 수법이에요.</dd>
<dt>부끄러워서 가족에게 말을 못 하겠어요.</dt>
<dd>투자 사기는 누구나 당할 수 있도록 정교하게 설계돼요. 빨리 알리고 신고할수록 피해를 줄일 가능성이 커요. 금융감독원 1332 상담부터 시작해도 돼요.</dd>
<dt>해외 코인 거래소는 괜찮나요?</dt>
<dd>국내에 신고하지 않은 해외 가상자산 사업자는 피해가 나도 구제받기 어려워요. 금융정보분석원에 신고된 사업자인지 확인해요.</dd>
</dl>
