  data-title="요실금과 과민성 방광: 기침할 때 새는 소변, 참을 수 없는 급한 소변, 골반저근 운동부터 시작하기"
  data-thumb="8회|하루 소변 횟수 기준"
  data-summary="웃거나 기침할 때 소변이 새거나, 갑자기 급해서 화장실까지 참지 못하는 일은 나이 탓만이 아니라 치료할 수 있는 병이에요. 복압성·절박성 요실금과 과민성 방광의 차이, 배뇨 일지 쓰는 법, 골반저근 운동과 방광 훈련, 생활 습관, 약과 시술·수술, 바로 진료가 필요한 증상을 정리했어요."
  data-tags="요실금,과민성방광,골반저근운동,빈뇨,질병">
<p class="lead">재채기할 때 소변이 찔끔 새서 외출할 때마다 패드를 챙기거나, 화장실 위치부터 확인하게 되는 사람이 많아요. 부끄러워서 말하지 못하고 '나이 들면 다 그렇지' 하며 참는 경우가 흔하지만, 요실금과 과민성 방광은 운동과 습관만으로도 꽤 좋아질 수 있는 병이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>기침·재채기·뛸 때 새면 <strong>복압성</strong>, 갑자기 급해서 참지 못하면 <strong>절박성</strong> 요실금이에요.</li>
<li>하루 <strong>8회 넘게</strong> 소변을 보고, 갑자기 급한 느낌이 잦으면 <strong>과민성 방광</strong>일 수 있어요.</li>
<li>첫 치료는 <strong>골반저근 운동과 방광 훈련</strong>이에요. 최소 <strong>3개월</strong>은 꾸준히 해요.</li>
<li>좋아지지 않으면 <strong>약, 시술, 수술</strong> 등 선택지가 많아요.</li>
</ul></div>

<h2>요실금의 종류</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>언제 새나</th><th>흔한 원인</th></tr></thead>
<tbody>
<tr><td>복압성 요실금</td><td>기침, 재채기, 웃음, 줄넘기, 무거운 것 들기</td><td>출산, 폐경, 비만으로 골반저근과 요도 지지가 약해짐. 여성에게 흔해요</td></tr>
<tr><td>절박성 요실금</td><td>갑자기 참을 수 없이 급해져 화장실 가기 전에</td><td>방광 근육이 멋대로 수축하는 과민성 방광</td></tr>
<tr><td>혼합성 요실금</td><td>두 가지가 함께</td><td>중년 이후 여성에게 흔해요</td></tr>
<tr><td>일류성 요실금</td><td>방광이 꽉 차서 조금씩 흘러넘쳐요</td><td>전립선비대, 당뇨 신경병증, 일부 약</td></tr>
</tbody>
<caption>대한배뇨장애요실금학회, 대한비뇨의학회 자료를 바탕으로 정리</caption></table></div>

<h2>과민성 방광</h2>
<p>방광이 다 차지 않았는데도 갑자기 강하게 소변이 마려운 <strong>절박뇨</strong>가 핵심 증상이에요. 여기에 하루 8회 넘게 소변을 보는 <strong>빈뇨</strong>, 자다가 깨서 소변을 보는 <strong>야간뇨</strong>가 흔히 함께 있어요. 새지 않더라도 과민성 방광일 수 있어요. 방광염, 방광 결석, 당뇨처럼 비슷한 증상을 내는 병이 없는지 먼저 확인해요.</p>

<h2>배뇨 일지 쓰기</h2>
<p>진료 전 <strong>2~3일</strong> 동안 아래를 적어 가면 원인을 찾고 치료 효과를 보는 데 큰 도움이 돼요.</p>
<ul>
<li>소변 본 시각과 양(계량컵 사용)</li>
<li>마신 음료의 종류와 양</li>
<li>샌 시각과 그때 하던 일(기침, 급한 느낌 등)</li>
<li>밤에 깬 횟수</li>
</ul>

<h2>골반저근 운동</h2>
<div class="box note"><span class="h">이렇게 해요</span>
<ol>
<li>소변을 참거나 방귀를 참을 때 조이는 근육을 찾아요. 엉덩이, 배, 허벅지에는 힘을 주지 않아요.</li>
<li>그 근육을 <strong>5~10초 조였다가 같은 시간만큼 풀어요.</strong></li>
<li>10번을 한 세트로 하루 <strong>3세트 이상</strong>, 누워서·앉아서·서서 번갈아 해요.</li>
<li>기침·재채기하기 직전, 무거운 것 들기 전에 미리 조이는 습관을 들여요.</li>
<li>효과는 <strong>6~12주</strong> 뒤부터 나타나요. 최소 3개월은 꾸준히 해요.</li>
</ol>
<p>근육을 제대로 찾기 어렵다면 비뇨의학과나 산부인과, 물리치료사에게 배우거나 바이오피드백 치료를 받을 수 있어요. 소변 보는 중에 멈추는 연습을 반복하는 것은 권하지 않아요.</p></div>

<h2>방광 훈련과 생활 습관</h2>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>설명</th></tr></thead>
<tbody>
<tr><td>방광 훈련</td><td>정해 둔 간격까지 소변을 참고, 1~2주마다 간격을 15분씩 늘려요. 급할 때는 멈춰 서서 골반저근을 몇 번 조이면 급한 느낌이 가라앉아요</td></tr>
<tr><td>음료 조절</td><td>물을 너무 줄이면 소변이 진해져 방광을 자극해요. 적당히 마시고, 자기 2~3시간 전부터 줄여요</td></tr>
<tr><td>방광 자극 음료 줄이기</td><td>카페인(커피, 녹차, 에너지 음료), 술, 탄산음료</td></tr>
<tr><td>체중 감량</td><td>복부 압력이 줄어 복압성 요실금이 좋아져요</td></tr>
<tr><td>변비 해결, 금연</td><td>힘주기와 만성 기침이 골반저근을 약하게 해요</td></tr>
</tbody>
<caption>대한배뇨장애요실금학회, 영국 국립보건임상연구원(NICE) Urinary incontinence and pelvic organ prolapse in women(2019)을 바탕으로 정리</caption></table></div>

<h2>약과 시술, 수술</h2>
<ul>
<li><strong>과민성 방광 약:</strong> 방광 근육을 안정시키는 항무스카린제(솔리페나신 등), 베타-3 작용제(미라베그론 등). 입마름, 변비가 생길 수 있고, 어르신은 인지 기능에 영향을 줄 수 있는 약이 있어 의사가 골라요.</li>
<li><strong>방광 보툴리눔 톡신 주사, 신경 조절 치료:</strong> 약으로 조절되지 않는 과민성 방광에 써요.</li>
<li><strong>수술:</strong> 복압성 요실금에는 요도 아래를 받쳐 주는 중부요도 슬링 수술 등이 효과적이에요.</li>
<li>폐경 뒤 질이 건조하고 위축됐다면 <strong>질 에스트로겐</strong>이 도움이 되기도 해요.</li>
</ul>

<div class="box warn"><span class="h">바로 진료가 필요한 증상</span>
<ul>
<li>소변에 <strong>피</strong>가 섞여요.</li>
<li>소변 볼 때 아프고 열이 나거나 옆구리가 아파요.</li>
<li>소변이 <strong>전혀 안 나오거나</strong> 아랫배가 부풀어 아파요.</li>
<li>다리 힘 빠짐, 감각 이상과 함께 갑자기 소변 조절이 안 돼요.</li>
</ul></div>

<div class="box"><span class="h">요실금 관리 체크리스트</span>
<ol>
<li>2~3일 배뇨 일지 쓰기</li>
<li>골반저근 운동 하루 3세트</li>
<li>기침 전 미리 조이기</li>
<li>카페인·술 줄이기</li>
<li>변비 해결, 적정 체중</li>
<li>3개월 해도 그대로면 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>남성도 요실금이 생기나요?</dt>
<dd>전립선비대나 전립선 수술 뒤에 생기기도 해요. 소변 줄기가 약하고 잔뇨감이 있다면 비뇨의학과 진료를 받아요. 남성도 골반저근 운동이 도움이 돼요.</dd>
<dt>물을 덜 마시면 좋아지지 않나요?</dt>
<dd>지나치게 줄이면 소변이 진해져 오히려 방광이 자극되고 변비와 요로감염이 생길 수 있어요. 양보다 시간 조절이 좋아요.</dd>
<dt>출산 직후 새는 건 괜찮아지나요?</dt>
<dd>출산 뒤 몇 달 사이에 좋아지는 경우가 많아요. 산후에 골반저근 운동을 일찍 시작하면 도움이 돼요.</dd>
</dl>
