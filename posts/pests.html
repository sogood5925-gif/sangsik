<p class="lead">해충이 보이면 먼저 스프레이를 찾게 되지요. 그런데 눈에 보이는 한 마리 뒤에는 숨어 있는 수십 마리가 있어요. 해충은 <strong>먹이, 물, 숨을 곳</strong>이 있는 곳에서 늘어나요. 이 셋을 줄이는 것이 약보다 오래가요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>바퀴벌레는 <strong>먹이·물·틈새</strong>를 없애고, 뿌리는 약보다 <strong>먹이형 약제(겔, 먹이통)</strong>가 효과적이에요.</li>
<li>빈대는 질병을 옮기지는 않지만 가려움이 심해요. <strong>고온 건조기, 스팀</strong>처럼 열로 없애요.</li>
<li>초파리와 나방파리는 <strong>음식물 쓰레기와 배수구</strong>를 관리하면 대부분 사라져요.</li>
<li>살충제는 <strong>표시된 사용법</strong>을 지키고, 아이와 반려동물이 닿지 않게 해요.</li>
</ul></div>

<h2>해충별 특징과 흔적</h2>
<div class="tbl"><table>
<thead><tr><th>해충</th><th>좋아하는 곳</th><th>흔적</th></tr></thead>
<tbody>
<tr><td>바퀴벌레(독일바퀴 등)</td><td>싱크대 밑, 냉장고 뒤, 가전 모터 주변처럼 따뜻하고 습한 틈새</td><td>후추 가루 같은 검은 배설물, 알집, 기름진 냄새</td></tr>
<tr><td>빈대</td><td>매트리스 솔기, 침대 틀, 소파 틈, 벽지 틈</td><td>줄지어 난 물린 자국, 침구의 검은 점(배설물), 핏자국</td></tr>
<tr><td>초파리</td><td>익은 과일, 음식물 쓰레기, 술병</td><td>과일 주변을 맴도는 작은 파리</td></tr>
<tr><td>나방파리</td><td>배수구, 하수구 안쪽 찌꺼기</td><td>욕실 벽에 붙은 하트 모양 작은 파리</td></tr>
<tr><td>개미</td><td>단 음식, 부스러기</td><td>줄지어 다니는 길</td></tr>
</tbody></table></div>

<h2>바퀴벌레</h2>
<h3>먹이·물·숨을 곳 없애기</h3>
<ul>
<li>설거지는 미루지 않고, 음식물 쓰레기는 뚜껑 있는 통에 담아 자주 버려요.</li>
<li>가스레인지 주변과 싱크대 밑의 기름 때와 부스러기를 닦아요.</li>
<li>싱크대 밑 배관 누수를 고치고, 물기를 말려요. 바퀴는 먹이 없이는 꽤 버티지만 물 없이는 오래 못 버텨요.</li>
<li>배관이 벽을 지나가는 구멍, 걸레받이 틈을 실리콘이나 퍼티로 막아요.</li>
<li>택배 상자는 바로 정리해요. 골판지 틈에 숨어 들어오기도 해요.</li>
</ul>
<h3>약제 고르기</h3>
<p>뿌리는 스프레이는 눈앞의 바퀴만 잡고 숨어 있는 무리에는 닿지 않아요. <strong>겔 형태의 먹이형 약제나 먹이통(베이트)</strong>을 바퀴가 다니는 틈새 가까이에 조금씩 여러 곳에 두면, 먹고 돌아간 바퀴를 통해 무리 전체로 번져요. 약제를 둔 곳 주변에 스프레이를 뿌리면 바퀴가 피해 가니 함께 쓰지 않는 게 좋아요.</p>

<h2>빈대</h2>
<p>빈대는 사람 피를 먹는 작은 곤충이에요. 해외여행과 숙박시설, 중고 가구를 통해 옮겨 오는 경우가 많고, 2023년 이후 국내에서도 발견 신고가 늘었어요. <strong>질병을 옮기지는 않는 것</strong>으로 알려져 있지만 가려움과 불면, 긁어서 생기는 2차 감염이 문제예요.</p>
<ul>
<li><strong>물린 자국:</strong> 팔, 다리, 목처럼 드러난 피부에 2~3개씩 줄지어 나타나는 경우가 많아요.</li>
<li><strong>찾는 법:</strong> 손전등으로 매트리스 솔기, 침대 틀 이음새, 머리맡 틈을 살펴 검은 점과 작은 벌레를 찾아요.</li>
</ul>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>요령</th></tr></thead>
<tbody>
<tr><td>고온 건조</td><td>옷과 침구를 건조기에 <strong>높은 온도로 30분 이상</strong> 돌려요</td></tr>
<tr><td>스팀 청소</td><td>매트리스, 소파 틈에 고온 스팀을 천천히 쏘여요</td></tr>
<tr><td>진공청소</td><td>틈새를 빨아들이고, 먼지봉투는 바로 밀봉해 버려요</td></tr>
<tr><td>살충제</td><td>빈대 방제용으로 승인된 제품을 표시대로 써요. 빈대는 일부 성분에 내성이 있어요</td></tr>
<tr><td>전문 방제</td><td>여러 방에 퍼졌거나 계속 물리면 전문 업체에 맡겨요</td></tr>
</tbody>
<caption>질병관리청 빈대 예방·방제 안내를 바탕으로 정리</caption></table></div>
<p>여행에서 돌아오면 가방을 침대 위에 올리지 말고 욕실이나 현관에서 풀어요. 입었던 옷은 바로 빨고 고온 건조해요.</p>

<h2>초파리와 나방파리</h2>
<ul>
<li>익은 과일은 냉장고에 넣고, 과일 껍질은 바로 밀봉해 버려요.</li>
<li>음식물 쓰레기 통은 뚜껑을 닫고 자주 비워요.</li>
<li>재활용할 음료 캔과 술병은 헹궈서 모아요.</li>
<li>초파리 덫: 컵에 식초나 과일 조각을 넣고 주방세제를 한 방울 떨어뜨린 뒤 랩을 씌우고 작은 구멍을 내요.</li>
<li>나방파리는 배수구 안 찌꺼기에서 자라요. 거름망과 배관 입구를 솔로 닦고 뜨거운 물을 흘려요.</li>
</ul>

<h2>개미</h2>
<p>개미 길을 따라가면 들어오는 틈이 보여요. 부스러기와 단 음식을 치우고, 개미용 먹이형 약제를 길목에 두면 집으로 가져가 번져요. 틈은 막아요.</p>

<h2>살충제 안전하게 쓰기</h2>
<div class="box warn"><span class="h">이렇게 지켜요</span>
<ul>
<li>제품에 적힌 <strong>대상 해충, 사용량, 사용 장소</strong>를 지켜요. 많이 뿌린다고 더 잘 듣지 않아요.</li>
<li>뿌린 뒤에는 환기하고, 사람과 반려동물은 표시된 시간 동안 그 공간에 들어가지 않아요.</li>
<li>음식, 식기, 아이 장난감, 수조에 닿지 않게 해요.</li>
<li>여러 제품을 섞거나 연달아 뿌리지 않아요.</li>
<li>먹이형 약제는 아이와 반려동물 손이 닿지 않는 곳에 둬요.</li>
<li>연막·훈증 제품은 화재감지기, 가스 불, 전기 기구 주변 주의사항을 꼭 읽어요.</li>
</ul></div>
<p>살충제는 환경부 승인을 받은 살생물제품인지 포장의 승인 번호를 확인하고 사요.</p>

<h2>업체를 불러야 할 때</h2>
<ul>
<li>몇 주 동안 기본 관리와 약제를 썼는데도 계속 보여요.</li>
<li>빈대가 여러 방에서 발견되거나 가족이 계속 물려요.</li>
<li>공동주택에서 이웃집과 함께 발생해 배관·벽을 따라 옮겨 다녀요. 이때는 관리사무소와 함께 방제해야 효과가 있어요.</li>
</ul>

<div class="box"><span class="h">해충 예방 체크리스트</span>
<ol>
<li>설거지와 음식물 쓰레기 미루지 않기</li>
<li>싱크대 밑 누수 고치고 틈새 막기</li>
<li>바퀴에는 스프레이 대신 먹이형 약제</li>
<li>여행 가방은 침대 위에 올리지 않기</li>
<li>익은 과일은 냉장, 캔·병은 헹구기</li>
<li>배수구 거름망 주 1회 청소</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>빈대에 물렸는데 병원에 가야 하나요?</dt>
<dd>대부분은 긁지 않고 차갑게 식히면 1~2주 안에 가라앉아요. 가려움이 심하면 약국이나 의원에서 가려움약, 스테로이드 연고를 상담받을 수 있어요. 물집, 고름, 발열이 있거나 전신 두드러기가 생기면 진료를 받아요.</dd>
<dt>천연 기피제(계피, 박하)는 효과가 있나요?</dt>
<dd>냄새로 잠깐 피하게 할 수는 있지만, 이미 자리 잡은 바퀴나 빈대를 없애지는 못해요. 청소와 틈새 막기, 먹이형 약제가 기본이에요.</dd>
<dt>바퀴벌레가 병을 옮기나요?</dt>
<dd>바퀴는 쓰레기와 하수구를 오가며 몸에 세균을 묻혀 음식과 조리대를 오염시킬 수 있어요. 또 바퀴의 배설물과 사체는 천식과 알레르기를 악화시킬 수 있어요.</dd>
</dl>
