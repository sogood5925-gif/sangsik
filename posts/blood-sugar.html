  data-title="식후 혈당과 '혈당 스파이크': 정상 범위는 어디까지, 걷기와 먹는 순서의 효과"
  data-thumb="140|식후 2시간 기준"
  data-summary="요즘 연속혈당측정기로 식후 혈당을 확인하는 사람이 늘면서 '혈당 스파이크'라는 말이 흔해졌어요. 공복·식후 혈당과 당화혈색소의 정상·전단계·당뇨 기준, 건강한 사람의 식후 혈당이 오르는 게 정상인 이유, 식후 혈당을 완만하게 하는 식사 순서와 식후 걷기, 식후에 오히려 저혈당이 오는 경우를 정리했어요."
  data-tags="혈당,혈당스파이크,당뇨전단계,식후걷기,건강상식">
<p class="lead">밥을 먹으면 혈당이 오르는 건 자연스러운 일이에요. 문제는 오르는 폭이 지나치게 크거나, 내려오는 데 오래 걸리는 경우예요. 숫자에 너무 겁먹지 않으면서도, 당뇨로 가는 길목에 서 있는지 확인하는 방법을 알아 두면 좋아요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>정상은 <strong>공복 100mg/dL 미만, 식후 2시간 140mg/dL 미만</strong>이에요.</li>
<li>건강한 사람도 식후 잠깐 140을 넘을 수 있어요. <strong>한두 번의 수치</strong>보다 공복 혈당과 당화혈색소 추세가 중요해요.</li>
<li><strong>채소·단백질 먼저 먹기, 식후 10~20분 걷기, 단 음료 끊기</strong>가 식후 혈당을 완만하게 해요.</li>
<li>당뇨 전단계라면 <strong>체중의 5~7% 감량과 주 150분 운동</strong>으로 당뇨 진행을 크게 줄일 수 있어요.</li>
</ul></div>

<h2>혈당 기준</h2>
<div class="tbl"><table>
<thead><tr><th>검사</th><th class="num">정상</th><th class="num">당뇨병 전단계</th><th class="num">당뇨병</th></tr></thead>
<tbody>
<tr><td>공복 혈당(8시간 이상 금식)</td><td class="num">100 미만</td><td class="num">100~125</td><td class="num">126 이상</td></tr>
<tr><td>75g 경구 포도당 부하 2시간 혈당</td><td class="num">140 미만</td><td class="num">140~199</td><td class="num">200 이상</td></tr>
<tr><td>당화혈색소(HbA1c)</td><td class="num">5.7% 미만</td><td class="num">5.7~6.4%</td><td class="num">6.5% 이상</td></tr>
</tbody>
<caption>대한당뇨병학회 2023 당뇨병 진료지침을 바탕으로 정리(단위 mg/dL). 당뇨병 진단은 다른 날 한 번 더 확인하는 것이 원칙이에요</caption></table></div>
<p>당화혈색소는 지난 2~3개월 평균 혈당을 반영해요. 하루하루 오르내리는 혈당보다 큰 흐름을 보여 줘요.</p>

<h2>'혈당 스파이크'는 얼마나 걱정해야 할까</h2>
<ul>
<li>건강한 사람도 흰쌀밥, 면, 떡, 단 음료를 먹으면 식후 30분~1시간에 <strong>140~160mg/dL</strong> 정도까지 잠깐 오를 수 있어요. 2~3시간 안에 원래대로 돌아오면 정상 반응이에요.</li>
<li>건강한 사람이 연속혈당측정기로 식후 혈당을 매일 관리하는 것이 장기적으로 병을 막는다는 근거는 아직 부족해요.</li>
<li>다만 식후 혈당이 자주 <strong>180~200mg/dL</strong>을 넘거나, 2시간이 지나도 140 이상이 이어진다면 당뇨 전단계나 당뇨일 수 있어 검사를 받아요.</li>
<li>당뇨가 있는 사람에게는 식후 혈당 관리가 합병증 예방에 중요해요. 목표치는 주치의와 정해요.</li>
</ul>

<h2>식후 혈당을 완만하게 하는 방법</h2>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>요령</th></tr></thead>
<tbody>
<tr><td>먹는 순서</td><td>채소 → 단백질(생선, 고기, 두부, 달걀) → 밥 순서로 먹어요</td></tr>
<tr><td>식후 걷기</td><td>식사 후 10~20분 가볍게 걸어요. 근육이 포도당을 바로 써요</td></tr>
<tr><td>탄수화물 바꾸기</td><td>흰쌀에 잡곡을 섞고, 흰 빵 대신 통밀빵</td></tr>
<tr><td>단 음료 끊기</td><td>음료 속 당은 흡수가 가장 빨라요</td></tr>
<tr><td>천천히 먹기</td><td>20분 이상 꼭꼭 씹어 먹어요</td></tr>
<tr><td>근력 운동</td><td>근육량이 늘면 포도당을 저장하고 쓰는 능력이 좋아져요</td></tr>
<tr><td>잠과 스트레스</td><td>잠이 부족하면 다음 날 혈당 조절이 나빠져요</td></tr>
</tbody></table></div>

<h2>당뇨 전단계라면</h2>
<p>미국의 당뇨병 예방 연구(DPP)에서 당뇨 전단계인 사람이 <strong>체중의 약 7%를 줄이고 일주일에 150분</strong> 빠르게 걷기 등을 했더니, 3년 동안 당뇨 발생이 약 <strong>58%</strong> 줄었어요. 약(메트포르민)보다 효과가 컸어요.</p>
<ul>
<li>국가건강검진에서 공복 혈당 100 이상이 나왔다면 당화혈색소 검사를 받아 보세요.</li>
<li>가족력, 과체중, 고혈압, 임신성 당뇨 병력이 있다면 더 자주 확인해요.</li>
<li>보건소의 대사증후군 관리 프로그램을 이용할 수 있어요.</li>
</ul>

<h2>식후에 오히려 저혈당이 온다면</h2>
<p>단 음식이나 흰 빵을 먹고 2~4시간 뒤 <strong>식은땀, 손 떨림, 심한 허기, 두근거림</strong>이 생긴다면 반응성 저혈당일 수 있어요. 혈당이 빠르게 오른 뒤 인슐린이 늦게 많이 나와 생겨요.</p>
<ul>
<li>정제 탄수화물과 단 음료를 줄이고, 단백질과 식이섬유를 함께 먹어요.</li>
<li>한 번에 많이 먹기보다 조금씩 나눠 먹어요.</li>
<li>위 수술을 받은 사람에게도 흔해요.</li>
<li>공복에 저혈당이 반복되거나 의식을 잃은 적이 있다면 다른 원인을 확인하기 위해 진료를 받아요.</li>
</ul>

<div class="box warn"><span class="h">바로 진료가 필요한 신호</span>
<ul>
<li>물을 계속 마시고, 소변이 잦고, 이유 없이 체중이 빠져요.</li>
<li>혈당이 300mg/dL 이상이거나 측정기에 'HI'가 떠요.</li>
<li>구토, 복통, 숨이 가쁘고 과일 냄새 같은 입냄새가 나요(케톤산증 의심).</li>
</ul></div>

<div class="box"><span class="h">식후 혈당 관리 체크리스트</span>
<ol>
<li>검진 결과의 공복 혈당·당화혈색소 확인</li>
<li>채소·단백질 먼저, 밥은 나중에</li>
<li>식후 10~20분 걷기</li>
<li>단 음료 끊고 물·무가당 차</li>
<li>주 2~3회 근력 운동</li>
<li>전단계면 체중 5~7% 감량 목표</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>건강한데 연속혈당측정기를 써 보는 게 도움이 될까요?</dt>
<dd>어떤 음식에 혈당이 크게 오르는지 알아보는 데 동기 부여가 될 수 있어요. 다만 건강한 사람에게 장기 건강 이득이 확인되지는 않았고, 수치에 지나치게 불안해지는 경우도 있어요.</dd>
<dt>식초를 먹으면 혈당이 덜 오르나요?</dt>
<dd>식사와 함께 식초를 먹으면 식후 혈당이 조금 낮아졌다는 작은 연구들이 있어요. 효과는 크지 않고, 원액을 마시면 식도와 치아를 상하게 할 수 있어요. 음식에 곁들이는 정도가 좋아요.</dd>
<dt>과일은 혈당을 많이 올리나요?</dt>
<dd>통과일은 식이섬유가 있어 주스보다 혈당을 천천히 올려요. 한 번에 1회 분량씩, 식후 디저트보다 간식으로 먹으면 좋아요.</dd>
</dl>
