<p class="lead">피부 맨 바깥층은 벽돌(각질세포)과 그 사이를 메운 시멘트(지질)로 이뤄진 벽 같아요. 이 벽이 튼튼하면 수분은 지키고 자극은 막아요. 뜨거운 물, 잦은 세정, 때 밀기, 건조한 공기는 이 시멘트를 녹여 벽에 틈을 만들어요. 보습은 그 틈을 메워 주는 일이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>샤워는 <strong>미지근한 물로 10분 이내</strong>, 세정제는 약산성·순한 제품을 몸의 필요한 곳에만 써요.</li>
<li><strong>때 밀기</strong>는 피부 장벽을 벗겨 내 건조와 가려움을 악화시켜요.</li>
<li>샤워 뒤 물기를 가볍게 두드려 닦고 <strong>3분 안에</strong> 보습제를 발라요.</li>
<li>보습을 해도 <strong>밤에 심하게 가렵거나 발진</strong>이 생기면 다른 원인을 확인해요.</li>
</ul></div>

<h2>피부가 건조해지는 이유</h2>
<ul>
<li><strong>나이:</strong> 피지와 피부 지질이 줄어 어르신은 겨울 건조증이 흔해요(노인성 건조증).</li>
<li><strong>환경:</strong> 난방으로 실내 습도가 20~30%까지 떨어져요.</li>
<li><strong>씻는 습관:</strong> 뜨거운 물, 긴 샤워, 알칼리성 비누, 때 밀기</li>
<li><strong>질환:</strong> 아토피 피부염, 건선, 갑상선 기능 저하, 당뇨, 콩팥 질환</li>
<li><strong>약:</strong> 이뇨제, 일부 콜레스테롤 약, 여드름 치료제(이소트레티노인) 등</li>
</ul>

<h2>샤워 습관 바꾸기</h2>
<div class="tbl"><table>
<thead><tr><th>이렇게 하고 있다면</th><th>이렇게 바꿔요</th></tr></thead>
<tbody>
<tr><td>뜨거운 물로 오래 샤워·목욕</td><td>미지근한 물(체온 정도)로 10분 이내</td></tr>
<tr><td>매일 온몸 비누칠</td><td>겨드랑이, 사타구니, 발 등 필요한 곳 위주로. 팔다리는 물로만 헹궈도 충분한 날이 많아요</td></tr>
<tr><td>알칼리성 비누, 향이 강한 세정제</td><td>약산성·저자극 세정제</td></tr>
<tr><td>이태리타월로 때 밀기</td><td>부드러운 손이나 스펀지로 가볍게</td></tr>
<tr><td>수건으로 박박 문질러 닦기</td><td>수건으로 톡톡 두드려 물기만 닦기</td></tr>
<tr><td>나중에 생각나면 보습</td><td>물기가 살짝 남았을 때, 3분 안에 보습</td></tr>
</tbody>
<caption>대한피부과학회, 미국피부과학회(AAD) 건조 피부 관리 안내를 바탕으로 정리</caption></table></div>

<h2>때 밀기가 해로운 이유</h2>
<p>때 밀기로 나오는 '때'의 상당 부분은 피부를 지키는 <strong>각질층</strong>이에요. 억지로 벗겨 내면 잠깐 매끈해 보이지만, 장벽에 틈이 생겨 수분이 빠져나가고 작은 자극에도 가렵고 붉어져요. 아토피 피부염이나 노인성 건조증이 있다면 특히 피해요. 굳이 한다면 한 달에 한 번 정도, 부드러운 도구로 가볍게 해요.</p>

<h2>보습제 고르기</h2>
<div class="tbl"><table>
<thead><tr><th>제형</th><th>특징</th><th>잘 맞는 경우</th></tr></thead>
<tbody>
<tr><td>로션</td><td>물이 많아 가볍게 발리지만 보습 지속이 짧아요</td><td>여름, 넓은 부위, 약간 건조할 때</td></tr>
<tr><td>크림</td><td>유분이 더 많아 보습이 오래가요</td><td>대부분의 건조 피부, 겨울</td></tr>
<tr><td>연고(바셀린 등)</td><td>유분이 가장 많고 수분 증발을 강하게 막아요. 끈적여요</td><td>갈라진 손발, 입술, 매우 건조한 부위</td></tr>
</tbody></table></div>
<ul>
<li><strong>도움 되는 성분:</strong> 세라마이드(장벽 성분), 글리세린·히알루론산(수분 끌어오기), 바셀린·미네랄 오일(수분 가두기), 요소(굳고 거친 피부)</li>
<li><strong>피할 성분:</strong> 향료와 알코올이 많은 제품은 예민한 피부를 자극할 수 있어요.</li>
<li>하루 <strong>두 번 이상</strong>, 넉넉히 발라요. 특히 정강이, 팔 바깥쪽, 허리, 손발이 잘 건조해요.</li>
<li>손을 자주 씻는다면 씻을 때마다 핸드크림을 발라요.</li>
</ul>

<h2>환경 관리</h2>
<ul>
<li>실내 습도를 <strong>40~60%</strong>로 유지해요.</li>
<li>면처럼 부드러운 옷을 입고, 까슬한 모직이 피부에 직접 닿지 않게 해요.</li>
<li>세제 잔여물이 남지 않게 헹굼을 충분히 하고, 섬유유연제 향이 강하면 줄여요.</li>
<li>물을 충분히 마셔요. 다만 물을 많이 마신다고 피부 건조가 크게 나아지지는 않아요. 바깥에서의 보습이 더 중요해요.</li>
</ul>

<div class="box warn"><span class="h">건조함이 아닐 수 있어요: 진료를 받아요</span>
<ul>
<li>보습을 2주 넘게 꾸준히 해도 가려움이 계속돼요.</li>
<li><strong>밤에 특히 심하게 가렵고</strong> 가족도 함께 가려워요(옴 가능성).</li>
<li>붉은 발진, 진물, 두꺼워진 피부, 물집이 있어요.</li>
<li>발진 없이 온몸이 가렵고 피로, 체중 변화, 황달이 있어요(간·콩팥·갑상선 질환, 당뇨, 혈액 질환 등).</li>
<li>새 약을 먹기 시작한 뒤 가려워졌어요.</li>
</ul></div>

<div class="box"><span class="h">겨울 피부 체크리스트</span>
<ol>
<li>미지근한 물, 10분 이내 샤워</li>
<li>때 밀기 멈추기</li>
<li>샤워 후 3분 안에 보습</li>
<li>보습제는 하루 두 번 이상, 넉넉히</li>
<li>실내 습도 40~60%</li>
<li>2주 넘는 가려움·발진은 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>보습제를 발라도 금방 다시 건조해요.</dt>
<dd>로션처럼 가벼운 제품이라면 크림이나 연고로 바꿔 보세요. 샤워 직후 물기가 조금 남았을 때 바르고, 건조한 부위는 하루에 여러 번 덧발라요.</dd>
<dt>오일을 바르면 보습이 되나요?</dt>
<dd>오일은 수분 증발을 막는 역할을 해요. 샤워 후 물기가 있는 피부에 바르면 도움이 돼요. 여드름이 잘 나는 부위에는 피해요.</dd>
<dt>아기 피부도 같은 방법이면 되나요?</dt>
<dd>아기는 피부 장벽이 더 얇아 순한 세정제로 짧게 씻기고 바로 보습하는 것이 좋아요. 아토피가 걱정된다면 소아청소년과나 피부과와 상의해요.</dd>
</dl>
