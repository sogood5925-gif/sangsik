  data-title="어르신 영양: 적게 드셔도 단백질은 매끼, 목마르지 않아도 물, 씹기·삼키기가 힘들 때 식사 바꾸기"
  data-thumb="매끼|단백질 반찬"
  data-summary="나이가 들면 입맛과 소화, 씹고 삼키는 힘이 줄어 모르는 사이에 영양이 부족해지기 쉬워요. 어르신에게 특히 부족하기 쉬운 단백질·비타민 D·칼슘·비타민 B12·수분, 체중이 줄 때 확인할 신호, 씹기와 삼키기가 어려울 때 식사 형태 바꾸기, 혼자 드실 때 도움이 되는 방법을 정리했어요."
  data-tags="어르신영양,근감소증,단백질,삼킴장애,영양소">
<p class="lead">"입맛이 없어서 대충 먹었어." 어르신들이 자주 하시는 말이에요. 나이가 들면 필요한 열량은 줄지만 단백질과 비타민, 무기질은 오히려 더 챙겨야 하는 경우가 많아요. 적게 드셔도 알차게 드시는 법과, 가족이 눈여겨볼 신호를 정리했어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>근육을 지키려면 체중 1kg당 하루 <strong>1.0~1.2g</strong>의 단백질을 <strong>세 끼에 나눠</strong> 드세요.</li>
<li><strong>비타민 D, 칼슘, 비타민 B12, 수분</strong>이 부족해지기 쉬워요.</li>
<li><strong>6개월에 체중이 5% 이상</strong> 빠지면 영양 불량을 의심하고 진료를 받아요.</li>
<li>씹기·삼키기가 힘들면 <strong>음식을 바꾸는 것</strong>이 굶는 것보다 훨씬 나아요.</li>
</ul></div>

<h2>나이 들며 달라지는 것</h2>
<ul>
<li>맛과 냄새를 덜 느껴 음식이 맛없게 느껴지고, 짜게 드시게 돼요.</li>
<li>침이 줄고 치아가 약해져 씹기가 힘들어요.</li>
<li>위산이 줄어 비타민 B12, 철, 칼슘 흡수가 떨어져요.</li>
<li><strong>목마름을 덜 느껴</strong> 물을 적게 드세요.</li>
<li>근육이 줄어드는 속도가 빨라져요(근감소증).</li>
<li>여러 약을 드시면서 입맛과 흡수가 달라져요.</li>
</ul>

<h2>특히 챙길 영양소</h2>
<div class="tbl"><table>
<thead><tr><th>영양소</th><th>왜 필요할까</th><th>채우는 법</th></tr></thead>
<tbody>
<tr><td>단백질</td><td>근육과 면역, 상처 회복</td><td>세 끼마다 달걀, 두부, 생선, 살코기, 우유·요거트 중 하나 이상</td></tr>
<tr><td>비타민 D</td><td>뼈와 근육, 낙상 예방</td><td>햇볕, 생선, 달걀. 부족하면 검사 후 보충제</td></tr>
<tr><td>칼슘</td><td>골다공증 예방</td><td>우유·요거트, 멸치, 두부, 잎채소. 65세 이상 여성 권장량 800mg</td></tr>
<tr><td>비타민 B12</td><td>신경과 혈액</td><td>생선, 달걀, 우유. 위축성 위염이 있거나 메트포르민·위산 억제제를 오래 먹으면 확인</td></tr>
<tr><td>수분</td><td>변비, 요로감염, 어지러움 예방</td><td>목마르지 않아도 하루 6~8컵, 국물·과일도 수분이에요</td></tr>
<tr><td>식이섬유</td><td>변비 예방</td><td>잡곡, 채소, 과일, 콩. 물과 함께</td></tr>
</tbody>
<caption>보건복지부·한국영양학회 2020 한국인 영양소 섭취기준, 유럽임상영양대사학회(ESPEN) 노인 영양 지침(2022)을 바탕으로 정리</caption></table></div>

<h2>영양이 부족할 때의 신호</h2>
<ul>
<li>옷이나 반지가 헐거워졌어요. <strong>6개월에 체중이 5% 이상</strong> 줄었어요.</li>
<li>식사량이 평소의 절반 이하로 1주일 넘게 이어져요.</li>
<li>기운이 없고 자주 넘어지거나, 걸음이 느려졌어요.</li>
<li>상처가 잘 낫지 않아요.</li>
<li>의자에서 일어날 때 팔로 짚어야 해요.</li>
</ul>
<p>이런 변화가 있다면 병원에서 원인(우울, 치아 문제, 약 부작용, 숨은 질환)을 확인하고, 필요하면 영양 보충 음료를 함께 써요.</p>

<h2>씹기·삼키기가 힘들 때</h2>
<div class="tbl"><table>
<thead><tr><th>상황</th><th>식사 바꾸기</th></tr></thead>
<tbody>
<tr><td>씹기가 힘들어요</td><td>고기는 다지거나 얇게, 생선·두부·달걀찜처럼 부드러운 단백질. 채소는 푹 익히거나 잘게</td></tr>
<tr><td>물을 마시면 사레가 들려요</td><td>물에 점도 증진제를 넣어 걸쭉하게. 앉은 자세로, 고개를 살짝 숙이고 천천히</td></tr>
<tr><td>밥이 목에 걸려요</td><td>죽이나 진밥으로, 국에 말기보다 촉촉한 반찬과 함께</td></tr>
<tr><td>틀니가 맞지 않아요</td><td>치과에서 조정해요. 틀니 문제만 해결돼도 식사량이 늘어요</td></tr>
</tbody>
<caption>대한연하장애학회, 식품의약품안전처 고령친화식품 안내를 바탕으로 정리</caption></table></div>

<div class="box warn"><span class="h">삼킴 장애 신호는 진료가 필요해요</span>
<p>식사 중이나 뒤에 <strong>자주 기침하거나 사레들림</strong>, 목소리가 젖은 듯 변함, 음식이 목에 남는 느낌, 이유 없는 <strong>폐렴 반복</strong>이 있다면 삼킴 장애일 수 있어요. 음식이 기도로 넘어가 흡인성 폐렴이 생길 수 있어 재활의학과나 이비인후과에서 삼킴 검사를 받아요. 식사 중 숨이 막히면 바로 하임리히법을 하고 119를 불러요.</p></div>

<h2>입맛을 돋우는 작은 방법</h2>
<ul>
<li>한 번에 많이 드시기 어렵다면 <strong>하루 5~6번 조금씩</strong> 드세요.</li>
<li>식사 전 가벼운 산책이 입맛을 돋워요.</li>
<li>소금 대신 참깨, 들깨, 식초, 레몬, 허브로 풍미를 살려요.</li>
<li>우유에 미숫가루, 죽에 달걀이나 두부처럼 <strong>한 그릇에 단백질을 더해</strong> 드세요.</li>
<li>혼자 드신다면 지역의 경로식당, 노인복지관 식사, 도시락 배달 서비스를 알아봐요. 누군가와 함께 먹으면 식사량이 늘어요.</li>
</ul>

<div class="box"><span class="h">어르신 영양 체크리스트</span>
<ol>
<li>매끼 단백질 반찬 한 가지 이상</li>
<li>물은 목마르지 않아도 조금씩 자주</li>
<li>한 달에 한 번 체중 재기</li>
<li>비타민 D·B12 검사 상의</li>
<li>틀니·치아 점검</li>
<li>사레들림 잦으면 삼킴 검사</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>나이 들면 고기를 줄여야 하지 않나요?</dt>
<dd>가공육과 기름진 고기는 줄이는 게 좋지만, 살코기·생선·달걀·콩 같은 단백질은 오히려 충분히 드시는 게 근육과 면역에 좋아요. 콩팥병이 있다면 의사와 양을 정해요.</dd>
<dt>영양 보충 음료를 매일 드셔도 되나요?</dt>
<dd>식사량이 부족할 때 식사 사이에 드시면 도움이 돼요. 당뇨나 콩팥병이 있다면 맞는 제품을 의사·영양사와 골라요.</dd>
<dt>입맛이 없다고 하시는데 우울증일 수도 있나요?</dt>
<dd>네, 어르신의 우울은 식욕 저하와 체중 감소로 먼저 나타나기도 해요. 기분, 잠, 활동 변화도 함께 살펴봐요.</dd>
</dl>
