  data-title="등산 안전: 사고는 내려올 때 많다, 하산 시간과 준비물, 조난 시 위치 알리기"
  data-thumb="0.6°C|100m마다 기온 하강"
  data-summary="등산 사고는 체력이 떨어진 하산길과 해 질 무렵에 많이 일어나요. 출발 전 계획과 하산 시작 시간, 계절별 준비물, 심장 돌연사와 저체온증을 조심해야 하는 이유, 벌 쏘임 대처, 조난됐을 때 국가지점번호로 위치를 알리는 법을 정리했어요."
  data-tags="등산,산악사고,저체온증,조난,생활정보">
<p class="lead">정상에 오르는 것만큼 중요한 건 안전하게 내려오는 거예요. 등산 사고의 상당수는 다리가 풀린 하산길에서 미끄러지거나 길을 잃으면서 생겨요. 체력과 시간을 남겨 두는 계획이 가장 좋은 안전장비예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>체력의 <strong>30% 이상을 남기고</strong> 하산하고, 해 지기 <strong>2시간 전</strong>에는 내려오기 시작해요.</li>
<li>산은 100m 오를 때마다 기온이 <strong>약 0.6°C</strong> 떨어져요. 바람막이와 여벌 옷을 챙겨요.</li>
<li>가슴 통증, 심한 숨참, 식은땀은 <strong>즉시 멈추고 119</strong>에 신고해요.</li>
<li>길을 잃으면 등산로 표지판의 <strong>국가지점번호</strong>로 위치를 알려요.</li>
</ul></div>

<h2>출발 전 계획</h2>
<ul>
<li>코스의 거리, 높이, 예상 시간을 확인하고 <strong>내 체력보다 조금 쉬운 코스</strong>를 골라요.</li>
<li>산의 날씨 예보를 확인해요. 비, 강풍, 폭염, 한파 특보가 있으면 미뤄요.</li>
<li>가족이나 지인에게 <strong>어느 산, 어떤 코스, 언제 내려올지</strong> 알려 둬요.</li>
<li>혼자보다 여럿이 가는 게 안전해요.</li>
<li>휴대폰을 완전히 충전하고 보조배터리를 챙겨요.</li>
</ul>

<h2>시간과 체력 배분</h2>
<ul>
<li>오르는 데 체력을 다 쓰면 하산길에 다리가 풀려 넘어지기 쉬워요. <strong>힘이 30% 남았을 때</strong>를 돌아설 시점으로 삼아요.</li>
<li>산은 도시보다 해가 빨리 져요. 해 지기 2시간 전, 겨울에는 <strong>오후 3시 무렵</strong>이면 하산을 시작해요.</li>
<li>정상에 가지 못해도 정한 시각이 되면 돌아서요.</li>
<li>50분 걷고 10분 쉬는 식으로 규칙적으로 쉬고, 목마르기 전에 물을 마셔요.</li>
</ul>

<h2>계절별 준비물</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>준비물</th></tr></thead>
<tbody>
<tr><td>기본</td><td>등산화, 물, 간식(초콜릿, 견과류), 휴대폰·보조배터리, 모자, 바람막이, 구급용품, 헤드랜턴</td></tr>
<tr><td>봄·가을</td><td>얇은 옷 여러 겹, 보온 겉옷, 장갑. 일교차가 커요</td></tr>
<tr><td>여름</td><td>물 넉넉히(1인 1~2L 이상), 소금 사탕이나 이온음료, 모자, 자외선 차단제, 우비</td></tr>
<tr><td>겨울</td><td>보온 옷, 방수 장갑, 아이젠, 스패츠, 보온병의 따뜻한 물</td></tr>
</tbody>
<caption>산림청·국립공원공단 안전 산행 안내를 바탕으로 정리</caption></table></div>
<p>면 티셔츠는 땀에 젖으면 잘 마르지 않아 몸을 빠르게 식혀요. 속옷은 빨리 마르는 기능성 소재가 좋아요. 등산 스틱은 내리막에서 무릎 부담을 줄여 줘요.</p>

<h2>산의 날씨는 다르다</h2>
<p>기온은 높이 100m마다 약 0.6°C씩 낮아져요. 산 아래가 15°C라면 1,000m 높이에서는 9°C 안팎이에요. 여기에 바람이 불면 체감 온도는 더 떨어져요. 땀에 젖은 채 정상에서 바람을 맞으면 한여름이 아니면 금방 추워져요.</p>

<h2>산에서 조심할 건강 문제</h2>
<div class="box warn"><span class="h">바로 멈추고 도움을 청해야 할 때</span>
<ul>
<li><strong>가슴 통증이나 조이는 느낌</strong>, 심한 숨참, 식은땀, 어지러움: 심근경색 등 심장 문제일 수 있어요. 즉시 멈추고 119에 신고해요.</li>
<li><strong>말이 어눌하거나 한쪽 팔다리에 힘이 빠짐:</strong> 뇌졸중 신호예요.</li>
<li><strong>심하게 떨리다가 떨림이 멈추고 횡설수설:</strong> 저체온증이 깊어진 신호예요.</li>
</ul></div>
<ul>
<li>심장 질환, 고혈압, 당뇨가 있다면 무리한 코스를 피하고 약을 챙겨요. 특히 추운 새벽 등산은 혈관 부담이 커요.</li>
<li>저체온증을 막으려면 젖은 옷을 갈아입고, 바람을 막고, 따뜻한 음료와 열량을 보충해요.</li>
<li>여름에는 열탈진과 열사병을 조심해요. 두통, 어지러움, 구역질이 생기면 그늘에서 쉬고 물을 마셔요.</li>
</ul>

<h2>벌과 뱀</h2>
<ul>
<li>늦여름과 가을에는 벌초·성묘철과 겹쳐 <strong>말벌 쏘임</strong>이 많아요. 어두운 옷과 향수를 피하고, 벌집을 건드렸으면 몸을 낮추지 말고 <strong>20m 이상 빠르게 벗어나요.</strong></li>
<li>벌에 쏘인 뒤 두드러기가 온몸에 번지거나, 숨이 차거나, 어지러우면 알레르기 쇼크일 수 있어요. 즉시 119에 신고해요.</li>
<li>뱀에 물리면 움직임을 줄이고 물린 부위를 심장보다 낮게 둔 채 병원으로 가요. 입으로 빨거나 칼로 째지 않아요.</li>
</ul>

<h2>길을 잃었을 때</h2>
<div class="tbl"><table>
<thead><tr><th>할 일</th><th>이유</th></tr></thead>
<tbody>
<tr><td>멈추고 침착하게 왔던 길 되짚기</td><td>계속 걸으면 더 깊이 들어가기 쉬워요</td></tr>
<tr><td>계곡 따라 내려가지 않기</td><td>계곡은 폭포와 절벽으로 막히는 경우가 많아요. 능선이나 등산로로 올라가는 편이 안전해요</td></tr>
<tr><td>119에 신고하며 <strong>국가지점번호</strong> 알리기</td><td>등산로 표지판·기둥에 적힌 '가나 1234 5678' 같은 번호로 정확한 위치를 찾을 수 있어요</td></tr>
<tr><td>휴대폰 배터리 아끼기</td><td>구조대와 연락이 닿을 때까지 화면 밝기를 낮추고 불필요한 앱을 꺼요</td></tr>
<tr><td>밝은 옷, 호루라기, 불빛으로 신호</td><td>구조대가 찾기 쉬워요</td></tr>
</tbody>
<caption>소방청·산림청 산악사고 대처 요령을 바탕으로 정리</caption></table></div>

<h2>하산길 요령</h2>
<ul>
<li>보폭을 좁히고 발바닥 전체로 디뎌요.</li>
<li>무릎을 살짝 굽혀 충격을 흡수하고, 스틱을 먼저 짚어요.</li>
<li>젖은 바위, 낙엽 쌓인 비탈, 이끼 낀 돌은 특히 미끄러워요.</li>
<li>뛰어 내려가지 않아요.</li>
</ul>

<div class="box"><span class="h">산행 체크리스트</span>
<ol>
<li>코스·예상 시간 확인, 가족에게 알리기</li>
<li>날씨·특보 확인</li>
<li>물, 간식, 바람막이, 헤드랜턴, 보조배터리</li>
<li>하산 시작 시각 정해 두기</li>
<li>가슴 통증·숨참은 즉시 멈추고 119</li>
<li>표지판 국가지점번호 눈여겨보기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>등산 중 술은 괜찮나요?</dt>
<dd>술은 판단력과 균형 감각을 떨어뜨리고, 몸을 따뜻하게 느끼게 하지만 실제로는 체온을 더 빨리 잃게 해요. 산 위, 특히 하산 전 음주는 피해요.</dd>
<dt>무릎이 아파서 등산이 걱정돼요.</dt>
<dd>경사가 완만한 코스를 고르고, 스틱을 쓰고, 내리막을 천천히 내려와요. 평소 허벅지 근력 운동을 하면 무릎 부담이 줄어요. 붓고 아픈 증상이 계속되면 진료를 받아요.</dd>
<dt>산에서 휴대폰이 안 터지면요?</dt>
<dd>조금 높은 곳이나 트인 곳으로 이동하면 연결되는 경우가 있어요. 문자는 통화보다 약한 신호에서도 전송될 수 있어요. 긴급 통화(112, 119)는 다른 통신사 망을 통해서라도 연결을 시도해요.</dd>
</dl>
