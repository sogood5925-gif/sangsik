<p class="lead">콜라겐 음료와 젤리가 '먹는 화장품'처럼 광고되지만, 먹은 콜라겐이 그대로 피부의 콜라겐이 되지는 않아요. 그렇다고 아무 의미가 없다고 단정하기도 어려워요. 연구를 차분히 살펴볼게요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>콜라겐은 몸 단백질의 <strong>약 30%</strong>를 차지하며 피부, 뼈, 연골, 힘줄의 틀이 돼요.</li>
<li>먹은 콜라겐은 <strong>아미노산과 작은 조각으로 분해</strong>돼 흡수돼요. 그대로 피부로 가지 않아요.</li>
<li>일부 연구에서 피부 보습과 탄력이 조금 좋아졌지만, <strong>업계 지원 연구가 많고</strong> 효과 크기는 작아요.</li>
<li>피부 콜라겐을 지키는 가장 확실한 방법은 <strong>자외선 차단과 금연</strong>이에요.</li>
</ul></div>

<h2>콜라겐은 무엇일까</h2>
<p>콜라겐은 세 가닥의 단백질 사슬이 꼬인 밧줄 모양의 단백질이에요. 튼튼하고 잘 늘어나지 않아서 몸의 구조를 지탱하는 역할을 해요.</p>
<ul>
<li><strong>피부:</strong> 진피의 대부분을 차지해 탄력과 두께를 줘요.</li>
<li><strong>뼈:</strong> 칼슘이 붙는 틀이에요.</li>
<li><strong>연골, 힘줄, 인대:</strong> 관절을 지탱하고 움직임을 가능하게 해요.</li>
<li><strong>혈관, 각막</strong> 등에도 있어요.</li>
</ul>
<p>콜라겐은 20대 중반 이후 조금씩 줄어들어요. <strong>자외선, 흡연, 높은 혈당</strong>은 콜라겐을 파괴하거나 딱딱하게 변형시켜 노화를 앞당겨요.</p>

<h2>먹은 콜라겐은 어디로 갈까</h2>
<p>콜라겐도 단백질이라서 먹으면 위와 장에서 <strong>아미노산과 작은 펩타이드</strong>로 분해돼 흡수돼요. 몸은 이 재료를 필요한 곳에 써요. 피부에 쓸 수도 있고, 근육이나 다른 단백질을 만드는 데 쓸 수도 있어요. 먹은 콜라겐이 피부에 '도착'해 그대로 채워지는 방식은 아니에요.</p>
<p>다만 콜라겐을 잘게 분해한 <strong>저분자 콜라겐 펩타이드</strong>를 먹으면 일부 짧은 조각(프롤린-하이드록시프롤린 같은 디펩타이드)이 혈액에 나타나고, 이것이 피부 세포(섬유아세포)를 자극해 콜라겐 생성을 도울 수 있다는 실험 연구가 있어요. 사람에게서 얼마나 의미 있는 효과로 이어지는지가 관건이에요.</p>

<h2>피부에 대한 연구</h2>
<ul>
<li>여러 임상시험을 모은 분석들에서 콜라겐 펩타이드를 하루 <strong>2.5~10g</strong>, <strong>8~12주</strong> 먹었을 때 피부 보습과 탄력이 위약보다 <strong>조금</strong> 좋아졌다는 결과가 있어요.</li>
<li>하지만 이런 연구의 상당수가 <strong>제조사의 지원</strong>을 받았고, 규모가 작으며, 측정 방법이 제각각이에요.</li>
<li>연구의 질과 자금 출처를 따져 분석한 최근 연구에서는 <strong>질 높은 연구만 모았을 때 효과가 뚜렷하지 않았다</strong>는 결과도 나왔어요.</li>
</ul>
<p>정리하면 먹는 콜라겐의 피부 효과는 <strong>있더라도 크지 않고, 아직 확실하지 않아요.</strong> 국내에서는 일부 저분자 콜라겐 펩타이드 원료가 '피부 보습에 도움을 줄 수 있음' 같은 기능성으로 개별 인정돼 있어요.</p>

<h2>관절에 대한 연구</h2>
<p>관절 통증에 대한 콜라겐 연구도 있어요. 일부 연구에서 무릎 통증이 조금 줄었다는 결과가 있지만 역시 규모가 작고 결과가 엇갈려요. 퇴행성 관절염에는 체중 감량과 근력 운동이 가장 근거가 탄탄한 관리법이에요.</p>

<h2>족발, 닭발, 사골은 어떨까</h2>
<ul>
<li>족발, 닭발, 도가니, 생선 껍질에는 콜라겐이 많은 편이에요.</li>
<li>하지만 이런 음식은 <strong>지방과 나트륨</strong>도 함께 많아요.</li>
<li>또 콜라겐은 필수아미노산인 트립토판이 없어서 단백질로서의 '질'은 고기, 생선, 달걀, 콩보다 낮아요.</li>
<li>먹은 콜라겐이 피부로 가는 게 아니라는 점은 음식도 마찬가지예요.</li>
</ul>
<p>다음 날 피부가 탱탱해 보이는 느낌은 대개 짠 음식으로 인한 부기이거나 기분 탓인 경우가 많아요.</p>

<h2>몸이 콜라겐을 잘 만들게 돕는 법</h2>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>이유</th></tr></thead>
<tbody>
<tr><td><strong>자외선 차단</strong></td><td>자외선은 피부 콜라겐을 분해하는 효소를 활성화해요. 피부 노화의 대부분이 햇빛 때문이라고 할 만큼 영향이 커요</td></tr>
<tr><td><strong>금연</strong></td><td>흡연은 콜라겐 합성을 줄이고 분해를 늘려 주름을 앞당겨요</td></tr>
<tr><td><strong>비타민 C</strong></td><td>콜라겐을 만드는 효소에 꼭 필요해요. 채소와 과일로 충분히 채워요</td></tr>
<tr><td><strong>충분한 단백질</strong></td><td>콜라겐의 재료인 아미노산을 공급해요</td></tr>
<tr><td><strong>혈당 관리</strong></td><td>높은 혈당은 콜라겐을 딱딱하게 변형시켜요(당화)</td></tr>
<tr><td><strong>충분한 수면</strong></td><td>잠자는 동안 피부 회복이 활발해요</td></tr>
</tbody></table></div>
<p>피부 노화에 대해 가장 근거가 탄탄한 바르는 성분은 <strong>레티노이드</strong>(트레티노인 등)예요. 콜라겐 생성을 늘리고 주름을 개선하는 효과가 여러 연구에서 확인됐어요. 다만 자극이 있고 임신 중에는 피해야 하니 피부과와 상의해요.</p>

<h2>바르는 콜라겐</h2>
<p>화장품 속 콜라겐은 분자가 커서 피부 깊숙한 진피까지 들어가지 못해요. 대신 피부 표면에서 수분을 붙잡아 <strong>보습</strong>을 돕는 역할을 해요. 피부 속 콜라겐을 채워주는 것은 아니에요.</p>

<h2>먹는다면</h2>
<ul>
<li>대체로 안전하지만, <strong>생선·조개류 알레르기</strong>가 있다면 원료를 확인해요.</li>
<li>음료와 젤리 형태는 <strong>당</strong>이 많을 수 있어요.</li>
<li>'먹으면 주름이 사라진다' 같은 과장 광고를 조심해요.</li>
<li>8~12주 먹어보고 스스로 체감하는 변화가 없다면 비용을 고려해 계속할지 판단해요.</li>
</ul>

<div class="box"><span class="h">피부 콜라겐을 지키는 체크리스트</span>
<ol>
<li>매일 자외선 차단제 충분히 바르기</li>
<li>담배 끊기</li>
<li>채소와 과일로 비타민 C 챙기기</li>
<li>끼니마다 단백질 반찬</li>
<li>단 음식과 음료 줄이기</li>
<li>충분히 자기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>어류 콜라겐과 돼지 콜라겐은 차이가 있나요?</dt>
<dd>원료에 따라 분자 크기와 흡수율이 조금 다를 수 있다는 주장이 있지만, 건강 효과의 차이가 분명하게 확인된 것은 아니에요. 알레르기와 원료 선호에 따라 고르면 돼요.</dd>
<dt>콜라겐을 먹으면 머리카락과 손톱이 좋아지나요?</dt>
<dd>소규모 연구에서 손톱이 덜 부서졌다는 보고가 있지만 근거는 약해요. 머리카락에 대한 근거는 더 부족해요.</dd>
<dt>콜라겐 대신 단백질 보충제를 먹으면 안 되나요?</dt>
<dd>일반적인 단백질 공급원으로는 필수아미노산이 고루 든 식품(고기, 생선, 달걀, 콩, 유제품)이 콜라겐보다 좋아요. 피부만을 위한 특별한 효과를 기대하기보다 전체 식사의 균형을 먼저 챙겨요.</dd>
</dl>
