<p class="lead">눈 영양제는 루테인이 들어 있는 제품이 대부분이에요. 그런데 루테인이 효과를 보인 연구는 '누구에게, 어떤 효과'였는지 정확히 알면, 내게 필요한지 판단하기가 쉬워져요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>루테인과 지아잔틴은 시력의 중심인 <strong>황반</strong>에 모여 빛을 걸러주는 색소예요.</li>
<li><strong>녹색 잎채소</strong>와 <strong>달걀노른자</strong>로 얻을 수 있어요.</li>
<li>대규모 연구에서 효과가 확인된 건 <strong>중등도 이상 황반변성 환자</strong>의 진행 억제예요.</li>
<li>건강한 사람의 <strong>눈 피로, 안구건조증</strong>을 좋게 한다는 근거는 부족해요.</li>
</ul></div>

<h2>루테인과 지아잔틴</h2>
<p>루테인과 지아잔틴은 식물이 만드는 노란색 색소(카로티노이드)예요. 사람은 몸에서 만들지 못해서 음식으로 먹어야 해요. 먹은 루테인과 지아잔틴은 망막 한가운데의 <strong>황반</strong>에 모여 '황반 색소'가 돼요.</p>
<ul>
<li><strong>빛 걸러내기:</strong> 망막에 닿는 파란색 빛의 일부를 흡수해요.</li>
<li><strong>항산화:</strong> 빛에 많이 노출되는 황반 세포를 산화 손상으로부터 보호하는 데 관여해요.</li>
</ul>
<p>황반은 글자를 읽고 얼굴을 알아보는 <strong>중심 시력</strong>을 맡는 곳이에요. 나이가 들면서 황반이 손상되는 병이 <strong>나이 관련 황반변성</strong>이에요.</p>

<h2>음식으로 얻기</h2>
<div class="tbl"><table>
<thead><tr><th>식품</th><th>특징</th></tr></thead>
<tbody>
<tr><td>케일, 시금치, 근대, 상추, 깻잎 등 짙은 녹색 잎채소</td><td>루테인이 가장 풍부해요</td></tr>
<tr><td>브로콜리, 완두콩, 애호박</td><td>좋은 공급원이에요</td></tr>
<tr><td>달걀노른자</td><td>함량은 적지만 지방과 함께 있어 흡수가 잘 돼요</td></tr>
<tr><td>옥수수, 주황·노란 파프리카</td><td>지아잔틴도 함께 들어 있어요</td></tr>
</tbody></table></div>
<p>루테인은 지용성이라 <strong>기름과 함께</strong> 먹을 때 흡수가 좋아요. 시금치나물을 들기름이나 참기름에 무치거나, 채소를 달걀과 함께 요리하면 흡수에 유리해요.</p>

<h2>황반변성과 AREDS2 연구</h2>
<p>미국 국립안연구소가 진행한 대규모 연구 <strong>AREDS</strong>(2001)는 비타민 C, 비타민 E, 베타카로틴, 아연, 구리 조합이 <strong>중등도 이상 황반변성 환자</strong>의 진행 위험을 약 25% 줄였다고 보고했어요.</p>
<p>후속 연구 <strong>AREDS2</strong>(2013)에서는 루테인 10mg과 지아잔틴 2mg을 추가하거나 베타카로틴을 대신하는 조합을 비교했어요.</p>
<ul>
<li>루테인·지아잔틴을 더해도 전체적으로 진행 위험이 추가로 크게 줄지는 않았어요.</li>
<li>다만 <strong>평소 음식으로 루테인을 적게 먹던 사람</strong>에게서는 진행이 줄었어요.</li>
<li>베타카로틴은 <strong>흡연자의 폐암 위험</strong>을 높일 수 있어서, 루테인·지아잔틴이 이를 대신하는 조합(AREDS2 조합)이 지금 권장돼요.</li>
</ul>
<div class="box note"><span class="h">누구에게 해당할까</span>
<p>AREDS·AREDS2 조합은 안과 검사에서 <strong>중등도 이상의 황반변성</strong>(또는 한쪽 눈이 진행된 황반변성)으로 진단받은 사람에게 권장돼요. 황반변성이 없거나 아주 초기인 사람이 이 영양제로 황반변성을 예방할 수 있다는 근거는 없어요.</p></div>

<h2>건강한 사람의 눈 피로와 안구건조증</h2>
<ul>
<li>루테인이 <strong>눈의 피로</strong>를 줄이거나 <strong>시력을 좋게</strong> 한다는 근거는 약해요.</li>
<li><strong>안구건조증</strong>은 눈물막의 문제라서 루테인과 관련이 적어요. 오메가3도 대규모 연구에서 안구건조증 개선 효과가 없었어요.</li>
<li><strong>백내장</strong> 예방 효과도 AREDS2에서 전체적으로 확인되지 않았어요.</li>
</ul>
<p>국내에서 루테인 건강기능식품은 '노화로 인해 감소될 수 있는 황반 색소 밀도를 유지하여 눈 건강에 도움을 줄 수 있음'이라는 기능성으로 인정돼요. 황반 색소 밀도가 올라간다는 것과, 그것이 실제 병을 막는다는 것은 다른 이야기예요.</p>

<h2>먹는다면</h2>
<ul>
<li>국내 건강기능식품은 보통 하루 <strong>10~20mg</strong>의 루테인을 기준으로 해요.</li>
<li><strong>식사와 함께</strong> 먹으면 흡수가 좋아요.</li>
<li>대체로 안전하지만, 많이 먹으면 피부가 노랗게 보일 수 있어요(해롭지 않고 줄이면 사라져요).</li>
<li>여러 눈 영양제를 함께 먹으면 비타민 A, 아연 등이 과해질 수 있으니 성분을 확인해요.</li>
<li><strong>흡연자</strong>는 베타카로틴이 든 눈 영양제를 피하고, 루테인·지아잔틴 조합을 선택해요.</li>
</ul>

<h2>황반변성을 막는 생활</h2>
<div class="tbl"><table>
<thead><tr><th>위험 요인</th><th>할 수 있는 일</th></tr></thead>
<tbody>
<tr><td>흡연</td><td>바꿀 수 있는 가장 큰 위험 요인이에요. 금연하면 위험이 줄어요</td></tr>
<tr><td>나이, 가족력</td><td>50세 이후, 가족력이 있으면 정기 안과 검진</td></tr>
<tr><td>식습관</td><td>녹색 채소, 생선, 견과류가 많은 식사</td></tr>
<tr><td>심혈관 위험 요인</td><td>혈압, 콜레스테롤, 체중 관리</td></tr>
<tr><td>햇빛</td><td>자외선 차단 선글라스와 챙 넓은 모자</td></tr>
</tbody></table></div>
<div class="box warn"><span class="h">이런 변화가 있으면 안과로</span>
<ul>
<li>직선이 <strong>휘어 보이거나</strong> 물결처럼 보여요.</li>
<li>보려는 곳의 <strong>가운데가 흐리거나</strong> 검게 비어 보여요.</li>
<li>한쪽 눈을 가리고 봤을 때 양쪽 눈이 다르게 보여요.</li>
</ul>
<p>습성 황반변성은 빨리 치료할수록 시력을 지킬 수 있어요. 한쪽 눈씩 가리고 격자무늬(암슬러 격자)나 문틀을 보는 자가 점검을 가끔 해 보세요.</p></div>

<div class="box"><span class="h">눈을 위한 체크리스트</span>
<ol>
<li>짙은 녹색 채소를 하루 한 번 이상, 기름과 함께</li>
<li>담배 끊기</li>
<li>50세 이후 정기 안과 검진</li>
<li>한쪽 눈씩 가리고 직선 보기로 자가 점검</li>
<li>눈 영양제는 황반변성 진단 여부를 기준으로 판단하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>스마트폰을 많이 보는데 루테인을 먹어야 하나요?</dt>
<dd>스마트폰의 블루라이트가 황반을 손상시킨다는 근거는 부족하고, 루테인이 디지털 눈 피로를 줄인다는 근거도 약해요. 눈 피로에는 20분마다 먼 곳 보기, 화면 거리와 밝기 조절이 더 효과적이에요.</dd>
<dt>마리골드 꽃 추출물이 루테인인가요?</dt>
<dd>네. 시중 루테인 영양제의 대부분은 마리골드 꽃에서 추출한 루테인을 써요.</dd>
<dt>아이에게 루테인을 먹여도 되나요?</dt>
<dd>아이의 시력 발달이나 근시 예방에 루테인 보충제가 효과가 있다는 근거는 부족해요. 채소를 골고루 먹고, 바깥 활동 시간을 늘리는 게 근시 예방에 더 도움이 돼요.</dd>
</dl>
