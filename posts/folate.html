  data-title="엽산 총정리: 임신 준비부터 빈혈까지, 언제 얼마나 먹어야 할까"
  data-thumb="400μg|임신 준비"
  data-summary="엽산은 임신 초기 아기의 신경관 결손을 막는 영양소로 잘 알려져 있어요. 임신 전부터 먹어야 하는 이유, 음식 속 엽산과 보충제 엽산의 차이, MTHFR 유전자와 활성형 엽산 논란, 과다 복용 시 주의점까지 정리했어요."
  data-tags="엽산,임신준비,신경관결손,빈혈,영양제">
<p class="lead">아기의 뇌와 척수가 될 신경관은 임신 3~4주, 대부분의 여성이 아직 임신 사실을 모를 때 닫혀요. 그래서 엽산은 임신을 알고 나서가 아니라 <strong>임신하기 전부터</strong> 먹어야 해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인 권장섭취량은 하루 <strong>400μg DFE</strong>, 임신부는 <strong>620μg DFE</strong>예요.</li>
<li>임신 가능성이 있는 여성은 <strong>임신 최소 1개월 전부터 임신 12주까지</strong> 엽산 400μg 보충이 권장돼요.</li>
<li>보충제의 합성 엽산은 음식 속 엽산보다 <strong>흡수가 잘 돼요.</strong></li>
<li>합성 엽산 상한섭취량은 성인 하루 <strong>1,000μg</strong>이에요. 비타민 B12 결핍을 가릴 수 있어요.</li>
</ul></div>

<h2>엽산이 하는 일</h2>
<p>엽산은 비타민 B군의 하나로, 세포가 분열할 때 DNA를 만드는 데 꼭 필요해요. 그래서 세포 분열이 빠르게 일어나는 곳, 즉 <strong>태아와 적혈구를 만드는 골수</strong>에서 특히 중요해요.</p>
<ul>
<li><strong>태아 신경관 형성:</strong> 부족하면 척추갈림증(이분척추), 무뇌증 같은 신경관 결손 위험이 커져요.</li>
<li><strong>적혈구 생성:</strong> 부족하면 비타민 B12 결핍 때와 같은 거대적아구성 빈혈이 생겨요.</li>
<li><strong>호모시스테인 대사:</strong> 비타민 B12, B6와 함께 호모시스테인을 처리해요.</li>
</ul>

<h2>하루 필요량과 DFE라는 단위</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th>권장섭취량</th></tr></thead>
<tbody>
<tr><td>성인</td><td class="num">400μg DFE</td></tr>
<tr><td>임신부</td><td class="num">620μg DFE</td></tr>
<tr><td>수유부</td><td class="num">550μg DFE</td></tr>
<tr><td>상한섭취량 (성인, 보충제·강화식품의 합성 엽산 기준)</td><td class="num">1,000μg</td></tr>
</tbody>
<caption>보건복지부·한국영양학회, 2020 한국인 영양소 섭취기준</caption></table></div>
<p><strong>DFE(식이엽산당량)</strong>는 흡수율 차이를 반영한 단위예요. 음식에 자연히 들어 있는 엽산(folate)은 흡수율이 약 50%인데, 보충제나 강화식품의 합성 엽산(folic acid)은 식사와 함께 먹으면 약 85%가 흡수돼요. 그래서 합성 엽산 1μg은 1.7μg DFE로 계산해요.</p>

<h2>음식으로 얼마나 얻을까</h2>
<p>엽산(folate)이라는 이름은 '잎'을 뜻하는 라틴어에서 왔어요. 이름처럼 녹색 잎채소에 많아요.</p>
<ul>
<li><strong>채소:</strong> 시금치, 브로콜리, 아스파라거스, 상추, 쑥갓, 깻잎</li>
<li><strong>콩류:</strong> 대두, 병아리콩, 렌틸콩, 풋콩</li>
<li><strong>기타:</strong> 소간(매우 많음), 달걀노른자, 딸기, 오렌지, 아보카도</li>
</ul>
<p>음식 속 엽산은 <strong>열과 빛에 약하고 물에 녹아요.</strong> 채소를 오래 삶으면 상당량이 파괴되거나 국물로 빠져나가요. 가볍게 데치거나 찌고, 일부는 생으로 먹는 게 좋아요. 음식만으로 임신에 필요한 양을 확실히 채우기는 어려워서 보충제가 권장돼요.</p>

<h2>임신 준비: 언제부터 얼마나</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th>권장 보충량</th><th>기간</th></tr></thead>
<tbody>
<tr><td>임신 가능성이 있는 모든 여성</td><td class="num">하루 400μg</td><td>임신 최소 1개월 전부터 임신 12주까지</td></tr>
<tr><td>이전 임신에서 신경관 결손이 있었던 경우 등 고위험</td><td class="num">하루 4,000μg (4mg)</td><td>의사 처방에 따라</td></tr>
</tbody>
<caption>미국 질병통제예방센터(CDC)·세계보건기구 권고, 국내 산부인과 권고를 바탕으로 정리</caption></table></div>
<p>계획하지 않은 임신도 많아서, 여러 나라 보건기관은 <strong>임신 가능성이 있는 모든 여성</strong>이 평소에 엽산 400μg을 먹도록 권해요. 여러 나라가 밀가루 같은 주식에 엽산을 강화한 뒤 신경관 결손이 크게 줄었어요.</p>
<p>국내 보건소에서는 임신부나 임신을 준비하는 여성에게 엽산제를 지원하기도 해요. 대상과 기간이 지역마다 다를 수 있으니 가까운 보건소에 확인해 보세요. 뇌전증 약(일부 항경련제)이나 당뇨병, 비만이 있는 여성은 필요량이 다를 수 있으니 임신 전에 의사와 상의해요.</p>
<div class="box note"><span class="h">남성도 먹어야 할까</span>
<p>엽산이 정자 건강에 도움이 된다는 이야기가 있지만, 난임 남성에게 엽산과 아연을 보충했을 때 정액 질이나 출산율이 좋아지지 않았다는 대규모 연구(2020, JAMA)가 있어요. 남성은 균형 잡힌 식사로 충분한 경우가 많아요.</p></div>

<h2>MTHFR 유전자와 '활성형 엽산' 논란</h2>
<p>MTHFR은 엽산을 몸에서 쓰는 형태로 바꾸는 효소예요. 이 효소의 기능이 조금 약한 유전자형이 흔한데, 일부에서는 이런 사람은 일반 엽산 대신 비싼 '활성형 엽산(메틸폴레이트)'을 먹어야 한다고 광고해요.</p>
<p>그러나 미국 질병통제예방센터는 <strong>MTHFR 유전자형과 관계없이 일반 합성 엽산이 신경관 결손 예방에 효과적</strong>이며, 이를 위해 유전자 검사를 할 필요는 없다고 안내해요. 신경관 결손 예방 효과가 대규모 연구로 입증된 것은 일반 합성 엽산이에요.</p>

<h2>부족해지기 쉬운 사람</h2>
<ul>
<li>채소와 과일을 거의 먹지 않는 사람</li>
<li><strong>과음</strong>하는 사람 (알코올이 흡수와 대사를 방해해요)</li>
<li>메토트렉세이트, 일부 항경련제, 트리메토프림 같은 약을 먹는 사람</li>
<li>셀리악병, 염증성 장질환처럼 흡수에 문제가 있는 사람</li>
<li>임신부와 수유부</li>
<li>투석 중인 사람</li>
</ul>
<p>결핍하면 피로, 숨참 같은 빈혈 증상, 입안과 혀의 염증이 생길 수 있어요.</p>

<h2>많이 먹으면 생기는 문제</h2>
<div class="box warn"><span class="h">고용량 엽산이 비타민 B12 결핍을 가릴 수 있어요</span>
<p>엽산을 많이 먹으면 비타민 B12 결핍으로 생긴 빈혈이 교정돼 겉으로는 좋아 보여요. 하지만 비타민 B12 부족으로 인한 <strong>신경 손상은 계속 진행</strong>될 수 있어요. 그래서 합성 엽산의 상한섭취량(성인 1,000μg)이 정해져 있어요. 특히 노인이나 채식하는 사람이 고용량 엽산을 먹는다면 비타민 B12 상태도 함께 확인하는 게 좋아요.</p></div>
<p>종합비타민, 임신 영양제, 엽산 단일제를 함께 먹으면 합산량이 생각보다 많아질 수 있어요. 라벨의 함량을 더해보세요.</p>

<div class="box"><span class="h">임신 준비 엽산 체크리스트</span>
<ol>
<li>임신 계획이 있다면 지금부터 엽산 400μg 복용 시작하기</li>
<li>먹고 있는 영양제의 엽산 함량을 모두 더해보기</li>
<li>이전 임신에서 신경관 결손이 있었거나, 항경련제를 먹는다면 산부인과에서 용량 상담하기</li>
<li>보건소 엽산제 지원 여부 확인하기</li>
<li>녹색 채소와 콩을 식단에 꾸준히 넣기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>임신 사실을 늦게 알았어요. 이미 늦었나요?</dt>
<dd>신경관은 임신 초기에 닫히지만, 알게 된 날부터라도 12주까지 먹는 게 좋아요. 걱정된다면 산부인과 진료 때 상담하고 정기 검사를 받으면 돼요. 엽산을 먹지 않은 대부분의 임신에서도 아기는 건강하게 태어나요.</dd>
<dt>엽산은 공복에 먹어야 하나요?</dt>
<dd>식사와 관계없이 먹어도 돼요. 매일 같은 시간에 먹는 습관을 들이는 게 가장 중요해요.</dd>
<dt>엽산을 먹으면 심혈관 질환이 예방되나요?</dt>
<dd>엽산은 호모시스테인을 낮추지만, 이미 식품 섭취가 충분한 사람에게 보충제가 심근경색을 줄인다는 근거는 일관되지 않아요. 일부 연구에서는 뇌졸중 예방 효과가 보고되기도 했지만, 이를 목적으로 고용량을 먹는 것은 권장되지 않아요.</dd>
</dl>
