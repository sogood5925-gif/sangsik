  data-title="종합비타민: 누구에게 필요하고 누구에게는 보험일 뿐일까, 라벨 읽는 법"
  data-thumb="보험|기대 효과의 크기"
  data-summary="종합비타민은 가장 많이 먹는 건강기능식품이에요. 대규모 연구에서 건강한 사람의 심혈관 질환·암 예방 효과가 작거나 없었던 이유, 그래도 도움이 되는 사람, 영양소가 겹치거나 넘치지 않게 라벨 읽는 법, 임신부·어르신·채식인이 확인할 성분, 약과의 상호작용을 정리했어요."
  data-tags="종합비타민,영양제,건강기능식품,보충제,영양소">
<p class="lead">아침마다 종합비타민 한 알을 먹으면 부족한 영양이 채워질 것 같은 안도감이 들어요. 실제로 식사가 부실한 사람에게는 도움이 될 수 있어요. 하지만 이미 골고루 먹는 건강한 사람에게는 질병 예방 효과가 크지 않다는 게 대규모 연구들의 결론이에요. 종합비타민은 '약'보다 '작은 보험'에 가까워요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>건강한 성인에게 종합비타민이 <strong>심혈관 질환이나 암, 사망을 줄인다는 근거는 부족해요.</strong></li>
<li><strong>식사량이 적은 어르신, 임신 준비·임신부, 채식인, 위·비만 수술을 받은 사람</strong>에게는 도움이 될 수 있어요.</li>
<li>여러 제품을 함께 먹으면 <strong>비타민 A, 철, 아연, B6</strong> 등이 겹쳐 넘칠 수 있어요.</li>
<li>와파린, 갑상선약, 일부 항생제를 먹는다면 <strong>복용 시간과 성분</strong>을 약사와 확인해요.</li>
</ul></div>

<h2>대규모 연구가 말하는 것</h2>
<div class="tbl"><table>
<thead><tr><th>연구</th><th>결과</th></tr></thead>
<tbody>
<tr><td>미국 남성 의사 1만 4천여 명, 약 11년(Physicians' Health Study II)</td><td>암 발생이 약 8% 줄었지만 심혈관 질환은 차이가 없었어요</td></tr>
<tr><td>미국 예방서비스특별위원회(USPSTF) 2022 권고</td><td>종합비타민의 심혈관 질환·암 예방 효과는 <strong>근거 불충분</strong>. 베타카로틴과 비타민 E 단독 보충은 <strong>권하지 않음</strong></td></tr>
<tr><td>미국 성인 약 39만 명 관찰 연구(2024)</td><td>종합비타민을 꾸준히 먹은 사람의 사망 위험이 낮지 않았어요</td></tr>
<tr><td>노인 인지 기능 연구(COSMOS-Mind 등)</td><td>기억력 저하가 조금 느렸다는 결과가 있지만 효과 크기는 작았어요</td></tr>
</tbody>
<caption>Gaziano JM 외(JAMA 2012), USPSTF(JAMA 2022), Loftfield E 외(JAMA Network Open 2024) 등을 바탕으로 정리</caption></table></div>
<p>종합비타민을 먹는 사람은 이미 건강 습관이 좋은 경우가 많아, 여기에 더해지는 효과가 크지 않은 것으로 보여요.</p>

<h2>도움이 될 수 있는 사람</h2>
<ul>
<li><strong>식사량이 크게 줄어든 어르신:</strong> 비타민 D, B12, 칼슘이 부족하기 쉬워요.</li>
<li><strong>임신 준비 중이거나 임신한 여성:</strong> 엽산(임신 전부터), 철, 요오드, 비타민 D. 비타민 A는 레티놀 형태가 과하지 않은 임신부용 제품을 골라요.</li>
<li><strong>엄격한 채식인:</strong> 비타민 B12는 꼭 보충해야 하고, 비타민 D, 요오드, 철, 아연도 확인해요.</li>
<li><strong>위 절제·비만 수술을 받은 사람:</strong> 평생 보충이 필요한 경우가 많아요. 병원 안내를 따라요.</li>
<li><strong>극단적인 다이어트, 식욕 저하, 흡수 장애</strong>가 있는 사람</li>
</ul>

<h2>라벨 읽는 법</h2>
<div class="tbl"><table>
<thead><tr><th>확인할 것</th><th>이유</th></tr></thead>
<tbody>
<tr><td>영양성분 기준치 대비 %</td><td>100% 안팎이면 충분해요. 수백~수천 %인 제품은 필요 이상이에요</td></tr>
<tr><td>비타민 A(레티놀) 양</td><td>임신부와 골다공증이 걱정되는 사람은 과잉을 피해요. 베타카로틴 형태는 흡연자에게 권하지 않아요</td></tr>
<tr><td>철</td><td>폐경 전 여성에게는 도움이 되지만, 성인 남성과 폐경 후 여성은 철이 없거나 적은 제품이 나아요</td></tr>
<tr><td>비타민 K</td><td>와파린을 먹는 사람은 양을 일정하게 유지해야 해요</td></tr>
<tr><td>다른 제품과 겹치는 성분</td><td>비타민 D, 아연, B6, 비오틴 등은 여러 제품에 겹쳐 들어 있어요</td></tr>
<tr><td>건강기능식품 인증 표시</td><td>식품의약품안전처 인정 제품인지 확인해요</td></tr>
</tbody></table></div>

<h2>여러 영양제를 함께 먹는다면</h2>
<div class="box warn"><span class="h">겹치고 넘치기 쉬운 성분</span>
<ul>
<li><strong>비타민 A:</strong> 과잉 시 간 손상, 뼈 약화, 임신 중 기형 위험</li>
<li><strong>비타민 D:</strong> 과잉 시 고칼슘혈증(상한 하루 4,000IU)</li>
<li><strong>아연:</strong> 과잉 시 구리 결핍(상한 하루 35mg)</li>
<li><strong>비타민 B6:</strong> 오래 과잉 시 손발 저림(상한 하루 100mg)</li>
<li><strong>철:</strong> 어린이가 성인용 철분제를 삼키면 중독이 될 수 있어 손이 닿지 않게 보관해요</li>
</ul>
<p>먹고 있는 모든 제품의 라벨을 모아 성분별로 더해 보거나, 약국에 들고 가 확인받아요.</p></div>

<h2>약과 함께 먹을 때</h2>
<ul>
<li><strong>갑상선 호르몬제:</strong> 칼슘·철·마그네슘과 4시간 정도 간격을 둬요.</li>
<li><strong>테트라사이클린·퀴놀론계 항생제:</strong> 칼슘·철·아연·마그네슘과 몇 시간 간격을 둬요.</li>
<li><strong>와파린:</strong> 비타민 K가 든 제품을 새로 시작하거나 끊을 때 의사에게 알려요.</li>
<li>수술을 앞두고 있다면 먹고 있는 영양제를 모두 알려요.</li>
</ul>

<div class="box"><span class="h">종합비타민 체크리스트</span>
<ol>
<li>식사가 먼저, 종합비타민은 보완</li>
<li>기준치 100% 안팎 제품 고르기</li>
<li>임신부·어르신·채식인은 필요한 성분 확인</li>
<li>여러 제품의 성분 겹침 점검</li>
<li>약과 복용 간격 약사와 확인</li>
<li>아이 손이 닿지 않게 보관</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>종합비타민은 언제 먹는 게 좋아요?</dt>
<dd>지용성 비타민(A, D, E, K)이 들어 있으니 식사와 함께 먹으면 흡수가 좋아지고 속 불편도 줄어요. 매일 같은 시간에 먹는 습관이 더 중요해요.</dd>
<dt>비싼 제품이 흡수가 더 잘 되나요?</dt>
<dd>'천연', '흡수율 몇 배' 같은 표현이 실제 건강 효과 차이로 이어진다는 근거는 부족해요. 필요한 성분이 적정량 들어 있는지가 더 중요해요.</dd>
<dt>종합비타민을 먹으면 과일·채소를 덜 먹어도 되나요?</dt>
<dd>아니에요. 채소와 과일에는 식이섬유, 칼륨, 수많은 식물 성분이 있고, 이런 음식이 주는 건강 효과는 알약으로 대신하기 어려워요.</dd>
</dl>
