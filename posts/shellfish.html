  data-title="조개·수산물 안전: 봄철 패류독소, 여름 비브리오, 겨울 굴과 노로바이러스"
  data-thumb="85°C|1분 이상 익히기"
  data-summary="조개와 굴, 해산물은 계절마다 조심할 것이 달라요. 봄철 남해안에서 생기는 패류독소가 익혀도 없어지지 않는 이유, 여름철 비브리오 패혈증에 특히 위험한 사람, 겨울 생굴과 노로바이러스, 조개젓과 A형간염, 사고 싶은 조개를 고르고 보관하고 익히는 법을 정리했어요."
  data-tags="패류독소,비브리오,굴,노로바이러스,생활정보">
<p class="lead">바다에서 나는 조개와 굴은 영양이 풍부하지만, 물을 걸러 먹고 사는 탓에 바닷물 속 독소와 세균, 바이러스를 몸에 모아 두기도 해요. 계절에 따라 무엇을 조심해야 하는지만 알면 훨씬 안심하고 즐길 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>봄(3~6월)</strong>에는 패류독소 발생 해역의 조개를 캐거나 먹지 않아요. <strong>익혀도 독이 없어지지 않아요.</strong></li>
<li><strong>여름</strong>에는 비브리오균을 조심해요. 특히 <strong>간질환, 당뇨, 음주가 잦은 사람</strong>은 날것을 피해요.</li>
<li><strong>겨울</strong> 굴은 노로바이러스 걱정이 있어요. 익혀 먹을 굴은 <strong>중심 85°C에서 1분 이상</strong> 익혀요.</li>
<li>조개젓 같은 익히지 않은 젓갈로 <strong>A형간염</strong>이 퍼진 일이 있어요.</li>
</ul></div>

<h2>계절별로 조심할 것</h2>
<div class="tbl"><table>
<thead><tr><th>시기</th><th>위험</th><th>특징</th></tr></thead>
<tbody>
<tr><td>봄(3~6월)</td><td>패류독소</td><td>남해안을 중심으로 발생. 가열해도 파괴되지 않아요</td></tr>
<tr><td>여름(5~10월)</td><td>비브리오 패혈증, 장염 비브리오</td><td>바닷물 온도가 오르면 늘어요. 날것, 덜 익힌 것, 상처로 감염</td></tr>
<tr><td>겨울(11~2월)</td><td>노로바이러스</td><td>생굴 등 날 조개류로 장염이 생겨요</td></tr>
<tr><td>연중</td><td>A형간염(오염된 조개젓), 알레르기</td><td>익히지 않은 제품, 갑각류·조개 알레르기</td></tr>
</tbody>
<caption>식품의약품안전처 패류독소 발생 정보, 질병관리청 비브리오 패혈증·노로바이러스 예방 안내를 바탕으로 정리</caption></table></div>

<h2>패류독소</h2>
<p>봄철 바닷물 온도가 오르면 독을 가진 플랑크톤이 늘고, 이를 먹은 홍합, 굴, 바지락, 멍게 등에 독이 쌓여요. 가장 흔한 것은 <strong>마비성 패류독소</strong>예요.</p>
<ul>
<li>먹은 뒤 30분~몇 시간 안에 <strong>입술, 혀, 얼굴이 저리고 화끈거리고</strong>, 심하면 팔다리 마비, 말하기 어려움, 숨쉬기 어려움이 올 수 있어요.</li>
<li>독은 <strong>끓이거나 얼려도 없어지지 않아요.</strong></li>
<li>식약처와 해양수산부가 봄철에 <strong>패류채취 금지 해역</strong>을 공개해요. 이 해역에서 조개를 캐거나 먹지 않아요.</li>
<li>시장에 유통되는 조개는 검사를 거쳐요. 문제는 바닷가에서 직접 캐거나 낚시로 얻은 것이에요.</li>
</ul>

<h2>비브리오 패혈증</h2>
<p>비브리오 패혈증균은 따뜻한 바닷물과 갯벌에 살아요. 덜 익힌 해산물을 먹거나, <strong>상처 난 피부가 바닷물에 닿아</strong> 감염돼요. 건강한 사람은 드물게 걸리지만, <strong>간질환(간경변, 만성 간염), 알코올 의존, 당뇨, 면역 저하</strong>가 있는 사람은 걸리면 매우 위험하고 사망률도 높아요.</p>
<div class="box warn"><span class="h">이런 증상은 바로 응급실</span>
<p>해산물을 먹거나 바닷물에 닿은 뒤 하루 이틀 안에 <strong>갑자기 열과 오한, 다리에 붉은 반점과 물집, 심한 통증</strong>이 생기면 비브리오 패혈증일 수 있어요. 진행이 매우 빨라요. 즉시 응급실에 가서 해산물 섭취나 바닷물 접촉을 알려요.</p></div>

<h2>굴과 노로바이러스</h2>
<ul>
<li>노로바이러스는 적은 양으로도 구토와 설사를 일으키고, 집 안에서 가족에게 잘 옮아요.</li>
<li>'생식용' 표시가 있는 굴만 날로 먹고, <strong>'가열 조리용'은 반드시 익혀요.</strong></li>
<li>익힐 때는 <strong>중심 온도 85°C에서 1분 이상</strong>이 기준이에요. 살짝 데치는 정도로는 부족할 수 있어요.</li>
<li>면역이 약한 사람, 임신부, 어르신, 어린이는 날 굴을 피하는 것이 좋아요.</li>
</ul>

<h2>사고, 보관하고, 익히기</h2>
<div class="tbl"><table>
<thead><tr><th>단계</th><th>요령</th></tr></thead>
<tbody>
<tr><td>살 때</td><td>껍데기가 닫혀 있거나 톡 치면 닫히는 조개, 비린내가 심하지 않은 것. 원산지와 '생식용·가열용' 표시 확인</td></tr>
<tr><td>옮길 때</td><td>여름에는 아이스박스에 담아 빨리 옮겨요</td></tr>
<tr><td>보관</td><td>5°C 이하 냉장, 가능하면 바로 먹어요. 입을 벌린 채 닫히지 않는 것은 버려요</td></tr>
<tr><td>손질</td><td>흐르는 수돗물에 씻고, 해산물 전용 도마·칼을 써요. 손질 뒤 손을 비누로 씻어요</td></tr>
<tr><td>조리</td><td>끓는 물에 넣은 뒤 껍데기가 열리고도 몇 분 더 익혀요. 익혀도 열리지 않는 조개는 먹지 않아요</td></tr>
</tbody>
<caption>식품의약품안전처 수산물 안전 섭취 요령을 바탕으로 정리</caption></table></div>

<h2>조개젓과 A형간염</h2>
<p>2019년 A형간염 유행 때 오염된 조개젓이 원인으로 확인되어 해당 제품이 회수됐어요. 익히지 않고 먹는 젓갈은 원료가 오염되면 바이러스가 그대로 남을 수 있어요. A형간염 항체가 없는 20~40대라면 예방접종을 고려해요.</p>

<h2>바닷가에서 지킬 것</h2>
<ul>
<li>여름철 <strong>다리에 상처가 있으면 바닷물과 갯벌에 들어가지 않아요.</strong></li>
<li>갯벌 체험 때는 장화나 아쿠아슈즈를 신어 조개껍데기에 베이지 않게 해요.</li>
<li>잡은 해산물은 바로 얼음에 넣고, 날로 먹지 않아요.</li>
</ul>

<div class="box"><span class="h">해산물 안전 체크리스트</span>
<ol>
<li>봄철 패류채취 금지 해역 확인</li>
<li>입 저림 생기면 바로 병원</li>
<li>간질환·당뇨가 있다면 여름철 날것 피하기</li>
<li>가열 조리용 굴은 85°C 1분 이상</li>
<li>5°C 이하 냉장, 바로 먹기</li>
<li>상처 있으면 바닷물 피하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>초장이나 술과 함께 먹으면 균이 죽나요?</dt>
<dd>식초나 술로 병원균이 충분히 죽지는 않아요. 안전하게 먹으려면 익히는 것이 확실해요.</dd>
<dt>마트에서 산 조개도 패류독소가 있을 수 있나요?</dt>
<dd>유통되는 조개는 검사를 거쳐 기준을 넘으면 팔 수 없어요. 봄철에 직접 캐서 먹는 경우가 가장 위험해요.</dd>
<dt>조개 알레르기가 있으면 굴도 피해야 하나요?</dt>
<dd>조개류끼리는 교차 반응이 있을 수 있어요. 어떤 것을 피해야 할지 의사와 확인해요.</dd>
</dl>
