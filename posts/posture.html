  data-thumb="80%|평생 요통 경험"
  data-summary="대부분의 사람이 살면서 한 번은 허리 통증을 겪어요. 허리에 부담을 덜 주는 앉는 자세와 의자 세팅, 물건 드는 법, 매트리스와 자는 자세, 급성 요통 때 누워 있기보다 움직여야 하는 이유, 효과가 확인된 운동, 바로 병원에 가야 하는 위험 신호를 정리했어요."
  data-tags="허리통증,요통,자세,코어운동,매트리스">
<p class="lead">허리 통증은 감기 다음으로 흔하게 병원을 찾는 이유 중 하나예요. 다행히 대부분은 특별한 병이 없는 '비특이적 요통'이고, 몇 주 안에 좋아져요. 그리고 좋아지는 속도는 어떻게 움직이느냐에 달려 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인의 대부분이 평생 한 번 이상 요통을 겪고, <strong>대부분은 6주 안에</strong> 좋아져요.</li>
<li>완벽한 자세보다 <strong>30~60분마다 자세를 바꾸는 것</strong>이 더 중요해요.</li>
<li>급성 요통은 <strong>누워만 있기보다 가능한 범위에서 움직이는 것</strong>이 회복을 빠르게 해요.</li>
<li><strong>대소변 장애, 엉덩이·사타구니 감각 저하, 다리 힘 빠짐</strong>은 응급 신호예요.</li>
</ul></div>

<h2>앉는 자세</h2>
<p>앉아 있을 때 허리 디스크는 서 있을 때보다 더 큰 압력을 받아요. 특히 등을 구부리고 앞으로 숙이면 압력이 커져요. 반대로 등받이에 <strong>약간 뒤로 기대면</strong> 허리 부담이 줄어요.</p>
<div class="tbl"><table>
<thead><tr><th>항목</th><th>맞추는 법</th></tr></thead>
<tbody>
<tr><td>엉덩이</td><td>의자 깊숙이 넣어 등받이에 붙여요</td></tr>
<tr><td>등받이</td><td>약간 뒤로 기울어진 상태(대략 100~110°)로 기대요</td></tr>
<tr><td>허리</td><td>허리의 자연스러운 곡선을 받쳐주는 쿠션이나 요추 받침을 써요</td></tr>
<tr><td>발</td><td>발바닥 전체가 바닥에 닿게. 닿지 않으면 발받침을 써요</td></tr>
<tr><td>무릎</td><td>엉덩이와 비슷하거나 약간 낮게</td></tr>
<tr><td>화면</td><td>눈높이, 50~70cm 거리 (거북목 글 참고)</td></tr>
</tbody></table></div>
<div class="box note"><span class="h">가장 좋은 자세는 '다음 자세'</span>
<p>아무리 좋은 자세라도 몇 시간씩 그대로 있으면 근육과 디스크에 부담이 쌓여요. <strong>30~60분마다 일어나서</strong> 걷거나 허리를 가볍게 펴 주세요. 서서 일하는 책상을 번갈아 쓰는 것도 도움이 돼요.</p></div>
<h3>바닥에 앉는 생활</h3>
<p>바닥에 양반다리로 앉으면 골반이 뒤로 기울고 허리가 구부러져 부담이 커져요. 오래 앉아야 한다면 등받이가 있는 좌식 의자를 쓰거나, 벽에 등을 기대고, 방석을 엉덩이 뒤쪽에 받쳐 골반을 세워요.</p>

<h2>물건 드는 법</h2>
<ol>
<li>물건 가까이 다가가서 발을 어깨너비로 벌려요.</li>
<li>허리를 구부리지 말고 <strong>무릎과 엉덩이를 굽혀</strong> 앉아요.</li>
<li>물건을 <strong>몸에 바짝 붙이고</strong> 다리 힘으로 일어나요.</li>
<li>들고 있는 상태에서 <strong>허리를 비틀지 않아요.</strong> 방향을 바꿀 때는 발을 옮겨요.</li>
<li>무겁다면 나눠 들거나 도움을 받아요.</li>
</ol>
<p>바닥에서 가벼운 물건을 주울 때도 한쪽 무릎을 꿇거나 한 다리를 뒤로 들며 몸을 숙이면 허리 부담이 줄어요.</p>

<h2>자는 자세와 매트리스</h2>
<ul>
<li><strong>옆으로 누울 때:</strong> 무릎 사이에 베개를 끼우면 골반과 허리가 틀어지지 않아요.</li>
<li><strong>바로 누울 때:</strong> 무릎 아래에 베개를 받치면 허리가 편해져요.</li>
<li><strong>엎드려 자기</strong>는 허리가 과하게 휘고 목이 돌아가 부담이 커요.</li>
<li><strong>매트리스:</strong> 무조건 딱딱한 것이 좋은 건 아니에요. 만성 요통 환자를 대상으로 한 연구(Lancet, 2003)에서 <strong>중간 정도 단단한</strong> 매트리스가 딱딱한 매트리스보다 통증 개선에 더 나았어요.</li>
</ul>

<h2>허리가 갑자기 아플 때</h2>
<p>무거운 걸 들다가, 또는 별일 없이 아침에 일어나다 허리가 '삐끗'하는 급성 요통은 흔해요. 대부분 근육과 인대 문제로 몇 주 안에 좋아져요.</p>
<div class="tbl"><table>
<thead><tr><th>도움이 되는 것</th><th>도움이 되지 않는 것</th></tr></thead>
<tbody>
<tr><td>통증이 허락하는 범위에서 <strong>평소 활동 유지</strong>, 짧게 자주 걷기</td><td>며칠씩 침대에 누워만 있기 (회복이 늦어져요)</td></tr>
<tr><td>따뜻한 찜질</td><td>통증을 참으며 무리한 운동</td></tr>
<tr><td>필요할 때 진통소염제를 짧게</td><td>근거 없는 고가 시술을 서둘러 받기</td></tr>
<tr><td>"대부분 좋아진다"는 안심</td><td>과도한 걱정과 공포 (통증을 키울 수 있어요)</td></tr>
</tbody>
<caption>여러 국제 요통 진료지침의 공통 권고를 바탕으로 정리</caption></table></div>
<p>특별한 위험 신호가 없는 급성 요통에서는 처음부터 엑스레이나 MRI를 찍어도 치료가 달라지지 않는 경우가 많아요. 검사에서 보이는 디스크 변화는 통증이 없는 사람에게도 흔해요.</p>

<h2>재발을 줄이는 운동</h2>
<ul>
<li><strong>걷기:</strong> 가장 쉽고 효과적인 허리 운동이에요.</li>
<li><strong>코어 운동:</strong> 배와 허리, 엉덩이 근육을 함께 키워요. 엉덩이 들기(브릿지), 네발 기기 자세에서 팔다리 뻗기(버드독), 옆으로 버티기 등이 있어요.</li>
<li><strong>필라테스, 요가, 수영:</strong> 만성 요통에 도움이 된다는 연구가 있어요.</li>
<li>체중을 적정하게 유지해요.</li>
</ul>
<p>통증이 심할 때는 무리하지 말고, 좋아진 뒤 꾸준히 하는 게 재발 예방에 효과적이에요. 운동 방법이 걱정된다면 재활의학과나 물리치료사의 안내를 받아요.</p>

<div class="box warn"><span class="h">바로 병원에 가야 하는 허리 통증</span>
<ul>
<li><strong>소변이나 대변을 보기 어렵거나 참지 못해요.</strong></li>
<li><strong>엉덩이, 항문 주위, 사타구니</strong>의 감각이 둔해졌어요. (마미증후군, 응급 수술이 필요할 수 있어요)</li>
<li>다리 힘이 <strong>점점 빠지거나</strong> 발목을 들기 어려워요.</li>
<li>열이 나거나, 암을 앓았거나, 이유 없이 체중이 줄었어요.</li>
<li>넘어지거나 사고 뒤 생긴 통증, 특히 골다공증이 있는 경우</li>
<li>누워서 쉬어도 좋아지지 않고 밤에 더 심한 통증</li>
<li>50세 이후 처음 생긴 심한 통증</li>
</ul></div>
<p>다리로 뻗치는 저림과 통증이 있다면 허리 디스크일 수 있어요. 허리 디스크 글에서 자세히 정리했어요.</p>

<div class="box"><span class="h">허리 지키는 하루 습관</span>
<ol>
<li>의자 깊숙이 앉아 등받이에 기대기</li>
<li>30~60분마다 일어나 걷기</li>
<li>물건은 무릎 굽혀 몸에 붙여 들기</li>
<li>하루 30분 걷기, 주 2~3회 코어 운동</li>
<li>옆으로 잘 때 무릎 사이 베개</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>허리 보호대를 차면 좋나요?</dt>
<dd>급성기에 잠깐 도움이 될 수 있지만, 오래 차면 허리를 받치는 근육이 약해질 수 있어요. 통증이 줄면 운동으로 근력을 키우는 게 좋아요.</dd>
<dt>허리가 아프면 파스를 붙여도 되나요?</dt>
<dd>소염진통 성분이 든 파스는 통증을 줄이는 데 도움이 될 수 있어요. 피부 발진이 생기면 떼고, 먹는 진통소염제와 함께 오래 쓰지 않아요.</dd>
<dt>다리를 꼬고 앉으면 허리에 나쁜가요?</dt>
<dd>잠깐 꼬는 것은 괜찮지만, 오래 한쪽으로만 꼬면 골반이 한쪽으로 기울어 불편감이 생길 수 있어요. 자주 바꾸고 일어나 움직이는 게 좋아요.</dd>
</dl>
