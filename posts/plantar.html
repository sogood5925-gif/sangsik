<template data-id="plantar" data-cat="dis" data-date="2026.09.30"
  data-title="족저근막염: 아침 첫걸음에 발뒤꿈치가 찌릿, 스트레칭과 신발로 90%가 좋아져요"
  data-thumb="첫걸음|가장 아픈 순간"
  data-summary="아침에 침대에서 내려 첫발을 딛을 때 발뒤꿈치가 찌릿하게 아프다면 족저근막염일 수 있어요. 잘 생기는 사람과 원인, 비슷한 다른 발 통증과의 구별, 족저근막·종아리 스트레칭과 얼음 마사지, 신발과 깔창 고르기, 체외충격파와 주사 치료를 고려하는 때를 정리했어요."
  data-tags="족저근막염,발뒤꿈치통증,발건강,스트레칭,질병">
<p class="lead">자고 일어나 첫발을 딛는 순간, 오래 앉아 있다 일어설 때 발뒤꿈치가 찌르듯 아프다가 몇 걸음 걸으면 조금 풀려요. 족저근막염의 전형적인 모습이에요. 낫는 데 몇 달이 걸리기도 하지만, 대부분은 수술 없이 스트레칭과 신발 관리로 좋아져요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>족저근막은 발뒤꿈치에서 발가락까지 이어진 두꺼운 막이에요. 반복된 부담으로 뒤꿈치 쪽에 통증이 생겨요.</li>
<li><strong>아침 첫걸음, 오래 쉰 뒤 첫걸음</strong>의 통증이 특징이에요.</li>
<li><strong>족저근막·종아리 스트레칭, 쿠션 있는 신발</strong>로 대부분 6~12개월 안에 좋아져요.</li>
<li>6개월 넘게 낫지 않으면 <strong>체외충격파</strong> 등을 고려해요.</li>
</ul></div>

<h2>왜 생길까</h2>
<p>족저근막은 걷고 뛸 때 발의 아치를 받쳐 주는 스프링 역할을 해요. 부담이 회복 속도보다 크면 뒤꿈치뼈에 붙는 부위에 미세한 손상과 퇴행성 변화가 생겨요.</p>
<ul>
<li>갑자기 걷기·달리기·등산량을 늘렸을 때</li>
<li>체중 증가, 오래 서서 일하는 직업</li>
<li>쿠션 없는 신발, 딱딱한 바닥에서 맨발 생활, 슬리퍼</li>
<li><strong>종아리 근육과 아킬레스건이 뻣뻣한</strong> 경우</li>
<li>평발이나 아치가 높은 발</li>
</ul>

<h2>다른 발 통증과 구별</h2>
<div class="tbl"><table>
<thead><tr><th>질환</th><th>특징</th></tr></thead>
<tbody>
<tr><td>족저근막염</td><td>뒤꿈치 안쪽 아래가 아프고, 아침 첫걸음에 가장 심해요</td></tr>
<tr><td>아킬레스건염</td><td>뒤꿈치 뒤쪽, 발목 뒤 힘줄이 아프고 부어요</td></tr>
<tr><td>뒤꿈치 지방패드 위축</td><td>뒤꿈치 한가운데가 아프고, 딱딱한 바닥에 오래 서 있을수록 심해요</td></tr>
<tr><td>피로골절</td><td>운동량을 늘린 뒤 한 지점을 누르면 심하게 아프고, 걸을수록 계속 심해져요</td></tr>
<tr><td>발목터널증후군(신경 눌림)</td><td>발바닥이 저리고 화끈거려요</td></tr>
</tbody></table></div>
<p>엑스레이에서 보이는 '뒤꿈치 뼈돌기(골극)'는 통증이 없는 사람에게도 흔해 통증의 원인이 아닌 경우가 많아요.</p>

<h2>스트레칭이 치료의 중심</h2>
<div class="tbl"><table>
<thead><tr><th>운동</th><th>방법</th><th>횟수</th></tr></thead>
<tbody>
<tr><td>족저근막 스트레칭</td><td>앉아서 아픈 발을 반대 무릎에 올리고, 한 손으로 발가락을 발등 쪽으로 젖혀 발바닥이 팽팽해지게 해요</td><td>10초 × 10번, <strong>첫발 딛기 전</strong>과 하루 3번</td></tr>
<tr><td>종아리 스트레칭</td><td>벽을 짚고 아픈 다리를 뒤로 뻗어 뒤꿈치를 바닥에 붙인 채 앞 무릎을 굽혀요. 뒤 무릎을 살짝 굽혀 한 번 더 해요</td><td>30초 × 3번, 하루 2~3번</td></tr>
<tr><td>얼음병 굴리기</td><td>얼린 생수병을 발바닥 아래에 두고 앞뒤로 굴려요</td><td>5~10분, 하루 2번</td></tr>
<tr><td>수건 당기기</td><td>앉아서 발가락으로 수건을 끌어당겨요</td><td>하루 몇 번</td></tr>
</tbody>
<caption>미국 정형외과족부학회(AOFAS), 미국 물리치료학회(APTA) 발뒤꿈치 통증 진료지침(2023)을 바탕으로 정리</caption></table></div>
<p>아침에 침대에서 내려오기 전에 족저근막 스트레칭을 하면 첫걸음의 통증이 줄어요.</p>

<h2>신발과 생활</h2>
<ul>
<li><strong>뒤꿈치 쿠션이 좋고 아치를 받쳐 주는 신발</strong>을 신어요. 밑창이 너무 얇거나 딱딱한 신발, 낡아서 쿠션이 꺼진 운동화는 바꿔요.</li>
<li>집에서도 맨발이나 얇은 슬리퍼 대신 쿠션 있는 실내화를 신어요.</li>
<li>뒤꿈치 컵, 기성품 깔창도 도움이 될 수 있어요. 맞춤 깔창이 꼭 필요한 경우는 많지 않아요.</li>
<li>달리기나 줄넘기는 잠시 줄이고, 수영·실내 자전거로 운동을 이어 가요.</li>
<li>과체중이면 체중을 줄이면 발 부담이 줄어요.</li>
<li>밤에 발목을 90도로 유지하는 <strong>야간 부목</strong>이 아침 통증을 줄이는 사람도 있어요.</li>
</ul>

<h2>다른 치료</h2>
<ul>
<li><strong>소염진통제:</strong> 통증이 심할 때 짧게 써요.</li>
<li><strong>체외충격파 치료:</strong> 6개월 넘게 낫지 않는 만성 족저근막염에 효과가 보고됐어요.</li>
<li><strong>스테로이드 주사:</strong> 단기간 통증을 줄이지만, 반복하면 족저근막 파열과 뒤꿈치 지방패드 위축 위험이 있어 신중하게 써요.</li>
<li><strong>수술:</strong> 1년 가까이 여러 치료를 해도 낫지 않는 드문 경우에 고려해요.</li>
</ul>

<div class="box warn"><span class="h">족저근막염이 아닐 수 있어요</span>
<ul>
<li>다친 뒤 갑자기 아프고 붓거나 멍이 들었어요.</li>
<li>쉬어도, 밤에도 계속 아파요.</li>
<li>발이 빨갛고 뜨겁고 열이 나요.</li>
<li>발바닥이 저리고 감각이 둔해요(당뇨 발, 신경 문제).</li>
</ul></div>

<div class="box"><span class="h">족저근막염 체크리스트</span>
<ol>
<li>침대에서 내려오기 전 발바닥 스트레칭</li>
<li>종아리 스트레칭 하루 2~3번</li>
<li>얼음병 굴리기</li>
<li>쿠션 좋은 신발, 집에서도 실내화</li>
<li>달리기 대신 수영·자전거로 잠시 바꾸기</li>
<li>6개월 넘게 안 나으면 추가 치료 상담</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>얼마나 지나야 좋아지나요?</dt>
<dd>사람마다 다르지만 대부분 몇 주~몇 달에 걸쳐 서서히 좋아지고, 약 90%는 1년 안에 수술 없이 좋아져요. 꾸준한 스트레칭이 회복을 앞당겨요.</dd>
<dt>통증이 있는데 걸어도 되나요?</dt>
<dd>일상적인 걷기는 괜찮지만, 통증을 참고 오래 걷거나 뛰는 것은 줄여요. 통증이 심한 날은 쉬고, 좋아지면 조금씩 늘려요.</dd>
<dt>발 마사지 기구를 써도 되나요?</dt>
<dd>가볍게 풀어 주는 정도는 도움이 될 수 있어요. 너무 세게 누르면 오히려 자극이 될 수 있으니 편안한 강도로 해요.</dd>
</dl>
