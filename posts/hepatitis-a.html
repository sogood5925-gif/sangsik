  data-title="A형간염: 20~40대가 더 조심해야 하는 이유, 항체 검사와 두 번 접종, 가족이 걸렸을 때"
  data-thumb="2회|예방접종 횟수"
  data-summary="A형간염은 오염된 음식과 물, 손을 통해 옮는 급성 간염으로, 어릴 때 걸리면 가볍지만 어른이 걸리면 황달과 심한 피로로 입원하는 경우가 많아요. 20~40대에 항체가 적은 이유, 증상과 경과, 항체 검사와 예방접종, 가족이나 직장에 환자가 생겼을 때 할 일, 음식 위생을 정리했어요."
  data-tags="A형간염,간염,예방접종,황달,질병">
<p class="lead">A형간염은 한때 어린 시절에 가볍게 앓고 지나가는 병이었어요. 그런데 위생 환경이 좋아지면서 어릴 때 감염되지 않은 채 어른이 된 사람이 많아졌고, 이제는 20~40대가 걸려 황달과 심한 피로로 몇 주씩 고생하는 병이 됐어요. 예방접종으로 거의 확실히 막을 수 있다는 점이 다행이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>A형간염은 <strong>대변에 섞인 바이러스</strong>가 음식, 물, 손을 거쳐 입으로 들어와 옮아요.</li>
<li>어른은 <strong>열, 극심한 피로, 구역질, 황달</strong>이 생기고 회복에 몇 주~몇 달 걸릴 수 있어요.</li>
<li>항체가 없는 <strong>20~40대</strong>는 검사 후 접종을 고려하고, 접종은 <strong>6~18개월 간격 2회</strong>예요.</li>
<li>가족이 걸렸다면 <strong>2주 안에</strong> 접종 등 예방 조치를 상의해요.</li>
</ul></div>

<h2>어떻게 옮을까</h2>
<ul>
<li>환자의 대변으로 나온 바이러스가 <strong>씻지 않은 손, 오염된 음식과 물</strong>을 통해 옮아요.</li>
<li>익히지 않은 조개류, 오염된 지하수, 조리하는 사람의 손이 흔한 경로예요. 2019년에는 오염된 조개젓이 유행의 원인이었어요.</li>
<li>함께 사는 가족, 어린이집, 해외여행(유행 지역)에서도 옮아요.</li>
<li>바이러스는 증상이 나타나기 <strong>1~2주 전부터</strong> 대변으로 나와 모르는 사이에 퍼져요.</li>
</ul>

<h2>증상과 경과</h2>
<div class="tbl"><table>
<thead><tr><th>시기</th><th>모습</th></tr></thead>
<tbody>
<tr><td>잠복기</td><td>15~50일(평균 약 4주). 증상 없음</td></tr>
<tr><td>초기</td><td>열, 몸살, 극심한 피로, 입맛 없음, 구역질, 오른쪽 윗배 불편감. 감기나 장염으로 오해하기 쉬워요</td></tr>
<tr><td>황달기</td><td>소변이 콜라색처럼 진해지고, 눈 흰자와 피부가 노래져요. 대변 색이 옅어져요</td></tr>
<tr><td>회복</td><td>대부분 몇 주~2개월 안에 회복. 만성 간염으로 가지 않아요. 한 번 앓으면 평생 면역</td></tr>
</tbody>
<caption>질병관리청 A형간염 질병 정보 및 감염병 관리지침을 바탕으로 정리</caption></table></div>
<p>6세 미만 어린이는 대부분 증상이 없거나 가볍지만, 어른은 70% 이상에서 황달이 나타나요. 나이가 많거나 만성 간질환이 있으면 드물게 간이 급격히 망가지는 <strong>전격성 간염</strong>으로 진행할 수 있어요.</p>

<div class="box warn"><span class="h">바로 병원에 가야 할 때</span>
<ul>
<li>황달이 점점 짙어지고, 구토 때문에 물도 못 마셔요.</li>
<li><strong>의식이 흐려지거나</strong> 횡설수설하고 몹시 졸려요.</li>
<li>잇몸이나 코에서 피가 나고 멍이 잘 들어요.</li>
</ul>
<p>간 기능이 크게 떨어진 신호일 수 있어요. 입원 치료가 필요해요.</p></div>

<h2>치료</h2>
<p>A형간염을 직접 없애는 약은 없어요. <strong>충분히 쉬고, 물과 음식을 먹을 수 있는 만큼 먹으며</strong> 회복을 기다려요. 간에 부담을 줄 수 있는 <strong>술은 끊고</strong>, 진통제·해열제(특히 아세트아미노펜), 한약, 건강기능식품은 의사와 상의 없이 먹지 않아요. 구토가 심하거나 간 수치가 많이 오르면 입원해요.</p>

<h2>예방접종</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th>권고</th></tr></thead>
<tbody>
<tr><td>생후 12~23개월 아이</td><td>국가예방접종. 6~12개월 간격으로 2회</td></tr>
<tr><td>20~40대 성인</td><td>항체가 없는 경우가 많아요. 항체 검사 후 없으면 접종(젊은 층은 검사 없이 바로 접종하기도 해요)</td></tr>
<tr><td>고위험군</td><td>만성 간질환(B형·C형간염 보유자 등), 유행 지역 여행자, 외식업 종사자, 의료인, 보육 교사 등</td></tr>
<tr><td>접종 간격</td><td>1차 접종 후 6~18개월(백신 종류에 따라 6~12개월) 뒤 2차</td></tr>
</tbody>
<caption>질병관리청 예방접종도우미 A형간염 백신 안내, 대한감염학회 성인 예방접종 권고를 바탕으로 정리</caption></table></div>
<p>만성 간질환이 있는 사람은 A형간염에 걸리면 훨씬 위험해서, 항체가 없다면 꼭 접종을 챙겨요. 비용 지원 대상과 방법은 보건소에 확인해요.</p>

<h2>가족이나 동료가 걸렸다면</h2>
<ul>
<li>환자와 접촉한 뒤 <strong>2주 안에</strong> 백신을 맞으면 발병을 막는 데 도움이 돼요. 나이와 건강 상태에 따라 면역글로불린을 쓰기도 해요. 보건소나 병원에 바로 문의해요.</li>
<li>환자는 증상이 시작된 뒤 <strong>일정 기간(대개 1주일)</strong> 등교·출근과 음식 조리를 쉬어요.</li>
<li>화장실 사용 뒤, 음식 만들기 전 <strong>비누로 30초 이상</strong> 손을 씻어요.</li>
<li>환자가 쓴 화장실과 문손잡이는 희석한 염소계 표백제로 닦아요.</li>
<li>수건, 컵, 수저를 따로 써요.</li>
</ul>

<h2>음식 위생</h2>
<ul>
<li>조개류는 <strong>중심 온도 85°C에서 1분 이상</strong> 익혀요.</li>
<li>물은 끓이거나 안전한 물을 마셔요. 지하수는 수질을 확인해요.</li>
<li>해외 유행 지역에서는 생수, 익힌 음식, 껍질을 직접 벗기는 과일을 먹어요. 출국 전 접종을 고려해요.</li>
</ul>

<div class="box"><span class="h">A형간염 예방 체크리스트</span>
<ol>
<li>20~40대라면 항체 확인</li>
<li>항체 없으면 2회 접종 완료</li>
<li>화장실 후·조리 전 손 씻기</li>
<li>조개류는 충분히 익히기</li>
<li>가족 발병 시 2주 안에 보건소 문의</li>
<li>앓는 중엔 술과 임의 약 피하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>한 번만 맞아도 효과가 있나요?</dt>
<dd>1회만 맞아도 대부분 항체가 생기지만, 오래 지키려면 2회를 모두 맞아요. 2차를 늦게 맞았더라도 처음부터 다시 맞을 필요는 없어요.</dd>
<dt>B형간염 백신을 맞았으면 A형도 막아 주나요?</dt>
<dd>아니에요. 다른 바이러스라서 따로 접종해야 해요. A형과 B형을 함께 막는 혼합 백신도 있어요.</dd>
<dt>회복한 뒤 다시 걸릴 수 있나요?</dt>
<dd>A형간염은 한 번 앓으면 평생 면역이 생겨 다시 걸리지 않아요.</dd>
</dl>
