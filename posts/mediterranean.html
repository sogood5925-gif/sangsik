<p class="lead">'가장 건강한 식단' 순위에 해마다 오르는 지중해식 식사는 특정 음식을 끊는 다이어트가 아니라 먹는 방식 전체를 말해요. 채소와 곡물, 콩, 생선을 넉넉히 먹고 올리브유로 요리하는 식탁이에요. 사실 나물과 생선, 잡곡이 많은 전통 한식과 닮은 점이 많아서, 조금만 바꾸면 우리 밥상에도 옮길 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>기본은 <strong>채소·과일·통곡물·콩·견과류</strong>, 지방은 <strong>올리브유</strong>, 단백질은 <strong>생선과 콩</strong> 위주예요.</li>
<li>스페인의 대규모 연구에서 올리브유나 견과류를 더한 지중해식 식사가 <strong>심혈관 사건을 약 30% 줄였어요.</strong></li>
<li>한식은 채소·잡곡·생선이 많아 비슷하지만, <strong>나트륨</strong>을 줄이는 것이 과제예요.</li>
<li><strong>와인은 필수가 아니에요.</strong> 술을 마시지 않는다면 새로 시작할 이유는 없어요.</li>
</ul></div>

<h2>먹는 빈도의 기본 틀</h2>

<thead><tr><th>빈도</th><th>식품</th></tr></thead>
<tbody>
<tr><td>매끼</td><td>채소, 과일, 통곡물, 올리브유, 허브·향신료</td></tr>
<tr><td>매일</td><td>견과류·씨앗 한 줌, 요거트·치즈 적당히, 물</td></tr>
<tr><td>주 2회 이상</td><td>생선·해산물, 콩류</td></tr>
<tr><td>주 몇 회 적당히</td><td>닭고기, 달걀</td></tr>
<tr><td>가끔, 적게</td><td>붉은 고기, 가공육, 단 과자와 음료</td></tr>
</tbody>

<h2>연구로 확인된 효과</h2>
<ul>
<li><strong>PREDIMED 연구:</strong> 심혈관 위험이 높은 스페인 성인 약 7,400명을 대상으로, 엑스트라버진 올리브유나 견과류를 더한 지중해식 식사 그룹이 저지방 식사 권고 그룹보다 <strong>심근경색·뇌졸중·심혈관 사망이 약 30% 적었어요.</strong></li>
<li><strong>당뇨:</strong> 제2형 당뇨 발생이 줄고, 당뇨가 있는 사람의 혈당 조절이 좋아졌다는 연구가 있어요.</li>
<li><strong>뇌 건강:</strong> 지중해식과 고혈압 식사(DASH)를 합친 MIND 식사가 인지 기능 저하를 늦출 수 있다는 관찰 연구가 있지만, 큰 무작위 연구에서는 효과가 뚜렷하지 않았어요.</li>
<li><strong>체중:</strong> 열량을 조절하면 다른 식사법만큼 체중 감량 효과가 있고, 오래 지키기 쉽다는 장점이 있어요.</li>
</ul>

<h2>한식과 닮은 점, 다른 점</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>지중해식</th><th>한식</th></tr></thead>
<tbody>
<tr><td>채소</td><td>샐러드, 구운 채소</td><td>나물, 쌈, 김치. 종류가 다양해요</td></tr>
<tr><td>곡물</td><td>통밀빵, 보리, 파스타</td><td>흰쌀 비중이 커요. 잡곡을 섞으면 좋아요</td></tr>
<tr><td>지방</td><td>올리브유 넉넉히</td><td>참기름·들기름. 들기름은 오메가-3가 많아요</td></tr>
<tr><td>단백질</td><td>생선, 콩, 요거트</td><td>생선, 두부, 된장. 고기 섭취가 늘고 있어요</td></tr>
<tr><td>나트륨</td><td>비교적 적음</td><td>국, 찌개, 김치, 장류로 많은 편</td></tr>
</tbody>
<caption>국민건강영양조사, 한국인을 위한 식생활지침을 바탕으로 정리</caption></table></div>

<h2>한국 밥상으로 옮기기</h2>
<ul>
<li><strong>밥:</strong> 현미, 보리, 귀리, 콩을 섞은 잡곡밥으로</li>
<li><strong>반찬:</strong> 나물과 채소 반찬을 두세 가지, 볶을 때는 올리브유나 들기름을 적당히</li>
<li><strong>단백질:</strong> 고등어·삼치 같은 생선 구이, 두부, 콩자반을 주 여러 번. 고기는 가끔, 적게</li>
<li><strong>간식:</strong> 과일과 견과류 한 줌, 플레인 요거트</li>
<li><strong>국물과 김치:</strong> 양을 줄이고 싱겁게. 이것이 한식 버전의 가장 큰 과제예요.</li>
<li><strong>식사 방식:</strong> 천천히, 함께 나눠 먹는 것도 지중해식의 일부예요.</li>
</ul>

<div class="box note"><span class="h">와인에 대한 오해</span>
<p>지중해 지역에서 식사와 함께 와인을 조금 마시는 문화가 있어 '와인도 건강식'으로 알려졌지만, 최근 연구와 세계보건기구는 <strong>건강에 안전한 음주량은 없다</strong>고 봐요. 술을 마시지 않는다면 지중해식 식사를 위해 새로 마실 필요는 없어요.</p></div>

<div class="box warn"><span class="h">이런 경우는 조정이 필요해요</span>
<ul>
<li><strong>콩팥병</strong>: 칼륨·인이 많은 채소, 과일, 견과류, 콩을 무제한으로 늘리면 안 될 수 있어요. 영양사와 조정해요.</li>
<li><strong>와파린 복용</strong>: 잎채소를 갑자기 크게 늘리면 약 효과가 흔들려요. 꾸준한 양을 유지해요.</li>
<li><strong>견과류 알레르기</strong>: 씨앗류나 다른 지방 공급원으로 바꿔요.</li>
</ul></div>

<div class="box"><span class="h">지중해식 체크리스트</span>
<ol>
<li>매끼 채소 두 가지 이상</li>
<li>흰밥 대신 잡곡밥</li>
<li>생선·콩 주 2회 이상</li>
<li>올리브유·들기름을 적당히</li>
<li>간식은 과일·견과류</li>
<li>국물·김치는 싱겁게, 적게</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>올리브유는 많이 먹을수록 좋은가요?</dt>
<dd>좋은 지방이지만 열량이 높아요. 버터나 동물성 지방 대신 쓰는 것이 핵심이에요. 1큰술이 약 120kcal예요.</dd>
<dt>올리브유로 볶음이나 튀김을 해도 되나요?</dt>
<dd>엑스트라버진 올리브유도 일반 가정의 볶음 온도에서는 쓸 수 있어요. 연기가 날 정도로 오래 가열하는 것은 피해요.</dd>
<dt>파스타와 빵을 많이 먹어도 되나요?</dt>
<dd>지중해식의 곡물은 통곡물이 중심이고 양도 적당해요. 흰 파스타와 흰 빵을 많이 먹는 것은 지중해식이라 보기 어려워요.</dd>
</dl>
