  data-title="전립선비대증: 밤에 자주 깨고 소변 줄기가 약하다면, 약과 생활 관리"
  data-thumb="50대|증상이 늘기 시작"
  data-summary="나이가 들면 전립선이 커지면서 소변 보는 게 불편해져요. 전립선비대증의 흔한 증상과 점수로 정도를 재는 법, 감기약과 술 뒤에 소변이 막히는 급성 요폐, 알파차단제와 5알파환원효소억제제의 차이와 부작용, 수술이 필요한 경우, 전립선암 검사와의 관계를 정리했어요."
  data-tags="전립선비대증,야간뇨,배뇨장애,남성건강,질병">
<p class="lead">밤에 두세 번씩 화장실에 가느라 잠을 설치고, 소변 줄기가 가늘어져 한참을 서 있어야 한다면 전립선비대증일 수 있어요. 나이가 들면 흔히 생기지만, 불편을 참으며 지낼 필요는 없어요. 약으로 많이 좋아지고, 드물지만 방치하면 소변이 아예 막히기도 해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>전립선이 커져 요도를 누르면 <strong>약한 줄기, 잔뇨감, 빈뇨, 야간뇨</strong>가 생겨요.</li>
<li>증상 점수와 소변 검사, 초음파로 정도를 확인하고 치료를 정해요.</li>
<li><strong>알파차단제</strong>는 며칠 안에 효과가 나고, <strong>5알파환원효소억제제</strong>는 몇 달에 걸쳐 전립선을 줄여요.</li>
<li><strong>콧물 감기약이나 과음 뒤 소변이 전혀 나오지 않으면</strong> 응급이에요.</li>
</ul></div>

<h2>전립선비대증이란</h2>
<p>전립선은 방광 바로 아래에서 요도를 감싸고 있는 남성의 기관이에요. 나이가 들면서 전립선 세포가 늘어나 커지면 요도를 눌러 소변이 잘 나오지 않아요. 50대부터 증상이 늘기 시작해 나이가 들수록 흔해져요. 전립선 크기와 증상의 정도가 꼭 비례하지는 않아요.</p>

<h2>증상</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>증상</th></tr></thead>
<tbody>
<tr><td>배출 증상</td><td>소변 줄기가 약하고 가늘어요, 소변이 나오기까지 시간이 걸려요, 끊겼다 나왔다 해요, 힘을 줘야 나와요</td></tr>
<tr><td>저장 증상</td><td>소변을 자주 봐요(빈뇨), 밤에 자다 깨서 봐요(야간뇨), 갑자기 참기 힘들어요(급박뇨)</td></tr>
<tr><td>배뇨 후 증상</td><td>다 봐도 남은 느낌(잔뇨감), 끝에 방울방울 떨어져요</td></tr>
</tbody>
<caption>대한비뇨의학회 전립선비대증 진료지침을 바탕으로 정리</caption></table></div>
<p>병원에서는 <strong>국제 전립선 증상 점수(IPSS)</strong> 설문으로 정도를 재요. 7가지 질문의 합계가 0~7점이면 경증, 8~19점이면 중등도, 20~35점이면 중증으로 봐요.</p>

<h2>검사</h2>
<ul>
<li>소변 검사: 감염, 혈뇨 확인</li>
<li>전립선 초음파: 크기 측정</li>
<li>요속 검사와 잔뇨 측정: 소변 줄기의 세기와 방광에 남은 양</li>
<li>전립선특이항원(PSA) 혈액 검사: 전립선암 가능성을 함께 살펴요</li>
<li>배뇨 일지: 며칠 동안 마신 양과 소변 시간·양을 적어요. 야간뇨의 원인을 찾는 데 도움이 돼요</li>
</ul>

<h2>약물 치료</h2>
<div class="tbl"><table>
<thead><tr><th>약</th><th>작용</th><th>알아 둘 점</th></tr></thead>
<tbody>
<tr><td>알파차단제(탐스로신, 실로도신, 알푸조신, 독사조신 등)</td><td>전립선과 방광 입구 근육을 풀어 소변 길을 넓혀요. 며칠~몇 주 안에 효과</td><td>일어설 때 어지러움, 사정 시 정액이 줄어드는 느낌. 백내장 수술 전 복용 사실을 알려요</td></tr>
<tr><td>5알파환원효소억제제(피나스테리드, 두타스테리드)</td><td>전립선을 몇 달에 걸쳐 줄여요. 효과가 나기까지 3~6개월</td><td>PSA 수치를 약 절반으로 낮춰요. 검사 때 복용 사실을 꼭 알려요. 성욕 감소 등이 생길 수 있어요</td></tr>
<tr><td>포스포디에스테라제5 억제제(타다라필)</td><td>배뇨 증상을 완화해요</td><td>질산염 계열 협심증 약과 함께 쓰면 안 돼요</td></tr>
<tr><td>항무스카린제, 베타3 작용제</td><td>빈뇨·급박뇨 같은 저장 증상을 줄여요</td><td>잔뇨가 많으면 조심해서 써요</td></tr>
</tbody>
<caption>대한비뇨의학회·유럽비뇨기과학회(EAU) 남성 하부요로증상 진료지침을 바탕으로 정리</caption></table></div>
<p>전립선이 크고 증상이 심하면 알파차단제와 5알파환원효소억제제를 함께 써서 급성 요폐와 수술 위험을 줄여요.</p>

<h2>수술을 고려할 때</h2>
<ul>
<li>약을 써도 증상이 심해 생활이 불편해요.</li>
<li>급성 요폐가 반복돼요.</li>
<li>방광결석, 반복되는 요로감염, 혈뇨, 콩팥 기능 저하가 생겼어요.</li>
</ul>
<p>요도를 통해 내시경으로 전립선을 깎아 내는 경요도 전립선 절제술, 레이저로 전립선을 도려내는 수술 등이 있어요. 전립선 크기와 건강 상태, 원하는 회복 속도에 따라 방법을 골라요.</p>

<div class="box warn"><span class="h">급성 요폐: 바로 응급실로</span>
<p>아랫배가 부풀어 오르고 몹시 마려운데 <strong>소변이 한 방울도 나오지 않으면</strong> 급성 요폐예요. 관을 넣어 소변을 빼야 해요.</p>
<ul>
<li>콧물·코막힘 감기약(항히스타민제, 슈도에페드린), 일부 수면제·멀미약</li>
<li>과음, 추위, 소변을 오래 참기</li>
</ul>
<p>이런 것이 방아쇠가 되기 쉬워요. 전립선비대증이 있다면 감기약을 살 때 약사에게 꼭 알려요.</p></div>

<h2>생활 관리</h2>
<ul>
<li><strong>저녁 이후 물을 줄여요.</strong> 잠들기 2~3시간 전부터는 많이 마시지 않아요. 낮 동안 충분히 마셔 하루 총량은 유지해요.</li>
<li>카페인과 술을 줄여요. 둘 다 소변을 늘리고 방광을 자극해요.</li>
<li>소변을 본 뒤 잠깐 기다렸다 다시 보는 <strong>두 번 누기</strong>로 잔뇨를 줄여요.</li>
<li>소변을 너무 오래 참지 않아요.</li>
<li>변비를 관리해요. 변비가 배뇨를 방해할 수 있어요.</li>
<li>체중을 관리하고 규칙적으로 운동해요.</li>
</ul>
<p>밤에 소변량 자체가 많다면(야간다뇨) 심부전, 수면무호흡, 당뇨 같은 다른 원인도 확인해요.</p>

<div class="box"><span class="h">전립선 건강 체크리스트</span>
<ol>
<li>밤에 2번 이상 깨면 진료 받아 보기</li>
<li>배뇨 일지 3일 써 보기</li>
<li>감기약 살 때 전립선비대증 알리기</li>
<li>5알파환원효소억제제 복용 중이면 PSA 검사 때 알리기</li>
<li>저녁 물·술·카페인 줄이기</li>
<li>소변이 전혀 안 나오면 응급실</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>전립선비대증이 암이 되나요?</dt>
<dd>전립선비대증이 전립선암으로 바뀌지는 않아요. 다만 두 병이 함께 있을 수 있어 필요하면 PSA 검사와 진찰로 확인해요. PSA 검사의 장단점은 의사와 상의해 정해요.</dd>
<dt>쏘팔메토 같은 건강기능식품은 효과가 있나요?</dt>
<dd>여러 대규모 연구에서 쏘팔메토는 위약과 비교해 뚜렷한 증상 개선 효과를 보이지 않았어요. 불편이 있다면 진료를 받아 효과가 확인된 치료를 먼저 받아 보세요.</dd>
<dt>약은 평생 먹어야 하나요?</dt>
<dd>전립선비대증은 나이와 함께 진행하는 경우가 많아 약을 오래 쓰는 경우가 많아요. 증상이 좋아졌다고 스스로 끊으면 다시 나빠질 수 있으니 의사와 상의해요.</dd>
</dl>
