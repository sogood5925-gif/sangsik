  data-title="물과 수분: 하루 8잔의 진실, 소변 색으로 확인하기, 너무 많이 마셔도 문제"
  data-thumb="2L|하루 수분 안팎"
  data-summary="물은 가장 기본적인 영양소지만 필요한 양은 사람마다 달라요. 하루 필요량과 음식으로 얻는 물, '하루 8잔'의 근거, 소변 색으로 확인하는 법, 노인에게 탈수가 흔한 이유, 운동할 때 수분 보충, 너무 많이 마시면 생기는 저나트륨혈증을 정리했어요."
  data-tags="물,수분,탈수,소변색,저나트륨혈증">
<p class="lead">우리 몸의 절반 이상은 물이에요. 체온을 조절하고, 영양소를 나르고, 노폐물을 내보내는 모든 일에 물이 필요해요. 그런데 '얼마나'에 대해서는 오해가 꽤 많아요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>음식과 음료를 합한 수분은 성인 남성 <strong>약 2.5L</strong>, 여성 <strong>약 2L</strong> 안팎이 기준이에요. 그중 상당 부분은 음식에서 와요.</li>
<li><strong>'하루 8잔'</strong>은 과학적 근거가 분명한 기준이 아니에요. 필요량은 사람과 상황마다 달라요.</li>
<li><strong>소변이 연한 노란색</strong>이면 대체로 충분해요.</li>
<li>노인은 갈증을 덜 느껴서 <strong>시간을 정해</strong> 마시는 게 좋아요.</li>
</ul></div>

<h2>물이 하는 일</h2>
<ul>
<li><strong>체온 조절:</strong> 땀을 흘려 열을 식혀요.</li>
<li><strong>운반:</strong> 혈액의 대부분이 물이에요. 영양소와 산소를 나르고 노폐물을 콩팥으로 보내요.</li>
<li><strong>노폐물 배출:</strong> 소변과 대변으로 노폐물을 내보내요. 물이 부족하면 변비와 요로 결석이 생기기 쉬워요.</li>
<li><strong>관절과 점막:</strong> 관절을 부드럽게 하고 눈, 입, 코를 촉촉하게 유지해요.</li>
</ul>

<h2>하루에 얼마나 필요할까</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th>하루 총수분 (음식 + 음료)</th></tr></thead>
<tbody>
<tr><td>성인 남성</td><td class="num">약 2.5L</td></tr>
<tr><td>성인 여성</td><td class="num">약 2.0L</td></tr>
<tr><td>임신부</td><td class="num">여성 기준 + 약 0.3L</td></tr>
<tr><td>수유부</td><td class="num">여성 기준 + 약 0.7L</td></tr>
</tbody>
<caption>유럽식품안전청(EFSA) 기준. 한국인 영양소 섭취기준도 비슷한 수준의 충분섭취량을 제시해요.</caption></table></div>
<p>이 양은 <strong>마시는 물만이 아니에요.</strong> 밥, 국, 과일, 채소 같은 음식에서도 수분을 꽤 얻어요. 특히 국과 찌개를 자주 먹는 한국 식단은 음식으로 얻는 수분이 많은 편이에요. 그래서 음료로 마셔야 하는 양은 이보다 적어요.</p>
<h3>더 필요한 경우</h3>
<ul>
<li>덥거나 습한 날, 땀을 많이 흘리는 일이나 운동</li>
<li>열, 설사, 구토가 있을 때</li>
<li>임신과 수유 중</li>
<li>요로 결석을 앓은 적이 있을 때 (하루 소변량 2L 이상을 목표로 하기도 해요)</li>
<li>방광염이 잦을 때</li>
</ul>

<h2>'하루 8잔'은 어디서 왔을까</h2>
<p>'하루 8잔(약 2L)'은 널리 퍼진 말이지만, 이를 뒷받침하는 연구는 뚜렷하지 않아요. 음식으로 얻는 수분을 빼고 '물만 8잔'이라고 오해되면서 퍼졌다는 분석이 많아요. 건강한 성인은 <strong>목마를 때 마시는 것</strong>만으로도 대부분 충분해요. 숫자에 맞추려 억지로 마실 필요는 없어요.</p>

<h2>소변 색으로 확인하기</h2>
<div class="tbl"><table>
<thead><tr><th>소변 색</th><th>의미</th></tr></thead>
<tbody>
<tr><td>투명에 가까움</td><td>충분하거나 조금 많이 마시는 중</td></tr>
<tr><td>연한 노란색 (레모네이드색)</td><td>적당함</td></tr>
<tr><td>진한 노란색</td><td>수분이 조금 부족함, 물을 더 마셔요</td></tr>
<tr><td>호박색, 갈색</td><td>탈수 가능성, 또는 다른 원인 (간 질환, 근육 손상 등). 물을 마셔도 계속되면 진료를 받아요</td></tr>
</tbody></table></div>
<p>비타민 B2(리보플라빈)가 든 영양제를 먹으면 소변이 형광 노란색이 될 수 있어요. 이건 탈수 때문이 아니에요. 비트, 일부 약도 소변 색을 바꿔요.</p>

<h2>탈수의 신호</h2>
<ul>
<li>목마름, 입과 입술 마름</li>
<li>소변 양이 줄고 색이 진해짐</li>
<li>피로, 두통, 집중력 저하</li>
<li>어지러움, 특히 일어설 때</li>
<li>변비</li>
<li>심하면 빠른 맥박, 의식 저하 (응급)</li>
</ul>
<div class="box warn"><span class="h">노인은 갈증을 늦게 느껴요</span>
<p>나이가 들면 갈증을 느끼는 기능이 떨어지고, 콩팥이 물을 붙잡는 능력도 약해져요. 화장실 가기가 불편해 일부러 물을 덜 마시기도 해요. 그래서 노인은 여름철이나 감기, 설사 때 쉽게 탈수가 되고, 탈수가 혼돈, 낙상, 요로감염, 콩팥 손상으로 이어지기도 해요. <strong>식사 때와 식사 사이에 시간을 정해</strong> 조금씩 마시는 습관이 좋아요. 다만 심부전이나 콩팥병으로 수분 제한을 받았다면 그 지시를 따라요.</p></div>

<h2>커피와 차도 수분일까</h2>
<p>카페인은 약한 이뇨 작용이 있지만, 평소 커피나 차를 마시는 사람에게는 그 효과가 크지 않아서, <strong>적당량의 커피와 차도 하루 수분에 포함</strong>된다고 봐요. 다만 단 음료, 주스는 수분과 함께 당과 열량이 많아서 물을 대신하기에 좋지 않아요. 술은 이뇨 작용이 커서 수분 보충이 되지 않아요.</p>

<h2>운동할 때</h2>
<ul>
<li>운동 전에 물을 조금 마시고, 운동 중에는 <strong>목마를 때 조금씩</strong> 마셔요.</li>
<li>1시간 이내의 가벼운 운동은 물로 충분해요.</li>
<li>1시간 넘게 땀을 많이 흘리는 운동이나 무더운 날 야외 작업은 <strong>전해질(나트륨)</strong>이 든 음료를 함께 고려해요.</li>
<li>운동 전후 체중을 재서 줄어든 만큼 보충하면 대략적인 기준이 돼요.</li>
</ul>

<h2>너무 많이 마셔도 문제: 저나트륨혈증</h2>
<p>짧은 시간에 아주 많은 물을 마시면 혈액 속 나트륨이 묽어져 <strong>저나트륨혈증</strong>이 생길 수 있어요. 두통, 메스꺼움, 혼돈이 생기고 심하면 경련과 의식 저하로 이어져요.</p>
<ul>
<li>마라톤처럼 긴 운동 중 땀으로 나트륨을 잃으면서 물만 과하게 마실 때</li>
<li>물 마시기 대회나 극단적인 '물 다이어트'</li>
<li>일부 약(이뇨제, 일부 항우울제)을 먹는 노인</li>
</ul>
<p>건강한 사람이 목마를 때 마시는 정도로는 거의 생기지 않아요. '많이 마실수록 좋다'가 아니라 <strong>필요한 만큼</strong>이 원칙이에요.</p>

<div class="box"><span class="h">수분 챙기는 습관</span>
<ol>
<li>아침에 일어나 물 한 컵</li>
<li>식사 때마다 물 한 컵</li>
<li>책상이나 가방에 물병 두기</li>
<li>소변 색을 가끔 확인하기</li>
<li>더운 날, 운동할 때는 더 자주</li>
<li>어르신은 시간을 정해 조금씩</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>물을 많이 마시면 살이 빠지나요?</dt>
<dd>식사 전에 물을 마시면 포만감이 조금 늘어 식사량이 줄었다는 연구가 있어요. 효과는 크지 않지만, 단 음료를 물로 바꾸는 것은 체중 관리에 분명히 도움이 돼요.</dd>
<dt>물을 많이 마시면 피부가 좋아지나요?</dt>
<dd>심하게 탈수된 상태가 아니라면 물을 더 마신다고 피부가 눈에 띄게 좋아진다는 근거는 약해요. 피부 보습은 보습제와 자외선 차단이 더 효과적이에요.</dd>
<dt>밤에 물을 마시면 화장실 때문에 깨요.</dt>
<dd>하루 수분을 낮 시간에 주로 마시고, 잠들기 2시간 전부터는 조금 줄여요. 밤에 소변 때문에 자주 깬다면 전립선, 방광, 수면무호흡 등 다른 원인도 확인해 보세요.</dd>
</dl>
