  data-thumb="오른쪽|한국인에게 흔한 위치"
  data-summary="대장 벽이 바깥으로 주머니처럼 튀어나온 게실에 염증이 생기면 게실염이에요. 서양과 달리 우리나라 젊은 층은 오른쪽에 잘 생겨 맹장염과 헷갈리기 쉬워요. 게실이 생기는 이유, 증상과 합병증, 입원이 필요한 경우와 집에서의 치료, 식이섬유와 생활 습관, 통증 없는 게실 출혈을 정리했어요."
  data-tags="게실염,대장게실,복통,식이섬유,질병">
<p class="lead">오른쪽 아랫배가 며칠째 아프고 열이 나서 맹장염인 줄 알고 병원에 갔는데, CT를 찍어 보니 '게실염'이라는 진단을 받는 경우가 있어요. 대장에 생긴 작은 주머니에 염증이 생긴 것이에요. 대부분은 수술 없이 좋아지고, 식습관을 조금 바꾸면 재발을 줄일 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>게실</strong>은 대장 벽이 바깥으로 튀어나온 작은 주머니예요. 대부분은 평생 증상이 없어요.</li>
<li>게실에 염증이 생기면 <strong>한쪽 아랫배 통증과 열</strong>이 나요. 한국인은 <strong>오른쪽</strong>이 흔해요.</li>
<li>합병증이 없으면 대개 <strong>입원 없이</strong> 치료하고, 심하면 입원해 항생제·시술을 해요.</li>
<li>재발 예방에는 <strong>식이섬유, 운동, 적정 체중, 금연</strong>이 도움이 돼요. 씨앗과 견과류를 피할 필요는 없어요.</li>
</ul></div>

<h2>게실은 왜 생길까</h2>
<p>대장 안의 압력이 오랫동안 높거나 장벽이 약해지면, 혈관이 지나가는 약한 부분이 바깥으로 밀려 나가 주머니가 생겨요. 나이가 들수록, 식이섬유가 부족하고 변비가 있을수록 잘 생겨요. 서양에서는 주로 왼쪽 아래(S상결장)에 생기지만, 우리나라를 포함한 아시아에서는 <strong>젊은 층의 오른쪽(상행결장) 게실</strong>이 흔하고, 나이가 들면 왼쪽도 늘어요.</p>

<h2>게실증과 게실염, 게실 출혈</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>모습</th></tr></thead>
<tbody>
<tr><td>게실증</td><td>게실만 있고 증상이 없어요. 대장내시경이나 CT에서 우연히 발견돼요</td></tr>
<tr><td>게실염</td><td>게실에 염증이 생겨 아랫배 통증, 열, 누르면 아픔, 때로 구역·변비·설사</td></tr>
<tr><td>합병 게실염</td><td>고름집(농양), 천공, 누공, 장이 좁아짐</td></tr>
<tr><td>게실 출혈</td><td><strong>통증 없이</strong> 갑자기 많은 양의 붉은 피가 항문으로 나와요. 주로 고령</td></tr>
</tbody>
<caption>대한대장항문학회, 미국소화기학회(AGA) 급성 게실염 임상 진료 업데이트(2021)를 바탕으로 정리</caption></table></div>

<h2>맹장염과 헷갈리는 이유</h2>
<p>오른쪽 게실염은 충수염(맹장염)과 통증 위치가 비슷해요. 게실염은 통증이 처음부터 한 곳에 있고, 구역·구토나 식욕 저하가 덜한 편이라는 차이가 있지만 증상만으로는 구별이 어려워요. 그래서 <strong>CT</strong>로 확인하는 경우가 많아요. 진단이 달라지면 치료도 달라지니 자가 판단하지 않아요.</p>

<h2>치료</h2>
<div class="tbl"><table>
<thead><tr><th>상황</th><th>치료</th></tr></thead>
<tbody>
<tr><td>합병증 없는 가벼운 게실염, 면역 정상</td><td>통원 치료. 맑은 유동식에서 시작해 식사를 늘려요. 최근 지침은 선택적으로 항생제를 쓰도록 권해요</td></tr>
<tr><td>열이 높거나 통증이 심함, 먹지 못함, 고령·면역 저하</td><td>입원해 수액과 항생제</td></tr>
<tr><td>농양</td><td>항생제, 크면 피부를 통해 관을 넣어 고름을 빼요</td></tr>
<tr><td>천공·복막염, 반복되는 합병증</td><td>수술</td></tr>
</tbody>
<caption>미국소화기학회(AGA) 급성 게실염 임상 진료 업데이트(2021), 대한대장항문학회 자료를 바탕으로 정리. 항생제 사용은 의사가 판단해요</caption></table></div>
<p>좋아진 뒤 최근에 대장내시경을 받지 않았다면, 염증이 가라앉고 몇 주 뒤 <strong>대장내시경</strong>으로 다른 병(특히 대장암)이 없는지 확인하는 것을 권해요.</p>

<div class="box warn"><span class="h">바로 응급실에 가야 할 때</span>
<ul>
<li>배 전체가 딱딱하고 <strong>조금만 움직여도 심하게 아파요.</strong></li>
<li><strong>38°C 이상 열</strong>과 오한, 구토로 물도 못 마셔요.</li>
<li>집에서 치료 중인데 2~3일이 지나도 좋아지지 않거나 오히려 심해져요.</li>
<li>항문으로 <strong>많은 양의 피</strong>가 나오고 어지러워요.</li>
</ul></div>

<h2>재발을 줄이는 생활</h2>
<ul>
<li><strong>식이섬유</strong>를 충분히: 채소, 과일, 통곡물, 콩. 갑자기 늘리면 배에 가스가 차니 천천히 늘리고 물을 함께 마셔요.</li>
<li><strong>규칙적인 운동</strong>, 적정 체중 유지</li>
<li><strong>금연</strong></li>
<li>비스테로이드 소염진통제(이부프로펜 등)를 자주 먹으면 합병증과 출혈 위험이 높아질 수 있어요. 필요하면 의사와 상의해요.</li>
<li>붉은 고기를 많이 먹는 식습관은 게실염과 관련이 있다는 연구가 있어요.</li>
</ul>

<h2>씨앗과 견과류는 괜찮아요</h2>
<p>예전에는 씨앗, 견과류, 팝콘이 게실에 끼어 염증을 일으킨다며 피하라고 했어요. 그러나 대규모 연구에서 이런 음식이 게실염 위험을 높이지 않았고, 오히려 견과류를 즐겨 먹는 사람의 위험이 조금 낮았어요. 지금은 <strong>피하지 않아도 된다</strong>고 안내해요.</p>

<div class="box"><span class="h">게실 관리 체크리스트</span>
<ol>
<li>한쪽 아랫배 통증·열은 진료</li>
<li>식이섬유 천천히 늘리기, 물과 함께</li>
<li>규칙적인 운동, 적정 체중</li>
<li>금연, 소염진통제 자주 먹지 않기</li>
<li>회복 뒤 대장내시경 확인</li>
<li>통증 없는 많은 혈변은 즉시 응급실</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>게실이 있으면 대장암이 잘 생기나요?</dt>
<dd>게실 자체가 대장암으로 변하지는 않아요. 다만 게실염과 대장암이 CT에서 비슷해 보일 수 있어 회복 뒤 대장내시경으로 확인해요.</dd>
<dt>게실을 미리 제거해야 하나요?</dt>
<dd>증상이 없는 게실은 치료가 필요 없어요. 반복되는 합병증이 있을 때만 수술을 고려해요.</dd>
<dt>유산균이 재발을 막아 주나요?</dt>
<dd>재발 예방 효과는 아직 뚜렷하지 않아요. 식이섬유와 생활 습관이 더 확실한 방법이에요.</dd>
</dl>
