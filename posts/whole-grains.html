  data-title="통곡물: 껍질째 먹는 곡물이 좋은 이유, 진짜 통곡물 고르는 법과 현미 비소 걱정"
  data-thumb="3층|겨·씨눈·배젖"
  data-summary="통곡물은 곡물의 겨와 씨눈, 배젖을 모두 담고 있어 식이섬유와 비타민, 무기질이 풍부해요. 통곡물의 건강 효과에 대한 연구, 현미·귀리·보리·메밀 등 종류별 특징, '통밀' 표시와 색깔에 속지 않는 법, 현미의 무기비소 걱정과 줄이는 조리법, 처음 먹는 사람을 위한 요령을 정리했어요."
  data-tags="통곡물,현미,귀리,식이섬유,영양소">
<p class="lead">쌀과 밀을 곱게 도정하면 부드럽고 먹기 좋아지지만, 그 과정에서 영양이 많은 겉껍질(겨)과 씨눈이 깎여 나가요. 통곡물은 이 부분을 그대로 남긴 곡물이에요. 한 번에 모두 바꾸지 않아도, 매일 한 끼씩 통곡물로 바꾸는 것만으로도 식사의 질이 꽤 달라져요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>통곡물은 <strong>겨, 씨눈, 배젖</strong>을 모두 가진 곡물이에요. 흰쌀과 흰 밀가루는 배젖만 남은 것이에요.</li>
<li>통곡물을 많이 먹는 사람은 <strong>심혈관 질환, 제2형 당뇨병, 대장암</strong> 위험이 낮았어요.</li>
<li>빵과 시리얼은 색보다 <strong>원재료명의 첫 번째 재료</strong>가 통곡물인지 확인해요.</li>
<li>현미의 비소가 걱정되면 <strong>여러 번 씻고, 다양한 잡곡을 섞어</strong> 먹어요.</li>
</ul></div>

<h2>통곡물의 구조</h2>
<div class="tbl"><table>
<thead><tr><th>부분</th><th>들어 있는 것</th></tr></thead>
<tbody>
<tr><td>겨(바깥 껍질)</td><td>식이섬유, B군 비타민, 철·마그네슘·아연, 폴리페놀</td></tr>
<tr><td>씨눈(배아)</td><td>비타민 E, B군 비타민, 좋은 지방, 무기질</td></tr>
<tr><td>배젖(가운데)</td><td>전분, 일부 단백질. 흰쌀·흰 밀가루는 주로 이 부분이에요</td></tr>
</tbody>
<caption>미국 통곡물협의회(Whole Grains Council), 농촌진흥청 곡물 영양 정보를 바탕으로 정리</caption></table></div>

<h2>건강 효과에 대한 연구</h2>
<ul>
<li>여러 연구를 모은 분석에서 통곡물을 하루 약 90g(밥 한 공기 남짓의 통곡물에 해당) 먹는 사람은 적게 먹는 사람보다 <strong>관상동맥질환, 뇌졸중, 암, 전체 사망</strong> 위험이 낮았어요.</li>
<li>통곡물이 많은 식사는 <strong>제2형 당뇨병</strong> 발생 위험이 낮았고, 식후 혈당 상승도 완만했어요.</li>
<li>식이섬유 덕분에 포만감이 오래가고 <strong>변비</strong> 예방과 대장 건강에 도움이 돼요.</li>
</ul>
<p>이런 연구는 대부분 관찰 연구라 통곡물을 먹는 사람의 다른 건강한 습관도 영향을 줄 수 있어요. 그래도 결과가 여러 나라에서 일관되게 나와 대부분의 식사 지침이 통곡물을 권해요.</p>

<h2>종류별 특징</h2>
<div class="tbl"><table>
<thead><tr><th>곡물</th><th>특징</th></tr></thead>
<tbody>
<tr><td>현미</td><td>쌀겨와 씨눈이 남아 있어요. 오래 불려 짓거나 발아현미를 쓰면 부드러워요</td></tr>
<tr><td>귀리(오트밀)</td><td>수용성 섬유 베타글루칸이 LDL 콜레스테롤을 조금 낮춰요. 압착 귀리는 조리가 쉬워요</td></tr>
<tr><td>보리</td><td>베타글루칸이 많고 씹는 맛이 좋아요. 밥에 섞기 좋아요</td></tr>
<tr><td>통밀</td><td>통밀가루, 통밀빵, 통밀 파스타로 먹어요</td></tr>
<tr><td>메밀</td><td>엄밀히는 곡물이 아니지만 통곡물처럼 먹어요. 메밀 알레르기가 있는 사람은 피해요</td></tr>
<tr><td>수수, 조, 기장, 퀴노아</td><td>밥에 섞으면 식감과 영양이 다양해져요</td></tr>
</tbody></table></div>

<h2>진짜 통곡물 고르는 법</h2>
<ul>
<li><strong>원재료명의 첫 번째</strong>에 '통밀', '현미', '귀리' 같은 통곡물이 오는지 확인해요.</li>
<li>'밀가루(국산)', '소맥분'만 적혀 있으면 정제 밀가루예요.</li>
<li>갈색 빵이라도 캐러멜 색소나 당밀로 색을 낸 경우가 있어요. <strong>색은 기준이 아니에요.</strong></li>
<li>'통곡물 함유', '멀티그레인'은 통곡물이 조금만 들어도 쓸 수 있어요. 함량(%)을 확인해요.</li>
<li>시리얼과 그래놀라는 통곡물이라도 설탕이 많을 수 있어 당류도 함께 봐요.</li>
</ul>

<h2>현미와 무기비소</h2>
<p>쌀은 논물에서 자라 흙 속의 비소를 다른 곡물보다 많이 흡수해요. 비소는 주로 겨층에 모여 있어 <strong>현미가 백미보다 무기비소가 많아요.</strong> 국내 쌀은 식품의약품안전처의 무기비소 기준을 두고 관리되고, 일반적인 섭취량에서 크게 걱정할 수준은 아니라고 알려져 있어요. 그래도 줄이는 방법이 있어요.</p>
<ul>
<li>쌀을 <strong>여러 번 씻어요.</strong></li>
<li>물을 넉넉히 넣고 끓인 뒤 물을 따라 내는 방식으로 조리하면 무기비소가 크게 줄어요(다만 수용성 비타민도 함께 줄어요).</li>
<li>현미만 먹기보다 <strong>보리, 귀리, 수수, 콩</strong> 등 다양한 곡물을 섞어요.</li>
<li>영유아에게는 쌀 과자, 쌀 음료만 많이 주지 않고 다양한 곡물을 먹여요.</li>
</ul>

<h2>처음 시작할 때</h2>
<ul>
<li>흰쌀에 잡곡을 <strong>20~30%</strong>부터 섞어 조금씩 늘려요.</li>
<li>현미는 물에 몇 시간 불리거나, 압력솥을 쓰면 부드러워요.</li>
<li>식이섬유가 갑자기 늘면 배에 가스가 차거나 더부룩할 수 있어요. 천천히 늘리고 물을 충분히 마셔요.</li>
<li>소화 기능이 약한 어르신, 장 수술을 받은 사람, 염증성 장질환이 심할 때는 양을 조절해요.</li>
</ul>

<div class="box"><span class="h">통곡물 체크리스트</span>
<ol>
<li>하루 한 끼는 잡곡밥이나 통곡물</li>
<li>빵은 원재료 첫 번째가 통밀인지</li>
<li>아침은 귀리·통곡물 시리얼(당류 확인)</li>
<li>쌀은 여러 번 씻고 다양한 잡곡 섞기</li>
<li>섬유 늘릴 때 물도 함께</li>
<li>처음엔 섞는 비율을 조금씩 늘리기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>현미밥은 소화가 안 되는데 꼭 먹어야 하나요?</dt>
<dd>현미가 맞지 않으면 보리, 귀리, 발아현미처럼 부드러운 곡물을 섞거나 비율을 낮춰도 충분히 이점이 있어요. 몸에 맞는 방식으로 꾸준히 먹는 것이 중요해요.</dd>
<dt>피트산이 무기질 흡수를 막는다던데요?</dt>
<dd>통곡물의 피트산은 철, 아연 흡수를 조금 줄일 수 있어요. 다양한 식사를 하는 사람에게는 문제가 되지 않는 경우가 많고, 불리기와 발아, 발효(빵 반죽)로 줄일 수 있어요.</dd>
<dt>글루텐이 없는 곡물은 뭐가 있나요?</dt>
<dd>쌀, 현미, 메밀(순수 메밀), 수수, 조, 기장, 퀴노아는 글루텐이 없어요. 귀리는 원래 글루텐이 없지만 가공 중 밀과 섞일 수 있어, 셀리악병이 있다면 글루텐 프리 인증 제품을 골라요.</dd>
</dl>
