  data-title="붉은 고기와 가공육: 발암 분류의 진짜 의미, 일주일에 얼마나, 덜 해롭게 굽는 법"
  data-thumb="350~500g|주당 붉은 고기 상한"
  data-summary="소고기와 돼지고기는 단백질과 철, 아연, 비타민 B12의 좋은 공급원이지만, 많이 먹으면 대장암 위험이 올라가요. 가공육 1군·붉은 고기 2A군 분류의 의미, 위험의 크기, 일주일 적정량, 햄·소시지·베이컨을 줄이는 이유, 탄 고기를 줄이는 조리법을 정리했어요."
  data-tags="붉은고기,가공육,대장암,숯불구이,영양소">
<p class="lead">2015년 국제암연구소가 가공육을 담배와 같은 '1군 발암물질'로 분류했다는 뉴스는 많은 사람을 놀라게 했어요. 하지만 같은 분류라는 건 '암을 일으킨다는 근거가 확실하다'는 뜻이지, 위험의 크기가 담배만큼 크다는 뜻은 아니에요. 고기를 끊기보다 <strong>종류와 양, 조리법</strong>을 조절하는 것이 현실적인 방법이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>가공육</strong>(햄, 소시지, 베이컨 등)은 1군, <strong>붉은 고기</strong>(소·돼지·양고기)는 2A군 발암 요인이에요.</li>
<li>가공육을 매일 <strong>50g</strong> 먹을 때마다 대장암 위험이 약 <strong>18%</strong> 높아져요.</li>
<li>붉은 고기는 익힌 무게로 <strong>일주일 350~500g</strong> 이하, 가공육은 <strong>가능한 적게</strong> 먹기를 권해요.</li>
<li>센 불에 <strong>까맣게 탄 부분</strong>을 줄이면 해로운 물질이 줄어요.</li>
</ul></div>

<h2>붉은 고기와 가공육의 차이</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>예</th><th>국제암연구소 분류</th></tr></thead>
<tbody>
<tr><td>붉은 고기</td><td>소고기, 돼지고기, 양고기, 염소고기(가공하지 않은 것)</td><td>2A군(발암 추정)</td></tr>
<tr><td>가공육</td><td>햄, 소시지, 베이컨, 핫도그, 육포, 스팸 같은 통조림 고기. 소금 절임, 훈연, 발효, 보존제로 가공한 고기</td><td>1군(발암 확실)</td></tr>
<tr><td>흰 살코기·생선</td><td>닭고기, 오리고기, 생선</td><td>분류하지 않음</td></tr>
</tbody>
<caption>국제암연구소(IARC) 모노그래프 제114권(2015)을 바탕으로 정리</caption></table></div>

<h2>위험은 얼마나 클까</h2>
<ul>
<li>가공육을 하루 50g(햄 2~3장, 소시지 1개 정도) 더 먹을 때마다 <strong>대장암 위험이 약 18%</strong> 높아졌어요.</li>
<li>붉은 고기는 하루 100g 더 먹을 때마다 대장암 위험이 약 17% 높아졌다는 분석이 있지만, 근거는 가공육보다 약해요.</li>
<li>'18% 증가'는 상대 위험이에요. 원래 대장암 위험이 평생 약 5%인 사람이라면 약 6% 정도로 올라가는 셈이에요. 작아 보이지만 인구 전체로 보면 적지 않은 차이예요.</li>
<li>그 밖에 가공육은 심혈관 질환, 제2형 당뇨병 위험과도 관련이 있어요.</li>
</ul>

<h2>왜 해로울까</h2>
<ul>
<li><strong>헴철:</strong> 붉은 고기의 헴철이 장에서 발암 물질(N-니트로소 화합물) 생성을 도울 수 있어요.</li>
<li><strong>아질산염·질산염:</strong> 가공육의 보존제가 니트로소아민을 만들 수 있어요.</li>
<li><strong>고온 조리:</strong> 센 불에 굽거나 탈 때 헤테로사이클릭아민(HCA)과 다환방향족탄화수소(PAH)가 생겨요.</li>
<li><strong>나트륨과 포화지방:</strong> 가공육은 짜고 기름진 경우가 많아요.</li>
</ul>

<h2>고기의 좋은 점도 있어요</h2>
<p>붉은 고기는 <strong>단백질, 흡수가 잘 되는 헴철, 아연, 비타민 B12</strong>의 좋은 공급원이에요. 성장기 어린이, 임신부, 가임기 여성, 식사량이 적은 어르신에게는 적당한 양의 살코기가 중요한 영양원이 돼요. 무조건 피하기보다 적당히 먹는 것이 좋아요.</p>

<h2>일주일에 얼마나</h2>
<ul>
<li>세계암연구기금은 붉은 고기를 <strong>익힌 무게로 일주일 350~500g</strong>(날것으로 약 500~750g) 이하로 먹기를 권해요. 한 번에 손바닥 크기(약 100g)를 3~4번 정도예요.</li>
<li>가공육은 <strong>가능한 적게, 가끔만</strong> 먹어요.</li>
<li>국민건강영양조사를 보면 한국인의 평균 가공육 섭취는 서양보다 적지만, 젊은 층을 중심으로 늘고 있어요.</li>
</ul>

<h2>덜 해롭게 굽는 법</h2>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>효과</th></tr></thead>
<tbody>
<tr><td>까맣게 탄 부분은 잘라 내요</td><td>HCA, PAH가 가장 많은 부분이에요</td></tr>
<tr><td>불꽃에 직접 닿지 않게, 중간 불로</td><td>기름이 불에 떨어져 생기는 연기(PAH)를 줄여요</td></tr>
<tr><td>자주 뒤집어요</td><td>표면 온도가 너무 오르지 않게 해요</td></tr>
<tr><td>양념에 재워요(마늘, 허브, 식초 등)</td><td>HCA 생성이 줄었다는 연구가 있어요</td></tr>
<tr><td>삶기, 찌기, 수육, 샤브샤브</td><td>낮은 온도라 해로운 물질이 적어요</td></tr>
<tr><td>비계를 떼고 살코기로</td><td>포화지방과 기름 연기가 줄어요</td></tr>
</tbody>
<caption>미국 국립암연구소(NCI), Chemicals in Meat Cooked at High Temperatures 안내를 바탕으로 정리</caption></table></div>
<p>고기와 함께 <strong>채소를 넉넉히</strong> 먹고, 식이섬유가 많은 통곡물을 곁들이면 대장 건강에 도움이 돼요.</p>

<div class="box"><span class="h">고기 먹는 체크리스트</span>
<ol>
<li>붉은 고기는 일주일 3~4번, 손바닥 크기</li>
<li>햄·소시지·베이컨은 가끔만</li>
<li>생선, 닭고기, 콩으로 번갈아 단백질</li>
<li>탄 부분 잘라 내기, 중간 불로 굽기</li>
<li>수육·찜처럼 삶는 조리법 활용</li>
<li>고기 먹을 때 채소 두 배</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>무첨가 햄이나 수제 소시지는 괜찮나요?</dt>
<dd>'아질산염 무첨가' 제품도 셀러리 분말 같은 천연 재료로 질산염을 넣는 경우가 있어요. 소금에 절이거나 훈연한 가공육이라는 점에서 위험 요인이 남아 있으니 가끔만 먹어요.</dd>
<dt>돼지고기는 흰 고기인가요?</dt>
<dd>요리에서는 흰 고기처럼 부르기도 하지만, 영양학과 암 연구에서는 붉은 고기로 분류해요.</dd>
<dt>숯불구이는 먹으면 안 되나요?</dt>
<dd>가끔 즐기는 것은 괜찮아요. 탄 부분을 잘라 내고, 불과 거리를 두고, 채소와 함께 먹으면 위험을 줄일 수 있어요.</dd>
</dl>
