  data-title="향초·방향제·디퓨저와 실내 공기: 좋은 향 뒤에 남는 것, 두통이 날 때와 안전하게 쓰는 법"
  data-thumb="VOCs|향이 내는 휘발성 물질"
  data-summary="향초와 디퓨저, 섬유 방향제는 집을 편안하게 만들지만 좁고 닫힌 공간에서는 휘발성 유기화합물과 미세먼지를 늘릴 수 있어요. 향이 실내 공기에 미치는 영향, 두통·기침이 날 때 살필 점, 천식이 있거나 아이·반려동물이 있는 집의 주의점, 화재 예방, 향 없이 냄새를 줄이는 방법을 정리했어요."
  data-tags="향초,방향제,디퓨저,실내공기,생활정보">
<p class="lead">은은한 향은 기분을 바꿔 줘요. 그런데 향이 난다는 것은 무언가가 공기 중으로 날아다닌다는 뜻이기도 해요. 향초를 켠 방에서 머리가 지끈거리거나, 섬유 방향제를 뿌린 뒤 기침이 난 경험이 있다면 향과 실내 공기의 관계를 한 번 살펴볼 만해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>향 제품은 <strong>휘발성 유기화합물(VOCs)</strong>을 내보내고, 향초는 태우면서 <strong>미세먼지</strong>도 만들어요.</li>
<li>'천연', '에센셜 오일'이라는 말이 <strong>무해하다는 뜻은 아니에요.</strong></li>
<li>쓸 때는 <strong>짧게, 환기하면서</strong>. 두통·기침·눈 따가움이 생기면 멈춰요.</li>
<li>천식, 영유아, 반려동물(특히 고양이)이 있는 집은 <strong>더 조심</strong>해요.</li>
</ul></div>

<h2>향이 공기에 남기는 것</h2>
<div class="tbl"><table>
<thead><tr><th>제품</th><th>공기 중으로 나오는 것</th><th>특징</th></tr></thead>
<tbody>
<tr><td>향초</td><td>미세먼지, 그을음, 휘발성 유기화합물</td><td>불꽃이 흔들리거나 심지가 길면 그을음이 늘어요</td></tr>
<tr><td>디퓨저</td><td>향료와 용제의 휘발성 유기화합물</td><td>계속 조금씩 퍼져 노출 시간이 길어요</td></tr>
<tr><td>스프레이 방향제·섬유 탈취제</td><td>작은 물방울과 향료 성분</td><td>뿌리는 순간 코와 입 가까이 농도가 높아요</td></tr>
<tr><td>인센스(향)</td><td>미세먼지, 일산화탄소 등 연소 물질</td><td>연기가 많아 좁은 공간에서 특히 주의해요</td></tr>
<tr><td>차량용 방향제</td><td>향료 성분</td><td>좁은 차 안이라 농도가 쉽게 높아져요</td></tr>
</tbody>
<caption>환경부 생활화학제품 안전 정보, 미국 환경보호청(EPA) 실내 공기질 안내를 바탕으로 정리</caption></table></div>
<p>향료 성분 중 일부는 공기 중 오존과 만나 포름알데히드 같은 2차 물질을 만들기도 해요. 환기가 잘 되는 공간에서는 금방 흩어지지만, 닫힌 방에서 오래 쓰면 쌓일 수 있어요.</p>

<h2>'천연'이면 괜찮을까</h2>
<p>라벤더, 티트리, 유칼립투스 같은 에센셜 오일도 여러 화학 성분이 모인 것이에요. 사람에 따라 피부염이나 호흡기 자극을 일으킬 수 있어요. '천연 유래', '무독성'이라는 문구보다 <strong>사용량과 환기, 내 몸의 반응</strong>이 더 중요해요.</p>

<h2>몸이 보내는 신호</h2>
<ul>
<li>향이 있는 곳에서 <strong>두통, 메스꺼움, 어지러움</strong>이 생겨요.</li>
<li><strong>기침, 콧물, 목 따가움</strong>, 천식이 있다면 쌕쌕거림이 심해져요.</li>
<li>눈이 따갑거나 눈물이 나요.</li>
<li>방향제에 닿은 피부가 가렵고 붉어져요.</li>
</ul>
<p>이런 반응이 반복되면 향 제품을 끄고 환기한 뒤 좋아지는지 지켜봐요. 계속된다면 진료 때 사용하는 제품을 알려 주세요.</p>

<h2>더 조심해야 하는 집</h2>
<div class="tbl"><table>
<thead><tr><th>누가</th><th>왜</th><th>이렇게 해요</th></tr></thead>
<tbody>
<tr><td>천식·비염이 있는 사람</td><td>향과 연기가 기도를 자극해요</td><td>향 제품을 줄이고, 증상이 생기면 바로 치워요</td></tr>
<tr><td>영유아</td><td>몸집에 비해 숨 쉬는 양이 많아요. 디퓨저 액을 삼킬 위험도 있어요</td><td>아이 방에는 두지 않고, 손이 닿지 않는 곳에 보관해요</td></tr>
<tr><td>고양이</td><td>일부 에센셜 오일 성분을 잘 분해하지 못해요</td><td>디퓨저·오일을 가까이 두지 않고, 털에 묻지 않게 해요</td></tr>
<tr><td>새</td><td>호흡기가 매우 예민해요</td><td>같은 공간에서 향초·스프레이를 쓰지 않아요</td></tr>
<tr><td>임신부</td><td>냄새에 민감해져 두통·입덧이 심해질 수 있어요</td><td>불편하면 쓰지 않아요</td></tr>
</tbody>
<caption>대한천식알레르기학회, 한국소비자원 방향제 안전 정보, 수의학계 반려동물 중독 안내를 바탕으로 정리</caption></table></div>

<h2>디퓨저 액을 삼켰거나 눈에 들어갔다면</h2>
<div class="box warn"><span class="h">이렇게 대처해요</span>
<ul>
<li><strong>삼켰을 때:</strong> 억지로 토하게 하지 말고 입을 헹군 뒤 제품 용기를 들고 병원에 가요. 향료 액은 기름 성분이라 토하다 폐로 들어가면 폐렴을 일으킬 수 있어요.</li>
<li><strong>기침이 계속되거나 숨이 차면</strong> 바로 119에 연락해요.</li>
<li><strong>눈에 들어갔을 때:</strong> 흐르는 물로 15분 이상 씻고 안과에 가요.</li>
</ul></div>

<h2>향초 화재 예방</h2>
<ul>
<li>켜 둔 채 <strong>자리를 비우거나 잠들지 않아요.</strong></li>
<li>커튼, 책, 종이에서 멀리, 흔들리지 않는 평평한 곳에 둬요.</li>
<li>심지는 5mm 안팎으로 다듬으면 그을음이 줄어요.</li>
<li>끌 때는 입으로 불기보다 뚜껑을 덮거나 심지 끄개를 써요.</li>
<li>아이와 반려동물이 닿는 곳에 두지 않아요.</li>
</ul>

<h2>향 없이 냄새 줄이기</h2>
<p>냄새는 덮기보다 없애는 편이 공기에 좋아요.</p>
<ul>
<li>요리 중에는 <strong>주방 후드를 켜고</strong> 끝난 뒤에도 잠시 더 틀어요.</li>
<li>하루 2~3번 맞통풍 환기를 해요.</li>
<li>음식물 쓰레기는 자주 비우고, 배수구와 쓰레기통을 씻어요.</li>
<li>옷과 이불은 햇볕과 바람에 말려요.</li>
<li>신발장에는 신문지나 베이킹소다를 둬요.</li>
</ul>

<div class="box"><span class="h">향 제품 안전 체크리스트</span>
<ol>
<li>쓰는 동안 창문 조금 열어 두기</li>
<li>좁은 방·차 안에서는 짧게만</li>
<li>두통·기침 생기면 끄고 환기</li>
<li>아이 방·반려동물 가까이 두지 않기</li>
<li>향초는 켜 둔 채 자리 비우지 않기</li>
<li>제품의 생활화학제품 안전확인 표시 확인</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>소이 캔들은 그을음이 없나요?</dt>
<dd>원료에 따라 그을음 양이 다를 수 있지만, 불로 태우는 이상 미세먼지와 연소 물질은 생겨요. 원료보다 심지 관리와 환기가 더 중요해요.</dd>
<dt>공기청정기를 켜면 괜찮나요?</dt>
<dd>공기청정기는 향초의 미세먼지는 어느 정도 걸러도, 기체 상태의 휘발성 유기화합물은 잘 걸러지지 않아요. 환기가 먼저예요.</dd>
<dt>섬유 탈취제를 옷에 매일 뿌려도 되나요?</dt>
<dd>뿌린 직후 가까이서 들이마시지 않도록 하고, 향이 강하게 남는 것이 불편하면 줄여요. 세탁과 햇볕 건조가 가장 좋은 탈취예요.</dd>
</dl>
