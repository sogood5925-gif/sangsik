  data-title="칼슘 총정리: 한국인에게 가장 부족한 미네랄, 음식과 보충제로 채우는 법"
  data-thumb="Ca|칼슘"
  data-summary="칼슘은 한국인이 권장량에 가장 못 미치게 먹는 영양소 가운데 하나예요. 나이별 필요량, 흡수가 잘 되는 음식과 안 되는 음식, 보충제 고르는 법과 나눠 먹는 이유, 과잉 섭취 논란까지 정리했어요."
  data-tags="칼슘,뼈건강,골다공증,비타민D,영양제">
<p class="lead">몸속 칼슘의 99%는 뼈와 치아에 있어요. 나머지 1%가 심장 박동과 근육 수축, 신경 전달을 맡는데, 이 1%가 모자라면 몸은 망설이지 않고 뼈에서 칼슘을 꺼내 써요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인 권장섭취량은 대략 <strong>700~800mg</strong>이에요. 나이와 성별에 따라 조금씩 달라요.</li>
<li>우유·유제품, 뼈째 먹는 생선, 두부, 짙은 녹색 채소가 좋은 공급원이에요.</li>
<li>보충제는 <strong>한 번에 500mg 이하</strong>로 나눠 먹을 때 흡수가 좋아요.</li>
<li>음식으로 먼저 채우고, 부족한 만큼만 보충제로 더하는 것이 권장돼요.</li>
</ul></div>

<h2>칼슘은 무슨 일을 할까</h2>
<ul>
<li><strong>뼈와 치아:</strong> 뼈를 단단하게 만드는 주요 성분이에요. 뼈는 평생 부서지고 다시 만들어지기를 반복하는데, 이때 칼슘이 계속 필요해요.</li>
<li><strong>근육 수축:</strong> 심장을 포함한 모든 근육은 칼슘 신호로 수축해요.</li>
<li><strong>신경 전달:</strong> 신경 끝에서 신호 물질이 나올 때 칼슘이 필요해요.</li>
<li><strong>혈액 응고:</strong> 피가 굳는 과정의 여러 단계에 관여해요.</li>
</ul>
<p>혈중 칼슘 농도는 생명과 직결되기 때문에 몸은 이 농도를 매우 좁은 범위로 유지해요. 먹는 양이 부족하면 부갑상선 호르몬이 나와 <strong>뼈에서 칼슘을 꺼내</strong> 혈액을 채워요. 그래서 혈액검사로는 칼슘 부족이 잘 드러나지 않고, 부족한 대가는 몇 년 뒤 뼈 밀도로 나타나요.</p>

<h2>하루에 얼마나 필요할까</h2>
<div class="tbl"><table>
<thead><tr><th>나이</th><th>남성 권장섭취량</th><th>여성 권장섭취량</th></tr></thead>
<tbody>
<tr><td>12~14세</td><td class="num">1,000mg</td><td class="num">900mg</td></tr>
<tr><td>15~18세</td><td class="num">900mg</td><td class="num">800mg</td></tr>
<tr><td>19~49세</td><td class="num">800mg</td><td class="num">700mg</td></tr>
<tr><td>50~64세</td><td class="num">750mg</td><td class="num">800mg</td></tr>
<tr><td>65세 이상</td><td class="num">700mg</td><td class="num">800mg</td></tr>
<tr><td>상한섭취량 (성인)</td><td colspan="2" class="num">19~49세 2,500mg, 50세 이상 2,000mg</td></tr>
</tbody>
<caption>보건복지부·한국영양학회, 2020 한국인 영양소 섭취기준</caption></table></div>
<p>청소년기에 가장 많이 필요해요. 뼈의 양은 20대 후반~30대 초반에 최고치에 이르고 그 뒤로 서서히 줄어요. <strong>젊을 때 뼈를 많이 쌓아둘수록</strong> 나이 들어 골다공증이 늦게 와요. 여성은 폐경 후 뼈가 빠르게 줄어서 50세 이후 권장량이 올라가요.</p>
<p>국민건강영양조사를 보면 한국인의 칼슘 섭취량은 여러 연령대에서 권장량에 못 미쳐요. 우유와 유제품을 적게 먹는 식문화가 주된 이유로 꼽혀요.</p>

<h2>어떤 음식에 많을까</h2>
<div class="tbl"><table>
<thead><tr><th>식품</th><th>1회 분량</th><th>칼슘 (약)</th><th>메모</th></tr></thead>
<tbody>
<tr><td>우유</td><td>1컵 (200mL)</td><td class="num">200mg</td><td>흡수율이 좋은 편</td></tr>
<tr><td>플레인 요거트</td><td>1개 (100g)</td><td class="num">100~150mg</td><td>제품마다 차이</td></tr>
<tr><td>슬라이스 치즈</td><td>1장</td><td class="num">100~150mg</td><td>나트륨도 함께 많음</td></tr>
<tr><td>두부</td><td>⅓모 (100g)</td><td class="num">60~150mg</td><td>응고제 종류에 따라 크게 달라요</td></tr>
<tr><td>잔멸치</td><td>1큰술 (약 10g)</td><td class="num">약 50~90mg</td><td>뼈째 먹는 생선, 나트륨 주의</td></tr>
<tr><td>뱅어포, 정어리 통조림</td><td>1회 분량</td><td class="num">많음</td><td>뼈째 먹는 생선류</td></tr>
<tr><td>케일, 청경채, 브로콜리</td><td>1접시</td><td class="num">수십 mg</td><td>흡수율이 좋은 채소</td></tr>
<tr><td>시금치</td><td>1접시</td><td class="num">표시량은 많음</td><td>옥살산 때문에 흡수가 적어요</td></tr>
</tbody>
<caption>식품의약품안전처 식품영양성분 데이터베이스 등을 참고한 대략적인 값. 제품과 조리법에 따라 달라요.</caption></table></div>
<p>한국 식단에서 칼슘을 채우려면 <strong>하루에 우유나 유제품 한두 번</strong>, 그리고 두부나 뼈째 먹는 생선, 녹색 채소를 반찬으로 곁들이는 것이 현실적이에요. 우유를 마시면 배가 불편한 사람은 요거트나 치즈, 유당을 줄인 우유를 시도해 볼 수 있어요.</p>

<h2>흡수를 돕는 것, 막는 것</h2>
<ul>
<li><strong>비타민 D:</strong> 칼슘 흡수에 꼭 필요해요. 비타민 D가 부족하면 칼슘 흡수율이 크게 떨어져요.</li>
<li><strong>한 번에 먹는 양:</strong> 한꺼번에 많이 먹을수록 흡수율이 떨어져요. 나눠 먹는 게 좋아요.</li>
<li><strong>옥살산과 피트산:</strong> 시금치의 옥살산, 통곡물과 콩의 피트산은 칼슘과 결합해 흡수를 줄여요.</li>
<li><strong>나트륨:</strong> 짜게 먹으면 소변으로 칼슘이 더 많이 빠져나가요.</li>
<li><strong>카페인:</strong> 소변으로 칼슘 배출을 조금 늘려요. 적당량이라면 영향은 크지 않아요.</li>
</ul>

<h2>보충제 고르고 먹는 법</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>칼슘 함량</th><th>먹는 때</th><th>특징</th></tr></thead>
<tbody>
<tr><td>탄산칼슘</td><td>약 40%로 높음</td><td>식사와 함께</td><td>위산이 있어야 잘 흡수돼요. 변비, 더부룩함이 생길 수 있어요.</td></tr>
<tr><td>구연산칼슘</td><td>약 21%로 낮음</td><td>식사와 무관</td><td>위산이 적은 사람, 위산억제제를 먹는 사람에게 유리해요. 알약이 크거나 여러 알이에요.</td></tr>
</tbody></table></div>
<ul>
<li><strong>라벨의 '칼슘 함량'을 확인해요.</strong> 탄산칼슘 1,250mg이라고 적혀 있어도 실제 칼슘은 약 500mg이에요.</li>
<li><strong>한 번에 500mg 이하</strong>로 나눠 먹어요.</li>
<li><strong>철분제, 갑상선 호르몬제, 일부 항생제(테트라사이클린, 퀴놀론 계열)와는 시간을 떼어</strong> 먹어요. 칼슘이 이 약들의 흡수를 방해해요.</li>
<li>음식으로 먹는 양을 먼저 계산하고, <strong>부족한 만큼만</strong> 보충제로 채워요. 음식 섭취가 충분하다면 보충제가 필요 없을 수 있어요.</li>
</ul>

<h2>많이 먹으면 생기는 일</h2>
<p>칼슘은 음식으로 먹어서 지나치게 많아지는 경우는 드물어요. 문제는 주로 보충제에서 생겨요.</p>
<ul>
<li><strong>신장 결석:</strong> 흥미롭게도 음식으로 칼슘을 충분히 먹는 사람은 오히려 결석이 적다는 연구가 많아요. 장에서 옥살산과 결합해 흡수를 막아주기 때문이에요. 반면 보충제는 결석 위험을 조금 높인다는 연구가 있어요.</li>
<li><strong>심혈관 질환 논란:</strong> 칼슘 보충제가 심혈관 질환 위험을 높인다는 연구와 그렇지 않다는 연구가 엇갈려요. 아직 결론이 나지 않았지만, 이 논란 때문에 많은 전문가가 <strong>음식으로 먼저, 보충제는 필요한 만큼만</strong>을 권해요.</li>
<li><strong>변비와 더부룩함:</strong> 특히 탄산칼슘에서 흔해요.</li>
</ul>

<h2>뼈를 지키는 건 칼슘만이 아니다</h2>
<p>칼슘을 충분히 먹어도 뼈는 약해질 수 있어요. 뼈 건강은 여러 요인이 함께 작용해요.</p>
<div class="box"><span class="h">뼈를 지키는 생활 체크리스트</span>
<ol>
<li>유제품이나 칼슘이 많은 반찬을 하루 두 번 이상 먹기</li>
<li>비타민 D 상태 확인하고, 짧게라도 햇볕 쬐기</li>
<li>걷기, 계단 오르기 같은 체중을 싣는 운동과 근력 운동하기</li>
<li>담배 끊고 술 줄이기 (둘 다 뼈를 약하게 해요)</li>
<li>단백질을 끼니마다 챙기기</li>
<li>폐경 후 여성, 70세 이상 남성은 골밀도 검사 받기 (국가건강검진에서 54세·66세 여성 대상)</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>멸치를 많이 먹으면 칼슘은 충분한가요?</dt>
<dd>멸치는 칼슘이 많지만 한 번에 먹는 양이 적고 나트륨도 많아요. 멸치볶음 반찬 한 접시로 하루 필요량의 일부를 채울 수 있지만, 멸치만으로 채우려고 하기보다 여러 식품을 조합하는 게 좋아요.</dd>
<dt>사골 국물에는 칼슘이 많나요?</dt>
<dd>오래 끓여도 뼈의 칼슘은 국물로 많이 녹아 나오지 않아요. 국물에는 칼슘보다 지방과 나트륨이 더 많을 수 있어요.</dd>
<dt>칼슘제를 먹으면 골다공증이 예방되나요?</dt>
<dd>칼슘과 비타민 D가 부족한 사람에게는 도움이 돼요. 하지만 이미 골다공증이 있다면 칼슘제만으로는 부족하고 골다공증 치료제가 필요한 경우가 많아요. 골밀도 결과를 가지고 의사와 상의해요.</dd>
</dl>
