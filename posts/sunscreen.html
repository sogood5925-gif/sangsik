  data-title="자외선 차단제 제대로 쓰기: SPF와 PA의 뜻, 바르는 양, 덧바르는 시간"
  data-thumb="SPF|PA++++"
  data-summary="자외선 차단제는 무엇을 고르느냐보다 얼마나, 언제 바르느냐가 더 중요해요. UVA와 UVB의 차이, SPF와 PA 숫자가 뜻하는 것, 제대로 된 효과를 내는 양, 덧바르는 요령, 무기자차와 유기자차, 아기와 흐린 날, 옷과 모자로 막는 법까지 정리했어요."
  data-tags="자외선차단제,선크림,SPF,피부건강,피부암">
<p class="lead">SPF 50 제품을 발랐는데도 탔다면, 제품보다 바른 양이 부족했을 가능성이 커요. 대부분의 사람은 실험실에서 쓰는 양의 절반도 바르지 않아요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>UVB</strong>는 화상과 피부암, <strong>UVA</strong>는 노화와 피부암에 관여해요. 둘 다 막아야 해요.</li>
<li>SPF는 UVB, <strong>PA</strong>는 UVA 차단 정도예요. 일상은 SPF 30·PA+++ 이상이면 충분한 경우가 많아요.</li>
<li>얼굴에는 <strong>손가락 두 마디</strong> 정도의 양을 발라야 표시된 효과가 나요.</li>
<li>밖에 오래 있다면 <strong>2시간마다</strong>, 땀을 흘리거나 물놀이 후에는 바로 덧발라요.</li>
</ul></div>

<h2>자외선 A와 B</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>UVB</th><th>UVA</th></tr></thead>
<tbody>
<tr><td>파장</td><td>짧음</td><td>김</td></tr>
<tr><td>도달 깊이</td><td>피부 표면(표피)</td><td>피부 깊숙이(진피)</td></tr>
<tr><td>주요 영향</td><td>피부가 붉게 타는 화상, 피부암, 비타민 D 합성</td><td>주름, 탄력 저하, 색소 침착, 피부암</td></tr>
<tr><td>특징</td><td>한낮과 여름에 강함, 유리창에 대부분 막힘</td><td>계절과 시간에 따른 변화가 적고, <strong>유리창과 구름을 통과</strong></td></tr>
</tbody></table></div>
<p>그래서 흐린 날, 겨울, 실내 창가에서도 UVA는 꾸준히 들어와요. 운전을 자주 하는 사람의 얼굴 한쪽이 더 늙어 보이는 사례가 알려져 있어요.</p>

<h2>SPF와 PA 읽기</h2>
<h3>SPF (UVB 차단 지수)</h3>
<p>SPF는 차단제를 발랐을 때 피부가 붉어지기까지 걸리는 시간이 몇 배 늘어나는지를 나타내요.</p>
<div class="tbl"><table>
<thead><tr><th>SPF</th><th>UVB 차단율 (약)</th></tr></thead>
<tbody>
<tr><td class="num">15</td><td class="num">93%</td></tr>
<tr><td class="num">30</td><td class="num">97%</td></tr>
<tr><td class="num">50</td><td class="num">98%</td></tr>
</tbody>
<caption>충분한 양(피부 1cm²당 2mg)을 발랐을 때의 실험실 기준</caption></table></div>
<p>SPF 30과 50의 차이는 생각보다 작아요. 숫자가 높을수록 오래 버틴다고 생각해 덧바르기를 소홀히 하는 게 더 큰 문제예요.</p>
<h3>PA (UVA 차단 등급)</h3>
<p>PA는 UVA 차단 정도를 <strong>+의 개수</strong>로 나타내요. PA+부터 PA++++까지 있고, +가 많을수록 차단 효과가 커요. 국내 제품은 SPF를 최대 '50+', PA를 최대 '++++'로 표시해요.</p>
<div class="tbl"><table>
<thead><tr><th>상황</th><th>권장 (대략)</th></tr></thead>
<tbody>
<tr><td>출퇴근, 가벼운 외출</td><td>SPF 15~30, PA++ 이상</td></tr>
<tr><td>야외 활동, 운동</td><td>SPF 30~50, PA+++ 이상</td></tr>
<tr><td>해변, 스키장, 등산, 한여름 장시간</td><td>SPF 50+, PA++++, 워터프루프</td></tr>
</tbody></table></div>

<h2>얼마나 발라야 할까</h2>
<p>SPF와 PA는 피부 1cm²당 2mg을 발랐을 때 측정한 값이에요. 대부분의 사람은 그 <strong>4분의 1~절반</strong> 정도만 발라서 실제 효과가 표시보다 훨씬 낮아요.</p>
<div class="box note"><span class="h">양을 맞추는 쉬운 방법</span>
<ul>
<li><strong>얼굴과 목:</strong> 검지와 중지 두 손가락에 손가락 길이만큼 짜요 (약 1g 안팎).</li>
<li><strong>몸 전체 (수영복 차림):</strong> 소주잔 하나 정도(약 30mL)가 필요해요.</li>
<li>한 번에 두껍게 바르기 어렵다면 <strong>두 번에 나눠</strong> 얇게 겹쳐 발라요.</li>
<li>귀, 목 뒤, 발등, 정수리 가르마, 입술(자외선 차단 립밤)을 빠뜨리지 않아요.</li>
</ul></div>

<h2>언제, 얼마나 자주</h2>
<ul>
<li>외출 <strong>15분쯤 전</strong>에 바르면 고르게 자리 잡아요.</li>
<li>밖에 오래 있다면 <strong>2시간마다</strong> 덧발라요.</li>
<li>땀을 많이 흘렸거나, 물놀이 후, 수건으로 닦은 뒤에는 <strong>바로</strong> 덧발라요. '워터프루프'도 물속에서 40~80분 정도 효과를 유지하는 것이지 영구적이지 않아요.</li>
<li>화장 위에 덧바를 때는 자외선 차단 쿠션이나 파우더, 스틱형 제품을 활용할 수 있어요. 다만 이런 제품만으로는 충분한 양을 바르기 어려워서, 아침에 기본 차단제를 제대로 바르는 게 중요해요.</li>
</ul>

<h2>무기자차와 유기자차</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>무기자차 (물리적 차단제)</th><th>유기자차 (화학적 차단제)</th></tr></thead>
<tbody>
<tr><td>성분</td><td>징크옥사이드, 티타늄디옥사이드</td><td>여러 유기 자외선 흡수 성분</td></tr>
<tr><td>방식</td><td>피부 표면에서 자외선을 반사·산란</td><td>자외선을 흡수해 열로 바꿈</td></tr>
<tr><td>장점</td><td>자극이 적어 민감한 피부, 아이에게 적합</td><td>백탁이 적고 발림성이 좋음</td></tr>
<tr><td>단점</td><td>하얗게 뜨는 백탁, 뻑뻑함</td><td>일부 사람에게 자극이나 알레르기</td></tr>
</tbody></table></div>
<p>국내에서 판매되는 자외선 차단 성분은 식품의약품안전처가 허용한 기준 안에서 쓰여요. 어떤 방식이든 <strong>내가 매일 충분히 바를 수 있는 제품</strong>이 가장 좋은 제품이에요.</p>

<h2>차단제만으로는 부족하다</h2>
<ul>
<li><strong>그늘:</strong> 자외선이 가장 강한 오전 10시~오후 3시에는 그늘을 찾아요.</li>
<li><strong>옷:</strong> 촘촘하게 짜인 긴 소매 옷이 가장 확실한 차단제예요. 자외선 차단 기능이 있는 옷도 있어요.</li>
<li><strong>모자:</strong> 챙이 넓은(7cm 이상) 모자가 얼굴, 귀, 목까지 가려줘요.</li>
<li><strong>선글라스:</strong> UV400 또는 자외선 99~100% 차단 표시를 확인해요. 색이 진하다고 차단이 잘 되는 건 아니에요.</li>
<li><strong>자외선 지수 확인:</strong> 기상청 자외선 지수가 3 이상이면 차단이 필요하고, 8 이상이면 매우 높음이에요.</li>
<li><strong>반사:</strong> 눈은 자외선의 대부분을, 물과 모래도 상당 부분을 반사해요. 스키장과 해변에서는 더 신경 써요.</li>
</ul>

<h2>아기와 어린이</h2>
<ul>
<li><strong>생후 6개월 미만</strong> 아기는 자외선 차단제보다 그늘, 옷, 모자로 보호하는 것이 권장돼요. 불가피하면 얼굴과 손등처럼 드러난 곳에 소량 바를 수 있어요.</li>
<li>6개월 이후에는 자극이 적은 무기자차 제품을 우선 고려해요.</li>
<li>어린 시절의 심한 햇볕 화상은 나중의 피부암 위험을 높여요.</li>
</ul>

<div class="box"><span class="h">매일 자외선 차단 루틴</span>
<ol>
<li>아침 세안과 보습 후 손가락 두 마디 양 바르기</li>
<li>귀, 목, 손등까지 바르기</li>
<li>외출 전 기상청 자외선 지수 확인하기</li>
<li>야외 활동이 길면 2시간마다 덧바르기</li>
<li>모자와 선글라스 챙기기</li>
<li>개봉한 지 오래된 제품은 교체하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>자외선 차단제를 바르면 비타민 D가 부족해지나요?</dt>
<dd>이론적으로는 합성이 줄지만, 실제 생활에서는 완벽하게 바르는 경우가 드물어 차단제 사용이 비타민 D 결핍을 크게 일으키지는 않는다는 연구가 많아요. 비타민 D가 걱정되면 음식과 보충제로 채우는 게 피부를 지키면서 해결하는 방법이에요.</dd>
<dt>실내에만 있어도 발라야 하나요?</dt>
<dd>창가에 오래 앉아 있다면 UVA가 유리를 통과해 들어와요. 창에서 먼 곳에 있거나 짧게 머문다면 크게 걱정하지 않아도 돼요.</dd>
<dt>스프레이형은 괜찮나요?</dt>
<dd>편하지만 충분한 양이 피부에 남기 어렵고, 얼굴에 바로 뿌리면 들이마실 수 있어요. 손에 뿌린 뒤 얼굴에 펴 바르고, 몸에는 넉넉히 뿌린 뒤 문질러 주세요.</dd>
</dl>
