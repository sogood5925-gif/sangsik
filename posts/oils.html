  data-title="식용유 고르기: 올리브유·들기름·참기름·버터·코코넛유, 요리마다 맞는 기름"
  data-thumb="들기름|냉장 보관"
  data-summary="기름은 종류에 따라 지방산 구성이 달라 심혈관 건강에 주는 영향도 달라요. 주요 식용유의 지방산 비교, 포화지방을 불포화지방으로 바꾸는 효과, 코코넛유와 버터에 대한 연구, 들기름을 냉장 보관해야 하는 이유, 볶음·튀김·무침에 맞는 기름과 튀김 기름 재사용 요령을 정리했어요."
  data-tags="식용유,올리브유,들기름,포화지방,영양소">
<p class="lead">기름은 열량이 높아 적게 쓰는 게 좋지만, '어떤 기름을 쓰느냐'도 그만큼 중요해요. 같은 한 숟가락이라도 버터와 올리브유, 들기름은 몸에 주는 영향이 달라요. 요리에 맞는 기름을 고르고, 제대로 보관하는 법을 알아 두면 맛과 건강을 함께 챙길 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>포화지방</strong>(버터, 라드, 코코넛유, 팜유)을 <strong>불포화지방</strong>(식물성 기름)으로 바꾸면 LDL 콜레스테롤과 심혈관 질환 위험이 줄어요.</li>
<li>코코넛유는 포화지방이 가장 많아 <strong>LDL을 올려요.</strong> 건강 기름으로 보기 어려워요.</li>
<li><strong>들기름</strong>은 오메가3가 풍부하지만 산화가 빨라 <strong>냉장 보관</strong>하고 센 불 요리는 피해요.</li>
<li>기름도 열량이 높아요. 한 큰술에 <strong>약 120kcal</strong>예요.</li>
</ul></div>

<h2>기름별 지방산 비교</h2>
<div class="tbl"><table>
<thead><tr><th>기름</th><th class="num">포화지방</th><th class="num">단일불포화</th><th class="num">다가불포화</th><th>특징</th></tr></thead>
<tbody>
<tr><td>올리브유</td><td class="num">약 14%</td><td class="num">약 73%</td><td class="num">약 11%</td><td>올레산이 많아요. 엑스트라버진은 폴리페놀이 많아요</td></tr>
<tr><td>카놀라유</td><td class="num">약 7%</td><td class="num">약 63%</td><td class="num">약 28%</td><td>포화지방이 가장 적고 오메가3도 조금 있어요</td></tr>
<tr><td>들기름</td><td class="num">약 9%</td><td class="num">약 17%</td><td class="num">약 72%</td><td>오메가3(알파리놀렌산)가 50% 이상이에요</td></tr>
<tr><td>참기름</td><td class="num">약 15%</td><td class="num">약 40%</td><td class="num">약 42%</td><td>항산화 성분(세사몰) 덕분에 비교적 안정적이에요</td></tr>
<tr><td>콩기름·옥수수유·해바라기유</td><td class="num">약 10~15%</td><td class="num">약 20~30%</td><td class="num">약 55~60%</td><td>오메가6(리놀레산)가 많아요</td></tr>
<tr><td>버터</td><td class="num">약 50~63%</td><td class="num">약 25%</td><td class="num">약 3%</td><td>포화지방과 콜레스테롤이 있어요</td></tr>
<tr><td>코코넛유</td><td class="num">약 82~90%</td><td class="num">약 6%</td><td class="num">약 2%</td><td>포화지방이 가장 많아요</td></tr>

<h2>포화지방을 바꾸면 무엇이 좋아질까</h2>
<p>여러 무작위 연구를 모은 분석에서 포화지방을 <strong>다가불포화지방(식물성 기름)</strong>으로 바꾸면 심혈관 질환이 약 30% 줄었어요. 미국심장협회는 이를 근거로 버터, 라드, 코코넛유 대신 식물성 기름을 쓰도록 권해요. 반대로 포화지방을 정제 탄수화물(흰 빵, 설탕)로 바꾸면 이런 효과가 없었어요. 무엇으로 바꾸느냐가 중요해요.</p>

<h2>코코넛유와 버터</h2>
<ul>
<li><strong>코코넛유:</strong> 중쇄지방산이 있어 '살 빠지는 기름'으로 광고되기도 했지만, 실제 연구에서 코코넛유는 버터처럼 <strong>LDL 콜레스테롤을 올렸어요.</strong> 다른 식물성 기름보다 나은 점이 확인되지 않았어요.</li>
<li><strong>버터:</strong> 풍미를 위해 조금 쓰는 것은 괜찮지만, 매일 요리 기름으로 쓰면 포화지방이 많아져요.</li>
<li><strong>팜유:</strong> 가공식품, 라면, 과자에 많이 쓰여요. 포화지방이 약 50%예요.</li>
</ul>

<h2>오메가6는 해로울까</h2>
<p>콩기름, 옥수수유의 오메가6(리놀레산)가 염증을 일으킨다는 주장이 있지만, 사람을 대상으로 한 연구에서 리놀레산 섭취가 염증 지표를 높이지 않았고, 오히려 심혈관 질환 위험이 낮은 것과 관련됐어요. 오메가6를 줄이기보다 <strong>오메가3(생선, 들기름, 호두)를 늘리는</strong> 쪽이 권장돼요.</p>

<h2>요리에 맞는 기름</h2>
<div class="tbl"><table>
<thead><tr><th>요리</th><th>잘 맞는 기름</th><th>요령</th></tr></thead>
<tbody>
<tr><td>나물 무침, 샐러드</td><td>들기름, 참기름, 엑스트라버진 올리브유</td><td>가열하지 않아 향과 영양이 살아 있어요</td></tr>
<tr><td>볶음, 부침</td><td>카놀라유, 올리브유(엑스트라버진 포함), 콩기름</td><td>연기가 날 만큼 달구지 않아요</td></tr>
<tr><td>튀김</td><td>카놀라유, 콩기름, 해바라기유 등 정제유</td><td>기름을 여러 번 재사용하지 않아요</td></tr>
<tr><td>굽기(오븐, 에어프라이어)</td><td>카놀라유, 올리브유 약간</td><td>붓이나 스프레이로 얇게 발라요</td></tr>
</tbody></table></div>
<p>엑스트라버진 올리브유는 튀김에는 비싸고 향이 강하지만, 가정의 볶음 요리 온도에서는 충분히 쓸 수 있어요.</p>

<h2>들기름은 냉장 보관</h2>
<div class="box warn"><span class="h">산패를 막으려면</span>
<ul>
<li>들기름은 오메가3가 많아 <strong>공기, 빛, 열에 닿으면 빨리 산패</strong>해요. 산패한 기름은 쩐내가 나고 해로운 산화물이 생겨요.</li>
<li>개봉한 들기름은 <strong>냉장 보관</strong>하고, 1~2달 안에 써요. 작은 병으로 사는 게 좋아요.</li>
<li>센 불 볶음이나 튀김에는 쓰지 않아요.</li>
<li>다른 기름도 가스레인지 옆처럼 뜨거운 곳을 피해 서늘하고 어두운 곳에 뚜껑을 닫아 둬요.</li>
</ul></div>

<h2>튀김 기름 재사용</h2>
<ul>
<li>튀김 기름은 쓸수록 산화되고 해로운 물질이 늘어요.</li>
<li>재사용한다면 찌꺼기를 걸러 밀봉해 서늘한 곳에 두고, 한두 번 정도로 줄여요.</li>
<li>색이 진해지고, 거품이 잘 꺼지지 않고, 연기가 쉽게 나고, 냄새가 나면 버려요.</li>
<li>다 쓴 기름은 하수구에 버리지 않아요. 굳히거나 흡수시켜 일반쓰레기로, 또는 폐식용유 수거함에 버려요.</li>
</ul>

<div class="box"><span class="h">식용유 체크리스트</span>
<ol>
<li>버터·라드·코코넛유 대신 식물성 기름</li>
<li>무침은 들기름·참기름, 볶음은 카놀라·올리브유</li>
<li>들기름은 작은 병, 냉장 보관</li>
<li>연기 날 만큼 달구지 않기</li>
<li>튀김 기름은 재사용 줄이기</li>
<li>기름도 한 큰술 약 120kcal, 적게 쓰기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>기름을 아예 안 쓰는 게 가장 좋나요?</dt>
<dd>지방은 지용성 비타민 흡수와 필수지방산 공급에 필요해요. 나물에 들기름을 조금 두르면 비타민 A·E·K 흡수도 좋아져요. 양을 조절하면서 좋은 기름을 쓰는 게 좋아요.</dd>
<dt>올리브유는 가열하면 해로워지나요?</dt>
<dd>엑스트라버진 올리브유는 산화에 비교적 강해 가정의 볶음 요리에는 충분히 쓸 수 있어요. 연기가 날 만큼 오래 달구는 것만 피하면 돼요.</dd>
<dt>마가린은 어떤가요?</dt>
<dd>예전 마가린은 트랜스지방이 많았지만, 지금은 트랜스지방을 크게 줄인 제품이 대부분이에요. 영양성분표에서 트랜스지방과 포화지방을 확인해요.</dd>
</dl>
