<p class="lead">냉장고 속 요구르트의 날짜가 이틀 지났다면 버려야 할까요? 2023년부터 식품에는 '팔 수 있는 기한'이 아니라 '먹어도 되는 기한'이 적히기 시작했어요. 그 차이를 알면 버리는 음식도, 배탈도 함께 줄일 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>소비기한</strong>은 표시된 보관 조건을 지켰을 때 먹어도 안전한 기한이에요.</li>
<li><strong>유통기한</strong>은 판매할 수 있는 기한이라서 보통 소비기한보다 짧아요.</li>
<li>기한은 <strong>뜯지 않고 제대로 보관했을 때</strong>만 의미가 있어요. 개봉하면 훨씬 짧아져요.</li>
<li>날짜 안이라도 냄새, 맛, 부풀어 오름이 이상하면 먹지 않아요.</li>
</ul></div>

<h2>날짜 표시의 종류</h2>
<div class="tbl"><table>
<thead><tr><th>표시</th><th>뜻</th></tr></thead>
<tbody>
<tr><td><strong>소비기한</strong></td><td>표시된 보관 방법을 지켰을 때 먹어도 건강에 문제가 없는 기한. 2023년 1월부터 기본 표시가 됐어요</td></tr>
<tr><td><strong>유통기한</strong></td><td>제조일부터 소비자에게 판매할 수 있는 기한. 품질이 변하기 시작하는 시점보다 여유를 두고 정해요</td></tr>
<tr><td><strong>품질유지기한</strong></td><td>장류, 잼, 커피, 차, 통조림처럼 오래 보관할 수 있는 식품에 쓰여요. 이 기한까지 맛과 품질이 유지된다는 뜻이에요</td></tr>
<tr><td><strong>제조일자</strong></td><td>만든 날. 도시락처럼 기한이 아주 짧거나 설탕·소금처럼 기한 표시를 생략하는 식품에 함께 쓰여요</td></tr>
</tbody>
<caption>식품의약품안전처, 소비기한 표시제 안내를 바탕으로 정리</caption></table></div>
<p>냉장 보관이 필요한 우유류는 위생 관리와 냉장 유통 환경을 고려해 소비기한 적용이 늦춰져, 한동안 유통기한 표시가 함께 쓰여요.</p>

<h2>소비기한은 어떻게 정해질까</h2>
<p>제조사는 제품을 보관 조건에 맞게 두고 미생물, 맛, 냄새, 성분이 언제부터 변하는지 실험해요. 이렇게 찾은 '품질이 유지되는 기간'에 안전 여유를 두고 소비기한을 정해요. 유통기한은 여기서 판매 여유를 한 번 더 빼서 정하기 때문에 더 짧았어요.</p>
<p>그래서 소비기한이 표시된 제품은 <strong>그 날짜까지 먹는 것</strong>을 전제로 해요. 유통기한 시절처럼 "날짜 지나도 며칠은 괜찮다"는 여유가 남아 있지 않다고 생각하는 게 안전해요.</p>

<h2>보관 조건이 전부예요</h2>
<p>소비기한은 포장에 적힌 온도를 지켰을 때의 이야기예요. 장 본 뒤 차 안에 몇 시간 두었거나 냉장고 문이 자주 열려 온도가 올라갔다면, 날짜가 남아 있어도 이미 상했을 수 있어요.</p>
<ul>
<li>냉장 식품은 <strong>0~10°C</strong>, 가능하면 5°C 이하로 보관해요.</li>
<li>냉동 식품은 <strong>-18°C 이하</strong>로 보관해요.</li>
<li>장을 볼 때 냉장·냉동 식품은 마지막에 담고, 집에 오면 가장 먼저 넣어요.</li>
<li>여름에는 장바구니에 보냉백을 챙겨요.</li>
</ul>

<h2>개봉하면 기한이 달라져요</h2>
<p>포장을 뜯는 순간 공기와 손, 숟가락을 통해 미생물이 들어가요. 포장에 적힌 기한은 <strong>개봉하지 않은 상태</strong> 기준이에요.</p>
<div class="tbl"><table>
<thead><tr><th>식품</th><th>개봉 후 주의할 점</th></tr></thead>
<tbody>
<tr><td>우유, 두유</td><td>냉장 보관하고 가능한 한 2~3일 안에 마셔요. 입을 대고 마시지 않아요</td></tr>
<tr><td>두부</td><td>남은 두부는 깨끗한 물에 잠기게 담아 냉장하고 물을 매일 갈아요. 되도록 빨리 먹어요</td></tr>
<tr><td>햄, 소시지, 어묵</td><td>밀봉해 냉장하고 며칠 안에 먹어요. 겉이 끈적이면 버려요</td></tr>
<tr><td>통조림</td><td>남은 내용물은 캔째 두지 말고 다른 그릇에 옮겨 냉장해요</td></tr>
<tr><td>소스, 드레싱, 잼</td><td>'개봉 후 냉장' 표시를 지켜요. 깨끗한 숟가락만 넣어요</td></tr>
</tbody>
<caption>식품의약품안전처 식품 보관 안내를 바탕으로 정리. 제품마다 표시된 개봉 후 보관법을 먼저 따라요</caption></table></div>

<h2>달걀 껍데기의 숫자</h2>
<p>달걀 껍데기에는 10자리 숫자와 글자가 찍혀 있어요.</p>
<ul>
<li><strong>앞 4자리:</strong> 산란 날짜예요. 예를 들어 '0928'은 9월 28일에 낳았다는 뜻이에요.</li>
<li><strong>가운데 5자리:</strong> 생산 농가 고유번호예요.</li>
<li><strong>마지막 1자리:</strong> 사육 환경이에요. 1은 방사, 2는 평사(축사 안 바닥), 3은 개선된 케이지, 4는 기존 케이지예요.</li>
</ul>
<p>달걀은 냉장 보관하고, 뾰족한 쪽이 아래로 가게 두면 신선도 유지에 도움이 돼요. 금이 간 달걀은 세균이 들어갈 수 있어 날로 먹지 않아요.</p>

<h2>날짜보다 먼저 볼 신호</h2>
<div class="box warn"><span class="h">이럴 때는 날짜와 상관없이 버려요</span>
<ul>
<li>시큼하거나 쿰쿰한 <strong>냄새</strong>가 나요.</li>
<li>곰팡이가 보이거나, 겉이 <strong>끈적이고 실처럼 늘어나요.</strong></li>
<li>통조림이나 팩이 <strong>부풀어 올랐어요.</strong> 가스를 만드는 세균이 자란 신호예요.</li>
<li>색이 변했거나 맛이 이상해요.</li>
</ul>
<p>반대로 겉보기에 멀쩡해도 식중독균은 냄새와 맛을 바꾸지 않는 경우가 많아요. 보관이 잘못됐다면 버리는 쪽이 안전해요.</p></div>

<h2>곰팡이 핀 부분만 떼면 될까</h2>
<p>빵, 과일, 잼처럼 부드럽거나 물기가 많은 식품은 곰팡이 뿌리가 눈에 보이는 것보다 깊이 퍼져 있어 <strong>통째로 버려요.</strong> 딱딱한 치즈나 단단한 채소는 곰팡이 주변을 넉넉히 도려내고 먹을 수 있다는 안내도 있지만, 아이나 어르신, 면역이 약한 사람이 먹는다면 버리는 게 좋아요.</p>

<h2>음식 낭비를 줄이는 습관</h2>
<ul>
<li>냉장고 앞쪽에 기한이 가까운 것을 두어요(먼저 산 것 먼저 쓰기).</li>
<li>장보기 전에 냉장고를 한 번 열어 보고 목록을 적어요.</li>
<li>많이 샀다면 기한 전에 나눠서 냉동해요.</li>
</ul>

<div class="box"><span class="h">냉장고 기한 점검 체크리스트</span>
<ol>
<li>일주일에 한 번 냉장고 앞줄 날짜 확인하기</li>
<li>개봉한 제품에 개봉 날짜 적어 두기</li>
<li>부풀어 오른 팩·캔은 바로 버리기</li>
<li>냉장고 온도 5°C 안팎인지 확인하기</li>
<li>기한 임박 식품은 오늘 요리에 먼저 쓰기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>소비기한이 하루 지난 과자는 먹어도 되나요?</dt>
<dd>과자처럼 수분이 적은 식품은 날짜가 조금 지나도 맛이 떨어지는 정도인 경우가 많지만, 소비기한은 안전을 기준으로 정한 날짜예요. 지난 것은 먹지 않는 것을 원칙으로 하고, 특히 냉장 식품은 지나면 버려요.</dd>
<dt>냉동하면 소비기한이 늘어나나요?</dt>
<dd>냉장 식품을 소비기한 안에 얼리면 세균 증식이 멈춰 더 오래 둘 수 있어요. 다만 이미 늘어난 세균이 죽지는 않으니 신선할 때 얼리고, 녹인 뒤에는 바로 먹어요.</dd>
<dt>기한이 지난 식품을 팔면 안 되나요?</dt>
<dd>소비기한이 지난 식품은 판매하거나 조리에 쓰면 안 돼요. 매장에서 발견하면 직원에게 알리거나 식품 안전 신고 전화(1399)로 신고할 수 있어요.</dd>
</dl>
