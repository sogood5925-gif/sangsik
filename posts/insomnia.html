  data-title="불면증: 잠이 안 올 때 침대에서 나오기, 수면제보다 먼저 권하는 인지행동치료, 잠을 줄여서 잠을 늘리는 법"
  data-thumb="20분|잠 안 오면 일어나기"
  data-summary="잠들기 어렵거나 자다 깨서 다시 잠들지 못하는 날이 몇 달째 이어진다면 불면증일 수 있어요. 불면증을 오래가게 만드는 악순환, 수면 일지 쓰는 법, 1차 치료로 권하는 불면증 인지행동치료의 핵심인 자극 조절과 수면 제한, 수면제를 쓸 때 알아 둘 점, 다른 원인을 확인해야 할 경우를 정리했어요."
  data-tags="불면증,수면,인지행동치료,수면제,질병">
<p class="lead">자려고 누우면 오히려 정신이 또렷해지고, 시계를 볼 때마다 '내일 어떡하지' 하는 걱정이 커져요. 가끔 잠 못 드는 밤은 누구에게나 있지만, 이런 밤이 일주일에 여러 번, 몇 달씩 이어지면 불면증이에요. 불면증은 의지가 약해서 생기는 게 아니라, 몸과 머리가 '침대=깨어 있는 곳'으로 잘못 배운 결과인 경우가 많아요. 그래서 다시 배울 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>잠들기·유지 문제가 <strong>주 3회 이상, 3개월 이상</strong> 이어지고 낮 생활에 지장을 주면 만성 불면증이에요.</li>
<li>국내외 지침은 <strong>불면증 인지행동치료</strong>를 수면제보다 먼저 권해요.</li>
<li>잠이 안 오면 <strong>20분쯤 뒤 침대에서 나와</strong> 졸릴 때 다시 누워요.</li>
<li>수면제는 <strong>짧게, 필요한 만큼</strong> 의사와 계획을 세워 써요.</li>
</ul></div>

<h2>불면증이 오래가는 이유</h2>
<p>처음에는 스트레스, 이사, 아픈 일처럼 뚜렷한 계기로 잠을 설쳐요. 그런데 계기가 사라진 뒤에도 불면이 이어지는 것은 그사이 생긴 습관과 걱정 때문이에요.</p>
<ul>
<li>잠을 보충하려고 <strong>일찍 눕고 늦게 일어나요.</strong> 침대에서 깨어 있는 시간이 늘어요.</li>
<li>낮잠을 길게 자서 밤에 졸리지 않아요.</li>
<li>'오늘도 못 자면 어쩌지' 하는 걱정이 몸을 긴장시켜요.</li>
<li>침대에서 휴대폰을 보고 뒤척이며 <strong>침대가 깨어 있는 곳</strong>이 돼요.</li>
</ul>

<h2>수면 일지 쓰기</h2>
<p>1~2주 동안 아래를 적어 보면 내 잠의 모습이 보여요. 진료 때도 큰 도움이 돼요.</p>
<div class="tbl"><table>
<thead><tr><th>기록할 것</th><th>예</th></tr></thead>
<tbody>
<tr><td>누운 시각, 잠든 것 같은 시각</td><td>23:00 누움, 00:30쯤 잠듦</td></tr>
<tr><td>밤에 깬 횟수와 시간</td><td>3시에 깨서 40분</td></tr>
<tr><td>일어난 시각, 침대에서 나온 시각</td><td>6:30 깸, 7:30 나옴</td></tr>
<tr><td>낮잠, 카페인, 술, 운동</td><td>낮잠 1시간, 커피 3잔</td></tr>
<tr><td>아침 개운함(0~10)</td><td>3</td></tr>
</tbody>
<caption>미국수면의학회(AASM) 수면 일지 양식을 바탕으로 정리</caption></table></div>

<h2>불면증 인지행동치료의 핵심</h2>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>하는 법</th></tr></thead>
<tbody>
<tr><td>자극 조절</td><td>졸릴 때만 눕기. <strong>20분쯤 잠이 안 오면 침대에서 나와</strong> 어두운 조명에서 조용한 일을 하다 졸리면 다시 눕기. 침대에서는 잠과 부부 관계만</td></tr>
<tr><td>수면 제한</td><td>수면 일지의 실제 수면 시간만큼만 침대에 있기(최소 5~6시간). 잠이 효율적으로 바뀌면 15~30분씩 늘려요</td></tr>
<tr><td>일정한 기상 시각</td><td>전날 몇 시에 잤든 <strong>매일 같은 시각에 일어나기</strong>. 주말도 1시간 안쪽으로</td></tr>
<tr><td>생각 다루기</td><td>'8시간 못 자면 큰일 난다' 같은 생각을 점검하고 걱정 시간을 낮에 따로 정해요</td></tr>
<tr><td>이완</td><td>복식 호흡, 근육 이완, 명상</td></tr>
</tbody>
<caption>대한수면학회, 미국수면의학회(AASM) 만성 불면증 행동치료 지침(2021), 미국내과학회(ACP) 권고를 바탕으로 정리</caption></table></div>
<p>수면 제한은 처음 1~2주 동안 낮에 더 졸릴 수 있어요. 졸음운전 위험이 있으니 이 기간에는 운전을 조심하고, 조울증이나 뇌전증이 있다면 전문가와 함께해요. 수면 클리닉이나 정신건강의학과에서 인지행동치료를 받을 수 있어요.</p>

<h2>수면제를 쓸 때</h2>
<ul>
<li>졸피뎀 같은 수면제, 벤조디아제핀 계열은 <strong>짧은 기간</strong> 도움이 될 수 있지만, 오래 쓰면 내성과 의존, 낮 졸림, 어르신의 낙상·기억력 문제가 생길 수 있어요.</li>
<li>드물게 자는 동안 걷거나 먹는 등 <strong>기억나지 않는 행동</strong>을 할 수 있어요. 이런 일이 있으면 바로 의사에게 알려요.</li>
<li>술과 함께 먹지 않아요.</li>
<li>오래 먹던 수면제는 <strong>갑자기 끊지 말고</strong> 의사와 천천히 줄여요.</li>
<li>잠을 돕는 일반의약품(졸음을 부르는 항히스타민제)은 다음 날 졸림, 어르신의 혼동·소변 장애를 일으킬 수 있어 자주 먹지 않아요.</li>
</ul>

<h2>다른 원인이 숨어 있을 때</h2>
<ul>
<li><strong>코골이와 숨 멈춤</strong>: 수면무호흡증</li>
<li><strong>다리가 근질거려 가만히 있기 힘듦</strong>: 하지불안 증후군(철 결핍 확인)</li>
<li><strong>우울, 불안</strong>: 새벽에 일찍 깨고 다시 못 자요.</li>
<li>통증, 잦은 소변, 역류, 갑상선 질환, 폐경기 열감</li>
<li>약(일부 항우울제, 스테로이드, 기관지 확장제), 카페인, 술</li>
</ul>

<div class="box warn"><span class="h">이럴 때는 도움을 청하세요</span>
<ul>
<li>잠을 못 자 <strong>운전 중 졸거나</strong> 사고가 날 뻔했어요.</li>
<li>기분이 가라앉고 <strong>살고 싶지 않다는 생각</strong>이 들어요. 자살예방 상담전화 <strong>109</strong>에서 24시간 이야기를 나눌 수 있어요.</li>
<li>자다가 숨이 막혀 깨거나 가족이 숨이 멈춘다고 해요.</li>
</ul></div>

<div class="box"><span class="h">불면증 체크리스트</span>
<ol>
<li>매일 같은 시각에 일어나기</li>
<li>졸릴 때만 눕기</li>
<li>20분 넘게 깨어 있으면 침대 밖으로</li>
<li>낮잠은 20~30분, 오후 3시 전</li>
<li>오후 카페인·저녁 술 피하기</li>
<li>2주 수면 일지 쓰고 진료 상의</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>술을 한잔하면 잠이 잘 오던데요?</dt>
<dd>잠드는 데는 도움이 될 수 있지만, 밤 후반에 자주 깨고 깊은 잠이 줄어요. 수면을 위해 술을 마시는 습관은 불면을 오히려 키워요.</dd>
<dt>멜라토닌을 먹으면 되나요?</dt>
<dd>우리나라에서 멜라토닌은 전문의약품으로 주로 55세 이상 불면증에 처방돼요. 시차 적응이나 수면 시각 조절에는 도움이 되지만, 만성 불면증에 대한 효과는 크지 않아요.</dd>
<dt>누워서 눈만 감고 있어도 쉬는 거 아닌가요?</dt>
<dd>잠깐은 괜찮지만, 오래 누워 뒤척이면 침대와 '잠 못 드는 긴장'이 연결돼요. 잠이 안 오면 일어났다가 졸릴 때 돌아오는 편이 결국 더 잘 자게 해요.</dd>
</dl>
