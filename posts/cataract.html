  data-thumb="15~30분|수술 시간"
  data-summary="백내장은 나이가 들면 누구에게나 조금씩 생기는 수정체의 혼탁이에요. 눈이 뿌옇고 밤에 불빛이 번지는 증상, 수술을 결정하는 기준, 단초점·다초점·난시 교정 인공수정체의 차이, 수술 전후 주의사항과 후발백내장까지 정리했어요."
  data-tags="백내장,인공수정체,눈건강,노안,질병">
<p class="lead">안경을 바꿔도 앞이 뿌옇고, 밤 운전 때 맞은편 전조등이 별처럼 번진다면 백내장일 수 있어요. 백내장은 안약으로 되돌릴 수 없지만, 수술로 흐려진 수정체를 인공수정체로 바꾸면 대부분 시력이 좋아져요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>백내장은 눈 속 렌즈인 <strong>수정체가 뿌옇게 흐려지는</strong> 병이에요. 나이가 가장 큰 원인이에요.</li>
<li>수술 시기는 나이나 검사 수치보다 <strong>일상생활의 불편</strong>을 기준으로 정해요.</li>
<li>인공수정체는 <strong>단초점, 다초점, 난시 교정용</strong> 등이 있고, 생활 방식에 맞게 골라요.</li>
<li>안약이나 영양제로 백내장이 낫지는 않아요.</li>
</ul></div>

<h2>백내장은 왜 생길까</h2>
<p>수정체는 카메라 렌즈처럼 빛을 모아 망막에 상을 맺게 하는 투명한 조직이에요. 나이가 들면서 수정체 단백질이 변해 점점 뿌옇고 누렇게 흐려져요. 60대 이상에서 흔하고, 80대가 되면 대부분에게 어느 정도의 백내장이 있어요.</p>
<ul>
<li><strong>위험 요인:</strong> 나이, 당뇨, 흡연, 오랜 자외선 노출, 스테로이드 약 장기 사용, 눈 외상, 이전의 눈 수술</li>
<li>드물게 태어날 때부터 있는 선천 백내장도 있어요.</li>
</ul>

<h2>이런 증상이 있어요</h2>
<div class="tbl"><table>
<thead><tr><th>증상</th><th>설명</th></tr></thead>
<tbody>
<tr><td>흐리고 뿌옇게 보임</td><td>안경을 바꿔도 선명해지지 않아요</td></tr>
<tr><td>눈부심, 빛 번짐</td><td>밤 운전 때 전조등, 가로등 불빛이 번져 보여요</td></tr>
<tr><td>색이 바래 보임</td><td>색이 누렇거나 칙칙하게 보여요. 수술 뒤 "세상이 하얘졌다"고 느끼는 경우가 많아요</td></tr>
<tr><td>도수 변화</td><td>근시가 심해져 안경을 자주 바꾸거나, 갑자기 가까운 글씨가 잘 보이기도 해요</td></tr>
<tr><td>한쪽 눈 겹쳐 보임</td><td>한 눈만 가려도 물체가 두 개로 보여요</td></tr>
</tbody></table></div>
<p>통증이나 충혈은 없어요. 갑자기 시력이 떨어지거나 눈이 아프다면 다른 병일 수 있어 바로 안과에 가요.</p>

<h2>수술은 언제 할까</h2>
<p>예전에는 백내장이 충분히 '익어야' 수술한다고 했지만, 지금은 그렇지 않아요. 다음과 같을 때 수술을 고려해요.</p>
<ul>
<li>책 읽기, 운전, TV 보기, 요리처럼 <strong>일상생활이 불편</strong>해요.</li>
<li>밤 운전이 무서워졌거나, 넘어질 위험이 커졌어요.</li>
<li>운전면허 시력 기준에 미치지 못해요.</li>
<li>백내장 때문에 녹내장 등 다른 눈 질환의 위험이 커졌어요.</li>
</ul>
<p>불편하지 않다면 서두를 필요는 없어요. 다만 너무 오래 두면 수정체가 딱딱해져 수술이 조금 어려워질 수 있어요. 정기적으로 검진받으며 시기를 정해요.</p>

<h2>수술은 어떻게 할까</h2>
<ul>
<li>눈에 작은 절개를 내고, 초음파로 흐려진 수정체를 잘게 부숴 빼낸 뒤 <strong>인공수정체</strong>를 넣어요.</li>
<li>보통 점안 마취로 하고, 시간은 한 눈에 <strong>15~30분</strong> 정도예요. 대부분 당일 퇴원해요.</li>
<li>두 눈 모두 필요하면 보통 며칠~몇 주 간격을 두고 한 눈씩 해요.</li>
</ul>

<h2>인공수정체 고르기</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>특징</th><th>잘 맞는 사람</th></tr></thead>
<tbody>
<tr><td>단초점</td><td>먼 곳이나 가까운 곳 중 한 거리에 초점을 맞춰요. 선명도가 좋고 빛 번짐이 적어요. 다른 거리는 안경이 필요해요</td><td>안경 쓰는 게 불편하지 않은 사람, 밤 운전이 많은 사람</td></tr>
<tr><td>다초점·연속초점</td><td>먼 곳과 가까운 곳(또는 중간 거리)을 함께 보도록 설계됐어요. 안경 의존이 줄지만 빛 번짐과 대비 감소가 있을 수 있어요</td><td>안경 없이 지내고 싶고, 적응 기간을 감수할 수 있는 사람</td></tr>
<tr><td>난시 교정(토릭)</td><td>각막 난시를 함께 교정해요</td><td>난시가 큰 사람</td></tr>
</tbody>
<caption>대한안과학회 백내장 건강 정보를 바탕으로 정리. 다초점 렌즈는 녹내장, 황반 질환이 있으면 맞지 않을 수 있어요</caption></table></div>
<p>다초점 인공수정체는 건강보험이 적용되지 않는 부분이 있어 비용 차이가 커요. 비용과 기대 효과, 부작용을 충분히 설명 듣고, 필요하면 다른 병원의 의견도 들어 보세요.</p>

<h2>수술 전후 주의사항</h2>
<ul>
<li>먹는 약(특히 혈액 응고를 막는 약, 전립선 약 탐스로신 등)은 수술 전에 알려요.</li>
<li>수술 뒤 처방된 안약을 시간 맞춰 넣어요.</li>
<li>한동안 <strong>눈을 비비거나 누르지 않고</strong>, 잘 때 보호안대를 해요.</li>
<li>세수, 머리 감기, 수영, 사우나는 의사가 허락한 시기부터 해요.</li>
<li>무거운 물건 들기와 고개를 오래 숙이는 자세를 잠시 피해요.</li>
</ul>
<div class="box warn"><span class="h">수술 뒤 바로 연락해야 하는 신호</span>
<ul>
<li>눈의 <strong>통증이 점점 심해지고</strong> 충혈이 늘어요.</li>
<li>시력이 갑자기 떨어져요.</li>
<li>눈앞에 커튼이 쳐진 듯 가려지거나, 날파리와 번쩍임이 갑자기 늘어요(망막박리 가능성).</li>
</ul>
<p>수술 뒤 감염(안내염)은 드물지만 시력을 크게 잃을 수 있어 빨리 치료해야 해요.</p></div>

<h2>후발백내장</h2>
<p>수술하고 몇 달~몇 년 뒤, 인공수정체를 감싸는 뒤쪽 막이 다시 뿌옇게 흐려질 수 있어요. 이를 후발백내장이라고 해요. 백내장이 재발한 것이 아니고, 외래에서 <strong>레이저로 몇 분 만에</strong> 막을 열어 주면 다시 선명해져요.</p>

<div class="box"><span class="h">백내장 체크리스트</span>
<ol>
<li>안경을 바꿔도 뿌옇다면 안과 검진</li>
<li>밤 운전 빛 번짐, 눈부심 기록해 두기</li>
<li>수술은 생활 불편 기준으로 결정</li>
<li>인공수정체 종류·비용 충분히 상담</li>
<li>수술 뒤 안약·보호안대·눈 비비지 않기</li>
<li>외출 시 선글라스와 모자로 자외선 차단</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>백내장 안약으로 수술을 미룰 수 있나요?</dt>
<dd>흐려진 수정체를 맑게 되돌리는 안약은 아직 효과가 확인되지 않았어요. 진행을 늦춘다는 제품도 근거가 약해요. 불편하다면 수술이 확실한 치료예요.</dd>
<dt>수술하면 노안도 사라지나요?</dt>
<dd>단초점 렌즈는 한 거리에만 초점이 맞아 먼 곳을 맞췄다면 가까운 곳은 돋보기가 필요해요. 다초점 렌즈는 안경 의존을 줄여 주지만 모든 거리가 완벽하지는 않아요.</dd>
<dt>당뇨가 있어도 수술할 수 있나요?</dt>
<dd>할 수 있어요. 다만 혈당을 조절하고, 수술 전 당뇨망막병증과 황반부종이 있는지 확인해요. 수술 뒤에도 망막 검진을 계속 받아요.</dd>
</dl>
