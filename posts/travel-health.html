  data-thumb="4~6주|출국 전 준비"
  data-summary="여행의 즐거움은 건강에서 시작돼요. 출국 4~6주 전에 확인할 예방접종과 말라리아 예방, 챙겨야 할 상비약 목록과 약 반입 규정, 오랜 비행의 혈전과 귀 통증, 시차 적응, 물갈이 설사 예방, 모기 매개 감염병, 귀국 후 열이 날 때 알릴 것을 정리했어요."
  data-tags="해외여행,여행자건강,상비약,시차,예방접종">
<p class="lead">여행지에서 아프면 말도 통하지 않고 병원 찾기도 어려워요. 떠나기 몇 주 전의 준비가 여행 전체를 지켜줘요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>출국 <strong>4~6주 전</strong>에 여행지의 감염병 정보와 필요한 <strong>예방접종·말라리아 예방약</strong>을 확인해요.</li>
<li>평소 먹는 약은 <strong>넉넉히</strong>, 약 이름이 적힌 원래 포장이나 처방전과 함께 챙겨요.</li>
<li>물갈이 설사는 <strong>익힌 음식, 뚜껑이 닫힌 생수, 손 씻기</strong>로 줄여요.</li>
<li>귀국 후 열이 나면 진료 때 <strong>여행한 나라</strong>를 꼭 알려요.</li>
</ul></div>

<h2>출국 4~6주 전</h2>
<h3>여행지 감염병 확인</h3>
<p>질병관리청의 <strong>해외감염병 정보</strong> 누리집에서 나라별 감염병 유행 상황과 권장 예방접종을 확인할 수 있어요. 외교부 해외안전여행 정보도 함께 확인해요.</p>
<div class="tbl"><table>
<thead><tr><th>예방접종·예방약</th><th>필요할 수 있는 여행지·상황</th></tr></thead>
<tbody>
<tr><td>A형간염</td><td>개발도상국 여행. 20~40대는 항체가 없는 경우가 많아요</td></tr>
<tr><td>장티푸스</td><td>남아시아, 동남아시아, 아프리카 등 위생이 취약한 지역</td></tr>
<tr><td>황열</td><td>아프리카·남미 일부 국가. 입국 시 접종 증명서를 요구하는 나라가 있어요. 지정된 국제공인 예방접종 기관에서 맞아요</td></tr>
<tr><td>말라리아 예방약</td><td>말라리아 위험 지역. 지역에 따라 약이 달라서 여행 전 진료를 받아요</td></tr>
<tr><td>광견병</td><td>동물과 접촉이 많거나 의료 접근이 어려운 오지 장기 체류</td></tr>
<tr><td>일본뇌염, 수막구균 등</td><td>지역과 기간, 활동에 따라</td></tr>
<tr><td>기본 접종 점검</td><td>독감, 파상풍, 홍역(MMR) 등 성인 기본 접종이 최신인지 확인</td></tr>
</tbody>
<caption>질병관리청 해외여행 감염병 예방 안내를 바탕으로 정리</caption></table></div>
<p>일부 백신은 여러 번 맞아야 하거나 효과가 생기는 데 시간이 걸려서, <strong>미리</strong> 준비해야 해요.</p>
<h3>그 밖의 준비</h3>
<ul>
<li><strong>여행자 보험</strong>에 가입하고 해외 의료비 보장 범위를 확인해요.</li>
<li>만성질환이 있다면 여행 전 진료를 받아 약을 넉넉히 처방받고, 영문 소견서를 준비하면 좋아요.</li>
<li>임신 중이라면 여행지의 감염병(특히 지카바이러스 유행 지역)과 항공사 규정을 확인해요.</li>
</ul>

<h2>상비약 목록</h2>
<div class="tbl"><table>
<thead><tr><th>분류</th><th>챙길 것</th></tr></thead>
<tbody>
<tr><td>평소 먹는 약</td><td>여행 일수보다 며칠 더 넉넉히, 기내 가방에 나눠 넣기</td></tr>
<tr><td>해열진통제</td><td>아세트아미노펜 또는 이부프로펜</td></tr>
<tr><td>소화기</td><td>지사제, <strong>경구 수액제(전해질 보충제)</strong>, 소화제, 변비약</td></tr>
<tr><td>알레르기·피부</td><td>항히스타민제, 가려움 연고</td></tr>
<tr><td>멀미</td><td>멀미약 (졸음이 올 수 있어요)</td></tr>
<tr><td>상처</td><td>밴드, 소독용품, 연고, 물집 패치</td></tr>
<tr><td>모기·햇볕</td><td>모기 기피제(디에틸톨루아미드·이카리딘 성분), 자외선 차단제</td></tr>
<tr><td>기타</td><td>체온계, 손소독제, 마스크, 콘택트렌즈 용품</td></tr>
</tbody></table></div>
<div class="box warn"><span class="h">약 반입 규정을 확인하세요</span>
<p>나라마다 반입을 제한하는 성분이 있어요. 일부 감기약 성분, 수면제·신경안정제 같은 향정신성 의약품, 마약성 진통제는 허가서나 처방전이 필요하거나 반입이 금지된 나라도 있어요. 방문국 대사관이나 관세청 안내를 미리 확인하고, 약은 <strong>원래 포장</strong>에 담아 가요.</p></div>

<h2>비행기 안에서</h2>
<h3>혈전 예방</h3>
<p>4시간 이상 좁은 좌석에 앉아 있으면 다리 정맥에 혈전이 생길 수 있어요(여행자 혈전증).</p>
<ul>
<li>1~2시간마다 통로를 걸어요.</li>
<li>앉아서 <strong>발목을 위아래로 까딱이는</strong> 운동을 자주 해요.</li>
<li>물을 충분히 마시고, 술은 줄여요.</li>
<li>혈전 병력, 최근 수술, 임신, 경구 피임약 복용 등 위험 요인이 있다면 의사와 상의해 압박 스타킹 등을 준비해요.</li>
<li>여행 후 한쪽 다리가 붓고 아프거나, 갑자기 숨이 차고 가슴이 아프면 바로 진료를 받아요.</li>
</ul>
<h3>귀 통증</h3>
<p>이착륙 때 기압이 변해 귀가 먹먹하고 아플 수 있어요. 침을 삼키거나, 하품하거나, 껌을 씹어요. 코를 막고 입을 다문 채 살짝 숨을 내쉬는 방법도 있어요. 아기는 이착륙 때 젖이나 젖병을 물리면 도움이 돼요. 심한 코감기가 있다면 비행 전 의사와 상의해요.</p>

<h2>시차 적응</h2>
<ul>
<li>출발 며칠 전부터 도착지 시간에 맞춰 잠자는 시간을 조금씩 옮겨요.</li>
<li>도착하면 <strong>현지 시간</strong>에 맞춰 먹고 자요. 낮잠은 짧게.</li>
<li><strong>햇빛</strong>이 생체 시계를 가장 강하게 맞춰줘요. 도착 첫날 낮 시간을 밖에서 보내요.</li>
<li>동쪽으로 가는 여행(예: 미국에서 한국)이 더 적응하기 어려워요.</li>
<li>멜라토닌은 국내에서 전문의약품이라 필요하다면 여행 전 진료를 받아요.</li>
</ul>

<h2>물갈이 설사 예방</h2>
<p>여행자 설사는 대부분 오염된 음식과 물 속 세균 때문이에요.</p>
<ul>
<li><strong>"끓이거나, 익히거나, 껍질을 벗기거나, 아니면 먹지 말라"</strong>는 원칙이 기본이에요.</li>
<li><strong>뚜껑이 봉인된 생수</strong>를 마시고, 양치할 때도 생수를 쓰는 게 안전한 지역이 있어요.</li>
<li>음료의 <strong>얼음</strong>, 길거리 생과일주스, 날것이나 덜 익힌 해산물을 조심해요.</li>
<li>식사 전 손을 씻거나 손소독제를 써요.</li>
</ul>
<p>설사를 하면 <strong>경구 수액제</strong>로 수분과 전해질을 보충하는 게 가장 중요해요. <strong>피가 섞인 설사, 고열, 심한 복통, 탈수</strong>가 있다면 현지 병원을 찾아요.</p>

<h2>모기와 물을 조심해야 하는 곳</h2>
<ul>
<li><strong>뎅기열, 말라리아, 치쿤구니야, 지카바이러스</strong>는 모기가 옮겨요. 긴 소매 옷, 모기 기피제, 방충망·모기장을 써요.</li>
<li>뎅기열이 의심될 때(고열, 심한 근육통, 발진) 소염진통제는 출혈 위험 때문에 피하고 진료를 받아요.</li>
<li>민물에서 수영하면 기생충 감염 위험이 있는 지역이 있어요.</li>
<li>바다에서는 해파리, 이안류를 조심하고 안전요원이 있는 곳에서 수영해요.</li>
<li>개, 원숭이 같은 동물을 만지지 않아요. 물리거나 긁혔다면 비누와 물로 15분 씻고 바로 진료를 받아요.</li>
</ul>

<h2>귀국 후</h2>
<ul>
<li>입국할 때 발열이나 설사가 있다면 검역소에 알려요.</li>
<li>귀국 후 몇 주~몇 달 안에 <strong>열이 나면</strong> 진료 때 <strong>여행한 나라와 날짜</strong>를 꼭 알려요. 말라리아는 귀국 후 한참 뒤에 나타나기도 해요.</li>
<li>말라리아 예방약은 귀국 후에도 정해진 기간 동안 계속 먹어요.</li>
</ul>

<div class="box"><span class="h">여행 건강 준비 체크리스트</span>
<ol>
<li>해외감염병 정보에서 여행지 확인 (4~6주 전)</li>
<li>필요한 예방접종·말라리아 예방약 진료</li>
<li>여행자 보험 가입</li>
<li>평소 약 넉넉히, 원래 포장·처방전과 함께</li>
<li>상비약 가방 꾸리기, 반입 규정 확인</li>
<li>모기 기피제, 자외선 차단제, 경구 수액제</li>
<li>기내에서 자주 걷고 물 마시기</li>
<li>귀국 후 열이 나면 여행지 알리고 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>동남아 여행인데 예방접종이 꼭 필요한가요?</dt>
<dd>일정, 지역, 활동에 따라 달라요. 도시 위주의 짧은 관광이라면 기본 접종 점검과 A형간염 정도를 확인하고, 시골이나 장기 체류라면 장티푸스 등을 추가로 고려해요. 여행 클리닉이나 감염내과에서 상담하면 정확해요.</dd>
<dt>여행 중 약이 떨어졌어요.</dt>
<dd>현지 약국에서 같은 성분의 약을 구할 수 있는 경우가 많아요. 그래서 약의 <strong>성분명</strong>(상품명이 아니라)을 메모해 가면 도움이 돼요.</dd>
<dt>아이와 여행할 때 더 챙길 것은요?</dt>
<dd>아이 체중에 맞는 해열제 시럽과 계량 도구, 경구 수액제, 아이용 모기 기피제와 자외선 차단제를 챙겨요. 아이는 탈수가 빨리 오니 설사와 구토를 더 주의 깊게 봐요.</dd>
</dl>
