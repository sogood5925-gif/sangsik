  data-title="우유와 유제품: 칼슘의 가장 쉬운 공급원, 유당불내증과 저지방·일반 우유 고르기"
  data-thumb="200mg|우유 1컵 칼슘"
  data-summary="우유, 요구르트, 치즈는 칼슘과 단백질을 쉽게 채우는 식품이에요. 유제품별 칼슘 함량, 우유만 마시면 배가 아픈 유당불내증에서도 유제품을 먹는 요령, 저지방과 일반 우유의 선택, 가당 요구르트의 당류, 아이에게 우유를 너무 많이 먹일 때의 문제, 뼈와 만성질환 연구를 정리했어요."
  data-tags="우유,유제품,칼슘,유당불내증,영양소">
<p class="lead">한국인은 칼슘 섭취가 부족한 대표적인 나라예요. 멸치와 뼈째 먹는 생선, 두부, 채소로도 채울 수 있지만, 가장 쉽게 많은 양을 채우는 방법은 우유와 유제품이에요. 그런데 우유를 마시면 배가 부글거리는 사람도 많지요. 내 몸에 맞게 유제품을 고르는 방법을 알아볼게요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>우유 1컵(200mL)에는 칼슘 약 <strong>200mg</strong>이 들어 있어요. 성인 권장섭취량(700~800mg)의 약 1/4이에요.</li>
<li><strong>유당불내증</strong>이 있어도 조금씩 나눠 마시거나, 요구르트·치즈·유당 제거 우유로 먹을 수 있어요.</li>
<li>포화지방이 걱정되면 <strong>저지방 우유</strong>, 요구르트는 <strong>플레인·무가당</strong>을 골라요.</li>
<li>어린아이에게 우유를 너무 많이 먹이면 <strong>철 결핍 빈혈</strong>이 생길 수 있어요.</li>
</ul></div>

<h2>유제품의 영양</h2>
<ul>
<li><strong>칼슘:</strong> 흡수율이 좋은 편이에요. 뼈와 치아, 근육 수축, 혈액 응고에 필요해요.</li>
<li><strong>단백질:</strong> 우유 1컵에 약 6g. 근육 유지에 좋은 유청 단백질이 들어 있어요.</li>
<li><strong>비타민 B2, B12, 인, 칼륨</strong></li>
<li>비타민 D는 원래 적어요. 비타민 D를 강화한 제품인지 라벨을 확인해요.</li>
</ul>

<h2>칼슘 함량 비교</h2>
<div class="tbl"><table>
<thead><tr><th>식품(1회 분량)</th><th class="num">칼슘(대략)</th></tr></thead>
<tbody>
<tr><td>우유 1컵(200mL)</td><td class="num">약 200mg</td></tr>
<tr><td>플레인 요구르트 1개(100g)</td><td class="num">약 110~150mg</td></tr>
<tr><td>슬라이스 치즈 1장(20g)</td><td class="num">약 120~150mg</td></tr>
<tr><td>칼슘 강화 두유 1팩(190mL)</td><td class="num">약 150~250mg(제품마다 달라요)</td></tr>
<tr><td>잔멸치 볶음 2큰술(15g)</td><td class="num">약 130~200mg</td></tr>
<tr><td>두부 1/3모(100g)</td><td class="num">약 60~130mg(응고제에 따라)</td></tr>
<tr><td>데친 시금치 1접시(70g)</td><td class="num">약 70mg(흡수율은 낮아요)</td></tr>
</tbody>
<caption>농촌진흥청 국가표준식품성분표를 바탕으로 한 대략값. 성인 칼슘 권장섭취량은 700~800mg(성별·나이별, 2020 한국인 영양소 섭취기준)</caption></table></div>

<h2>유당불내증</h2>
<p>우유 속 당인 <strong>유당(락토스)</strong>을 분해하는 효소가 어른이 되면서 줄어드는 사람이 많아요. 한국인을 포함한 동아시아인에게 흔해요. 유당이 소화되지 않고 대장으로 가면 세균이 발효시켜 가스, 복부 팽만, 설사가 생겨요.</p>
<div class="tbl"><table>
<thead><tr><th>요령</th><th>이유</th></tr></thead>
<tbody>
<tr><td>한 번에 반 컵씩 나눠 마셔요</td><td>적은 양의 유당은 대부분 견딜 수 있어요</td></tr>
<tr><td>식사와 함께 마셔요</td><td>위에서 천천히 내려가 증상이 줄어요</td></tr>
<tr><td>요구르트, 치즈를 먹어요</td><td>발효·숙성 과정에서 유당이 많이 줄어요. 숙성 치즈는 유당이 거의 없어요</td></tr>
<tr><td>유당 제거(락토프리) 우유를 마셔요</td><td>유당을 미리 분해해 영양은 그대로예요</td></tr>
<tr><td>조금씩 자주 마셔 보세요</td><td>꾸준히 마시면 장내 세균이 적응해 증상이 줄기도 해요</td></tr>
</tbody></table></div>
<p>우유 알레르기(우유 단백질에 대한 면역 반응)는 유당불내증과 달라요. 두드러기, 입술 부종, 숨참이 생기면 알레르기일 수 있어 진료를 받아요.</p>

<h2>저지방 우유와 일반 우유</h2>
<ul>
<li>일반 우유 1컵에는 포화지방이 약 4~5g 들어 있어요. LDL 콜레스테롤이 높거나 체중 관리 중이면 <strong>저지방·무지방 우유</strong>가 나아요.</li>
<li>최근 연구에서는 유제품의 지방이 다른 포화지방만큼 심혈관 위험을 높이지 않을 수 있다는 결과도 있지만, 아직 결론이 나지 않았어요.</li>
<li>2세 미만 아기는 성장에 필요한 지방을 위해 저지방 우유를 권하지 않아요.</li>
</ul>

<h2>요구르트 고르기</h2>
<ul>
<li>시중의 떠먹는 요구르트, 마시는 요구르트 가운데 <strong>당류가 한 병에 10~20g</strong> 넘는 제품이 많아요.</li>
<li>플레인·무가당 요구르트에 과일이나 견과류를 넣어 먹으면 좋아요.</li>
<li>'유산균 함유'보다 당류와 원재료를 먼저 확인해요.</li>
</ul>

<h2>아이와 우유</h2>
<ul>
<li>돌이 지나면 생우유를 먹일 수 있어요. 돌 전에는 모유나 분유를 먹여요.</li>
<li>1~2세 아이가 우유를 하루 <strong>500mL 넘게</strong> 마시면 밥을 덜 먹고, 우유가 철 흡수를 방해해 <strong>철 결핍 빈혈</strong>이 생길 수 있어요. 하루 2컵 정도로 제한하고, 젖병보다 컵으로 마시게 해요.</li>
<li>살균하지 않은 원유(생유)는 식중독균이 있을 수 있어 아이와 임신부는 마시지 않아요.</li>
</ul>

<h2>건강 연구로 보는 유제품</h2>
<ul>
<li>칼슘과 단백질 섭취는 뼈 건강에 중요하지만, 유제품만으로 골절이 크게 줄어든다는 근거는 엇갈려요. 운동, 비타민 D, 전체 식사가 함께 중요해요.</li>
<li>요구르트 등 유제품 섭취는 제2형 당뇨병 위험이 조금 낮은 것과 관련됐다는 연구가 있어요.</li>
<li>아주 많은 유제품 섭취가 전립선암 위험과 관련 있다는 연구도 있어, 적당량을 권해요.</li>
</ul>

<div class="box"><span class="h">유제품 체크리스트</span>
<ol>
<li>하루 우유 1~2컵 또는 요구르트·치즈로 대체</li>
<li>배가 불편하면 나눠 마시거나 락토프리 우유</li>
<li>요구르트는 플레인·무가당</li>
<li>콜레스테롤 높으면 저지방 우유</li>
<li>유제품이 어렵다면 칼슘 강화 두유·멸치·두부</li>
<li>아이 우유는 하루 500mL 넘지 않게</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>우유를 마시면 여드름이 나나요?</dt>
<dd>일부 연구에서 특히 저지방 우유를 많이 마시는 청소년의 여드름이 조금 더 많았다는 결과가 있어요. 여드름이 심하다면 우유 양을 줄여 보고 변화를 살펴보세요. 칼슘은 다른 음식으로 보충해요.</dd>
<dt>멸균우유는 영양이 적나요?</dt>
<dd>고온 멸균 과정에서 일부 비타민이 조금 줄지만 칼슘과 단백질은 거의 그대로예요. 상온 보관이 가능해 편리해요. 개봉 후에는 냉장 보관해요.</dd>
<dt>우유 대신 칼슘 보충제를 먹어도 되나요?</dt>
<dd>음식으로 채우기 어렵다면 보충제를 쓸 수 있어요. 보충제는 한 번에 500mg 이하로 나눠 먹고, 결석 병력이 있다면 의사와 상의해요.</dd>
</dl>
