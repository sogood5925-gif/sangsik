  data-title="과당과 과일 주스: 과일은 괜찮은데 주스와 액상과당은 다른 이유"
  data-thumb="1잔|주스 적정량"
  data-summary="과일에 든 과당은 괜찮은데 과일 주스와 액상과당은 왜 조심하라고 할까요? 과당이 간에서 처리되는 방식, 통과일과 주스·스무디의 차이, 액상과당과 지방간·통풍·중성지방의 관계, 아이에게 주스를 줄 때의 기준, 과일을 건강하게 먹는 양을 정리했어요."
  data-tags="과당,과일주스,액상과당,지방간,영양소">
<p class="lead">과일은 건강한 음식의 대표인데, 과일 주스는 탄산음료만큼 조심하라는 말을 들으면 헷갈리지요. 차이는 <strong>과당이 어떤 모습으로, 얼마나 빨리, 얼마나 많이</strong> 들어오느냐에 있어요. 통과일의 과당은 식이섬유와 함께 천천히 들어오지만, 주스와 단 음료의 과당은 한꺼번에 몰려와요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>과당은 주로 <strong>간에서 처리</strong>되고, 한꺼번에 많이 들어오면 지방으로 바뀌기 쉬워요.</li>
<li><strong>통과일</strong>은 식이섬유와 수분 덕분에 과당이 천천히 흡수되고 과식하기 어려워요.</li>
<li><strong>과일 주스, 액상과당 음료</strong>를 많이 마시면 지방간, 중성지방 증가, 통풍, 체중 증가와 관련돼요.</li>
<li>주스는 <strong>하루 한 잔(약 150mL) 이하</strong>로, 과일은 <strong>통째로</strong> 먹어요.</li>
</ul></div>

<h2>과당은 어떻게 처리될까</h2>
<p>포도당은 온몸의 세포가 에너지로 쓰고 인슐린이 조절해요. 반면 과당은 대부분 <strong>간</strong>으로 가서 처리돼요. 적은 양은 에너지로 쓰이거나 포도당으로 바뀌지만, 한꺼번에 많은 양이 들어오면 간이 처리하지 못한 과당을 <strong>지방으로 바꿔</strong> 간에 쌓거나 혈액으로 내보내요.</p>
<ul>
<li>간에 지방이 쌓이면 <strong>지방간</strong>이 되고, 인슐린 저항성이 생길 수 있어요.</li>
<li>혈액의 <strong>중성지방</strong>이 올라가요.</li>
<li>과당이 분해될 때 <strong>요산</strong>이 만들어져 통풍 위험이 높아져요.</li>
</ul>

<h2>통과일과 주스의 차이</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>통과일</th><th>과일 주스·스무디</th></tr></thead>
<tbody>
<tr><td>식이섬유</td><td>풍부해요</td><td>주스는 거의 없고, 스무디도 갈면서 구조가 깨져요</td></tr>
<tr><td>흡수 속도</td><td>천천히</td><td>빠르게</td></tr>
<tr><td>포만감</td><td>씹는 동안 배가 불러요</td><td>마셔도 배가 잘 안 불러요</td></tr>
<tr><td>양</td><td>오렌지 한두 개면 충분해요</td><td>주스 한 잔에 오렌지 3~4개가 들어가요</td></tr>
<tr><td>연구 결과</td><td>당뇨·심혈관 위험이 낮은 것과 관련</td><td>많이 마시면 당뇨 위험 증가와 관련</td></tr>
</tbody>
<caption>Muraki I 외, Fruit consumption and risk of type 2 diabetes, BMJ 2013 등을 바탕으로 정리</caption></table></div>
<p>같은 과일이라도 통째로 먹으면 제2형 당뇨병 위험이 낮아졌지만, 주스로 마시면 오히려 위험이 조금 높아졌다는 대규모 연구가 있어요.</p>

<h2>액상과당과 단 음료</h2>
<ul>
<li><strong>액상과당(고과당 옥수수시럽)</strong>은 옥수수 전분에서 만든 포도당·과당 혼합 시럽으로 음료, 과자, 소스에 많이 쓰여요.</li>
<li>설탕도 포도당과 과당이 반씩 이어진 것이라, 설탕과 액상과당의 건강 영향은 비슷하게 봐요. 문제는 <strong>둘 다 많이 먹는 것</strong>이에요.</li>
<li>단 음료 한 캔(250~350mL)에는 당이 25~40g 들어 있어요. 세계보건기구는 첨가당을 하루 총 에너지의 <strong>10% 미만</strong>, 가능하면 5% 미만(약 25g)으로 권해요.</li>
<li>원재료명에서 '과당', '액상과당', '고과당옥수수시럽', '물엿', '올리고당'을 확인해요.</li>
</ul>

<h2>과일은 얼마나 먹을까</h2>
<ul>
<li>한국인을 위한 식생활지침은 과일을 <strong>하루 1~2회</strong> 먹기를 권해요. 1회 분량은 사과 1/2개, 귤 1개, 바나나 1/2개, 포도 15알 정도예요.</li>
<li>당뇨가 있다면 한 번에 1회 분량씩 나눠 먹고, 식후 디저트보다 간식 시간에 먹어요.</li>
<li>말린 과일은 수분이 빠져 당이 농축돼 있어 조금만 먹어요.</li>
<li>과일 통조림은 시럽 대신 과즙이나 물에 담긴 제품을 골라요.</li>
</ul>

<h2>아이와 주스</h2>
<div class="tbl"><table>
<thead><tr><th>나이</th><th>100% 과일 주스 권장량</th></tr></thead>
<tbody>
<tr><td>1세 미만</td><td>주지 않아요</td></tr>
<tr><td>1~3세</td><td>하루 120mL 이하</td></tr>
<tr><td>4~6세</td><td>하루 120~180mL 이하</td></tr>
<tr><td>7세 이상</td><td>하루 240mL 이하</td></tr>
</tbody>
<caption>미국소아과학회(AAP), Fruit Juice in Infants, Children, and Adolescents (2017)</caption></table></div>
<ul>
<li>젖병이나 빨대컵으로 주스를 오래 물고 있으면 충치가 잘 생겨요. 컵으로 식사와 함께 줘요.</li>
<li>주스보다 통과일을 먹이는 습관을 들여요.</li>
</ul>

<div class="box warn"><span class="h">이런 사람은 특히 조심해요</span>
<ul>
<li><strong>지방간, 고중성지방혈증, 통풍</strong>이 있는 사람은 단 음료와 주스를 줄이는 것만으로도 수치가 좋아질 수 있어요.</li>
<li><strong>과당 흡수 장애</strong>가 있으면 사과, 배, 꿀, 과일 주스를 먹은 뒤 복부 팽만과 설사가 생겨요. 과민성 대장 증후군이 있다면 이런 음식에 반응하는지 살펴봐요.</li>
<li>드문 유전 질환인 <strong>유전성 과당 불내증</strong>은 과당을 먹으면 저혈당과 간 손상이 생겨 철저히 피해야 해요.</li>
</ul></div>

<div class="box"><span class="h">과당 줄이기 체크리스트</span>
<ol>
<li>과일은 주스 말고 통째로, 하루 1~2회</li>
<li>주스는 하루 한 잔 이하</li>
<li>단 음료는 물·탄산수·무가당 차로</li>
<li>원재료명의 과당·액상과당 확인</li>
<li>아이는 컵으로, 나이별 주스 양 지키기</li>
<li>지방간·통풍이면 단 음료부터 끊기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>과일은 당이 많아서 다이어트 중에는 피해야 하나요?</dt>
<dd>통과일은 열량에 비해 포만감이 크고 식이섬유와 비타민이 많아 다이어트에 도움이 돼요. 양을 지키고 주스나 말린 과일보다 생과일을 먹어요.</dd>
<dt>착즙 주스는 괜찮지 않나요?</dt>
<dd>설탕을 넣지 않은 100% 착즙 주스도 과당이 농축돼 있고 식이섬유가 적어요. 첨가당 음료보다는 낫지만 양은 한 잔 이하로 줄여요.</dd>
<dt>꿀과 조청은 설탕보다 좋은가요?</dt>
<dd>꿀과 조청도 당이에요. 약간의 다른 성분이 있지만 많이 먹으면 설탕과 비슷한 영향을 줘요. 돌 전 아기에게는 보툴리누스균 위험 때문에 꿀을 주지 않아요.</dd>
</dl>
