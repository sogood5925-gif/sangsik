  data-title="수도 동파와 누수 대처: 계량기 보온, 얼었을 때 녹이는 법, 새는 물 찾기"
  data-thumb="-10°C|동파 주의 기온"
  data-summary="한파가 오면 수도계량기와 보일러 배관이 얼어 터지기 쉬워요. 동파를 막는 보온법과 물 틀어 두기, 얼었을 때 안전하게 녹이는 법, 계량기로 누수를 확인하는 법, 아랫집으로 물이 샐 때 대처와 보험 확인까지 정리했어요."
  data-tags="동파,누수,수도계량기,보일러,생활정보">
<p class="lead">수도관은 물이 얼면서 부피가 늘어나 터져요. 한번 터지면 물이 안 나오는 것에서 끝나지 않고 아랫집 천장까지 번지기도 해요. 한파 예보가 나오면 10분만 투자해 계량기와 배관을 살펴보세요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>계량기함은 <strong>헌 옷이나 보온재로 채우고</strong> 뚜껑 틈을 테이프로 막아요.</li>
<li>기온이 영하 10°C 아래로 떨어지면 <strong>수도꼭지를 조금 틀어</strong> 물이 흐르게 해요.</li>
<li>얼었으면 <strong>미지근한 물이나 헤어드라이어</strong>로 천천히 녹여요. 뜨거운 물과 불은 안 돼요.</li>
<li>물을 모두 잠갔는데 계량기가 돈다면 <strong>누수</strong>예요.</li>
</ul></div>

<h2>얼기 쉬운 곳</h2>
<ul>
<li><strong>복도식 아파트와 빌라의 계량기함:</strong> 바깥 공기에 그대로 노출돼요.</li>
<li><strong>단독주택 마당·외벽 수도</strong>, 보온이 안 된 노출 배관</li>
<li><strong>베란다 세탁기</strong> 급수 호스와 배수 호스</li>
<li><strong>보일러 배관</strong>(특히 바깥 쪽 보일러실), 응축수 배관</li>
<li>오래 비워 둔 집, 난방을 끈 빈방의 배관</li>
</ul>

<h2>동파 예방법</h2>
<div class="tbl"><table>
<thead><tr><th>장소</th><th>이렇게 해요</th></tr></thead>
<tbody>
<tr><td>수도계량기함</td><td>안을 헌 옷, 뽁뽁이, 보온재로 채우고 뚜껑 틈을 테이프로 막아요. 계량기 유리가 보이도록 비닐로 한 번 덮으면 확인이 쉬워요</td></tr>
<tr><td>노출 배관, 마당 수도</td><td>보온재나 열선을 감고, 겨울에 안 쓰는 외부 수도는 잠근 뒤 물을 빼 둬요</td></tr>
<tr><td>세탁기</td><td>쓰고 나면 수도꼭지를 잠그고 급수·배수 호스의 물을 빼요. 베란다 창을 닫아요</td></tr>
<tr><td>보일러</td><td>외출할 때 끄지 말고 <strong>외출 모드</strong>로 둬요. 보일러실 창문을 닫고 배관 보온재 상태를 확인해요</td></tr>
<tr><td>수도꼭지</td><td>강추위에는 욕실이나 부엌 꼭지 하나를 <strong>가늘게 흐르도록</strong> 틀어 둬요. 온수 쪽을 조금 트는 방법도 권해요</td></tr>
</tbody>
<caption>지자체 상수도사업본부·한국수자원공사 동파 예방 안내를 바탕으로 정리</caption></table></div>
<p>물을 틀어 두면 수도요금이 조금 나오지만, 계량기를 교체하고 피해를 복구하는 비용보다 훨씬 적어요.</p>

<h2>얼었을 때 녹이는 법</h2>
<ol>
<li>수도꼭지를 열어 둔 채 시작해요. 녹으면서 물이 흘러나오는 것으로 확인할 수 있어요.</li>
<li>계량기나 배관을 수건으로 감싸고 <strong>미지근한 물</strong>(40°C 안팎)을 천천히 부어요.</li>
<li>또는 <strong>헤어드라이어</strong>로 수도꼭지 쪽부터 멀찍이서 따뜻한 바람을 쐬어요.</li>
<li>물이 나오면 한동안 조금 흐르게 두어 다시 얼지 않게 해요.</li>
</ol>
<div class="box warn"><span class="h">이렇게 하면 안 돼요</span>
<ul>
<li><strong>펄펄 끓는 물</strong>을 바로 부으면 급격한 온도 차로 계량기 유리나 배관이 깨질 수 있어요.</li>
<li>토치, 라이터, 휴대용 버너로 배관을 달구면 화재와 배관 손상 위험이 커요.</li>
<li>물에 젖은 손으로 드라이어와 전기 열선을 만지지 않아요.</li>
</ul></div>
<p>계량기 유리가 깨졌거나 녹여도 물이 나오지 않으면 <strong>지역 상수도사업본부</strong>(많은 지역에서 국번 없이 121)에 신고해요. 계량기는 수도사업자 소유라서 교체 절차가 정해져 있고, 비용 부담 기준은 지역마다 달라요.</p>

<h2>누수를 확인하는 법</h2>
<p>수도요금이 갑자기 많이 나오거나, 천장·벽에 얼룩이 생기거나, 물을 안 쓰는데 물 흐르는 소리가 나면 누수를 의심해요.</p>
<div class="tbl"><table>
<thead><tr><th>단계</th><th>확인 방법</th></tr></thead>
<tbody>
<tr><td>1. 모든 물 잠그기</td><td>집 안의 수도꼭지, 세탁기, 정수기, 비데 급수를 모두 잠가요</td></tr>
<tr><td>2. 계량기 보기</td><td>계량기의 작은 별 모양이나 톱니 표시(지침)가 돌면 어딘가에서 물이 새고 있어요</td></tr>
<tr><td>3. 변기 확인</td><td>변기 물탱크에 색소나 커피를 조금 떨어뜨리고, 물을 내리지 않았는데 변기 안으로 색이 번지면 탱크 부품에서 새는 거예요</td></tr>
<tr><td>4. 범위 좁히기</td><td>세대 밸브만 잠갔을 때 멈추면 집 안 배관, 계속 돌면 계량기와 집 사이 배관이 의심돼요</td></tr>
</tbody></table></div>
<p>벽이나 바닥 속 배관의 누수는 눈으로 찾기 어려워 전문 누수 탐지 업체의 장비가 필요해요.</p>

<h2>아랫집으로 물이 샌다면</h2>
<ul>
<li>먼저 우리 집 세대 밸브를 잠가 추가 피해를 막아요.</li>
<li>관리사무소에 알리고, 피해 부위를 사진으로 남겨요.</li>
<li>원인이 우리 집 배관이나 설비라면 수리와 아랫집 피해 배상 책임이 생길 수 있어요.</li>
<li>가입한 보험에 <strong>일상생활배상책임</strong> 특약이 있으면 아랫집 피해 배상이 보장되는 경우가 많아요. 보험사에 먼저 문의하고 절차를 확인해요.</li>
<li>세입자라면 집주인에게 바로 알려요. 배관 노후 같은 건물 문제는 보통 집주인이 수리해요.</li>
</ul>

<h2>오래 집을 비울 때</h2>
<ul>
<li>겨울에 며칠 이상 비운다면 보일러를 외출 모드로 두고, 세대 밸브를 잠그는 것도 방법이에요.</li>
<li>세탁기, 정수기, 비데의 급수 밸브를 잠가요.</li>
<li>이웃이나 관리사무소에 연락처를 남겨요.</li>
</ul>

<div class="box"><span class="h">한파 전 체크리스트</span>
<ol>
<li>계량기함 보온재 채우고 틈 막기</li>
<li>노출 배관 보온재 상태 확인</li>
<li>세탁기 쓰고 나면 호스 물 빼기</li>
<li>외출 시 보일러는 외출 모드</li>
<li>영하 10°C 아래면 꼭지 하나 가늘게 틀기</li>
<li>세대 밸브 위치 미리 알아 두기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>세대 밸브는 어디 있나요?</dt>
<dd>보통 계량기함 안이나 싱크대 아래, 보일러 근처에 있어요. 급할 때 바로 잠글 수 있게 미리 위치를 확인해 두세요.</dd>
<dt>베란다 세탁기가 얼었어요.</dt>
<dd>급수 호스와 수도꼭지를 미지근한 수건이나 헤어드라이어로 녹이고, 세탁조에 미지근한 물을 부어 두었다가 배수를 시도해요. 뜨거운 물은 부품을 상하게 할 수 있어요.</dd>
<dt>여름에도 누수 확인이 필요한가요?</dt>
<dd>누수는 계절과 상관없이 생겨요. 수도요금이 평소보다 많이 나오면 계량기로 한 번 확인해 보세요.</dd>
</dl>
