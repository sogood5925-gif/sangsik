  data-title="췌장염: 등까지 뻗치는 윗배 통증, 술과 담석이 두 가지 큰 원인, 재발을 막는 법"
  data-thumb="2대 원인|술과 담석"
  data-summary="췌장염은 소화 효소를 만드는 췌장에 염증이 생겨 심한 윗배 통증이 오는 병이에요. 급성 췌장염의 증상과 원인, 담석·음주·중성지방·약, 병원에서의 치료, 재발을 막기 위한 금주와 담낭 수술, 만성 췌장염으로 넘어갔을 때의 소화·당뇨 관리, 바로 응급실에 가야 할 신호를 정리했어요."
  data-tags="췌장염,급성췌장염,담석,음주,질병">
<p class="lead">술을 많이 마신 다음 날이나 기름진 식사를 한 뒤, 명치 부근이 칼로 찌르듯 아프고 통증이 등까지 뻗쳐요. 앞으로 몸을 웅크리면 조금 나아지고 누우면 더 아파요. 급성 췌장염은 대부분 며칠 치료로 좋아지지만 일부는 심하게 진행할 수 있어서, 이런 통증은 참지 말고 병원에 가야 해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>급성 췌장염은 <strong>윗배의 심한 통증이 등으로 뻗치는 것</strong>이 특징이에요. 구역과 구토가 함께 와요.</li>
<li>가장 흔한 원인은 <strong>담석과 음주</strong>, 그다음은 <strong>매우 높은 중성지방</strong>이에요.</li>
<li>치료는 병원에서 <strong>수액, 통증 조절, 원인 치료</strong>를 해요.</li>
<li>재발을 막으려면 <strong>금주</strong>, 담석이 원인이면 <strong>담낭 절제</strong>를 고려해요.</li>
</ul></div>

<h2>췌장은 어떤 일을 할까</h2>
<p>췌장은 위 뒤쪽에 있는 길쭉한 장기로, 음식을 소화하는 <strong>효소</strong>와 혈당을 조절하는 <strong>인슐린</strong>을 만들어요. 소화 효소는 원래 장에 나온 뒤에 활성화되는데, 어떤 이유로 췌장 안에서 먼저 활성화되면 췌장 자신을 녹이며 염증을 일으켜요.</p>

<h2>주요 원인</h2>
<div class="tbl"><table>
<thead><tr><th>원인</th><th>설명</th></tr></thead>
<tbody>
<tr><td>담석</td><td>담낭의 돌이 내려와 췌장관 출구를 막아요. 여성, 중년 이후, 비만에서 많아요</td></tr>
<tr><td>음주</td><td>오랫동안 많이 마신 사람에게 생기고, 반복되면 만성 췌장염이 돼요</td></tr>
<tr><td>고중성지방혈증</td><td>중성지방이 매우 높을 때(대개 1,000mg/dL 이상) 생길 수 있어요</td></tr>
<tr><td>약</td><td>일부 약(아자티오프린, 발프로산 등)이 드물게 원인이 돼요</td></tr>
<tr><td>시술 후</td><td>내시경 역행 담췌관 조영술(ERCP) 뒤</td></tr>
<tr><td>기타</td><td>고칼슘혈증, 복부 외상, 췌장 종양, 자가면역, 유전</td></tr>
</tbody>
<caption>대한췌담도학회 급성 췌장염 진료 권고, 미국소화기학회(ACG) 급성 췌장염 지침(2024)을 바탕으로 정리</caption></table></div>

<h2>증상</h2>
<ul>
<li>명치나 왼쪽 윗배의 <strong>갑작스럽고 심한 통증</strong>, 등으로 뻗침</li>
<li>구역, 반복되는 구토</li>
<li>배가 부풀고 누르면 아파요.</li>
<li>열, 빠른 맥박</li>
<li>몸을 앞으로 숙이면 조금 편해요.</li>
</ul>
<p>혈액 검사에서 췌장 효소(리파아제, 아밀라아제)가 크게 오르고, CT 등으로 확인해요.</p>

<div class="box warn"><span class="h">바로 응급실에 가야 할 때</span>
<ul>
<li><strong>윗배 통증이 심하고 몇 시간 넘게</strong> 이어져요.</li>
<li>구토 때문에 물도 못 마셔요.</li>
<li>숨이 차거나, 맥박이 빠르고, 어지럽고 창백해요.</li>
<li>눈 흰자가 노래지고(황달) 열과 오한이 나요. 담석이 담관을 막은 상태일 수 있어요.</li>
</ul>
<p>심한 급성 췌장염은 다른 장기의 기능까지 떨어뜨릴 수 있어요. 진통제를 먹고 참지 않아요.</p></div>

<h2>병원에서의 치료</h2>
<div class="tbl"><table>
<thead><tr><th>치료</th><th>설명</th></tr></thead>
<tbody>
<tr><td>수액</td><td>탈수를 바로잡고 췌장으로 가는 혈류를 지켜요</td></tr>
<tr><td>통증 조절</td><td>진통제로 통증을 줄여요</td></tr>
<tr><td>식사</td><td>통증과 구역이 가라앉으면 부드러운 저지방 식사부터 일찍 시작하는 것을 권해요</td></tr>
<tr><td>원인 치료</td><td>담관을 막은 담석은 내시경으로 제거. 중성지방이 원인이면 수치를 낮추는 치료</td></tr>
<tr><td>합병증 관리</td><td>중증이면 집중 치료, 고인 액체나 괴사 조직은 필요할 때 시술로 빼요</td></tr>
</tbody>
<caption>미국소화기학회(ACG) 급성 췌장염 지침(2024), 대한췌담도학회 자료를 바탕으로 정리</caption></table></div>
<p>대부분의 경증 췌장염은 일주일 안팎 입원 치료로 좋아져요.</p>

<h2>재발을 막으려면</h2>
<ul>
<li><strong>술이 원인이었다면 완전히 끊어요.</strong> 조금씩 마시는 것도 재발 위험을 높여요. 끊기 어렵다면 보건소나 중독관리센터의 도움을 받아요.</li>
<li><strong>담석이 원인이었다면</strong> 같은 입원 기간이나 회복 직후 <strong>담낭 절제술</strong>을 권해요. 담낭을 두면 재발이 잦아요.</li>
<li>중성지방이 높다면 약, 식사 조절, 체중 감량, 금주로 수치를 낮춰요. 당뇨 조절도 중요해요.</li>
<li>금연해요. 흡연도 췌장염과 췌장암 위험을 높여요.</li>
</ul>

<h2>만성 췌장염</h2>
<p>염증이 반복되면 췌장이 굳고 기능이 줄어드는 <strong>만성 췌장염</strong>이 될 수 있어요.</p>
<ul>
<li><strong>반복되는 윗배 통증</strong></li>
<li><strong>기름진 변</strong>(변이 번들거리고 물에 뜨며 냄새가 심함), 체중 감소: 소화 효소가 부족해요. 식사 때 <strong>췌장 효소제</strong>를 먹어요.</li>
<li><strong>당뇨</strong>: 인슐린을 만드는 세포도 줄어요.</li>
<li>췌장암 위험이 높아져 정기적으로 확인해요.</li>
</ul>

<div class="box"><span class="h">췌장 건강 체크리스트</span>
<ol>
<li>등으로 뻗치는 윗배 통증은 참지 않기</li>
<li>췌장염을 앓았다면 완전 금주</li>
<li>담석 원인이면 담낭 수술 상의</li>
<li>중성지방·혈당 정기 확인</li>
<li>금연</li>
<li>기름진 변·체중 감소는 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>술을 조금만 마셔도 췌장염이 생기나요?</dt>
<dd>보통은 오랫동안 많이 마신 경우에 생겨요. 다만 한 번 췌장염을 앓았다면 적은 양도 재발 위험을 높여 끊는 것이 좋아요.</dd>
<dt>췌장염을 앓으면 기름진 음식을 평생 못 먹나요?</dt>
<dd>급성 췌장염에서 완전히 회복했다면 균형 잡힌 식사를 하면 돼요. 만성 췌장염이라면 효소제와 함께 식단을 의사·영양사와 조절해요.</dd>
<dt>췌장염이 췌장암이 되나요?</dt>
<dd>한 번의 급성 췌장염이 암으로 바뀌지는 않지만, 만성 췌장염은 췌장암 위험을 높여요. 반대로 췌장암이 췌장염으로 먼저 나타나기도 해서, 원인이 뚜렷하지 않은 중년 이후 췌장염은 영상 검사를 더 해요.</dd>
</dl>
