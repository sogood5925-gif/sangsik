<p class="lead">우울증은 "힘내", "생각을 바꿔봐"라는 말로 낫지 않아요. 감기에 의지로 대응하지 않듯, 우울증도 치료가 필요한 병이에요. 그리고 치료하면 대부분 좋아져요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>우울한 기분이나 흥미 상실이 <strong>2주 넘게</strong> 거의 매일 이어지면 우울증을 의심해요.</li>
<li>잠, 식욕, 집중력, 몸의 기운까지 바뀌는 <strong>온몸의 병</strong>이에요.</li>
<li><strong>약물 치료와 상담 치료</strong> 모두 효과가 있고, 함께하면 더 좋아요.</li>
<li>죽고 싶은 생각이 든다면 지금 <strong>109</strong>(자살예방상담전화)에 연락할 수 있어요. 24시간 열려 있어요.</li>
</ul></div>

<h2>우울감과 우울증은 다르다</h2>
<p>살다 보면 슬프고 무기력한 날이 있어요. 실망하거나 잃었을 때 드는 자연스러운 감정이고, 시간이 지나거나 상황이 바뀌면 나아져요. 우울증은 이런 감정이 <strong>오래, 깊게</strong> 이어지면서 일상을 무너뜨리는 상태예요.</p>
<div class="box note"><span class="h">주요우울장애 진단 기준</span>
<p>아래 증상 중 <strong>5가지 이상</strong>이 <strong>2주 이상</strong> 거의 매일 이어지고, 그중 하나는 1번이나 2번이어야 해요.</p>
<ol>
<li>하루 대부분 우울한 기분 (슬픔, 공허함, 절망감)</li>
<li>거의 모든 활동에 흥미나 즐거움이 줄어듦</li>
<li>식욕이나 체중의 뚜렷한 변화</li>
<li>잠을 못 자거나 너무 많이 잠</li>
<li>몸과 생각이 느려지거나, 안절부절못함</li>
<li>피로하고 기운이 없음</li>
<li>내가 가치 없다는 느낌, 지나친 죄책감</li>
<li>집중력과 결정 능력 저하</li>
<li>죽음이나 자살에 대한 반복적인 생각</li>
</ol>
<p>미국정신의학회 진단 기준(DSM-5)을 바탕으로 정리했어요. 스스로 진단하기보다 전문가와 확인하는 데 참고해요.</p></div>

<h2>얼마나 흔할까</h2>
<p>국내 정신건강 실태조사에서 성인 여러 명 중 한 명꼴로 평생 한 번 이상 우울증을 겪는 것으로 나타났어요. 누구에게나 생길 수 있는 흔한 병이지만, 실제로 치료를 받는 사람은 그중 일부예요. 병이라는 걸 모르거나, 도움을 청하는 걸 망설이기 때문이에요.</p>

<h2>왜 생길까</h2>
<p>한 가지 원인으로 설명되지 않아요. 여러 요인이 겹쳐 생겨요.</p>
<ul>
<li><strong>생물학적 요인:</strong> 가족력, 뇌의 신경전달물질과 스트레스 조절 체계의 변화, 갑상선 질환 같은 신체 질환, 일부 약물</li>
<li><strong>심리적 요인:</strong> 자신을 지나치게 비판하는 생각 습관, 완벽주의, 어린 시절의 상처</li>
<li><strong>사회적 요인:</strong> 상실, 이별, 실직, 경제적 어려움, 고립, 오랜 돌봄 부담</li>
<li><strong>특정 시기:</strong> 출산 후(산후우울증), 폐경기, 노년기, 큰 병을 진단받은 뒤</li>
</ul>
<p>그래서 우울증은 성격이 약하거나 의지가 부족해서 생기는 게 아니에요.</p>

<h2>우울증은 이렇게 보이기도 한다</h2>
<ul>
<li><strong>몸의 증상:</strong> 두통, 소화불량, 여기저기 아픔, 만성 피로로 병원을 다니다 우울증을 발견하는 경우가 많아요.</li>
<li><strong>짜증과 분노:</strong> 특히 남성과 청소년은 슬픔보다 짜증, 공격성, 과음으로 나타나기도 해요.</li>
<li><strong>노인:</strong> 기억력 저하로 나타나 치매처럼 보이기도 해요.</li>
<li><strong>산후:</strong> 출산 후 2주 넘게 이어지는 깊은 우울, 아기를 돌볼 수 없을 것 같은 무력감은 산후우울증일 수 있어요.</li>
</ul>

<h2>치료</h2>
<div class="tbl"><table>
<thead><tr><th>치료</th><th>설명</th></tr></thead>
<tbody>
<tr><td>약물 치료 (항우울제)</td><td>보통 2~4주 뒤부터 효과가 나타나기 시작해 6~12주에 걸쳐 좋아져요. 좋아진 뒤에도 재발을 막기 위해 일정 기간(흔히 6~12개월) 더 유지해요</td></tr>
<tr><td>심리 치료</td><td>인지행동치료는 우울을 키우는 생각과 행동 패턴을 바꾸는 연습을 해요. 대인관계치료 등 다른 방법도 효과가 있어요</td></tr>
<tr><td>병행 치료</td><td>중등도 이상의 우울증에서는 약물과 심리 치료를 함께할 때 효과가 더 좋은 경우가 많아요</td></tr>
<tr><td>그 밖에</td><td>약에 잘 반응하지 않는 경우 경두개자기자극술, 전기경련치료 등이 쓰여요</td></tr>
</tbody></table></div>
<h3>생활 속에서 돕는 것</h3>
<ul>
<li><strong>운동:</strong> 규칙적인 신체 활동은 가벼운~중간 정도의 우울 증상을 줄이는 효과가 있어요.</li>
<li><strong>수면 리듬:</strong> 같은 시간에 일어나고 아침 햇빛을 받아요.</li>
<li><strong>작은 활동:</strong> 기분이 좋아질 때까지 기다리기보다 작은 일(샤워, 짧은 산책)을 먼저 해보는 게 기분을 움직여요.</li>
<li><strong>술 줄이기:</strong> 술은 잠깐 잊게 하지만 우울을 깊게 해요.</li>
</ul>

<h2>항우울제에 대한 오해</h2>
<dl class="qa">
<dt>항우울제는 중독되나요?</dt>
<dd>항우울제는 마약이나 수면제처럼 점점 더 많이 찾게 되는 중독을 일으키지 않아요. 다만 갑자기 끊으면 어지러움, 예민함 같은 중단 증상이 생길 수 있어서, 끊을 때는 의사와 함께 서서히 줄여요.</dd>
<dt>약을 먹으면 성격이 바뀌나요?</dt>
<dd>항우울제는 성격을 바꾸는 약이 아니라 우울증 때문에 잃었던 원래의 나를 되찾도록 돕는 약이에요.</dd>
<dt>약을 먹으면 평생 먹어야 하나요?</dt>
<dd>처음 우울증이라면 좋아진 뒤 일정 기간 유지하고 끊는 경우가 많아요. 여러 번 재발했다면 더 오래 먹기도 해요.</dd>
<dt>정신건강의학과 기록이 남으면 불이익이 있나요?</dt>
<dd>진료 기록은 본인 동의 없이 직장이나 학교에 알려지지 않아요. 치료하지 않은 우울증이 일과 생활에 주는 불이익이 훨씬 커요.</dd>
</dl>

<h2>곁에 있는 사람이 할 수 있는 일</h2>
<ul>
<li><strong>조언보다 들어주기:</strong> "왜 그렇게 생각해?"보다 "많이 힘들었겠다"가 더 힘이 돼요.</li>
<li><strong>재촉하지 않기:</strong> "기운 내", "다들 힘들어" 같은 말은 오히려 고립감을 키울 수 있어요.</li>
<li><strong>치료를 함께 알아보기:</strong> 병원 예약이나 동행을 도와주면 첫걸음이 쉬워져요.</li>
<li><strong>직접 물어보기:</strong> 걱정된다면 "혹시 죽고 싶다는 생각을 해본 적 있어?"라고 물어봐도 괜찮아요. 이런 질문이 위험을 높이지 않고, 오히려 말할 기회를 준다는 연구가 있어요.</li>
<li><strong>나를 돌보기:</strong> 돌보는 사람도 지칠 수 있어요. 혼자 감당하지 말고 도움을 받아요.</li>
</ul>

<div class="box warn"><span class="h">지금 도움이 필요하다면</span>
<ul>
<li><strong>자살예방상담전화 109</strong> (24시간)</li>
<li><strong>정신건강위기상담전화 1577-0199</strong> (24시간)</li>
<li>위험이 급하면 <strong>119, 112</strong></li>
<li>가까운 <strong>정신건강복지센터</strong>, 정신건강의학과</li>
</ul>
<p>혼자 견디지 않아도 돼요. 연락하는 것만으로도 충분히 용기 있는 일이에요.</p></div>

<div class="box"><span class="h">나를 살피는 체크리스트</span>
<ol>
<li>최근 2주 동안 거의 매일 우울하거나 흥미가 없었나요?</li>
<li>잠, 식욕, 기운이 크게 달라졌나요?</li>
<li>일이나 공부, 관계가 어려워졌나요?</li>
<li>나 자신이 쓸모없다고 느끼나요?</li>
<li>해당한다면 정신건강의학과나 정신건강복지센터에 상담해 보세요.</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>상담만으로도 좋아질 수 있나요?</dt>
<dd>가벼운~중간 정도의 우울증은 심리 치료만으로도 좋아지는 경우가 많아요. 증상이 심하거나 오래됐다면 약물 치료를 함께 고려해요. 정부의 심리상담 지원 사업도 있으니 정신건강복지센터에 물어보세요.</dd>
<dt>좋아졌다가 다시 우울해져요.</dt>
<dd>우울증은 재발할 수 있는 병이에요. 재발 초기 신호(잠이 흐트러짐, 흥미가 줄어듦)를 알아두고 빨리 치료를 다시 시작하면 짧게 지나갈 수 있어요.</dd>
<dt>아이도 우울증에 걸리나요?</dt>
<dd>네. 아이와 청소년은 짜증, 성적 저하, 등교 거부, 몸이 아프다는 호소로 나타나기도 해요. 걱정되면 소아청소년 정신건강의학과 상담을 받아요.</dd>
</dl>
