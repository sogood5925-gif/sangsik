<p class="lead">심장이 제멋대로 빠르게 뛰거나 불규칙하게 뛰는 느낌이 들면 덜컥 겁이 나지요. 부정맥은 종류가 많고 대부분은 해롭지 않지만, <strong>심방세동</strong>은 증상이 가벼워도 뇌졸중 위험을 크게 높여 꼭 치료가 필요해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>심방세동은 심방이 떨리듯 불규칙하게 뛰는 부정맥으로, <strong>뇌졸중 위험을 약 5배</strong> 높여요.</li>
<li>두근거림 없이 <strong>증상이 전혀 없는 경우</strong>도 많아 심전도로 찾아야 해요.</li>
<li>뇌졸중 위험 점수에 따라 <strong>항응고제</strong>를 써서 핏덩이를 막아요.</li>
<li>가슴 통증, 실신, 심한 숨참을 동반한 두근거림은 <strong>응급</strong>이에요.</li>
</ul></div>

<h2>부정맥이란</h2>
<p>심장은 전기 신호에 맞춰 규칙적으로 뛰어요. 이 신호가 너무 빠르거나, 느리거나, 불규칙해지는 것을 부정맥이라고 해요. 가끔 한 번씩 '툭' 하고 건너뛰는 느낌의 <strong>조기 박동</strong>은 건강한 사람에게도 흔하고 대부분 해롭지 않아요. 하지만 심방세동, 심실빈맥, 심한 서맥처럼 치료가 필요한 부정맥도 있어요.</p>

<h2>심방세동은 어떤 병일까</h2>
<p>심방세동이 생기면 심장의 윗방(심방)이 1분에 수백 번씩 떨리기만 하고 제대로 수축하지 못해요. 그러면 심방 안에 피가 고이며 <strong>핏덩이(혈전)</strong>가 생기기 쉽고, 이것이 떨어져 나가 뇌혈관을 막으면 뇌졸중이 돼요. 심방세동으로 인한 뇌졸중은 크고 후유증이 심한 경우가 많아요.</p>
<ul>
<li>나이가 들수록 흔해져요. 60대 이후 크게 늘어요.</li>
<li>고혈압, 심부전, 판막질환, 당뇨, 비만, 수면무호흡, 갑상선 기능 항진증, 과음이 위험을 높여요.</li>
<li>처음에는 저절로 멈추는 '발작성'이었다가 점점 오래 지속되는 경우가 많아요.</li>
</ul>

<h2>증상</h2>
<ul>
<li>가슴이 두근거리고 맥박이 <strong>불규칙하게 빠르게</strong> 뛰어요.</li>
<li>숨이 차고, 쉽게 지치고, 어지러워요.</li>
<li>가슴이 답답하거나 불편해요.</li>
<li><strong>아무 증상이 없는 경우</strong>도 흔해요. 건강검진 심전도나 뇌졸중이 생긴 뒤 처음 발견되기도 해요.</li>
</ul>

<h2>진단</h2>
<div class="tbl"><table>
<thead><tr><th>검사</th><th>특징</th></tr></thead>
<tbody>
<tr><td>12유도 심전도</td><td>검사하는 순간 심방세동이 있으면 바로 진단돼요</td></tr>
<tr><td>24시간·장기 심전도(홀터, 패치)</td><td>가끔 생겼다 사라지는 발작성 심방세동을 찾아요</td></tr>
<tr><td>심장 초음파</td><td>심장 구조, 판막, 심장 기능을 확인해요</td></tr>
<tr><td>혈액 검사</td><td>갑상선 기능, 빈혈, 콩팥 기능 등을 확인해요</td></tr>
<tr><td>스마트워치 심전도</td><td>의심 신호를 찾는 데 도움이 되지만, 진단은 의료기관 심전도로 확인해요</td></tr>
</tbody></table></div>

<h2>뇌졸중 예방: 항응고제</h2>
<p>심방세동 치료에서 가장 중요한 건 <strong>뇌졸중을 막는 것</strong>이에요. 나이와 동반 질환으로 뇌졸중 위험 점수(CHA₂DS₂-VASc)를 계산해 항응고제가 필요한지 정해요.</p>
<div class="tbl"><table>
<thead><tr><th>위험 요인</th><th class="num">점수</th></tr></thead>
<tbody>
<tr><td>심부전</td><td class="num">1</td></tr>
<tr><td>고혈압</td><td class="num">1</td></tr>
<tr><td>나이 75세 이상</td><td class="num">2</td></tr>
<tr><td>당뇨병</td><td class="num">1</td></tr>
<tr><td>뇌졸중·일과성 허혈발작·혈전색전증 병력</td><td class="num">2</td></tr>
<tr><td>혈관 질환(심근경색, 말초동맥질환 등)</td><td class="num">1</td></tr>
<tr><td>나이 65~74세</td><td class="num">1</td></tr>
<tr><td>여성</td><td class="num">1</td></tr>
</tbody>
<caption>유럽심장학회(ESC)·대한부정맥학회 심방세동 지침을 바탕으로 정리. 여성 항목을 뺀 점수가 2점 이상이면 대개 항응고제를 권하고, 1점이면 개별적으로 판단해요. 2024년 유럽 지침은 여성 항목을 뺀 점수(CHA₂DS₂-VA)를 써요</caption></table></div>
<ul>
<li>항응고제로는 <strong>비타민 K 비의존성 경구 항응고제</strong>(성분: 아픽사반, 리바록사반, 에독사반, 다비가트란)와 와파린이 있어요.</li>
<li>아스피린은 심방세동의 뇌졸중 예방 효과가 부족해 대신 쓰지 않아요.</li>
<li>항응고제를 먹으면 출혈 위험이 늘어요. 검은 변, 피 섞인 소변, 멈추지 않는 코피, 심한 두통이 있으면 바로 연락해요.</li>
<li>시술이나 치과 치료 전에는 항응고제를 먹고 있다고 꼭 알리고, <strong>스스로 중단하지 않아요.</strong></li>
</ul>

<h2>맥박과 리듬 치료</h2>
<ul>
<li><strong>맥박 조절:</strong> 베타차단제 등으로 너무 빠른 심박수를 늦춰 증상을 줄여요.</li>
<li><strong>리듬 조절:</strong> 항부정맥제, 전기 충격(동율동 전환)으로 정상 리듬을 되찾아요.</li>
<li><strong>전극도자 절제술:</strong> 심방세동을 일으키는 부위(주로 폐정맥 주변)를 고주파나 냉동으로 차단해요. 진단 초기에 적극적으로 리듬을 조절하면 예후가 좋다는 연구가 늘고 있어요.</li>
<li>항응고제가 어려운 사람에게는 좌심방이 부속기를 막는 시술을 고려하기도 해요.</li>
</ul>

<h2>생활 관리</h2>
<ul>
<li><strong>술을 줄이거나 끊어요.</strong> 적은 양의 음주도 심방세동을 늘리고, 금주가 재발을 줄였다는 연구가 있어요.</li>
<li>체중을 줄이고, 혈압·혈당을 조절해요.</li>
<li>코골이가 심하면 수면무호흡 검사를 받아요.</li>
<li>규칙적인 중강도 운동을 해요.</li>
<li>금연하고, 에너지 음료처럼 카페인이 아주 많은 음료는 조심해요.</li>
</ul>

<div class="box warn"><span class="h">바로 119를 불러야 할 때</span>
<ul>
<li>두근거림과 함께 <strong>가슴 통증</strong>, 심한 숨참, 식은땀이 있어요.</li>
<li><strong>실신</strong>했거나 곧 쓰러질 것 같아요.</li>
<li><strong>한쪽 얼굴·팔다리 마비, 말이 어눌함, 시야 이상</strong>이 생겼어요(뇌졸중).</li>
</ul></div>

<div class="box"><span class="h">심방세동 체크리스트</span>
<ol>
<li>맥박이 불규칙하면 심전도 검사</li>
<li>뇌졸중 위험 점수 확인, 항응고제 상담</li>
<li>항응고제는 스스로 끊지 않기</li>
<li>시술·치과 전 복용 사실 알리기</li>
<li>절주·체중·혈압 관리, 수면무호흡 확인</li>
<li>뇌졸중 신호 알아 두기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>스마트워치에서 심방세동 알림이 떴어요.</dt>
<dd>스마트워치는 의심 신호를 알려 줄 뿐 진단은 아니에요. 알림 화면과 기록을 저장해 두고 순환기내과나 내과에서 심전도 검사를 받아요. 증상(가슴 통증, 실신)이 함께 있으면 응급 진료를 받아요.</dd>
<dt>증상이 없는데도 항응고제를 먹어야 하나요?</dt>
<dd>증상 유무와 뇌졸중 위험은 관계가 없어요. 위험 점수가 높다면 증상이 없어도 뇌졸중 예방을 위해 항응고제를 권해요.</dd>
<dt>커피를 마시면 부정맥이 생기나요?</dt>
<dd>보통 양의 커피가 심방세동을 늘린다는 근거는 약해요. 다만 커피를 마신 뒤 두근거림이 생긴다면 줄여 보세요.</dd>
</dl>
