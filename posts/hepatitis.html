  data-title="B형·C형 간염: C형은 먹는 약으로 완치, B형은 꾸준한 관리와 간암 검진"
  data-thumb="95%|C형간염 완치율"
  data-summary="B형과 C형 간염은 오랫동안 증상 없이 지내다 간경변과 간암으로 이어질 수 있어요. 옮는 경로와 옮지 않는 경로, 검사 결과 읽는 법, 8~12주 먹는 약으로 완치되는 C형 간염 치료, 평생 관리가 필요한 B형 간염, 6개월마다 받는 간암 검진과 예방접종을 정리했어요."
  data-tags="B형간염,C형간염,간암,예방접종,질병">
<p class="lead">간은 '침묵의 장기'라고 불려요. B형과 C형 간염 바이러스는 수십 년 동안 조용히 간에 염증을 남기다가, 간경변이나 간암으로 처음 드러나기도 해요. 반가운 소식은 C형 간염은 이제 먹는 약으로 대부분 완치되고, B형 간염도 약과 정기 검진으로 충분히 관리할 수 있다는 거예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>B형과 C형 간염은 <strong>혈액과 체액</strong>으로 옮아요. 음식, 식기, 악수로는 옮지 않아요.</li>
<li><strong>C형 간염</strong>은 먹는 항바이러스제를 8~12주 먹으면 <strong>95% 이상 완치</strong>돼요.</li>
<li><strong>B형 간염</strong>은 완치가 어려워 필요하면 약을 쓰고, 평생 정기 검사를 받아요.</li>
<li>만성 B형·C형 간염이 있는 40세 이상은 <strong>6개월마다 간암 검진</strong>(초음파+혈액)을 받아요.</li>
</ul></div>

<h2>B형과 C형, 무엇이 다를까</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>B형 간염</th><th>C형 간염</th></tr></thead>
<tbody>
<tr><td>주요 전파 경로</td><td>엄마에서 아기(출산 때), 혈액, 성접촉</td><td>혈액(주사기 공유, 비위생적 문신·피어싱·침, 과거 수혈)</td></tr>
<tr><td>예방접종</td><td>있어요(3회)</td><td>없어요</td></tr>
<tr><td>만성화</td><td>성인 감염은 대부분 회복, 영유아 감염은 대부분 만성화</td><td>감염자의 절반 이상이 만성화</td></tr>
<tr><td>치료</td><td>바이러스를 억제하는 약을 오래 먹어요. 완치는 어려워요</td><td>먹는 약 8~12주로 대부분 완치</td></tr>
<tr><td>합병증</td><td>간경변, 간암(간경변 없이도 간암이 생길 수 있어요)</td><td>간경변, 간암</td></tr>
</tbody>
<caption>대한간학회 만성 B형간염·C형간염 진료 가이드라인을 바탕으로 정리</caption></table></div>

<h2>옮는 경로와 옮지 않는 경로</h2>
<ul>
<li><strong>옮을 수 있어요:</strong> 주사기·면도기·칫솔·손톱깎이 공유, 소독되지 않은 기구로 하는 문신·피어싱·침, 보호되지 않은 성관계(B형에서 흔함), 출산</li>
<li><strong>옮지 않아요:</strong> 함께 식사하기, 찌개 나눠 먹기, 술잔 돌리기, 악수, 포옹, 기침</li>
</ul>
<p>B형 간염 보유자라는 이유로 직장이나 학교에서 차별받지 않아야 해요. 일상 접촉으로는 옮지 않아요.</p>

<h2>검사 결과 읽는 법</h2>
<div class="tbl"><table>
<thead><tr><th>검사</th><th>양성이면</th></tr></thead>
<tbody>
<tr><td>B형간염 표면항원(HBsAg)</td><td>현재 B형 간염 바이러스에 감염돼 있어요</td></tr>
<tr><td>B형간염 표면항체(Anti-HBs)</td><td>면역이 있어요(예방접종 또는 과거 감염 회복)</td></tr>
<tr><td>둘 다 음성</td><td>감염도 면역도 없어요. <strong>예방접종 대상</strong>이에요</td></tr>
<tr><td>C형간염 항체(Anti-HCV)</td><td>감염된 적이 있어요. 현재 감염인지 확인하려면 <strong>HCV RNA 검사</strong>가 필요해요</td></tr>
<tr><td>HCV RNA</td><td>현재 C형 간염 바이러스가 있어요. 치료 대상이에요</td></tr>
</tbody></table></div>
<p>C형 간염은 증상이 없어 모르고 지내는 사람이 많아요. 국가건강검진에 특정 나이(56세)의 C형간염 항체 검사가 포함되어 있으니 대상이라면 꼭 받아요. 대상이 아니어도 한 번쯤 검사를 받아 보는 것이 좋아요.</p>

<h2>C형 간염 치료</h2>
<ul>
<li>직접작용 항바이러스제(성분: 소포스부비르·벨파타스비르, 글레카프레비르·피브렌타스비르 등)를 <strong>8~12주</strong> 먹어요.</li>
<li>부작용이 적고, <strong>95% 이상</strong>에서 바이러스가 사라져요.</li>
<li>완치 뒤에도 이미 간경변이 있었다면 간암 검진을 계속 받아요.</li>
<li>다시 감염될 수 있으니 주사기·면도기 공유를 피해요.</li>
</ul>

<h2>B형 간염 관리</h2>
<ul>
<li>간 수치(ALT), 바이러스 양(HBV DNA), 간 섬유화 정도를 보고 치료 시작을 정해요.</li>
<li>항바이러스제(성분: 엔테카비르, 테노포비르 등)를 매일 먹어 바이러스를 억제해요. 간경변과 간암 위험을 줄여요.</li>
<li>약은 <strong>스스로 끊지 않아요.</strong> 갑자기 끊으면 간염이 급격히 악화될 수 있어요.</li>
<li>치료가 필요 없는 '비활동성 보유자'도 정기적으로 검사해요. 상태가 바뀔 수 있어요.</li>
<li>항암치료, 면역억제 치료를 받게 되면 B형 간염이 다시 활성화될 수 있어 미리 알려요.</li>
</ul>

<h2>간암 검진</h2>
<div class="box note"><span class="h">6개월마다 초음파 + 혈액 검사</span>
<p>만성 B형·C형 간염이나 간경변이 있는 <strong>40세 이상</strong>은 국가 간암검진으로 <strong>6개월마다</strong> 간 초음파와 혈청 알파태아단백 검사를 받을 수 있어요. 간암은 일찍 발견할수록 수술, 고주파 열치료 같은 근치적 치료가 가능해져요.</p></div>

<h2>예방</h2>
<ul>
<li><strong>B형 간염 예방접종:</strong> 신생아는 국가예방접종으로 3회 맞아요. 성인도 항원·항체가 모두 음성이면 3회 접종을 권해요.</li>
<li>B형 간염 보유 엄마에게서 태어난 아기는 출생 직후 면역글로불린과 백신을 맞아 대부분 감염을 막을 수 있어요.</li>
<li>면도기, 칫솔, 손톱깎이는 가족끼리도 따로 써요.</li>
<li>문신, 피어싱, 침은 일회용·멸균 기구를 쓰는 곳에서 받아요.</li>
<li>콘돔을 사용해요.</li>
</ul>

<div class="box warn"><span class="h">바로 진료가 필요한 신호</span>
<ul>
<li>눈 흰자위와 피부가 <strong>노래지고</strong> 소변이 콜라색이에요.</li>
<li>배가 불러 오르고(복수), 다리가 부어요.</li>
<li>피를 토하거나 검은 변을 봐요.</li>
<li>헛소리를 하거나 잠만 자려고 해요(간성뇌증).</li>
</ul></div>

<div class="box"><span class="h">간염 체크리스트</span>
<ol>
<li>B형 항원·항체 결과 확인, 둘 다 음성이면 접종</li>
<li>C형 항체 검사 한 번은 받기</li>
<li>C형 양성이면 RNA 검사 후 치료</li>
<li>B형 약은 스스로 끊지 않기</li>
<li>40세 이상 보유자는 6개월마다 간암 검진</li>
<li>면도기·칫솔 따로, 금주</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>B형 간염 보유자는 술을 마셔도 되나요?</dt>
<dd>술은 간에 추가 손상을 주어 간경변과 간암 위험을 높여요. 가능한 한 마시지 않는 것이 좋아요.</dd>
<dt>예방접종을 했는데 항체가 없어요.</dt>
<dd>접종 후에도 항체가 생기지 않는 사람이 있어요. 의사와 상의해 추가 접종(재접종)을 고려해요. 어릴 때 접종으로 항체가 사라진 건강한 성인은 추가 접종이 필요 없다는 의견도 있어 상황에 따라 판단해요.</dd>
<dt>간에 좋다는 건강식품을 먹으면 도움이 되나요?</dt>
<dd>간 질환이 있는 사람이 확인되지 않은 약초나 건강식품을 먹고 간 손상이 생기는 경우가 있어요. 먹기 전에 담당 의사와 상의해요.</dd>
</dl>
