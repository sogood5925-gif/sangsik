  data-title="이유식: 생후 6개월 무렵 시작, 처음부터 철분 챙기기, 알레르기 식품은 미루지 않기, 꿀과 질식 주의"
  data-thumb="6개월|이유식 시작 무렵"
  data-summary="이유식은 모유나 분유만으로 부족해지는 철분과 에너지를 채우고, 씹고 삼키는 법을 배우는 과정이에요. 시작 시기와 준비 신호, 단계별 질감과 횟수, 고기로 철분을 챙기는 이유, 달걀·땅콩 같은 알레르기 식품을 넣는 방법, 꿀·생우유·소금을 피하는 까닭, 질식을 막는 법, 위생을 정리했어요."
  data-tags="이유식,영유아영양,철분,식품알레르기,영양소">
<p class="lead">아기가 어른이 먹는 모습을 뚫어지게 보고, 숟가락을 입에 가져가면 입을 벌리기 시작해요. 이유식을 시작할 때가 다가왔다는 신호예요. 처음 해 보는 일이라 걱정이 많지만, 몇 가지 원칙만 알면 조급해할 필요 없어요. 이유식은 영양을 채우는 동시에 아기가 음식과 처음 만나는 즐거운 시간이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>이유식은 <strong>생후 6개월 무렵</strong>, 아기가 준비 신호를 보일 때 시작해요. <strong>4개월 전</strong>에는 시작하지 않아요.</li>
<li>6개월 이후 부족해지는 <strong>철분</strong>을 위해 <strong>고기</strong>를 초기부터 넣어요.</li>
<li>달걀, 땅콩 같은 <strong>알레르기 식품</strong>을 일부러 늦게 줄 필요는 없어요.</li>
<li><strong>돌 전에는 꿀, 생우유(주 음료로), 소금·설탕</strong>을 주지 않고, 질식 위험 음식을 조심해요.</li>
</ul></div>

<h2>시작 시기와 준비 신호</h2>
<ul>
<li>목을 잘 가누고, 받쳐 주면 앉을 수 있어요.</li>
<li>숟가락을 입에 대면 혀로 밀어내지 않고 입을 벌려요.</li>
<li>음식에 관심을 보이고 손을 뻗어요.</li>
<li>모유·분유를 충분히 먹는데도 배고파해요.</li>
</ul>
<p>세계보건기구는 생후 6개월까지 모유만 먹이고 6개월부터 이유식을 권해요. 국내에서는 아기에 따라 <strong>생후 4~6개월 사이</strong>에 시작하기도 해요. 이른둥이는 교정 나이와 발달을 보고 소아청소년과와 시기를 정해요.</p>

<h2>단계별 이유식</h2>
<div class="tbl"><table>
<thead><tr><th>시기(대략)</th><th>질감</th><th>횟수</th><th>예</th></tr></thead>
<tbody>
<tr><td>초기(6개월 무렵)</td><td>곱게 간 미음, 묽은 죽</td><td>하루 1~2회</td><td>쌀미음, 쇠고기 미음, 애호박·브로콜리 퓌레</td></tr>
<tr><td>중기(7~8개월)</td><td>으깬 죽, 두부 정도의 부드러운 덩어리</td><td>하루 2회</td><td>쇠고기·닭고기 채소죽, 달걀노른자·흰자, 생선살</td></tr>
<tr><td>후기(9~11개월)</td><td>진밥, 잇몸으로 으깰 수 있는 작은 덩어리</td><td>하루 3회 + 간식</td><td>진밥과 다진 반찬, 손으로 집어 먹는 부드러운 음식</td></tr>
<tr><td>완료기(12개월 이후)</td><td>부드러운 밥과 잘게 썬 반찬</td><td>하루 3끼 + 간식 1~2회</td><td>가족 식사를 싱겁게, 잘게</td></tr>
</tbody>
<caption>대한소아청소년과학회, 세계보건기구(WHO) 영유아 보완식 지침(2023)을 바탕으로 정리. 아기의 발달에 맞춰 조절해요</caption></table></div>
<p>새 식품은 <strong>한 번에 한 가지씩</strong> 넣고 2~3일쯤 지켜보면 알레르기 반응이 생겼을 때 원인을 찾기 쉬워요. 질감은 너무 오래 묽게 유지하지 말고 단계적으로 올려야 씹는 법을 익혀요.</p>

<h2>철분은 처음부터</h2>
<p>아기가 엄마에게서 받은 철은 생후 6개월 무렵이면 많이 줄어요. 모유에는 철이 적어서, 이유식 초기부터 <strong>쇠고기 같은 붉은 살코기</strong>를 넣어요. 흡수가 잘 되는 철이 들어 있어요. 철분 강화 곡물, 달걀노른자, 콩, 녹색 채소도 함께 써요.</p>

<h2>알레르기 식품은 미루지 않아요</h2>
<ul>
<li>예전에는 달걀, 생선, 땅콩을 늦게 주라고 했지만, 지금은 <strong>늦추는 것이 알레르기 예방에 도움이 되지 않고</strong>, 일찍 주면 오히려 줄어든다는 연구가 있어요.</li>
<li>이유식에 익숙해진 뒤 <strong>완숙 달걀</strong>, 땅콩버터를 물에 묽게 푼 것(통땅콩 금지), 생선살 등을 조금씩 넣어요.</li>
<li><strong>심한 아토피 피부염이 있거나 달걀 알레르기가 이미 있는 아기</strong>는 땅콩을 넣기 전에 소아청소년과와 상의해요.</li>
<li>한 번 먹어 괜찮았다면 <strong>꾸준히 자주</strong> 먹는 것이 좋아요.</li>
</ul>

<div class="box warn"><span class="h">이것만은 조심해요</span>
<ul>
<li><strong>꿀:</strong> 돌 전 아기에게는 절대 주지 않아요. 영아 보툴리누스증 위험이 있어요. 꿀이 든 음식도 마찬가지예요.</li>
<li><strong>생우유:</strong> 돌 전에는 주 음료로 주지 않아요. 요리에 조금 들어가는 정도는 괜찮아요.</li>
<li><strong>소금·설탕·간장:</strong> 돌 전에는 간을 하지 않아요.</li>
<li><strong>질식 위험 음식:</strong> 통땅콩·견과류, 통포도·방울토마토(4등분하기), 떡, 딱딱한 생채소, 팝콘, 사탕</li>
<li>먹을 때는 <strong>반드시 앉혀서</strong>, 어른이 옆에서 지켜봐요.</li>
<li>먹은 뒤 <strong>입술·얼굴 부기, 온몸 두드러기, 구토 반복, 숨참, 처짐</strong>이 생기면 바로 119예요.</li>
</ul></div>

<h2>질식 위험 음식 바꿔 주기</h2>
<div class="tbl"><table>
<thead><tr><th>위험한 형태</th><th>이렇게 바꿔요</th></tr></thead>
<tbody>
<tr><td>통포도, 방울토마토</td><td>세로로 4등분</td></tr>
<tr><td>통땅콩, 통견과류</td><td>곱게 간 가루나 묽게 푼 땅콩버터</td></tr>
<tr><td>떡, 쫄깃한 젤리</td><td>이 시기에는 주지 않아요</td></tr>
<tr><td>딱딱한 생당근, 생사과</td><td>푹 익히거나 곱게 갈기</td></tr>
<tr><td>둥근 소시지</td><td>길게 반 가른 뒤 잘게 썰기</td></tr>
</tbody>
<caption>대한소아청소년과학회, 미국소아과학회(AAP) 영유아 질식 예방 안내를 바탕으로 정리</caption></table></div>

<h2>위생과 보관</h2>
<ul>
<li>조리 전 손을 씻고, 이유식 도구는 깨끗이 씻어 말려요.</li>
<li>만든 이유식은 식혀서 <strong>냉장 1~2일, 냉동 1~2주 안</strong>에 써요. 날짜를 적어 둬요.</li>
<li>아기가 먹다 남긴 이유식은 침이 섞여 상하기 쉬워요. 다시 주지 않고 버려요.</li>
<li>데울 때는 골고루 데우고, 먹이기 전 온도를 확인해요.</li>
</ul>

<div class="box"><span class="h">이유식 체크리스트</span>
<ol>
<li>6개월 무렵 준비 신호 확인</li>
<li>초기부터 고기로 철분</li>
<li>새 식품은 한 가지씩</li>
<li>알레르기 식품 미루지 않기</li>
<li>꿀·간·질식 위험 음식 피하기</li>
<li>남긴 이유식은 버리기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>이유식을 너무 안 먹어요.</dt>
<dd>처음에는 몇 숟가락만 먹는 게 정상이에요. 이 시기의 주 영양은 여전히 모유·분유예요. 억지로 먹이지 말고 여러 번 기회를 줘요.</dd>
<dt>시판 이유식을 써도 되나요?</dt>
<dd>써도 괜찮아요. 원재료와 나트륨을 확인하고, 아기 월령에 맞는 질감의 제품을 골라요.</dd>
<dt>물은 언제부터 줘요?</dt>
<dd>이유식을 시작하면 식사 때 컵으로 물을 조금씩 줄 수 있어요. 많이 줄 필요는 없어요.</dd>
</dl>
