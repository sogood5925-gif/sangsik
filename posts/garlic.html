  data-title="마늘과 양파: 다지고 10분 기다리기, 혈압·콜레스테롤 연구의 크기, 마늘 기름 보관과 반려동물 주의"
  data-thumb="10분|다진 뒤 기다리는 시간"
  data-summary="마늘과 양파는 우리 음식 거의 모두에 들어가는 향신 채소예요. 마늘의 알리신이 만들어지는 원리와 다진 뒤 잠시 두는 요령, 혈압·콜레스테롤에 대한 연구 결과의 크기, 마늘 보충제와 출혈 위험, 양파의 퀘르세틴과 과민성 장증후군, 기름에 담근 마늘의 식중독 위험, 반려동물 중독을 정리했어요."
  data-tags="마늘,양파,알리신,향신채소,영양소">
<p class="lead">"한국 사람은 마늘 힘으로 산다"는 말이 있을 만큼 우리는 마늘을 많이 먹어요. 마늘과 양파는 음식의 풍미를 살리면서 여러 유익한 성분을 가진 채소예요. 다만 '만병통치'처럼 과장된 이야기도 많아요. 연구가 보여 주는 실제 크기와 안전하게 먹는 법을 정리해 볼게요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>마늘의 대표 성분 <strong>알리신</strong>은 마늘을 <strong>자르거나 다질 때</strong> 만들어져요. 다진 뒤 <strong>10분쯤 두었다가</strong> 익히면 더 많이 남아요.</li>
<li>마늘은 혈압과 콜레스테롤을 <strong>조금</strong> 낮춘다는 연구가 있지만, 약을 대신할 정도는 아니에요.</li>
<li>고용량 마늘 보충제는 <strong>항응고제와 함께</strong> 먹으면 출혈 위험을 높일 수 있어요.</li>
<li>기름에 담근 마늘은 <strong>냉장 보관</strong>하고 빨리 먹어요. 개와 고양이에게는 <strong>독</strong>이에요.</li>
</ul></div>

<h2>마늘과 양파의 주요 성분</h2>
<div class="tbl"><table>
<thead><tr><th>채소</th><th>주요 성분</th><th>특징</th></tr></thead>
<tbody>
<tr><td>마늘</td><td>알리신 등 황화합물, 셀레늄, 비타민 B6</td><td>톡 쏘는 향. 자르거나 다질 때 효소가 작용해 알리신이 생겨요</td></tr>
<tr><td>양파</td><td>퀘르세틴(폴리페놀), 황화합물, 프럭탄(식이섬유)</td><td>붉은 양파와 바깥쪽 껍질 가까운 부분에 퀘르세틴이 많아요</td></tr>
<tr><td>파·부추·달래</td><td>황화합물, 비타민 K, 엽산</td><td>같은 부추속 채소로 비슷한 향 성분을 가져요</td></tr>
<tr><td>흑마늘</td><td>숙성 과정에서 알리신은 줄고 다른 황화합물이 늘어요</td><td>맛이 달고 순해요. 특별한 효능이 확인된 것은 아니에요</td></tr>
</tbody>
<caption>농촌진흥청 국가표준식품성분표, 미국 국립보건원 국립보완통합보건센터(NCCIH) Garlic 자료를 바탕으로 정리</caption></table></div>

<h2>다지고 10분 기다리기</h2>
<p>통마늘 속에는 알리인과 효소가 따로 있어요. 마늘을 자르거나 으깨면 둘이 만나 <strong>알리신</strong>이 생겨요. 그런데 이 효소는 열에 약해서, 다지자마자 뜨거운 팬에 넣으면 알리신이 적게 만들어져요. <strong>다진 뒤 10분쯤 두었다가</strong> 조리하면 열을 받아도 좀 더 남아 있어요. 생마늘은 속을 자극할 수 있으니 양을 조절해요.</p>

<h2>연구가 말하는 효과의 크기</h2>
<div class="tbl"><table>
<thead><tr><th>기대 효과</th><th>연구 결과</th></tr></thead>
<tbody>
<tr><td>혈압</td><td>고혈압이 있는 사람에게 마늘 보충제가 수축기 혈압을 몇 mmHg~10mmHg 안팎 낮췄다는 메타분석이 있어요. 연구마다 차이가 커요</td></tr>
<tr><td>콜레스테롤</td><td>총콜레스테롤과 LDL이 조금 내려갔다는 연구와 효과가 없다는 연구가 섞여 있어요</td></tr>
<tr><td>감기 예방</td><td>근거가 부족해요</td></tr>
<tr><td>암 예방</td><td>마늘·파 종류를 많이 먹는 사람의 위암·대장암 위험이 낮았다는 관찰 연구가 있지만 확실하지 않아요</td></tr>
</tbody>
<caption>코크란 체계적 문헌고찰, 미국 국립보건원 국립보완통합보건센터(NCCIH) 자료를 바탕으로 정리</caption></table></div>
<p>마늘과 양파는 음식으로 즐기면 좋은 채소예요. 하지만 고혈압이나 이상지질혈증 치료 약을 마늘로 바꾸지는 않아요.</p>

<div class="box warn"><span class="h">보충제를 먹는다면</span>
<ul>
<li><strong>와파린, 아스피린, 클로피도그렐</strong> 같은 항응고·항혈소판제를 먹는 사람이 고용량 마늘 보충제를 함께 먹으면 출혈 위험이 높아질 수 있어요.</li>
<li><strong>수술이나 시술 1~2주 전</strong>에는 마늘 보충제를 멈추도록 권하기도 해요. 의료진에게 알려요.</li>
<li>일부 HIV 치료제의 효과를 떨어뜨린다는 보고가 있어요.</li>
<li>보통 음식으로 먹는 마늘은 대부분 문제가 되지 않아요.</li>
</ul></div>

<h2>양파와 과민성 장증후군</h2>
<p>양파와 마늘에는 장에서 발효가 잘 되는 <strong>프럭탄</strong>이 많아요. 과민성 장증후군이 있는 사람은 배가 부풀고 가스가 차기 쉬워요. 이럴 때는 양을 줄이거나, 기름에 향만 우려내고 건더기는 건져 내는 방법이 있어요(프럭탄은 기름에 잘 녹지 않아요).</p>

<h2>마늘 기름 보관</h2>
<p>생마늘이나 허브를 기름에 담가 실온에 두면 산소가 없는 환경에서 <strong>보툴리누스균</strong>이 자라 독소를 만들 수 있어요. 집에서 만든 마늘 기름은 <strong>냉장 보관하고 며칠 안에</strong> 먹고, 오래 두려면 냉동해요. 뚜껑이 부풀거나 이상한 냄새가 나면 맛보지 말고 버려요.</p>

<h2>반려동물에게는 독</h2>
<p>마늘, 양파, 파, 부추는 개와 고양이의 적혈구를 파괴해 <strong>빈혈</strong>을 일으킬 수 있어요. 익히거나 가루로 만들어도 마찬가지예요. 양념된 고기, 국물, 만두 속을 나눠 주지 않아요. 먹었다면 동물병원에 바로 연락해요.</p>

<div class="box"><span class="h">마늘·양파 체크리스트</span>
<ol>
<li>다진 마늘은 10분 두었다 조리</li>
<li>생마늘은 속이 편한 만큼만</li>
<li>항응고제 먹으면 보충제 상의</li>
<li>수술 전 보충제 알리기</li>
<li>마늘 기름은 냉장, 빨리 먹기</li>
<li>반려동물에게 주지 않기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>마늘 냄새는 어떻게 줄이나요?</dt>
<dd>우유를 마시거나 사과, 상추, 파슬리를 함께 먹으면 조금 줄어든다는 연구가 있어요. 냄새 성분 일부는 피부와 숨으로 나와 양치만으로는 한계가 있어요.</dd>
<dt>싹이 난 마늘은 먹어도 되나요?</dt>
<dd>감자 싹과 달리 마늘 싹은 독성이 없어 먹어도 돼요. 맛이 쓸 수 있어 싹은 떼어 내도 좋아요.</dd>
<dt>양파즙이 혈관을 청소해 주나요?</dt>
<dd>'혈관 청소' 같은 효과는 확인되지 않았어요. 즙으로 많이 마시기보다 음식으로 꾸준히 먹는 편이 좋아요.</dd>
</dl>
