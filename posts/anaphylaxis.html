<p class="lead">땅콩 한 조각, 주사 한 대, 벌 한 번에 몇 분 만에 온몸이 붓고 숨이 막힐 수 있어요. 아나필락시스는 드물지만 빠르게 진행되고, 제때 대처하면 대부분 회복돼요. 핵심은 '조금 더 지켜보자'가 아니라 <strong>바로 에피네프린을 쓰고 119를 부르는 것</strong>이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>원인에 노출된 뒤 <strong>몇 분~2시간 안에</strong> 피부·호흡·순환·소화기 증상이 함께 나타나요.</li>
<li>치료의 첫 번째 약은 <strong>에피네프린</strong>이에요. 항히스타민제는 대신할 수 없어요.</li>
<li>자가주사가 있다면 <strong>허벅지 바깥쪽</strong>에 바로 놓고 119를 불러요.</li>
<li>좋아져도 <strong>몇 시간 뒤 다시 나빠질 수</strong> 있어 병원에서 지켜봐야 해요.</li>
</ul></div>

<h2>아나필락시스란</h2>
<p>알레르기 원인 물질이 들어오면 몸의 면역세포가 히스타민 같은 물질을 한꺼번에 쏟아내요. 그 결과 혈관이 넓어지고 새면서 혈압이 떨어지고, 기관지와 목이 좁아져 숨쉬기 어려워져요. 한 곳에만 생기는 두드러기와 달리 <strong>여러 장기가 동시에</strong> 반응하는 것이 특징이에요.</p>

<h2>주요 원인</h2>
<div class="tbl"><table>
<thead><tr><th>원인</th><th>예</th></tr></thead>
<tbody>
<tr><td>음식</td><td>땅콩, 견과류, 우유, 달걀, 밀, 메밀, 갑각류, 생선, 과일 등. 어린이에게 가장 흔한 원인</td></tr>
<tr><td>약</td><td>항생제(페니실린 계열 등), 해열진통제(비스테로이드 소염제), 조영제, 근이완제</td></tr>
<tr><td>곤충 독</td><td>벌, 말벌, 개미</td></tr>
<tr><td>기타</td><td>라텍스, 운동(특정 음식을 먹은 뒤 운동할 때), 원인을 찾지 못하는 경우도 있어요</td></tr>
</tbody>
<caption>대한천식알레르기학회 아나필락시스 안내, 세계알레르기기구(WAO) 아나필락시스 지침을 바탕으로 정리</caption></table></div>

<h2>알아차리는 기준</h2>
<p>아래 증상 가운데 <strong>두 가지 이상 영역</strong>이 갑자기 함께 나타나거나, 알려진 원인에 노출된 뒤 혈압이 떨어지면 아나필락시스를 의심해요.</p>
<div class="tbl"><table>
<thead><tr><th>영역</th><th>증상</th></tr></thead>
<tbody>
<tr><td>피부·점막</td><td>온몸 두드러기, 가려움, 붉어짐, 입술·혀·눈꺼풀 부기</td></tr>
<tr><td>호흡</td><td>숨참, 쌕쌕거림, 기침, 목 조임, 목소리 변화, 삼키기 어려움</td></tr>
<tr><td>순환</td><td>어지러움, 쓰러짐, 창백함, 식은땀, 맥박이 빠르고 약함</td></tr>
<tr><td>소화기</td><td>심한 복통, 반복되는 구토, 설사</td></tr>
</tbody>
<caption>세계알레르기기구(WAO) 2020 아나필락시스 진단 기준을 바탕으로 쉽게 정리</caption></table></div>
<p>피부 증상이 없이 숨참이나 쓰러짐만 오는 경우도 있어요. 아이는 갑자기 처지거나 보채는 모습으로만 나타나기도 해요.</p>

<div class="box warn"><span class="h">지금 바로 할 일</span>
<ol>
<li><strong>에피네프린 자가주사</strong>가 있다면 <strong>허벅지 바깥쪽</strong>에 놓아요. 옷 위로 놓아도 돼요.</li>
<li><strong>119</strong>에 전화해 "아나필락시스"라고 말해요.</li>
<li>환자를 <strong>눕히고 다리를 올려요.</strong> 숨이 차면 앉은 자세가 편할 수 있어요. 임신부는 왼쪽으로 눕혀요. 갑자기 일으켜 세우거나 걷게 하지 않아요.</li>
<li>5~15분이 지나도 좋아지지 않고 두 번째 자가주사가 있다면 한 번 더 놓아요.</li>
<li>반응과 숨이 없으면 심폐소생술을 시작해요.</li>
</ol></div>

<h2>에피네프린 자가주사</h2>
<ul>
<li>에피네프린은 혈관을 조이고 기관지를 넓혀 <strong>아나필락시스를 되돌리는 유일한 1차 약</strong>이에요.</li>
<li>늦게 쓸수록 효과가 떨어져요. <strong>망설여질 때도 쓰는 편</strong>이 안전하다고 권해요. 건강한 사람이 한 번 맞아 생기는 부작용(두근거림, 떨림)은 대부분 잠시예요.</li>
<li>자가주사는 보통 <strong>성인용 0.3mg, 어린이용 0.15mg</strong>이 있고, 몸무게에 따라 의사가 정해요.</li>
<li>처방받은 사람은 <strong>항상 2개</strong>를 지니고 다니는 것이 좋아요. 가족, 학교, 직장에 사용법을 알려요.</li>
<li>사용 기한을 확인하고, 고온과 직사광선을 피해 보관해요.</li>
<li>항히스타민제와 스테로이드는 두드러기, 가려움을 줄이는 보조 약이에요. 에피네프린 대신 먹고 기다리면 안 돼요.</li>
</ul>

<h2>병원에서 지켜보는 이유</h2>
<p>증상이 가라앉은 뒤 <strong>몇 시간(대개 12시간 안) 지나 다시 나타나는 이중 반응</strong>이 생길 수 있어요. 그래서 좋아졌어도 응급실에서 일정 시간 관찰해요. 퇴원 뒤에도 그날 밤은 혼자 있지 않는 것이 좋아요.</p>

<h2>원인 찾기와 재발 예방</h2>
<ul>
<li>알레르기 내과에서 <strong>무엇이 원인이었는지</strong> 검사하고 피할 목록을 만들어요.</li>
<li>약이 원인이라면 성분명을 적은 <strong>약물 알레르기 카드</strong>를 지니고, 병원·약국에 항상 알려요.</li>
<li>벌 독 아나필락시스는 <strong>면역치료</strong>로 재발 위험을 크게 줄일 수 있어요.</li>
<li>천식이 잘 조절되지 않으면 아나필락시스가 더 심해질 수 있어요. 천식 치료를 꾸준히 해요.</li>
<li>베타차단제 등 일부 약은 에피네프린 효과에 영향을 줄 수 있어요. 처방 의사에게 알레르기 병력을 알려요.</li>
</ul>

<div class="box"><span class="h">아나필락시스 대비 체크리스트</span>
<ol>
<li>원인 물질 목록과 알레르기 카드</li>
<li>자가주사 2개 항상 지니기</li>
<li>가족·학교·직장에 사용법 알리기</li>
<li>의심되면 바로 주사, 그다음 119</li>
<li>눕히고 다리 올리기, 세우지 않기</li>
<li>좋아져도 병원에서 관찰</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>입술만 조금 부었는데 주사를 놓아야 하나요?</dt>
<dd>한 부위의 가벼운 증상이면 지켜볼 수 있지만, 숨참·목 조임·어지러움·반복 구토가 더해지면 바로 주사해요. 전에 심한 반응이 있었던 사람은 의사와 미리 '언제 쓸지' 계획을 세워 두세요.</dd>
<dt>한 번 아나필락시스가 있었으면 평생 가나요?</dt>
<dd>원인에 따라 달라요. 우유, 달걀 알레르기는 자라면서 좋아지기도 하지만 땅콩, 견과류, 갑각류, 약물은 오래가는 편이에요. 정기적으로 다시 평가받아요.</dd>
<dt>예방접종도 아나필락시스를 일으키나요?</dt>
<dd>매우 드물게 생길 수 있어서 접종 뒤 15~30분 동안 접종 기관에서 지켜봐요. 이전에 백신 성분에 심한 반응이 있었다면 접종 전에 알려요.</dd>
</dl>
