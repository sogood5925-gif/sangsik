  data-title="황반변성: 선이 휘어 보이면 바로 안과로, 건성과 습성의 차이와 주사 치료"
  data-thumb="직선|휘어 보이면 신호"
  data-summary="황반변성은 망막 한가운데인 황반이 손상돼 보고 싶은 곳이 흐려지는 병이에요. 건성과 습성의 차이, 습성 황반변성에서 눈 속 주사 치료를 빨리 시작해야 하는 이유, 암슬러 격자로 집에서 확인하는 법, 영양제가 도움이 되는 사람과 금연의 중요성을 정리했어요."
  data-tags="황반변성,망막,암슬러격자,노인눈건강,질병">
<p class="lead">황반은 망막의 한가운데, 글자를 읽고 얼굴을 알아보는 섬세한 시력을 담당하는 곳이에요. 여기가 손상되면 주변은 보이는데 정작 보려는 곳이 흐리거나 휘어져 보여요. 특히 습성 황반변성은 몇 주~몇 달 만에 시력을 크게 떨어뜨릴 수 있어 빠른 치료가 중요해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>황반변성은 <strong>건성</strong>이 대부분이고, 일부가 <strong>습성</strong>으로 진행해 시력을 빠르게 떨어뜨려요.</li>
<li>문틀이나 타일 선이 <strong>휘어 보이거나</strong> 가운데가 비어 보이면 바로 안과에 가요.</li>
<li>습성은 <strong>눈 속 주사(항혈관내피성장인자)</strong>로 치료하며, 일찍 시작할수록 시력을 지키기 쉬워요.</li>
<li><strong>금연</strong>이 가장 중요한 예방법이고, 특정 단계의 환자에게는 정해진 조합의 영양제가 도움이 돼요.</li>
</ul></div>

<h2>누구에게 생길까</h2>
<ul>
<li><strong>나이:</strong> 50세 이후 늘고 70대 이상에서 흔해요.</li>
<li><strong>흡연:</strong> 가장 강력한 조절 가능한 위험 요인이에요. 담배를 피우면 위험이 몇 배 높아져요.</li>
<li><strong>가족력</strong>과 유전 요인</li>
<li>고혈압, 비만, 심혈관 질환</li>
</ul>

<h2>건성과 습성</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>건성(위축성)</th><th>습성(신생혈관성)</th></tr></thead>
<tbody>
<tr><td>빈도</td><td>대부분(약 80~90%)</td><td>일부</td></tr>
<tr><td>변화</td><td>망막 아래 노폐물(드루젠)이 쌓이고 황반 세포가 서서히 줄어요</td><td>망막 아래에 비정상 혈관이 자라 피와 물이 새요</td></tr>
<tr><td>진행 속도</td><td>대개 몇 년에 걸쳐 천천히</td><td>몇 주~몇 달 만에 빠르게</td></tr>
<tr><td>치료</td><td>진행을 늦추는 영양제(특정 단계), 정기 관찰. 일부 진행형에 새 치료제가 연구·도입되고 있어요</td><td>눈 속 주사 치료가 표준이에요</td></tr>
</tbody>
<caption>대한안과학회·대한망막학회 황반변성 정보, 미국안과학회(AAO) 진료 지침을 바탕으로 정리</caption></table></div>

<h2>이런 증상이 있어요</h2>
<ul>
<li>직선이 <strong>휘거나 물결치듯</strong> 보여요(변시증).</li>
<li>보려는 곳 가운데가 <strong>흐리거나 검게 비어</strong> 보여요.</li>
<li>글자를 읽기 힘들고, 사람 얼굴이 잘 알아보이지 않아요.</li>
<li>색이 흐리게 보이거나, 어두운 곳에서 적응이 느려요.</li>
</ul>
<p>한쪽 눈에만 생기면 다른 눈이 가려 줘서 잘 모를 수 있어요. 가끔 <strong>한 눈씩 가리고</strong> 확인해 보세요.</p>

<h2>집에서 확인하는 암슬러 격자</h2>
<div class="box note"><span class="h">이렇게 확인해요</span>
<ol>
<li>모눈종이처럼 가로세로 선이 그어진 격자(암슬러 격자)를 30cm 거리에 둬요. 평소 돋보기를 쓴다면 쓰고 봐요.</li>
<li>한쪽 눈을 가리고, 격자 <strong>가운데 점</strong>을 바라봐요.</li>
<li>선이 휘거나, 끊기거나, 흐리거나, 빈 곳이 있는지 봐요.</li>
<li>반대쪽 눈도 똑같이 해요.</li>
</ol>
<p>격자가 없다면 문틀, 창틀, 욕실 타일 줄눈을 한 눈씩 봐도 돼요. <strong>새로 휘어 보이는 곳이 생기면 며칠 안에 안과</strong>에 가요.</p></div>

<h2>습성 황반변성 치료</h2>
<ul>
<li>눈 속(유리체강)에 <strong>항혈관내피성장인자 약</strong>(성분: 라니비주맙, 애플리버셉트, 베바시주맙, 파리시맙 등)을 주사해 비정상 혈관이 자라고 새는 것을 막아요.</li>
<li>점안 마취 뒤 외래에서 몇 분 만에 해요. 처음에는 한 달 간격으로 몇 번 맞고, 이후 상태에 따라 간격을 조절해요.</li>
<li>많은 사람이 시력을 유지하거나 일부 회복하지만, <strong>주사를 오래 꾸준히</strong> 맞아야 하는 경우가 많아요. 중단하면 다시 나빠질 수 있어요.</li>
<li>주사 뒤 눈이 점점 아프고 빨개지거나 시력이 떨어지면 드물지만 감염(안내염)일 수 있어 바로 연락해요.</li>
</ul>

<h2>영양제는 누구에게 도움이 될까</h2>
<p>미국의 대규모 연구(AREDS, AREDS2)에서 특정 조합의 영양제가 <strong>중간 단계 황반변성이 있거나 한쪽 눈이 진행된 사람</strong>의 진행 위험을 약 25% 줄였어요.</p>
<div class="tbl"><table>
<thead><tr><th>성분</th><th class="num">하루 용량(AREDS2)</th></tr></thead>
<tbody>
<tr><td>비타민 C</td><td class="num">500mg</td></tr>
<tr><td>비타민 E</td><td class="num">400IU</td></tr>
<tr><td>아연</td><td class="num">80mg(연구에 따라 25mg)</td></tr>
<tr><td>구리</td><td class="num">2mg</td></tr>
<tr><td>루테인 / 제아잔틴</td><td class="num">10mg / 2mg</td></tr>
</tbody>
<caption>미국 국립안연구소(NEI) AREDS2 연구 안내를 바탕으로 정리</caption></table></div>
<ul>
<li>황반변성이 <strong>없거나 초기인 사람</strong>에게 예방 효과는 확인되지 않았어요.</li>
<li>예전 조합에 들어 있던 <strong>베타카로틴</strong>은 흡연자·과거 흡연자의 폐암 위험을 높일 수 있어 루테인·제아잔틴으로 바뀌었어요.</li>
<li>고용량 아연은 위장 불편과 구리 결핍을 일으킬 수 있어요. 복용 전 안과 의사와 상의해요.</li>
</ul>

<h2>생활 관리</h2>
<ul>
<li><strong>금연</strong>: 가장 확실한 예방이자 진행을 늦추는 방법이에요.</li>
<li>녹색 잎채소, 생선, 견과류가 많은 식사가 도움이 될 수 있어요.</li>
<li>혈압과 체중을 관리해요.</li>
<li>밖에서는 선글라스와 모자를 써요.</li>
<li>시력이 떨어졌다면 확대경, 밝은 조명, 큰 글씨 기기 같은 <strong>저시력 보조기구</strong>가 생활에 도움이 돼요.</li>
</ul>

<div class="box warn"><span class="h">바로 안과에 가야 할 때</span>
<ul>
<li>선이 새로 휘어 보이거나 가운데가 갑자기 흐려졌어요.</li>
<li>한쪽 눈 시력이 며칠 사이 뚜렷하게 떨어졌어요.</li>
<li>이미 습성 황반변성 치료 중인데 보이는 게 달라졌어요.</li>
</ul></div>

<div class="box"><span class="h">황반 건강 체크리스트</span>
<ol>
<li>50세 이후 정기 안과 검진(안저 검사)</li>
<li>한 달에 한 번 한 눈씩 암슬러 격자 확인</li>
<li>담배 끊기</li>
<li>영양제는 진단 단계에 맞춰 의사와 상의</li>
<li>주사 치료는 일정대로 꾸준히</li>
<li>선이 휘면 며칠 안에 안과</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>황반변성이면 완전히 실명하나요?</dt>
<dd>황반변성은 주변 시야는 남아 있어 완전히 캄캄해지는 경우는 드물어요. 하지만 가운데 시력을 잃으면 읽기, 운전, 얼굴 알아보기가 어려워져 생활에 큰 영향을 줘요.</dd>
<dt>루테인만 먹으면 예방되나요?</dt>
<dd>황반변성이 없는 사람에게 루테인 단독 영양제의 예방 효과는 확인되지 않았어요. 채소를 충분히 먹고 담배를 끊는 게 먼저예요.</dd>
<dt>스마트폰 불빛이 황반변성을 일으키나요?</dt>
<dd>일상적인 화면 사용이 황반변성을 일으킨다는 근거는 없어요. 다만 오래 보면 눈이 피로하고 건조해질 수 있어 중간중간 쉬어요.</dd>
</dl>
