  data-title="갑상선암: 결절은 흔하고 대부분 양성, 초음파 검진 논쟁, 작은 암을 지켜보는 선택"
  data-thumb="1cm|작은 유두암의 기준"
  data-summary="갑상선 결절은 초음파를 하면 흔히 발견되고 대부분 양성이에요. 갑상선암 대부분을 차지하는 유두암의 특징, 증상이 없는 사람의 초음파 검진을 둘러싼 논쟁, 결절이 보였을 때 조직검사 기준, 1cm 미만 미세암의 적극적 감시, 수술과 방사성 요오드, 수술 뒤 생활을 정리했어요."
  data-tags="갑상선암,갑상선결절,유두암,초음파검진,질병">
<p class="lead">건강검진에서 '갑상선에 혹이 있다'는 말을 들으면 덜컥 겁이 나요. 그런데 갑상선 결절은 초음파를 하면 어른의 상당수에게서 발견될 만큼 흔하고, 대부분은 암이 아니에요. 갑상선암 역시 대부분 천천히 자라고 치료 결과가 좋은 암이에요. 겁먹기보다 차근차근 확인하면 돼요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>갑상선 결절은 <strong>매우 흔하고, 대부분 양성</strong>이에요.</li>
<li>갑상선암의 대부분은 <strong>유두암</strong>이고, 5년 생존율이 매우 높아요.</li>
<li>증상이 없는 사람의 <strong>초음파 검진은 이득이 분명하지 않다</strong>는 의견이 있어, 필요성을 의사와 상의해요.</li>
<li><strong>1cm 미만</strong>의 위험도 낮은 미세 유두암은 바로 수술하지 않고 <strong>지켜보는 선택</strong>도 있어요.</li>
</ul></div>

<h2>갑상선암의 종류</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>비율(대략)</th><th>특징</th></tr></thead>
<tbody>
<tr><td>유두암</td><td>약 90% 이상</td><td>천천히 자라고 목 림프절로 퍼지기도 하지만 예후가 매우 좋아요</td></tr>
<tr><td>여포암</td><td>일부</td><td>혈관을 통해 폐·뼈로 퍼질 수 있어요</td></tr>
<tr><td>수질암</td><td>드묾</td><td>유전되는 경우가 있어(RET 유전자) 가족 검사가 필요할 수 있어요</td></tr>
<tr><td>미분화암</td><td>매우 드묾</td><td>빠르게 자라고 예후가 나빠요. 주로 고령</td></tr>
</tbody>
<caption>국가암정보센터, 대한갑상선학회 진료 권고안을 바탕으로 정리</caption></table></div>

<h2>검진 논쟁</h2>
<p>우리나라는 한때 건강검진에서 갑상선 초음파가 널리 쓰이면서 갑상선암 진단이 크게 늘었어요. 그런데 진단이 늘어난 만큼 사망률은 줄지 않았어요. 평생 문제를 일으키지 않았을 작은 암까지 찾아 수술한 <strong>과잉 진단</strong>이 많았다는 분석이 나왔어요. 이후 국립암센터 등이 참여한 권고안은 <strong>증상이 없는 성인의 초음파 검진을 일상적으로 권하지 않는다</strong>는 입장을 냈어요.</p>
<ul>
<li>목에 만져지는 혹이 있거나, 어린 시절 목에 방사선 치료를 받았거나, 가족 중 수질암이 있는 등 위험이 높다면 검사를 상의해요.</li>
<li>검진에서 이미 결절을 발견했다면 아래 기준에 따라 확인해요.</li>
</ul>

<h2>결절이 보였을 때</h2>
<div class="tbl"><table>
<thead><tr><th>초음파 소견</th><th>다음 단계(대략)</th></tr></thead>
<tbody>
<tr><td>양성으로 보이는 결절(물혹, 스펀지 모양 등)</td><td>대개 조직검사 없이 경과 관찰</td></tr>
<tr><td>중간 정도 의심 소견</td><td>크기에 따라(흔히 1~1.5cm 이상) 세침흡인 검사</td></tr>
<tr><td>암이 강하게 의심되는 소견(모양이 불규칙, 미세 석회화 등)</td><td>1cm 이상이면 세침흡인 검사, 더 작으면 상황에 따라 판단</td></tr>
</tbody>
<caption>대한갑상선영상의학회 K-TIRADS(2021), 대한갑상선학회 권고를 바탕으로 쉽게 정리. 실제 기준은 결과지와 담당 의사의 설명을 따라요</caption></table></div>

<h2>작은 암을 지켜보는 선택</h2>
<p>1cm 미만이고, 기관이나 신경 가까이 있지 않으며, 림프절이나 다른 곳으로 퍼진 흔적이 없는 미세 유두암은 <strong>적극적 감시</strong>를 할 수 있어요. 6개월~1년마다 초음파로 크기를 확인하고, 커지거나 퍼지는 신호가 보이면 그때 수술해요. 일본과 우리나라의 연구에서 이렇게 지켜본 사람 대부분이 오랫동안 크게 자라지 않았어요. 불안감, 정기 검사 부담 등을 함께 고려해 의사와 결정해요.</p>

<h2>치료</h2>
<ul>
<li><strong>수술:</strong> 암의 크기와 퍼진 정도에 따라 한쪽만 떼는 엽절제술, 전체를 떼는 전절제술을 해요. 드물게 목소리 변화(되돌이후두신경 손상), 칼슘 저하(부갑상선 손상)가 생길 수 있어요.</li>
<li><strong>방사성 요오드 치료:</strong> 전절제 뒤 재발 위험이 높을 때 남은 갑상선 조직과 암세포를 없애요.</li>
<li><strong>갑상선 호르몬 복용:</strong> 전절제를 했다면 평생 레보티록신을 먹어요. 재발 위험에 따라 용량을 조절해요.</li>
</ul>

<div class="box warn"><span class="h">빨리 진료를 받아야 할 때</span>
<ul>
<li>목의 혹이 <strong>몇 주 사이에 빠르게 커져요.</strong></li>
<li><strong>쉰 목소리</strong>가 몇 주 이상 이어지거나, 삼키기·숨쉬기가 불편해요.</li>
<li>목 옆에 딱딱한 멍울(림프절)이 만져져요.</li>
</ul></div>

<h2>수술 뒤 생활</h2>
<ul>
<li>갑상선 호르몬은 <strong>매일 같은 시간, 빈속에</strong> 먹어요. 칼슘제·철분제·위장약과는 몇 시간 간격을 둬요.</li>
<li>피곤함, 두근거림, 체중 변화가 있으면 호르몬 용량 조절이 필요한지 확인해요.</li>
<li>정기적으로 혈액 검사와 초음파로 재발 여부를 확인해요.</li>
<li>방사성 요오드 치료 전에는 저요오드 식사를 잠시 하기도 해요. 병원 안내를 따라요.</li>
</ul>

<div class="box"><span class="h">갑상선 결절 체크리스트</span>
<ol>
<li>결절은 흔하고 대부분 양성</li>
<li>결과지의 권고대로 추적</li>
<li>의심 소견이면 세침흡인 검사</li>
<li>미세암은 적극적 감시도 선택지</li>
<li>빠르게 커지는 혹·쉰 목소리는 진료</li>
<li>수술 뒤 호르몬은 빈속에 규칙적으로</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>갑상선암은 '착한 암'인가요?</dt>
<dd>대부분 예후가 좋지만 모든 갑상선암이 그런 것은 아니에요. 종류와 퍼진 정도에 따라 적극적인 치료가 필요한 경우도 있어요.</dd>
<dt>미역, 다시마를 많이 먹으면 갑상선암이 생기나요?</dt>
<dd>보통의 식사로 먹는 해조류가 갑상선암을 일으킨다는 근거는 뚜렷하지 않아요. 요오드 보충제를 과하게 먹는 것은 피해요.</dd>
<dt>결절이 있는데 갑상선 기능 검사는 정상이에요.</dt>
<dd>결절이 있어도 호르몬 기능은 정상인 경우가 대부분이에요. 결절 평가는 초음파로 따로 해요.</dd>
</dl>
