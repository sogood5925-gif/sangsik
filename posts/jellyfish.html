  data-title="해파리 쏘임: 민물 대신 바닷물로 씻기, 촉수는 맨손으로 떼지 않기, 병원에 갈 신호"
  data-thumb="바닷물|쏘인 곳 씻는 물"
  data-summary="여름 바다에서는 해파리에 쏘이는 사고가 해마다 늘어요. 우리 바다에 자주 나타나는 해파리, 쏘였을 때 바로 할 일과 하지 말아야 할 일, 식초가 모든 해파리에 맞지 않는 이유, 통증과 흉터 관리, 숨이 차거나 온몸 반응이 올 때, 해수욕 전 예방법을 정리했어요."
  data-tags="해파리,해수욕,응급처치,여름바다,생활정보">
<p class="lead">바다에서 갑자기 채찍으로 맞은 듯 따갑고 붉은 줄이 생겼다면 해파리에 쏘였을 가능성이 커요. 해파리 촉수에는 작은 독침 주머니가 수없이 붙어 있어서, 잘못 씻거나 문지르면 남은 독침이 더 터져요. 처음 몇 분 동안의 대처가 통증과 상처를 크게 좌우해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>쏘이면 바로 물 밖으로 나와 <strong>바닷물로 씻어요.</strong> 수돗물·생수 같은 <strong>민물은 독침을 더 터뜨려요.</strong></li>
<li>남은 촉수는 <strong>맨손으로 떼지 말고</strong> 장갑, 핀셋, 카드 모서리로 걷어 내요.</li>
<li>식초는 해파리 종류에 따라 <strong>오히려 해로울 수 있어요.</strong> 안전요원의 안내를 따라요.</li>
<li><strong>숨참, 가슴 답답함, 온몸 두드러기, 의식 저하</strong>가 있으면 즉시 119예요.</li>
</ul></div>

<h2>우리 바다의 해파리</h2>
<div class="tbl"><table>
<thead><tr><th>해파리</th><th>특징</th><th>쏘였을 때</th></tr></thead>
<tbody>
<tr><td>노무라입깃해파리</td><td>갓 지름이 1m를 넘기도 하는 대형. 여름~가을 서해·남해 등에 많아요</td><td>심한 통증, 붉은 줄, 드물게 전신 증상</td></tr>
<tr><td>보름달물해파리</td><td>반투명하고 흔해요</td><td>대개 가벼운 따가움</td></tr>
<tr><td>커튼원양해파리</td><td>긴 촉수가 커튼처럼 늘어져요</td><td>통증, 부종</td></tr>
<tr><td>작은부레관해파리</td><td>푸른 공기주머니가 떠 있어요. 제주 등에 드물게 나타나요</td><td>매우 강한 통증. 식초를 쓰지 않아요</td></tr>
<tr><td>유령해파리 등 독성 해파리</td><td>종류와 출현 해역이 해마다 달라요</td><td>통증, 붉음, 드물게 전신 반응</td></tr>
</tbody>
<caption>국립수산과학원 해파리 정보, 해양수산부 해파리 쏘임 사고 대응 안내를 바탕으로 정리. 출현 정보는 해마다 바뀌어요</caption></table></div>
<p>해변에 밀려와 죽은 해파리나 끊어진 촉수도 쏠 수 있어요. 아이가 만지지 않게 해요.</p>

<h2>쏘였을 때 바로 할 일</h2>
<ol>
<li><strong>물 밖으로</strong> 나오고, 쏘인 곳을 문지르지 않아요.</li>
<li><strong>바닷물</strong>을 부어 남은 촉수와 독침을 흘려보내요.</li>
<li>피부에 붙은 촉수는 <strong>장갑을 끼고 핀셋</strong>으로 떼거나, 신용카드 같은 <strong>얇은 모서리로 살살 긁어</strong> 걷어 내요.</li>
<li>안전요원이나 해수욕장 의무실에 알려요. 해파리 종류를 알면 처치에 도움이 돼요.</li>
<li>통증에는 <strong>비닐에 싼 얼음이나 냉찜질</strong>을 해요. 얼음을 피부에 직접 대지 않아요.</li>
</ol>

<h2>하지 말아야 할 것</h2>
<div class="tbl"><table>
<thead><tr><th>흔한 대처</th><th>왜 안 될까</th></tr></thead>
<tbody>
<tr><td>수돗물, 생수로 씻기</td><td>농도 차이로 남은 독침 주머니가 터져 독이 더 들어가요</td></tr>
<tr><td>모래나 수건으로 문지르기</td><td>독침이 더 터지고 피부가 상해요</td></tr>
<tr><td>맨손으로 촉수 떼기</td><td>손도 함께 쏘여요</td></tr>
<tr><td>무조건 식초 붓기</td><td>일부 해파리에는 독침을 더 터뜨릴 수 있어요</td></tr>
<tr><td>소변, 술, 된장 바르기</td><td>근거가 없고 감염 위험만 커요</td></tr>
</tbody>
<caption>국립수산과학원·해양수산부 해파리 쏘임 응급처치 안내를 바탕으로 정리</caption></table></div>

<div class="box warn"><span class="h">이런 증상은 바로 119</span>
<ul>
<li><strong>숨이 차거나</strong> 쌕쌕거림, 목이 조이는 느낌</li>
<li>가슴 통증, 심한 어지러움, 식은땀</li>
<li>쏘인 곳을 넘어 <strong>온몸에 두드러기</strong>, 얼굴·입술 부기</li>
<li>근육 경련, 의식이 흐려짐</li>
<li>얼굴이나 눈을 쏘였거나, 넓은 부위를 쏘였을 때</li>
</ul>
<p>아나필락시스일 수 있어요. 에피네프린 자가주사가 있다면 바로 사용하고 119를 불러요. 어린이와 어르신은 증상이 빨리 나빠질 수 있어요.</p></div>

<h2>쏘인 뒤 며칠 동안</h2>
<ul>
<li>가려움과 붉은 기는 며칠 이어질 수 있어요. 긁지 않아요.</li>
<li>물집이 생기면 터뜨리지 말고 깨끗하게 유지해요.</li>
<li>1~2주 뒤 쏘인 자리가 다시 가렵고 부풀어 오르는 <strong>지연 반응</strong>이 생기기도 해요. 피부과 진료를 받아요.</li>
<li>쏘인 자리는 햇볕에 색소가 남기 쉬워요. 옷이나 자외선 차단제로 가려요.</li>
<li>상처가 점점 붓고 뜨거워지며 고름이 나오면 감염일 수 있어요.</li>
</ul>

<h2>해수욕 전 예방</h2>
<ul>
<li>국립수산과학원의 <strong>해파리 출현 정보와 주의보</strong>를 확인해요.</li>
<li>해수욕장 <strong>안전요원이 있는 구역</strong>에서, 해파리 차단 그물이 있는 곳에서 수영해요.</li>
<li>긴소매 수영복이나 래시가드, 아쿠아슈즈로 피부 노출을 줄여요.</li>
<li>물속에서 해파리를 보면 건드리지 말고 천천히 멀어져요.</li>
<li>물놀이 짐에 <strong>핀셋, 일회용 장갑, 얼음팩</strong>을 챙기면 좋아요.</li>
</ul>

<div class="box"><span class="h">해파리 쏘임 체크리스트</span>
<ol>
<li>해파리 출현 정보 확인</li>
<li>쏘이면 바로 물 밖으로</li>
<li>민물 말고 바닷물로 씻기</li>
<li>촉수는 장갑·핀셋·카드로</li>
<li>냉찜질, 문지르지 않기</li>
<li>숨참·전신 증상은 즉시 119</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>식초는 절대 쓰면 안 되나요?</dt>
<dd>열대 바다의 상자해파리처럼 식초가 권장되는 해파리도 있어요. 하지만 우리 바다에서 흔한 일부 해파리에는 오히려 해로울 수 있어 종류를 모르면 쓰지 않는 편이 안전해요. 해수욕장 의무실 안내를 따라요.</dd>
<dt>아이가 해변에 떠밀려 온 해파리를 만졌어요.</dt>
<dd>죽은 해파리도 쏠 수 있어요. 쏘였을 때와 같이 바닷물로 씻고 증상을 지켜봐요.</dd>
<dt>연고를 발라도 되나요?</dt>
<dd>가려움과 염증에 의사가 스테로이드 연고나 먹는 항히스타민제를 권하기도 해요. 증상이 심하면 진료를 받아요.</dd>
</dl>
