<p class="lead">콜린은 비타민은 아니지만 몸에 꼭 필요한 영양소예요. 우리 몸이 조금 만들 수 있지만 충분하지 않아 음식으로 먹어야 해요. 특히 임신 중에는 아기의 뇌와 척수 발달에 쓰여 더 많이 필요한데, 임신부용 종합비타민에는 거의 들어 있지 않은 경우가 많아요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>미국 기준 성인 충분섭취량은 하루 <strong>남성 550mg, 여성 425mg</strong>이에요.</li>
<li><strong>달걀노른자, 간, 고기, 생선, 콩</strong>에 많아요. 달걀 1개에 약 150mg이 들어 있어요.</li>
<li><strong>임신부와 수유부</strong>는 필요량이 늘어요. 종합비타민에 콜린이 얼마나 들었는지 확인해요.</li>
<li>콜린이 부족하면 <strong>간에 지방이 쌓일 수 있어요.</strong></li>
</ul></div>

<h2>콜린이 하는 일</h2>
<ul>
<li><strong>세포막:</strong> 세포막의 주성분인 포스파티딜콜린(레시틴)을 만들어요.</li>
<li><strong>신경전달물질:</strong> 기억과 근육 움직임에 관여하는 <strong>아세틸콜린</strong>의 재료예요.</li>
<li><strong>간의 지방 수송:</strong> 간에서 지방을 혈액으로 내보내는 데 필요해요. 부족하면 지방이 간에 쌓여요.</li>
<li><strong>메틸기 공급:</strong> 엽산, B12와 함께 호모시스테인 대사와 유전자 조절에 쓰여요.</li>
</ul>

<h2>하루에 얼마나</h2>

<h2>많이 든 음식</h2>

<thead><tr><th>식품(1회 분량)</th><th class="num">콜린(대략)</th></tr></thead>

<p>콜린은 대부분 <strong>달걀노른자</strong>에 있어요. 흰자만 먹으면 콜린은 거의 먹지 못해요. 채식을 한다면 콩, 두부, 퀴노아, 브로콜리, 견과류를 꾸준히 챙겨요.</p>

<h2>임신과 수유 중에 중요한 이유</h2>
<ul>
<li>콜린은 아기의 <strong>신경관과 뇌 발달</strong>에 쓰이고, 태반을 통해 아기에게 많이 전달돼요.</li>
<li>엄마의 콜린이 넉넉할 때 아기의 인지 발달에 도움이 될 수 있다는 연구가 있지만, 아직 연구가 더 필요해요.</li>
<li>많은 임신부가 충분섭취량보다 적게 먹는다는 조사 결과가 있어요.</li>
<li>임신부용 종합비타민에 콜린이 거의 없거나 적게 든 경우가 많아요. 달걀, 고기, 생선, 콩으로 챙기고, 부족하면 산부인과와 상의해요.</li>
</ul>

<h2>부족하면</h2>
<p>콜린이 부족한 식사를 오래 하면 <strong>간에 지방이 쌓이고 간 수치가 오르거나</strong>, 근육 손상이 생길 수 있어요. 장기간 정맥영양을 받는 사람에게서 확인된 문제예요. 폐경 전 여성은 여성호르몬 덕분에 몸에서 콜린을 조금 더 만들 수 있어, 남성과 폐경 후 여성이 부족에 더 예민하다고 알려져 있어요.</p>

<h2>많이 먹으면</h2>
<ul>
<li>보충제로 아주 많이 먹으면 <strong>몸에서 비린내</strong>가 나고, 땀, 침 흘림, 혈압 저하, 설사가 생길 수 있어요.</li>
<li>장내 세균이 콜린을 분해하면서 만드는 TMAO가 심혈관 질환과 관련 있다는 관찰 연구가 있지만, 음식으로 먹는 콜린과 원인 관계는 분명하지 않아요.</li>
</ul>

<h2>'뇌 영양제' 콜린 제품</h2>
<p>콜린알포세레이트, 시티콜린 같은 성분은 기억력 개선이나 치매 예방을 내세워 쓰이지만, 건강한 사람이나 경도인지장애가 있는 사람에게 효과가 충분히 확인되지 않았어요. 국내에서도 효과 근거에 대한 논란으로 건강보험 적용이 줄었어요. 기억력이 걱정되면 원인을 먼저 확인하는 것이 좋아요.</p>

<div class="box"><span class="h">콜린 챙기기</span>
<ol>
<li>달걀은 노른자까지 먹기</li>
<li>고기·생선·콩을 끼니마다 한 가지</li>
<li>브로콜리 같은 채소 곁들이기</li>
<li>임신 중이면 종합비타민 콜린 함량 확인</li>
<li>고용량 보충제는 필요성 따져 보기</li>
<li>기억력 걱정은 진료로 원인 확인</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>달걀을 하루에 몇 개까지 먹어도 되나요?</dt>
<dd>건강한 사람은 하루 1개 정도는 콜레스테롤 걱정 없이 먹어도 된다는 연구가 많아요. 당뇨나 이상지질혈증이 있다면 전체 식사의 포화지방과 함께 의사와 상의해요.</dd>
<dt>레시틴 보충제가 콜린 보충제인가요?</dt>
<dd>레시틴에는 포스파티딜콜린이 들어 있어 콜린을 일부 공급해요. 다만 제품마다 함량이 달라 라벨을 확인해요.</dd>
<dt>지방간이 있으면 콜린을 먹어야 하나요?</dt>
<dd>대부분의 지방간은 과체중, 음주, 당뇨와 관련 있고, 콜린 부족 때문은 드물어요. 체중과 음주 관리가 먼저예요.</dd>
</dl>
