  data-title="담석증: 검진에서 발견된 담석, 꼭 수술해야 할까? 통증 신호와 합병증"
  data-thumb="80%|평생 무증상 비율"
  data-summary="건강검진 초음파에서 담석이 발견되는 사람은 많지만, 대부분은 평생 증상 없이 지내요. 무증상 담석을 지켜보는 이유, 기름진 식사 뒤 오른쪽 윗배 통증 같은 담석 통증의 특징, 담낭염·황달·췌장염 같은 합병증, 복강경 수술과 수술 뒤 생활, 담낭 용종과의 차이를 정리했어요."
  data-tags="담석,담낭,담낭염,복통,질병">
<p class="lead">검진 결과지에 '담낭 결석'이라는 말을 보면 당장 수술해야 하나 걱정되지요. 하지만 증상 없는 담석의 상당수는 평생 조용히 지내요. 중요한 건 담석이 있다는 사실보다, 담석이 '말썽을 부리기 시작했는지'를 알아채는 거예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>증상 없는 담석은 대부분 <strong>수술하지 않고 지켜봐요.</strong> 해마다 일부만 증상이 생겨요.</li>
<li>담석 통증은 <strong>명치나 오른쪽 윗배</strong>가 30분~몇 시간 심하게 아프고, 오른쪽 어깨나 등으로 뻗치기도 해요.</li>
<li><strong>열, 황달, 멈추지 않는 통증</strong>은 담낭염·담관염·췌장염일 수 있어 바로 진료를 받아요.</li>
<li>증상이 있는 담석은 <strong>복강경 담낭절제술</strong>이 표준 치료예요.</li>
</ul></div>

<h2>담석은 왜 생길까</h2>
<p>담낭(쓸개)은 간에서 만든 쓸개즙을 모아 두었다가, 기름진 음식을 먹으면 짜내 소화를 도와요. 쓸개즙의 콜레스테롤이 너무 많거나 담낭이 잘 비워지지 않으면 결정이 뭉쳐 돌이 돼요.</p>
<ul>
<li>여성, 40대 이후, 임신, 비만</li>
<li><strong>급격한 체중 감량</strong>(초저열량 다이어트, 비만 수술 뒤)</li>
<li>당뇨, 이상지질혈증, 간경변, 일부 혈액 질환</li>
<li>가족력</li>
</ul>

<h2>증상 없는 담석</h2>
<p>검진에서 우연히 발견된 담석의 약 <strong>80%</strong>는 평생 증상이 없거나 아주 드물게 생긴다고 알려져 있어요. 해마다 약 1~2%만 증상이나 합병증이 생겨요. 그래서 대부분은 수술 없이 지켜봐요. 다만 다음처럼 위험이 높은 경우에는 증상이 없어도 수술을 고려해요.</p>
<ul>
<li>담석이 아주 큰 경우(대략 3cm 이상)</li>
<li>담낭 벽이 석회화된 경우(도자기 담낭)</li>
<li>담낭 용종이 함께 있거나 담낭암 위험이 높은 경우</li>
<li>의료기관에서 멀리 떨어진 곳에 오래 머물 예정이거나, 장기 이식을 앞둔 경우 등</li>
</ul>

<h2>담석 통증의 특징</h2>
<div class="tbl"><table>
<thead><tr><th>특징</th><th>설명</th></tr></thead>
<tbody>
<tr><td>위치</td><td>명치 또는 오른쪽 갈비뼈 아래</td></tr>
<tr><td>양상</td><td>쥐어짜듯 심하게 아프고, 자세를 바꿔도 나아지지 않아요</td></tr>
<tr><td>시간</td><td>30분 이상 계속되다 몇 시간 안에 가라앉아요</td></tr>
<tr><td>퍼지는 곳</td><td>오른쪽 어깨, 날개뼈 아래, 등</td></tr>
<tr><td>계기</td><td>기름진 식사 뒤, 밤에 잘 생겨요</td></tr>
<tr><td>함께 오는 증상</td><td>구역질, 구토</td></tr>
</tbody>
<caption>대한소화기학회·대한간학회 담석 건강 정보를 바탕으로 정리</caption></table></div>
<p>단순한 소화불량, 더부룩함, 트림은 담석보다 다른 원인일 때가 많아요. 이런 증상만으로 담낭을 떼어 내면 증상이 그대로 남을 수 있어요.</p>

<h2>합병증</h2>
<div class="tbl"><table>
<thead><tr><th>합병증</th><th>신호</th></tr></thead>
<tbody>
<tr><td>급성 담낭염</td><td>오른쪽 윗배 통증이 <strong>6시간 넘게</strong> 계속되고 열이 나요. 누르면 아파요</td></tr>
<tr><td>총담관 결석·담관염</td><td>눈과 피부가 노래지고(황달), 소변이 진하고, 오한과 고열이 와요</td></tr>
<tr><td>담석성 췌장염</td><td>윗배 가운데에서 등으로 뚫는 듯한 심한 통증, 반복되는 구토</td></tr>
</tbody></table></div>
<div class="box warn"><span class="h">바로 응급실에 가야 할 때</span>
<ul>
<li>배가 몇 시간 넘게 계속 심하게 아파요.</li>
<li><strong>열과 오한</strong>이 함께 있어요.</li>
<li>눈 흰자위나 피부가 <strong>노래졌어요.</strong></li>
<li>물도 못 마실 만큼 구토가 계속돼요.</li>
</ul>
<p>담관염은 빠르게 패혈증으로 진행할 수 있어 서둘러야 해요. 어르신이나 당뇨가 있는 사람은 통증이 약하게 나타날 수 있어 열과 기운 저하에도 주의해요.</p></div>

<h2>치료</h2>
<ul>
<li><strong>복강경 담낭절제술:</strong> 증상이 있는 담석의 표준 치료예요. 배에 작은 구멍 몇 개를 내어 담낭을 떼어 내요. 보통 며칠 안에 퇴원해요.</li>
<li><strong>내시경 치료(ERCP):</strong> 담관에 내려온 돌은 내시경으로 꺼내요.</li>
<li><strong>녹이는 약(우르소데옥시콜산):</strong> 작은 콜레스테롤 담석에 일부 효과가 있지만 오래 먹어야 하고, 끊으면 다시 생기는 경우가 많아요. 수술이 어려운 사람 등에게 제한적으로 써요.</li>
</ul>

<h2>담낭을 떼어 내도 괜찮을까</h2>
<p>담낭이 없어도 쓸개즙은 간에서 계속 만들어져 장으로 흘러가요. 대부분 식사를 평소처럼 할 수 있어요. 일부는 수술 뒤 한동안 기름진 음식을 먹으면 설사를 하는데, 대개 시간이 지나며 줄어요. 처음 몇 주는 기름진 음식을 조금씩 늘려 가요.</p>

<h2>담낭 용종과는 달라요</h2>
<p>담낭 용종은 담낭 벽에 붙은 작은 혹이에요. 대부분 콜레스테롤 용종으로 해롭지 않지만, <strong>1cm 이상</strong>이거나 빠르게 커지면 암 가능성 때문에 수술을 권해요. 그보다 작으면 크기에 따라 정기적으로 초음파로 지켜봐요.</p>

<h2>예방에 도움이 되는 생활</h2>
<ul>
<li>체중은 천천히 줄여요. 한 주에 0.5~1kg 정도가 적당해요.</li>
<li>끼니를 거르지 않고 규칙적으로 먹어요. 오래 굶으면 담낭이 비워지지 않아요.</li>
<li>식이섬유가 많은 채소, 통곡물을 챙기고, 포화지방이 많은 음식을 줄여요.</li>
<li>규칙적으로 운동해요.</li>
</ul>

<div class="box"><span class="h">담석 체크리스트</span>
<ol>
<li>무증상 담석은 증상 신호를 알고 지켜보기</li>
<li>기름진 식사 뒤 오른쪽 윗배 통증 기록하기</li>
<li>열·황달·6시간 넘는 통증은 즉시 진료</li>
<li>증상이 반복되면 외과 상담</li>
<li>담낭 용종은 크기 따라 정기 초음파</li>
<li>급격한 다이어트 피하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>담석이 있으면 기름진 음식을 아예 못 먹나요?</dt>
<dd>증상이 없다면 특별히 제한할 필요는 없어요. 다만 기름진 음식을 먹은 뒤 통증이 생긴 적이 있다면 양을 줄이고 진료를 받아요.</dd>
<dt>담석을 녹이는 민간요법이 있나요?</dt>
<dd>올리브유·레몬즙을 마시는 '담석 청소' 같은 방법은 효과가 확인되지 않았어요. 변에 나오는 덩어리는 대부분 기름이 뭉친 거예요. 오히려 설사와 탈수를 일으킬 수 있어요.</dd>
<dt>담석이 담낭암이 되나요?</dt>
<dd>담석이 있으면 담낭암 위험이 조금 높아지지만, 담석이 있는 사람 대부분은 담낭암이 생기지 않아요. 큰 담석, 도자기 담낭, 큰 용종처럼 위험이 높은 경우에 수술을 고려해요.</dd>
</dl>
