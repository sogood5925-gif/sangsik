<template data-id="dehydration" data-cat="hea" data-date="2026.09.30"
  data-title="설사·구토와 탈수: 경구수액을 조금씩 자주, 굶기지 않기, 병원에 가야 할 신호"
  data-thumb="5mL|1~2분마다 한 모금"
  data-summary="장염으로 설사와 구토가 이어지면 가장 먼저 조심할 것은 탈수예요. 탈수 정도를 알아보는 신호, 경구수액과 이온음료·주스의 차이, 토하는 아이에게 수분을 주는 요령, 굶기지 않고 먹이는 법, 지사제를 조심해야 하는 경우, 노로바이러스를 가족에게 옮기지 않는 소독법을 정리했어요."
  data-tags="탈수,설사,구토,장염,경구수액,건강상식">
<p class="lead">장염에 걸리면 설사와 구토보다 무서운 게 몸의 물과 전해질이 빠져나가는 탈수예요. 특히 어린아이와 어르신은 탈수가 빨리 와요. 대부분은 집에서 <strong>조금씩 자주</strong> 수분을 채우는 것만으로 이겨 낼 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>탈수를 막는 가장 좋은 음료는 <strong>경구수액(ORS)</strong>이에요. 약국에서 살 수 있어요.</li>
<li>토할 때는 <strong>한 번에 많이</strong> 마시지 말고 <strong>1~2분마다 한 모금</strong>씩 줘요.</li>
<li>구토가 가라앉으면 <strong>평소 먹던 음식</strong>을 조금씩 먹여요. 오래 굶기지 않아요.</li>
<li><strong>피 섞인 설사, 고열, 소변이 크게 줄거나 축 처짐</strong>이 있으면 진료를 받아요.</li>
</ul></div>

<h2>탈수 정도 알아보기</h2>
<div class="tbl"><table>
<thead><tr><th>정도</th><th>신호</th></tr></thead>
<tbody>
<tr><td>없음~가벼움</td><td>평소처럼 놀고, 소변이 조금 줄었어요. 입이 약간 마를 수 있어요</td></tr>
<tr><td>중간</td><td>소변이 크게 줄고(아기 기저귀가 6~8시간 넘게 마름), 입과 혀가 마르고, 울어도 눈물이 적어요. 보채거나 기운이 없어요. 아기는 머리 숫구멍이 들어가 보여요</td></tr>
<tr><td>심함</td><td>축 처져 깨우기 어렵고, 손발이 차고 얼룩덜룩하며, 소변이 거의 없어요. 피부를 집었다 놓으면 천천히 돌아가요 → <strong>응급 진료</strong></td></tr>
</tbody>
<caption>세계보건기구(WHO) 설사 관리 지침, 대한소아청소년과학회 급성 위장관염 안내를 바탕으로 정리</caption></table></div>
<p>어른도 어지럽고, 일어설 때 핑 돌고, 소변이 진하고 적어지면 탈수 신호예요.</p>

<h2>어떤 음료가 좋을까</h2>
<div class="tbl"><table>
<thead><tr><th>음료</th><th>평가</th></tr></thead>
<tbody>
<tr><td>경구수액(ORS)</td><td><strong>가장 좋아요.</strong> 물, 포도당, 나트륨, 칼륨이 흡수가 잘 되는 비율로 들어 있어요</td></tr>
<tr><td>이온음료(스포츠음료)</td><td>가벼운 어른 장염에는 괜찮지만, 당이 많고 나트륨이 적어 아이의 탈수 치료용으로는 부족해요. 물을 반쯤 섞으면 나아요</td></tr>
<tr><td>물</td><td>가벼운 경우 괜찮지만 물만 많이 마시면 전해질이 부족해질 수 있어요</td></tr>
<tr><td>과일 주스, 탄산음료</td><td>당이 많아 설사를 악화시킬 수 있어요. 피해요</td></tr>
<tr><td>모유, 분유</td><td>아기는 계속 먹여요. 모유는 오히려 도움이 돼요</td></tr>
</tbody></table></div>

<h2>토할 때 수분 주는 요령</h2>
<ol>
<li>토한 뒤 10~15분 정도 속을 쉬게 해요.</li>
<li>작은 숟가락이나 주사기로 경구수액을 <strong>5mL(한 숟가락)씩 1~2분마다</strong> 줘요.</li>
<li>토하지 않으면 양을 조금씩 늘려요.</li>
<li>또 토하면 다시 쉬었다가 더 적은 양부터 시작해요.</li>
<li>설사를 한 번 할 때마다 아이는 체중 1kg당 약 10mL, 어른은 한두 컵 정도를 더 마시게 해요.</li>
</ol>
<p>한 번에 많이 마시면 위가 늘어나 다시 토하기 쉬워요. '조금씩 자주'가 가장 중요해요.</p>

<h2>먹는 것</h2>
<ul>
<li>구토가 가라앉으면 <strong>평소 먹던 음식</strong>을 조금씩 먹여요. 오래 굶기면 장 점막 회복이 늦어져요.</li>
<li>죽, 밥, 삶은 감자, 바나나, 빵, 살코기, 요구르트처럼 부담이 적은 음식부터 시작해요.</li>
<li>기름진 음식, 단 음식, 우유를 많이 먹으면 설사가 늘 수 있어 처음에는 줄여요.</li>
<li>예전처럼 흰죽만 오래 먹이는 것은 영양이 부족해 권하지 않아요.</li>
</ul>

<h2>지사제와 약</h2>
<ul>
<li>로페라마이드 같은 지사제는 <strong>피 섞인 설사, 고열이 있을 때, 어린아이</strong>에게는 쓰지 않아요. 세균이 몸 밖으로 나가는 것을 막아 병을 악화시킬 수 있어요.</li>
<li>대부분의 장염은 바이러스가 원인이라 항생제가 필요 없어요.</li>
<li>구토가 심한 아이에게 의사가 구토 억제제를 처방하기도 해요.</li>
<li>프로바이오틱스는 일부 연구에서 설사 기간을 조금 줄였지만 결과가 엇갈려요.</li>
</ul>

<div class="box warn"><span class="h">바로 진료가 필요한 신호</span>
<ul>
<li>대변에 <strong>피나 점액</strong>이 섞여 나와요.</li>
<li><strong>39°C 이상 고열</strong>, 심한 배 통증(특히 오른쪽 아랫배)</li>
<li>물도 못 마실 만큼 <strong>구토가 계속</strong>돼요. 초록색 구토를 해요.</li>
<li>소변이 크게 줄고 축 처지거나, 중간~심한 탈수 신호가 있어요.</li>
<li>6개월 미만 아기, 어르신, 만성질환이 있는 사람의 심한 설사</li>
<li>설사가 1주일 넘게 이어져요.</li>
</ul></div>

<h2>가족에게 옮기지 않으려면</h2>
<ul>
<li>노로바이러스는 아주 적은 양으로도 옮고, <strong>알코올 손 소독제가 잘 듣지 않아요.</strong> 흐르는 물에 비누로 30초 이상 손을 씻어요.</li>
<li>토사물과 설사가 묻은 곳은 장갑과 마스크를 쓰고 치운 뒤, <strong>물에 희석한 염소 소독제(락스)</strong>로 닦아요. 희석 비율은 제품 표시를 따라요.</li>
<li>오염된 옷과 이불은 따로 뜨거운 물로 빨아요.</li>
<li>증상이 있는 동안과 나은 뒤 2~3일은 음식을 만들지 않아요.</li>
<li>변기 뚜껑을 닫고 물을 내려요.</li>
</ul>

<div class="box"><span class="h">장염 돌보기 체크리스트</span>
<ol>
<li>경구수액을 집에 상비하기</li>
<li>토하면 1~2분마다 한 모금</li>
<li>구토 가라앉으면 평소 음식 조금씩</li>
<li>주스·탄산음료 피하기</li>
<li>피 설사·고열·소변 감소는 진료</li>
<li>비누 손 씻기, 락스 희석 소독</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>경구수액을 집에서 만들 수 있나요?</dt>
<dd>세계보건기구는 끓여 식힌 물 1L에 설탕 6찻숟갈, 소금 1/2찻숟갈을 넣는 방법을 소개하지만, 비율이 틀리면 오히려 해로울 수 있어요. 가능하면 약국의 경구수액 제품을 써요.</dd>
<dt>아이가 경구수액 맛을 싫어해요.</dt>
<dd>차갑게 하거나 얼음 조각으로 만들어 주면 잘 먹는 경우가 있어요. 조금이라도 꾸준히 먹이는 게 중요해요.</dd>
<dt>장염 뒤 유제품을 먹으면 설사가 계속돼요.</dt>
<dd>장염 뒤 일시적으로 유당을 잘 소화하지 못할 수 있어요. 며칠~몇 주 유제품을 줄였다가 조금씩 다시 먹어 봐요.</dd>
</dl>
