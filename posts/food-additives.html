  data-title="식품첨가물 오해와 사실: 일일섭취허용량의 뜻, MSG·아질산나트륨·보존료 제대로 보기"
  data-thumb="ADI|일일섭취허용량"
  data-summary="식품첨가물이라는 말만 들어도 꺼려지지만, 첨가물은 평생 먹어도 해가 없는 양을 기준으로 사용량이 정해져 있어요. 첨가물을 쓰는 이유와 안전성 평가 방식, 일일섭취허용량의 뜻, MSG와 아질산나트륨·보존료·색소에 대해 알려진 사실, '무첨가' 표시를 읽는 법, 첨가물보다 더 신경 쓸 것을 정리했어요."
  data-tags="식품첨가물,MSG,보존료,아질산나트륨,생활정보">
<p class="lead">식품 포장지 뒷면에 적힌 낯선 이름들은 괜히 불안하게 느껴져요. 그런데 식품첨가물은 음식이 상하지 않게 하고, 맛과 모양을 지키고, 식중독을 막는 역할을 해요. 무조건 피하기보다 어떻게 관리되는지 알면 장보기가 한결 가벼워져요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>첨가물은 <strong>평생 매일 먹어도 해가 없는 양(일일섭취허용량)</strong>을 기준으로 쓰는 양이 정해져요.</li>
<li>우리나라 사람들이 실제로 먹는 양은 대부분 <strong>허용량보다 훨씬 적은 수준</strong>으로 조사돼요.</li>
<li>'무첨가' 표시는 <strong>특정 첨가물을 넣지 않았다는 뜻</strong>이지 더 건강하다는 보장은 아니에요.</li>
<li>첨가물보다 <strong>나트륨, 당, 가공육을 얼마나 자주 먹는지</strong>가 건강에 더 큰 영향을 줘요.</li>
</ul></div>

<h2>첨가물은 왜 넣을까</h2>
<div class="tbl"><table>
<thead><tr><th>용도</th><th>예</th><th>역할</th></tr></thead>
<tbody>
<tr><td>보존료</td><td>소브산, 안식향산</td><td>곰팡이와 세균이 자라는 것을 늦춰요</td></tr>
<tr><td>산화방지제</td><td>비타민 C, 비타민 E(토코페롤)</td><td>기름이 산패하고 색이 변하는 것을 막아요</td></tr>
<tr><td>발색제</td><td>아질산나트륨</td><td>햄·소시지의 색을 지키고 보툴리누스균을 억제해요</td></tr>
<tr><td>향미증진제</td><td>L-글루탐산나트륨(MSG)</td><td>감칠맛을 내요</td></tr>
<tr><td>감미료</td><td>수크랄로스, 아스파탐, 스테비아</td><td>적은 열량으로 단맛을 내요</td></tr>
<tr><td>유화제·증점제</td><td>레시틴, 카라기난, 잔탄검</td><td>물과 기름을 섞고 걸쭉하게 만들어요</td></tr>
<tr><td>착색료</td><td>카로틴, 캐러멜색소, 타르색소</td><td>색을 내요</td></tr>
</tbody>
<caption>식품의약품안전처 「식품첨가물의 기준 및 규격」과 식품첨가물 정보를 바탕으로 정리</caption></table></div>

<h2>안전성은 어떻게 정할까</h2>
<ol>
<li>동물 실험 등으로 <strong>아무 영향이 나타나지 않는 양</strong>을 찾아요.</li>
<li>사람과 동물의 차이, 사람 사이의 차이를 고려해 보통 <strong>100분의 1</strong>로 낮춰요. 이것이 <strong>일일섭취허용량(ADI)</strong>이에요.</li>
<li>식품별로 쓸 수 있는 첨가물과 최대 사용량을 정해, 여러 식품을 먹어도 허용량을 넘지 않게 관리해요.</li>
<li>새로운 연구가 나오면 국제기구(FAO/WHO 합동 식품첨가물 전문가위원회, JECFA)와 각국이 다시 평가해요.</li>
</ol>
<p>허용량은 '넘으면 바로 해롭다'는 선이 아니라 넉넉한 여유를 둔 관리 기준이에요. 어쩌다 하루 조금 넘는 것보다 오랫동안 꾸준히 먹는 양이 중요해요.</p>

<h2>자주 걱정하는 첨가물</h2>
<ul>
<li><strong>MSG(L-글루탐산나트륨):</strong> 다시마, 토마토, 치즈에 있는 감칠맛 성분과 같은 물질이에요. 국제기구는 일일섭취허용량을 따로 정하지 않을 만큼 안전하다고 평가했어요. 먹고 두통이 난다는 사람들도 있지만 잘 설계된 실험에서는 일관된 관련이 나타나지 않았어요. 다만 나트륨이 들어 있어요.</li>
<li><strong>아질산나트륨:</strong> 햄·소시지에서 치명적인 보툴리누스 식중독을 막아요. 가공육이 대장암 위험을 높인다는 평가가 있는데, 아질산염을 포함한 가공 과정 전체의 영향으로 봐요. 첨가물 하나보다 <strong>가공육을 얼마나 자주 먹는지</strong>를 줄이는 게 핵심이에요.</li>
<li><strong>보존료:</strong> 보존료가 없으면 식품이 빨리 상해 오히려 식중독 위험이 커질 수 있어요. 사용 가능한 식품과 양이 정해져 있어요.</li>
<li><strong>타르색소:</strong> 어린이 기호식품 품질인증 기준 등에서 사용을 제한하고 있어요. 일부 색소와 아이의 과잉 행동에 관한 연구가 있어 유럽은 경고 문구를 붙여요.</li>
<li><strong>감미료:</strong> 아스파탐은 국제암연구소가 2023년 '발암 가능(2B)'으로 분류했지만, 같은 해 JECFA는 기존 허용량(체중 1kg당 40mg)을 유지했어요.</li>
</ul>

<h2>'무첨가' 표시 읽기</h2>
<div class="tbl"><table>
<thead><tr><th>표시</th><th>뜻</th><th>살펴볼 점</th></tr></thead>
<tbody>
<tr><td>○○ 무첨가</td><td>그 첨가물을 넣지 않았어요</td><td>다른 첨가물이나 비슷한 역할의 원료가 들어갔을 수 있어요</td></tr>
<tr><td>보존료 무첨가</td><td>보존료를 넣지 않았어요</td><td>유통기한이 짧을 수 있어요. 보관 방법을 잘 지켜요</td></tr>
<tr><td>MSG 무첨가</td><td>MSG를 넣지 않았어요</td><td>효모 추출물 등 감칠맛 원료가 들어가기도 해요</td></tr>
</tbody>
<caption>식품의약품안전처 「식품 등의 표시·광고에 관한 법률」 무첨가 표시 관련 안내를 바탕으로 정리</caption></table></div>
<p>식약처는 원래 쓸 수 없는 첨가물을 '무첨가'라고 광고하거나, 첨가물을 나쁜 것처럼 오해하게 하는 표시를 제한하고 있어요.</p>

<h2>그래도 줄이고 싶다면</h2>
<ul>
<li>원재료명이 짧은 식품, 신선 식품을 더 자주 골라요.</li>
<li>햄·소시지는 끓는 물에 살짝 데치면 기름과 일부 첨가물이 줄어요.</li>
<li>라면, 과자, 가공육 같은 식품은 첨가물보다 <strong>나트륨·당·지방</strong>이 더 큰 문제예요. 영양성분표를 함께 봐요.</li>
</ul>

<div class="box note"><span class="h">개인차가 있어요</span>
<p>아황산류에 천식이 악화되거나, 특정 색소에 두드러기가 나는 사람이 드물게 있어요. 먹을 때마다 같은 증상이 반복되면 원재료명을 기록해 두고 의사와 상의해요.</p></div>

<div class="box"><span class="h">첨가물 체크리스트</span>
<ol>
<li>원재료명은 알레르기와 개인 민감 성분 위주로</li>
<li>'무첨가' 문구보다 영양성분표 보기</li>
<li>가공육은 먹는 횟수 줄이기</li>
<li>보존료 없는 제품은 보관법 지키기</li>
<li>같은 증상이 반복되면 기록하고 상담</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>천연 첨가물은 합성 첨가물보다 안전한가요?</dt>
<dd>천연이냐 합성이냐보다 물질과 양이 중요해요. 둘 다 같은 방식으로 안전성을 평가하고 사용 기준을 정해요.</dd>
<dt>아이 간식은 따로 기준이 있나요?</dt>
<dd>어린이 기호식품 품질인증 제품은 타르색소를 쓰지 못하게 하고, 고열량·저영양 식품은 학교 매점 판매와 광고를 제한해요.</dd>
<dt>여러 첨가물을 함께 먹으면 위험이 커지나요?</dt>
<dd>여러 첨가물을 함께 먹는 영향도 연구되고 있지만, 현재 사용 수준에서 문제가 된다는 확실한 근거는 없어요. 가공식품 비중을 줄이면 자연스럽게 해결돼요.</dd>
</dl>
