  data-title="하지정맥류: 다리가 무겁고 붓는 이유, 압박스타킹과 시술을 고르는 기준"
  data-thumb="0.5초|역류 판단 기준"
  data-summary="하지정맥류는 다리 정맥의 판막이 망가져 피가 거꾸로 흐르며 혈관이 늘어나는 병이에요. 흔한 증상과 단계, 초음파 검사로 역류를 확인하는 법, 압박스타킹과 생활 습관, 레이저·고주파·경화요법 등 치료를 고르는 기준, 그리고 한쪽 다리가 갑자기 붓는 혈전증과 구별하는 법을 정리했어요."
  data-tags="하지정맥류,다리부종,압박스타킹,혈관,질병">
<p class="lead">오후만 되면 다리가 붓고 무거운데, 종아리에 푸른 혈관이 구불구불 튀어나와 있다면 하지정맥류일 수 있어요. 미용 문제로만 여기기 쉽지만, 오래 두면 피부가 검게 변하고 상처가 잘 낫지 않기도 해요. 반대로 모든 혈관이 시술 대상은 아니라서, 정확한 검사로 판단하는 게 중요해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>하지정맥류는 다리 정맥의 <strong>판막이 망가져 피가 역류</strong>하면서 생겨요.</li>
<li>진단은 서서 하는 <strong>도플러 초음파</strong>로 역류가 있는지 확인해요.</li>
<li>증상이 가벼우면 <strong>압박스타킹, 걷기, 다리 올리기</strong>로 관리하고, 역류가 뚜렷하고 증상이 있으면 시술을 고려해요.</li>
<li><strong>한쪽 다리가 갑자기 붓고 아프면</strong> 정맥류가 아니라 혈전일 수 있어 바로 진료를 받아요.</li>
</ul></div>

<h2>왜 생길까</h2>
<p>다리의 피는 중력을 거슬러 심장으로 올라가야 해요. 정맥 속에는 피가 아래로 되돌아가지 않게 하는 <strong>판막</strong>이 있고, 종아리 근육이 펌프처럼 피를 밀어 올려요. 판막이 약해져 제대로 닫히지 않으면 피가 아래로 고이고, 정맥이 늘어나 구불구불 튀어나와요.</p>
<ul>
<li><strong>가족력</strong>이 가장 큰 요인이에요.</li>
<li>여성, 임신, 나이</li>
<li>오래 서 있거나 앉아 있는 직업(교사, 미용사, 판매직, 사무직)</li>
<li>비만, 운동 부족</li>
</ul>

<h2>증상과 단계</h2>
<ul>
<li>다리가 <strong>무겁고 뻐근하며</strong>, 오후나 저녁에 심해져요.</li>
<li>발목과 종아리가 붓고, 밤에 쥐가 자주 나요.</li>
<li>가렵거나 화끈거려요.</li>
<li>오래되면 발목 주변 피부가 갈색으로 변하고, 딱딱해지고, 습진이나 궤양이 생겨요.</li>
</ul>
<div class="tbl"><table>
<thead><tr><th>단계</th><th>모습</th></tr></thead>
<tbody>
<tr><td>C1</td><td>거미줄 모양 실핏줄, 망상정맥(지름 3mm 미만)</td></tr>
<tr><td>C2</td><td>튀어나온 정맥류(지름 3mm 이상)</td></tr>
<tr><td>C3</td><td>부종</td></tr>
<tr><td>C4</td><td>피부 변색, 습진, 피부가 딱딱해짐</td></tr>
<tr><td>C5</td><td>나은 궤양 흔적</td></tr>
<tr><td>C6</td><td>현재 궤양</td></tr>
</tbody>
<caption>국제 만성 정맥질환 분류(CEAP)를 바탕으로 정리</caption></table></div>

<h2>검사</h2>
<p>서 있는 자세에서 <strong>도플러 초음파</strong>로 정맥을 보며 종아리를 눌렀다 놓아, 피가 거꾸로 흐르는 시간을 재요. 표재정맥에서 대략 <strong>0.5초 이상</strong> 역류하면 의미 있는 역류로 봐요. 실핏줄이 보인다고 모두 역류가 있는 것은 아니에요. 검사 결과와 증상을 함께 보고 치료를 정해요.</p>

<h2>생활 관리와 압박스타킹</h2>
<ul>
<li><strong>압박스타킹:</strong> 발목에서 가장 강하고 위로 갈수록 약하게 눌러 피가 올라가도록 도와요. 아침에 일어나 붓기 전에 신고, 잘 때는 벗어요. 압력 단계와 크기는 진료 후 맞추는 게 좋아요.</li>
<li><strong>걷기와 종아리 운동:</strong> 종아리 근육 펌프를 움직여요. 앉아 있을 때도 발끝을 들었다 내렸다 해요.</li>
<li><strong>다리 올리기:</strong> 쉬거나 잘 때 다리를 심장보다 조금 높게 올려요.</li>
<li>오래 서 있거나 앉아 있을 때 30분~1시간마다 자세를 바꿔요.</li>
<li>체중을 관리하고, 너무 꽉 끼는 옷과 높은 굽을 피해요.</li>
<li>뜨거운 사우나와 찜질은 혈관을 늘려 증상을 악화시킬 수 있어요.</li>
</ul>
<p>압박스타킹은 말초동맥 질환이 심한 사람에게는 해로울 수 있어요. 발이 차고 창백하거나 걸을 때 종아리가 아프다면 먼저 진료를 받아요.</p>

<h2>시술과 수술</h2>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>원리</th><th>잘 맞는 경우</th></tr></thead>
<tbody>
<tr><td>혈관 내 열폐쇄술(레이저, 고주파)</td><td>가는 관을 정맥에 넣어 열로 안쪽을 막아요</td><td>큰 표재정맥(대·소복재정맥)의 역류</td></tr>
<tr><td>의료용 접착제 폐쇄술</td><td>접착제로 정맥을 막아요. 여러 번 마취 주사가 덜 필요해요</td><td>큰 표재정맥의 역류</td></tr>
<tr><td>경화요법</td><td>약물을 주사해 작은 정맥을 굳혀 없애요</td><td>실핏줄, 망상정맥, 작은 정맥류, 시술 뒤 남은 혈관</td></tr>
<tr><td>정맥 발거술·국소 절제</td><td>늘어난 정맥을 작은 절개로 빼내요</td><td>굵게 튀어나온 곁가지 정맥</td></tr>
</tbody>
<caption>대한혈관외과학회 하지정맥류 정보, 미국혈관외과학회(SVS)·미국정맥림프학회 진료지침(2023)을 바탕으로 정리</caption></table></div>
<p>역류가 뚜렷하고 증상이나 피부 변화가 있다면 시술이 증상 개선에 효과적이에요. 반대로 역류가 없거나 증상이 거의 없는데 여러 혈관을 한꺼번에 시술하자는 권유를 받았다면, 검사 결과와 필요성을 충분히 설명 듣거나 다른 의견을 들어 보세요.</p>

<div class="box warn"><span class="h">하지정맥류가 아닐 수 있어요: 바로 진료를</span>
<ul>
<li><strong>한쪽 다리만 갑자기 붓고</strong> 아프며 뜨겁고 붉어요(심부정맥혈전증 의심).</li>
<li>다리 부종과 함께 <strong>갑자기 숨이 차거나 가슴이 아파요</strong>(폐색전증 의심). 119를 불러요.</li>
<li>튀어나온 정맥이 딱딱하고 빨갛게 아파요(표재성 혈전정맥염).</li>
<li>정맥류가 터져 피가 나요. 다리를 들어 올리고 눌러 지혈한 뒤 진료를 받아요.</li>
</ul></div>

<div class="box"><span class="h">다리 건강 체크리스트</span>
<ol>
<li>오래 서 있거나 앉을 때 1시간마다 움직이기</li>
<li>하루 30분 걷기, 발끝 들기 운동</li>
<li>쉴 때 다리 올리기</li>
<li>압박스타킹은 아침에 신고 밤에 벗기</li>
<li>시술 전 서서 하는 초음파로 역류 확인</li>
<li>한쪽 다리 갑작스런 부종·통증은 즉시 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>실핏줄이 보이면 치료해야 하나요?</dt>
<dd>거미줄 모양 실핏줄은 대부분 건강에 해롭지 않아 미용 목적의 치료예요. 다리가 무겁고 붓는 증상이 있다면 초음파로 깊은 역류가 있는지 확인해 보세요.</dd>
<dt>시술하면 다시 안 생기나요?</dt>
<dd>치료한 정맥은 좋아지지만, 체질과 생활 환경이 그대로라 다른 정맥에서 새로 생길 수 있어요. 시술 뒤에도 걷기, 체중 관리, 필요하면 압박스타킹을 이어 가요.</dd>
<dt>임신 중 생긴 정맥류는 어떻게 하나요?</dt>
<dd>임신 중에는 혈액량이 늘고 자궁이 정맥을 눌러 정맥류가 잘 생겨요. 출산 뒤 몇 달 안에 많이 좋아지니, 임신 중에는 압박스타킹과 다리 올리기로 관리하고 시술은 출산 뒤 판단해요.</dd>
</dl>
