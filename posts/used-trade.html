  data-title="중고거래 사기 예방: 가짜 안전결제 링크, 외부 메신저 유도, 계좌 조회까지"

<p class="lead">시세보다 싼 물건, 빨리 결정하라는 재촉, 앱 밖으로 대화를 옮기자는 제안. 중고거래 사기의 시작은 대개 비슷해요. 몇 가지 신호만 알아도 대부분 피할 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>가능하면 <strong>직접 만나서</strong> 물건을 확인하고 거래해요.</li>
<li>판매자가 보내 준 <strong>'안전결제' 링크는 누르지 않아요.</strong> 거래 앱 안의 결제 기능만 써요.</li>
<li>입금 전에 <strong>계좌번호와 전화번호의 사기 신고 이력</strong>을 조회해요.</li>
<li>판매자는 입금 문자만 믿지 말고 <strong>은행 앱에서 실제 입금</strong>을 확인해요.</li>
</ul></div>

<h2>자주 쓰는 사기 수법</h2>
<div class="tbl"><table>
<thead><tr><th>수법</th><th>어떻게 속이나</th><th>알아채는 신호</th></tr></thead>
<tbody>
<tr><td>선입금 후 잠적</td><td>택배로 보내 준다며 돈을 받은 뒤 연락을 끊어요</td><td>직거래를 계속 피하고, 시세보다 많이 싸요</td></tr>
<tr><td>가짜 안전결제 사이트</td><td>링크를 보내 결제하게 하고, 돈을 가로채요. "수수료 때문에 한 번 더 입금하라"며 추가로 받아 내기도 해요</td><td>문자나 메신저로 결제 링크를 보내요. 주소가 공식 앱과 조금 달라요</td></tr>
<tr><td>외부 메신저 유도</td><td>앱의 신고·차단 기능을 피하려고 다른 메신저로 옮기자고 해요</td><td>"앱 알림이 잘 안 온다"며 연락처를 달라고 해요</td></tr>
<tr><td>삼자 사기</td><td>다른 판매자의 물건을 자기 것처럼 올리고, 구매자의 돈을 진짜 판매자 계좌로 보내게 해요. 사기범은 진짜 판매자에게 다른 물건을 받아 챙겨요</td><td>입금자 이름이나 받는 사람 이름이 대화 상대와 달라요</td></tr>
<tr><td>가짜 입금 문자(판매자 대상)</td><td>입금한 것처럼 꾸민 문자를 보내 물건을 먼저 받아 가요</td><td>은행 앱에는 입금 내역이 없어요</td></tr>
<tr><td>대리 수령·퀵 요구</td><td>바쁘다며 퀵 기사나 지인을 보내 물건을 받아 가요</td><td>얼굴을 보이지 않고 결제를 미뤄요</td></tr>
</tbody>
<caption>경찰청 사이버범죄 예방 안내를 바탕으로 정리</caption></table></div>

<h2>살 때 지킬 것</h2>
<ul>
<li><strong>직거래</strong>는 사람이 많은 공공장소(지하철역, 편의점 앞 등)에서 낮에 해요.</li>
<li>물건을 켜 보고 작동, 구성품, 일련번호를 확인한 뒤 돈을 보내요.</li>
<li>택배 거래라면 거래 앱이 제공하는 <strong>결제 대금 보호(에스크로) 기능</strong>을 앱 안에서 써요.</li>
<li>시세보다 지나치게 싸면 먼저 의심해요.</li>
<li>판매자의 거래 이력, 후기, 가입 기간을 확인해요. 새로 만든 계정이 비싼 물건을 싸게 파는 경우는 조심해요.</li>
<li>"다른 사람도 사려고 한다", "지금 바로 입금해야 한다"는 재촉에 흔들리지 않아요.</li>
</ul>

<h2>거래 전 조회하기</h2>
<p>경찰청 누리집의 <strong>사이버범죄 피해 신고 이력 조회</strong>에서 계좌번호와 전화번호가 사기 신고에 쓰인 적이 있는지 확인할 수 있어요. 경찰청 앱(사이버캅)에서도 조회할 수 있어요. 조회에 나오지 않는다고 안전이 보장되지는 않지만, 나온다면 거래하지 않아요.</p>

<h2>팔 때 지킬 것</h2>
<ul>
<li>입금 확인 문자만 믿지 말고 <strong>은행 앱이나 통장에서 실제 입금</strong>을 확인한 뒤 보내요.</li>
<li>입금자 이름과 대화 상대 이름이 다르면 삼자 사기일 수 있어요. 바로 물건을 넘기지 말고 확인해요.</li>
<li>"실수로 더 보냈으니 차액을 돌려 달라"는 요청은 원래 계좌로 은행을 통해 반환 절차를 밟아요.</li>
<li>개인정보(신분증 사진, 주소)는 필요 이상으로 보내지 않아요.</li>
</ul>

<div class="box warn"><span class="h">이런 말이 나오면 멈춰요</span>
<ul>
<li>"안전결제 링크 보내 드릴게요, 여기로 결제하세요."</li>
<li>"수수료가 빠져서 결제가 안 됐어요, 한 번 더 입금해 주시면 환불돼요."</li>
<li>"앱 채팅이 불편하니 메신저로 연락 주세요."</li>
<li>"군인이라서, 해외에 있어서 직거래가 어려워요."</li>
<li>"입금자 이름은 ○○로 해 주세요."</li>
</ul></div>

<h2>피해를 입었다면</h2>
<div class="tbl"><table>
<thead><tr><th>순서</th><th>할 일</th></tr></thead>
<tbody>
<tr><td>1. 증거 보존</td><td>대화 내용, 판매 게시글, 상대 계정, 입금 내역, 링크 주소를 캡처해요. 상대가 글을 지우기 전에 해요</td></tr>
<tr><td>2. 은행 연락</td><td>돈을 보낸 은행에 바로 연락해 사기 피해를 알리고 가능한 조치를 문의해요</td></tr>
<tr><td>3. 경찰 신고</td><td>112 또는 경찰청 사이버범죄 신고시스템(ECRM)에 신고해요</td></tr>
<tr><td>4. 플랫폼 신고</td><td>거래 앱에 사기 계정을 신고해요. 추가 피해를 막을 수 있어요</td></tr>
<tr><td>5. 링크를 눌렀다면</td><td>휴대폰에 앱이 설치되지 않았는지 확인하고, 입력한 비밀번호와 카드 정보를 바꾸거나 정지해요</td></tr>
</tbody>
<caption>경찰청 사이버범죄 신고 절차를 바탕으로 정리</caption></table></div>
<p>보이스피싱과 달리 중고거래 사기는 은행에서 바로 계좌 지급정지가 되지 않는 경우도 있어요. 그래서 빠른 경찰 신고와 증거 보존이 중요해요.</p>

<div class="box"><span class="h">거래 전 체크리스트</span>
<ol>
<li>시세와 비교해 너무 싸지 않은지</li>
<li>판매자 이력·후기 확인</li>
<li>계좌·전화번호 사기 이력 조회</li>
<li>결제는 앱 안에서만, 외부 링크 누르지 않기</li>
<li>직거래는 낮에 공공장소에서</li>
<li>판매자는 은행 앱에서 입금 확인</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>상대가 신분증 사진을 보내 줬으니 믿어도 되나요?</dt>
<dd>신분증 사진은 도용되거나 위조된 경우가 많아요. 신분증보다 직거래, 앱 내 결제, 사기 이력 조회가 더 확실한 방법이에요.</dd>
<dt>소액인데 신고해도 되나요?</dt>
<dd>금액과 관계없이 신고할 수 있어요. 같은 사기범에게 여러 사람이 당한 경우가 많아 신고가 모이면 수사에 도움이 돼요.</dd>
<dt>택배 거래를 꼭 해야 한다면요?</dt>
<dd>거래 앱이 제공하는 결제 대금 보호 기능을 앱 안에서 쓰고, 물건을 받아 확인한 뒤 구매 확정을 눌러요. 판매자가 이 기능을 거부하면 거래하지 않는 게 좋아요.</dd>
</dl>
