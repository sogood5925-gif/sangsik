  data-title="아침 식사: 꼭 먹어야 할까, 연구가 말하는 것, 5분이면 차리는 균형 잡힌 아침"
  data-thumb="5분|간단한 아침 준비"
  data-summary="아침을 먹어야 건강하다는 말과 굶어도 괜찮다는 말이 함께 들려요. 아침 식사와 체중·혈당·집중력에 대한 연구 결과, 아이와 청소년에게 아침이 더 중요한 이유, 당뇨약을 먹는 사람의 주의점, 달콤한 빵과 음료 대신 단백질과 섬유질을 챙기는 방법, 5분 안에 차리는 아침 조합을 정리했어요."
  data-tags="아침식사,결식,식습관,혈당,영양소">
<p class="lead">"아침은 황제처럼"이라는 말도 있지만, 바쁜 아침에 밥을 차려 먹기란 쉽지 않아요. 우리나라 성인 셋 중 한 명 정도는 아침을 거르고, 20대는 절반 가까이 거른다는 조사도 있어요. 아침을 꼭 먹어야 할까요? 연구의 답은 생각보다 복잡하지만, 누구에게 더 중요한지, 먹는다면 무엇이 좋은지는 비교적 분명해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>어른의 경우 아침을 먹는다고 <strong>체중이 줄지는 않았어요.</strong> 하루 전체 식사의 질과 양이 더 중요해요.</li>
<li><strong>아이와 청소년</strong>은 아침을 먹으면 집중력과 영양 섭취에 도움이 된다는 연구가 많아요.</li>
<li>먹는다면 <strong>단백질 + 통곡물·과일</strong>처럼 오래 든든한 조합이 좋아요.</li>
<li><strong>당뇨약이나 인슐린</strong>을 쓰는 사람은 아침을 거르면 저혈당 위험이 있어 의사와 상의해요.</li>
</ul></div>

<h2>연구가 말하는 것</h2>
<div class="tbl"><table>
<thead><tr><th>궁금한 점</th><th>연구 결과</th></tr></thead>
<tbody>
<tr><td>아침을 먹으면 살이 빠질까</td><td>무작위 연구를 모은 분석에서 아침을 먹은 그룹이 오히려 하루 열량이 조금 더 많았고, 체중 감량 효과는 없었어요</td></tr>
<tr><td>아침을 거르면 건강에 나쁠까</td><td>관찰 연구에서 아침 결식과 비만·당뇨·심혈관 질환의 관련이 보고됐지만, 결식하는 사람의 다른 생활 습관(늦은 야식, 수면 부족, 흡연)의 영향도 커요</td></tr>
<tr><td>아이·청소년</td><td>아침을 먹는 아이는 영양소 섭취가 더 좋고, 오전 집중력과 학업에 도움이 된다는 연구가 많아요</td></tr>
<tr><td>혈당</td><td>당뇨가 있는 사람은 아침을 거르면 점심 뒤 혈당이 더 크게 오른다는 연구가 있어요</td></tr>
</tbody>
<caption>Sievert K 외, Effect of breakfast on weight and energy intake, BMJ 2019, 관련 관찰 연구와 총설을 바탕으로 정리</caption></table></div>
<p>정리하면, 아침을 먹느냐 마느냐보다 <strong>하루 식사의 규칙성과 질</strong>이 더 중요해요. 아침을 거르고 점심과 저녁을 폭식하거나, 밤늦게 야식을 먹는 패턴이라면 아침을 챙기는 것이 흐름을 바로잡는 데 도움이 될 수 있어요.</p>

<h2>아침을 먹으면 좋은 사람</h2>
<ul>
<li><strong>아이와 청소년:</strong> 성장에 필요한 영양과 오전 수업 집중에 도움이 돼요.</li>
<li><strong>당뇨약·인슐린을 쓰는 사람:</strong> 약과 식사 시간을 맞춰야 저혈당을 막을 수 있어요.</li>
<li><strong>어르신:</strong> 한 끼를 거르면 하루 단백질을 채우기 어려워요.</li>
<li><strong>오전에 운동하거나 몸을 많이 쓰는 사람</strong></li>
<li><strong>오후·저녁에 폭식하는 습관</strong>이 있는 사람</li>
</ul>

<h2>좋은 아침과 아쉬운 아침</h2>
<div class="tbl"><table>
<thead><tr><th>아쉬운 아침</th><th>이렇게 바꿔 보세요</th></tr></thead>
<tbody>
<tr><td>달콤한 빵 + 가당 커피</td><td>통밀빵 + 달걀 + 우유 넣은 커피</td></tr>
<tr><td>시리얼만 우유에</td><td>당이 적은 시리얼·오트밀 + 우유 + 견과류 + 과일</td></tr>
<tr><td>과일 주스 한 잔</td><td>통과일 + 플레인 요거트</td></tr>
<tr><td>편의점 삼각김밥 하나</td><td>삼각김밥 + 삶은 달걀 + 우유 또는 두유</td></tr>
<tr><td>아예 거르고 오전 간식 과자</td><td>전날 밤 준비해 둔 삶은 달걀과 바나나</td></tr>
</tbody>
<caption>보건복지부 한국인을 위한 식생활지침, 식품의약품안전처 아침 식사 안내를 바탕으로 정리</caption></table></div>

<h2>5분 아침 조합</h2>
<ul>
<li><strong>한식:</strong> 전날 남은 잡곡밥 + 김 + 달걀프라이 + 김치 조금</li>
<li><strong>빵:</strong> 통밀빵 + 치즈 한 장 + 방울토마토</li>
<li><strong>그릇 하나:</strong> 플레인 요거트 + 오트밀 + 바나나 + 호두</li>
<li><strong>마시는 아침:</strong> 두유나 우유에 미숫가루 한 숟가락 + 사과</li>
<li><strong>전날 준비:</strong> 삶은 달걀 여러 개, 오버나이트 오트밀(우유에 오트밀 불려 두기)</li>
</ul>

<div class="box warn"><span class="h">당뇨약을 쓴다면</span>
<p>설포닐우레아 계열 약이나 인슐린을 쓰는 사람이 아침을 거르면 오전에 <strong>저혈당</strong>이 올 수 있어요. 식은땀, 떨림, 가슴 두근거림, 어지러움, 멍해짐이 생기면 사탕이나 주스로 당을 바로 보충하고, 15분 뒤에도 나아지지 않거나 의식이 흐려지면 119에 연락해요. 식사 시간을 바꾸려면 약 조절을 먼저 의사와 상의해요.</p></div>

<h2>간헐적 단식과 아침</h2>
<p>아침을 거르는 방식의 시간 제한 식사가 인기지만, 같은 열량을 먹는다면 일반적인 열량 조절과 체중 감량 효과가 비슷하다는 연구가 많아요. 나에게 오래 지킬 수 있는 방식을 고르면 돼요. 임신·수유 중, 성장기, 섭식 장애 경험이 있다면 단식 방식은 피해요.</p>

<div class="box"><span class="h">아침 식사 체크리스트</span>
<ol>
<li>아이·청소년은 아침 챙기기</li>
<li>단백질 한 가지 넣기</li>
<li>달콤한 빵·음료 대신 통곡물·통과일</li>
<li>전날 밤 삶은 달걀·오트밀 준비</li>
<li>당뇨약 쓰면 식사 시간 상의</li>
<li>거른다면 점심·저녁 폭식 조심</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>아침에 입맛이 전혀 없어요.</dt>
<dd>저녁을 늦게 많이 먹으면 아침에 배가 고프지 않아요. 저녁을 조금 일찍, 가볍게 먹어 보세요. 우유나 두유, 과일처럼 가벼운 것부터 시작해도 돼요.</dd>
<dt>아침에 과일을 먹으면 몸에 나쁘다던데요?</dt>
<dd>그렇지 않아요. 속이 쓰린 사람은 신 과일이 불편할 수 있지만, 통과일은 아침에 좋은 선택이에요.</dd>
<dt>커피만 마셔도 아침 식사가 되나요?</dt>
<dd>커피는 열량과 영양이 거의 없어요. 빈속 커피로 속이 쓰리다면 우유나 가벼운 음식을 함께 먹어요.</dd>
</dl>
