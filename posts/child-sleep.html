  data-title="아이 수면: 나이별 권장 수면 시간, 영아 안전 수면, 잠자리 의식과 화면, 코골이를 흘려듣지 않기"
  data-thumb="9~12시간|초등학생 권장 수면"
  data-summary="잠은 아이의 성장과 기억, 감정 조절에 꼭 필요해요. 영아부터 청소년까지 나이별 권장 수면 시간, 영아 돌연사를 줄이는 안전 수면 원칙, 잠들기 쉬운 잠자리 의식, 화면과 카페인, 야경증과 악몽의 차이, 아이 코골이와 수면무호흡, 늦게 자는 청소년을 정리했어요."
  data-tags="아이수면,영아안전수면,수면습관,코골이,건강상식">
<p class="lead">"조금만 더 놀고 잘래." 매일 밤 잠자리 실랑이가 반복돼요. 아이의 잠은 단순히 쉬는 시간이 아니라 몸이 자라고, 낮에 배운 것을 정리하고, 감정을 회복하는 시간이에요. 잠이 부족한 아이는 졸린 모습보다 짜증, 산만함, 떼쓰기로 드러나기도 해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>필요한 잠은 나이에 따라 달라요. 초등학생은 <strong>9~12시간</strong>, 청소년은 <strong>8~10시간</strong>이 권장돼요.</li>
<li>영아는 <strong>등을 대고, 단단하고 평평한 곳에서, 푹신한 물건 없이</strong> 재워요.</li>
<li>매일 같은 <strong>잠자리 의식</strong>과 <strong>자기 1시간 전 화면 끄기</strong>가 도움이 돼요.</li>
<li>아이가 <strong>매일 코를 골거나 숨을 멈춘다면</strong> 진료를 받아요.</li>
</ul></div>

<h2>나이별 권장 수면 시간</h2>
<div class="tbl"><table>
<thead><tr><th>나이</th><th class="num">하루 수면(낮잠 포함)</th></tr></thead>
<tbody>
<tr><td>4~12개월</td><td class="num">12~16시간</td></tr>
<tr><td>1~2세</td><td class="num">11~14시간</td></tr>
<tr><td>3~5세</td><td class="num">10~13시간</td></tr>
<tr><td>6~12세</td><td class="num">9~12시간</td></tr>
<tr><td>13~18세</td><td class="num">8~10시간</td></tr>
</tbody>
<caption>미국수면의학회(AASM) 소아 권장 수면 시간 합의문(2016), 미국소아과학회(AAP) 지지. 4개월 미만은 개인차가 커 범위를 정하지 않았어요</caption></table></div>

<h2>영아 안전 수면</h2>
<div class="box warn"><span class="h">영아 돌연사를 줄이는 원칙</span>
<ul>
<li>잘 때는 항상 <strong>등을 대고 바로 눕혀요.</strong> 옆으로나 엎드려 재우지 않아요.</li>
<li><strong>단단하고 평평한</strong> 아기 전용 침대에, 딱 맞는 시트 하나만 깔아요.</li>
<li>베개, 이불, 범퍼, 인형 같은 <strong>푹신한 물건은 치워요.</strong></li>
<li>생후 첫 6개월~1년은 <strong>부모와 같은 방, 다른 침대</strong>가 좋아요. 어른 침대, 소파에서 함께 자지 않아요.</li>
<li>방은 너무 덥지 않게 하고, 두껍게 싸매지 않아요.</li>
<li>집 안 <strong>금연</strong>, 가능하면 모유 수유, 예방접종도 위험을 줄여요.</li>
</ul></div>

<h2>잠들기 쉬운 잠자리 의식</h2>
<ul>
<li>매일 <strong>같은 순서</strong>로 해요. 예) 목욕 → 잠옷 → 양치 → 책 한 권 → 불 끄기</li>
<li>20~30분 정도로 짧고 차분하게 해요.</li>
<li>잠드는 시각과 일어나는 시각을 주말에도 크게 바꾸지 않아요.</li>
<li>영아는 졸려 하지만 <strong>아직 깨어 있을 때</strong> 눕혀 스스로 잠드는 연습을 해요.</li>
<li>낮에 햇볕 아래에서 충분히 뛰어놀면 밤잠이 좋아져요.</li>
</ul>

<h2>화면과 카페인</h2>
<ul>
<li>잠들기 <strong>1시간 전</strong>에는 텔레비전, 태블릿, 휴대폰을 꺼요.</li>
<li>아이 방에는 화면 기기를 두지 않는 것이 좋아요. 방에 기기가 있는 아이는 덜 자는 경향이 있어요.</li>
<li>콜라, 초콜릿 음료, 녹차, 에너지 음료의 카페인이 잠을 방해해요. 오후에는 피해요.</li>
</ul>

<h2>밤에 깨는 여러 이유</h2>
<div class="tbl"><table>
<thead><tr><th>상황</th><th>모습</th><th>대처</th></tr></thead>
<tbody>
<tr><td>악몽</td><td>밤 후반, 깨어나 무서웠던 꿈을 기억해요</td><td>안아서 달래 주고, 낮에 무서운 영상은 줄여요</td></tr>
<tr><td>야경증</td><td>잠든 지 1~3시간 뒤 비명을 지르며 앉아 있지만 깨어 있지 않고, 다음 날 기억하지 못해요</td><td>억지로 깨우지 말고 다치지 않게 지켜봐요. 대개 자라며 없어져요</td></tr>
<tr><td>몽유병</td><td>자다가 일어나 걸어 다녀요</td><td>계단·창문·현관을 안전하게. 잠이 부족하면 늘어요</td></tr>
<tr><td>야뇨증</td><td>5세 이후에도 밤에 소변을 가리지 못해요</td><td>흔하고 자라면서 좋아져요. 혼내지 말고, 7세 이후에도 잦으면 진료</td></tr>
</tbody>
<caption>대한소아청소년과학회, 미국소아과학회(AAP) 자료를 바탕으로 정리</caption></table></div>

<h2>아이 코골이, 흘려듣지 마세요</h2>
<p>아이가 <strong>일주일에 3번 넘게</strong> 코를 골거나, 자다가 숨을 멈추고 헐떡이거나, 입을 벌리고 자며 땀을 많이 흘린다면 <strong>소아 수면무호흡</strong>일 수 있어요. 흔한 원인은 커진 편도와 아데노이드예요. 낮에 산만하고 집중하지 못해 주의력결핍 과잉행동장애처럼 보이기도 해요. 소아청소년과나 이비인후과에서 확인받아요.</p>

<h2>늦게 자는 청소년</h2>
<p>사춘기가 되면 몸의 시계가 뒤로 밀려 늦게 졸리고 늦게 일어나고 싶어져요. 게으름이 아니라 생물학적 변화예요. 여기에 늦은 밤 스마트폰과 학원이 겹치면 수면이 크게 부족해져요. 주말에 너무 늦게까지 자면 월요일 아침이 더 힘들어요. 기상 시각을 크게 바꾸지 않고, 아침 햇빛을 받게 도와요.</p>

<div class="box"><span class="h">아이 수면 체크리스트</span>
<ol>
<li>나이별 권장 수면 시간 확인</li>
<li>영아는 등 대고, 푹신한 물건 없이</li>
<li>매일 같은 잠자리 의식</li>
<li>자기 1시간 전 화면 끄기</li>
<li>주말에도 비슷한 기상 시각</li>
<li>잦은 코골이·숨 멈춤은 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>낮잠은 언제까지 자나요?</dt>
<dd>보통 3~5세 사이에 줄어들다 없어져요. 낮잠을 자고 밤잠이 늦어진다면 낮잠 시간을 줄이거나 일찍 끝내요.</dd>
<dt>수면 교육은 몇 개월부터 할 수 있나요?</dt>
<dd>보통 생후 4~6개월 이후 아기가 발달적으로 준비됐을 때 시작해요. 아기와 가족에게 맞는 방법을 소아청소년과와 상의해요.</dd>
<dt>아이가 부모와 같이 자려고 해요.</dt>
<dd>가족 문화에 따라 달라요. 영아는 안전 수면 원칙을 지키고, 유아 이후 따로 재우고 싶다면 조금씩 거리를 늘려 가요.</dd>
</dl>
