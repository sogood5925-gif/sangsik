<p class="lead">해커는 한 사람을 노려 비밀번호를 맞히기보다, 다른 곳에서 유출된 아이디와 비밀번호를 여러 사이트에 자동으로 넣어 보는 방식을 많이 써요. 그래서 비밀번호의 복잡함만큼 중요한 게 <strong>사이트마다 다르게</strong> 쓰는 거예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>비밀번호는 <strong>길게</strong> 만들어요. 여러 단어를 이은 긴 문장형이 기억하기도 쉬워요.</li>
<li><strong>같은 비밀번호를 여러 곳에 쓰지 않아요.</strong> 특히 메일, 금융, 쇼핑은 모두 달라야 해요.</li>
<li>중요한 계정은 <strong>2단계 인증</strong>을 켜요. 문자보다 인증 앱이나 보안키가 더 안전해요.</li>
<li>유출이 의심되면 <strong>그 비밀번호를 쓰는 모든 곳</strong>을 바꿔요.</li>
</ul></div>

<h2>좋은 비밀번호의 조건</h2>
<div class="tbl"><table>
<thead><tr><th>피할 것</th><th>이렇게</th></tr></thead>
<tbody>
<tr><td>생일, 전화번호, 이름, 아이디와 비슷한 것</td><td>나와 관련된 정보가 들어가지 않게 해요</td></tr>
<tr><td>password, 123456, qwerty 같은 흔한 것</td><td>흔한 비밀번호 목록은 가장 먼저 시도돼요</td></tr>
<tr><td>짧은 비밀번호에 특수문자 하나 붙이기(abc123!)</td><td>여러 단어를 이어 <strong>길게</strong> 만들어요(예: 서로 관계없는 단어 4개 이상 + 숫자)</td></tr>
<tr><td>여러 사이트에 같은 비밀번호</td><td>사이트마다 다르게, 비밀번호 관리 도구 활용</td></tr>
<tr><td>메모지, 휴대폰 메모장에 그대로 적기</td><td>암호화된 비밀번호 관리 도구나 잠금 설정된 곳에 보관해요</td></tr>
</tbody>
<caption>한국인터넷진흥원(KISA) 패스워드 선택 및 이용 안내서, 미국 국립표준기술연구소(NIST) 디지털 신원 지침을 바탕으로 정리</caption></table></div>
<p>길이는 비밀번호를 뚫는 데 걸리는 시간을 가장 크게 늘려요. 최근 국제 지침은 복잡한 규칙을 강요하기보다 <strong>충분히 긴 비밀번호</strong>와 유출된 비밀번호 차단을 더 중요하게 봐요.</p>

<h2>사이트마다 다르게 쓰는 현실적인 방법</h2>
<ul>
<li><strong>비밀번호 관리 도구</strong>(브라우저·휴대폰에 내장된 기능 포함)를 쓰면, 도구가 긴 무작위 비밀번호를 만들고 기억해 줘요. 나는 관리 도구의 주 비밀번호 하나만 튼튼하게 만들면 돼요.</li>
<li>관리 도구를 쓰지 않는다면 최소한 <strong>이메일, 금융, 주요 쇼핑·SNS 계정</strong>은 모두 다른 비밀번호를 써요.</li>
<li>특히 <strong>이메일 비밀번호</strong>는 다른 어디에도 쓰지 않아요. 이메일이 뚫리면 다른 계정의 비밀번호 재설정까지 넘어가요.</li>
</ul>

<h2>2단계 인증</h2>
<p>2단계 인증은 비밀번호 말고 <strong>내가 가진 것</strong>(휴대폰, 보안키)으로 한 번 더 확인하는 방법이에요. 비밀번호가 새어 나가도 계정을 지킬 수 있어요.</p>
<div class="tbl"><table>
<thead><tr><th>방식</th><th>특징</th><th>안전성</th></tr></thead>
<tbody>
<tr><td>문자(SMS) 인증번호</td><td>쓰기 쉬워요. 유심 복제, 문자 가로채기, 피싱에 속아 번호를 알려 주는 위험이 있어요</td><td>없는 것보다 훨씬 나아요</td></tr>
<tr><td>인증 앱(OTP)</td><td>휴대폰 앱에서 30초마다 바뀌는 번호를 만들어요</td><td>문자보다 안전해요</td></tr>
<tr><td>앱 푸시 승인</td><td>휴대폰에 뜬 알림에서 '승인'을 눌러요. 내가 로그인하지 않았는데 뜬 알림은 거절해요</td><td>편하지만 무심코 승인하지 않게 조심해요</td></tr>
<tr><td>보안키, 패스키</td><td>기기 자체나 지문·얼굴 인식으로 로그인해요. 가짜 사이트에는 작동하지 않아요</td><td>피싱에 가장 강해요</td></tr>
</tbody></table></div>
<ul>
<li>2단계 인증을 켤 때 나오는 <strong>복구 코드</strong>는 인쇄하거나 안전한 곳에 적어 둬요. 휴대폰을 잃어버렸을 때 필요해요.</li>
<li>인증번호를 <strong>누구에게도 불러 주지 않아요.</strong> 은행, 경찰, 택배사는 인증번호를 묻지 않아요.</li>
</ul>

<h2>패스키란</h2>
<p>패스키는 비밀번호 대신 휴대폰이나 컴퓨터에 저장된 암호 열쇠로 로그인하는 방식이에요. 지문, 얼굴, 화면 잠금으로 본인을 확인하면 로그인돼요. 비밀번호가 없으니 유출될 비밀번호도 없고, 가짜 사이트에서는 작동하지 않아요. 지원하는 서비스라면 켜 두는 것을 권해요.</p>

<h2>유출이 의심될 때</h2>
<div class="box warn"><span class="h">이런 일이 생기면</span>
<ul>
<li>내가 하지 않은 로그인 알림, 비밀번호 변경 알림이 와요.</li>
<li>보낸 적 없는 메시지가 내 계정으로 지인에게 갔어요.</li>
<li>가입한 사이트에서 개인정보 유출 공지가 왔어요.</li>
</ul>
<ol>
<li>해당 계정 비밀번호를 바로 바꾸고, <strong>같은 비밀번호를 쓰는 다른 곳도</strong> 모두 바꿔요.</li>
<li>2단계 인증을 켜고, 로그인된 기기 목록에서 모르는 기기를 로그아웃시켜요.</li>
<li>이메일 자동 전달 설정이 몰래 추가되지 않았는지 확인해요.</li>
<li>금융 정보가 관련됐다면 카드사·은행에 알려요.</li>
</ol></div>
<p>개인정보보호위원회와 한국인터넷진흥원이 운영하는 <strong>'털린 내 정보 찾기'</strong> 서비스에서 내 계정 정보가 불법 유통된 적이 있는지 조회할 수 있어요.</p>

<h2>비밀번호를 자주 바꿔야 할까</h2>
<p>예전에는 몇 달마다 바꾸라고 권했지만, 억지로 자주 바꾸면 사람들이 끝에 숫자만 하나씩 올리는 식으로 약한 비밀번호를 만들게 돼요. 최근 지침은 <strong>유출 의심이 있을 때 바로 바꾸는 것</strong>을 더 중요하게 봐요. 회사나 기관에 정해진 규칙이 있다면 그 규칙을 따라요.</p>

<div class="box"><span class="h">계정 보안 체크리스트</span>
<ol>
<li>이메일 비밀번호는 다른 곳에 쓰지 않기</li>
<li>금융·쇼핑·SNS 비밀번호 모두 다르게</li>
<li>중요한 계정 2단계 인증 켜기</li>
<li>복구 코드 안전하게 보관</li>
<li>인증번호는 누구에게도 알려 주지 않기</li>
<li>유출 알림 오면 같은 비밀번호 쓰는 곳 모두 변경</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>브라우저에 비밀번호를 저장해도 되나요?</dt>
<dd>요즘 브라우저와 휴대폰의 비밀번호 저장 기능은 암호화되어 있어, 같은 비밀번호를 여러 곳에 쓰는 것보다 훨씬 안전해요. 대신 기기 잠금과 계정 2단계 인증을 꼭 켜 두세요.</dd>
<dt>부모님 계정은 어떻게 도와드리면 좋을까요?</dt>
<dd>가장 중요한 계정(이메일, 은행)부터 비밀번호를 바꾸고 2단계 인증을 함께 설정해 드려요. 인증번호를 전화로 묻는 사람은 모두 사기라는 점을 알려 드리는 것도 중요해요.</dd>
<dt>공용 컴퓨터에서 로그인해야 한다면요?</dt>
<dd>'로그인 상태 유지'를 끄고, 다 쓰면 반드시 로그아웃해요. 은행 업무처럼 중요한 일은 공용 컴퓨터에서 하지 않는 게 좋아요.</dd>
</dl>
