  data-summary="저나트륨 소금은 소금의 일부를 염화칼륨으로 바꿔 짠맛은 비슷하게, 나트륨은 줄인 제품이에요. 대규모 연구에서 확인된 뇌졸중·심혈관 질환 감소 효과, 콩팥병이나 칼륨을 올리는 약을 먹는 사람이 조심해야 하는 이유, 천일염·죽염·핑크 소금의 나트륨, 소금 자체를 줄이는 요령을 정리했어요."

<p class="lead">싱겁게 먹어야 한다는 건 알지만 맛이 없어 오래가지 못하는 경우가 많아요. 그래서 짠맛은 비슷하게 유지하면서 나트륨만 줄인 저나트륨 소금이 관심을 받아요. 최근 대규모 연구에서 효과가 확인되면서 기대가 커졌지만, 모든 사람에게 안전한 것은 아니에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>저나트륨 소금은 <strong>염화나트륨 일부를 염화칼륨으로</strong> 바꾼 제품이에요.</li>
<li>큰 연구에서 일반 소금 대신 썼을 때 <strong>뇌졸중과 심혈관 질환, 사망이 줄었어요.</strong></li>
<li><strong>콩팥병</strong>이 있거나 칼륨을 올리는 약을 먹는다면 <strong>고칼륨혈증</strong> 위험이 있어 먼저 의사와 상의해요.</li>
<li>천일염, 죽염, 핑크 소금도 <strong>나트륨은 일반 소금과 비슷</strong>해요.</li>
</ul></div>

<h2>나트륨, 얼마나 줄여야 할까</h2>
<div class="tbl"><table>
<thead><tr><th>기준</th><th class="num">나트륨(하루)</th><th class="num">소금으로 환산</th></tr></thead>
<tbody>
<tr><td>한국인 만성질환 위험 감소 섭취량(성인)</td><td class="num">2,300mg</td><td class="num">약 5.8g</td></tr>
<tr><td>세계보건기구 권고</td><td class="num">2,000mg 미만</td><td class="num">약 5g</td></tr>
<tr><td>우리나라 성인 평균 섭취(최근 조사)</td><td class="num">약 3,000mg 안팎</td><td class="num">약 7.5g 안팎</td></tr>
</tbody>
<caption>보건복지부·한국영양학회 2020 한국인 영양소 섭취기준, 세계보건기구(WHO) 나트륨 섭취 지침, 질병관리청 국민건강영양조사를 바탕으로 정리</caption></table></div>
<p>국물 요리, 김치, 장류, 가공식품이 많은 우리 식사에서는 소금 통의 소금보다 <strong>음식에 이미 들어간 나트륨</strong>이 훨씬 많아요. 그래서 저나트륨 소금은 여러 방법 가운데 하나로 봐요.</p>

<h2>연구로 확인된 효과</h2>
<p>중국 농촌 지역에서 뇌졸중 병력이 있거나 60세 이상 고혈압이 있는 약 2만 명을 5년 동안 지켜본 연구(SSaSS)에서, 염화칼륨이 25% 섞인 소금을 쓴 마을은 일반 소금을 쓴 마을보다 <strong>뇌졸중, 주요 심혈관 사건, 사망이 모두 줄었어요.</strong> 나트륨이 줄고 칼륨이 늘어난 효과가 함께 작용한 것으로 봐요. 세계보건기구도 성인에게 일반 소금 대신 칼륨이 든 저나트륨 소금을 쓰도록 권하는 지침을 냈어요. 다만 콩팥 기능이 떨어진 사람, 임신부, 어린이는 이 권고에서 제외돼요.</p>

<h2>누가 조심해야 할까</h2>
<div class="box warn"><span class="h">먼저 의사와 상의해요</span>
<ul>
<li><strong>만성 콩팥병</strong>: 칼륨을 잘 내보내지 못해 혈액 속 칼륨이 위험하게 오를 수 있어요.</li>
<li>칼륨을 올리는 약을 먹는 사람: <strong>ACE 억제제, 안지오텐신 수용체 차단제</strong>(일부 혈압약), <strong>스피로놀락톤</strong> 등 칼륨 보존 이뇨제, 칼륨 보충제</li>
<li>심부전, 조절되지 않는 당뇨가 있는 사람</li>
</ul>
<p>고칼륨혈증은 <strong>근력 저하, 가슴 두근거림, 부정맥</strong>을 일으킬 수 있어요. 이런 증상이 생기면 바로 진료를 받아요.</p></div>

<h2>소금의 종류와 나트륨</h2>
<div class="tbl"><table>
<thead><tr><th>소금</th><th>특징</th></tr></thead>
<tbody>
<tr><td>정제염</td><td>염화나트륨이 대부분</td></tr>
<tr><td>천일염</td><td>미네랄이 조금 더 있지만 대부분 염화나트륨. 무게당 나트륨이 조금 적은 것은 수분이 많기 때문이에요</td></tr>
<tr><td>죽염, 구운 소금</td><td>대부분 염화나트륨. 건강에 특별히 좋다는 근거는 없어요</td></tr>
<tr><td>핑크 소금, 암염</td><td>색을 내는 철 등 미량 성분이 있지만 양이 매우 적어요</td></tr>
<tr><td>저나트륨 소금</td><td>제품에 따라 염화칼륨 비율이 달라요. 영양성분표에서 나트륨과 칼륨을 확인해요</td></tr>
</tbody>
<caption>식품의약품안전처 소금 관련 정보, 농촌진흥청 국가표준식품성분표를 바탕으로 정리</caption></table></div>
<p>'미네랄이 풍부해서 괜찮다'는 소금도 결국 나트륨 덩어리예요. 종류보다 <strong>양</strong>이 중요해요.</p>

<h2>소금 자체를 줄이는 요령</h2>
<ul>
<li><strong>국물은 반만</strong> 먹어요. 국·찌개·라면 국물에 나트륨이 가장 많아요.</li>
<li>간을 할 때 식초, 레몬, 후추, 마늘, 생강, 들깨 같은 <strong>향신료와 신맛</strong>을 활용해요.</li>
<li>김치와 장아찌는 작은 접시에 조금씩 덜어 먹어요.</li>
<li>가공식품은 <strong>영양성분표의 나트륨</strong>을 비교해 골라요.</li>
<li>외식할 때 "싱겁게 해 주세요"라고 부탁하고, 소스는 따로 달라고 해요.</li>
<li>칼륨이 풍부한 채소·과일을 충분히 먹어요(콩팥병이 없다면).</li>
</ul>

<div class="box"><span class="h">저나트륨 소금 체크리스트</span>
<ol>
<li>콩팥병·복용약 먼저 확인</li>
<li>제품의 나트륨·칼륨 함량 보기</li>
<li>소금 종류보다 양 줄이기</li>
<li>국물은 반만</li>
<li>향신료·신맛으로 간하기</li>
<li>근력 저하·두근거림 생기면 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>저나트륨 소금은 맛이 쓰지 않나요?</dt>
<dd>염화칼륨 비율이 높으면 쓴맛이나 금속 맛이 날 수 있어요. 비율이 낮은 제품부터 쓰거나, 국물보다 무침·구이에 먼저 써 보세요.</dd>
<dt>저나트륨 간장, 된장도 효과가 있나요?</dt>
<dd>일반 제품보다 나트륨이 적어 도움이 돼요. 다만 많이 쓰면 결국 나트륨이 늘어나니 양을 함께 줄여요.</dd>
<dt>아이 음식에도 써도 되나요?</dt>
<dd>아이에게는 소금 대체보다 처음부터 싱겁게 먹는 습관이 더 좋아요. 영유아 음식에는 간을 거의 하지 않아요.</dd>
</dl>
