  data-title="녹내장: 소리 없이 시야가 좁아지는 병, 안압이 정상이어도 생길 수 있어요"

  data-summary="녹내장은 시신경이 서서히 손상돼 시야가 바깥쪽부터 좁아지는 병이에요. 초기에는 증상이 거의 없어 검진으로 찾아야 해요. 국내에 많은 정상안압 녹내장, 급성 녹내장 발작의 응급 신호, 안약 치료를 꾸준히 해야 하는 이유, 검사와 생활 관리를 정리했어요."
  data-tags="녹내장,안압,시신경,실명예방,질병">
<p class="lead">녹내장은 한번 잃은 시야를 되돌릴 수 없어요. 게다가 가운데 시력은 끝까지 남아 있어서, 시야가 바깥쪽부터 절반 가까이 사라질 때까지 모르는 경우가 많아요. 그래서 '조용한 시력 도둑'이라고 불러요. 일찍 찾아 꾸준히 치료하면 대부분 평생 시력을 지킬 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>녹내장은 <strong>시신경 손상</strong>으로 시야가 좁아지는 병이고, 초기에는 증상이 거의 없어요.</li>
<li>국내에는 안압이 정상 범위인데도 생기는 <strong>정상안압 녹내장</strong>이 많아요.</li>
<li><strong>40세 이후</strong>에는 정기 안과 검진에서 시신경 검사를 받는 게 좋아요.</li>
<li>갑자기 눈이 심하게 아프고 충혈되며 두통·구토가 오면 <strong>급성 녹내장</strong>일 수 있어 응급이에요.</li>
</ul></div>

<h2>녹내장은 어떤 병일까</h2>
<p>눈 안에서는 방수라는 물이 계속 만들어지고 빠져나가며 일정한 압력(안압)을 유지해요. 이 압력이 시신경이 견딜 수 있는 수준보다 높거나, 시신경으로 가는 혈류가 부족하면 시신경 섬유가 조금씩 손상돼요. 손상된 시신경은 회복되지 않아요.</p>
<p>정상 안압은 보통 <strong>10~21mmHg</strong>로 보지만, 이 범위 안에서도 시신경이 약한 사람은 녹내장이 생길 수 있어요.</p>

<h2>녹내장의 종류</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>특징</th><th>증상</th></tr></thead>
<tbody>
<tr><td>개방각 녹내장</td><td>방수가 빠져나가는 길은 열려 있지만 배출이 잘 안 돼 천천히 진행해요</td><td>초기 증상이 거의 없어요</td></tr>
<tr><td>정상안압 녹내장</td><td>안압이 정상 범위인데도 시신경이 손상돼요. 한국인 개방각 녹내장의 상당수를 차지해요</td><td>초기 증상이 거의 없어요</td></tr>
<tr><td>폐쇄각 녹내장</td><td>방수가 빠져나가는 길(전방각)이 좁거나 막혀요. 갑자기 막히면 급성 발작이 와요</td><td>급성은 심한 눈 통증, 충혈, 두통, 구토</td></tr>
<tr><td>이차성 녹내장</td><td>스테로이드 장기 사용, 눈 외상, 염증, 당뇨망막병증 등이 원인이에요</td><td>원인에 따라 달라요</td></tr>
</tbody>
<caption>대한녹내장학회 녹내장 건강 정보를 바탕으로 정리</caption></table></div>

<h2>누가 조심해야 할까</h2>
<ul>
<li>40세 이상, 나이가 많을수록</li>
<li>가족 중 녹내장 환자가 있는 사람</li>
<li>근시가 심한 사람(개방각·정상안압 녹내장 위험)</li>
<li>원시가 심하고 전방각이 좁은 사람(폐쇄각 녹내장 위험)</li>
<li>당뇨, 고혈압, 저혈압, 편두통, 수면무호흡이 있는 사람</li>
<li>스테로이드(먹는 약, 안약, 흡입제)를 오래 쓰는 사람</li>
</ul>

<h2>검사</h2>
<div class="tbl"><table>
<thead><tr><th>검사</th><th>확인하는 것</th></tr></thead>
<tbody>
<tr><td>안압 검사</td><td>눈 속 압력</td></tr>
<tr><td>안저 검사·안저 사진</td><td>시신경 머리(시신경 유두)의 모양과 패임 정도</td></tr>
<tr><td>빛간섭단층촬영(OCT)</td><td>시신경 섬유층의 두께. 초기 손상을 찾는 데 도움이 돼요</td></tr>
<tr><td>시야 검사</td><td>보이지 않는 영역이 있는지</td></tr>
<tr><td>전방각 검사</td><td>방수가 빠져나가는 길이 좁은지</td></tr>
</tbody></table></div>
<p>건강검진의 안저 사진에서 '시신경 유두 함몰 비 증가', '녹내장 의심'이 나왔다면 안과에서 정밀 검사를 받아요. 의심 소견의 상당수는 정상으로 확인되지만, 확인은 꼭 필요해요.</p>

<h2>치료</h2>
<p>녹내장 치료의 목표는 <strong>안압을 낮춰 시신경 손상의 진행을 늦추는 것</strong>이에요. 정상안압 녹내장도 안압을 더 낮추면 진행이 느려진다는 연구가 있어요.</p>
<ul>
<li><strong>안약:</strong> 가장 기본 치료예요. 매일 정해진 시간에 넣어야 효과가 유지돼요. 약 종류에 따라 충혈, 눈 주위 색소 침착, 속눈썹 성장, 느린 맥박 같은 부작용이 있을 수 있어요.</li>
<li><strong>레이저:</strong> 방수가 잘 빠지도록 배출로를 넓히거나(개방각), 홍채에 작은 구멍을 내요(폐쇄각).</li>
<li><strong>수술:</strong> 약과 레이저로 조절되지 않으면 방수가 빠져나갈 새 길을 만들어요.</li>
</ul>
<div class="box note"><span class="h">안약을 제대로 넣는 법</span>
<ol>
<li>손을 씻고, 고개를 뒤로 젖혀 아래 눈꺼풀을 살짝 당겨요.</li>
<li>한 방울만 넣어요. 여러 방울 넣어도 효과가 늘지 않아요.</li>
<li>눈을 감고 <strong>눈 안쪽 코 옆을 1~2분 눌러요.</strong> 약이 코로 넘어가 전신 부작용을 일으키는 것을 줄여요.</li>
<li>안약이 두 가지 이상이면 <strong>5분 이상 간격</strong>을 둬요.</li>
</ol></div>
<p>증상이 없으니 안약을 빼먹기 쉬워요. 녹내장 실명의 큰 원인 가운데 하나가 <strong>치료 중단</strong>이에요. 불편한 점이 있으면 끊지 말고 의사와 약을 바꾸는 방법을 상의해요.</p>

<div class="box warn"><span class="h">급성 폐쇄각 녹내장: 바로 응급실로</span>
<ul>
<li>갑자기 한쪽 눈이 <strong>심하게 아프고 빨개져요.</strong></li>
<li>시야가 뿌옇고 불빛 주위에 <strong>무지개 같은 테</strong>가 보여요.</li>
<li>같은 쪽 <strong>두통, 구역질, 구토</strong>가 함께 와요.</li>
</ul>
<p>안압이 급격히 올라 몇 시간~며칠 만에 시력을 크게 잃을 수 있어요. 두통과 구토 때문에 체한 것이나 편두통으로 오해하기 쉬워요. 어두운 곳에 있거나 일부 감기약·수면제·멀미약을 먹은 뒤 생기기도 해요.</p></div>

<h2>생활에서 조심할 것</h2>
<ul>
<li>전방각이 좁다는 말을 들었다면 <strong>감기약, 비염약, 멀미약, 일부 수면제·항우울제</strong>처럼 동공을 키우는 약을 쓰기 전에 의사·약사에게 알려요.</li>
<li>물구나무서기나 머리를 심장보다 오래 낮추는 자세, 넥타이를 꽉 조이는 습관은 안압을 올릴 수 있어요.</li>
<li>규칙적인 유산소 운동은 도움이 될 수 있어요.</li>
<li>스테로이드 약을 오래 써야 한다면 안압을 정기적으로 확인해요.</li>
</ul>

<div class="box"><span class="h">녹내장 체크리스트</span>
<ol>
<li>40세 이후 정기 안과 검진</li>
<li>가족력·고도근시면 더 일찍, 더 자주</li>
<li>검진에서 녹내장 의심이면 정밀 검사</li>
<li>안약은 매일 같은 시간, 빼먹지 않기</li>
<li>눈 통증+충혈+두통·구토는 즉시 응급실</li>
<li>새 약 먹기 전 녹내장 사실 알리기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>안압이 정상이라고 들었는데 녹내장일 수 있나요?</dt>
<dd>네. 국내에는 정상안압 녹내장이 많아서 안압만으로는 알 수 없어요. 시신경 사진과 시신경 섬유층 검사, 시야 검사를 함께 받아야 해요.</dd>
<dt>녹내장이면 결국 실명하나요?</dt>
<dd>아니에요. 일찍 발견해 꾸준히 치료하면 대부분 평생 일상생활에 필요한 시력을 유지해요. 진단이 늦거나 치료를 중단하면 위험해져요.</dd>
<dt>커피는 마셔도 되나요?</dt>
<dd>적당한 양의 커피가 녹내장을 악화시킨다는 뚜렷한 근거는 없어요. 다만 짧은 시간에 많은 양의 물이나 카페인을 마시면 안압이 잠시 오를 수 있어 조금씩 나눠 마셔요.</dd>
</dl>
