<p class="lead">시속 100km로 달리는 차는 1초에 약 28m를 가요. 3초만 졸아도 80m 넘게 눈을 감고 달리는 셈이에요. 졸음운전 사고는 브레이크를 밟지 못한 채 부딪히는 경우가 많아 피해가 커요. 그런데 대부분의 사람은 자기가 얼마나 졸린지 제대로 알아차리지 못해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>하품, 눈꺼풀 무거움, 지나온 길이 기억나지 않음은 <strong>이미 위험하다는 신호</strong>예요.</li>
<li>창문 열기, 음악, 껌은 <strong>잠깐 버티게 할 뿐</strong>이에요. 가장 확실한 해결은 <strong>멈추고 자는 것</strong>이에요.</li>
<li>졸음쉼터나 휴게소에서 <strong>15~20분 짧게 자면</strong> 효과가 커요.</li>
<li>장거리 운전은 <strong>2시간마다 쉬고</strong>, 전날 충분히 자는 것에서 시작해요.</li>
</ul></div>

<h2>졸음은 술과 비슷해요</h2>
<p>연구에 따르면 <strong>17~19시간 동안 깨어 있으면</strong> 반응 속도와 판단력이 혈중알코올농도 0.05% 정도를 마신 상태와 비슷해지고, 더 오래 깨어 있으면 그 이상으로 떨어져요. 졸음은 의지로 이기기 어렵고, 몇 초간 의식이 끊기는 '미세 수면'이 본인도 모르게 찾아와요.</p>
<div class="tbl"><table>
<thead><tr><th>속도</th><th>1초 동안 가는 거리</th><th>3초 졸면</th></tr></thead>
<tbody>
<tr><td>시속 60km</td><td class="num">약 17m</td><td class="num">약 50m</td></tr>
<tr><td>시속 80km</td><td class="num">약 22m</td><td class="num">약 67m</td></tr>
<tr><td>시속 100km</td><td class="num">약 28m</td><td class="num">약 83m</td></tr>
</tbody>
<caption>속도를 초당 거리로 바꿔 계산. 반응 시간과 제동 거리는 포함하지 않았어요</caption></table></div>

<h2>졸음이 오는 신호</h2>
<ul>
<li>하품이 계속 나고 눈을 자주 비벼요.</li>
<li>눈꺼풀이 무겁고 초점이 흐려져요.</li>
<li>방금 지나온 몇 km가 기억나지 않아요.</li>
<li>나들목이나 표지판을 놓쳐요.</li>
<li>차선을 밟거나 차가 한쪽으로 쏠려요.</li>
<li>고개가 떨어졌다 깜짝 놀라 들려요.</li>
</ul>
<p>이 중 하나라도 있으면 가까운 졸음쉼터나 휴게소로 들어가요.</p>

<h2>졸음을 부르는 조건</h2>
<div class="tbl"><table>
<thead><tr><th>조건</th><th>이유</th></tr></thead>
<tbody>
<tr><td>새벽 2~6시, 오후 2~4시</td><td>몸의 생체 시계상 가장 졸린 시간대예요</td></tr>
<tr><td>전날 6시간 미만 수면</td><td>수면 부족이 쌓이면 졸음이 갑자기 몰려와요</td></tr>
<tr><td>밤샘 근무 후 퇴근길</td><td>교대 근무자의 사고 위험이 높아요</td></tr>
<tr><td>식사 직후, 따뜻한 차 안</td><td>긴장이 풀리고 졸음이 와요</td></tr>
<tr><td>곧고 단조로운 고속도로</td><td>자극이 적어 집중이 떨어져요</td></tr>
<tr><td>창문을 닫고 오래 운전</td><td>차 안 이산화탄소가 늘어 머리가 무거워져요</td></tr>
<tr><td>졸음을 부르는 약</td><td>일부 감기약, 알레르기약, 멀미약, 수면제, 신경안정제</td></tr>
<tr><td>수면무호흡증</td><td>밤에 자도 낮에 계속 졸려요</td></tr>
</tbody>
<caption>한국도로공사 졸음운전 예방 안내, 미국 고속도로교통안전국(NHTSA) Drowsy Driving 자료를 바탕으로 정리</caption></table></div>

<h2>버티는 방법의 한계</h2>
<ul>
<li><strong>창문 열기, 에어컨 찬 바람, 큰 음악</strong>: 잠깐 깨는 효과가 있지만 몇 분 가지 않아요. 휴게소까지 가는 시간을 버는 용도로만 써요.</li>
<li><strong>커피, 에너지 음료</strong>: 효과가 나타나는 데 20~30분 걸려요. 수면 부족을 해결하지는 못해요.</li>
<li><strong>껌, 얼음</strong>: 도움이 조금 될 수 있지만 졸음을 없애지 못해요.</li>
</ul>

<h2>가장 확실한 방법: 멈추고 자기</h2>
<ol>
<li>가까운 <strong>졸음쉼터, 휴게소</strong>로 들어가요. 갓길 정차는 뒤차 추돌 위험이 커요.</li>
<li>시동을 끄거나 창문을 조금 열고 <strong>15~20분</strong> 눈을 붙여요. 너무 길게 자면 깬 뒤 몽롱할 수 있어요.</li>
<li>자기 직전 커피를 마시면 깰 때쯤 카페인 효과가 시작돼 도움이 된다는 연구가 있어요.</li>
<li>깬 뒤 가볍게 몸을 움직이고 세수를 한 다음 출발해요.</li>
</ol>

<div class="box warn"><span class="h">겨울철 차 안에서 잘 때</span>
<p>시동을 켠 채 창문을 모두 닫고 오래 자면 일산화탄소나 이산화탄소가 쌓일 수 있어요. 특히 눈에 배기구가 막히면 위험해요. 창문을 조금 열고, 긴 잠은 차 밖 휴게 공간에서 자요.</p></div>

<h2>장거리 운전 계획</h2>
<ul>
<li>출발 전날 <strong>7시간 이상</strong> 자요.</li>
<li><strong>2시간 또는 200km마다</strong> 쉬어요.</li>
<li>가능하면 운전자를 번갈아 바꿔요. 옆자리 사람은 잠들지 말고 말을 걸어 줘요.</li>
<li>과식을 피하고 가볍게 먹어요.</li>
<li>새벽 출발, 밤샘 뒤 운전은 피해요.</li>
<li>졸음을 부르는 약을 먹었다면 운전하지 않아요.</li>
</ul>

<h2>낮에 자꾸 졸리다면</h2>
<p>충분히 잤는데도 낮에 쉽게 졸리고, 코골이가 심하거나 자다가 숨이 멈춘다는 말을 듣는다면 <strong>수면무호흡증</strong>일 수 있어요. 치료하면 낮 졸음과 사고 위험이 줄어요. 수면 클리닉에서 상담해 보세요.</p>

<div class="box"><span class="h">졸음운전 체크리스트</span>
<ol>
<li>전날 7시간 이상 자기</li>
<li>2시간마다 휴식</li>
<li>30분마다 창문 열어 환기</li>
<li>졸음 신호 오면 바로 쉼터로</li>
<li>15~20분 짧은 낮잠</li>
<li>졸린 약 먹었으면 운전 안 하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>에너지 음료를 여러 캔 마시면 괜찮지 않나요?</dt>
<dd>카페인을 많이 먹으면 가슴 두근거림, 불안이 생기고 수면 부족은 그대로예요. 카페인이 떨어지면 졸음이 더 심하게 올 수 있어요.</dd>
<dt>차로 이탈 경고 장치가 있으면 안전한가요?</dt>
<dd>보조 장치는 도움이 되지만 졸음을 대신 해결해 주지는 못해요. 경고가 울렸다면 쉬어야 한다는 신호로 받아들여요.</dd>
<dt>짧은 거리는 괜찮지 않나요?</dt>
<dd>졸음 사고는 집 근처에서도 일어나요. 밤샘 근무 후라면 짧은 거리도 대중교통이나 택시를 고려해요.</dd>
</dl>
