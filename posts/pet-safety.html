  data-summary="사람에게 괜찮은 음식과 물건이 반려동물에게는 치명적일 수 있어요. 개와 고양이에게 위험한 음식, 고양이에게 특히 위험한 백합과 에센셜 오일, 사람 약의 위험, 끈·전선·창문·전기레인지 같은 집 안의 위험, 중독이 의심될 때 할 일, 사람의 건강을 위한 수칙을 정리했어요."

<p class="lead">반려동물은 호기심이 많고, 무엇이 위험한지 알지 못해요. 집 안의 안전을 지키는 건 보호자의 몫이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>초콜릿, 포도·건포도, 양파·마늘, 자일리톨</strong>은 개에게 위험한 대표 음식이에요.</li>
<li>고양이에게는 <strong>백합</strong>과 <strong>에센셜 오일</strong>, 개 전용 벼룩약이 특히 위험해요.</li>
<li>사람이 먹는 <strong>진통제</strong>는 소량으로도 개와 고양이에게 치명적일 수 있어요.</li>
<li>중독이 의심되면 <strong>억지로 토하게 하지 말고</strong> 바로 동물병원에 연락해요.</li>
</ul></div>

<h2>개와 고양이에게 위험한 음식</h2>
<div class="tbl"><table>
<thead><tr><th>음식</th><th>위험한 이유</th><th>주로 문제되는 동물</th></tr></thead>
<tbody>
<tr><td>초콜릿, 코코아</td><td>테오브로민과 카페인이 구토, 흥분, 부정맥, 경련을 일으켜요. 다크초콜릿과 베이킹용 초콜릿이 더 위험해요</td><td>개, 고양이</td></tr>
<tr><td>포도, 건포도</td><td>급성 신부전을 일으킬 수 있어요. 적은 양으로도 위험한 경우가 있어요</td><td>개</td></tr>
<tr><td>양파, 마늘, 파, 부추</td><td>적혈구를 파괴해 빈혈을 일으켜요. 익히거나 가루로 된 것도 위험해요</td><td>개, 고양이</td></tr>
<tr><td>자일리톨 (무설탕 껌, 사탕, 일부 땅콩버터)</td><td>급격한 저혈당과 간 손상을 일으켜요</td><td>개</td></tr>
<tr><td>마카다미아</td><td>근력 저하, 구토, 떨림</td><td>개</td></tr>
<tr><td>술, 발효 중인 빵 반죽</td><td>알코올 중독, 반죽이 위에서 부풀어 위험</td><td>개, 고양이</td></tr>
<tr><td>커피, 에너지음료</td><td>카페인 중독</td><td>개, 고양이</td></tr>
<tr><td>익힌 뼈 (특히 닭뼈)</td><td>날카롭게 부러져 입, 식도, 장을 다치게 해요</td><td>개, 고양이</td></tr>
<tr><td>짜고 기름진 음식</td><td>췌장염, 소화기 문제</td><td>개, 고양이</td></tr>
</tbody>
<caption>미국수의사회(AVMA), ASPCA 동물독극물통제센터 자료를 바탕으로 정리</caption></table></div>
<p>식탁 위 음식, 가방 속 초콜릿과 껌, 쓰레기통도 반려동물 눈높이에서 점검해요. 뚜껑이 있는 쓰레기통을 쓰면 사고가 줄어요.</p>

<h2>고양이에게 특히 위험한 것</h2>
<div class="box warn"><span class="h">백합은 집에 두지 마세요</span>
<p>백합과 원추리 종류는 <strong>꽃잎, 잎, 꽃가루, 꽃병 물</strong>까지 고양이에게 급성 신부전을 일으킬 수 있어요. 털에 묻은 꽃가루를 핥는 것만으로도 위험해요. 고양이와 산다면 백합 꽃다발은 들이지 않는 게 안전해요.</p></div>
<ul>
<li><strong>에센셜 오일과 디퓨저:</strong> 티트리, 유칼립투스, 페퍼민트, 시트러스 계열 등 일부 오일은 고양이가 분해하지 못해 중독을 일으킬 수 있어요. 피부에 바르지 말고, 디퓨저는 고양이가 없는 공간에서 쓰거나 피해요.</li>
<li><strong>개 전용 벼룩·진드기 약:</strong> 일부 성분(퍼메트린 등)은 고양이에게 치명적이에요. 반드시 고양이 전용 제품을 써요.</li>
<li><strong>끈, 실, 머리끈, 비닐:</strong> 고양이가 삼키면 장이 꼬이거나 막힐 수 있어요. 입에 실이 보여도 억지로 잡아당기지 말고 병원으로 가요.</li>
</ul>

<h2>사람 약은 절대 주지 않기</h2>
<ul>
<li><strong>아세트아미노펜</strong>은 고양이에게 소량으로도 치명적이고, 개에게도 간 손상을 일으켜요.</li>
<li><strong>이부프로펜, 나프록센</strong> 같은 소염진통제는 위궤양과 급성 신부전을 일으켜요.</li>
<li>항우울제, 수면제, ADHD 약, 혈압약, 당뇨약도 위험해요.</li>
<li>약을 떨어뜨리면 바로 주워요. 약통은 반려동물이 씹을 수 없는 곳에 보관해요.</li>
<li>반려동물이 아파 보여도 사람 약을 주지 말고 동물병원 진료를 받아요.</li>
</ul>

<h2>집 안의 위험</h2>
<div class="tbl"><table>
<thead><tr><th>위험</th><th>예방</th></tr></thead>
<tbody>
<tr><td>전선 씹기</td><td>전선 보호 커버, 안 쓰는 충전기 뽑기</td></tr>
<tr><td>창문, 베란다 추락</td><td>방묘창·방충망 고정. 고양이는 높은 곳에서 떨어지는 사고가 흔해요</td></tr>
<tr><td>전기레인지·인덕션</td><td>고양이가 터치 버튼을 밟아 켜지면서 화재가 나는 사고가 보고돼요. 외출 시 전원을 완전히 끄거나 잠금 기능을 써요</td></tr>
<tr><td>세제, 락스, 부동액, 살충제, 쥐약</td><td>잠금 수납장에 보관. 부동액은 단맛이 나서 핥기 쉬워요</td></tr>
<tr><td>작은 물건 (장난감 부품, 동전, 건전지)</td><td>바닥에 두지 않기. 건전지는 삼키면 식도·위를 태울 수 있어요</td></tr>
<tr><td>세탁기, 건조기</td><td>문을 닫아두고, 작동 전 안을 확인해요</td></tr>
<tr><td>일부 관엽식물</td><td>들이기 전에 반려동물에게 안전한 식물인지 확인해요</td></tr>
</tbody></table></div>

<h2>계절별 주의</h2>
<ul>
<li><strong>여름:</strong> 차 안에 절대 혼자 두지 않아요. 한낮 아스팔트는 발바닥에 화상을 입힐 수 있어요. 단두종(불독, 퍼그, 페르시안 등)은 열사병에 특히 약해요.</li>
<li><strong>겨울:</strong> 제설제(염화칼슘)는 발바닥을 자극하고 핥으면 해로워요. 산책 후 발을 닦아요. 난로와 전기장판 주변 화상을 조심해요.</li>
<li><strong>명절·행사:</strong> 기름진 음식, 꼬치, 뼈를 몰래 먹는 사고가 많아요.</li>
</ul>

<h2>중독이 의심될 때</h2>
<div class="box warn"><span class="h">이렇게 하세요</span>
<ol>
<li><strong>바로 동물병원</strong>(야간이면 24시간 동물병원)에 전화해요. 증상이 없어도 연락해요. 포도, 자일리톨, 백합처럼 증상이 늦게 나타나는 경우가 많아요.</li>
<li><strong>무엇을, 얼마나, 언제</strong> 먹었는지 알려요. 포장이나 남은 것을 챙겨가요.</li>
<li><strong>억지로 토하게 하지 않아요.</strong> 소금물이나 손가락으로 토하게 하면 더 위험할 수 있어요. 구토 유도는 수의사가 판단해요.</li>
<li>피부나 털에 묻었다면 수의사 안내에 따라 씻겨요.</li>
</ol></div>

<h2>함께 사는 사람의 건강</h2>
<ul>
<li><strong>임신부:</strong> 고양이 배설물의 톡소플라스마 감염을 줄이기 위해 화장실 청소는 가능하면 다른 가족이 하고, 해야 한다면 장갑을 끼고 매일 치운 뒤 손을 씻어요.</li>
<li>반려동물을 만진 뒤, 배변 처리 뒤, 먹이를 준 뒤에는 손을 씻어요.</li>
<li>정기적인 예방접종과 구충으로 사람에게 옮을 수 있는 감염을 줄여요.</li>
<li>개에게 물렸다면 흐르는 물과 비누로 충분히 씻고, 깊은 상처는 진료를 받아요.</li>
</ul>

<h2>보호자의 의무와 배려</h2>
<ul>
<li>생후 2개월 이상 된 개는 <strong>동물등록</strong>이 의무예요. 이사하면 주소도 바꿔요.</li>
<li>공공장소에서는 <strong>목줄</strong>을 하고(길이 2m 이하), 배설물을 치워요.</li>
<li>엘리베이터와 복도에서는 반려견을 안거나 목줄을 짧게 잡아요.</li>
</ul>

<div class="box"><span class="h">반려동물 안전 점검표</span>
<ol>
<li>초콜릿, 포도, 자일리톨 제품을 닿지 않는 곳에</li>
<li>약은 잠금 서랍에</li>
<li>고양이가 있다면 백합과 에센셜 오일 치우기</li>
<li>방묘창·방충망 고정 상태 확인</li>
<li>전기레인지 잠금 기능 설정</li>
<li>가까운 24시간 동물병원 번호 저장</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>초콜릿을 조금 먹었는데 괜찮아 보여요.</dt>
<dd>위험도는 초콜릿 종류, 먹은 양, 반려동물 체중에 따라 달라요. 증상은 몇 시간 뒤에 나타나기도 해요. 괜찮아 보여도 동물병원에 연락해 판단을 받아요.</dd>
<dt>우유를 줘도 되나요?</dt>
<dd>많은 성견과 성묘는 유당을 잘 소화하지 못해 설사를 할 수 있어요. 반려동물 전용 우유가 아니라면 주지 않는 게 좋아요.</dd>
<dt>사람 음식을 간식으로 조금씩 주는 건요?</dt>
<dd>양념하지 않은 일부 채소나 살코기는 괜찮을 수 있지만, 비만과 췌장염의 원인이 되기 쉬워요. 간식은 하루 열량의 10% 이내로, 안전한지 확인한 것만 줘요.</dd>
</dl>
