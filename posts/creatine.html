  data-summary="크레아틴은 짧고 강한 운동에 쓰이는 에너지 저장 물질로, 근력 운동과 함께 먹으면 근력과 근육량이 늘어난다는 근거가 많아요. 작용 원리와 음식 속 함량, 먹는 법과 체중 증가, 콩팥 수치 오해, 탈모와 탈수 걱정, 어르신과 청소년에게의 의미를 정리했어요."

<p class="lead">운동 보충제 가운데 과학적 근거가 가장 많이 쌓인 성분을 꼽으라면 크레아틴이에요. 근력 운동과 함께 먹으면 들어 올리는 무게와 근육량이 조금 더 늘어난다는 연구가 수백 편 있어요. 반면 "콩팥이 망가진다", "머리가 빠진다" 같은 걱정도 많지요. 무엇이 사실인지 나눠 볼게요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>크레아틴은 근육에 저장돼 <strong>짧고 강한 힘</strong>을 낼 때 에너지를 빠르게 공급해요.</li>
<li><strong>근력 운동과 함께</strong> 하루 3~5g을 먹으면 근력과 근육량 증가에 도움이 된다는 근거가 탄탄해요.</li>
<li>콩팥이 건강한 사람에게는 안전하지만, 혈액 <strong>크레아티닌 수치가 올라 보일 수 있어</strong> 검사 때 알려요.</li>
<li><strong>콩팥병이 있거나</strong> 신장에 부담을 주는 약을 먹는다면 먹지 않거나 의사와 상의해요.</li>
</ul></div>

<h2>크레아틴은 어떻게 작용할까</h2>
<p>근육은 순간적으로 큰 힘을 낼 때 ATP라는 에너지를 쓰는데, 몇 초면 바닥나요. 이때 근육 속 <strong>크레아틴인산</strong>이 ATP를 빠르게 다시 채워 줘요. 크레아틴을 보충하면 근육의 저장량이 늘어 무거운 무게를 한두 번 더 들거나, 짧은 전력 질주를 반복하는 능력이 좋아져요. 이렇게 늘어난 훈련량이 쌓여 근력과 근육량이 조금 더 늘어요.</p>

<h2>몸속과 음식 속 크레아틴</h2>
<ul>
<li>몸은 간과 콩팥에서 하루 약 1g을 스스로 만들어요.</li>
<li>음식으로는 <strong>고기와 생선</strong>에 들어 있어요. 소고기나 연어 100g에 약 0.4~0.5g이에요.</li>
<li>채식하는 사람은 근육 속 크레아틴이 적은 편이라, 보충제의 효과가 더 크게 나타나기도 해요.</li>
</ul>

<h2>목적별 근거</h2>
<div class="tbl"><table>
<thead><tr><th>목적</th><th>근거 요약</th></tr></thead>
<tbody>
<tr><td>근력·근육량(근력 운동과 함께)</td><td><strong>근거가 탄탄해요.</strong> 여러 연구에서 근력과 제지방량이 조금 더 늘었어요</td></tr>
<tr><td>반복 전력 질주, 구기 종목</td><td>짧은 고강도 동작을 반복하는 능력이 좋아져요</td></tr>
<tr><td>장거리 달리기 같은 지구력 운동</td><td>효과가 작거나 없어요</td></tr>
<tr><td>어르신의 근감소 예방</td><td>근력 운동과 함께할 때 근력과 근육량이 조금 더 늘었다는 분석이 있어요. 운동 없이 먹는 효과는 불확실해요</td></tr>
<tr><td>뇌 기능, 우울감</td><td>일부 연구가 있지만 아직 결론을 내리기 어려워요</td></tr>
</tbody>

<h2>먹는 법</h2>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>내용</th></tr></thead>
<tbody>
<tr><td>매일 일정량</td><td><strong>하루 3~5g</strong>을 매일 먹어요. 3~4주면 근육 저장량이 가득 차요</td></tr>
<tr><td>빠른 채우기(선택)</td><td>하루 20g을 4번 나눠 5~7일 먹고, 이후 3~5g으로 유지해요. 속이 불편할 수 있어요</td></tr>
<tr><td>형태</td><td>가장 연구가 많은 <strong>크레아틴 일수화물(모노하이드레이트)</strong>이면 충분해요. 비싼 변형 제품의 추가 이점은 확인되지 않았어요</td></tr>
<tr><td>시간</td><td>운동 전후나 식사와 함께 등 편한 때에 꾸준히 먹는 것이 더 중요해요</td></tr>
</tbody></table></div>
<p>처음 몇 주 동안 <strong>체중이 1~2kg</strong> 늘 수 있어요. 근육에 물이 함께 저장되기 때문이에요. 체급 운동 선수나 체중에 민감한 사람은 알아 두세요.</p>

<h2>콩팥은 괜찮을까</h2>
<ul>
<li>콩팥이 건강한 사람을 대상으로 한 여러 연구(수개월~수년)에서 권장량 크레아틴이 콩팥 기능을 해친다는 근거는 없었어요.</li>
<li>다만 크레아틴은 몸에서 <strong>크레아티닌</strong>으로 바뀌어 혈액 검사 수치를 올려요. 크레아티닌으로 계산하는 콩팥 기능(사구체여과율)이 실제보다 나빠 보일 수 있어요. 검사 전에 복용 사실을 알리면 의사가 해석에 반영해요.</li>
<li><strong>이미 콩팥병이 있거나</strong>, 당뇨·고혈압이 심하거나, 콩팥에 부담을 주는 약(소염진통제를 자주 먹는 경우 등)을 쓰면 먹기 전에 의사와 상의해요.</li>
</ul>

<h2>자주 듣는 걱정</h2>
<ul>
<li><strong>탈모:</strong> 럭비 선수 20명을 대상으로 한 작은 연구에서 남성호르몬 관련 물질(DHT)이 올랐다는 보고가 있지만, 실제 탈모가 늘었다는 연구는 없어요. 추가 연구에서도 확인되지 않았어요.</li>
<li><strong>탈수와 근육 경련:</strong> 연구에서는 오히려 차이가 없거나 줄었어요. 운동 중 물은 평소처럼 충분히 마셔요.</li>
<li><strong>스테로이드와 같은가:</strong> 크레아틴은 호르몬이 아니에요. 음식에도 있는 물질이에요.</li>
</ul>

<div class="box warn"><span class="h">청소년과 제품 품질</span>
<p>성장기 청소년은 기본 식사와 훈련, 수면만으로도 충분히 성장해요. 보충제를 쓰려면 보호자와 전문가가 함께 판단해요. 또 운동 보충제 가운데 금지 약물이나 표시되지 않은 성분이 섞인 제품이 적발되기도 하니, 성분이 단순하고 품질 검사를 거친 제품을 골라요.</p></div>

<div class="box"><span class="h">크레아틴 체크리스트</span>
<ol>
<li>근력 운동을 꾸준히 할 때 의미가 있어요</li>
<li>크레아틴 일수화물 하루 3~5g</li>
<li>초반 1~2kg 체중 증가는 물 때문</li>
<li>혈액검사 전 복용 사실 알리기</li>
<li>콩팥병이면 먹지 않거나 의사와 상의</li>
<li>성분 단순하고 품질 검사된 제품</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>운동 안 하는 날에도 먹어야 하나요?</dt>
<dd>근육 속 저장량을 유지하려면 매일 먹는 편이 좋아요. 운동하지 않는 날에도 같은 양을 먹어요.</dd>
<dt>카페인과 함께 먹으면 효과가 떨어지나요?</dt>
<dd>일부 오래된 연구에서 그런 결과가 있었지만, 이후 연구에서는 뚜렷하지 않아요. 속이 불편하면 시간을 나눠 먹어요.</dd>
<dt>여성도 먹어도 되나요?</dt>
<dd>네. 여성에게서도 근력 운동과 함께 먹을 때 근력 향상이 보고됐어요. 임신·수유 중에는 안전성 자료가 부족해 피해요.</dd>
</dl>
