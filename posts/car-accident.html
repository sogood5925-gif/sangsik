<p class="lead">가벼운 접촉 사고라도 차를 세우고 내리는 순간 도로 한가운데 서게 돼요. 사고 처리의 첫 번째 원칙은 잘잘못을 따지는 것이 아니라 <strong>사람의 안전</strong>이에요. 순서만 기억해 두면 당황해도 놓치지 않아요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>비상등 → 안전한 곳으로 대피 → 신고</strong> 순서예요. 차 옆이나 도로에 서 있지 않아요.</li>
<li>고속도로에서는 <strong>가드레일 밖</strong>으로 나가서 신고해요.</li>
<li>다친 사람이 있으면 <strong>119·112</strong>에 신고하고, 그냥 떠나면 뺑소니가 될 수 있어요.</li>
<li>당일 괜찮아도 목과 허리 통증은 며칠 뒤 나타날 수 있어 <strong>진료 기록</strong>을 남겨요.</li>
</ul></div>

<h2>사고 직후 순서</h2>
<div class="tbl"><table>
<thead><tr><th>순서</th><th>할 일</th></tr></thead>
<tbody>
<tr><td>1. 비상등</td><td>바로 비상등을 켜서 뒤차에 알려요</td></tr>
<tr><td>2. 안전 확보</td><td>차를 움직일 수 있으면 갓길이나 안전한 곳으로 옮겨요. 어렵다면 사람만 도로 밖으로 대피해요</td></tr>
<tr><td>3. 부상자 확인</td><td>다친 사람이 있으면 119에 신고하고, 목을 다친 것 같으면 억지로 움직이지 않아요</td></tr>
<tr><td>4. 경고 표시</td><td>안전하게 할 수 있을 때만 차 뒤쪽에 삼각대를 세워요. 위험하면 생략하고 대피가 먼저예요</td></tr>
<tr><td>5. 기록</td><td>사진과 블랙박스 영상을 보존해요</td></tr>
<tr><td>6. 연락</td><td>상대방과 연락처·보험사를 주고받고, 내 보험사에 사고 접수해요</td></tr>
</tbody>
<caption>한국도로공사·경찰청 교통사고 대처 요령을 바탕으로 정리</caption></table></div>

<h2>고속도로에서는 특히</h2>
<p>고속도로의 2차 사고는 뒤에서 달려오는 차가 멈춘 차나 사람을 그대로 들이받는 경우가 많아 <strong>일반 사고보다 치사율이 훨씬 높아요.</strong></p>
<div class="box warn"><span class="h">고속도로 사고 대처</span>
<ol>
<li>비상등을 켜고 가능하면 갓길로 차를 옮겨요.</li>
<li>트렁크를 열어 두면 뒤차가 알아보기 쉬워요.</li>
<li>동승자와 함께 <strong>가드레일 밖</strong>으로 나가요. 차 안이나 차 앞뒤에 머물지 않아요.</li>
<li>그곳에서 112나 한국도로공사 콜센터에 신고해요. 고속도로에는 차를 안전한 곳까지 옮겨 주는 긴급견인 서비스가 있어요.</li>
<li>밤에는 휴대폰 불빛이나 불꽃신호기로 위치를 알리되 도로로 들어가지 않아요.</li>
</ol></div>

<h2>꼭 신고해야 하는 경우</h2>
<ul>
<li><strong>사람이 다쳤을 때:</strong> 구호 조치를 하고 경찰에 신고해야 해요. 다친 사람을 두고 떠나면 뺑소니(도주치상)로 무겁게 처벌받아요.</li>
<li><strong>물건만 부서졌을 때:</strong> 보험 처리와 연락처 교환으로 끝낼 수 있지만, 상대가 연락처를 주지 않고 가거나 음주가 의심되면 경찰에 신고해요.</li>
<li><strong>주차된 차를 긁었을 때:</strong> 연락처를 남기지 않고 떠나면 처벌받을 수 있어요. 차주에게 연락하거나 연락처를 남겨요.</li>
</ul>

<h2>남겨야 할 사진과 기록</h2>
<div class="tbl"><table>
<thead><tr><th>찍을 것</th><th>이유</th></tr></thead>
<tbody>
<tr><td>멀리서 찍은 현장 전체(차선, 신호등, 표지판)</td><td>사고 위치와 차량 방향을 보여 줘요</td></tr>
<tr><td>두 차의 위치와 간격</td><td>차를 옮기기 전 상황을 남겨요</td></tr>
<tr><td>파손 부위 가까이</td><td>수리 범위 확인에 필요해요</td></tr>
<tr><td>상대 차량 번호판</td><td>나중에 확인할 때 필요해요</td></tr>
<tr><td>바닥의 파편, 스키드 자국</td><td>충돌 지점을 알려 줘요</td></tr>
<tr><td>블랙박스 영상</td><td>덮어쓰기 전에 따로 저장해요. 메모리 카드를 빼 두는 것도 방법이에요</td></tr>
</tbody></table></div>
<p>목격자가 있으면 연락처를 받아 두세요.</p>

<h2>현장에서 조심할 것</h2>
<ul>
<li>감정적으로 다투지 않아요. 과실은 보험사와 경찰이 기록과 영상으로 판단해요.</li>
<li>현장에서 "제 잘못이에요"라고 서명하거나 현금으로 합의하지 않아요. 나중에 다친 곳이 드러나면 문제가 복잡해져요.</li>
<li>상대가 술 냄새가 나거나 도주하려 하면 112에 신고해요.</li>
<li>렌터카, 법인 차량이라면 회사와 보험사에 바로 알려요.</li>
</ul>

<h2>사고 뒤 몸 챙기기</h2>
<p>사고 직후에는 긴장 때문에 통증을 잘 못 느껴요. 목과 허리의 염좌(흔히 '채찍질 손상')는 <strong>다음 날이나 며칠 뒤</strong> 뻣뻣함과 통증으로 나타나기도 해요.</p>
<ul>
<li>통증이 있으면 가능한 빨리 진료를 받아 기록을 남겨요. 보험 처리에도 필요해요.</li>
<li>머리를 부딪혔다면 두통, 구토, 졸림, 말이 어눌함이 생기는지 하루 이틀 지켜봐요. 이런 증상이 있으면 응급실로 가요.</li>
<li>큰 사고 뒤 운전이 두렵고, 잠을 못 자고, 사고 장면이 자꾸 떠오르는 증상이 몇 주 이상 계속되면 상담을 받아 보세요.</li>
</ul>

<h2>평소 준비</h2>
<ul>
<li>트렁크에 안전삼각대와 불꽃신호기(또는 LED 경고등)를 둬요.</li>
<li>블랙박스가 제대로 녹화되는지 가끔 확인해요.</li>
<li>보험사 긴급출동 번호를 휴대폰에 저장해 둬요.</li>
<li>동승자를 포함해 뒷좌석까지 <strong>안전띠</strong>를 매요. 아이는 나이와 체격에 맞는 카시트를 써요.</li>
</ul>

<div class="box"><span class="h">사고 대처 카드</span>
<ol>
<li>비상등 켜기</li>
<li>차는 갓길로, 사람은 가드레일 밖으로</li>
<li>다친 사람 있으면 119·112</li>
<li>현장·파손·번호판 사진, 블랙박스 저장</li>
<li>연락처·보험사 교환, 보험 접수</li>
<li>아프면 바로 진료 기록 남기기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>경미한 사고인데 경찰을 꼭 불러야 하나요?</dt>
<dd>다친 사람이 없고 서로 연락처와 보험 정보를 확인했다면 보험사 처리로 끝낼 수 있어요. 다만 과실 다툼이 크거나, 상대가 신원을 밝히지 않거나, 음주가 의심되면 경찰에 신고해요.</dd>
<dt>차를 옮기면 불리해지지 않나요?</dt>
<dd>사진과 블랙박스로 위치를 남겼다면 차를 옮겨도 괜찮아요. 도로 한가운데 차를 두는 것이 2차 사고 위험을 훨씬 키워요.</dd>
<dt>상대가 나중에 다쳤다고 연락하면요?</dt>
<dd>보험사에 알리고 처리를 맡겨요. 직접 금전 합의를 하기 전에 보험사와 상의하는 게 좋아요.</dd>
</dl>
