  data-title="견과류: 하루 한 줌(30g)의 힘, 종류별 영양과 살찔 걱정, 곰팡이 독소까지"
  data-thumb="30g|하루 한 줌"
  data-summary="견과류를 꾸준히 먹는 사람은 심혈관 질환 위험이 낮다는 연구가 많아요. 하루 적정량과 종류별 영양 특징, 열량이 높은데 살이 찌지 않는 이유, 소금·설탕 코팅 제품 고르기, 산패와 곰팡이 독소를 막는 보관법, 알레르기와 어린아이 질식 주의를 정리했어요."
  data-tags="견과류,아몬드,호두,불포화지방,영양소">
<p class="lead">호두, 아몬드, 땅콩 한 줌은 작지만 좋은 지방과 단백질, 식이섬유, 비타민 E, 마그네슘을 함께 담고 있어요. 열량이 높아 망설여지지만, 과자 대신 먹는다면 오히려 건강한 선택이 돼요. 핵심은 <strong>양과 종류, 그리고 보관</strong>이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>하루 <strong>한 줌(약 30g)</strong>의 견과류는 심혈관 질환 위험을 낮추는 것과 관련돼요.</li>
<li>열량이 높으니 <strong>다른 간식을 대신해서</strong> 먹어요.</li>
<li><strong>무염, 무가당, 볶거나 생</strong> 견과류를 고르고, 설탕·소금 코팅 제품은 가끔만 먹어요.</li>
<li>산패와 곰팡이를 막으려면 <strong>밀봉해 서늘하게, 오래 두려면 냉장·냉동</strong>해요.</li>
</ul></div>

<h2>견과류의 건강 효과</h2>
<ul>
<li>여러 나라의 대규모 연구에서 견과류를 자주 먹는 사람은 <strong>심혈관 질환과 전체 사망 위험</strong>이 낮았어요.</li>
<li>스페인의 지중해식 식사 연구(PREDIMED)에서는 견과류를 매일 먹은 그룹의 심혈관 사건이 줄었어요.</li>
<li>견과류를 먹으면 LDL 콜레스테롤이 조금 내려가고, 포만감이 오래가요.</li>
</ul>
<p>이런 효과는 견과류가 <strong>불포화지방, 식이섬유, 식물성 스테롤, 폴리페놀</strong>을 함께 담고 있기 때문으로 보여요.</p>

<h2>종류별 영양 특징</h2>
<div class="tbl"><table>
<thead><tr><th>견과류(30g, 대략)</th><th class="num">열량</th><th>특징</th></tr></thead>
<tbody>
<tr><td>호두(반쪽 7~8개)</td><td class="num">약 195kcal</td><td>식물성 오메가3(알파리놀렌산)가 가장 많아요</td></tr>
<tr><td>아몬드(약 23알)</td><td class="num">약 170kcal</td><td>비타민 E, 칼슘, 식이섬유가 많아요</td></tr>
<tr><td>땅콩(엄밀히는 콩과)</td><td class="num">약 170kcal</td><td>단백질, 나이아신, 엽산이 많고 값이 저렴해요</td></tr>
<tr><td>캐슈넛</td><td class="num">약 165kcal</td><td>구리, 마그네슘, 철이 많아요</td></tr>
<tr><td>피스타치오(약 49알)</td><td class="num">약 160kcal</td><td>루테인, 칼륨이 많고 알이 작아 천천히 먹게 돼요</td></tr>
<tr><td>브라질너트(1~2알)</td><td class="num">1알 약 30kcal</td><td><strong>셀레늄</strong>이 아주 많아 하루 1~2알이면 충분해요</td></tr>
<tr><td>잣</td><td class="num">약 200kcal</td><td>마그네슘, 아연, 비타민 E가 많아요</td></tr>
</tbody>
<caption>미국 농무부(USDA) 식품 데이터, 농촌진흥청 국가표준식품성분표를 바탕으로 한 대략값</caption></table></div>
<p>한 가지만 먹기보다 여러 종류를 섞어 먹으면 영양이 고르게 채워져요.</p>

<h2>살찌지 않을까</h2>
<p>견과류는 열량이 높지만, 연구에서 적당량을 먹는 사람이 체중이 더 늘지 않았어요.</p>
<ul>
<li>단백질과 식이섬유가 <strong>포만감</strong>을 줘 다른 음식을 덜 먹게 해요.</li>
<li>견과류 세포벽 때문에 지방의 일부는 흡수되지 않고 빠져나가요.</li>
<li>다만 봉지째 놓고 먹으면 금방 두세 줌이 돼요. <strong>한 줌씩 덜어</strong> 먹어요.</li>
</ul>

<h2>고르는 법</h2>
<ul>
<li><strong>무염·무가당</strong> 제품을 골라요. 허니버터, 소금 코팅, 초콜릿 코팅 제품은 나트륨과 당이 많아요.</li>
<li>기름에 튀긴 제품보다 생이나 마른 볶음(오븐·팬) 제품이 나아요.</li>
<li>하루 분량씩 소포장된 제품은 양 조절에 편해요.</li>
<li>땅콩버터는 원재료가 땅콩(과 소금)뿐인 제품을 골라요. 설탕과 경화유가 들어간 제품이 많아요.</li>
</ul>

<div class="tbl"><table>
<thead><tr><th>제품</th><th>확인할 것</th></tr></thead>
<tbody>
<tr><td>볶은 견과류</td><td>'무염', '기름 없이 볶음' 표시</td></tr>
<tr><td>양념·코팅 견과류</td><td>1회 제공량의 당류와 나트륨. 간식이 아니라 과자로 생각해요</td></tr>
<tr><td>땅콩버터·아몬드버터</td><td>원재료가 견과류(와 소금)뿐인지, 설탕·경화유가 없는지</td></tr>
<tr><td>하루 견과 소포장</td><td>1봉의 무게(20~30g)와 말린 과일·초콜릿 비율</td></tr>
<tr><td>대용량 봉지</td><td>제조일과 소비기한, 개봉 후 냉장 가능 여부</td></tr>
</tbody></table></div>

<h2>보관과 곰팡이 독소</h2>
<div class="box warn"><span class="h">산패와 아플라톡신</span>
<ul>
<li>견과류의 불포화지방은 빛과 열, 공기에 닿으면 <strong>산패</strong>해 쩐내가 나요. 맛이 변한 견과류는 먹지 않아요.</li>
<li>습한 곳에 두면 곰팡이가 피고, 일부 곰팡이는 간암과 관련된 독소(<strong>아플라톡신</strong>)를 만들어요. 곰팡이가 보이거나, 쓴맛이 나거나, 색이 변한 알은 버려요.</li>
<li>개봉 후에는 <strong>밀봉해 냉장</strong>하고, 몇 달 이상 둘 거면 냉동해요.</li>
</ul></div>

<h2>알레르기와 어린아이</h2>
<ul>
<li>땅콩과 견과류는 심한 알레르기(아나필락시스)를 일으킬 수 있는 대표 식품이에요. 알레르기가 있다면 가공식품의 알레르기 표시를 꼭 확인해요.</li>
<li>최근 연구에서는 알레르기 위험이 높은 아기에게 땅콩을 <strong>이른 시기부터 적절한 형태로</strong> 먹이면 오히려 땅콩 알레르기가 줄었어요. 아토피가 심하거나 달걀 알레르기가 있는 아기는 소아과와 먼저 상의해요.</li>
<li><strong>통견과는 4~5세 미만 아이에게 주지 않아요.</strong> 기도를 막을 수 있어요. 곱게 간 가루나 버터 형태로 음식에 섞어 줘요.</li>
</ul>

<div class="box"><span class="h">견과류 체크리스트</span>
<ol>
<li>하루 한 줌(30g), 덜어서 먹기</li>
<li>과자·빵 간식을 견과류로 바꾸기</li>
<li>무염·무가당, 여러 종류 섞기</li>
<li>브라질너트는 하루 1~2알</li>
<li>밀봉 냉장, 쩐내·곰팡이 나면 버리기</li>
<li>어린아이에게 통견과 주지 않기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>견과류는 언제 먹는 게 좋아요?</dt>
<dd>특별히 정해진 시간은 없어요. 오후 간식으로 먹으면 저녁 과식을 줄이는 데 도움이 될 수 있고, 샐러드나 요구르트에 뿌려 먹어도 좋아요.</dd>
<dt>견과류를 불려 먹어야 하나요?</dt>
<dd>불리면 식감이 부드러워지고 소화가 편하다는 사람이 있어요. 영양 흡수에 큰 차이는 아직 분명하지 않아요. 편한 방식으로 먹으면 돼요.</dd>
<dt>콩팥 결석이 있으면 견과류를 피해야 하나요?</dt>
<dd>아몬드, 캐슈넛 등은 옥살산이 많은 편이라 칼슘 옥살산 결석이 반복되는 사람은 양을 조절하고 칼슘 음식과 함께 먹는 게 좋아요.</dd>
</dl>
