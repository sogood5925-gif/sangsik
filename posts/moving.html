<p class="lead">이사를 마치고 몇 달 뒤에야 옛 주소로 고지서가 가고 있었다는 걸 알게 되는 경우가 많아요. 시기별로 할 일을 나눠두면 빠뜨리는 게 크게 줄어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>이사업체는 <strong>허가 업체</strong>인지 확인하고, <strong>방문 견적</strong>과 <strong>서면 계약서</strong>를 받아요.</li>
<li>이사 당일 옛집의 <strong>계량기</strong>, 새집의 <strong>하자</strong>를 사진으로 남겨요.</li>
<li>전입신고는 이사 후 <strong>14일 안에</strong> 해요. 세입자라면 <strong>이사 당일</strong> 하는 게 안전해요.</li>
<li>정부24 <strong>주소 일괄 변경</strong>과 우체국 <strong>우편물 전송 서비스</strong>를 활용해요.</li>
</ul></div>

<h2>두 달~한 달 전</h2>
<h3>이사업체 고르기</h3>
<ul>
<li>관할 지자체에 등록된 <strong>허가 업체</strong>인지 확인해요. 무허가 업체는 파손이나 분실 때 보상받기 어려워요.</li>
<li>두세 곳에 <strong>방문 견적</strong>을 받아요. 전화나 사진으로만 받은 견적은 당일 추가 요금 다툼이 생기기 쉬워요.</li>
<li><strong>계약서</strong>에 이사 날짜와 시간, 작업 인원, 차량 크기, 총 금액, 추가 요금 조건, 사다리차 비용, 파손 시 배상 방법을 적어요.</li>
<li>이사업체가 <strong>적재물 배상보험</strong>에 가입했는지 확인해요.</li>
<li>'손 없는 날'이나 월말, 주말은 비싸고 예약이 빨리 차요. 날짜를 조정할 수 있다면 평일이 저렴해요.</li>
</ul>
<h3>그 밖에</h3>
<ul>
<li>아이가 있다면 <strong>전학</strong> 절차와 새 학교, 어린이집 입소를 알아봐요.</li>
<li>세입자라면 <strong>보증금 반환</strong> 일정을 집주인과 확인해요. (계약 만료 전 통보)</li>
<li>새집의 전기·가스·인터넷 사용 가능 여부, 주차, 엘리베이터 사용 예약을 확인해요.</li>
</ul>

<h2>2~3주 전</h2>
<ul>
<li><strong>짐 줄이기:</strong> 짐이 줄면 이사 비용도 줄어요. 1년 넘게 쓰지 않은 물건부터 정리해요.</li>
<li><strong>대형 폐기물:</strong> 가구와 가전은 구청이나 주민센터, 지자체 앱·누리집에서 <strong>대형 폐기물 신고</strong>를 하고 수수료를 낸 뒤 스티커나 신고번호를 붙여 내놓아요. 가전은 폐가전 무상 방문 수거 서비스를 이용할 수 있어요.</li>
<li><strong>인터넷·TV 이전:</strong> 통신사에 이전 설치를 예약해요. 설치 기사 일정이 밀릴 수 있어요.</li>
<li><strong>정기 배송·구독</strong> 서비스의 배송지를 바꿔요.</li>
</ul>

<h2>1주 전</h2>
<ul>
<li><strong>도시가스:</strong> 옛집 가스 철거(전출)와 새집 가스 연결(전입)을 도시가스 회사에 예약해요. 가스레인지 연결은 반드시 <strong>전문가</strong>에게 맡겨요.</li>
<li><strong>관리비·공과금 정산:</strong> 관리사무소에 이사 날짜를 알리고 정산 방법을 확인해요.</li>
<li><strong>냉장고 비우기:</strong> 이사 전날까지 음식을 정리하고 냉장고 전원을 꺼 물기를 빼요.</li>
<li><strong>귀중품과 서류:</strong> 현금, 귀금속, 계약서, 통장, 인감은 이삿짐과 따로 직접 챙겨요.</li>
<li>세탁기 배수 호스의 물을 빼고, 에어컨 이전 설치를 예약해요.</li>
</ul>

<h2>이사 당일</h2>
<div class="tbl"><table>
<thead><tr><th>장소</th><th>할 일</th></tr></thead>
<tbody>
<tr><td>옛집</td><td><strong>전기·가스·수도 계량기</strong>를 사진으로 찍어요. 짐을 뺀 뒤 집 상태도 찍어 원상복구 분쟁에 대비해요. 두고 가는 물건이 없는지 확인해요</td></tr>
<tr><td>새집</td><td>짐이 들어오기 전에 벽지, 바닥, 창문, 싱크대, 욕실의 <strong>기존 하자</strong>를 사진으로 남겨요. 계량기 숫자도 찍어요</td></tr>
<tr><td>이삿짐</td><td>짐을 내리면서 파손된 물건이 있으면 그 자리에서 업체와 함께 확인하고 기록해요. 나중에 발견하면 보상받기 어려워요</td></tr>
<tr><td>잔금과 열쇠</td><td>보증금을 받고, 새집 잔금을 치르고, 열쇠나 도어록 비밀번호를 넘겨받아요</td></tr>
</tbody></table></div>
<p>새집 도어록 비밀번호는 입주 즉시 바꿔요.</p>

<h2>이사 후 14일 안에</h2>
<h3>전입신고</h3>
<p>주민등록법에 따라 이사 후 <strong>14일 안에</strong> 전입신고를 해야 해요. 늦으면 과태료가 부과될 수 있어요. 주민센터에 가거나 <strong>정부24</strong>에서 온라인으로 할 수 있어요.</p>
<div class="box warn"><span class="h">세입자라면 이사 당일 전입신고를</span>
<p>전입신고를 하면 <strong>다음 날 0시</strong>부터 대항력이 생겨요. 전입신고를 미루는 사이 집주인이 대출을 받으면 내 보증금보다 순서가 앞설 수 있어요. 확정일자도 함께 받고, 전월세 신고 대상이라면 기한 안에 신고해요. 자세한 내용은 전월세 계약 글에 정리해 두었어요.</p></div>
<h3>주소 일괄 변경</h3>
<p>정부24의 <strong>주소 변경 서비스</strong>를 이용하면 은행, 카드사, 보험사, 통신사 등 여러 기관의 주소를 한 번에 바꿀 수 있어요. 전입신고를 하면 함께 처리되는 항목도 있어요.</p>
<ul>
<li>자동차 등록증, 운전면허증 주소는 전입신고와 연계되는지 확인해요.</li>
<li><strong>반려동물 등록</strong> 정보의 주소도 바꿔요.</li>
<li>온라인 쇼핑몰, 배달 앱의 기본 배송지도 잊지 말아요.</li>
</ul>
<h3>우편물 전송 서비스</h3>
<p>우체국의 <strong>우편물 전송 서비스</strong>를 신청하면 일정 기간 옛 주소로 오는 우편물을 새 주소로 보내줘요. 주소 변경을 놓친 곳을 찾아내는 데도 도움이 돼요.</p>

<h2>새집에서 확인할 것</h2>
<ul>
<li>가스보일러 작동과 배기통 연결, 일산화탄소 경보기</li>
<li>차단기(분전반) 위치와 누전차단기 작동</li>
<li>수도 계량기 위치, 동파 방지 상태</li>
<li>소화기, 화재감지기 위치 (아파트라면 경량 칸막이·대피 공간)</li>
<li>곰팡이, 누수 흔적 (발견하면 사진을 찍어 바로 알려요)</li>
</ul>

<div class="box"><span class="h">이사 한눈에 체크리스트</span>
<ol>
<li>허가 이사업체 방문 견적, 서면 계약</li>
<li>대형 폐기물 신고, 폐가전 수거 예약</li>
<li>인터넷·TV·가스 이전 예약</li>
<li>관리비·공과금 정산</li>
<li>당일 계량기·하자 사진, 파손 확인</li>
<li>전입신고(세입자는 당일)·확정일자</li>
<li>정부24 주소 일괄 변경, 우편물 전송 신청</li>
<li>도어록 비밀번호 변경, 가스·전기 안전 확인</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>이사업체와 분쟁이 생겼어요.</dt>
<dd>계약서와 사진을 근거로 업체와 먼저 협의하고, 해결되지 않으면 한국소비자원 소비자상담센터(국번 없이 1372)에 상담을 요청할 수 있어요.</dd>
<dt>이사 날 비가 오면 어떻게 하나요?</dt>
<dd>대부분의 이사업체는 비 오는 날에도 작업하지만, 가구와 가전을 비닐로 덮는 등 추가 조치가 필요해요. 계약할 때 우천 시 처리 방법을 물어보세요.</dd>
<dt>전입신고를 늦게 하면 어떻게 되나요?</dt>
<dd>14일이 지나면 과태료가 부과될 수 있고, 세입자라면 보증금 보호가 늦어지는 더 큰 위험이 있어요.</dd>
</dl>
