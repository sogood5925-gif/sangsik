  data-title="달걀: 하루 한 개는 괜찮을까? 콜레스테롤 논쟁과 노른자의 영양, 안전하게 먹는 법"
  data-thumb="6g|달걀 1개 단백질"
  data-summary="달걀은 값싸고 영양 밀도가 높은 식품이지만 콜레스테롤 때문에 망설이는 사람이 많아요. 달걀 한 개의 영양, 식사 속 콜레스테롤과 혈중 콜레스테롤의 관계에 대한 최근 연구, 당뇨나 이상지질혈증이 있을 때의 섭취 요령, 흰자와 노른자의 차이, 살모넬라를 막는 보관·조리법을 정리했어요."
  data-tags="달걀,콜레스테롤,단백질,노른자,영양소">
<p class="lead">달걀 한 개에는 병아리 한 마리가 자라는 데 필요한 영양이 담겨 있어요. 질 좋은 단백질에 비타민 D, B12, 콜린, 루테인까지 들어 있지요. 한때 콜레스테롤 때문에 '하루 한 개도 조심'이라고 했지만, 연구가 쌓이면서 건강한 사람에게는 적당량이 괜찮다는 쪽으로 무게가 옮겨 갔어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>달걀 1개(큰 것)에는 <strong>단백질 약 6g</strong>, 비타민 D·B12, 콜린, 루테인이 들어 있어요.</li>
<li>건강한 성인은 <strong>하루 1개 정도</strong>는 심혈관 질환 위험을 높이지 않는다는 연구가 많아요.</li>
<li><strong>당뇨, 이상지질혈증</strong>이 있다면 전체 식사의 포화지방과 함께 양을 의사와 정해요.</li>
<li>달걀은 <strong>냉장 보관</strong>하고, 영유아·임신부·어르신은 <strong>완숙</strong>으로 먹어요.</li>
</ul></div>

<h2>달걀 한 개의 영양</h2>
<div class="tbl"><table>
<thead><tr><th>영양소(큰 달걀 1개, 약 50g)</th><th class="num">양(대략)</th></tr></thead>
<tbody>
<tr><td>열량</td><td class="num">70~75kcal</td></tr>
<tr><td>단백질</td><td class="num">약 6g</td></tr>
<tr><td>지방</td><td class="num">약 5g(포화지방 약 1.5g)</td></tr>
<tr><td>콜레스테롤</td><td class="num">약 180~200mg</td></tr>
<tr><td>콜린</td><td class="num">약 150mg</td></tr>
<tr><td>비타민 B12</td><td class="num">약 0.5μg</td></tr>
<tr><td>비타민 D</td><td class="num">약 1μg(40IU)</td></tr>
<tr><td>루테인·제아잔틴</td><td class="num">약 0.2mg</td></tr>
</tbody>
<caption>미국 농무부(USDA) 식품 데이터, 농촌진흥청 국가표준식품성분표를 바탕으로 한 대략값</caption></table></div>
<p>달걀 단백질은 필수아미노산이 고루 들어 있고 소화 흡수가 잘 돼, 단백질의 질을 평가하는 기준으로 쓰일 정도예요.</p>

<h2>흰자와 노른자</h2>
<ul>
<li><strong>흰자:</strong> 단백질의 절반 이상, 지방과 콜레스테롤은 거의 없어요.</li>
<li><strong>노른자:</strong> 지방, 콜레스테롤과 함께 비타민 A·D·E, B12, 콜린, 루테인 등 영양 대부분이 모여 있어요.</li>
</ul>
<p>콜레스테롤이 걱정돼 흰자만 먹으면 노른자의 좋은 영양도 함께 놓치게 돼요.</p>

<h2>콜레스테롤 논쟁</h2>
<p>예전에는 음식으로 먹는 콜레스테롤이 곧바로 혈중 콜레스테롤을 올린다고 생각했어요. 지금은 다음처럼 이해해요.</p>
<ul>
<li>혈중 콜레스테롤은 대부분 <strong>간에서 만들어져요.</strong> 음식으로 콜레스테롤을 많이 먹으면 간이 덜 만들어 어느 정도 균형을 맞춰요.</li>
<li>혈중 LDL 콜레스테롤에는 음식 속 콜레스테롤보다 <strong>포화지방과 트랜스지방</strong>의 영향이 더 커요.</li>
<li>다만 사람마다 반응이 달라, 음식 콜레스테롤에 LDL이 크게 오르는 사람도 있어요.</li>
</ul>
<p>여러 대규모 연구를 모은 분석에서 건강한 사람이 <strong>하루 1개 정도</strong> 달걀을 먹는 것은 심혈관 질환 위험과 뚜렷한 관련이 없었어요. 일부 연구에서는 많이 먹을수록 위험이 조금 올라가는 경향이 보여, '적당히'가 핵심이에요. 국내 섭취기준은 성인 콜레스테롤을 하루 300mg 미만으로 권해요.</p>

<h2>질환이 있을 때</h2>
<div class="tbl"><table>
<thead><tr><th>상황</th><th>요령</th></tr></thead>
<tbody>
<tr><td>건강한 성인</td><td>하루 1개 정도 무난해요. 조리법과 함께 먹는 음식이 더 중요해요</td></tr>
<tr><td>LDL 콜레스테롤이 높음</td><td>노른자 수를 조절하고, 포화지방(삼겹살, 버터, 가공육)을 먼저 줄여요</td></tr>
<tr><td>당뇨병</td><td>달걀 섭취가 많을 때 심혈관 위험이 높아졌다는 연구가 있어 주당 개수를 의사·영양사와 정해요</td></tr>
<tr><td>콩팥병</td><td>단백질과 인 섭취량 기준에 맞춰 조절해요</td></tr>
</tbody>
<caption>대한당뇨병학회·한국지질동맥경화학회 식사 지침을 바탕으로 정리</caption></table></div>
<p>달걀 자체보다 <strong>함께 먹는 음식</strong>이 중요해요. 버터에 볶은 스크램블과 베이컨, 소시지를 곁들이면 포화지방과 나트륨이 크게 늘어요. 삶은 달걀, 채소 달걀찜, 달걀국처럼 먹으면 좋아요.</p>

<h2>안전하게 먹는 법</h2>
<div class="box warn"><span class="h">살모넬라 식중독 예방</span>
<ul>
<li>달걀은 <strong>냉장 보관</strong>해요. 국내에서 유통되는 세척란은 냉장 유통·보관이 원칙이에요.</li>
<li><strong>금이 가거나 깨진 달걀</strong>은 날로 먹지 않고 충분히 익혀 바로 먹거나 버려요.</li>
<li>날달걀을 만진 뒤에는 손을 씻어요. 껍데기에 균이 있을 수 있어요.</li>
<li>달걀물 요리(전, 달걀말이)는 만든 뒤 오래 두지 않아요.</li>
<li><strong>영유아, 임신부, 어르신, 면역이 약한 사람</strong>은 노른자까지 완전히 익혀 먹어요.</li>
</ul></div>
<p>껍데기에 찍힌 10자리 숫자 앞 4자리는 산란 날짜예요. 마지막 숫자는 사육 환경(1 방사, 2 평사, 3 개선된 케이지, 4 기존 케이지)을 뜻해요. 영양은 사육 환경에 따라 크게 다르지 않아요.</p>

<h2>달걀 알레르기</h2>
<p>달걀은 영유아에게 흔한 알레르기 식품이에요. 대부분 자라면서 좋아지고, 완전히 익힌 달걀이나 빵 속 달걀은 먹을 수 있는 경우도 있어요. 독감 백신 등 일부 백신과 관련해서는 대부분 접종이 가능하니 의료진과 상의해요.</p>

<div class="box"><span class="h">달걀 체크리스트</span>
<ol>
<li>건강한 성인은 하루 1개 정도</li>
<li>노른자까지 먹되 포화지방 많은 곁들이 줄이기</li>
<li>당뇨·고지혈증이면 개수 상의</li>
<li>냉장 보관, 금 간 달걀 날로 먹지 않기</li>
<li>취약한 사람은 완숙으로</li>
<li>날달걀 만진 뒤 손 씻기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>갈색 달걀이 흰 달걀보다 좋은가요?</dt>
<dd>껍데기 색은 닭의 품종에 따라 달라요. 영양 차이는 거의 없어요.</dd>
<dt>유정란, 동물복지란이 영양이 더 많나요?</dt>
<dd>영양 성분 차이는 크지 않아요. 동물복지와 사육 환경을 고려해 선택하는 것은 개인의 가치에 따라 정하면 돼요.</dd>
<dt>메추리알은 콜레스테롤이 더 많나요?</dt>
<dd>같은 무게로 비교하면 메추리알이 달걀보다 콜레스테롤이 조금 많아요. 메추리알 5개 정도가 달걀 1개 무게와 비슷해요. 장조림으로 먹으면 나트륨도 함께 생각해요.</dd>
</dl>
