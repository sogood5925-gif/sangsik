  data-summary="김치, 된장, 청국장, 요구르트 같은 발효식품은 유익균과 발효 과정에서 생기는 물질로 장 건강에 도움이 될 수 있어요. 발효식품의 건강 효과에 대한 연구, 한국 발효식품의 가장 큰 약점인 나트륨, 짠 음식과 위암의 관계, 히스타민에 예민한 사람과 약 상호작용, 덜 짜게 즐기는 요령을 정리했어요."

<p class="lead">잘 익은 김치 1g에는 유산균이 수억~수십억 마리나 들어 있을 수 있어요. 발효식품은 오래전부터 음식을 보관하는 지혜였고, 최근에는 장내 미생물 연구와 함께 다시 주목받고 있어요. 하지만 한국 발효식품에는 소금이라는 숙제가 함께 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>발효식품은 <strong>유익균, 유기산, 발효로 생긴 비타민</strong>을 담고 있어 장 건강에 도움이 될 수 있어요.</li>
<li>한국 발효식품은 <strong>나트륨이 많아요.</strong> 김치 한 접시, 된장국 한 그릇이 하루 권장량의 상당 부분이에요.</li>
<li>짠 음식을 많이 먹는 습관은 <strong>위암과 고혈압</strong> 위험을 높여요. 발효식품 자체보다 소금이 문제예요.</li>
<li><strong>덜 짜게, 조금씩, 다양하게</strong> 먹는 것이 발효식품을 건강하게 즐기는 방법이에요.</li>
</ul></div>

<h2>발효식품이 좋은 이유</h2>
<ul>
<li><strong>유익균:</strong> 김치의 유산균, 요구르트의 유산균, 청국장의 고초균 등이 장에 들어가요. 대부분 장에 오래 머물지는 않지만, 지나가는 동안 장내 환경에 영향을 줄 수 있어요.</li>
<li><strong>발효 산물:</strong> 발효 과정에서 유기산, 짧은사슬지방산, 비타민 B12·K2 같은 물질이 생기기도 해요.</li>
<li><strong>소화:</strong> 콩과 우유는 발효되면 단백질과 유당이 분해되어 소화가 쉬워져요.</li>
<li><strong>채소 섭취:</strong> 김치는 배추, 무, 파, 마늘 같은 채소를 많이 먹게 해 줘요.</li>
</ul>
<p>미국 스탠퍼드대 연구에서는 10주 동안 요구르트, 김치, 콤부차 같은 발효식품을 늘린 사람들의 <strong>장내 미생물 다양성이 늘고 염증 지표가 줄었어요.</strong> 다만 연구 규모가 작고, 질병 예방 효과까지 확인된 것은 아니에요.</p>

<h2>발효식품의 나트륨</h2>

<thead><tr><th>식품(1회 분량)</th><th class="num">나트륨(대략)</th></tr></thead>

<tr><td>된장 1큰술(15g)</td><td class="num">약 600~700mg</td></tr>

<tr><td>간장 1큰술(15mL)</td><td class="num">약 800~1,000mg</td></tr>
<tr><td>명란·오징어 젓갈 1큰술(15g)</td><td class="num">약 500~800mg</td></tr>

<p>김치찌개와 된장국, 젓갈 반찬을 한 끼에 함께 먹으면 나트륨이 금방 하루치를 넘어요.</p>

<h2>짠 음식과 위암</h2>
<p>우리나라는 위암이 많은 나라예요. 여러 연구에서 <strong>짜게 먹는 습관, 짠 절임 음식을 많이 먹는 것</strong>이 위암 위험을 높이는 요인으로 꼽혀요. 소금은 위 점막을 자극하고 헬리코박터균 감염의 해로운 영향을 키울 수 있어요. 김치를 먹는 것 자체보다 <strong>얼마나 짜게, 얼마나 많이</strong> 먹는지가 중요해요. 신선한 채소와 과일을 함께 먹는 식사는 위암 위험을 낮추는 것과 관련돼요.</p>

<h2>덜 짜게 즐기는 요령</h2>
<ul>
<li>김치는 <strong>작은 접시</strong>에 덜어 먹고, 국물은 남겨요.</li>
<li>집에서 담글 때 소금과 젓갈을 조금 줄이고, 무·배·양파로 맛을 보태요.</li>
<li>찌개와 국은 건더기 위주로 먹고, 된장은 조금 넣고 채소를 늘려요.</li>
<li>한 끼에 짠 발효 반찬은 <strong>한두 가지만</strong> 올려요.</li>
<li>요구르트, 저염 청국장, 식초 절임처럼 나트륨이 적은 발효식품도 번갈아 먹어요.</li>
<li>칼륨이 많은 채소와 과일을 곁들이면 나트륨 배출에 도움이 돼요(콩팥병 환자는 칼륨 조절 필요).</li>
</ul>

<h2>조심해야 하는 사람</h2>
<div class="tbl"><table>
<thead><tr><th>상황</th><th>주의할 점</th></tr></thead>
<tbody>
<tr><td>고혈압, 심부전, 콩팥병</td><td>나트륨 섭취를 특히 줄여요</td></tr>
<tr><td>히스타민에 예민함(두드러기, 편두통)</td><td>오래 숙성한 젓갈, 치즈, 발효 소스에 히스타민·티라민 같은 아민이 많아 증상이 생길 수 있어요</td></tr>
<tr><td>MAO 억제제 복용</td><td>티라민이 많은 숙성 식품과 함께 먹으면 혈압이 급격히 오를 수 있어 약사와 확인해요</td></tr>
<tr><td>와파린 복용</td><td>청국장·낫토처럼 비타민 K가 많은 음식은 양을 일정하게 유지해요</td></tr>
<tr><td>면역이 크게 떨어진 사람</td><td>살균하지 않은 발효식품은 의료진과 상의해요</td></tr>
</tbody></table></div>

<h2>발효식품과 프로바이오틱스 보충제</h2>
<p>발효식품은 균의 종류와 양이 일정하지 않지만, 음식 자체의 영양과 함께 다양한 미생물을 줘요. 프로바이오틱스 보충제는 특정 균주를 정해진 양만큼 담고 있어 특정 상황(항생제 관련 설사 예방 등)에 근거가 있는 경우가 있어요. 건강한 사람이라면 다양한 발효식품과 채소, 통곡물로 장내 미생물을 돌보는 것이 기본이에요.</p>

<div class="box"><span class="h">발효식품 체크리스트</span>
<ol>
<li>김치는 작은 접시, 국물 남기기</li>
<li>한 끼에 짠 발효 반찬 한두 가지만</li>
<li>된장국은 건더기 위주</li>
<li>요구르트·저염 제품도 번갈아</li>
<li>채소·과일 함께 먹기</li>
<li>혈압·콩팥 질환이면 나트륨 더 엄격히</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>익은 김치와 생김치, 어느 쪽이 좋아요?</dt>
<dd>적당히 익은 김치에 유산균이 가장 많고, 너무 시어지면 유산균 수가 줄어요. 영양 차이보다 입맛과 나트륨 양을 기준으로 골라도 돼요.</dd>
<dt>김치찌개로 끓이면 유산균이 죽나요?</dt>
<dd>열을 가하면 살아 있는 유산균은 대부분 죽어요. 그래도 채소의 식이섬유와 발효 산물은 남아요. 유산균을 기대한다면 생김치로 먹어요.</dd>
<dt>콤부차는 몸에 좋나요?</dt>
<dd>발효차의 일종으로 유산균과 유기산이 있지만, 건강 효과에 대한 연구는 아직 부족해요. 당이 많이 든 제품이 있고, 집에서 만들면 오염 위험이 있어 조심해요.</dd>
</dl>
