<template data-id="herpes" data-cat="dis" data-date="2026.09.30"
  data-title="입술 물집(단순포진): 피곤하면 다시 올라오는 이유, 따끔할 때 약을 시작하기, 아기에게 옮기지 않기"
  data-thumb="1~2일|따끔한 전조 증상"
  data-summary="피곤하거나 감기를 앓고 나면 입술 가장자리에 작은 물집이 무리 지어 올라오는 단순포진은 신경 속에 숨어 있던 바이러스가 다시 깨어나 생겨요. 처음 감염과 재발의 차이, 재발을 부르는 계기, 항바이러스제를 빨리 시작해야 하는 이유, 옮기지 않는 법, 눈·아기·아토피 환자에게 위험한 경우를 정리했어요."
  data-tags="단순포진,입술물집,헤르페스,항바이러스제,질병">
<p class="lead">입술 한쪽이 간질간질 따끔거리더니 다음 날 작은 물집이 옹기종기 올라와요. 흔히 '입병 났다', '열꽃 폈다'고 하는 입술 물집은 대부분 단순포진 바이러스 때문이에요. 한 번 감염되면 몸속에 조용히 머물다가 몸이 지칠 때 다시 나타나요. 그래서 완전히 없애기보다 재발을 짧고 가볍게 넘기는 법을 아는 게 중요해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>입술 물집은 주로 <strong>단순포진 바이러스 1형</strong>이 원인이에요. 성인 상당수가 이미 감염돼 있어요.</li>
<li>바이러스는 <strong>신경절에 숨어 있다가</strong> 피로, 스트레스, 자외선, 감기 때 다시 나와요.</li>
<li>항바이러스제는 <strong>따끔거리는 전조 단계에 시작할수록</strong> 효과가 커요.</li>
<li>물집이 있을 때는 <strong>입맞춤, 컵·수건 같이 쓰기</strong>를 피하고, 특히 <strong>신생아</strong>에게 가까이 가지 않아요.</li>
</ul></div>

<h2>처음 감염과 재발</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>특징</th></tr></thead>
<tbody>
<tr><td>처음 감염</td><td>주로 어린 시절 가족의 입맞춤, 식기 공유로 옮아요. 증상 없이 지나가기도 하고, 아이는 입안 전체에 궤양이 생기며 열이 나기도 해요(포진성 치은구내염)</td></tr>
<tr><td>재발</td><td>같은 자리(주로 입술 가장자리)에 작은 물집이 무리 지어 생겨요. 보통 7~10일 안에 딱지가 앉고 나아요</td></tr>
</tbody>
<caption>질병관리청 국가건강정보포털, 대한피부과학회 단순포진 안내를 바탕으로 정리</caption></table></div>

<h2>재발의 흐름</h2>
<ol>
<li><strong>전조(수 시간~1~2일):</strong> 따끔거림, 화끈거림, 간지러움</li>
<li><strong>물집:</strong> 붉은 바탕 위에 작은 물집이 무리 지어 생겨요.</li>
<li><strong>터짐·진물:</strong> 물집이 터져 짓무르고 따가워요. 이때 가장 잘 옮아요.</li>
<li><strong>딱지:</strong> 누런 딱지가 앉고, 떨어지면 대개 흉터 없이 나아요.</li>
</ol>

<h2>재발을 부르는 계기</h2>
<ul>
<li>피로, 수면 부족, 스트레스</li>
<li>감기, 열이 나는 병</li>
<li>강한 햇빛(자외선), 추위와 찬 바람</li>
<li>생리 전후</li>
<li>입술 주변의 상처, 치과 치료</li>
<li>면역을 떨어뜨리는 약이나 질환</li>
</ul>
<p>자주 재발하는 사람은 내 계기가 무엇인지 기록해 두면 미리 대비하기 좋아요. 야외 활동 때는 자외선 차단 립밤이 도움이 돼요.</p>

<h2>치료</h2>
<div class="tbl"><table>
<thead><tr><th>치료</th><th>설명</th></tr></thead>
<tbody>
<tr><td>먹는 항바이러스제(아시클로버, 발라시클로버, 팜시클로버)</td><td>전조 증상이나 물집이 막 올라올 때 시작하면 앓는 기간을 줄여요. 짧게 먹는 방법도 있어요</td></tr>
<tr><td>바르는 항바이러스제(아시클로버 크림 등)</td><td>일찍 자주 바르면 기간을 조금 줄일 수 있지만 효과는 먹는 약보다 작아요</td></tr>
<tr><td>재발 억제 요법</td><td>1년에 여러 번 심하게 재발하면 매일 먹어 재발을 줄이는 방법을 의사와 상의해요</td></tr>
<tr><td>통증 관리</td><td>진통제, 차가운 찜질. 물집을 터뜨리거나 딱지를 뜯지 않아요</td></tr>
</tbody>
<caption>대한피부과학회, 미국피부과학회(AAD) 단순포진 치료 안내를 바탕으로 정리. 약은 의사·약사와 상의해 써요</caption></table></div>
<p>자주 재발하는 사람은 의사와 상의해 약을 미리 처방받아 두고, 따끔할 때 바로 먹는 방법도 있어요.</p>

<h2>옮기지 않으려면</h2>
<ul>
<li>물집과 딱지가 있는 동안 <strong>입맞춤</strong>, 컵·수저·립밤·수건 같이 쓰기를 피해요.</li>
<li>물집을 만진 손으로 눈을 비비지 않아요. 만졌다면 바로 손을 씻어요.</li>
<li>증상이 없을 때도 드물게 바이러스가 나와 옮을 수 있어요.</li>
<li>물집이 있을 때 구강성교를 하면 성기로 옮을 수 있어요.</li>
</ul>

<div class="box warn"><span class="h">이런 경우는 빨리 진료를 받아요</span>
<ul>
<li><strong>신생아·생후 몇 개월 아기</strong>에게 물집이 생기거나, 아기가 열이 나고 처져요. 신생아 헤르페스는 매우 위험해요. 입술 물집이 있는 어른은 아기에게 입을 맞추지 않아요.</li>
<li><strong>눈</strong>이 충혈되고 아프며 빛에 눈부셔요. 각막 감염은 시력에 영향을 줄 수 있어요.</li>
<li><strong>아토피 피부염</strong>이 있는 곳에 물집과 딱지가 빠르게 번지며 열이 나요(포진 습진).</li>
<li>항암 치료, 장기 이식 등으로 면역이 약한 상태예요.</li>
<li>10일이 넘도록 낫지 않거나 1년에 여러 번 심하게 재발해요.</li>
</ul></div>

<h2>입안 궤양과는 달라요</h2>
<p>입안 볼 안쪽이나 혀에 하얗고 둥글게 패는 <strong>아프타 궤양</strong>(흔히 '입병')은 단순포진과 다른 병이에요. 옮지 않고, 항바이러스제가 필요하지 않아요. 입술 바깥 경계에 물집이 무리 지어 생기면 단순포진, 입안에 한두 개 둥근 궤양이면 아프타인 경우가 많아요.</p>

<div class="box"><span class="h">입술 물집 체크리스트</span>
<ol>
<li>따끔한 순간 약 시작</li>
<li>물집·딱지 만지지 않기</li>
<li>입맞춤·식기·립밤 따로</li>
<li>신생아 가까이 가지 않기</li>
<li>자외선 차단 립밤</li>
<li>눈 증상·잦은 재발은 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>한 번 걸리면 평생 가나요?</dt>
<dd>바이러스는 몸속에 남지만, 재발 횟수는 사람마다 다르고 나이가 들수록 줄어드는 경우가 많아요. 평생 한두 번만 나타나는 사람도 있어요.</dd>
<dt>치약이나 알코올을 바르면 빨리 마르나요?</dt>
<dd>자극만 되고 효과는 확인되지 않았어요. 깨끗하게 두고 필요하면 항바이러스제를 써요.</dd>
<dt>입술 물집이 성병인가요?</dt>
<dd>입술 물집은 대부분 어린 시절 일상 접촉으로 옮은 1형 바이러스예요. 성병으로 보지 않아요. 다만 성기에도 옮을 수 있어요.</dd>
</dl>
