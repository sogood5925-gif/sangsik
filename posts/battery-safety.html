  data-title="리튬 배터리 안전: 부푼 보조배터리, 전동킥보드 충전, 비행기 반입 기준"
  data-thumb="100Wh|기내 반입 기준"
  data-summary="휴대폰, 보조배터리, 전동킥보드, 전기자전거에 들어가는 리튬 배터리는 한 번 불이 붙으면 끄기 어려워요. 불이 나는 원인과 위험 신호, 충전할 때 지킬 것, 비행기에 가지고 탈 때 기준, 부푼 배터리 버리는 법을 정리했어요."
  data-tags="리튬배터리,보조배터리,전동킥보드,화재예방,생활정보">
<p class="lead">리튬이온 배터리는 작은 크기에 많은 에너지를 담아요. 그래서 편리하지만, 한 번 내부에서 열이 나기 시작하면 스스로 온도가 더 오르는 '열폭주'가 일어나 순식간에 불길과 유독 가스를 뿜을 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>부풀었거나 뜨겁거나 이상한 냄새</strong>가 나는 배터리는 바로 쓰지 않아요.</li>
<li>전동킥보드·전기자전거는 <strong>눈에 보이는 곳에서</strong>, 정품 충전기로 충전해요.</li>
<li>보조배터리는 비행기에서 <strong>위탁 수하물로 부칠 수 없고</strong>, 100Wh 이하는 기내에 가지고 탈 수 있어요.</li>
<li>다 쓴 배터리는 단자에 테이프를 붙여 <strong>전용 수거함</strong>에 버려요.</li>
</ul></div>

<h2>배터리에 불이 나는 이유</h2>
<div class="tbl"><table>
<thead><tr><th>원인</th><th>예</th></tr></thead>
<tbody>
<tr><td>충격과 손상</td><td>떨어뜨리거나 눌리고, 구멍이 나서 내부 분리막이 망가져요</td></tr>
<tr><td>과충전과 비정품 충전기</td><td>인증받지 않은 충전기, 용량이 맞지 않는 충전기로 충전해요</td></tr>
<tr><td>높은 온도</td><td>한여름 차 안, 햇빛 드는 창가, 난방기 옆에 둬요</td></tr>
<tr><td>노화와 불량</td><td>오래 쓴 배터리, 저가 불량 셀, 임의로 개조한 배터리예요</td></tr>
<tr><td>물에 젖음</td><td>침수된 전동킥보드나 휴대폰을 말려서 다시 충전해요</td></tr>
</tbody>
<caption>소방청, 한국소비자원 리튬배터리 화재 예방 안내를 바탕으로 정리</caption></table></div>

<div class="box warn"><span class="h">바로 사용을 멈춰야 하는 신호</span>
<ul>
<li>배터리나 기기가 <strong>부풀어</strong> 케이스가 벌어지거나 화면이 들떠요.</li>
<li>충전하지 않는데도 <strong>뜨거워요.</strong></li>
<li>달콤하거나 화학약품 같은 <strong>냄새</strong>가 나요.</li>
<li>쉭 하는 소리, 연기, 액체가 새어 나와요.</li>
</ul>
<p>이럴 때는 충전기를 뽑고, 가능하면 불에 타지 않는 곳(현관 밖 콘크리트 바닥 등)으로 옮겨요. 이미 연기가 나면 만지지 말고 대피해 119에 신고해요.</p></div>

<h2>휴대폰과 보조배터리</h2>
<ul>
<li><strong>KC 인증</strong>을 받은 충전기와 케이블을 써요.</li>
<li>충전하면서 <strong>이불 속이나 베개 밑</strong>에 두지 않아요. 열이 빠져나가지 못해요.</li>
<li>한여름 차 안, 대시보드 위에 두지 않아요.</li>
<li>보조배터리를 주머니에 열쇠, 동전과 함께 넣지 않아요. 단자가 닿아 합선될 수 있어요.</li>
<li>떨어뜨려 찌그러진 보조배터리는 겉이 멀쩡해도 바꾸는 게 좋아요.</li>
</ul>

<h2>전동킥보드와 전기자전거</h2>
<p>개인형 이동장치 배터리는 휴대폰보다 수십 배 커서, 불이 나면 집 전체로 번지기 쉬워요. 특히 <strong>현관 앞에서 충전하다 불이 나면 대피로가 막혀요.</strong></p>
<ol>
<li>제조사 <strong>정품 충전기</strong>만 써요. 배터리를 임의로 개조하거나 용량을 늘리지 않아요.</li>
<li>현관, 복도, 대피 통로에서 충전하지 않아요.</li>
<li><strong>잠자는 동안, 외출한 동안</strong> 충전하지 않아요. 충전이 끝나면 바로 뽑아요.</li>
<li>충전하는 곳 주변에 불에 타기 쉬운 물건을 두지 않고, 가까이에 화재감지기를 둬요.</li>
<li>비나 물웅덩이에 젖었다면 충분히 마른 뒤 점검받고 충전해요.</li>
<li>한겨울 바깥에서 들어온 직후나 오래 달려 뜨거울 때는 식힌 뒤 충전해요.</li>
</ol>

<h2>비행기에 가지고 탈 때</h2>
<div class="tbl"><table>
<thead><tr><th>보조배터리 용량</th><th>기내 반입</th><th>위탁 수하물</th></tr></thead>
<tbody>
<tr><td>100Wh 이하</td><td>가능</td><td>불가</td></tr>
<tr><td>100Wh 초과~160Wh 이하</td><td>항공사 승인 필요, 보통 1인 2개까지</td><td>불가</td></tr>
<tr><td>160Wh 초과</td><td>불가</td><td>불가</td></tr>
</tbody>
<caption>국제항공운송협회(IATA) 위험물 규정, 국토교통부 항공 위험물 안내를 바탕으로 정리. 항공사·국가별로 개수와 보관 방법 규정이 추가될 수 있어요</caption></table></div>
<p>용량이 mAh로만 적혀 있다면 <strong>Wh = 전압(V) × mAh ÷ 1,000</strong>으로 계산해요. 보통 전압 3.7V 기준으로 20,000mAh 보조배터리는 약 74Wh예요.</p>
<ul>
<li>최근 기내 배터리 화재 이후 <strong>머리 위 선반에 넣지 않고 몸 가까이 보관</strong>하도록 하거나, 단자에 절연 테이프를 붙이거나 비닐 파우치에 넣도록 하는 규정이 생겼어요.</li>
<li>기내에서 보조배터리로 충전하는 것을 제한하는 항공사도 있어요.</li>
<li>규정이 자주 바뀌니 <strong>출발 전에 이용하는 항공사 안내</strong>를 확인해요.</li>
</ul>

<h2>불이 났다면</h2>
<ul>
<li>휴대폰이나 작은 기기에서 연기가 나면 전원을 뽑고, 가능하면 많은 양의 물로 식혀요. 리튬 배터리 불은 다시 살아날 수 있어요.</li>
<li>전동킥보드·전기자전거 배터리에서 불이 나면 끄려고 애쓰지 말고 <strong>즉시 대피</strong>해 119에 신고해요. 유독 가스가 많이 나와요.</li>
<li>연기를 피해 낮은 자세로 대피하고, 문을 닫아 번지는 것을 늦춰요.</li>
</ul>

<h2>다 쓴 배터리 버리기</h2>
<ul>
<li>폐건전지·폐배터리는 <strong>일반쓰레기에 넣지 않아요.</strong> 쓰레기 수거차와 처리장에서 눌려 불이 나는 사고가 이어지고 있어요.</li>
<li>단자에 절연 테이프를 붙여 주민센터, 아파트, 대형마트의 전용 수거함에 넣어요.</li>
<li>부푼 배터리는 억지로 누르거나 구멍을 내지 말고, 수거함 안내에 따르거나 제조사 서비스센터에 문의해요.</li>
<li>전동킥보드처럼 큰 배터리는 판매처나 지자체에 수거 방법을 문의해요.</li>
</ul>

<div class="box"><span class="h">배터리 안전 체크리스트</span>
<ol>
<li>KC 인증 충전기·케이블 쓰기</li>
<li>침대·이불 위에서 충전하지 않기</li>
<li>킥보드·자전거는 잘 때·외출 중 충전 금지</li>
<li>현관·복도에서 충전하지 않기</li>
<li>부푼 배터리 즉시 사용 중단</li>
<li>폐배터리는 테이프 붙여 전용 수거함으로</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>휴대폰을 밤새 충전해도 되나요?</dt>
<dd>요즘 휴대폰은 충전이 끝나면 전류를 조절하는 기능이 있어 정상 제품이라면 큰 문제는 적어요. 다만 이불 위나 베개 밑처럼 열이 갇히는 곳을 피하고, 인증받은 충전기를 쓰는 게 중요해요.</dd>
<dt>배터리는 0%까지 쓰고 충전하는 게 좋나요?</dt>
<dd>리튬 배터리는 완전 방전과 100% 상태로 오래 두는 것을 싫어해요. 대략 20~80% 사이에서 쓰면 수명에 유리하다고 알려져 있어요.</dd>
<dt>부푼 휴대폰은 어떻게 하나요?</dt>
<dd>충전과 사용을 멈추고 서비스센터에 가져가요. 화면을 눌러 넣거나 케이스를 억지로 닫지 않아요.</dd>
</dl>
