  data-title="치핵(치질): 변기에 오래 앉지 않기, 좌욕과 식이섬유, 수술이 필요한 단계"
  data-thumb="5분|변기에 앉는 시간"
  data-summary="치핵은 부끄러워 병원을 미루기 쉬운 흔한 병이에요. 내치핵과 외치핵의 차이, 튀어나오는 정도에 따른 단계, 식이섬유·물·좌욕 등 생활 치료, 고무밴드 결찰술과 수술이 필요한 경우, 항문 출혈이 있을 때 대장암을 꼭 확인해야 하는 이유를 정리했어요."
  data-tags="치핵,치질,항문출혈,변비,질병">
<p class="lead">배변 뒤 휴지에 선홍색 피가 묻어나거나, 항문에 무언가 튀어나왔다 들어가는 느낌. 치핵은 성인 여러 명 가운데 한 명이 겪을 만큼 흔한 병이에요. 대부분은 생활 습관만 바꿔도 좋아지지만, 출혈이 있다면 치핵으로 단정하기 전에 다른 원인을 확인하는 것도 중요해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>치핵은 항문 안쪽의 혈관 쿠션이 늘어나 붓고 밀려 나온 상태예요.</li>
<li>가장 중요한 치료는 <strong>변을 부드럽게</strong> 하고 <strong>변기에 오래 앉지 않는 것</strong>이에요.</li>
<li>따뜻한 물 <strong>좌욕</strong>이 통증과 부기를 덜어 줘요.</li>
<li>40대 이상의 항문 출혈, 빈혈, 배변 습관 변화가 있으면 <strong>대장내시경</strong>으로 다른 원인을 확인해요.</li>
</ul></div>

<h2>치핵은 왜 생길까</h2>
<p>항문 안쪽에는 원래 혈관이 풍부한 쿠션 조직이 있어 변이 새지 않게 막아 줘요. 배변할 때 힘을 오래 주거나, 변비·설사가 반복되면 이 쿠션이 늘어나고 아래로 밀려 나와요.</p>
<ul>
<li>변비와 딱딱한 변, 배변 때 오래 힘주기</li>
<li><strong>변기에 오래 앉아 있기</strong>(휴대폰, 신문)</li>
<li>잦은 설사</li>
<li>임신과 출산</li>
<li>오래 앉아 있는 생활, 무거운 물건 들기, 과음</li>
</ul>

<h2>내치핵과 외치핵</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>위치</th><th>주요 증상</th></tr></thead>
<tbody>
<tr><td>내치핵</td><td>항문 안쪽(통증 신경이 적은 곳)</td><td>배변 때 <strong>통증 없는 선홍색 출혈</strong>, 튀어나옴</td></tr>
<tr><td>외치핵</td><td>항문 바깥쪽 피부 아래</td><td>부기, 가려움. 속에 피가 굳으면(혈전) <strong>갑자기 딱딱하고 심하게 아픈 멍울</strong>이 생겨요</td></tr>
</tbody></table></div>
<div class="tbl"><table>
<thead><tr><th>내치핵 단계</th><th>모습</th><th>주된 치료</th></tr></thead>
<tbody>
<tr><td>1도</td><td>출혈만 있고 튀어나오지 않아요</td><td>생활 습관, 약</td></tr>
<tr><td>2도</td><td>배변 때 나왔다가 저절로 들어가요</td><td>생활 습관, 약, 고무밴드 결찰술</td></tr>
<tr><td>3도</td><td>손으로 밀어 넣어야 들어가요</td><td>고무밴드 결찰술 또는 수술</td></tr>
<tr><td>4도</td><td>밀어도 들어가지 않아요</td><td>수술</td></tr>
</tbody>
<caption>대한대장항문학회 치핵 건강 정보, 미국대장항문외과학회(ASCRS) 치핵 진료지침(2024)을 바탕으로 정리</caption></table></div>

<h2>생활 치료가 먼저예요</h2>
<ul>
<li><strong>식이섬유:</strong> 채소, 과일, 통곡물, 콩, 해조류로 하루 25~30g을 목표로 해요. 부족하면 차전자피 같은 섬유 보충제가 도움이 돼요.</li>
<li><strong>물:</strong> 섬유를 늘릴 때는 물도 충분히 마셔요.</li>
<li><strong>변기 시간:</strong> <strong>5분 안에</strong> 끝내요. 변이 안 나오면 일어났다가 나중에 다시 가요. 휴대폰은 들고 가지 않아요.</li>
<li><strong>힘주지 않기:</strong> 발밑에 작은 받침대를 두어 무릎을 올리면 배변이 편해져요.</li>
<li><strong>변의가 오면 참지 않기</strong></li>
<li>오래 앉아 있을 때는 중간중간 일어나 걸어요.</li>
</ul>

<h2>좌욕 하는 법</h2>
<div class="box note"><span class="h">따뜻한 물 좌욕</span>
<ol>
<li>대야나 좌욕기에 <strong>따뜻한 물</strong>(손을 넣어 기분 좋게 따뜻한 정도, 약 40°C)을 받아요.</li>
<li>엉덩이를 담그고 <strong>3~5분</strong> 앉아 있어요. 너무 오래 하면 오히려 부을 수 있어요.</li>
<li>하루 2~3번, 특히 배변 뒤에 해요.</li>
<li>부드러운 수건으로 두드려 물기를 말려요.</li>
</ol>
<p>소금, 소독약, 입욕제는 넣지 않아도 돼요. 물의 온기가 항문 근육을 풀어 통증과 부기를 줄여요.</p></div>

<h2>약과 시술</h2>
<ul>
<li><strong>연고·좌약:</strong> 국소 마취제나 스테로이드가 들어 있어 통증과 가려움을 덜어요. 스테로이드 성분은 오래 쓰면 피부가 얇아질 수 있어 짧게 써요.</li>
<li><strong>먹는 약:</strong> 정맥 순환을 돕는 플라보노이드 계열 약(디오스민 등)이 출혈과 증상을 줄이는 데 쓰여요.</li>
<li><strong>고무밴드 결찰술:</strong> 외래에서 치핵 뿌리를 고무줄로 묶어 떨어지게 해요. 2~3도 치핵에 효과적이에요.</li>
<li><strong>수술:</strong> 3~4도, 다른 치료로 안 되는 경우, 큰 외치핵이 함께 있는 경우에 해요. 수술 뒤 한동안 통증이 있어 진통제와 좌욕으로 관리해요.</li>
<li><strong>혈전성 외치핵:</strong> 생긴 지 2~3일 안이고 통증이 심하면 작은 절개로 핏덩이를 빼내면 빨리 편해져요. 그 뒤라면 대개 저절로 가라앉아요.</li>
</ul>

<div class="box warn"><span class="h">항문 출혈, 치핵으로 단정하지 마세요</span>
<ul>
<li><strong>40대 이상</strong>이고 항문 출혈이 처음 생겼어요.</li>
<li>피가 변에 섞여 있거나 <strong>검붉은 색·검은 변</strong>이에요.</li>
<li>변이 가늘어지거나, 변비와 설사가 번갈아 오는 등 <strong>배변 습관이 바뀌었어요.</strong></li>
<li>빈혈, 체중 감소, 가족 중 대장암 환자가 있어요.</li>
</ul>
<p>이럴 때는 대장암, 용종, 염증성 장질환을 확인하기 위해 대장내시경을 받아요. 많은 양의 피가 나거나 어지러우면 응급실로 가요.</p></div>

<h2>임신 중 치핵</h2>
<p>임신 중에는 자궁이 커지며 골반 혈관을 누르고, 변비가 잘 생겨 치핵이 흔해요. 대부분 출산 뒤 좋아지니, 임신 중에는 식이섬유, 물, 좌욕으로 관리하고 약은 산부인과와 상의해요.</p>

<div class="box"><span class="h">치핵 관리 체크리스트</span>
<ol>
<li>하루 식이섬유 25~30g과 충분한 물</li>
<li>변기에는 5분 이내, 휴대폰 두고 가기</li>
<li>힘주지 않기, 발 받침대 활용</li>
<li>배변 뒤 따뜻한 물 좌욕 3~5분</li>
<li>연고는 짧게, 효과 없으면 진료</li>
<li>40대 이상 출혈은 대장내시경</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>치핵은 수술 안 하면 계속 나빠지나요?</dt>
<dd>꼭 그렇지는 않아요. 생활 습관을 바꾸면 많은 경우 증상이 가라앉고 오래 유지돼요. 튀어나온 게 손으로 넣어야 들어가거나, 출혈이 반복되어 빈혈이 생기면 시술이나 수술을 고려해요.</dd>
<dt>비데를 쓰면 좋은가요?</dt>
<dd>미지근한 물로 짧게 씻으면 청결에 도움이 될 수 있어요. 수압을 세게, 오래 쓰면 오히려 자극이 될 수 있어요. 씻은 뒤 물기를 잘 말려요.</dd>
<dt>매운 음식과 술이 치핵에 나쁜가요?</dt>
<dd>술은 혈관을 확장시키고 설사를 일으켜 증상을 악화시킬 수 있어요. 매운 음식은 사람에 따라 항문 자극감을 늘릴 수 있어요. 증상이 심할 때는 줄여 보세요.</dd>
</dl>
