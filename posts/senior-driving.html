  data-title="어르신 운전: 몸의 변화가 운전에 주는 영향, 스스로 점검하기, 가족과 이야기 나누는 법"
  data-thumb="75세|면허 갱신 3년 주기"
  data-summary="나이가 들면 시력, 반응 속도, 복용하는 약이 운전에 영향을 줘요. 고령 운전자의 면허 갱신과 교육 제도, 운전 능력을 스스로 점검하는 신호, 약과 질환이 운전에 미치는 영향, 안전하게 오래 운전하는 요령, 운전을 줄이거나 그만둘 때 가족이 도울 방법과 면허 반납 지원을 정리했어요."
  data-tags="고령운전,운전면허,면허반납,교통안전,생활정보">
<p class="lead">운전은 많은 어르신에게 독립과 자유를 뜻해요. 병원과 장보기, 친구를 만나는 일이 모두 운전에 달려 있기도 해요. 그래서 '언제까지 운전해도 될까'는 나이 하나로 정할 수 있는 문제가 아니에요. 몸의 변화를 알아차리고, 조금씩 조정하며, 필요할 때 함께 이야기하는 과정이 필요해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>운전 능력은 <strong>나이보다 시력, 반응 속도, 인지 기능, 복용 약</strong>에 달려 있어요.</li>
<li>75세 이상은 면허 갱신 주기가 <strong>3년</strong>이고, 갱신 전에 <strong>교통안전교육</strong>을 받아요.</li>
<li>야간, 비 오는 날, 낯선 길, 복잡한 시간대를 피하는 것만으로도 위험이 줄어요.</li>
<li>운전을 줄이거나 그만둘 때는 <strong>이동 대안</strong>을 함께 마련해야 해요.</li>
</ul></div>

<h2>면허 제도</h2>
<div class="tbl"><table>
<thead><tr><th>나이</th><th>적성검사(갱신) 주기</th><th>추가 사항</th></tr></thead>
<tbody>
<tr><td>65세 미만</td><td class="num">10년</td><td>1종은 적성검사 포함</td></tr>
<tr><td>65~74세</td><td class="num">5년</td><td>갱신 때 신체검사</td></tr>
<tr><td>75세 이상</td><td class="num">3년</td><td>갱신 전 고령 운전자 교통안전교육(인지 기능 검사 포함) 이수</td></tr>
</tbody>
<caption>도로교통법 및 도로교통공단 운전면허 적성검사·고령운전자 교육 안내를 바탕으로 정리. 세부 기준은 바뀔 수 있어 도로교통공단 안전운전 통합민원에서 확인해요</caption></table></div>
<p>치매, 뇌전증, 시각 장애 등 운전에 영향을 줄 수 있는 질환이 확인되면 별도의 수시 적성검사를 받을 수 있어요.</p>

<h2>몸의 변화와 운전</h2>
<div class="tbl"><table>
<thead><tr><th>변화</th><th>운전에서 나타나는 모습</th><th>도움이 되는 것</th></tr></thead>
<tbody>
<tr><td>시력, 대비 감도 저하, 눈부심</td><td>야간·비 오는 날 차선과 보행자가 잘 안 보여요</td><td>1년에 한 번 안과 검진, 백내장 치료, 야간 운전 줄이기</td></tr>
<tr><td>시야가 좁아짐</td><td>옆에서 오는 차나 보행자를 늦게 봐요</td><td>녹내장 검진, 교차로에서 고개를 크게 돌려 확인</td></tr>
<tr><td>반응 속도 저하</td><td>갑작스러운 상황에서 브레이크가 늦어요</td><td>차간거리 넉넉히, 속도 줄이기</td></tr>
<tr><td>목·어깨가 굳음</td><td>후진, 차로 변경 때 뒤를 보기 어려워요</td><td>스트레칭, 후방 카메라·넓은 거울 활용</td></tr>
<tr><td>청력 저하</td><td>경적, 사이렌을 늦게 들어요</td><td>청력 검사, 필요하면 보청기</td></tr>
<tr><td>기억·판단력 변화</td><td>익숙한 길에서 헤매요</td><td>인지 기능 검사, 가족과 상의</td></tr>
</tbody>
<caption>도로교통공단 고령 운전자 안전 운전 안내, 미국 국립노화연구소(NIA) Older Drivers 자료를 바탕으로 정리</caption></table></div>

<h2>운전에 영향을 주는 약</h2>
<ul>
<li><strong>수면제, 신경안정제</strong>(벤조디아제핀 계열 등)</li>
<li><strong>일부 항히스타민제</strong>(감기약, 알레르기약, 멀미약 속 졸음을 부르는 성분)</li>
<li>일부 <strong>항우울제, 항정신병약, 마약성 진통제</strong></li>
<li><strong>혈당강하제</strong>: 저혈당이 오면 판단이 흐려질 수 있어요.</li>
</ul>
<p>새 약을 처방받으면 운전해도 되는지 의사·약사에게 물어봐요. 여러 약을 함께 먹는다면 한 번 전체를 점검받는 것도 좋아요. 스스로 약을 끊지는 않아요.</p>

<h2>스스로 점검하는 신호</h2>
<ul>
<li>차에 작은 긁힘과 흠집이 자주 생겨요.</li>
<li>차선을 넘거나 신호·표지판을 놓친 적이 있어요.</li>
<li>익숙한 길에서 방향을 잃은 적이 있어요.</li>
<li>다른 차가 자주 경적을 울려요.</li>
<li>운전하고 나면 몹시 지치거나 긴장돼요.</li>
<li>가족이나 친구가 옆자리에 타기를 꺼려요.</li>
</ul>
<p>이런 일이 늘어난다면 운전 습관을 바꾸거나 운전 능력을 점검받을 때예요.</p>

<h2>오래 안전하게 운전하는 요령</h2>
<ul>
<li><strong>밤, 비·눈 오는 날, 출퇴근 시간</strong>을 피해요.</li>
<li>잘 아는 길 위주로, 필요하면 출발 전에 경로를 확인해요.</li>
<li>좌회전보다 신호가 있는 교차로를 골라요. 비보호 좌회전은 부담이 커요.</li>
<li>운전석을 높이와 거리에 맞게 조정하고, 거울을 다시 맞춰요.</li>
<li>차를 바꿀 때는 자동 긴급 제동, 차로 이탈 경고 같은 안전 장치를 고려해요.</li>
<li>뒷유리에 <strong>고령 운전자 표지</strong>를 붙이면 다른 운전자가 배려하기 쉬워요.</li>
</ul>

<h2>가족이 이야기를 꺼낼 때</h2>
<ul>
<li>"이제 그만하세요"보다 <strong>구체적인 걱정</strong>으로 시작해요. "지난번 주차하다 기둥에 긁힌 게 마음에 걸려요."</li>
<li>한 번에 결정하지 않아도 돼요. 야간 운전 먼저 줄이는 것처럼 <strong>단계적으로</strong> 정해요.</li>
<li>의사의 의견을 함께 들으면 받아들이기 쉬워요.</li>
<li>운전을 그만두면 <strong>병원, 장보기, 모임</strong>에 어떻게 갈지 함께 계획해요. 이동이 끊기면 외로움과 우울이 커질 수 있어요.</li>
</ul>

<div class="box note"><span class="h">면허 자진 반납 지원</span>
<p>많은 지자체가 고령 운전자가 면허를 스스로 반납하면 교통카드나 지역화폐 같은 혜택을 줘요. 대상 나이와 혜택은 지자체마다 다르고 해마다 바뀌어요. 주소지 주민센터나 경찰서 민원실에 문의해요.</p></div>

<div class="box"><span class="h">어르신 운전 체크리스트</span>
<ol>
<li>1년에 한 번 눈·귀 검사</li>
<li>새 약은 운전 가능 여부 묻기</li>
<li>밤·악천후·혼잡 시간 피하기</li>
<li>차간거리 넉넉히, 속도 줄이기</li>
<li>점검 신호가 늘면 가족·의사와 상의</li>
<li>운전을 줄일 때 이동 대안 마련</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>몇 살이 되면 운전을 그만둬야 하나요?</dt>
<dd>정해진 나이는 없어요. 같은 나이라도 건강 상태가 많이 달라요. 신체와 인지 기능, 운전 습관을 함께 보고 판단해요.</dd>
<dt>고령 운전자 교육은 어디서 받나요?</dt>
<dd>도로교통공단 교육장이나 온라인으로 받을 수 있어요. 도로교통공단 누리집에서 일정과 방법을 확인해요.</dd>
<dt>치매 진단을 받았는데 운전해도 되나요?</dt>
<dd>초기라도 운전 능력이 떨어질 수 있어요. 담당 의사와 상의하고, 수시 적성검사 대상인지 확인해요.</dd>
</dl>
