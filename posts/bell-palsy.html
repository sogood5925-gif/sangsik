<p class="lead">양치하다 물이 입 한쪽으로 새고, 웃으면 얼굴이 한쪽으로 끌려가요. 하루 이틀 사이에 얼굴 한쪽이 움직이지 않게 되는 벨마비는 갑작스러워서 많이 놀라게 돼요. 먼저 뇌졸중이 아닌지 확인하고, 빨리 치료를 시작하면 대부분 좋아져요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>벨마비는 얼굴 근육을 움직이는 <strong>안면신경이 부어</strong> 한쪽 얼굴이 마비되는 병이에요.</li>
<li><strong>팔다리 힘 빠짐, 말 어눌함</strong>이 함께 있으면 뇌졸중일 수 있어 바로 119예요.</li>
<li>증상 시작 <strong>72시간 안에</strong> 먹는 스테로이드를 시작하면 회복에 도움이 돼요.</li>
<li>눈이 잘 감기지 않으면 <strong>인공눈물과 안대</strong>로 눈을 지켜야 해요.</li>
</ul></div>

<h2>벨마비란</h2>
<p>안면신경은 귀 안쪽의 좁은 뼈 통로를 지나 얼굴로 가요. 바이러스 감염 등으로 신경이 붓고 이 통로에서 눌리면 신호가 전달되지 않아 한쪽 얼굴이 마비돼요. 원인을 딱 집어 알 수 없는 경우를 벨마비라고 해요. 감기를 앓은 뒤, 피로하거나 스트레스가 클 때, 임신 후기, 당뇨가 있을 때 더 잘 생긴다고 알려져 있어요.</p>

<h2>나타나는 증상</h2>
<ul>
<li>한쪽 이마에 주름을 잡지 못하고, 눈썹이 처져요.</li>
<li>한쪽 <strong>눈이 완전히 감기지 않아요.</strong> 눈물이 흐르거나 오히려 말라요.</li>
<li>입꼬리가 처지고 물이나 음식이 한쪽으로 새요.</li>
<li>귀 뒤 통증, 한쪽 혀끝의 맛 변화, 소리가 크게 울리는 느낌</li>
<li>보통 <strong>하루~이틀 사이에</strong> 빠르게 심해졌다가 멈춰요.</li>
</ul>

<h2>뇌졸중과 구별</h2>
<div class="tbl"><table>
<thead><tr><th>특징</th><th>벨마비</th><th>뇌졸중</th></tr></thead>
<tbody>
<tr><td>이마 주름</td><td>마비된 쪽 이마도 주름이 안 잡혀요</td><td>이마 주름은 대개 잡혀요(입 주변 위주 마비)</td></tr>
<tr><td>팔다리</td><td>정상</td><td>같은 쪽 팔다리 힘 빠짐, 감각 이상이 흔해요</td></tr>
<tr><td>말과 시야</td><td>발음이 새는 정도</td><td>말이 어눌하거나 이해 못함, 시야 이상</td></tr>
<tr><td>진행</td><td>하루~이틀에 걸쳐</td><td>갑자기 몇 분 만에</td></tr>
</tbody>
<caption>미국 이비인후과·두경부외과학회(AAO-HNS) 벨마비 진료지침(2013), 대한신경과학회 자료를 바탕으로 정리. 스스로 판단하기 어렵다면 응급 진료를 받아요</caption></table></div>

<div class="box warn"><span class="h">바로 119를 불러야 할 때</span>
<ul>
<li>얼굴 마비와 함께 <strong>팔이나 다리에 힘이 빠지거나</strong> 저려요.</li>
<li><strong>말이 어눌하거나</strong> 말을 이해하지 못해요.</li>
<li>어지럽고 걷기 어렵거나, 물체가 둘로 보여요.</li>
<li>갑자기 심한 두통이 생겼어요.</li>
</ul></div>

<h2>치료</h2>
<div class="tbl"><table>
<thead><tr><th>치료</th><th>설명</th></tr></thead>
<tbody>
<tr><td>먹는 스테로이드</td><td>신경의 부기를 줄여요. <strong>증상 시작 72시간 안에</strong> 시작하는 것을 권해요. 당뇨가 있다면 혈당을 함께 관리해요</td></tr>
<tr><td>항바이러스제</td><td>마비가 심할 때 스테로이드와 함께 쓰기도 해요. 단독으로는 권하지 않아요</td></tr>
<tr><td>눈 보호</td><td>낮에는 인공눈물, 밤에는 안연고와 안대·테이프로 눈을 감긴 상태로 보호해요</td></tr>
<tr><td>재활</td><td>거울을 보며 천천히 표정 운동. 회복이 더디면 전문 재활을 받아요</td></tr>
</tbody>
<caption>미국 이비인후과·두경부외과학회(AAO-HNS) 벨마비 진료지침, 대한이비인후과학회 안내를 바탕으로 정리</caption></table></div>

<h2>눈을 지키는 게 먼저예요</h2>
<p>눈이 잘 감기지 않으면 자는 동안 각막이 말라 상처가 나고, 심하면 시력에 영향을 줄 수 있어요. 눈이 빨갛게 충혈되고 아프거나, 모래가 들어간 듯 까끌거리면 안과 진료를 받아요. 바람 부는 날에는 보안경을 쓰면 좋아요.</p>

<h2>회복 과정</h2>
<ul>
<li>대부분 <strong>2~3주 무렵</strong>부터 조금씩 움직임이 돌아오기 시작해요.</li>
<li>많은 사람이 <strong>3~6개월 안에</strong> 거의 회복돼요. 처음 마비가 완전했거나 나이가 많으면 회복이 더 걸릴 수 있어요.</li>
<li>회복 과정에서 눈을 감으면 입꼬리가 같이 올라가는 등 <strong>근육이 같이 움직이는 후유증</strong>이 남기도 해요. 재활 치료와 보톡스 주사로 조절할 수 있어요.</li>
<li>3~4개월이 지나도 움직임이 전혀 돌아오지 않으면 다른 원인이 없는지 다시 검사해요.</li>
</ul>

<h2>귀에 물집이 함께 생긴다면</h2>
<p>얼굴 마비와 함께 <strong>귀 안이나 귓바퀴에 물집</strong>이 생기고 귀가 몹시 아프면 대상포진 바이러스가 원인인 <strong>람세이 헌트 증후군</strong>일 수 있어요. 난청, 어지럼이 함께 오기도 하고 벨마비보다 회복이 더딘 편이라 빠른 항바이러스 치료가 중요해요.</p>

<div class="box"><span class="h">안면마비 체크리스트</span>
<ol>
<li>팔다리·말 이상 있으면 즉시 119</li>
<li>72시간 안에 진료 받기</li>
<li>낮에는 인공눈물, 밤에는 안대</li>
<li>당뇨가 있으면 스테로이드 중 혈당 확인</li>
<li>귀 물집·통증 있으면 알리기</li>
<li>거울 보며 천천히 표정 운동</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>찬 바닥에서 자면 입이 돌아간다는 말이 맞나요?</dt>
<dd>추위 자체가 직접 원인이라는 근거는 뚜렷하지 않아요. 바이러스 감염과 신경의 부기가 더 중요한 원인으로 여겨져요.</dd>
<dt>침이나 전기 자극 치료는 효과가 있나요?</dt>
<dd>침 치료는 연구 결과가 일관되지 않고, 초기 전기 자극은 권하지 않는 지침도 있어요. 먼저 스테로이드 치료와 눈 보호를 챙기고, 다른 치료는 담당 의사와 상의해요.</dd>
<dt>다시 생길 수도 있나요?</dt>
<dd>대부분 한 번으로 끝나지만 일부에서 재발해요. 같은 쪽에 반복되면 다른 원인이 없는지 검사해요.</dd>
</dl>
