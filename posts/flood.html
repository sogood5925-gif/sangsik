  data-title="폭우와 침수 대처: 반지하·지하주차장·차량 안에서 먼저 나오기, 물이 빠진 뒤 할 일"
  data-thumb="무릎 높이|문 열기 어려워지는 수위"
  data-summary="짧은 시간에 쏟아지는 비는 반지하 집, 지하주차장, 지하차도를 몇 분 만에 물에 잠기게 해요. 호우 특보의 기준, 지하 공간과 차량에서 빨리 벗어나야 하는 이유, 차가 물에 잠길 때 탈출법, 산사태 신호, 물이 빠진 뒤 전기·곰팡이·감염병 관리까지 정리했어요."
  data-tags="폭우,침수,반지하,차량침수,생활정보">
<p class="lead">물은 생각보다 빨리 차오르고, 생각보다 훨씬 무거워요. 무릎 높이까지만 물이 차도 밖에서 누르는 수압 때문에 문을 열기 어려워져요. 그래서 침수 대비의 핵심은 '물이 차오르기 전에' 지하와 낮은 곳에서 벗어나는 거예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>호우 특보나 긴급재난문자가 오면 <strong>반지하, 지하주차장, 지하차도</strong>에서 먼저 벗어나요.</li>
<li>물이 <strong>발목 이상</strong> 들어오기 시작하면 짐을 챙기지 말고 대피해요.</li>
<li>차가 물에 잠기기 시작하면 <strong>바퀴 절반이 잠기기 전에</strong> 차를 버리고 높은 곳으로 가요.</li>
<li>물이 빠진 뒤에는 <strong>전기 점검 전 전원을 켜지 않고</strong>, 물에 잠긴 음식은 버려요.</li>
</ul></div>

<h2>호우 특보 기준</h2>
<div class="tbl"><table>
<thead><tr><th>특보</th><th>기준</th></tr></thead>
<tbody>
<tr><td>호우주의보</td><td>3시간 강우량 60mm 이상 또는 12시간 강우량 110mm 이상 예상</td></tr>
<tr><td>호우경보</td><td>3시간 강우량 90mm 이상 또는 12시간 강우량 180mm 이상 예상</td></tr>
<tr><td>극한 호우 긴급재난문자</td><td>짧은 시간에 매우 강한 비가 관측되면 해당 지역 휴대폰으로 바로 발송돼요</td></tr>
</tbody>
<caption>기상청 기상특보 발표 기준을 바탕으로 정리</caption></table></div>
<p>시간당 30mm만 넘어도 도로의 배수구가 감당하지 못하고 물이 넘치기 시작해요. 시간당 50mm 이상이면 앞이 잘 보이지 않고 낮은 곳이 빠르게 잠겨요.</p>

<h2>미리 준비할 것</h2>
<ul>
<li>집 주변 <strong>배수구와 빗물받이</strong>의 낙엽, 쓰레기를 치워요.</li>
<li>반지하라면 <strong>물막이판(차수판)</strong>, 모래주머니를 준비하고, 창문 앞 물건을 치워요. 지자체에 따라 설치를 지원하기도 해요.</li>
<li>지역 <strong>대피소 위치</strong>와 대피 길을 가족과 확인해요. '안전디딤돌' 앱에서 찾을 수 있어요.</li>
<li>휴대폰 충전, 손전등, 비상 식수와 약을 챙겨 둬요.</li>
<li>하천 가까이 사는 경우 주민 대피 방송과 마을 알림을 잘 들어요.</li>
</ul>

<h2>장소별 대처</h2>
<div class="tbl"><table>
<thead><tr><th>장소</th><th>이렇게 해요</th></tr></thead>
<tbody>
<tr><td>반지하·지하 집</td><td>물이 들어오기 시작하면 바로 밖으로. 문이 안 열리면 창문으로 나가고, 119에 위치를 알려요. 이웃 반지하 가구에도 알려요</td></tr>
<tr><td>지하주차장</td><td>호우 때는 차를 빼러 내려가지 않아요. 물이 들어오면 차를 두고 계단으로 올라가요</td></tr>
<tr><td>지하차도·저지대 도로</td><td>물이 고인 지하차도에 들어가지 않고 돌아가요. 이미 들어갔다면 차를 버리고 빠르게 걸어 나와요</td></tr>
<tr><td>하천·계곡</td><td>물 구경, 산책로 이용을 멈춰요. 둔치 주차장 차량은 미리 옮겨요</td></tr>
<tr><td>길 위</td><td>흙탕물 속 맨홀 뚜껑이 열려 있을 수 있어요. 물이 흐르는 길은 걷지 말고, 전신주·신호등·가로등에서 떨어져요</td></tr>
</tbody>
<caption>행정안전부 풍수해 국민행동요령을 바탕으로 정리</caption></table></div>

<h2>차가 물에 잠길 때</h2>
<div class="box warn"><span class="h">차에서 탈출하는 법</span>
<ol>
<li>도로에 물이 차오르면 <strong>바퀴 절반이 잠기기 전에</strong> 차를 세우고 높은 곳으로 걸어가요. 흐르는 물은 30cm만 돼도 차를 밀어낼 수 있어요.</li>
<li>차가 떠오르거나 잠기기 시작하면 안전띠를 풀고 <strong>창문을 먼저 열어요.</strong> 전기 장치가 멈추기 전에 열어야 해요.</li>
<li>창문이 안 열리면 <strong>머리 받침 쇠막대</strong>나 비상 탈출 망치로 옆 유리창의 <strong>모서리</strong>를 세게 쳐요. 앞 유리는 잘 깨지지 않아요.</li>
<li>문이 수압 때문에 안 열리면, 차 안에 물이 차올라 안팎 높이 차이가 30cm 안쪽이 될 때 문을 열 수 있어요. 당황하지 말고 그때 힘껏 밀어요.</li>
<li>나온 뒤에는 차 지붕이나 높은 곳으로 올라가 구조를 요청해요.</li>
</ol></div>

<h2>산사태와 급류</h2>
<ul>
<li>산비탈에서 <strong>작은 돌이 굴러 내리거나, 흙탕물이 나오거나, 땅이 갈라지는 소리</strong>가 나면 산사태 전조일 수 있어요. 산에서 멀리, 옆 방향으로 대피해요.</li>
<li>계곡 물이 갑자기 흐려지고 나뭇가지가 떠내려오면 상류에서 큰물이 오고 있다는 신호예요.</li>
<li>물에 빠진 사람을 봤다면 직접 뛰어들지 말고 119에 신고한 뒤 뜨는 물건을 던져 줘요.</li>
</ul>

<h2>물이 빠진 뒤</h2>
<ul>
<li><strong>전기:</strong> 누전차단기를 내린 상태에서 전문가 점검을 받기 전에는 전기를 켜지 않아요. 물에 잠겼던 가전은 말렸더라도 점검받고 써요.</li>
<li><strong>가스:</strong> 가스 냄새가 나면 불을 켜지 말고 창문을 열고 밖으로 나가 신고해요.</li>
<li><strong>음식과 물:</strong> 흙탕물에 닿은 음식, 약, 화장품은 버려요. 단수 뒤 수돗물이 흐리면 한동안 흘려 보낸 뒤 써요.</li>
<li><strong>청소:</strong> 장화, 고무장갑, 마스크를 쓰고 해요. 흙탕물에는 하수와 세균이 섞여 있어요. 청소 뒤에는 비누로 손을 씻어요.</li>
<li><strong>곰팡이:</strong> 젖은 벽지, 장판, 단열재는 빨리 걷어 내고 환기해 말려요. 이틀만 지나도 곰팡이가 자라요.</li>
<li><strong>상처와 감염:</strong> 흙탕물 속 작업 중 상처가 나면 잘 씻고, 파상풍 예방접종 여부를 확인해요. 가을 수해 뒤 고열·근육통이 생기면 렙토스피라증 같은 감염병 가능성을 의료진에게 알려요.</li>
<li><strong>피해 신고:</strong> 사진을 찍어 두고 주민센터에 피해를 신고하면 지원 절차를 안내받을 수 있어요.</li>
</ul>

<div class="box"><span class="h">폭우 체크리스트</span>
<ol>
<li>배수구·빗물받이 청소</li>
<li>대피소 위치와 대피 길 확인</li>
<li>재난문자 오면 지하 공간에서 먼저 나오기</li>
<li>지하차도·물 고인 길 들어가지 않기</li>
<li>차는 바퀴 절반 잠기기 전에 버리기</li>
<li>물 빠진 뒤 전기 점검 전 전원 켜지 않기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>침수된 차를 몰고 나와도 되나요?</dt>
<dd>엔진에 물이 들어간 차는 시동을 걸면 엔진이 크게 망가질 수 있어요. 시동을 걸지 말고 견인해 점검받아요. 보험사에 먼저 연락해요.</dd>
<dt>모래주머니가 없으면요?</dt>
<dd>쓰레기봉투에 흙이나 물을 채워 이중으로 묶어 문 앞에 쌓으면 임시로 쓸 수 있어요. 다만 물이 계속 차오르면 막는 것보다 대피가 먼저예요.</dd>
<dt>아파트 고층은 괜찮나요?</dt>
<dd>집은 안전해도 지하주차장과 전기실이 잠기면 정전, 단수, 엘리베이터 멈춤이 생겨요. 호우 때는 지하주차장에 내려가지 말고 관리사무소 방송을 따라요.</dd>
</dl>
