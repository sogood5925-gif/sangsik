  data-title="판토텐산(비타민 B5): 어디에나 있어서 부족하기 어려운 비타민, 탈모·피부 광고를 볼 때"
  data-thumb="5mg|성인 충분섭취량"
  data-summary="판토텐산은 '어디에나 있다'는 뜻의 이름처럼 거의 모든 음식에 들어 있는 비타민 B군이에요. 우리 몸에서 에너지를 만드는 조효소 A의 재료가 되는 역할, 하루 필요량과 많이 든 음식, 결핍이 드문 이유와 생길 수 있는 경우, 탈모·여드름 개선 광고의 근거, 바르는 덱스판테놀을 정리했어요."
  data-tags="판토텐산,비타민B5,조효소A,비타민B군,영양소">
<p class="lead">판토텐산이라는 이름은 그리스어로 '어디에나'라는 말에서 왔어요. 고기, 달걀, 곡물, 채소, 버섯까지 거의 모든 식품에 조금씩 들어 있어서, 평소 식사를 하는 사람에게 부족한 경우는 매우 드물어요. 그런데도 탈모나 피부에 좋다는 광고에 자주 등장해요. 무엇이 알려져 있고 무엇이 과장인지 나눠 볼게요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인 충분섭취량은 하루 <strong>5mg</strong>이에요. 보통 식사로 채워져요.</li>
<li>판토텐산은 <strong>조효소 A</strong>의 재료로, 탄수화물·지방·단백질에서 에너지를 만드는 데 쓰여요.</li>
<li>결핍은 <strong>극심한 영양실조</strong> 같은 특수한 상황에서만 생겨요.</li>
<li>먹는 판토텐산이 <strong>탈모나 여드름을 개선한다는 근거는 부족</strong>해요.</li>
</ul></div>

<h2>판토텐산이 하는 일</h2>
<ul>
<li><strong>에너지 대사:</strong> 조효소 A(CoA)의 재료가 되어 음식에서 에너지를 꺼내는 과정에 참여해요.</li>
<li><strong>지방산과 콜레스테롤 합성:</strong> 세포막과 호르몬을 만드는 데 필요해요.</li>
<li><strong>신경전달물질:</strong> 아세틸콜린을 만드는 데 쓰여요.</li>
<li>헤모글로빈의 구성 성분을 만드는 과정에도 관여해요.</li>
</ul>

<p>판토텐산은 열과 가공에 약한 편이에요. 통곡물을 정제하거나 오래 가공하면 줄어들어요. 여러 식품을 골고루, 덜 가공된 형태로 먹으면 충분해요.</p>

<h2>결핍은 언제 생길까</h2>
<p>판토텐산 결핍은 전쟁 포로나 심한 영양실조, 실험적으로 판토텐산을 뺀 식사를 한 경우처럼 매우 특수한 상황에서 보고됐어요. 이때 <strong>발이 화끈거리고 저리는 증상</strong>, 피로, 두통, 불면, 소화 장애가 나타났어요. 평범한 식사를 하는 사람에게 판토텐산만 따로 부족해지는 경우는 거의 없어요. 오랜 알코올 의존처럼 전반적인 영양이 부족하면 다른 비타민 B군과 함께 부족할 수 있어요.</p>

<h2>탈모·피부 광고, 근거는?</h2>
<ul>
<li><strong>탈모:</strong> 쥐에게 판토텐산을 결핍시켰을 때 털 색과 털 빠짐 변화가 생긴 실험이 알려지며 탈모 영양제에 자주 들어가요. 하지만 결핍이 없는 사람이 판토텐산을 먹어 탈모가 좋아졌다는 믿을 만한 연구는 부족해요.</li>
<li><strong>여드름:</strong> 소규모 연구가 있지만 근거가 약하고, 고용량의 장기 안전성도 충분히 확인되지 않았어요.</li>
<li><strong>콜레스테롤:</strong> 판테틴(판토텐산 유도체)이 지질 수치를 조금 낮췄다는 연구가 있지만, 치료로 권할 만한 근거는 아니에요. 지질 이상은 의사와 치료 방법을 상의해요.</li>
</ul>
<p>탈모가 걱정된다면 원인(유전, 갑상선, 철 결핍, 스트레스 등)을 먼저 확인하는 것이 더 도움이 돼요.</p>

<h2>바르는 덱스판테놀</h2>
<p>연고나 크림 속 <strong>덱스판테놀</strong>은 피부에서 판토텐산으로 바뀌어 피부 장벽 회복과 보습을 도와요. 기저귀 발진, 건조하고 갈라진 피부, 가벼운 상처에 쓰여요. 먹는 판토텐산과는 쓰임이 달라요.</p>

<div class="box warn"><span class="h">영양제를 먹을 때 주의</span>
<p>판토텐산 자체는 고용량에서도 대체로 안전해 상한섭취량이 정해져 있지 않지만, 하루 수 그램처럼 매우 많이 먹으면 설사가 생길 수 있어요. 탈모 영양제에는 다른 성분(비오틴 등)이 함께 들어 있는 경우가 많아요. 고용량 비오틴은 갑상선 등 <strong>혈액 검사 결과를 틀어지게</strong> 할 수 있어 검사 전에 알려요. 약을 먹고 있다면 약사와 상의해요.</p></div>

<div class="box"><span class="h">판토텐산 체크리스트</span>
<ol>

<li>가공이 덜 된 식품 고르기</li>
<li>따로 보충할 필요는 대개 없음</li>
<li>탈모는 원인부터 확인</li>
<li>영양제 속 다른 성분도 확인</li>
<li>술을 많이 마신다면 전반적 영양 점검</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>종합비타민에 판토텐산이 들어 있는데 충분한가요?</dt>
<dd>보통 식사만으로도 충분해서, 종합비타민에 든 양이면 부족할 걱정이 없어요.</dd>
<dt>비타민 B5를 먹으면 피로가 풀리나요?</dt>
<dd>결핍이 있을 때는 도움이 되지만, 부족하지 않은 사람에게 피로 회복 효과가 확인되지는 않았어요. 피로가 오래가면 빈혈, 갑상선, 수면 문제를 확인해요.</dd>
<dt>임신 중에는 더 필요한가요?</dt>
<dd>조금 더 필요하지만 균형 잡힌 식사와 임신부용 영양제로 충분히 채워져요.</dd>
</dl>
