  data-title="대사증후군: 다섯 가지 기준 중 셋, 허리둘레가 먼저 알려 주는 신호, 5% 감량의 힘"
  data-thumb="3/5|진단 기준 개수"
  data-summary="허리둘레, 혈압, 혈당, 중성지방, HDL 콜레스테롤 가운데 세 가지 이상이 기준을 넘으면 대사증후군이에요. 각 기준 수치와 건강검진 결과지 읽는 법, 뱃살이 핵심인 이유, 당뇨·심뇌혈관 질환·지방간과의 관계, 체중 5~10% 감량과 운동·식사·수면으로 되돌리는 방법을 정리했어요."
  data-tags="대사증후군,허리둘레,복부비만,중성지방,질병">
<p class="lead">건강검진 결과지를 받아 보면 혈압, 혈당, 콜레스테롤이 하나하나는 '조금 높음' 정도라서 대수롭지 않게 넘기기 쉬워요. 그런데 이 '조금씩'이 한 사람에게 여러 개 모이면 당뇨와 심장병, 뇌졸중 위험이 크게 올라가요. 대사증후군은 이렇게 흩어진 신호를 한데 묶어 보는 경고등이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>아래 <strong>다섯 가지 중 세 가지 이상</strong>이면 대사증후군이에요.</li>
<li>한가운데에는 <strong>복부 비만(내장지방)</strong>과 인슐린 저항성이 있어요.</li>
<li>대사증후군이 있으면 <strong>당뇨와 심뇌혈관 질환</strong> 위험이 높아져요.</li>
<li>체중을 <strong>5~10%</strong>만 줄여도 여러 수치가 함께 좋아져요.</li>
</ul></div>

<h2>진단 기준</h2>
<div class="tbl"><table>
<thead><tr><th>항목</th><th>기준</th></tr></thead>
<tbody>
<tr><td>허리둘레</td><td class="num">남성 90cm 이상, 여성 85cm 이상</td></tr>
<tr><td>혈압</td><td class="num">130/85mmHg 이상 또는 혈압약 복용</td></tr>
<tr><td>공복 혈당</td><td class="num">100mg/dL 이상 또는 당뇨약 복용</td></tr>
<tr><td>중성지방</td><td class="num">150mg/dL 이상 또는 관련 약 복용</td></tr>
<tr><td>HDL 콜레스테롤</td><td class="num">남성 40mg/dL 미만, 여성 50mg/dL 미만</td></tr>
</tbody>
<caption>미국 콜레스테롤 교육 프로그램(NCEP-ATP III) 기준에 대한비만학회 한국인 허리둘레 기준을 적용해 정리. 국가건강검진 결과지의 대사증후군 위험 요인 항목도 같은 기준을 써요</caption></table></div>
<p>세 가지가 되지 않더라도 한두 가지가 있다면 '위험 요인이 있는 상태'예요. 지금부터 관리하면 대사증후군으로 넘어가는 것을 막을 수 있어요.</p>

<h2>왜 뱃살이 핵심일까</h2>
<p>배 속 장기 사이에 쌓이는 <strong>내장지방</strong>은 단순히 저장된 기름이 아니라 염증 물질과 호르몬을 내보내요. 이 물질들이 인슐린이 잘 듣지 않게 만들고(인슐린 저항성), 간에 지방을 쌓고, 혈압과 중성지방을 올리고, 좋은 콜레스테롤을 낮춰요. 몸무게가 정상이어도 <strong>허리둘레가 크면</strong> 위험할 수 있어요.</p>
<div class="box note"><span class="h">허리둘레 재는 법</span>
<p>숨을 편하게 내쉰 상태에서, 갈비뼈 가장 아래와 골반 위쪽 뼈의 <strong>중간</strong>을 바닥과 수평으로 재요. 배꼽 위치보다 이 기준이 정확해요. 한 달에 한 번, 같은 방법으로 재면 변화를 볼 수 있어요.</p></div>

<h2>대사증후군이 이어지는 병</h2>
<ul>
<li><strong>제2형 당뇨병</strong></li>
<li><strong>심근경색, 뇌졸중</strong> 등 심뇌혈관 질환</li>
<li><strong>대사이상 지방간</strong>, 간 섬유화</li>
<li>통풍, 수면무호흡증, 다낭성난소증후군, 일부 암</li>
</ul>

<h2>되돌리는 방법</h2>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>목표</th></tr></thead>
<tbody>
<tr><td>체중</td><td>6개월~1년 동안 지금 체중의 5~10% 감량. 한 달 1~2kg 정도로 천천히</td></tr>
<tr><td>유산소 운동</td><td>빠르게 걷기 등 중강도로 주 150분 이상</td></tr>
<tr><td>근력 운동</td><td>주 2회 이상. 근육이 늘면 혈당 조절이 좋아져요</td></tr>
<tr><td>식사</td><td>정제 탄수화물·단 음료 줄이기, 채소·통곡물·콩·생선 늘리기, 싱겁게</td></tr>
<tr><td>술</td><td>줄이거나 끊기. 중성지방과 혈압, 지방간에 직접 영향</td></tr>
<tr><td>담배</td><td>끊기. 인슐린 저항성과 혈관 손상을 키워요</td></tr>
<tr><td>수면</td><td>7시간 안팎. 수면 부족은 식욕과 혈당을 흔들어요</td></tr>
</tbody>
<caption>대한비만학회 비만 진료지침, 한국지질·동맥경화학회, 대한당뇨병학회 생활습관 권고를 바탕으로 정리</caption></table></div>
<p>생활 습관만으로 수치가 충분히 내려가지 않거나 이미 위험이 높다면, 혈압·혈당·지질 약을 함께 써요. 약을 먹더라도 생활 습관 관리가 기본이에요.</p>

<h2>작은 변화부터</h2>
<ul>
<li>단 음료를 물이나 무가당 차로 바꿔요.</li>
<li>흰쌀밥에 잡곡을 섞고, 밥 양을 3분의 2로 줄여요.</li>
<li>식사 뒤 10~15분 걸어요. 식후 혈당이 덜 올라요.</li>
<li>엘리베이터 대신 계단, 한 정거장 먼저 내려 걸어요.</li>
<li>야식과 늦은 저녁을 줄여요.</li>
</ul>

<div class="box warn"><span class="h">이런 증상은 바로 119</span>
<p>대사증후군이 있는 사람은 심근경색과 뇌졸중 위험이 높아요. <strong>가슴 통증이나 조이는 느낌, 식은땀</strong>, <strong>한쪽 팔다리 힘 빠짐, 말이 어눌해짐, 얼굴 한쪽 처짐</strong>이 생기면 바로 119를 불러요.</p></div>

<div class="box"><span class="h">대사증후군 체크리스트</span>
<ol>
<li>결과지에서 다섯 항목 확인</li>
<li>한 달에 한 번 허리둘레 재기</li>
<li>목표는 체중 5~10% 감량</li>
<li>주 150분 걷기 + 근력 운동 2회</li>
<li>단 음료·술 줄이기, 금연</li>
<li>1년마다 혈압·혈당·지질 다시 확인</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>마른 편인데도 대사증후군일 수 있나요?</dt>
<dd>체중이 정상이어도 뱃살이 많고 근육이 적으면 생길 수 있어요. 허리둘레와 혈액 검사를 함께 봐요.</dd>
<dt>대사증후군이면 약을 먹어야 하나요?</dt>
<dd>대사증후군 자체를 치료하는 약이 따로 있는 건 아니에요. 각각의 수치가 치료 기준을 넘으면 혈압약, 당뇨약, 지질약을 써요.</dd>
<dt>뱃살만 빼는 운동이 있나요?</dt>
<dd>특정 부위만 빼는 운동은 없어요. 유산소 운동과 식사 조절로 전체 체지방을 줄이면 내장지방이 먼저 빠지는 편이에요.</dd>
</dl>
