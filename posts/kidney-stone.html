  data-title="요로결석: 옆구리를 찌르는 통증, 저절로 빠지는 크기와 재발을 막는 물 2.5L"
  data-thumb="2.5L|하루 소변량 목표"
  data-summary="요로결석은 출산만큼 아프다고 할 정도로 통증이 심해요. 옆구리에서 사타구니로 뻗치는 통증의 특징, 크기에 따라 저절로 빠질 가능성, 체외충격파와 내시경 치료, 열이 나면 응급인 이유, 칼슘을 줄이지 말아야 하는 이유 등 재발을 막는 식습관을 정리했어요."
  data-tags="요로결석,신장결석,옆구리통증,수분섭취,질병">
<p class="lead">새벽에 갑자기 옆구리가 칼로 찌르듯 아프고, 어떤 자세를 해도 편하지 않아 몸부림치게 되는 통증. 요로결석의 전형적인 모습이에요. 다행히 작은 돌은 저절로 빠지는 경우가 많고, 큰 돌도 치료법이 잘 갖춰져 있어요. 문제는 재발이 흔하다는 것이라 예방 습관이 중요해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>통증은 <strong>옆구리에서 아랫배, 사타구니</strong>로 뻗치고, 혈뇨와 구역질이 함께 오기 쉬워요.</li>
<li><strong>5mm 이하</strong> 결석은 상당수가 몇 주 안에 저절로 빠져요.</li>
<li>결석이 있으면서 <strong>열이 나면</strong> 막힌 콩팥에 감염이 생긴 것일 수 있어 응급이에요.</li>
<li>재발을 막으려면 하루 소변이 <strong>2~2.5L</strong>가 되도록 물을 마시고, 소금은 줄이되 <strong>칼슘은 줄이지 않아요.</strong></li>
</ul></div>

<h2>결석은 왜 생길까</h2>
<p>소변 속 칼슘, 수산(옥살산), 요산 같은 성분이 너무 진해지면 결정이 생기고 점점 커져 돌이 돼요. 콩팥에 있을 때는 증상이 없다가, 요관으로 내려가며 소변 길을 막을 때 극심한 통증이 생겨요.</p>
<ul>
<li>물을 적게 마시거나 땀을 많이 흘리는 환경(여름, 야외 작업)</li>
<li>짠 음식, 동물성 단백질을 많이 먹는 식습관</li>
<li>비만, 당뇨, 통풍, 부갑상선 기능 항진증</li>
<li>가족력, 이전 결석 병력</li>
</ul>

<h2>결석의 종류</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>특징</th></tr></thead>
<tbody>
<tr><td>칼슘 옥살산 결석</td><td>가장 흔해요(대부분). 수분 부족, 짠 식사, 옥살산이 많은 식사와 관련 있어요</td></tr>
<tr><td>칼슘 인산 결석</td><td>소변이 알칼리성일 때 잘 생겨요</td></tr>
<tr><td>요산 결석</td><td>통풍, 당뇨, 비만, 동물성 단백질 과다와 관련 있어요. 약으로 녹일 수 있는 경우가 있어요</td></tr>
<tr><td>감염 결석(스트루바이트)</td><td>요로감염과 관련 있고 크게 자랄 수 있어요</td></tr>
<tr><td>시스틴 결석</td><td>드문 유전 질환이에요</td></tr>
</tbody>
<caption>대한비뇨의학회 요로결석 건강 정보, 미국비뇨기과학회(AUA) 지침을 바탕으로 정리</caption></table></div>
<p>빠져나온 돌은 버리지 말고 모아서 성분 검사를 받으면 예방법을 정하는 데 도움이 돼요.</p>

<h2>증상</h2>
<ul>
<li>옆구리나 등에서 시작해 <strong>아랫배, 사타구니, 음낭·음순</strong>으로 뻗치는 통증. 파도처럼 심해졌다 약해졌다 해요.</li>
<li>눈에 보이거나 검사에서 확인되는 <strong>혈뇨</strong></li>
<li>구역질, 구토</li>
<li>돌이 방광 가까이 내려오면 소변이 자주 마렵고 잔뇨감이 생겨요.</li>
</ul>

<div class="box warn"><span class="h">바로 응급실에 가야 할 때</span>
<ul>
<li>결석 통증과 함께 <strong>열이나 오한</strong>이 있어요. 막힌 콩팥에 감염이 생기면 패혈증으로 빠르게 진행할 수 있어요.</li>
<li>진통제를 먹어도 통증이 조절되지 않고 구토로 물도 못 마셔요.</li>
<li>소변이 거의 나오지 않아요.</li>
<li>콩팥이 하나뿐이거나 콩팥 기능이 이미 떨어져 있어요.</li>
</ul></div>

<h2>크기에 따른 치료</h2>
<div class="tbl"><table>
<thead><tr><th>상황</th><th>치료</th></tr></thead>
<tbody>
<tr><td>요관 결석 5mm 이하</td><td>대부분 몇 주 안에 저절로 빠져요. 진통제와 물로 기다려요</td></tr>
<tr><td>요관 결석 5~10mm</td><td>배출을 돕는 약(탐스로신 등)을 쓰며 지켜보거나, 시술을 고려해요</td></tr>
<tr><td>더 크거나 오래 안 빠짐, 감염, 콩팥 기능 저하</td><td>체외충격파 쇄석술, 요관 내시경 수술</td></tr>
<tr><td>콩팥 안의 큰 결석(대략 2cm 이상)</td><td>경피적 신장 결석 제거술 등</td></tr>
</tbody>
<caption>대한비뇨의학회, 미국비뇨기과학회(AUA)·유럽비뇨기과학회(EAU) 요로결석 지침을 바탕으로 정리</caption></table></div>
<ul>
<li><strong>체외충격파 쇄석술:</strong> 몸 밖에서 충격파를 보내 돌을 깨요. 마취 없이 외래에서 하는 경우가 많고, 여러 번 해야 할 수 있어요.</li>
<li><strong>요관 내시경:</strong> 요도를 통해 가는 내시경을 넣어 레이저로 깨고 꺼내요.</li>
</ul>

<h2>통증이 올 때</h2>
<ul>
<li>소염진통제가 결석 통증에 효과가 좋아요. 다만 콩팥 기능이 떨어졌거나 위장 질환이 있으면 쓰기 어려우니 진료 때 처방을 받아요.</li>
<li>따뜻한 찜질이 조금 도움이 될 수 있어요.</li>
<li>빠져나오는 돌을 확인하고 싶다면 거름망이나 체에 소변을 받아 보세요.</li>
</ul>

<h2>재발을 막는 습관</h2>
<p>한 번 결석이 생긴 사람의 절반 정도가 5~10년 안에 다시 겪어요. 아래 습관이 재발을 크게 줄여요.</p>
<ul>
<li><strong>물:</strong> 하루 소변이 2~2.5L가 되도록 마셔요. 보통 물을 2.5~3L 정도 마시면 돼요. 소변이 맑은 연노란색이면 적당해요. 심장·콩팥 질환으로 수분 제한을 받는 사람은 의사와 상의해요.</li>
<li><strong>소금 줄이기:</strong> 짜게 먹으면 소변으로 칼슘이 더 많이 빠져나가요.</li>
<li><strong>칼슘은 줄이지 않기:</strong> 음식으로 먹는 칼슘은 장에서 옥살산과 결합해 오히려 결석을 줄여요. 우유, 치즈, 두부 등으로 적정량을 먹어요. 칼슘 보충제는 식사와 함께 먹어요.</li>
<li><strong>옥살산 많은 음식 과다 피하기:</strong> 시금치, 견과류, 초콜릿, 진한 차를 한꺼번에 많이 먹지 않고, 칼슘 음식과 함께 먹어요.</li>
<li><strong>동물성 단백질 적당히:</strong> 고기, 생선을 지나치게 많이 먹지 않아요.</li>
<li><strong>과일과 채소:</strong> 소변의 구연산을 늘려 결석을 막는 데 도움이 돼요.</li>
<li>설탕이 많은 음료는 줄여요.</li>
</ul>

<div class="box"><span class="h">결석 예방 체크리스트</span>
<ol>
<li>물병 들고 다니며 하루 2.5L 이상</li>
<li>소변 색 연노란색 유지</li>
<li>국물·가공식품 줄여 싱겁게</li>
<li>칼슘은 식사로 적정량 유지</li>
<li>빠진 돌은 성분 검사</li>
<li>결석 통증+열은 즉시 응급실</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>맥주를 마시면 결석이 빠지나요?</dt>
<dd>소변량을 늘리는 효과는 있지만 탈수를 일으키고, 요산을 늘려 요산 결석에는 오히려 해로울 수 있어요. 물을 마시는 것이 가장 좋아요.</dd>
<dt>줄넘기를 하면 돌이 빠지나요?</dt>
<dd>줄넘기나 뛰기가 배출을 돕는다는 근거는 약해요. 무리하지 않는 범위에서 평소처럼 움직이는 것은 괜찮아요.</dd>
<dt>통증이 없어졌는데 돌이 빠진 건가요?</dt>
<dd>돌이 빠졌을 수도 있지만, 한자리에 멈춰 소변 길을 계속 막고 있어도 통증이 줄 수 있어요. 막힌 상태가 오래가면 콩팥 기능이 떨어지니 영상 검사로 확인받아요.</dd>
</dl>
