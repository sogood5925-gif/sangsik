  data-title="망간: 밥과 콩, 견과류로 충분히 먹는 미량 무기질, 부족보다 과잉을 조심해야 하는 경우"
  data-thumb="3.5~4mg|성인 충분섭취량"
  data-summary="망간은 뼈를 만들고 활성산소를 없애는 효소에 필요한 미량 무기질이에요. 곡류와 콩을 많이 먹는 우리 식사에서는 부족한 경우가 드물어요. 망간이 하는 일, 하루 필요량과 많이 든 음식, 철분과의 관계, 용접·지하수·간질환처럼 과잉이 문제가 되는 상황, 영양제를 고를 때 주의점을 정리했어요."
  data-tags="망간,미량무기질,곡류,철분,영양소">
<p class="lead">망간은 몸속에 아주 적은 양만 있지만 여러 효소가 일하는 데 꼭 필요한 무기질이에요. 현미, 콩, 두부, 견과류, 차처럼 우리가 자주 먹는 음식에 많아서, 한국인의 평소 식사로는 부족하기보다 넉넉한 편이에요. 오히려 특정 환경에서는 너무 많이 들어오는 것이 문제가 돼요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인 충분섭취량은 하루 <strong>남성 4.0mg, 여성 3.5mg</strong>, 상한섭취량은 <strong>11mg</strong>이에요.</li>
<li><strong>통곡물, 콩·두부, 견과류, 홍합, 차, 잎채소</strong>에 많아요.</li>
<li>음식만으로 과잉이 되는 경우는 드물지만, <strong>용접 연기 흡입, 망간이 많은 지하수, 간질환</strong>에서는 쌓일 수 있어요.</li>
<li>망간과 철은 흡수 통로를 함께 써서 <strong>철이 부족하면 망간이 더 많이 흡수</strong>돼요.</li>
</ul></div>

<h2>망간이 하는 일</h2>
<ul>
<li><strong>항산화:</strong> 세포의 발전소인 미토콘드리아에서 활성산소를 없애는 효소(망간 SOD)의 성분이에요.</li>
<li><strong>뼈와 연골:</strong> 뼈와 연골의 바탕 물질을 만드는 효소를 도와요.</li>
<li><strong>대사:</strong> 탄수화물, 아미노산, 콜레스테롤 대사에 관여하는 효소를 도와요.</li>
<li><strong>상처 회복:</strong> 콜라겐 생성에 필요한 효소를 도와요.</li>
</ul>

<p>곡물은 정제할수록 망간이 크게 줄어요. 흰쌀보다 현미·잡곡에 훨씬 많아요.</p>

<h2>부족은 드물어요</h2>
<p>망간 결핍은 사람에게서 거의 보고되지 않았어요. 실험적으로 망간을 뺀 식사를 했을 때 피부염, 콜레스테롤 저하 같은 변화가 관찰된 정도예요. 곡류와 콩을 먹는 평소 식사라면 따로 챙길 필요가 없어요.</p>

<h2>과잉을 조심해야 하는 경우</h2>
<div class="tbl"><table>
<thead><tr><th>상황</th><th>이유</th></tr></thead>
<tbody>
<tr><td>용접, 제련, 광산 작업</td><td>망간이 섞인 연기나 먼지를 들이마시면 장을 거치지 않고 뇌에 쌓일 수 있어요. 떨림, 느린 동작 등 파킨슨병과 비슷한 증상이 생길 수 있어요</td></tr>
<tr><td>망간이 많은 지하수</td><td>일부 지역 지하수는 망간 농도가 높아요. 아이가 오래 마시는 물이라면 수질 검사를 받아요</td></tr>
<tr><td>간질환</td><td>망간은 담즙으로 빠져나가는데, 간 기능이 떨어지면 몸에 쌓여요</td></tr>
<tr><td>장기간 정맥 영양</td><td>장을 거치지 않아 흡수 조절이 안 돼요. 의료진이 양을 관리해요</td></tr>
<tr><td>고용량 영양제</td><td>관절 영양제 일부에 망간이 많이 들어 있어요. 여러 제품을 겹쳐 먹지 않아요</td></tr>
</tbody>
<caption>세계보건기구(WHO) 먹는물 수질 기준 망간 안내, 미국 독성물질질병등록청(ATSDR) 자료를 바탕으로 정리</caption></table></div>

<div class="box warn"><span class="h">이런 증상이 있다면 알려 주세요</span>
<p>용접이나 금속 작업을 오래 했거나 간질환이 있는 사람에게 <strong>손 떨림, 동작이 느려짐, 걸음이 이상해짐, 감정 기복</strong>이 생기면 진료 때 작업 환경과 복용 영양제를 꼭 알려요. 작업장에서는 환기와 호흡 보호구를 챙기고, 특수 건강진단을 받아요.</p></div>

<h2>철분과의 관계</h2>
<p>망간과 철은 장에서 같은 운반체를 나눠 써요. 그래서 <strong>철이 부족한 사람은 망간을 더 많이 흡수</strong>하고, 반대로 철분제를 먹으면 망간 흡수가 줄어요. 철 결핍이 있는 사람은 고용량 망간 영양제를 피하는 것이 좋아요.</p>

<div class="box"><span class="h">망간 체크리스트</span>
<ol>
<li>현미·잡곡, 콩, 견과류로 충분</li>
<li>따로 보충할 필요는 대개 없음</li>
<li>관절 영양제 속 망간 함량 확인</li>
<li>지하수를 마신다면 수질 검사</li>
<li>용접 작업 시 환기와 보호구</li>
<li>간질환이 있다면 영양제 상의</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>망간 영양제가 뼈 건강에 좋나요?</dt>
<dd>망간이 뼈 효소에 필요하긴 하지만, 부족하지 않은 사람에게 보충해 뼈가 튼튼해진다는 근거는 없어요. 뼈에는 칼슘, 비타민 D, 운동이 더 중요해요.</dd>
<dt>차를 많이 마시면 망간 과잉이 되나요?</dt>
<dd>차에 망간이 들어 있지만 음식과 음료로 먹는 망간은 몸이 흡수와 배출을 조절해요. 보통의 차 섭취로 문제가 되는 경우는 드물어요.</dd>
<dt>분유를 탈 때 지하수를 써도 되나요?</dt>
<dd>망간을 포함한 수질이 확인되지 않은 지하수는 아기 분유에 쓰지 않는 것이 좋아요. 끓여도 망간은 줄지 않아요.</dd>
</dl>
