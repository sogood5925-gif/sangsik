  data-title="폴리페놀과 항산화: 음식으로는 좋은데 알약으로는 다른 이유"
  data-thumb="색깔|폴리페놀의 신호"
  data-summary="채소와 과일, 차, 커피, 코코아의 폴리페놀은 건강한 식사와 관련된 대표 성분이에요. 폴리페놀의 종류와 많이 든 음식, '항산화'라는 말의 오해, 항산화 보충제 연구가 실망스러웠던 이유, 녹차 추출물과 강황 보충제의 간 손상 사례, 음식으로 다양하게 먹는 요령을 정리했어요."
  data-tags="폴리페놀,항산화,녹차,채소과일,영양소">
<p class="lead">블루베리의 보랏빛, 녹차의 떫은맛, 양파 껍질의 갈색, 커피의 쌉싸름함에는 모두 폴리페놀이 들어 있어요. 폴리페놀을 많이 먹는 사람이 건강하다는 연구가 많지만, 같은 성분을 알약으로 농축해 먹었을 때는 기대만큼의 효과가 나오지 않거나 오히려 해로운 경우도 있었어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>폴리페놀은 식물이 만드는 수천 가지 화합물로, <strong>색이 진한 채소·과일, 차, 커피, 코코아, 콩, 통곡물</strong>에 많아요.</li>
<li>폴리페놀의 이로움은 단순한 '항산화'보다 <strong>장내 미생물, 혈관, 염증 신호</strong>에 대한 여러 작용으로 설명돼요.</li>
<li>고용량 <strong>항산화 보충제</strong>는 큰 연구에서 질병 예방 효과가 없었고 일부는 해로웠어요.</li>
<li><strong>녹차 추출물, 강황(커큐민) 보충제</strong>는 드물게 간 손상 사례가 보고됐어요.</li>
</ul></div>

<h2>폴리페놀의 종류와 음식</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>대표 성분</th><th>많이 든 음식</th></tr></thead>
<tbody>
<tr><td>플라바놀</td><td>카테킨, EGCG</td><td>녹차, 코코아, 사과, 포도</td></tr>
<tr><td>안토시아닌</td><td>시아니딘 등</td><td>블루베리, 블랙베리, 자색 고구마, 적양배추, 검은콩</td></tr>
<tr><td>플라보놀</td><td>퀘르세틴, 캠페롤</td><td>양파, 케일, 브로콜리, 사과 껍질</td></tr>
<tr><td>이소플라본</td><td>제니스테인, 다이드제인</td><td>콩, 두부</td></tr>
<tr><td>페놀산</td><td>클로로겐산</td><td>커피, 통곡물, 블루베리</td></tr>
<tr><td>기타</td><td>레스베라트롤, 커큐민, 리그난</td><td>포도 껍질, 강황, 참깨·아마씨</td></tr>
</tbody>

<h2>'항산화'라는 말의 오해</h2>
<p>폴리페놀은 시험관에서 활성산소를 없애는 힘이 강해 '항산화 성분'으로 알려졌어요. 그런데 폴리페놀은 먹은 뒤 흡수되는 양이 적고, 몸속에서 빠르게 다른 형태로 바뀌어요. 그래서 혈액 속에서 직접 활성산소를 청소하는 역할은 크지 않다고 봐요.</p>
<p>대신 최근에는 이렇게 설명해요.</p>
<ul>
<li>대부분의 폴리페놀은 <strong>대장까지 내려가 장내 세균의 먹이</strong>가 되고, 세균이 만든 대사물이 몸에 작용해요.</li>
<li>혈관 벽 세포의 신호에 영향을 줘 <strong>혈관 기능</strong>을 좋게 할 수 있어요(코코아 플라바놀, 차).</li>
<li>세포의 자체 방어 체계를 살짝 자극하는 방식으로 작용할 수 있어요.</li>
</ul>
<p>한때 식품의 항산화 능력을 숫자로 보여 주던 ORAC 점수는 실제 건강 효과와 관련이 없다는 이유로 미국 농무부가 데이터베이스를 내렸어요. '항산화 수치 몇 배' 같은 광고는 참고하지 않아도 돼요.</p>

<h2>항산화 보충제 연구의 교훈</h2>
<div class="tbl"><table>
<thead><tr><th>연구</th><th>결과</th></tr></thead>
<tbody>
<tr><td>흡연자에게 베타카로틴 보충(ATBC, CARET)</td><td>폐암이 오히려 <strong>늘었어요</strong></td></tr>
<tr><td>비타민 E 보충(SELECT 등)</td><td>심혈관 질환, 암 예방 효과가 없었고, 전립선암이 조금 늘었어요</td></tr>
<tr><td>항산화 보충제 전체 분석(코크란)</td><td>사망률을 낮추지 않았고 일부 성분은 높였어요</td></tr>
<tr><td>코코아 플라바놀 보충(COSMOS)</td><td>전체 심혈관 사건은 유의하게 줄지 않았고, 심혈관 사망은 줄어드는 경향이 있었어요</td></tr>
</tbody>
<caption>각 연구 원문과 코크란 체계적 문헌고찰(Bjelakovic 외, 2012)을 바탕으로 정리</caption></table></div>
<p>채소와 과일을 많이 먹는 사람이 건강한 이유는 한 가지 성분이 아니라 <strong>식이섬유, 칼륨, 비타민, 여러 폴리페놀이 함께 작용</strong>하고, 가공식품을 덜 먹는 식사 전체의 효과로 보는 것이 자연스러워요.</p>

<h2>보충제의 간 손상 주의</h2>
<div class="box warn"><span class="h">이런 제품은 조심해요</span>
<ul>
<li><strong>녹차 추출물(카테킨·EGCG 농축):</strong> 체중 감량 제품에 많이 쓰이며, 특히 빈속에 고용량을 먹었을 때 간 손상 사례가 보고됐어요. 차로 마시는 녹차와는 달라요.</li>
<li><strong>강황·커큐민 보충제:</strong> 흡수를 높이려고 후추 성분(피페린)을 넣은 고용량 제품에서 간 손상 사례가 보고됐어요.</li>
<li>피로감, 식욕 저하, 소변이 진해짐, 눈이 노래지면 복용을 멈추고 진료를 받아요.</li>
</ul>
<p>간 질환이 있거나 여러 약을 먹고 있다면 식물 추출 보충제를 시작하기 전에 의사·약사와 상의해요.</p></div>

<h2>음식으로 다양하게 먹는 요령</h2>
<ul>
<li><strong>무지개 색</strong>을 떠올려요. 빨강(토마토), 주황(당근), 초록(시금치), 보라(가지, 블루베리), 흰색(양파, 마늘)을 골고루.</li>
<li>과일은 <strong>껍질째</strong> 먹을 수 있는 건 씻어서 껍질째 먹어요. 폴리페놀이 껍질에 많아요.</li>
<li>녹차, 보리차, 커피를 설탕 없이 마셔요.</li>
<li>코코아는 설탕이 적은 제품이나 카카오 함량이 높은 다크초콜릿을 조금만.</li>
<li>양념에 생강, 마늘, 강황, 허브를 활용해요.</li>
<li>콩과 통곡물, 견과류를 매일 조금씩.</li>
</ul>

<div class="box"><span class="h">폴리페놀 체크리스트</span>
<ol>
<li>하루 채소 여러 가지, 과일 1~2회</li>
<li>매 끼니 색이 다른 채소 두 가지 이상</li>
<li>단 음료 대신 차, 무가당 커피</li>
<li>항산화 보충제보다 음식</li>
<li>녹차 추출물·강황 고용량 보충제 신중히</li>
<li>보충제 복용 중 황달·피로는 즉시 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>레드와인의 레스베라트롤은 심장에 좋나요?</dt>
<dd>와인 한 잔에 든 레스베라트롤은 아주 적어 효과를 기대하기 어려워요. 알코올은 적은 양도 암 위험을 높이므로 건강을 위해 술을 마시기 시작할 이유는 없어요.</dd>
<dt>커피를 많이 마시면 폴리페놀을 많이 먹는 건가요?</dt>
<dd>커피는 한국인의 폴리페놀 주요 공급원이에요. 하루 3~4잔 정도의 커피는 여러 연구에서 건강에 해롭지 않거나 이로운 것과 관련됐어요. 다만 카페인에 예민하거나 임신 중이라면 양을 줄여요.</dd>
<dt>채소 즙이나 착즙 주스도 괜찮나요?</dt>
<dd>폴리페놀은 남지만 식이섬유가 줄고 당이 빨리 흡수돼요. 통째로 먹는 것이 더 좋아요.</dd>
</dl>
