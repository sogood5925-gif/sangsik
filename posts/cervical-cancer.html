  data-title="자궁경부암과 HPV: 백신과 검진으로 막을 수 있는 암, 세포검사 이상 결과를 받았을 때"
  data-thumb="2년|국가 검진 주기"
  data-summary="자궁경부암은 원인 바이러스와 암이 되기 전 단계가 잘 알려져 있어 예방할 수 있는 암이에요. 인유두종바이러스(HPV) 감염이 흔한데도 대부분 저절로 사라지는 이유, HPV 백신의 대상과 효과, 20세부터 2년마다 받는 국가 검진, 세포검사 이상 결과의 뜻과 다음 단계, 주의할 증상을 정리했어요."
  data-tags="자궁경부암,HPV,인유두종바이러스,자궁경부세포검사,질병">
<p class="lead">자궁경부암은 거의 모두 인유두종바이러스(HPV) 감염에서 시작해요. 이 바이러스는 성생활을 하는 사람 대부분이 평생 한 번은 만날 만큼 흔하지만, 대개는 몸이 스스로 없애요. 일부가 오래 남아 수년에 걸쳐 암 전 단계를 거치기 때문에, 백신과 정기 검진으로 그 길을 미리 끊을 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>HPV 감염은 흔하고 <strong>대부분 1~2년 안에 저절로 사라져요.</strong> 오래 남는 감염이 문제예요.</li>
<li><strong>HPV 백신</strong>은 성생활을 시작하기 전에 맞을수록 효과가 커요. 국가예방접종으로 지원돼요.</li>
<li>20세 이상 여성은 <strong>2년마다 자궁경부 세포검사</strong>를 국가암검진으로 받을 수 있어요.</li>
<li>세포검사 이상은 대부분 <strong>암이 아니라</strong> 추가 확인이 필요하다는 뜻이에요.</li>
</ul></div>

<h2>HPV와 자궁경부암</h2>
<p>HPV는 피부와 점막이 닿는 성접촉으로 옮아요. 100가지가 넘는 종류 중 <strong>16형, 18형</strong> 같은 고위험형이 오래 남으면 자궁경부 세포가 조금씩 변해 <strong>이형성증(암 전 단계)</strong>을 거쳐 암이 될 수 있어요. 이 과정은 보통 <strong>10년 이상</strong> 걸려 검진으로 찾아 치료할 시간이 충분해요. 흡연, 면역 저하, 여러 성 파트너는 감염이 오래 남을 위험을 높여요.</p>

<h2>HPV 백신</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th>내용</th></tr></thead>
<tbody>
<tr><td>12세 여성 청소년</td><td>국가예방접종. 6~12개월 간격 2회(만 15세 이전 시작 기준)</td></tr>
<tr><td>13~17세 여성 청소년</td><td>접종하지 않았다면 국가예방접종으로 따라잡기 접종</td></tr>
<tr><td>18~26세 저소득층 여성</td><td>국가 지원 대상. 3회 접종</td></tr>
<tr><td>그 밖의 성인</td><td>26세까지는 접종 권장, 27~45세는 개인 상황에 따라 의사와 상의</td></tr>
<tr><td>남성</td><td>생식기 사마귀, 항문암·구인두암 예방과 전파를 줄이기 위해 접종할 수 있어요</td></tr>
</tbody>
<caption>질병관리청 예방접종도우미 HPV 백신 안내, 미국 질병통제예방센터(CDC) 권고를 바탕으로 정리. 지원 대상은 바뀔 수 있어 보건소에 확인해요</caption></table></div>
<ul>
<li>백신은 이미 감염된 바이러스를 치료하지는 못하지만, 아직 감염되지 않은 종류는 막아 줘요.</li>
<li>백신을 맞았더라도 모든 고위험형을 막지는 못해 <strong>검진은 계속</strong> 받아요.</li>
<li>백신을 도입한 나라들에서 자궁경부 이형성증과 암이 크게 줄었다는 연구 결과가 나오고 있어요.</li>
</ul>

<h2>국가 자궁경부암 검진</h2>
<ul>
<li><strong>대상:</strong> 20세 이상 여성</li>
<li><strong>주기:</strong> 2년마다</li>
<li><strong>방법:</strong> 자궁경부 세포검사. 병원에 따라 HPV 검사를 함께 하기도 해요.</li>
<li>생리 중에는 결과가 부정확할 수 있어 피하고, 검사 전 하루 이틀은 질 세정, 질정, 성관계를 피하면 좋아요.</li>
<li>성경험이 없다면 검사 필요성을 의사와 상의해요.</li>
</ul>

<h2>세포검사 결과 읽기</h2>
<div class="tbl"><table>
<thead><tr><th>결과</th><th>뜻</th><th>다음 단계(흔한 경우)</th></tr></thead>
<tbody>
<tr><td>정상</td><td>이상 세포 없음</td><td>2년 뒤 검진</td></tr>
<tr><td>비정형 편평세포(ASC-US)</td><td>애매한 변화. 대부분 염증이나 일시적 감염</td><td>HPV 검사 또는 추적 세포검사</td></tr>
<tr><td>저등급 병변(LSIL)</td><td>가벼운 변화. 많은 경우 저절로 좋아져요</td><td>질확대경 검사, 추적</td></tr>
<tr><td>고등급 병변(HSIL)</td><td>암 전 단계일 가능성이 높음</td><td>질확대경 검사와 조직검사, 필요하면 원추절제술</td></tr>
</tbody>
<caption>대한부인종양학회, 미국 질확대경·자궁경부병리학회(ASCCP) 관리 지침을 바탕으로 쉽게 정리</caption></table></div>
<p>암 전 단계는 자궁경부의 일부만 원뿔 모양으로 떼어 내는 <strong>원추절제술</strong>로 치료하는 경우가 많고, 임신 능력도 대부분 유지돼요. 다만 이후 임신 때 조산 위험을 확인하기 위해 산부인과에 수술 이력을 알려요.</p>

<div class="box warn"><span class="h">검진 주기가 아니어도 진료를 받아요</span>
<ul>
<li><strong>성관계 뒤 출혈</strong></li>
<li>생리 기간이 아닌 때의 출혈, <strong>폐경 뒤 출혈</strong></li>
<li>냄새나거나 피가 섞인 분비물이 계속돼요.</li>
<li>골반 통증, 성관계 때 통증</li>
</ul></div>

<h2>치료</h2>
<p>초기 자궁경부암은 수술로 치료하고, 젊은 사람은 임신 능력을 지키는 수술을 고려하기도 해요. 진행된 경우에는 방사선 치료와 항암 치료를 함께 해요. 일찍 발견할수록 치료가 간단하고 결과가 좋아요.</p>

<h2>예방을 위해 할 수 있는 것</h2>
<ul>
<li>아이가 대상 나이가 되면 <strong>HPV 백신</strong>을 챙겨요.</li>
<li>20세 이후 <strong>2년마다 검진</strong>을 빠뜨리지 않아요.</li>
<li><strong>금연:</strong> 흡연은 HPV가 오래 남게 해요.</li>
<li>콘돔은 HPV 감염을 완전히 막지는 못하지만 위험을 줄여요.</li>
</ul>

<div class="box"><span class="h">자궁경부 건강 체크리스트</span>
<ol>
<li>12세 딸 HPV 백신 2회</li>
<li>26세까지 미접종이면 접종 상의</li>
<li>20세부터 2년마다 세포검사</li>
<li>이상 결과는 권고대로 추적</li>
<li>성관계 뒤·폐경 뒤 출혈은 진료</li>
<li>금연</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>HPV 양성이면 파트너가 바람을 피운 건가요?</dt>
<dd>그렇게 단정할 수 없어요. HPV는 몇 년 동안 증상 없이 몸에 머물다 검사에서 발견되기도 해요. 언제 감염됐는지 알기 어려워요.</dd>
<dt>이미 성경험이 있는데 백신이 소용 있나요?</dt>
<dd>아직 감염되지 않은 종류를 막을 수 있어 26세까지는 권장돼요. 그 이후는 이득이 줄어들어 개인 상황에 따라 상의해요.</dd>
<dt>자궁을 떼어 냈는데 검진을 계속해야 하나요?</dt>
<dd>양성 질환으로 자궁경부까지 모두 떼어 냈다면 대개 필요 없지만, 암 전 단계 병력이 있었다면 계속 검사가 필요할 수 있어요. 담당 의사와 확인해요.</dd>
</dl>
