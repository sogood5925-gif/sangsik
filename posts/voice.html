<template data-id="voice" data-cat="hea" data-date="2026.09.30"
  data-title="목소리 건강: 쉰 목소리가 3주 넘으면 검사를, 말 많이 하는 사람의 성대 관리"
  data-thumb="3주|목쉼 검사 기준"
  data-summary="목소리는 두 개의 작은 성대가 1초에 수백 번 떨려서 만들어져요. 교사, 상담원, 판매직처럼 말을 많이 하는 사람의 성대 관리법, 물과 습도, 헛기침과 속삭임이 해로운 이유, 성대결절·폴립·후두염과 역류, 3주 넘는 목쉼에 검사가 필요한 이유를 정리했어요."
  data-tags="목소리,성대결절,목쉼,후두,건강상식">
<p class="lead">목소리는 목 안의 두 성대가 서로 부딪히며 떨려서 나요. 말할 때 성대는 1초에 남성은 100번 남짓, 여성은 200번 넘게 부딪혀요. 하루 종일 말하는 사람이라면 성대가 수십만 번 부딪히는 셈이에요. 손바닥을 계속 마주치면 굳은살이 생기듯, 성대도 무리하면 부어오르고 혹이 생겨요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성대는 <strong>촉촉할 때</strong> 잘 떨려요. 물을 자주 마시고 실내 습도를 유지해요.</li>
<li><strong>고함, 헛기침, 억지로 속삭이기</strong>는 성대를 세게 부딪치게 해요.</li>
<li>말을 많이 하는 직업이라면 <strong>마이크</strong>를 쓰고 중간중간 목을 쉬게 해요.</li>
<li>목쉼이 <strong>3주 넘게</strong> 계속되면, 특히 흡연자는 후두 내시경 검사를 받아요.</li>
</ul></div>

<h2>목소리를 많이 쓰는 사람</h2>
<p>교사, 강사, 콜센터 상담원, 판매직, 목사·신부, 가수, 운동 코치, 어린아이를 키우는 부모처럼 목소리를 오래, 크게 쓰는 사람에게 성대 질환이 많아요. 성대결절은 '교사 결절', '가수 결절'이라고 불릴 만큼 직업과 관련이 깊어요.</p>

<h2>성대를 지키는 습관</h2>
<div class="tbl"><table>
<thead><tr><th>피할 것</th><th>대신 이렇게</th></tr></thead>
<tbody>
<tr><td>시끄러운 곳에서 크게 말하기, 고함</td><td>가까이 다가가서 말하기, 마이크·확성기 쓰기, 손뼉·호루라기로 주의 끌기</td></tr>
<tr><td>습관적인 헛기침</td><td>물 한 모금 마시기, 침 삼키기, 가볍게 흠 하고 넘기기</td></tr>
<tr><td>억지로 힘준 속삭임</td><td>작고 편안한 목소리로 말하기. 목이 아플 때는 아예 쉬기</td></tr>
<tr><td>목이 쉬었는데 계속 말하기</td><td>말하는 양 줄이고 쉬기</td></tr>
<tr><td>카페인·술 많이, 물 적게</td><td>물을 조금씩 자주, 소변 색이 연하게 될 만큼</td></tr>
<tr><td>흡연, 간접흡연</td><td>금연. 흡연은 후두암의 가장 큰 원인이에요</td></tr>
<tr><td>너무 낮거나 높은 억지 음높이</td><td>편한 음높이로, 배로 숨을 받쳐 말하기</td></tr>
</tbody>
<caption>대한후두음성언어의학회, 미국 국립난청·의사소통장애연구소(NIDCD) 목소리 관리 안내를 바탕으로 정리</caption></table></div>
<ul>
<li>수업이나 상담 사이사이 <strong>5~10분</strong>이라도 말하지 않는 시간을 둬요.</li>
<li>실내 습도를 40~60%로 유지하고, 건조한 날에는 따뜻한 김을 쐬어요.</li>
<li>노래방, 응원처럼 목을 많이 쓴 다음 날은 목을 쉬게 해요.</li>
</ul>

<h2>목쉼의 흔한 원인</h2>
<div class="tbl"><table>
<thead><tr><th>질환</th><th>특징</th></tr></thead>
<tbody>
<tr><td>급성 후두염</td><td>감기와 함께 목이 쉬어요. 대부분 1~2주 안에 좋아져요</td></tr>
<tr><td>성대결절</td><td>양쪽 성대 가운데에 굳은살처럼 생긴 혹. 목소리를 많이 쓰는 사람에게 흔해요. 음성 치료가 우선이에요</td></tr>
<tr><td>성대폴립</td><td>주로 한쪽에 생긴 물혹. 고함 뒤 갑자기 생기기도 해요. 필요하면 수술해요</td></tr>
<tr><td>인후두 역류</td><td>위산이 목까지 올라와 헛기침, 이물감, 목쉼을 일으켜요. 속쓰림이 없을 수도 있어요</td></tr>
<tr><td>성대 마비</td><td>수술(갑상선, 가슴)이나 바이러스 후 성대가 움직이지 않아 바람 새는 목소리가 나요</td></tr>
<tr><td>후두암</td><td>흡연자에게 많아요. 목쉼이 계속되는 것이 첫 신호일 수 있어요</td></tr>
</tbody></table></div>

<h2>역류와 목소리</h2>
<ul>
<li>잠들기 <strong>3시간 전</strong>에는 먹지 않아요.</li>
<li>기름진 음식, 과식, 술, 커피, 탄산음료를 줄여요.</li>
<li>과체중이면 체중을 줄이고, 잘 때 상체를 조금 높여요.</li>
<li>증상이 계속되면 약물 치료를 상의해요.</li>
</ul>

<h2>음성 치료</h2>
<p>성대결절이나 목소리를 잘못 쓰는 습관이 원인이라면, 언어치료사와 함께하는 <strong>음성 치료</strong>가 수술보다 먼저예요. 편하게 발성하는 법, 호흡법, 공명을 이용하는 법을 배워 성대의 부담을 줄여요. 수술을 해도 습관을 바꾸지 않으면 다시 생기기 쉬워요.</p>

<div class="box warn"><span class="h">바로 검사가 필요한 신호</span>
<ul>
<li>목쉼이 <strong>3주 넘게</strong> 나아지지 않아요. 특히 흡연자나 과거 흡연자라면 꼭 후두 내시경을 받아요.</li>
<li>목소리 변화와 함께 <strong>삼키기 어렵거나, 피 섞인 가래, 목의 혹</strong>이 있어요.</li>
<li>숨쉬기가 힘들거나 숨 쉴 때 소리가 나요(바로 응급 진료).</li>
<li>수술 후 목소리가 바람 새듯 약해졌어요.</li>
</ul></div>

<div class="box"><span class="h">목소리 관리 체크리스트</span>
<ol>
<li>물 조금씩 자주, 실내 습도 유지</li>
<li>고함 대신 마이크, 가까이 가서 말하기</li>
<li>헛기침 대신 물 한 모금</li>
<li>목 쉬면 말 줄이고 쉬기</li>
<li>금연, 늦은 야식 피하기</li>
<li>3주 넘는 목쉼은 이비인후과</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>목이 쉬었을 때 속삭이면 성대가 쉬나요?</dt>
<dd>힘을 주어 억지로 속삭이면 오히려 성대 주변 근육에 무리가 가요. 가장 좋은 건 말을 줄이고 쉬는 거예요. 꼭 말해야 한다면 작고 편안한 목소리로 해요.</dd>
<dt>목캔디나 따뜻한 차가 도움이 되나요?</dt>
<dd>목을 촉촉하게 해 잠깐 편하게 해요. 다만 박하 성분이 강한 목캔디는 입을 마르게 할 수 있어요. 미지근한 물을 자주 마시는 게 기본이에요.</dd>
<dt>성대결절은 수술해야 하나요?</dt>
<dd>대부분 음성 치료와 목소리 휴식으로 좋아져요. 오래되어 굳었거나 음성 치료로 나아지지 않을 때 수술을 고려하고, 수술 뒤에도 음성 치료를 이어 가요.</dd>
</dl>
