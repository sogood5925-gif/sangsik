  data-title="시린 이와 치아 미백: 찬물에 찌릿한 이유, 시린이 치약은 몇 주 꾸준히, 미백 전에 알아 둘 것"
  data-thumb="2~4주|시린이 치약 효과 시간"
  data-summary="찬물이나 아이스크림에 이가 찌릿하게 시린 것은 상아질이 드러났다는 신호예요. 이가 시린 원인과 충치·금 간 치아와 구별하는 법, 시린이 치약과 치과 치료, 산성 음료 뒤 바로 양치하지 않는 이유, 치과 미백과 자가 미백의 차이와 부작용, 해 보면 안 되는 민간 미백법을 정리했어요."
  data-tags="시린이,치아미백,상아질,잇몸퇴축,건강상식">
<p class="lead">차가운 물을 마시거나 찬 바람을 들이마실 때 이가 찌릿하게 아파요. 시린 이는 흔하지만 그냥 참고 넘기다 보면 식사가 불편해지고 양치도 대충 하게 돼요. 원인을 알면 대부분 간단한 방법으로 좋아지고, 치아 미백을 계획할 때도 시린 이를 먼저 살펴야 해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>이가 시린 것은 법랑질이나 잇몸이 줄어 <strong>상아질이 드러났기 때문</strong>인 경우가 많아요.</li>
<li><strong>시린이 치약</strong>은 <strong>2~4주</strong> 꾸준히 써야 효과가 나타나요.</li>
<li>탄산음료, 과일 주스를 마신 직후에는 <strong>30분쯤 기다렸다</strong> 양치해요.</li>
<li>미백은 시린 이와 충치를 먼저 치료한 뒤, <strong>치과와 상의</strong>해 시작해요.</li>
</ul></div>

<h2>이가 시린 이유</h2>
<p>치아의 겉은 단단한 <strong>법랑질</strong>이, 뿌리는 <strong>잇몸</strong>이 감싸고 있어요. 그 안의 <strong>상아질</strong>에는 신경으로 이어지는 아주 작은 관이 있어서, 드러나면 찬 것, 단 것, 바람의 자극이 신경에 바로 전달돼요.</p>
<div class="tbl"><table>
<thead><tr><th>원인</th><th>설명</th></tr></thead>
<tbody>
<tr><td>잇몸 퇴축</td><td>잇몸병이나 세게 닦는 습관으로 잇몸이 내려가 뿌리가 드러나요</td></tr>
<tr><td>치아 마모</td><td>옆으로 세게 문지르는 칫솔질, 뻣뻣한 칫솔로 치아 목 부분이 파여요</td></tr>
<tr><td>산 부식</td><td>탄산음료, 과일 주스, 식초 음료, 잦은 구토·역류로 법랑질이 녹아요</td></tr>
<tr><td>이갈이·이 악물기</td><td>치아가 닳고 미세한 금이 가요</td></tr>
<tr><td>치과 치료 직후</td><td>스케일링, 충전, 미백 뒤 일시적으로 시려요</td></tr>
</tbody>
<caption>대한치과보존학회, 미국치과의사협회(ADA) Tooth Sensitivity 안내를 바탕으로 정리</caption></table></div>

<h2>다른 문제와 구별하기</h2>
<ul>
<li><strong>시린 이:</strong> 자극이 있을 때 찌릿하고, 자극이 사라지면 곧 멈춰요.</li>
<li><strong>충치:</strong> 단 것에 시리고, 특정 이 하나가 계속 아프거나 구멍이 보여요.</li>
<li><strong>금 간 치아:</strong> 씹을 때, 특히 씹었다 뗄 때 찌릿해요.</li>
<li><strong>신경 염증:</strong> 자극이 없어도 욱신거리고, 밤에 아프거나 뜨거운 것에 오래 아파요.</li>
</ul>
<p>통증이 오래가거나 한 이만 계속 아프면 시린이 치약으로 버티지 말고 치과에 가요.</p>

<h2>시린 이 관리</h2>
<ul>
<li><strong>시린이 치약:</strong> 질산칼륨, 불소 등이 신경 자극을 줄이거나 상아질 관을 막아 줘요. <strong>2~4주 이상 매일</strong> 써야 효과가 나요. 양치 뒤 바로 헹구지 말고 거품을 가볍게 뱉어요.</li>
<li><strong>부드러운 칫솔</strong>로, 옆으로 세게 문지르지 말고 잇몸에서 치아 쪽으로 짧게 닦아요.</li>
<li><strong>산성 음료</strong>는 빨대로 마시고, 마신 뒤 물로 입을 헹군 다음 <strong>30분~1시간 뒤</strong> 양치해요. 산에 약해진 법랑질을 바로 문지르면 더 닳아요.</li>
<li>이갈이가 있다면 치과에서 구강 장치를 상의해요.</li>
<li>치과에서는 불소 바르기, 드러난 부위 레진 덮기, 잇몸 이식 등을 할 수 있어요.</li>
</ul>

<h2>치아 미백</h2>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>특징</th><th>주의</th></tr></thead>
<tbody>
<tr><td>치과 미백</td><td>높은 농도의 과산화수소 등을 치과에서 써요. 효과가 빠르고 커요</td><td>시림, 잇몸 자극이 흔해요. 치과의사가 잇몸을 보호하며 진행해요</td></tr>
<tr><td>자가 미백(치과 처방 트레이)</td><td>맞춤 틀에 낮은 농도의 약제를 넣어 집에서 해요</td><td>정해진 시간과 횟수를 지켜요</td></tr>
<tr><td>일반 판매 미백 제품</td><td>의약외품으로 농도가 낮게 제한돼요</td><td>허가 표시 확인, 사용법 지키기</td></tr>
<tr><td>미백 치약</td><td>표면 착색을 연마로 닦아 내요</td><td>원래 치아 색을 바꾸지는 못해요. 많이 쓰면 마모될 수 있어요</td></tr>
</tbody>
<caption>식품의약품안전처 치아 미백제 안전 사용 안내, 대한치과보존학회, 미국치과의사협회(ADA) 자료를 바탕으로 정리</caption></table></div>
<ul>
<li>미백은 <strong>자연 치아</strong>에만 효과가 있어요. 크라운, 레진, 임플란트의 색은 변하지 않아요.</li>
<li>항생제(테트라사이클린) 착색, 신경이 죽은 치아는 효과가 적거나 다른 치료가 필요해요.</li>
<li>임신·수유 중, 만 12세 미만은 권하지 않아요.</li>
<li>미백 뒤에는 커피, 카레, 와인 같은 착색 음식을 며칠 줄여요.</li>
</ul>

<div class="box warn"><span class="h">해 보면 안 되는 미백법</span>
<ul>
<li><strong>레몬, 식초, 베이킹소다를 문지르기:</strong> 산과 연마로 법랑질이 닳고 시려요.</li>
<li><strong>숯 가루 치약:</strong> 거칠어 마모되고 잇몸을 상하게 할 수 있어요.</li>
<li><strong>허가받지 않은 해외 고농도 미백제:</strong> 잇몸 화상과 심한 시림이 생길 수 있어요.</li>
</ul>
<p>미백 뒤 <strong>잇몸이 하얗게 변하고 아프거나</strong> 시림이 며칠 넘게 심하면 사용을 멈추고 치과에 가요.</p></div>

<div class="box"><span class="h">시린 이·미백 체크리스트</span>
<ol>
<li>부드러운 칫솔, 짧게 닦기</li>
<li>시린이 치약 2~4주 꾸준히</li>
<li>산성 음료 뒤 30분 기다렸다 양치</li>
<li>한 이만 계속 아프면 치과</li>
<li>미백 전 충치·잇몸 먼저 치료</li>
<li>민간 미백법 피하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>미백하면 이가 약해지나요?</dt>
<dd>정해진 방법대로 하면 법랑질이 크게 약해지지는 않는다고 봐요. 다만 일시적인 시림은 흔해서, 시린이 치약을 미리 쓰기도 해요.</dd>
<dt>미백 효과는 얼마나 가나요?</dt>
<dd>음식과 흡연 습관에 따라 몇 달~몇 년으로 차이가 커요. 착색 음식과 담배를 줄이면 오래가요.</dd>
<dt>시린 이 때문에 따뜻한 물로만 양치해야 하나요?</dt>
<dd>미지근한 물이 편하다면 그렇게 해도 괜찮아요. 시리다고 양치를 대충 하면 잇몸병과 충치가 생겨 더 시려질 수 있어요.</dd>
</dl>
