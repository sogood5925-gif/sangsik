<p class="lead">떡볶이, 불닭, 마라탕처럼 매운 음식은 스트레스를 풀어 주는 맛으로 인기가 많아요. 그런데 매운맛은 사실 '맛'이 아니라 '통증'에 가까워요. 매운 음식을 먹으면 땀이 나고 얼굴이 붉어지는 이유도 여기에 있어요. 즐기되 몸이 보내는 신호를 무시하지 않는 법을 알아 둘게요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>캡사이신은 <strong>뜨거움을 느끼는 통증 수용체(TRPV1)</strong>를 자극해 불타는 느낌을 줘요.</li>
<li>매운 음식이 <strong>위궤양을 직접 일으키지는 않지만</strong>, 이미 있는 속쓰림과 역류, 장 증상은 악화시킬 수 있어요.</li>
<li>입이 매울 때는 물보다 <strong>우유나 요거트</strong>가 효과적이에요.</li>
<li>극단적으로 매운 음식 도전은 <strong>심한 구토, 식도 손상, 벼락 두통</strong>을 일으킨 사례가 있어요.</li>
</ul></div>

<h2>매운맛의 원리</h2>
<p>캡사이신은 입과 피부에 있는 <strong>TRPV1</strong>이라는 수용체에 붙어요. 이 수용체는 원래 43°C 이상의 뜨거움을 감지하는 센서라서, 뇌는 '뜨겁다, 아프다'고 받아들여요. 그래서 땀이 나고, 얼굴이 붉어지고, 콧물이 흘러요. 자주 먹으면 수용체가 둔해져 점점 더 매운 것을 찾게 되기도 해요. 뇌는 통증을 줄이려고 엔도르핀을 내보내는데, 매운 음식을 먹은 뒤 기분이 좋아지는 느낌과 관련이 있다고 해요.</p>

<h2>몸에 좋다는 이야기, 근거는?</h2>
<ul>
<li><strong>대사·체중:</strong> 캡사이신이 에너지 소비를 조금 늘리고 식욕을 약간 줄인다는 연구가 있지만, 효과는 작아요. 매운 음식은 짜고 기름진 경우가 많아 오히려 열량이 늘 수 있어요.</li>
<li><strong>장수:</strong> 중국과 미국의 대규모 관찰 연구에서 고추를 자주 먹는 사람의 사망 위험이 조금 낮았어요. 다만 생활 습관 차이의 영향도 있을 수 있어 인과 관계는 확실하지 않아요.</li>
<li><strong>통증 치료:</strong> 캡사이신을 넣은 크림·패치는 대상포진 후 신경통 등 일부 통증에 쓰여요. 처음에는 화끈거리다가 신경이 둔해지며 통증이 줄어요.</li>
</ul>

<h2>위와 장에 주는 영향</h2>
<div class="tbl"><table>
<thead><tr><th>상황</th><th>매운 음식의 영향</th></tr></thead>
<tbody>
<tr><td>위궤양</td><td>매운 음식이 궤양의 원인은 아니에요. 주된 원인은 헬리코박터균과 소염진통제예요. 다만 궤양이 있을 때는 통증을 키울 수 있어요</td></tr>
<tr><td>위식도 역류, 속쓰림</td><td>증상을 악화시키는 사람이 많아요</td></tr>
<tr><td>과민성 장증후군</td><td>복통과 설사를 부를 수 있어요. 사람마다 반응이 달라요</td></tr>
<tr><td>치질, 항문 질환</td><td>배변 때 화끈거림이 심해질 수 있어요</td></tr>
</tbody>
<caption>대한소화기학회, 대한위장관운동학회 자료를 바탕으로 정리</caption></table></div>
<p>매운 음식을 먹은 뒤 속이 쓰리고 설사하는 일이 반복된다면 양과 빈도를 줄여 보세요. 몸이 편한 만큼이 나에게 맞는 매운맛이에요.</p>

<h2>입이 불날 때</h2>
<ul>
<li><strong>우유, 요거트:</strong> 우유 단백질(카제인)과 지방이 캡사이신을 감싸 씻어 내요. 가장 효과적이에요.</li>
<li><strong>밥, 빵:</strong> 입안의 캡사이신을 닦아 내요.</li>
<li><strong>설탕, 꿀:</strong> 조금 도움이 돼요.</li>
<li><strong>찬물, 탄산음료:</strong> 잠깐 시원하지만 캡사이신이 물에 잘 녹지 않아 금방 다시 매워요. 술은 오히려 더 퍼지게 할 수 있어요.</li>
</ul>

<div class="box warn"><span class="h">극단적인 매운맛 도전은 위험해요</span>
<ul>
<li>초고추나 농축 캡사이신 과자를 먹은 뒤 <strong>심한 구토</strong>로 식도가 찢어지거나, 갑자기 머리가 터질 듯 아픈 <strong>벼락 두통</strong>, 가슴 통증으로 응급실에 간 사례가 보고됐어요.</li>
<li>어린이가 먹고 숨이 막히거나 심하게 토한 사례도 있어요.</li>
<li>먹은 뒤 <strong>심한 두통, 가슴 통증, 피 섞인 구토, 숨참</strong>이 생기면 바로 119에 연락해요.</li>
</ul></div>

<h2>손과 눈 조심</h2>
<p>청양고추를 손질한 손으로 눈이나 콘택트렌즈를 만지면 심하게 따가워요. 손질할 때는 <strong>비닐장갑</strong>을 끼고, 끝나면 비누로 손을 씻어요. 눈에 들어갔다면 흐르는 물로 충분히 씻어요. 고추를 볶을 때 나오는 매운 연기도 기침을 부르니 환기해요.</p>

<div class="box"><span class="h">매운 음식 체크리스트</span>
<ol>
<li>속쓰림·설사 반복되면 양 줄이기</li>
<li>매운 음식은 대개 짜다는 것 기억</li>
<li>입이 매우면 우유·요거트</li>
<li>극단적 매운맛 도전 피하기</li>
<li>고추 손질은 장갑 끼고</li>
<li>아이에게는 매운 음식 조금씩</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>매운 음식을 먹으면 스트레스가 풀리나요?</dt>
<dd>통증에 반응해 나오는 물질 때문에 잠깐 기분이 좋아질 수 있어요. 하지만 스트레스를 풀려고 자주 먹으면 위장이 먼저 지쳐요.</dd>
<dt>아이는 몇 살부터 매운 음식을 먹어도 되나요?</dt>
<dd>정해진 나이는 없지만 어린아이는 작은 자극에도 입과 위가 예민해요. 순한 맛부터 조금씩 익숙해지게 해요.</dd>
<dt>매운 음식이 치질을 만드나요?</dt>
<dd>치질의 원인은 아니지만 이미 있는 치질의 불편을 키울 수 있어요. 변비를 막는 것이 더 중요해요.</dd>
</dl>
