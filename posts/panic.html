<p class="lead">공황발작을 처음 겪은 사람의 상당수가 심장마비인 줄 알고 응급실로 가요. 그만큼 증상이 생생하고 강렬해요. 하지만 공황발작 자체는 목숨을 위협하지 않고, 치료로 충분히 좋아질 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>공황발작은 갑작스러운 극심한 공포가 <strong>몇 분 안에 정점</strong>에 이르고, 보통 <strong>수십 분 안에</strong> 가라앉아요.</li>
<li>발작이 반복되고 <strong>"또 올까" 하는 걱정과 피하는 행동</strong>이 한 달 넘게 이어지면 공황장애예요.</li>
<li>처음 겪었다면 <strong>심장·갑상선 등 다른 원인</strong>을 먼저 확인해요.</li>
<li><strong>항우울제(SSRI)와 인지행동치료</strong>가 효과적이에요. 많은 사람이 좋아져요.</li>
</ul></div>

<h2>공황발작의 증상</h2>
<p>아무 이유 없이, 또는 특정 상황에서 갑자기 강렬한 공포가 밀려오며 아래 증상 중 <strong>4가지 이상</strong>이 나타나요.</p>
<div class="tbl"><table>
<thead><tr><th>몸의 증상</th><th>마음의 증상</th></tr></thead>
<tbody>
<tr><td>심장이 쿵쾅거리고 빨리 뜀</td><td>죽을 것 같은 공포</td></tr>
<tr><td>땀이 남, 손발 떨림</td><td>미치거나 통제를 잃을 것 같은 두려움</td></tr>
<tr><td>숨이 가쁘거나 막히는 느낌, 질식할 것 같은 느낌</td><td>현실이 아닌 것 같은 느낌, 내가 나 같지 않은 느낌</td></tr>
<tr><td>가슴 통증이나 답답함</td><td></td></tr>
<tr><td>메스꺼움, 복부 불편감</td><td></td></tr>
<tr><td>어지러움, 쓰러질 것 같음</td><td></td></tr>
<tr><td>오한 또는 열감, 손발 저림</td><td></td></tr>
</tbody>
<caption>미국정신의학회 진단 기준(DSM-5)을 바탕으로 정리</caption></table></div>

<h2>왜 이런 일이 생길까</h2>
<p>공황발작은 몸의 <strong>경보 장치가 잘못 울리는 것</strong>에 비유할 수 있어요. 진짜 위험이 없는데도 뇌가 위험 신호를 보내 '싸우거나 도망가기' 반응이 최대로 켜져요. 심장이 빨리 뛰고 숨이 가빠지는 건 도망갈 준비를 하는 정상적인 몸의 반응이에요.</p>
<p>문제는 그다음이에요. 두근거림을 '심장마비'로, 어지러움을 '쓰러질 것'으로 해석하면 공포가 더 커지고, 공포가 몸의 반응을 더 키우는 <strong>악순환</strong>이 생겨요. 그래서 치료는 이 해석과 악순환을 끊는 데 초점을 맞춰요.</p>
<p>유전, 스트레스, 큰 생활 변화, 카페인, 수면 부족, 과음과 숙취가 발작의 계기가 되기도 해요.</p>

<h2>공황발작과 공황장애</h2>
<p>공황발작은 살면서 한두 번 겪는 사람도 많아요. <strong>공황장애</strong>는 예상하지 못한 발작이 반복되고, 적어도 한 달 동안 다음 중 하나가 이어지는 상태예요.</p>
<ul>
<li>또 발작이 올까 봐 계속 걱정해요 (예기불안).</li>
<li>발작을 피하려고 행동이 바뀌어요. 운동을 피하고, 지하철·엘리베이터·혼잡한 곳을 피하고, 혼자 외출하지 못해요.</li>
</ul>
<p>피하는 곳이 늘어나 일상이 크게 좁아지는 것을 <strong>광장공포증</strong>이라고 해요. 공황장애와 함께 오는 경우가 많아요.</p>

<h2>처음이라면 다른 원인부터</h2>
<div class="box warn"><span class="h">처음 겪는 가슴 통증과 두근거림은 확인이 필요해요</span>
<p>공황발작과 비슷한 증상을 일으키는 병이 있어요. 처음 겪었거나 증상이 평소와 다르다면 진료를 받아 아래를 확인해요.</p>
<ul>
<li>협심증, 심근경색, 부정맥</li>
<li>갑상선 기능 항진증</li>
<li>천식, 폐색전증</li>
<li>저혈당</li>
<li>카페인, 약물, 알코올 금단</li>
</ul>
<p>특히 운동할 때 생기는 가슴 통증, 쓰러짐, 50세 이후 처음 생긴 증상은 심장 검사를 먼저 받아요.</p></div>

<h2>발작이 왔을 때 넘기는 법</h2>
<h3>1. 알아차리고 이름 붙이기</h3>
<p>"지금 공황발작이 오고 있어. 무섭지만 위험하지 않아. 10~20분이면 지나가."라고 스스로 말해요. 이미 검사로 다른 병이 없다는 걸 확인했다면 이 말이 큰 힘이 돼요.</p>
<h3>2. 천천히 내쉬는 호흡</h3>
<p>공황 중에는 숨을 빨리, 얕게 쉬어서 오히려 어지러움과 손 저림이 심해져요. <strong>코로 4초 들이마시고, 입으로 6초 천천히 내쉬는</strong> 호흡을 몇 분 반복해요. 예전에 권하던 종이봉투 호흡은 산소가 부족해질 수 있어 요즘은 권하지 않아요.</p>
<h3>3. 지금 여기로 돌아오기 (5-4-3-2-1)</h3>
<ul>
<li>보이는 것 <strong>5가지</strong></li>
<li>만져지는 것 <strong>4가지</strong></li>
<li>들리는 것 <strong>3가지</strong></li>
<li>냄새 <strong>2가지</strong></li>
<li>맛 <strong>1가지</strong></li>
</ul>
<p>감각에 주의를 돌리면 머릿속 공포의 소용돌이에서 한 걸음 벗어날 수 있어요.</p>
<h3>4. 도망치지 않기</h3>
<p>가능하다면 그 자리에서 발작이 지나가는 것을 기다려요. 매번 그 장소를 피하면 뇌는 '그곳이 위험했다'고 배우고, 피하는 곳이 점점 늘어나요.</p>

<h2>치료</h2>
<div class="tbl"><table>
<thead><tr><th>치료</th><th>설명</th></tr></thead>
<tbody>
<tr><td>인지행동치료</td><td>공황의 원리를 배우고, 몸의 감각을 잘못 해석하는 생각을 바로잡고, 피하던 상황과 감각에 단계적으로 다가가는 연습을 해요. 효과가 오래 유지돼요</td></tr>
<tr><td>항우울제 (SSRI 등)</td><td>공황장애의 1차 약물 치료예요. 효과가 나타나는 데 몇 주가 걸리고, 좋아진 뒤에도 일정 기간 유지해요</td></tr>
<tr><td>항불안제 (벤조디아제핀)</td><td>빠르게 불안을 줄이지만 의존성이 있어 짧게, 필요할 때 제한적으로 써요</td></tr>
</tbody></table></div>
<p>약물과 인지행동치료를 함께하면 효과가 더 좋은 경우가 많아요. 치료를 받은 사람의 상당수가 증상이 크게 줄거나 사라져요.</p>

<h2>생활 속 관리</h2>
<ul>
<li><strong>카페인</strong>을 줄여요. 커피, 에너지 음료가 발작을 부르기도 해요.</li>
<li><strong>규칙적인 운동</strong>은 불안을 줄이고, 심장이 뛰는 감각에 익숙해지는 연습이 돼요.</li>
<li><strong>수면</strong> 리듬을 지켜요.</li>
<li><strong>술</strong>로 불안을 달래지 않아요. 숙취와 금단이 다음 날 불안을 키워요.</li>
<li>믿을 만한 사람에게 공황에 대해 이야기해 두면 발작 때 도움을 받기 쉬워요.</li>
</ul>

<div class="box"><span class="h">공황발작 대처 카드 (휴대폰에 저장해 두세요)</span>
<ol>
<li>"이건 공황발작이야. 위험하지 않고 곧 지나가."</li>
<li>4초 들이마시고 6초 내쉬기, 5분</li>
<li>보이는 것 5개, 만져지는 것 4개 세기</li>
<li>가능하면 그 자리에 머물기</li>
<li>지나간 뒤 스스로 칭찬하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>공황발작으로 정말 죽을 수 있나요?</dt>
<dd>공황발작 자체로 심장이 멈추거나 질식하지는 않아요. 다만 비슷한 증상을 일으키는 심장·폐 질환이 없는지 처음에 확인하는 게 중요해요.</dd>
<dt>약을 먹으면 평생 먹어야 하나요?</dt>
<dd>보통 좋아진 뒤 1년 안팎 유지하다가 의사와 함께 서서히 줄여요. 인지행동치료를 함께 받으면 약을 끊은 뒤에도 재발이 줄어요.</dd>
<dt>공황장애가 있으면 운전이나 비행기를 못 타나요?</dt>
<dd>치료를 받으며 단계적으로 연습하면 다시 할 수 있는 경우가 많아요. 피하던 상황에 조금씩 다가가는 것이 치료의 중요한 부분이에요.</dd>
</dl>
