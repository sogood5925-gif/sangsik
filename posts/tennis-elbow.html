  data-title="테니스엘보·골프엘보: 테니스를 안 쳐도 생기는 팔꿈치 통증, 주사보다 운동, 1년을 보는 회복"
  data-thumb="1년|대부분 좋아지는 기간"
  data-summary="컵을 들거나 수건을 짤 때 팔꿈치 바깥쪽이 찌릿하면 테니스엘보, 안쪽이 아프면 골프엘보일 수 있어요. 운동선수보다 집안일과 반복 작업을 하는 40~50대에 흔한 이유, 스스로 확인하는 법, 손목 힘줄을 튼튼하게 하는 운동, 팔꿈치 밴드와 주사의 장단점, 수술을 고려하는 경우를 정리했어요."
  data-tags="테니스엘보,골프엘보,팔꿈치통증,상과염,질병">
<p class="lead">프라이팬을 들거나 걸레를 짤 때, 악수할 때 팔꿈치 바깥쪽이 찌릿하게 아파요. 테니스를 친 적도 없는데 '테니스엘보'라는 진단을 받으면 의아하지요. 이름과 달리 이 병은 운동선수보다 손목과 손가락을 반복해서 쓰는 보통 사람들에게 훨씬 많아요. 서두르지 않고 힘줄을 회복시키는 것이 핵심이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>손목을 펴는 힘줄이 붙는 <strong>팔꿈치 바깥쪽</strong>이 아프면 테니스엘보, 굽히는 힘줄의 <strong>안쪽</strong>이면 골프엘보예요.</li>
<li>염증보다 <strong>힘줄이 반복해서 닳고 회복이 더딘 상태</strong>에 가까워요.</li>
<li>대부분 <strong>몇 달~1년 안에</strong> 좋아져요. 아픈 동작 줄이기와 <strong>힘줄 강화 운동</strong>이 기본이에요.</li>
<li>스테로이드 주사는 <strong>당장은 편하지만 재발이 늘 수 있어</strong> 신중하게 써요.</li>
</ul></div>

<h2>두 가지 엘보</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>아픈 곳</th><th>심해지는 동작</th></tr></thead>
<tbody>
<tr><td>테니스엘보(외측 상과염)</td><td>팔꿈치 바깥쪽 뼈 돌출 부위</td><td>손등을 위로 하고 물건 들기, 수건 짜기, 문고리 돌리기, 마우스 오래 쓰기</td></tr>
<tr><td>골프엘보(내측 상과염)</td><td>팔꿈치 안쪽 뼈 돌출 부위</td><td>손바닥을 위로 하고 들기, 꽉 쥐기, 손목 굽히며 힘주기</td></tr>
</tbody>
<caption>대한견주관절의학회, 미국정형외과학회(AAOS) 환자 안내를 바탕으로 정리</caption></table></div>

<h2>누구에게 잘 생길까</h2>
<ul>
<li><strong>40~50대</strong>에 가장 많아요. 힘줄의 회복력이 떨어지는 나이예요.</li>
<li>요리, 청소, 육아(아기 안기), 컴퓨터 작업처럼 <strong>손목을 반복해서 쓰는 일</strong></li>
<li>목수, 요리사, 미용사처럼 도구를 꽉 쥐는 직업</li>
<li>라켓 운동이나 골프를 갑자기 많이 하거나 자세가 맞지 않을 때</li>
<li>흡연, 비만이 위험을 높인다는 연구도 있어요.</li>
</ul>

<h2>스스로 확인해 보기</h2>
<ul>
<li>팔꿈치 바깥(또는 안쪽) 뼈 돌출 바로 옆을 누르면 아파요.</li>
<li>팔을 펴고 손등 쪽으로 손목을 젖히는 힘을 줄 때(누가 눌러 줄 때) 바깥쪽이 아프면 테니스엘보를 의심해요.</li>
<li>의자를 손바닥 아래로 향한 채 들어 올릴 때 아파요.</li>
</ul>
<p>팔꿈치가 붓고 뜨겁거나, 넘어진 뒤 아프거나, 손가락이 저리면 다른 원인일 수 있어 진료를 받아요.</p>

<h2>치료의 기본</h2>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>설명</th></tr></thead>
<tbody>
<tr><td>활동 조절</td><td>완전히 쉬기보다 <strong>아픈 동작을 줄이고</strong> 들 때 손바닥이 위로 가게 들어요</td></tr>
<tr><td>힘줄 강화 운동</td><td>가벼운 아령이나 물병으로 손목을 천천히 내리는 운동(원심성 운동). 몇 주~몇 달 꾸준히</td></tr>
<tr><td>팔꿈치 밴드</td><td>팔뚝 위쪽에 차서 힘줄에 가는 힘을 나눠요. 일할 때 도움이 될 수 있어요</td></tr>
<tr><td>냉찜질, 진통제</td><td>통증이 심할 때 짧게. 소염진통제는 위장·콩팥 상태를 보고 약사와 상의</td></tr>
<tr><td>체외충격파 등</td><td>오래가는 경우 선택지로 쓰이지만 효과는 연구마다 차이가 있어요</td></tr>
</tbody>
<caption>대한견주관절의학회, 영국 국립보건임상연구원(NICE) Clinical Knowledge Summaries: Tennis elbow를 바탕으로 정리</caption></table></div>

<h2>주사, 맞을까 말까</h2>
<p>스테로이드 주사는 몇 주 동안 통증을 크게 줄여 줄 수 있어요. 그런데 여러 연구에서 <strong>1년 뒤를 보면 주사를 맞은 사람이 오히려 재발이 많고 회복이 늦은</strong> 경향이 나타났어요. 반복해서 맞으면 힘줄과 피부가 얇아질 수도 있어요. 중요한 일정 때문에 당장 통증을 줄여야 하는 경우처럼 이득이 분명할 때 의사와 상의해 쓰는 것이 좋아요. 자가혈소판 주사 같은 다른 주사는 연구 결과가 엇갈려요.</p>

<h2>수술은 언제</h2>
<p>6개월~1년 이상 충분히 치료했는데도 일상생활이 어려울 만큼 아플 때 고려해요. 대부분의 사람은 수술 없이 좋아져요.</p>

<div class="box note"><span class="h">간단한 힘줄 운동 예(테니스엘보)</span>
<ol>
<li>팔꿈치를 책상에 대고 손등이 위로, 손목이 책상 끝 밖으로 나오게 해요.</li>
<li>반대 손으로 가벼운 물병 든 손목을 위로 올려 줘요.</li>
<li>물병 든 손목을 <strong>3~5초에 걸쳐 천천히 내려요.</strong></li>
<li>10~15번씩 2~3세트, 약간 뻐근한 정도로 해요. 통증이 심해지면 무게를 줄여요.</li>
</ol>
<p>시작 전 의사나 물리치료사에게 자세를 확인받으면 더 좋아요.</p></div>

<h2>다시 아프지 않게</h2>
<ul>
<li>무거운 물건은 두 손으로, 손바닥이 위를 보게 들어요.</li>
<li>프라이팬과 냄비는 손잡이만 잡지 말고 받쳐 들어요.</li>
<li>마우스와 자판은 손목이 꺾이지 않게 두고, 손잡이가 두툼한 도구를 써요.</li>
<li>라켓·골프는 그립 크기와 자세를 점검하고 운동량을 서서히 늘려요.</li>
</ul>

<div class="box warn"><span class="h">이런 경우는 다른 병일 수 있어요</span>
<ul>
<li>팔꿈치가 <strong>붓고 뜨겁고 붉으며</strong> 열이 나요(감염, 통풍).</li>
<li>넘어진 뒤 팔을 펴거나 돌리기 어려워요(골절).</li>
<li>손가락이 저리거나 힘이 빠져요(신경 압박, 목 디스크).</li>
</ul></div>

<div class="box"><span class="h">팔꿈치 통증 체크리스트</span>
<ol>
<li>아픈 동작 알아내고 줄이기</li>
<li>들 때 손바닥 위로</li>
<li>힘줄 운동 꾸준히 몇 달</li>
<li>일할 때 팔꿈치 밴드</li>
<li>주사는 이득·손해 따져 신중히</li>
<li>붓고 열나면 바로 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>아프면 팔을 완전히 쉬어야 하나요?</dt>
<dd>깁스처럼 오래 고정하면 오히려 근육이 약해져요. 아픈 동작만 줄이고 가벼운 움직임과 운동은 이어 가요.</dd>
<dt>파스를 붙이면 도움이 되나요?</dt>
<dd>소염진통 성분의 파스나 겔은 통증을 잠시 줄이는 데 도움이 될 수 있어요. 근본적인 회복은 운동과 활동 조절이에요.</dd>
<dt>양쪽 팔꿈치가 다 아파요.</dt>
<dd>양손을 같이 쓰는 일에서는 양쪽에 생기기도 해요. 여러 관절이 함께 붓고 아프면 류마티스 질환을 확인해요.</dd>
</dl>
