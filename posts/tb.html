  data-title="결핵: 2주 넘는 기침은 검사를, 잠복결핵과 활동성 결핵의 차이"
  data-thumb="2주|기침 지속 기준"
  data-summary="결핵은 지금도 국내에서 드물지 않은 감염병이에요. 2주 넘게 이어지는 기침과 체중 감소, 식은땀 같은 증상, 옮기지 않는 잠복결핵과 옮기는 활동성 결핵의 차이, 6개월 치료를 끝까지 해야 하는 이유, 가족 중 환자가 생겼을 때의 검사를 정리했어요."
  data-tags="결핵,잠복결핵,기침,감염병,질병">
<p class="lead">결핵은 옛날 병처럼 느껴지지만, 우리나라는 경제 수준에 비해 결핵 환자가 여전히 많은 나라예요. 특히 어르신에게 많고, 감기와 비슷하게 시작해 늦게 발견되는 경우가 많아요. 다행히 결핵은 약을 제대로 먹으면 대부분 완치돼요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>2주 넘게 기침</strong>이 계속되면 결핵 검사(흉부 엑스레이, 가래 검사)를 받아요.</li>
<li><strong>잠복결핵</strong>은 균이 잠들어 있어 증상도 전염성도 없지만, 일부는 나중에 활동성 결핵으로 진행해요.</li>
<li><strong>활동성 결핵</strong>은 보통 <strong>6개월 이상</strong> 여러 약을 함께 먹어야 하고, 중간에 끊으면 내성이 생겨요.</li>
<li>결핵 환자와 가까이 지낸 가족·동료는 <strong>접촉자 검진</strong>을 받아요.</li>
</ul></div>

<h2>결핵은 어떻게 옮을까</h2>
<p>결핵균은 활동성 폐결핵 환자가 기침, 재채기, 말할 때 나오는 작은 비말 입자를 통해 공기로 옮아요. 같은 공간에서 오래 함께 지낸 가족과 동료가 주로 감염돼요. 악수, 식기, 옷으로는 거의 옮지 않아요.</p>
<p>균이 몸에 들어와도 대부분은 면역이 균을 가둬 두어 <strong>잠복결핵</strong> 상태로 지내요. 면역이 약해지면 균이 깨어나 <strong>활동성 결핵</strong>이 돼요.</p>

<h2>잠복결핵과 활동성 결핵</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>잠복결핵</th><th>활동성 결핵</th></tr></thead>
<tbody>
<tr><td>균의 상태</td><td>몸 안에서 잠들어 있어요</td><td>증식하며 병을 일으켜요</td></tr>
<tr><td>증상</td><td>없어요</td><td>기침, 발열, 식은땀, 체중 감소 등</td></tr>
<tr><td>전염성</td><td>없어요</td><td>폐결핵은 있어요</td></tr>
<tr><td>검사</td><td>피부 반응 검사, 혈액 검사(인터페론감마 분비 검사) 양성. 흉부 엑스레이 정상</td><td>흉부 엑스레이 이상, 가래에서 균 확인</td></tr>
<tr><td>치료</td><td>발병을 막기 위해 3~4개월 치료를 권하는 경우가 많아요</td><td>여러 약으로 6개월 이상 치료</td></tr>
</tbody>
<caption>질병관리청 결핵 진료지침을 바탕으로 정리</caption></table></div>
<p>잠복결핵이 있는 사람 가운데 평생 약 <strong>5~10%</strong>가 활동성 결핵으로 진행하고, 그 절반가량은 감염 뒤 1~2년 안에 생겨요. 당뇨, 면역억제 치료, 투석, 생물학적 제제 치료를 받는 사람은 위험이 더 높아 치료를 적극 권해요.</p>

<h2>이런 증상이 있으면 검사를</h2>
<ul>
<li><strong>2주 이상</strong> 계속되는 기침과 가래</li>
<li>오후나 밤에 나는 미열, <strong>밤에 흠뻑 젖는 식은땀</strong></li>
<li>이유 없는 체중 감소, 식욕 저하, 피로</li>
<li>가래에 피가 섞여 나옴</li>
<li>가슴 통증, 숨참</li>
</ul>
<p>어르신은 기침 없이 기운이 떨어지고 식사량만 줄어드는 식으로 나타나기도 해요. 결핵은 폐 외에 림프절, 뼈, 콩팥, 뇌막 등에도 생길 수 있어요.</p>

<h2>진단</h2>
<ul>
<li><strong>흉부 엑스레이:</strong> 폐에 결핵을 의심할 그림자가 있는지 봐요.</li>
<li><strong>가래 검사:</strong> 현미경 검사(도말), 배양 검사, 유전자 검사로 균과 약제 내성을 확인해요. 가래는 아침 첫 가래를 여러 번 받아 내요.</li>
<li>필요하면 흉부 CT, 기관지 내시경을 해요.</li>
</ul>

<h2>치료</h2>
<div class="tbl"><table>
<thead><tr><th>시기</th><th>내용</th></tr></thead>
<tbody>
<tr><td>처음 2개월(집중기)</td><td>보통 4가지 약(아이소니아지드, 리팜핀, 피라진아마이드, 에탐부톨)을 함께 먹어요</td></tr>
<tr><td>이후 4개월(유지기)</td><td>2~3가지 약을 계속 먹어요</td></tr>
<tr><td>내성 결핵</td><td>약제 내성이 있으면 다른 약 조합으로 더 오래 치료해요</td></tr>
</tbody>
<caption>질병관리청 결핵 진료지침을 바탕으로 정리. 약 조합과 기간은 사람마다 달라질 수 있어요</caption></table></div>
<ul>
<li>약을 먹기 시작하고 <strong>2주 정도</strong> 지나면 전염력이 크게 줄어요. 그동안은 마스크를 쓰고 다른 사람과 떨어져 지내요.</li>
<li>증상이 좋아져도 <strong>정해진 기간을 끝까지</strong> 먹어야 해요. 중간에 끊으면 재발하고, 약이 듣지 않는 <strong>다제내성 결핵</strong>이 생길 수 있어요.</li>
<li>결핵 치료는 국가에서 본인 부담을 줄여 주는 지원 제도가 있어요. 보건소나 치료 병원에서 안내받아요.</li>
</ul>
<div class="box note"><span class="h">결핵 약의 흔한 부작용</span>
<ul>
<li>리팜핀을 먹으면 소변, 눈물, 땀이 <strong>주황색</strong>으로 변해요. 정상이에요. 소프트 콘택트렌즈가 물들 수 있어요.</li>
<li>구역질, 식욕 저하, 가려움, 관절통이 생길 수 있어요.</li>
<li><strong>눈이 노래지고, 소변이 진해지고, 심한 구토와 복통</strong>이 있으면 간 손상일 수 있어 바로 연락해요.</li>
<li>에탐부톨은 드물게 시력과 색 구별에 영향을 줄 수 있어요. 보이는 게 달라지면 알려요.</li>
<li>리팜핀은 피임약 등 여러 약의 효과를 떨어뜨려요. 먹는 약을 모두 알려요.</li>
</ul></div>

<h2>가족 중 환자가 생겼다면</h2>
<ul>
<li>보건소 안내에 따라 <strong>접촉자 검진</strong>(흉부 엑스레이, 잠복결핵 검사)을 받아요.</li>
<li>잠복결핵으로 나오면 치료 여부를 의사와 상의해요. 특히 어린 아이는 치료가 중요해요.</li>
<li>환자가 치료 초기 2주 동안은 방을 따로 쓰고 자주 환기해요.</li>
</ul>

<h2>예방</h2>
<ul>
<li>신생아는 <strong>BCG 예방접종</strong>을 받아요. 어린이의 중증 결핵(결핵성 뇌막염 등)을 줄여 줘요. 성인 결핵 예방 효과는 제한적이에요.</li>
<li>기침할 때 옷소매나 휴지로 가리고, 실내를 자주 환기해요.</li>
<li>어르신, 당뇨 환자, 면역이 약한 사람은 정기 검진에서 흉부 엑스레이를 챙겨요.</li>
<li>금연과 절주, 균형 잡힌 식사도 결핵 발병 위험을 낮추는 데 도움이 돼요.</li>
</ul>

<div class="box"><span class="h">결핵 체크리스트</span>
<ol>
<li>2주 넘는 기침이면 결핵 검사</li>
<li>식은땀·체중 감소·피 섞인 가래 주의</li>
<li>치료는 6개월 이상 끝까지</li>
<li>눈이 노래지면 즉시 연락</li>
<li>가족은 접촉자 검진 받기</li>
<li>기침 예절과 환기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>잠복결핵이면 가족에게 옮기나요?</dt>
<dd>아니에요. 잠복결핵은 균이 잠들어 있어 다른 사람에게 옮기지 않아요. 다만 나중에 활동성 결핵으로 진행할 수 있어 치료를 권하는 경우가 많아요.</dd>
<dt>결핵을 앓았던 사람도 다시 걸리나요?</dt>
<dd>네. 치료를 끝내지 않았거나, 다시 감염되거나, 면역이 떨어지면 재발할 수 있어요. 예전 결핵 흔적이 있는 사람은 증상이 생기면 결핵을 먼저 확인해요.</dd>
<dt>결핵 환자와 같이 밥을 먹어도 되나요?</dt>
<dd>결핵은 식기로 옮지 않아요. 치료 초기 2주 동안은 가까운 대화와 좁은 공간에 오래 함께 있는 것을 줄이고, 이후에는 평소처럼 지내도 돼요.</dd>
</dl>
