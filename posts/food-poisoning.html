  data-summary="식중독은 여름에만 생기지 않아요. 겨울엔 노로바이러스, 봄엔 대량 조리 음식, 여름엔 달걀·생닭·어패류가 주범이에요. 원인균별로 주의할 음식과 예방법, 간 질환자가 특히 조심해야 할 비브리오, 걸렸을 때 수분 보충과 병원에 가야 할 신호를 정리했어요."

<p class="lead">같은 식중독이라도 원인에 따라 잘 생기는 계절, 문제가 되는 음식, 막는 방법이 달라요. 원인을 알면 무엇을 조심할지가 분명해져요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>겨울~봄 노로바이러스</strong>는 굴 같은 조개류와 사람 사이 전파가 주요 경로예요. 85°C에서 1분 이상 익혀요.</li>
<li><strong>여름</strong>에는 달걀·닭(살모넬라, 캠필로박터), 채소(병원성 대장균), 어패류(장염비브리오)를 조심해요.</li>
<li><strong>대량으로 끓인 국과 찜</strong>은 실온에 두면 퍼프린젠스균이 자라요. 작게 나눠 빨리 식혀요.</li>
<li>간 질환이 있다면 여름철 <strong>생굴과 회를 피해요.</strong> 비브리오 패혈증은 치명적일 수 있어요.</li>
</ul></div>

<h2>원인균별 정리</h2>
<div class="tbl"><table>
<thead><tr><th>원인</th><th>많은 시기</th><th>주요 음식·경로</th><th>잠복기 (대략)</th></tr></thead>
<tbody>
<tr><td>노로바이러스</td><td>11월~4월</td><td>굴 등 조개류 생식, 오염된 지하수, 환자의 구토물·손</td><td>12~48시간</td></tr>
<tr><td>병원성 대장균</td><td>여름</td><td>덜 씻은 채소, 덜 익힌 고기, 오염된 물</td><td>1~8일</td></tr>
<tr><td>살모넬라</td><td>여름</td><td>달걀, 덜 익힌 닭고기, 달걀을 만진 손</td><td>6~72시간</td></tr>
<tr><td>캠필로박터</td><td>여름 (삼계탕 철)</td><td>생닭 손질 중 교차오염, 덜 익힌 닭고기</td><td>2~5일</td></tr>
<tr><td>장염비브리오</td><td>여름~초가을</td><td>바닷물 온도가 오를 때의 어패류 생식</td><td>수 시간~1일</td></tr>
<tr><td>클로스트리디움 퍼프린젠스</td><td>봄, 연중</td><td>대량 조리 후 실온에 둔 국, 찜, 카레, 도시락</td><td>6~24시간</td></tr>
<tr><td>황색포도상구균</td><td>연중</td><td>손의 상처나 코를 만진 손으로 만든 김밥, 도시락</td><td>1~6시간</td></tr>
<tr><td>바실루스 세레우스</td><td>연중</td><td>실온에 오래 둔 밥, 볶음밥</td><td>1~16시간</td></tr>
</tbody>
<caption>식품의약품안전처 식중독 통계와 원인균 정보를 바탕으로 정리</caption></table></div>

<h2>겨울의 주범: 노로바이러스</h2>
<ul>
<li><strong>아주 적은 양</strong>으로도 감염되고, 환경에서 오래 살아남아요.</li>
<li>음식뿐 아니라 환자의 구토물, 대변, 손, 문고리를 통해 <strong>사람 사이에 쉽게 퍼져요.</strong> 가족이 한 명씩 차례로 앓는 경우가 흔해요.</li>
<li>굴, 조개는 <strong>중심온도 85°C에서 1분 이상</strong> 익혀 먹어요.</li>
<li>알코올 손소독제가 잘 듣지 않아요. <strong>비누로 손을 씻어요.</strong></li>
<li>구토물은 마스크와 장갑을 끼고 치운 뒤, 희석한 락스(약 0.1~0.5%)로 소독해요.</li>
<li>증상이 사라진 뒤에도 며칠간 바이러스가 나올 수 있어서, 회복 후 <strong>2~3일은 음식을 만들지 않는 것</strong>이 좋아요.</li>
</ul>

<h2>여름: 달걀, 닭, 어패류</h2>
<h3>살모넬라와 달걀</h3>
<ul>
<li>달걀은 냉장 보관하고, 금이 간 달걀은 쓰지 않아요.</li>
<li>달걀을 만진 뒤에는 <strong>반드시 손을 씻어요.</strong> 껍데기에 묻은 균이 손을 통해 다른 음식으로 옮아요.</li>
<li>노른자와 흰자가 완전히 익도록 조리해요. 반숙은 신선한 달걀로, 바로 먹을 때만.</li>
</ul>
<h3>캠필로박터와 생닭</h3>
<ul>
<li>생닭은 씻을 때 물이 튀어 주변을 오염시키기 쉬워요. <strong>채소를 먼저 씻고 닭은 맨 나중에</strong> 씻어요.</li>
<li>닭고기는 속까지 완전히 익혀요. 뼈 주변이 분홍빛이면 더 익혀요.</li>
<li>생닭을 담았던 그릇에 익힌 닭을 다시 담지 않아요.</li>
</ul>
<h3>장염비브리오와 비브리오 패혈증</h3>
<p>바닷물 온도가 올라가는 여름에는 어패류에 비브리오균이 늘어나요. 장염비브리오는 주로 복통과 설사를 일으키지만, <strong>비브리오 불니피쿠스</strong>는 전혀 다른 병을 일으켜요.</p>
<div class="box warn"><span class="h">간 질환이 있다면 여름철 생굴과 회를 피하세요</span>
<p><strong>비브리오 패혈증</strong>은 오염된 어패류를 날로 먹거나 상처가 바닷물에 닿아 감염돼요. 건강한 사람은 드물지만 <strong>만성 간질환(간경변, 만성 간염), 알코올 의존, 당뇨병, 면역저하</strong>가 있는 사람은 걸리기 쉽고 치사율이 매우 높아요. 여름철에는 어패류를 충분히 익혀 먹고, 상처가 있으면 바닷물에 들어가지 않아요. 생선회를 먹고 열, 오한과 함께 다리에 붓고 물집이 생기면 바로 응급실로 가요.</p></div>

<h2>봄과 행사철: 대량 조리 음식</h2>
<p>퍼프린젠스균은 공기를 싫어하는 균으로, 큰 솥에 끓인 국이나 찜의 바닥처럼 산소가 적은 곳에서 잘 자라요. 끓일 때 대부분의 균은 죽지만, 열에 강한 <strong>포자</strong>가 살아남았다가 음식이 천천히 식는 동안 다시 깨어나 폭발적으로 늘어나요.</p>
<ul>
<li>많이 끓인 음식은 <strong>작고 얕은 용기에 나눠 담아</strong> 빨리 식혀요.</li>
<li>식힌 음식은 2시간 안에 냉장고에 넣어요.</li>
<li>다시 먹을 때는 <strong>충분히 끓여서</strong> 먹어요.</li>
<li>나들이 도시락은 아이스박스에 담고, 김밥은 만든 뒤 빨리 먹어요.</li>
</ul>

<h2>가열해도 없어지지 않는 독소</h2>
<p><strong>황색포도상구균</strong>과 <strong>바실루스 세레우스</strong>(구토형)는 음식 속에서 자라며 <strong>열에 강한 독소</strong>를 만들어요. 이미 독소가 생긴 음식은 다시 데워도 식중독을 일으킬 수 있어요. 그래서 이런 음식은 처음부터 실온에 오래 두지 않는 게 중요해요.</p>
<ul>
<li>손에 상처가 있으면 장갑을 끼고 음식을 만들어요.</li>
<li>남은 밥은 실온에 두지 말고 바로 냉장·냉동해요.</li>
</ul>

<h2>식중독에 걸렸다면</h2>
<h3>가장 중요한 건 수분</h3>
<ul>
<li>설사와 구토로 잃은 물과 전해질을 채우는 게 치료의 기본이에요.</li>
<li>약국에서 파는 <strong>경구 수액제(전해질 보충액)</strong>가 가장 좋아요. 없다면 물을 조금씩 자주 마셔요.</li>
<li>스포츠음료나 주스는 당이 많아 설사를 악화시킬 수 있어요. 마신다면 물로 희석해요.</li>
<li>구토가 가라앉으면 죽, 바나나, 흰밥처럼 소화가 쉬운 음식부터 조금씩 먹어요.</li>
</ul>
<h3>지사제는 조심해서</h3>
<p>설사는 몸이 균과 독소를 내보내는 과정이기도 해요. <strong>열이 나거나 혈변이 있는 설사</strong>에 지사제를 먹으면 오히려 균이 장에 머물러 악화될 수 있어요. 지사제는 약사나 의사와 상의해 써요.</p>
<div class="box warn"><span class="h">병원에 가야 하는 신호</span>
<ul>
<li>피가 섞인 설사나 검은 변</li>
<li>38.5°C 이상 고열</li>
<li>소변이 거의 나오지 않거나, 입이 바싹 마르고 어지러운 탈수 증상</li>
<li>물도 마시지 못할 만큼 계속 토함</li>
<li>설사가 3일 넘게 이어짐</li>
<li>영유아, 노인, 임신부, 만성질환자</li>
<li>눈꺼풀 처짐, 말이 어눌해짐, 삼키기 어려움 같은 신경 증상 (보툴리눔 가능성, 응급)</li>
</ul></div>
<p>여러 사람이 같은 음식을 먹고 함께 증상이 생겼다면 <strong>관할 보건소에 신고</strong>해요. 원인 조사로 더 큰 피해를 막을 수 있어요. 먹고 남은 음식이 있다면 버리지 말고 냉장 보관해 두면 조사에 도움이 돼요.</p>

<div class="box"><span class="h">식중독 예방 체크리스트</span>
<ol>
<li>요리 전과 날고기·달걀을 만진 뒤 비누로 손 씻기</li>
<li>채소를 먼저, 날고기와 생닭은 나중에 손질하기</li>
<li>고기·달걀은 속까지, 조개류는 85°C 1분 이상 익히기</li>
<li>많이 끓인 음식은 나눠 담아 빨리 식히고 2시간 안에 냉장</li>
<li>간 질환이 있다면 여름철 어패류 날로 먹지 않기</li>
<li>설사하는 동안과 회복 후 며칠은 가족 음식 만들지 않기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>상한 음식은 냄새로 알 수 있나요?</dt>
<dd>식중독균이 많이 자라도 냄새나 맛이 변하지 않는 경우가 많아요. 냄새로 판단하지 말고 보관 시간과 온도로 판단해요.</dd>
<dt>국은 끓이면 안전하지 않나요?</dt>
<dd>끓이면 대부분의 균은 죽지만 퍼프린젠스균의 포자나 일부 균의 독소는 남을 수 있어요. 끓인 뒤 식히고 보관하는 과정이 더 중요해요.</dd>
<dt>식중독에 걸리면 항생제를 먹어야 하나요?</dt>
<dd>대부분의 식중독은 수분 보충만으로 며칠 안에 좋아져요. 원인균과 증상에 따라 의사가 항생제를 판단하고, 장출혈성 대장균처럼 항생제가 오히려 위험할 수 있는 경우도 있어요.</dd>
</dl>
