  data-title="개 물림 예방과 대처: 다가오는 개 앞에서 할 일, 물린 상처 씻기, 광견병·파상풍 확인"
  data-thumb="15분|물린 상처 씻기"
  data-summary="개 물림 사고는 모르는 개보다 아는 개, 집 안이나 동네에서 많이 일어나요. 개가 보내는 경고 신호, 개가 다가올 때와 공격할 때 몸을 지키는 법, 아이에게 가르칠 규칙, 물린 뒤 상처를 씻고 병원에 가야 하는 경우, 광견병과 파상풍 확인, 보호자의 의무를 정리했어요."
  data-tags="개물림,반려견,광견병,상처치료,생활정보">
<p class="lead">반려견과 함께 사는 집이 많아지면서 개 물림 사고도 꾸준히 일어나요. 아이는 얼굴과 머리를, 어른은 손과 다리를 주로 물려요. 개가 보내는 신호를 읽고, 사고가 났을 때 상처를 제대로 씻는 것만 알아도 큰 피해를 줄일 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>모르는 개는 <strong>보호자에게 먼저 묻고</strong>, 개가 다가오게 기다려요.</li>
<li>개가 공격해 오면 <strong>뛰지 말고</strong> 나무처럼 서요. 넘어지면 <strong>웅크려 목과 얼굴</strong>을 감싸요.</li>
<li>물리면 <strong>비누와 흐르는 물로 15분</strong> 안팎 충분히 씻고 병원에 가요.</li>
<li>물린 개의 <strong>예방접종 여부와 보호자 연락처</strong>를 꼭 확인해요.</li>
</ul></div>

<h2>개가 보내는 경고 신호</h2>
<div class="tbl"><table>
<thead><tr><th>신호</th><th>뜻</th></tr></thead>
<tbody>
<tr><td>몸이 굳고 꼬리를 뻣뻣하게 세움</td><td>긴장하고 경계하고 있어요</td></tr>
<tr><td>입술을 들어 이빨을 보이고 으르렁거림</td><td>더 다가오지 말라는 분명한 경고예요</td></tr>
<tr><td>눈의 흰자가 보이게 곁눈질, 귀를 뒤로 젖힘</td><td>불안하고 무서워요</td></tr>
<tr><td>하품, 입술 핥기, 고개 돌리기</td><td>스트레스를 받고 있어요</td></tr>
<tr><td>꼬리를 다리 사이에 넣고 몸을 낮춤</td><td>겁을 먹었어요. 몰리면 물 수 있어요</td></tr>
</tbody>
<caption>미국수의사회(AVMA) 개 물림 예방 안내, 농림축산식품부 반려견 안전 관리 자료를 바탕으로 정리</caption></table></div>
<p>꼬리를 흔든다고 항상 반가운 건 아니에요. 몸 전체의 모습을 함께 봐요.</p>

<h2>모르는 개를 만났을 때</h2>
<ul>
<li>만지기 전에 <strong>보호자에게 먼저 물어봐요.</strong></li>
<li>허락을 받았다면 옆으로 서서 개가 먼저 냄새를 맡게 기다리고, 머리 위보다 <strong>턱 아래나 가슴</strong>을 쓰다듬어요.</li>
<li>밥 먹는 개, 자는 개, 새끼를 돌보는 개, 아프거나 다친 개는 건드리지 않아요.</li>
<li>묶여 있거나 울타리 안에 있는 개에게 손을 넣지 않아요.</li>
</ul>

<h2>개가 공격해 올 때</h2>
<ol>
<li><strong>뛰지 않아요.</strong> 달리면 쫓아오는 본능을 자극해요.</li>
<li>팔을 몸에 붙이고 <strong>나무처럼 가만히 서서</strong>, 눈을 똑바로 마주치지 않아요.</li>
<li>개가 흥미를 잃고 물러나면 천천히 뒷걸음으로 멀어져요.</li>
<li>가방, 우산, 겉옷을 개와 나 사이에 두어 방패로 써요.</li>
<li>넘어졌다면 <strong>공처럼 웅크리고 두 손으로 목과 귀를 감싸요.</strong></li>
</ol>

<h2>아이에게 가르칠 규칙</h2>
<ul>
<li>어른 없이 개에게 다가가지 않기</li>
<li>개 얼굴에 얼굴을 가까이 대거나 껴안지 않기</li>
<li>개의 꼬리, 귀를 잡아당기지 않기</li>
<li>개가 쫓아오면 소리 지르며 뛰지 말고 나무처럼 서기</li>
<li>집에서 키우는 개라도 <strong>아기와 개를 단둘이 두지 않기</strong></li>
</ul>

<h2>물린 뒤 할 일</h2>
<div class="tbl"><table>
<thead><tr><th>순서</th><th>할 일</th></tr></thead>
<tbody>
<tr><td>1. 안전 확보</td><td>개에게서 떨어지고, 보호자에게 개를 묶거나 격리해 달라고 해요</td></tr>
<tr><td>2. 씻기</td><td>비누와 흐르는 물로 상처를 <strong>15분 안팎</strong> 충분히 씻어요. 광견병과 세균 감염을 줄이는 가장 중요한 처치예요</td></tr>
<tr><td>3. 지혈</td><td>깨끗한 거즈로 눌러 피를 멈춰요</td></tr>
<tr><td>4. 정보 확인</td><td>보호자 연락처, 개의 광견병 예방접종 기록, 동물등록 여부</td></tr>
<tr><td>5. 병원</td><td>작은 상처도 진료를 권해요. 항생제, 파상풍 예방접종, 필요하면 광견병 예방 치료를 판단해요</td></tr>
<tr><td>6. 신고</td><td>보호자를 알 수 없거나 떠돌이 개라면 관할 지자체나 112·119에 알려요</td></tr>
</tbody>
<caption>질병관리청 광견병 예방 안내, 대한응급의학회 동물 교상 처치 안내를 바탕으로 정리</caption></table></div>

<div class="box warn"><span class="h">바로 응급실에 가야 할 때</span>
<ul>
<li>피가 멈추지 않거나 상처가 깊고 벌어져 있어요.</li>
<li>얼굴, 목, 손, 관절 부위를 물렸어요.</li>
<li>아이가 여러 곳을 물렸어요.</li>
<li>당뇨, 간질환, 면역 저하가 있어 감염에 약해요.</li>
<li>며칠 뒤 상처가 붓고 붉어지며 열이 나요.</li>
</ul></div>

<h2>광견병과 파상풍</h2>
<p>우리나라에서 사람 광견병은 오랫동안 보고되지 않았지만, 경기·강원 북부 등에서 너구리 같은 야생동물의 광견병이 드물게 확인돼요. 예방접종을 하지 않은 개, 떠돌이 개, 야생동물에게 물렸다면 의사가 <strong>광견병 노출 후 예방 치료</strong>가 필요한지 판단해요. 물린 개는 보통 일정 기간 이상 행동이 없는지 관찰해요. 파상풍 예방접종을 받은 지 오래됐다면 추가 접종을 받아요.</p>

<h2>보호자가 지킬 것</h2>
<ul>
<li>외출할 때 <strong>목줄이나 가슴줄을 하고 길이는 2m 이내</strong>로 해요. 공동주택 실내 공용 공간에서는 안거나 줄을 짧게 잡아요.</li>
<li>맹견은 입마개 등 법에서 정한 안전 조치를 지켜요.</li>
<li>동물등록과 광견병 예방접종을 챙겨요.</li>
<li>사람을 문 사고가 나면 피해자에게 연락처를 알리고 치료에 협조해요. 법적 책임이 생길 수 있어요.</li>
</ul>

<div class="box"><span class="h">개 물림 체크리스트</span>
<ol>
<li>만지기 전 보호자에게 묻기</li>
<li>공격하면 뛰지 말고 나무처럼</li>
<li>넘어지면 웅크려 목·얼굴 보호</li>
<li>물리면 비누와 물로 충분히 씻기</li>
<li>보호자·접종 기록 확인</li>
<li>작은 상처도 진료 받기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>살짝 긁히기만 했는데 병원에 가야 하나요?</dt>
<dd>피가 나지 않는 작은 긁힘이라도 잘 씻어 주세요. 접종 여부를 모르는 개나 야생동물이라면 진료를 받아요.</dd>
<dt>고양이에게 물린 건 괜찮나요?</dt>
<dd>고양이 이빨은 가늘고 깊이 들어가 오히려 감염이 더 잘 생겨요. 손을 물렸다면 특히 진료를 받아요.</dd>
<dt>우리 개가 사람을 물었어요.</dt>
<dd>피해자의 치료를 먼저 돕고, 개의 접종 기록을 알려요. 수의사와 상담해 원인을 찾고 행동 교육을 받아요.</dd>
</dl>
