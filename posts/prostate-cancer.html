  data-title="전립선암: PSA 검사를 할지 함께 결정하기, 천천히 자라는 암의 적극적 감시, 치료 선택지"
  data-thumb="PSA|전립선 특이항원 검사"
  data-summary="전립선암은 나이가 들수록 크게 늘고, 초기에는 증상이 거의 없어요. 위험 요인, 전립선비대증과의 차이, PSA 검사의 장점과 한계, 검사 결과가 높을 때의 다음 단계, 천천히 자라는 암을 지켜보는 적극적 감시, 수술·방사선·호르몬 치료와 부작용을 정리했어요."
  data-tags="전립선암,PSA,남성암,적극적감시,질병">
<p class="lead">전립선암은 우리나라 남성에게 빠르게 늘고 있는 암이에요. 다행히 많은 경우 천천히 자라고, 일찍 발견하면 치료 결과가 좋은 편이에요. 반대로 너무 천천히 자라 평생 문제를 일으키지 않을 암까지 찾아내 치료하는 '과잉 진단'도 고민거리예요. 그래서 검사와 치료 모두 '함께 따져 보고 결정하기'가 중요한 암이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>초기 전립선암은 <strong>증상이 거의 없어요.</strong> 소변 불편은 전립선비대증 때문인 경우가 더 많아요.</li>
<li><strong>PSA 혈액 검사</strong>로 일찍 찾을 수 있지만, 과잉 진단 가능성도 있어 <strong>의사와 상의해 결정</strong>해요.</li>
<li>위험도가 낮은 암은 바로 치료하지 않고 <strong>적극적 감시</strong>를 하기도 해요.</li>
<li>치료는 <strong>수술, 방사선, 호르몬 치료</strong> 등이 있고, 소변·성기능 부작용을 함께 고려해요.</li>
</ul></div>

<h2>위험 요인</h2>
<div class="tbl"><table>
<thead><tr><th>요인</th><th>설명</th></tr></thead>
<tbody>
<tr><td>나이</td><td>50세 이후 크게 늘고, 60~70대에 많아요</td></tr>
<tr><td>가족력</td><td>아버지나 형제가 전립선암이면 위험이 높아져요. 젊은 나이에 진단받은 가족이 있으면 더 그래요</td></tr>
<tr><td>유전자 변이</td><td>BRCA2 등. 가족 중 유방암·난소암이 많다면 상담을 고려해요</td></tr>
<tr><td>생활 습관</td><td>비만, 흡연은 진행된 전립선암과 관련이 있다는 연구가 있어요</td></tr>
</tbody>
<caption>대한비뇨기종양학회, 국가암정보센터 전립선암 정보를 바탕으로 정리</caption></table></div>

<h2>증상과 전립선비대증</h2>
<p>전립선비대증은 요도를 둘러싼 안쪽이 커져 소변 줄기가 약해지고 자주 마려워요. 전립선암은 주로 바깥쪽에 생겨 <strong>초기에는 소변 증상이 거의 없어요.</strong> 진행하면 소변 불편, 혈뇨, 뼈 통증(특히 허리·골반), 체중 감소가 나타날 수 있어요. 소변 증상이 있다고 암은 아니지만, 50세 이후 비뇨의학과 진료 때 전립선 상태를 함께 확인하면 좋아요.</p>

<h2>PSA 검사, 할까 말까</h2>
<div class="tbl"><table>
<thead><tr><th>이점</th><th>한계</th></tr></thead>
<tbody>
<tr><td>피 한 번으로 간단히 검사해요</td><td>전립선비대, 염증, 사정, 자전거 타기로도 수치가 올라요</td></tr>
<tr><td>증상이 생기기 전에 암을 찾을 수 있어요</td><td>평생 문제없었을 느린 암까지 찾아 불필요한 조직검사·치료로 이어질 수 있어요</td></tr>
<tr><td>일부 연구에서 전립선암 사망을 줄였어요</td><td>수치가 정상이어도 암이 있을 수 있어요</td></tr>
</tbody>
<caption>미국 예방서비스특별위원회(USPSTF) Prostate Cancer Screening(2018), 대한비뇨의학회 자료를 바탕으로 정리. PSA 검사는 국가암검진 항목이 아니에요</caption></table></div>
<ul>
<li>미국 예방서비스특별위원회는 <strong>55~69세</strong> 남성에게 이점과 위험을 설명 듣고 <strong>스스로 결정</strong>하도록 권해요. 70세 이상은 일상적인 검사를 권하지 않아요.</li>
<li>가족력이 있다면 더 일찍(40대 중후반) 상의하기도 해요.</li>
<li>기준은 흔히 <strong>4ng/mL</strong>를 쓰지만, 나이와 전립선 크기, 변화 속도를 함께 봐요.</li>
</ul>

<h2>수치가 높게 나오면</h2>
<ol>
<li>몇 주 뒤 <strong>다시 검사</strong>해요. 염증이 원인이면 내려가요.</li>
<li>직장 수지 검사, <strong>전립선 MRI</strong>로 의심 부위를 확인해요.</li>
<li>필요하면 <strong>조직검사</strong>로 암인지, 얼마나 공격적인지(글리슨 점수) 확인해요.</li>
</ol>

<h2>치료 선택지</h2>
<div class="tbl"><table>
<thead><tr><th>치료</th><th>대상</th><th>알아 둘 점</th></tr></thead>
<tbody>
<tr><td>적극적 감시</td><td>위험도가 낮은 국한된 암</td><td>정기적인 PSA, MRI, 조직검사로 지켜보다가 진행하면 치료해요. 부작용을 피할 수 있어요</td></tr>
<tr><td>근치적 전립선 절제술</td><td>국한된 암</td><td>로봇·복강경 수술이 많아요. 요실금, 발기부전이 생길 수 있어요</td></tr>
<tr><td>방사선 치료</td><td>국한된 암, 국소 진행 암</td><td>배뇨·배변 자극 증상, 성기능 변화</td></tr>
<tr><td>호르몬(남성호르몬 차단) 치료</td><td>진행·전이된 암, 방사선과 함께</td><td>안면홍조, 근육·뼈 약화, 체중 증가, 대사 변화</td></tr>
<tr><td>항암·표적 치료 등</td><td>전이된 암</td><td>새로운 약이 늘고 있어요</td></tr>
</tbody>
<caption>대한비뇨기종양학회, 미국종합암네트워크(NCCN) 환자 가이드를 바탕으로 정리</caption></table></div>
<p>같은 병기라도 나이, 건강 상태, 무엇을 더 중요하게 여기는지에 따라 선택이 달라져요. 비뇨의학과와 방사선종양학과 의견을 함께 들어 보는 것도 좋아요.</p>

<div class="box warn"><span class="h">빨리 진료를 받아야 할 때</span>
<ul>
<li>소변에 <strong>피</strong>가 보여요.</li>
<li>허리, 골반, 엉덩이 뼈가 계속 아파요.</li>
<li>소변이 전혀 나오지 않아요.</li>
<li>다리에 힘이 빠지거나 저리고 대소변 조절이 어려워요. 척추 전이로 신경이 눌리는 응급 상황일 수 있어요.</li>
</ul></div>

<h2>생활에서 할 수 있는 것</h2>
<ul>
<li>금연, 적정 체중, 규칙적인 운동</li>
<li>채소와 과일, 통곡물 중심의 식사. 특정 식품이나 보충제로 예방된다는 근거는 부족해요.</li>
<li>호르몬 치료 중이라면 근력 운동과 뼈 건강 관리</li>
<li>치료 뒤 요실금에는 골반저근 운동이 도움이 돼요.</li>
</ul>

<div class="box"><span class="h">전립선 건강 체크리스트</span>
<ol>
<li>50세 이후 PSA 검사 여부 의사와 상의</li>
<li>가족력 있으면 더 일찍 상담</li>
<li>수치 높으면 재검·MRI부터</li>
<li>저위험 암은 적극적 감시도 선택지</li>
<li>치료 부작용까지 알고 결정</li>
<li>혈뇨·뼈 통증은 바로 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>전립선비대증이 암으로 바뀌나요?</dt>
<dd>전립선비대증이 암으로 변하는 것은 아니에요. 다만 두 병이 함께 있을 수 있어 검사로 구별해요.</dd>
<dt>적극적 감시는 치료를 포기하는 건가요?</dt>
<dd>아니에요. 느리게 자라는 암을 꼼꼼히 지켜보다가 필요할 때 치료하는 계획이에요. 불필요한 부작용을 피할 수 있어요.</dd>
<dt>토마토나 영양제가 전립선암을 막나요?</dt>
<dd>일부 관찰 연구가 있지만 예방 효과가 확실하지 않아요. 균형 잡힌 식사와 체중 관리가 더 중요해요.</dd>
</dl>
