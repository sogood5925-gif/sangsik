  data-title="구리: 적게 필요하지만 없으면 빈혈과 신경 손상, 아연 영양제와의 관계"
  data-thumb="850μg|남성 권장섭취량"
  data-summary="구리는 아주 적은 양만 필요하지만 철분 이용, 결합조직, 신경을 지키는 데 꼭 필요한 무기질이에요. 권장섭취량과 많이 든 음식, 고용량 아연 영양제를 오래 먹을 때 생기는 구리 결핍과 걸음 이상, 비만 수술 뒤 주의점, 과잉과 윌슨병을 정리했어요."
  data-tags="구리,아연,빈혈,신경병증,영양소">
<p class="lead">구리는 하루에 1mg도 안 되는 양만 있으면 되는 미량 무기질이에요. 음식에 고루 들어 있어 부족한 경우가 드물지만, <strong>아연 영양제를 고용량으로 오래 먹는 사람</strong>이나 위 수술을 받은 사람에게는 부족해질 수 있어요. 부족하면 빈혈과 함께 걸음이 불안정해지는 신경 손상이 올 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인 권장섭취량은 하루 <strong>남성 850μg, 여성 650μg</strong>이에요.</li>
<li><strong>간, 굴·조개, 견과류·씨앗, 콩, 통곡물, 초콜릿</strong>에 많아요.</li>
<li><strong>고용량 아연</strong>을 오래 먹으면 구리 흡수가 막혀 결핍이 생길 수 있어요.</li>
<li>구리 결핍은 빈혈, 백혈구 감소, <strong>다리 저림과 비틀거림</strong>으로 나타나요.</li>
</ul></div>

<h2>구리가 하는 일</h2>
<ul>
<li><strong>철분 이용:</strong> 철을 운반 가능한 형태로 바꾸는 효소(세룰로플라스민 등)에 필요해요. 구리가 부족하면 철이 있어도 빈혈이 생겨요.</li>
<li><strong>결합조직:</strong> 콜라겐과 엘라스틴을 단단히 엮는 효소를 도와 혈관, 뼈, 피부를 튼튼하게 해요.</li>
<li><strong>항산화:</strong> 활성산소를 없애는 효소(SOD)의 성분이에요.</li>
<li><strong>신경:</strong> 신경을 감싸는 수초와 신경전달물질을 만드는 데 필요해요.</li>
<li>피부와 머리카락 색소(멜라닌)를 만드는 데 쓰여요.</li>
</ul>

<h2>하루에 얼마나</h2>

<thead><tr><th>대상</th><th class="num">권장섭취량(하루)</th></tr></thead>
<tbody>
<tr><td>성인 남성(19~64세)</td><td class="num">850μg</td></tr>
<tr><td>성인 여성(19~64세)</td><td class="num">650μg</td></tr>
<tr><td>임신부 / 수유부</td><td class="num">+130μg / +480μg</td></tr>
<tr><td>상한섭취량(성인)</td><td class="num">10,000μg(10mg)</td></tr>
</tbody>
<caption>보건복지부·한국영양학회, 2020 한국인 영양소 섭취기준</caption></table></div>

<h2>많이 든 음식</h2>
<div class="tbl"><table>
<thead><tr><th>식품(1회 분량)</th><th class="num">구리(대략)</th></tr></thead>
<tbody>
<tr><td>소 간 60g</td><td class="num">약 8,000μg</td></tr>
<tr><td>굴 100g</td><td class="num">약 1,500~4,000μg</td></tr>
<tr><td>캐슈넛 30g</td><td class="num">약 600μg</td></tr>
<tr><td>해바라기씨·참깨 30g</td><td class="num">약 500~1,200μg</td></tr>
<tr><td>다크초콜릿 30g</td><td class="num">약 500μg</td></tr>
<tr><td>표고버섯(익힌 것) 1/2컵</td><td class="num">약 650μg</td></tr>
<tr><td>대두·병아리콩(익힌 것) 1/2컵</td><td class="num">약 300~400μg</td></tr>
<tr><td>현미밥 1공기</td><td class="num">약 200μg</td></tr>
</tbody>

<p>간은 구리가 아주 많아 한 번에 상한섭취량에 가까워질 수 있어요. 가끔 먹는 정도는 괜찮지만 매일 많이 먹을 음식은 아니에요.</p>

<h2>아연 영양제와 구리 결핍</h2>
<p>아연을 많이 먹으면 장 세포가 금속과 결합하는 단백질(메탈로티오네인)을 많이 만드는데, 이 단백질은 구리와 더 강하게 붙어 구리가 흡수되지 못하고 빠져나가게 해요.</p>
<div class="box warn"><span class="h">이런 사람은 구리 결핍을 의심해요</span>
<ul>
<li>면역, 피부, 탈모 목적으로 <strong>아연 보충제를 하루 수십 mg씩 몇 달 이상</strong> 먹었어요. 아연 상한섭취량은 성인 하루 35mg이에요.</li>
<li><strong>위 절제나 비만 수술</strong>을 받았어요.</li>
<li>장 흡수 장애가 있거나 오래 정맥영양을 받았어요.</li>
</ul>
<p>이런 상황에서 원인을 알 수 없는 빈혈, 백혈구 감소, <strong>발 저림과 걸음이 휘청거리는 증상</strong>이 생기면 혈중 구리를 확인해요. 비타민 B12 결핍과 증상이 비슷해 헷갈리기 쉬워요. 신경 손상은 늦게 발견하면 회복이 더딜 수 있어요.</p></div>

<h2>결핍 증상</h2>
<ul>
<li>철분제로 좋아지지 않는 <strong>빈혈</strong></li>
<li>백혈구(호중구) 감소로 감염이 잦아짐</li>
<li>손발 저림, 균형 장애, 다리 힘 빠짐(척수·말초신경 손상)</li>
<li>뼈가 약해짐, 머리카락 색이 옅어짐</li>
</ul>

<h2>과잉과 윌슨병</h2>
<ul>
<li>음식으로 구리 과잉이 생기는 경우는 드물어요.</li>
<li>보충제를 많이 먹거나 구리 성분이 많이 녹아 나온 물을 오래 마시면 구역질, 복통, 설사가 생기고, 심하면 간 손상이 올 수 있어요. 새 구리 배관에서 푸르스름한 물이 나오면 한동안 물을 흘려 보낸 뒤 써요.</li>
<li><strong>윌슨병</strong>은 구리를 몸 밖으로 내보내지 못하는 유전 질환이에요. 간 질환, 떨림, 행동 변화가 젊은 나이에 생기고, 눈의 각막 가장자리에 갈색 고리가 보이기도 해요. 평생 치료가 필요해요.</li>
</ul>

<div class="box"><span class="h">구리 체크리스트</span>
<ol>
<li>견과류·씨앗·콩·통곡물로 식사에서 채우기</li>
<li>아연 보충제는 필요할 때만, 상한 35mg 넘지 않게</li>
<li>아연을 오래 먹는다면 구리 함께 든 제품인지 확인</li>
<li>위·비만 수술 뒤에는 정기적으로 미량 원소 검사</li>
<li>원인 모를 빈혈+발 저림이면 구리 확인</li>
<li>간은 가끔, 적당히</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>구리 팔찌를 차면 관절염에 좋나요?</dt>
<dd>구리 팔찌나 자석 팔찌가 관절 통증을 줄인다는 효과는 연구에서 확인되지 않았어요.</dd>
<dt>종합비타민에 구리가 들어 있어요. 괜찮나요?</dt>
<dd>종합비타민에는 보통 권장섭취량 수준(1mg 안팎)이 들어 있어 안전해요. 아연과 구리를 함께 넣어 균형을 맞춘 제품이 많아요.</dd>
<dt>흰머리가 구리 부족 때문인가요?</dt>
<dd>대부분의 흰머리는 나이와 유전 때문이에요. 구리 결핍으로 머리카락 색이 옅어지는 경우는 드물어요. 구리 보충제로 흰머리가 검어진다는 근거는 없어요.</dd>
</dl>
