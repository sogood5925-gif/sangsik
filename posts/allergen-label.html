  data-title="식품 알레르기 표시 읽기: 표시 대상 22가지, 다른 이름으로 숨은 성분, 같은 시설 문구"
  data-thumb="22종|알레르기 표시 대상"
  data-summary="식품 알레르기가 있는 사람에게 포장지의 표시는 안전을 지키는 첫 번째 도구예요. 국내 알레르기 유발물질 표시 대상, 원재료명 속 다른 이름으로 숨은 우유·달걀·대두 성분, '같은 제조 시설' 문구의 뜻, 외식과 배달에서 확인하는 법, 사고가 났을 때 대처를 정리했어요."
  data-tags="식품알레르기,식품표시,원재료명,아나필락시스,생활정보">
<p class="lead">아주 적은 양으로도 두드러기나 숨참을 일으키는 식품 알레르기는, 음식을 고를 때마다 긴장하게 만들어요. 다행히 가공식품에는 알레르기를 일으킬 수 있는 원료를 표시하도록 정해져 있어요. 표시를 제대로 읽는 법을 알면 장보기와 외식이 훨씬 안전해져요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>국내 가공식품은 <strong>알레르기 유발물질 22가지</strong>를 들어 있으면 반드시 표시해야 해요.</li>
<li>알레르기 표시는 원재료명 옆이나 <strong>별도의 알레르기 표시란</strong>에 있어요. 두 곳을 모두 봐요.</li>
<li>'유청', '카제인', '난백'처럼 <strong>다른 이름</strong>으로 적힌 성분도 알아 둬요.</li>
<li>"같은 제조 시설에서 제조" 문구는 <strong>섞일 가능성</strong>을 알려 주는 주의 문구예요. 심한 알레르기라면 피해요.</li>
</ul></div>

<h2>표시 대상 22가지</h2>
<div class="tbl"><table>
<thead><tr><th>분류</th><th>표시 대상</th></tr></thead>
<tbody>
<tr><td>곡류·견과·씨앗</td><td>밀, 메밀, 대두, 땅콩, 호두, 잣</td></tr>
<tr><td>동물성 식품</td><td>알류(가금류의 알), 우유, 쇠고기, 돼지고기, 닭고기</td></tr>
<tr><td>수산물</td><td>고등어, 게, 새우, 오징어, 조개류(굴·전복·홍합 포함)</td></tr>
<tr><td>과채류</td><td>복숭아, 토마토</td></tr>
<tr><td>첨가물</td><td>아황산류(최종 제품에 이산화황으로 1kg당 10mg 이상 남은 경우)</td></tr>
</tbody>
<caption>식품의약품안전처, 「식품 등의 표시기준」 알레르기 유발물질 표시 규정을 바탕으로 정리. 조개류 속 굴·전복·홍합을 따로 세어 22가지예요. 표시 대상은 개정될 수 있어요</caption></table></div>
<p>이 목록에 없는 식품(예: 캐슈넛, 아몬드, 키위, 참깨)에 알레르기가 있다면 표시 의무가 없을 수 있어요. 원재료명 전체를 꼼꼼히 읽어야 해요.</p>

<h2>포장지 어디를 볼까</h2>
<ol>
<li><strong>알레르기 표시란:</strong> "알레르기 유발물질: 우유, 대두, 밀 함유"처럼 따로 모아 적는 칸이에요. 바탕색을 달리해 눈에 띄게 한 경우가 많아요.</li>
<li><strong>원재료명:</strong> 괄호 안의 복합원재료까지 읽어요. 예를 들어 '초콜릿(설탕, 코코아버터, 전지분유…)' 속에 우유가 숨어 있어요.</li>
<li><strong>주의 문구:</strong> 같은 제조 시설 사용 문구를 확인해요.</li>
</ol>
<p>같은 제품이라도 제조사가 원료를 바꾸면 표시가 달라져요. 늘 사던 제품도 가끔 다시 확인하는 습관이 좋아요.</p>

<h2>다른 이름으로 숨은 성분</h2>
<div class="tbl"><table>
<thead><tr><th>알레르기 원료</th><th>원재료명에 이렇게 적혀 있을 수 있어요</th></tr></thead>
<tbody>
<tr><td>우유</td><td>유청, 유청단백, 카제인, 카제인나트륨, 유당, 버터, 크림, 치즈, 전지분유, 탈지분유, 가공유크림</td></tr>
<tr><td>달걀(알류)</td><td>난백, 난황, 전란액, 알부민, 난백분</td></tr>
<tr><td>대두</td><td>대두단백, 분리대두단백, 두유, 간장, 된장, 레시틴(대두 유래), 대두유</td></tr>
<tr><td>밀</td><td>소맥분, 글루텐, 밀전분, 빵가루, 간장·된장(밀 사용 제품)</td></tr>
<tr><td>새우·게</td><td>해물 엑기스, 새우 분말, 해산물 풍미 소스</td></tr>
</tbody>
<caption>식품의약품안전처 식품 알레르기 정보, 대한천식알레르기학회 안내를 바탕으로 정리. 원료에 따라 알레르기 원인 단백질이 거의 없는 경우도 있어 개인별로 의사와 확인해요</caption></table></div>
<p>정제된 대두유처럼 단백질이 거의 제거된 원료는 대부분의 사람에게 문제가 되지 않지만, 개인차가 있어요. 무엇을 피해야 하는지는 담당 의사와 목록을 만들어 두면 좋아요.</p>

<h2>'같은 제조 시설' 문구</h2>
<p>"이 제품은 땅콩, 호두를 사용한 제품과 같은 제조 시설에서 제조하고 있습니다" 같은 문구는 기계와 공간을 함께 쓰기 때문에 <strong>아주 적은 양이 섞일 수 있다</strong>는 뜻이에요. 해당 원료가 원재료로 들어간 것은 아니지만, 소량에도 심한 반응이 오는 사람은 피하는 것이 안전해요. 반대로 이 문구가 없다고 해서 섞일 가능성이 전혀 없다는 보장은 아니에요.</p>

<h2>외식과 배달</h2>
<ul>
<li>일정 규모 이상의 프랜차이즈 휴게음식점·제과점, 어린이 기호식품 조리 판매업소 등은 알레르기 유발 원료를 매장이나 메뉴판, 누리집에 표시해야 해요. 대상 업소는 제도에 따라 달라지니 매장에 확인해요.</li>
<li>주문할 때 <strong>"○○ 알레르기가 있어요. 소스나 양념에도 들어가나요?"</strong>처럼 구체적으로 물어봐요.</li>
<li>튀김 기름, 조리 도구를 함께 쓰면서 섞이는 경우가 많아요. 튀김류는 특히 조심해요.</li>
<li>배달 앱의 메뉴 설명은 불완전할 수 있어요. 불확실하면 가게에 직접 확인해요.</li>
<li>학교 급식 식단표에도 알레르기 유발물질 번호가 표시돼요. 아이에게 번호를 알려 주세요.</li>
</ul>

<h2>알레르기가 있는 가족을 위해</h2>
<ul>
<li>진단은 의사에게 받아요. 증상 없이 혈액 검사 수치만으로 식품을 넓게 제한하면 영양이 부족해질 수 있어요.</li>
<li>심한 알레르기가 있다면 <strong>에피네프린 자가주사</strong>를 처방받아 늘 가지고 다니고, 가족과 학교·어린이집에 쓰는 법을 알려요.</li>
<li>아이 가방이나 휴대폰에 알레르기 정보를 적은 카드를 넣어 둬요.</li>
<li>해외여행 때는 현지어로 적은 알레르기 카드를 준비해요.</li>
</ul>

<div class="box warn"><span class="h">이런 증상은 바로 119</span>
<ul>
<li>먹은 뒤 몇 분~2시간 안에 <strong>숨이 차거나 쌕쌕거림</strong>, 목이 조임, 목소리 변화</li>
<li>입술·혀·얼굴이 붓고 온몸에 두드러기</li>
<li>어지러움, 쓰러짐, 반복되는 구토와 배 통증</li>
</ul>
<p>아나필락시스일 수 있어요. 자가주사가 있다면 <strong>바로 허벅지 바깥쪽에 주사</strong>하고 119를 불러요. 증상이 나아져도 몇 시간 뒤 다시 나빠질 수 있어 병원에 가요.</p></div>

<div class="box"><span class="h">장보기 체크리스트</span>
<ol>
<li>알레르기 표시란과 원재료명 둘 다 읽기</li>
<li>괄호 속 복합원재료까지 확인</li>
<li>다른 이름으로 숨은 성분 목록 지니기</li>
<li>'같은 시설' 문구는 심한 알레르기면 피하기</li>
<li>늘 사던 제품도 가끔 다시 확인</li>
<li>외식 때 소스·양념·튀김 기름까지 묻기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>'무첨가', '프리' 표시는 믿어도 되나요?</dt>
<dd>'우유 무첨가'는 우유를 넣지 않았다는 뜻이지만 같은 시설에서 섞일 가능성은 남아요. 원재료명과 주의 문구를 함께 봐요.</dd>
<dt>수입 식품도 같은 기준인가요?</dt>
<dd>국내에서 판매되는 수입 식품도 한글 표시 사항에 알레르기 유발물질을 표시해야 해요. 한글 스티커를 확인해요.</dd>
<dt>아이가 자라면 알레르기가 없어지나요?</dt>
<dd>우유, 달걀, 밀, 대두 알레르기는 자라면서 좋아지는 경우가 많고, 땅콩, 견과류, 갑각류는 오래가는 편이에요. 정기적으로 의사와 다시 평가해요. 집에서 임의로 먹여 보지 않아요.</dd>
</dl>
