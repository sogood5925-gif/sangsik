  data-title="전자레인지 용기 고르기: 넣어도 되는 것, 안 되는 것, 표시 읽는 법"
  data-thumb="PP|전자레인지용 재질"
  data-summary="배달 용기, 컵라면 용기, 유리 반찬통, 머그컵 중 어떤 것을 전자레인지에 넣어도 될까요? 용기에 적힌 표시 읽는 법, 넣으면 안 되는 그릇, 랩을 씌울 때 주의할 점, 물이 갑자기 끓어 넘치는 현상과 화상 예방법을 정리했어요."
  data-tags="전자레인지,플라스틱,용기,화상,생활정보">
<p class="lead">전자레인지는 편하지만, 그릇을 잘못 고르면 용기가 녹거나 불꽃이 튀고, 음식에 원하지 않는 성분이 옮겨 갈 수 있어요. 가장 확실한 방법은 용기에 적힌 표시를 한 번 보는 거예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>'전자레인지 사용 가능' 표시</strong>가 있는 용기만 넣어요.</li>
<li>내열 유리, 도자기(금속 장식 없는 것), 전자레인지용 폴리프로필렌(PP) 용기가 무난해요.</li>
<li>금속, 은박, 멜라민, 표시 없는 일회용 용기는 넣지 않아요.</li>
<li>물이나 우유를 데울 때는 <strong>갑자기 끓어 넘치는 현상</strong>을 조심해요.</li>
</ul></div>

<h2>넣어도 되는 것과 안 되는 것</h2>
<div class="tbl"><table>
<thead><tr><th>넣어도 돼요</th><th>넣지 않아요</th></tr></thead>
<tbody>
<tr><td>내열 유리 그릇(유리 반찬통 본체)</td><td>금속 그릇, 스테인리스 컵, 알루미늄호일, 은박 용기</td></tr>
<tr><td>금·은 테두리가 없는 도자기, 머그컵</td><td>금·은색 장식이 있는 그릇(불꽃이 튀어요)</td></tr>
<tr><td>'전자레인지용' 표시 폴리프로필렌(PP) 용기</td><td>멜라민 그릇</td></tr>
<tr><td>전자레인지용 실리콘 용기·덮개</td><td>표시 없는 일회용 플라스틱, 스티로폼(PS) 용기</td></tr>
<tr><td>전자레인지 조리용 파우치(표시된 방법대로)</td><td>종이컵, 종이 도시락 중 표시 없는 것, 신문지, 재활용 종이</td></tr>
</tbody>
<caption>식품의약품안전처, 기구 및 용기·포장 올바른 사용법을 바탕으로 정리</caption></table></div>
<p>유리 반찬통은 <strong>본체는 되지만 뚜껑은 안 되는 경우</strong>가 많아요. 플라스틱 뚜껑은 열어 두거나 빼고 데워요.</p>

<h2>용기 표시 읽는 법</h2>
<ul>
<li><strong>'전자레인지 사용 가능'</strong> 또는 전자레인지 그림 표시를 찾아요.</li>
<li><strong>재질과 내열 온도</strong>를 봐요. 예를 들어 '폴리프로필렌, 내열 온도 120°C'처럼 적혀 있어요. 기름이 많은 음식은 100°C보다 훨씬 뜨거워질 수 있어 내열 온도가 넉넉한 용기가 좋아요.</li>
<li>'식품용' 표시(식기 모양 그림 등)가 있어야 음식에 써도 되는 용기예요.</li>
</ul>

<h2>배달 용기와 컵라면 용기</h2>
<ul>
<li>배달 용기는 종류가 다양해요. 바닥에 <strong>PP와 전자레인지 가능 표시</strong>가 있으면 짧게 데울 수 있지만, 표시가 없으면 그릇에 옮겨요.</li>
<li>뚜껑은 대부분 다른 재질(PET, PS)이라 전자레인지에 넣지 않아요.</li>
<li>컵라면 용기는 제품마다 달라요. <strong>'전자레인지 조리 가능' 표시가 있는 제품</strong>만 표시된 방법대로 데우고, 없으면 끓는 물만 부어요.</li>
<li>편의점 도시락은 포장에 적힌 조리 시간과 방법을 따라요.</li>
</ul>

<h2>기름진 음식은 더 조심해요</h2>
<p>물은 100°C에서 더 오르지 않지만 기름은 훨씬 높은 온도까지 올라가요. 기름이 많은 음식(튀김, 고기 요리, 기름진 소스)을 플라스틱 용기에 오래 데우면 <strong>용기가 변형되거나 성분이 옮겨 갈 가능성</strong>이 커져요. 이런 음식은 유리나 도자기 그릇에 옮겨 데우는 게 좋아요.</p>

<div class="tbl"><table>
<thead><tr><th>음식</th><th>권장 그릇</th><th>데우는 요령</th></tr></thead>
<tbody>
<tr><td>밥, 떡</td><td>전자레인지용 PP 용기, 도자기</td><td>물을 조금 뿌리고 뚜껑을 살짝 덮어요</td></tr>
<tr><td>국, 찌개</td><td>내열 유리, 도자기 대접</td><td>중간에 한 번 저어 속까지 끓게 해요</td></tr>
<tr><td>튀김, 고기 요리</td><td>유리, 도자기 접시</td><td>플라스틱 용기에서 옮겨 데워요</td></tr>
<tr><td>우유, 물</td><td>머그컵</td><td>짧게 데우고 스푼을 넣어 두어요</td></tr>
</tbody></table></div>

<h2>랩을 씌울 때</h2>
<ul>
<li>전자레인지용 표시가 있는 랩을 써요.</li>
<li>랩이 <strong>음식에 직접 닿지 않게</strong> 그릇 위에 살짝 띄워요. 기름진 음식에 닿으면 녹을 수 있어요.</li>
<li>한쪽 귀퉁이를 조금 열어 김이 빠지게 해요. 꽉 막으면 터지거나 뜨거운 김에 화상을 입을 수 있어요.</li>
<li>랩 대신 전자레인지용 뚜껑이나 접시를 덮어도 돼요.</li>
</ul>

<div class="box warn"><span class="h">화상 조심: 갑자기 끓어 넘치는 물</span>
<p>깨끗한 컵에 물만 넣고 오래 데우면 100°C를 넘었는데도 끓지 않다가, 컵을 꺼내거나 커피 가루를 넣는 순간 <strong>한꺼번에 끓어 넘칠 수 있어요</strong>(돌비 현상). 얼굴과 손에 심한 화상을 입을 수 있어요.</p>
<ul>
<li>필요한 시간만 데우고, 너무 오래 돌리지 않아요.</li>
<li>나무 젓가락이나 전자레인지용 스푼을 넣고 데우면 기포가 생겨 예방에 도움이 돼요.</li>
<li>꺼낸 뒤 잠깐 두었다가 얼굴을 멀리 하고 꺼내요.</li>
</ul></div>

<h2>불꽃과 화재를 부르는 것</h2>
<ul>
<li>금속, 은박 포장, 금·은 테두리 그릇은 불꽃을 일으켜요.</li>
<li><strong>달걀을 껍데기째</strong> 데우면 터져요. 삶은 달걀도 데우다 터질 수 있어요.</li>
<li>밤, 소시지, 감자처럼 껍질이 있는 음식은 칼집이나 구멍을 내요.</li>
<li>음식 없이 빈 전자레인지를 돌리지 않아요.</li>
<li>불꽃이나 연기가 나면 문을 열지 말고 전원을 끄고 플러그를 뽑아요. 산소가 줄면 불이 꺼져요.</li>
</ul>

<h2>아기 우유와 이유식</h2>
<p>전자레인지는 가운데와 가장자리의 온도 차이가 커서, 겉은 미지근해도 속이 뜨거울 수 있어요. 아기 우유는 중탕으로 데우는 것을 권해요. 전자레인지를 썼다면 잘 흔들어 섞고 손목 안쪽에 떨어뜨려 온도를 확인해요.</p>

<div class="box"><span class="h">전자레인지 체크리스트</span>
<ol>
<li>용기 바닥의 '전자레인지 사용 가능' 표시 확인</li>
<li>유리 반찬통은 뚜껑 빼고 데우기</li>
<li>기름진 음식은 유리·도자기에 옮기기</li>
<li>랩은 음식에 닿지 않게, 김 빠질 틈 두기</li>
<li>물만 데울 때는 짧게, 스푼 넣기</li>
<li>금속·은박·금테 그릇은 넣지 않기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>전자레인지로 데우면 영양소가 파괴되나요?</dt>
<dd>모든 가열은 영양소를 조금씩 줄여요. 전자레인지는 조리 시간이 짧고 물을 적게 써서 오히려 수용성 비타민 손실이 적은 편이에요.</dd>
<dt>전자레인지에서 나오는 전자파는 위험하지 않나요?</dt>
<dd>전자레인지는 문과 차폐망이 전자파를 막도록 만들어져 있어요. 문이 휘거나 틈이 벌어지지 않았다면 걱정할 수준이 아니에요. 문이 손상됐다면 사용을 멈추고 수리를 받아요.</dd>
<dt>종이컵을 전자레인지에 넣어도 되나요?</dt>
<dd>종이컵은 안쪽 코팅이 뜨거운 음료를 담는 용도로 만들어졌어요. 전자레인지 사용 표시가 없다면 넣지 않는 게 좋아요.</dd>
</dl>
