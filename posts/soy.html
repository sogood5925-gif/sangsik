  data-summary="콩은 필수아미노산을 고루 갖춘 식물성 단백질이에요. 두부와 두유, 된장·청국장의 단백질 함량과 장단점, 이소플라본과 유방암에 대한 연구, 갑상선 약과 콩을 먹는 요령, 남성호르몬 걱정, 식물성 대체육을 고르는 법을 정리했어요."

<p class="lead">콩은 '밭에서 나는 소고기'라고 불릴 만큼 단백질이 풍부해요. 우리 식탁에서도 두부, 된장, 콩나물, 두유로 오래 먹어 왔지요. 그런데 콩 속 이소플라본이 여성호르몬과 비슷하다는 이야기 때문에 유방암이나 남성호르몬 걱정을 하는 사람도 있어요. 연구가 말해 주는 내용을 차분히 정리해 볼게요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>콩 단백질은 <strong>필수아미노산을 고루 갖춘</strong> 좋은 단백질이에요.</li>
<li>음식으로 먹는 콩은 <strong>유방암 위험을 높이지 않고</strong>, 아시아 연구에서는 오히려 낮은 위험과 관련됐어요.</li>
<li>갑상선 호르몬제를 먹는다면 <strong>콩 식품과 시간 간격</strong>을 두면 돼요.</li>
<li>된장·청국장은 좋은 발효식품이지만 <strong>나트륨</strong>이 많아 양을 조절해요.</li>
</ul></div>

<h2>콩 단백질의 장점</h2>
<ul>
<li>우리 몸이 만들지 못하는 <strong>필수아미노산을 모두</strong> 갖추고 있어 단백질 질이 동물성 단백질에 가까워요.</li>
<li>포화지방이 적고 식이섬유, 칼륨, 마그네슘, 엽산이 함께 들어 있어요.</li>
<li>고기 대신 콩을 먹으면 LDL 콜레스테롤이 조금 내려가요. 콩 단백질 하루 약 25g을 먹은 연구들에서 LDL이 몇 % 낮아졌어요.</li>
</ul>

<h2>콩 식품별 단백질</h2>
<div class="tbl"><table>
<thead><tr><th>식품(1회 분량)</th><th class="num">단백질(대략)</th><th>알아 둘 점</th></tr></thead>
<tbody>
<tr><td>두부 1/3모(100g)</td><td class="num">8~9g</td><td>칼슘 응고제를 쓴 두부는 칼슘도 많아요</td></tr>
<tr><td>삶은 대두 1/2컵(약 90g)</td><td class="num">약 15g</td><td>식이섬유가 많아요</td></tr>
<tr><td>풋콩(에다마메) 100g</td><td class="num">약 11g</td><td>간식으로 좋아요</td></tr>
<tr><td>두유 1팩(190mL)</td><td class="num">약 5~7g</td><td>가당 제품은 당류를 확인해요</td></tr>
<tr><td>청국장 100g</td><td class="num">약 15g</td><td>비타민 K2가 많고, 나트륨은 제품마다 달라요</td></tr>
<tr><td>된장 1큰술(약 15g)</td><td class="num">약 2g</td><td>나트륨이 약 600~700mg으로 많아요</td></tr>
<tr><td>콩나물 1줌(70g)</td><td class="num">약 2g</td><td>비타민 C가 생겨요</td></tr>

<h2>이소플라본과 유방암</h2>
<p>콩의 이소플라본은 구조가 여성호르몬(에스트로겐)과 비슷해 '식물성 에스트로겐'이라고 불려요. 그래서 유방암을 걱정하는 사람이 있지만, 연구 결과는 안심할 만해요.</p>
<ul>
<li>아시아 여성을 대상으로 한 여러 연구에서 <strong>콩을 많이 먹는 여성의 유방암 위험이 조금 낮았어요.</strong></li>
<li>유방암을 앓은 여성에서도 음식으로 먹는 콩은 재발이나 사망 위험을 높이지 않았고, 오히려 낮은 위험과 관련됐다는 연구가 있어요. 미국암학회도 콩 음식을 피할 필요가 없다고 안내해요.</li>
<li>다만 <strong>고농도 이소플라본 보충제</strong>는 음식과 달라 안전성 자료가 충분하지 않아요. 유방암 치료 중이라면 보충제는 주치의와 상의해요.</li>
</ul>

<h2>갑상선과 콩</h2>
<ul>
<li>요오드를 충분히 먹는 사람에게 콩이 갑상선 기능을 떨어뜨린다는 근거는 약해요.</li>
<li><strong>갑상선 호르몬제(레보티록신)</strong>를 먹는다면 콩 식품이 약 흡수를 줄일 수 있어요. 약은 아침 공복에 물과 먹고, 두유나 콩 식품은 몇 시간 간격을 두는 것이 좋아요. 평소 식습관을 일정하게 유지하면 의사가 용량을 맞추기 쉬워요.</li>
</ul>

<h2>남성호르몬과 생식 건강</h2>
<p>보통 식사로 먹는 콩이 남성호르몬(테스토스테론)을 낮추거나 정자 질을 떨어뜨린다는 근거는 부족해요. 여러 임상 연구를 모은 분석에서도 콩 단백질과 이소플라본이 남성호르몬 수치에 뚜렷한 영향을 주지 않았어요.</p>

<h2>된장과 청국장</h2>
<ul>
<li>발효 과정에서 소화가 쉬워지고, 청국장에는 비타민 K2와 유익균이 생겨요.</li>
<li>하지만 된장, 고추장, 쌈장은 <strong>나트륨이 많아요.</strong> 국은 건더기 위주로 먹고, 쌈장은 조금만 찍어요.</li>
<li>와파린을 먹는 사람은 청국장·낫토처럼 비타민 K가 많은 음식을 갑자기 많이 먹거나 끊지 말고 일정하게 먹어요.</li>
</ul>

<h2>식물성 대체육 고르기</h2>
<div class="box note"><span class="h">라벨에서 확인할 것</span>
<ul>
<li><strong>나트륨:</strong> 가공 과정에서 소금이 많이 들어간 제품이 많아요.</li>
<li><strong>포화지방:</strong> 코코넛유, 팜유를 넣은 제품은 포화지방이 높을 수 있어요.</li>
<li><strong>단백질 함량</strong>과 원재료(콩, 완두, 밀 글루텐)</li>
</ul>
<p>가공된 대체육보다 두부, 콩, 풋콩 같은 덜 가공된 콩 식품이 영양 면에서 더 나은 경우가 많아요.</p></div>

<h2>콩 알레르기와 소화</h2>
<ul>
<li>대두는 영유아에게 흔한 알레르기 식품이에요. 대부분 자라면서 좋아지지만, 알레르기가 있다면 가공식품 표시를 확인해요.</li>
<li>콩을 먹으면 가스가 찬다면 충분히 불려 익히고, 양을 조금씩 늘려요. 두부나 두유는 소화가 더 편한 편이에요.</li>
</ul>

<div class="box"><span class="h">콩 챙기기</span>
<ol>
<li>하루 한 끼는 두부·콩·두유로 단백질</li>
<li>잡곡밥에 콩 섞기</li>
<li>두유는 무가당 제품 고르기</li>
<li>된장·쌈장은 적게, 국은 건더기 위주</li>
<li>갑상선 약과 콩 식품은 시간 간격</li>
<li>이소플라본 고농도 보충제는 신중히</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>갱년기 증상에 콩이 도움이 되나요?</dt>
<dd>일부 연구에서 콩 이소플라본이 안면홍조를 조금 줄였지만 효과는 크지 않고 사람마다 달라요. 증상이 심하면 산부인과에서 효과가 확인된 치료를 상담해 보세요.</dd>
<dt>두유를 우유 대신 마셔도 되나요?</dt>
<dd>칼슘과 비타민 D가 강화된 두유라면 우유를 대신할 수 있어요. 강화되지 않은 두유는 칼슘이 적으니 라벨을 확인해요.</dd>
<dt>아이에게 콩 음식을 줘도 되나요?</dt>
<dd>알레르기가 없다면 두부, 콩, 두유는 좋은 단백질 공급원이에요. 영아에게 일반 두유를 분유 대신 먹이지는 않아요. 영아용 콩 분유는 의사와 상의해 써요.</dd>
</dl>
