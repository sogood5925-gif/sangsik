  data-summary="염증성 장질환은 장에 만성 염증이 생겼다 가라앉기를 반복하는 병으로, 우리나라에서도 젊은 층을 중심으로 늘고 있어요. 크론병과 궤양성 대장염의 차이, 과민성 장증후군과 구별하는 신호, 진단 과정, 단계별 약과 생물학적 제제, 좋아졌을 때도 치료를 이어 가야 하는 이유, 식사와 생활, 의료비 지원을 정리했어요."

<p class="lead">몇 주째 설사가 멈추지 않고 변에 피가 섞여요. 배가 아파 밤에 깨고, 몸무게가 빠져요. 과민성 장증후군이겠거니 하고 넘기다 대장내시경에서 염증성 장질환을 진단받는 젊은 사람이 늘고 있어요. 완치는 어렵지만, 요즘은 좋은 약이 많아 대부분 증상 없이 일상을 이어 갈 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>염증성 장질환은 <strong>크론병</strong>과 <strong>궤양성 대장염</strong>이 대표적이에요. 면역 이상으로 장에 만성 염증이 생겨요.</li>
<li><strong>혈변, 밤에 깨는 설사, 체중 감소, 빈혈, 열</strong>은 과민성 장증후군이 아닌 신호예요.</li>
<li>치료 목표는 증상뿐 아니라 <strong>장 점막의 염증까지 가라앉히는 것</strong>이에요.</li>
<li>좋아져도 <strong>약을 스스로 끊지 않아요.</strong> 재발 위험이 커져요.</li>
</ul></div>

<h2>크론병과 궤양성 대장염</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>크론병</th><th>궤양성 대장염</th></tr></thead>
<tbody>
<tr><td>생기는 곳</td><td>입에서 항문까지 어디든. 소장 끝과 대장에 흔해요</td><td>대장. 직장에서 시작해 위로 이어져요</td></tr>
<tr><td>염증 모양</td><td>군데군데 건너뛰며, 장벽 전체 층을 침범</td><td>연속적으로, 점막 위주</td></tr>
<tr><td>흔한 증상</td><td>복통, 설사, 체중 감소, <strong>치루·항문 농양</strong></td><td><strong>피와 점액이 섞인 설사</strong>, 급하게 마려움, 잔변감</td></tr>
<tr><td>합병증</td><td>장이 좁아짐, 누공, 농양</td><td>심한 출혈, 대장이 크게 부풀어 오름(독성 거대결장)</td></tr>
<tr><td>흡연</td><td>악화시켜요. 금연이 매우 중요해요</td><td>금연 뒤 악화되는 경우가 있지만 흡연을 권하지는 않아요</td></tr>
</tbody>

<h2>과민성 장증후군과 다른 점</h2>
<p>과민성 장증후군은 장에 염증이나 상처 없이 기능만 예민해진 상태예요. 반면 아래 신호가 있으면 염증성 장질환을 비롯한 다른 병을 확인해야 해요.</p>
<ul>
<li>변에 <strong>피</strong>가 섞여요.</li>
<li>설사 때문에 <strong>밤에 잠에서 깨요.</strong></li>
<li>이유 없이 <strong>체중이 줄고</strong>, 열이 나요.</li>
<li>빈혈, 혈액 검사의 염증 수치 상승</li>
<li>항문 주위에 고름이 나오거나 잘 낫지 않는 상처(치루)</li>
</ul>

<h2>진단</h2>
<p>혈액 검사와 대변 검사(칼프로텍틴 등 염증 표지), <strong>대장내시경과 조직검사</strong>, 소장을 보기 위한 CT·MR 장 촬영을 함께 해서 진단해요. 장염이나 결핵성 장염처럼 비슷해 보이는 병을 가려내는 것도 중요해요. 우리나라는 장결핵이 크론병과 비슷해 보여 구별에 신경 써요.</p>

<h2>치료</h2>
<div class="tbl"><table>
<thead><tr><th>약</th><th>역할</th></tr></thead>
<tbody>
<tr><td>5-아미노살리실산(메살라진 등)</td><td>궤양성 대장염의 기본 약. 먹는 약과 좌약·관장약</td></tr>
<tr><td>스테로이드</td><td>악화된 염증을 빨리 가라앉혀요. 오래 쓰지 않고 줄여 가요</td></tr>
<tr><td>면역조절제(아자티오프린 등)</td><td>재발을 줄이고 스테로이드를 끊을 수 있게 도와요. 혈액 검사로 부작용 확인</td></tr>
<tr><td>생물학적 제제</td><td>항TNF 제제, 베돌리주맙, 우스테키누맙 등. 중등도 이상에서 효과가 커요</td></tr>
<tr><td>먹는 표적 치료제</td><td>JAK 억제제 등 새로운 약</td></tr>
<tr><td>수술</td><td>장이 좁아지거나 천공, 약으로 조절되지 않는 경우</td></tr>
</tbody>
<caption>대한장연구학회 크론병·궤양성 대장염 진료 가이드라인을 바탕으로 정리</caption></table></div>

<div class="box warn"><span class="h">바로 병원에 연락해야 할 때</span>
<ul>
<li>하루 여러 번의 <strong>많은 혈변</strong>, 어지러움</li>
<li><strong>38°C 이상 열</strong>과 심한 복통, 배가 부풀어 올라요.</li>
<li>구토와 함께 방귀·변이 나오지 않아요(장폐색).</li>
<li>면역억제 치료 중 열, 기침, 심한 설사가 생겨요.</li>
</ul></div>

<h2>좋아져도 치료를 이어 가는 이유</h2>
<p>증상이 사라져도 장 점막에는 염증이 남아 있을 수 있어요. 이 염증이 조용히 이어지면 장이 좁아지거나 수술이 필요해질 수 있어요. 그래서 증상과 함께 내시경, 대변 검사로 <strong>점막 치유</strong>를 확인하며 약을 조절해요. 오래된 궤양성 대장염과 대장 크론병은 대장암 위험이 높아져 진단 후 대략 8년이 지나면 정기적인 대장내시경 감시를 받아요.</p>

<h2>식사와 생활</h2>
<ul>
<li>모든 사람에게 맞는 '염증성 장질환 식단'은 없어요. 악화 때 불편한 음식을 기록해 피하고, 좋아지면 다양하게 먹어요.</li>
<li>장이 좁아진 크론병은 질긴 섬유질 음식을 조심해요.</li>
<li>빈혈, 비타민 D·B12 부족, 골다공증을 정기적으로 확인해요.</li>
<li><strong>금연</strong>, 충분한 수면, 스트레스 관리</li>
<li>면역억제 치료 전 필요한 <strong>예방접종</strong>을 담당 의사와 확인해요. 생백신은 치료 중 맞으면 안 되는 경우가 있어요.</li>
<li>비스테로이드 소염진통제는 악화를 부를 수 있어 상의해요.</li>
</ul>

<div class="box note"><span class="h">의료비 지원</span>
<p>크론병과 궤양성 대장염은 확진 기준을 충족하면 건강보험 <strong>산정특례</strong>를 받아 본인부담이 크게 줄어요. 등록 방법은 진료 병원에서 안내받아요.</p></div>

<div class="box"><span class="h">염증성 장질환 체크리스트</span>
<ol>
<li>혈변·밤 설사·체중 감소는 진료</li>
<li>좋아져도 약 스스로 끊지 않기</li>
<li>금연</li>
<li>빈혈·비타민·뼈 정기 확인</li>
<li>치료 전 예방접종 확인</li>
<li>오래되면 대장내시경 감시</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>임신할 수 있나요?</dt>
<dd>병이 잘 조절된 상태에서 임신하면 대부분 건강하게 출산해요. 일부 약은 바꿔야 하니 임신 계획을 미리 담당 의사와 상의해요.</dd>
<dt>유전되나요?</dt>
<dd>가족 중에 환자가 있으면 위험이 조금 높지만, 부모가 환자라도 아이 대부분은 병이 생기지 않아요.</dd>
<dt>스트레스 때문에 생긴 병인가요?</dt>
<dd>스트레스가 원인은 아니지만 증상을 악화시킬 수 있어요. 면역, 유전, 장내 세균, 환경이 함께 작용해요.</dd>
</dl>
