<p class="lead">골다공증의 첫 증상은 대개 골절이에요. 가볍게 넘어졌을 뿐인데 손목이 부러지거나, 무거운 걸 들다가 허리뼈가 주저앉거나, 키가 몇 cm 줄어든 걸 뒤늦게 알게 돼요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>골밀도 검사의 <strong>T점수 −2.5 이하</strong>면 골다공증, −1.0~−2.5는 골감소증이에요.</li>
<li>폐경 후 여성, 70세 이상 남성, 골절 경험이 있는 사람은 <strong>골밀도 검사</strong>를 받아요.</li>
<li>치료제는 골절을 확실히 줄여요. 특히 <strong>6개월 주사제(데노수맙)는 임의로 끊으면 안 돼요.</strong></li>
<li>골절은 대부분 넘어져서 생겨요. <strong>낙상 예방</strong>이 약만큼 중요해요.</li>
</ul></div>

<h2>뼈는 평생 다시 지어진다</h2>
<p>뼈는 한 번 만들어지면 끝나는 구조물이 아니에요. 오래된 뼈를 녹이는 세포(파골세포)와 새 뼈를 만드는 세포(조골세포)가 평생 일하면서 몇 년에 걸쳐 뼈 전체를 새로 바꿔요. 젊을 때는 만드는 쪽이 더 많아서 20대 후반~30대 초반에 뼈의 양이 최고에 이르러요.</p>
<p>그 뒤로는 녹이는 쪽이 조금씩 앞서요. 특히 여성은 <strong>폐경 후 에스트로겐이 줄면서</strong> 몇 년 동안 뼈가 빠르게 줄어요. 그래서 골다공증은 폐경 후 여성에게 훨씬 흔하지만, 남성도 나이가 들면 적지 않게 생겨요.</p>

<h2>골밀도 검사 결과 읽기</h2>
<p>골밀도는 주로 <strong>이중에너지 X선 흡수법(DXA)</strong>으로 허리뼈와 엉덩이뼈(대퇴골)를 재요. 결과는 두 가지 점수로 나와요.</p>
<div class="tbl"><table>
<thead><tr><th>점수</th><th>비교 대상</th><th>쓰는 사람</th></tr></thead>
<tbody>
<tr><td>T점수</td><td>같은 성별의 젊은 성인 평균</td><td>폐경 후 여성, 50세 이상 남성</td></tr>
<tr><td>Z점수</td><td>같은 나이, 같은 성별 평균</td><td>폐경 전 여성, 50세 미만 남성, 어린이</td></tr>
</tbody></table></div>
<div class="tbl"><table>
<thead><tr><th>T점수</th><th>판정</th></tr></thead>
<tbody>
<tr><td class="num">−1.0 이상</td><td>정상</td></tr>
<tr><td class="num">−1.0 ~ −2.5 사이</td><td>골감소증</td></tr>
<tr><td class="num">−2.5 이하</td><td>골다공증</td></tr>
<tr><td class="num">−2.5 이하 + 골절</td><td>심한 골다공증</td></tr>
</tbody>
<caption>세계보건기구(WHO) 기준. 여러 부위 중 가장 낮은 점수로 판정해요.</caption></table></div>
<p>점수가 −1 낮아질 때마다 골절 위험은 대략 1.5~2배씩 커져요. 또 골밀도가 골감소증 범위라도, 가벼운 충격에 척추나 고관절이 부러졌다면 골다공증으로 보고 치료해요.</p>
<p>젊은 사람의 Z점수가 −2.0 이하로 낮다면 나이에 비해 뼈가 약하다는 뜻이라서, 다른 원인이 있는지 찾아봐야 해요.</p>

<h2>누가 검사를 받아야 할까</h2>
<ul>
<li>65세 이상 여성, 70세 이상 남성</li>
<li>폐경 후 여성과 50세 이상 남성 중 위험인자가 있는 사람</li>
<li>가벼운 충격에 뼈가 부러진 적이 있는 사람</li>
<li>스테로이드를 3개월 이상 먹었거나 먹는 사람</li>
<li>키가 예전보다 3~4cm 이상 줄었거나 등이 굽어가는 사람</li>
</ul>
<p>국가건강검진에서는 <strong>54세와 66세 여성</strong>이 골밀도 검사를 받을 수 있어요.</p>
<div class="tbl"><table>
<thead><tr><th>골다공증 위험을 높이는 것</th></tr></thead>
<tbody>
<tr><td>나이, 여성, 이른 폐경(45세 이전), 마른 체형(저체중)</td></tr>
<tr><td>부모의 고관절 골절 병력</td></tr>
<tr><td>흡연, 하루 3잔 이상의 음주</td></tr>
<tr><td>스테로이드 장기 복용, 류마티스관절염, 갑상선 기능 항진증, 부갑상선 질환</td></tr>
<tr><td>칼슘·비타민 D 부족, 운동 부족</td></tr>
<tr><td>일부 약물 (항경련제, 일부 항암 호르몬제, 위산억제제 장기 복용 등)</td></tr>
</tbody></table></div>

<h2>골절이 무서운 이유</h2>
<ul>
<li><strong>척추 압박골절:</strong> 허리뼈가 납작하게 주저앉아요. 기침이나 물건 들기처럼 가벼운 힘에도 생기고, 통증이 적어 모르고 지나가기도 해요. 키가 줄고 등이 굽는 원인이에요.</li>
<li><strong>손목 골절:</strong> 넘어질 때 손을 짚으며 생겨요. 골다공증의 첫 신호인 경우가 많아요.</li>
<li><strong>고관절 골절:</strong> 가장 심각해요. 대부분 수술이 필요하고, 오래 누워 지내면서 폐렴, 혈전 같은 합병증이 생기기 쉬워요. 고관절 골절 뒤 1년 안에 사망하는 비율이 상당히 높고, 살아도 예전처럼 걷지 못하는 경우가 많아요.</li>
</ul>
<p>한 번 골절이 생기면 <strong>다음 골절 위험이 크게 올라가요.</strong> 특히 첫 골절 후 1~2년이 가장 위험해서, 골절이 생겼다면 그때부터 적극적으로 치료해야 해요.</p>

<h2>치료제의 종류</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>작용</th><th>투여</th><th>주의할 점</th></tr></thead>
<tbody>
<tr><td>비스포스포네이트 (알렌드로네이트, 리세드로네이트, 졸레드론산 등)</td><td>뼈를 녹이는 것을 억제</td><td>주 1회·월 1회 알약, 3개월·1년 주사</td><td>먹는 약은 복용법이 까다로움</td></tr>
<tr><td>데노수맙</td><td>뼈를 녹이는 것을 강하게 억제</td><td>6개월마다 피하주사</td><td><strong>임의 중단 시 급격한 골소실</strong></td></tr>
<tr><td>선택적 에스트로겐 수용체 조절제 (랄록시펜 등)</td><td>뼈에서 에스트로겐처럼 작용</td><td>매일 알약</td><td>혈전 위험, 척추 골절 위주로 효과</td></tr>
<tr><td>테리파라타이드, 로모소주맙</td><td>새 뼈 생성을 촉진</td><td>매일·매주·매달 주사 (종류별)</td><td>골절 위험이 매우 높은 경우 사용, 기간 제한</td></tr>
<tr><td>여성호르몬</td><td>폐경 후 골소실 억제</td><td>알약, 패치</td><td>폐경 증상이 함께 있는 비교적 젊은 여성에서 고려</td></tr>
</tbody>
<caption>대한골대사학회 진료지침을 바탕으로 정리. 약 선택과 기간은 개인의 위험도에 따라 달라요.</caption></table></div>
<h3>먹는 비스포스포네이트 복용법</h3>
<ol>
<li>아침에 일어나자마자 <strong>빈속에</strong> 먹어요.</li>
<li><strong>물 한 컵(약 200mL)</strong>과 함께 먹어요. 커피, 우유, 주스, 생수 외 광천수는 흡수를 방해해요.</li>
<li>먹은 뒤 <strong>30분(약에 따라 60분) 동안 눕지 않고</strong> 아무것도 먹지 않아요. 식도에 약이 걸려 염증이 생기는 것을 막아요.</li>
</ol>
<div class="box warn"><span class="h">데노수맙 주사는 끊는 시기를 반드시 의사와 정하세요</span>
<p>데노수맙은 6개월마다 맞는 주사로 효과가 좋지만, 주사를 제때 맞지 않거나 중단하면 억눌렸던 뼈 녹이는 작용이 한꺼번에 살아나 <strong>골밀도가 빠르게 떨어지고 여러 척추가 한꺼번에 부러지는</strong> 경우가 보고돼 있어요. 중단할 때는 다른 약으로 이어가는 계획이 필요해요. 주사 날짜를 달력에 꼭 적어두세요.</p></div>
<h3>드물지만 알아둘 부작용</h3>
<p>뼈 녹이는 작용을 억제하는 약을 오래 쓰면 아주 드물게 <strong>턱뼈 괴사</strong>나 <strong>비정형 대퇴골 골절</strong>이 생길 수 있어요. 발치나 임플란트 같은 치과 치료 전에는 골다공증 약을 쓰고 있다고 알리고, 허벅지나 사타구니에 새로운 통증이 생기면 진료를 받아요. 다만 약으로 막는 골절이 이런 부작용보다 훨씬 많아서, 위험도가 높은 사람에게는 치료의 이득이 커요.</p>

<h2>약만큼 중요한 생활 관리</h2>
<ul>
<li><strong>칼슘:</strong> 음식으로 하루 700~800mg 이상, 부족하면 보충제로</li>
<li><strong>비타민 D:</strong> 혈중 농도를 확인하고 부족하면 보충</li>
<li><strong>운동:</strong> 걷기 같은 체중 부하 운동, 근력 운동, 균형 운동을 함께</li>
<li><strong>단백질:</strong> 뼈의 틀을 이루는 재료. 끼니마다 챙기기</li>
<li><strong>금연, 절주</strong></li>
</ul>

<h2>넘어지지 않는 집 만들기</h2>
<p>고관절과 손목 골절의 대부분은 넘어져서 생겨요. 집 안에서 넘어지는 경우도 많아요.</p>
<div class="box"><span class="h">낙상 예방 체크리스트</span>
<ol>
<li>바닥의 전선, 문턱, 미끄러지는 러그 정리하기</li>
<li>욕실 바닥에 미끄럼 방지 매트, 변기와 욕조 옆에 손잡이 달기</li>
<li>밤에 화장실 가는 길에 수면등 켜두기</li>
<li>계단에 난간과 밝은 조명 설치하기</li>
<li>뒤꿈치가 있고 미끄럽지 않은 실내화 신기</li>
<li>어지럼증을 일으킬 수 있는 약(수면제, 일부 혈압약 등)이 있는지 의사·약사와 확인하기</li>
<li>시력과 청력을 정기적으로 확인하기</li>
<li>한 발 서기 같은 균형 운동을 매일 하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>골다공증 약은 평생 먹어야 하나요?</dt>
<dd>비스포스포네이트는 3~5년 쓴 뒤 골절 위험이 낮아졌다면 일정 기간 쉬는 '약물 휴지기'를 두기도 해요. 약의 효과가 뼈에 남아 있기 때문이에요. 반면 데노수맙은 쉬는 방식이 맞지 않아요. 약마다 다르니 정기적으로 의사와 재평가해요.</dd>
<dt>남성도 골다공증 검사를 받아야 하나요?</dt>
<dd>네. 남성 골다공증은 덜 알려져 있지만 고관절 골절 후 사망률은 오히려 여성보다 높다는 보고가 있어요. 70세 이상이거나 위험인자가 있다면 검사를 받아요.</dd>
<dt>골감소증이면 약을 먹어야 하나요?</dt>
<dd>골감소증이라도 골절 경험이 있거나, 골절 위험 계산(FRAX 등)에서 위험이 높게 나오면 치료를 고려해요. 그렇지 않다면 칼슘, 비타민 D, 운동으로 관리하며 1~2년마다 다시 확인해요.</dd>
</dl>
