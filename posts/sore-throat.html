  data-summary="목이 아프면 항생제부터 떠올리기 쉽지만, 인후염의 대부분은 바이러스가 원인이라 저절로 좋아져요. 바이러스와 세균성 인후염을 구별하는 단서, 항생제가 필요한 경우, 집에서 통증을 덜어 주는 법, 입이 안 벌어지거나 침을 못 삼키는 응급 신호, 편도 수술을 고려하는 기준을 정리했어요."
  data-tags="인후염,편도염,목감기,항생제,질병">
<p class="lead">침을 삼킬 때마다 목이 찢어질 듯 아프면 빨리 낫게 해 주는 약을 찾게 되지요. 그런데 인후염의 대부분은 감기 바이러스가 원인이라 항생제가 듣지 않아요. 항생제가 꼭 필요한 경우를 가려내는 것, 그리고 드물지만 위험한 신호를 놓치지 않는 것이 중요해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인 인후염의 대부분은 <strong>바이러스</strong>가 원인이고 보통 <strong>일주일 안팎</strong>에 좋아져요.</li>
<li><strong>기침 없이 고열, 편도의 하얀 고름, 목 앞 림프절 통증</strong>이 있으면 세균(A군 연쇄상구균) 가능성이 커져요.</li>
<li>세균성으로 확인되면 항생제를 <strong>처방받은 기간 끝까지</strong> 먹어요.</li>
<li><strong>입이 잘 안 벌어지거나, 침을 못 삼켜 흘리거나, 숨쉬기 힘들면</strong> 바로 응급실로 가요.</li>
</ul></div>

<h2>인후염과 편도염</h2>
<p>인후염은 목구멍(인두)의 염증이고, 편도염은 목구멍 양옆의 편도에 생긴 염증이에요. 둘은 함께 오는 경우가 많아요. 목의 통증, 삼킬 때의 통증, 열, 목의 림프절이 붓는 증상이 흔해요.</p>

<h2>바이러스일까 세균일까</h2>
<div class="tbl"><table>
<thead><tr><th>단서</th><th>바이러스 쪽</th><th>세균(A군 연쇄상구균) 쪽</th></tr></thead>
<tbody>
<tr><td>기침·콧물</td><td>함께 있는 경우가 많아요</td><td>대개 없어요</td></tr>
<tr><td>열</td><td>미열~고열</td><td>38°C 이상 고열이 흔해요</td></tr>
<tr><td>편도</td><td>빨갛게 부어요</td><td>하얀 고름(삼출물)이 끼는 경우가 많아요</td></tr>
<tr><td>목 앞 림프절</td><td>약간 부을 수 있어요</td><td>붓고 누르면 아파요</td></tr>
<tr><td>나이</td><td>모든 나이</td><td>5~15세 어린이에게 특히 흔해요</td></tr>
</tbody>
<caption>센터 점수(Centor/McIsaac) 기준과 대한감염학회·미국감염학회 인두염 진료지침을 바탕으로 정리</caption></table></div>
<p>세균 쪽 단서가 여러 개 있으면 병원에서 <strong>신속 항원 검사</strong>(목에서 면봉으로 채취)로 확인할 수 있어요. 결과에 따라 항생제 필요 여부를 정해요.</p>

<h2>항생제가 필요한 경우</h2>
<ul>
<li>A군 연쇄상구균 인두염으로 확인됐거나 강하게 의심될 때 항생제를 써요. 증상 기간을 조금 줄이고, 드물지만 <strong>류마티스열</strong> 같은 합병증과 전파를 막기 위해서예요.</li>
<li>보통 페니실린 계열(아목시실린 등)을 쓰고, 알레르기가 있으면 다른 약을 써요.</li>
<li>하루이틀 만에 좋아져도 <strong>처방받은 기간을 끝까지</strong> 먹어요.</li>
<li>바이러스성 인후염에 항생제를 먹으면 효과는 없고 설사, 발진, 항생제 내성만 생길 수 있어요.</li>
</ul>

<h2>집에서 통증 덜기</h2>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>요령</th></tr></thead>
<tbody>
<tr><td>해열진통제</td><td>아세트아미노펜이나 이부프로펜 같은 소염진통제가 통증과 열을 줄여요. 용량과 간격을 지켜요</td></tr>
<tr><td>따뜻한 물·차</td><td>자주 조금씩 마셔 목을 촉촉하게 해요</td></tr>
<tr><td>소금물 가글</td><td>따뜻한 물 한 컵에 소금을 조금 넣어 가글하면 일시적으로 편해져요</td></tr>
<tr><td>목캔디, 인후 스프레이</td><td>잠깐 통증을 덜어 줘요. 어린아이는 사탕에 목이 막힐 수 있어요</td></tr>
<tr><td>휴식과 습도</td><td>충분히 자고, 실내가 건조하지 않게 해요</td></tr>
<tr><td>부드러운 음식</td><td>죽, 수프, 아이스크림처럼 삼키기 편한 음식을 먹어요</td></tr>
</tbody></table></div>
<p>담배 연기와 술은 목을 더 자극해요. 목소리를 많이 쓰는 일도 잠시 줄여요.</p>

<div class="box warn"><span class="h">바로 응급실에 가야 하는 신호</span>
<ul>
<li><strong>입이 잘 벌어지지 않아요.</strong> 한쪽 목이 특히 붓고 아파요(편도 주위 고름집 의심).</li>
<li><strong>침을 삼키지 못해 흘려요.</strong> 목소리가 입에 뜨거운 걸 문 것처럼 먹먹해요.</li>
<li><strong>숨쉬기 힘들거나</strong> 숨 쉴 때 쌕쌕·그르렁 소리가 나요(후두개염 등).</li>
<li>물도 못 마셔 소변이 거의 나오지 않아요.</li>
<li>목이 뻣뻣하고 고개를 숙이기 힘들어요.</li>
</ul></div>

<h2>이럴 때는 진료를 받아요</h2>
<ul>
<li>고열이 3일 넘게 계속되거나, 일주일이 지나도 나아지지 않아요.</li>
<li>기침 없이 고열과 편도 고름, 목 림프절 통증이 있어요.</li>
<li>피부에 오돌토돌한 붉은 발진이 번져요(성홍열 가능성).</li>
<li>한쪽 편도만 계속 커지거나, 목소리 변화가 3주 넘게 지속돼요. 이때는 이비인후과 진료가 필요해요.</li>
</ul>

<h2>전염성 단핵구증(키스병)</h2>
<p>청소년과 젊은 성인에게는 엡스타인-바 바이러스(EBV)에 의한 전염성 단핵구증이 편도염처럼 보이기도 해요. 심한 피로, 목 뒤 림프절 부종, 비장 비대가 함께 올 수 있어요. 이때 아목시실린을 먹으면 발진이 잘 생기고, 비장이 커진 동안 격한 운동을 하면 비장이 파열될 위험이 있어 진단이 중요해요.</p>

<h2>편도 수술을 고려할 때</h2>
<p>편도염이 아주 자주 반복될 때 편도 절제술을 고려해요. 흔히 쓰는 기준은 <strong>1년에 7번 이상</strong>, 또는 2년 동안 해마다 5번 이상, 또는 3년 동안 해마다 3번 이상 제대로 진단된 편도염이 있을 때예요. 편도 주위 고름집이 반복되거나, 편도가 커서 코골이와 수면무호흡이 심한 아이도 수술을 검토해요.</p>

<div class="box"><span class="h">목이 아플 때 체크리스트</span>
<ol>
<li>기침·콧물이 함께 있는지 확인</li>
<li>해열진통제는 용량 지켜 복용</li>
<li>따뜻한 물 자주, 가습, 휴식</li>
<li>기침 없는 고열·편도 고름이면 진료</li>
<li>항생제는 처방 기간 끝까지</li>
<li>입 벌리기·삼키기·숨쉬기 어려우면 응급실</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>목이 아프면 전염되나요?</dt>
<dd>바이러스성이든 세균성이든 기침과 침방울, 손을 통해 옮을 수 있어요. 세균성 인두염은 항생제를 먹기 시작하고 하루쯤 지나면 전염력이 크게 줄어요. 손을 자주 씻고 식기를 따로 써요.</dd>
<dt>편도결석은 뭔가요?</dt>
<dd>편도의 작은 구멍에 음식 찌꺼기와 세균이 뭉쳐 생긴 노란 알갱이예요. 입냄새와 이물감을 일으킬 수 있지만 대개 해롭지 않아요. 가글을 자주 하고, 불편이 심하면 이비인후과에서 제거해요.</dd>
<dt>아이 목이 아플 때 주의할 점은요?</dt>
<dd>아이는 세균성 인두염이 성인보다 흔해요. 고열과 목 통증, 배 아픔, 발진이 있으면 진료를 받아요. 침을 흘리며 앞으로 숙이고 앉아 숨을 쉬려 한다면 응급이에요.</dd>
</dl>
