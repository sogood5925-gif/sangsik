  data-title="소변 색과 거품: 연한 노란색이 좋은 신호, 빨간색·콜라색은 확인이 필요해요, 계속되는 거품과 단백뇨"
  data-thumb="연한 노랑|수분이 충분한 소변 색"
  data-summary="소변은 몸의 수분 상태와 콩팥, 간, 요로의 건강을 보여 주는 간단한 창이에요. 색깔별로 흔한 이유와 확인이 필요한 경우, 음식과 약 때문에 색이 변하는 경우, 거품이 계속될 때 단백뇨를 의심하는 이유, 냄새와 횟수의 변화, 소변 검사로 알 수 있는 것, 바로 진료가 필요한 신호를 정리했어요."
  data-tags="소변색,혈뇨,단백뇨,거품뇨,건강상식">
<p class="lead">화장실에서 무심코 본 소변 색이 평소와 다르면 덜컥 걱정이 돼요. 대부분은 물을 적게 마셨거나 먹은 음식, 약 때문이라 금방 돌아와요. 하지만 몇몇 변화는 콩팥이나 간, 방광의 병을 알려 주는 신호예요. 무엇이 괜찮고 무엇을 확인해야 하는지 나눠 볼게요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>연한 노란색</strong>이면 수분이 충분한 상태예요. 진한 노란색이면 물을 더 마셔요.</li>
<li><strong>빨간색·분홍색</strong>은 음식이나 약 때문일 수도 있지만 <strong>혈뇨</strong>일 수 있어 확인이 필요해요.</li>
<li><strong>콜라색</strong>은 간질환, 심한 근육 손상, 탈수의 신호일 수 있어요.</li>
<li>거품이 <strong>매번, 오래</strong> 남는다면 <strong>단백뇨</strong>를 확인해요.</li>
</ul></div>

<h2>색깔로 보는 소변</h2>
<div class="tbl"><table>
<thead><tr><th>색</th><th>흔한 이유</th><th>확인이 필요한 경우</th></tr></thead>
<tbody>
<tr><td>투명~연한 노랑</td><td>수분이 충분해요</td><td>하루 종일 물처럼 투명하고 소변이 매우 많으면 과음수나 당뇨·요붕증 확인</td></tr>
<tr><td>진한 노랑·호박색</td><td>물을 적게 마셨어요. 아침 첫 소변</td><td>물을 마셔도 계속 진하면 진료</td></tr>
<tr><td>형광 노랑</td><td>비타민 B2(리보플라빈)가 든 영양제</td><td>대개 걱정 없어요</td></tr>
<tr><td>주황색</td><td>탈수, 일부 약(리팜피신, 페나조피리딘)</td><td>눈·피부가 노랗고 대변 색이 옅으면 간·담도 질환</td></tr>
<tr><td>분홍·빨강</td><td>비트, 블루베리, 일부 약, 격한 운동 뒤</td><td>음식·약이 아니면 <strong>혈뇨</strong>. 통증이 없어도 진료</td></tr>
<tr><td>갈색·콜라색</td><td>심한 탈수</td><td>간질환(황달), 심한 운동 뒤 근육 손상(횡문근융해증), 콩팥염</td></tr>
<tr><td>초록·파랑</td><td>일부 약·검사용 색소, 드물게 감염</td><td>이유를 모르면 확인</td></tr>
<tr><td>뿌옇고 탁함</td><td>결정(인산염), 정액</td><td>배뇨통·냄새·열이 있으면 요로감염</td></tr>
</tbody>
<caption>대한신장학회, 대한비뇨의학회, 미국 국립보건원 메드라인플러스(MedlinePlus) Urine - abnormal color를 바탕으로 정리</caption></table></div>

<h2>혈뇨, 통증이 없어도 확인해요</h2>
<p>눈으로 보이는 혈뇨는 요로감염, 요로결석처럼 흔한 원인도 있지만, <strong>방광암, 신장암</strong>의 첫 신호일 수도 있어요. 특히 <strong>50세 이상, 흡연자</strong>에게 <strong>아프지 않은 혈뇨</strong>가 생기면 한 번 멈췄더라도 비뇨의학과에서 검사를 받아요. 건강검진 소변 검사에서 '잠혈 양성'이 나왔을 때도 재검사를 받아요.</p>

<h2>거품뇨와 단백뇨</h2>
<ul>
<li>소변을 세게 보거나 진한 소변일 때 생기는 거품은 금방 사라지고 정상이에요.</li>
<li>거품이 <strong>매번, 맥주 거품처럼 오래</strong> 남는다면 소변에 단백질이 새는 <strong>단백뇨</strong>일 수 있어요.</li>
<li>단백뇨는 콩팥 손상의 초기 신호예요. <strong>당뇨, 고혈압</strong>이 있는 사람은 증상이 없어도 1년에 한 번 소변 알부민 검사를 받는 것이 좋아요.</li>
<li>다리·눈 주변이 붓고 거품뇨가 있다면 빨리 진료를 받아요.</li>
</ul>

<h2>냄새와 횟수</h2>
<div class="tbl"><table>
<thead><tr><th>변화</th><th>생각해 볼 원인</th></tr></thead>
<tbody>
<tr><td>강한 지린내</td><td>탈수. 물을 마시면 좋아져요</td></tr>
<tr><td>독특한 냄새</td><td>아스파라거스, 커피, 마늘, 일부 영양제</td></tr>
<tr><td>고약한 냄새 + 배뇨통</td><td>요로감염</td></tr>
<tr><td>달콤하거나 과일 같은 냄새</td><td>조절되지 않는 당뇨(케톤). 갈증, 구토가 함께면 응급</td></tr>
<tr><td>자주 마려움(하루 8번 이상)</td><td>과민성 방광, 요로감염, 당뇨, 전립선비대, 카페인</td></tr>
<tr><td>밤에 2번 이상 깸</td><td>저녁 수분 과다, 전립선비대, 심부전, 수면무호흡</td></tr>
</tbody>
<caption>대한비뇨의학회, 대한배뇨장애요실금학회 자료를 바탕으로 정리</caption></table></div>

<div class="box warn"><span class="h">바로 진료가 필요한 신호</span>
<ul>
<li>소변이 <strong>콜라색</strong>이고 심한 근육통이 있어요(무리한 운동 뒤 등).</li>
<li><strong>열, 오한, 옆구리 통증</strong>과 함께 소변이 탁해요(콩팥 감염).</li>
<li>소변이 <strong>거의 나오지 않거나</strong> 전혀 나오지 않아요.</li>
<li>핏덩어리가 섞이거나 빨간 소변이 계속돼요.</li>
<li>눈과 피부가 노랗고 소변이 진한 갈색이에요.</li>
</ul></div>

<h2>소변 검사로 알 수 있는 것</h2>
<p>건강검진의 소변 검사는 요단백, 요잠혈, 요당, 백혈구 등을 확인해요. 한 번의 이상은 운동, 탈수, 생리의 영향일 수 있어 <strong>다시 검사</strong>해 봐요. 반복되면 콩팥 기능(혈액 크레아티닌·사구체여과율), 소변 알부민/크레아티닌 비, 초음파 등으로 더 확인해요.</p>

<div class="box"><span class="h">소변 점검 체크리스트</span>
<ol>
<li>연한 노란색 되게 물 마시기</li>
<li>먹은 음식·영양제·약 떠올려 보기</li>
<li>아프지 않은 혈뇨도 진료</li>
<li>계속되는 거품은 단백뇨 검사</li>
<li>당뇨·고혈압은 해마다 소변 알부민</li>
<li>콜라색·열·옆구리 통증은 바로 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>물을 얼마나 마셔야 하나요?</dt>
<dd>사람과 날씨, 활동량에 따라 달라요. 소변이 연한 노란색이면 적당하다는 좋은 신호예요. 심부전이나 콩팥병으로 수분 제한이 있다면 의사의 안내를 따라요.</dd>
<dt>아침 첫 소변이 진한 건 괜찮나요?</dt>
<dd>밤새 물을 마시지 않아 농축된 것이라 정상이에요. 낮 동안 연해지면 괜찮아요.</dd>
<dt>생리 중에 소변 검사를 했더니 잠혈이 나왔어요.</dt>
<dd>생리혈이 섞였을 수 있어요. 생리가 끝나고 며칠 뒤 다시 검사해요.</dd>
</dl>
