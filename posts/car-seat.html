  data-summary="카시트는 제대로 쓰면 교통사고에서 아이의 사망과 중상을 크게 줄여요. 나이와 몸에 맞는 카시트 단계, 뒤보기를 오래 유지하는 이유, 부스터에서 안전띠로 넘어갈 때 확인할 것, 흔들림과 끈 조임 점검법, 앞좌석과 에어백, 겨울 외투, 중고 카시트 주의점을 정리했어요."

<p class="lead">"금방 가는 거리니까", "아이가 너무 울어서" 카시트를 건너뛰는 순간이 있어요. 하지만 시속 50km 충돌에서도 아이 몸은 몸무게의 수십 배 힘으로 앞으로 튕겨 나가요. 어른 품에 안고 타면 아이를 붙잡을 수 없어요. 카시트는 거리와 상관없이 매번, 맞는 것으로, 제대로 설치해야 해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>도로교통법상 <strong>6세 미만</strong>은 카시트가 의무예요. 안전을 생각하면 <strong>키 145cm 안팎</strong>이 될 때까지 부스터가 필요해요.</li>
<li>영아는 <strong>뒤보기</strong>로 태우고, 카시트가 허용하는 키·몸무게 한도까지 <strong>가능한 오래</strong> 유지해요.</li>
<li>뒤보기 카시트는 <strong>에어백이 있는 앞좌석에 절대 두지 않아요.</strong> 아이는 뒷좌석이 안전해요.</li>
<li>설치 뒤 <strong>좌우로 흔들어 2.5cm 이상 움직이지 않는지</strong>, 끈이 꼭 맞는지 확인해요.</li>
</ul></div>

<h2>나이와 몸에 맞는 단계</h2>
<div class="tbl"><table>
<thead><tr><th>단계</th><th>대상(대략)</th><th>핵심</th></tr></thead>
<tbody>
<tr><td>뒤보기 카시트</td><td>신생아~최소 만 2세 이후까지</td><td>카시트의 뒤보기 한도(키·몸무게)에 이를 때까지 유지</td></tr>
<tr><td>앞보기 카시트(5점식 벨트)</td><td>뒤보기 한도를 넘은 뒤~유아기</td><td>하네스 한도까지 사용</td></tr>
<tr><td>부스터 시트</td><td>앞보기 한도를 넘은 뒤~키 145cm 안팎</td><td>차량 안전띠가 골반과 어깨에 제대로 걸리게 높여 줘요</td></tr>
<tr><td>안전띠만</td><td>아래 '안전띠 5단계 확인'을 통과한 뒤</td><td>13세 이하는 뒷좌석</td></tr>
</tbody>
<caption>미국소아과학회(AAP) Car Seats: Information for Families, 도로교통공단 어린이 카시트 안내를 바탕으로 정리. 나이는 참고일 뿐, 제품의 키·몸무게 한도가 기준이에요</caption></table></div>

<h2>뒤보기를 오래 유지하는 이유</h2>
<p>아기는 머리가 크고 목과 척추가 약해요. 앞에서 부딪히면 앞보기 자세에서는 머리가 앞으로 확 꺾여 목과 척수를 다칠 수 있어요. 뒤보기 자세는 등받이 전체가 충격을 받아 머리와 목, 등을 함께 받쳐 줘요. 다리가 등받이에 닿아 구부려도 괜찮아요. 다리 골절보다 목 손상이 훨씬 위험해요.</p>

<h2>설치 확인하기</h2>
<ul>
<li><strong>흔들림:</strong> 안전띠나 고정 장치(ISOFIX)가 지나가는 부분을 잡고 좌우·앞뒤로 흔들어 <strong>2.5cm 넘게 움직이지 않아야</strong> 해요.</li>
<li><strong>각도:</strong> 뒤보기 카시트는 각도 표시계에 맞춰요. 신생아는 너무 세우면 고개가 앞으로 떨어져 숨길이 좁아질 수 있어요.</li>
<li><strong>앞보기의 상단 고정끈(톱 테더):</strong> 있으면 꼭 연결해요. 머리가 앞으로 쏠리는 거리를 줄여요.</li>
<li>차량과 카시트 설명서를 함께 보고, 헷갈리면 지역의 카시트 장착 점검 서비스를 이용해요.</li>
</ul>

<h2>끈 조이기</h2>
<div class="tbl"><table>
<thead><tr><th>점검</th><th>기준</th></tr></thead>
<tbody>
<tr><td>어깨끈 높이</td><td>뒤보기는 어깨와 같거나 조금 아래, 앞보기는 어깨와 같거나 조금 위</td></tr>
<tr><td>가슴 클립</td><td>겨드랑이 높이</td></tr>
<tr><td>조임</td><td>어깨 위 끈을 손가락으로 집었을 때 <strong>주름이 잡히지 않을 만큼</strong></td></tr>
<tr><td>꼬임</td><td>끈이 꼬이지 않고 평평해야 해요</td></tr>
<tr><td>겨울 외투</td><td>두꺼운 패딩은 벗기고 태운 뒤, 끈 위에 담요나 외투를 덮어요</td></tr>
</tbody>
<caption>미국 고속도로교통안전국(NHTSA) Car Seat Safety, 미국소아과학회(AAP) 안내를 바탕으로 정리</caption></table></div>
<p>두꺼운 외투를 입힌 채 끈을 조이면 충돌 때 외투가 눌리면서 끈이 헐거워져 아이가 빠져나갈 수 있어요.</p>

<h2>부스터에서 안전띠로: 5단계 확인</h2>
<ol>
<li>엉덩이를 등받이 끝까지 붙여 앉을 수 있어요.</li>
<li>무릎이 좌석 끝에서 자연스럽게 굽혀져요.</li>
<li>어깨띠가 <strong>목이 아니라 어깨 가운데</strong>를 지나요.</li>
<li>허리띠가 <strong>배가 아니라 골반(허벅지 위)</strong>에 걸려요.</li>
<li>이 자세로 목적지까지 계속 앉아 있을 수 있어요.</li>
</ol>
<p>하나라도 안 되면 아직 부스터가 필요해요. 어깨띠를 등 뒤로 빼거나 팔 아래로 넣지 않아요.</p>

<div class="box warn"><span class="h">이것만은 하지 마세요</span>
<ul>
<li>아이를 <strong>안고 타기</strong>: 충돌 때 붙잡을 수 없고, 어른 몸에 아이가 눌릴 수 있어요.</li>
<li>에어백이 있는 <strong>앞좌석에 뒤보기 카시트</strong> 설치</li>
<li>차 안에 아이 혼자 두기: 여름에는 몇 분 만에 차 안 온도가 치솟아요.</li>
<li>카시트에서 재운 아기를 차 밖에서 오래 그대로 두기: 기울어진 자세로 오래 자면 숨길이 좁아질 수 있어요.</li>
</ul></div>

<h2>중고 카시트와 교체 시기</h2>
<ul>
<li><strong>사고를 겪은 카시트</strong>는 겉으로 멀쩡해도 교체를 권해요.</li>
<li>제조일과 사용 기한, 리콜 여부를 확인해요.</li>
<li>설명서와 부품이 모두 있는지, 국내 안전 인증 표시가 있는지 확인해요.</li>
<li>이력을 모르는 중고 카시트는 피하는 것이 좋아요.</li>
</ul>

<div class="box"><span class="h">카시트 체크리스트</span>
<ol>
<li>짧은 거리도 매번 카시트</li>
<li>뒤보기는 한도까지 오래</li>
<li>흔들어서 2.5cm 안쪽인지 확인</li>
<li>끈은 주름이 안 잡힐 만큼, 클립은 겨드랑이</li>
<li>두꺼운 외투는 벗기고 태우기</li>
<li>145cm 안팎까지 부스터, 13세 이하는 뒷좌석</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>택시나 다른 사람 차를 탈 때는요?</dt>
<dd>가볍게 들고 다닐 수 있는 카시트나 부스터를 챙기는 게 가장 안전해요. 차마다 설치 방식이 달라 미리 연습해 두면 좋아요.</dd>
<dt>아이가 카시트에서 너무 울어요.</dt>
<dd>짧은 거리부터 익숙해지게 하고, 좋아하는 장난감을 주거나 어른이 옆에 앉아요. 울어도 카시트 밖으로 꺼내지는 않아요.</dd>
<dt>카시트를 안 하면 벌칙이 있나요?</dt>
<dd>6세 미만 영유아를 카시트 없이 태우면 운전자에게 과태료가 부과돼요. 무엇보다 아이의 생명이 걸린 일이에요.</dd>
</dl>
