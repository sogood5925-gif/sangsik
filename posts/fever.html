  data-title="열이 날 때: 숫자보다 상태가 중요해요, 해열제 쓰는 법과 병원에 가야 할 신호"
  data-thumb="38°C|발열 기준"
  data-summary="열은 몸이 감염과 싸우는 과정에서 생기는 방어 반응이에요. 체온 재는 부위별 기준, 해열제를 쓰는 목적과 아세트아미노펜·이부프로펜 쓰는 법, 아이에게 아스피린을 주지 않는 이유, 미지근한 물수건과 수분 보충, 생후 3개월 미만 아기와 어른에게서 바로 진료가 필요한 신호를 정리했어요."
  data-tags="발열,해열제,아이열,열성경련,건강상식">
<p class="lead">체온계에 38.5°C가 뜨면 마음이 급해져요. 하지만 열 자체는 병이 아니라 몸이 세균과 바이러스와 싸우는 신호예요. 중요한 건 숫자가 몇 도인지보다 <strong>열이 나는 사람이 얼마나 힘들어하는지, 위험 신호가 있는지</strong>예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>보통 <strong>38°C 이상</strong>을 발열로 봐요. 재는 부위마다 정상 범위가 조금 달라요.</li>
<li>해열제는 열을 '정상으로 만들기'보다 <strong>힘들고 불편한 것을 덜어 주는</strong> 목적으로 써요.</li>
<li>아이 해열제는 <strong>나이가 아니라 체중</strong>에 맞춰, 정해진 간격을 지켜요. 아이에게 아스피린은 주지 않아요.</li>
<li><strong>생후 3개월 미만 아기의 38°C 이상</strong> 열은 바로 진료를 받아요.</li>
</ul></div>

<h2>체온 재기</h2>
<div class="tbl"><table>
<thead><tr><th>측정 부위</th><th>특징</th></tr></thead>
<tbody>
<tr><td>귀(고막 체온계)</td><td>빠르고 편해요. 귀를 뒤로 당겨 곧게 펴고 재요. 영아는 정확도가 떨어질 수 있어요</td></tr>
<tr><td>이마(비접촉·접촉식)</td><td>편하지만 주변 온도, 땀의 영향을 받아요. 높게 나오면 다른 방법으로 확인해요</td></tr>
<tr><td>입 안(혀 밑)</td><td>큰 아이와 어른에게 써요. 찬 음료를 마신 뒤 15분은 기다려요</td></tr>
<tr><td>겨드랑이</td><td>안전하지만 실제보다 낮게 나오는 편이에요</td></tr>
<tr><td>항문</td><td>영아에게 가장 정확해요. 의료진 안내에 따라 조심해서 재요</td></tr>
</tbody>
<caption>대한소아청소년과학회, 미국소아과학회(AAP) 체온 측정 안내를 바탕으로 정리</caption></table></div>
<p>하루 중에도 체온은 조금씩 변하고 저녁에 높은 편이에요. 같은 체온계로, 같은 부위에서 재야 변화를 비교하기 쉬워요.</p>

<h2>열은 왜 날까</h2>
<p>감염이 생기면 뇌의 체온 조절 중추가 기준 온도를 올려요. 몸은 새로운 기준에 맞추려고 떨고(오한), 손발 혈관을 좁혀 열을 만들어요. 열이 오를 때 춥고 떨리다가, 내릴 때 땀이 나는 이유예요. 약간 높은 체온은 면역 세포가 일하기 좋은 환경이 되기도 해요.</p>

<h2>해열제 쓰는 법</h2>
<ul>
<li><strong>아세트아미노펜</strong>과 <strong>이부프로펜</strong>이 흔히 쓰여요. 이부프로펜은 보통 생후 6개월 이상부터 써요. 아기 연령별 사용 가능 여부는 제품 설명과 의사·약사 안내를 따라요.</li>
<li>아이는 <strong>체중에 맞는 용량</strong>을 계량컵이나 주사기로 정확히 재요. 숟가락으로 대충 주지 않아요.</li>
<li>정해진 간격(아세트아미노펜 보통 4~6시간, 이부프로펜 6~8시간)과 하루 최대 횟수를 지켜요.</li>
<li>열이 조금 떨어져도 '정상 체온'이 될 때까지 계속 먹일 필요는 없어요. 아이가 편안해하고 잘 먹고 잘 놀면 충분해요.</li>
<li>두 가지 해열제를 번갈아 먹이는 방법은 헷갈려 과량 복용 위험이 있어, 의사가 권한 경우에만 해요.</li>
<li><strong>종합감기약</strong>에도 아세트아미노펜이 들어 있는 경우가 많아요. 해열제와 함께 먹으면 과량이 될 수 있어 성분을 확인해요.</li>
<li><strong>아이에게 아스피린을 주지 않아요.</strong> 바이러스 감염 때 드물지만 치명적인 라이 증후군과 관련이 있어요.</li>
</ul>

<h2>집에서 돌보기</h2>
<ul>
<li><strong>물을 자주</strong> 마시게 해요. 열이 나면 땀과 숨으로 수분을 많이 잃어요.</li>
<li>옷은 가볍게, 이불은 너무 두껍지 않게 해요. 떨고 있을 때는 잠깐 덮어 주고, 열이 오른 뒤에는 얇게.</li>
<li>물수건을 쓴다면 <strong>미지근한 물</strong>로 해요. 찬물이나 알코올 마사지는 떨림을 늘리고 알코올은 피부로 흡수될 수 있어 하지 않아요.</li>
<li>충분히 쉬게 해요.</li>
</ul>

<h2>바로 진료가 필요한 신호</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th>신호</th></tr></thead>
<tbody>
<tr><td>생후 3개월 미만</td><td><strong>38°C 이상</strong>이면 상태와 관계없이 바로 진료</td></tr>
<tr><td>아이</td><td>축 처져 깨우기 어려움, 계속 보채며 달래지지 않음, 숨쉬기 힘듦, 눌러도 없어지지 않는 붉은 점 발진, 목이 뻣뻣함, 소변이 크게 줄고 입이 마름, 경련, 열이 3일 넘게 계속</td></tr>
<tr><td>어른</td><td>의식 흐림·혼란, 심한 두통과 목 경직, 숨참, 가슴 통증, 계속되는 구토, 소변 감소, 열이 3일 넘게 계속</td></tr>
<tr><td>특별한 상황</td><td><strong>항암 치료 중</strong>, 면역억제제 복용, 비장 절제, 최근 수술, 최근 해외여행(말라리아 등) 후 열</td></tr>
</tbody>
<caption>대한소아청소년과학회, 영국 국립보건임상연구원(NICE) 5세 미만 발열 지침을 바탕으로 정리</caption></table></div>

<div class="box warn"><span class="h">열성 경련이 왔을 때</span>
<p>6개월~5세 아이는 열이 오를 때 경련을 하기도 해요. 보기에는 무섭지만 대부분 몇 분 안에 멈추고 후유증이 없어요.</p>
<ul>
<li>아이를 옆으로 눕히고 주변의 위험한 물건을 치워요.</li>
<li>입에 아무것도 넣지 않아요. 억지로 붙잡지 않아요.</li>
<li>경련 시간을 재요. <strong>5분 넘게</strong> 계속되거나, 숨쉬기 힘들어 보이거나, 깨어나지 않으면 119를 불러요.</li>
<li>처음 경련을 했다면 멈춘 뒤에도 진료를 받아요.</li>
</ul></div>

<div class="box"><span class="h">열날 때 체크리스트</span>
<ol>
<li>같은 체온계, 같은 부위로 재기</li>
<li>해열제는 체중 맞춰 정확히, 간격 지키기</li>
<li>감기약과 해열제 성분 겹침 확인</li>
<li>물 자주, 옷은 가볍게</li>
<li>3개월 미만 아기 38°C 이상은 즉시 진료</li>
<li>3일 넘는 열, 위험 신호는 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>열이 높으면 뇌가 손상되나요?</dt>
<dd>감염으로 생기는 보통의 열(41°C 미만)이 뇌를 손상시키지는 않아요. 다만 열사병처럼 몸 밖의 열로 체온이 오르는 경우는 다르고 매우 위험해요.</dd>
<dt>해열제를 먹었는데 열이 안 떨어져요.</dt>
<dd>해열제는 보통 1~2도 정도 내리고, 효과가 나타나는 데 30분~1시간 걸려요. 열이 완전히 떨어지지 않아도 아이가 편해 보이면 괜찮아요. 위험 신호가 있거나 계속 고열이면 진료를 받아요.</dd>
<dt>열이 날 때 목욕을 해도 되나요?</dt>
<dd>미지근한 물로 짧게 씻는 것은 괜찮아요. 떨고 있거나 몹시 힘들어할 때는 쉬게 해요.</dd>
</dl>
