<p class="lead">배수구가 한 번에 막히는 경우는 드물어요. 머리카락과 비누 찌꺼기, 기름이 몇 달에 걸쳐 조금씩 쌓이다가 어느 날 물이 안 내려가요. 원인을 알면 뚫기도 쉽고, 예방은 훨씬 쉬워요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>세면대·욕조는 <strong>머리카락</strong>, 싱크대는 <strong>기름</strong>, 변기는 <strong>물티슈와 휴지 뭉치</strong>가 주범이에요.</li>
<li>뚫을 때는 <strong>거름망 청소 → 뜨거운 물 → 압축기(뚫어뻥)</strong> 순서로 해 봐요.</li>
<li>배관용 세정제는 강한 염기성이에요. <strong>다른 세제와 섞지 않고</strong> 환기하며 장갑을 껴요.</li>
<li>배수구 하수구 냄새는 배관 속 <strong>물막이(봉수)</strong>가 말랐을 때 많이 나요.</li>
</ul></div>

<h2>막히는 곳과 원인</h2>
<div class="tbl"><table>
<thead><tr><th>장소</th><th>주요 원인</th><th>먼저 해 볼 것</th></tr></thead>
<tbody>
<tr><td>세면대, 욕조, 샤워 배수구</td><td>머리카락 + 비누·샴푸 찌꺼기</td><td>배수구 뚜껑과 거름망을 빼서 머리카락 걷어 내기</td></tr>
<tr><td>주방 싱크대</td><td>기름, 음식 찌꺼기, 커피 가루</td><td>뜨거운 수돗물을 한동안 흘리고 압축기 쓰기</td></tr>
<tr><td>변기</td><td>물티슈, 휴지 뭉치, 생리대, 작은 물건</td><td>변기용 압축기로 여러 번 밀고 당기기</td></tr>
<tr><td>세탁기 배수구</td><td>보풀, 머리카락, 세제 찌꺼기</td><td>배수구 거름망과 세탁기 배수 필터 청소</td></tr>
</tbody></table></div>

<h2>세면대와 욕실 배수구</h2>
<ol>
<li>배수구 뚜껑(팝업)과 거름망을 빼요. 대부분 손으로 돌리거나 들어 올리면 빠져요.</li>
<li>엉킨 머리카락을 집게나 배수구용 갈고리(플라스틱 막대)로 꺼내요.</li>
<li>세면대 아래 U자 배관(트랩)에 찌꺼기가 쌓였다면 아래에 대야를 받치고 이음새를 풀어 청소해요.</li>
<li>다시 조립하고 물을 흘려 새는 곳이 없는지 확인해요.</li>
</ol>
<p>샤워할 때 배수구에 <strong>머리카락 거름망</strong>을 두면 막힘 대부분을 막을 수 있어요.</p>

<h2>싱크대 기름 막힘</h2>
<ul>
<li>기름은 따뜻할 땐 흘러가지만 배관에서 식으면 굳어 벽에 달라붙어요.</li>
<li>프라이팬의 기름은 <strong>키친타월로 닦아 일반쓰레기</strong>로 버려요. 많이 남은 식용유는 굳히거나 흡수시켜 버리고, 지역에 따라 폐식용유 수거함을 이용해요.</li>
<li>막혔다면 뜨거운 수돗물을 몇 분 흘려 기름을 녹인 뒤 압축기를 써요.</li>
<li>집 배관이 플라스틱(PVC)이라면 <strong>펄펄 끓는 물을 한꺼번에 붓는 것</strong>은 이음새를 상하게 할 수 있어요. 뜨거운 수돗물 정도가 안전해요.</li>
</ul>
<p>베이킹소다와 식초를 부으면 거품이 나지만, 거품의 힘으로 단단한 막힘을 뚫기는 어려워요. 가벼운 냄새 제거나 평소 관리용으로 생각해요.</p>

<h2>변기 막힘</h2>
<ol>
<li>물을 더 내리지 않아요. 넘칠 수 있어요.</li>
<li>변기용 압축기(끝이 한 번 더 튀어나온 모양)를 배수구에 꼭 맞게 대요.</li>
<li>물이 압축기 고무를 덮을 정도로 있어야 잘 돼요.</li>
<li>천천히 눌렀다가 <strong>힘껏 당기는 동작</strong>을 여러 번 반복해요.</li>
<li>물이 빠지면 한 번 내려 확인해요.</li>
</ol>
<div class="box note"><span class="h">물티슈는 녹지 않아요</span>
<p>물티슈는 부직포라서 휴지처럼 물에 풀리지 않아요. '변기에 버려도 된다'고 적힌 제품도 배관과 정화조에서 뭉쳐 막힘을 일으킬 수 있어요. 물티슈, 생리대, 기저귀, 면봉, 치실은 휴지통에 버려요.</p></div>

<h2>배관용 세정제 쓸 때</h2>
<div class="box warn"><span class="h">안전하게 쓰는 법</span>
<ul>
<li>대부분 <strong>강한 염기성</strong>(수산화나트륨 등)이라 피부와 눈에 닿으면 화학 화상을 입어요. 고무장갑과 보안경을 써요.</li>
<li><strong>락스, 산성 세제와 섞지 않아요.</strong> 열이나 유독 가스가 생길 수 있어요.</li>
<li>세정제를 부은 뒤 압축기를 쓰면 약품이 튈 수 있어요. 한 가지 방법만 써요.</li>
<li>창문을 열고 환풍기를 켜요.</li>
<li>눈에 들어가면 흐르는 물에 15분 이상 씻고 진료를 받아요.</li>
</ul></div>
<p>여러 번 해도 안 되거나 여러 배수구가 동시에 막히면 공용 배관 문제일 수 있어요. 관리사무소나 전문 업체에 맡겨요.</p>

<h2>배수구에서 하수구 냄새가 날 때</h2>
<p>배수구 아래 배관은 U자나 S자로 굽어 있어 물이 조금 고여 있어요. 이 <strong>물막이(봉수)</strong>가 하수구 냄새와 벌레를 막아요.</p>
<ul>
<li>오래 안 쓴 배수구(베란다, 손님용 욕실)는 봉수가 말라 냄새가 올라와요. <strong>물을 한 컵 부어 주면</strong> 대부분 해결돼요.</li>
<li>여행 등으로 오래 비울 때는 배수구 마개를 막아 두어요.</li>
<li>배수구 트랩 부품이 빠져 있거나 깨졌다면 교체해요. 냄새 차단 트랩 부품은 철물점에서 살 수 있어요.</li>
</ul>

<h2>욕실 물때와 곰팡이</h2>
<div class="tbl"><table>
<thead><tr><th>오염</th><th>맞는 세정제</th><th>주의</th></tr></thead>
<tbody>
<tr><td>하얀 물때, 수전의 석회</td><td>구연산, 식초 같은 산성 세정제</td><td>대리석·금속 코팅이 상할 수 있어 짧게 쓰고 헹궈요</td></tr>
<tr><td>검은 곰팡이, 줄눈 얼룩</td><td>희석한 락스(염소계)</td><td>산성 세제와 절대 섞지 않고 환기해요</td></tr>
<tr><td>분홍색 물때(세균막)</td><td>중성세제로 문질러 닦기</td><td>물기가 남지 않게 말려요</td></tr>
<tr><td>비누 찌꺼기</td><td>중성·약알칼리 세제</td><td>스펀지로 닦고 헹궈요</td></tr>
</tbody>
<caption>환경부 생활화학제품 안전 사용 요령을 바탕으로 정리</caption></table></div>
<ul>
<li><strong>하얀 물때(석회)</strong>는 구연산이나 식초 같은 산성 세정제로 잘 녹아요.</li>
<li><strong>검은 곰팡이</strong>는 락스(차아염소산나트륨)를 물에 희석해 쓰고, 충분히 헹궈요.</li>
<li>산성 세정제와 락스는 <strong>절대 함께 쓰거나 연달아 쓰지 않아요.</strong> 염소 가스가 생겨요. 다른 날 쓰거나 물로 충분히 헹군 뒤 써요.</li>
<li>샤워 후 스퀴지로 벽의 물기를 밀고, 환풍기를 30분 이상 돌리면 곰팡이가 크게 줄어요.</li>
</ul>

<div class="box"><span class="h">배수구 관리 체크리스트</span>
<ol>
<li>샤워 배수구에 머리카락 거름망 두기</li>
<li>주 1회 거름망 비우기</li>
<li>프라이팬 기름은 닦아서 버리기</li>
<li>물티슈·생리대는 휴지통으로</li>
<li>안 쓰는 배수구에 가끔 물 붓기</li>
<li>락스와 산성 세제는 섞지 않기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>배수구에 작은 날파리가 생겨요.</dt>
<dd>배수구 안쪽에 낀 찌꺼기에서 번식하는 나방파리일 가능성이 커요. 거름망과 배관 입구를 솔로 닦아 찌꺼기를 없애면 줄어요. 뜨거운 수돗물을 흘려 주는 것도 도움이 돼요.</dd>
<dt>음식물 분쇄기는 써도 되나요?</dt>
<dd>인증받은 제품을 규정대로 설치하면 쓸 수 있지만, 기준에 맞지 않는 제품은 하수관 막힘과 오염을 일으켜 불법이에요. 인증 여부를 확인하고 사요.</dd>
<dt>세탁기 물이 넘쳐요.</dt>
<dd>세탁기 배수구와 세탁기 아래쪽 배수 필터에 보풀과 이물질이 쌓였을 수 있어요. 한두 달에 한 번 필터를 청소해요.</dd>
</dl>
