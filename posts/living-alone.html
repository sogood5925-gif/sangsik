  data-title="1인 가구 안전: 현관과 택배, 아플 때 도움 받을 사람, 혼자 사는 건강 관리"
  data-thumb="1명|연락할 사람 정해 두기"
  data-summary="혼자 살면 자유롭지만, 문 앞 안전과 아플 때의 대처, 식사와 마음 건강을 모두 혼자 챙겨야 해요. 현관·창문·택배로 생활이 드러나지 않게 하는 법, 지자체의 1인 가구 안심 서비스, 갑자기 아플 때를 대비한 준비, 끼니와 약 관리, 외로움이 길어질 때 도움 받을 곳을 정리했어요."

<p class="lead">우리나라 가구 셋 중 하나가 1인 가구예요. 사회 초년생부터 홀로 지내는 어르신까지 모습은 다양하지만, 공통된 걱정이 있어요. 누가 문을 두드릴 때, 밤에 갑자기 아플 때, 며칠 동안 아무와도 말하지 않았을 때예요. 혼자 사는 것이 곧 혼자 해결해야 한다는 뜻은 아니에요. 미리 연결고리를 만들어 두면 한결 든든해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>현관, 창문, 택배, 쓰레기로 <strong>혼자 산다는 정보가 드러나지 않게</strong> 해요.</li>
<li>매일 또는 며칠마다 연락을 주고받을 <strong>한 사람</strong>을 정해 두세요.</li>
<li>아플 때를 대비해 <strong>상비약, 간편식, 병원 정보, 비상 연락처</strong>를 챙겨요.</li>
<li>지자체의 <strong>1인 가구 안심 서비스</strong>와 고립 상담을 활용할 수 있어요.</li>
</ul></div>

<h2>현관과 주거 안전</h2>
<div class="tbl"><table>
<thead><tr><th>항목</th><th>이렇게 해요</th></tr></thead>
<tbody>
<tr><td>도어록</td><td>이사하면 비밀번호를 바로 바꾸고, 번호판 지문 자국을 가끔 닦아요. 누르는 손을 가려요</td></tr>
<tr><td>보조 잠금</td><td>안에 있을 때는 걸쇠나 보조 잠금장치를 걸어요</td></tr>
<tr><td>창문</td><td>저층이라면 방범창과 창문 잠금장치를 확인해요</td></tr>
<tr><td>방문자</td><td>모르는 방문자에게 문을 열지 않아요. 점검·수리 기사는 관리사무소나 회사에 확인해요</td></tr>
<tr><td>엘리베이터·공동 현관</td><td>낯선 사람과 단둘이 타는 게 불안하면 한 번 보내요. 공동 현관 비밀번호를 남에게 알려 주지 않아요</td></tr>
</tbody>
<caption>경찰청 1인 가구 범죄 예방 안내, 서울시 1인 가구 안심 종합계획 자료를 바탕으로 정리</caption></table></div>

<h2>생활이 드러나지 않게</h2>
<ul>
<li>택배 송장과 영수증의 <strong>이름, 주소, 전화번호</strong>는 지우거나 찢어서 버려요.</li>
<li>택배는 가능하면 무인 택배함, 편의점 택배 수령 서비스를 써요.</li>
<li>현관에 신발을 두 켤레 이상 두거나, 배달 요청 문구에 여러 사람이 사는 듯한 표현을 쓰는 사람도 있어요.</li>
<li>사회관계망 서비스에 집 창밖 풍경, 동네, 집을 비우는 일정을 실시간으로 올리지 않아요.</li>
<li>현관문이나 우편함에 이상한 표시가 있으면 지우고 관리사무소나 경찰에 알려요.</li>
</ul>

<h2>지자체 안심 서비스</h2>
<p>여러 지자체가 1인 가구를 위해 아래와 같은 서비스를 운영해요. 이름과 내용, 대상은 지역마다 다르고 자주 바뀌어요. 거주지 구청·주민센터 누리집에서 '1인 가구'로 찾아보세요.</p>
<ul>
<li>현관 안심 카메라, 문 열림 감지기 같은 안전 장비 지원</li>
<li>늦은 밤 귀갓길을 함께 걷는 안심 귀가 동행</li>
<li>혼자 사는 어르신의 안부 확인(전화, 방문, 움직임 감지기)</li>
<li>1인 가구 모임, 함께 요리하기, 병원 동행 서비스</li>
</ul>

<h2>갑자기 아플 때를 대비해</h2>
<div class="tbl"><table>
<thead><tr><th>준비</th><th>내용</th></tr></thead>
<tbody>
<tr><td>비상 연락처</td><td>가까이 사는 지인 1~2명, 가족. 휴대폰 잠금화면 '의료 정보'에 비상 연락처와 지병을 등록해요</td></tr>
<tr><td>상비약</td><td>해열진통제, 소화제, 경구 수분 보충액, 체온계</td></tr>
<tr><td>간편식</td><td>죽, 이온음료, 즉석밥 등 아플 때 먹을 것 며칠분</td></tr>
<tr><td>병원 정보</td><td>가까운 야간·휴일 진료 기관. 응급의료포털이나 129(보건복지상담센터), 119에서 안내받을 수 있어요</td></tr>
<tr><td>열쇠</td><td>믿을 만한 사람에게 비밀번호나 여분 열쇠를 맡겨 두면 쓰러졌을 때 도움이 돼요</td></tr>
</tbody>
<caption>보건복지부 응급의료포털, 소방청 119 안내를 바탕으로 정리</caption></table></div>

<div class="box warn"><span class="h">혼자 있을 때 이런 증상이면 바로 119</span>
<ul>
<li>갑작스러운 <strong>가슴 통증</strong>, 숨이 참, 식은땀</li>
<li>한쪽 얼굴·팔다리 힘 빠짐, 말이 어눌해짐</li>
<li>의식이 흐려지거나 심한 두통</li>
</ul>
<p>혼자 있을 때는 참지 말고 먼저 119에 전화해 주소를 말하고, 가능하면 <strong>현관문을 열어 둔 채</strong> 기다려요.</p></div>

<h2>혼자 먹는 끼니</h2>
<ul>
<li>한 번에 조금씩 해 먹기 어려우면, 주말에 <strong>나눠 얼려 두는 요리</strong>를 해 두면 편해요.</li>
<li>편의점 식사도 <strong>단백질(달걀, 두부, 우유)과 채소</strong>를 하나씩 더하면 균형이 좋아져요.</li>
<li>배달 음식이 잦다면 국물은 남기고, 반찬에 채소를 더해요.</li>
<li>남은 음식은 식기 전에 작게 나눠 냉장·냉동해요.</li>
</ul>

<h2>외로움이 길어질 때</h2>
<p>며칠 동안 누구와도 말하지 않은 채 지내다 보면 잠과 식사가 흐트러지고 기분이 가라앉기 쉬워요. 정기적인 약속을 하나 만들어 보세요. 운동 모임, 도서관 강좌, 봉사처럼 <strong>같은 시간에 같은 사람들을 만나는 일</strong>이 도움이 돼요. 마음이 무겁고 힘들다면 정신건강 상담전화 <strong>1577-0199</strong>, 너무 힘든 순간에는 자살예방 상담전화 <strong>109</strong>에서 24시간 이야기를 나눌 수 있어요.</p>

<div class="box"><span class="h">1인 가구 안전 체크리스트</span>
<ol>
<li>이사 후 도어록 비밀번호 변경</li>
<li>택배 송장 지우고 버리기</li>
<li>연락 주고받을 한 사람 정하기</li>
<li>휴대폰에 의료 정보·비상 연락처 등록</li>
<li>상비약과 아플 때 먹을 간편식</li>
<li>지자체 1인 가구 서비스 확인</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>누가 문을 계속 두드리면 어떻게 하나요?</dt>
<dd>문을 열지 말고 누구인지 확인해요. 위협을 느끼면 바로 112에 신고해요. 문자로 신고할 수도 있어요(112 문자 신고).</dd>
<dt>부모님이 혼자 사세요. 무엇을 도와드리면 좋을까요?</dt>
<dd>정해진 시간에 안부 전화를 드리고, 지자체의 독거 어르신 안부 확인 서비스를 알아봐요. 집 안 미끄럼 방지와 조명도 함께 점검해요.</dd>
<dt>혼자라서 병원 가기가 망설여져요.</dt>
<dd>일부 지자체는 1인 가구 병원 동행 서비스를 운영해요. 검사 후 보호자가 필요한 시술은 미리 병원에 방법을 물어봐요.</dd>
</dl>
