  data-title="중이염과 외이염: 아이 귀앓이, 바로 항생제를 먹어야 할까"
  data-thumb="48~72시간|지켜보기 기간"
  data-summary="중이염은 아이들이 병원을 찾는 가장 흔한 이유 가운데 하나예요. 급성 중이염과 삼출성 중이염, 수영 뒤 생기는 외이염의 차이, 항생제를 바로 쓰는 경우와 2~3일 지켜보는 경우, 통증 관리, 청력 검사가 필요한 때, 귀 뒤가 붓는 응급 신호를 정리했어요."
  data-tags="중이염,외이염,귀통증,소아,질병">
<p class="lead">감기 끝에 아이가 귀를 잡아당기며 보채거나 밤에 갑자기 울어 대면 중이염을 떠올리게 돼요. 중이염은 흔하지만, 모든 경우에 항생제가 필요한 것은 아니에요. 나이와 증상의 정도에 따라 치료 방법이 달라져요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>급성 중이염</strong>은 감기 뒤 고막 안쪽에 고름이 차는 병으로, 영유아에게 흔해요.</li>
<li>증상이 가볍고 두 살이 넘은 아이 등은 <strong>2~3일 지켜보며</strong> 통증만 조절하기도 해요.</li>
<li>어린 영아, 고열·심한 통증, 양쪽 귀 모두 생긴 경우 등은 <strong>항생제</strong>를 써요.</li>
<li>귀 뒤가 붓고 빨개지거나 얼굴이 마비되면 <strong>바로 진료</strong>를 받아요.</li>
</ul></div>

<h2>귀의 구조와 중이염</h2>
<p>고막 안쪽의 공간(중이)은 <strong>이관(유스타키오관)</strong>이라는 가는 관으로 코 뒤쪽과 연결돼 있어요. 감기로 코와 이관이 붓고 막히면 중이에 액체가 고이고, 여기에 세균이나 바이러스가 자라면 급성 중이염이 돼요. 아이는 이관이 짧고 수평에 가까워 중이염이 더 잘 생겨요.</p>

<h2>종류별 특징</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>특징</th><th>주요 증상</th></tr></thead>
<tbody>
<tr><td>급성 중이염</td><td>중이에 고름이 차고 고막이 부풀어요</td><td>귀 통증, 열, 보챔, 잠을 못 잠. 고막이 터지면 고름이 흘러나와요</td></tr>
<tr><td>삼출성 중이염</td><td>염증은 가라앉았지만 액체가 남아 있어요</td><td>통증은 거의 없고, 귀가 먹먹하거나 잘 못 알아들어요</td></tr>
<tr><td>만성 중이염</td><td>고막에 구멍이 남거나 염증이 오래 반복돼요</td><td>고름이 자주 나오고 청력이 떨어져요</td></tr>
<tr><td>외이염</td><td>귓구멍 피부의 염증이에요. 수영 뒤, 귀를 자주 팔 때 잘 생겨요</td><td>귓바퀴를 당기거나 귀 앞을 누르면 아파요. 가렵고 진물이 나요</td></tr>
</tbody></table></div>

<h2>항생제를 바로 쓸까, 지켜볼까</h2>
<p>급성 중이염의 상당수는 항생제 없이도 며칠 안에 좋아져요. 그래서 국제 진료지침은 아이의 나이와 증상의 정도에 따라 치료를 나눠요.</p>
<div class="tbl"><table>
<thead><tr><th>상황</th><th>치료</th></tr></thead>
<tbody>
<tr><td>생후 6개월 미만</td><td>항생제 치료</td></tr>
<tr><td>심한 통증, 48시간 이상 지속된 통증, 39°C 이상 고열</td><td>항생제 치료</td></tr>
<tr><td>고막이 터져 고름이 나옴</td><td>항생제 치료</td></tr>
<tr><td>6~23개월, 양쪽 귀 모두</td><td>항생제 치료</td></tr>
<tr><td>6~23개월, 한쪽 귀, 증상 가벼움</td><td>항생제 또는 <strong>48~72시간 지켜보기</strong></td></tr>
<tr><td>2세 이상, 증상 가벼움</td><td>항생제 또는 <strong>48~72시간 지켜보기</strong></td></tr>
</tbody>
<caption>미국소아과학회(AAP) 급성 중이염 진료지침(2013)과 대한이과학회 소아 중이염 진료지침을 바탕으로 정리</caption></table></div>
<p>지켜보는 동안에도 통증 약은 써요. 2~3일 지나도 나아지지 않거나 오히려 심해지면 다시 진료를 받아 항생제를 시작해요. 항생제를 쓰기로 했다면 처방받은 기간을 지켜요.</p>

<h2>통증 관리</h2>
<ul>
<li>아세트아미노펜이나 이부프로펜을 나이와 체중에 맞는 용량으로 써요. 어린 아이는 약사나 의사에게 용량을 확인해요.</li>
<li>따뜻한 수건을 귀에 대 주면 편해하는 아이도 있어요.</li>
<li>잘 때 머리를 조금 높여 주면 편할 수 있어요.</li>
<li>귀에 기름이나 민간요법 약을 넣지 않아요. 고막이 터졌을 수 있어요.</li>
</ul>

<h2>삼출성 중이염과 청력</h2>
<p>급성 중이염이 나은 뒤에도 고막 안에 액체가 몇 주~몇 달 남을 수 있어요. 대부분 저절로 없어지지만, <strong>3개월 넘게 지속</strong>되거나 말이 늦고 TV 소리를 크게 하는 등 잘 못 듣는 것 같으면 <strong>청력 검사</strong>를 받아요. 오래 지속되면서 청력이 떨어지면 고막에 작은 환기관을 넣는 시술을 고려해요.</p>
<p>성인에게 한쪽 귀만 먹먹한 삼출성 중이염이 오래 가면, 코 뒤쪽(비인두)에 다른 원인이 없는지 이비인후과에서 확인해요.</p>

<h2>외이염</h2>
<ul>
<li>귓구멍 피부가 젖어 있거나, 면봉·귀이개로 긁혀 상처가 났을 때 잘 생겨요.</li>
<li>항생제 귀약(점이액)으로 치료하는 경우가 많아요. 먹는 항생제가 필요한 경우는 적어요.</li>
<li>수영 뒤에는 고개를 기울여 물을 빼고, 드라이어의 약한 바람을 멀리서 쐬어 말려요.</li>
<li>면봉으로 귀를 파지 않아요.</li>
</ul>

<div class="box warn"><span class="h">바로 진료가 필요한 신호</span>
<ul>
<li><strong>귀 뒤가 붓고 빨개지며</strong> 귓바퀴가 앞으로 밀려 나와요(유양돌기염).</li>
<li>얼굴 한쪽이 처지거나 눈이 잘 감기지 않아요(안면신경 마비).</li>
<li>심한 두통, 목이 뻣뻣함, 처짐, 경련이 있어요.</li>
<li>심한 어지러움으로 걷기 힘들어요.</li>
<li>당뇨가 있는 어르신의 외이염에서 통증이 심해지고 진물이 계속 나와요.</li>
</ul></div>

<h2>예방</h2>
<ul>
<li><strong>간접흡연을 피해요.</strong> 담배 연기는 중이염 위험을 높여요.</li>
<li>폐렴구균과 독감 예방접종을 일정에 맞게 받아요.</li>
<li>아기에게 누운 채로 젖병을 물려 재우지 않아요.</li>
<li>손을 자주 씻어 감기를 줄여요.</li>
<li>모유 수유는 영아기 중이염을 줄이는 데 도움이 돼요.</li>
</ul>

<div class="box"><span class="h">아이 귀앓이 체크리스트</span>
<ol>
<li>나이, 열, 통증 정도, 한쪽·양쪽 확인</li>
<li>통증 약은 체중에 맞는 용량으로</li>
<li>지켜보기로 했다면 2~3일 뒤 재평가</li>
<li>항생제는 처방 기간 끝까지</li>
<li>나은 뒤 먹먹함 3개월 넘으면 청력 검사</li>
<li>귀 뒤 부종·얼굴 마비는 즉시 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>중이염이 있을 때 비행기를 타도 되나요?</dt>
<dd>이관이 막혀 있으면 이착륙 때 압력 차이로 통증이 심해질 수 있어요. 급성기에는 피하는 게 좋고, 꼭 타야 한다면 이착륙 때 아기는 젖이나 젖병을 빨게 하고, 큰 아이는 물을 삼키거나 하품하게 해요.</dd>
<dt>귀에 물이 들어가면 중이염이 되나요?</dt>
<dd>고막이 정상이라면 물은 중이까지 들어가지 않아요. 목욕물은 중이염의 원인이 아니에요. 다만 귓구멍 피부가 오래 젖어 있으면 외이염이 생길 수 있어요.</dd>
<dt>고막이 터졌는데 괜찮을까요?</dt>
<dd>급성 중이염으로 생긴 작은 천공은 대부분 몇 주 안에 저절로 아물어요. 치료 후 고막이 잘 닫혔는지 확인하고, 그동안 귀에 물이 들어가지 않게 조심해요.</dd>
</dl>
