<p class="lead">과일과 채소를 씻는 이유는 두 가지예요. 표면에 남은 농약을 줄이고, 흙과 함께 묻어 온 세균을 떨어뜨리는 거예요. 실제로 식중독 위험으로 보면 두 번째가 더 중요한 경우가 많아요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>기본은 <strong>물에 담갔다가 흐르는 물로 문질러 씻기</strong>예요. 이것만으로 표면 잔류물의 상당 부분이 제거돼요.</li>
<li>베이킹소다 물이 농약 제거에 조금 더 효과적이라는 연구도 있지만, <strong>충분한 물 세척</strong>이 가장 중요해요.</li>
<li>주방 세제는 쓰지 않아요. 쓰려면 <strong>과일·채소용 '1종 세척제'</strong>만 쓰고 충분히 헹궈요.</li>
<li>과일과 채소는 <strong>먹기 직전에</strong> 씻어요. 미리 씻어두면 빨리 물러지고 상해요.</li>
</ul></div>

<h2>잔류농약, 얼마나 걱정해야 할까</h2>
<p>국내에서는 2019년부터 <strong>농약 허용물질 목록 관리제도(PLS)</strong>가 모든 농산물에 적용되고 있어요. 작물마다 사용이 허가된 농약과 잔류 기준을 정해두고, 허가되지 않은 농약은 사실상 검출되지 않아야 하는 수준(0.01mg/kg)으로 엄격하게 관리하는 제도예요.</p>
<p>식품의약품안전처와 지자체는 유통 농산물의 잔류농약을 정기적으로 검사하고, 기준을 넘은 제품은 회수하고 공개해요. 대부분의 농산물은 기준 이내로 관리되고 있어요. 그렇다고 씻지 않아도 된다는 뜻은 아니에요. 씻으면 남은 잔류물을 더 줄일 수 있고, 무엇보다 세균을 떨어뜨릴 수 있어요.</p>

<h2>세균: 생으로 먹는 채소가 더 중요하다</h2>
<p>채소는 흙과 물, 동물, 사람의 손을 거쳐 식탁에 와요. 이 과정에서 병원성 대장균, 살모넬라, 노로바이러스 같은 병원체가 묻을 수 있어요. 익혀 먹는 채소는 가열로 대부분 사라지지만, <strong>샐러드나 쌈 채소처럼 생으로 먹는 채소는 씻는 것이 거의 유일한 안전장치</strong>예요. 실제로 여러 나라에서 새싹채소, 잎채소로 인한 식중독이 반복해서 보고돼 왔어요.</p>

<h2>기본 세척법</h2>
<ol>
<li><strong>담그기:</strong> 넉넉한 물에 담가 5분 정도 두어요. 흙과 이물질이 불어나고 표면의 잔류물이 물에 녹아 나와요.</li>
<li><strong>문지르기:</strong> 흐르는 물에서 손이나 부드러운 솔로 표면을 문질러요. 문지르는 동작이 가장 많은 오염을 떨어뜨려요.</li>
<li><strong>헹구기:</strong> 흐르는 물로 두세 번 충분히 헹궈요.</li>
<li><strong>물기 빼기:</strong> 깨끗한 채반이나 샐러드 스피너로 물기를 빼요. 물기가 많으면 드레싱이 겉돌고 빨리 무를 수 있어요.</li>
</ol>

<h2>베이킹소다, 식초, 세척제는 효과가 있을까</h2>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>알려진 효과</th><th>주의</th></tr></thead>
<tbody>
<tr><td>물에 담갔다가 흐르는 물로 세척</td><td>표면 흙, 이물질, 잔류물의 상당 부분 제거</td><td>충분한 시간과 문지르기가 핵심</td></tr>
<tr><td>베이킹소다 물 (약 1% 농도)</td><td>사과 표면 일부 농약을 물보다 더 잘 제거했다는 연구가 있어요</td><td>효과를 보려면 담그는 시간이 필요해요. 반드시 물로 헹구기</td></tr>
<tr><td>식초 물</td><td>일부 세균을 줄이는 효과가 있지만 농약 제거 효과는 뚜렷하지 않아요</td><td>맛이 배고, 부드러운 과일은 식감이 변할 수 있어요</td></tr>
<tr><td>과일·채소용 1종 세척제</td><td>표면 기름기와 잔류물 제거</td><td>표시된 농도와 시간을 지키고 충분히 헹구기</td></tr>
<tr><td>일반 주방 세제</td><td>권장하지 않아요</td><td>과일·채소용이 아닌 세제는 잔여물이 남을 수 있어요</td></tr>
</tbody></table></div>
<p>정리하면 특별한 재료보다 <strong>충분히 담그고, 문지르고, 흐르는 물로 헹구는 것</strong>이 가장 중요해요. 베이킹소다를 쓴다면 보조 수단으로 생각해요.</p>

<h2>품목별 세척 요령</h2>
<div class="tbl"><table>
<thead><tr><th>품목</th><th>세척 요령</th></tr></thead>
<tbody>
<tr><td>딸기</td><td>꼭지를 떼지 않은 채 물에 잠깐 담갔다가 흐르는 물로 헹궈요. 꼭지를 먼저 떼면 그 자리로 물과 오염물이 스며들어요. 무르기 쉬우니 먹기 직전에 씻어요.</td></tr>
<tr><td>포도</td><td>송이째 물에 담가 흔들어 주고, 흐르는 물로 알알이 헹궈요. 알을 떼어 씻으면 꼭지 부분까지 깨끗해져요. 하얀 가루(과분)는 포도가 스스로 만든 천연 성분이에요.</td></tr>
<tr><td>사과, 배</td><td>껍질째 먹는다면 흐르는 물에서 손이나 솔로 꼼꼼히 문질러요. 꼭지와 꽃받침 오목한 부분을 신경 써요.</td></tr>
<tr><td>상추, 깻잎 같은 쌈 채소</td><td>겉잎 한두 장은 버리고, 한 장씩 흐르는 물에 앞뒤로 씻어요. 깻잎은 잎 표면의 잔털 사이를 문질러요.</td></tr>
<tr><td>양배추</td><td>겉잎 두세 장을 떼어내고, 안쪽 잎은 먹을 만큼 떼어 씻어요.</td></tr>
<tr><td>브로콜리</td><td>송이 부분이 아래로 가게 물에 거꾸로 담가 두면 사이사이에 낀 이물질이 빠져요. 그다음 흐르는 물로 헹궈요.</td></tr>
<tr><td>파, 부추</td><td>뿌리 쪽 흙을 먼저 떼고 흐르는 물로 한 줄기씩 헹궈요.</td></tr>
<tr><td>감자, 당근, 무</td><td>솔로 흙을 문질러 씻어요. 감자의 싹과 초록색으로 변한 부분은 도려내요.</td></tr>
<tr><td>새싹채소</td><td>따뜻하고 습한 환경에서 키워 세균이 자라기 쉬워요. 면역이 약한 사람, 임신부, 어린이는 익혀 먹는 게 안전해요.</td></tr>
</tbody></table></div>

<h2>껍질을 벗길까, 그냥 먹을까</h2>
<p>껍질을 벗기면 표면 잔류물은 확실히 줄지만, 껍질과 그 바로 아래에 많은 식이섬유와 영양소도 함께 버려요. 잘 씻은 과일은 껍질째 먹어도 괜찮아요. 걱정이 크다면 품목에 따라 선택하면 돼요. 흐르는 물로 문질러 씻기 어려운 울퉁불퉁한 표면이라면 껍질을 벗기는 것도 방법이에요.</p>

<h2>씻는 시점과 보관</h2>
<ul>
<li><strong>먹기 직전에 씻어요.</strong> 씻은 뒤 보관하면 표면 물기 때문에 곰팡이가 피거나 빨리 물러져요.</li>
<li>잎채소를 미리 손질해야 한다면 물기를 완전히 빼고 키친타월을 깐 밀폐 용기에 담아 냉장 보관해요.</li>
<li><strong>자른 과일과 채소는 바로 냉장</strong>해요. 자른 면은 세균이 자라기 쉬워요.</li>
<li>'세척 완료', '바로 드세요'라고 표시된 포장 샐러드는 다시 씻지 않아도 돼요. 오히려 주방에서 다시 오염될 수 있어요.</li>
</ul>

<h2>씻은 뒤 다시 오염되지 않게</h2>
<ul>
<li>씻기 전에 <strong>손부터</strong> 씻어요.</li>
<li>날고기를 썬 칼과 도마로 채소를 썰지 않아요. 채소를 먼저 손질하거나 도구를 나눠 써요.</li>
<li>싱크대에서 생닭이나 고기를 씻었다면 개수대를 세척한 뒤 채소를 씻어요.</li>
<li>채반과 샐러드 스피너도 사용 후 잘 씻어 말려요.</li>
</ul>

<div class="box"><span class="h">과일·채소 세척 체크리스트</span>
<ol>
<li>손 씻고 시작하기</li>
<li>물에 5분 정도 담그기</li>
<li>흐르는 물에서 손이나 솔로 문지르기</li>
<li>두세 번 헹구고 물기 빼기</li>
<li>잎채소는 겉잎 떼고 한 장씩 씻기</li>
<li>먹기 직전에 씻고, 자른 건 바로 냉장</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>유기농 채소는 안 씻어도 되나요?</dt>
<dd>유기농도 흙과 세균이 묻어 있어요. 유기 농업에서 쓰는 퇴비나 허용 자재도 있기 때문에 일반 채소와 똑같이 씻어요.</dd>
<dt>과일을 소금물에 씻으면 좋나요?</dt>
<dd>소금물이 물보다 농약을 더 잘 제거한다는 근거는 뚜렷하지 않아요. 소금이 과일에 배어 맛이 변할 수 있어요. 일반 물로 충분히 씻는 게 좋아요.</dd>
<dt>귤이나 바나나처럼 껍질을 까서 먹는 과일도 씻어야 하나요?</dt>
<dd>껍질을 깔 때 손을 통해 표면의 오염물이 과육에 묻을 수 있어요. 가볍게 흐르는 물에 헹군 뒤 까서 먹으면 더 안전해요.</dd>
</dl>
