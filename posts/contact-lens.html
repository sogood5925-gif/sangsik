  data-title="콘택트렌즈 관리: 끼고 자지 않기, 수돗물은 절대 금지, 눈이 빨갛고 아프면 바로 빼고 안과로"
  data-thumb="0방울|렌즈에 닿으면 안 되는 물"
  data-summary="콘택트렌즈는 편리하지만 관리가 소홀하면 시력을 위협하는 각막 감염이 생길 수 있어요. 렌즈 종류별 차이, 끼고 자면 위험한 이유, 수돗물·수영장 물과 가시아메바 각막염, 올바른 세척과 렌즈 케이스 관리, 미용 컬러 렌즈를 살 때 확인할 점, 바로 빼고 안과에 가야 하는 신호를 정리했어요."
  data-tags="콘택트렌즈,각막염,컬러렌즈,눈건강,건강상식">
<p class="lead">안경보다 시야가 넓고 운동할 때도 편한 콘택트렌즈는 많은 사람이 매일 쓰는 의료기기예요. 렌즈는 눈의 표면인 각막 위에 직접 얹혀 있어서, 작은 관리 습관 하나가 각막 감염이라는 큰 차이를 만들어요. 번거롭더라도 몇 가지 원칙만은 꼭 지켜 주세요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>렌즈를 <strong>끼고 자면</strong> 각막 감염 위험이 크게 올라가요. 낮잠도 마찬가지예요.</li>
<li>렌즈와 케이스는 <strong>수돗물, 생수, 침</strong>으로 헹구지 않아요. 가시아메바 감염 위험이 있어요.</li>
<li>세척액은 <strong>매번 새로</strong>, 렌즈 케이스는 <strong>1~3개월마다</strong> 바꿔요.</li>
<li><strong>눈이 빨갛고 아프며 눈부시고 흐려 보이면</strong> 렌즈를 빼고 바로 안과에 가요.</li>
</ul></div>

<h2>렌즈 종류</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>특징</th><th>관리</th></tr></thead>
<tbody>
<tr><td>1일 착용(원데이) 소프트렌즈</td><td>하루 쓰고 버려요. 위생 면에서 가장 간편해요</td><td>다시 쓰지 않아요</td></tr>
<tr><td>2주·1개월 착용 소프트렌즈</td><td>정해진 기간 동안 매일 세척하며 써요</td><td>매일 세척·소독, 교체 주기 지키기</td></tr>
<tr><td>하드렌즈(RGP)</td><td>산소가 잘 통하고 난시 교정에 좋아요. 적응 기간이 필요해요</td><td>전용 세척액, 정기 연마·교체</td></tr>
<tr><td>드림렌즈(각막 굴절 교정)</td><td>밤에 끼고 자면서 각막 모양을 바꿔 낮에 잘 보이게 해요</td><td>안과의 정기 관리가 꼭 필요해요</td></tr>
<tr><td>미용 컬러 렌즈</td><td>도수가 없어도 의료기기예요</td><td>일반 렌즈와 같은 관리</td></tr>
</tbody>
<caption>식품의약품안전처 콘택트렌즈 안전 사용 안내, 대한안과학회 자료를 바탕으로 정리</caption></table></div>

<h2>끼고 자면 안 되는 이유</h2>
<p>눈을 감으면 각막에 가는 산소가 줄고, 렌즈 아래에 세균이 머물기 쉬워요. 렌즈를 끼고 자는 사람은 그렇지 않은 사람보다 <strong>각막염 위험이 몇 배 높다</strong>는 연구가 여럿 있어요. 드림렌즈처럼 밤에 쓰도록 만든 렌즈가 아니라면 잠들기 전에 꼭 빼요.</p>

<h2>물은 렌즈의 적</h2>
<ul>
<li><strong>수돗물, 생수, 증류수</strong>로 렌즈나 케이스를 헹구지 않아요. 물속의 <strong>가시아메바</strong>가 렌즈에 붙어 각막을 파고들면 치료가 매우 어렵고 시력을 잃을 수도 있어요.</li>
<li>렌즈를 낀 채 <strong>수영, 샤워, 목욕, 사우나</strong>를 하지 않아요. 수영할 때는 도수 있는 물안경을 써요.</li>
<li>렌즈를 <strong>입에 넣어 적시지 않아요.</strong></li>
</ul>

<h2>올바른 세척과 보관</h2>
<div class="tbl"><table>
<thead><tr><th>순서</th><th>할 일</th></tr></thead>
<tbody>
<tr><td>1. 손 씻기</td><td>비누로 씻고 보풀 없는 수건으로 말려요</td></tr>
<tr><td>2. 문질러 씻기</td><td>렌즈를 손바닥에 올리고 세척액을 떨어뜨려 20초쯤 부드럽게 문질러요('문지르지 않는' 제품이라도 문지르면 더 깨끗해요)</td></tr>
<tr><td>3. 헹구기</td><td>세척액으로 헹궈요</td></tr>
<tr><td>4. 보관</td><td>케이스에 <strong>새 보존액</strong>을 채워요. 남은 액에 덧붓지 않아요</td></tr>
<tr><td>5. 케이스 관리</td><td>빈 케이스를 세척액으로 헹군 뒤 뚜껑을 열어 뒤집어 말려요. 1~3개월마다 교체</td></tr>
</tbody>
<caption>식품의약품안전처 콘택트렌즈 관리 안내, 미국 질병통제예방센터(CDC) Healthy Contact Lens Wear를 바탕으로 정리</caption></table></div>
<ul>
<li>세척액 뚜껑과 병 입구에 손가락이 닿지 않게 하고, 개봉 뒤 사용 기간을 지켜요.</li>
<li>교체 주기가 지난 렌즈는 멀쩡해 보여도 버려요.</li>
<li>렌즈를 먼저 낀 뒤 화장하고, 화장을 지우기 전에 렌즈를 빼요.</li>
</ul>

<h2>미용 컬러 렌즈를 살 때</h2>
<p>컬러 렌즈도 <strong>식약처 허가를 받은 의료기기</strong>여야 해요. 제품 포장의 허가 번호를 확인하고, 온라인 해외 직구나 출처를 알 수 없는 제품은 피해요. 국내에서는 콘택트렌즈의 온라인 판매가 법으로 제한되어 있어요. 처음 쓰거나 새 제품으로 바꿀 때는 안과에서 눈에 맞는지 확인하는 것이 좋아요. 렌즈를 친구와 바꿔 끼지 않아요.</p>

<div class="box warn"><span class="h">이럴 때는 바로 렌즈를 빼고 안과로</span>
<ul>
<li>눈이 <strong>빨갛고 아파요.</strong></li>
<li>빛이 <strong>유난히 눈부셔요.</strong></li>
<li>시력이 <strong>흐려지거나</strong> 눈물·눈곱이 많아요.</li>
<li>검은자 위에 <strong>하얀 점</strong>이 보여요.</li>
</ul>
<p>각막염은 몇 시간 사이에도 빠르게 나빠질 수 있어요. 안약을 넣고 기다리지 말고, 빼낸 렌즈와 케이스를 가져가면 원인균 검사에 도움이 돼요.</p></div>

<h2>하루 착용과 쉬어 주기</h2>
<ul>
<li>렌즈는 하루 종일보다 <strong>필요한 시간만</strong> 끼고, 집에 오면 안경으로 바꿔요.</li>
<li>눈이 건조하면 렌즈용 인공눈물을 써요. 렌즈를 뺐다 다시 끼기를 반복하지 않아요.</li>
<li>감기, 결막염 등 눈이 아플 때는 렌즈를 쉬어요.</li>
<li>렌즈를 쓰고 있다면 <strong>1년에 한 번 이상</strong> 안과 검진을 받아요.</li>
</ul>

<div class="box"><span class="h">콘택트렌즈 체크리스트</span>
<ol>
<li>끼고 자지 않기</li>
<li>물·침으로 헹구지 않기</li>
<li>보존액은 매번 새로</li>
<li>케이스는 1~3개월마다 교체</li>
<li>허가받은 제품, 교체 주기 지키기</li>
<li>빨갛고 아프면 빼고 안과</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>원데이 렌즈를 이틀 써도 되나요?</dt>
<dd>원데이 렌즈는 세척해서 다시 쓰도록 만들지 않았어요. 한 번 쓰면 버려요.</dd>
<dt>식염수로 보관해도 되나요?</dt>
<dd>식염수는 헹굼용일 뿐 소독 기능이 없어요. 보관은 소독 기능이 있는 보존액으로 해요.</dd>
<dt>아이가 렌즈를 써도 되나요?</dt>
<dd>스스로 위생 관리를 할 수 있는 나이라면 쓸 수 있어요. 드림렌즈 등은 안과에서 정기적으로 확인하며 써요.</dd>
</dl>
