  data-title="나이아신(비타민 B3): 고기와 생선으로 충분히, 고용량 보충제의 홍조와 간 손상 주의"

  data-summary="나이아신은 몸속 수백 가지 화학 반응에 쓰이는 비타민이에요. 권장섭취량과 많이 든 음식, 단백질 속 트립토판으로도 만들어지는 이유, 결핍병인 펠라그라, 콜레스테롤 약으로 쓰던 고용량 니코틴산이 지금은 권하지 않는 이유, 니코틴아마이드와 '노화 방지' 보충제의 근거를 정리했어요."

<p class="lead">나이아신은 몸에서 NAD라는 물질이 되어 에너지 대사부터 DNA 수리까지 수많은 반응에 쓰여요. 고기와 생선, 곡물에 흔해서 보통 식사로 충분히 채워지지만, 보충제로 고용량을 먹으면 얼굴이 화끈 달아오르거나 간에 부담이 될 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인 권장섭취량은 하루 <strong>남성 16mg, 여성 14mg</strong>(나이아신 당량)이에요.</li>
<li><strong>닭고기, 참치·연어, 소고기, 땅콩, 버섯</strong>에 많고, 단백질의 <strong>트립토판</strong>으로도 만들어져요.</li>
<li>보충제의 <strong>니코틴산</strong>은 하루 35mg이 상한이에요. 넘으면 홍조가 흔하고, 고용량은 간 손상 위험이 있어요.</li>
<li>콜레스테롤 치료 목적의 고용량 나이아신은 심혈관 사건을 줄이지 못해 <strong>지금은 권하지 않아요.</strong></li>
</ul></div>

<h2>나이아신의 두 얼굴</h2>
<p>나이아신은 <strong>니코틴산</strong>과 <strong>니코틴아마이드</strong>를 함께 부르는 이름이에요. 음식 속에서는 둘 다 영양소로서 같은 역할을 하지만, 고용량 보충제로 먹을 때는 효과와 부작용이 달라요. 이름은 비슷하지만 담배의 니코틴과는 다른 물질이에요.</p>

<h2>하루에 얼마나</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th class="num">권장섭취량(하루)</th></tr></thead>
<tbody>
<tr><td>성인 남성(19~64세)</td><td class="num">16mg NE</td></tr>
<tr><td>성인 여성(19~64세)</td><td class="num">14mg NE</td></tr>
<tr><td>임신부 / 수유부</td><td class="num">+4mg / +3mg NE</td></tr>
<tr><td>상한섭취량(성인, 보충제·강화식품)</td><td class="num">니코틴산 35mg / 니코틴아마이드 1,000mg</td></tr>
</tbody>
<caption>보건복지부·한국영양학회, 2020 한국인 영양소 섭취기준. NE는 나이아신 당량(트립토판 60mg ≒ 나이아신 1mg)</caption></table></div>

<h2>많이 든 음식</h2>
<div class="tbl"><table>
<thead><tr><th>식품(1회 분량)</th><th class="num">나이아신(대략)</th></tr></thead>
<tbody>
<tr><td>닭가슴살 100g(익힌 것)</td><td class="num">약 12mg</td></tr>
<tr><td>참치 통조림 100g</td><td class="num">약 10~13mg</td></tr>
<tr><td>연어 100g</td><td class="num">약 8mg</td></tr>
<tr><td>소고기 100g</td><td class="num">약 5~7mg</td></tr>
<tr><td>땅콩 30g</td><td class="num">약 4mg</td></tr>
<tr><td>표고·양송이버섯 100g</td><td class="num">약 3~4mg</td></tr>
<tr><td>현미밥 1공기</td><td class="num">약 3mg</td></tr>
</tbody>

<p>여기에 단백질 속 트립토판으로 몸이 직접 만드는 양까지 더해져요. 고기, 생선, 달걀, 우유, 콩을 적당히 먹으면 부족하기 어려워요.</p>

<h2>결핍병: 펠라그라</h2>
<p>나이아신이 심하게 부족하면 <strong>펠라그라</strong>가 생겨요. 흔히 세 가지 'D'로 기억해요.</p>
<ul>
<li><strong>피부염(Dermatitis):</strong> 햇빛에 드러나는 목, 손등, 얼굴에 대칭으로 붉고 거친 피부염</li>
<li><strong>설사(Diarrhea):</strong> 소화 장애, 혀와 입안의 염증</li>
<li><strong>치매(Dementia):</strong> 우울, 혼란, 기억력 저하</li>
</ul>
<p>지금은 드물지만 <strong>과음</strong>, 심한 편식이나 거식, 흡수 장애, 일부 약(결핵약 아이소니아지드 등)을 오래 먹는 경우에 생길 수 있어요.</p>

<h2>고용량 니코틴산과 콜레스테롤</h2>
<p>하루 1,000~2,000mg이 넘는 니코틴산은 한때 좋은 콜레스테롤(HDL)을 올리고 중성지방을 낮추는 약으로 쓰였어요. 그런데 스타틴과 함께 쓴 대규모 연구(AIM-HIGH, HPS2-THRIVE)에서 <strong>심근경색이나 뇌졸중을 줄이지 못했고</strong>, 오히려 당뇨 악화, 감염, 출혈 같은 부작용이 늘었어요. 그래서 지금은 콜레스테롤 관리 목적으로 권하지 않아요.</p>

<h2>부작용: 홍조와 간</h2>
<div class="box warn"><span class="h">니코틴산 보충제를 먹는다면</span>
<ul>
<li><strong>홍조:</strong> 30~50mg 정도에서도 얼굴과 목이 붉어지고 화끈거리며 가려울 수 있어요. 대개 1시간 안에 가라앉아요.</li>
<li><strong>간 손상:</strong> 고용량, 특히 서방형(천천히 녹는) 제품에서 간 수치가 오르고 드물게 심한 간 손상이 생겼어요.</li>
<li>혈당 상승, 요산 상승(통풍 악화), 위장 장애</li>
<li>'홍조 없는(no-flush)' 나이아신으로 팔리는 제품(이노시톨 헥사니코티네이트)은 흡수되는 양이 적어 효과도 불확실해요.</li>
</ul>
<p>간 질환, 통풍, 당뇨, 위궤양이 있다면 고용량 보충제를 먹기 전에 의사와 상의해요.</p></div>

<h2>니코틴아마이드와 '노화 방지' 제품</h2>
<ul>
<li><strong>니코틴아마이드</strong>는 홍조가 거의 없어요. 피부암 병력이 있는 고위험군에서 하루 500mg 두 번 복용이 새로운 비흑색종 피부암을 줄였다는 연구가 있어, 피부과 의사와 상의해 쓰는 경우가 있어요.</li>
<li>NMN, NR처럼 NAD를 늘린다는 <strong>'노화 방지' 보충제</strong>는 사람에게서 수명이나 질병 예방 효과가 아직 확인되지 않았어요. 가격 대비 기대 효과를 신중히 따져요.</li>
</ul>

<div class="box"><span class="h">나이아신 챙기기</span>
<ol>
<li>끼니마다 고기·생선·달걀·콩 중 하나</li>
<li>땅콩, 버섯, 현미로 보태기</li>
<li>과음하지 않기</li>
<li>보충제 니코틴산은 하루 35mg 이내</li>
<li>콜레스테롤은 검증된 약으로 관리</li>
<li>고용량 복용 중 피로·황달이면 중단하고 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>종합비타민 먹고 얼굴이 빨개졌어요.</dt>
<dd>니코틴산 형태가 들어 있으면 홍조가 생길 수 있어요. 대개 해롭지 않고 곧 가라앉아요. 불편하면 식사와 함께 먹거나 니코틴아마이드 형태인지 확인해 보세요. 숨참이나 두드러기가 함께 오면 알레르기일 수 있어 진료를 받아요.</dd>
<dt>채식하면 나이아신이 부족한가요?</dt>
<dd>땅콩, 버섯, 통곡물, 콩에도 들어 있고, 콩 단백질의 트립토판으로도 만들어져요. 균형 잡힌 채식이라면 부족하기 어려워요.</dd>
<dt>옥수수를 주식으로 하면 왜 펠라그라가 생기나요?</dt>
<dd>옥수수의 나이아신은 결합된 형태라 흡수가 잘 안 되고, 트립토판도 적어요. 옥수수를 석회수로 처리하는 전통 조리법은 나이아신을 흡수되기 쉽게 바꿔요.</dd>
</dl>
