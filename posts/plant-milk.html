  data-title="식물성 우유: 두유·아몬드·귀리·쌀 음료의 영양 차이, 칼슘 강화와 당류 확인, 아이에게 줄 때 주의"

  data-summary="우유 대신 두유, 아몬드·귀리·쌀·코코넛 음료를 찾는 사람이 늘고 있어요. 원료별 단백질·칼슘·당류 차이, 칼슘과 비타민 D 강화 여부를 확인하는 법, 유당 불내증과 알레르기, 어린아이에게 식물성 음료를 우유 대신 줄 때의 주의점, 쌀 음료와 비소 문제를 정리했어요."
  data-tags="식물성우유,두유,귀리음료,아몬드음료,영양소">
<p class="lead">우유를 마시면 배가 불편하거나, 채식을 하거나, 환경을 생각해 식물성 음료를 고르는 사람이 많아졌어요. 하지만 '○○ 우유'라는 이름이 붙어도 영양은 원료마다 크게 달라요. 우유를 대신하려면 어떤 점을 확인해야 하는지 알아 둘게요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>우유와 단백질이 비슷한 것은 <strong>두유</strong>예요. 아몬드·귀리·쌀·코코넛 음료는 <strong>단백질이 적어요.</strong></li>
<li>식물성 음료는 원래 칼슘이 적어요. <strong>칼슘·비타민 D 강화 제품</strong>인지 확인해요.</li>
<li><strong>'무가당'</strong> 표시와 영양성분표의 당류를 봐요.</li>
<li>만 2세 미만 아이에게 우유 대신 식물성 음료를 주려면 <strong>소아청소년과와 상의</strong>해요. 쌀 음료는 어린아이에게 권하지 않아요.</li>
</ul></div>

<h2>원료별 영양 비교</h2>
<div class="tbl"><table>
<thead><tr><th>음료(200mL, 무가당 기준, 대략)</th><th class="num">열량</th><th class="num">단백질</th><th>특징</th></tr></thead>
<tbody>
<tr><td>흰 우유</td><td class="num">약 130kcal</td><td class="num">약 6g</td><td>칼슘 약 200mg, 비타민 B12, 요오드</td></tr>
<tr><td>두유</td><td class="num">약 80~120kcal</td><td class="num">약 6g</td><td>필수 아미노산 구성이 좋아요. 칼슘은 강화 여부에 따라 달라요</td></tr>
<tr><td>아몬드 음료</td><td class="num">약 30~40kcal</td><td class="num">약 1g</td><td>열량이 낮아요. 단백질은 거의 없어요</td></tr>
<tr><td>귀리 음료</td><td class="num">약 80~100kcal</td><td class="num">약 1~2g</td><td>탄수화물이 많고 맛이 부드러워요. 베타글루칸</td></tr>
<tr><td>쌀 음료</td><td class="num">약 90~100kcal</td><td class="num">1g 미만</td><td>탄수화물이 대부분. 무기비소 우려</td></tr>
<tr><td>코코넛 음료</td><td class="num">약 40~80kcal</td><td class="num">1g 미만</td><td>포화지방이 들어 있어요</td></tr>
</tbody>
<caption>농촌진흥청 국가표준식품성분표, 미국 농무부(USDA) FoodData Central, 시판 제품 영양성분표를 바탕으로 대략 정리. 제품마다 차이가 커요</caption></table></div>

<h2>포장지에서 확인할 것</h2>
<ol>
<li><strong>칼슘:</strong> 200mL에 우유와 비슷한 150~200mg이 들어 있는지. 강화하지 않은 제품은 훨씬 적어요.</li>
<li><strong>비타민 D, B12:</strong> 채식을 한다면 특히 강화 여부를 봐요.</li>
<li><strong>당류:</strong> 가당 제품은 200mL에 당이 10g을 넘기도 해요. 초콜릿·바나나 맛 제품은 더 많아요.</li>
<li><strong>단백질:</strong> 우유를 대신한다면 두유처럼 단백질이 충분한 제품을 고르거나, 다른 음식으로 채워요.</li>
<li><strong>알레르기 표시:</strong> 대두, 견과류(아몬드), 귀리의 교차 오염(글루텐)</li>
</ol>
<p>칼슘을 강화한 음료는 칼슘이 바닥에 가라앉을 수 있어요. <strong>잘 흔들어서</strong> 마셔요.</p>

<h2>누구에게 어떤 음료가 맞을까</h2>
<div class="tbl"><table>
<thead><tr><th>상황</th><th>고르는 법</th></tr></thead>
<tbody>
<tr><td>유당 불내증</td><td>우유 영양을 그대로 원하면 락토프리 우유가 가장 비슷해요. 식물성이라면 두유</td></tr>
<tr><td>우유 단백질 알레르기</td><td>락토프리 우유도 안 돼요. 칼슘 강화 두유 등을 의사와 상의해 골라요</td></tr>
<tr><td>채식</td><td>칼슘·비타민 D·B12를 강화한 두유</td></tr>
<tr><td>체중·혈당 관리</td><td>무가당 아몬드 음료나 무가당 두유. 귀리·쌀 음료는 탄수화물이 많아요</td></tr>
<tr><td>콩팥병</td><td>인·칼륨 첨가 여부를 확인하고 영양사와 상의</td></tr>
</tbody>
<caption>대한영양사협회, 미국 영양및식이요법학회 자료를 바탕으로 정리</caption></table></div>

<div class="box warn"><span class="h">아이에게 줄 때</span>
<ul>
<li><strong>돌 전 아기</strong>에게는 모유나 분유를 줘요. 우유든 식물성 음료든 주식으로 주지 않아요.</li>
<li><strong>만 1~2세</strong>에게 우유 대신 식물성 음료를 주려면, 영양상 가장 가까운 것은 <strong>칼슘·비타민 D 강화 두유</strong>예요. 아몬드·귀리·쌀 음료만으로는 단백질과 열량이 부족해 성장에 영향을 줄 수 있어 소아청소년과와 상의해요.</li>
<li><strong>쌀 음료</strong>는 무기비소가 들어 있을 수 있어 영국 식품기준청은 5세 미만 아이에게 우유 대신 주지 말라고 권해요.</li>
</ul></div>

<h2>환경과 선택</h2>
<p>식물성 음료는 대체로 우유보다 생산 과정의 온실가스와 땅 사용이 적다는 분석이 많아요. 다만 원료마다 물 사용량 등이 달라요. 영양과 환경, 입맛, 가격을 함께 고려해 나에게 맞는 것을 고르면 돼요. 우유를 꼭 끊어야 하는 것도, 꼭 마셔야 하는 것도 아니에요.</p>

<div class="box"><span class="h">식물성 음료 체크리스트</span>
<ol>
<li>우유 대신이면 단백질 확인</li>
<li>칼슘·비타민 D 강화 제품 고르기</li>
<li>무가당, 당류 표시 확인</li>
<li>마시기 전 잘 흔들기</li>
<li>알레르기 표시 확인</li>
<li>어린아이는 의사와 상의, 쌀 음료 피하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>두유를 마시면 여성호르몬이 늘어나나요?</dt>
<dd>콩의 이소플라본은 약한 식물성 에스트로겐이지만, 보통 먹는 양의 두유가 사람의 호르몬에 해를 준다는 근거는 없어요. 유방암 환자도 음식으로 먹는 콩은 괜찮다고 보는 연구가 많아요.</dd>
<dt>귀리 음료는 혈당을 올리나요?</dt>
<dd>귀리를 효소로 분해해 만드는 과정에서 당이 생겨 무가당이라도 탄수화물이 있어요. 당뇨가 있다면 양을 조절해요.</dd>
<dt>집에서 만들어도 되나요?</dt>
<dd>만들 수 있지만 칼슘과 비타민 강화가 되지 않아 영양이 부족할 수 있어요. 위생에 신경 쓰고 빨리 마셔요.</dd>
</dl>
