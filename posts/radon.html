<p class="lead">라돈은 색도 냄새도 없어서 있는지조차 느낄 수 없어요. 땅속 우라늄이 붕괴하면서 생긴 기체가 바닥 틈으로 새어 들어와 환기가 잘 안 되는 집 안에 쌓여요. 오래 들이마시면 폐암 위험이 올라가지만, 측정하고 환기하는 것만으로도 상당 부분 줄일 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>라돈은 <strong>흡연 다음으로 중요한 폐암 원인</strong>이에요. 비흡연자 폐암의 주요 원인이기도 해요.</li>
<li>국내 공동주택·다중이용시설 실내 권고 기준은 <strong>148Bq/m³</strong>예요. 세계보건기구는 100Bq/m³를 권해요.</li>
<li>라돈은 <strong>땅과 가까운 저층, 단독주택, 지하 공간</strong>에서 높기 쉬워요.</li>
<li>가장 쉽고 확실한 대책은 <strong>하루 여러 번 환기</strong>예요. 수치가 높으면 틈새를 막고 저감 시설을 고려해요.</li>
</ul></div>

<h2>라돈은 어디서 올까</h2>
<p>라돈은 흙과 바위, 지하수에 있는 우라늄이 자연적으로 붕괴하면서 생겨요. 우리나라는 화강암 지대가 넓어 다른 나라보다 라돈 농도가 높은 지역이 있어요. 집 안으로는 주로 <strong>바닥과 벽의 갈라진 틈, 배관이 지나가는 구멍, 배수구</strong>를 통해 들어와요. 일부 건축 자재나 지하수에서 나오기도 해요.</p>
<p>라돈 자체보다 라돈이 붕괴하며 만드는 작은 입자들이 문제예요. 이 입자가 폐에 달라붙어 방사선을 내면서 세포를 손상시켜요.</p>

<h2>기준 수치의 뜻</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>기준</th><th>비고</th></tr></thead>
<tbody>
<tr><td>국내 공동주택 실내 권고 기준</td><td class="num">148Bq/m³ 이하</td><td>신축 공동주택 입주 전 측정·공고 대상</td></tr>
<tr><td>국내 다중이용시설 권고 기준</td><td class="num">148Bq/m³ 이하</td><td>지하역사, 어린이집 등</td></tr>
<tr><td>세계보건기구 권고 참고 수준</td><td class="num">100Bq/m³</td><td>어렵다면 300Bq/m³를 넘지 않도록</td></tr>
<tr><td>미국 환경보호청 조치 수준</td><td class="num">4pCi/L(약 148Bq/m³)</td><td>이 이상이면 저감 조치 권고</td></tr>
</tbody>
<caption>환경부 실내공기질 관리법 기준, 세계보건기구(WHO) Handbook on Indoor Radon(2009), 미국 환경보호청(EPA) 안내를 바탕으로 정리</caption></table></div>
<p>기준은 '이 아래면 위험이 0'이라는 선이 아니라, 관리를 시작할 눈높이예요. 농도가 낮을수록, 머무는 시간이 짧을수록 위험도 낮아져요.</p>

<h2>흡연과 함께면 위험이 커져요</h2>
<p>라돈과 흡연은 서로 위험을 키워요. 같은 라돈 농도라도 <strong>흡연자의 폐암 위험이 비흡연자보다 훨씬 커요.</strong> 라돈이 걱정된다면 금연이 가장 큰 효과를 내는 대책이에요. 가족의 간접흡연도 함께 줄여요.</p>

<h2>우리 집 라돈 재는 법</h2>
<ul>
<li><strong>무료 측정 서비스:</strong> 환경부와 한국환경공단의 생활 방사선(라돈) 무료 측정 서비스가 있어요. 신청 방법과 대상은 해마다 달라서 한국환경공단 누리집이나 거주지 지자체에 확인해요.</li>
<li><strong>측정기 대여:</strong> 일부 지자체와 보건소가 라돈 측정기를 빌려줘요.</li>
<li><strong>직접 측정:</strong> 가정용 연속 측정기를 쓸 수 있어요. 며칠 이상 재서 평균을 보고, 결과가 높으면 공인 측정으로 다시 확인해요.</li>
</ul>
<div class="box note"><span class="h">측정할 때 요령</span>
<p>가족이 가장 오래 머무는 곳(침실, 거실)의 바닥에서 약간 떨어진 높이에서 재요. 창문을 닫은 평소 생활 상태에서 재야 해요. 라돈은 날씨와 계절에 따라 오르내려서 <strong>짧게 한 번 잰 값보다 긴 기간의 평균</strong>이 더 믿을 만해요. 겨울에는 창문을 덜 열어 높게 나오는 경향이 있어요.</p></div>

<h2>라돈이 높기 쉬운 곳</h2>
<div class="tbl"><table>
<thead><tr><th>장소</th><th>이유</th></tr></thead>
<tbody>
<tr><td>단독주택, 저층 주택</td><td>땅과 맞닿은 면이 넓어 바닥으로 들어오는 양이 많아요</td></tr>
<tr><td>지하 공간, 반지하</td><td>흙과 가깝고 환기가 어려워요</td></tr>
<tr><td>오래된 건물</td><td>바닥과 벽에 균열이 많을 수 있어요</td></tr>
<tr><td>겨울철 닫힌 집</td><td>창문을 오래 닫아 라돈이 쌓여요</td></tr>
<tr><td>지하수를 쓰는 집</td><td>물에 녹은 라돈이 샤워·조리할 때 공기로 나올 수 있어요</td></tr>
</tbody>
<caption>환경부·국립환경과학원 실내 라돈 관리 안내를 바탕으로 정리</caption></table></div>

<h2>라돈 줄이는 방법</h2>
<ol>
<li><strong>환기:</strong> 아침저녁으로 <strong>하루 2~3번, 한 번에 10~30분</strong> 맞통풍이 되게 창문을 열어요. 가장 쉽고 효과가 커요.</li>
<li><strong>틈새 막기:</strong> 바닥과 벽의 균열, 배관이 지나가는 구멍을 실리콘이나 전용 밀폐재로 막아요.</li>
<li><strong>배수구 관리:</strong> 물이 마른 배수구는 땅속 공기가 올라오는 통로가 돼요. 트랩에 물을 채우거나 덮개를 써요.</li>
<li><strong>기계 환기:</strong> 환기 설비가 있는 아파트라면 꾸준히 켜 두어요.</li>
<li><strong>저감 시설:</strong> 수치가 계속 높다면 바닥 아래 공기를 밖으로 빼내는 배기 장치를 전문 업체와 상의해요. 지자체에 따라 저감 시공을 지원하기도 해요.</li>
</ol>
<p>공기청정기는 라돈 기체 자체를 거의 걸러 내지 못해요. 라돈 대책은 환기와 유입 차단이 기본이에요.</p>

<h2>라돈 침대·생활제품</h2>
<p>과거 일부 침대와 생활제품에서 라돈이 검출돼 문제가 된 일이 있었어요. 음이온, 원적외선을 내세우며 광물 가루를 쓴 제품은 방사성 물질이 들어 있을 수 있어요. 걱정되는 제품은 원자력안전위원회의 생활 방사선 안내를 참고하고, 피부에 오래 닿는 제품은 사용을 멈추고 문의해요.</p>

<div class="box warn"><span class="h">이런 증상은 병원에서 상담해요</span>
<p>라돈은 당장 증상을 일으키지 않아요. 다만 <strong>2주 넘는 기침, 피 섞인 가래, 이유 없는 숨참과 체중 감소</strong>가 있다면 흡연 여부와 관계없이 진료를 받아요. 오래 흡연했다면 국가 폐암검진 대상인지도 확인해요.</p></div>

<div class="box"><span class="h">라돈 관리 체크리스트</span>
<ol>
<li>우리 집이 저층·단독·지하인지 확인</li>
<li>무료 측정 서비스나 측정기 대여 알아보기</li>
<li>하루 2~3번 맞통풍 환기</li>
<li>바닥·벽 균열과 배관 구멍 막기</li>
<li>마른 배수구 트랩에 물 채우기</li>
<li>집 안 흡연 없애기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>아파트 고층도 라돈이 있나요?</dt>
<dd>땅에서 멀어 바닥으로 들어오는 양은 적지만, 콘크리트나 석재 같은 건축 자재에서 나올 수 있어요. 환기가 부족하면 쌓여요. 고층이라도 환기는 똑같이 중요해요.</dd>
<dt>라돈 수치가 높게 나왔는데 이사를 가야 하나요?</dt>
<dd>대부분은 환기와 틈새 막기, 저감 시설로 충분히 낮출 수 있어요. 조치한 뒤 다시 측정해서 효과를 확인해요.</dd>
<dt>라돈에 노출됐는지 검사할 수 있나요?</dt>
<dd>몸에 라돈이 쌓였는지 확인하는 일반적인 검사는 없어요. 중요한 것은 앞으로의 노출을 줄이는 거예요.</dd>
</dl>
