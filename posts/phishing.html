  data-title="보이스피싱·스미싱 예방: 수법별 특징과 피해가 났을 때 바로 할 일"
  data-thumb="112|지급정지 신고"
  data-summary="검찰, 금융감독원, 가족, 택배 회사를 사칭하는 수법은 계속 바뀌지만 원칙은 같아요. 대표 수법과 공통점, 절대 하지 말아야 할 행동, 휴대폰 보안 설정, 피해가 났을 때 몇 분 안에 해야 할 지급정지와 명의도용 차단, 부모님과 미리 정해둘 약속을 정리했어요."
  data-tags="보이스피싱,스미싱,금융사기,개인정보,휴대폰보안">
<p class="lead">보이스피싱은 사람을 급하게 만들고 혼자 판단하게 만드는 범죄예요. "지금 바로", "아무에게도 말하지 마세요"라는 말이 나오면 그 자체가 신호예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>검찰·경찰·금융감독원은 전화로 <strong>돈 이체, 현금 전달, 앱 설치, 개인정보</strong>를 요구하지 않아요.</li>
<li>문자 속 <strong>링크를 누르지 않고</strong>, 출처를 알 수 없는 <strong>앱을 설치하지 않아요.</strong></li>
<li>가족이 급하게 돈을 요구하면 <strong>직접 전화를 걸어</strong> 확인해요.</li>
<li>돈을 보냈다면 즉시 <strong>112나 금융회사 콜센터</strong>에 전화해 지급정지를 요청해요.</li>
</ul></div>

<h2>대표적인 수법</h2>
<div class="tbl"><table>
<thead><tr><th>수법</th><th>이렇게 접근해요</th><th>진실</th></tr></thead>
<tbody>
<tr><td>수사기관 사칭</td><td>"고객님 계좌가 범죄에 연루됐습니다. 안전계좌로 옮겨야 합니다." 가짜 공문이나 영상통화로 검사를 연기하기도 해요</td><td>'안전계좌'는 존재하지 않아요. 수사기관은 돈을 옮기라고 하지 않아요</td></tr>
<tr><td>금융기관·대출 빙자</td><td>"저금리 대환대출이 가능합니다. 기존 대출을 먼저 갚으셔야 합니다."</td><td>대출을 조건으로 먼저 돈을 보내라거나 앱 설치를 요구하면 사기예요</td></tr>
<tr><td>가족·지인 사칭</td><td>"엄마, 나 폰 고장 나서 친구 폰으로 연락해. 급하게 결제할 게 있어."</td><td>원래 번호로 직접 전화하면 바로 확인돼요</td></tr>
<tr><td>택배·청첩장·부고 스미싱</td><td>"주소 불일치로 배송 보류. 확인: (링크)" "모바일 청첩장: (링크)"</td><td>링크를 누르면 악성 앱이 설치돼 개인정보와 금융정보가 빠져나가요</td></tr>
<tr><td>정부 지원금·환급 사칭</td><td>"재난지원금 대상입니다" "세금 환급금이 있습니다"</td><td>공공기관은 문자 링크로 개인정보를 받지 않아요</td></tr>
<tr><td>중고거래·투자 사기</td><td>안전결제를 사칭한 가짜 링크, 고수익 보장 투자 리딩방</td><td>공식 앱 밖의 결제 링크, 원금 보장·고수익 약속은 의심해요</td></tr>
</tbody></table></div>

<h2>수법이 달라도 공통점은 같다</h2>
<ul>
<li><strong>급하게 만들어요.</strong> "오늘 안에 처리하지 않으면", "지금 바로"</li>
<li><strong>고립시켜요.</strong> "보안 사항이니 가족에게도 말하지 마세요", "전화를 끊지 마세요"</li>
<li><strong>권위를 빌려요.</strong> 검사, 금융감독원, 은행 직원의 이름과 직함, 가짜 공문</li>
<li><strong>앱 설치를 유도해요.</strong> 원격 제어 앱이나 가짜 금융 앱을 설치하게 해요. 설치되는 순간 휴대폰을 조종하고, 내가 공식 번호로 전화를 걸어도 사기범에게 연결되게 만들 수 있어요.</li>
</ul>

<h2>절대 하지 말아야 할 것</h2>
<div class="box warn"><span class="h">이런 요구는 무조건 거절하세요</span>
<ul>
<li>전화로 계좌이체나 현금 인출을 요구해요.</li>
<li>현금을 찾아서 누군가에게 전달하거나 어딘가에 보관하라고 해요.</li>
<li>문자나 메신저로 받은 링크의 앱을 설치하라고 해요.</li>
<li>원격 제어 앱을 설치하라고 해요.</li>
<li>신분증 사진, 계좌 비밀번호, 인증번호, 보안카드 번호를 알려달라고 해요.</li>
<li>'안전계좌', '보호계좌'로 돈을 옮기라고 해요.</li>
</ul>
<p>의심되면 일단 <strong>전화를 끊고</strong>, 내가 직접 찾은 공식 번호(기관 홈페이지, 카드 뒷면)로 다시 걸어 확인해요. 받은 문자에 적힌 번호로 걸지 않아요.</p></div>

<h2>휴대폰 보안 설정</h2>
<ul>
<li><strong>출처를 알 수 없는 앱 설치 허용을 끄세요.</strong> 안드로이드 설정의 보안 메뉴에서 확인할 수 있어요.</li>
<li>운영체제와 앱을 최신 버전으로 업데이트해요.</li>
<li>통신사의 스팸·스미싱 차단 서비스와 보안 앱을 활용해요.</li>
<li>모르는 번호로 온 링크는 누르지 않고 삭제해요. 궁금하면 공식 앱이나 홈페이지에 직접 들어가 확인해요.</li>
<li>금융 앱의 <strong>지연 이체</strong>, <strong>입금 계좌 지정</strong>, <strong>해외 IP 차단</strong> 같은 안전 서비스를 설정하면 피해를 막을 시간을 벌 수 있어요.</li>
</ul>

<h2>피해가 났다면 바로 할 일</h2>
<p>돈이 넘어간 직후 몇 분이 가장 중요해요. 사기범은 돈을 받자마자 여러 계좌로 옮기거나 인출해요.</p>
<div class="tbl"><table>
<thead><tr><th>순서</th><th>할 일</th><th>연락처</th></tr></thead>
<tbody>
<tr><td>1</td><td><strong>지급정지 요청</strong>: 내가 돈을 보낸 은행 또는 받은 계좌의 은행에 즉시 연락</td><td>112 (경찰) 또는 해당 금융회사 콜센터</td></tr>
<tr><td>2</td><td>피해 상담과 안내</td><td>금융감독원 1332</td></tr>
<tr><td>3</td><td>개인정보 노출 등록 (추가 금융거래 제한)</td><td>금융감독원 개인정보노출자 사고예방시스템</td></tr>
<tr><td>4</td><td>내 명의 계좌·대출 확인, 일괄 지급정지</td><td>계좌정보통합관리서비스 (어카운트인포)</td></tr>
<tr><td>5</td><td>내 명의 휴대폰 개통 확인·차단</td><td>명의도용방지서비스 (엠세이퍼)</td></tr>
<tr><td>6</td><td>악성 앱 설치가 의심되면 휴대폰 점검 또는 초기화</td><td>통신사 대리점, 보안 앱, 118 (한국인터넷진흥원)</td></tr>
<tr><td>7</td><td>경찰서 방문 신고 후 사건사고사실확인원 발급, 피해구제 신청</td><td>은행에 제출</td></tr>
</tbody></table></div>
<p>신분증 사진을 보냈다면 주민센터에서 신분증을 재발급받고, 비밀번호와 공동인증서를 모두 바꿔요.</p>

<h2>부모님과 미리 정해둘 것</h2>
<div class="box"><span class="h">가족 보이스피싱 예방 약속</span>
<ol>
<li><strong>가족만 아는 암호</strong>를 정해요. 급하게 돈을 요구하면 암호를 물어봐요.</li>
<li>"급하게 돈 보내 달라"는 연락은 <strong>무조건 원래 번호로 전화</strong>해서 확인한다고 약속해요.</li>
<li>모르는 사람이 앱을 깔라고 하면 <strong>가족에게 먼저 물어보기로</strong> 해요.</li>
<li>부모님 휴대폰의 '출처를 알 수 없는 앱 설치'를 꺼두고, 스팸 차단을 설정해요.</li>
<li>피해가 났을 때 112에 바로 전화하는 법을 알려드려요.</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>링크를 눌렀는데 아무 일도 안 일어났어요. 괜찮은가요?</dt>
<dd>링크를 누른 것만으로 바로 피해가 생기는 경우는 드물지만, 앱 설치 화면이 뜨거나 뭔가를 설치했다면 위험해요. 설치한 앱이 있다면 삭제하고, 보안 앱으로 검사하고, 금융 앱 비밀번호를 바꿔요. 걱정되면 휴대폰을 초기화하는 게 가장 확실해요.</dd>
<dt>통장을 빌려달라거나 팔라고 하는데요.</dt>
<dd>내 계좌가 사기에 쓰이는 대포통장이 되면 나도 처벌받고, 금융거래가 제한될 수 있어요. 어떤 이유로도 통장, 체크카드, 인증 정보를 남에게 넘기지 않아요.</dd>
<dt>이미 돈을 인출해서 전달했어요.</dt>
<dd>현금을 직접 전달한 경우는 계좌 지급정지로 막을 수 없어서 더 어려워요. 그래도 즉시 112에 신고해요. 수거책을 추적하는 데 도움이 되고, 추가 피해를 막을 수 있어요.</dd>
</dl>
