<p class="lead">탈모 영양제 광고에는 '비오틴 10,000μg'처럼 큰 숫자가 자주 보여요. 하루 필요량이 30μg인 것과 비교하면 300배가 넘는 양이에요. 비오틴은 해가 적은 편이지만, 이만큼 먹으면 <strong>혈액검사 결과를 엉뚱하게 바꿔</strong> 진단을 헷갈리게 할 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인 충분섭취량은 하루 <strong>30μg</strong>이고, 보통 식사로 채워져요.</li>
<li><strong>달걀노른자, 간, 연어, 견과류·씨앗</strong>에 많아요.</li>
<li>결핍이 없는 사람의 탈모에 비오틴 보충제가 효과가 있다는 근거는 <strong>부족해요.</strong></li>
<li>고용량을 먹는다면 혈액검사 전에 <strong>의료진에게 꼭 알려요.</strong> 갑상선·심장 검사 결과가 틀릴 수 있어요.</li>
</ul></div>

<h2>비오틴이 하는 일</h2>
<p>비오틴(비타민 B7)은 탄수화물, 지방, 단백질 대사에 쓰이는 효소 다섯 가지를 돕는 조효소예요. 포도당을 새로 만들고, 지방산을 합성하고, 일부 아미노산을 분해하는 데 필요해요. 유전자 조절에도 관여한다고 알려져 있어요.</p>

<h2>하루에 얼마나</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th class="num">충분섭취량(하루)</th></tr></thead>
<tbody>
<tr><td>성인(19세 이상)</td><td class="num">30μg</td></tr>
<tr><td>임신부</td><td class="num">+0μg</td></tr>
<tr><td>수유부</td><td class="num">+5μg</td></tr>
</tbody>
<caption>보건복지부·한국영양학회, 2020 한국인 영양소 섭취기준. 상한섭취량은 정해져 있지 않아요</caption></table></div>

<h2>많이 든 음식</h2>
<div class="tbl"><table>
<thead><tr><th>식품(1회 분량)</th><th class="num">비오틴(대략)</th></tr></thead>
<tbody>
<tr><td>소 간 60g</td><td class="num">약 20~30μg</td></tr>
<tr><td>달걀 1개(익힌 것)</td><td class="num">약 10μg</td></tr>
<tr><td>연어 100g</td><td class="num">약 5μg</td></tr>
<tr><td>해바라기씨 30g</td><td class="num">약 2~3μg</td></tr>
<tr><td>아몬드 30g</td><td class="num">약 1~2μg</td></tr>
<tr><td>고구마 1개</td><td class="num">약 2~3μg</td></tr>
</tbody>
<caption>미국 국립보건원(NIH) 식이보충제국 비오틴 자료를 바탕으로 한 대략값</caption></table></div>
<p>장내 세균도 비오틴을 조금 만들어요. 그래서 음식이 크게 부족하지 않다면 결핍은 드물어요.</p>

<h2>날달걀 흰자와 비오틴</h2>
<p>날달걀 흰자에는 <strong>아비딘</strong>이라는 단백질이 있어 비오틴과 단단히 붙어 흡수를 막아요. 그래서 날달걀 흰자를 매일 아주 많이 오래 먹으면 결핍이 생길 수 있어요. 달걀을 익히면 아비딘이 변해 이런 문제가 없어요. 노른자에는 비오틴이 많아 익힌 달걀은 좋은 공급원이에요.</p>

<h2>결핍은 누구에게</h2>
<ul>
<li>선천성 효소 결핍(바이오티니다제 결핍): 신생아 선별검사로 찾아요.</li>
<li>과음, 임신 중 일시적 부족, 장기간 정맥영양</li>
<li>일부 항경련제(카바마제핀, 페니토인 등)를 오래 먹는 경우</li>
</ul>
<p>결핍되면 머리카락이 가늘어지고 빠지며, 눈·코·입 주변에 붉은 비늘 같은 피부염이 생기고, 우울감이나 손발 저림이 올 수 있어요.</p>

<h2>탈모와 손톱에는 효과가 있을까</h2>
<p>비오틴 결핍으로 생긴 탈모는 보충하면 좋아져요. 하지만 <strong>결핍이 없는 사람</strong>의 남성형·여성형 탈모, 스트레스성 탈모에 비오틴이 도움이 된다는 제대로 된 연구는 부족해요. 부서지는 손톱에 대한 연구도 규모가 작아요.</p>
<ul>
<li>탈모가 걱정되면 피부과에서 원인(유전, 갑상선, 철분 부족, 호르몬, 약물 등)을 먼저 확인해요.</li>
<li>남성형 탈모에는 효과가 확인된 치료제가 따로 있어요.</li>
</ul>

<h2>혈액검사를 틀리게 만드는 문제</h2>
<div class="box warn"><span class="h">고용량 비오틴을 먹는다면 검사 전에 알려요</span>
<p>많은 혈액검사가 비오틴과 '스트렙타비딘'이라는 물질이 붙는 원리를 이용해요. 혈액 속에 비오틴이 많으면 이 반응을 방해해 결과가 <strong>실제보다 높거나 낮게</strong> 나올 수 있어요.</p></div>
<div class="tbl"><table>
<thead><tr><th>영향을 받을 수 있는 검사</th><th>생길 수 있는 문제</th></tr></thead>
<tbody>
<tr><td>갑상선 기능 검사(TSH, 갑상선호르몬)</td><td>갑상선 기능 항진증처럼 보이는 결과가 나와 잘못된 진단·치료로 이어질 수 있어요</td></tr>
<tr><td>심장 트로포닌(심근경색 검사)</td><td>실제보다 낮게 나와 심근경색을 놓칠 수 있어요</td></tr>
<tr><td>일부 호르몬, 비타민 D, 종양 표지자 검사</td><td>검사 방법에 따라 결과가 왜곡될 수 있어요</td></tr>
</tbody>
<caption>미국 식품의약국(FDA) 비오틴 검사 간섭 안전 경고(2017, 2019)를 바탕으로 정리</caption></table></div>
<ul>
<li>탈모·손톱 영양제에는 하루 5,000~10,000μg 이상이 든 제품이 많아요.</li>
<li>정기 검사 전이라면 먹고 있다는 사실을 알리고, 의료진 안내에 따라 며칠 끊고 검사하기도 해요.</li>
<li>응급 상황에서는 끊을 시간이 없으니, 비오틴 복용 사실을 의료진에게 말하는 것이 가장 중요해요.</li>
</ul>

<div class="box"><span class="h">비오틴 체크리스트</span>
<ol>
<li>달걀, 견과류, 생선으로 식사에서 채우기</li>
<li>날달걀 흰자를 매일 많이 먹지 않기</li>
<li>탈모는 원인부터 진료로 확인</li>
<li>영양제 라벨의 비오틴 함량 확인</li>
<li>혈액검사 전 비오틴 복용 알리기</li>
<li>갑상선 결과가 이상하면 비오틴 복용 여부 확인</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>비오틴을 많이 먹어도 몸에 해롭진 않나요?</dt>
<dd>지금까지 고용량 비오틴이 직접 몸을 해친다는 보고는 드물어 상한섭취량이 정해져 있지 않아요. 문제는 검사 결과 왜곡이에요. 필요 없는 고용량을 오래 먹을 이유도 크지 않아요.</dd>
<dt>종합비타민의 비오틴도 검사에 영향을 주나요?</dt>
<dd>종합비타민에는 보통 수십 μg 정도라 대부분 문제가 되지 않아요. 수천 μg 이상 든 제품에서 주로 문제가 돼요.</dd>
<dt>임신 중 비오틴을 따로 먹어야 하나요?</dt>
<dd>임신 중 일시적으로 비오틴 대사가 늘 수 있지만, 균형 잡힌 식사와 임신부용 종합비타민이면 대개 충분해요.</dd>
</dl>
