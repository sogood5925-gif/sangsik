  data-title="비타민 B1(티아민): 밥심을 에너지로 바꾸는 비타민, 과음하는 사람에게 특히 중요한 이유"
  data-thumb="1.2mg|남성 권장섭취량"
  data-summary="비타민 B1은 탄수화물을 에너지로 바꾸는 데 꼭 필요해요. 하루 권장섭취량과 많이 든 음식, 흰쌀과 가공식품 위주 식사에서 부족해지기 쉬운 이유, 과음하는 사람의 베르니케 뇌병증, 부족한 사람과 고용량 '활성 비타민' 제품의 근거를 정리했어요."
  data-tags="비타민B1,티아민,각기병,음주,영양소">
<p class="lead">밥과 빵, 면에 든 탄수화물은 몸속에서 에너지로 바뀌어야 쓸모가 있어요. 이 과정의 톱니바퀴 역할을 하는 것이 비타민 B1(티아민)이에요. 흔한 식사로 대부분 채워지지만, 술을 많이 마시거나 한쪽으로 치우친 식사를 하면 생각보다 쉽게 부족해져요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인 권장섭취량은 하루 <strong>남성 1.2mg, 여성 1.1mg</strong>이에요.</li>
<li><strong>돼지고기, 통곡물, 콩, 견과류</strong>에 많고, 흰쌀과 정제 밀가루에는 적어요.</li>
<li><strong>과음</strong>하는 사람은 흡수가 줄고 소모가 늘어 결핍 위험이 높아요. 심하면 뇌 손상(베르니케 뇌병증)이 생겨요.</li>
<li>물에 녹는 비타민이라 몸에 오래 저장되지 않아요. 매일 식사로 채워요.</li>
</ul></div>

<h2>비타민 B1이 하는 일</h2>
<ul>
<li>포도당을 분해해 <strong>에너지(ATP)를 만드는 효소</strong>를 도와요. 탄수화물을 많이 먹을수록 더 필요해요.</li>
<li>뇌와 신경, 심장처럼 에너지를 많이 쓰는 기관이 제 기능을 하도록 해요.</li>
<li>신경 전달에도 관여해요.</li>
</ul>
<p>몸에 저장되는 양이 적어서, 섭취가 끊기면 몇 주 만에 부족해질 수 있어요.</p>

<h2>하루에 얼마나</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th class="num">권장섭취량(하루)</th></tr></thead>
<tbody>
<tr><td>성인 남성(19~64세)</td><td class="num">1.2mg</td></tr>
<tr><td>성인 여성(19~64세)</td><td class="num">1.1mg</td></tr>
<tr><td>임신부</td><td class="num">+0.4mg</td></tr>
<tr><td>수유부</td><td class="num">+0.4mg</td></tr>
</tbody>
<caption>보건복지부·한국영양학회, 2020 한국인 영양소 섭취기준. 음식으로 먹는 티아민의 상한섭취량은 정해져 있지 않아요</caption></table></div>

<h2>많이 든 음식</h2>
<div class="tbl"><table>
<thead><tr><th>식품(1회 분량)</th><th class="num">티아민(대략)</th></tr></thead>
<tbody>
<tr><td>돼지고기 안심·등심 100g(익힌 것)</td><td class="num">0.6~0.9mg</td></tr>
<tr><td>현미밥 1공기(210g)</td><td class="num">약 0.2mg</td></tr>
<tr><td>흰쌀밥 1공기(210g)</td><td class="num">약 0.05mg</td></tr>
<tr><td>해바라기씨 30g</td><td class="num">약 0.4mg</td></tr>
<tr><td>삶은 콩·두부 100g</td><td class="num">0.1~0.2mg</td></tr>
<tr><td>통밀빵 2쪽</td><td class="num">약 0.2mg</td></tr>
<tr><td>연어·송어 100g</td><td class="num">약 0.2mg</td></tr>
</tbody>
<caption>농촌진흥청 국가표준식품성분표, 미국 농무부(USDA) 식품 데이터를 바탕으로 한 대략값. 품종과 조리법에 따라 달라요</caption></table></div>
<p>같은 밥 한 공기라도 현미나 잡곡을 섞으면 티아민이 몇 배로 늘어요. 쌀을 도정하면서 티아민이 많은 쌀겨와 씨눈이 깎여 나가기 때문이에요.</p>

<h2>조리할 때 줄어드는 이유</h2>
<ul>
<li>티아민은 <strong>물에 잘 녹고 열에 약해요.</strong> 오래 삶거나 삶은 물을 버리면 많이 빠져나가요.</li>
<li>쌀을 여러 번 세게 문질러 씻으면 표면의 티아민이 씻겨 나가요.</li>
<li>국이나 찌개처럼 국물째 먹는 요리는 녹아 나온 티아민도 함께 먹을 수 있어요.</li>
<li>베이킹소다 같은 알칼리성 재료는 티아민을 더 빨리 파괴해요.</li>
</ul>

<h2>부족해지기 쉬운 사람</h2>
<ul>
<li><strong>술을 많이 마시는 사람:</strong> 식사가 부실하고, 알코올이 흡수를 방해하고, 간에 저장된 양이 줄어요.</li>
<li>흰쌀밥, 흰 빵, 라면, 단 음료 위주로 먹는 사람</li>
<li>비만 수술을 받은 사람, 입덧이 심해 계속 토하는 임신부</li>
<li>이뇨제를 오래 먹는 심부전 환자, 투석 환자</li>
<li>식사량이 크게 줄어든 어르신</li>
</ul>

<h2>결핍 증상</h2>
<div class="tbl"><table>
<thead><tr><th>상태</th><th>증상</th></tr></thead>
<tbody>
<tr><td>가벼운 부족</td><td>피로, 짜증, 식욕 저하, 기억력 저하</td></tr>
<tr><td>건성 각기병</td><td>손발 저림과 화끈거림, 다리 힘 빠짐, 근육 경련(말초신경병증)</td></tr>
<tr><td>습성 각기병</td><td>숨참, 빠른 맥박, 다리 부종(심부전)</td></tr>
<tr><td>베르니케 뇌병증</td><td>혼란, 비틀거림, 눈 움직임 이상. 치료가 늦으면 기억 장애(코르사코프 증후군)가 남아요</td></tr>
</tbody></table></div>
<div class="box warn"><span class="h">과음하는 사람의 응급 신호</span>
<p>술을 오래 많이 마신 사람이 갑자기 <strong>헛소리를 하거나, 똑바로 걷지 못하거나, 눈동자가 떨리거나 물체가 둘로 보이면</strong> 베르니케 뇌병증일 수 있어요. 응급실에서 티아민 주사를 빨리 맞아야 해요. 이런 사람에게 포도당만 먼저 주면 증상이 악화될 수 있어 의료진은 티아민을 먼저 또는 함께 줘요.</p></div>

<h2>영양제가 필요할까</h2>
<ul>
<li>균형 잡힌 식사를 하는 사람은 따로 먹을 필요가 거의 없어요.</li>
<li>과음, 비만 수술, 결핍 진단처럼 이유가 있으면 의사와 상의해 보충해요.</li>
<li>'피로 회복'을 내세운 고용량 활성형 티아민(벤포티아민, 푸르설티아민 등) 제품은 결핍이 없는 사람의 피로에 효과가 확인되지 않았어요. 당뇨 신경병증 등에 대한 연구도 결과가 엇갈려요.</li>
<li>티아민은 남으면 소변으로 빠져나가 음식으로 과잉이 되는 경우는 거의 없어요.</li>
</ul>

<div class="box"><span class="h">비타민 B1 챙기기</span>
<ol>
<li>밥에 현미·잡곡 섞기</li>
<li>돼지고기, 콩, 두부를 식단에 넣기</li>
<li>간식으로 견과류·씨앗 한 줌</li>
<li>채소는 짧게 데치고 국물도 활용</li>
<li>술 줄이기</li>
<li>과음 후 혼란·비틀거림은 응급실</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>마늘과 함께 먹으면 흡수가 잘 된다는데요?</dt>
<dd>마늘의 알리신이 티아민과 결합해 흡수가 잘 되는 형태를 만든다는 연구가 있어요. 이 원리로 만든 약 성분도 있어요. 다만 일반 식사에서 큰 차이를 만들 정도인지는 분명하지 않아요.</dd>
<dt>커피나 녹차가 티아민을 파괴하나요?</dt>
<dd>차와 커피의 일부 성분이 티아민과 결합할 수 있지만, 보통 식사를 하는 사람에게 문제가 될 정도는 아니에요. 식사와 조금 간격을 두면 충분해요.</dd>
<dt>숙취해소제로 비타민 B1을 먹으면 도움이 되나요?</dt>
<dd>과음하는 사람의 결핍을 막는 데는 의미가 있지만, 숙취를 없애 준다는 근거는 약해요. 가장 좋은 방법은 음주량을 줄이는 거예요.</dd>
</dl>
