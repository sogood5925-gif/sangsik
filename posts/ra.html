  data-title="류마티스 관절염: 아침에 손이 1시간 넘게 뻣뻣하다면, 초기 치료가 관절을 지켜요"
  data-thumb="1시간|아침 뻣뻣함 기준"
  data-summary="류마티스 관절염은 면역계가 관절을 공격하는 자가면역질환이에요. 퇴행성 관절염과 다른 증상의 특징, 진단 검사, 발병 초기에 항류마티스제를 시작해야 하는 이유, 메토트렉세이트와 생물학적 제제, 치료 중 감염 예방과 결핵 검사, 운동과 생활 관리를 정리했어요."
  data-tags="류마티스관절염,자가면역,관절염,메토트렉세이트,질병">
<p class="lead">아침에 일어나면 손가락이 굳어 주먹이 잘 쥐어지지 않고, 한참 움직여야 풀린다면 단순한 피로나 나이 탓이 아닐 수 있어요. 류마티스 관절염은 몇 달 사이에 관절을 망가뜨릴 수 있지만, 일찍 치료를 시작하면 대부분 관절 손상을 막고 일상생활을 유지할 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>류마티스 관절염은 <strong>면역계가 관절 막을 공격</strong>해 붓고 아프게 하는 병이에요.</li>
<li><strong>양쪽 손가락·손목·발가락</strong> 관절이 붓고, <strong>아침 뻣뻣함이 1시간 넘게</strong> 가는 게 특징이에요.</li>
<li>증상이 시작되고 <strong>몇 달 안에</strong> 항류마티스제를 시작할수록 관절 손상을 막기 쉬워요.</li>
<li>치료 중에는 <strong>감염 예방</strong>(예방접종, 결핵 검사)이 중요해요.</li>
</ul></div>

<h2>퇴행성 관절염과 무엇이 다를까</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>류마티스 관절염</th><th>퇴행성 관절염</th></tr></thead>
<tbody>
<tr><td>원인</td><td>자가면역 염증</td><td>연골이 닳고 변형됨</td></tr>
<tr><td>나이</td><td>30~50대 여성에게 흔하지만 모든 나이</td><td>50대 이후 흔해요</td></tr>
<tr><td>잘 생기는 관절</td><td>손가락 가운데·밑마디, 손목, 발가락. <strong>양쪽 대칭</strong></td><td>무릎, 엉덩이, 손가락 끝마디, 척추</td></tr>
<tr><td>아침 뻣뻣함</td><td><strong>1시간 이상</strong></td><td>대개 30분 이내</td></tr>
<tr><td>관절 모습</td><td>말랑하게 붓고 따뜻해요</td><td>딱딱하게 뼈가 튀어나와요</td></tr>
<tr><td>전신 증상</td><td>피로, 미열, 체중 감소가 있을 수 있어요</td><td>거의 없어요</td></tr>
</tbody>
<caption>대한류마티스학회 류마티스 관절염 건강 정보를 바탕으로 정리</caption></table></div>

<h2>진단</h2>
<ul>
<li><strong>진찰:</strong> 붓고 아픈 관절의 개수와 위치를 확인해요.</li>
<li><strong>혈액 검사:</strong> 류마티스 인자(RF), 항CCP 항체, 염증 수치(적혈구침강속도, C반응단백)를 봐요. 항CCP 항체는 특이도가 높아요. 다만 검사가 음성이어도 류마티스 관절염일 수 있고, 양성이어도 병이 아닐 수 있어요.</li>
<li><strong>영상:</strong> 엑스레이, 초음파, 필요하면 MRI로 관절 손상과 염증을 확인해요.</li>
</ul>
<p>손가락 관절이 6주 넘게 붓고 아프다면 류마티스내과 진료를 받아 보세요.</p>

<h2>일찍 치료해야 하는 이유</h2>
<p>류마티스 관절염의 관절 손상은 <strong>발병 후 첫 1~2년</strong>에 빠르게 진행해요. 이 시기에 염증을 잘 가라앉히면 관절 변형과 장애를 크게 줄일 수 있어요. 그래서 진단되면 바로 항류마티스제를 시작하고, <strong>질병 활성도가 낮거나 거의 없는 상태(관해)</strong>를 목표로 약을 조절해요.</p>

<h2>치료 약</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>예(성분)</th><th>알아 둘 점</th></tr></thead>
<tbody>
<tr><td>전통적 항류마티스제</td><td>메토트렉세이트, 하이드록시클로로퀸, 설파살라진, 레플루노마이드</td><td>메토트렉세이트가 기본 약이에요. <strong>일주일에 한 번</strong> 먹고, 엽산을 함께 먹어요. 간 수치와 혈구를 정기적으로 확인해요</td></tr>
<tr><td>생물학적 제제</td><td>TNF 억제제(아달리무맙, 에타너셉트 등), 토실리주맙, 아바타셉트, 리툭시맙</td><td>주사로 맞아요. 시작 전 결핵·B형간염 검사를 해요</td></tr>
<tr><td>표적 합성 항류마티스제</td><td>JAK 억제제(토파시티닙, 바리시티닙, 우파다시티닙)</td><td>먹는 약이에요. 대상포진, 혈전, 심혈관 위험을 고려해 선택해요</td></tr>
<tr><td>스테로이드</td><td>프레드니솔론 등</td><td>항류마티스제 효과가 나기 전까지 짧게, 적은 용량으로 써요</td></tr>
<tr><td>소염진통제</td><td>이부프로펜, 나프록센 등</td><td>통증을 덜지만 관절 손상을 막지는 못해요</td></tr>
</tbody>
<caption>대한류마티스학회 진료지침, 유럽류마티스학회(EULAR) 2022 권고를 바탕으로 정리</caption></table></div>
<div class="box warn"><span class="h">메토트렉세이트는 '매일'이 아니에요</span>
<p>메토트렉세이트는 보통 <strong>일주일에 한 번</strong> 정해진 요일에 먹어요. 실수로 매일 먹으면 골수 억제 등 심각한 부작용이 생길 수 있어요. 요일을 달력에 표시하고, 임신 계획이 있으면 미리 의사와 상의해요.</p></div>

<h2>치료 중 감염 예방</h2>
<ul>
<li>면역을 조절하는 약을 쓰면 감염에 약해질 수 있어요.</li>
<li><strong>독감, 폐렴구균, 대상포진(재조합 사백신)</strong> 예방접종을 의사와 상의해 맞아요. 생백신은 약에 따라 피해야 할 수 있어요.</li>
<li>생물학적 제제나 JAK 억제제 시작 전에 <strong>잠복결핵 검사</strong>를 받고, 양성이면 결핵 예방 치료를 함께 해요.</li>
<li>열이 나거나 감염 증상이 있으면 약을 계속 써도 되는지 바로 문의해요.</li>
</ul>

<h2>관절 밖의 건강</h2>
<ul>
<li>류마티스 관절염은 <strong>심혈관 질환</strong> 위험을 높여요. 혈압, 콜레스테롤, 혈당을 관리하고 금연해요.</li>
<li>염증과 스테로이드 때문에 <strong>골다공증</strong>이 생기기 쉬워 골밀도 검사를 받아요.</li>
<li>마른기침과 숨참이 계속되면 폐 합병증(간질성 폐질환)을 확인해요.</li>
<li>눈이 마르고 입이 마르는 증상이 함께 올 수 있어요.</li>
</ul>

<h2>운동과 생활</h2>
<ul>
<li>관절이 심하게 부었을 때는 쉬고, 가라앉으면 <strong>관절 가동 운동, 근력 운동, 걷기·수영·실내자전거</strong>를 꾸준히 해요.</li>
<li><strong>흡연</strong>은 류마티스 관절염의 위험 요인이자 약 효과를 떨어뜨려요. 끊는 게 좋아요.</li>
<li>손목 보호대, 손잡이가 굵은 도구 등 보조 기구가 관절 부담을 줄여요.</li>
<li>피로와 우울감도 흔해요. 충분히 쉬고, 필요하면 도움을 청해요.</li>
</ul>

<div class="box"><span class="h">류마티스 관절염 체크리스트</span>
<ol>
<li>손가락 관절이 6주 넘게 부으면 류마티스내과</li>
<li>진단되면 항류마티스제 바로 시작</li>
<li>메토트렉세이트는 주 1회, 엽산 함께</li>
<li>정기 혈액 검사로 부작용 확인</li>
<li>예방접종·결핵 검사 챙기기</li>
<li>금연, 운동, 심혈관·뼈 건강 관리</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>류마티스 관절염은 완치되나요?</dt>
<dd>완치보다는 증상과 염증이 거의 없는 '관해' 상태를 목표로 해요. 관해가 오래 유지되면 약을 조심스럽게 줄이기도 해요. 스스로 끊으면 재발할 수 있어요.</dd>
<dt>음식으로 좋아질 수 있나요?</dt>
<dd>특정 음식이 류마티스 관절염을 낫게 한다는 근거는 없어요. 채소, 생선, 올리브유가 많은 지중해식 식사가 전반적인 건강과 심혈관 위험에 도움이 될 수 있어요.</dd>
<dt>임신할 수 있나요?</dt>
<dd>할 수 있어요. 다만 메토트렉세이트, 레플루노마이드 같은 약은 임신 전에 끊어야 하고, 임신 중에 쓸 수 있는 약으로 바꿔야 해요. 계획 단계부터 의사와 상의해요.</dd>
</dl>
