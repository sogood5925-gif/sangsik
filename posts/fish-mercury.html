  data-title="생선과 수은: 생선은 계속 먹되 큰 생선은 줄이기, 임신부·아이의 일주일 섭취 기준"
  data-thumb="400g|임신부 주간 생선"
  data-summary="생선은 단백질과 오메가-3 지방산이 풍부한 좋은 식품이지만, 큰 육식성 생선에는 메틸수은이 쌓여 있어요. 수은이 생선에 쌓이는 이유, 수은이 많은 생선과 적은 생선, 임신부·수유부와 어린이를 위한 식약처 주간 섭취 기준, 참치 통조림, 생선을 먹지 않을 때 잃는 것을 정리했어요."
  data-tags="생선,수은,임신부,참치,영양소">
<p class="lead">"임신 중에 생선을 먹어도 될까?" 많이들 고민해요. 생선은 아기의 뇌와 눈 발달에 중요한 DHA를 주는 좋은 식품이에요. 문제는 일부 큰 생선에 쌓인 수은이에요. 생선을 끊기보다 <strong>어떤 생선을 얼마나</strong> 먹을지 고르는 것이 답이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>수은은 <strong>먹이사슬 위쪽의 크고 오래 사는 생선</strong>(다랑어, 새치, 상어)에 많이 쌓여요.</li>
<li>임신부·수유부는 일반 생선을 <strong>일주일 400g 이하</strong>, 다랑어·새치·상어류는 <strong>100g 이하</strong>로 먹어요.</li>
<li>고등어, 연어, 멸치, 조기처럼 <strong>작거나 중간 크기 생선</strong>은 수은이 적고 오메가-3가 많아요.</li>
<li>생선을 아예 피하면 <strong>DHA와 단백질</strong>을 잃어요. 골라서 꾸준히 먹는 편이 좋아요.</li>
</ul></div>

<h2>수은은 왜 생선에 쌓일까</h2>
<p>바다와 강으로 들어간 수은은 미생물에 의해 <strong>메틸수은</strong>으로 바뀌어 플랑크톤, 작은 물고기, 큰 물고기 순서로 쌓여요. 몸 밖으로 잘 빠지지 않아, 크고 오래 사는 육식성 생선일수록 농도가 높아요. 메틸수은은 태반을 통과하고, 자라는 아기의 뇌와 신경에 영향을 줄 수 있어 임신부와 어린아이가 특히 조심해요. 익히거나 손질해도 줄어들지 않아요.</p>

<h2>수은이 많은 생선과 적은 생선</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>예</th></tr></thead>
<tbody>
<tr><td>수은이 많은 편</td><td>다랑어(참치회·참다랑어·눈다랑어), 황새치·청새치 등 새치류, 상어류, 고래고기</td></tr>
<tr><td>일반 생선(비교적 적음)</td><td>고등어, 꽁치, 삼치(작은 것), 연어, 갈치, 조기, 가자미, 명태, 대구, 멸치, 오징어, 새우, 조개류</td></tr>
<tr><td>참치 통조림</td><td>주로 가다랑어 등 작은 참치류로 만들어 일반 생선과 같은 기준으로 봐요</td></tr>
</tbody>
<caption>식품의약품안전처 임신부·어린이 생선 섭취 가이드, 미국 식품의약국(FDA)·환경보호청(EPA) Advice about Eating Fish를 바탕으로 정리</caption></table></div>

<h2>일주일 섭취 기준</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th class="num">일반 어류·참치 통조림</th><th class="num">다랑어·새치·상어류</th></tr></thead>
<tbody>
<tr><td>임신부·수유부</td><td class="num">주 400g 이하</td><td class="num">주 100g 이하</td></tr>
<tr><td>1~2세</td><td class="num">주 100g 이하</td><td class="num">주 25g 이하</td></tr>
<tr><td>3~6세</td><td class="num">주 150g 이하</td><td class="num">주 40g 이하</td></tr>
<tr><td>7~10세</td><td class="num">주 250g 이하</td><td class="num">주 65g 이하</td></tr>
</tbody>
<caption>식품의약품안전처, 임신부·어린이 대상 생선 섭취 권고. 다랑어·새치·상어류를 먹은 주에는 다른 생선을 줄여요</caption></table></div>
<p>생선 한 토막(구이용)은 대략 60~100g이에요. 임신부라면 고등어나 조기 같은 일반 생선을 <strong>일주일에 3~4번</strong> 정도 먹는 셈이에요.</p>

<h2>생선을 먹어야 하는 이유</h2>
<ul>
<li><strong>DHA·EPA:</strong> 아기의 뇌와 눈 발달, 어른의 심혈관 건강에 도움이 돼요.</li>
<li><strong>양질의 단백질, 비타민 D, 요오드, 셀레늄</strong></li>
<li>임신 중 생선을 적당히 먹은 엄마의 아이가 신경 발달 검사에서 더 좋은 결과를 보였다는 연구가 있어요.</li>
</ul>
<p>그래서 기관들은 임신부에게 생선을 <strong>피하라</strong>가 아니라 <strong>수은이 적은 생선을 골라 먹으라</strong>고 권해요.</p>

<div class="box warn"><span class="h">이것만은 피해요</span>
<ul>
<li>임신 중 <strong>참치회, 황새치, 상어</strong>를 자주 먹는 것</li>
<li>낚시로 잡은 생선을 수질을 모르는 강·호수에서 자주 먹는 것</li>
<li>임신 중 <strong>날생선·덜 익힌 생선</strong>(리스테리아, 기생충 위험). 익혀 먹는 것이 안전해요.</li>
<li>어린아이에게 큰 생선 회나 초밥을 자주 주는 것</li>
</ul></div>

<h2>똑똑하게 먹는 법</h2>
<ul>
<li>한 종류만 먹지 말고 <strong>여러 생선을 번갈아</strong> 먹어요.</li>
<li>고등어, 연어, 꽁치처럼 <strong>오메가-3가 많고 수은이 적은</strong> 생선을 자주 골라요.</li>
<li>참치회·초밥을 먹은 주에는 다른 생선을 줄여요.</li>
<li>생선이 싫다면 멸치, 새우, 조개류로 시작해 보고, 필요하면 의사와 오메가-3 보충제를 상의해요.</li>
</ul>

<div class="box"><span class="h">생선 섭취 체크리스트</span>
<ol>
<li>작거나 중간 크기 생선 위주</li>
<li>임신부 일반 생선 주 400g 이하</li>
<li>다랑어·새치·상어는 주 100g 이하</li>
<li>아이는 나이별 기준 확인</li>
<li>여러 생선 번갈아 먹기</li>
<li>임신 중엔 익혀 먹기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>참치 통조림도 줄여야 하나요?</dt>
<dd>참치 통조림은 주로 작은 참치로 만들어 일반 생선과 같은 기준을 적용해요. 임신부는 다른 생선과 합쳐 일주일 400g 안에서 먹으면 돼요.</dd>
<dt>임신 전에 참치회를 많이 먹었는데 괜찮을까요?</dt>
<dd>메틸수은은 시간이 지나면 몸에서 서서히 빠져나가요. 걱정된다면 지금부터 기준을 지키고, 불안하면 산부인과에서 상담해요.</dd>
<dt>수은 때문에 오메가-3 보충제만 먹는 게 낫지 않나요?</dt>
<dd>보충제는 정제 과정에서 수은이 거의 제거돼요. 하지만 생선에는 단백질, 비타민 D, 요오드 등도 있어 가능하면 생선으로 먹는 것을 권해요.</dd>
</dl>
