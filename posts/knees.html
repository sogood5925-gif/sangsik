  data-title="무릎 건강: 체중 1kg이 무릎에는 4kg, 허벅지 근육과 생활 습관으로 지키기"
  data-thumb="1kg=4kg|걸을 때 무릎 부담"
  data-summary="무릎은 평생 체중을 받치며 가장 많이 쓰는 관절이에요. 체중과 무릎 부담의 관계, 나이대별 흔한 무릎 통증(슬개대퇴통증, 반월상연골판 파열, 퇴행성 관절염), 무릎을 지키는 허벅지·엉덩이 근력 운동, 쪼그려 앉기와 계단 같은 생활 습관, 운동 중 부상 예방, 진료가 필요한 신호를 정리했어요."
  data-tags="무릎건강,허벅지근력,반월상연골판,무릎통증,건강상식">
<p class="lead">무릎은 걸을 때마다 몸무게의 몇 배에 이르는 힘을 받아요. 그래서 무릎을 지키는 일은 무릎 자체보다 <strong>무릎을 둘러싼 근육과 몸무게, 생활 습관</strong>을 돌보는 일에 가까워요. 아프기 시작한 뒤보다 아프기 전에 시작할수록 효과가 커요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>걸을 때 체중 1kg이 줄면 무릎에 실리는 부담은 약 <strong>4kg</strong> 줄어요.</li>
<li><strong>허벅지 앞쪽과 엉덩이 근육</strong>이 튼튼하면 무릎 관절이 받는 충격이 줄어요.</li>
<li><strong>쪼그려 앉기, 무릎 꿇기, 양반다리</strong>를 오래 하는 습관은 무릎 부담이 커요.</li>
<li>무릎이 <strong>붓고 걸리거나 풀리는 느낌</strong>이 있으면 연골판·인대 손상일 수 있어 진료를 받아요.</li>
</ul></div>

<h2>무릎은 얼마나 힘을 받을까</h2>
<p>평지를 걸을 때 무릎에는 체중의 약 2~3배, 계단을 오를 때는 3~4배, 쪼그려 앉을 때는 그보다 더 큰 힘이 실린다고 알려져 있어요. 무릎 관절염이 있는 과체중 성인을 대상으로 한 연구에서는 <strong>체중 1kg을 줄일 때마다 걸음마다 무릎 부담이 약 4kg 줄었어요.</strong> 하루 수천 걸음을 생각하면 적지 않은 차이예요.</p>

<h2>나이대별 흔한 무릎 통증</h2>
<div class="tbl"><table>
<thead><tr><th>질환</th><th>잘 생기는 사람</th><th>특징</th></tr></thead>
<tbody>
<tr><td>슬개대퇴통증증후군</td><td>10~30대, 달리기·점프 운동을 하는 사람, 여성</td><td>무릎 앞쪽 뻐근함. 계단 내려갈 때, 오래 앉았다 일어날 때 아파요</td></tr>
<tr><td>반월상연골판 파열</td><td>운동 중 비틀린 젊은 사람, 쪼그려 앉는 중년 이후</td><td>무릎이 걸리는 느낌, 붓기, 완전히 펴지지 않음</td></tr>
<tr><td>전방십자인대 파열</td><td>축구, 농구, 스키 등 방향 전환이 많은 운동</td><td>'뚝' 소리와 함께 붓고, 무릎이 빠지는 듯 불안정해요</td></tr>
<tr><td>퇴행성 관절염</td><td>50대 이후, 과체중, 과거 부상</td><td>움직이면 아프고 쉬면 나아요. 짧은 아침 뻣뻣함</td></tr>
<tr><td>거위발 건염·점액낭염</td><td>중년 여성, 계단 많이 오르는 사람</td><td>무릎 안쪽 아래가 누르면 아파요</td></tr>
</tbody>
<caption>대한정형외과학회, 대한슬관절학회 건강 정보를 바탕으로 정리</caption></table></div>

<h2>무릎을 지키는 근력 운동</h2>
<div class="tbl"><table>
<thead><tr><th>운동</th><th>방법</th><th>횟수</th></tr></thead>
<tbody>
<tr><td>앉아서 다리 펴기</td><td>의자에 앉아 한쪽 다리를 쭉 펴고 발끝을 몸 쪽으로 당겨 5초 버텨요</td><td>양쪽 10~15번 × 2~3세트</td></tr>
<tr><td>누워서 다리 들기</td><td>누워 한쪽 무릎을 세우고, 다른 다리는 편 채 30cm 들어 5초</td><td>10~15번 × 2~3세트</td></tr>
<tr><td>옆으로 누워 다리 들기</td><td>엉덩이 바깥 근육(중둔근)을 키워 무릎이 안으로 꺾이는 것을 막아요</td><td>10~15번 × 2~3세트</td></tr>
<tr><td>벽에 기대 살짝 앉기</td><td>등을 벽에 대고 무릎을 30~45도만 굽혀 버텨요. 통증 없는 범위에서</td><td>20~30초 × 3~5번</td></tr>
<tr><td>의자에서 일어나기</td><td>팔을 쓰지 않고 천천히 일어나고 앉기</td><td>10번 × 2~3세트</td></tr>
</tbody>
<caption>국제골관절염학회(OARSI), 미국정형외과학회(AAOS) 무릎 운동 프로그램을 바탕으로 정리</caption></table></div>
<p>일주일에 2~3번, 통증이 없거나 약간 뻐근한 정도로 해요. 다음 날까지 통증이 심해지면 강도를 줄여요.</p>

<h2>생활 속 무릎 습관</h2>
<ul>
<li><strong>쪼그려 앉기, 무릎 꿇기, 양반다리</strong>를 오래 하지 않아요. 좌식보다 의자, 바닥보다 침대 생활이 무릎에 편해요.</li>
<li>걸레질, 텃밭 일처럼 쪼그려 하는 일은 낮은 의자를 쓰거나 자주 일어나 쉬어요.</li>
<li><strong>계단</strong>은 오를 때보다 내려갈 때 부담이 커요. 난간을 잡고, 무릎이 아프다면 엘리베이터를 써요.</li>
<li><strong>등산</strong>에는 스틱을 쓰고, 내리막은 천천히, 보폭을 줄여요.</li>
<li><strong>신발</strong>은 쿠션이 있고 발을 잘 잡아 주는 것으로. 높은 굽은 무릎 앞쪽 부담을 늘려요.</li>
<li>오래 앉아 있을 때는 30분~1시간마다 일어나 무릎을 움직여요.</li>
</ul>

<h2>운동 중 부상 예방</h2>
<ul>
<li>운동 전 5~10분 가볍게 몸을 데우고, 운동량은 한 주에 10% 정도씩 늘려요.</li>
<li>점프 후 착지할 때 무릎이 <strong>안쪽으로 꺾이지 않게</strong>, 무릎과 엉덩이를 함께 굽혀 부드럽게 착지해요.</li>
<li>축구, 농구 같은 운동을 하는 청소년과 여성은 근력·균형·착지 훈련을 포함한 부상 예방 프로그램이 십자인대 부상을 줄여요.</li>
<li>무릎이 아픈 날은 수영, 실내 자전거처럼 충격이 적은 운동으로 바꿔요.</li>
</ul>

<div class="box warn"><span class="h">진료가 필요한 신호</span>
<ul>
<li>다친 뒤 무릎이 <strong>빠르게 붓고</strong> 체중을 싣기 어려워요.</li>
<li>무릎이 <strong>걸려서 안 펴지거나</strong>, 걷다가 <strong>힘없이 풀려요.</strong></li>
<li>무릎이 빨갛고 뜨겁고 열이 나요(감염, 통풍 가능성).</li>
<li>종아리까지 붓고 아파요(혈전 가능성).</li>
<li>쉬어도, 밤에도 계속 아프고 몇 주째 나아지지 않아요.</li>
</ul></div>

<div class="box"><span class="h">무릎 건강 체크리스트</span>
<ol>
<li>허벅지·엉덩이 근력 운동 주 2~3회</li>
<li>과체중이면 체중부터 조금씩</li>
<li>쪼그려 앉기·무릎 꿇기 줄이기</li>
<li>계단 내려갈 땐 난간, 등산엔 스틱</li>
<li>쿠션 있는 신발</li>
<li>붓기·걸림·풀림은 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>무릎에서 '뚝뚝' 소리가 나요.</dt>
<dd>통증 없이 나는 소리는 관절 안의 기체나 힘줄이 움직이는 소리로 대개 괜찮아요. 소리와 함께 통증, 붓기, 걸림이 있다면 진료를 받아요.</dd>
<dt>달리기는 무릎에 나쁜가요?</dt>
<dd>여러 연구에서 적당한 달리기는 오히려 관절염 위험을 높이지 않았어요. 갑자기 거리를 늘리거나 체중이 많이 나갈 때, 이미 무릎이 아플 때는 조심해요.</dd>
<dt>무릎 보호대는 도움이 되나요?</dt>
<dd>불안정감이나 통증이 있을 때 일시적으로 도움이 될 수 있어요. 하지만 보호대에만 의지하면 근육이 약해질 수 있어 근력 운동을 함께 해요.</dd>
</dl>
