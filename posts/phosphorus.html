  data-title="인: 부족보다 과잉을 걱정하는 무기질, 가공식품 첨가물과 콩팥병 환자의 주의점"
  data-thumb="700mg|성인 권장섭취량"
  data-summary="인은 뼈와 치아, 에너지 대사에 꼭 필요한 무기질이에요. 대부분의 사람은 충분히, 오히려 넘치게 먹고 있어요. 권장섭취량과 많이 든 음식, 가공식품의 인산염 첨가물이 흡수가 잘 되는 이유, 만성 콩팥병 환자가 인을 조절해야 하는 이유와 방법을 정리했어요."
  data-tags="인,인산염,만성콩팥병,가공식품,영양소">
<p class="lead">인은 몸에서 칼슘 다음으로 많은 무기질이에요. 뼈와 치아를 이루고, 모든 세포가 에너지를 쓰는 데 필요해요. 그런데 요즘 식사에서는 부족보다 <strong>과잉</strong>이 더 문제예요. 특히 가공식품에 들어가는 인산염은 흡수가 잘 되어, 콩팥이 약한 사람에게는 부담이 될 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인 권장섭취량은 하루 <strong>700mg</strong>이고, 대부분 이보다 많이 먹고 있어요.</li>
<li>인은 <strong>우유, 고기, 생선, 콩, 곡물</strong>처럼 단백질 식품에 널리 들어 있어요.</li>
<li>가공식품의 <strong>인산염 첨가물</strong>은 90% 가까이 흡수돼 음식 속 인보다 몸에 더 많이 들어가요.</li>
<li><strong>만성 콩팥병</strong>이 있으면 인이 쌓여 뼈와 혈관을 상하게 할 수 있어 식사 조절이 필요해요.</li>
</ul></div>

<h2>인이 하는 일</h2>
<ul>
<li>몸속 인의 약 85%는 칼슘과 함께 <strong>뼈와 치아</strong>에 있어요.</li>
<li>에너지 저장 물질인 <strong>ATP</strong>의 핵심 성분이에요.</li>
<li>세포막(인지질)과 DNA의 뼈대를 이루어요.</li>
<li>혈액의 산·염기 균형을 맞추는 데 쓰여요.</li>
</ul>

<h2>하루에 얼마나</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th class="num">권장섭취량(하루)</th></tr></thead>
<tbody>
<tr><td>성인(19세 이상)</td><td class="num">700mg</td></tr>
<tr><td>청소년(12~18세)</td><td class="num">1,200mg</td></tr>
<tr><td>상한섭취량(성인)</td><td class="num">3,500mg(65세 이상 3,000mg)</td></tr>
</tbody>
<caption>보건복지부·한국영양학회, 2020 한국인 영양소 섭취기준</caption></table></div>
<p>국민건강영양조사에서 한국 성인의 평균 인 섭취량은 권장섭취량을 넉넉히 넘어요. 가공식품 첨가물로 먹는 양은 식품성분표에 잘 잡히지 않아 실제로는 더 많을 수 있어요.</p>

<h2>많이 든 음식과 흡수율</h2>
<div class="tbl"><table>
<thead><tr><th>인의 출처</th><th>예</th><th class="num">흡수율(대략)</th></tr></thead>
<tbody>
<tr><td>식품 첨가물(인산염)</td><td>햄, 소시지, 어묵, 가공치즈, 콜라, 즉석식품, 냉동식품, 일부 빵·과자</td><td class="num">약 80~100%</td></tr>
<tr><td>동물성 식품</td><td>고기, 생선, 달걀, 우유·치즈</td><td class="num">약 40~60%</td></tr>
<tr><td>식물성 식품</td><td>콩, 견과류, 통곡물(피트산 형태)</td><td class="num">약 20~50%</td></tr>
</tbody>
<caption>대한신장학회, 미국 국립신장재단(NKF) 인 조절 식사 안내를 바탕으로 정리</caption></table></div>
<p>같은 양의 인이라도 <strong>첨가물 인이 가장 잘 흡수</strong>되고, 통곡물과 콩의 인은 피트산과 결합해 있어 덜 흡수돼요.</p>

<h2>가공식품 속 인산염 찾기</h2>
<ul>
<li>원재료명에서 <strong>'인산'이 들어간 이름</strong>을 찾아요. 예: 인산나트륨, 피로인산나트륨, 폴리인산나트륨, 메타인산나트륨, 인산칼슘, 인산(콜라류).</li>
<li>인산염은 햄과 소시지를 촉촉하게, 가공치즈를 매끄럽게, 빵을 부풀게 하는 등 여러 목적으로 쓰여요.</li>
<li>영양성분표에 인 함량이 적혀 있지 않은 제품이 많아 원재료명을 보는 것이 가장 확실해요.</li>
</ul>

<h2>만성 콩팥병과 인</h2>
<p>콩팥은 남는 인을 소변으로 내보내요. 콩팥 기능이 떨어지면 인이 혈액에 쌓이고, 이를 맞추려고 뼈에서 칼슘이 빠져나가며 부갑상선 호르몬이 늘어요. 그 결과 <strong>뼈가 약해지고, 혈관과 심장 판막에 칼슘이 쌓여</strong> 심혈관 질환 위험이 높아져요. 피부 가려움도 흔해요.</p>
<div class="box note"><span class="h">콩팥병 환자의 인 조절 요령</span>
<ul>
<li><strong>가공식품과 인산염 첨가물</strong>을 가장 먼저 줄여요. 효과가 가장 커요.</li>
<li>콜라 대신 물이나 인산이 없는 음료를 마셔요.</li>
<li>우유·치즈·요구르트는 양을 정해 먹어요.</li>
<li>단백질을 너무 줄이면 영양 부족이 생겨요. 단백질 양은 병기와 투석 여부에 따라 의사·영양사와 정해요.</li>
<li>처방받은 <strong>인 결합제</strong>는 식사와 함께(보통 첫 숟가락과 함께) 먹어야 효과가 있어요.</li>
</ul></div>

<h2>인이 부족한 경우</h2>
<p>보통 식사로 부족하기는 어려워요. 하지만 다음 상황에서는 혈중 인이 낮아질 수 있어요.</p>
<ul>
<li>오래 굶거나 영양실조였던 사람이 갑자기 많이 먹기 시작할 때(재급식 증후군): 근육 약화, 호흡 곤란, 심장 문제가 생길 수 있어 의료진이 인을 확인하며 식사를 늘려요.</li>
<li>과음, 알루미늄·마그네슘이 든 제산제를 오래 많이 먹을 때</li>
<li>일부 유전 질환, 부갑상선 기능 항진증</li>
</ul>

<h2>칼슘과 인의 균형</h2>
<p>인은 칼슘과 함께 뼈를 만들어요. 인을 지나치게 많이 먹고 칼슘은 적게 먹는 식사가 오래가면 뼈 건강에 불리할 수 있다는 연구가 있어요. 가공식품과 탄산음료를 줄이고 칼슘 식품을 챙기면 균형을 맞추기 쉬워요.</p>

<div class="box"><span class="h">인 섭취 체크리스트</span>
<ol>
<li>햄·소시지·가공치즈·즉석식품 줄이기</li>
<li>원재료명에서 '인산' 찾아보기</li>
<li>콜라 대신 물</li>
<li>칼슘 식품도 함께 챙기기</li>
<li>콩팥병이면 인 조절 식사를 영양사와 상담</li>
<li>인 결합제는 식사와 함께</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>건강한 사람도 인을 줄여야 하나요?</dt>
<dd>콩팥 기능이 정상이라면 남는 인을 잘 내보내요. 다만 가공식품을 줄이면 나트륨, 첨가당도 함께 줄어 건강에 이로워요.</dd>
<dt>콩팥병이면 우유를 아예 못 마시나요?</dt>
<dd>병기에 따라 달라요. 초기에는 양을 조절하면 되는 경우가 많고, 투석 중이라면 더 엄격하게 제한하기도 해요. 혈액 검사 결과를 보고 영양사와 정해요.</dd>
<dt>통곡물은 인이 많은데 콩팥병 환자에게 나쁜가요?</dt>
<dd>통곡물의 인은 흡수율이 낮고 식이섬유 등 이점이 있어, 최근에는 무조건 피하기보다 가공식품의 인을 줄이는 것을 더 중요하게 봐요. 칼륨 조절이 필요한지도 함께 확인해요.</dd>
</dl>
