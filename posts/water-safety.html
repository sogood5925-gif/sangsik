  data-title="물놀이 안전: 익수는 조용히 일어난다, 구명조끼·이안류·구조 방법"
  data-thumb="팔 길이|아이와의 거리"
  data-summary="물에 빠진 사람은 소리치거나 손을 흔들 여유가 없어 조용히 가라앉는 경우가 많아요. 아이 물놀이 때 지켜야 할 거리, 구명조끼 고르는 법, 계곡과 바다의 위험 지형, 이안류에 휩쓸렸을 때 탈출법, 물에 빠진 사람을 안전하게 돕는 순서를 정리했어요."
  data-tags="물놀이,익수,구명조끼,이안류,생활정보">
<p class="lead">영화처럼 허우적거리며 소리치는 모습은 실제 익수와 달라요. 물에 빠진 사람은 입이 물 위아래를 오가며 숨 쉬기에 바빠 <strong>소리를 내지 못하고</strong>, 팔로 물을 누르느라 손을 흔들지도 못해요. 그래서 물가에서는 눈을 떼지 않는 것이 가장 중요해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>아이는 물가에서 <strong>어른이 팔을 뻗으면 닿는 거리</strong>에 둬요. 휴대폰은 내려놓아요.</li>
<li>물에 들어갈 때는 <strong>몸에 맞는 구명조끼</strong>를 입어요. 튜브는 구명 장비가 아니에요.</li>
<li>바다에서 해안 반대쪽으로 끌려가면 <strong>해안과 나란히 옆으로</strong> 헤엄쳐 빠져나와요.</li>
<li>빠진 사람을 구할 때는 <strong>직접 뛰어들지 말고</strong> 119 신고 후 물건을 던져 줘요.</li>
</ul></div>

<h2>익수는 이렇게 보여요</h2>
<ul>
<li>머리가 물에 잠겼다 떴다 하고, 입이 수면 가까이 있어요.</li>
<li>고개를 뒤로 젖히고 입을 벌리고 있어요.</li>
<li>눈이 초점 없이 멍하거나 감겨 있어요.</li>
<li>몸이 수직으로 서 있고 다리를 거의 움직이지 않아요.</li>
<li>사다리를 오르듯 팔을 물 아래로 누르는 동작을 해요.</li>
</ul>
<p>"괜찮아?" 하고 불렀을 때 대답이 없다면 바로 도움이 필요해요. 아이가 물에서 갑자기 조용해지는 것도 위험 신호예요.</p>

<h2>아이 물놀이 안전</h2>
<ul>
<li>보호자는 물가에서 <strong>휴대폰을 보지 않고</strong> 아이만 지켜요. 여럿이 있을 때는 '지금 지켜보는 사람'을 정해 교대해요.</li>
<li>얕은 물, 욕조, 수영장 튜브 안에서도 사고가 나요. 어린아이는 몇 센티미터 물에서도 빠질 수 있어요.</li>
<li>물놀이 시설의 안전 수칙과 수심 표시를 확인하고, 안전요원이 있는 곳에서 놀아요.</li>
<li>아이 혼자 물가에 가지 않게 약속하고, 수영을 배웠어도 방심하지 않아요.</li>
</ul>

<h2>구명조끼 고르기</h2>
<div class="tbl"><table>
<thead><tr><th>확인할 것</th><th>이유</th></tr></thead>
<tbody>
<tr><td>몸무게에 맞는 크기</td><td>크면 물속에서 벗겨지거나 얼굴 위로 올라와요</td></tr>
<tr><td>가랑이 끈(아이용)</td><td>조끼가 위로 빠지는 것을 막아요</td></tr>
<tr><td>목 뒤 받침(유아용)</td><td>얼굴이 물 위로 향하도록 도와요</td></tr>
<tr><td>안전 인증 표시</td><td>부력 기준을 통과한 제품인지 확인해요</td></tr>
<tr><td>착용 후 들어 올려 보기</td><td>어깨를 잡고 들어 올렸을 때 턱과 귀까지 올라오지 않으면 잘 맞는 거예요</td></tr>
</tbody>
<caption>해양경찰청·행정안전부 물놀이 안전 수칙을 바탕으로 정리</caption></table></div>
<p>팔에 끼우는 튜브, 목 튜브, 고무보트는 놀이 기구예요. 뒤집히거나 바람이 빠질 수 있어 구명조끼를 대신하지 못해요.</p>

<h2>계곡과 강의 위험</h2>
<ul>
<li>계곡은 갑자기 <strong>깊어지는 곳</strong>과 물살이 빠른 곳이 많아요. 물 색이 짙은 곳은 깊어요.</li>
<li>상류에 비가 오면 맑은 날에도 <strong>물이 순식간에 불어나요.</strong> 물이 흐려지고 나뭇가지가 떠내려오면 바로 나와요.</li>
<li>바위는 이끼 때문에 매우 미끄러워요.</li>
<li>다이빙은 수심과 바닥 상태를 모르는 곳에서 절대 하지 않아요. 머리와 목을 다쳐 마비가 올 수 있어요.</li>
<li>물놀이 전 <strong>음주</strong>는 익수 사고의 주요 원인이에요.</li>
</ul>

<h2>바다의 이안류</h2>
<p>이안류는 해안으로 밀려온 파도가 좁은 길을 따라 <strong>먼바다 쪽으로 빠르게 빠져나가는 물살</strong>이에요. 수영을 잘하는 사람도 물살을 거슬러 해안 쪽으로 헤엄치면 금방 지쳐요.</p>
<div class="box note"><span class="h">이안류에 휩쓸렸을 때</span>
<ol>
<li>당황하지 말고 몸에 힘을 빼 물에 떠요.</li>
<li><strong>해안과 나란히 옆으로</strong> 헤엄쳐 물살 밖으로 나와요. 이안류는 폭이 좁은 편이에요.</li>
<li>물살에서 벗어나면 비스듬히 해안으로 헤엄쳐요.</li>
<li>힘이 빠지면 누운 자세로 떠서 손을 들어 도움을 청해요.</li>
</ol></div>

<h2>물에 빠진 사람을 봤을 때</h2>
<div class="tbl"><table>
<thead><tr><th>순서</th><th>행동</th></tr></thead>
<tbody>
<tr><td>1. 알리기</td><td>큰 소리로 주변과 안전요원에게 알리고 <strong>119</strong>에 신고해요</td></tr>
<tr><td>2. 던지기</td><td>구명환, 튜브, 페트병, 아이스박스처럼 뜨는 물건을 던져 줘요</td></tr>
<tr><td>3. 뻗기</td><td>막대기, 긴 옷, 수건을 뻗어 잡게 해요. 몸을 낮추고 끌려가지 않게 해요</td></tr>
<tr><td>4. 직접 들어가기는 마지막</td><td>구조 훈련을 받지 않았다면 뛰어들지 않아요. 물에 빠진 사람이 필사적으로 붙잡아 함께 가라앉는 일이 많아요</td></tr>
</tbody></table></div>
<div class="box warn"><span class="h">구조한 뒤</span>
<p>반응이 없고 정상적으로 숨을 쉬지 않으면 바로 <strong>심폐소생술</strong>을 시작해요. 물을 빼려고 배를 누르거나 거꾸로 들지 않아요. 숨을 쉬고 의식이 돌아와도 물을 많이 삼켰다면 몇 시간 뒤 숨이 차거나 기침이 심해질 수 있어 진료를 받아요.</p></div>

<h2>물에 빠졌을 때 스스로 버티기</h2>
<ul>
<li>팔다리를 크게 벌리고 <strong>하늘을 보고 누워</strong> 떠요. 폐의 공기가 몸을 띄워 줘요.</li>
<li>옷과 신발은 벗지 않아요. 공기를 머금어 뜨는 데 도움이 될 수 있어요.</li>
<li>떠 있으면서 손을 들어 도움을 청해요.</li>
</ul>

<div class="box"><span class="h">물놀이 체크리스트</span>
<ol>
<li>아이는 팔 뻗으면 닿는 거리, 휴대폰 내려놓기</li>
<li>몸에 맞는 구명조끼 입히기</li>
<li>안전요원 있는 곳, 수심 표시 확인</li>
<li>물놀이 전 음주하지 않기</li>
<li>계곡 물이 흐려지면 바로 나오기</li>
<li>구조는 알리기·던지기·뻗기 순서로</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>밥 먹고 바로 수영하면 위험한가요?</dt>
<dd>식사 직후 수영이 익수를 일으킨다는 근거는 약해요. 다만 배가 불러 불편하거나 술을 함께 마셨다면 쉬었다 들어가는 게 좋아요.</dd>
<dt>'마른 익수'라는 게 있나요?</dt>
<dd>의학적으로 정해진 용어는 아니지만, 물을 많이 삼키거나 들이마신 뒤 몇 시간 안에 기침, 숨참, 심한 피로가 생길 수 있어요. 이런 증상이 있으면 진료를 받아요.</dd>
<dt>수영장에서도 구명조끼가 필요한가요?</dt>
<dd>수영을 못하는 어린아이는 수영장에서도 구명조끼를 입히고 보호자가 가까이 있어요. 수심이 깊은 곳과 아이 키보다 깊은 풀은 특히 조심해요.</dd>
</dl>
