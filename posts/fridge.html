<p class="lead">냉장고는 음식을 '멈추게' 하는 기계가 아니라 '느리게' 하는 기계예요. 이 차이를 알면 냉장고를 쓰는 방식이 꽤 달라져요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>냉장실은 <strong>5°C 이하</strong>, 냉동실은 <strong>−18°C 이하</strong>로 맞춰요.</li>
<li>세균이 빠르게 늘어나는 온도는 대략 <strong>5~60°C</strong>예요. 음식이 이 구간에 머무는 시간을 줄이는 게 핵심이에요.</li>
<li>냉장고는 <strong>70% 정도만</strong> 채우고, 문 칸에는 온도에 민감한 식품을 두지 않아요.</li>
<li>2023년부터 식품 날짜는 유통기한이 아니라 <strong>소비기한</strong>으로 표시돼요.</li>
</ul></div>

<h2>냉장고는 세균을 죽이지 않는다</h2>
<p>식중독을 일으키는 세균 대부분은 사람 체온 근처에서 가장 빨리 늘어나요. 온도가 내려갈수록 증식 속도가 느려지고, 5°C 아래에서는 대부분의 세균이 거의 늘지 못해요. 하지만 죽는 것은 아니에요. 다시 따뜻해지면 멈췄던 증식이 이어져요.</p>
<p>게다가 <strong>리스테리아균</strong>처럼 냉장 온도에서도 천천히 자라는 세균이 있어요. 그래서 "냉장고에 넣어뒀으니 괜찮다"는 생각보다 "냉장고에서 얼마나 오래 있었나"를 따지는 습관이 더 중요해요.</p>
<p>냉동은 조금 달라요. −18°C 아래에서는 세균이 사실상 증식하지 못해요. 다만 이것도 멈춘 것일 뿐이라, 녹이는 순간부터 다시 시간이 흐르기 시작해요.</p>

<h2>적정 온도: 숫자로 확인하기</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>권장 온도</th><th>설명</th></tr></thead>
<tbody>
<tr><td>냉장실</td><td class="num">0~5°C</td><td>식품 관련 법령상 냉장은 0~10°C 범위지만, 식품의약품안전처는 가정 냉장고를 5°C 이하로 유지하길 권해요.</td></tr>
<tr><td>냉동실</td><td class="num">−18°C 이하</td><td>세균 증식이 멈추는 온도예요. 품질 유지를 위해서도 이 이하가 좋아요.</td></tr>
<tr><td>위험 온도대</td><td class="num">약 5~60°C</td><td>세균이 빠르게 늘어나는 구간이에요. 조리한 음식을 이 온도에 오래 두지 않아요.</td></tr>
<tr><td>재가열</td><td class="num">중심 75°C, 1분 이상</td><td>남은 음식을 데울 때 기준이에요. 어패류는 85°C 1분 이상을 권해요.</td></tr>
</tbody>
<caption>식품의약품안전처 권고 기준</caption></table></div>
<p>냉장고 표시창의 숫자는 센서 위치의 온도일 뿐이라 실제 칸마다 온도가 달라요. 3천 원 안팎의 냉장고용 온도계를 가운데 칸에 하나 넣어두면 실제 온도를 확인할 수 있어요.</p>

<h2>칸마다 온도가 다르다: 어디에 무엇을 둘까</h2>
<p>냉장고 안은 한 가지 온도가 아니에요. 찬 공기가 나오는 곳, 문을 여닫을 때 바깥 공기가 닿는 곳, 아래로 가라앉는 곳이 저마다 달라요.</p>
<div class="tbl"><table>
<thead><tr><th>위치</th><th>특징</th><th>잘 맞는 식품</th></tr></thead>
<tbody>
<tr><td>문 칸</td><td>문을 열 때마다 온도가 크게 오르내려요. 가장 따뜻한 곳이에요.</td><td>소스, 잼, 음료, 케첩처럼 잘 상하지 않는 것</td></tr>
<tr><td>위 칸</td><td>온도 변화가 비교적 적어요.</td><td>바로 먹을 반찬, 조리된 음식, 남은 음식</td></tr>
<tr><td>가운데·안쪽</td><td>온도가 가장 안정적이에요.</td><td>우유, 계란, 유제품, 두부</td></tr>
<tr><td>맨 아래 칸</td><td>찬 공기가 가라앉아 차가운 편이에요.</td><td>날고기, 생선 (밀폐 용기에 담아서)</td></tr>
<tr><td>채소 칸</td><td>습도가 유지되도록 설계돼 있어요.</td><td>채소, 과일 (씻지 않은 상태로)</td></tr>
</tbody></table></div>
<h3>날고기와 생선을 맨 아래에 두는 이유</h3>
<p>온도 때문만이 아니에요. 핏물이나 해동 중 나온 물이 아래 칸으로 떨어지면 그대로 먹는 채소나 반찬을 오염시킬 수 있어요. 맨 아래에 두면 떨어질 곳이 없어요.</p>
<h3>계란을 문 칸에 두지 않는 이유</h3>
<p>많은 냉장고에 계란 받침이 문 칸에 있지만, 문 칸은 온도 변화가 가장 커요. 식품의약품안전처도 계란을 냉장고 안쪽에 보관하길 권해요. 계란은 씻지 않은 채 보관하고, 씻으면 껍데기 표면의 보호막이 벗겨져 세균이 들어가기 쉬우니 바로 요리해요.</p>

<h2>70%만 채워야 하는 이유</h2>
<p>냉장실은 찬 공기가 돌면서 온도를 유지해요. 칸이 꽉 차면 공기가 지나갈 길이 막혀서 안쪽 깊숙한 곳의 온도가 올라가고, 냉장고는 더 세게 돌아가느라 전기를 더 써요.</p>
<p>반대로 <strong>냉동실은 어느 정도 채워져 있는 편이 좋아요.</strong> 꽁꽁 언 음식들이 서로를 차갑게 유지해 주기 때문에 문을 열어도 온도가 덜 오르고 효율도 좋아요. 정리하면 이렇게 기억하면 돼요.</p>
<ul><li>냉장실: 비워서 공기를 돌게</li><li>냉동실: 채워서 냉기를 모아두게</li></ul>

<h2>냉장고에 넣으면 오히려 손해인 식품</h2>
<p>모든 식품이 차가울수록 좋은 건 아니에요. 아래 식품들은 냉장 보관하면 맛이나 식감이 빨리 나빠져요.</p>
<div class="tbl"><table>
<thead><tr><th>식품</th><th>냉장하면 생기는 일</th><th>더 나은 보관법</th></tr></thead>
<tbody>
<tr><td>빵</td><td>전분이 굳는 현상(노화)이 냉장 온도에서 가장 빨라서 금방 딱딱해져요.</td><td>2~3일 안에 먹을 건 실온, 그 이상은 한 조각씩 싸서 냉동</td></tr>
<tr><td>바나나</td><td>껍질이 빨리 검게 변해요.</td><td>실온에 걸어두기</td></tr>
<tr><td>감자·고구마</td><td>감자는 식감과 맛이 변하고, 고구마는 저온에 약해 쉽게 상해요.</td><td>서늘하고 어두우며 바람이 통하는 곳</td></tr>
<tr><td>양파</td><td>습기를 먹어 무르기 쉬워요. (깐 양파는 냉장)</td><td>망에 담아 통풍이 잘 되는 곳</td></tr>
<tr><td>토마토 (덜 익은 것)</td><td>숙성이 멈추고 향이 약해져요.</td><td>익을 때까지 실온, 다 익은 뒤 냉장</td></tr>
</tbody></table></div>

<h2>소비기한: 2023년에 바뀐 날짜 읽는 법</h2>
<p>2023년 1월 1일부터 식품에 표시되는 날짜가 <strong>유통기한에서 소비기한으로</strong> 바뀌었어요. 1년의 계도기간을 거쳐 지금은 대부분의 식품에 소비기한이 표시돼요.</p>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>뜻</th><th>설정 방식</th></tr></thead>
<tbody>
<tr><td>유통기한 (예전)</td><td>판매해도 되는 기한</td><td>식품이 안전한 한계 기간의 약 60~70% 수준</td></tr>
<tr><td>소비기한 (현재)</td><td>표시된 방법으로 보관했을 때 먹어도 안전한 기한</td><td>안전한 한계 기간의 약 80~90% 수준</td></tr>
</tbody>
<caption>식품의약품안전처 설명 기준</caption></table></div>
<p>그래서 같은 제품이라도 예전 유통기한보다 소비기한이 조금 더 길게 표시돼요. 대신 의미가 달라요. 유통기한은 지나도 어느 정도 여유가 있었지만, <strong>소비기한은 말 그대로 먹을 수 있는 마지막 날</strong>이라서 지난 제품은 먹지 않는 게 원칙이에요.</p>
<div class="box note"><span class="h">꼭 알아둘 세 가지</span>
<ul>
<li><strong>보관 조건이 전제예요.</strong> "냉장 보관" 제품을 실온에 두었다면 소비기한은 의미가 없어요.</li>
<li><strong>개봉하면 달라져요.</strong> 소비기한은 뜯지 않은 상태 기준이에요. 개봉 후에는 제품에 적힌 안내를 따르고 되도록 빨리 먹어요.</li>
<li><strong>우유는 아직 예외예요.</strong> 우유류는 냉장 유통 환경을 개선할 시간을 두기 위해 2031년부터 소비기한이 적용돼요.</li>
</ul></div>

<h2>남은 음식: 2시간 안에 결정하기</h2>
<p>조리한 음식을 실온에 두는 시간은 <strong>2시간을 넘기지 않는 것</strong>이 널리 쓰이는 기준이에요. 여름처럼 기온이 30°C를 넘는 날에는 1시간으로 줄여 잡아요.</p>
<h3>"뜨거운 음식을 바로 넣으면 안 된다"는 말은 반만 맞아요</h3>
<p>큰 냄비째 뜨거운 국을 넣으면 냉장고 안 온도가 올라가 다른 음식에 영향을 줄 수 있어요. 그렇다고 완전히 식을 때까지 몇 시간씩 실온에 두면 위험 온도대에 오래 머물게 돼요. 좋은 방법은 이거예요.</p>
<ol>
<li>한 김만 식혀요. 김이 크게 오르지 않을 정도면 돼요.</li>
<li><strong>작고 얕은 용기 여러 개에 나눠 담아요.</strong> 표면적이 넓어져 빨리 식어요.</li>
<li>2시간 안에 냉장고에 넣어요.</li>
</ol>
<h3>남은 음식은 언제까지 먹을 수 있을까</h3>
<p>조리한 음식은 냉장 보관해도 보통 <strong>3~4일 안</strong>에 먹는 게 안전하다고 봐요. 그 안에 먹지 못할 것 같으면 처음부터 한 번 먹을 양씩 나눠 냉동하는 게 좋아요. 다시 먹을 때는 속까지 충분히 데워요.</p>

<h2>해동의 원칙: 실온 해동을 피하는 이유</h2>
<p>냉동 고기를 싱크대에 꺼내두면 겉은 금방 녹아 실온에 가까워지지만 속은 한참 얼어 있어요. 그 사이 겉면은 몇 시간 동안 위험 온도대에 머물러요. 그래서 권장되는 해동법은 세 가지예요.</p>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>걸리는 시간</th><th>주의할 점</th></tr></thead>
<tbody>
<tr><td>냉장실 해동</td><td>하루 전날부터</td><td>가장 안전해요. 핏물이 떨어지지 않게 그릇에 받쳐 맨 아래 칸에 둬요.</td></tr>
<tr><td>찬물 해동</td><td>수십 분~몇 시간</td><td>밀봉한 채로 찬물에 담그고, 물을 30분마다 갈아요. 녹으면 바로 조리해요.</td></tr>
<tr><td>전자레인지 해동</td><td>몇 분</td><td>일부가 익기 시작하므로 해동 후 바로 조리해요.</td></tr>
</tbody></table></div>
<p>한 번 녹인 식품을 다시 얼리는 것도 조심해야 해요. 냉장실에서 천천히 녹인 경우는 다시 얼릴 수 있다고 보지만 수분이 빠져 맛과 식감이 크게 떨어져요. 처음부터 <strong>한 번 쓸 양씩 나눠 얼리는 것</strong>이 가장 좋은 해결책이에요.</p>

<h2>교차오염: 냉장고 밖에서 시작되는 문제</h2>
<p>식중독은 냉장고 안보다 도마 위에서 시작되는 경우가 많아요. 날고기에 있던 세균이 칼, 도마, 손을 거쳐 그대로 먹는 채소나 과일로 옮겨가는 것을 교차오염이라고 해요.</p>
<ul>
<li><strong>도마와 칼을 나눠 써요.</strong> 날고기·생선용과 채소·과일용을 색깔로 구분하면 편해요. 한 개뿐이라면 채소를 먼저 손질하고 고기를 나중에 해요.</li>
<li><strong>생닭은 되도록 씻지 않아요.</strong> 씻을 때 튄 물방울이 주변으로 세균을 퍼뜨릴 수 있어요. 씻어야 한다면 물이 튀지 않게 조심하고, 채소를 먼저 씻은 뒤 마지막에 씻어요.</li>
<li><strong>손은 재료가 바뀔 때마다 씻어요.</strong> 특히 날고기와 계란을 만진 뒤에는 꼭 씻어요.</li>
</ul>

<h2>한눈에 보는 냉장고 점검표</h2>
<div class="box"><span class="h">이번 주말에 한 번 확인해 보세요</span>
<ol>
<li>냉장실 온도가 5°C 이하인지 온도계로 확인하기</li>
<li>문 칸에 있는 우유와 계란을 안쪽으로 옮기기</li>
<li>날고기와 생선을 밀폐 용기에 담아 맨 아래 칸으로</li>
<li>소비기한이 지난 식품, 조리한 지 4일 넘은 반찬 정리하기</li>
<li>냉장실이 70% 넘게 차 있다면 정리하고, 냉동실 빈 공간은 채워두기</li>
<li>문 고무 패킹에 틈이나 곰팡이가 없는지 확인하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>김치냉장고에 일반 식품을 보관해도 되나요?</dt>
<dd>김치냉장고는 온도 변화가 적어서 채소나 과일, 육류를 보관하기에 좋은 편이에요. 다만 모드마다 설정 온도가 다르니 보관하려는 식품에 맞는 모드를 골라요.</dd>
<dt>통조림을 따고 남은 건 캔째 넣어도 되나요?</dt>
<dd>캔을 연 뒤에는 금속 성분이 음식으로 옮겨가거나 맛이 변할 수 있어요. 유리나 플라스틱 밀폐 용기에 옮겨 담아 보관해요.</dd>
<dt>냉동실에 넣어두면 몇 달이 지나도 괜찮나요?</dt>
<dd>−18°C 이하라면 세균은 늘지 않지만 수분이 빠지고 산화가 일어나 품질은 계속 떨어져요. 냉동 날짜를 적어두고 가급적 몇 달 안에 먹는 게 좋아요.</dd>
</dl>
