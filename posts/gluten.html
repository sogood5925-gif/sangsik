  data-title="글루텐: 셀리악병·밀 알레르기·글루텐 민감성의 차이, 글루텐 프리가 모두에게 좋은 건 아닌 이유"
  data-thumb="20ppm|무글루텐 표시 기준"
  data-summary="글루텐은 밀·보리·호밀에 든 단백질로, 빵과 면을 쫄깃하게 만들어요. 글루텐 때문에 탈이 나는 세 가지 경우인 셀리악병, 밀 알레르기, 비셀리악 글루텐 민감성의 차이, 검사 전에 글루텐을 끊으면 안 되는 이유, 무글루텐 표시와 숨은 글루텐, 필요 없는 사람이 글루텐을 끊을 때의 단점을 정리했어요."

<p class="lead">'글루텐 프리'라는 표시가 붙은 빵과 과자가 늘면서, 글루텐을 끊으면 속이 편해지고 살도 빠진다는 이야기를 자주 들어요. 그런데 글루텐을 반드시 피해야 하는 사람은 따로 있고, 그렇지 않은 사람에게 글루텐 프리 식사가 더 건강하다는 근거는 부족해요. 누가 왜 피해야 하는지 나눠 볼게요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>글루텐은 <strong>밀, 보리, 호밀</strong>에 들어 있는 단백질이에요.</li>
<li>글루텐을 피해야 하는 대표적인 경우는 <strong>셀리악병, 밀 알레르기, 비셀리악 글루텐 민감성</strong>이에요.</li>
<li>셀리악병이 의심되면 <strong>검사 전에 글루텐을 끊지 않아요.</strong> 끊으면 검사가 정확하지 않아요.</li>
<li>필요 없는 사람이 글루텐을 끊으면 <strong>식이섬유와 비타민 B군</strong>이 부족해지기 쉬워요.</li>
</ul></div>

<h2>글루텐으로 탈이 나는 세 가지</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>무엇이 일어날까</th><th>특징</th></tr></thead>
<tbody>
<tr><td>셀리악병</td><td>글루텐이 자가면역 반응을 일으켜 소장 융모가 손상돼요</td><td>설사, 복부 팽만, 체중 감소, 철 결핍 빈혈, 골다공증. 증상 없이 빈혈만 있기도 해요. 평생 엄격한 무글루텐 식사가 필요해요</td></tr>
<tr><td>밀 알레르기</td><td>밀 단백질에 대한 알레르기 반응</td><td>먹은 뒤 몇 분~몇 시간 안에 두드러기, 숨참, 드물게 아나필락시스. 밀을 먹고 운동할 때만 생기기도 해요</td></tr>
<tr><td>비셀리악 글루텐(밀) 민감성</td><td>셀리악병·알레르기는 아닌데 밀을 먹으면 불편해요</td><td>배 불편, 피로, 두통. 원인이 글루텐이 아니라 밀 속 발효성 당(프럭탄)인 경우도 많아요</td></tr>
</tbody>
<caption>세계소화기학회(WGO) 셀리악병 지침, 대한소화기학회, 미국소화기학회(ACG) 셀리악병 지침(2023)을 바탕으로 정리</caption></table></div>
<p>셀리악병은 서양에서는 100명 중 1명꼴로 흔하지만, 우리나라에서는 드문 것으로 알려져 있어요. 그래도 원인 모를 빈혈, 설사, 체중 감소가 이어지면 확인해 볼 수 있어요.</p>

<h2>검사 전에 끊지 마세요</h2>
<p>셀리악병은 혈액 항체 검사(조직 트랜스글루타미나제 항체 등)와 내시경 조직검사로 진단해요. 이 검사들은 <strong>글루텐을 먹고 있을 때</strong> 정확해요. 미리 끊으면 항체가 내려가고 장도 회복돼 진단이 어려워져요. 스스로 끊기 전에 먼저 검사를 받아요.</p>

<h2>글루텐이 들어 있는 곳</h2>
<div class="tbl"><table>
<thead><tr><th>분류</th><th>예</th></tr></thead>
<tbody>
<tr><td>분명한 것</td><td>빵, 면, 국수, 만두피, 부침가루, 튀김옷, 케이크, 과자, 시리얼</td></tr>
<tr><td>숨어 있는 것</td><td>간장(밀 사용 제품), 고추장·된장 일부, 소스, 양념, 어묵, 햄, 맥주, 보리차, 엿기름</td></tr>
<tr><td>교차 오염</td><td>귀리(밀과 같은 곳에서 가공), 튀김 기름을 함께 쓰는 튀김, 빵집 도마·토스터</td></tr>
<tr><td>글루텐이 없는 곡물</td><td>쌀, 현미, 옥수수, 메밀(순메밀), 조, 수수, 감자, 고구마, 퀴노아</td></tr>
</tbody>
<caption>식품의약품안전처 식품 알레르기 정보, 미국 셀리악병재단 자료를 바탕으로 정리. 메밀면·쌀국수도 밀가루가 섞인 제품이 많아 원재료를 확인해요</caption></table></div>

<h2>무글루텐 표시</h2>
<p>국내에서는 글루텐 함량이 <strong>1kg당 20mg(20ppm) 이하</strong>인 식품에 '무글루텐' 표시를 할 수 있어요. 국제 식품 규격(코덱스)과 같은 기준이에요. 셀리악병 환자는 이 표시와 원재료명, 알레르기 표시(밀)를 함께 확인해요.</p>

<h2>필요 없는 사람이 끊으면</h2>
<ul>
<li><strong>통밀, 보리</strong> 같은 좋은 식이섬유 공급원이 빠져요.</li>
<li>글루텐 프리 가공식품은 식감을 위해 <strong>정제 전분, 설탕, 지방</strong>을 더 넣는 경우가 있어요.</li>
<li>값이 비싸고, 외식이 번거로워요.</li>
<li>체중이 줄었다면 글루텐 때문이라기보다 빵·과자·면을 덜 먹은 효과일 가능성이 커요.</li>
</ul>

<h2>과민성 장증후군과 밀</h2>
<p>밀을 먹으면 배가 부풀고 가스가 차는 사람 중 상당수는 글루텐이 아니라 밀 속 <strong>프럭탄</strong>(발효가 잘 되는 당)에 반응하는 경우예요. 양파, 마늘에도 많아요. 이 경우 저포드맵 식사를 영양사와 함께 짧게 시도해 보고, 원인을 찾으면 다시 넓혀 가요.</p>

<div class="box warn"><span class="h">이런 경우는 진료를 받아요</span>
<ul>
<li>밀을 먹은 뒤 <strong>두드러기, 숨참, 목 조임</strong>이 생겨요. 밀 알레르기일 수 있어요.</li>
<li>원인 모를 <strong>철 결핍 빈혈</strong>, 오래가는 설사, 체중 감소가 있어요.</li>
<li>아이의 키와 몸무게가 잘 늘지 않아요.</li>
</ul></div>

<div class="box"><span class="h">글루텐 체크리스트</span>
<ol>
<li>의심되면 끊기 전에 검사부터</li>
<li>진단받았다면 원재료명·밀 표시 확인</li>
<li>무글루텐 20ppm 표시 활용</li>
<li>간장·소스 속 숨은 밀 조심</li>
<li>필요 없다면 굳이 끊지 않기</li>
<li>끊는다면 통곡물 대체로 섬유질 챙기기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>쌀가루 빵은 글루텐이 없나요?</dt>
<dd>쌀가루만 쓰면 글루텐이 없지만, 식감을 위해 밀가루나 활성 글루텐을 섞은 제품이 많아요. 원재료명을 확인해요.</dd>
<dt>셀리악병은 조금만 먹어도 문제인가요?</dt>
<dd>네, 적은 양도 장 손상을 이어 가게 할 수 있어 엄격하게 피해야 해요. 영양사와 식단을 짜면 도움이 돼요.</dd>
<dt>글루텐 프리가 자폐나 피부병에 도움이 되나요?</dt>
<dd>일반적으로 권할 만한 근거는 부족해요. 식단을 크게 바꾸기 전에 의사와 상의해요.</dd>
</dl>
