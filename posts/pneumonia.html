  data-thumb="3위|국내 사망원인"
  data-summary="폐렴은 국내 사망원인 3위의 흔하고 위험한 병이에요. 감기와 다른 증상, 노인에게 나타나는 '조용한 폐렴', 세균·바이러스·흡인성 폐렴의 차이, 입원이 필요한 경우, 항생제를 끝까지 먹어야 하는 이유, 백신과 구강 관리로 예방하는 법을 정리했어요."

<p class="lead">폐렴은 젊고 건강한 사람에게는 며칠 앓고 지나가는 병일 수 있지만, 노인과 만성질환자에게는 생명을 위협하는 병이에요. 통계청 사망원인 통계에서 폐렴은 암, 심장질환에 이어 3위를 차지해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>폐렴은 폐의 공기주머니(폐포)에 생긴 감염으로, <strong>기침, 가래, 열, 숨참</strong>이 대표 증상이에요.</li>
<li>노인은 열과 기침 없이 <strong>기운 없음, 식욕 저하, 헛소리</strong>로만 나타나기도 해요.</li>
<li>항생제는 좋아져도 <strong>처방 기간을 끝까지</strong> 먹어요.</li>
<li>예방의 핵심은 <strong>폐렴구균·독감 백신, 금연, 구강 관리</strong>예요.</li>
</ul></div>

<h2>폐렴은 어떤 병일까</h2>
<p>숨을 들이마시면 공기는 기관지를 지나 포도송이처럼 생긴 수억 개의 작은 공기주머니(폐포)에 도착해요. 여기서 산소가 혈액으로 들어가요. 폐렴은 이 폐포에 세균이나 바이러스가 들어와 염증이 생기고, 공기 대신 고름과 염증 물질이 차는 병이에요. 그래서 산소를 제대로 받아들이지 못해 숨이 차요.</p>

<h2>원인에 따른 종류</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>주요 원인</th><th>특징</th></tr></thead>
<tbody>
<tr><td>세균성 폐렴</td><td>폐렴구균 (가장 흔함), 헤모필루스 등</td><td>갑자기 고열, 누런 가래, 한쪽 폐에 뚜렷한 염증</td></tr>
<tr><td>바이러스성 폐렴</td><td>인플루엔자, RSV, 코로나19 등</td><td>독감 유행 시기에 많음. 세균성 폐렴이 뒤따르기도 함</td></tr>
<tr><td>비정형 폐렴</td><td>마이코플라스마, 클라미디아 등</td><td>어린이와 젊은 층에 흔함. 증상이 비교적 가벼워 '걸어다니는 폐렴'으로 불림. 마른기침이 오래감</td></tr>
<tr><td>흡인성 폐렴</td><td>입 안 세균이 음식물·침과 함께 기도로 넘어감</td><td>삼킴 기능이 떨어진 노인, 뇌졸중 후, 의식 저하 환자에게 흔함</td></tr>
</tbody></table></div>

<h2>증상: 감기와 어떻게 다를까</h2>
<ul>
<li><strong>기침과 가래:</strong> 누렇거나 초록빛, 때로 피가 섞인 가래</li>
<li><strong>열과 오한:</strong> 몸이 떨릴 정도의 오한</li>
<li><strong>숨참:</strong> 조금만 움직여도 숨이 차요. 쉴 때도 숨이 빠르다면 더 심한 상태예요.</li>
<li><strong>가슴 통증:</strong> 숨을 깊게 쉬거나 기침할 때 찌르는 듯한 통증</li>
<li><strong>전신 증상:</strong> 심한 피로, 근육통, 식욕 저하</li>
</ul>
<p>감기는 코와 목이 주로 불편하고 며칠 지나면 나아지는 반면, 폐렴은 <strong>숨참과 고열이 뚜렷하고 점점 심해지는</strong> 경우가 많아요. 감기나 독감이 좋아지는 듯하다가 다시 열이 오르고 기침이 심해진다면 폐렴을 의심해요.</p>
<div class="box warn"><span class="h">노인의 '조용한 폐렴'</span>
<p>노인은 면역 반응이 약해서 <strong>열이 없거나 미열</strong>이고 기침도 심하지 않을 수 있어요. 대신 이런 변화로만 나타나기도 해요.</p>
<ul>
<li>평소보다 기운이 없고 자꾸 누우려 해요.</li>
<li>식사량이 갑자기 줄었어요.</li>
<li>헛소리를 하거나 사람을 못 알아보는 등 정신이 흐려졌어요.</li>
<li>평소보다 숨이 빠르거나 자주 넘어져요.</li>
</ul>
<p>가족 중 어르신에게 이런 변화가 며칠 사이 생겼다면 폐렴 가능성을 생각하고 진료를 받아요.</p></div>

<h2>진단과 입원 기준</h2>
<p>의사는 청진, 흉부 X선, 혈액검사, 산소포화도로 폐렴을 진단해요. 이후 중증도를 평가해 외래 치료와 입원을 결정해요. 흔히 쓰는 기준 중 하나가 <strong>CURB-65</strong>예요.</p>
<div class="tbl"><table>
<thead><tr><th>항목</th><th>기준</th></tr></thead>
<tbody>
<tr><td>C (의식)</td><td>새로 생긴 혼돈, 의식 변화</td></tr>
<tr><td>U (요소)</td><td>혈중 요소질소 상승 (콩팥 기능 저하, 탈수)</td></tr>
<tr><td>R (호흡수)</td><td>1분에 30회 이상</td></tr>
<tr><td>B (혈압)</td><td>수축기 90 미만 또는 이완기 60 이하</td></tr>
<tr><td>65 (나이)</td><td>65세 이상</td></tr>
</tbody>
<caption>해당 항목이 많을수록 중증이에요. 실제 판단은 산소포화도, 동반 질환 등을 함께 봐요.</caption></table></div>

<h2>치료</h2>
<ul>
<li><strong>세균성 폐렴</strong>은 항생제로 치료해요. 외래 치료라면 보통 5~7일 정도 먹어요.</li>
<li>보통 치료 시작 후 <strong>48~72시간 안에</strong> 열이 내리고 좋아지기 시작해요. 사흘이 지나도 나아지지 않거나 나빠지면 다시 진료를 받아요.</li>
<li>좋아졌다고 항생제를 일찍 멈추면 재발하거나 내성균이 생길 수 있어요. <strong>처방 기간을 끝까지</strong> 먹어요.</li>
<li><strong>바이러스성 폐렴</strong>에는 항생제가 듣지 않아요. 독감이 원인이면 항바이러스제를 써요.</li>
<li>물을 충분히 마시고 푹 쉬어요. 기침을 억지로 완전히 막는 약보다 가래를 잘 뱉어내는 게 중요할 때가 많아요.</li>
</ul>
<h3>회복에는 시간이 걸려요</h3>
<p>열이 내린 뒤에도 피로와 기침은 몇 주 이어질 수 있어요. 특히 노인은 폐렴 후 체력과 근력이 크게 떨어지기 쉬워서, 회복기에 잘 먹고 조금씩 움직이는 게 중요해요.</p>

<h2>응급 신호</h2>
<div class="box warn"><span class="h">바로 119나 응급실로</span>
<ul>
<li>쉬고 있어도 숨이 가쁘고 말하기 힘들어요.</li>
<li>입술이나 손끝이 파래져요.</li>
<li>의식이 흐려지거나 깨우기 어려워요.</li>
<li>가정용 산소포화도 측정기에서 평소보다 크게 낮은 값(대략 92~94% 미만)이 계속 나와요.</li>
<li>혈압이 떨어지고 식은땀이 나요.</li>
</ul></div>

<h2>예방: 백신</h2>
<ul>
<li><strong>폐렴구균 백신:</strong> 65세 이상은 국가예방접종으로 무료로 맞을 수 있어요. 만성 심장·폐·간·콩팥 질환, 당뇨병, 면역저하, 흡연자는 더 일찍 맞기를 권해요.</li>
<li><strong>독감 백신:</strong> 해마다 맞아요. 독감 후 세균성 폐렴이 생기는 경우가 많아서 독감 예방이 폐렴 예방으로 이어져요.</li>
<li><strong>코로나19, RSV 백신:</strong> 고위험군에서 해마다 발표되는 권고를 확인해요.</li>
</ul>

<h2>예방: 흡인성 폐렴을 막는 생활</h2>
<p>노인 폐렴의 상당 부분은 입 안의 세균이 침이나 음식과 함께 기도로 넘어가서 생겨요. 그래서 <strong>입 안을 깨끗하게 하는 것</strong>이 폐렴 예방이 돼요.</p>
<ul>
<li>매일 양치하고, 틀니는 매일 빼서 닦고 밤에는 빼두어요.</li>
<li>식사할 때는 <strong>똑바로 앉아서</strong> 천천히, 작은 양씩 먹어요.</li>
<li>식사 후 <strong>30분 정도는 눕지 않아요.</strong></li>
<li>식사 중 자주 사레가 들리거나 목소리가 젖은 듯 변하면 삼킴 기능 평가를 받아요. 음식의 점도를 조절하면 도움이 돼요.</li>
<li>수면제나 진정제는 삼킴과 기침 반사를 떨어뜨릴 수 있어요. 복용 중인 약을 점검해요.</li>
</ul>

<div class="box"><span class="h">폐렴 예방 체크리스트</span>
<ol>
<li>65세 이상이면 폐렴구균 백신 접종 기록 확인하기</li>
<li>올가을 독감 백신 맞기</li>
<li>금연하기 (흡연은 폐의 방어 기능을 망가뜨려요)</li>
<li>어르신은 식후 양치와 틀니 관리 챙기기</li>
<li>식사 중 사레가 잦으면 진료 받기</li>
<li>감기가 좋아지다 다시 열이 나면 진료 받기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>폐렴은 옮나요?</dt>
<dd>폐렴을 일으킨 세균이나 바이러스는 기침과 재채기로 다른 사람에게 옮을 수 있어요. 다만 옮은 사람이 모두 폐렴에 걸리는 건 아니고, 감기나 가벼운 호흡기 감염으로 지나가는 경우가 많아요. 기침 예절과 손 씻기가 중요해요.</dd>
<dt>폐렴구균 백신을 맞으면 폐렴에 안 걸리나요?</dt>
<dd>폐렴구균이 일으키는 폐렴과 심각한 침습성 감염을 줄여주지만, 다른 원인의 폐렴까지 막지는 못해요. 그래도 가장 흔한 원인균을 막는다는 점에서 효과가 커요.</dd>
<dt>엑스레이가 깨끗해질 때까지 얼마나 걸리나요?</dt>
<dd>증상이 좋아진 뒤에도 흉부 X선의 변화는 몇 주 이상 남을 수 있어요. 특히 노인과 흡연자는 회복 후 일정 기간이 지나 다시 촬영해 다른 병이 없는지 확인하기도 해요.</dd>
</dl>
