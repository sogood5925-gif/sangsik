<template data-id="contraception" data-cat="hea" data-date="2026.09.30"
  data-title="피임 방법: 실제 사용 실패율로 비교하기, 먹는 피임약을 피해야 하는 경우, 응급피임은 빠를수록"
  data-thumb="7%|먹는 피임약 실제 실패율"
  data-summary="피임은 두 사람이 함께 계획하는 건강한 선택이에요. 콘돔, 먹는 피임약, 자궁 내 장치, 피하 이식 등 방법별로 '완벽하게 쓸 때'와 '실제 쓸 때'의 실패율, 호르몬 피임을 피해야 하는 사람, 흔한 오해, 성매개감염까지 막는 방법, 응급피임약과 구리 자궁 내 장치의 사용 시간을 정리했어요."
  data-tags="피임,피임약,응급피임,자궁내장치,건강상식">
<p class="lead">피임 방법은 생각보다 다양하고, 방법마다 효과와 편리함, 부작용이 달라요. 가장 좋은 피임법은 정해져 있지 않아요. 내 몸 상태, 앞으로의 임신 계획, 생활 방식에 맞고 <strong>꾸준히 쓸 수 있는 방법</strong>이 나에게 좋은 방법이에요. 파트너와 함께 이야기하고, 필요하면 산부인과에서 상담받아요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>피임 효과는 <strong>실제 사용할 때의 실패율</strong>로 비교해야 현실적이에요.</li>
<li><strong>자궁 내 장치, 피하 이식</strong>은 한 번 시술하면 오래가고 실패율이 매우 낮아요.</li>
<li><strong>35세 이상 흡연자, 혈전 병력, 전조가 있는 편두통</strong>이 있으면 에스트로겐이 든 피임약을 피해요.</li>
<li>콘돔은 <strong>성매개감염까지</strong> 막아 주는 유일한 방법이라 다른 방법과 함께 쓰면 좋아요.</li>
</ul></div>

<h2>방법별 실패율 비교</h2>
<div class="tbl"><table>
<thead><tr><th>방법</th><th class="num">1년 실패율(실제 사용)</th><th>특징</th></tr></thead>
<tbody>
<tr><td>피하 이식형</td><td class="num">약 0.1%</td><td>팔 안쪽에 작은 막대를 넣어 약 3년</td></tr>
<tr><td>호르몬 자궁 내 장치</td><td class="num">약 0.1~0.4%</td><td>3~8년(제품마다 다름). 생리량이 줄어요</td></tr>
<tr><td>구리 자궁 내 장치</td><td class="num">약 0.8%</td><td>호르몬 없음. 10년 안팎. 생리량이 늘 수 있어요</td></tr>
<tr><td>남성·여성 영구 피임(정관·난관 수술)</td><td class="num">약 0.15~0.5%</td><td>더 이상 임신을 원하지 않을 때</td></tr>
<tr><td>피임 주사</td><td class="num">약 4%</td><td>3개월마다</td></tr>
<tr><td>먹는 피임약, 패치, 질 링</td><td class="num">약 7%</td><td>매일(또는 주·월) 챙겨야 해요</td></tr>
<tr><td>남성 콘돔</td><td class="num">약 13%</td><td>성매개감염 예방</td></tr>
<tr><td>배란일 계산법</td><td class="num">약 2~23%</td><td>생리 주기가 불규칙하면 효과가 떨어져요</td></tr>
<tr><td>질외 사정</td><td class="num">약 20%</td><td>믿을 만한 피임법이 아니에요</td></tr>
</tbody>
<caption>미국 질병통제예방센터(CDC) Contraceptive Effectiveness, Trussell J·Contraceptive Technology 자료를 바탕으로 정리. 완벽하게 쓰면 실패율은 더 낮아져요</caption></table></div>

<h2>먹는 피임약 알아 두기</h2>
<ul>
<li><strong>매일 같은 시간</strong>에 먹어요. 알람을 맞춰 두면 좋아요.</li>
<li>잊었을 때 대처는 약 종류와 잊은 개수에 따라 달라요. 설명서를 확인하고, 필요하면 7일 동안 콘돔을 함께 써요.</li>
<li>구토나 심한 설사가 있으면 흡수가 안 됐을 수 있어요.</li>
<li>일부 약(뇌전증 약, 결핵약 리팜피신, 세인트존스워트)은 피임 효과를 떨어뜨려요. 약을 새로 먹을 때 알려요.</li>
<li>처음 몇 달은 부정 출혈, 메스꺼움, 유방 통증이 있을 수 있어요. 대개 좋아져요.</li>
</ul>

<div class="box warn"><span class="h">에스트로겐이 든 피임약을 피해야 하는 경우</span>
<ul>
<li><strong>35세 이상이면서 흡연</strong></li>
<li>혈전(다리·폐), 뇌졸중, 심근경색 병력</li>
<li><strong>전조(눈앞 번쩍임 등)가 있는 편두통</strong></li>
<li>조절되지 않는 고혈압, 일부 간질환, 유방암</li>
<li>출산 직후 몇 주</li>
</ul>
<p>먹는 도중 <strong>한쪽 다리가 붓고 아프거나, 갑자기 숨이 차고 가슴이 아프거나, 심한 두통·시야 이상</strong>이 생기면 혈전일 수 있어 바로 응급실에 가요. 이런 경우에도 호르몬이 없거나 프로게스틴만 든 다른 방법을 쓸 수 있어요.</p></div>

<h2>흔한 오해</h2>
<div class="tbl"><table>
<thead><tr><th>오해</th><th>사실</th></tr></thead>
<tbody>
<tr><td>피임약을 오래 먹으면 나중에 임신이 안 된다</td><td>끊으면 대부분 몇 달 안에 가임력이 돌아와요</td></tr>
<tr><td>피임약을 먹으면 살이 많이 찐다</td><td>큰 연구에서 뚜렷한 체중 증가는 확인되지 않았어요. 개인차는 있어요</td></tr>
<tr><td>출산 경험이 없으면 자궁 내 장치를 못 한다</td><td>출산 경험과 상관없이 할 수 있어요</td></tr>
<tr><td>생리 중에는 임신이 안 된다</td><td>주기가 짧거나 불규칙하면 가능해요</td></tr>
<tr><td>수유 중에는 피임이 필요 없다</td><td>엄격한 조건(완전 모유, 6개월 이내, 생리 없음)이 아니면 임신할 수 있어요</td></tr>
</tbody>
<caption>대한산부인과학회, 세계보건기구(WHO) 피임 방법 사용 기준을 바탕으로 정리</caption></table></div>

<h2>응급피임</h2>
<ul>
<li>피임에 실패했거나 피임 없이 관계를 가졌다면 <strong>빠를수록</strong> 효과가 좋아요.</li>
<li><strong>응급피임약:</strong> 레보노르게스트렐 성분은 72시간 안, 울리프리스탈 성분은 120시간 안에 먹어요. 우리나라에서는 의사 처방이 필요해요.</li>
<li><strong>구리 자궁 내 장치:</strong> 관계 뒤 5일 안에 넣으면 가장 효과적인 응급피임이고, 이후 피임도 이어져요.</li>
<li>응급피임은 규칙적인 피임법이 아니에요. 이후의 피임 방법도 함께 상담해요.</li>
<li>다음 생리가 1주 이상 늦어지면 임신 검사를 해요.</li>
</ul>

<div class="box"><span class="h">피임 선택 체크리스트</span>
<ol>
<li>실제 사용 실패율로 비교</li>
<li>내 건강 상태(흡연·혈전·편두통) 확인</li>
<li>꾸준히 쓸 수 있는 방법 고르기</li>
<li>성매개감염 예방엔 콘돔 함께</li>
<li>피임약 잊었을 때 대처 알아 두기</li>
<li>응급피임은 빠를수록, 처방 필요</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>남성이 할 수 있는 피임은요?</dt>
<dd>콘돔과 정관 수술이 있어요. 피임은 두 사람의 책임이니 함께 이야기해요.</dd>
<dt>피임약을 먹으면 생리를 미룰 수 있나요?</dt>
<dd>의사와 상의해 먹는 방법을 조절하면 가능해요. 여행 등 계획이 있다면 미리 상담해요.</dd>
<dt>청소년도 피임 상담을 받을 수 있나요?</dt>
<dd>네, 산부인과와 청소년 상담 기관에서 상담받을 수 있어요. 궁금한 점을 숨기지 말고 물어보세요.</dd>
</dl>
