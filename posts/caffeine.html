<p class="lead">카페인은 전 세계에서 가장 널리 쓰이는 각성 물질이에요. 적당히 마시면 집중력을 돕고 건강에 해가 되지 않는다는 연구가 많지만, '적당히'의 기준은 사람마다 조금씩 달라요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>식품의약품안전처 기준: 성인 <strong>하루 400mg 이하</strong>, 임신부 <strong>300mg 이하</strong>, 어린이·청소년 <strong>체중 1kg당 2.5mg 이하</strong>예요.</li>
<li>커피 한 잔의 카페인은 매장과 크기에 따라 <strong>100mg 안팎부터 200mg 넘게</strong>까지 차이가 커요.</li>
<li>카페인의 반감기는 평균 <strong>약 5시간</strong>이에요. 잠이 걱정되면 <strong>오후 이른 시간</strong> 이후 줄여요.</li>
<li>적당한 커피는 여러 연구에서 <strong>건강 위험을 높이지 않았고</strong>, 일부 질환 위험이 낮은 것과 관련이 있었어요.</li>
</ul></div>

<h2>카페인은 어떻게 잠을 깨울까</h2>
<p>깨어 있는 동안 뇌에는 <strong>아데노신</strong>이라는 물질이 쌓이면서 졸음이 커져요. 카페인은 아데노신이 붙는 자리를 대신 차지해서 졸음 신호를 막아요. 피로가 사라진 게 아니라 <strong>가려진 것</strong>이라서, 카페인 효과가 떨어지면 쌓였던 졸음이 한꺼번에 몰려오기도 해요.</p>

<h2>얼마나 마셔도 될까</h2>

<h2>음료별 카페인</h2>

<tr><td>에스프레소 1샷</td><td class="num">60~80mg</td></tr>

<p>국내에서는 1mL당 카페인이 0.15mg 이상인 음료에 <strong>'고카페인 함유'</strong>와 총 카페인 양을 표시해요. 매장 커피는 표시가 없는 경우가 많으니 매장의 영양 정보를 확인해 보세요. 큰 사이즈나 샷 추가 한 잔으로 하루 권고량의 절반을 넘기기도 해요.</p>

<h2>반감기와 수면</h2>
<p>카페인의 반감기는 평균 약 <strong>5시간</strong>(사람에 따라 2~10시간)이에요. 오후 3시에 마신 커피의 절반이 밤 8시에도 몸에 남아 있다는 뜻이에요. 잠들 수는 있어도 깊은 잠이 줄어들 수 있어요.</p>
<ul>
<li><strong>임신 중</strong>, <strong>경구 피임약</strong>을 먹을 때, 간 기능이 떨어졌을 때는 반감기가 길어져요.</li>
<li>흡연자는 카페인이 빨리 분해돼요. 금연하면 같은 양의 커피가 더 강하게 느껴질 수 있어요.</li>
<li>유전적으로 카페인을 느리게 분해하는 사람도 있어요. 오후 커피 한 잔에도 잠을 설친다면 그런 체질일 수 있어요.</li>
</ul>

<h2>적당한 커피와 건강</h2>
<p>여러 대규모 관찰 연구를 모은 분석에서 하루 3~4잔 정도의 커피를 마시는 사람은 마시지 않는 사람보다 <strong>제2형 당뇨병, 간 질환, 일부 심혈관 질환, 사망</strong>의 위험이 낮은 경향을 보였어요. 커피 속 폴리페놀 등 여러 성분의 영향으로 추정하지만, 관찰 연구라서 커피 자체의 효과인지 확실하지 않아요. 결론은 이래요.</p>
<ul>
<li>건강한 성인이 적당히 마시는 커피는 <strong>걱정할 필요가 없어요.</strong></li>
<li>건강을 위해 일부러 커피를 마시기 시작할 필요는 없어요.</li>
<li>설탕, 시럽, 크림이 많은 커피 음료는 이런 이점을 기대하기 어려워요.</li>
</ul>
<p>커피는 마신 뒤 잠깐 혈압을 올리지만, 꾸준히 마시는 사람에게는 고혈압 위험을 크게 높이지 않는다는 연구가 많아요. 적당한 커피가 심방세동 같은 부정맥을 늘리지 않는다는 연구도 있어요. 다만 혈압이 잘 조절되지 않거나 부정맥이 있다면 의사와 상의해요.</p>

<h2>너무 많이 마셨다는 신호</h2>
<ul>
<li>가슴 두근거림, 손 떨림</li>
<li>불안, 초조, 예민함</li>
<li>잠들기 어렵거나 자주 깸</li>
<li>속쓰림, 위산 역류, 설사</li>
<li>잦은 소변</li>
</ul>
<div class="box warn"><span class="h">카페인 정제와 에너지음료를 조심하세요</span>
<p>카페인 알약이나 가루, 에너지음료를 한꺼번에 많이 먹으면 심한 부정맥, 경련 같은 <strong>카페인 중독</strong>이 생길 수 있어요. 특히 <strong>에너지음료와 술</strong>을 섞으면 취한 느낌이 둔해져 과음하기 쉬워요. 시험 기간 청소년이 에너지음료를 여러 캔 마시는 것도 위험해요.</p></div>

<h2>카페인 금단</h2>
<p>매일 카페인을 마시다 갑자기 끊으면 12~24시간 안에 <strong>두통</strong>, 피로, 졸림, 집중력 저하, 짜증이 생길 수 있어요. 보통 며칠 안에 좋아져요. 줄이고 싶다면 며칠~몇 주에 걸쳐 조금씩 줄이면 금단 증상이 덜해요. 반은 디카페인으로 섞어 마시는 것도 방법이에요.</p>

<h2>대상별 주의점</h2>
<h3>임신부와 수유부</h3>
<p>카페인은 태반을 통과하고, 태아는 카페인을 분해하는 능력이 약해요. 많은 양은 저체중아 위험과 관련이 있다는 연구가 있어서 하루 300mg 이하(가능하면 200mg 안팎)로 줄여요. 수유 중에도 모유로 조금 전달되니 적당히 마셔요.</p>
<h3>어린이와 청소년</h3>
<p>국내에서는 학교 안에서 고카페인 음료 판매가 금지돼 있어요. 청소년은 커피 음료와 에너지음료로 권고량을 쉽게 넘길 수 있고, 수면 부족으로 이어지기 쉬워요.</p>
<h3>약을 먹는 사람</h3>
<p>일부 항생제(퀴놀론 계열), 천식약(테오필린), 일부 항우울제는 카페인의 분해를 늦추거나 부작용을 키울 수 있어요. 커피는 철분 흡수를 방해하니 철분제와는 시간을 떼어요.</p>

<div class="box"><span class="h">카페인 관리 체크리스트</span>
<ol>
<li>오늘 마신 커피·차·음료의 카페인을 대략 더해보기</li>
<li>잠이 걱정되면 오후 2~3시 이후 카페인 줄이기</li>
<li>큰 사이즈와 샷 추가는 카페인이 두 배가 될 수 있다는 것 기억하기</li>
<li>에너지음료와 술 섞지 않기</li>
<li>줄일 때는 천천히, 디카페인 활용하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>디카페인 커피에는 카페인이 전혀 없나요?</dt>
<dd>대부분의 카페인을 제거했지만 소량 남아 있어요. 여러 잔을 마시면 조금 쌓일 수 있어요. 카페인에 아주 민감하다면 양을 확인해요.</dd>
<dt>커피를 마시면 탈수가 되나요?</dt>
<dd>카페인은 약한 이뇨 작용이 있지만, 평소 커피를 마시는 사람에게 적당한 양의 커피는 탈수를 일으키지 않고 수분 섭취에도 포함돼요.</dd>
<dt>녹차는 커피보다 카페인이 적어서 많이 마셔도 되나요?</dt>
<dd>한 잔당 카페인은 적지만, 진하게 우리거나 여러 잔 마시면 합계가 늘어요. 녹차 추출물 고용량 보충제는 드물게 간 손상 사례가 보고돼 있으니 주의해요.</dd>
</dl>
