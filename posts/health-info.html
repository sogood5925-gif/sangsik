  data-title="건강 정보 가려 읽기: '암 위험 2배'의 진짜 크기, 믿을 만한 연구와 광고 구별하기"
  data-thumb="2배|상대위험의 함정"
  data-summary="유튜브, 기사, 광고에서 쏟아지는 건강 정보 가운데 무엇을 믿어야 할까요? 연구 종류에 따른 근거의 무게, '위험 2배'처럼 상대위험으로 부풀려지는 숫자 읽는 법, 상관관계와 인과관계의 차이, 동물·세포 실험의 한계, 건강기능식품 광고의 과장 신호, 믿을 만한 정보원을 정리했어요."
  data-tags="건강정보,의학연구,상대위험,허위광고,건강상식">
<p class="lead">"○○를 먹으면 암 위험이 절반으로!", "이것 하나로 혈관이 깨끗해진다." 이런 제목을 보면 솔깃해져요. 건강 정보를 가려 읽는 데 의학 지식이 많이 필요하지는 않아요. 몇 가지 질문만 던져 보면 과장된 정보의 상당수를 걸러 낼 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>'위험 2배'는 <strong>원래 위험이 얼마인지</strong>를 함께 봐야 해요. 1만 명 중 1명이 2명이 되는 것도 2배예요.</li>
<li>관찰 연구의 '관련 있다'는 <strong>원인이라는 뜻이 아니에요.</strong></li>
<li>세포나 동물 실험의 결과는 <strong>사람에게 그대로 적용되지 않아요.</strong></li>
<li>'모든 병에 효과', '부작용 없음', '의사들이 숨기는'은 대표적인 <strong>과장 신호</strong>예요.</li>
</ul></div>

<h2>연구 종류와 근거의 무게</h2>
<div class="tbl"><table>
<thead><tr><th>근거의 무게</th><th>연구 종류</th><th>설명</th></tr></thead>
<tbody>
<tr><td>강함</td><td>체계적 문헌고찰·메타분석</td><td>같은 질문에 대한 여러 연구를 모아 종합한 결과</td></tr>
<tr><td>강함</td><td>무작위 대조 시험</td><td>사람들을 무작위로 나눠 한쪽에만 치료를 하고 비교해요. 원인과 결과를 가장 잘 보여 줘요</td></tr>
<tr><td>중간</td><td>코호트·환자-대조군 연구(관찰 연구)</td><td>많은 사람을 지켜보며 관련성을 찾아요. 다른 요인이 섞일 수 있어요</td></tr>
<tr><td>약함</td><td>증례 보고, 개인 경험담</td><td>한두 사람의 이야기는 우연이나 다른 이유일 수 있어요</td></tr>
<tr><td>사람 근거 아님</td><td>세포·동물 실험</td><td>가능성을 탐색하는 단계예요. 사람에게서 확인되지 않은 경우가 대부분이에요</td></tr>
</tbody>
<caption>근거중심의학의 근거 수준 체계를 바탕으로 정리</caption></table></div>

<h2>'위험 2배'의 진짜 크기</h2>
<p>상대위험은 비율만 보여 줘요. 절대위험을 함께 봐야 실제 크기를 알 수 있어요.</p>
<ul>
<li>어떤 병이 원래 <strong>1만 명 중 1명</strong>에게 생기는데 위험이 2배가 되면 <strong>1만 명 중 2명</strong>이에요. 절대위험은 0.01%p 늘어난 거예요.</li>
<li>원래 <strong>100명 중 10명</strong>에게 생기는 병이 2배가 되면 <strong>100명 중 20명</strong>이에요. 같은 2배라도 무게가 전혀 달라요.</li>
<li>좋은 효과도 마찬가지예요. "위험 50% 감소"가 2%에서 1%로 줄어든 것일 수 있어요.</li>
</ul>

<h2>관련이 있다 ≠ 원인이다</h2>
<p>"커피를 마시는 사람이 오래 산다"는 관찰 결과가 있어도, 커피 때문인지, 커피를 마실 만큼 건강하고 여유 있는 사람이어서인지 구별하기 어려워요. 좋은 연구는 나이, 흡연, 소득, 운동 같은 다른 요인을 보정하지만 모든 요인을 없앨 수는 없어요. 그래서 관찰 연구 결과는 '가능성'으로 읽고, 무작위 시험이나 여러 연구의 일관된 결과가 있는지 확인해요.</p>

<h2>이런 점을 살펴보세요</h2>
<ul>
<li><strong>누구를 대상으로 했나:</strong> 사람인가, 동물인가? 몇 명인가? 나와 비슷한 사람인가?</li>
<li><strong>무엇과 비교했나:</strong> 위약(가짜약)과 비교했나, 아무것도 안 한 것과 비교했나?</li>
<li><strong>얼마나 오래:</strong> 몇 주 동안의 혈액 수치 변화인가, 몇 년 동안의 실제 병 발생인가?</li>
<li><strong>누가 돈을 냈나:</strong> 제품 회사의 지원을 받은 연구라면 더 꼼꼼히 봐요.</li>
<li><strong>다른 연구도 같은가:</strong> 한 편의 연구보다 여러 연구의 흐름이 중요해요.</li>
</ul>

<h2>과장 광고의 신호</h2>
<div class="tbl"><table>
<thead><tr><th>이런 표현이 나오면</th><th>왜 의심할까</th></tr></thead>
<tbody>
<tr><td>"암·당뇨·고혈압 모두에 효과"</td><td>하나의 제품이 여러 병을 한꺼번에 고치는 경우는 거의 없어요</td></tr>
<tr><td>"부작용 전혀 없음", "100% 천연"</td><td>효과가 있는 것은 대부분 부작용 가능성도 있어요. 천연이 안전을 뜻하지 않아요</td></tr>
<tr><td>"의사들이 숨기는 비밀", "기적의"</td><td>근거 대신 감정에 호소하는 표현이에요</td></tr>
<tr><td>"약을 끊어도 된다"</td><td>매우 위험해요. 약 조절은 의사와 해야 해요</td></tr>
<tr><td>"오늘만 할인", "선착순"</td><td>충분히 생각할 시간을 빼앗아요</td></tr>
<tr><td>체험담과 전후 사진 위주</td><td>개인 경험은 우연, 다른 치료, 선택된 사례일 수 있어요</td></tr>
</tbody>
<caption>식품의약품안전처, 공정거래위원회 부당 광고 안내를 바탕으로 정리</caption></table></div>
<ul>
<li><strong>건강기능식품</strong>은 식품의약품안전처가 인정한 기능성 문구(예: '○○에 도움을 줄 수 있음')만 쓸 수 있어요. 병을 '예방·치료'한다는 표현은 쓸 수 없어요.</li>
<li>일반 식품을 건강기능식품처럼 광고하는 것은 불법이에요. 제품에 '건강기능식품' 마크가 있는지 확인해요.</li>
<li>인플루언서가 대가를 받고 쓴 추천 글은 '광고', '협찬' 표시를 해야 해요.</li>
</ul>

<h2>믿을 만한 정보원</h2>
<ul>
<li>질병관리청 국가건강정보포털, 국립암센터 국가암정보센터</li>
<li>식품의약품안전처(의약품·건강기능식품 정보), 식품안전나라</li>
<li>각 분야 전문 학회의 환자용 안내</li>
<li>세계보건기구(WHO), 미국 국립보건원(NIH) 등 공공 기관</li>
<li>무엇보다 나를 진료하는 의사와 약사</li>
</ul>

<div class="box warn"><span class="h">이것만은 하지 마세요</span>
<ul>
<li>인터넷 정보만 보고 <strong>처방받은 약을 스스로 끊기</strong></li>
<li>검증되지 않은 치료 때문에 <strong>효과가 확인된 치료를 미루기</strong>(특히 암)</li>
<li>여러 건강기능식품과 약을 의사·약사에게 알리지 않고 함께 먹기</li>
</ul></div>

<div class="box"><span class="h">건강 정보 체크리스트</span>
<ol>
<li>출처가 공공기관·학회인지</li>
<li>사람 대상 연구인지, 몇 명인지</li>
<li>상대위험과 함께 절대위험 확인</li>
<li>'관련'과 '원인'을 구별하기</li>
<li>과장 표현·체험담 위주면 의심</li>
<li>결정 전 의사·약사와 상의</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>논문에 나왔다면 믿어도 되나요?</dt>
<dd>논문도 수준이 다양해요. 세포 실험, 작은 연구, 한 편의 결과는 뒤집히는 경우가 많아요. 여러 연구가 같은 방향을 가리키는지, 전문가 지침에 반영됐는지 함께 봐요.</dd>
<dt>의사마다 말이 달라요.</dt>
<dd>근거가 아직 확실하지 않은 분야에서는 전문가 의견이 갈릴 수 있어요. 각 선택의 이득과 위험, 근거의 수준을 물어보고, 필요하면 다른 의견도 들어 보세요.</dd>
<dt>뉴스에 '연구 결과'가 나오면 바로 따라 해도 되나요?</dt>
<dd>새 연구는 기존 근거에 더해지는 한 조각이에요. 한 편의 연구로 생활을 크게 바꾸기보다, 이미 충분히 확인된 기본(금연, 운동, 균형 잡힌 식사, 검진)을 먼저 지키는 게 좋아요.</dd>
</dl>
