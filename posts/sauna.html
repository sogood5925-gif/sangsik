  data-title="목욕탕·사우나 안전: 뜨거운 탕과 냉탕 사이, 술 마신 뒤와 심장병이 있을 때 조심할 것"
  data-thumb="10~15분|한 번에 머무는 시간"
  data-summary="따뜻한 탕과 사우나는 몸을 풀어 주지만, 추운 계절의 욕실과 목욕탕에서는 쓰러지고 넘어지는 사고가 늘어요. 갑작스러운 온도 변화가 심장과 혈관에 주는 부담, 사우나 전후 수분과 시간, 술 마신 뒤 목욕이 위험한 이유, 어르신·임신부·어린이 주의점, 찜질방 화상과 일산화탄소, 미끄럼 사고 예방을 정리했어요."
  data-tags="사우나,목욕탕,찜질방,온열,생활정보">
<p class="lead">뜨거운 물에 몸을 담그면 긴장이 풀리고 잠도 잘 와요. 그런데 추운 탈의실에서 뜨거운 탕으로, 다시 찬물로 오가는 사이 혈압은 크게 오르내려요. 대부분은 문제없지만, 나이가 많거나 심장·혈관 질환이 있거나 술을 마셨다면 이 변화가 쓰러짐으로 이어질 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>탕과 사우나는 <strong>한 번에 10~15분 안팎</strong>, 들어가기 전후로 <strong>물을 마셔요.</strong></li>
<li><strong>술 마신 뒤, 식사 직후, 몹시 피곤할 때</strong>는 뜨거운 탕과 사우나를 피해요.</li>
<li>뜨거운 곳에서 <strong>바로 냉탕</strong>으로 가는 급격한 온도 변화는 심혈관 질환이 있다면 피해요.</li>
<li>일어설 때는 <strong>천천히</strong>, 욕실 바닥은 미끄럼에 대비해요.</li>
</ul></div>

<h2>온도 변화가 몸에 주는 영향</h2>
<div class="tbl"><table>
<thead><tr><th>상황</th><th>몸의 변화</th><th>생길 수 있는 문제</th></tr></thead>
<tbody>
<tr><td>추운 탈의실·욕실</td><td>혈관이 수축해 혈압이 올라요</td><td>심장·뇌혈관에 부담</td></tr>
<tr><td>뜨거운 탕·사우나</td><td>혈관이 넓어지고 땀으로 수분이 빠져요. 혈압이 떨어지고 맥박이 빨라져요</td><td>어지러움, 실신, 탈수</td></tr>
<tr><td>탕에서 갑자기 일어설 때</td><td>피가 다리로 몰려 뇌로 가는 피가 줄어요</td><td>기립성 저혈압으로 쓰러짐</td></tr>
<tr><td>바로 냉탕</td><td>혈관이 급히 수축해 혈압이 치솟아요</td><td>부정맥, 심장에 큰 부담</td></tr>
</tbody>
<caption>대한심장학회 겨울철 심혈관 건강 안내, 일본 소비자청 겨울철 입욕 사고 주의 자료를 바탕으로 정리</caption></table></div>

<h2>안전하게 즐기는 법</h2>
<ol>
<li>들어가기 전 <strong>물 한 컵</strong>을 마셔요.</li>
<li>탈의실과 욕실이 너무 춥지 않게 하고, 먼저 <strong>손발부터 끼얹어</strong> 몸을 적응시켜요.</li>
<li>탕 온도는 <strong>40°C 안팎</strong>이 무난해요. 너무 뜨거운 물은 부담이 커요.</li>
<li>탕과 사우나는 <strong>한 번에 10~15분 안팎</strong>, 어지럽거나 숨이 차면 바로 나와요.</li>
<li>나올 때는 난간을 잡고 <strong>천천히</strong> 일어나요.</li>
<li>나온 뒤 충분히 쉬고 물을 마셔요.</li>
</ol>

<h2>술 마신 뒤는 왜 위험할까</h2>
<p>술은 혈관을 넓히고 수분을 빼앗아요. 여기에 뜨거운 물과 사우나까지 더해지면 혈압이 크게 떨어지고, 판단력이 흐려져 탕에서 잠들거나 쓰러질 수 있어요. 탕 안에서 의식을 잃으면 익사로 이어질 수 있어요. <strong>술을 마신 날은 샤워만</strong> 하고, 해장을 위한 사우나는 피해요.</p>

<h2>더 조심해야 하는 사람</h2>
<div class="tbl"><table>
<thead><tr><th>누가</th><th>주의할 점</th></tr></thead>
<tbody>
<tr><td>협심증, 심근경색, 심부전, 부정맥</td><td>뜨거운 사우나와 냉탕 오가기는 피하고, 괜찮은지 의사와 상의해요</td></tr>
<tr><td>조절되지 않는 고혈압, 저혈압</td><td>온도가 낮은 탕에서 짧게. 혈압약을 먹는다면 어지러움 주의</td></tr>
<tr><td>어르신</td><td>혼자 가지 않거나 직원에게 알려요. 탈의실 온도 차가 큰 겨울에 특히 조심</td></tr>
<tr><td>임신부</td><td>임신 초기의 높은 체온은 태아에게 해로울 수 있어요. 뜨거운 탕과 사우나는 피해요</td></tr>
<tr><td>어린이</td><td>체온이 빨리 올라요. 보호자와 함께 짧게</td></tr>
<tr><td>당뇨 신경병증</td><td>뜨거움을 잘 못 느껴 화상 위험. 온도를 손으로 확인</td></tr>
<tr><td>감기·장염·열이 있을 때</td><td>탈수와 어지러움이 심해질 수 있어요. 쉬어요</td></tr>
</tbody>
<caption>대한심장학회, 미국심장협회(AHA) 사우나와 심장 건강 안내를 바탕으로 정리</caption></table></div>

<div class="box warn"><span class="h">이럴 때는 바로 도움을 청해요</span>
<ul>
<li>탕이나 사우나 안에서 <strong>가슴 통증, 심한 숨참, 식은땀</strong></li>
<li>한쪽 팔다리 힘 빠짐, 말이 어눌해짐</li>
<li>쓰러진 사람을 발견하면 물 밖으로 꺼내 눕히고 <strong>119</strong>에 신고해요. 반응과 숨이 없으면 심폐소생술을 시작해요.</li>
</ul></div>

<h2>찜질방에서</h2>
<ul>
<li>고온 방은 짧게 머물고, 뜨거운 바닥에 맨살로 오래 누우면 <strong>저온 화상</strong>을 입을 수 있어요. 수건을 깔아요.</li>
<li>숯가마, 불가마처럼 불을 쓰는 곳은 환기가 나쁘면 <strong>일산화탄소</strong>가 쌓일 수 있어요. 두통, 메스꺼움이 생기면 바로 밖으로 나와요.</li>
<li>잠을 잘 때는 고온 방이 아닌 휴게 공간에서 자요.</li>
</ul>

<h2>미끄럼과 감염 예방</h2>
<ul>
<li>비눗물이 남은 바닥이 가장 미끄러워요. 천천히 걷고 난간을 잡아요.</li>
<li>탕에 들어가기 전 몸을 씻어요. 상처가 있으면 탕에 들어가지 않아요.</li>
<li>목욕탕 물 관리가 부실하면 레지오넬라균 등이 자랄 수 있어요. 물이 탁하거나 냄새가 나면 이용하지 않아요.</li>
<li>개인 수건과 면도기를 따로 써요.</li>
</ul>

<div class="box"><span class="h">목욕·사우나 체크리스트</span>
<ol>
<li>들어가기 전후 물 마시기</li>
<li>한 번에 10~15분 안팎</li>
<li>술·식사 직후엔 샤워만</li>
<li>냉탕은 심장 질환이면 피하기</li>
<li>일어설 때 천천히, 난간 잡기</li>
<li>어지러우면 바로 나와 눕기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>사우나로 땀을 빼면 살이 빠지나요?</dt>
<dd>빠진 것은 대부분 수분이라 물을 마시면 돌아와요. 땀을 억지로 오래 빼면 탈수가 올 수 있어요.</dd>
<dt>사우나가 심장에 좋다는 연구도 있던데요?</dt>
<dd>핀란드 등에서 사우나를 자주 하는 사람의 심혈관 위험이 낮았다는 관찰 연구가 있지만, 생활 습관 차이도 영향을 줬을 수 있어요. 심장 질환이 있다면 먼저 의사와 상의해요.</dd>
<dt>집 욕조에서도 조심해야 하나요?</dt>
<dd>겨울철 집 욕실은 탈의 공간이 추워 온도 차가 더 커요. 욕실을 미리 데우고, 어르신이 오래 욕조에 계시면 가족이 가끔 말을 걸어 확인해요.</dd>
</dl>
