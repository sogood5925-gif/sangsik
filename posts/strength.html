  data-title="근육은 연금보다 중요하다: 근감소증 자가진단과 집에서 하는 근력 운동"
  data-thumb="28kg|남성 악력 기준"
  data-summary="근육은 30대부터 조금씩 줄어들고 60대 이후 빠르게 줄어요. 2021년 질병으로 공식 등록된 근감소증의 기준, 집에서 해보는 자가 점검, 도구 없이 하는 근력 운동, 단백질 섭취까지 정리했어요."
  data-tags="근력운동,근감소증,노화,단백질,홈트레이닝">
<p class="lead">나이 들어 넘어지고, 병원에 오래 누워 있고, 혼자 움직이기 어려워지는 과정의 한가운데에는 대개 근육이 있어요. 근육은 힘을 쓰는 기관이면서 혈당을 쓰고, 뼈를 지키고, 넘어짐을 막는 기관이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>근육량과 근력은 30대 이후 서서히 줄고 <strong>60대 이후 빨라져요.</strong></li>
<li>근감소증은 국내에서 <strong>2021년 질병코드</strong>가 생긴 공식 질병이에요.</li>
<li>근력 운동은 <strong>일주일에 2일 이상</strong>, 주요 근육을 모두 쓰도록 해요.</li>
<li>운동과 함께 <strong>끼니마다 단백질</strong>을 챙겨야 근육이 만들어져요.</li>
</ul></div>

<h2>근육이 줄어드는 속도</h2>
<p>근육은 20~30대에 가장 많고 그 뒤로 조금씩 줄어요. 연구마다 차이가 있지만 중년 이후 해마다 근육량이 조금씩 줄고, <strong>근력은 근육량보다 더 빨리</strong> 떨어져요. 특히 60대 이후, 그리고 병으로 누워 지내거나 활동이 줄었을 때 급격히 빠져요. 며칠만 입원해 누워 있어도 다리 근육이 눈에 띄게 줄어요.</p>
<p>근육이 줄면 이런 일이 생겨요.</p>
<ul>
<li><strong>넘어지기 쉬워져요.</strong> 넘어짐은 노인 골절과 입원의 주요 원인이에요.</li>
<li><strong>혈당 조절이 나빠져요.</strong> 근육은 식후 포도당을 가장 많이 쓰는 곳이에요.</li>
<li><strong>기초대사량이 줄어요.</strong> 같은 양을 먹어도 살이 찌기 쉬워요.</li>
<li><strong>일상 동작이 힘들어져요.</strong> 계단 오르기, 장바구니 들기, 의자에서 일어나기가 어려워져요.</li>
</ul>

<h2>근감소증: 이제는 병이다</h2>
<p>근육량과 근력, 신체 기능이 함께 떨어진 상태를 <strong>근감소증</strong>이라고 해요. 세계보건기구 질병분류에 등록된 데 이어 국내에서도 2021년 한국표준질병사인분류에 질병코드가 생겼어요. 단순한 노화 현상이 아니라 진단하고 관리해야 하는 상태라는 뜻이에요.</p>

<h2>집에서 해보는 자가 점검</h2>
<div class="box note"><span class="h">이런 변화가 있다면 확인해 보세요</span>
<ul>
<li><strong>의자 일어서기:</strong> 팔짱을 끼고 의자에서 5번 일어났다 앉기를 빠르게 해봐요. 12초 넘게 걸리면 다리 근력이 떨어졌을 수 있어요.</li>
<li><strong>종아리 둘레:</strong> 양손 엄지와 검지로 고리를 만들어 종아리의 가장 굵은 부분을 감싸봐요. 고리가 헐렁하게 남는다면 근육이 줄었을 가능성이 있어요(손가락 고리 검사).</li>
<li><strong>일상 변화:</strong> 최근에 병뚜껑 열기가 힘들어졌거나, 걷는 속도가 느려졌거나, 이유 없이 체중이 줄었는지 살펴봐요.</li>
</ul>
<p>이 점검은 참고용이에요. 걱정된다면 가정의학과나 노인의학 진료에서 악력과 체성분 검사를 받아볼 수 있어요.</p></div>

<h2>근력 운동의 기본 원칙</h2>
<div class="tbl"><table>
<thead><tr><th>항목</th><th>권장</th></tr></thead>
<tbody>
<tr><td>빈도</td><td>일주일에 2~3일, 같은 근육은 하루 이상 쉬고 다시</td></tr>
<tr><td>대상</td><td>다리, 엉덩이, 등, 가슴, 어깨, 팔, 복부 등 주요 근육 모두</td></tr>
<tr><td>강도</td><td>8~12회 반복하면 마지막 두세 번이 힘든 정도 (노인이나 초보자는 10~15회)</td></tr>
<tr><td>세트</td><td>처음엔 1세트, 익숙해지면 2~3세트</td></tr>
<tr><td>늘리기</td><td>쉬워지면 횟수 → 세트 → 무게나 난이도 순서로</td></tr>
</tbody>
<caption>세계보건기구 신체활동 지침, 미국스포츠의학회(ACSM) 권고를 바탕으로 정리</caption></table></div>
<p>근육은 <strong>조금 힘들다 싶은 자극</strong>을 받아야 자라요. 너무 가벼우면 효과가 적고, 너무 무거우면 다쳐요. 자세가 흐트러지지 않는 선에서 마지막 몇 회가 힘든 정도가 적당해요.</p>

<h2>도구 없이 집에서 하는 여섯 가지</h2>
<h3>1. 의자 스쿼트 (허벅지, 엉덩이)</h3>
<p>의자 앞에 서서 발을 어깨너비로 벌리고, 엉덩이를 뒤로 빼며 의자에 앉듯 내려가요. 엉덩이가 의자에 살짝 닿으면 발뒤꿈치로 바닥을 밀며 일어나요. 무릎이 안쪽으로 모이지 않게 해요.</p>
<h3>2. 벽 팔굽혀펴기 (가슴, 팔)</h3>
<p>벽에서 한 걸음 떨어져 손을 어깨 높이로 벽에 짚고, 몸을 일자로 유지하며 가슴을 벽 쪽으로 가져갔다가 밀어내요. 쉬워지면 식탁, 그다음 바닥 무릎 대고 팔굽혀펴기로 넘어가요.</p>
<h3>3. 엉덩이 들기 (엉덩이, 허리)</h3>
<p>누워서 무릎을 세우고 엉덩이에 힘을 주며 어깨부터 무릎까지 일직선이 되게 들어 올려요. 2초 버티고 천천히 내려요.</p>
<h3>4. 까치발 들기 (종아리)</h3>
<p>의자 등받이를 잡고 서서 발뒤꿈치를 최대한 들었다가 천천히 내려요. 균형 훈련도 함께 돼요.</p>
<h3>5. 물병 로우 (등)</h3>
<p>물을 채운 페트병을 양손에 들고 허리를 곧게 편 채 상체를 약간 숙여요. 팔꿈치를 뒤로 당겨 날개뼈를 모았다가 천천히 내려요.</p>
<h3>6. 한 발 서기 (균형)</h3>
<p>식탁을 짚고 한 발로 30초 서 있어요. 익숙해지면 손을 떼고, 더 익숙해지면 눈을 감아요. 65세 이상은 균형 운동을 꼭 포함하도록 권해요.</p>
<div class="box warn"><span class="h">주의할 점</span>
<ul>
<li>힘을 줄 때 <strong>숨을 참지 말고</strong> 내쉬어요. 숨을 참으면 혈압이 크게 오를 수 있어요. 고혈압이 있다면 특히 중요해요.</li>
<li>관절에 날카로운 통증이 생기면 멈춰요. 근육이 뻐근한 것은 괜찮지만 관절 통증은 신호예요.</li>
<li>심장질환, 조절되지 않는 고혈압, 최근 수술이나 골절이 있다면 먼저 의사와 상의해요.</li>
</ul></div>

<h2>운동만으로는 부족하다: 단백질</h2>
<p>근력 운동은 근육을 만들라는 신호이고, 단백질은 그 재료예요. 재료가 없으면 신호를 줘도 근육이 늘지 않아요.</p>
<ul>
<li>한국인 성인의 단백질 권장섭취량은 체중 1kg당 약 0.8~0.9g 수준이지만, <strong>노인은 1.0~1.2g</strong> 정도가 필요하다는 전문가 권고가 있어요. 60kg이라면 하루 60~72g이에요.</li>
<li><strong>한 끼에 몰아 먹기보다 세 끼에 나눠</strong> 먹는 게 근육 합성에 유리해요. 끼니마다 달걀, 두부, 생선, 고기, 콩, 우유 중 하나 이상을 넣어요.</li>
<li>콩팥 기능이 떨어진 사람은 단백질을 제한해야 할 수 있으니 의사와 상의해요.</li>
</ul>

<h2>일주일 계획 예시</h2>
<div class="box"><span class="h">초보자를 위한 주간 계획</span>
<ol>
<li>월: 여섯 가지 운동 각 10회 × 1세트, 한 발 서기 30초씩</li>
<li>화: 빠르게 걷기 30분</li>
<li>수: 휴식 또는 가벼운 스트레칭</li>
<li>목: 여섯 가지 운동 각 10회 × 1~2세트</li>
<li>금: 빠르게 걷기 30분</li>
<li>토: 여섯 가지 운동, 쉬운 것은 횟수 늘리기</li>
<li>일: 휴식</li>
</ol>
<p>2~3주 뒤 쉽게 느껴지면 세트를 늘리고, 그다음 페트병을 더 무거운 것으로, 스쿼트는 더 깊게 해봐요.</p></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>나이가 많아도 근육이 늘어나나요?</dt>
<dd>네. 80~90대에서도 근력 운동으로 근력과 보행 능력이 좋아졌다는 연구가 있어요. 시작하기에 늦은 나이는 없어요.</dd>
<dt>걷기만 열심히 하면 근육도 유지되나요?</dt>
<dd>걷기는 심폐 기능과 혈당에 좋지만 근육을 키우는 자극으로는 부족해요. 특히 허벅지 앞쪽과 상체 근육은 따로 근력 운동을 해야 유지돼요.</dd>
<dt>단백질 보충제를 먹어야 하나요?</dt>
<dd>식사로 충분히 먹는다면 필요 없어요. 입맛이 없거나 식사량이 적어 음식으로 채우기 어려운 노인에게는 도움이 될 수 있어요.</dd>
</dl>
