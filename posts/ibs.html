<p class="lead">과민성 대장 증후군은 장에 눈에 보이는 병변은 없는데 장이 예민하게 반응하는 상태예요. 검사가 정상이라는 말이 '아무 문제 없다'는 뜻은 아니에요. 증상은 실제로 있고, 관리하는 방법도 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>최근 3개월 동안 <strong>일주일에 한 번 이상</strong> 복통이 있고, 배변과 관련해 변하면 의심해요.</li>
<li>원인은 하나가 아니라 <strong>장의 예민함, 장운동, 장내 세균, 뇌와 장의 신호</strong>가 함께 작용해요.</li>
<li><strong>혈변, 체중 감소, 50세 이후 새로 생긴 증상, 밤에 깨는 설사</strong>는 다른 병을 먼저 확인해야 해요.</li>
<li><strong>저포드맵 식사</strong>는 짧게 제한하고 다시 하나씩 늘려가는 방식이에요. 평생 하는 식단이 아니에요.</li>
</ul></div>

<h2>진단 기준과 유형</h2>
<p>과민성 대장 증후군은 국제 기준(로마 기준 IV)으로 진단해요.</p>
<div class="box note"><span class="h">로마 기준 IV</span>
<p>최근 3개월 동안 <strong>평균 일주일에 1일 이상 반복되는 복통</strong>이 있고, 다음 중 두 가지 이상에 해당해요.</p>
<ul>
<li>배변과 관련이 있다 (배변 후 좋아지거나 나빠짐)</li>
<li>배변 횟수의 변화와 함께 시작된다</li>
<li>대변 모양의 변화와 함께 시작된다</li>
</ul>
<p>증상은 진단 최소 6개월 전에 시작됐어야 해요.</p></div>
<div class="tbl"><table>
<thead><tr><th>유형</th><th>특징</th></tr></thead>
<tbody>
<tr><td>설사형 (IBS-D)</td><td>묽은 변이 잦고 급하게 화장실에 가야 해요.</td></tr>
<tr><td>변비형 (IBS-C)</td><td>딱딱한 변, 배변이 힘들고 덜 본 느낌이 있어요.</td></tr>
<tr><td>혼합형 (IBS-M)</td><td>설사와 변비가 번갈아 나타나요.</td></tr>
<tr><td>분류 불가형</td><td>어느 쪽으로도 뚜렷하지 않아요.</td></tr>
</tbody></table></div>
<p>유형은 증상이 있는 날의 대변 모양으로 나눠요. 대변 모양을 1(딱딱한 덩어리)부터 7(물 같은 변)까지 나눈 <strong>브리스톨 대변 척도</strong>를 쓰면 기록하기 쉬워요.</p>

<h2>왜 생길까</h2>
<ul>
<li><strong>내장 과민성:</strong> 같은 양의 가스나 장의 움직임에도 통증을 더 크게 느껴요.</li>
<li><strong>장운동 이상:</strong> 장이 너무 빨리 움직이면 설사, 너무 느리면 변비가 돼요.</li>
<li><strong>장-뇌 축:</strong> 장과 뇌는 신경과 호르몬으로 끊임없이 신호를 주고받아요. 스트레스와 불안이 장 증상을 악화시키고, 장 증상이 다시 불안을 키워요. 시험이나 발표 전에 배가 아픈 것과 같은 원리예요.</li>
<li><strong>감염 후:</strong> 세균성 장염을 앓은 뒤 과민성 대장 증후군이 생기는 경우가 적지 않아요.</li>
<li><strong>장내 세균 변화, 음식 반응</strong></li>
</ul>

<h2>꼭 검사가 필요한 경고 신호</h2>
<div class="box warn"><span class="h">이런 증상은 과민성 대장 증후군으로 넘기지 마세요</span>
<ul>
<li>대변에 피가 섞이거나 검은 변을 봐요.</li>
<li>의도하지 않은 체중 감소가 있어요.</li>
<li><strong>50세 이후</strong> 처음 증상이 생겼어요.</li>
<li>설사나 복통 때문에 <strong>자다가 깨요.</strong></li>
<li>빈혈, 열이 있어요.</li>
<li>가족 중 대장암, 염증성 장질환(크론병, 궤양성 대장염), 셀리악병이 있어요.</li>
<li>배에서 덩어리가 만져져요.</li>
</ul>
<p>이런 경우 대장내시경과 혈액검사로 대장암, 염증성 장질환 같은 다른 병을 먼저 확인해요.</p></div>

<h2>저포드맵 식사법</h2>
<p><strong>포드맵(FODMAP)</strong>은 소장에서 잘 흡수되지 않고 대장으로 넘어가 장내 세균에 의해 빠르게 발효되는 탄수화물들을 묶어 부르는 말이에요. 발효되면서 가스가 생기고 장 안으로 물을 끌어들여 복부 팽만, 복통, 설사를 일으켜요.</p>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>많이 든 음식 (예)</th></tr></thead>
<tbody>
<tr><td>올리고당 (프럭탄, 갈락탄)</td><td>밀, 보리, 호밀, 양파, 마늘, 파의 흰 부분, 콩류</td></tr>
<tr><td>이당류 (유당)</td><td>우유, 연성 치즈, 아이스크림</td></tr>
<tr><td>단당류 (과당 과잉)</td><td>사과, 배, 수박, 꿀, 액상과당</td></tr>
<tr><td>폴리올 (당알코올)</td><td>자일리톨·솔비톨 등이 든 무설탕 껌·사탕, 버섯, 복숭아, 자두</td></tr>
</tbody>
<caption>음식별 함량과 허용량은 모나시대학 저포드맵 자료 등을 참고해요.</caption></table></div>
<h3>세 단계로 진행해요</h3>
<ol>
<li><strong>제한 (2~6주):</strong> 포드맵이 많은 음식을 줄여요. 증상이 좋아지는지 확인해요.</li>
<li><strong>재도입 (6~8주):</strong> 한 번에 한 종류씩 다시 먹어보며 어떤 음식이 나에게 증상을 일으키는지 찾아요.</li>
<li><strong>개인화:</strong> 나에게 문제가 되는 음식만 줄이고 나머지는 다시 자유롭게 먹어요.</li>
</ol>
<p>포드맵 식품 중에는 장내 좋은 세균의 먹이가 되는 것도 많아서, <strong>오랫동안 제한만 하면 장내 세균의 다양성이 줄 수 있어요.</strong> 가능하면 영양사의 도움을 받아 진행하는 게 좋아요.</p>
<h3>그 밖의 식사 요령</h3>
<ul>
<li><strong>수용성 식이섬유</strong>(차전자피 등)는 설사와 변비 모두에 도움이 될 수 있어요. 반면 밀기울 같은 불용성 섬유는 팽만을 악화시키기도 해요.</li>
<li>규칙적인 시간에, 천천히, 적당한 양을 먹어요.</li>
<li>카페인, 술, 기름진 음식, 매운 음식이 증상을 악화시키는지 확인해요.</li>
<li>탄산음료와 빨대, 껌은 삼키는 공기를 늘려 팽만을 만들 수 있어요.</li>
</ul>

<h2>약물 치료</h2>
<div class="tbl"><table>
<thead><tr><th>증상</th><th>쓰이는 약 (예)</th></tr></thead>
<tbody>
<tr><td>복통, 경련</td><td>진경제, 페퍼민트 오일 제제</td></tr>
<tr><td>설사</td><td>로페라마이드 같은 지사제, 담즙산 결합제, 리팍시민(장내 세균 조절 항생제)</td></tr>
<tr><td>변비</td><td>폴리에틸렌글리콜 같은 삼투성 완하제, 장 분비를 늘리는 약</td></tr>
<tr><td>지속되는 통증</td><td>저용량 삼환계 항우울제 등 신경조절제 (장의 통증 신호를 줄이는 목적)</td></tr>
</tbody>
<caption>대한소화기기능성질환·운동학회 진료지침 등을 바탕으로 정리. 약 선택은 증상과 유형에 따라 의사가 정해요.</caption></table></div>
<p>항우울제를 권유받으면 "내가 우울증이라는 건가?" 싶을 수 있어요. 여기서는 우울증 치료가 아니라 <strong>장과 뇌 사이의 통증 신호를 낮추기 위해</strong> 우울증 치료보다 훨씬 적은 용량으로 써요.</p>

<h2>마음과 장을 함께 다루는 치료</h2>
<p>장-뇌 축이 중요한 만큼 심리적 치료도 효과가 확인돼 있어요. <strong>인지행동치료</strong>와 <strong>장 지향 최면 치료</strong>는 여러 연구에서 증상을 의미 있게 줄였어요. 규칙적인 운동과 충분한 수면도 장 증상을 줄이는 데 도움이 돼요.</p>

<div class="box"><span class="h">증상 관리 일기 (2주)</span>
<ol>
<li>매일 먹은 음식과 시간 적기</li>
<li>복통 정도(0~10점)와 시간 적기</li>
<li>대변 횟수와 모양(브리스톨 척도 1~7) 적기</li>
<li>스트레스, 수면, 월경 주기 함께 적기</li>
<li>진료 때 기록을 가져가기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>과민성 대장 증후군이 대장암이 되나요?</dt>
<dd>아니에요. 과민성 대장 증후군은 대장암이나 염증성 장질환으로 진행하지 않아요. 다만 증상이 겹칠 수 있어서 경고 신호가 있으면 검사가 필요하고, 나이에 맞는 대장암 검진은 따로 받아야 해요.</dd>
<dt>유산균을 먹으면 좋아지나요?</dt>
<dd>일부 균주가 팽만이나 전반적인 증상을 줄였다는 연구가 있지만, 균주마다 효과가 달라 일관된 결론은 없어요. 한 제품을 4주 정도 먹어보고 효과가 없으면 중단하는 방식을 권하기도 해요.</dd>
<dt>글루텐을 끊어야 하나요?</dt>
<dd>밀에 든 프럭탄(포드맵의 일종)이 증상을 일으키는 경우가 많아서 밀을 줄이면 좋아지기도 해요. 다만 셀리악병인지 확인하려면 글루텐을 끊기 전에 검사해야 정확해요.</dd>
</dl>
