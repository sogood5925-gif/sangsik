  data-title="에너지 음료: 한 캔의 카페인과 설탕, 청소년 하루 기준, 술과 섞어 마시면 안 되는 이유"
  data-thumb="2.5mg/kg|청소년 하루 카페인"
  data-summary="시험 기간과 야근에 에너지 음료를 찾는 사람이 많아요. 한 캔에 든 카페인과 당, 타우린 등 다른 성분의 실제 역할, 성인·임신부·청소년의 하루 카페인 기준, '고카페인 함유' 표시, 여러 캔을 마시거나 술과 섞을 때의 위험, 두근거림과 불면 같은 신호, 에너지 음료 없이 버티는 법을 정리했어요."
  data-tags="에너지음료,카페인,청소년,고카페인,영양소">
<p class="lead">밤샘 공부나 야근 전에 에너지 음료 한 캔을 따면 잠이 확 깨는 느낌이 들어요. 그 힘의 대부분은 카페인과 설탕이에요. 한두 캔은 문제가 없을 수 있지만, 몸집이 작은 청소년이 여러 캔을 마시거나 커피와 겹치면 카페인이 금방 기준을 넘어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>에너지 음료 한 캔의 카페인은 제품에 따라 <strong>약 60~160mg</strong>, 당류는 <strong>20~40g</strong>인 경우가 많아요.</li>
<li>하루 카페인 기준: 성인 <strong>400mg</strong>, 임신부 <strong>300mg</strong>, 어린이·청소년 <strong>체중 1kg당 2.5mg</strong> 이하예요.</li>
<li><strong>술과 섞어 마시면</strong> 취한 정도를 덜 느껴 더 많이 마시고 위험해져요.</li>
<li>두근거림, 손 떨림, 불안, 불면은 <strong>카페인 과다</strong> 신호예요.</li>
</ul></div>

<h2>한 캔에 무엇이 들어 있을까</h2>
<div class="tbl"><table>
<thead><tr><th>성분</th><th>양(대략)</th><th>역할</th></tr></thead>
<tbody>
<tr><td>카페인</td><td class="num">60~160mg</td><td>잠을 쫓고 각성시키는 주성분</td></tr>
<tr><td>당류</td><td class="num">20~40g</td><td>빠른 에너지. 각설탕 5~10개 분량. 무설탕 제품은 감미료 사용</td></tr>
<tr><td>타우린</td><td>제품마다 다름</td><td>몸에서도 만들어지는 아미노산 유사 물질. 에너지 음료 속 양으로 피로 회복 효과가 확인되지는 않았어요</td></tr>
<tr><td>비타민 B군</td><td>제품마다 다름</td><td>보통 식사로 충분해 추가 효과는 크지 않아요</td></tr>
<tr><td>과라나 등</td><td>제품마다 다름</td><td>식물 속 카페인이 더해져요. 표시된 카페인 외에 더 들어 있을 수 있어요</td></tr>
</tbody>
<caption>식품의약품안전처 카페인 함량 조사, 유럽식품안전청(EFSA) 에너지 음료 성분 평가를 바탕으로 정리. 정확한 양은 제품 표시를 확인해요</caption></table></div>

<h2>하루 카페인 기준</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th class="num">하루 최대 권고량</th><th>예</th></tr></thead>
<tbody>
<tr><td>성인</td><td class="num">400mg 이하</td><td>커피 2잔 + 에너지 음료 1캔이면 가까워져요</td></tr>
<tr><td>임신부</td><td class="num">300mg 이하</td><td>에너지 음료는 피하는 게 좋아요</td></tr>
<tr><td>어린이·청소년</td><td class="num">체중 1kg당 2.5mg 이하</td><td>체중 50kg이면 125mg. 큰 캔 하나로도 넘길 수 있어요</td></tr>
</tbody>
<caption>식품의약품안전처, 카페인 최대 일일 섭취 권고량</caption></table></div>
<p>1mL당 카페인이 0.15mg 이상인 음료에는 <strong>'고카페인 함유'</strong>와 총 카페인 양, 어린이·임산부·카페인 민감자 주의 문구가 표시돼요. 학교 안에서는 고카페인 음료를 팔 수 없어요.</p>

<h2>카페인 과다 신호</h2>
<ul>
<li>가슴 두근거림, 빠른 맥박</li>
<li>손 떨림, 불안, 초조함</li>
<li>잠들기 어려움, 얕은 잠</li>
<li>속 쓰림, 메스꺼움, 잦은 소변</li>
<li>두통, 짜증</li>
</ul>
<p>늘 마시던 사람이 갑자기 끊으면 두통, 피로, 집중력 저하 같은 <strong>금단 증상</strong>이 며칠 이어질 수 있어요. 천천히 줄이면 편해요.</p>

<div class="box warn"><span class="h">바로 진료가 필요한 경우</span>
<ul>
<li>여러 캔을 마신 뒤 <strong>가슴 통증, 심한 두근거림, 맥박이 불규칙함</strong></li>
<li>숨이 차고 어지러우며 쓰러질 것 같아요.</li>
<li>경련, 심한 구토, 혼란</li>
</ul>
<p>심장 질환(부정맥, 선천성 심장병), 고혈압, 갑상선 기능 항진증이 있는 사람은 에너지 음료를 피하는 것이 좋아요. 카페인 알약이나 가루와 함께 먹으면 위험이 커져요.</p></div>

<h2>술과 섞어 마시면</h2>
<p>에너지 음료와 술을 섞으면 카페인 때문에 <strong>취한 느낌을 덜 받아요.</strong> 하지만 몸속 알코올의 양과 판단력 저하는 그대로라서, 더 많이 마시고, 음주 운전이나 사고, 급성 알코올 중독 위험이 커져요. 카페인과 알코올이 함께 심장에 부담을 주기도 해요.</p>

<h2>에너지 음료 없이 버티기</h2>
<ul>
<li>시험·마감 전날은 벼락치기보다 <strong>잠을 지키는</strong> 편이 기억과 집중에 더 좋아요.</li>
<li>졸리면 <strong>15~20분 낮잠</strong>이 에너지 음료보다 효과적일 수 있어요.</li>
<li>물을 충분히 마시고, 끼니를 거르지 않아요. 배고픔과 탈수도 피로를 부르거든요.</li>
<li>잠깐 걷기, 스트레칭, 찬물 세수</li>
<li>꼭 마신다면 <strong>하루 한 캔 이하</strong>, 오후 늦게는 피하고, 커피와 겹치지 않게 해요.</li>
</ul>

<div class="box"><span class="h">에너지 음료 체크리스트</span>
<ol>
<li>캔의 카페인·당류 확인</li>
<li>하루 카페인 총량 계산</li>
<li>청소년은 체중 × 2.5mg 넘지 않게</li>
<li>술과 섞지 않기</li>
<li>오후 늦게는 피하기</li>
<li>두근거림·가슴 통증은 중단하고 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>무설탕 에너지 음료는 괜찮나요?</dt>
<dd>당은 줄지만 카페인은 그대로예요. 카페인 기준은 똑같이 지켜요.</dd>
<dt>운동 전에 마시면 기록이 좋아지나요?</dt>
<dd>카페인이 지구력에 조금 도움이 될 수 있지만, 탄산과 당이 속을 불편하게 할 수 있어요. 더운 날 많이 마시면 탈수와 두근거림이 생길 수 있어요.</dd>
<dt>약국·편의점의 피로회복 드링크도 같은가요?</dt>
<dd>피로회복제로 판매되는 드링크에도 카페인이 들어 있는 경우가 많아요. 제품 표시를 보고 하루 총량에 포함해요.</dd>
</dl>
