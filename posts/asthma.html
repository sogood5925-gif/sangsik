  data-title="천식: 증상이 없을 때도 흡입제를 쓰는 이유, 조절 점검과 응급 신호"
  data-thumb="4주|조절 상태 점검 기간"
  data-summary="천식은 기관지에 만성 염증이 있어 기침, 쌕쌕거림, 숨참이 반복되는 병이에요. 진단 검사, 증상 완화제만 쓰면 위험한 이유, 흡입 스테로이드와 최근 치료 원칙, 흡입기 바르게 쓰는 법, 악화 요인, 말을 잇기 어려울 만큼 숨이 찬 응급 상황 대처를 정리했어요."
  data-tags="천식,흡입제,기관지,호흡기,질병">
<p class="lead">천식은 숨이 찰 때만 생기는 병이 아니에요. 증상이 없는 날에도 기관지 안쪽에는 염증이 남아 있어, 찬 공기나 감기, 담배 연기 같은 작은 자극에도 기관지가 좁아져요. 그래서 천식 치료의 중심은 '급할 때 뿌리는 약'이 아니라 '염증을 가라앉히는 약'이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>천식은 <strong>기관지의 만성 염증</strong> 때문에 기침, 쌕쌕거림, 숨참, 가슴 답답함이 반복되는 병이에요.</li>
<li>최근 치료 원칙은 증상 완화제만 쓰지 않고, <strong>흡입 스테로이드가 들어간 약</strong>을 함께 쓰는 거예요.</li>
<li>흡입기는 <strong>쓰는 방법</strong>이 효과를 좌우해요. 진료 때 한 번씩 확인받아요.</li>
<li><strong>말을 한 문장으로 잇기 어렵거나 입술이 파래지면</strong> 119를 불러요.</li>
</ul></div>

<h2>천식은 어떤 병일까</h2>
<p>천식이 있으면 기관지 벽이 붓고 예민해져 있어요. 자극을 받으면 기관지 주변 근육이 조이고 가래가 늘어 공기 길이 좁아져요. 증상은 <strong>밤이나 새벽에 심해지고</strong>, 날마다 달라지는 것이 특징이에요.</p>
<ul>
<li>쌕쌕거리는 숨소리(천명)</li>
<li>밤이나 운동 후, 찬 공기를 마신 뒤 심해지는 기침</li>
<li>가슴이 조이거나 답답함</li>
<li>숨이 참</li>
</ul>
<p>어릴 때 시작하는 경우가 많지만 성인이 되어 처음 생기기도 해요. 알레르기 비염, 아토피 피부염이 함께 있는 경우가 흔해요.</p>

<h2>진단</h2>
<ul>
<li><strong>폐기능 검사:</strong> 숨을 세게 내쉬어 기관지가 좁아졌는지 보고, 기관지 확장제를 흡입한 뒤 좋아지는지(가역성) 확인해요.</li>
<li><strong>최대호기유량 측정:</strong> 집에서 작은 기구로 며칠간 재어 변동 폭을 봐요.</li>
<li><strong>기관지 유발 검사:</strong> 폐기능이 정상일 때 기관지의 예민함을 확인해요.</li>
<li><strong>호기 산화질소 검사, 알레르기 검사</strong>로 염증 유형과 원인을 살펴요.</li>
</ul>
<p>기침이 8주 넘게 계속된다면 기침형 천식도 원인 가운데 하나라 검사를 받아 보세요.</p>

<h2>치료 약의 종류</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>역할</th><th>예(성분)</th></tr></thead>
<tbody>
<tr><td>흡입 스테로이드</td><td>기관지 염증을 가라앉혀 발작을 예방해요. 치료의 기본이에요</td><td>부데소니드, 플루티카손, 베클로메타손</td></tr>
<tr><td>흡입 스테로이드 + 지속형 기관지 확장제</td><td>염증 조절과 기관지 확장을 함께 해요</td><td>부데소니드·포르모테롤, 플루티카손·살메테롤 등</td></tr>
<tr><td>속효성 기관지 확장제</td><td>좁아진 기관지를 몇 분 안에 넓혀 증상을 덜어요. 염증은 치료하지 못해요</td><td>살부타몰</td></tr>
<tr><td>기타</td><td>류코트리엔 조절제, 지속형 항콜린제, 중증 천식의 생물학적 제제</td><td>몬테루카스트, 티오트로피움 등</td></tr>
</tbody>
<caption>세계천식기구(GINA) 2024 보고서, 대한천식알레르기학회 천식 진료지침을 바탕으로 정리</caption></table></div>
<div class="box note"><span class="h">증상 완화제만 쓰면 안 되는 이유</span>
<p>숨이 찰 때만 속효성 확장제를 뿌리면 당장은 편해지지만 기관지 염증은 그대로 남아요. 연구에서 확장제만 자주 쓰는 사람은 <strong>심한 발작과 사망 위험이 더 높았어요.</strong> 그래서 최근 국제 지침은 청소년과 성인에게 흡입 스테로이드가 포함된 약을 기본으로 쓰도록 권해요. 예를 들어 저용량 부데소니드·포르모테롤을 증상이 있을 때 쓰거나, 매일 쓰는 조절제와 함께 쓰는 방식이에요. 어떤 방식이 맞는지는 의사와 정해요.</p></div>

<h2>조절이 잘 되고 있을까</h2>
<p>지난 4주를 돌아보고 아래 질문에 '예'가 많을수록 조절이 안 되고 있다는 뜻이에요.</p>
<div class="tbl"><table>
<thead><tr><th>지난 4주 동안</th><th>예 / 아니오</th></tr></thead>
<tbody>
<tr><td>낮에 천식 증상이 일주일에 2번 넘게 있었나요?</td><td>□ / □</td></tr>
<tr><td>천식 때문에 밤에 깬 적이 있나요?</td><td>□ / □</td></tr>
<tr><td>증상 완화용 흡입기를 일주일에 2번 넘게 썼나요?</td><td>□ / □</td></tr>
<tr><td>천식 때문에 활동에 제한이 있었나요?</td><td>□ / □</td></tr>
</tbody>
<caption>세계천식기구(GINA) 천식 증상 조절 평가를 바탕으로 정리</caption></table></div>
<p>하나라도 '예'라면 약, 흡입 방법, 악화 요인을 의사와 다시 점검해요.</p>

<h2>흡입기 바르게 쓰기</h2>
<ul>
<li>흡입기 종류(가압식, 건조분말식)마다 방법이 달라요. 처방받을 때 직접 해 보며 배워요.</li>
<li>가압식 흡입기는 <strong>숨을 끝까지 내쉰 뒤</strong>, 누르는 동시에 천천히 깊게 들이마시고 <strong>숨을 5~10초 참아요.</strong> 손과 호흡을 맞추기 어려우면 보조기구(스페이서)를 써요.</li>
<li>스테로이드 흡입제를 쓴 뒤에는 <strong>입을 헹구고 뱉어요.</strong> 입안 곰팡이(아구창)와 목쉼을 줄여요.</li>
<li>남은 양 표시를 확인하고, 떨어지기 전에 미리 처방받아요.</li>
</ul>

<h2>악화 요인 줄이기</h2>
<ul>
<li><strong>담배 연기</strong>(간접흡연 포함), 미세먼지, 강한 냄새</li>
<li>감기와 독감: <strong>독감 예방접종</strong>을 매년 하고, 폐렴구균 접종도 의사와 상의해요.</li>
<li>집먼지진드기, 꽃가루, 반려동물 털, 곰팡이</li>
<li>찬 공기: 겨울에는 마스크나 목도리로 입과 코를 가려요.</li>
<li>일부 약: 아스피린 등 소염진통제에 예민한 천식이 있고, 일부 혈압약(베타차단제)은 천식을 악화시킬 수 있어요. 새 약을 먹기 전에 천식이 있다고 알려요.</li>
<li>운동: 운동은 오히려 권장돼요. 운동으로 증상이 생긴다면 운동 전 약 사용법을 상의해요.</li>
</ul>

<div class="box warn"><span class="h">바로 119를 불러야 하는 신호</span>
<ul>
<li>숨이 너무 차서 <strong>한 문장을 끝까지 말하기 어려워요.</strong></li>
<li>입술이나 손톱이 파랗게 변해요.</li>
<li>증상 완화제를 써도 나아지지 않거나 효과가 금방 사라져요.</li>
<li>숨을 쉬려고 목과 갈비뼈 사이가 쑥쑥 들어가요.</li>
<li>졸리거나 혼란스러워요.</li>
</ul>
<p>도움을 기다리는 동안 의사가 알려 준 응급 행동 계획대로 증상 완화제를 쓰고, 앉은 자세로 천천히 숨 쉬어요.</p></div>

<div class="box"><span class="h">천식 관리 체크리스트</span>
<ol>
<li>흡입 스테로이드가 포함된 약을 처방대로</li>
<li>진료 때마다 흡입 방법 확인받기</li>
<li>스테로이드 흡입 후 입 헹구기</li>
<li>4주 조절 질문으로 스스로 점검</li>
<li>독감 예방접종, 금연, 악화 요인 피하기</li>
<li>서면 응급 행동 계획 받아 두기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>흡입 스테로이드는 오래 써도 괜찮나요?</dt>
<dd>흡입 스테로이드는 기관지에 직접 작용해 먹는 스테로이드보다 몸에 흡수되는 양이 훨씬 적어요. 조절이 잘 되면 가능한 낮은 용량으로 줄여 가요. 입 헹구기를 하면 입안 부작용도 줄일 수 있어요.</dd>
<dt>천식은 완치되나요?</dt>
<dd>어린이 천식 일부는 크면서 좋아지기도 하지만, 대부분은 조절하며 지내는 병이에요. 잘 조절하면 운동과 일상생활을 제한 없이 할 수 있어요.</dd>
<dt>임신 중에도 천식 약을 써야 하나요?</dt>
<dd>임신 중 천식이 조절되지 않으면 산모와 태아 모두에게 산소가 부족해질 수 있어요. 흡입제는 대부분 계속 쓰는 것이 권장되니 임의로 끊지 말고 의사와 상의해요.</dd>
</dl>
