  data-title="헌혈: 누가 할 수 있을까, 전혈·성분 헌혈의 차이와 간격, 전날·당일·다음 날 챙길 것"
  data-thumb="8주|전혈 헌혈 간격"
  data-summary="혈액은 아직 만들어 낼 수 없어서 헌혈이 유일한 공급원이에요. 헌혈할 수 있는 나이와 몸무게, 전혈·혈장·혈소판 헌혈의 차이와 다음 헌혈까지의 간격, 헌혈이 미뤄지는 흔한 경우(약, 여행, 문신 등), 헌혈 전후 챙길 것, 어지러울 때 대처, 헌혈로 받는 검사 결과를 정리했어요."
  data-tags="헌혈,전혈,성분헌혈,혈액,건강상식">
<p class="lead">수술, 사고, 출산, 항암 치료처럼 수혈이 필요한 순간은 누구에게나 올 수 있어요. 그런데 혈액은 인공적으로 만들 수 없고 오래 보관할 수도 없어서, 꾸준한 헌혈이 필요해요. 처음이라 긴장된다면 과정을 미리 알아 두면 한결 편하게 다녀올 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>헌혈은 대체로 <strong>만 16~69세</strong>, 일정 몸무게 이상의 건강한 사람이 할 수 있어요.</li>
<li><strong>전혈</strong>은 8주, <strong>혈장·혈소판</strong>은 2주 뒤부터 다시 할 수 있어요.</li>
<li>헌혈 전날 <strong>충분히 자고</strong>, 당일 <strong>식사와 물</strong>을 챙겨요.</li>
<li>복용 약, 최근 여행, 문신·시술은 <strong>문진 때 솔직하게</strong> 알려요. 수혈받는 사람의 안전을 위해서예요.</li>
</ul></div>

<h2>헌혈할 수 있는 사람</h2>
<ul>
<li><strong>나이:</strong> 만 16~69세. 65세 이상은 60~64세에 헌혈한 경험이 있어야 해요.</li>
<li><strong>몸무게:</strong> 전혈 기준 남성 50kg, 여성 45kg 이상(헌혈 종류에 따라 달라요).</li>
<li><strong>혈액 검사:</strong> 헌혈 전 손가락 끝 채혈로 혈색소(빈혈 여부)를 확인해요.</li>
<li>세부 기준은 <strong>대한적십자사 혈액관리본부</strong> 누리집에서 확인해요.</li>
</ul>

<h2>헌혈의 종류와 간격</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>방법</th><th>걸리는 시간(대략)</th><th>다음 헌혈까지</th></tr></thead>
<tbody>
<tr><td>전혈 헌혈</td><td>혈액 전체를 320mL 또는 400mL 채혈</td><td>10~15분</td><td class="num">8주 이후(연 5회 이내)</td></tr>
<tr><td>혈장 성분 헌혈</td><td>혈장만 모으고 나머지는 몸으로 되돌려요</td><td>40분 안팎</td><td class="num">2주 이후</td></tr>
<tr><td>혈소판 성분 헌혈</td><td>혈소판만 모으고 나머지는 되돌려요</td><td>1시간 안팎</td><td class="num">2주 이후</td></tr>
</tbody>
<caption>대한적십자사 혈액관리본부 헌혈 안내를 바탕으로 정리. 연간 횟수와 세부 기준은 규정에 따라 바뀔 수 있어요</caption></table></div>
<p>혈소판은 보관 기간이 며칠로 짧아 항암 치료 환자 등을 위해 늘 부족해요. 성분 헌혈은 시간이 더 걸리지만 회복이 빨라 자주 참여할 수 있어요.</p>

<h2>헌혈이 미뤄지는 흔한 경우</h2>
<div class="tbl"><table>
<thead><tr><th>상황</th><th>이유</th></tr></thead>
<tbody>
<tr><td>감기, 발열, 설사</td><td>회복 뒤 일정 기간이 지나야 해요</td></tr>
<tr><td>일부 약 복용</td><td>여드름 약(이소트레티노인), 탈모·전립선 약(피나스테리드, 두타스테리드) 등은 태아 기형 위험 때문에 끊은 뒤 일정 기간이 지나야 해요</td></tr>
<tr><td>말라리아 위험 지역 여행·거주</td><td>국내 일부 지역 포함. 기간과 지역에 따라 제한</td></tr>
<tr><td>문신, 반영구 화장, 피어싱, 내시경 조직검사</td><td>감염 위험 기간이 지나야 해요</td></tr>
<tr><td>임신 중·출산 직후</td><td>일정 기간 제한</td></tr>
<tr><td>빈혈</td><td>혈색소 기준에 못 미치면 다음에 해요</td></tr>
</tbody>
<caption>대한적십자사 헌혈자 선별 기준을 바탕으로 정리. 기간은 항목마다 달라 문진 때 확인해요</caption></table></div>

<h2>헌혈 전후 챙길 것</h2>
<ul>
<li><strong>전날:</strong> 충분히 자고, 술을 마시지 않아요.</li>
<li><strong>당일:</strong> 식사를 거르지 말고, 헌혈 전 물을 한두 컵 마셔요. 기름진 음식은 혈장 성분에 영향을 줄 수 있어요.</li>
<li><strong>헌혈 직후:</strong> 10~15분 쉬고, 주는 음료와 간식을 먹어요. 바늘 자리는 5분 이상 눌러요.</li>
<li><strong>당일 남은 시간:</strong> 물을 평소보다 더 마시고, 격한 운동·사우나·음주를 피해요. 무거운 물건을 들지 않아요.</li>
<li>버스·지하철 운전, 고공 작업처럼 어지러우면 위험한 일은 당일 피해요.</li>
</ul>

<div class="box warn"><span class="h">어지러울 때</span>
<p>헌혈 중이나 뒤에 <strong>어지럽거나 식은땀, 메스꺼움</strong>이 생기면 바로 직원에게 알리고 누워서 다리를 올려요. 헌혈의 집을 나간 뒤 어지러우면 그 자리에 앉거나 누워요. 바늘 자리가 크게 붓고 멍들거나 팔이 저리고 아프면 헌혈 기관에 연락해요. 며칠 동안 피로와 어지럼이 계속되면 진료를 받아요.</p></div>

<h2>헌혈하면 받는 것</h2>
<ul>
<li><strong>혈액 검사 결과:</strong> 간 수치(ALT), 총단백, 콜레스테롤, B형·C형간염, 매독, HIV 등 검사 결과를 알려 줘요. 이상이 있으면 병원에서 확인해요.</li>
<li>헌혈증서는 본인이나 가족이 수혈받을 때 비용 일부를 보상받는 데 쓸 수 있어요.</li>
<li>헌혈이 HIV 검사를 위한 방법이 되어서는 안 돼요. 걱정되면 보건소 익명 검사를 받아요.</li>
</ul>

<div class="box"><span class="h">헌혈 체크리스트</span>
<ol>
<li>대한적십자사에서 기준 확인·예약</li>
<li>전날 충분한 잠, 술 피하기</li>
<li>당일 식사와 물 챙기기</li>
<li>약·여행·시술은 솔직하게</li>
<li>헌혈 뒤 쉬고, 당일 격한 운동 피하기</li>
<li>다음 헌혈 가능일 확인</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>헌혈하면 빈혈이 생기지 않나요?</dt>
<dd>헌혈 전에 혈색소를 확인하고, 간격을 지키면 대부분 회복돼요. 자주 헌혈하는 여성은 철 저장량이 줄 수 있어 철분이 풍부한 식사를 챙겨요.</dd>
<dt>혈압약을 먹는데 헌혈할 수 있나요?</dt>
<dd>혈압이 잘 조절되고 있다면 가능한 경우가 많아요. 약 이름을 문진 때 알려요.</dd>
<dt>헌혈한 피는 어떻게 쓰이나요?</dt>
<dd>검사를 거쳐 적혈구, 혈장, 혈소판 등으로 나눠 수술·사고·출산·항암 치료 환자에게 쓰이고, 일부는 의약품 원료가 돼요.</dd>
</dl>
