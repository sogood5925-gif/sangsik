  data-title="가족 돌봄과 돌봄자 건강: 혼자 다 하지 않기, 장기요양·치매안심센터·돌봄휴가 활용, 소진의 신호"
  data-thumb="10일|연간 가족돌봄휴가"
  data-summary="부모님이나 배우자, 아픈 가족을 돌보는 일은 사랑만으로 버티기 어려운 긴 여정이에요. 돌보는 사람에게 흔한 몸과 마음의 문제, 소진의 신호, 노인장기요양보험과 치매안심센터 등 쓸 수 있는 공적 서비스, 직장인의 가족돌봄휴가·휴직, 허리를 지키는 이동 요령, 잠깐이라도 쉬는 법을 정리했어요."
  data-tags="가족돌봄,돌봄자,장기요양,소진,건강상식">
<p class="lead">"내가 아니면 누가 해." 가족을 돌보는 많은 사람이 이 마음으로 하루하루를 버텨요. 그러다 어느 날 허리가 아파 일어나지 못하거나, 작은 일에 눈물이 터지기도 해요. 돌보는 사람이 무너지면 돌봄도 이어질 수 없어요. 도움을 받는 것은 책임을 내려놓는 게 아니라 오래 함께하기 위한 방법이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>돌보는 사람은 <strong>우울, 불면, 허리 통증, 만성질환 악화</strong>를 겪기 쉬워요.</li>
<li><strong>노인장기요양보험</strong>의 방문요양, 주야간보호, 단기보호를 활용할 수 있어요.</li>
<li>직장인은 <strong>가족돌봄휴가(연 10일)</strong>와 <strong>가족돌봄휴직(연 90일)</strong>을 쓸 수 있어요.</li>
<li>짧게라도 <strong>규칙적으로 쉬는 시간</strong>을 일정에 넣어요.</li>
</ul></div>

<h2>돌보는 사람에게 흔한 문제</h2>
<div class="tbl"><table>
<thead><tr><th>영역</th><th>모습</th></tr></thead>
<tbody>
<tr><td>마음</td><td>우울, 불안, 죄책감, 화, 외로움. 돌봄 대상에게 화가 났다가 스스로를 탓해요</td></tr>
<tr><td>몸</td><td>허리·어깨 통증, 수면 부족, 자기 병원 진료를 미뤄요</td></tr>
<tr><td>생활</td><td>일을 줄이거나 그만두고, 친구와 멀어지고, 경제적 부담이 커져요</td></tr>
</tbody>
<caption>보건복지부 중앙치매센터 가족 지원 안내, 미국 질병통제예방센터(CDC) Caregiving 자료를 바탕으로 정리</caption></table></div>

<h2>소진의 신호</h2>
<ul>
<li>늘 피곤하고 자도 개운하지 않아요.</li>
<li>예전에 즐기던 일에 관심이 없어졌어요.</li>
<li>작은 일에도 짜증이 나고, 돌봄 대상에게 거칠게 말하게 돼요.</li>
<li>자주 아프고, 내 병원 약속을 계속 미뤄요.</li>
<li>'이 생활이 끝나지 않을 것 같다'는 절망감이 들어요.</li>
</ul>
<p>이런 신호가 이어진다면 지금 돌봄을 나눌 방법을 찾을 때예요.</p>

<h2>쓸 수 있는 공적 서비스</h2>
<div class="tbl"><table>
<thead><tr><th>서비스</th><th>내용</th><th>신청</th></tr></thead>
<tbody>
<tr><td>노인장기요양보험</td><td>65세 이상 또는 치매·뇌졸중 등 노인성 질환이 있는 사람이 등급을 받으면 방문요양, 방문목욕, 주야간보호, 단기보호, 요양시설, 복지용구 등을 이용</td><td>국민건강보험공단(1577-1000)에 등급 신청</td></tr>
<tr><td>주야간보호</td><td>낮 동안 센터에서 돌봄과 프로그램. 돌보는 가족이 일하거나 쉴 수 있어요</td><td>장기요양 등급 후 기관 선택</td></tr>
<tr><td>단기보호</td><td>며칠~몇 주 시설에서 돌봄. 가족의 휴식이나 급한 일 때</td><td>장기요양 등급 후</td></tr>
<tr><td>치매안심센터</td><td>치매 검사, 가족 교육·상담, 자조 모임, 쉼터</td><td>시·군·구 보건소</td></tr>
<tr><td>노인맞춤돌봄서비스</td><td>장기요양 대상이 아닌 어르신의 안부 확인, 생활 지원</td><td>주민센터</td></tr>
<tr><td>가족돌봄청년 지원</td><td>가족을 돌보는 청년의 상담·생활 지원</td><td>주민센터, 지자체 안내</td></tr>
</tbody>
<caption>국민건강보험공단 노인장기요양보험, 보건복지부 중앙치매센터·노인맞춤돌봄서비스 안내를 바탕으로 정리. 본인부담과 지원 내용은 등급과 소득에 따라 달라요</caption></table></div>

<h2>일하면서 돌볼 때</h2>
<ul>
<li><strong>가족돌봄휴가:</strong> 가족의 질병, 사고, 노령으로 돌봄이 필요할 때 연간 최대 10일(무급이 원칙, 하루 단위)</li>
<li><strong>가족돌봄휴직:</strong> 연간 최대 90일, 나눠 쓸 수 있어요.</li>
<li><strong>근로시간 단축:</strong> 가족 돌봄을 위해 근로시간 단축을 신청할 수 있어요.</li>
<li>회사 인사 담당자나 고용노동부 상담센터(1350)에 조건과 절차를 확인해요.</li>
</ul>

<h2>허리를 지키는 이동 요령</h2>
<ul>
<li>들어 올릴 때는 <strong>무릎을 굽히고 허리는 곧게</strong>, 돌봄 대상과 몸을 가까이 붙여요.</li>
<li>허리를 비틀지 말고 발을 옮겨 방향을 바꿔요.</li>
<li>침대 높이 조절, 이동 보조 벨트, 미끄럼 시트 같은 복지용구를 활용해요. 장기요양 등급이 있으면 구입·대여를 지원받을 수 있어요.</li>
<li>혼자 힘든 이동은 무리하지 말고 두 사람이 함께 해요.</li>
</ul>

<div class="box warn"><span class="h">이럴 때는 바로 도움을 청해요</span>
<ul>
<li>돌봄 대상을 <strong>때리거나 소리 지르고 싶은 충동</strong>이 자주 들어요.</li>
<li>나 자신이나 돌봄 대상에 대해 <strong>극단적인 생각</strong>이 들어요.</li>
<li>잠을 거의 못 자 판단이 흐려지고 사고가 날 뻔했어요.</li>
</ul>
<p>자살예방 상담전화 <strong>109</strong>, 정신건강 상담전화 <strong>1577-0199</strong>, 치매 상담은 <strong>1899-9988</strong>에서 도움을 받을 수 있어요.</p></div>

<h2>잠깐이라도 쉬기</h2>
<ul>
<li>하루 <strong>30분</strong>이라도 나만의 시간을 일정표에 적어 두고 지켜요.</li>
<li>가족, 친척과 <strong>역할을 나눠요.</strong> 구체적으로 부탁하면 돕기 쉬워요. "수요일 저녁 병원은 네가 맡아 줘."</li>
<li>같은 처지의 사람들이 모이는 <strong>가족 모임</strong>에서 위로와 정보를 얻어요.</li>
<li>내 건강검진과 진료를 미루지 않아요.</li>
</ul>

<div class="box"><span class="h">돌봄자 체크리스트</span>
<ol>
<li>장기요양 등급 신청했는지 확인</li>
<li>치매안심센터·주민센터 서비스 알아보기</li>
<li>직장 돌봄휴가·휴직 확인</li>
<li>하루 30분 내 시간</li>
<li>역할 나누기, 구체적으로 부탁하기</li>
<li>내 건강검진·진료 챙기기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>요양시설에 모시면 불효인가요?</dt>
<dd>돌봄이 필요한 정도와 가족의 사정에 따라 시설이 더 안전하고 전문적인 돌봄을 줄 수 있어요. 자주 찾아가 관계를 이어 가는 것도 좋은 돌봄이에요.</dd>
<dt>장기요양 등급은 어떻게 받나요?</dt>
<dd>국민건강보험공단에 신청하면 직원이 방문해 조사하고, 의사 소견서를 바탕으로 등급을 정해요. 등급이 나오면 쓸 수 있는 서비스를 안내받아요.</dd>
<dt>돌봄 때문에 생긴 화를 어떻게 다루나요?</dt>
<dd>화가 나는 건 자연스러운 일이에요. 잠시 자리를 피해 숨을 고르고, 믿을 만한 사람이나 상담사에게 이야기해요. 쌓아 두지 않는 것이 중요해요.</dd>
</dl>
