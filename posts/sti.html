  data-title="성매개감염 예방: 증상이 없어도 옮는 이유, 콘돔·백신·검사 세 가지, 파트너와 함께 치료하기"
  data-thumb="72시간|HIV 노출 후 예방약 시작"
  data-summary="성매개감염은 흔하고 상당수가 증상 없이 지나가 모르는 사이에 옮기기 쉬워요. 대표적인 성매개감염의 특징, 콘돔과 예방접종, 정기 검사가 필요한 사람과 보건소 익명 검사, HIV 노출 전후 예방약, 진단받았을 때 파트너와 함께 치료해야 하는 이유, 부끄러움 때문에 진료를 미루지 않도록 알아 둘 점을 정리했어요."
  data-tags="성매개감염,성병,콘돔,HIV검사,건강상식">
<p class="lead">성매개감염은 부끄럽고 남의 일처럼 느껴져 이야기하기 어려운 주제예요. 하지만 성생활을 하는 누구에게나 생길 수 있는 흔한 감염이고, 대부분 쉽게 진단하고 치료할 수 있어요. 문제는 증상이 없어서 모르고 지나가다 불임이나 합병증으로 이어지거나, 파트너에게 옮기는 경우예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>클라미디아, 임질 등은 <strong>증상이 없는 경우가 많아요.</strong> 새 파트너가 생겼다면 검사를 고려해요.</li>
<li>예방의 세 기둥은 <strong>콘돔, 예방접종(HPV·B형간염), 정기 검사</strong>예요.</li>
<li>HIV에 노출됐을 수 있다면 <strong>72시간 안에</strong> 노출 후 예방약을 상담해요.</li>
<li>진단받으면 <strong>파트너도 함께</strong> 검사하고 치료해야 다시 걸리지 않아요.</li>
</ul></div>

<h2>대표적인 성매개감염</h2>
<div class="tbl"><table>
<thead><tr><th>감염</th><th>흔한 증상</th><th>치료</th></tr></thead>
<tbody>
<tr><td>클라미디아</td><td>대부분 증상 없음. 분비물, 소변 볼 때 통증. 여성은 골반염·불임으로 이어질 수 있어요</td><td>항생제로 완치</td></tr>
<tr><td>임질</td><td>남성은 고름 같은 분비물과 배뇨통, 여성은 증상이 없기도 해요</td><td>항생제. 내성균이 늘어 치료 후 확인이 중요해요</td></tr>
<tr><td>매독</td><td>통증 없는 궤양 → 몇 주 뒤 손발바닥 발진 → 증상 없이 잠복. 최근 국내외에서 늘고 있어요</td><td>페니실린 주사로 치료</td></tr>
<tr><td>성기 헤르페스</td><td>따끔한 물집과 궤양, 재발</td><td>항바이러스제로 조절</td></tr>
<tr><td>HPV(곤지름 등)</td><td>생식기 사마귀. 고위험형은 자궁경부암 등과 관련</td><td>사마귀 제거. 백신으로 예방</td></tr>
<tr><td>HIV</td><td>초기 감기 같은 증상 후 오래 증상 없음</td><td>꾸준한 치료로 바이러스를 억제하면 오래 건강하게 살고, 성관계로 옮기지 않아요</td></tr>
<tr><td>트리코모나스</td><td>가렵고 거품 섞인 분비물</td><td>먹는 약으로 치료</td></tr>
</tbody>
<caption>질병관리청 성매개감염 예방관리 지침, 미국 질병통제예방센터(CDC) STI Treatment Guidelines(2021)를 바탕으로 정리</caption></table></div>

<h2>예방의 세 기둥</h2>
<ul>
<li><strong>콘돔:</strong> 처음부터 끝까지, 올바르게 쓰면 HIV, 임질, 클라미디아 위험을 크게 줄여요. 헤르페스와 HPV는 콘돔이 덮지 못한 피부로 옮을 수 있어 완벽하지는 않아요. 구강성교에서도 감염될 수 있어요.</li>
<li><strong>예방접종:</strong> HPV 백신과 B형간염 백신으로 해당 감염을 막을 수 있어요. A형간염도 성접촉으로 옮을 수 있어요.</li>
<li><strong>정기 검사:</strong> 증상이 없어도 검사로 일찍 찾으면 합병증과 전파를 막아요.</li>
</ul>

<h2>검사를 고려할 때</h2>
<div class="tbl"><table>
<thead><tr><th>상황</th><th>권고</th></tr></thead>
<tbody>
<tr><td>새 파트너가 생겼거나 파트너가 여럿</td><td>클라미디아·임질·매독·HIV 검사를 정기적으로</td></tr>
<tr><td>콘돔 없이 관계를 가졌고 걱정될 때</td><td>감염 종류마다 검사가 정확해지는 시기가 달라 의료진과 시기를 정해요</td></tr>
<tr><td>파트너가 성매개감염을 진단받았을 때</td><td>증상이 없어도 검사와 치료</td></tr>
<tr><td>임신을 확인했을 때</td><td>매독, HIV, B형간염 검사(아기에게 옮는 것을 막아요)</td></tr>
</tbody>
<caption>질병관리청, 미국 질병통제예방센터(CDC) 선별검사 권고를 바탕으로 정리</caption></table></div>
<p><strong>보건소</strong>에서 HIV 검사를 <strong>익명·무료</strong>로 받을 수 있고, 매독 등 다른 검사도 할 수 있어요. 비뇨의학과, 산부인과, 피부과에서도 검사와 치료를 받아요.</p>

<h2>HIV 노출 전후 예방약</h2>
<ul>
<li><strong>노출 후 예방(PEP):</strong> 콘돔이 찢어지는 등 HIV에 노출됐을 수 있다면 <strong>72시간 안에, 빠를수록 좋게</strong> 약을 시작해 28일 먹어요. 응급실이나 감염내과에 바로 문의해요.</li>
<li><strong>노출 전 예방(PrEP):</strong> HIV 감염 위험이 높은 사람이 미리 약을 먹어 감염을 크게 줄이는 방법이에요. 감염내과에서 상담받을 수 있어요.</li>
</ul>

<div class="box warn"><span class="h">이런 증상은 빨리 진료를 받아요</span>
<ul>
<li>생식기·항문·입 주변의 <strong>궤양, 물집, 사마귀</strong></li>
<li>고름 같은 분비물, 소변 볼 때 통증</li>
<li>여성의 <strong>아랫배 통증과 열</strong>, 성관계 뒤 출혈(골반염일 수 있어요)</li>
<li>고환이 붓고 아파요.</li>
<li>손발바닥 발진, 설명되지 않는 열과 림프절 부기</li>
</ul></div>

<h2>진단을 받았다면</h2>
<ul>
<li>처방받은 약을 <strong>끝까지</strong> 먹고, 치료가 끝날 때까지 성관계를 쉬어요.</li>
<li>최근 파트너에게 알리고 <strong>함께 검사·치료</strong>해요. 한 사람만 치료하면 서로 다시 옮기는 '핑퐁 감염'이 생겨요.</li>
<li>치료 뒤 다시 검사해 완치를 확인하라는 안내를 받으면 꼭 지켜요.</li>
<li>의료기관은 진료 내용을 비밀로 지켜요. 부끄러워서 미루는 사이 합병증이 생길 수 있어요.</li>
</ul>

<div class="box"><span class="h">성 건강 체크리스트</span>
<ol>
<li>콘돔은 처음부터 끝까지</li>
<li>HPV·B형간염 예방접종 확인</li>
<li>새 파트너라면 함께 검사</li>
<li>HIV 노출 걱정은 72시간 안에 상담</li>
<li>진단받으면 파트너도 치료</li>
<li>약은 끝까지, 치료 중엔 관계 쉬기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>증상이 없어졌으니 나은 건가요?</dt>
<dd>매독처럼 증상이 사라져도 몸속에서 진행하는 감염이 있어요. 검사로 확인하고 치료를 끝까지 받아요.</dd>
<dt>공중목욕탕이나 변기로 옮나요?</dt>
<dd>대부분의 성매개감염은 성접촉으로 옮고, 변기나 수건으로 옮는 경우는 매우 드물어요.</dd>
<dt>검사 결과가 가족이나 회사에 알려지나요?</dt>
<dd>의료 정보는 법으로 보호돼요. 보건소 HIV 검사는 익명으로도 받을 수 있어요.</dd>
</dl>
