  data-title="비타민 A 총정리: 눈과 피부의 비타민, 부족보다 과잉을 조심해야 하는 이유"
  data-thumb="RAE|레티놀 당량"
  data-summary="비타민 A는 어두운 곳에서 보는 눈과 피부, 면역에 꼭 필요해요. 하지만 한국인은 부족보다 보충제로 인한 과잉을 조심해야 하는 영양소예요. 레티놀과 베타카로틴의 차이, 섭취기준, 임신 중 주의점, 흡연자와 베타카로틴 보충제 연구를 정리했어요."
  data-tags="비타민A,베타카로틴,레티놀,임신,영양제">
<p class="lead">당근을 먹으면 눈이 좋아진다는 말은 절반만 맞아요. 비타민 A가 부족한 사람에게는 맞지만, 이미 충분한 사람에게는 더 먹어도 시력이 좋아지지 않아요. 오히려 보충제로 너무 많이 먹는 게 문제가 될 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>비타민 A는 동물성 식품의 <strong>레티놀</strong>과 식물성 식품의 <strong>베타카로틴</strong>으로 얻어요.</li>
<li>성인 권장섭취량은 남성 <strong>700~800μg RAE</strong>, 여성 <strong>600~650μg RAE</strong>예요.</li>
<li>레티놀은 과하면 독성이 있어요. 상한섭취량은 <strong>3,000μg</strong>이고, <strong>임신 중 고용량은 기형 위험</strong>이 있어요.</li>
<li>흡연자가 <strong>베타카로틴 고용량 보충제</strong>를 먹으면 폐암 위험이 오히려 높아졌다는 연구가 있어요.</li>
</ul></div>

<h2>비타민 A가 하는 일</h2>
<ul>
<li><strong>어두운 곳에서 보기:</strong> 망막의 빛 감지 물질(로돕신)을 만드는 데 필요해요. 부족하면 어두운 곳에서 잘 보이지 않는 <strong>야맹증</strong>이 먼저 나타나요.</li>
<li><strong>피부와 점막:</strong> 눈, 호흡기, 장의 점막 세포가 제대로 자라고 유지되게 해요. 이 점막은 세균이 들어오는 것을 막는 첫 방어선이에요.</li>
<li><strong>면역:</strong> 면역세포가 제대로 기능하는 데 필요해요.</li>
<li><strong>성장과 생식:</strong> 태아 발달, 세포 분화에 관여해요.</li>
</ul>
<p>세계보건기구는 비타민 A 결핍을 개발도상국 어린이의 <strong>예방 가능한 실명의 주요 원인</strong>으로 꼽아요. 한국처럼 식품이 다양한 나라에서는 결핍이 드물어요.</p>

<h2>레티놀과 베타카로틴</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>레티놀 (이미 만들어진 비타민 A)</th><th>베타카로틴 (비타민 A의 원료)</th></tr></thead>
<tbody>
<tr><td>들어 있는 곳</td><td>간, 장어, 달걀노른자, 우유, 버터, 치즈</td><td>당근, 고구마, 단호박, 시금치, 케일, 망고</td></tr>
<tr><td>몸에서</td><td>바로 비타민 A로 쓰여요</td><td>필요한 만큼만 비타민 A로 바뀌어요</td></tr>
<tr><td>과잉 위험</td><td>있음 (간 손상, 기형 등)</td><td>음식으로는 거의 없음 (피부가 노래질 뿐)</td></tr>
</tbody></table></div>
<p>베타카로틴은 몸이 필요한 만큼만 비타민 A로 바꾸기 때문에, 음식으로 많이 먹어도 독성이 생기지 않아요. 귤이나 당근을 많이 먹어 손바닥이 노래지는 <strong>카로틴혈증</strong>은 해가 없고, 먹는 양을 줄이면 사라져요.</p>
<h3>RAE라는 단위</h3>
<p>레티놀과 베타카로틴은 효율이 달라서 <strong>레티놀활성당량(RAE)</strong>으로 환산해요. 음식 속 베타카로틴 12μg이 레티놀 1μg RAE에 해당해요. 베타카로틴은 지용성이라 <strong>기름과 함께 먹으면</strong> 흡수가 훨씬 좋아져요. 당근을 기름에 살짝 볶거나 나물을 들기름에 무치는 조리법이 흡수에 유리해요.</p>

<h2>하루에 얼마나 필요할까</h2>
<div class="tbl"><table>
<thead><tr><th>나이</th><th>남성</th><th>여성</th></tr></thead>
<tbody>
<tr><td>19~49세</td><td class="num">800μg RAE</td><td class="num">650μg RAE</td></tr>
<tr><td>50~64세</td><td class="num">750μg RAE</td><td class="num">600μg RAE</td></tr>
<tr><td>65세 이상</td><td class="num">700μg RAE</td><td class="num">600μg RAE</td></tr>
<tr><td>상한섭취량 (성인)</td><td colspan="2" class="num">3,000μg (레티놀 기준)</td></tr>
</tbody>
<caption>보건복지부·한국영양학회, 2020 한국인 영양소 섭취기준. 상한섭취량은 레티놀(동물성 식품과 보충제)에만 적용돼요.</caption></table></div>
<p>당근 반 개, 단호박 한 조각, 시금치나물 한 접시만으로도 하루 필요량의 상당 부분을 채울 수 있어요. 소간은 적은 양에도 레티놀이 권장량의 몇 배가 들어 있을 만큼 많아요.</p>

<h2>과잉: 보충제를 조심해야 하는 이유</h2>
<h3>급성·만성 독성</h3>
<p>레티놀을 한꺼번에 아주 많이 먹거나 오랫동안 과하게 먹으면 두통, 어지러움, 메스꺼움, 피부 벗겨짐, 탈모가 생기고, 심하면 <strong>간 손상</strong>과 두개내압 상승이 생길 수 있어요. 오랜 과잉 섭취는 <strong>골밀도 감소와 골절 위험 증가</strong>와도 관련이 있다는 연구가 있어요.</p>
<div class="box warn"><span class="h">임신 중에는 레티놀 고용량을 피하세요</span>
<ul>
<li>임신 초기에 레티놀을 고용량으로 먹으면 <strong>태아 기형</strong> 위험이 높아져요. 임신부용이 아닌 일반 고용량 비타민 A 보충제는 피해요.</li>
<li>여드름 치료에 먹는 <strong>이소트레티노인</strong>(비타민 A 유도체)은 강한 기형 유발 약물이에요. 복용 중과 복용 후 일정 기간은 반드시 피임해야 해요.</li>
<li>레티놀이 든 <strong>바르는 화장품</strong>은 흡수량이 적지만, 임신 중에는 사용을 피하도록 권하는 경우가 많아요. 담당 의사와 상의해요.</li>
<li>간 요리를 자주 많이 먹는 것도 임신 중에는 피하는 게 좋아요.</li>
<li>베타카로틴 형태의 비타민 A는 기형 위험과 관련이 없어요.</li>
</ul></div>

<h2>흡연자와 베타카로틴 보충제</h2>
<p>1990년대, 베타카로틴이 항산화 작용으로 폐암을 막아줄 것이라는 기대 속에 대규모 임상시험이 진행됐어요. 결과는 정반대였어요.</p>
<ul>
<li>핀란드의 <strong>ATBC 연구</strong>에서 흡연 남성에게 베타카로틴 보충제를 줬더니 폐암 발생이 오히려 늘었어요.</li>
<li>미국의 <strong>CARET 연구</strong>에서도 흡연자와 석면 노출자에게 베타카로틴과 레티놀을 줬더니 폐암이 늘어 연구가 조기 중단됐어요.</li>
</ul>
<p>그래서 <strong>흡연자나 과거 흡연자는 베타카로틴 고용량 보충제를 먹지 않도록</strong> 권해요. 음식으로 먹는 채소와 과일의 베타카로틴은 이런 위험과 관련이 없어요. 같은 영양소라도 음식으로 먹는 것과 고용량 알약으로 먹는 것은 다르다는 걸 보여준 대표적인 사례예요.</p>

<h2>결핍이 생길 수 있는 경우</h2>
<ul>
<li>지방 흡수에 문제가 있는 질환 (만성 췌장염, 담즙 분비 장애, 크론병, 셀리악병)</li>
<li>비만 수술 후</li>
<li>채소와 동물성 식품을 모두 극단적으로 적게 먹는 식습관</li>
<li>만성 알코올 섭취와 간 질환</li>
</ul>
<p>야맹증, 눈이 심하게 건조해짐, 피부가 거칠어지고 오돌토돌해짐이 나타날 수 있어요. 이런 경우에는 의사가 검사 후 필요한 만큼 보충해요.</p>

<div class="box"><span class="h">비타민 A 현명하게 챙기기</span>
<ol>
<li>주황색·녹색 채소를 하루 한두 번 기름과 함께 조리해 먹기</li>
<li>종합비타민과 눈 영양제 등 먹고 있는 제품의 비타민 A 함량을 모두 더해보기</li>
<li>레티놀 형태로 하루 3,000μg을 넘지 않게 하기</li>
<li>흡연자라면 베타카로틴 고용량 보충제 피하기</li>
<li>임신을 계획 중이면 영양제를 임신부용으로 바꾸기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>눈 영양제에 비타민 A가 들어 있는데 괜찮나요?</dt>
<dd>제품마다 함량과 형태가 달라요. 라벨에서 레티놀(또는 레티닐 팔미테이트 등)인지 베타카로틴인지, 함량이 얼마인지 확인해요. 여러 제품을 함께 먹으면 합산량이 많아질 수 있어요.</dd>
<dt>비타민 A가 여드름에 좋다던데요?</dt>
<dd>여드름 치료에 쓰는 비타민 A 유도체(바르는 레티노이드, 먹는 이소트레티노인)는 의약품이고 용량과 부작용 관리가 필요해요. 비타민 A 보충제를 많이 먹는다고 같은 효과가 나지는 않고 독성 위험만 커져요.</dd>
<dt>아이에게 비타민 A 보충제가 필요한가요?</dt>
<dd>국내 아이들은 대부분 음식으로 충분해요. 일부 개발도상국에서는 결핍 예방을 위해 어린이에게 고용량 비타민 A를 주기도 하지만, 우리나라에서는 의사가 필요하다고 판단한 경우가 아니면 따로 먹일 필요가 없어요.</dd>
</dl>
