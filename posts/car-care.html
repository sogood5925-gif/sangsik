<p class="lead">자동차가 땅에 닿는 곳은 네 개의 타이어, 손바닥 네 개 정도의 면적뿐이에요. 이 작은 면적이 달리고, 돌고, 멈추는 모든 일을 해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>타이어 공기압은 <strong>한 달에 한 번</strong>, 차가 식었을 때 운전석 문 안쪽 라벨의 기준으로 맞춰요.</li>
<li>타이어 홈 깊이가 <strong>1.6mm</strong> 이하이면 교체해야 해요. 동전으로 간단히 확인할 수 있어요.</li>
<li>여름에는 <strong>아이와 반려동물을 차 안에 절대 혼자 두지 않고</strong>, 라이터·보조배터리도 두지 않아요.</li>
<li>차가 멈추면 비상등을 켜고 <strong>가드레일 밖으로</strong> 먼저 대피해요.</li>
</ul></div>

<h2>타이어 공기압</h2>
<p>공기압이 부족하면 타이어가 더 많이 휘어 열이 나고, 연비가 나빠지고, 가장자리가 빨리 닳아요. 고속으로 달릴 때 타이어가 물결처럼 떨리다 터지는 '스탠딩 웨이브' 현상의 원인이 되기도 해요. 반대로 너무 높으면 접지 면적이 줄어 제동이 불안정해져요.</p>
<ul>
<li><strong>적정 공기압</strong>은 운전석 문을 열면 보이는 문틀 라벨이나 차량 설명서에 적혀 있어요. 타이어 옆면의 숫자는 '최대' 공기압이라 기준이 아니에요.</li>
<li>공기압은 <strong>운행 전, 타이어가 식었을 때</strong> 재요. 달린 직후에는 높게 나와요.</li>
<li><strong>기온이 떨어지면 공기압도 내려가요.</strong> 가을에서 겨울로 넘어갈 때 특히 확인해요.</li>
<li>계기판의 타이어 공기압 경고등(TPMS)이 켜지면 가까운 곳에서 바로 점검해요.</li>
</ul>

<h2>타이어 마모와 교체</h2>
<p>타이어 홈은 비 오는 날 물을 빼내 미끄러짐을 막아요. 홈이 얕아지면 빗길 제동 거리가 크게 늘어나요.</p>
<div class="tbl"><table>
<thead><tr><th>점검 방법</th><th>확인할 것</th></tr></thead>
<tbody>
<tr><td>마모 한계 표시</td><td>타이어 홈 안쪽의 볼록 튀어나온 부분(마모 한계 표시)이 표면과 같은 높이가 되면 교체해요. 법적 한계는 1.6mm예요</td></tr>
<tr><td>100원 동전</td><td>동전을 거꾸로 홈에 넣었을 때 이순신 장군의 감투가 보이면 홈이 얕아진 거예요. 교체를 준비해요</td></tr>
<tr><td>고르지 않은 마모</td><td>한쪽 가장자리만 닳았다면 공기압이나 휠 정렬 문제일 수 있어요</td></tr>
<tr><td>옆면</td><td>갈라짐, 부풀어 오름(혹), 찢김이 있으면 즉시 교체해요</td></tr>
</tbody></table></div>
<h3>타이어 나이 읽기</h3>
<p>타이어 옆면에 <strong>DOT</strong>로 시작하는 글자 끝의 <strong>네 자리 숫자</strong>가 제조 시기예요. 앞 두 자리는 주차, 뒤 두 자리는 연도예요. 예를 들어 '2324'는 2024년 23번째 주에 만들어졌다는 뜻이에요. 홈이 충분해도 고무는 시간이 지나면 굳고 갈라지기 때문에, 제조사들은 대개 <strong>5~6년</strong>이 지나면 점검과 교체를 권해요.</p>

<h2>여름철 점검</h2>
<ul>
<li><strong>냉각수:</strong> 엔진이 식은 상태에서 보조 탱크의 수위가 표시선 사이에 있는지 확인해요. 뜨거울 때 뚜껑을 열면 화상을 입을 수 있어요.</li>
<li><strong>에어컨:</strong> 냉방이 약하거나 냄새가 나면 필터를 교체해요. 목적지 도착 몇 분 전 에어컨을 끄고 송풍으로 돌리면 곰팡이 냄새가 줄어요.</li>
<li><strong>와이퍼:</strong> 장마 전에 줄무늬가 남거나 소리가 나면 교체해요.</li>
</ul>
<div class="box warn"><span class="h">여름 차 안은 순식간에 뜨거워져요</span>
<ul>
<li>한여름 햇볕 아래 차 안 온도는 짧은 시간에 매우 높이 올라가요. 창문을 조금 열어도 큰 차이가 없어요.</li>
<li><strong>아이와 반려동물을 잠깐이라도 차 안에 혼자 두지 않아요.</strong> 열사병으로 목숨을 잃는 사고가 해마다 반복돼요. 내릴 때 뒷좌석을 확인하는 습관을 들여요.</li>
<li><strong>라이터, 보조배터리, 스프레이, 캔 음료, 부탄가스</strong>는 차 안에 두지 않아요. 폭발이나 화재 위험이 있어요.</li>
<li>생수병을 햇볕 드는 대시보드에 두면 렌즈처럼 빛을 모아 화재가 날 수 있다는 실험 결과도 있어요.</li>
</ul></div>

<h2>겨울철 점검</h2>
<ul>
<li><strong>배터리:</strong> 추우면 배터리 성능이 떨어져요. 시동이 무겁게 걸리거나 3~5년 넘었다면 점검해요.</li>
<li><strong>부동액과 워셔액:</strong> 겨울용 워셔액으로 바꿔 얼지 않게 해요.</li>
<li><strong>겨울용 타이어:</strong> 기온이 대략 7°C 아래로 떨어지면 일반 타이어의 고무가 굳어 접지력이 떨어져요. 눈이 자주 오는 지역이라면 겨울용 타이어를 고려하고, 스노체인을 준비해요.</li>
<li><strong>예열:</strong> 요즘 차는 긴 공회전이 필요 없어요. 30초~1분 정도 후 천천히 출발하며 데우는 게 좋아요.</li>
<li><strong>성에 제거:</strong> 앞 유리와 옆 창, 사이드미러의 성에와 눈을 모두 치운 뒤 출발해요. 지붕 위 눈도 치워요.</li>
</ul>
<h3>블랙아이스를 조심하세요</h3>
<p>다리 위, 터널 출입구, 그늘진 도로, 새벽 시간에는 눈에 잘 보이지 않는 얇은 빙판이 생기기 쉬워요. 속도를 줄이고 차간 거리를 평소의 두 배 이상 두고, 급브레이크와 급핸들을 피해요.</p>

<h2>정기 점검 항목</h2>
<div class="tbl"><table>
<thead><tr><th>항목</th><th>주기 (일반적으로)</th></tr></thead>
<tbody>
<tr><td>타이어 공기압</td><td>매월</td></tr>
<tr><td>엔진오일</td><td>차량 설명서의 주행거리·기간 기준 (차종과 운행 조건에 따라 달라요)</td></tr>
<tr><td>브레이크 패드, 브레이크액</td><td>정기 점검 때 확인. 끼익 소리나 떨림이 있으면 즉시</td></tr>
<tr><td>에어컨·실내 필터</td><td>1년 또는 설명서 기준</td></tr>
<tr><td>등화 (전조등, 브레이크등, 방향지시등)</td><td>수시로. 가족이 뒤에서 확인해 주면 쉬워요</td></tr>
</tbody></table></div>
<p>엔진오일 교환 주기는 '5,000km마다'처럼 일률적으로 알려져 있지만, 요즘 차는 훨씬 긴 경우가 많아요. 내 차의 설명서를 기준으로 해요.</p>

<h2>도로에서 차가 멈췄을 때</h2>
<div class="box warn"><span class="h">2차 사고를 막는 순서</span>
<ol>
<li><strong>비상등</strong>을 켜고, 가능하면 갓길이나 안전한 곳으로 차를 옮겨요.</li>
<li>트렁크를 열어 뒤차에 이상을 알리고, 안전하다면 <strong>삼각대나 불꽃신호기</strong>를 차 뒤쪽 멀리 설치해요. 무리하게 도로로 나가지 않아요.</li>
<li>탑승자 모두 <strong>가드레일 밖</strong> 안전한 곳으로 대피해요. 차 안이나 차 앞뒤에 서 있지 않아요.</li>
<li><strong>112, 119</strong> 또는 고속도로라면 <strong>한국도로공사 콜센터(1588-2504)</strong>에 연락해요. 고속도로에서는 안전지대까지 무료 긴급견인 서비스가 있어요.</li>
</ol></div>

<h2>차에 두면 좋은 것</h2>
<div class="box"><span class="h">비상용품 체크리스트</span>
<ol>
<li>안전삼각대 또는 불꽃신호기</li>
<li>차량용 소화기 (5인승 이상 승용차에도 비치가 의무화됐어요)</li>
<li>손전등, 반사 조끼</li>
<li>점프 케이블 또는 보조 배터리 부스터</li>
<li>겨울: 스노체인, 성에 제거기, 담요</li>
<li>물, 간단한 구급상자</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>질소 공기를 넣으면 더 좋은가요?</dt>
<dd>질소는 공기압 변화가 조금 적다는 장점이 있지만, 일반 공기도 약 78%가 질소예요. 어떤 기체를 넣느냐보다 정기적으로 공기압을 확인하는 게 훨씬 중요해요.</dd>
<dt>타이어 두 개만 바꿔도 되나요?</dt>
<dd>두 개만 바꾼다면 일반적으로 새 타이어를 <strong>뒷바퀴</strong>에 끼우는 것이 빗길 미끄러짐을 줄이는 데 유리하다고 알려져 있어요. 차종과 구동 방식에 따라 다를 수 있으니 정비소와 상의해요.</dd>
<dt>침수된 도로를 지나갔어요.</dt>
<dd>물이 차 바닥 이상으로 차는 도로는 지나가지 않는 게 원칙이에요. 이미 지나갔다면 브레이크를 몇 번 가볍게 밟아 말리고, 침수되어 시동이 꺼졌다면 다시 시동을 걸지 말고 견인해요. 엔진이 크게 손상될 수 있어요.</dd>
</dl>
