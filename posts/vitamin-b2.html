  data-title="비타민 B2(리보플라빈): 입꼬리가 갈라질 때 떠올리는 비타민, 편두통 예방 연구까지"
  data-thumb="1.5mg|남성 권장섭취량"
  data-summary="비타민 B2는 에너지를 만들고 다른 비타민이 제 역할을 하도록 돕는 조력자예요. 하루 권장섭취량과 우유·달걀 등 많이 든 음식, 빛에 약한 성질, 입꼬리 염증과 혀 염증 같은 결핍 신호와 다른 원인, 편두통 예방에 쓰는 고용량의 근거, 영양제를 먹으면 소변이 노래지는 이유를 정리했어요."

<p class="lead">영양제를 먹은 뒤 소변이 형광 노란색으로 변해 놀란 적이 있나요? 그 색의 주인공이 비타민 B2(리보플라빈)예요. 에너지를 만드는 효소를 돕고, 비타민 B6와 엽산, 나이아신이 제 역할을 하도록 도와주는 숨은 조력자예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인 권장섭취량은 하루 <strong>남성 1.5mg, 여성 1.2mg</strong>이에요.</li>
<li><strong>우유·요구르트, 달걀, 고기, 버섯, 아몬드</strong>에 많아요.</li>
<li><strong>빛에 약해서</strong> 우유를 투명한 병에 담아 햇빛에 두면 줄어요.</li>
<li>입꼬리 염증은 B2 말고도 철분·다른 B군 부족, 곰팡이 감염 등 원인이 다양해요.</li>
</ul></div>

<h2>비타민 B2가 하는 일</h2>
<ul>
<li>몸속에서 FAD, FMN이라는 조효소가 되어 탄수화물·지방·단백질에서 <strong>에너지를 만드는 과정</strong>을 도와요.</li>
<li>비타민 B6를 활성형으로 바꾸고, 엽산 대사와 나이아신 생성에도 필요해요.</li>
<li>항산화 효소(글루타티온 환원효소)가 일하는 데 쓰여요.</li>
</ul>

<h2>하루에 얼마나</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th class="num">권장섭취량(하루)</th></tr></thead>
<tbody>
<tr><td>성인 남성(19~64세)</td><td class="num">1.5mg</td></tr>
<tr><td>성인 여성(19~64세)</td><td class="num">1.2mg</td></tr>
<tr><td>임신부</td><td class="num">+0.4mg</td></tr>
<tr><td>수유부</td><td class="num">+0.5mg</td></tr>
</tbody>
<caption>보건복지부·한국영양학회, 2020 한국인 영양소 섭취기준. 음식과 보충제의 상한섭취량은 정해져 있지 않아요</caption></table></div>

<h2>많이 든 음식</h2>
<div class="tbl"><table>
<thead><tr><th>식품(1회 분량)</th><th class="num">리보플라빈(대략)</th></tr></thead>
<tbody>
<tr><td>소 간 60g</td><td class="num">약 1.5mg</td></tr>
<tr><td>우유 1컵(200mL)</td><td class="num">약 0.3mg</td></tr>
<tr><td>플레인 요구르트 1개(150g)</td><td class="num">약 0.2mg</td></tr>
<tr><td>달걀 1개</td><td class="num">약 0.2mg</td></tr>
<tr><td>아몬드 30g</td><td class="num">약 0.3mg</td></tr>
<tr><td>소고기·돼지고기 100g</td><td class="num">0.2~0.3mg</td></tr>
<tr><td>양송이·표고버섯 100g</td><td class="num">0.2~0.4mg</td></tr>
<tr><td>시금치 등 녹색 잎채소 100g(익힌 것)</td><td class="num">약 0.2mg</td></tr>
</tbody>
<caption>농촌진흥청 국가표준식품성분표, 미국 농무부(USDA) 식품 데이터를 바탕으로 한 대략값</caption></table></div>
<p>우리 식단에서는 우유와 유제품, 달걀, 고기가 주요 공급원이에요. 유제품을 거의 먹지 않고 고기도 적게 먹는다면 버섯, 아몬드, 녹색 채소, 강화 시리얼로 채워요.</p>

<h2>빛과 조리</h2>
<ul>
<li>리보플라빈은 열에는 비교적 강하지만 <strong>빛, 특히 자외선</strong>에 약해요. 우유가 불투명한 팩에 담기는 이유 가운데 하나예요.</li>
<li>물에 녹으니 삶은 물을 버리면 일부 빠져나가요.</li>
<li>유제품과 채소는 빛이 들지 않는 냉장고 안에 보관해요.</li>
</ul>

<h2>부족하면 나타나는 신호</h2>
<div class="tbl"><table>
<thead><tr><th>부위</th><th>변화</th></tr></thead>
<tbody>
<tr><td>입</td><td>입꼬리가 갈라지고 헐어요(구각염), 입술이 붉고 갈라져요, 입안이 헐어요</td></tr>
<tr><td>혀</td><td>혀가 붉은 자주색으로 붓고 아파요(설염)</td></tr>
<tr><td>피부</td><td>코 옆, 귀 뒤에 기름진 비듬 같은 피부염</td></tr>
<tr><td>눈</td><td>충혈, 가려움, 빛에 눈부심</td></tr>
<tr><td>혈액</td><td>빈혈(철 이용이 방해받아요)</td></tr>
</tbody></table></div>
<p>리보플라빈만 따로 부족한 경우는 드물고, 다른 B군 비타민이 함께 부족한 경우가 많아요. <strong>입꼬리 염증</strong>은 철분 부족, 침이 고이는 습관, 칸디다 곰팡이 감염, 틀니 문제 등으로도 생기니, 2주 넘게 낫지 않으면 진료를 받아요.</p>

<h2>부족해지기 쉬운 사람</h2>
<ul>
<li>유제품과 고기를 거의 먹지 않는 사람(엄격한 채식)</li>
<li>과음하는 사람</li>
<li>임신부, 수유부, 운동선수(필요량 증가)</li>
<li>식사량이 크게 준 어르신</li>
<li>갑상선 기능 저하증이 있는 사람(활성형으로 바꾸는 과정이 줄어요)</li>
</ul>

<h2>편두통 예방과 고용량</h2>
<p>몇몇 연구에서 리보플라빈 <strong>하루 400mg</strong>을 3개월 이상 먹었을 때 편두통 횟수가 줄었어요. 미국신경과학회 등이 과거 지침에서 '효과가 있을 수 있는' 선택지로 소개했지만, 연구 규모가 작아 근거는 중간 수준이에요.</p>
<ul>
<li>음식으로 먹는 양보다 수백 배 많은 용량이라 의사와 상의해 시작해요.</li>
<li>효과를 판단하려면 최소 2~3개월은 꾸준히 먹어야 해요.</li>
<li>부작용은 적지만 설사, 소변 색 변화가 있을 수 있어요.</li>
</ul>

<h2>소변이 노래지는 이유</h2>
<p>몸이 한 번에 흡수할 수 있는 리보플라빈은 많지 않아요. 흡수되고 남은 양은 소변으로 빠져나가며 형광 노란색을 띠게 해요. <strong>해롭지 않은 정상 현상</strong>이에요. 오히려 영양제 속 리보플라빈의 상당 부분이 쓰이지 못하고 배출된다는 뜻이기도 해요.</p>

<div class="box"><span class="h">비타민 B2 챙기기</span>
<ol>
<li>우유·요구르트·치즈 하루 1~2번</li>
<li>달걀과 고기 적당히</li>
<li>버섯, 아몬드, 녹색 채소 곁들이기</li>
<li>유제품은 빛 차단해 냉장 보관</li>
<li>입꼬리 염증 2주 넘으면 진료</li>
<li>편두통 목적 고용량은 의사와 상의</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>입병(구내염)이 자주 나면 비타민 B2를 먹어야 하나요?</dt>
<dd>반복되는 구내염은 스트레스, 피로, 철분·B12·엽산 부족, 일부 질환 등 원인이 다양해요. B2 부족만의 문제는 드물어요. 자주 생기거나 오래가면 진료를 받아 원인을 확인해요.</dd>
<dt>종합비타민에 든 양으로 충분한가요?</dt>
<dd>대부분의 종합비타민에는 권장섭취량 이상이 들어 있어요. 식사가 부족한 사람에게는 도움이 되지만, 이미 골고루 먹는 사람에게 추가 이득은 크지 않아요.</dd>
<dt>과하게 먹으면 해롭나요?</dt>
<dd>음식과 일반 보충제 용량에서 해로운 과잉 사례는 거의 없어 상한섭취량이 정해져 있지 않아요.</dd>
</dl>
