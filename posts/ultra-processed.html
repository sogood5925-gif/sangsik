  data-summary="과자, 탄산음료, 라면, 햄, 즉석식품처럼 공장에서 여러 단계를 거쳐 만든 초가공식품은 편리하지만 자주 먹을수록 여러 만성질환 위험과 관련이 있어요. 가공 정도에 따른 NOVA 분류, 초가공식품을 알아보는 법, 더 많이 먹게 되는 이유를 보여 준 연구, 모든 가공식품이 나쁜 건 아니라는 점, 현실적으로 줄이는 방법을 정리했어요."

<p class="lead">바쁜 하루 끝에 편의점 도시락과 컵라면, 과자 한 봉지로 저녁을 해결하는 날이 많아요. 초가공식품은 싸고 맛있고 오래 보관돼 우리 식탁의 큰 부분을 차지하게 됐어요. 최근 연구들은 이런 식품의 비율이 높을수록 건강에 불리하다는 신호를 보여 주고 있어요. 그렇다고 모두 끊을 필요는 없어요. 무엇을 먼저 바꾸면 좋을지 살펴볼게요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>초가공식품은 <strong>가정 부엌에서 쓰지 않는 원료</strong>(변성 전분, 유화제, 향료 등)로 여러 단계를 거쳐 만든 식품이에요.</li>
<li>초가공식품 위주로 먹은 사람은 <strong>하루 약 500kcal를 더 먹었다</strong>는 실험 연구가 있어요.</li>
<li>많이 먹을수록 <strong>비만, 제2형 당뇨, 심혈관 질환, 우울</strong> 등과 관련이 있다는 연구가 많아요.</li>
<li><strong>단 음료와 가공육</strong>처럼 영향이 큰 것부터 줄이는 게 현실적이에요.</li>
</ul></div>

<h2>가공 정도에 따른 분류(NOVA)</h2>
<div class="tbl"><table>
<thead><tr><th>분류</th><th>뜻</th><th>예</th></tr></thead>
<tbody>
<tr><td>1군: 비가공·최소 가공</td><td>자연 상태이거나 씻기, 말리기, 냉동 정도만</td><td>채소, 과일, 쌀, 달걀, 우유, 생고기, 냉동 채소</td></tr>
<tr><td>2군: 가공 요리 재료</td><td>음식을 만들 때 쓰는 재료</td><td>소금, 설탕, 식용유, 버터</td></tr>
<tr><td>3군: 가공식품</td><td>1군 식품에 2군 재료를 더해 간단히 가공</td><td>통조림 채소, 치즈, 갓 구운 빵, 김치, 두부</td></tr>
<tr><td>4군: 초가공식품</td><td>공업적 원료와 첨가물로 여러 단계를 거쳐 만든 제품</td><td>탄산·가당 음료, 과자, 사탕, 라면, 햄·소시지, 너겟, 달콤한 시리얼, 즉석 디저트</td></tr>
</tbody>
<caption>Monteiro CA 외 NOVA 분류, 유엔식량농업기구(FAO) 보고서를 바탕으로 정리</caption></table></div>

<h2>알아보는 법</h2>
<p>원재료명을 봤을 때 <strong>집 부엌에 없는 재료</strong>가 여러 개 있으면 초가공식품일 가능성이 커요.</p>
<ul>
<li>변성 전분, 말토덱스트린, 액상과당, 분리 단백</li>
<li>유화제, 향료, 착색료, 향미증진제, 감미료</li>
<li>경화유, 에스테르화유</li>
</ul>
<p>원재료 목록이 길고 낯설수록, 그리고 '바로 먹을 수 있게' 만든 제품일수록 초가공에 가까워요.</p>

<h2>더 많이 먹게 되는 이유</h2>
<p>미국 국립보건원 연구에서 20명이 2주 동안 초가공식품 위주 식사를, 2주 동안 최소 가공식품 위주 식사를 했어요. 두 식사는 열량, 당, 지방, 식이섬유를 비슷하게 맞추고 원하는 만큼 먹게 했어요. 그 결과 초가공식품을 먹는 기간에 <strong>하루 약 500kcal를 더 먹고 체중이 늘었어요.</strong> 부드러워 빨리 먹게 되고, 맛이 강해 멈추기 어렵고, 열량 밀도가 높은 것이 이유로 꼽혀요.</p>

<h2>건강과의 관련</h2>
<div class="tbl"><table>
<thead><tr><th>관련이 보고된 문제</th><th>근거 수준</th></tr></thead>
<tbody>
<tr><td>심혈관 질환 사망, 제2형 당뇨, 비만</td><td>여러 관찰 연구에서 비교적 일관돼요</td></tr>
<tr><td>불안·우울 같은 정신 건강 문제</td><td>관련이 보고됐지만 원인과 결과는 아직 분명하지 않아요</td></tr>
<tr><td>일부 암, 전체 사망</td><td>관련이 보고됐지만 연구마다 차이가 있어요</td></tr>
</tbody>
<caption>Lane MM 외, Ultra-processed food exposure and adverse health outcomes: umbrella review, BMJ 2024를 바탕으로 정리. 대부분 관찰 연구라 인과 관계는 조심스럽게 해석해요</caption></table></div>

<h2>모든 가공식품이 나쁜 건 아니에요</h2>
<ul>
<li>플레인 요거트, 통곡물빵, 두부, 냉동 채소, 통조림 콩처럼 영양이 좋은 가공식품도 많아요.</li>
<li>같은 초가공식품 안에서도 <strong>단 음료와 가공육</strong>은 위험 신호가 크고, 통곡물 시리얼이나 요거트는 그렇지 않다는 분석도 있어요.</li>
<li>분류 자체보다 <strong>당·나트륨·포화지방, 식이섬유, 먹는 양과 빈도</strong>를 함께 보는 것이 좋아요.</li>
</ul>

<h2>현실적으로 줄이는 방법</h2>
<ul>
<li><strong>단 음료</strong>를 물, 탄산수, 무가당 차로 바꿔요. 가장 효과가 큰 한 가지예요.</li>
<li>간식은 과자 대신 <strong>과일, 견과류 한 줌, 삶은 달걀, 플레인 요거트</strong>로.</li>
<li>라면을 먹는다면 스프를 반만, 채소와 달걀을 더해요.</li>
<li>햄·소시지 대신 달걀, 두부, 생선, 닭고기를 자주 골라요.</li>
<li>주말에 <strong>밥, 삶은 채소, 나물, 달걀</strong>을 미리 준비해 두면 평일이 편해요.</li>
<li>편의점에서는 도시락보다 <strong>주먹밥 + 샐러드 + 우유</strong>처럼 조합해 봐요.</li>
</ul>

<div class="box note"><span class="h">죄책감은 내려놓아요</span>
<p>초가공식품을 먹는 건 개인의 의지만의 문제가 아니라 시간, 비용, 환경의 문제이기도 해요. 한 끼를 완벽하게 바꾸기보다, 일주일에 한 가지씩 바꾸는 것이 오래가요.</p></div>

<div class="box"><span class="h">초가공식품 줄이기 체크리스트</span>
<ol>
<li>단 음료부터 물·무가당 차로</li>
<li>간식은 과일·견과·요거트</li>
<li>가공육은 주 1~2회 이하</li>
<li>원재료명 짧은 제품 고르기</li>
<li>주말에 기본 반찬 미리 준비</li>
<li>한 번에 하나씩 바꾸기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>첨가물 때문에 초가공식품이 나쁜 건가요?</dt>
<dd>첨가물 하나하나는 안전 기준 안에서 쓰이고 있어요. 초가공식품의 문제는 첨가물 자체보다 설탕·나트륨·정제 전분이 많고, 식이섬유가 적고, 빨리 많이 먹게 되는 전체 구조에 있다고 보는 시각이 많아요.</dd>
<dt>단백질 바, 식물성 대체육도 초가공식품인가요?</dt>
<dd>분류상 초가공식품에 들어가는 경우가 많아요. 영양성분과 원재료를 보고, 매일의 주식보다는 가끔 쓰는 편이 좋아요.</dd>
<dt>아이 간식은 어떻게 할까요?</dt>
<dd>집에 과일, 우유, 삶은 고구마, 치즈처럼 바로 줄 수 있는 간식을 두면 과자에 손이 덜 가요. 금지보다 선택지를 바꿔 주는 방식이 좋아요.</dd>
</dl>
