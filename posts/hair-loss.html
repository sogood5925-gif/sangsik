  data-title="탈모: 하루 100개는 정상, 유전성 탈모는 일찍 치료할수록 지킬 수 있어요"
  data-thumb="100개|하루 정상 빠짐"
  data-summary="머리카락이 빠지면 누구나 불안해져요. 하루에 빠지는 정상 개수, 남성형·여성형 탈모와 원형 탈모, 휴지기 탈모의 차이, 효과가 확인된 치료(미녹시딜, 피나스테리드 등)와 부작용, 샴푸와 영양제의 한계, 갑상선이나 빈혈처럼 원인 질환을 확인해야 하는 경우를 정리했어요."
  data-tags="탈모,남성형탈모,원형탈모,미녹시딜,건강상식">
<p class="lead">배수구에 쌓인 머리카락을 보면 걱정이 앞서지요. 머리카락은 자라고, 쉬고, 빠지는 주기를 반복해서 하루 수십 개가 빠지는 건 정상이에요. 하지만 유전성 탈모는 서서히 진행하고 한번 가늘어진 모낭은 되돌리기 어려워, 일찍 알아채고 효과가 확인된 치료를 시작하는 것이 중요해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>하루 <strong>50~100개</strong> 정도 빠지는 건 정상이에요.</li>
<li>가장 흔한 탈모는 <strong>유전과 호르몬</strong>에 의한 남성형·여성형 탈모로, 천천히 진행해요.</li>
<li>효과가 확인된 치료는 <strong>바르는 미녹시딜, 먹는 피나스테리드·두타스테리드(남성)</strong> 등이에요.</li>
<li>갑자기 많이 빠진다면 <strong>갑상선, 빈혈, 출산, 고열, 다이어트</strong> 같은 원인을 확인해요.</li>
</ul></div>

<h2>탈모의 종류</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>특징</th><th>원인</th></tr></thead>
<tbody>
<tr><td>남성형 탈모</td><td>이마 양옆(M자)과 정수리가 가늘어지고 빠져요</td><td>유전 + 남성호르몬(DHT)</td></tr>
<tr><td>여성형 탈모</td><td>앞머리 선은 유지되고 <strong>정수리 가르마가 넓어져요</strong></td><td>유전, 호르몬 변화(폐경 등)</td></tr>
<tr><td>휴지기 탈모</td><td>머리 전체가 갑자기 많이 빠져요. 2~3개월 전 계기가 있는 경우가 많아요</td><td>출산, 고열, 수술, 극심한 스트레스, 급격한 다이어트, 갑상선 질환, 철분 부족, 약</td></tr>
<tr><td>원형 탈모</td><td>동전 모양으로 경계가 뚜렷하게 빠져요</td><td>자가면역</td></tr>
<tr><td>견인성 탈모</td><td>이마 선, 옆머리가 빠져요</td><td>오랫동안 머리를 세게 묶거나 당기는 습관</td></tr>
</tbody>
<caption>대한피부과학회, 대한모발학회 탈모 정보를 바탕으로 정리</caption></table></div>

<h2>효과가 확인된 치료</h2>
<div class="tbl"><table>
<thead><tr><th>치료(성분)</th><th>대상</th><th>알아 둘 점</th></tr></thead>
<tbody>
<tr><td>바르는 미녹시딜</td><td>남성·여성</td><td>하루 1~2번 두피에 발라요. 처음 1~2개월에 일시적으로 더 빠질 수 있어요. 끊으면 몇 달 안에 원래대로 돌아가요</td></tr>
<tr><td>먹는 피나스테리드, 두타스테리드</td><td>남성</td><td>DHT를 줄여 진행을 늦추고 일부는 다시 자라요. 성욕 감소 등 부작용이 드물게 있어요. <strong>가임기 여성은 먹거나 부서진 알약을 만지지 않아요</strong>(남아 기형 위험). PSA 수치를 낮추니 검사 때 알려요</td></tr>
<tr><td>저용량 먹는 미녹시딜</td><td>남성·여성(의사 판단)</td><td>최근 쓰임이 늘었어요. 두근거림, 부종, 원치 않는 체모 증가가 있을 수 있어 처방과 관찰이 필요해요</td></tr>
<tr><td>모발 이식</td><td>진행이 안정된 사람</td><td>뒷머리 모낭을 옮겨 심어요. 이식 후에도 남은 머리를 지키는 약 치료를 함께 해요</td></tr>
<tr><td>원형 탈모 치료</td><td>원형 탈모</td><td>스테로이드 주사·바르는 약, 넓은 경우 JAK 억제제 등. 피부과에서 치료해요</td></tr>
</tbody>
<caption>대한피부과학회·대한모발학회 탈모 진료 지침, 유럽피부과학회(EDF) 남성형 탈모 지침을 바탕으로 정리</caption></table></div>
<p>약 효과는 보통 <strong>3~6개월</strong> 지나야 보이기 시작하고, 1년쯤 지나 판단해요. 꾸준히 써야 유지돼요.</p>

<h2>샴푸와 영양제는 어떨까</h2>
<ul>
<li><strong>탈모 샴푸:</strong> 두피를 깨끗하게 하는 데 도움이 되지만, 유전성 탈모의 진행을 막는 효과는 약해요. 국내에서 '탈모 증상 완화'로 허가된 샴푸도 치료제가 아니에요.</li>
<li><strong>영양제(비오틴, 아연 등):</strong> 결핍이 없는 사람의 유전성 탈모에 효과가 확인되지 않았어요. 고용량 비오틴은 갑상선 검사 결과를 왜곡할 수 있어요.</li>
<li><strong>검은콩, 어성초, 두피 마사지 기기</strong> 등도 효과 근거가 약해요.</li>
<li>샴푸는 하루 한 번 정도 두피를 중심으로 씻고 충분히 헹구면 돼요. 머리를 감을 때 빠지는 머리카락은 어차피 빠질 머리카락이에요.</li>
</ul>

<h2>원인 질환을 확인해야 할 때</h2>
<div class="box warn"><span class="h">이럴 때는 검사를 받아요</span>
<ul>
<li>몇 주 사이 <strong>머리 전체가 한 움큼씩</strong> 빠져요.</li>
<li>피로, 추위를 탐, 체중 변화, 월경 이상이 함께 있어요(갑상선, 빈혈, 다낭성난소증후군).</li>
<li>두피가 붉고 가렵고 진물이나 비듬이 심해요(지루성 피부염, 두피 곰팡이 감염, 건선).</li>
<li>눈썹, 속눈썹, 몸의 털도 빠져요.</li>
<li>새로운 약을 시작한 뒤 빠지기 시작했어요.</li>
</ul>
<p>혈액 검사로 갑상선 기능, 철분(페리틴), 빈혈 등을 확인하고, 원인을 치료하면 휴지기 탈모는 대부분 몇 달 안에 회복돼요.</p></div>

<h2>생활에서 할 수 있는 것</h2>
<ul>
<li>급격한 다이어트를 피하고 <strong>단백질과 철분</strong>을 충분히 먹어요.</li>
<li>머리를 세게 묶거나 당기는 스타일을 오래 유지하지 않아요.</li>
<li>뜨거운 드라이어, 잦은 염색·파마는 머리카락을 상하게 해요(모낭 자체보다는 모발 손상).</li>
<li>금연해요. 흡연은 탈모 진행과 관련 있다는 연구가 있어요.</li>
<li>충분히 자고 스트레스를 관리해요.</li>
</ul>

<div class="box"><span class="h">탈모 체크리스트</span>
<ol>
<li>하루 100개 이내면 정상 범위</li>
<li>가르마·정수리·이마 선 사진을 몇 달 간격으로 비교</li>
<li>유전성 탈모면 일찍 피부과 상담</li>
<li>약은 6개월~1년 꾸준히 써 보고 판단</li>
<li>갑자기 많이 빠지면 원인 검사</li>
<li>샴푸·영양제에 큰 기대는 금물</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>머리를 자주 감으면 더 빠지나요?</dt>
<dd>감을 때 빠지는 머리카락은 이미 빠질 준비가 된 것들이라, 감는 횟수가 탈모를 늘리지는 않아요. 오히려 두피를 깨끗하게 유지하는 게 좋아요.</dd>
<dt>탈모 치료는 건강보험이 되나요?</dt>
<dd>유전성 탈모는 미용 목적으로 분류돼 대부분 보험이 적용되지 않아요. 원형 탈모 등 질병으로 인한 탈모는 적용되는 경우가 있어요.</dd>
<dt>여성도 피나스테리드를 먹을 수 있나요?</dt>
<dd>가임기 여성은 태아 위험 때문에 먹지 않아요. 폐경 후 여성에게 쓰는 경우가 있지만 효과 근거가 제한적이라 피부과와 상의해요. 여성은 주로 미녹시딜을 써요.</dd>
</dl>
