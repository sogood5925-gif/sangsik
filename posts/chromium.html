  data-title="크롬: 혈당 영양제로 유명하지만 근거는 약한 미량 무기질, 3가 크롬과 6가 크롬은 전혀 달라요"
  data-thumb="20~30μg|성인 충분섭취량"
  data-summary="크롬은 인슐린이 제대로 일하도록 돕는 것으로 알려진 미량 무기질이에요. 하루 필요량과 들어 있는 음식, 혈당·체중 감량 영양제로서의 연구 결과, 당뇨약을 먹는 사람이 주의할 점, 음식 속 3가 크롬과 산업용 6가 크롬의 차이를 정리했어요."

<p class="lead">'혈당 관리'를 내세운 영양제 성분표에서 크롬을 자주 볼 수 있어요. 크롬이 인슐린의 작용을 돕는다는 연구에서 시작된 이야기예요. 그런데 크롬이 부족하지 않은 사람이 보충제를 먹었을 때 혈당이 의미 있게 좋아지는지는 아직 분명하지 않아요. 기대와 근거 사이의 거리를 짚어 볼게요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인 충분섭취량은 하루 <strong>남성 25~30μg, 여성 20μg</strong> 안팎으로 아주 적은 양이에요.</li>
<li><strong>통곡물, 브로콜리, 고기, 견과류</strong> 등 여러 음식에 조금씩 들어 있어요.</li>
<li>크롬 보충제가 <strong>혈당이나 체중을 크게 낮춘다는 근거는 약해요.</strong></li>
<li>음식과 영양제의 <strong>3가 크롬</strong>은 산업 현장의 독성 물질인 <strong>6가 크롬</strong>과 달라요.</li>
</ul></div>

<h2>크롬이 하는 일</h2>
<p>크롬은 인슐린이 세포에 신호를 보내는 과정을 도와 포도당, 지방, 단백질 대사에 관여하는 것으로 알려져 있어요. 오랫동안 정맥 영양만 받던 환자에게 크롬이 빠졌을 때 혈당이 오르고 신경 증상이 생겼다가 크롬을 넣자 좋아진 사례가 보고되면서 주목받았어요. 다만 몸속에서 크롬이 정확히 어떻게 일하는지는 아직 논쟁이 있어요.</p>

<h2>하루에 얼마나</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th class="num">충분섭취량(하루, 대략)</th></tr></thead>
<tbody>
<tr><td>성인 남성</td><td class="num">25~30μg(나이에 따라)</td></tr>
<tr><td>성인 여성</td><td class="num">20μg</td></tr>
<tr><td>임신·수유부</td><td class="num">조금 더 필요</td></tr>
<tr><td>상한섭취량</td><td class="num">정해지지 않음</td></tr>
</tbody>
<caption>보건복지부·한국영양학회, 2020 한국인 영양소 섭취기준을 바탕으로 정리. 연령 구간별 수치는 섭취기준 원문을 확인해요</caption></table></div>

<h2>들어 있는 음식</h2>
<div class="tbl"><table>
<thead><tr><th>식품(1회 분량)</th><th class="num">크롬(대략)</th></tr></thead>
<tbody>
<tr><td>브로콜리 1/2컵</td><td class="num">약 11μg</td></tr>
<tr><td>포도 주스 1컵</td><td class="num">약 8μg</td></tr>
<tr><td>통밀빵·통곡물 1회 분량</td><td class="num">약 2~4μg</td></tr>
<tr><td>감자 1개</td><td class="num">약 3μg</td></tr>
<tr><td>쇠고기 85g</td><td class="num">약 2μg</td></tr>
<tr><td>칠면조·닭고기 85g</td><td class="num">약 2μg</td></tr>
<tr><td>사과·바나나 1개</td><td class="num">약 1μg</td></tr>
</tbody>
<caption>미국 국립보건원(NIH) 영양보충제국 Chromium Fact Sheet를 바탕으로 정리. 흙과 가공 방법에 따라 함량 차이가 커요</caption></table></div>
<p>정제된 곡물과 설탕이 많은 식사는 크롬이 적고, 단 음식은 소변으로 크롬이 빠져나가는 양을 늘릴 수 있어요. 통곡물과 채소 위주의 식사가 크롬에도 좋아요.</p>

<h2>혈당·체중 영양제의 근거</h2>
<div class="tbl"><table>
<thead><tr><th>기대하는 효과</th><th>연구 결과</th></tr></thead>
<tbody>
<tr><td>당뇨병 환자의 혈당</td><td>일부 연구에서 공복혈당이 조금 내려갔지만, 연구마다 결과가 엇갈리고 당화혈색소 개선은 작거나 없었어요</td></tr>
<tr><td>당뇨병 예방</td><td>당뇨 전단계에서 당뇨 발생을 줄인다는 근거는 없어요</td></tr>
<tr><td>체중 감량</td><td>줄었더라도 매우 적은 양(1kg 안팎)이라 의미가 크지 않아요</td></tr>
<tr><td>근육 증가</td><td>근거가 없어요</td></tr>
</tbody>
<caption>미국당뇨병학회(ADA) Standards of Care, 미국 국립보건원(NIH) 영양보충제국 자료를 바탕으로 정리</caption></table></div>
<p>미국당뇨병학회는 결핍이 없는 사람에게 혈당 조절을 위해 크롬 같은 보충제를 권할 근거가 없다고 밝혀요. 혈당 관리의 중심은 식사, 운동, 체중, 그리고 필요할 때 약이에요.</p>

<div class="box warn"><span class="h">당뇨약을 먹고 있다면</span>
<p>인슐린이나 혈당강하제를 쓰는 사람이 크롬 등 혈당 영양제를 더하면, 드물지만 <strong>저혈당</strong>이 생길 수 있어요. 식은땀, 떨림, 가슴 두근거림, 어지러움이 오면 사탕이나 주스로 당을 보충하고 의사에게 알려요. 영양제를 시작하거나 끊을 때는 의사·약사와 상의해요. 고용량 크롬을 먹은 뒤 콩팥·간 손상이 보고된 드문 사례도 있어요.</p></div>

<h2>3가 크롬과 6가 크롬</h2>
<ul>
<li><strong>3가 크롬:</strong> 음식과 영양제에 들어 있는 형태로, 흡수율이 낮고 독성이 적어요.</li>
<li><strong>6가 크롬:</strong> 도금, 염료, 가죽 무두질, 용접 같은 산업 과정에서 생겨요. 피부염, 호흡기 손상을 일으키고 들이마시면 폐암을 일으키는 발암 물질이에요.</li>
</ul>
<p>이름이 같아 헷갈리지만 성질이 전혀 달라요. 작업장에서 6가 크롬에 노출된다면 보호구와 특수 건강진단을 챙겨요.</p>

<div class="box"><span class="h">크롬 체크리스트</span>
<ol>
<li>통곡물·채소 위주 식사</li>
<li>단 음식과 정제 곡물 줄이기</li>
<li>혈당 영양제보다 식사·운동·약</li>
<li>당뇨약과 함께 먹는다면 상의</li>
<li>영양제 여러 개에 겹친 성분 확인</li>
<li>작업장 6가 크롬은 보호구</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>크롬 영양제를 먹으면 당뇨약을 줄일 수 있나요?</dt>
<dd>그렇게 할 근거는 없어요. 약 조절은 반드시 혈당 기록을 보며 의사와 결정해요.</dd>
<dt>스테인리스 냄비에서 크롬이 나오나요?</dt>
<dd>산성 음식을 오래 조리하면 아주 적은 양이 나올 수 있지만 건강에 문제가 되는 수준은 아니에요.</dd>
<dt>크롬이 부족한지 검사할 수 있나요?</dt>
<dd>혈액이나 소변의 크롬 수치는 몸 상태를 잘 반영하지 못해 일상적으로 검사하지 않아요.</dd>
</dl>
