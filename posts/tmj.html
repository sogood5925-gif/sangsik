  data-title="이갈이와 턱관절 장애: 딸깍 소리, 아침 턱 통증, 대부분은 생활 습관으로 좋아지는 이유"
  data-thumb="손가락 3개|정상 입 벌림 폭"
  data-summary="입을 벌릴 때 턱에서 딸깍 소리가 나거나, 아침에 턱이 뻐근하고 머리가 아프다면 턱관절 장애나 이갈이일 수 있어요. 턱관절 장애의 흔한 모습, 낮의 이 악물기와 밤의 이갈이, 턱에 부담을 주는 습관, 부드러운 음식과 온찜질·턱 운동, 구강 장치, 진료가 필요한 신호를 정리했어요."
  data-tags="턱관절,이갈이,이악물기,두통,건강상식">
<p class="lead">사과를 베어 물 때 턱에서 '딸깍' 소리가 나고, 아침에 일어나면 관자놀이가 뻐근해요. 가족이 밤에 이 가는 소리가 난다고 하기도 해요. 턱관절 장애는 흔하지만 대부분 심각한 병으로 이어지지 않고, 턱을 쉬게 하는 습관만으로도 좋아지는 경우가 많아요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>턱관절 장애는 <strong>턱 통증, 관절 소리, 입 벌리기 어려움</strong>이 주요 증상이에요.</li>
<li>통증 없는 딸깍 소리만 있다면 <strong>대개 치료가 필요 없어요.</strong></li>
<li><strong>낮의 이 악물기, 턱 괴기, 딱딱한 음식, 껌</strong>이 턱에 부담을 줘요.</li>
<li>대부분 <strong>턱 쉬기, 온찜질, 턱 운동, 스트레스 관리</strong>로 좋아져요. 수술이 필요한 경우는 드물어요.</li>
</ul></div>

<h2>턱관절 장애의 모습</h2>
<div class="tbl"><table>
<thead><tr><th>증상</th><th>설명</th></tr></thead>
<tbody>
<tr><td>턱 주변 통증</td><td>귀 앞, 관자놀이, 뺨 근육이 아파요. 씹을 때 심해지고 두통처럼 느껴지기도 해요</td></tr>
<tr><td>관절 소리</td><td>입을 벌리거나 다물 때 딸깍, 사각사각 소리. 통증이 없으면 흔한 일이에요</td></tr>
<tr><td>입 벌림 제한</td><td>입이 잘 안 벌어지거나 벌릴 때 턱이 한쪽으로 돌아가요. 정상은 검지·중지·약지 세 손가락이 세로로 들어갈 정도예요</td></tr>
<tr><td>턱 걸림</td><td>입이 벌어진 채 또는 다문 채 순간적으로 걸려요</td></tr>
<tr><td>귀 증상</td><td>귀가 먹먹하거나 귀 앞이 아파 귀 질환으로 오해하기도 해요</td></tr>
</tbody>
<caption>대한턱관절협회, 미국 국립치과두개안면연구소(NIDCR) TMD 안내를 바탕으로 정리</caption></table></div>

<h2>이갈이와 이 악물기</h2>
<ul>
<li><strong>수면 이갈이:</strong> 자는 동안 이를 갈거나 꽉 무는 것으로, 본인은 모르고 가족이 알려 줘요. 아침 턱 통증, 치아 마모, 시린 이, 이가 깨지는 원인이 돼요.</li>
<li><strong>낮의 이 악물기:</strong> 집중하거나 긴장할 때 모르게 이를 꽉 물고 있어요. 턱 근육 통증의 흔한 원인이에요.</li>
<li>스트레스, 불안, 카페인, 술, 흡연, 수면무호흡증, 일부 약(항우울제)이 관련돼요.</li>
</ul>
<div class="box note"><span class="h">입술은 붙이고, 이는 떼기</span>
<p>평소 편안한 턱의 자세는 <strong>입술은 가볍게 닫고, 위아래 이는 살짝 떨어져 있고, 혀끝은 윗니 뒤 잇몸에</strong> 놓인 상태예요. 하루에 여러 번 '지금 이를 물고 있나?' 확인해 보세요. 모니터나 휴대폰에 작은 스티커를 붙여 알림으로 쓰는 방법도 있어요.</p></div>

<h2>턱에 부담을 주는 습관</h2>
<div class="tbl"><table>
<thead><tr><th>습관</th><th>바꾸기</th></tr></thead>
<tbody>
<tr><td>껌 씹기, 오징어·견과류처럼 질긴 음식</td><td>통증이 있는 동안은 부드러운 음식, 작게 잘라 먹기</td></tr>
<tr><td>한쪽으로만 씹기</td><td>양쪽으로 고르게 씹기</td></tr>
<tr><td>턱 괴기, 엎드려 자기</td><td>턱을 손에서 떼고, 바로 누워 자기</td></tr>
<tr><td>하품하거나 크게 웃을 때 입을 크게 벌리기</td><td>손으로 턱 아래를 가볍게 받치기</td></tr>
<tr><td>손톱·볼펜 물기</td><td>손을 입에서 멀리</td></tr>
<tr><td>고개를 앞으로 뺀 자세</td><td>화면을 눈높이에, 목을 곧게</td></tr>
</tbody>
<caption>대한턱관절협회, 영국 국민보건서비스(NHS) Temporomandibular disorder 안내를 바탕으로 정리</caption></table></div>

<h2>스스로 할 수 있는 관리</h2>
<ul>
<li><strong>온찜질:</strong> 턱 근육이 뻐근할 때 따뜻한 수건을 10~15분 대요. 붓고 열감이 있을 때는 냉찜질.</li>
<li><strong>부드러운 마사지:</strong> 귀 앞과 뺨 근육을 원을 그리며 부드럽게 풀어요.</li>
<li><strong>가벼운 턱 운동:</strong> 거울을 보며 입을 똑바로 천천히 벌렸다 다물기. 아프면 멈춰요.</li>
<li><strong>스트레스 관리와 수면:</strong> 긴장이 이 악물기로 이어져요.</li>
<li>통증이 심하면 약사와 상의해 진통제를 짧게 써요.</li>
</ul>

<h2>치과·병원에서의 치료</h2>
<ul>
<li><strong>구강 장치(스플린트):</strong> 밤에 끼워 치아 마모를 막고 턱 근육 부담을 줄여요. 치과에서 맞춰야 해요. 약국에서 파는 말랑한 마우스피스는 오히려 씹는 습관을 부를 수 있어요.</li>
<li><strong>물리치료, 근육 이완제</strong></li>
<li><strong>보툴리눔 톡신 주사:</strong> 이갈이·턱 근육 통증에 쓰기도 하지만 효과에 대한 근거는 아직 제한적이에요.</li>
<li><strong>수술:</strong> 대부분 필요 없어요. 관절 구조에 큰 문제가 있고 다른 치료에 반응이 없을 때만 고려해요.</li>
</ul>

<div class="box warn"><span class="h">진료를 받아야 할 때</span>
<ul>
<li>입이 <strong>갑자기 벌어지지 않거나 다물어지지 않아요.</strong></li>
<li>턱 부위가 붓고 열이 나요.</li>
<li>얼굴이 저리거나 감각이 둔해요.</li>
<li>씹을 때 턱과 함께 <strong>가슴 통증, 숨참, 식은땀</strong>이 있어요. 심장 문제의 통증이 턱으로 퍼질 수 있어 바로 119예요.</li>
</ul></div>

<div class="box"><span class="h">턱관절 체크리스트</span>
<ol>
<li>입술은 닫고 이는 떼기</li>
<li>껌·질긴 음식 줄이기</li>
<li>턱 괴기·엎드려 자기 피하기</li>
<li>뻐근할 땐 온찜질</li>
<li>이갈이는 치과에서 구강 장치 상담</li>
<li>입이 안 벌어지면 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>딸깍 소리가 나는데 치료해야 하나요?</dt>
<dd>통증이나 입 벌림 제한이 없다면 대부분 치료가 필요 없어요. 증상이 생기면 그때 진료를 받아요.</dd>
<dt>교정 치료를 하면 턱관절 장애가 낫나요?</dt>
<dd>교정이나 치아를 깎는 치료가 턱관절 장애를 예방하거나 치료한다는 근거는 부족해요. 되돌릴 수 없는 치료는 신중하게 결정해요.</dd>
<dt>아이도 이를 가는데 괜찮나요?</dt>
<dd>아이의 이갈이는 흔하고 자라면서 줄어드는 경우가 많아요. 코골이나 입 벌리고 자는 습관이 함께 있다면 소아청소년과나 치과에서 확인해요.</dd>
</dl>
