  data-summary="해마다 여름이면 수천 명이 온열질환으로 응급실을 찾아요. 열탈진·열경련·열실신·열사병의 차이와 대처, 바로 119를 불러야 하는 열사병의 신호와 체온을 빨리 낮추는 법, 특히 조심해야 할 사람, 무더위 속 일하는 사람과 어르신을 위한 예방 수칙을 정리했어요."

<p class="lead">더운 날 어지럽고 기운이 빠지는 건 흔한 일이지만, 그중 일부는 몇 시간 안에 생명을 위협하는 열사병으로 이어질 수 있어요. 두 가지를 구별하는 기준은 <strong>의식</strong>이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>열사병</strong>은 체온이 40°C를 넘고 <strong>의식이 흐려지는</strong> 응급 상황이에요. 바로 119예요.</li>
<li>119를 기다리는 동안 <strong>시원한 곳으로 옮기고 몸을 빨리 식혀요.</strong></li>
<li><strong>열탈진</strong>은 땀이 많이 나고 어지러우며 의식은 또렷해요. 쉬고 수분을 보충하면 대개 좋아져요.</li>
<li>예방의 핵심은 <strong>물, 그늘, 휴식</strong>이에요.</li>
</ul></div>

<h2>몸은 어떻게 열을 식힐까</h2>
<p>몸은 더워지면 피부 혈관을 넓혀 열을 내보내고, 땀을 흘려 증발시키면서 체온을 낮춰요. 그런데 기온과 습도가 너무 높거나, 땀으로 수분과 염분을 많이 잃거나, 체온 조절 능력이 떨어진 사람은 이 장치가 한계에 부딪혀요. 그러면 체온이 오르며 온열질환이 생겨요.</p>

<h2>온열질환의 종류</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>증상</th><th>대처</th></tr></thead>
<tbody>
<tr><td>열사병</td><td>체온 40°C 이상, <strong>의식 변화</strong>(헛소리, 혼돈, 경련, 의식 저하), 피부가 뜨겁고 땀이 없을 수도 있음</td><td><strong>즉시 119</strong>, 시원한 곳으로, 빠르게 몸 식히기</td></tr>
<tr><td>열탈진 (일사병)</td><td>땀이 많이 남, 피로, 어지러움, 두통, 메스꺼움, 창백함. 체온은 40°C 미만, <strong>의식은 또렷함</strong></td><td>시원한 곳에서 쉬고 물·이온음료 보충. 1시간 안에 나아지지 않으면 병원</td></tr>
<tr><td>열경련</td><td>땀을 많이 흘린 뒤 팔, 다리, 배 근육에 통증을 동반한 경련</td><td>쉬면서 전해질 보충, 근육 스트레칭</td></tr>
<tr><td>열실신</td><td>더운 곳에 오래 서 있거나 갑자기 일어날 때 잠깐 의식을 잃음</td><td>시원한 곳에 눕히고 다리를 올림. 회복 후 수분 보충</td></tr>
<tr><td>열부종</td><td>더위에 손발이 부음</td><td>다리를 올리고 쉬기</td></tr>
</tbody>
<caption>질병관리청 온열질환 예방 안내를 바탕으로 정리</caption></table></div>

<h2>열사병: 1분이 중요하다</h2>
<p>열사병은 체온 조절 기능 자체가 무너진 상태예요. 높은 체온이 뇌, 콩팥, 간, 근육을 빠르게 손상시켜 치료가 늦으면 사망하거나 후유증이 남을 수 있어요. <strong>체온을 얼마나 빨리 낮추느냐</strong>가 결과를 좌우해요.</p>
<div class="box warn"><span class="h">열사병이 의심되면</span>
<ol>
<li><strong>즉시 119</strong>에 신고해요.</li>
<li>그늘이나 에어컨이 있는 <strong>시원한 곳으로</strong> 옮겨요.</li>
<li>옷을 느슨하게 하거나 벗겨요.</li>
<li><strong>몸에 시원한 물을 뿌리고 부채나 선풍기로</strong> 바람을 보내요. 물이 증발하면서 열을 빠르게 빼앗아요.</li>
<li>얼음주머니가 있다면 <strong>목, 겨드랑이, 사타구니</strong>에 대요. 큰 혈관이 지나는 곳이에요.</li>
<li><strong>의식이 없거나 흐리면 물을 먹이지 않아요.</strong> 기도로 넘어갈 수 있어요.</li>
<li>구급대가 올 때까지 계속 식혀요.</li>
</ol></div>
<p>열탈진처럼 보이더라도 <strong>말이 어눌하거나, 엉뚱한 말을 하거나, 사람을 못 알아본다면</strong> 열사병으로 보고 행동해요.</p>

<h2>얼마나 흔할까</h2>
<p>질병관리청은 해마다 여름 온열질환 응급실 감시를 운영해요. 폭염이 심했던 해에는 수천 명의 온열질환자가 보고됐고, 그중 일부는 목숨을 잃었어요. 환자는 <strong>낮 시간 야외 작업장, 논밭</strong>에서 많이 생기고, 실내에서도 냉방이 없는 집의 노인에게서 발생해요.</p>

<h2>특히 조심해야 할 사람</h2>
<ul>
<li><strong>노인:</strong> 더위와 갈증을 늦게 느끼고, 땀을 흘리는 능력이 떨어져요. 혼자 사는 어르신이 특히 위험해요.</li>
<li><strong>영유아와 어린이:</strong> 체온이 빨리 오르고 스스로 표현하기 어려워요. 차 안에 절대 혼자 두지 않아요.</li>
<li><strong>야외 작업자, 농민, 운동선수</strong></li>
<li><strong>만성질환자:</strong> 심장병, 고혈압, 당뇨병, 콩팥병, 정신질환</li>
<li><strong>일부 약을 먹는 사람:</strong> 이뇨제, 일부 혈압약, 항콜린 작용이 있는 약, 일부 정신과 약은 체온 조절이나 수분 균형에 영향을 줘요.</li>
<li>비만, 과음한 사람, 더위에 적응하지 않은 사람 (초여름 첫 폭염 때 환자가 많아요)</li>
</ul>

<h2>예방: 물, 그늘, 휴식</h2>
<div class="tbl"><table>
<thead><tr><th>수칙</th><th>실천</th></tr></thead>
<tbody>
<tr><td>물</td><td>목마르지 않아도 규칙적으로 마셔요. 땀을 많이 흘리면 이온음료나 염분을 함께 보충해요. 술과 카페인 음료는 대신하지 못해요</td></tr>
<tr><td>그늘</td><td>가장 더운 낮 12시~오후 5시에는 야외 활동을 줄이고, 햇볕을 가리는 모자와 밝고 헐렁한 옷을 입어요</td></tr>
<tr><td>휴식</td><td>더운 곳에서 일할 때는 짧게 자주 쉬어요. 어지럽거나 두통이 오면 즉시 멈춰요</td></tr>
<tr><td>시원한 공간</td><td>에어컨을 적절히 쓰고, 에어컨이 없다면 무더위쉼터를 이용해요</td></tr>
<tr><td>적응</td><td>더위에 몸이 적응하는 데 1~2주가 걸려요. 첫 더위에는 활동량을 서서히 늘려요</td></tr>
</tbody>
<caption>질병관리청·고용노동부 폭염 대비 건강 수칙을 바탕으로 정리</caption></table></div>

<h2>일하는 사람을 위한 수칙</h2>
<ul>
<li>폭염 특보 때는 작업 시간을 조정하고, <strong>규칙적인 휴식 시간</strong>을 가져요. 폭염 시 휴식을 보장하도록 산업안전 규정도 강화되는 추세예요.</li>
<li>작업 현장 가까이에 그늘진 휴게 공간과 시원한 물을 둬요.</li>
<li>동료끼리 서로 상태를 확인해요. 온열질환은 본인이 알아차리기 어려울 때가 많아요.</li>
<li>처음 투입된 사람, 휴가 뒤 복귀한 사람은 적응 기간을 둬요.</li>
</ul>

<h2>어르신을 위한 수칙</h2>
<ul>
<li>선풍기만으로는 기온이 35°C를 넘는 날 충분하지 않을 수 있어요. 에어컨이 있다면 전기요금 걱정에 끄지 말고 적정 온도로 켜요.</li>
<li>낮에는 무더위쉼터나 경로당, 도서관처럼 시원한 곳에 머물러요.</li>
<li>가족과 이웃은 폭염 기간에 <strong>하루 한 번 이상</strong> 안부를 확인해요.</li>
<li>밭일은 이른 아침이나 해 질 녘으로 옮기고, 혼자 하지 않아요.</li>
</ul>

<div class="box"><span class="h">폭염 대비 체크리스트</span>
<ol>
<li>폭염 특보와 체감온도 확인하기</li>
<li>외출할 때 물병, 모자, 양산 챙기기</li>
<li>한낮 야외 활동과 운동 피하기</li>
<li>차 안에 아이·반려동물 절대 두지 않기</li>
<li>동네 무더위쉼터 위치 알아두기</li>
<li>혼자 사는 가족·이웃 안부 확인하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>일사병과 열사병은 같은 건가요?</dt>
<dd>흔히 섞어 쓰지만 달라요. 일사병은 보통 열탈진을 말하고 의식은 또렷해요. 열사병은 체온 조절이 무너지고 의식이 흐려지는 응급 상황이에요.</dd>
<dt>해열제를 먹으면 체온이 내려가나요?</dt>
<dd>열사병은 감염으로 인한 발열과 원리가 달라서 해열제가 효과가 없고, 오히려 간과 콩팥에 부담이 될 수 있어요. 몸을 물리적으로 식히는 게 치료예요.</dd>
<dt>밤에도 온열질환이 생기나요?</dt>
<dd>열대야가 이어지면 밤에도 체온이 충분히 내려가지 않아 노인과 만성질환자는 위험할 수 있어요. 밤에도 실내 온도를 적절히 유지해요.</dd>
</dl>
