  data-title="잇몸병(치주질환): 칫솔질할 때 나는 피는 신호, 치은염과 치주염, 당뇨와 서로 악화시키는 관계"
  data-thumb="1년 1회|스케일링 보험 적용"
  data-summary="양치할 때 잇몸에서 피가 나거나 입냄새가 심해졌다면 잇몸병의 시작일 수 있어요. 치은염에서 치주염으로 넘어가는 과정, 통증 없이 진행되는 이유, 스케일링과 잇몸 치료, 치실·치간칫솔 쓰는 법, 흡연·당뇨·임신과의 관계, 이가 흔들리기 전에 챙길 것을 정리했어요."
  data-tags="잇몸병,치주염,치은염,스케일링,질병">
<p class="lead">칫솔에 피가 묻어 나와도 '세게 닦아서 그렇겠지' 하고 넘기기 쉬워요. 그런데 건강한 잇몸은 칫솔질에 피가 나지 않아요. 잇몸병은 아프지 않은 채 몇 년에 걸쳐 진행하다가, 이가 흔들리고 나서야 알아채는 경우가 많아요. 어른이 이를 잃는 가장 흔한 원인 중 하나인 만큼 일찍 챙길수록 좋아요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>칫솔질할 때 <strong>잇몸에서 피</strong>가 나면 잇몸 염증의 신호예요.</li>
<li><strong>치은염</strong>은 되돌릴 수 있지만, <strong>치주염</strong>으로 넘어가면 잇몸뼈가 녹아 회복이 어려워요.</li>
<li>칫솔만으로는 이 사이가 닦이지 않아요. <strong>치실이나 치간칫솔</strong>을 매일 써요.</li>
<li>만 19세 이상은 <strong>1년에 한 번 스케일링</strong>에 건강보험이 적용돼요.</li>
</ul></div>

<h2>치은염과 치주염</h2>
<div class="tbl"><table>
<thead><tr><th>단계</th><th>상태</th><th>되돌릴 수 있나</th></tr></thead>
<tbody>
<tr><td>치은염</td><td>잇몸 가장자리가 붉게 붓고 칫솔질에 피가 나요. 뼈는 아직 괜찮아요</td><td>제대로 닦고 스케일링하면 몇 주 안에 좋아져요</td></tr>
<tr><td>초기 치주염</td><td>잇몸과 이 사이에 틈(치주낭)이 깊어지고 뼈가 조금씩 녹아요</td><td>진행을 멈출 수 있지만 녹은 뼈는 대개 돌아오지 않아요</td></tr>
<tr><td>진행된 치주염</td><td>잇몸이 내려가 이가 길어 보이고, 고름, 흔들림, 씹을 때 통증</td><td>잇몸 수술이 필요하거나 이를 잃을 수 있어요</td></tr>
</tbody>
<caption>대한치주과학회 잇몸 건강 안내를 바탕으로 정리</caption></table></div>

<h2>왜 생길까</h2>
<p>이와 잇몸 경계에 남은 세균 막(치태)을 제때 닦아 내지 않으면 딱딱한 <strong>치석</strong>이 돼요. 치석은 칫솔로는 떨어지지 않고, 그 위에 세균이 더 쌓여 잇몸 염증을 일으켜요. 염증이 깊어지면 몸의 면역 반응이 이를 받치는 뼈까지 녹여요.</p>

<h2>위험을 높이는 것</h2>
<div class="tbl"><table>
<thead><tr><th>요인</th><th>설명</th></tr></thead>
<tbody>
<tr><td>흡연</td><td>잇몸병 위험을 크게 높이고, 피가 덜 나서 병을 숨겨요. 치료 효과도 떨어뜨려요</td></tr>
<tr><td>당뇨</td><td>혈당이 높으면 잇몸병이 심해지고, 잇몸병이 있으면 혈당 조절이 어려워져요. 서로 악화시켜요</td></tr>
<tr><td>임신</td><td>호르몬 변화로 잇몸이 잘 붓고 피가 나요. 임신 중 치과 검진과 스케일링은 대부분 가능해요</td></tr>
<tr><td>입마름</td><td>침이 줄게 하는 약, 나이. 세균이 쉽게 쌓여요</td></tr>
<tr><td>스트레스, 나이, 유전</td><td>면역 반응에 영향을 줘요</td></tr>
</tbody>
<caption>대한치주과학회, 미국 국립치과두개안면연구소(NIDCR) 자료를 바탕으로 정리</caption></table></div>
<p>잇몸병은 심혈관 질환, 조산 등과 관련이 있다는 연구도 있어요. 인과 관계는 아직 연구 중이지만, 입 건강이 온몸 건강과 이어져 있다는 신호로 볼 수 있어요.</p>

<h2>치과에서의 치료</h2>
<ul>
<li><strong>스케일링:</strong> 잇몸 위와 살짝 아래의 치석을 없애요. 잇몸병이 없어도 1년에 한 번 이상 권해요.</li>
<li><strong>치주 치료(치근활택술):</strong> 잇몸 속 깊이 붙은 치석과 염증 조직을 긁어 내고 뿌리 면을 매끄럽게 해요.</li>
<li><strong>잇몸 수술:</strong> 깊은 치주낭, 녹은 뼈를 다루기 위해 필요할 때 해요.</li>
<li>치료 뒤에는 <strong>3~6개월마다</strong> 정기 관리를 받아야 재발을 막을 수 있어요.</li>
</ul>
<p>스케일링 뒤 이가 시리거나 이 사이가 벌어져 보이는 것은 치석에 가려져 있던 부분이 드러난 것이에요. 대부분 시간이 지나면 괜찮아져요.</p>

<h2>매일 하는 관리</h2>
<ol>
<li><strong>하루 2번 이상, 2분</strong> 칫솔질. 칫솔을 잇몸과 이 경계에 45도로 대고 짧게 진동하듯 닦아요.</li>
<li><strong>치실이나 치간칫솔</strong>을 하루 한 번. 이 사이가 좁으면 치실, 넓으면 맞는 크기의 치간칫솔을 써요.</li>
<li>처음 치실을 쓰면 피가 날 수 있어요. 1~2주 꾸준히 하면 대개 멈춰요. 계속 나면 진료를 받아요.</li>
<li>불소 치약을 쓰고, 칫솔은 3개월마다 바꿔요.</li>
<li>국가건강검진의 <strong>구강검진</strong>도 챙겨요.</li>
</ol>

<div class="box warn"><span class="h">빨리 치과나 응급실에 가야 할 때</span>
<ul>
<li>잇몸에 고름이 차고 <strong>얼굴이나 턱 아래가 붓고 열이 나요.</strong></li>
<li>붓기 때문에 입을 벌리거나 삼키기, 숨쉬기가 어려워요.</li>
<li>잇몸 출혈이 잘 멈추지 않고 몸 여기저기에 멍이 들어요. 혈액 질환일 수 있어요.</li>
</ul></div>

<div class="box"><span class="h">잇몸 건강 체크리스트</span>
<ol>
<li>칫솔질 때 피 나는지 확인</li>
<li>치실·치간칫솔 하루 한 번</li>
<li>1년에 한 번 이상 스케일링</li>
<li>금연</li>
<li>당뇨가 있다면 치과 정기 방문</li>
<li>잇몸 붓고 고름·흔들림은 바로 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>잇몸약을 먹으면 좋아지나요?</dt>
<dd>잇몸 영양제나 약은 치석을 없애지 못해요. 스케일링과 매일의 닦기가 치료의 기본이에요.</dd>
<dt>스케일링을 자주 하면 이가 깎이나요?</dt>
<dd>스케일링은 치석을 떼어 내는 것이라 이를 깎지 않아요. 적절한 간격으로 받으면 안전해요.</dd>
<dt>잇몸병도 옮나요?</dt>
<dd>잇몸병을 일으키는 세균이 침으로 옮을 수는 있지만, 병이 생기는 데는 각자의 닦기 습관과 몸 상태가 더 중요해요.</dd>
</dl>
