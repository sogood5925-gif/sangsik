  data-title="전기 안전: 멀티탭 과부하, 먼지 쌓인 플러그, 누전차단기 점검까지"
  data-thumb="16A|멀티탭 정격 예"
  data-summary="전기 화재의 상당수는 멀티탭과 콘센트, 전선에서 시작돼요. 멀티탭 용량 계산법, 전기히터와 드라이어를 멀티탭에 꽂으면 안 되는 이유, 먼지가 불을 내는 트래킹 현상, 누전차단기 점검법, 감전 사고가 났을 때 대처를 정리했어요."
  data-tags="전기안전,멀티탭,누전,화재예방,생활정보">
<p class="lead">멀티탭 하나에 전기히터, 전기포트, 휴대폰 충전기를 모두 꽂아 쓰는 모습은 흔해요. 멀티탭이 따뜻해지는 건 "용량이 넘쳤다"는 신호예요. 전기 화재는 예고 없이 오는 것처럼 보이지만, 대부분 이런 작은 신호가 먼저 나타나요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>멀티탭에 꽂은 기기의 <strong>소비전력 합</strong>이 멀티탭 정격 용량을 넘지 않게 해요.</li>
<li>전기히터, 헤어드라이어, 전기포트처럼 <strong>열을 내는 가전은 벽 콘센트에 직접</strong> 꽂아요.</li>
<li>오래 꽂아 둔 플러그의 <strong>먼지</strong>는 불꽃을 만들 수 있어요(트래킹).</li>
<li>누전차단기의 <strong>시험 버튼</strong>을 한 달에 한 번 눌러 봐요.</li>
</ul></div>

<h2>멀티탭 용량 계산법</h2>
<p>멀티탭에는 '250V 16A' 같은 정격이 적혀 있어요. 가정용 전압(220V)에 전류를 곱하면 쓸 수 있는 최대 전력이 나와요.</p>
<ul>
<li>16A 멀티탭: 220V × 16A = 약 <strong>3,500W</strong></li>
<li>10A 멀티탭: 220V × 10A = 약 <strong>2,200W</strong></li>
</ul>
<p>꽂은 기기의 소비전력(제품 뒷면이나 설명서에 'W'로 표시)을 더해서 이 값보다 여유 있게 낮게 쓰는 게 좋아요. 정격의 80% 이하로 쓰기를 권하는 안내도 많아요.</p>
<div class="tbl"><table>
<thead><tr><th>가전</th><th class="num">소비전력(대략)</th></tr></thead>
<tbody>
<tr><td>전기히터, 온풍기</td><td class="num">1,000~2,000W</td></tr>
<tr><td>헤어드라이어</td><td class="num">1,000~2,000W</td></tr>
<tr><td>전기포트</td><td class="num">1,500~2,000W</td></tr>
<tr><td>에어프라이어</td><td class="num">1,300~1,800W</td></tr>
<tr><td>전자레인지</td><td class="num">1,000~1,500W</td></tr>
<tr><td>전기장판</td><td class="num">100~250W</td></tr>
<tr><td>노트북 충전기, TV</td><td class="num">수십~200W</td></tr>
</tbody>
<caption>일반 가정용 제품의 대략적인 범위. 실제 값은 제품 표시를 확인해요</caption></table></div>
<p>표를 보면 전기히터와 전기포트 두 개만 함께 꽂아도 16A 멀티탭 한계에 가까워져요.</p>

<h2>멀티탭 안전하게 쓰기</h2>
<ul>
<li><strong>KC 인증</strong> 표시가 있는 제품을 써요.</li>
<li>멀티탭에 멀티탭을 연결하는 <strong>문어발 연결</strong>을 하지 않아요.</li>
<li>개별 스위치와 과부하 차단 기능이 있는 제품이 좋아요.</li>
<li>전선을 <strong>둘둘 감거나 묶은 채</strong> 쓰지 않아요. 열이 빠져나가지 못해 피복이 녹을 수 있어요.</li>
<li>전선을 카펫, 이불, 가구 밑에 깔지 않아요. 눌리고 꺾여 속 선이 끊어질 수 있어요.</li>
<li>물 가까운 곳(싱크대, 욕실 앞)에 멀티탭을 두지 않아요.</li>
</ul>

<h2>먼지가 불을 내는 트래킹 현상</h2>
<p>냉장고, 세탁기, TV 뒤처럼 플러그를 오래 꽂아 두는 곳에는 먼지가 쌓여요. 여기에 습기가 더해지면 플러그 두 핀 사이로 <strong>전기가 조금씩 새면서 불꽃</strong>이 생기고, 먼지에 불이 붙을 수 있어요. 이를 트래킹 현상이라고 해요.</p>
<ul>
<li>몇 달에 한 번 플러그를 뽑아 마른 천으로 먼지를 닦아요.</li>
<li>안 쓰는 콘센트 구멍에는 안전 덮개를 끼워요.</li>
<li>플러그 핀이 검게 그을렸거나 콘센트가 변색됐다면 바꿔요.</li>
</ul>

<div class="box warn"><span class="h">바로 사용을 멈춰야 하는 신호</span>
<ul>
<li>멀티탭, 플러그, 전선이 <strong>손으로 만지기 뜨거워요.</strong></li>
<li>타는 냄새나 플라스틱 녹는 냄새가 나요.</li>
<li>콘센트에서 <strong>지지직 소리</strong>나 불꽃이 보여요.</li>
<li>플러그를 꽂으면 헐겁게 흔들려요.</li>
<li>전선 피복이 갈라지거나 속 선이 보여요.</li>
</ul></div>

<h2>누전차단기 점검</h2>
<p>분전함의 누전차단기는 전기가 새면 자동으로 전기를 끊어 감전과 화재를 막아요. 제대로 작동하는지 가끔 확인해요.</p>
<ol>
<li>분전함을 열고 누전차단기의 <strong>시험 버튼</strong>(보통 빨간색이나 초록색)을 눌러요.</li>
<li>스위치가 내려가면 정상이에요. 다시 올려요.</li>
<li>버튼을 눌러도 내려가지 않으면 고장일 수 있어요. 전기 기사에게 점검을 받아요.</li>
</ol>
<p>차단기가 자꾸 떨어지면 특정 가전이나 배선에서 누전이 생겼을 수 있어요. 가전 플러그를 모두 뽑고 차단기를 올린 뒤 하나씩 꽂으면서 원인을 찾을 수 있어요. 원인을 모르겠으면 전문가에게 맡겨요.</p>

<h2>물과 전기</h2>
<ul>
<li>젖은 손으로 플러그를 만지지 않아요.</li>
<li>욕실에서 헤어드라이어, 고데기를 쓸 때 물이 튀지 않게 조심해요.</li>
<li>침수된 가전은 말랐더라도 점검받기 전까지 쓰지 않아요.</li>
<li>장마철에는 베란다와 실외기 주변 콘센트를 점검해요.</li>
</ul>

<h2>겨울철 난방 가전</h2>
<ul>
<li>전기히터 주변 1m 안에 빨래, 커튼, 이불을 두지 않아요.</li>
<li>잠들거나 외출할 때는 끄고 플러그를 뽑아요.</li>
<li>전기장판은 접어서 쓰거나 보관하면 내부 열선이 손상돼요. 돌돌 말아 보관해요.</li>
<li>오래된 전기장판은 온도 조절기와 전선 상태를 확인하고, 이상하면 바꿔요.</li>
</ul>

<h2>계절별로 챙길 것</h2>
<div class="tbl"><table>
<thead><tr><th>계절</th><th>점검할 것</th></tr></thead>
<tbody>
<tr><td>여름</td><td>에어컨 전용 콘센트 사용, 실외기 주변 전선 상태, 장마철 누전</td></tr>
<tr><td>겨울</td><td>전기히터·온풍기 멀티탭 사용 금지, 전기장판 열선 손상, 난방기 주변 가연물</td></tr>
<tr><td>대청소·이사 때</td><td>가구 뒤 플러그 먼지, 눌린 전선, 헐거운 콘센트 교체</td></tr>
</tbody>
<caption>한국전기안전공사 계절별 전기안전 수칙을 바탕으로 정리</caption></table></div>

<h2>감전 사고가 났을 때</h2>
<div class="box warn"><span class="h">맨손으로 만지지 않아요</span>
<ol>
<li>차단기를 내리거나 플러그를 뽑아 <strong>전원부터 끊어요.</strong></li>
<li>전원을 끊을 수 없다면 마른 나무막대나 플라스틱처럼 전기가 안 통하는 물건으로 떼어 내요.</li>
<li>119에 신고해요.</li>
<li>의식이 없고 정상 호흡이 없으면 심폐소생술을 시작해요.</li>
</ol>
<p>겉보기에 화상이 작아도 몸속 손상이나 심장 리듬 이상이 생길 수 있어 진료를 받아요.</p></div>

<div class="box"><span class="h">우리 집 전기 점검 체크리스트</span>
<ol>
<li>멀티탭 정격과 꽂힌 기기 소비전력 확인</li>
<li>열 내는 가전은 벽 콘센트에 직접</li>
<li>냉장고·TV 뒤 플러그 먼지 닦기</li>
<li>뜨겁거나 변색된 멀티탭 교체</li>
<li>누전차단기 시험 버튼 월 1회 누르기</li>
<li>전선 묶음 풀고 가구 밑에서 빼기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>멀티탭도 수명이 있나요?</dt>
<dd>정해진 교체 주기는 없지만, 오래 쓰면 내부 접점이 헐거워지고 플라스틱이 약해져요. 플러그가 헐겁게 꽂히거나 변색·변형이 보이면 바꿔요.</dd>
<dt>안 쓰는 가전 플러그는 뽑는 게 좋나요?</dt>
<dd>대기전력을 줄이고 트래킹 화재 위험도 낮출 수 있어요. 자주 안 쓰는 가전은 뽑아 두거나 개별 스위치 멀티탭을 쓰면 편해요.</dd>
<dt>콘센트 한 구에 두 갈래 어댑터를 꽂아도 되나요?</dt>
<dd>콘센트 한 구의 용량을 넘기기 쉬워요. 소비전력이 큰 기기라면 콘센트 하나에 하나씩 꽂아요.</dd>
</dl>
