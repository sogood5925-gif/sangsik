  data-title="비타민 B6: 부족보다 과잉이 더 문제일 수 있는 비타민, 영양제 겹쳐 먹기 주의"
  data-thumb="100mg|하루 상한섭취량"
  data-summary="비타민 B6는 단백질 대사와 신경전달물질, 혈액 생성에 쓰여요. 권장섭취량과 많이 든 음식, 결핍이 생기기 쉬운 사람, 입덧 완화에 쓰이는 근거, 그리고 여러 영양제를 겹쳐 먹다 손발 저림 같은 신경 손상이 생길 수 있는 과잉 문제를 정리했어요."
  data-tags="비타민B6,피리독신,신경병증,입덧,영양소">
<p class="lead">비타민 B6는 피로 회복제, 종합비타민, 마그네슘 제품, 에너지 음료에까지 두루 들어 있어요. 음식으로 부족한 사람은 많지 않은데, 여러 제품을 함께 먹다 보면 모르는 사이에 많이 먹게 돼요. 비타민 B6는 과하게 오래 먹으면 <strong>손발 신경</strong>이 상할 수 있는 드문 수용성 비타민이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인 권장섭취량은 하루 <strong>남성 1.5mg, 여성 1.4mg</strong>이에요.</li>
<li><strong>닭고기, 생선, 감자, 바나나, 병아리콩</strong> 등 흔한 음식에 들어 있어요.</li>
<li>상한섭취량은 하루 <strong>100mg</strong>이지만, 그보다 낮은 용량을 오래 먹고 신경 증상이 생긴 보고도 있어요.</li>
<li>영양제를 여러 개 먹는다면 <strong>B6 함량을 모두 더해</strong> 확인해요.</li>
</ul></div>

<h2>비타민 B6가 하는 일</h2>
<ul>
<li>아미노산을 분해하고 새로 만드는 <strong>단백질 대사</strong>의 중심 조효소예요.</li>
<li>세로토닌, 도파민, GABA 같은 <strong>신경전달물질</strong>을 만드는 데 필요해요.</li>
<li>헤모글로빈을 만드는 데 쓰여요.</li>
<li>엽산, B12와 함께 <strong>호모시스테인</strong>을 분해해요.</li>
<li>면역 기능에도 관여해요.</li>
</ul>

<h2>부족해지기 쉬운 사람</h2>
<ul>
<li><strong>과음</strong>하는 사람</li>
<li>콩팥 기능이 떨어졌거나 <strong>투석</strong>을 받는 사람</li>
<li>류마티스 관절염, 염증성 장질환 같은 만성 염증이 있는 사람</li>
<li>결핵약 <strong>아이소니아지드</strong>, 일부 항경련제를 먹는 사람</li>
</ul>
<p>결핍 증상으로는 입꼬리·혀 염증, 피부염, 우울감, 혼란, 빈혈, 손발 저림 등이 있어요. 다른 B군 부족과 함께 오는 경우가 많아요.</p>

<h2>과잉: 손발 저림을 조심해요</h2>
<div class="box warn"><span class="h">고용량을 오래 먹으면</span>
<p>피리독신을 하루 수백 mg씩 몇 달 먹으면 <strong>손발 저림, 화끈거림, 감각 저하, 걸음이 불안정해지는 감각신경병증</strong>이 생길 수 있어요. 호주 등 일부 국가에서는 하루 수십 mg 이하의 비교적 낮은 용량에서도 신경 증상 사례가 보고되어, 제품에 경고 표시를 강화했어요.</p>
<ul>
<li>대부분 복용을 끊으면 몇 달에 걸쳐 좋아지지만, 일부는 오래 남아요.</li>
<li>손발 저림이 생기면 먹고 있는 모든 영양제의 B6 함량을 확인하고 의사와 상의해요.</li>
</ul></div>
<p>비타민 B6는 종합비타민, B군 복합제, 마그네슘·아연 복합제, 피로 회복 음료, 일부 탈모 영양제에 흔히 들어 있어요. 한 제품에 수십 mg씩 들어 있는 경우도 있으니 <strong>라벨의 함량을 합산</strong>해 보세요.</p>

<h2>입덧과 비타민 B6</h2>
<p>임신 초기 입덧에 비타민 B6가 도움이 된다는 연구가 있어, 산부인과 학회들은 가벼운~중간 정도의 입덧에 B6 단독 또는 독실아민과 함께 쓰는 방법을 소개해요. 용량과 방법은 산부인과에서 안내받아요. 물도 못 마실 만큼 구토가 심하면(임신오조) 수액 치료가 필요할 수 있어요.</p>

<h2>다른 쓰임새의 근거</h2>
<ul>
<li><strong>월경전증후군:</strong> 일부 연구가 있지만 근거가 약하고 일관되지 않아요.</li>
<li><strong>호모시스테인을 낮춰 심장병 예방:</strong> B6·엽산·B12 보충으로 호모시스테인은 내려가지만 심근경색 예방 효과는 확인되지 않았어요.</li>
<li><strong>손목터널증후군:</strong> 뚜렷한 효과가 확인되지 않았어요.</li>
</ul>

<div class="box"><span class="h">비타민 B6 체크리스트</span>
<ol>
<li>닭고기·생선·감자·콩·바나나로 식사에서 채우기</li>
<li>먹는 영양제의 B6 함량 모두 더해 보기</li>
<li>장기 복용 제품은 권장량 수준으로</li>
<li>손발 저림 생기면 영양제 점검</li>
<li>투석·결핵약 복용 중이면 의사와 보충 상의</li>
<li>입덧 치료 용량은 산부인과 안내대로</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>수용성 비타민은 남으면 빠져나가니 괜찮지 않나요?</dt>
<dd>대부분의 수용성 비타민은 그렇지만, 비타민 B6는 고용량을 오래 먹으면 신경에 영향을 줄 수 있어요. 수용성이라고 해서 안전하다고 단정하지 않아요.</dd>
<dt>B6가 우울감에 도움이 되나요?</dt>
<dd>B6는 신경전달물질 합성에 필요하지만, 결핍이 없는 사람에게 보충제가 우울증을 좋아지게 한다는 근거는 약해요. 우울감이 2주 넘게 계속되면 전문가와 상담해요.</dd>
<dt>임신 중 종합비타민에 B6가 들어 있어요.</dt>
<dd>임신부용 종합비타민에는 보통 적정량이 들어 있어요. 입덧 약을 따로 처방받는다면 이미 먹는 제품도 함께 알려 총량을 확인받아요.</dd>
</dl>
