  data-title="산나물과 독초 구별: 곰취와 동의나물, 산마늘과 박새, 데쳐 먹어야 하는 나물"
  data-thumb="봄|독초 사고 많은 계절"
  data-summary="봄철 산나물을 뜯다 독초를 함께 캐서 먹는 사고가 해마다 일어나요. 모양이 비슷한 산나물과 독초 짝, 새순일 때 특히 헷갈리는 이유, 원추리·고사리·두릅처럼 반드시 데쳐 먹어야 하는 나물, 길가와 하천변 채취의 문제, 먹고 이상할 때 대처를 정리했어요."
  data-tags="산나물,독초,봄나물,식중독,생활정보">
<p class="lead">봄 산에서 뜯은 나물은 향이 진하고 반가워요. 그런데 막 올라온 새순은 잎이 다 펴지지 않고 꽃도 없어서, 나물과 독초가 거의 똑같아 보여요. 오랫동안 나물을 캐 온 사람도 실수할 수 있어요. 모르는 풀은 뜯지 않는 것이 가장 확실한 예방이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>확실히 아는 나물만 뜯고, <strong>조금이라도 헷갈리면 먹지 않아요.</strong></li>
<li>곰취와 동의나물, 산마늘과 박새·은방울꽃, 원추리와 여로처럼 <strong>닮은 짝</strong>을 알아 둬요.</li>
<li>원추리, 고사리, 두릅 같은 나물은 <strong>끓는 물에 데쳐</strong> 독성분을 줄인 뒤 먹어요.</li>
<li><strong>도로변·하천변</strong> 나물은 중금속과 농약 걱정이 있어요. 뜯지 않아요.</li>
</ul></div>

<h2>헷갈리기 쉬운 산나물과 독초</h2>
<div class="tbl"><table>
<thead><tr><th>산나물</th><th>닮은 독초</th><th>구별 포인트(참고용)</th></tr></thead>
<tbody>
<tr><td>곰취</td><td>동의나물</td><td>곰취 잎은 부드럽고 향이 나요. 동의나물 잎은 두껍고 윤기가 나며 향이 거의 없어요</td></tr>
<tr><td>산마늘(명이)</td><td>박새, 은방울꽃</td><td>산마늘은 마늘 냄새가 나요. 박새는 잎맥이 뚜렷한 주름 모양이고 냄새가 없어요</td></tr>
<tr><td>원추리</td><td>여로</td><td>여로는 잎에 세로 주름이 뚜렷하고 줄기 밑에 털 같은 섬유가 있어요</td></tr>
<tr><td>우산나물</td><td>삿갓나물</td><td>삿갓나물은 한 줄기 끝에 잎이 돌려나고 가운데에서 꽃대가 올라와요</td></tr>
<tr><td>참당귀</td><td>독미나리, 개구릿대 등</td><td>미나리과 식물은 서로 매우 비슷해 전문가도 조심해요</td></tr>
</tbody>
<caption>식품의약품안전처 봄철 독초 섭취 주의 안내, 산림청 국립수목원 자료를 바탕으로 정리. 구별 포인트는 참고일 뿐 이것만으로 판단하지 않아요</caption></table></div>
<p>특징을 알아도 새순, 그늘에서 자란 것, 뜯어서 섞어 담은 것은 구별이 더 어려워요. 한 봉지에 한 가지 나물만 담으면 섞여 들어가는 것을 줄일 수 있어요.</p>

<h2>데쳐 먹어야 하는 나물</h2>
<div class="tbl"><table>
<thead><tr><th>나물</th><th>이유</th><th>먹는 법</th></tr></thead>
<tbody>
<tr><td>원추리</td><td>자랄수록 독성분(콜히친)이 늘어요</td><td>어린순만 끓는 물에 충분히 데친 뒤 찬물에 2시간 이상 담가 먹어요</td></tr>
<tr><td>고사리</td><td>날것에 비타민 B1을 분해하는 성분 등이 있어요</td><td>삶아서 물에 우려낸 뒤 조리해요</td></tr>
<tr><td>두릅, 다래순, 옻순</td><td>식물 고유의 독성분이나 자극 성분</td><td>끓는 물에 데쳐 먹어요. 옻순은 옻 알레르기가 있으면 피해요</td></tr>
<tr><td>냉이, 달래, 돌나물, 참나물</td><td>대체로 생으로 먹을 수 있어요</td><td>흐르는 물에 여러 번 깨끗이 씻어요</td></tr>
</tbody>
<caption>식품의약품안전처, 봄나물 안전하게 먹는 방법을 바탕으로 정리</caption></table></div>
<p>데칠 때는 넉넉한 물에 넣고 뚜껑을 연 채 데쳐 독성분이 날아가게 해요. 데친 물은 다시 쓰지 않아요.</p>

<h2>어디서 뜯느냐도 중요해요</h2>
<ul>
<li><strong>도로변, 철길 주변</strong>은 자동차 배기가스와 먼지의 중금속이 쌓일 수 있어요.</li>
<li><strong>하천변, 공원, 과수원 근처</strong>는 농약이나 오염물이 닿을 수 있어요.</li>
<li>산에서 허가 없이 나물을 캐면 <strong>불법</strong>이 될 수 있어요. 국립공원, 사유림은 특히 조심해요.</li>
<li>뿌리째 캐지 않고 필요한 만큼만 따면 다음 해에도 자라요.</li>
</ul>

<h2>독초를 먹으면 나타나는 증상</h2>
<p>독초의 종류에 따라 다르지만 보통 먹고 30분~몇 시간 안에 <strong>구토, 설사, 복통, 어지러움</strong>이 생겨요. 일부 독초는 입안이 타는 듯하거나, 맥박이 느려지거나 불규칙해지고, 의식이 흐려질 수 있어요.</p>

<div class="box warn"><span class="h">나물을 먹고 이상하다면</span>
<ol>
<li>억지로 토하게 하지 말고 바로 <strong>119</strong>나 응급실에 연락해요.</li>
<li><strong>먹고 남은 나물과 조리한 음식</strong>을 챙겨 가요. 어떤 식물인지 알면 치료가 빨라져요.</li>
<li>함께 먹은 사람도 증상이 없더라도 진료를 받아요.</li>
<li>어지럽거나 맥박이 이상하면 혼자 움직이지 않아요.</li>
</ol></div>

<h2>시장에서 살 때</h2>
<ul>
<li>원산지와 판매자가 분명한 곳에서 사요.</li>
<li>한 묶음 안에 모양이 다른 풀이 섞여 있지 않은지 살펴요.</li>
<li>산에서 뜯어 팔거나 나눠 주는 나물은 조심해요.</li>
</ul>

<h2>나물 알레르기</h2>
<p>쑥, 두릅, 옻순처럼 향과 자극이 강한 나물은 드물게 입 주변 가려움, 두드러기를 일으킬 수 있어요. 꽃가루 알레르기가 있는 사람은 비슷한 식물 나물에 반응하기도 해요. 처음 먹는 나물은 조금만 먹어 봐요.</p>

<div class="box"><span class="h">봄나물 체크리스트</span>
<ol>
<li>확실히 아는 나물만, 헷갈리면 먹지 않기</li>
<li>한 봉지에 한 가지 나물만</li>
<li>원추리·고사리·두릅은 데쳐 먹기</li>
<li>도로변·하천변에서 뜯지 않기</li>
<li>허가 없는 산에서 캐지 않기</li>
<li>먹고 이상하면 남은 나물 챙겨 병원</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>독초도 익히면 괜찮아지나요?</dt>
<dd>대부분의 식물 독은 익혀도 충분히 없어지지 않아요. 원추리처럼 데쳐서 줄이는 것은 원래 먹는 나물의 이야기예요. 독초는 익혀도 먹지 않아요.</dd>
<dt>사진 인식 앱으로 확인하면 되지 않나요?</dt>
<dd>도움이 될 수는 있지만 새순이나 비슷한 종은 자주 틀려요. 먹을지 말지를 앱 결과에만 맡기지 않아요.</dd>
<dt>텃밭에서 기른 나물은 안전한가요?</dt>
<dd>심은 것을 확실히 안다면 안전해요. 다만 텃밭 가장자리에 저절로 자란 풀이 섞이지 않게 살펴요.</dd>
</dl>
