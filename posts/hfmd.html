  data-title="수족구병: 입안 물집 때문에 못 먹는 아이 돌보기, 등원 시기, 뇌수막염을 의심할 신호"
  data-thumb="1주|등원을 쉬는 기간"
  data-summary="수족구병은 여름철 어린이집과 유치원에서 빠르게 번지는 바이러스 질환이에요. 손·발·입의 물집과 열의 흐름, 입안이 아파 못 먹을 때 탈수를 막는 법, 해열제 사용, 등원과 가족 전파를 줄이는 방법, 드물게 생기는 뇌수막염·뇌염을 의심해야 할 신호를 정리했어요."
  data-tags="수족구병,엔테로바이러스,어린이감염병,탈수,질병">
<p class="lead">아이가 열이 나고 침을 흘리며 밥을 거부해요. 입안을 보니 하얗게 헐어 있고, 손바닥과 발바닥에 작은 물집이 올라와요. 수족구병은 대부분 일주일 안팎이면 저절로 좋아지지만, 입이 아파 못 먹는 며칠이 부모에게는 길게 느껴져요. 이 시기를 편하게 넘기는 방법과 병원에 가야 할 신호를 알아 둬요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>수족구병은 <strong>장바이러스(엔테로바이러스)</strong> 감염으로, 주로 5세 미만 아이에게 여름~가을에 유행해요.</li>
<li>가장 중요한 돌봄은 <strong>탈수를 막는 것</strong>이에요. 차갑고 부드러운 음식을 조금씩 자주 줘요.</li>
<li>증상이 시작되고 <strong>약 1주일</strong>, 물집이 딱지로 마를 때까지는 등원을 쉬어요.</li>
<li><strong>고열이 이어지거나, 처지고 구토하며, 경련·팔다리 힘 빠짐</strong>이 있으면 바로 응급 진료예요.</li>
</ul></div>

<h2>어떤 병일까</h2>
<p>콕사키바이러스 A16, 엔테로바이러스 71 등 여러 장바이러스가 원인이에요. 물집의 진물, 침, 콧물, 그리고 <strong>대변</strong>으로 옮아요. 대변으로는 증상이 좋아진 뒤에도 몇 주 동안 바이러스가 나올 수 있어요. 원인 바이러스가 여러 가지라서 한 번 앓아도 다시 걸릴 수 있어요.</p>

<h2>증상의 흐름</h2>
<div class="tbl"><table>
<thead><tr><th>시기</th><th>증상</th></tr></thead>
<tbody>
<tr><td>잠복기(3~7일)</td><td>증상 없음</td></tr>
<tr><td>1~2일째</td><td>열, 보챔, 식욕 저하, 목 아픔</td></tr>
<tr><td>2~3일째</td><td>입안(혀, 잇몸, 볼 안쪽) 궤양, 손바닥·발바닥·엉덩이에 붉은 반점과 물집</td></tr>
<tr><td>7~10일</td><td>대부분 회복. 몇 주 뒤 손발톱이 빠지기도 하는데 다시 자라요</td></tr>
</tbody>
<caption>질병관리청 수족구병 예방 수칙 및 국가건강정보포털을 바탕으로 정리</caption></table></div>

<h2>집에서 돌보기</h2>
<ul>
<li><strong>수분이 가장 중요해요.</strong> 물, 보리차, 우유, 경구 수분 보충액을 조금씩 자주 줘요.</li>
<li>입안이 아프므로 <strong>차갑고 부드러운 음식</strong>(식힌 죽, 두부, 요거트, 푸딩)이 좋아요. 뜨겁고 짜고 신 음식, 오렌지 주스는 따가워요.</li>
<li>빨대나 숟가락이 편한 아이도 있어요.</li>
<li>열과 통증에는 아이 몸무게에 맞춘 <strong>아세트아미노펜이나 이부프로펜</strong>을 써요. 아스피린은 어린이에게 쓰지 않아요.</li>
<li>물집은 터뜨리지 말고 깨끗하게 둬요.</li>
</ul>

<h2>탈수 신호</h2>
<div class="tbl"><table>
<thead><tr><th>살펴볼 것</th><th>탈수가 의심되는 모습</th></tr></thead>
<tbody>
<tr><td>소변</td><td>6~8시간 넘게 소변이 없거나 기저귀가 말라 있어요</td></tr>
<tr><td>입과 눈</td><td>입술과 혀가 마르고, 울어도 눈물이 적어요</td></tr>
<tr><td>기운</td><td>유난히 처지고 잠만 자려 해요</td></tr>
<tr><td>영아</td><td>숨구멍(대천문)이 움푹 들어가 보여요</td></tr>
</tbody>
<caption>대한소아청소년과학회 소아 탈수 안내를 바탕으로 정리</caption></table></div>
<p>이런 모습이면 수액 치료가 필요할 수 있어 병원에 가요.</p>

<div class="box warn"><span class="h">바로 응급 진료를 받아야 할 때</span>
<ul>
<li>열이 <strong>39°C 이상</strong>이거나 <strong>48시간 넘게</strong> 이어져요.</li>
<li><strong>구토를 반복</strong>하고, 몹시 처지거나 깨우기 어려워요.</li>
<li>목이 뻣뻣하거나 심한 두통을 호소해요.</li>
<li><strong>경련</strong>, 팔다리에 힘이 빠지거나 걸음이 비틀거려요.</li>
<li>자다가 깜짝 놀라며 몸을 떠는 일이 반복되거나, 숨이 가빠요.</li>
</ul>
<p>드물지만 엔테로바이러스 71 등은 뇌수막염, 뇌염, 심장·폐 합병증을 일으킬 수 있어요. 특히 생후 몇 개월 영아는 주의해요.</p></div>

<h2>등원과 가족 전파 줄이기</h2>
<ul>
<li>증상이 시작되고 <strong>약 1주일</strong>, 물집이 딱지로 모두 마를 때까지 어린이집·유치원을 쉬어요. 기관의 기준도 함께 확인해요.</li>
<li><strong>기저귀를 갈거나 화장실을 쓴 뒤</strong> 비누로 30초 이상 손을 씻어요. 대변으로 몇 주간 바이러스가 나올 수 있어요.</li>
<li>장난감, 문손잡이, 식탁은 세제로 닦고, 필요하면 희석한 염소계 표백제로 소독해요. 알코올은 이 바이러스에 효과가 약해요.</li>
<li>수건, 컵, 수저는 따로 써요.</li>
<li>어른도 걸릴 수 있어요. 임신부는 아이를 돌본 뒤 손 위생을 더 신경 써요.</li>
</ul>

<div class="box"><span class="h">수족구병 돌봄 체크리스트</span>
<ol>
<li>조금씩 자주 물 주기</li>
<li>차갑고 부드러운 음식</li>
<li>몸무게에 맞춘 해열제</li>
<li>소변 횟수로 탈수 확인</li>
<li>기저귀 간 뒤 비누로 손 씻기</li>
<li>처짐·구토·경련은 즉시 병원</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>수족구병 예방접종이 있나요?</dt>
<dd>국내에서 쓰는 예방접종은 없어요. 손 씻기와 소독, 아플 때 등원하지 않기가 가장 좋은 예방이에요.</dd>
<dt>형제가 있는데 같이 걸리나요?</dt>
<dd>가족 사이에 잘 옮아요. 식기와 수건을 따로 쓰고, 손 씻기를 철저히 하면 가능성을 줄일 수 있어요.</dd>
<dt>입안이 아파 하루 종일 못 먹었어요.</dt>
<dd>음식보다 물이 먼저예요. 조금씩이라도 마시면 괜찮지만, 거의 마시지 못하고 소변이 줄면 병원에 가요.</dd>
</dl>
