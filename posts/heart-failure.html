  data-title="심부전: 누우면 숨이 차고 다리가 붓는다면, 매일 체중을 재는 이유"
  data-thumb="2kg|며칠 새 늘면 신호"
  data-summary="심부전은 심장이 몸에 필요한 만큼 피를 보내지 못하는 상태예요. 숨참과 다리 부종 같은 증상, 박출률에 따른 종류, 여러 약을 함께 쓰는 치료 원칙, 매일 체중을 재고 소금을 조절하는 자기 관리, 입원이 필요한 악화 신호를 정리했어요."
  data-tags="심부전,숨참,부종,심장질환,질병">
<p class="lead">심부전은 심장이 멈췄다는 뜻이 아니라 '힘이 부친다'는 뜻이에요. 심장이 피를 충분히 짜내지 못하거나, 잘 늘어나지 못해 피를 채우지 못하면 폐와 다리에 물이 고이고 숨이 차요. 최근 치료가 크게 발전해, 약을 제대로 쓰고 생활을 관리하면 입원과 사망 위험을 많이 줄일 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>대표 증상은 <strong>숨참, 누우면 심해지는 숨참, 다리 부종, 쉽게 지침</strong>이에요.</li>
<li>심장의 짜내는 힘(박출률)에 따라 종류가 나뉘고, 치료도 달라져요.</li>
<li>박출률이 낮은 심부전은 <strong>여러 종류의 약을 함께</strong> 쓰는 것이 표준이에요.</li>
<li><strong>매일 아침 체중</strong>을 재서 며칠 새 2kg 가까이 늘면 병원에 연락해요.</li>
</ul></div>

<h2>심부전의 원인</h2>
<ul>
<li>심근경색 등 관상동맥 질환으로 심장 근육이 손상됐을 때</li>
<li>오래 조절되지 않은 <strong>고혈압</strong></li>
<li>판막 질환, 심근병증, 심방세동 같은 부정맥</li>
<li>당뇨, 비만, 과음, 일부 항암 치료</li>
</ul>

<h2>박출률에 따른 종류</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th class="num">좌심실 박출률</th><th>특징</th></tr></thead>
<tbody>
<tr><td>박출률 감소 심부전</td><td class="num">40% 이하</td><td>심장의 짜내는 힘이 약해졌어요. 치료 근거가 가장 많아요</td></tr>
<tr><td>박출률 경도 감소 심부전</td><td class="num">41~49%</td><td>중간 영역이에요</td></tr>
<tr><td>박출률 보존 심부전</td><td class="num">50% 이상</td><td>짜내는 힘은 괜찮지만 심장이 뻣뻣해 피를 잘 채우지 못해요. 고령, 여성, 고혈압, 비만에서 흔해요</td></tr>
</tbody>
<caption>대한심부전학회 심부전 진료지침, 유럽심장학회(ESC) 2021 심부전 지침을 바탕으로 정리</caption></table></div>
<p>박출률은 심장 초음파로 측정해요. 정상은 대략 50~70%예요.</p>

<h2>증상</h2>
<ul>
<li>걷거나 계단을 오를 때 <strong>숨이 차요.</strong></li>
<li>누우면 숨이 차서 <strong>베개를 여러 개 받치고</strong> 자거나, 자다가 숨이 차서 깨요.</li>
<li><strong>발목과 다리가 붓고</strong>, 누르면 자국이 남아요.</li>
<li>쉽게 지치고 기운이 없어요.</li>
<li>밤에 마른기침이 나거나, 식욕이 없고 배가 더부룩해요.</li>
<li>며칠 사이 체중이 늘어요(몸에 물이 고인 신호).</li>
</ul>
<div class="tbl"><table>
<thead><tr><th>단계</th><th>일상 활동과 증상(NYHA 분류)</th></tr></thead>
<tbody>
<tr><td>Ⅰ</td><td>일상 활동에서는 증상이 없어요</td></tr>
<tr><td>Ⅱ</td><td>일상 활동에서 약간 숨이 차고 피곤해요</td></tr>
<tr><td>Ⅲ</td><td>가벼운 활동에도 증상이 있어 활동이 크게 제한돼요</td></tr>
<tr><td>Ⅳ</td><td>쉬고 있을 때도 증상이 있어요</td></tr>
</tbody>
<caption>뉴욕심장협회(NYHA) 기능 분류를 바탕으로 정리</caption></table></div>

<h2>진단</h2>
<ul>
<li><strong>혈액 검사(BNP, NT-proBNP):</strong> 심장이 늘어나며 분비하는 물질로, 높으면 심부전 가능성이 커요.</li>
<li><strong>심장 초음파:</strong> 박출률, 판막, 심장 크기와 두께를 확인해요.</li>
<li>심전도, 흉부 엑스레이, 필요하면 관상동맥 검사를 해요.</li>
</ul>

<h2>치료</h2>
<p>박출률 감소 심부전은 아래 네 가지 계열의 약을 함께 쓰는 것이 국제 지침의 기본이에요. 각각 생존율을 높이고 입원을 줄인다는 근거가 있어요.</p>
<ul>
<li><strong>안지오텐신 수용체-네프릴리신 억제제</strong>(사쿠비트릴·발사르탄) 또는 ACE 억제제·안지오텐신 수용체 차단제</li>
<li><strong>베타차단제</strong>(비소프롤롤, 카르베딜롤 등)</li>
<li><strong>무기질코르티코이드 수용체 길항제</strong>(스피로노락톤 등)</li>
<li><strong>SGLT2 억제제</strong>(다파글리플로진, 엠파글리플로진): 당뇨가 없어도 효과가 있어요. 박출률이 보존된 심부전에서도 입원을 줄였어요.</li>
</ul>
<p>몸에 물이 고였을 때는 <strong>이뇨제</strong>로 부종과 숨참을 덜어요. 약은 적은 용량에서 시작해 몸 상태를 보며 늘려 가요. 어지럽거나 소변이 너무 많다고 스스로 끊지 말고 의사와 조절해요. 심장 기능이 많이 떨어지고 부정맥 위험이 높으면 삽입형 제세동기나 특수 심박조율기를 쓰기도 해요.</p>

<h2>자기 관리</h2>
<div class="box note"><span class="h">매일 아침 체중 재기</span>
<p>아침에 일어나 <strong>소변을 본 뒤, 같은 옷차림으로</strong> 체중을 재고 적어요. <strong>하루 1kg 이상, 또는 2~3일 사이 2kg 가까이</strong> 늘면 몸에 물이 고이고 있다는 신호예요. 증상이 심해지기 전에 병원에 연락하면 약 조절로 입원을 막을 수 있어요. 기준은 사람마다 다를 수 있으니 주치의가 알려 준 기준을 따라요.</p></div>
<ul>
<li><strong>소금:</strong> 짠 음식을 줄여요. 국물, 김치, 젓갈, 가공식품, 라면을 조심해요. 너무 엄격한 제한보다 꾸준히 싱겁게 먹는 게 중요해요.</li>
<li><strong>수분:</strong> 심한 심부전이나 혈액 나트륨이 낮은 사람은 물 섭취량 제한을 안내받기도 해요. 제한이 필요한지는 의사와 정해요.</li>
<li><strong>운동:</strong> 상태가 안정되면 걷기 같은 운동과 심장재활이 증상과 삶의 질을 좋게 해요.</li>
<li><strong>술과 담배:</strong> 끊는 게 좋아요.</li>
<li><strong>예방접종:</strong> 독감, 폐렴구균, 코로나19 접종을 챙겨요.</li>
<li><strong>약 조심:</strong> 이부프로펜 같은 소염진통제는 몸에 소금과 물을 붙잡아 심부전을 악화시킬 수 있어요. 감기약, 진통제는 약사와 상의해요.</li>
</ul>

<div class="box warn"><span class="h">바로 병원이나 119</span>
<ul>
<li>쉬고 있어도 숨이 차고, <strong>누울 수 없을 만큼</strong> 숨이 차요.</li>
<li>분홍색 거품 가래가 나와요.</li>
<li>가슴 통증, 실신, 심하게 빠르거나 불규칙한 맥박</li>
<li>입술이 파래지거나 의식이 흐려져요.</li>
</ul></div>

<div class="box"><span class="h">심부전 관리 체크리스트</span>
<ol>
<li>매일 아침 체중 재고 기록</li>
<li>며칠 새 2kg 가까이 늘면 연락</li>
<li>약은 빼먹지 않고, 스스로 끊지 않기</li>
<li>싱겁게 먹기, 수분 기준 확인</li>
<li>소염진통제는 약사와 상의</li>
<li>독감·폐렴구균 예방접종</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>심부전은 좋아질 수 있나요?</dt>
<dd>원인에 따라 달라요. 고혈압, 부정맥, 과음이 원인인 경우 원인을 치료하고 약을 꾸준히 쓰면 박출률이 회복되는 사람도 있어요. 좋아져도 약을 임의로 끊으면 다시 나빠질 수 있어요.</dd>
<dt>다리가 부으면 모두 심부전인가요?</dt>
<dd>아니에요. 오래 서 있거나, 하지정맥류, 콩팥·간 질환, 갑상선 질환, 일부 혈압약(칼슘채널차단제) 때문에도 부을 수 있어요. 숨참이 함께 있거나 한쪽 다리만 갑자기 붓고 아프면 진료를 받아요.</dd>
<dt>여행을 가도 되나요?</dt>
<dd>상태가 안정적이면 가능해요. 약을 넉넉히 챙기고, 짠 음식이 많은 여행지 식사를 조심하고, 체중계를 가져가거나 몸 상태를 매일 살펴요. 장거리 비행은 의사와 미리 상의해요.</dd>
</dl>
