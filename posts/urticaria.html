  data-title="두드러기: 급성과 만성의 차이, 원인을 못 찾는 경우가 많은 이유, 항히스타민제 쓰는 법"

  data-summary="두드러기는 피부가 모기 물린 듯 부풀었다가 몇 시간 안에 사라지는 일이 반복되는 병이에요. 급성과 만성의 구분, 음식·약·감염 같은 원인, 만성 두드러기 대부분에서 특정 원인이 없는 이유, 긁을수록 올라오는 피부묘기증, 항히스타민제 치료와 생활 관리, 응급 신호를 정리했어요."
  data-tags="두드러기,가려움,항히스타민제,혈관부종,질병">
<p class="lead">갑자기 몸 여기저기가 부풀어 오르고 참을 수 없이 가려운데, 몇 시간 지나면 흔적 없이 사라졌다가 다른 곳에 또 올라와요. 두드러기는 흔한 병이지만, 오래 이어지면 잠을 설치고 일상이 지치게 돼요. 원인을 찾지 못해도 조절할 수 있는 방법은 충분히 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>두드러기 하나하나는 보통 <strong>24시간 안에</strong> 사라져요. 한 자리에 오래 남으면 다른 병일 수 있어요.</li>
<li><strong>6주</strong> 안에 끝나면 급성, 6주 넘게 반복되면 만성이에요.</li>
<li>만성 두드러기는 <strong>대부분 특정 원인 없이</strong> 몸의 면역 반응으로 생겨요. 음식 탓인 경우는 드물어요.</li>
<li>치료의 기본은 <strong>졸음이 적은 항히스타민제</strong>를 꾸준히 먹는 거예요.</li>
</ul></div>

<h2>급성과 만성</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>기간</th><th>흔한 원인</th></tr></thead>
<tbody>
<tr><td>급성 두드러기</td><td>6주 미만</td><td>감기 같은 바이러스 감염(특히 어린이), 음식, 약(항생제, 소염진통제), 벌 쏘임</td></tr>
<tr><td>만성 자발성 두드러기</td><td>6주 이상, 이유 없이 반복</td><td>자가면역 반응 등. 특정 외부 원인을 찾지 못하는 경우가 대부분</td></tr>
<tr><td>만성 유도성 두드러기</td><td>6주 이상, 특정 자극에 반복</td><td>긁기·압력(피부묘기증), 추위, 땀·체온 상승(콜린성), 햇빛, 물</td></tr>
</tbody>
<caption>대한천식알레르기학회·대한피부과학회 두드러기 진료지침, EAACI/GA²LEN 등 국제 두드러기 지침(2022)을 바탕으로 정리</caption></table></div>

<h2>두드러기와 혈관부종</h2>
<p>두드러기는 피부 얕은 층이 부풀어 가려워요. 피부 깊은 층이 부으면 <strong>혈관부종</strong>이라고 하는데, 눈꺼풀, 입술, 손발이 두툼하게 붓고 가렵기보다 화끈거리거나 뻐근해요. 두 가지가 함께 오기도 해요. 두드러기 없이 혈관부종만 반복되면 혈압약 일부(ACE 억제제)나 유전성 혈관부종 같은 다른 원인을 확인해야 해요.</p>

<div class="box warn"><span class="h">바로 응급실에 가야 할 때</span>
<ul>
<li>두드러기와 함께 <strong>숨참, 쌕쌕거림, 목 조임, 목소리 변화</strong></li>
<li><strong>혀나 목 안이 붓는</strong> 느낌, 삼키기 어려움</li>
<li>어지러움, 쓰러짐, 심한 복통과 구토</li>
</ul>
<p>아나필락시스일 수 있어요. 자가주사가 있다면 바로 쓰고 119를 불러요.</p></div>

<h2>만성 두드러기, 원인을 못 찾는 이유</h2>
<p>만성 두드러기로 병원을 찾으면 '음식 알레르기 검사를 다 해 봐야 하지 않을까' 생각하기 쉬워요. 그런데 매일 먹는 음식이 원인이라면 먹을 때마다 바로 증상이 나타나야 해요. 만성 자발성 두드러기의 상당수는 <strong>몸의 면역이 스스로 피부 비만세포를 자극</strong>해서 생기는 것으로 알려져 있어요. 그래서 넓은 범위의 알레르기 검사나 무리한 식이 제한은 대개 도움이 되지 않아요. 의사는 증상에 따라 갑상선 검사 등 필요한 검사만 골라서 해요.</p>

<h2>치료</h2>
<div class="tbl"><table>
<thead><tr><th>단계</th><th>치료</th></tr></thead>
<tbody>
<tr><td>1단계</td><td>졸음이 적은 2세대 항히스타민제(세티리진, 레보세티리진, 펙소페나딘, 로라타딘, 빌라스틴 등)를 매일 규칙적으로</td></tr>
<tr><td>2단계</td><td>조절되지 않으면 의사가 항히스타민제 용량을 최대 4배까지 늘리기도 해요</td></tr>
<tr><td>3단계</td><td>그래도 조절되지 않으면 오말리주맙 같은 주사 치료</td></tr>
<tr><td>그 다음</td><td>사이클로스포린 등 면역 조절 약</td></tr>
<tr><td>잠깐만</td><td>심하게 악화될 때 짧은 기간 스테로이드. 오래 쓰지 않아요</td></tr>
</tbody>
<caption>EAACI/GA²LEN 등 국제 두드러기 지침(2022)을 바탕으로 정리. 용량 조절은 반드시 의사가 결정해요</caption></table></div>
<ul>
<li>증상이 있을 때만 먹기보다 <strong>꾸준히 먹을 때</strong> 조절이 더 잘 돼요.</li>
<li>만성 두드러기는 몇 달에서 몇 년에 걸쳐 저절로 좋아지는 경우가 많아요. 잘 조절되면 의사와 약을 천천히 줄여 봐요.</li>
</ul>

<h2>악화시키는 것 줄이기</h2>
<ul>
<li><strong>비스테로이드 소염진통제</strong>(아스피린, 이부프로펜 등)는 두드러기를 악화시킬 수 있어요. 진통제가 필요하면 의사·약사와 상의해요.</li>
<li><strong>술, 뜨거운 목욕, 사우나</strong>는 혈관을 넓혀 증상을 키울 수 있어요.</li>
<li>꽉 끼는 옷, 가방끈, 허리띠처럼 피부를 누르는 것</li>
<li>스트레스와 수면 부족</li>
<li>긁기: 긁을수록 부풀어요. 차가운 수건으로 식혀요.</li>
</ul>

<h2>증상 기록하기</h2>
<p>두드러기가 올라온 시각, 사진, 그 전에 먹은 것과 한 일(운동, 목욕, 약)을 몇 주 기록하면 유도성 두드러기나 특정 원인을 찾는 데 도움이 돼요. 두드러기는 병원에 도착하면 사라져 있는 경우가 많아서 <strong>사진</strong>이 특히 중요해요.</p>

<div class="box"><span class="h">두드러기 관리 체크리스트</span>
<ol>
<li>사진과 증상 일기 남기기</li>
<li>항히스타민제는 처방대로 꾸준히</li>
<li>소염진통제는 상의하고 먹기</li>
<li>술·뜨거운 목욕 줄이기</li>
<li>긁지 말고 차갑게 식히기</li>
<li>숨참·목 부기는 즉시 응급실</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>두드러기는 옮나요?</dt>
<dd>두드러기 자체는 옮지 않아요. 원인이 된 감기가 옮을 수는 있어요.</dd>
<dt>항히스타민제를 오래 먹어도 괜찮나요?</dt>
<dd>2세대 항히스타민제는 오래 먹어도 비교적 안전한 약으로 평가돼요. 졸음이 오거나 다른 약을 먹고 있다면 의사와 상의해요.</dd>
<dt>임신 중에 두드러기가 생겼어요.</dt>
<dd>임신 중에도 쓸 수 있는 항히스타민제가 있어요. 스스로 약을 고르지 말고 산부인과·피부과와 상의해요.</dd>
</dl>
