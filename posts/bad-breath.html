  data-title="입냄새와 구강 건조: 원인의 대부분은 입안에, 혀 닦기와 치간 청소부터"
  data-thumb="80~90%|입안이 원인인 비율"
  data-summary="입냄새의 대부분은 위장이 아니라 입안, 특히 혀 표면과 잇몸 사이의 세균에서 시작돼요. 입냄새의 원인과 스스로 확인하는 법, 혀 닦기·치실·스케일링의 효과, 약과 나이, 입으로 숨쉬기로 생기는 입마름 관리, 입냄새로 알 수 있는 몸의 병을 정리했어요."
  data-tags="입냄새,구강건조,혀클리너,스케일링,건강상식">
<p class="lead">입냄새가 나면 위가 안 좋은 건 아닐까 걱정하지만, 실제로는 <strong>80~90%가 입안</strong>에서 시작돼요. 혀 뒤쪽의 하얀 설태와 잇몸 사이에 사는 세균이 단백질을 분해하며 황 냄새가 나는 가스를 만들어요. 그래서 입냄새 관리는 향이 강한 가글보다 세균이 사는 곳을 청소하는 데서 시작해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>입냄새의 주된 원인은 <strong>혀의 설태, 잇몸병, 충치, 치아 사이 음식물</strong>이에요.</li>
<li>양치할 때 <strong>혀 뒤쪽까지</strong> 닦고, <strong>치실이나 치간칫솔</strong>을 매일 써요.</li>
<li>침이 줄면 입냄새가 심해져요. <strong>물 자주 마시기, 약 점검, 코로 숨쉬기</strong>가 도움이 돼요.</li>
<li>입안 관리를 해도 계속되면 <strong>편도결석, 축농증, 당뇨</strong> 같은 다른 원인을 확인해요.</li>
</ul></div>

<h2>입냄새의 원인</h2>
<div class="tbl"><table>
<thead><tr><th>위치</th><th>원인</th></tr></thead>
<tbody>
<tr><td>입안(대부분)</td><td>혀의 설태, 잇몸병(치주염), 충치, 치아 사이 음식물, 오래된 보철물·틀니, 입마름</td></tr>
<tr><td>목과 코</td><td>편도결석, 만성 편도염, 축농증, 코 뒤로 넘어가는 콧물</td></tr>
<tr><td>음식과 습관</td><td>마늘·양파, 술, 담배, 오래 굶기(케톤 냄새)</td></tr>
<tr><td>몸의 병(드묾)</td><td>조절 안 되는 당뇨(과일·아세톤 냄새), 콩팥병(암모니아 냄새), 간 질환(쿰쿰한 냄새), 위식도 역류</td></tr>
</tbody>
<caption>대한구강보건협회, 미국치과의사협회(ADA) 구취 정보를 바탕으로 정리</caption></table></div>
<p>아침에 입냄새가 심한 건 자는 동안 침이 줄어서 생기는 자연스러운 현상이에요. 양치와 아침 식사 뒤 줄어든다면 걱정하지 않아도 돼요.</p>

<h2>스스로 확인하는 법</h2>
<ul>
<li>치실을 쓴 뒤 치실의 냄새를 맡아 봐요.</li>
<li>혀 뒤쪽을 거즈나 숟가락으로 살짝 긁어 냄새를 맡아 봐요.</li>
<li>손목 안쪽을 핥고 몇 초 뒤 냄새를 맡아 봐요.</li>
<li>가족이나 가까운 사람에게 솔직하게 물어봐요.</li>
</ul>
<p>입냄새가 없는데도 있다고 믿고 지나치게 걱정하는 경우도 있어요. 치과에서 측정해 볼 수 있어요.</p>

<h2>입안 관리</h2>
<ul>
<li><strong>혀 닦기:</strong> 혀 클리너나 칫솔로 혀 <strong>뒤쪽에서 앞쪽으로</strong> 몇 번 부드럽게 쓸어내려요. 세게 문지르면 혀가 상해요.</li>
<li><strong>치간 청소:</strong> 칫솔은 치아 사이를 닦지 못해요. 하루 한 번 치실이나 치간칫솔을 써요.</li>
<li><strong>스케일링:</strong> 치석은 잇몸병과 입냄새의 온상이에요. 성인은 1년에 한 번 치석 제거에 건강보험이 적용돼요.</li>
<li><strong>치과 치료:</strong> 충치와 잇몸병을 치료하고, 맞지 않는 보철물을 손봐요.</li>
<li><strong>틀니:</strong> 매일 빼서 닦고, 잘 때는 빼서 세정액에 담가요.</li>
<li><strong>가글:</strong> 일시적으로 냄새를 가려요. 알코올이 든 가글은 입을 더 마르게 할 수 있어 무알코올 제품이 나아요.</li>
</ul>

<h2>입마름(구강 건조)</h2>
<p>침은 세균을 씻어 내고 산을 중화하며 충치를 막아요. 침이 줄면 입냄새, 충치, 구내염, 삼키기 어려움, 맛 변화가 생겨요.</p>
<div class="tbl"><table>
<thead><tr><th>원인</th><th>예</th></tr></thead>
<tbody>
<tr><td>약</td><td>항히스타민제, 일부 항우울제·수면제, 이뇨제, 일부 혈압약, 과민성 방광 약, 파킨슨병 약</td></tr>
<tr><td>습관·환경</td><td>입으로 숨쉬기, 코골이, 물 부족, 건조한 실내, 술·담배·카페인</td></tr>
<tr><td>질환</td><td>쇼그렌 증후군, 당뇨, 머리·목 방사선 치료, 불안</td></tr>
</tbody></table></div>
<ul>
<li>물을 <strong>조금씩 자주</strong> 마셔요.</li>
<li><strong>무설탕 껌</strong>이나 자일리톨 사탕으로 침 분비를 늘려요.</li>
<li>잘 때 가습기를 쓰고, 코막힘이 있으면 치료해요.</li>
<li>입마름을 일으키는 약을 먹는다면 의사·약사와 다른 약으로 바꿀 수 있는지 상의해요. 스스로 끊지 않아요.</li>
<li>인공 침(스프레이, 젤)을 쓸 수 있어요.</li>
<li>입이 마르면 충치가 잘 생기니 불소 치약과 정기 검진을 챙겨요.</li>
</ul>

<div class="box warn"><span class="h">이럴 때는 진료를 받아요</span>
<ul>
<li>치과 치료와 입안 관리를 해도 입냄새가 계속돼요(이비인후과·내과).</li>
<li>입과 눈이 함께 몹시 마르고, 침샘이 부어요(쇼그렌 증후군 가능성).</li>
<li>물을 많이 마시고 소변이 잦으며 달콤한 입냄새가 나요(당뇨 확인).</li>
<li>2주 넘게 낫지 않는 입안 상처, 하얀·붉은 반점이 있어요.</li>
</ul></div>

<div class="box"><span class="h">입냄새 체크리스트</span>
<ol>
<li>양치할 때 혀 뒤쪽까지 부드럽게</li>
<li>하루 한 번 치실·치간칫솔</li>
<li>1년에 한 번 스케일링</li>
<li>물 자주, 무설탕 껌</li>
<li>무알코올 가글, 금연·절주</li>
<li>계속되면 편도·코·혈당 확인</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>위가 나빠서 입냄새가 나는 건가요?</dt>
<dd>위에서 입냄새가 올라오는 경우는 생각보다 드물어요. 역류가 심하거나 트림이 잦을 때 일시적으로 날 수 있지만, 대부분은 입안이나 목·코에서 원인을 찾을 수 있어요.</dd>
<dt>편도결석은 어떻게 하나요?</dt>
<dd>가글로 자주 헹구면 줄어들 수 있어요. 면봉이나 손가락으로 억지로 빼면 상처가 날 수 있어요. 자주 생기고 불편하면 이비인후과에서 제거하거나 치료를 상의해요.</dd>
<dt>다이어트 중 입냄새가 심해졌어요.</dt>
<dd>탄수화물을 크게 줄이거나 굶으면 지방이 분해되며 생기는 케톤 때문에 냄새가 날 수 있어요. 물을 충분히 마시고, 극단적인 식사 제한은 피해요.</dd>
</dl>
