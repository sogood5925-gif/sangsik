<p class="lead">조리도구에 대한 걱정은 대부분 "쓰는 방법"에서 갈려요. 같은 코팅 팬이라도 센 불에 빈 채로 달구느냐, 중간 불에 기름을 두르고 쓰느냐에 따라 전혀 달라요. 재질마다 피해야 할 한두 가지만 알면 충분해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>코팅 팬은 <strong>빈 채로 센 불에 달구지 않아요.</strong> 약 260°C를 넘으면 코팅이 분해되기 시작해요.</li>
<li>알루미늄 그릇에 <strong>짜거나 신 음식</strong>을 오래 담아 두지 않아요.</li>
<li>멜라민, 플라스틱 그릇은 <strong>전자레인지와 뜨거운 팬</strong>에 쓰지 않아요.</li>
<li>인증받은 제품을 쓰고, 코팅이 크게 벗겨지거나 변형되면 바꿔요.</li>
</ul></div>

<h2>재질별 한눈에 보기</h2>
<div class="tbl"><table>
<thead><tr><th>재질</th><th>좋은 점</th><th>주의할 점</th></tr></thead>
<tbody>
<tr><td>불소수지 코팅(흔히 '테플론')</td><td>잘 눌어붙지 않아 기름을 적게 써요</td><td>빈 팬 가열, 센 불, 금속 도구를 피해요</td></tr>
<tr><td>세라믹 코팅</td><td>고온에 비교적 강해요</td><td>코팅 수명이 짧은 편이에요</td></tr>
<tr><td>스테인리스</td><td>튼튼하고 반응성이 낮아요</td><td>잘 눌어붙어 예열과 기름 조절이 필요해요</td></tr>
<tr><td>무쇠(주철)</td><td>열을 오래 품고 오래 써요</td><td>녹 방지를 위해 기름을 먹여(시즈닝) 관리해요</td></tr>
<tr><td>알루미늄</td><td>가볍고 열이 빨리 전달돼요</td><td>산·염분이 많은 음식을 오래 담지 않아요</td></tr>
<tr><td>멜라민, 플라스틱</td><td>가볍고 잘 안 깨져요</td><td>전자레인지, 오븐, 뜨거운 기름을 피해요</td></tr>
</tbody></table></div>

<h2>코팅 프라이팬</h2>
<p>불소수지 코팅은 보통 조리 온도(볶기, 굽기)에서는 안정적이에요. 하지만 <strong>약 260°C를 넘으면 분해되기 시작</strong>하고, 더 뜨거워지면 연기가 나와요. 이 연기를 마시면 독감처럼 열과 오한이 나는 경우가 있고, 새처럼 작은 동물에게는 치명적일 수 있어요.</p>
<ul>
<li>빈 팬을 센 불에 올려 두고 자리를 뜨지 않아요. 빈 팬은 몇 분 만에 이 온도를 넘을 수 있어요.</li>
<li><strong>중간 불 이하</strong>로 쓰고, 기름이나 재료를 넣은 뒤 가열해요.</li>
<li>나무·실리콘 도구를 쓰고, 철 수세미로 문지르지 않아요.</li>
<li>조리할 때 후드를 켜요.</li>
</ul>
<p>예전에 코팅 제조 과정에 쓰이던 과불화옥탄산(PFOA)은 건강 우려로 퇴출되어 요즘 제품에는 거의 쓰이지 않아요.</p>
<h3>벗겨진 코팅 조각을 먹었다면</h3>
<p>작은 코팅 조각은 몸에 흡수되지 않고 대부분 그대로 배출돼요. 크게 걱정할 일은 아니에요. 다만 코팅이 벗겨진 팬은 음식이 눌어붙어 결국 더 센 불과 긁는 도구를 쓰게 되니 바꿀 때가 된 거예요.</p>

<h2>알루미늄 냄비와 호일</h2>
<ul>
<li>알루미늄은 <strong>산성(토마토, 식초, 김치)이나 염분이 많은 음식</strong>과 오래 닿으면 더 많이 녹아 나와요.</li>
<li>조리는 괜찮지만, 이런 음식을 알루미늄 냄비나 호일에 <strong>담아 보관하지는 않아요.</strong> 유리나 스테인리스 용기에 옮겨요.</li>
<li>양은 냄비를 철 수세미로 세게 문지르면 보호막이 벗겨져요.</li>
</ul>
<p>알루미늄과 치매의 관계는 오래전부터 이야기됐지만, 조리도구에서 나오는 양으로 치매 위험이 높아진다는 근거는 확인되지 않았어요. 다만 콩팥 기능이 크게 떨어진 사람은 알루미늄이 쌓일 수 있어 더 조심하는 게 좋아요.</p>

<div class="tbl"><table>
<thead><tr><th>음식</th><th>보관에 좋은 용기</th><th>피할 것</th></tr></thead>
<tbody>
<tr><td>김치, 장아찌, 절임류</td><td>유리, 옹기, 김치용 플라스틱(PP) 통</td><td>알루미늄 냄비·호일</td></tr>
<tr><td>토마토 소스, 식초 요리</td><td>유리, 스테인리스</td><td>알루미늄 용기</td></tr>
<tr><td>기름진 볶음·튀김</td><td>유리, 도자기</td><td>얇은 일회용 플라스틱</td></tr>
<tr><td>뜨거운 국물</td><td>스테인리스, 내열 유리</td><td>내열 온도 낮은 플라스틱</td></tr>
</tbody></table></div>

<h2>멜라민·플라스틱 그릇과 도구</h2>
<ul>
<li><strong>멜라민 그릇은 전자레인지에 넣지 않아요.</strong> 식품의약품안전처도 사용 금지를 안내해요. 고온에서 멜라민이 더 많이 나올 수 있어요.</li>
<li>플라스틱 뒤집개와 국자는 <strong>뜨거운 팬에 걸쳐 두지 않아요.</strong> 녹거나 변형되면 바꿔요.</li>
<li>'전자레인지 사용 가능' 표시가 없는 플라스틱 용기는 데우는 데 쓰지 않아요.</li>
<li>긁히고 뿌옇게 변한 플라스틱 용기는 세균이 끼기 쉬워 바꾸는 게 좋아요.</li>
</ul>

<h2>뚝배기와 도자기</h2>
<p>유약에 납 성분이 들어간 저가 제품이 문제가 된 적이 있어요. 뚝배기와 도자기는 식품용으로 표시되고 안전 기준을 통과한 제품을 사요. 처음 쓰기 전에는 쌀뜨물을 끓여 길들이면 금이 덜 가요.</p>

<h2>무쇠 팬 관리</h2>
<ol>
<li>쓰고 나면 뜨거운 물과 솔로 씻어요. 세제를 쓰더라도 오래 담가 두지 않아요.</li>
<li>물기를 불에 올려 완전히 날려요.</li>
<li>식용유를 얇게 발라 둬요.</li>
</ol>
<p>무쇠 팬으로 조리하면 음식에 철이 조금 더해져요. 철 과잉이 있는 사람(혈색소증 등)은 알아 두는 게 좋아요.</p>

<div class="box warn"><span class="h">이럴 때는 바꿔요</span>
<ul>
<li>코팅이 넓게 벗겨지거나 부풀어 올랐어요.</li>
<li>팬 바닥이 휘어 불에 고르게 닿지 않아요.</li>
<li>플라스틱 도구가 녹거나 끝이 갈라졌어요.</li>
<li>도마에 칼자국이 깊게 패여 씻어도 색이 남아요.</li>
</ul></div>

<div class="box"><span class="h">조리도구 체크리스트</span>
<ol>
<li>코팅 팬은 중간 불, 빈 팬 가열 금지</li>
<li>코팅 팬에는 나무·실리콘 도구</li>
<li>산성·짠 음식은 알루미늄에 보관하지 않기</li>
<li>멜라민 그릇은 전자레인지에 넣지 않기</li>
<li>조리할 때 후드 켜기</li>
<li>식품용 표시·인증 확인하고 사기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>코팅 팬은 얼마나 쓰면 바꿔야 하나요?</dt>
<dd>정해진 기간은 없어요. 쓰는 방법에 따라 1~2년 만에 벗겨지기도 하고 몇 년을 쓰기도 해요. 음식이 계속 눌어붙거나 코팅이 벗겨지면 바꿔요.</dd>
<dt>실리콘 조리도구는 안전한가요?</dt>
<dd>식품용 실리콘은 비교적 열에 강하고 안정적이에요. 제품에 적힌 내열 온도를 지키고, 끈적이거나 냄새가 배면 바꿔요.</dd>
<dt>종이호일과 알루미늄호일, 어느 쪽이 나아요?</dt>
<dd>종이호일(실리콘 코팅 종이)은 산성 음식에도 괜찮지만 불꽃에 직접 닿으면 타요. 알루미늄호일은 불에는 강하지만 산성·짠 음식과 오래 닿는 것을 피해요. 오븐이나 에어프라이어의 권장 사용법을 따라요.</dd>
</dl>
