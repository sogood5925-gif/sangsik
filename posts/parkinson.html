  data-title="파킨슨병: 떨림보다 먼저 오는 신호들, 약과 운동으로 오래 잘 지내기"
  data-thumb="4대 증상|떨림·느림·경직·균형"
  data-summary="파킨슨병은 손 떨림으로만 알려져 있지만, 몸이 느려지고 굳는 증상과 후각 저하, 잠꼬대와 몸부림, 변비 같은 신호가 먼저 오기도 해요. 주요 증상과 진단, 레보도파 등 치료 약과 부작용, 운동이 치료인 이유, 낙상과 삼킴 관리, 약으로 생기는 파킨슨 증상까지 정리했어요."
  data-tags="파킨슨병,떨림,도파민,운동치료,질병">
<p class="lead">파킨슨병은 뇌에서 도파민을 만드는 신경세포가 서서히 줄어드는 병이에요. 완치하는 약은 아직 없지만, 약으로 증상을 크게 줄일 수 있고, 꾸준한 운동이 진행을 늦추고 생활 기능을 지키는 데 도움이 돼요. 진단 뒤에도 오랫동안 일상을 이어 가는 사람이 많아요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>주요 증상은 <strong>가만히 있을 때 떨림, 움직임이 느려짐, 근육 경직, 균형 저하</strong>예요.</li>
<li><strong>후각 저하, 꿈을 행동으로 옮기는 잠버릇, 변비, 우울</strong>이 몇 년 먼저 오기도 해요.</li>
<li>치료의 중심은 <strong>레보도파 등 도파민을 보충하는 약</strong>과 <strong>규칙적인 운동</strong>이에요.</li>
<li>일부 위장약·정신과 약은 파킨슨 증상을 일으키거나 악화시킬 수 있어 새 약은 꼭 확인해요.</li>
</ul></div>

<h2>증상</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>증상</th></tr></thead>
<tbody>
<tr><td>운동 증상</td><td><strong>안정 시 떨림</strong>(쉬고 있을 때 한쪽 손이 떨리고, 움직이면 줄어요), <strong>서동</strong>(움직임이 느리고 작아져요. 글씨가 작아지고 걸음이 종종걸음이 돼요), <strong>경직</strong>(팔다리가 뻣뻣해요), 자세 불안정(쉽게 넘어져요)</td></tr>
<tr><td>비운동 증상</td><td>냄새를 잘 못 맡음, 변비, 렘수면 행동장애(꿈속 행동을 실제로 하며 소리 지르고 발길질), 우울·불안, 일어설 때 어지러움, 피로, 소변 문제, 기억력·집중력 저하</td></tr>
</tbody>
<caption>대한파킨슨병및이상운동질환학회 파킨슨병 정보를 바탕으로 정리</caption></table></div>
<ul>
<li>증상은 보통 <strong>한쪽</strong>에서 시작해 점점 양쪽으로 번져요.</li>
<li>얼굴 표정이 줄고, 목소리가 작아지고, 걸을 때 한쪽 팔을 덜 흔들게 돼요.</li>
<li>모든 떨림이 파킨슨병은 아니에요. 컵을 들거나 글씨를 쓸 때 심해지는 떨림은 본태성 떨림일 가능성이 커요.</li>
</ul>

<h2>진단</h2>
<p>파킨슨병은 혈액 검사나 한 가지 영상 검사로 확진하기보다, 신경과 전문의가 <strong>증상과 진찰 소견</strong>으로 진단해요. 뇌 MRI로 다른 원인을 확인하고, 필요하면 도파민 운반체 영상 검사(PET 등)를 해요. 약에 대한 반응도 진단에 도움이 돼요.</p>

<h2>치료 약</h2>
<div class="tbl"><table>
<thead><tr><th>약(성분)</th><th>특징</th><th>주의할 점</th></tr></thead>
<tbody>
<tr><td>레보도파(카르비도파·레보도파 등)</td><td>가장 효과가 좋은 약이에요</td><td>오래 쓰면 약효가 빨리 떨어지거나(약효 소진) 몸이 저절로 움직이는 이상운동이 생길 수 있어요. 단백질이 많은 식사와 가까이 먹으면 흡수가 줄 수 있어요</td></tr>
<tr><td>도파민 작용제(프라미펙솔, 로피니롤, 로티고틴 패치)</td><td>레보도파를 늦추거나 보완해요</td><td>졸음, 부종, 환각, <strong>충동조절장애</strong>(도박·쇼핑·폭식 등)가 생길 수 있어요. 가족이 변화를 알아채면 알려요</td></tr>
<tr><td>MAO-B 억제제(라사길린, 셀레길린, 사피나미드)</td><td>도파민 분해를 줄여요. 초기나 보조로 써요</td><td>일부 항우울제·진통제와 상호작용을 확인해요</td></tr>
<tr><td>COMT 억제제(엔타카폰, 오피카폰)</td><td>레보도파 효과를 길게 해요</td><td>소변 색이 진해질 수 있어요</td></tr>
<tr><td>아만타딘</td><td>이상운동을 줄이는 데 써요</td><td>어르신에게 혼동이 생길 수 있어요</td></tr>
</tbody>
<caption>대한파킨슨병및이상운동질환학회, 국제파킨슨병·이상운동질환학회(MDS) 근거 검토를 바탕으로 정리</caption></table></div>
<ul>
<li>약은 <strong>정해진 시간</strong>에 먹는 것이 중요해요. 입원하거나 수술할 때도 약 시간을 의료진에게 알려요.</li>
<li>약을 <strong>갑자기 끊지 않아요.</strong> 고열과 심한 경직이 오는 위험한 상태가 생길 수 있어요.</li>
<li>약으로 조절이 어려운 증상에는 <strong>뇌심부자극술</strong>이나 장으로 약을 계속 넣는 치료를 고려하기도 해요.</li>
</ul>

<h2>운동이 치료예요</h2>
<ul>
<li>걷기, 자전거, 수영, 춤, 태극권처럼 <strong>규칙적인 유산소·근력·균형 운동</strong>이 움직임과 균형, 기분을 좋게 하고 진행을 늦추는 데 도움이 된다는 연구가 많아요.</li>
<li><strong>크게, 힘차게</strong> 움직이는 연습(큰 걸음, 팔 크게 흔들기)이 작아지는 움직임을 되돌리는 데 좋아요.</li>
<li>목소리를 크게 내는 발성 연습이 말소리를 지키는 데 도움이 돼요.</li>
<li>물리치료, 작업치료, 언어치료를 함께 받으면 좋아요.</li>
</ul>

<h2>생활 관리</h2>
<ul>
<li><strong>낙상 예방:</strong> 집 안 문턱과 러그를 정리하고, 욕실에 손잡이를 달아요. 방향을 바꿀 때 천천히 돌아요.</li>
<li><strong>삼킴:</strong> 사레가 자주 들리면 삼킴 검사를 받아요. 흡인성 폐렴의 원인이 돼요.</li>
<li><strong>변비:</strong> 물, 식이섬유, 운동을 챙기고 필요하면 약을 써요.</li>
<li><strong>기립성 저혈압:</strong> 일어날 때 천천히, 물을 충분히 마셔요.</li>
<li><strong>우울과 불안:</strong> 흔한 증상이에요. 치료하면 좋아져요.</li>
<li>파킨슨병은 본인부담을 줄여 주는 <strong>산정특례</strong> 대상이에요. 등록 방법을 병원에서 안내받아요.</li>
</ul>

<div class="box warn"><span class="h">약이 만드는 파킨슨 증상</span>
<p>구역질·위장약 일부(메토클로프라미드, 레보설피리드 등)와 일부 항정신병약은 도파민을 막아 <strong>파킨슨병과 비슷한 증상</strong>을 일으키거나, 파킨슨병을 악화시킬 수 있어요. 특히 어르신이 이런 약을 먹은 뒤 몸이 굳고 느려졌다면 의사·약사와 상의해요. 약을 끊으면 좋아지는 경우가 많아요.</p></div>

<div class="box"><span class="h">파킨슨병 체크리스트</span>
<ol>
<li>한쪽 손 떨림, 느려짐이 있으면 신경과 진료</li>
<li>약은 정해진 시간에, 갑자기 끊지 않기</li>
<li>충동적 행동 변화는 가족이 알리기</li>
<li>매일 운동, 크게 움직이기</li>
<li>낙상·삼킴·변비 관리</li>
<li>새 약은 파킨슨병 알리고 확인</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>파킨슨병은 유전되나요?</dt>
<dd>대부분은 유전과 환경이 함께 작용한 결과이고, 부모에게서 그대로 물려받는 경우는 일부예요. 50세 이전에 발병했거나 가족 중 여러 명이 있다면 유전 상담을 고려해요.</dd>
<dt>레보도파는 늦게 시작하는 게 좋나요?</dt>
<dd>예전에는 늦추라고 했지만, 최근에는 증상이 생활에 불편을 준다면 필요한 만큼 쓰는 것을 권해요. 시작 시기와 용량은 나이와 증상에 맞춰 의사와 정해요.</dd>
<dt>치매가 함께 오나요?</dt>
<dd>병이 오래되면 기억력과 판단력이 떨어지는 경우가 있지만 모두에게 생기지는 않아요. 운동과 사회 활동, 혈관 위험 요인 관리가 도움이 될 수 있어요.</dd>
</dl>
