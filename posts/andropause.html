  data-title="남성 갱년기: 남성호르몬 검사는 아침에, 치료가 도움이 되는 사람과 조심할 점"
  data-thumb="아침|호르몬 검사 시간"
  data-summary="중년 이후 남성도 피로, 성욕 감소, 근육 감소, 뱃살 증가를 겪으며 남성호르몬 저하를 걱정해요. 나이에 따른 남성호르몬 변화, 진단 기준과 검사 시간, 호르몬을 떨어뜨리는 비만·수면무호흡 같은 원인, 테스토스테론 치료의 이득과 위험, 임신 계획이 있다면 피해야 하는 이유를 정리했어요."
  data-tags="남성갱년기,테스토스테론,남성호르몬,성기능,건강상식">
<p class="lead">남성은 여성처럼 호르몬이 갑자기 끊기지 않고, 30~40대 이후 조금씩 줄어요. 그래서 피로나 의욕 저하가 나이 탓인지, 스트레스 탓인지, 호르몬 탓인지 헷갈리기 쉬워요. 남성호르몬이 실제로 낮고 증상이 있는 사람은 치료로 도움을 받을 수 있지만, 모든 중년 남성에게 필요한 '회춘 치료'는 아니에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>진단은 <strong>증상</strong>과 함께 <strong>아침에 두 번 측정한 남성호르몬</strong>이 낮을 때 해요.</li>
<li><strong>비만, 당뇨, 수면무호흡, 과음</strong>이 호르몬을 떨어뜨려요. 이런 원인을 먼저 관리해요.</li>
<li>테스토스테론 치료는 <strong>성욕, 발기, 기분, 골밀도</strong>에 도움이 될 수 있어요.</li>
<li>치료는 <strong>정자 생성을 줄여</strong> 불임을 일으킬 수 있어요. 아이를 계획한다면 먼저 알려요.</li>
</ul></div>

<h2>나이와 남성호르몬</h2>
<p>테스토스테론은 보통 30~40대 이후 해마다 약 1%씩 줄어든다고 알려져 있어요. 대부분은 정상 범위 안에서 천천히 줄지만, 일부는 증상을 일으킬 만큼 낮아져요. 이를 <strong>후기 발현 남성 성선기능저하증</strong>, 흔히 남성 갱년기라고 불러요.</p>

<h2>흔한 증상</h2>
<div class="tbl"><table>
<thead><tr><th>분류</th><th>증상</th></tr></thead>
<tbody>
<tr><td>성 관련(가장 특징적)</td><td>성욕 감소, 아침 발기 감소, 발기부전</td></tr>
<tr><td>몸</td><td>피로, 근육량·근력 감소, 뱃살 증가, 골밀도 감소, 체모 감소, 열감</td></tr>
<tr><td>마음</td><td>의욕 저하, 우울감, 짜증, 집중력 저하</td></tr>
</tbody>
<caption>대한남성과학회, 유럽비뇨기과학회(EAU) 남성 성선기능저하증 지침을 바탕으로 정리</caption></table></div>
<p>피로와 의욕 저하는 우울증, 수면 부족, 갑상선 질환, 빈혈 등 다른 원인도 많아요. 성 관련 증상이 함께 있을 때 호르몬 저하 가능성이 커요.</p>

<h2>검사와 진단</h2>
<ul>
<li>테스토스테론은 <strong>아침에 가장 높고</strong> 오후에 떨어져요. 그래서 <strong>오전(보통 7~11시)</strong>에 공복으로 측정해요.</li>
<li>한 번 낮게 나왔다면 <strong>다른 날 한 번 더</strong> 측정해 확인해요.</li>
<li>총 테스토스테론이 대략 <strong>300~350ng/dL 미만</strong>이면 낮다고 봐요(학회마다 기준이 조금 달라요).</li>
<li>원인을 찾기 위해 뇌하수체 호르몬(LH, 프로락틴), 빈혈, 혈당, 전립선 수치(PSA) 등을 함께 검사해요.</li>
</ul>

<h2>호르몬을 떨어뜨리는 원인</h2>
<ul>
<li><strong>비만</strong>, 특히 뱃살: 지방이 테스토스테론을 여성호르몬으로 바꿔요.</li>
<li><strong>제2형 당뇨병</strong>, 대사증후군</li>
<li><strong>수면 부족, 수면무호흡</strong></li>
<li>과음, 만성 질환, 심한 스트레스</li>
<li>일부 약: 마약성 진통제, 스테로이드, 일부 정신과 약</li>
<li>근육을 키우려고 쓴 <strong>단백동화 스테로이드</strong>를 끊은 뒤</li>
</ul>
<p>과체중인 남성이 체중을 줄이면 테스토스테론이 올라간다는 연구가 많아요. 잠과 운동을 챙기는 것이 첫 번째 치료예요.</p>

<h2>테스토스테론 치료</h2>
<div class="tbl"><table>
<thead><tr><th>기대할 수 있는 이득</th><th>알아 둘 위험과 주의</th></tr></thead>
<tbody>
<tr><td>성욕, 성기능 개선</td><td><strong>정자 생성 감소, 불임</strong>(아이 계획이 있으면 쓰지 않아요)</td></tr>
<tr><td>기분과 활력의 소폭 개선</td><td>적혈구가 지나치게 늘어 피가 끈적해질 수 있어요(정기 혈액 검사)</td></tr>
<tr><td>골밀도 증가, 빈혈 개선</td><td>여드름, 유방 부풂, 수면무호흡 악화</td></tr>
<tr><td>근육량 소폭 증가</td><td>전립선 질환 확인 필요(PSA 정기 검사)</td></tr>
</tbody>
<caption>대한남성과학회, 미국비뇨기과학회(AUA) 테스토스테론 결핍 지침(2018), TRAVERSE 연구(NEJM 2023)를 바탕으로 정리</caption></table></div>
<ul>
<li>주사, 바르는 젤, 먹는 약 등이 있어요. 젤은 피부 접촉으로 가족(특히 아이, 임신부)에게 옮을 수 있어 바른 뒤 손을 씻고 옷으로 가려요.</li>
<li>심혈관 질환 위험이 높은 남성을 대상으로 한 대규모 연구(TRAVERSE)에서 테스토스테론 치료가 심혈관 사건을 늘리지 않았어요. 다만 심방세동, 혈전 등은 조금 늘어 개인별로 판단해요.</li>
<li>시작 후 3~6개월에 증상과 수치를 확인하고, 효과가 없으면 계속할지 다시 결정해요.</li>
<li>호르몬 수치가 정상인 남성의 노화 방지, 근육 키우기 목적으로는 권하지 않아요.</li>
</ul>

<div class="box warn"><span class="h">이런 경우는 치료 전에 꼭 상의해요</span>
<ul>
<li>아이를 가질 계획이 있어요.</li>
<li>전립선암이나 유방암 병력이 있어요.</li>
<li>적혈구 수치가 높거나, 치료하지 않은 심한 수면무호흡이 있어요.</li>
<li>최근 심근경색이나 뇌졸중이 있었어요.</li>
</ul></div>

<div class="box"><span class="h">남성 갱년기 체크리스트</span>
<ol>
<li>성욕·아침 발기 변화가 있으면 상담</li>
<li>남성호르몬은 오전 공복에, 두 번</li>
<li>체중·뱃살 줄이기, 수면무호흡 확인</li>
<li>과음 줄이고 근력 운동</li>
<li>치료 중엔 혈액·PSA 정기 검사</li>
<li>아이 계획 있으면 치료 전 알리기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>남성호르몬 영양제는 효과가 있나요?</dt>
<dd>'테스토스테론 부스터'로 팔리는 제품의 상당수는 호르몬을 의미 있게 올린다는 근거가 없어요. 결핍이 있다면 진단을 받고 효과가 확인된 치료를 상의해요.</dd>
<dt>발기부전이면 호르몬 치료를 받아야 하나요?</dt>
<dd>발기부전은 혈관, 당뇨, 약, 심리 등 원인이 다양해요. 호르몬이 낮을 때만 호르몬 치료가 도움이 되고, 대개는 발기부전 치료제가 먼저예요. 발기부전은 심혈관 질환의 조기 신호일 수 있어 혈압·혈당·콜레스테롤도 확인해요.</dd>
<dt>치료를 시작하면 평생 해야 하나요?</dt>
<dd>원인이 비만이나 수면무호흡처럼 되돌릴 수 있는 것이라면, 원인을 치료한 뒤 호르몬이 회복되기도 해요. 치료 기간은 의사와 상의해 정해요.</dd>
</dl>
