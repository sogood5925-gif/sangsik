  data-thumb="7%|포화지방 상한"
  data-summary="지방은 무조건 줄여야 할 영양소가 아니에요. 어떤 지방을 먹느냐가 중요해요. 지방의 종류와 몸에서 하는 일, 포화지방과 트랜스지방의 권고량, 무엇으로 바꿔야 심혈관에 좋은지, 코코넛 오일과 저지방 제품의 함정, 가공육, 식용유 고르는 법을 정리했어요."
  data-tags="지방,포화지방,트랜스지방,불포화지방,식용유">
<p class="lead">한때 지방은 비만과 심장병의 주범으로 몰렸어요. 그 결과 저지방 제품이 쏟아졌지만, 지방을 뺀 자리를 설탕과 정제 탄수화물이 채웠어요. 지금은 지방의 '양'보다 '종류'가 중요하다는 것이 분명해졌어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>지방은 하루 열량의 <strong>15~30%</strong>, 포화지방은 <strong>7% 미만</strong>, 트랜스지방은 <strong>1% 미만</strong>이 권장돼요.</li>
<li>포화지방을 <strong>불포화지방</strong>으로 바꾸면 심혈관 질환이 줄어요. 정제 탄수화물로 바꾸면 효과가 없어요.</li>
<li><strong>코코넛 오일</strong>은 포화지방이 매우 많아 LDL을 올려요.</li>
<li><strong>가공육</strong>은 국제암연구소가 정한 1군 발암물질이에요.</li>
</ul></div>

<h2>지방이 하는 일</h2>
<ul>
<li><strong>에너지:</strong> 1g에 9kcal로 가장 효율적인 에너지원이에요.</li>
<li><strong>세포막과 호르몬:</strong> 세포막의 재료가 되고, 성호르몬 등을 만드는 데 쓰여요.</li>
<li><strong>지용성 비타민 흡수:</strong> 비타민 A, D, E, K는 지방과 함께 먹어야 흡수돼요.</li>
<li><strong>필수지방산:</strong> 오메가6와 오메가3 일부는 몸에서 만들지 못해 음식으로 먹어야 해요.</li>
</ul>

<h2>지방의 종류</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>많은 식품</th><th>혈중 콜레스테롤에 미치는 영향</th></tr></thead>
<tbody>
<tr><td>포화지방</td><td>소·돼지고기 비계, 삼겹살, 버터, 크림, 치즈, 코코넛 오일, 팜유</td><td>LDL을 올려요</td></tr>
<tr><td>트랜스지방</td><td>부분경화유, 쇼트닝, 일부 마가린, 이를 쓴 과자·튀김</td><td>LDL은 올리고 HDL은 낮춰요. 가장 해로워요</td></tr>
<tr><td>단일불포화지방</td><td>올리브유, 카놀라유, 들기름 일부, 아보카도, 견과류</td><td>포화지방 대신 먹으면 LDL이 낮아져요</td></tr>
<tr><td>다중불포화지방 (오메가6)</td><td>콩기름, 옥수수유, 해바라기씨유, 참기름</td><td>포화지방 대신 먹으면 LDL이 낮아져요</td></tr>
<tr><td>다중불포화지방 (오메가3)</td><td>등푸른 생선, 들기름, 호두, 아마씨</td><td>중성지방을 낮추는 데 도움</td></tr>
</tbody></table></div>
<p>대부분의 식품에는 여러 지방이 섞여 있어요. 상온에서 <strong>굳는 지방</strong>(비계, 버터)은 포화지방이 많고, <strong>액체인 기름</strong>(올리브유, 콩기름)은 불포화지방이 많다고 기억하면 쉬워요. 예외는 코코넛 오일과 팜유예요. 식물성이지만 포화지방이 많아요.</p>

<h2>얼마나 먹어야 할까</h2>
<div class="tbl"><table>
<thead><tr><th>항목</th><th>권장 (성인)</th><th>하루 2,000kcal 기준</th></tr></thead>
<tbody>
<tr><td>총 지방</td><td>열량의 15~30%</td><td class="num">약 33~67g</td></tr>
<tr><td>포화지방</td><td>열량의 7% 미만</td><td class="num">약 15g 미만</td></tr>
<tr><td>트랜스지방</td><td>열량의 1% 미만</td><td class="num">약 2g 미만 (가능한 한 적게)</td></tr>
<tr><td>콜레스테롤</td><td>하루 300mg 미만 권고</td><td class="num">-</td></tr>
</tbody>
<caption>보건복지부·한국영양학회, 2020 한국인 영양소 섭취기준. 세계보건기구는 포화지방 10% 미만, 트랜스지방 1% 미만을 권고해요.</caption></table></div>
<p>삼겹살 150g에는 포화지방이 하루 권고량을 넘을 만큼 들어 있을 수 있어요. 한국인의 포화지방 섭취는 육류 소비가 늘면서 증가하는 추세예요.</p>

<h2>무엇으로 바꾸느냐가 중요하다</h2>
<p>포화지방을 줄였을 때의 효과는 <strong>그 자리를 무엇이 채우느냐</strong>에 따라 달라요. 미국심장협회는 여러 연구를 검토한 결과, 포화지방을 <strong>다중불포화지방</strong>으로 바꾸면 심혈관 질환이 약 30% 줄었다고 정리했어요. 반면 흰쌀, 흰 빵, 설탕 같은 <strong>정제 탄수화물</strong>로 바꾸면 이득이 거의 없었어요.</p>
<div class="box note"><span class="h">실천 예시</span>
<ul>
<li>삼겹살 대신 목살·안심, 닭가슴살, 생선</li>
<li>버터 대신 올리브유나 카놀라유로 조리</li>
<li>크림 파스타 대신 올리브유 파스타</li>
<li>과자 대신 견과류 한 줌</li>
<li>나물은 들기름·참기름을 적당히</li>
<li>고기는 기름을 떼어내고 굽기보다 삶거나 찌기</li>
</ul></div>

<h2>트랜스지방: 가능한 한 멀리</h2>
<p>트랜스지방은 주로 식물성 기름을 굳게 만드는 과정(부분 경화)에서 생겨요. 튀김을 바삭하게, 과자를 오래 보관하게 해서 많이 쓰였어요. 세계보건기구는 산업적으로 만든 트랜스지방을 식품에서 없애자는 목표를 세웠어요.</p>
<ul>
<li>국내 영양성분표에서 트랜스지방은 <strong>0.2g 미만이면 '0'</strong>으로 표시할 수 있어요.</li>
<li>원재료명에 <strong>부분경화유, 쇼트닝</strong>이 있다면 소량 들어 있을 수 있어요.</li>
<li>같은 기름으로 여러 번 튀긴 음식에도 조금 생길 수 있어요.</li>
</ul>

<h2>흔한 오해</h2>
<h3>코코넛 오일은 건강한 기름일까</h3>
<p>코코넛 오일은 포화지방이 80% 이상이에요. 미국심장협회는 코코넛 오일이 버터처럼 <strong>LDL을 올린다</strong>며 심장 건강을 위해 권하지 않는다고 밝혔어요.</p>
<h3>저지방 제품이면 괜찮을까</h3>
<p>저지방 요거트나 과자는 줄어든 맛을 설탕으로 채우는 경우가 많아요. 영양성분표에서 지방과 함께 <strong>당류</strong>를 확인해요.</p>
<h3>기름은 모두 살이 찔까</h3>
<p>모든 지방은 1g에 9kcal라 양은 조절해야 해요. 하지만 견과류와 올리브유를 적당히 먹는 지중해식 식단은 심혈관 질환을 줄이고 체중 증가와 뚜렷한 관련이 없었다는 연구들이 있어요.</p>

<h2>가공육과 붉은 고기</h2>
<p>국제암연구소는 햄, 소시지, 베이컨 같은 <strong>가공육을 1군 발암물질</strong>(대장암), 소·돼지고기 같은 <strong>붉은 고기를 2A군</strong>으로 분류했어요. 가공육을 매일 50g 먹으면 대장암 위험이 약 18% 높아진다는 분석이 있어요. 가공육은 가끔만, 붉은 고기는 양을 정해 먹고, 생선과 닭고기, 콩으로 번갈아 먹는 게 좋아요.</p>

<h2>식용유 고르고 쓰기</h2>
<div class="tbl"><table>
<thead><tr><th>용도</th><th>잘 맞는 기름</th></tr></thead>
<tbody>
<tr><td>샐러드, 무침</td><td>엑스트라버진 올리브유, 들기름, 참기름</td></tr>
<tr><td>볶음, 부침</td><td>카놀라유, 올리브유, 콩기름, 해바라기씨유</td></tr>
<tr><td>튀김</td><td>발연점이 높은 정제 기름 (카놀라유, 콩기름 등)</td></tr>
</tbody></table></div>
<ul>
<li>기름에서 연기가 나기 시작하면 성분이 변하고 유해물질이 생겨요. 불 조절에 신경 써요.</li>
<li>튀김 기름은 여러 번 재사용하지 않아요. 색이 짙어지고 거품이 사라지지 않으면 버려요.</li>
<li>들기름은 산패가 빨라 개봉 후 냉장 보관하고 빨리 먹어요.</li>
</ul>

<div class="box"><span class="h">지방 바꾸기 체크리스트</span>
<ol>
<li>고기는 기름 적은 부위로, 비계는 떼어내기</li>
<li>가공육은 일주일에 한두 번 이하로</li>
<li>버터·코코넛 오일 대신 식물성 기름</li>
<li>생선을 일주일에 두 번</li>
<li>간식은 견과류 한 줌</li>
<li>영양성분표에서 포화지방·트랜스지방 확인하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>계란 노른자의 콜레스테롤은 괜찮나요?</dt>
<dd>식품의 콜레스테롤이 혈중 LDL에 미치는 영향은 포화지방보다 작고 사람마다 차이가 커요. 건강한 사람은 하루 한 개 정도는 대체로 괜찮다고 봐요. LDL이 높거나 당뇨병이 있다면 의사와 상의해요.</dd>
<dt>오메가6는 염증을 일으키니 줄여야 하나요?</dt>
<dd>오메가6가 염증을 일으킨다는 주장이 있지만, 연구에서는 포화지방 대신 오메가6가 풍부한 기름을 먹을 때 심혈관 질환이 줄었어요. 오메가3를 함께 충분히 먹는 게 중요해요.</dd>
<dt>우유는 저지방이 더 좋은가요?</dt>
<dd>포화지방을 줄이려면 저지방 우유가 도움이 돼요. 다만 우유의 지방이 심혈관 질환에 미치는 영향은 연구마다 엇갈려서, 전체 식사에서 포화지방이 많지 않다면 일반 우유도 괜찮아요.</dd>
</dl>
