  data-title="위염과 소화성 궤양: 헬리코박터와 진통제가 두 주범, 검은 변은 응급"
  data-thumb="2대 원인|헬리코박터·소염제"
  data-summary="속쓰림과 명치 통증의 흔한 원인인 위염과 소화성 궤양을 정리했어요. 내시경 결과지의 위염 용어 읽는 법, 궤양의 두 가지 주요 원인인 헬리코박터균과 소염진통제, 제균 치료와 위산 억제제, 식습관의 역할, 피를 토하거나 검은 변을 보는 응급 신호를 담았어요."
  data-tags="위염,위궤양,십이지장궤양,헬리코박터,질병">
<p class="lead">건강검진 위내시경 결과지에는 '위축성 위염', '장상피화생', '미란성 위염' 같은 말이 자주 적혀 있어요. 대부분은 걱정할 병이라기보다 위 점막의 상태를 설명하는 말이에요. 반면 소화성 궤양은 출혈이나 천공을 일으킬 수 있어 원인을 찾아 제대로 치료해야 해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>소화성 궤양의 두 주요 원인은 <strong>헬리코박터 파일로리균</strong>과 <strong>소염진통제(아스피린 포함)</strong>예요.</li>
<li>헬리코박터가 있는 궤양은 <strong>제균 치료</strong>를 하면 재발이 크게 줄어요.</li>
<li>위산 억제제로 궤양이 잘 낫지만, 원인을 없애지 않으면 다시 생겨요.</li>
<li><strong>피를 토하거나 검은 변</strong>, 갑자기 배 전체가 판자처럼 딱딱하게 아프면 응급이에요.</li>
</ul></div>

<h2>위염 결과지 읽기</h2>
<div class="tbl"><table>
<thead><tr><th>용어</th><th>뜻</th><th>의미</th></tr></thead>
<tbody>
<tr><td>표재성·만성 위염</td><td>점막에 가벼운 염증</td><td>매우 흔해요. 증상이 없으면 치료가 필요 없는 경우가 많아요</td></tr>
<tr><td>미란성 위염</td><td>점막이 얕게 헐었어요</td><td>술, 진통제, 스트레스와 관련될 수 있어요. 증상이 있으면 약을 써요</td></tr>
<tr><td>위축성 위염</td><td>오랜 염증으로 점막이 얇아졌어요</td><td>나이, 헬리코박터와 관련 있어요. 위암 위험이 조금 높아 정기 내시경이 중요해요</td></tr>
<tr><td>장상피화생</td><td>위 점막이 장 점막처럼 바뀌었어요</td><td>위축성 위염 다음 단계예요. 정기 내시경으로 지켜봐요</td></tr>
</tbody>
<caption>대한소화기내시경학회, 대한상부위장관·헬리코박터학회 건강 정보를 바탕으로 정리</caption></table></div>
<p>내시경에서 보이는 위염 정도와 속쓰림 같은 증상은 잘 맞지 않는 경우가 많아요. 증상은 기능성 소화불량이나 역류성 식도염 때문일 수도 있어요.</p>

<h2>소화성 궤양이란</h2>
<p>위산과 소화효소가 위나 십이지장 벽을 깊이 헐어 낸 상처예요. 위에 생기면 위궤양, 십이지장에 생기면 십이지장궤양이라고 해요.</p>
<ul>
<li><strong>명치 통증, 쓰림</strong>이 가장 흔해요. 십이지장궤양은 빈속이나 새벽에 아프고 먹으면 나아지는 경우가 있고, 위궤양은 먹은 뒤 아프기도 해요.</li>
<li>더부룩함, 구역질, 식욕 저하</li>
<li>진통제로 생긴 궤양은 통증 없이 출혈로 처음 발견되기도 해요.</li>
</ul>

<h2>두 가지 주요 원인</h2>
<h3>헬리코박터 파일로리균</h3>
<p>위 점막에 사는 세균으로, 우리나라 성인에게 여전히 흔해요. 대부분 증상이 없지만 일부에서 궤양과 위축성 위염을 일으키고, 위암 위험을 높여요. 호기 검사, 내시경 조직 검사 등으로 확인해요.</p>
<h3>소염진통제</h3>
<p>이부프로펜, 나프록센 같은 비스테로이드 소염진통제와 <strong>저용량 아스피린</strong>은 위 점막을 보호하는 물질을 줄여 궤양을 일으킬 수 있어요. 나이가 많거나, 궤양을 앓은 적이 있거나, 스테로이드·항응고제를 함께 먹으면 위험이 더 커요.</p>

<h2>치료</h2>
<div class="tbl"><table>
<thead><tr><th>치료</th><th>내용</th></tr></thead>
<tbody>
<tr><td>위산 억제제</td><td>양성자펌프 억제제(오메프라졸, 란소프라졸 등)나 칼륨경쟁적 위산분비차단제(테고프라잔 등)를 몇 주 먹어 궤양을 아물게 해요</td></tr>
<tr><td>헬리코박터 제균 치료</td><td>위산 억제제와 항생제 2~3가지를 1~2주 함께 먹어요. <strong>빠짐없이 끝까지</strong> 먹는 것이 성공의 열쇠예요</td></tr>
<tr><td>제균 확인</td><td>치료가 끝나고 4주 이상 지나 호기 검사 등으로 균이 없어졌는지 확인해요</td></tr>
<tr><td>소염진통제 조절</td><td>가능하면 중단하거나 다른 진통제로 바꾸고, 꼭 필요하면 위 보호제를 함께 써요</td></tr>
</tbody>
<caption>대한상부위장관·헬리코박터학회, 헬리코박터 파일로리 감염의 진단과 치료 가이드라인(2020)을 바탕으로 정리</caption></table></div>
<ul>
<li>제균 치료 중에는 입맛 변화, 설사, 속 불편이 흔해요. 견디기 어려우면 끊지 말고 처방한 의사와 상의해요.</li>
<li>항응고제나 아스피린을 심장 때문에 먹고 있다면 <strong>스스로 끊지 말고</strong> 주치의와 조절해요.</li>
<li>위궤양은 암과 구별하기 위해 치료 뒤 내시경으로 아물었는지 확인하는 경우가 많아요.</li>
</ul>

<div class="box warn"><span class="h">응급 신호</span>
<ul>
<li><strong>피를 토하거나</strong> 커피 찌꺼기 같은 것을 토해요.</li>
<li><strong>짜장처럼 검고 끈적한 변</strong>을 봐요.</li>
<li>어지럽고 식은땀이 나며 쓰러질 것 같아요.</li>
<li>갑자기 <strong>배 전체가 칼로 찌르듯 아프고 딱딱해져요</strong>(천공 의심).</li>
</ul>
<p>위장관 출혈과 천공은 빠른 치료가 필요해요. 바로 119를 부르거나 응급실로 가요.</p></div>

<h2>음식과 생활</h2>
<ul>
<li>특정 음식이 궤양을 일으키지는 않지만, 먹고 증상이 심해지는 음식(매운 음식, 커피, 기름진 음식)은 줄여요.</li>
<li><strong>금연</strong>: 흡연은 궤양이 잘 낫지 않게 하고 재발을 늘려요.</li>
<li><strong>절주</strong>: 술은 점막을 직접 손상시켜요.</li>
<li>우유는 잠깐 속을 편하게 하지만 오히려 위산 분비를 자극할 수 있어 치료 효과는 없어요.</li>
<li>진통제가 필요하면 약사에게 위장 병력을 알리고 고르게 해요. 아세트아미노펜은 위 점막 부담이 적은 편이에요.</li>
</ul>

<div class="box"><span class="h">위 건강 체크리스트</span>
<ol>
<li>40세 이상 2년마다 위내시경(국가 위암검진)</li>
<li>궤양이면 헬리코박터 검사와 제균</li>
<li>제균 약은 빠짐없이, 끝나면 확인 검사</li>
<li>소염진통제는 필요할 때만, 짧게</li>
<li>금연·절주</li>
<li>피 토함·검은 변은 즉시 응급실</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>헬리코박터균은 가족에게 옮나요?</dt>
<dd>주로 어릴 때 가족 사이에서 옮는 것으로 알려져 있어요. 성인이 된 뒤 새로 감염되는 경우는 적어요. 찌개를 함께 떠먹는 것만으로 성인 가족에게 쉽게 옮는다는 근거는 약하지만, 개인 접시를 쓰는 습관은 위생에 도움이 돼요.</dd>
<dt>증상이 없는데 헬리코박터가 있으면 치료해야 하나요?</dt>
<dd>국내 지침은 궤양, 위 림프종, 조기 위암 치료 뒤에는 제균을 강하게 권하고, 위암 가족력이 있거나 위축성 위염이 있는 경우 등도 치료를 고려해요. 증상 없는 사람의 제균도 위암 예방 효과가 보고되고 있어 의사와 상의해 정해요.</dd>
<dt>위염에 좋다는 영양제를 먹어도 되나요?</dt>
<dd>일부 제품의 효과는 근거가 약하고, 원인 치료를 대신하지 못해요. 증상이 계속되면 내시경과 원인 확인이 먼저예요.</dd>
</dl>
