<p class="lead">갑자기 얼굴이 화끈 달아오르고 땀이 쏟아지거나, 밤마다 깨서 잠을 설치고, 이유 없이 마음이 가라앉는 날이 늘어요. 폐경 전후의 변화는 자연스러운 과정이지만, 참아야만 하는 것은 아니에요. 증상이 생활을 흔든다면 효과가 확인된 치료가 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>폐경은 월경이 <strong>12개월 동안 없을 때</strong> 확인하고, 우리나라 여성의 평균 폐경 나이는 약 <strong>50세</strong>예요.</li>
<li><strong>안면홍조와 야간 발한</strong>에 가장 효과적인 치료는 호르몬 치료예요.</li>
<li>호르몬 치료는 <strong>60세 이전 또는 폐경 10년 이내</strong>에 시작하면 이득이 위험보다 큰 경우가 많아요.</li>
<li>폐경 뒤에는 <strong>골다공증과 심혈관 질환</strong> 위험이 높아져 운동과 검진이 중요해요.</li>
</ul></div>

<h2>폐경과 갱년기</h2>
<p>난소 기능이 줄어 여성호르몬(에스트로겐)이 크게 떨어지면 월경이 멈춰요. 월경이 불규칙해지기 시작하는 <strong>폐경 이행기</strong>부터 폐경 후 몇 년까지를 흔히 갱년기라고 불러요. 증상은 보통 몇 년 이어지고, 일부는 10년 넘게 가기도 해요.</p>

<h2>흔한 증상</h2>
<div class="tbl"><table>
<thead><tr><th>분류</th><th>증상</th></tr></thead>
<tbody>
<tr><td>혈관운동 증상</td><td><strong>안면홍조</strong>(얼굴·가슴이 화끈), <strong>야간 발한</strong>, 두근거림</td></tr>
<tr><td>잠과 기분</td><td>잠들기 어렵고 자주 깸, 예민함, 불안, 우울감, 집중력 저하</td></tr>
<tr><td>비뇨생식기</td><td>질 건조, 성교통, 잦은 소변, 반복되는 방광염</td></tr>
<tr><td>몸</td><td>관절·근육 통증, 피부 건조, 체중과 뱃살 증가</td></tr>
<tr><td>장기적 변화</td><td>골밀도 감소, LDL 콜레스테롤 상승, 심혈관 위험 증가</td></tr>
</tbody>
<caption>대한폐경학회 폐경 호르몬 치료 권고, 북미폐경학회(NAMS) 2022 입장문을 바탕으로 정리</caption></table></div>
<p>불규칙한 출혈이 심하거나 폐경 뒤 다시 출혈이 있으면 갱년기 증상으로 넘기지 말고 산부인과 진료를 받아요.</p>

<h2>호르몬 치료</h2>
<ul>
<li>안면홍조와 야간 발한을 가장 크게 줄이고, 골밀도 감소를 막아요.</li>
<li>자궁이 있는 여성은 자궁내막을 보호하기 위해 <strong>에스트로겐과 프로게스토겐</strong>을 함께 써요. 자궁을 절제했다면 에스트로겐만 써요.</li>
<li>먹는 약, 붙이는 패치, 바르는 젤 등이 있어요. 피부로 쓰는 에스트로겐은 먹는 약보다 혈전 위험이 낮은 것으로 알려져 있어요.</li>
</ul>
<div class="tbl"><table>
<thead><tr><th>이득</th><th>위험</th></tr></thead>
<tbody>
<tr><td>안면홍조·야간 발한·수면 개선</td><td>정맥 혈전, 뇌졸중 위험 소폭 증가(특히 60세 이후 시작 시)</td></tr>
<tr><td>골다공증·골절 예방</td><td>에스트로겐+프로게스토겐을 오래 쓰면 유방암 위험 소폭 증가</td></tr>
<tr><td>질 건조·비뇨기 증상 개선</td><td>담낭 질환 위험 증가</td></tr>
</tbody>
<caption>여성건강연구(WHI) 장기 추적 결과와 대한폐경학회·북미폐경학회 권고를 바탕으로 정리</caption></table></div>
<p>한때 여성건강연구(WHI) 결과 때문에 호르몬 치료가 크게 줄었지만, 이후 분석에서 <strong>60세 이전이나 폐경 10년 이내</strong>에 시작한 건강한 여성은 이득이 위험보다 큰 경우가 많다고 정리됐어요. 유방암, 혈전, 뇌졸중 병력이 있거나 원인 모를 질 출혈이 있으면 쓰지 않아요. 치료 기간과 방법은 해마다 산부인과와 다시 점검해요.</p>

<h2>호르몬 치료가 어려울 때</h2>
<ul>
<li><strong>비호르몬 약:</strong> 일부 항우울제(저용량 파록세틴, 벤라팍신 등), 가바펜틴이 안면홍조를 줄여요. 최근에는 뇌의 체온 조절 신호에 작용하는 새로운 비호르몬 약도 나왔어요.</li>
<li><strong>질 건조:</strong> 질 보습제·윤활제를 쓰고, 필요하면 <strong>저용량 질 에스트로겐</strong>을 써요. 몸에 흡수되는 양이 아주 적어요.</li>
<li><strong>인지행동치료, 최면 요법:</strong> 안면홍조로 인한 불편과 수면에 도움이 된다는 근거가 있어요.</li>
</ul>

<h2>생활 관리</h2>
<ul>
<li>안면홍조를 부르는 <strong>뜨거운 음료, 매운 음식, 술</strong>을 살펴보고 줄여요. 옷은 얇게 여러 겹으로 입고 침실을 시원하게 해요.</li>
<li><strong>근력·체중 부하 운동</strong>(걷기, 계단, 근력 운동)으로 뼈와 근육을 지켜요.</li>
<li>칼슘과 비타민 D를 충분히 챙겨요.</li>
<li>금연, 절주, 체중과 뱃살 관리로 심혈관 위험을 낮춰요.</li>
<li>혈압, 혈당, 콜레스테롤 검사를 정기적으로 받아요.</li>
<li>국가건강검진에서 해당 나이의 여성은 <strong>골밀도 검사</strong>를 받을 수 있어요. 대상인지 확인해 꼭 받아요.</li>
</ul>

<h2>건강기능식품의 근거</h2>
<p>석류, 백수오, 승마(블랙코호시), 이소플라본 제품이 갱년기 영양제로 많이 팔려요. 일부 연구에서 증상이 조금 줄었지만 근거가 약하고 결과가 일관되지 않아요. 블랙코호시는 드물게 간 손상 사례가 보고됐어요. 먹는다면 효과를 2~3개월 지켜보고, 간 질환이 있거나 다른 약을 먹는다면 먼저 상의해요.</p>

<div class="box warn"><span class="h">진료가 필요한 신호</span>
<ul>
<li>폐경 후 <strong>다시 출혈</strong>이 있어요.</li>
<li>우울감이 2주 넘게 계속되거나 극단적인 생각이 들어요(109, 24시간 상담).</li>
<li>두근거림이 심하고 맥박이 불규칙해요.</li>
<li>안면홍조가 너무 심해 일상과 잠이 무너졌어요.</li>
</ul></div>

<div class="box"><span class="h">갱년기 체크리스트</span>
<ol>
<li>증상 일지 쓰기(홍조 횟수, 잠, 기분)</li>
<li>산부인과에서 치료 선택지 상담</li>
<li>호르몬 치료는 시작 시기·위험 요인 따져 결정</li>
<li>근력 운동과 칼슘·비타민 D</li>
<li>골밀도 검사 받기</li>
<li>혈압·혈당·콜레스테롤 정기 확인</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>호르몬 치료를 하면 유방암에 걸리나요?</dt>
<dd>에스트로겐과 프로게스토겐을 함께 몇 년 이상 쓰면 유방암 위험이 조금 올라가요. 절대적인 증가 폭은 작고, 음주나 비만이 주는 영향과 비슷하거나 작은 수준이라는 분석도 있어요. 개인의 위험 요인과 함께 판단해요.</dd>
<dt>갱년기가 오면 살이 찌는 건 어쩔 수 없나요?</dt>
<dd>호르몬 변화로 뱃살이 늘기 쉽고 근육이 줄어 기초대사량이 떨어져요. 근력 운동과 식사 조절로 충분히 관리할 수 있어요.</dd>
<dt>조기 폐경은 어떻게 하나요?</dt>
<dd>40세 이전 폐경은 뼈와 심혈관 건강을 위해 보통 자연 폐경 나이까지 호르몬 치료를 권해요. 산부인과에서 원인과 치료를 상담해요.</dd>
</dl>
