  data-title="비상용품 가방: 바로 들고 나갈 가방과 집에서 버틸 비축품, 가족마다 더할 것과 점검 주기"
  data-thumb="3일|버틸 물과 식량"
  data-summary="지진, 화재, 침수, 긴 정전처럼 갑자기 집을 떠나거나 며칠을 버텨야 하는 순간이 올 수 있어요. 바로 들고 나갈 비상 가방과 집에서 버틸 비축품의 차이, 꼭 넣어야 할 물건과 양, 아기·어르신·반려동물이 있는 집에서 더할 것, 서류와 연락처 준비, 6개월마다 점검하는 법을 정리했어요."
  data-tags="비상가방,재난대비,생존배낭,비상식량,생활정보">
<p class="lead">재난 문자를 받고 10분 안에 집을 나서야 한다면 무엇을 챙길 수 있을까요? 급할수록 휴대폰과 지갑만 들고 나오기 쉬워요. 평소에 가방 하나를 현관 가까이에 꾸려 두면, 그 순간의 선택을 미리 해 두는 셈이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>준비는 두 가지예요. <strong>바로 들고 나갈 비상 가방</strong>과 <strong>집에서 며칠 버틸 비축품</strong>.</li>
<li>물은 1인당 하루 <strong>약 3L 안팎</strong>, 식량과 함께 <strong>최소 3일분</strong>을 목표로 해요.</li>
<li>약, 안경, 아기용품처럼 <strong>우리 가족만 필요한 것</strong>이 가장 중요해요.</li>
<li><strong>6개월마다</strong> 유통기한과 건전지, 약을 점검해요.</li>
</ul></div>

<h2>두 가지 준비</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>언제</th><th>핵심</th></tr></thead>
<tbody>
<tr><td>비상 가방</td><td>화재, 침수, 지진 등으로 급히 대피할 때</td><td>한 사람이 메고 걸을 수 있는 무게. 현관 가까이에 둬요</td></tr>
<tr><td>집 비축품</td><td>정전, 단수, 폭설로 집에서 며칠 버틸 때</td><td>물, 식량, 조명, 위생용품을 넉넉히</td></tr>
<tr><td>차량·직장용 작은 가방</td><td>밖에서 발이 묶일 때</td><td>물, 간식, 보조배터리, 상비약, 편한 신발</td></tr>
</tbody>
<caption>행정안전부 비상대비 물품 안내, 미국 연방재난관리청(FEMA) Build A Kit을 바탕으로 정리</caption></table></div>

<h2>비상 가방에 넣을 것</h2>
<div class="tbl"><table>
<thead><tr><th>분류</th><th>물건</th></tr></thead>
<tbody>
<tr><td>물과 식량</td><td>생수(작은 병 여러 개), 바로 먹을 수 있는 비상식량(에너지바, 통조림·레토르트, 건빵 등)</td></tr>
<tr><td>빛과 소식</td><td>손전등, 여분 건전지, 휴대용 라디오, 보조배터리와 충전 케이블</td></tr>
<tr><td>건강</td><td>평소 먹는 약 1주일분, 복용 약 목록, 구급 용품, 마스크, 여분 안경</td></tr>
<tr><td>체온과 몸 보호</td><td>보온 담요(알루미늄 담요), 우의, 여벌 속옷과 양말, 장갑, 튼튼한 신발</td></tr>
<tr><td>위생</td><td>물티슈, 휴지, 생리용품, 칫솔, 비닐봉지</td></tr>
<tr><td>도구</td><td>호루라기, 다용도 칼, 테이프, 볼펜과 메모지</td></tr>
<tr><td>서류와 돈</td><td>신분증 사본, 가족 사진, 비상 연락처 종이, 소액 현금</td></tr>
</tbody>
<caption>행정안전부 국민재난안전포털 비상용품 목록을 바탕으로 정리</caption></table></div>
<p>휴대폰이 꺼지면 가족 번호를 모르는 경우가 많아요. <strong>종이에 적은 연락처</strong>를 꼭 넣어요. 가족이 흩어졌을 때 만날 장소도 적어 둬요.</p>

<h2>얼마나 준비할까</h2>
<ul>
<li><strong>물:</strong> 마실 물과 간단한 위생을 합쳐 1인당 하루 약 3L 안팎. 비상 가방에는 들고 걸을 수 있을 만큼만, 나머지는 집에 비축해요.</li>
<li><strong>식량:</strong> 조리하지 않고 먹을 수 있는 것 위주로 3일분. 짠 음식은 물을 더 찾게 만들어요.</li>
<li><strong>약:</strong> 최소 1주일분. 처방약은 의사와 상의해 조금 여유 있게 받아 두는 방법도 있어요.</li>
<li>가방 무게는 메고 30분 이상 걸을 수 있을 정도로 해요. 어른 몸무게의 10분의 1 안팎이 참고가 돼요.</li>
</ul>

<h2>가족마다 더할 것</h2>
<div class="box note"><span class="h">우리 가족 맞춤 목록</span>
<ul>
<li><strong>아기:</strong> 분유와 젖병(또는 액상 분유), 기저귀, 물티슈, 아기 옷, 작은 장난감</li>
<li><strong>어린이:</strong> 좋아하는 간식, 작은 놀잇감, 보호자 연락처를 적은 카드</li>
<li><strong>어르신:</strong> 약과 약 목록, 보청기 배터리, 틀니 용품, 지팡이, 기저귀</li>
<li><strong>만성질환자:</strong> 인슐린과 보관 용품, 혈당 측정기, 산소 관련 용품, 진료 기록 요약</li>
<li><strong>반려동물:</strong> 사료와 물, 목줄·이동장, 배변 봉투, 예방접종 기록, 사진</li>
<li><strong>장애가 있는 가족:</strong> 보조기기 예비 부품과 충전기, 의사소통 카드</li>
</ul></div>

<h2>집 비축품</h2>
<ul>
<li>생수 여러 묶음, 오래 보관할 수 있는 식품(통조림, 즉석밥, 라면, 견과류)</li>
<li>휴대용 가스레인지와 가스(환기가 되는 곳에서만 사용)</li>
<li>손전등·랜턴, 건전지, 보조배터리</li>
<li>휴지, 물티슈, 쓰레기봉투, 간이 화장실 봉투</li>
<li>평소 먹는 식품을 조금 넉넉히 사 두고, 먹은 만큼 다시 채우는 방식이 관리하기 쉬워요.</li>
</ul>

<div class="box warn"><span class="h">대피할 때 기억할 것</span>
<ul>
<li>가방보다 <strong>사람이 먼저</strong>예요. 불길이나 물이 다가오면 가방을 두고 나와요.</li>
<li>화재 대피 때는 엘리베이터를 타지 않아요.</li>
<li>나가기 전 여유가 있다면 가스 밸브를 잠그고 전기 차단기를 내려요.</li>
<li>대피소 위치는 '안전디딤돌' 앱이나 국민재난안전포털에서 미리 확인해 둬요.</li>
</ul></div>

<h2>6개월마다 점검</h2>
<p>설날과 추석처럼 1년에 두 번 날짜를 정해 두면 잊지 않아요.</p>
<ul>
<li>물과 식량의 유통기한 확인, 기한이 가까운 것은 먹고 새로 채우기</li>
<li>약의 사용 기한과 복용 약 변경 반영</li>
<li>손전등·라디오 작동, 건전지 교체, 보조배터리 충전</li>
<li>아이 옷 치수, 연락처와 만날 장소 갱신</li>
</ul>

<div class="box"><span class="h">비상 가방 체크리스트</span>
<ol>
<li>물·비상식량 3일분</li>
<li>손전등·라디오·보조배터리</li>
<li>약 1주일분과 약 목록</li>
<li>종이에 적은 연락처와 만날 장소</li>
<li>우리 가족만 필요한 물건</li>
<li>6개월마다 점검</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>파는 생존 가방을 사면 되지 않나요?</dt>
<dd>기본 물품을 한 번에 갖추기에는 편하지만, 약·안경·아기용품처럼 가족에게 꼭 필요한 것은 따로 넣어야 해요. 구성품을 직접 확인해요.</dd>
<dt>가방은 어디에 두는 게 좋나요?</dt>
<dd>현관 가까이, 가족 모두가 아는 곳에 둬요. 침실에는 손전등과 신발을 함께 두면 밤에 급할 때 좋아요.</dd>
<dt>아파트에 살아도 필요한가요?</dt>
<dd>아파트도 화재, 정전, 단수, 엘리베이터 멈춤이 생겨요. 고층일수록 며칠 버틸 비축품이 더 도움이 돼요.</dd>
</dl>
