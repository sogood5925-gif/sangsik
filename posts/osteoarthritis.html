<p class="lead">무릎이 아프면 계단을 피하고 걷기도 줄이게 되지요. 하지만 관절은 움직여야 연골에 영양이 가고, 주변 근육이 튼튼해야 관절에 걸리는 부담이 줄어요. 퇴행성 관절염 치료의 첫 단계는 약이 아니라 <strong>운동과 체중 관리</strong>예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>퇴행성 관절염은 <strong>연골과 관절 전체가 변하는</strong> 병으로, 무릎·엉덩이·손가락 끝마디에 흔해요.</li>
<li>치료의 기본은 <strong>근력 운동, 유산소 운동, 체중 감량</strong>이에요. 체중의 5%만 줄여도 통증이 줄어요.</li>
<li>약은 통증 조절이 목적이에요. 먹는 약은 가장 적은 양을 필요한 기간만 써요.</li>
<li>생활이 크게 불편하고 다른 치료로 안 되면 <strong>인공관절 수술</strong>을 고려해요.</li>
</ul></div>

<h2>퇴행성 관절염은 어떤 병일까</h2>
<p>관절 끝을 덮은 연골이 닳고, 그 아래 뼈가 단단해지거나 가장자리에 뼈가 자라나며(골극) 관절 모양이 변해요. 단순히 '닳는' 것만이 아니라 관절 전체의 조직이 함께 변하는 병이에요.</p>
<ul>
<li><strong>위험 요인:</strong> 나이, 여성, 비만, 관절 부상이나 수술 경험, 무릎을 많이 쓰는 일, 다리 모양(O자 다리), 가족력</li>
<li><strong>증상:</strong> 움직일 때 아프고 쉬면 나아지는 통증, 30분 이내의 짧은 아침 뻣뻣함, 관절에서 나는 소리, 붓기, 관절 변형</li>
</ul>
<p>엑스레이에서 관절염이 심해 보여도 통증이 적은 사람이 있고, 그 반대도 있어요. 치료는 사진보다 <strong>증상과 기능</strong>에 맞춰 정해요.</p>

<h2>운동이 치료예요</h2>
<div class="tbl"><table>
<thead><tr><th>운동</th><th>효과와 예</th></tr></thead>
<tbody>
<tr><td>근력 운동</td><td>허벅지 앞쪽(대퇴사두근)과 엉덩이 근육이 무릎 부담을 줄여요. 의자에 앉아 다리 펴기, 벽에 기대 살짝 앉기, 옆으로 누워 다리 들기</td></tr>
<tr><td>유산소 운동</td><td>걷기, 실내 자전거, 수영, 수중 걷기. 주 150분을 목표로 나눠서 해요</td></tr>
<tr><td>유연성·균형 운동</td><td>관절 가동 범위를 유지하고 넘어짐을 줄여요. 태극권, 요가 동작 일부</td></tr>
</tbody>
<caption>국제골관절염학회(OARSI) 2019 지침, 미국류마티스학회(ACR) 2019 지침을 바탕으로 정리</caption></table></div>
<ul>
<li>운동 중이나 직후에 약간 아픈 것은 괜찮아요. <strong>다음 날까지 통증이 더 심해지면</strong> 강도를 줄여요.</li>
<li>처음에는 짧게, 자주 하고 조금씩 늘려요.</li>
<li>무릎을 깊이 굽히는 쪼그려 앉기, 무릎 꿇기, 계단 많이 오르내리기는 통증이 심할 때 피해요.</li>
<li>물리치료사나 운동 프로그램의 도움을 받으면 꾸준히 하기 쉬워요.</li>
</ul>

<h2>체중 관리</h2>
<p>걸을 때 무릎에는 체중의 몇 배가 실려요. 과체중이라면 <strong>체중의 5~10%</strong>만 줄여도 통증과 기능이 좋아진다는 연구가 많아요. 식사 조절과 운동을 함께 해요.</p>

<h2>통증 약</h2>
<ul>
<li><strong>바르는 소염진통제</strong>(파스, 겔): 무릎·손 관절염에 먼저 권해요. 먹는 약보다 전신 부작용이 적어요.</li>
<li><strong>먹는 소염진통제</strong>(이부프로펜, 나프록센, 셀레콕시브 등): 효과는 좋지만 위장 출혈, 콩팥 기능 저하, 혈압 상승, 심혈관 위험이 있어 가장 적은 양을 필요한 기간만 써요.</li>
<li><strong>아세트아미노펜</strong>: 부작용이 적은 편이지만 관절염 통증에 대한 효과는 크지 않아요. 하루 최대 용량을 지켜요.</li>
<li><strong>둘록세틴</strong>: 여러 관절이 아프거나 만성 통증이 동반될 때 쓰기도 해요.</li>
</ul>

<h2>주사 치료</h2>
<div class="tbl"><table>
<thead><tr><th>주사</th><th>효과와 주의점</th></tr></thead>
<tbody>
<tr><td>관절 내 스테로이드</td><td>붓고 아픈 무릎의 통증을 몇 주 줄여요. 자주 반복하면 연골에 해로울 수 있어 1년에 몇 번 이내로 제한해요</td></tr>
<tr><td>히알루론산</td><td>효과는 연구마다 엇갈리고 크지 않은 편이에요. 국제 지침마다 권고가 달라요</td></tr>
<tr><td>혈소판 풍부 혈장, 줄기세포 등</td><td>일부 연구가 있지만 근거가 아직 부족하고 비용이 커요. 충분히 설명 듣고 결정해요</td></tr>
</tbody>
<caption>OARSI·ACR 골관절염 지침, 대한정형외과학회 정보를 바탕으로 정리</caption></table></div>

<h2>효과가 약한 것들</h2>
<ul>
<li><strong>글루코사민, 콘드로이틴:</strong> 대규모 연구에서 효과가 일관되지 않아 여러 지침이 권하지 않아요.</li>
<li><strong>관절경 청소 수술(세척, 연골 다듬기):</strong> 퇴행성 관절염 통증 개선 효과가 없어 권하지 않아요.</li>
<li>'연골이 재생된다'는 광고는 근거를 꼼꼼히 확인해요.</li>
</ul>

<h2>보조 기구와 생활</h2>
<ul>
<li>아픈 무릎 <strong>반대쪽 손에 지팡이</strong>를 짚으면 무릎 부담이 줄어요.</li>
<li>쿠션 좋은 신발을 신고, 좌식보다 의자와 침대 생활을 해요.</li>
<li>손가락 관절염에는 굵은 손잡이 도구, 손 보조기가 도움이 돼요.</li>
<li>따뜻한 찜질은 뻣뻣함에, 차가운 찜질은 붓고 열감 있을 때 도움이 돼요.</li>
</ul>

<h2>수술을 고려할 때</h2>
<p>운동, 체중 관리, 약, 주사를 충분히 해도 통증 때문에 잠을 못 자거나 걷기와 일상이 크게 제한된다면 <strong>인공관절 치환술</strong>을 고려해요. 젊고 한쪽만 닳았다면 다리 축을 바로잡는 절골술을 하기도 해요. 수술 뒤 재활 운동이 결과를 크게 좌우해요.</p>

<div class="box warn"><span class="h">관절염이 아닐 수 있어요</span>
<ul>
<li>관절이 갑자기 <strong>빨갛게 붓고 뜨겁고</strong> 열이 나요(감염성 관절염, 통풍).</li>
<li>다친 뒤 관절이 붓고 체중을 실을 수 없어요.</li>
<li>밤에 쉬어도 심해지는 통증, 체중 감소가 있어요.</li>
</ul></div>

<div class="box"><span class="h">관절 관리 체크리스트</span>
<ol>
<li>허벅지·엉덩이 근력 운동 주 2~3회</li>
<li>걷기·수영 등 유산소 주 150분</li>
<li>과체중이면 5~10% 감량</li>
<li>먹는 진통제는 적게, 짧게</li>
<li>효과 불확실한 영양제·시술 신중히</li>
<li>갑자기 붓고 뜨거우면 바로 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>무릎이 아픈데 걸어도 되나요?</dt>
<dd>대부분 걸어도 괜찮고, 오히려 도움이 돼요. 평지를 편한 속도로 걷고, 통증이 다음 날까지 심해지지 않는 정도로 시간을 늘려요.</dd>
<dt>날이 궂으면 더 아파요.</dt>
<dd>기압과 기온 변화에 따라 관절 통증이 달라진다고 느끼는 사람이 많아요. 따뜻하게 하고 실내 운동을 이어 가 보세요.</dd>
<dt>연골 주사를 맞으면 연골이 다시 생기나요?</dt>
<dd>현재 쓰이는 주사 치료가 닳은 연골을 다시 만든다는 근거는 없어요. 통증을 줄이는 목적으로 쓰고, 운동과 체중 관리를 함께 해야 해요.</dd>
</dl>
