  data-title="한랭질환과 저체온증: 떨림이 멈추면 더 위험한 이유, 동상 응급처치"
  data-thumb="35°C|저체온증 기준"
  data-summary="추운 날 몸이 떨리는 건 체온을 지키려는 신호예요. 그 떨림이 멈추고 말이 어눌해진다면 저체온증이 깊어진 거예요. 저체온증의 단계와 대처, 동상과 동창의 차이와 응급처치, 술이 추위를 더 위험하게 만드는 이유, 노인과 아이를 위한 겨울 수칙을 정리했어요."
  data-tags="저체온증,동상,한랭질환,겨울건강,한파">
<p class="lead">저체온증은 산이나 바다에서만 생기지 않아요. 난방이 약한 집에서 혼자 지내는 어르신, 술을 마시고 길에서 잠든 사람에게 도시 한가운데서도 생겨요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>몸의 중심 체온이 <strong>35°C 아래</strong>로 떨어지면 저체온증이에요.</li>
<li><strong>떨림이 멈추고, 말이 어눌하고, 졸려 하면</strong> 저체온증이 깊어진 신호예요. 바로 119예요.</li>
<li>동상 부위는 <strong>문지르지 말고</strong> 37~39°C의 따뜻한 물로 천천히 녹여요.</li>
<li><strong>술</strong>은 몸이 따뜻한 것처럼 느끼게 하지만 실제로는 열을 더 빨리 잃게 해요.</li>
</ul></div>

<h2>몸은 어떻게 추위에 맞설까</h2>
<p>추우면 몸은 피부 혈관을 좁혀 열이 빠져나가는 것을 줄이고, 근육을 떨게 해서 열을 만들어요. 이 떨림은 몸이 아직 싸우고 있다는 신호예요. 하지만 추위가 계속되고 에너지가 떨어지면 몸의 중심 체온이 내려가면서 뇌와 심장의 기능이 떨어지기 시작해요.</p>

<h2>저체온증의 단계</h2>
<div class="tbl"><table>
<thead><tr><th>단계</th><th>중심 체온 (대략)</th><th>증상</th></tr></thead>
<tbody>
<tr><td>경도</td><td class="num">32~35°C</td><td>심하게 떨림, 손 움직임이 둔해짐, 피부가 창백하고 차가움</td></tr>
<tr><td>중등도</td><td class="num">28~32°C</td><td><strong>떨림이 줄거나 멈춤</strong>, 말이 어눌함, 판단력 저하, 졸림, 비틀거림, 엉뚱한 행동</td></tr>
<tr><td>중증</td><td class="num">28°C 미만</td><td>의식 저하, 맥박과 호흡이 느리고 약해짐, 심정지 위험</td></tr>
</tbody>
<caption>체온 구간은 기준마다 조금씩 달라요. 의식 상태와 떨림이 중요한 판단 기준이에요.</caption></table></div>
<p>저체온증이 깊어지면 판단력이 떨어져 본인은 위험을 느끼지 못해요. 심하면 오히려 덥다고 느껴 옷을 벗는 경우도 있어요. 그래서 <strong>주변 사람이 알아차리는 것</strong>이 중요해요.</p>

<h2>저체온증 대처</h2>
<div class="box warn"><span class="h">저체온증이 의심되면</span>
<ol>
<li><strong>119</strong>에 신고해요. 떨림이 멈췄거나 의식이 흐리면 특히 급해요.</li>
<li>바람과 추위를 피할 수 있는 <strong>따뜻한 곳</strong>으로 옮겨요.</li>
<li><strong>젖은 옷을 벗기고</strong> 마른 옷이나 담요로 감싸요. 젖은 옷은 체온을 빠르게 빼앗아요.</li>
<li><strong>몸통(가슴, 배, 목, 겨드랑이, 사타구니)</strong>부터 따뜻하게 해요. 담요로 머리까지 감싸요.</li>
<li>의식이 또렷하고 삼킬 수 있다면 <strong>따뜻하고 달콤한 음료</strong>를 조금씩 줘요. 술과 카페인 음료는 주지 않아요.</li>
<li>환자를 <strong>조심스럽게</strong> 다뤄요. 심한 저체온증에서는 거친 움직임이 부정맥을 일으킬 수 있어요.</li>
<li><strong>팔다리를 세게 문지르거나 주무르지 않아요.</strong> 차가운 피가 갑자기 심장으로 몰려 위험할 수 있어요.</li>
<li>의식이 없고 정상 호흡이 없으면 심폐소생술을 시작해요.</li>
</ol></div>
<p>뜨거운 물주머니나 핫팩을 쓸 때는 피부에 직접 닿지 않게 수건으로 감싸요. 감각이 둔해진 피부는 화상을 입기 쉬워요.</p>

<h2>동상과 동창</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>동상</th><th>동창</th></tr></thead>
<tbody>
<tr><td>원인</td><td>영하의 추위에 피부와 조직이 <strong>얼어서</strong> 손상</td><td>영상의 춥고 습한 환경에 반복 노출되어 혈관과 피부에 염증</td></tr>
<tr><td>잘 생기는 곳</td><td>손가락, 발가락, 코, 귀, 뺨</td><td>손가락, 발가락, 귀</td></tr>
<tr><td>증상</td><td>피부가 하얗거나 회색, 딱딱하고 감각이 없음. 녹으면 붓고 물집, 심하면 검게 변함</td><td>붉거나 보랏빛으로 붓고 가렵거나 화끈거림</td></tr>
</tbody></table></div>
<h3>동상 응급처치</h3>
<ol>
<li>따뜻한 곳으로 옮기고 젖은 양말, 장갑, 꽉 끼는 반지를 벗겨요.</li>
<li><strong>37~39°C 정도의 따뜻한 물</strong>(손을 넣었을 때 따뜻하게 느껴지는 정도)에 20~30분 담가 천천히 녹여요.</li>
<li><strong>문지르거나 눈으로 비비지 않아요.</strong> 얼어 있는 조직이 더 손상돼요.</li>
<li><strong>난로나 불, 헤어드라이어에 직접 대지 않아요.</strong> 감각이 없어 화상을 입어요.</li>
<li>녹인 뒤 <strong>다시 얼 가능성이 있다면</strong> 녹이지 말고 병원까지 그대로 이동해요. 녹았다 다시 얼면 손상이 훨씬 커져요.</li>
<li>물집은 터뜨리지 말고, 마른 거즈로 느슨하게 감싸 손가락 사이도 떼어 둔 채 병원으로 가요.</li>
</ol>

<h2>술과 추위</h2>
<p>술을 마시면 피부 혈관이 넓어져 몸이 따뜻한 것처럼 느껴지지만, 실제로는 몸 중심의 열이 피부로 빠져나가 <strong>체온이 더 빨리 떨어져요.</strong> 게다가 떨림 반응이 줄고, 추위를 느끼고 피하는 판단력도 떨어져요. 겨울철 저체온증 환자 중 음주 상태인 경우가 적지 않아요. 술을 마신 날에는 밖에서 오래 머물거나 걸어서 먼 길을 가지 않아요.</p>

<h2>누가 특히 위험할까</h2>
<ul>
<li><strong>노인:</strong> 체온 조절 능력과 추위를 느끼는 감각이 떨어져요. 난방비 부담으로 집 안이 추운 경우도 많아요.</li>
<li><strong>영유아:</strong> 몸에 비해 표면적이 넓어 열을 빨리 잃어요.</li>
<li><strong>음주자, 노숙인</strong></li>
<li>당뇨병, 갑상선 기능 저하증, 치매, 뇌졸중 등으로 거동이나 판단이 어려운 사람</li>
<li>등산, 낚시, 야외 작업처럼 추위에 오래 노출되는 사람</li>
</ul>

<h2>한파와 심뇌혈관 질환</h2>
<p>추위에 노출되면 혈관이 수축하고 혈압이 올라 <strong>심근경색과 뇌졸중</strong> 위험이 커져요. 특히 따뜻한 실내에서 갑자기 찬 바깥으로 나갈 때 조심해요. 고혈압이나 심장 질환이 있다면 새벽 외출과 새벽 운동을 피하고, 외출 전 옷을 충분히 입어요.</p>

<h2>겨울 수칙</h2>
<div class="box"><span class="h">한파 대비 체크리스트</span>
<ol>
<li>얇은 옷을 <strong>여러 겹</strong> 입기 (공기층이 보온해요)</li>
<li>모자, 장갑, 목도리, 따뜻한 양말로 끝부분 보호하기</li>
<li>땀이나 눈에 옷이 젖으면 빨리 갈아입기</li>
<li>실내 온도 18~20°C 유지, 어르신 방은 조금 더 따뜻하게</li>
<li>술 마신 날 밖에서 오래 머물지 않기</li>
<li>혼자 사는 가족·이웃 안부 확인하기</li>
<li>한파 특보 때 새벽 운동 피하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>동상 부위에 눈을 문지르면 좋다는데요?</dt>
<dd>잘못 알려진 방법이에요. 얼어 있는 조직을 문지르면 얼음 결정이 세포를 더 손상시켜요. 따뜻한 물로 천천히 녹이는 게 맞아요.</dd>
<dt>실내에서도 저체온증이 생기나요?</dt>
<dd>생겨요. 난방이 거의 없는 집에서 오래 지내는 노인, 거동이 불편한 사람은 실내에서도 저체온증이 올 수 있어요.</dd>
<dt>손발이 늘 차가운 건 문제인가요?</dt>
<dd>체질적으로 손발이 찬 사람이 많아요. 하지만 손가락 색이 하얗게 또는 파랗게 변했다가 붉어지기를 반복하거나(레이노 현상), 한쪽만 유난히 차갑고 저리다면 진료를 받아요.</dd>
</dl>
