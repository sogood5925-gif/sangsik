  data-title="캠핑 안전: 텐트 안 일산화탄소, 난방기구, 불씨와 계곡 야영까지"
  data-thumb="CO|냄새 없는 위험"
  data-summary="캠핑 사고 가운데 가장 치명적인 건 텐트 안 일산화탄소 중독이에요. 숯과 가스 난로를 텐트 안에서 쓰면 안 되는 이유, 일산화탄소 경보기 쓰는 법, 겨울 캠핑 난방, 화재와 불씨 관리, 계곡과 강가 야영의 위험, 캠핑 음식 안전을 정리했어요."
  data-tags="캠핑,일산화탄소,텐트,화재예방,생활정보">
<p class="lead">일산화탄소는 색도 냄새도 없어요. 텐트 안에서 숯불이나 가스 난로를 피우고 잠들면, 두통을 느낄 새도 없이 의식을 잃을 수 있어요. 캠핑의 즐거움은 몇 가지 원칙을 지킬 때 지켜져요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>숯, 가스 난로, 가스 버너를 텐트·차 안에서 쓰지 않아요.</strong> 잠들기 전에는 특히요.</li>
<li>텐트 안에는 <strong>일산화탄소 경보기</strong>를 두고, 작동을 확인해요.</li>
<li>두통, 어지러움, 메스꺼움이 여럿에게 동시에 생기면 <strong>바로 밖으로 나가요.</strong></li>
<li>계곡과 강가, 바닷가 바로 옆에는 텐트를 치지 않아요.</li>
</ul></div>

<h2>텐트 안 일산화탄소</h2>
<p>숯, 가스, 석유를 태우면 산소가 부족할 때 일산화탄소가 많이 생겨요. 일산화탄소는 혈액의 헤모글로빈과 산소보다 훨씬 강하게 결합해, 몸 곳곳에 산소가 전달되지 못하게 해요. 밀폐된 텐트와 차 안에서는 농도가 빠르게 올라가요.</p>
<div class="tbl"><table>
<thead><tr><th>물건</th><th>텐트 안 사용</th><th>이유</th></tr></thead>
<tbody>
<tr><td>숯, 화로, 번개탄</td><td>절대 금지</td><td>불이 꺼져 가는 숯도 일산화탄소를 계속 내요</td></tr>
<tr><td>가스 난로, 가스 버너</td><td>금지</td><td>불완전 연소와 화재 위험이 함께 있어요</td></tr>
<tr><td>석유 난로</td><td>금지(특히 취침 중)</td><td>밀폐된 곳에서 일산화탄소가 쌓여요</td></tr>
<tr><td>전기 난방(전기장판 등)</td><td>조건부</td><td>전기 사이트에서 정격 용량을 지키고, 전선 손상·과열을 확인해요</td></tr>
</tbody>
<caption>소방청·한국소비자원 캠핑 안전 수칙을 바탕으로 정리</caption></table></div>
<p>텐트 밖 전실(앞마당)에서 조리할 때도 환기구를 열고, 바람 방향을 확인해요. 차 안에서 시동을 켠 채 잠드는 것도 위험해요. 배기구가 눈에 막히면 배기가스가 차 안으로 들어와요.</p>

<h2>일산화탄소 중독 증상</h2>
<div class="tbl"><table>
<thead><tr><th>단계</th><th>증상</th></tr></thead>
<tbody>
<tr><td>초기</td><td>두통, 어지러움, 메스꺼움, 피로. 감기나 체한 것으로 오해하기 쉬워요</td></tr>
<tr><td>진행</td><td>심한 두통, 구토, 가슴 두근거림, 판단력 저하, 몸이 늘어짐</td></tr>
<tr><td>심함</td><td>의식 저하, 경련, 호흡 곤란, 사망</td></tr>
</tbody></table></div>
<div class="box warn"><span class="h">의심되면 이렇게</span>
<ol>
<li>텐트 문을 열고 <strong>모두 밖으로</strong> 나가 신선한 공기를 마셔요.</li>
<li>난방기구를 끄되, 들어가서 끄는 것이 위험하면 그냥 대피해요.</li>
<li>119에 신고해요. 의식이 없고 숨을 쉬지 않으면 심폐소생술을 해요.</li>
<li>증상이 나아졌어도 병원에 가요. 치료가 늦으면 몇 주 뒤 기억력 저하 같은 후유증이 생길 수 있어요.</li>
</ol></div>

<h2>일산화탄소 경보기</h2>
<ul>
<li>텐트 안, 사람이 자는 높이 근처에 둬요.</li>
<li>출발 전 시험 버튼을 눌러 소리가 나는지, 배터리가 충분한지 확인해요.</li>
<li>경보기는 보조 장치예요. 경보기가 있다고 텐트 안에서 숯이나 가스를 써도 되는 것은 아니에요.</li>
</ul>

<h2>겨울 캠핑 난방</h2>
<ul>
<li>체온 유지는 <strong>침낭과 매트</strong>가 기본이에요. 땅의 냉기를 막는 두꺼운 매트가 중요해요.</li>
<li>핫팩, 보온병, 따뜻한 물주머니를 활용해요. 핫팩은 피부에 직접 오래 대면 저온 화상을 입어요.</li>
<li>전기 난방은 캠핑장의 전기 용량을 확인하고, 멀티탭 과부하를 피해요.</li>
<li>잘 때 젖은 옷은 갈아입어요.</li>
</ul>

<h2>화재와 불씨</h2>
<ul>
<li>화로는 텐트와 타프에서 충분히 떨어뜨리고, 바람이 강한 날은 불을 피우지 않아요.</li>
<li>캠핑장에서 정한 장소와 방식(화로대 사용, 직화 금지)을 지켜요.</li>
<li>가스 버너 위에 과열될 만큼 큰 불판을 올리면 가스통이 터질 수 있어요. 버너보다 큰 불판은 피해요.</li>
<li>잠들기 전과 떠날 때 불씨를 <strong>물로 완전히</strong> 꺼요.</li>
<li>작은 소화기와 물통을 가까이에 둬요.</li>
</ul>

<h2>어디에 텐트를 칠까</h2>
<ul>
<li><strong>계곡·강가 바로 옆, 물이 흐르던 자국이 있는 곳</strong>은 피해요. 상류에 비가 오면 한밤중에 물이 불어나요.</li>
<li>낭떠러지 아래, 낙석 위험이 있는 비탈 아래도 피해요.</li>
<li>큰 나무 바로 아래는 강풍에 가지가 부러지거나 낙뢰 위험이 있어요.</li>
<li>기상 특보(호우, 강풍)가 있으면 캠핑을 미루거나 철수해요.</li>
<li>허가된 캠핑장을 이용하면 안전 시설과 대피 안내를 받을 수 있어요.</li>
</ul>

<h2>캠핑 음식 안전</h2>
<ul>
<li>고기와 해산물은 아이스박스에 얼음과 함께 넣고, 날것과 익힌 것을 나눠 담아요.</li>
<li>고기는 속까지 충분히 익혀요. 여름에는 조리한 음식을 2시간 넘게 두지 않아요.</li>
<li>계곡물은 맑아 보여도 끓이지 않고 마시지 않아요.</li>
</ul>

<div class="box"><span class="h">캠핑 체크리스트</span>
<ol>
<li>텐트 안에서 숯·가스·석유 난로 쓰지 않기</li>
<li>일산화탄소 경보기 작동 확인</li>
<li>두꺼운 매트와 계절에 맞는 침낭</li>
<li>화로는 텐트에서 멀리, 불씨는 물로 끄기</li>
<li>계곡·강가 바로 옆 피하기, 기상 특보 확인</li>
<li>아이스박스로 음식 차갑게</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>텐트 환기구를 열어 두면 가스 난로를 써도 되나요?</dt>
<dd>환기구로는 일산화탄소를 충분히 빼기 어렵고, 잠든 동안 농도가 오르는 것을 알아차릴 수 없어요. 텐트 안, 특히 잠잘 때는 쓰지 않는 것이 원칙이에요.</dd>
<dt>차박할 때 시동을 켜고 히터를 틀어도 되나요?</dt>
<dd>배기구가 눈이나 벽에 막히면 배기가스가 차 안으로 들어올 수 있어요. 잠들 때는 시동을 끄고 침낭과 보온용품으로 체온을 유지해요.</dd>
<dt>숯불이 다 꺼진 것 같으면 텐트에 들여놔도 되나요?</dt>
<dd>겉으로 꺼진 것처럼 보여도 속에서 타며 일산화탄소를 낼 수 있어요. 물로 완전히 끄기 전에는 텐트 안에 들이지 않아요.</dd>
</dl>
