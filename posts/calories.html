<p class="lead">케이크 한 조각을 먹고 '이거 태우려면 얼마나 걸어야 하지?' 계산해 본 적 있나요? 열량은 체중 관리의 기본 언어예요. 하지만 몸은 숫자에 딱 맞춰 움직이지 않고, 같은 열량이라도 무엇으로 먹느냐에 따라 배부름과 건강이 달라져요. 숫자를 도구로 쓰되 숫자에 갇히지 않는 법을 알아볼게요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>1g당 열량은 <strong>탄수화물 4, 단백질 4, 지방 9, 알코올 7kcal</strong>예요.</li>
<li>성인의 하루 에너지 필요량은 대략 <strong>남성 2,000~2,600kcal, 여성 1,600~2,000kcal</strong>로, 나이와 활동량에 따라 달라요.</li>
<li>하루 쓰는 에너지의 가장 큰 부분은 <strong>기초대사량</strong>이고, 운동으로 쓰는 열량은 생각보다 적어요.</li>
<li>열량을 줄이면 몸도 <strong>적응</strong>해서 체중 감량은 시간이 갈수록 느려져요.</li>
</ul></div>

<h2>하루에 얼마나 필요할까</h2>

<h2>하루 에너지는 어디에 쓰일까</h2>
<ul>
<li><strong>기초대사량(약 60~70%):</strong> 숨쉬기, 심장 박동, 체온 유지처럼 가만히 있어도 쓰는 에너지. 근육이 많을수록 조금 커요.</li>
<li><strong>음식 소화(약 10%):</strong> 먹은 음식을 소화하고 흡수하는 데 쓰여요. 단백질이 가장 많이 써요.</li>
<li><strong>활동(약 20~30%):</strong> 운동뿐 아니라 걷기, 집안일, 서 있기 같은 <strong>일상 움직임</strong>이 큰 몫을 차지해요.</li>
</ul>

<h2>음식 열량과 운동 열량</h2>

<p>운동은 건강에 매우 중요하지만, 체중을 줄이는 데는 <strong>먹는 양 조절이 더 큰 역할</strong>을 해요. 운동한 뒤 "이만큼 했으니 더 먹어도 돼"라는 보상 심리도 조심해요. 운동의 진짜 이득은 근육, 심폐 기능, 혈당, 기분, 체중 유지에 있어요.</p>

<h2>500kcal 줄이면 일주일에 0.5kg?</h2>
<p>흔히 하루 500kcal를 줄이면 일주일에 약 0.5kg이 빠진다고 해요. 처음 몇 주는 대략 맞지만, 체중이 줄면 몸이 쓰는 에너지도 줄고, 식욕 호르몬도 변해서 <strong>시간이 갈수록 감량 속도가 느려져요.</strong> 정체기는 실패가 아니라 몸의 정상적인 적응이에요. 목표를 한 번에 크게 잡기보다 체중의 5~10%를 천천히 줄이고 유지하는 것을 권해요.</p>

<div class="box warn"><span class="h">너무 적게 먹으면</span>
<ul>
<li>하루 열량을 극단적으로 줄이면 <strong>근육이 빠지고</strong>, 피로, 어지러움, 탈모, 생리 불순, 담석이 생길 수 있어요.</li>
<li>의사의 관리 없이 하루 800kcal 아래의 초저열량 식사는 하지 않아요.</li>
<li>먹는 것에 대한 죄책감, 폭식과 구토가 반복되면 섭식 장애일 수 있어 도움을 청해요.</li>
</ul></div>

<h2>열량보다 함께 볼 것</h2>
<ul>
<li><strong>포만감:</strong> 같은 열량이라도 채소, 통곡물, 단백질이 많은 식사는 배가 오래 불러요.</li>
<li><strong>마시는 열량:</strong> 음료, 술, 라테의 열량은 배부름을 덜 줘서 쉽게 늘어나요.</li>
<li><strong>영양 밀도:</strong> 과자 200kcal와 견과류·요거트 200kcal는 몸에 주는 영양이 달라요.</li>
<li>영양성분표는 <strong>1회 제공량</strong>과 <strong>총 내용량</strong>을 함께 봐요. 한 봉지가 2~3회 분량인 경우가 많아요.</li>
</ul>

<div class="box"><span class="h">에너지 균형 체크리스트</span>
<ol>
<li>내 나이·성별의 필요량 대략 알기</li>
<li>마시는 열량부터 줄이기</li>
<li>매끼 채소·단백질로 포만감</li>
<li>운동은 건강을 위해, 보상 먹기 조심</li>
<li>영양성분표 1회 제공량 확인</li>
<li>극단적인 저열량 식사 피하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>기초대사량을 올리는 방법이 있나요?</dt>
<dd>근력 운동으로 근육량을 유지·증가시키면 조금 도움이 돼요. 기초대사량을 크게 올려 준다는 식품이나 보충제는 효과가 미미해요.</dd>
<dt>밤에 먹으면 더 살이 찌나요?</dt>
<dd>같은 열량이면 시간 자체의 차이는 크지 않다는 연구가 많아요. 다만 늦은 밤에는 과식하기 쉽고 잠에도 방해가 돼요.</dd>
<dt>스마트워치의 소모 열량은 정확한가요?</dt>
<dd>기기마다 오차가 커서 참고용으로만 봐요. 추세를 보는 데는 도움이 돼요.</dd>
</dl>
