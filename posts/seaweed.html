  data-title="해조류: 김·미역·다시마·톳의 영양, 요오드는 많을수록 좋은 게 아닌 이유, 톳은 데쳐 먹기"

  data-summary="김, 미역, 다시마, 톳은 식이섬유와 무기질이 풍부한 우리 밥상의 단골 식품이에요. 해조류별 영양 특징, 다시마와 미역에 특히 많은 요오드와 상한섭취량, 갑상선 질환이 있을 때, 톳의 무기비소를 줄이는 조리법, 조미김의 나트륨, 산후 미역국을 먹을 때 알아 둘 점을 정리했어요."

<p class="lead">생일과 산후에 먹는 미역국, 밥상에 늘 오르는 김, 국물 맛을 내는 다시마. 우리나라 사람은 세계에서 해조류를 가장 많이 먹는 편에 속해요. 해조류는 열량이 낮고 식이섬유와 무기질이 풍부하지만, 요오드처럼 한꺼번에 너무 많이 먹으면 곤란한 성분도 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>해조류는 <strong>식이섬유(알긴산 등), 요오드, 칼슘, 철</strong>이 풍부하고 열량이 낮아요.</li>
<li><strong>다시마</strong>는 요오드가 특히 많아, 매일 많이 먹으면 상한섭취량(하루 <strong>2,400μg</strong>)을 넘기 쉬워요.</li>
<li><strong>톳</strong>은 무기비소가 있어 <strong>충분히 데치고 물을 버린 뒤</strong> 먹어요.</li>
<li><strong>조미김</strong>은 소금과 기름이 더해져 나트륨을 함께 봐요.</li>
</ul></div>

<h2>해조류별 특징</h2>
<div class="tbl"><table>
<thead><tr><th>해조류</th><th>영양 특징</th><th>먹을 때</th></tr></thead>
<tbody>
<tr><td>김</td><td>단백질 비율이 높고 비타민 A(카로틴), 비타민 B12, 식이섬유</td><td>조미김은 나트륨 확인. 구운 김에 간장 살짝</td></tr>
<tr><td>미역</td><td>요오드, 칼슘, 식이섬유(알긴산, 푸코이단)</td><td>국이나 무침으로. 산후 섭취량 주의</td></tr>
<tr><td>다시마</td><td><strong>요오드가 매우 많음</strong>, 칼륨, 감칠맛(글루탐산)</td><td>육수용으로 우리고 건더기는 적당히</td></tr>
<tr><td>톳</td><td>철, 칼슘, 식이섬유</td><td>반드시 데쳐서, 데친 물은 버리기</td></tr>
<tr><td>파래·매생이</td><td>철, 식이섬유, 엽록소</td><td>국, 무침으로</td></tr>
</tbody>
<caption>농촌진흥청 국가표준식품성분표, 식품의약품안전처 해조류 안전 섭취 안내를 바탕으로 정리</caption></table></div>

<h2>요오드, 적당히가 중요해요</h2>
<p>요오드는 갑상선 호르몬의 원료예요. 부족해도 문제지만, 너무 많아도 갑상선 기능이 떨어지거나 오히려 항진될 수 있어요. 한국인 성인의 권장섭취량은 하루 150μg, 상한섭취량은 2,400μg이에요.</p>
<div class="tbl"><table>
<thead><tr><th>식품(대략)</th><th class="num">요오드</th></tr></thead>
<tbody>
<tr><td>마른 다시마 1g(손톱 크기 몇 장)</td><td class="num">수백~2,000μg 이상</td></tr>
<tr><td>마른 미역 5g(국 1인분)</td><td class="num">수백~1,000μg 안팎</td></tr>
<tr><td>김 1장(약 2g)</td><td class="num">약 30~80μg</td></tr>
</tbody>
<caption>보건복지부·한국영양학회 2020 한국인 영양소 섭취기준, 농촌진흥청 국가표준식품성분표를 바탕으로 정리. 산지와 가공에 따라 차이가 매우 커요</caption></table></div>
<p>보통 식사에서 한두 번 먹는 미역국과 김은 문제가 되지 않아요. 다만 <strong>다시마를 매일 먹거나, 다시마·해조류 환이나 분말, 요오드 영양제를 함께</strong> 먹으면 상한섭취량을 넘기기 쉬워요.</p>

<h2>갑상선 질환이 있다면</h2>
<ul>
<li><strong>갑상선 기능 항진증(그레이브스병):</strong> 요오드가 많으면 조절이 어려워질 수 있어 다시마, 미역을 많이 먹지 않도록 의사와 상의해요.</li>
<li><strong>하시모토 갑상선염, 기능 저하증:</strong> 과한 요오드가 기능 저하를 악화시킬 수 있어요. 일부러 끊을 필요는 없지만 많이 먹지 않아요.</li>
<li><strong>방사성 요오드 치료 전:</strong> 병원 안내에 따라 일정 기간 저요오드 식사를 해요.</li>
</ul>

<h2>톳과 무기비소</h2>
<p>톳은 바닷물 속 비소를 몸에 모아 두는 성질이 있어요. 특히 독성이 강한 <strong>무기비소</strong>가 들어 있어요. 식약처는 톳을 <strong>물에 불린 뒤 끓는 물에 충분히 데치고, 데친 물은 버리는</strong> 조리를 권해요. 이렇게 하면 무기비소가 크게 줄어요. 톳을 매일 많이 먹지 않고 다양한 해조류를 번갈아 먹어요.</p>

<div class="box warn"><span class="h">이런 경우는 조심해요</span>
<ul>
<li><strong>콩팥병</strong>으로 칼륨 제한이 있다면 다시마·미역 같은 칼륨이 많은 해조류 양을 의사·영양사와 정해요.</li>
<li><strong>와파린</strong>을 먹는다면 김, 파래처럼 비타민 K가 있는 해조류를 갑자기 많이 늘리지 않아요.</li>
<li>해조류 환, 분말, 추출물 보충제는 요오드 함량이 표시되지 않은 경우가 있어요. 갑상선 질환자는 피하는 것이 좋아요.</li>
</ul></div>

<h2>산후 미역국</h2>
<p>산후에 미역국을 하루 세 끼씩 오래 먹으면 요오드를 매우 많이 먹게 돼요. 엄마의 요오드는 모유로도 전해지는데, 너무 많으면 아기의 갑상선 기능에 영향을 줄 수 있다는 국내 연구가 있어요. 미역국은 하루 한두 번, 건더기를 적당히 먹고, 다른 반찬과 균형 있게 먹는 편이 좋아요.</p>

<h2>맛있고 균형 있게</h2>
<ul>
<li>조미김 대신 <strong>구운 김</strong>에 밥을 싸 먹거나, 저염 제품을 골라요.</li>
<li>다시마 육수는 우린 뒤 건더기를 오래 끓이지 않아요.</li>
<li>미역·파래 무침은 식초와 채소를 더해 싱겁게 먹어요.</li>
<li>해조류는 불리면 부피가 크게 늘어요. 마른 상태로 조금만 불려요.</li>
</ul>

<div class="box"><span class="h">해조류 체크리스트</span>
<ol>
<li>여러 해조류를 번갈아 먹기</li>
<li>다시마는 매일 많이 먹지 않기</li>
<li>톳은 데치고 물 버리기</li>
<li>조미김은 나트륨 확인</li>
<li>갑상선 질환이면 양을 의사와 상의</li>
<li>해조류 환·분말 보충제 신중히</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>해조류를 먹으면 머리카락이 잘 자라나요?</dt>
<dd>해조류가 탈모를 막거나 머리카락을 자라게 한다는 근거는 없어요. 균형 잡힌 식사의 한 부분으로 즐겨요.</dd>
<dt>김에 비타민 B12가 있어 채식에 도움이 되나요?</dt>
<dd>일부 김에는 사람이 쓸 수 있는 형태의 비타민 B12가 들어 있지만 양이 일정하지 않아요. 엄격한 채식이라면 보충제를 따로 챙기는 것이 안전해요.</dd>
<dt>미역국을 끓일 때 참기름에 볶으면 영양이 더 좋아지나요?</dt>
<dd>기름과 함께 먹으면 카로틴 같은 지용성 성분 흡수가 조금 좋아져요. 다만 기름은 적당히 써요.</dd>
</dl>
