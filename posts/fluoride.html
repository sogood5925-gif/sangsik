<p class="lead">충치 예방에 가장 효과가 확인된 방법 가운데 하나가 불소예요. 그런데 "불소는 몸에 해롭다"는 이야기도 종종 들려요. 불소는 적정량을 잘 쓰면 이가 튼튼해지고, 어린아이가 너무 많이 삼키면 치아에 흰 반점이 생길 수 있어요. 결국 핵심은 '얼마나, 어떻게'예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>불소는 치아 겉면(법랑질)을 <strong>산에 강하게</strong> 만들고, <strong>초기 충치를 다시 굳게</strong> 해요.</li>
<li>충치 예방에는 불소를 먹는 것보다 <strong>이에 직접 닿게</strong> 하는 것(치약, 도포)이 중요해요.</li>
<li>치약 양은 <strong>3세 미만 쌀알 크기, 3~6세 완두콩 크기</strong>예요. 어른이 짜 주고 뱉게 도와요.</li>
<li>어린 시절 불소를 많이 삼키면 <strong>치아 불소증</strong>(흰 반점)이 생길 수 있어요.</li>
</ul></div>

<h2>불소가 충치를 막는 원리</h2>
<p>충치균은 당을 먹고 산을 만들어 치아 겉면의 무기질을 녹여요(탈회). 침 속의 칼슘과 인이 다시 채워 넣으면 회복되는데(재광화), 이때 불소가 있으면 <strong>산에 더 강한 결정(플루오르아파타이트)</strong>이 만들어져요. 또 불소는 충치균이 산을 만드는 능력을 떨어뜨려요.</p>
<p>이런 효과는 불소가 <strong>입안과 치아 표면에 자주, 조금씩</strong> 있을 때 가장 커요. 그래서 하루 두 번 불소 치약으로 이를 닦는 것이 가장 기본이에요.</p>

<h2>하루 필요량과 상한</h2>
<p>한국인 영양소 섭취기준에서 불소는 충분섭취량으로 성인 하루 약 3mg 안팎(성별에 따라 조금 달라요), 상한섭취량은 하루 10mg이에요. 차, 해산물, 수돗물에 조금씩 들어 있어요. 영양소로서 불소를 따로 챙겨 먹을 필요는 거의 없고, 충치 예방은 치아에 바르는 방식이 중심이에요.</p>

<h2>연령별 불소 치약 쓰는 법</h2>
<div class="tbl"><table>
<thead><tr><th>나이</th><th>치약 양</th><th>요령</th></tr></thead>
<tbody>
<tr><td>첫 이가 난 뒤~3세 미만</td><td><strong>쌀알 크기</strong>(얇게 한 번 문지른 정도)</td><td>보호자가 닦아 주고, 거즈로 닦아 내도 돼요</td></tr>
<tr><td>3~6세</td><td><strong>완두콩 크기</strong></td><td>보호자가 짜 주고, 삼키지 않고 뱉게 연습시켜요</td></tr>
<tr><td>6세 이상·성인</td><td>칫솔모의 1/3~1/2 정도</td><td>하루 2번 이상, 2분 동안</td></tr>
</tbody>
<caption>대한소아치과학회, 미국소아치과학회(AAPD)·미국치과의사협회(ADA) 불소 치약 권고를 바탕으로 정리</caption></table></div>
<ul>
<li>양치 뒤 <strong>물로 여러 번 헹구지 말고</strong> 치약 거품만 뱉어요. 한 번만 가볍게 헹구면 불소가 입안에 더 오래 남아요.</li>
<li>잠들기 전 양치가 특히 중요해요. 자는 동안 침이 줄어 충치가 잘 생겨요.</li>
<li>어른용 치약의 불소 농도는 보통 1,000~1,500ppm이에요. 치약 포장에 적힌 불소 함량을 확인해요.</li>
</ul>

<h2>그 밖의 불소 이용 방법</h2>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>대상과 특징</th></tr></thead>
<tbody>
<tr><td>치과 불소 도포(바니시·겔)</td><td>충치 위험이 높은 어린이와 어른. 3~6개월마다 치과에서 발라요</td></tr>
<tr><td>불소 가글(양치 용액)</td><td>6세 이상에서 충치가 잦거나 교정 장치를 낀 경우. 삼키지 않을 수 있을 때 써요</td></tr>
<tr><td>고불소 치약(처방)</td><td>뿌리 충치 위험이 높은 어르신, 입이 마르는 사람 등</td></tr>
<tr><td>수돗물 불소 농도 조정</td><td>일부 국가와 지역에서 시행해요. 지역마다 다르니 거주지 상수도 안내를 확인해요</td></tr>
</tbody></table></div>

<h2>치아 불소증</h2>
<p>영구치가 만들어지는 <strong>8세 이전</strong>에 불소를 너무 많이 삼키면 치아 겉면에 하얀 줄이나 반점이 생길 수 있어요(치아 불소증). 대부분은 가벼워 기능에 문제가 없지만, 심하면 갈색 얼룩이 생기기도 해요.</p>
<ul>
<li>아이가 치약을 짜 먹거나 많이 삼키지 않게 보호자가 치약을 관리해요.</li>
<li>과일 맛 어린이 치약은 삼키고 싶어지니 양을 꼭 지켜요.</li>
<li>의사·치과의사 처방 없이 불소 정제를 먹이지 않아요.</li>
</ul>

<h2>불소에 대한 걱정</h2>
<ul>
<li>수십 년 동안의 연구에서 적정량의 불소는 충치를 크게 줄였고, 치약으로 쓰는 양에서 전신 건강 문제가 확인되지 않았어요.</li>
<li>최근 일부 연구는 식수의 불소 농도가 <strong>1.5mg/L 이상</strong>으로 높은 지역에서 어린이 지능이 조금 낮았다고 보고했어요. 이는 일반적인 수돗물 불소 조정 농도보다 높은 수준이라, 적정 농도에 대한 해석은 계속 논의되고 있어요.</li>
<li>불소를 한꺼번에 아주 많이 삼키면(예: 어린이가 불소 가글액 한 병을 마심) 구역질, 구토, 복통이 생길 수 있어요. 이럴 때는 우유를 마시게 하고 중독 상담이나 응급실에 연락해요.</li>
</ul>

<div class="box"><span class="h">불소 체크리스트</span>
<ol>
<li>하루 2번, 불소 치약으로 2분 양치</li>
<li>아이는 나이에 맞는 치약 양(쌀알·완두콩)</li>
<li>양치 후 여러 번 헹구지 않기</li>
<li>잠들기 전 양치 꼭 하기</li>
<li>충치가 잦으면 치과 불소 도포 상담</li>
<li>치약·가글액은 아이 손이 닿지 않게 보관</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>무불소 치약이 더 안전하지 않나요?</dt>
<dd>무불소 치약은 충치 예방 효과가 크게 떨어져요. 충치 위험이 있는 대부분의 사람에게는 적정량의 불소 치약이 이익이 훨씬 커요.</dd>
<dt>아기가 치약을 조금 삼켰어요.</dt>
<dd>쌀알이나 완두콩 크기의 치약을 삼킨 정도는 걱정하지 않아도 돼요. 튜브째 짜 먹은 경우처럼 많이 삼켰다면 중독 상담이나 진료를 받아요.</dd>
<dt>어른도 불소 도포를 받을 수 있나요?</dt>
<dd>네. 잇몸이 내려가 뿌리가 드러난 어르신, 입이 마르는 사람, 충치가 자주 생기는 사람에게 도움이 돼요. 치과에서 상담해요.</dd>
</dl>
