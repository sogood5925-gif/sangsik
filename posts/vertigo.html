  data-title="어지럼증과 이석증: 빙빙 도는 어지럼, 핑 도는 어지럼, 뇌졸중을 먼저 의심해야 할 때"
  data-thumb="1분 안|이석증 어지럼 지속 시간"
  data-summary="어지럼증은 귀, 뇌, 혈압, 빈혈 등 원인이 다양해요. 빙빙 도는 회전성 어지럼과 핑 도는 어지럼의 차이, 가장 흔한 원인인 이석증이 생기는 원리와 이석 치환술, 전정신경염·메니에르병과의 구별, 뇌졸중 신호, 어지러울 때 넘어지지 않는 법과 재활 운동을 정리했어요."
  data-tags="어지럼증,이석증,메니에르병,전정신경염,질병">
<p class="lead">아침에 일어나려고 고개를 돌리는 순간 천장이 빙글빙글 돌아요. 무서워서 꼼짝 못 하고 누워 있다 보면 1분도 안 돼 멈추지만, 다시 움직이면 또 돌아요. 이런 어지럼은 대부분 귓속 작은 돌이 제자리를 벗어난 이석증이에요. 다행히 간단한 자세 치료로 좋아지는 경우가 많아요. 다만 어지럼 중에는 뇌에서 오는 위험한 것도 있어 구별이 중요해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>어지럼은 <strong>빙빙 도는지(회전성), 핑 돌며 눈앞이 캄캄한지</strong>에 따라 원인이 달라요.</li>
<li>고개를 움직일 때 <strong>1분 안쪽</strong>으로 짧게 도는 어지럼은 <strong>이석증</strong>이 흔해요.</li>
<li>이석증은 병원에서 <strong>이석 치환술</strong>로 한두 번에 좋아지는 경우가 많아요.</li>
<li>말이 어눌하거나, 걷지 못하거나, 물체가 둘로 보이면 <strong>뇌졸중</strong>일 수 있어 바로 119예요.</li>
</ul></div>

<h2>어지럼의 종류</h2>
<div class="tbl"><table>
<thead><tr><th>느낌</th><th>흔한 원인</th></tr></thead>
<tbody>
<tr><td>빙빙 돈다(회전성)</td><td>이석증, 전정신경염, 메니에르병 등 귓속 균형기관의 문제. 드물게 뇌졸중</td></tr>
<tr><td>핑 돈다, 눈앞이 캄캄하다</td><td>일어설 때 혈압이 떨어짐(기립성 저혈압), 탈수, 빈혈, 저혈당, 부정맥, 혈압약</td></tr>
<tr><td>휘청거린다, 중심 잡기 어렵다</td><td>말초신경병증, 소뇌 질환, 여러 약의 영향, 노화</td></tr>
<tr><td>머리가 멍하다</td><td>불안, 수면 부족, 편두통, 약 부작용</td></tr>
</tbody>
<caption>대한평형의학회, 대한신경과학회 어지럼증 안내를 바탕으로 정리</caption></table></div>

<h2>이석증은 왜 생길까</h2>
<p>귓속 전정기관에는 몸의 기울기를 느끼는 아주 작은 돌 가루(이석)가 붙어 있어요. 이 이석이 떨어져 나와 회전을 느끼는 <strong>반고리관</strong>으로 들어가면, 고개를 움직일 때마다 이석이 굴러 뇌에 '돌고 있다'는 잘못된 신호를 보내요.</p>
<ul>
<li>누울 때, 일어날 때, 돌아누울 때, 고개를 들어 위를 볼 때 생겨요.</li>
<li>어지럼은 보통 <strong>수십 초~1분 안쪽</strong>이고, 가만히 있으면 멈춰요.</li>
<li>메스꺼움이 함께 올 수 있지만 청력은 대개 정상이에요.</li>
<li>50대 이후, 머리를 다친 뒤, 오래 누워 지낸 뒤에 잘 생겨요. 뚜렷한 이유 없이 생기는 경우도 많아요.</li>
</ul>

<h2>이석증 치료</h2>
<p>의사가 고개와 몸의 자세를 순서대로 바꿔 반고리관의 이석을 원래 자리로 되돌려 보내는 <strong>이석 치환술</strong>을 해요. 어느 쪽 어느 반고리관인지 확인한 뒤 해야 해서 병원에서 받는 것이 좋아요. 한두 번 치료로 좋아지는 경우가 많아요. 어지럼 약은 메스꺼움을 줄이는 데 잠깐 쓰고, 오래 먹으면 회복을 늦출 수 있어요.</p>
<p>이석증은 <strong>다시 생기는 경우가 드물지 않아요.</strong> 비슷한 어지럼이 또 오면 다시 치료받으면 돼요. 비타민 D가 부족한 사람에게서 재발이 많다는 연구가 있어 필요하면 검사해요.</p>

<h2>다른 귀 질환과 구별</h2>
<div class="tbl"><table>
<thead><tr><th>질환</th><th>어지럼 지속</th><th>함께 나타나는 것</th></tr></thead>
<tbody>
<tr><td>이석증</td><td>고개 움직일 때 1분 안쪽</td><td>청력 정상</td></tr>
<tr><td>전정신경염</td><td>갑자기 시작해 하루 이상, 며칠 동안 심하게</td><td>심한 구토, 청력은 대개 정상. 감기 뒤에 오기도</td></tr>
<tr><td>메니에르병</td><td>20분~몇 시간씩 반복</td><td>한쪽 귀 먹먹함, 이명, 난청</td></tr>
<tr><td>전정 편두통</td><td>몇 분~며칠</td><td>두통 병력, 빛·소리 예민</td></tr>
</tbody>
<caption>대한평형의학회, 바라니학회(Bárány Society) 진단 기준을 바탕으로 쉽게 정리</caption></table></div>

<div class="box warn"><span class="h">뇌졸중일 수 있어요, 바로 119</span>
<ul>
<li>어지럼과 함께 <strong>말이 어눌하거나</strong> 얼굴·팔다리 한쪽에 힘이 빠져요.</li>
<li>물체가 <strong>둘로 보이거나</strong> 한쪽이 안 보여요.</li>
<li>도움 없이는 <strong>서거나 걷지 못해요.</strong></li>
<li>갑자기 생긴 <strong>심한 두통</strong>이나 목 뒤 통증</li>
<li>고혈압, 당뇨, 심방세동이 있는 사람에게 갑자기 생긴 지속되는 어지럼</li>
</ul>
<p>뇌졸중은 빨리 치료할수록 결과가 좋아요. '귀 문제겠지' 하고 기다리지 않아요.</p></div>

<h2>어지러울 때 넘어지지 않기</h2>
<ul>
<li>어지러우면 그 자리에 <strong>앉거나 누워요.</strong></li>
<li>아침에 일어날 때는 바로 서지 말고 앉아서 잠시 기다려요.</li>
<li>밤에 화장실 가는 길에 불을 켜 두고, 미끄럼 방지 매트를 깔아요.</li>
<li>어지럼이 가라앉기 전에는 운전, 사다리, 높은 곳 작업을 피해요.</li>
</ul>

<h2>전정 재활 운동</h2>
<p>전정신경염 뒤처럼 균형 감각이 떨어진 경우, 누워만 있기보다 <strong>조금씩 움직이는 것</strong>이 뇌의 적응을 도와 회복을 빠르게 해요. 시선을 한 곳에 두고 고개를 천천히 좌우로 움직이기, 걷기 같은 운동을 의사나 물리치료사와 함께 시작해요.</p>

<div class="box"><span class="h">어지럼증 체크리스트</span>
<ol>
<li>어지럼의 느낌과 지속 시간 기록</li>
<li>고개 움직일 때 짧게 돌면 이석증 진료</li>
<li>청력 변화·이명 함께 있으면 알리기</li>
<li>말 어눌·걷기 어려움은 즉시 119</li>
<li>일어날 때 천천히, 밤길 조명</li>
<li>어지럼 약은 짧게만</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>이석증 운동을 집에서 해도 되나요?</dt>
<dd>의사에게 어느 쪽 반고리관인지 확인받은 뒤 배운 방법으로 하면 도움이 될 수 있어요. 방향을 잘못 알면 효과가 없어요.</dd>
<dt>어지럼증에 좋은 음식이 있나요?</dt>
<dd>메니에르병은 싱겁게 먹는 것이 도움이 될 수 있어요. 탈수로 인한 어지럼은 물을 충분히 마시면 좋아져요. 원인에 따라 달라요.</dd>
<dt>일어설 때마다 핑 돌아요.</dt>
<dd>기립성 저혈압일 수 있어요. 혈압약, 탈수, 빈혈을 확인해요. 누워서와 서서 혈압을 재 보면 도움이 돼요.</dd>
</dl>
