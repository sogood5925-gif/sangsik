  data-title="녹차: 카테킨과 카페인, 하루 몇 잔이 적당할까, 녹차 추출물 보충제와 간 손상 주의"
  data-thumb="약 30mg|녹차 한 잔 카페인"
  data-summary="녹차는 카테킨이라는 폴리페놀과 적당한 카페인을 함께 가진 음료예요. 녹차 한 잔의 카페인과 커피와의 차이, 카테킨과 테아닌에 대해 연구가 말하는 것, 철분 흡수와 너무 뜨거운 차의 주의점, 고농도 녹차 추출물 보충제의 간 손상 보고, 말차와 임신 중 섭취를 정리했어요."
  data-tags="녹차,카테킨,카페인,EGCG,영양소">
<p class="lead">녹차는 커피보다 카페인이 적고, 떫은맛을 내는 카테킨이 풍부해 '건강한 음료'로 알려져 있어요. 실제로 녹차를 즐겨 마시는 사람들의 심혈관 질환 위험이 낮았다는 관찰 연구도 많아요. 다만 우려 마시는 차와 알약으로 농축한 추출물은 전혀 다르게 봐야 해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>녹차 한 잔(200mL)의 카페인은 <strong>약 15~40mg</strong>으로 커피의 3분의 1~4분의 1 정도예요.</li>
<li>녹차의 주요 성분은 <strong>카테킨(특히 EGCG)</strong>과 <strong>테아닌</strong>이에요.</li>
<li>식사 직후 마시면 <strong>철분 흡수</strong>가 줄 수 있어요. 빈혈이 있다면 식간에 마셔요.</li>
<li><strong>고농도 녹차 추출물 보충제</strong>는 드물게 간 손상을 일으킬 수 있어요.</li>
</ul></div>

<h2>녹차 속 성분</h2>
<div class="tbl"><table>
<thead><tr><th>성분</th><th>특징</th></tr></thead>
<tbody>
<tr><td>카테킨(EGCG 등)</td><td>폴리페놀의 한 종류. 떫은맛을 내고 항산화 작용이 있어요</td></tr>
<tr><td>카페인</td><td>각성 효과. 커피보다 적어요</td></tr>
<tr><td>테아닌</td><td>차에 있는 아미노산. 감칠맛을 내고 카페인의 자극을 부드럽게 한다는 연구가 있어요</td></tr>
<tr><td>비타민 C, 엽산, 비타민 K</td><td>잎에 들어 있지만 우린 차로 먹는 양은 적어요. 잎 전체를 먹는 말차는 더 많아요</td></tr>
<tr><td>불소</td><td>찻잎에 들어 있어요</td></tr>
</tbody>
<caption>농촌진흥청 국가표준식품성분표, 미국 국립보건원(NIH) 국립보완통합보건센터 Green Tea 자료를 바탕으로 정리</caption></table></div>

<h2>음료별 카페인 비교</h2>
<div class="tbl"><table>
<thead><tr><th>음료(1잔)</th><th class="num">카페인(대략)</th></tr></thead>
<tbody>
<tr><td>녹차(티백·잎차) 200mL</td><td class="num">15~40mg</td></tr>
<tr><td>말차 라테(분말 2g 안팎)</td><td class="num">40~70mg</td></tr>
<tr><td>홍차 200mL</td><td class="num">30~50mg</td></tr>
<tr><td>아메리카노 1잔</td><td class="num">100~200mg</td></tr>
<tr><td>보리차·옥수수차</td><td class="num">0mg</td></tr>
</tbody>
<caption>식품의약품안전처 카페인 함량 정보, 미국 농무부(USDA) FoodData Central을 바탕으로 정리. 우리는 시간과 온도, 제품에 따라 차이가 커요</caption></table></div>
<p>식약처가 제시한 카페인 최대 섭취 권고량은 성인 하루 400mg 이하, 임신부 300mg 이하, 어린이·청소년은 체중 1kg당 2.5mg 이하예요. 녹차만 마신다면 이 양을 넘기기 어렵지만, 커피와 에너지 음료를 함께 마신다면 합쳐서 계산해요.</p>

<h2>연구가 말하는 것</h2>
<ul>
<li><strong>심혈관:</strong> 일본 등 녹차를 많이 마시는 나라의 관찰 연구에서 녹차를 자주 마시는 사람의 심혈관 질환 사망 위험이 낮았어요. 다만 생활 습관 차이의 영향도 있을 수 있어요.</li>
<li><strong>콜레스테롤·체지방:</strong> 녹차 카테킨이 LDL 콜레스테롤과 체지방을 <strong>조금</strong> 낮췄다는 연구가 있어요. 효과는 크지 않아요.</li>
<li><strong>암 예방:</strong> 연구 결과가 엇갈려 예방 효과가 있다고 말하기 어려워요.</li>
<li><strong>집중력:</strong> 카페인과 테아닌이 함께 있어 차분한 각성에 도움이 된다는 소규모 연구가 있어요.</li>
</ul>

<h2>마실 때 알아 둘 것</h2>
<ul>
<li><strong>철분:</strong> 카테킨과 탄닌이 식물성 식품의 철분 흡수를 줄여요. 빈혈이 있거나 철분제를 먹는다면 식사 뒤 1시간쯤 지나서 마셔요.</li>
<li><strong>너무 뜨거운 차:</strong> 국제암연구소는 <strong>65°C가 넘는 매우 뜨거운 음료</strong>가 식도암 위험을 높일 수 있다고 봐요. 조금 식혀 마셔요.</li>
<li><strong>빈속:</strong> 속이 쓰릴 수 있어요. 불편하면 식간에 가볍게 먹은 뒤 마셔요.</li>
<li><strong>잠:</strong> 카페인에 예민하다면 오후 늦게는 피해요.</li>
</ul>

<div class="box warn"><span class="h">녹차 추출물 보충제는 주의</span>
<p>체지방 감소를 내세운 <strong>고농도 녹차 추출물</strong>(카테킨 농축 캡슐)을 먹은 뒤 간 수치가 크게 오르거나 간 손상이 생긴 사례가 여러 나라에서 보고됐어요. 유럽식품안전청은 하루 EGCG 800mg 이상을 보충제로 먹을 때 간 수치 상승이 나타났다고 평가했어요. 특히 <strong>빈속에 먹을 때</strong> 위험이 커질 수 있어요. 보충제를 먹는 중에 <strong>피로, 구역, 짙은 소변, 눈이나 피부가 노래짐</strong>이 생기면 바로 중단하고 진료를 받아요. 우려 마시는 녹차에서는 이런 문제가 거의 보고되지 않았어요.</p></div>

<h2>약과의 관계</h2>
<ul>
<li>일부 혈압약(나돌롤)은 녹차를 많이 마시면 흡수가 줄었다는 연구가 있어요.</li>
<li>와파린을 먹는다면 말차처럼 잎을 통째로 먹는 제품을 갑자기 많이 늘리지 않아요(비타민 K).</li>
<li>약을 먹고 있다면 보충제는 약사와 상의해요.</li>
</ul>

<div class="box"><span class="h">녹차 체크리스트</span>
<ol>
<li>하루 카페인 총량 계산하기</li>
<li>철분 필요하면 식간에 마시기</li>
<li>조금 식혀서 마시기</li>
<li>고농도 추출물은 신중하게</li>
<li>보충제 먹다 황달·피로면 중단</li>
<li>늦은 오후엔 줄이기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>녹차가 살을 빼 주나요?</dt>
<dd>체중이나 체지방이 조금 줄었다는 연구가 있지만 차이는 작아요. 단 음료 대신 무가당 녹차를 마시는 것이 더 큰 도움이 돼요.</dd>
<dt>임신 중에 녹차를 마셔도 되나요?</dt>
<dd>하루 카페인 300mg 이하 안에서 적당히 마실 수 있어요. 녹차는 엽산 흡수에 영향을 줄 수 있다는 이야기가 있어 많은 양은 피하고, 추출물 보충제는 먹지 않아요.</dd>
<dt>녹차 티백을 여러 번 우려도 되나요?</dt>
<dd>두세 번 우릴 수 있지만 우릴수록 성분과 맛이 옅어져요. 오래 둔 차는 위생상 새로 우려 마셔요.</dd>
</dl>
