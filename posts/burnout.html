  data-title="번아웃: 게으름이 아니라 오래 쌓인 소진, 우울증과 구별하고 회복하는 법"
  data-thumb="3가지|소진·냉소·효능감 저하"
  data-summary="번아웃은 일에서 오는 만성 스트레스가 제대로 풀리지 않아 생기는 상태예요. 세계보건기구가 정의한 세 가지 특징, 스스로 점검하는 질문, 우울증과 겹치는 부분과 다른 부분, 개인이 할 수 있는 회복법과 조직이 바꿔야 할 것, 진료가 필요한 신호를 정리했어요."
  data-tags="번아웃,직무스트레스,우울증,회복,건강상식">
<p class="lead">주말 내내 쉬어도 월요일 아침이 두렵고, 예전엔 보람 있던 일이 무의미하게 느껴지고, 무엇을 해도 해낼 수 없을 것 같은 기분. 번아웃은 의지가 약하거나 게을러서 생기는 게 아니에요. 감당해야 할 일이 회복할 수 있는 힘보다 오래 많았다는 신호예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>세계보건기구는 번아웃을 <strong>직장에서의 만성 스트레스가 제대로 관리되지 않아 생긴 증후군</strong>으로 정의해요.</li>
<li>특징은 <strong>에너지 고갈, 일에 대한 거리감·냉소, 업무 효능감 저하</strong> 세 가지예요.</li>
<li>번아웃은 <strong>우울증과 겹치기 쉬워요.</strong> 일 밖의 삶까지 무너졌다면 우울증을 확인해요.</li>
<li>회복은 개인의 휴식만으로 어렵고, <strong>일의 양과 방식</strong>을 함께 바꿔야 해요.</li>
</ul></div>

<h2>번아웃의 세 가지 특징</h2>
<div class="tbl"><table>
<thead><tr><th>특징</th><th>이렇게 느껴져요</th></tr></thead>
<tbody>
<tr><td>에너지 고갈</td><td>아침부터 지쳐 있어요. 쉬어도 피로가 풀리지 않아요</td></tr>
<tr><td>일에 대한 거리감·냉소</td><td>일과 동료, 고객에게 무관심해지거나 짜증이 나요. "어차피 소용없어"</td></tr>
<tr><td>효능감 저하</td><td>일을 잘 해내지 못한다고 느끼고, 실수가 늘고, 성취감이 사라져요</td></tr>
</tbody>
<caption>세계보건기구(WHO) 국제질병분류 제11판(ICD-11) QD85 '번아웃' 정의를 바탕으로 정리. 질병이 아닌 '직업 관련 현상'으로 분류돼요</caption></table></div>

<h2>몸과 마음에 나타나는 신호</h2>
<ul>
<li>잠들기 어렵거나, 자도 개운하지 않아요.</li>
<li>두통, 소화불량, 목·어깨 통증, 잦은 감기</li>
<li>집중력과 기억력이 떨어져요.</li>
<li>작은 일에도 짜증이 나거나 눈물이 나요.</li>
<li>술, 카페인, 단 음식, 스마트폰에 기대는 시간이 늘어요.</li>
<li>가족·친구와의 약속을 피하게 돼요.</li>
</ul>

<h2>스스로 점검해 보기</h2>
<p>지난 한 달을 돌아보며 아래 질문에 답해 보세요. 진단 도구는 아니지만 지금 상태를 알아보는 데 도움이 돼요.</p>
<ul>
<li>일이 끝나면 완전히 기진맥진한가요?</li>
<li>아침에 일하러 갈 생각만 해도 지치나요?</li>
<li>예전보다 일에 대한 관심과 열정이 크게 줄었나요?</li>
<li>내가 하는 일이 의미 있는지 의심스러운가요?</li>
<li>일을 잘 해낼 수 있다는 자신감이 줄었나요?</li>
</ul>
<p>여러 질문에 '자주' 또는 '항상'이라고 답했다면 쉬어 가는 방법을 찾아야 할 때예요.</p>

<h2>번아웃과 우울증</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>번아웃</th><th>우울증</th></tr></thead>
<tbody>
<tr><td>범위</td><td>주로 <strong>일과 관련된</strong> 영역에서 지치고 무기력해요</td><td>일뿐 아니라 <strong>삶 전반</strong>에서 흥미와 즐거움이 사라져요</td></tr>
<tr><td>휴가·환경 변화</td><td>일에서 떨어지면 조금 나아지는 경우가 많아요</td><td>쉬어도 나아지지 않는 경우가 많아요</td></tr>
<tr><td>자기 평가</td><td>일에서의 무능감</td><td>전반적인 무가치감, 죄책감</td></tr>
<tr><td>위험 신호</td><td>오래 지속되면 우울증으로 이어질 수 있어요</td><td>죽음에 대한 생각이 들 수 있어요</td></tr>
</tbody></table></div>
<p>실제로는 두 가지가 함께 오는 경우가 많아요. 기분 저하와 흥미 상실이 <strong>2주 넘게</strong> 거의 매일 이어지면 우울증 평가를 받아 보세요.</p>

<h2>회복을 위해 개인이 할 수 있는 것</h2>
<ul>
<li><strong>경계 긋기:</strong> 퇴근 후와 주말에 업무 연락 알림을 꺼요. 일을 떠올리지 않는 시간을 의도적으로 만들어요.</li>
<li><strong>기본 회복:</strong> 7시간 이상의 잠, 규칙적인 식사, 매일 20~30분 걷기. 가장 먼저 무너지는 것들이에요.</li>
<li><strong>일의 우선순위:</strong> 모든 일을 잘하려 하지 말고, 꼭 해야 할 일·미뤄도 되는 일·내려놓을 일을 나눠요.</li>
<li><strong>도움 요청:</strong> 상사나 동료에게 업무량을 솔직히 이야기해요. 혼자 버티는 것이 해결책이 아니에요.</li>
<li><strong>의미 되찾기:</strong> 일 밖에서 즐거움과 의미를 주는 활동(취미, 관계, 봉사)을 작게 다시 시작해요.</li>
<li><strong>휴가·휴직:</strong> 짧은 휴가는 도움이 되지만, 돌아왔을 때 환경이 그대로면 금방 원래대로 돌아가요. 필요하면 더 긴 휴식을 고려해요.</li>
</ul>

<h2>조직이 바꿔야 할 것</h2>
<p>번아웃의 원인은 개인보다 <strong>일의 구조</strong>에 있는 경우가 많아요. 연구자들은 번아웃을 부르는 여섯 가지 요인으로 과도한 업무량, 통제권 부족, 부족한 보상, 공동체의 붕괴, 불공정함, 가치의 충돌을 꼽아요. 업무량 조정, 결정권 부여, 인정과 보상, 공정한 절차가 함께 바뀌어야 해요. 사업장에 근로자지원프로그램(EAP)이 있다면 상담을 이용할 수 있어요.</p>

<div class="box warn"><span class="h">바로 도움이 필요한 신호</span>
<ul>
<li>살아갈 이유가 없다고 느끼거나 <strong>극단적인 생각</strong>이 들어요 → 자살예방 상담 <strong>109</strong>(24시간)</li>
<li>잠을 거의 못 자고, 식사를 거르고, 일상이 무너졌어요.</li>
<li>술이나 약에 기대는 양이 늘었어요.</li>
<li>가슴 두근거림, 숨참, 공황 같은 발작이 반복돼요.</li>
</ul>
<p>정신건강의학과, 지역 정신건강복지센터, 직장 내 상담 프로그램에 도움을 청할 수 있어요.</p></div>

<div class="box"><span class="h">회복 체크리스트</span>
<ol>
<li>퇴근 후·주말 업무 알림 끄기</li>
<li>잠·식사·걷기 기본부터 회복</li>
<li>할 일 목록에서 내려놓을 것 고르기</li>
<li>상사·동료에게 업무량 이야기하기</li>
<li>일 밖의 즐거움 하나 다시 시작</li>
<li>2주 넘는 우울감은 전문가 상담</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>번아웃은 병인가요?</dt>
<dd>세계보건기구는 번아웃을 질병이 아닌 '직업 관련 현상'으로 분류해요. 하지만 방치하면 우울증, 불안장애, 신체 질환으로 이어질 수 있어 가볍게 넘기지 않아요.</dd>
<dt>일을 그만둬야 나을까요?</dt>
<dd>꼭 그렇지는 않아요. 업무 조정, 부서 이동, 휴식으로 회복하는 경우도 많아요. 중요한 결정은 조금 회복된 뒤 차분히 내리는 게 좋아요.</dd>
<dt>육아나 간병으로도 번아웃이 오나요?</dt>
<dd>세계보건기구 정의는 직장에 한정하지만, 쉼 없이 누군가를 돌보는 일에서도 비슷한 소진이 흔해요. 돌봄 부담을 나누고, 지역의 돌봄 지원 서비스를 알아보세요.</dd>
</dl>
