  data-title="오십견(유착성 관절낭염): 팔이 안 올라가는 어깨, 회전근개 파열과 구별하고 스트레칭하기"
  data-thumb="1~3년|자연 경과"
  data-summary="어깨가 아프면서 점점 팔이 올라가지 않는 오십견은 저절로 좋아지지만 1~3년이 걸리기도 해요. 오십견의 세 단계, 회전근개 파열과 구별하는 방법, 당뇨 환자에게 흔한 이유, 주사와 약으로 통증을 줄이는 법, 집에서 하는 스트레칭, 시술이 필요한 경우를 정리했어요."
  data-tags="오십견,어깨통증,유착성관절낭염,회전근개,질병">
<p class="lead">머리를 빗거나 등 뒤로 속옷을 채우기가 어려워지고, 밤에 아픈 쪽으로 누우면 잠이 깰 만큼 아파요. 오십견은 어깨 관절을 감싼 주머니(관절낭)에 염증이 생기고 두꺼워져 들러붙는 병이에요. 시간이 지나면 좋아지지만, 그 시간을 덜 아프게, 덜 굳게 보내는 방법이 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>오십견은 <strong>통증기 → 강직기 → 회복기</strong>를 거쳐 보통 1~3년에 걸쳐 좋아져요.</li>
<li>남이 팔을 들어 줘도 <strong>안 올라가면 오십견</strong>, 남이 들어 주면 올라가면 <strong>회전근개 문제</strong>일 가능성이 커요.</li>
<li>초기 통증에는 <strong>관절 내 스테로이드 주사</strong>가 도움이 되고, 굳는 시기에는 <strong>스트레칭</strong>이 중요해요.</li>
<li><strong>당뇨, 갑상선 질환</strong>이 있으면 더 잘 생기고 오래가요.</li>
</ul></div>

<h2>누구에게 생길까</h2>
<ul>
<li>40~60대, 특히 여성에게 흔해요. '오십견'이라는 이름도 여기서 왔어요.</li>
<li><strong>당뇨</strong>가 있는 사람은 훨씬 잘 생기고, 양쪽 어깨에 오거나 오래가기도 해요.</li>
<li>갑상선 질환, 이상지질혈증</li>
<li>어깨 수술, 골절, 뇌졸중 등으로 팔을 오래 움직이지 못했을 때</li>
<li>뚜렷한 이유 없이 생기는 경우도 많아요.</li>
</ul>

<h2>세 단계</h2>
<div class="tbl"><table>
<thead><tr><th>단계</th><th>기간(대략)</th><th>특징</th></tr></thead>
<tbody>
<tr><td>통증기(얼어 가는 시기)</td><td class="num">2~9개월</td><td>통증이 점점 심해지고 특히 밤에 아파요. 움직임이 조금씩 줄어요</td></tr>
<tr><td>강직기(얼어 있는 시기)</td><td class="num">4~12개월</td><td>통증은 줄지만 어깨가 굳어 팔이 잘 안 올라가요</td></tr>
<tr><td>회복기(녹는 시기)</td><td class="num">5~24개월</td><td>움직임이 서서히 돌아와요</td></tr>
</tbody>
<caption>대한견주관절의학회 오십견 정보, 영국 어깨·팔꿈치학회(BESS) 진료 안내를 바탕으로 정리. 기간은 사람마다 크게 달라요</caption></table></div>

<h2>회전근개 파열과 구별하기</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>오십견</th><th>회전근개 파열·힘줄염</th></tr></thead>
<tbody>
<tr><td>스스로 팔 들기</td><td>잘 안 올라가요</td><td>아프거나 힘이 빠져 잘 안 올라가요</td></tr>
<tr><td>다른 사람이 들어 줄 때</td><td><strong>여전히 안 올라가요</strong>(관절이 굳음)</td><td><strong>올라가요</strong>(관절은 굳지 않음)</td></tr>
<tr><td>제한되는 방향</td><td>모든 방향, 특히 바깥으로 돌리기</td><td>특정 동작에서 아프고 약해요</td></tr>
<tr><td>나이</td><td>40~60대</td><td>50대 이후, 다친 뒤</td></tr>
</tbody></table></div>
<p>두 병은 치료가 달라요. 파열이 있는데 오십견인 줄 알고 억지로 스트레칭하면 더 나빠질 수 있어 진료로 확인하는 것이 좋아요. 초음파나 MRI로 구별할 수 있어요.</p>

<h2>치료</h2>
<ul>
<li><strong>진통제:</strong> 소염진통제나 아세트아미노펜으로 통증을 줄여 운동할 수 있게 해요.</li>
<li><strong>관절 내 스테로이드 주사:</strong> 통증기에 특히 효과적이에요. 통증과 움직임이 몇 주~몇 달 좋아지는 경우가 많아요. 당뇨가 있으면 주사 뒤 며칠 혈당이 오를 수 있어 확인해요.</li>
<li><strong>물리치료와 스트레칭:</strong> 굳는 것을 늦추고 움직임을 되찾아요.</li>
<li><strong>관절낭 팽창술:</strong> 관절 안에 식염수 등을 넣어 들러붙은 관절낭을 늘려요.</li>
<li><strong>마취하 도수 조작, 관절경 유리술:</strong> 오랫동안 좋아지지 않을 때 고려해요.</li>
</ul>

<h2>집에서 하는 스트레칭</h2>
<div class="box note"><span class="h">통증이 조금 느껴지는 정도까지만</span>
<ol>
<li><strong>시계추 운동:</strong> 성한 팔로 탁자를 짚고 허리를 숙여, 아픈 팔을 늘어뜨린 채 작은 원을 그리듯 흔들어요. 1~2분.</li>
<li><strong>벽 타고 오르기:</strong> 벽을 마주 보고 서서 손가락으로 벽을 짚고 천천히 위로 걸어 올라가요. 10번.</li>
<li><strong>막대 운동:</strong> 누워서 양손으로 막대(우산, 밀대)를 잡고, 성한 팔로 밀어 아픈 팔을 머리 위로 올려요.</li>
<li><strong>수건 스트레칭:</strong> 등 뒤로 수건 양끝을 잡고, 위쪽 손으로 당겨 아래쪽(아픈) 팔을 올려요.</li>
<li><strong>팔 가로지르기:</strong> 아픈 팔을 가슴 앞으로 가로질러 성한 손으로 당겨요. 20~30초 유지.</li>
</ol>
<p>하루 여러 번 짧게 해요. 운동 전 따뜻한 찜질로 근육을 풀면 편해요. 운동 뒤 통증이 몇 시간 넘게 심해지면 강도를 줄여요.</p></div>
<p>통증이 심한 시기에는 억지로 세게 늘리면 염증이 심해질 수 있어요. 시기에 맞게 강도를 조절하는 것이 중요해요.</p>

<h2>밤 통증 줄이기</h2>
<ul>
<li>아픈 쪽으로 눕지 않고, 바로 누울 때 아픈 팔 아래에 베개를 받쳐요.</li>
<li>옆으로 누울 때는 성한 쪽으로 누워 아픈 팔을 베개 위에 올려요.</li>
<li>잠들기 전 따뜻한 찜질이나 처방받은 진통제를 활용해요.</li>
</ul>

<div class="box warn"><span class="h">어깨 통증, 이럴 때는 바로 진료를</span>
<ul>
<li>넘어지거나 다친 뒤 팔을 전혀 들 수 없어요.</li>
<li>어깨가 빨갛게 붓고 열이 나요.</li>
<li>왼쪽 어깨·팔 통증이 <strong>가슴 답답함, 식은땀, 숨참</strong>과 함께 와요(심장 문제일 수 있어 119).</li>
<li>목에서 팔로 저린 통증이 뻗치고 손에 힘이 빠져요(목 디스크 가능성).</li>
</ul></div>

<div class="box"><span class="h">오십견 관리 체크리스트</span>
<ol>
<li>남이 들어 줘도 안 올라가는지 확인</li>
<li>진료로 회전근개 파열 여부 확인</li>
<li>통증기에는 약·주사로 통증부터 조절</li>
<li>하루 여러 번 짧은 스트레칭</li>
<li>당뇨가 있으면 혈당 관리도 함께</li>
<li>좋아지는 데 시간이 걸린다는 것 받아들이기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>오십견은 가만히 두면 낫나요?</dt>
<dd>대부분 시간이 지나며 좋아지지만 1~3년이 걸리기도 하고, 일부는 움직임이 완전히 돌아오지 않아요. 통증 조절과 스트레칭으로 기간을 덜 괴롭게 보내고, 좋아지지 않으면 시술을 고려해요.</dd>
<dt>다른 쪽 어깨에도 생기나요?</dt>
<dd>한쪽이 나은 뒤 반대쪽에 생기는 경우가 있어요. 같은 어깨에 다시 생기는 경우는 드물어요.</dd>
<dt>도수치료만으로 좋아지나요?</dt>
<dd>도움이 될 수 있지만, 통증이 심한 시기에 강한 도수치료는 오히려 악화시킬 수 있어요. 시기와 진단을 확인한 뒤 받아요.</dd>
</dl>
