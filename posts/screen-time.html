  data-summary="스마트폰과 태블릿은 아이의 일상에 깊이 들어와 있어요. 나이별 화면 사용 권고, 언어 발달·수면·시력·비만에 주는 영향, 영상 시청 시간보다 중요한 '무엇을, 누구와, 언제', 잠들기 전과 식사 시간의 원칙, 가족 미디어 약속 만들기, 지나친 사용이 걱정될 때의 신호를 정리했어요."

<p class="lead">식당에서 아이에게 스마트폰을 쥐여 주는 부모를 탓하기는 쉽지만, 하루하루 육아를 해 본 사람이라면 그 사정을 알아요. 화면을 완전히 없애기보다, 아이의 나이에 맞게 <strong>얼마나, 무엇을, 누구와</strong> 보는지를 조절하는 것이 현실적이고 효과도 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>2세 미만</strong>은 영상 통화를 빼고 화면 노출을 피하는 게 좋아요.</li>
<li><strong>2~5세</strong>는 하루 <strong>1시간 이내</strong>, 좋은 내용을 보호자와 함께 봐요.</li>
<li>나이와 상관없이 <strong>잠들기 1시간 전, 식사 시간, 침실</strong>에서는 화면을 멀리해요.</li>
<li>하루 <strong>2시간 바깥 활동</strong>은 근시 예방에 도움이 돼요.</li>
</ul></div>

<h2>나이별 권고</h2>
<div class="tbl"><table>
<thead><tr><th>나이</th><th>권고</th></tr></thead>
<tbody>
<tr><td>18개월 미만</td><td>영상 통화 외에는 화면을 보여 주지 않아요</td></tr>
<tr><td>18~24개월</td><td>보여 준다면 질 좋은 내용을 보호자가 함께 보며 이야기해요. 혼자 보게 두지 않아요</td></tr>
<tr><td>2~5세</td><td>하루 1시간 이내, 교육적이고 느린 속도의 내용을 함께 봐요. 적을수록 좋아요</td></tr>
<tr><td>6세 이상</td><td>시간과 내용에 일관된 규칙을 정해요. 잠, 운동, 숙제, 가족 시간을 먼저 확보해요</td></tr>
</tbody>
<caption>세계보건기구(WHO) 5세 미만 신체활동·좌식행동·수면 지침(2019), 미국소아과학회(AAP) 미디어 사용 권고를 바탕으로 정리</caption></table></div>

<h2>화면이 아이에게 주는 영향</h2>
<ul>
<li><strong>언어 발달:</strong> 어린아이는 화면보다 <strong>사람과 주고받는 대화</strong>에서 말을 배워요. 화면을 오래 볼수록 부모와 대화하는 시간이 줄어요.</li>
<li><strong>수면:</strong> 밤에 화면을 보면 잠들기 늦어지고 잠의 질이 떨어져요. 밝은 빛과 흥미로운 내용이 뇌를 깨워요.</li>
<li><strong>시력:</strong> 가까이 오래 보는 일이 많고 바깥 활동이 줄면 <strong>근시</strong>가 빨리 생기고 심해져요.</li>
<li><strong>체중:</strong> 앉아 있는 시간이 늘고, 보면서 간식을 먹고, 음식 광고에 노출돼요.</li>
<li><strong>주의력과 감정:</strong> 빠르고 자극적인 영상은 기다리기와 집중을 어렵게 할 수 있어요. 화면으로 아이를 달래는 습관이 굳으면 감정을 스스로 다루는 연습이 줄어요.</li>
</ul>

<h2>시간보다 중요한 것</h2>
<ul>
<li><strong>무엇을:</strong> 느린 속도, 교육적인 내용, 폭력적이지 않은 내용을 골라요. 자동 재생과 알고리즘 추천에 맡기지 않아요.</li>
<li><strong>누구와:</strong> 함께 보며 "저건 뭘까?", "어떤 기분이었을까?" 하고 이야기하면 배움이 늘어요.</li>
<li><strong>언제:</strong> 식사, 잠들기 전, 가족 대화 시간에는 화면을 끄는 원칙을 정해요.</li>
<li><strong>어디서:</strong> 스마트폰과 태블릿은 <strong>침실 밖</strong>, 가족이 함께 있는 공간에서 써요.</li>
</ul>

<h2>가족 미디어 약속 만들기</h2>
<div class="tbl"><table>
<thead><tr><th>약속 예</th><th>이유</th></tr></thead>
<tbody>
<tr><td>식사 시간에는 모두 휴대폰을 내려놓아요</td><td>대화와 천천히 먹는 습관</td></tr>
<tr><td>잠들기 1시간 전에는 화면을 꺼요</td><td>잠드는 시간과 잠의 질</td></tr>
<tr><td>충전은 거실에서 해요</td><td>밤중 사용 방지</td></tr>
<tr><td>숙제·바깥 놀이 뒤에 화면 시간</td><td>해야 할 일과 활동 먼저</td></tr>
<tr><td>타이머로 끝나는 시간을 미리 알려요</td><td>갑자기 뺏는 갈등 줄이기</td></tr>
<tr><td>어른도 같은 규칙을 지켜요</td><td>아이는 부모를 보고 배워요</td></tr>
</tbody>
<caption>미국소아과학회(AAP) Family Media Plan을 바탕으로 정리</caption></table></div>
<p>아이가 클수록 규칙을 함께 정해야 잘 지켜요. 벌로 스마트폰을 빼앗기보다, 약속을 지켰을 때 칭찬하는 편이 효과적이에요.</p>

<h2>근시와 바깥 활동</h2>
<p>어린이 근시는 동아시아에서 크게 늘고 있어요. 여러 연구에서 <strong>하루 2시간 안팎의 바깥 활동</strong>이 근시 발생을 줄였어요. 햇빛 아래에서 먼 곳을 보는 시간이 눈의 성장에 도움이 되는 것으로 보여요. 가까이 볼 때는 <strong>30cm 이상 거리</strong>를 두고, 20~30분마다 먼 곳을 보며 쉬게 해요.</p>

<div class="box warn"><span class="h">지나친 사용이 걱정되는 신호</span>
<ul>
<li>화면을 끄자고 하면 <strong>심하게 화내거나 울며</strong> 오래 진정하지 못해요.</li>
<li>잠, 식사, 숙제, 친구와의 놀이보다 화면을 먼저 찾아요.</li>
<li>몰래 사용하거나 거짓말을 해요.</li>
<li>학교생활, 성적, 친구 관계에 문제가 생겼어요.</li>
<li>또래보다 말이 늦거나 눈맞춤과 상호작용이 적어요(발달 평가 필요).</li>
</ul>
<p>이런 신호가 있으면 소아청소년과, 발달 전문가, 지역 청소년상담복지센터나 스마트쉼센터에 상담할 수 있어요.</p></div>

<div class="box"><span class="h">미디어 사용 체크리스트</span>
<ol>
<li>2세 미만은 영상 통화 외 화면 피하기</li>
<li>2~5세는 하루 1시간 이내, 함께 보기</li>
<li>식사·잠들기 전 화면 끄기</li>
<li>기기는 침실 밖에서 충전</li>
<li>하루 2시간 바깥 놀이</li>
<li>가족 모두 같은 규칙 지키기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>교육용 앱은 괜찮지 않나요?</dt>
<dd>일부 교육용 내용은 도움이 될 수 있지만, 어린아이일수록 화면보다 실제 놀이와 대화에서 더 많이 배워요. 교육용이라도 시간과 함께 보기 원칙을 지켜요.</dd>
<dt>식당에서 아이가 너무 보채면요?</dt>
<dd>가끔 쓰는 것은 괜찮아요. 다만 매번 화면으로 달래기보다 색칠 도구, 작은 장난감, 음식 이야기처럼 다른 방법도 함께 준비해 보세요.</dd>
<dt>청소년의 SNS 사용은 어떻게 하나요?</dt>
<dd>나이 제한을 지키고, 사생활 설정과 낯선 사람의 연락, 사이버 괴롭힘에 대해 미리 이야기해요. 밤에는 휴대폰을 침실 밖에 두는 규칙이 특히 도움이 돼요.</dd>
</dl>
