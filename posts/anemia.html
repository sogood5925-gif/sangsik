  data-title="빈혈: 어지러움보다 피로가 먼저, 원인을 찾아야 하는 이유와 검사 읽는 법"
  data-thumb="12g/dL|여성 혈색소 기준"
  data-summary="빈혈은 병 이름이라기보다 '무언가 원인이 있다'는 신호예요. 혈색소 기준과 흔한 증상, 철 결핍·비타민 B12 결핍·만성질환 등 원인별 특징, 페리틴과 평균적혈구용적 같은 검사 수치 읽는 법, 남성과 폐경 후 여성의 빈혈에서 위장 출혈을 확인해야 하는 이유를 정리했어요."
  data-tags="빈혈,혈색소,페리틴,철결핍,질병">
<p class="lead">"빈혈이면 철분제 먹으면 되지"라고 생각하기 쉬워요. 하지만 빈혈은 원인이 여러 가지이고, 그중에는 위나 대장에서 조금씩 피가 새는 것처럼 꼭 찾아야 하는 원인도 있어요. 수치를 올리는 것만큼 <strong>왜 떨어졌는지</strong>가 중요해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>혈색소가 <strong>남성 13g/dL, 여성 12g/dL 미만</strong>이면 빈혈로 봐요(세계보건기구 기준).</li>
<li>가장 흔한 원인은 <strong>철 결핍</strong>이고, 비타민 B12·엽산 결핍, 만성질환, 유전성 빈혈도 있어요.</li>
<li><strong>남성과 폐경 후 여성</strong>의 철 결핍 빈혈은 위장관 출혈을 확인하기 위해 내시경 검사를 권해요.</li>
<li>원인을 모른 채 철분제를 오래 먹지 않아요. 검사로 원인을 먼저 확인해요.</li>
</ul></div>

<h2>빈혈의 기준</h2>
<p>빈혈은 혈액 속 <strong>혈색소(헤모글로빈)</strong>가 부족한 상태예요. 혈색소는 적혈구 안에서 산소를 온몸으로 나르는 단백질이에요.</p>
<div class="tbl"><table>
<thead><tr><th>대상</th><th class="num">빈혈 기준(혈색소)</th></tr></thead>
<tbody>
<tr><td>성인 남성</td><td class="num">13g/dL 미만</td></tr>
<tr><td>성인 여성(임신하지 않음)</td><td class="num">12g/dL 미만</td></tr>
<tr><td>임신부</td><td class="num">11g/dL 미만(임신 중기는 10.5)</td></tr>
<tr><td>6개월~5세 어린이</td><td class="num">10.5~11g/dL 미만(나이별)</td></tr>
</tbody>
<caption>세계보건기구(WHO) 빈혈 진단 기준을 바탕으로 정리. 검사 기관의 참고치와 조금 다를 수 있어요</caption></table></div>

<h2>이런 증상이 있어요</h2>
<ul>
<li><strong>쉽게 피곤하고</strong> 기운이 없어요. 가장 흔한 증상이에요.</li>
<li>계단을 오르거나 조금만 움직여도 <strong>숨이 차고 가슴이 두근거려요.</strong></li>
<li>얼굴, 입술 안쪽, 눈꺼풀 안쪽이 창백해요.</li>
<li>두통, 집중력 저하, 손발이 차요.</li>
<li>철 결핍이 심하면 손톱이 얇아지거나 숟가락처럼 오목해지고, <strong>얼음이나 흙을 씹고 싶은</strong> 이상한 식욕(이식증)이 생기기도 해요. 잠들 때 다리가 불편한 하지불안 증상이 심해질 수도 있어요.</li>
</ul>
<p>천천히 진행된 빈혈은 몸이 적응해서 수치가 꽤 낮아도 증상이 약할 수 있어요. 건강검진에서 처음 발견되는 경우가 많아요.</p>

<h2>원인별 특징</h2>
<div class="tbl"><table>
<thead><tr><th>원인</th><th>특징</th><th>흔한 대상</th></tr></thead>
<tbody>
<tr><td>철 결핍</td><td>적혈구가 작고 옅어져요(평균적혈구용적 낮음). 페리틴이 낮아요</td><td>월경량이 많은 여성, 임신부, 성장기, 위장관 출혈</td></tr>
<tr><td>비타민 B12·엽산 결핍</td><td>적혈구가 커져요. B12 결핍은 손발 저림, 기억력 저하가 함께 올 수 있어요</td><td>위 절제 수술, 채식, 메트포르민 장기 복용, 노인</td></tr>
<tr><td>만성질환 빈혈</td><td>염증 때문에 철이 있어도 잘 쓰지 못해요</td><td>류마티스 관절염, 만성 감염, 암</td></tr>
<tr><td>만성 콩팥병</td><td>적혈구 생성을 돕는 호르몬(에리트로포이에틴)이 줄어요</td><td>콩팥 기능이 떨어진 사람</td></tr>
<tr><td>유전성(지중해빈혈 등)</td><td>적혈구가 작지만 철은 부족하지 않아요. 철분제가 도움이 안 돼요</td><td>가족력이 있는 사람</td></tr>
<tr><td>용혈, 골수 질환</td><td>적혈구가 빨리 깨지거나 만들어지지 않아요</td><td>드물지만 정밀 검사가 필요해요</td></tr>
</tbody></table></div>

<h2>검사 수치 읽는 법</h2>
<ul>
<li><strong>혈색소(Hb):</strong> 빈혈이 있는지와 정도를 알려 줘요.</li>
<li><strong>평균적혈구용적(MCV):</strong> 적혈구 크기예요. 작으면 철 결핍이나 지중해빈혈, 크면 B12·엽산 결핍을 떠올려요.</li>
<li><strong>페리틴:</strong> 몸에 저장된 철의 양을 반영해요. 낮으면 철 결핍을 강하게 시사해요. 다만 염증이 있으면 실제보다 높게 나올 수 있어요.</li>
<li><strong>망상적혈구:</strong> 골수가 새 적혈구를 잘 만들고 있는지 보여 줘요.</li>
</ul>
<p>수치 해석은 여러 결과를 함께 봐야 해요. 결과지를 받으면 의사와 원인을 함께 확인해요.</p>

<h2>꼭 원인을 찾아야 하는 경우</h2>
<div class="box warn"><span class="h">이런 빈혈은 추가 검사가 필요해요</span>
<ul>
<li><strong>남성이나 폐경 후 여성의 철 결핍 빈혈:</strong> 위궤양, 위암, 대장암처럼 위장관에서 조금씩 피가 새는 원인을 확인하기 위해 <strong>위·대장 내시경</strong>을 권해요.</li>
<li>검거나 붉은 변, 체중 감소, 복통이 함께 있어요.</li>
<li>월경량이 갑자기 많아졌어요(자궁근종 등 확인).</li>
<li>철분제를 먹어도 수치가 오르지 않아요.</li>
</ul></div>
<div class="box warn"><span class="h">바로 진료가 필요한 증상</span>
<p>가만히 있어도 숨이 차거나 가슴이 아플 때, 쓰러질 것 같은 어지러움, 검은 변이나 피를 토함이 있으면 응급 진료를 받아요.</p></div>

<h2>치료</h2>
<ul>
<li><strong>철 결핍:</strong> 먹는 철분제를 몇 달 먹어요. 혈색소는 몇 주 안에 오르기 시작하지만, 저장된 철(페리틴)까지 채우려면 수치가 정상이 된 뒤에도 한동안 더 먹어요. 흡수가 안 되거나 부작용이 심하면 주사로 보충하기도 해요.</li>
<li><strong>B12 결핍:</strong> 원인에 따라 먹는 약이나 주사로 보충해요. 흡수 장애가 원인이면 주사가 필요할 수 있어요.</li>
<li><strong>원인 치료:</strong> 출혈 원인, 만성질환, 콩팥 질환을 함께 치료해요.</li>
</ul>
<p>철분제는 검은 변, 변비, 속쓰림을 일으킬 수 있어요. 부작용이 있으면 복용법을 의사·약사와 상의해요.</p>

<h2>철분제를 함부로 먹으면 안 되는 이유</h2>
<p>지중해빈혈이나 만성질환 빈혈은 철이 부족하지 않아 철분제가 도움이 되지 않고, 철이 너무 많이 쌓이면 간과 심장에 해로울 수 있어요. 또 철분제로 수치만 올리면 위장관 출혈 같은 원인을 놓칠 수 있어요.</p>

<h2>음식으로 챙기기</h2>
<ul>
<li>살코기, 간, 조개류의 <strong>헴철</strong>은 흡수가 잘 돼요.</li>
<li>콩, 시금치, 해조류의 비헴철은 <strong>비타민 C</strong>가 많은 채소·과일과 함께 먹으면 흡수가 늘어요.</li>
<li>식사 직후 녹차와 커피는 흡수를 방해하니 1~2시간 간격을 둬요.</li>
</ul>
<p>음식만으로는 이미 생긴 빈혈을 빠르게 회복하기 어려워요. 진단받은 빈혈은 치료와 함께 식사를 챙겨요.</p>

<div class="box"><span class="h">빈혈 관리 체크리스트</span>
<ol>
<li>검진 결과의 혈색소·평균적혈구용적 확인</li>
<li>빈혈이면 원인 검사(페리틴, B12 등) 받기</li>
<li>남성·폐경 후 여성은 내시경 상담</li>
<li>철분제는 정해진 기간 끝까지</li>
<li>2~3개월 뒤 다시 검사해 효과 확인</li>
<li>검은 변, 숨참이 있으면 바로 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>일어날 때 핑 도는 것도 빈혈인가요?</dt>
<dd>갑자기 일어날 때 어지러운 것은 대부분 혈압이 순간적으로 떨어지는 기립성 저혈압이에요. 빈혈과는 다를 수 있어요. 자주 반복되거나 쓰러진 적이 있으면 진료를 받아요.</dd>
<dt>빈혈이 있으면 헌혈하면 안 되나요?</dt>
<dd>헌혈 전 검사에서 혈색소가 기준보다 낮으면 헌혈할 수 없어요. 빈혈을 치료하고 수치가 회복된 뒤에 할 수 있어요.</dd>
<dt>철분제는 언제 먹는 게 좋나요?</dt>
<dd>공복에 흡수가 잘 되지만 속이 불편하면 식후에 먹어도 돼요. 최근에는 하루걸러 먹는 방법이 흡수와 부작용 면에서 나을 수 있다는 연구도 있어요. 복용법은 의사·약사와 상의해요.</dd>
</dl>
