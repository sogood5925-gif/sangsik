  data-title="임신 중 영양: 두 사람 몫이 아니라 두 사람을 위한 식사, 시기별 추가 열량과 철·엽산·요오드, 피할 음식"
  data-thumb="+340kcal|임신 중기 추가 열량"
  data-summary="임신 중에는 먹는 양보다 무엇을 먹느냐가 더 중요해요. 임신 시기별 추가 열량과 단백질, 엽산·철·요오드·칼슘·비타민 D 필요량, 체중 증가의 목표 범위, 입덧 때 먹는 요령, 리스테리아·수은·비타민 A처럼 조심할 음식과 성분, 임신성 당뇨가 있을 때를 정리했어요."

<p class="lead">"이제 두 사람 몫을 먹어야지"라는 말을 자주 듣지만, 실제로 임신 초기에는 열량이 거의 더 필요하지 않고, 중기 이후에도 밥 한 공기 남짓이 더해지는 정도예요. 대신 아기의 몸을 만드는 단백질, 철, 엽산, 요오드 같은 영양소는 눈에 띄게 늘어나요. 양보다 질을 챙기는 식사가 핵심이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>추가 열량은 <strong>초기 0, 중기 +340kcal, 후기 +450kcal</strong> 정도예요.</li>
<li><strong>엽산, 철, 요오드, 단백질</strong> 필요량이 늘어요. 철은 음식만으로 채우기 어려워 보충제를 권해요.</li>
<li>체중 증가는 <strong>임신 전 체중</strong>에 따라 목표 범위가 달라요.</li>
<li><strong>술은 전혀 마시지 않고</strong>, 날것과 비살균 유제품, 큰 생선, 고용량 비타민 A를 피해요.</li>
</ul></div>

<h2>시기별 추가 필요량</h2>
<div class="tbl"><table>
<thead><tr><th>영양소</th><th class="num">임신부 추가(하루)</th><th>메모</th></tr></thead>
<tbody>
<tr><td>열량</td><td class="num">초기 +0 / 중기 +340kcal / 후기 +450kcal</td><td>중기 추가량은 밥 1공기 남짓</td></tr>
<tr><td>단백질</td><td class="num">초기 +0 / 중기 +15g / 후기 +30g</td><td>달걀·두부·생선·살코기·우유</td></tr>
<tr><td>엽산</td><td class="num">+220μg DFE(총 620μg)</td><td>임신 전부터 보충제 400μg 권장</td></tr>
<tr><td>철</td><td class="num">+10mg(총 24mg)</td><td>임신 중기부터 보충제가 흔히 필요</td></tr>
<tr><td>요오드</td><td class="num">+90μg(총 240μg)</td><td>김·미역 적당히. 과량은 피해요</td></tr>
<tr><td>칼슘</td><td class="num">+0mg(성인 기준 700mg)</td><td>흡수율이 올라가요. 기준량을 꾸준히</td></tr>
<tr><td>비타민 D</td><td class="num">+0μg(충분섭취량 10μg)</td><td>부족하기 쉬워 검사 후 보충</td></tr>
</tbody>

<h2>체중은 얼마나 늘까</h2>
<div class="tbl"><table>
<thead><tr><th>임신 전 체질량지수</th><th class="num">권장 체중 증가(단태아)</th></tr></thead>
<tbody>
<tr><td>저체중(18.5 미만)</td><td class="num">12.5~18kg</td></tr>
<tr><td>정상(18.5~24.9)</td><td class="num">11.5~16kg</td></tr>
<tr><td>과체중(25~29.9)</td><td class="num">7~11.5kg</td></tr>
<tr><td>비만(30 이상)</td><td class="num">5~9kg</td></tr>
</tbody>
<caption>미국 국립의학원(IOM) 임신 중 체중 증가 권고(2009). 아시아인은 체질량지수 기준을 낮춰 적용하자는 의견도 있어 담당 의사와 목표를 정해요</caption></table></div>
<p>너무 적게 늘면 저체중아, 너무 많이 늘면 임신성 당뇨·임신중독증·거대아 위험이 올라가요. 임신 중 무리한 다이어트는 하지 않아요.</p>

<h2>철과 엽산</h2>
<ul>
<li><strong>엽산:</strong> 임신 계획 때부터 임신 12주까지 하루 400μg 보충제를 먹고, 녹색 채소와 콩도 챙겨요.</li>
<li><strong>철:</strong> 태아와 태반, 늘어난 엄마의 혈액량 때문에 많이 필요해요. 빈혈 검사를 받고 의사가 권하는 양의 철분제를 먹어요. 비타민 C와 함께, 차·커피·칼슘제와는 시간 간격을 둬요. 변비가 생기면 물과 식이섬유를 늘리고 의사와 상의해요.</li>
</ul>

<h2>입덧 때 먹는 요령</h2>
<ul>
<li>빈속이 입덧을 키워요. <strong>조금씩 자주</strong>, 크래커나 누룽지처럼 담백한 것을 가까이 둬요.</li>
<li>냄새가 적은 <strong>차가운 음식</strong>이 편할 수 있어요.</li>
<li>물은 식사와 따로, 조금씩 자주 마셔요.</li>
<li>생강이 도움이 된다는 연구가 있어요.</li>
<li>물도 못 마시고 소변이 줄거나 체중이 빠지면 <strong>임신오조증</strong>일 수 있어 병원에 가요.</li>
</ul>

<div class="box warn"><span class="h">피하거나 조심할 음식</span>
<ul>
<li><strong>술:</strong> 임신 중 안전한 양은 없어요.</li>
<li><strong>리스테리아 위험 식품:</strong> 날고기, 덜 익힌 달걀, 비살균 우유·치즈, 훈제 생선, 오래 냉장 보관한 조리 식품, 날로 먹는 팽이버섯</li>
<li><strong>수은이 많은 생선:</strong> 다랑어, 새치, 상어는 주 100g 이하. 일반 생선은 주 400g 이하</li>
<li><strong>고용량 비타민 A(레티놀):</strong> 간을 자주 많이 먹거나 레티놀 보충제를 먹지 않아요. 기형 위험이 있어요.</li>
<li><strong>카페인:</strong> 하루 300mg 이하</li>
<li><strong>검증되지 않은 한약·건강기능식품:</strong> 의사와 상의 없이 먹지 않아요.</li>
</ul></div>

<h2>임신성 당뇨가 있다면</h2>
<p>임신 24~28주에 받는 당부하 검사에서 임신성 당뇨로 진단받으면, 탄수화물을 세 끼와 간식으로 <strong>고르게 나누고</strong>, 흰밥·단 음료·과일 주스를 줄이고, 식후에 가볍게 걸어요. 혈당을 스스로 재며 조절하고, 필요하면 인슐린을 써요. 아기를 위해 굶거나 탄수화물을 지나치게 줄이지 않아요.</p>

<div class="box"><span class="h">임신 중 식사 체크리스트</span>
<ol>
<li>양보다 질, 중기부터 조금 더</li>
<li>엽산·철분제 처방대로</li>
<li>단백질 반찬 매끼</li>
<li>우유·유제품·칼슘 식품 매일</li>
<li>날것·비살균 유제품·큰 생선 피하기</li>
<li>체중 증가는 목표 범위 안에서</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>과일은 많이 먹을수록 좋지 않나요?</dt>
<dd>과일도 당이 많아 지나치면 체중과 혈당이 올라요. 하루 1~2회 적당량을 먹어요.</dd>
<dt>종합비타민을 먹어야 하나요?</dt>
<dd>임신부용 종합비타민은 엽산, 철, 요오드 등을 한 번에 채우기 편해요. 비타민 A가 레티놀 형태로 많이 든 제품은 피하고, 따로 먹는 철분제와 겹치는지 의사와 확인해요.</dd>
<dt>매운 음식을 먹으면 아기에게 안 좋나요?</dt>
<dd>매운 음식이 아기에게 해롭다는 근거는 없어요. 다만 임신 중 속쓰림이 심해질 수 있어 불편하면 줄여요.</dd>
</dl>
