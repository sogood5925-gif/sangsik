  data-title="채식 영양: 비건이라면 비타민 B12는 꼭 보충, 철·칼슘·오메가-3 채우는 법, 아이와 임신 중 채식"
  data-thumb="B12|비건 필수 보충 영양소"
  data-summary="잘 계획한 채식은 모든 연령에서 건강하게 할 수 있지만, 몇 가지 영양소는 의식해서 챙겨야 해요. 채식의 종류, 비건에게 반드시 필요한 비타민 B12 보충, 식물성 식품으로 철·아연·칼슘·요오드·오메가-3와 단백질을 채우는 방법, 임신부와 아이가 채식할 때 확인할 점, 결핍 신호를 정리했어요."
  data-tags="채식,비건,비타민B12,식물성단백질,영양소">
<p class="lead">건강, 동물, 환경을 이유로 채식을 선택하는 사람이 늘고 있어요. 채소와 콩, 통곡물을 중심으로 한 식사는 심혈관 질환과 당뇨 위험이 낮은 것과 관련이 있어요. 다만 동물성 식품에만 주로 있는 영양소가 있어서, 몇 가지를 알고 채우면 오래 건강하게 이어 갈 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>동물성 식품을 전혀 먹지 않는 <strong>비건</strong>은 <strong>비타민 B12 보충제나 강화식품</strong>이 반드시 필요해요.</li>
<li><strong>철, 아연, 칼슘, 비타민 D, 요오드, 오메가-3</strong>는 의식해서 챙겨요.</li>
<li>단백질은 <strong>콩, 두부, 렌틸콩, 견과류, 통곡물</strong>을 골고루 먹으면 충분해요.</li>
<li><strong>임신부와 아이</strong>의 채식은 의사·영양사와 계획을 세워요.</li>
</ul></div>

<h2>채식의 종류</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>먹는 것</th></tr></thead>
<tbody>
<tr><td>비건(완전 채식)</td><td>식물성 식품만. 우유, 달걀, 꿀도 먹지 않아요</td></tr>
<tr><td>락토 채식</td><td>식물성 + 유제품</td></tr>
<tr><td>락토-오보 채식</td><td>식물성 + 유제품 + 달걀</td></tr>
<tr><td>페스코 채식</td><td>위에 더해 생선·해산물</td></tr>
<tr><td>플렉시테리언</td><td>주로 채식을 하고 가끔 고기도 먹어요</td></tr>
</tbody>
<caption>한국채식연합, 미국 영양및식이요법학회(Academy of Nutrition and Dietetics) 자료를 바탕으로 정리</caption></table></div>
<p>동물성 식품을 많이 빼는 채식일수록 챙겨야 할 영양소가 늘어요.</p>

<h2>챙겨야 할 영양소</h2>
<div class="tbl"><table>
<thead><tr><th>영양소</th><th>식물성 공급원과 요령</th></tr></thead>
<tbody>
<tr><td>비타민 B12</td><td>식물에는 거의 없어요. 비건은 <strong>보충제</strong>나 B12 강화 두유·시리얼이 꼭 필요해요. 락토-오보는 우유·달걀로 일부 채우지만 부족하면 보충해요</td></tr>
<tr><td>철</td><td>콩, 두부, 렌틸콩, 시금치, 톳, 통곡물. <strong>비타민 C</strong>(과일, 채소)와 함께 먹고, 차·커피는 식간에</td></tr>
<tr><td>아연</td><td>콩, 견과류, 씨앗, 통곡물. 콩을 불리거나 발효하면 흡수가 좋아져요</td></tr>
<tr><td>칼슘</td><td>칼슘 강화 두유, 칼슘 응고제로 만든 두부, 케일·청경채 같은 잎채소, 참깨</td></tr>
<tr><td>비타민 D</td><td>햇볕, 비타민 D 강화 식품, 햇볕 쬔 버섯. 부족하면 보충제</td></tr>
<tr><td>요오드</td><td>김, 미역 등 해조류(적당히), 요오드 첨가 소금</td></tr>
<tr><td>오메가-3</td><td>들기름, 들깨, 아마씨, 호두(ALA). EPA·DHA는 미세조류 기름 보충제로</td></tr>
<tr><td>단백질</td><td>콩, 두부, 템페, 렌틸콩, 병아리콩, 견과류, 통곡물을 하루에 여러 번</td></tr>
</tbody>
<caption>미국 영양및식이요법학회 채식 입장문(2016), 미국 국립보건원(NIH) 영양보충제국, 보건복지부·한국영양학회 섭취기준을 바탕으로 정리</caption></table></div>

<h2>비타민 B12가 부족하면</h2>
<p>B12는 몸에 저장된 양이 있어 채식을 시작하고 <strong>몇 년 뒤에야</strong> 부족 증상이 나타날 수 있어요. 그 사이 조용히 신경이 손상될 수 있어서 미리 보충하는 것이 중요해요.</p>
<ul>
<li>피로, 숨참, 창백함(거대적아구성 빈혈)</li>
<li>손발 저림, 균형 감각 저하, 기억력 저하</li>
<li>혀가 붓고 아픔</li>
</ul>
<p>엽산을 많이 먹으면 빈혈은 가려지지만 신경 손상은 진행될 수 있어요. 오래 채식했다면 혈액 검사로 B12 상태를 확인해 보세요.</p>

<div class="box warn"><span class="h">임신부와 아이의 채식</span>
<ul>
<li><strong>임신·수유 중 비건</strong>이라면 B12, 철, 요오드, 오메가-3(DHA), 칼슘, 비타민 D를 특히 챙기고 산부인과와 상의해요. 엄마의 B12 결핍은 아기의 발달에 심각한 영향을 줄 수 있어요.</li>
<li><strong>영유아와 아이</strong>는 몸집에 비해 필요한 열량과 영양이 많아요. 채소와 섬유질만으로는 배가 불러 충분히 먹지 못할 수 있어요. 콩, 견과 버터, 기름을 활용하고 소아청소년과·영양사와 성장을 함께 확인해요.</li>
<li>아이가 처지거나, 잘 자라지 않거나, 발달이 늦어 보이면 바로 진료를 받아요.</li>
</ul></div>

<h2>하루 식단 예(락토-오보 채식)</h2>
<ul>
<li><strong>아침:</strong> 잡곡밥, 두부 된장국, 시금치나물, 달걀말이</li>
<li><strong>점심:</strong> 병아리콩 채소 카레, 현미밥, 김치, 귤</li>
<li><strong>간식:</strong> 플레인 요거트에 호두와 아마씨</li>
<li><strong>저녁:</strong> 콩비지찌개, 들기름 두른 버섯볶음, 청경채무침, 김</li>
</ul>

<div class="box"><span class="h">채식 영양 체크리스트</span>
<ol>
<li>비건이면 B12 보충 필수</li>
<li>매끼 콩·두부 등 단백질</li>
<li>철분 식품은 비타민 C와 함께</li>
<li>칼슘 강화 두유·두부 활용</li>
<li>들기름·호두로 오메가-3</li>
<li>1~2년마다 B12·철·비타민 D 검사</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>콩만 먹으면 단백질이 불완전하지 않나요?</dt>
<dd>하루 동안 콩, 곡물, 견과류를 골고루 먹으면 필수 아미노산을 충분히 채울 수 있어요. 한 끼에 꼭 맞춰 먹을 필요는 없어요.</dd>
<dt>채식하면 빈혈이 잘 생기나요?</dt>
<dd>채식하는 사람의 철 저장량이 조금 낮은 경향은 있지만, 빈혈 비율이 크게 높지는 않다는 연구가 많아요. 생리량이 많은 여성은 정기적으로 확인해요.</dd>
<dt>채식 가공식품은 건강한가요?</dt>
<dd>대체육, 채식 과자도 나트륨과 지방이 많은 초가공식품일 수 있어요. 채식도 가공이 덜 된 식품 위주로 먹는 것이 좋아요.</dd>
</dl>
