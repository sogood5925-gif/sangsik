  data-title="폭설과 빙판길: 펭귄처럼 걷기, 도로 살얼음 운전, 눈 치우다 쓰러지지 않기"
  data-thumb="2배|빙판길 차간거리"
  data-summary="겨울 눈과 얼음은 낙상, 교통사고, 심장 사고를 부르는 계절 위험이에요. 대설 특보 기준, 빙판길에서 넘어지지 않게 걷는 법과 넘어졌을 때 대처, 다리 위와 그늘진 도로의 살얼음 운전 요령, 눈 치우기 전 알아야 할 심장 부담과 지붕 붕괴, 동상 예방까지 정리했어요."
  data-tags="폭설,빙판길,블랙아이스,낙상,생활정보">
<p class="lead">눈이 내린 다음 날 아침이 오히려 더 위험해요. 밤사이 녹았던 눈이 얼어 투명한 얼음막이 생기고, 겉으로는 젖은 길처럼 보여요. 겨울철 응급실에는 빙판길에서 넘어져 손목과 엉덩이뼈가 부러진 사람과, 눈을 치우다 가슴 통증으로 쓰러진 사람이 늘어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>빙판길은 <strong>보폭을 줄이고 발바닥 전체로</strong>, 손은 주머니에서 빼고 걸어요.</li>
<li>다리 위, 터널 출입구, 그늘진 길은 <strong>살얼음(블랙아이스)</strong>이 잘 생겨요. 속도를 줄이고 차간거리를 <strong>평소의 2배 이상</strong> 둬요.</li>
<li>눈 치우기는 <strong>심장에 큰 부담</strong>이에요. 심장병이 있거나 나이가 많다면 쉬어 가며 조금씩 해요.</li>
<li>넘어진 뒤 <strong>엉덩이 통증으로 일어서기 어렵다면</strong> 억지로 일어나지 말고 도움을 청해요.</li>
</ul></div>

<h2>대설 특보</h2>
<div class="tbl"><table>
<thead><tr><th>특보</th><th>기준(24시간 새로 쌓인 눈)</th></tr></thead>
<tbody>
<tr><td>대설주의보</td><td>5cm 이상 예상</td></tr>
<tr><td>대설경보</td><td>20cm 이상 예상(산지는 30cm 이상)</td></tr>
</tbody>
<caption>기상청 기상특보 발표 기준을 바탕으로 정리</caption></table></div>
<p>습기를 많이 머금은 무거운 눈은 적게 쌓여도 비닐하우스, 가건물, 오래된 지붕을 무너뜨릴 수 있어요.</p>

<h2>빙판길 걷기</h2>
<ul>
<li><strong>펭귄처럼</strong> 보폭을 좁히고, 무게 중심을 앞에 두고, 발바닥 전체로 천천히 디뎌요.</li>
<li><strong>손은 주머니에서 빼요.</strong> 넘어질 때 손으로 짚지 못하면 머리와 얼굴을 다쳐요. 장갑을 끼고 가방은 백팩으로 메요.</li>
<li>밑창이 닳지 않고 홈이 깊은 신발, 미끄럼 방지 신발을 신어요. 어르신은 간이 아이젠이나 지팡이를 쓰면 좋아요.</li>
<li>계단은 난간을 잡고, 맨홀 뚜껑·점자블록·타일 바닥처럼 매끈한 곳을 피해요.</li>
<li>건물 입구의 젖은 바닥도 미끄러워요. 들어가자마자 발을 털어요.</li>
<li>휴대폰을 보며 걷지 않아요.</li>
</ul>

<h2>넘어졌을 때</h2>
<ul>
<li>바로 일어나지 말고 잠시 몸 상태를 살펴요.</li>
<li>어르신이 넘어진 뒤 <strong>엉덩이·허벅지 통증으로 서지 못하거나, 다리가 짧아 보이거나 바깥으로 돌아가 있으면</strong> 고관절 골절일 수 있어요. 억지로 일으키지 말고 119를 불러요.</li>
<li>손을 짚은 뒤 손목이 붓고 휘어 보이면 부목을 대고 병원에 가요.</li>
<li>머리를 부딪혔다면 하루 이틀 동안 두통, 구토, 졸림이 없는지 살펴요. 항응고제를 먹는 사람은 특히 조심해요.</li>
</ul>

<h2>눈길·빙판길 운전</h2>
<div class="tbl"><table>
<thead><tr><th>상황</th><th>요령</th></tr></thead>
<tbody>
<tr><td>출발 전</td><td>차 지붕과 유리, 라이트의 눈을 모두 치워요. 겨울용 타이어나 체인을 준비해요</td></tr>
<tr><td>속도와 거리</td><td>평소보다 속도를 크게 줄이고, 앞차와 거리를 2배 이상 둬요</td></tr>
<tr><td>살얼음 구간</td><td>다리 위, 터널 출입구, 그늘진 커브, 새벽 시간대를 특히 조심해요</td></tr>
<tr><td>제동</td><td>급브레이크, 급핸들을 피하고, 브레이크를 여러 번 나눠 부드럽게 밟아요</td></tr>
<tr><td>내리막</td><td>저단 기어(엔진 브레이크)를 써서 천천히 내려가요</td></tr>
<tr><td>미끄러질 때</td><td>당황해 브레이크를 세게 밟지 말고, 가고 싶은 방향으로 핸들을 부드럽게 돌려요</td></tr>
</tbody>
<caption>한국도로공사·도로교통공단 겨울철 안전운전 요령을 바탕으로 정리</caption></table></div>
<p>폭설로 고립됐다면 배기구가 눈에 막히지 않았는지 확인하고, 시동을 켠 채 잠들지 않아요. 일산화탄소 중독 위험이 있어요.</p>

<h2>눈 치우기와 심장</h2>
<p>무거운 눈을 삽으로 퍼 올리는 일은 짧은 시간에 심장에 큰 부담을 줘요. 추위로 혈관이 수축해 혈압이 오르고, 숨을 참고 힘을 주는 동작이 반복돼요. 폭설 뒤 심근경색이 늘었다는 연구도 있어요.</p>
<ul>
<li>심장병, 고혈압이 있거나 평소 운동을 안 하는 중년 이후라면 <strong>조금씩 나눠서</strong> 하고, 가능하면 다른 사람에게 부탁해요.</li>
<li>눈이 얕을 때 자주 치우는 편이 쌓인 뒤 한꺼번에 치우는 것보다 덜 힘들어요.</li>
<li>삽에 가득 퍼 올리기보다 <strong>밀어내요.</strong> 무릎을 굽히고 허리를 펴서 들어요.</li>
<li><strong>가슴 통증, 숨참, 식은땀, 어지러움</strong>이 생기면 즉시 멈추고 119를 불러요.</li>
<li>식사 직후와 음주 뒤에는 하지 않아요.</li>
</ul>

<div class="box warn"><span class="h">지붕의 눈과 붕괴</span>
<p>비닐하우스, 축사, 가건물, 오래된 주택 지붕에 눈이 쌓이면 무너질 수 있어요. 눈이 많이 오는 날에는 그 안에 머물지 말고, 안전이 확보된 상태에서만 지붕 눈을 내려요. 지붕에 올라가 눈을 치우다 떨어지는 사고도 많아요. 혼자 올라가지 않아요.</p></div>

<h2>추위와 동상</h2>
<ul>
<li>귀, 코, 뺨, 손발 끝이 하얗거나 누렇게 변하고 감각이 없어지면 동상 초기일 수 있어요.</li>
<li>따뜻한 곳으로 옮겨 <strong>40°C 안팎의 따뜻한 물</strong>에 담가 천천히 녹여요. 눈으로 문지르거나 불에 직접 쬐지 않아요.</li>
<li>물집이 생기거나 피부가 검게 변하면 병원에 가요.</li>
</ul>

<div class="box"><span class="h">눈·빙판 체크리스트</span>
<ol>
<li>미끄럼 방지 신발, 장갑 끼고 손은 밖으로</li>
<li>보폭 좁게, 발바닥 전체로</li>
<li>다리 위·터널 출입구는 속도 줄이기</li>
<li>차간거리 2배 이상, 급제동 금지</li>
<li>눈은 밀어서, 조금씩 쉬어 가며</li>
<li>가슴 통증 생기면 즉시 멈추고 119</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>염화칼슘을 뿌리면 바로 녹나요?</dt>
<dd>염화칼슘은 눈이 오기 전이나 쌓이기 시작할 때 뿌려야 효과가 좋아요. 두껍게 쌓인 뒤에는 먼저 치우고 뿌려요. 반려견 발바닥과 식물에 자극이 될 수 있어 산책 후 발을 닦아 주세요.</dd>
<dt>내 집 앞 눈은 꼭 치워야 하나요?</dt>
<dd>많은 지자체가 조례로 건물 앞 보도의 눈 치우기를 건물 관리자에게 요청해요. 이웃과 행인이 넘어지지 않게 가능한 범위에서 치워 주세요.</dd>
<dt>겨울용 타이어가 꼭 필요한가요?</dt>
<dd>눈이 자주 오는 지역이나 산간 도로를 다닌다면 제동 거리를 크게 줄여 줘요. 그렇지 않다면 체인을 차에 두고, 눈길 운전은 가능한 피하는 것도 방법이에요.</dd>
</dl>
