  data-title="여드름: 짜지 말고 8주는 기다리기, 바르는 약부터 먹는 약까지, 흉터가 남기 전에 치료할 때"

  data-summary="여드름은 사춘기에 흔하지만 성인이 되어서도 이어지거나 새로 생기기도 해요. 여드름이 생기는 네 가지 이유, 좁쌀 여드름부터 결절까지의 단계, 바르는 약과 먹는 약의 역할, 이소트레티노인 복용 시 주의, 음식과 화장품에 대해 알려진 것, 흉터와 자국 관리를 정리했어요."

<p class="lead">거울 볼 때마다 새로 올라온 여드름에 신경 쓰이고, 손이 저절로 가요. 여드름은 청소년의 대부분이 한 번쯤 겪는 흔한 피부 질환이지만, 가볍게 넘기기엔 마음과 흉터에 오래 남을 수 있어요. 원인을 알고, 약이 효과를 낼 시간을 주면 대부분 좋아져요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>여드름은 <strong>피지 증가, 모공 막힘, 여드름균, 염증</strong>이 함께 만들어요.</li>
<li>치료 효과는 <strong>8~12주</strong>는 써 봐야 알 수 있어요. 처음 몇 주는 오히려 올라오기도 해요.</li>
<li><strong>짜거나 뜯으면</strong> 염증이 깊어지고 흉터와 자국이 남기 쉬워요.</li>
<li>결절·낭종처럼 깊은 여드름, 흉터가 생기는 여드름은 <strong>일찍 피부과 치료</strong>를 받아요.</li>
</ul></div>

<h2>여드름이 생기는 네 가지 이유</h2>
<ol>
<li><strong>피지가 많아져요.</strong> 사춘기 호르몬(안드로겐)이 피지샘을 자극해요.</li>
<li><strong>모공 입구가 막혀요.</strong> 각질이 쌓여 피지가 빠져나가지 못해요. 이것이 좁쌀 여드름(면포)이에요.</li>
<li><strong>여드름균이 늘어요.</strong> 막힌 모공 안에서 피지를 먹고 자라요.</li>
<li><strong>염증이 생겨요.</strong> 붉게 부어오르고 고름이 차요.</li>
</ol>

<h2>여드름의 단계</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>모습</th><th>흉터 위험</th></tr></thead>
<tbody>
<tr><td>화이트헤드(닫힌 면포)</td><td>피부색의 작은 좁쌀</td><td>낮음</td></tr>
<tr><td>블랙헤드(열린 면포)</td><td>모공 끝이 검게 보여요. 때가 아니라 공기와 닿아 산화된 피지예요</td><td>낮음</td></tr>
<tr><td>구진</td><td>붉고 단단하게 솟은 작은 염증</td><td>중간</td></tr>
<tr><td>농포</td><td>가운데 노란 고름이 보여요</td><td>중간</td></tr>
<tr><td>결절·낭종</td><td>깊고 크며 아파요. 몇 주씩 가요</td><td>높음</td></tr>
</tbody>
<caption>대한여드름학회, 미국피부과학회(AAD) 여드름 진료지침을 바탕으로 정리</caption></table></div>

<h2>치료</h2>
<div class="tbl"><table>
<thead><tr><th>약</th><th>역할</th><th>알아 둘 점</th></tr></thead>
<tbody>
<tr><td>벤조일퍼옥사이드(바르는 약)</td><td>여드름균을 줄여요. 내성이 생기지 않아요</td><td>옷·수건을 탈색시킬 수 있어요. 처음엔 건조하고 따가울 수 있어요</td></tr>
<tr><td>레티노이드(아다팔렌, 트레티노인 등)</td><td>모공 막힘을 풀고 새 여드름을 막아요</td><td>처음 몇 주 건조·붉어짐. 밤에 조금씩. 임신 중에는 피해요</td></tr>
<tr><td>바르는 항생제(클린다마이신 등)</td><td>염증 여드름</td><td>내성을 막기 위해 벤조일퍼옥사이드와 함께 써요</td></tr>
<tr><td>먹는 항생제(독시사이클린 등)</td><td>중등도 염증 여드름</td><td>보통 3~4개월 안으로 짧게 쓰고, 바르는 약을 함께 써요</td></tr>
<tr><td>호르몬 치료</td><td>생리 전에 턱 주변이 심해지는 성인 여성</td><td>피임약, 스피로놀락톤 등. 의사와 상의</td></tr>
<tr><td>이소트레티노인(먹는 약)</td><td>중증, 흉터, 다른 치료에 반응이 없을 때</td><td>효과가 크지만 <strong>임신 중 복용 시 심각한 기형 위험</strong>. 정기 검사 필요</td></tr>
</tbody>
<caption>미국피부과학회(AAD) Guidelines of care for the management of acne vulgaris(2024), 대한여드름학회 자료를 바탕으로 정리</caption></table></div>

<div class="box warn"><span class="h">이소트레티노인을 먹는다면</span>
<ul>
<li>가임기 여성은 복용 전부터 복용이 끝난 뒤 <strong>최소 1개월까지 확실히 피임</strong>해요.</li>
<li>입술과 피부가 몹시 건조해져요. 보습제와 립밤을 챙겨요.</li>
<li>기분이 크게 가라앉거나 극단적인 생각이 들면 바로 의사에게 알려요.</li>
<li>복용 중에는 헌혈하지 않아요.</li>
<li>다른 사람과 약을 나눠 먹지 않아요.</li>
</ul></div>

<h2>짜지 말아야 하는 이유</h2>
<p>손으로 짜면 고름이 피부 깊은 곳으로 밀려 들어가 염증이 커지고, 패인 흉터와 오래가는 붉은·갈색 자국이 남기 쉬워요. 꼭 제거하고 싶은 여드름은 피부과에서 소독된 기구로 압출을 받아요. 커다란 결절은 병원에서 주사로 빨리 가라앉힐 수 있어요.</p>

<h2>음식과 생활</h2>
<ul>
<li><strong>혈당을 빨리 올리는 음식</strong>(단 음료, 흰 빵, 과자)과 <strong>우유(특히 저지방 우유)</strong>가 여드름을 악화시킬 수 있다는 연구가 있어요. 사람마다 차이가 커서 무조건 끊기보다 내 피부 반응을 살펴봐요.</li>
<li>초콜릿, 기름진 음식과의 관련은 아직 분명하지 않아요.</li>
<li>세안은 <strong>하루 2번</strong> 순한 세안제로 해요. 너무 자주 세게 씻으면 오히려 자극이 돼요.</li>
<li>화장품과 자외선 차단제는 <strong>'논코메도제닉'</strong> 표시가 있는 가벼운 제품을 골라요.</li>
<li>근육 강화용 스테로이드, 일부 단백질 보충제가 여드름을 악화시키기도 해요.</li>
<li>마스크를 오래 쓴다면 중간에 땀을 닦고, 자주 바꿔요.</li>
</ul>

<h2>흉터와 자국</h2>
<p>여드름이 가라앉은 뒤 남은 <strong>붉은 자국</strong>과 <strong>갈색 자국</strong>은 몇 달에 걸쳐 옅어지는 경우가 많아요. 자외선 차단이 도움이 돼요. <strong>패인 흉터</strong>는 저절로 좋아지기 어려워 레이저, 박피 등 치료를 피부과와 상의해요. 무엇보다 흉터가 생기기 전에 여드름을 조절하는 것이 가장 좋은 흉터 예방이에요.</p>

<div class="box"><span class="h">여드름 관리 체크리스트</span>
<ol>
<li>짜지 않고 손대지 않기</li>
<li>순한 세안제로 하루 2번</li>
<li>약은 8~12주 꾸준히</li>
<li>논코메도제닉 화장품·자외선 차단제</li>
<li>단 음료·우유는 내 반응 살피기</li>
<li>깊은 여드름·흉터는 피부과로</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>성인이 돼서 여드름이 새로 생겼어요.</dt>
<dd>성인 여성에게 턱과 입 주변 여드름이 흔해요. 호르몬, 스트레스, 화장품이 영향을 줄 수 있어요. 생리가 불규칙하고 털이 많아졌다면 다낭성난소증후군 검사를 권하기도 해요.</dd>
<dt>여드름 약을 바르니 더 올라와요.</dt>
<dd>레티노이드를 시작하면 처음 몇 주 여드름이 일시적으로 늘 수 있어요. 너무 따갑거나 붓는다면 사용 간격을 조절하도록 의사와 상의해요.</dd>
<dt>등과 가슴 여드름도 같은 방법으로 치료하나요?</dt>
<dd>원리는 같아요. 땀을 흘린 뒤 바로 씻고, 몸용 벤조일퍼옥사이드 세정제를 쓰기도 해요. 곰팡이 모낭염과 비슷해 보일 수 있어 잘 낫지 않으면 진료를 받아요.</dd>
</dl>
