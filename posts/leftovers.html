  data-title="남은 음식 보관과 재가열: 2시간 규칙, 냉장 3~4일, 다시 끓여도 안 되는 경우"
  data-thumb="2시간|실온 방치 한계"
  data-summary="배달 음식과 남은 반찬은 언제까지 먹어도 될까요? 식힌 음식을 냉장고에 넣어야 하는 시간, 냉장 보관 기간, 볶음밥과 카레에서 생기는 식중독, 끓여도 없어지지 않는 독소, 제대로 데우는 온도를 정리했어요."
  data-tags="남은음식,재가열,식중독,냉장보관,생활정보">
<p class="lead">"한 번 끓였으니 괜찮겠지" 하고 가스레인지 위 찌개를 밤새 두는 집이 많아요. 그런데 어떤 식중독균은 끓여도 살아남고, 어떤 균은 끓여도 없어지지 않는 독소를 남겨요. 남은 음식은 식히는 법과 데우는 법이 모두 중요해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>조리한 음식은 <strong>2시간 안에</strong> 냉장고에 넣어요. 무더운 날에는 1시간 안에요.</li>
<li>냉장 보관한 남은 음식은 <strong>3~4일 안에</strong> 먹어요.</li>
<li>데울 때는 <strong>속까지 김이 펄펄 날 만큼</strong>(중심 온도 약 75°C) 데워요.</li>
<li>밥, 볶음밥, 큰 냄비 찌개는 특히 빨리 식혀서 냉장해요.</li>
</ul></div>

<h2>2시간 규칙</h2>
<p>세균은 약 5~60°C에서 빠르게 늘어나요. 조리한 음식이 이 온도에 오래 머물수록 위험해져요. 그래서 먹고 남은 음식은 실온에 <strong>2시간 이상 두지 않아요.</strong> 기온이 30°C를 넘는 여름에는 1시간 안에 넣어요.</p>
<p>"뜨거운 음식을 냉장고에 넣으면 안 된다"는 말이 있지만, 오래 식히는 것이 더 위험해요. 한 김만 빼고 바로 넣어요. 냉장고 온도가 잠깐 오르는 것은 문을 자주 여닫지 않으면 괜찮아요.</p>

<h2>빨리 식히는 법</h2>
<ul>
<li><strong>얕고 넓은 그릇에 나눠 담아요.</strong> 깊은 냄비째 넣으면 가운데가 몇 시간 동안 따뜻해요.</li>
<li>큰 냄비의 국이나 찌개는 냄비를 찬물이나 얼음물에 담그고 저어 주면 빨리 식어요.</li>
<li>뚜껑을 살짝 열어 김이 빠지게 한 뒤, 식으면 닫아요.</li>
<li>냉장고에 넣을 때 그릇 사이에 틈을 두어 찬 공기가 돌게 해요.</li>
</ul>

<h2>냉장 보관 기간</h2>
<div class="tbl"><table>
<thead><tr><th>음식</th><th class="num">냉장(5°C 이하) 기간</th></tr></thead>
<tbody>
<tr><td>익힌 고기, 생선, 닭 요리</td><td class="num">3~4일</td></tr>
<tr><td>국, 찌개, 카레</td><td class="num">3~4일</td></tr>
<tr><td>밥, 볶음밥, 파스타</td><td class="num">3~4일(되도록 빨리)</td></tr>
<tr><td>배달 음식, 피자</td><td class="num">3~4일</td></tr>
<tr><td>달걀 요리, 김밥, 샌드위치</td><td class="num">되도록 하루 안</td></tr>
</tbody>
<caption>미국 농무부(USDA) 남은 음식 보관 안내를 바탕으로 정리. 조리 후 바로 냉장했을 때 기준이에요</caption></table></div>
<p>그 안에 못 먹을 것 같으면 처음부터 나눠서 냉동해요. 김밥처럼 여러 재료가 섞인 음식은 상하기 쉬워 되도록 당일에 먹어요.</p>

<h2>끓여도 안 되는 식중독균</h2>
<div class="tbl"><table>
<thead><tr><th>균</th><th>잘 생기는 음식</th><th>증상 시작</th><th>특징</th></tr></thead>
<tbody>
<tr><td>바실루스 세레우스</td><td>밥, 볶음밥, 면</td><td class="num">1~6시간(구토형)</td><td>포자와 독소가 열에 강해요</td></tr>
<tr><td>퍼프린젠스</td><td>큰 냄비 고기 찌개, 카레, 수육</td><td class="num">8~12시간</td><td>공기가 적은 냄비 속에서 잘 자라요</td></tr>
<tr><td>황색포도상구균</td><td>김밥, 주먹밥, 떡, 샌드위치</td><td class="num">1~6시간</td><td>손에서 옮고 독소가 열에 강해요</td></tr>
</tbody>
<caption>질병관리청·식품의약품안전처 식중독균 정보를 바탕으로 정리. 증상 시작 시간은 대략적인 범위예요</caption></table></div>
<h3>바실루스 세레우스: 밥과 볶음밥</h3>
<p>흙에 흔한 이 균은 열에 강한 <strong>포자</strong>를 만들어 밥을 지어도 살아남아요. 밥을 실온에 오래 두면 포자가 깨어나 늘어나면서 <strong>끓여도 없어지지 않는 독소</strong>를 만들어요. 먹고 몇 시간 안에 구토가 시작되는 게 특징이에요. 남은 밥은 빨리 식혀 냉장하거나 냉동해요.</p>
<h3>퍼프린젠스: 큰 냄비의 찌개와 카레</h3>
<p>이 균도 포자로 살아남고, 공기가 적은 큰 냄비 속에서 잘 자라요. 대량으로 끓인 고기 찌개나 카레를 냄비째 실온에서 천천히 식힐 때 많이 생겨요. 복통과 설사가 주 증상이에요. 큰 냄비 음식은 <strong>나눠서 빨리 식혀</strong> 냉장하는 게 가장 중요해요.</p>
<h3>황색포도상구균: 손으로 만진 음식</h3>
<p>손의 상처나 코에 흔한 이 균도 열에 강한 독소를 만들어요. 김밥, 주먹밥, 떡처럼 손으로 만드는 음식은 위생장갑을 쓰고, 만든 뒤 실온에 오래 두지 않아요.</p>

<h2>제대로 데우는 법</h2>
<ul>
<li>음식의 <strong>가운데까지</strong> 김이 펄펄 날 정도로 데워요. 식품의약품안전처는 중심 온도 75°C에서 1분 이상 가열을 권해요.</li>
<li>국과 찌개는 팔팔 끓어오르게 해요.</li>
<li>전자레인지는 가장자리만 뜨겁고 가운데는 차가울 수 있어요. 중간에 한 번 섞고, 뚜껑을 살짝 덮어 열이 고루 퍼지게 해요.</li>
<li>데운 음식이 다시 남았다면 또 보관하지 말고 버리는 게 좋아요. 데우고 식히기를 반복할수록 위험해져요.</li>
</ul>

<h2>도시락과 배달 음식</h2>
<ul>
<li>도시락은 보냉 가방과 아이스팩을 쓰고, 먹기 전까지 서늘한 곳에 둬요.</li>
<li>배달 음식이 도착하면 바로 먹을 만큼만 덜고, 나머지는 바로 냉장해요.</li>
<li>회, 초밥, 생채소 샐러드처럼 익히지 않은 음식은 남기지 않는 게 좋아요.</li>
</ul>

<div class="box warn"><span class="h">이런 경우는 버려요</span>
<ul>
<li>실온에 2시간 넘게 둔 음식(여름에는 1시간)</li>
<li>냉장 보관 4일이 지난 남은 음식</li>
<li>시큼한 냄새, 거품, 끈적임이 생긴 음식</li>
</ul>
<p>임신부, 영유아, 어르신, 면역이 약한 사람이 먹을 음식은 기준을 더 엄격하게 지켜요.</p></div>

<h2>식중독이 의심되면</h2>
<p>구토나 설사가 있으면 물을 조금씩 자주 마셔 탈수를 막아요. 피가 섞인 설사, 고열, 소변이 거의 나오지 않음, 물도 못 마실 정도의 구토가 있으면 진료를 받아요.</p>

<div class="box"><span class="h">남은 음식 체크리스트</span>
<ol>
<li>식사 끝나면 2시간 안에 냉장고로</li>
<li>얕은 그릇에 나눠 담아 빨리 식히기</li>
<li>보관 용기에 날짜 적기</li>
<li>3~4일 안에 먹고, 못 먹을 것은 냉동</li>
<li>데울 때는 속까지 펄펄 끓게</li>
<li>한 번 데운 것은 다시 보관하지 않기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>밤새 가스레인지 위에 둔 찌개, 아침에 다시 끓이면 괜찮나요?</dt>
<dd>다시 끓이면 세균 대부분은 죽지만, 밤새 늘어난 일부 균의 포자나 독소는 남을 수 있어요. 여름철이나 고기가 든 찌개라면 버리는 쪽이 안전해요. 앞으로는 식사 후 식혀서 냉장고에 넣어요.</dd>
<dt>배달 치킨을 다음 날 먹어도 되나요?</dt>
<dd>도착 후 2시간 안에 냉장했다면 3~4일 안에 속까지 데워 먹을 수 있어요. 밤새 식탁에 둔 치킨은 먹지 않아요.</dd>
<dt>냉장고에 넣었는데 왜 상했을까요?</dt>
<dd>냉장고는 세균 증식을 늦출 뿐 멈추지는 않아요. 냉장고 온도가 높거나, 넣기 전에 오래 실온에 두었거나, 깊은 그릇에 담아 가운데가 늦게 식었을 수 있어요.</dd>
</dl>
