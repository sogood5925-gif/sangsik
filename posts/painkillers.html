  data-title="해열진통제 고르는 법: 아세트아미노펜과 이부프로펜, 언제 무엇을 먹을까"
  data-thumb="4,000mg|아세트아미노펜 하루 최대"
  data-summary="약국에서 가장 많이 사는 약이 해열진통제예요. 아세트아미노펜과 소염진통제(이부프로펜 등)의 차이, 증상별로 고르는 법, 하루 최대 용량과 겹쳐 먹기 쉬운 감기약, 위·콩팥·간을 지키는 주의점, 임신부와 어린이가 먹을 때 알아둘 것을 정리했어요."
  data-tags="해열진통제,아세트아미노펜,이부프로펜,소염진통제,상비약">
<p class="lead">두통, 생리통, 치통, 열. 흔한 증상일수록 약을 쉽게 고르지만, 해열진통제도 잘못 먹으면 간이나 위, 콩팥에 부담이 될 수 있어요. 두 가지 계열의 차이만 알아도 훨씬 안전하게 쓸 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>아세트아미노펜</strong>은 열과 통증을 줄이고 위 부담이 적지만, <strong>과량은 간을 손상</strong>시켜요.</li>
<li><strong>이부프로펜 같은 소염진통제</strong>는 염증까지 줄이지만, <strong>위, 콩팥, 혈압</strong>에 부담이 있어요.</li>
<li>종합감기약에도 같은 성분이 들어 있어요. <strong>성분이 겹치지 않는지</strong> 꼭 확인해요.</li>
<li>어린이에게는 <strong>아스피린을 쓰지 않고</strong>, 임신 중에는 소염진통제를 의사와 상의해요.</li>
</ul></div>

<h2>두 가지 계열의 차이</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>아세트아미노펜</th><th>소염진통제 (NSAIDs)</th></tr></thead>
<tbody>
<tr><td>대표 성분</td><td>아세트아미노펜</td><td>이부프로펜, 덱시부프로펜, 나프록센, 아스피린 등</td></tr>
<tr><td>해열</td><td>있음</td><td>있음</td></tr>
<tr><td>진통</td><td>있음</td><td>있음</td></tr>
<tr><td>항염 (붓기·염증 감소)</td><td>거의 없음</td><td>있음</td></tr>
<tr><td>위장 부담</td><td>적음, 공복에도 가능</td><td>있음, 식후 복용 권장</td></tr>
<tr><td>주의할 장기</td><td>간</td><td>위장, 콩팥, 심혈관</td></tr>
</tbody></table></div>

<h2>증상별로 고르기</h2>
<div class="tbl"><table>
<thead><tr><th>증상</th><th>일반적으로 고려하는 선택</th></tr></thead>
<tbody>
<tr><td>열, 가벼운 두통</td><td>아세트아미노펜 또는 이부프로펜</td></tr>
<tr><td>생리통</td><td>소염진통제가 더 효과적인 경우가 많아요. 통증이 시작될 때 일찍 먹어요</td></tr>
<tr><td>치통, 근육통, 삔 곳, 관절 통증</td><td>염증이 관여하므로 소염진통제가 효과적인 경우가 많아요</td></tr>
<tr><td>위염·위궤양이 있거나 속이 쓰릴 때</td><td>아세트아미노펜</td></tr>
<tr><td>콩팥 기능이 떨어졌거나 혈압이 조절되지 않을 때</td><td>아세트아미노펜 (소염진통제는 피하기)</td></tr>
<tr><td>항응고제를 먹는 중</td><td>아세트아미노펜 우선, 소염진통제는 출혈 위험</td></tr>
</tbody>
<caption>일반적인 안내예요. 지병이 있거나 다른 약을 먹는다면 약사·의사와 상의하세요.</caption></table></div>

<h2>아세트아미노펜 안전하게 먹기</h2>
<ul>
<li>성인 <strong>하루 최대 4,000mg</strong>을 넘기지 않아요. 500mg 정제라면 하루 8정이 한계예요.</li>
<li>한 번에 먹는 양과 간격은 제품 설명을 따라요. 일반 정제는 보통 4~6시간 간격, <strong>서방형</strong>(8시간 지속형)은 8시간 간격이에요.</li>
<li><strong>술을 자주 마시는 사람</strong>(하루 3잔 이상 매일)은 간 손상 위험이 커서, 복용 전 의사·약사와 상의하고 용량을 줄여요.</li>
<li>간 질환이 있다면 의사가 정한 용량을 따라요.</li>
</ul>
<div class="box warn"><span class="h">성분 중복에 주의하세요</span>
<p>종합감기약, 코감기약, 몸살약, 일부 수면 보조제에도 <strong>아세트아미노펜이 들어 있는 경우가 많아요.</strong> 두통약과 감기약을 함께 먹으면 모르는 사이 하루 최대량을 넘길 수 있어요. 약을 두 가지 이상 먹는다면 포장의 성분표를 비교해 보세요.</p>
<p>아세트아미노펜을 한꺼번에 많이 먹었다면 처음에는 증상이 거의 없어도 하루 이틀 뒤 심한 간 손상이 생길 수 있어요. <strong>과량 복용이 의심되면 증상이 없어도 바로 응급실</strong>에 가요. 일찍 치료하면 해독제로 간 손상을 막을 수 있어요.</p></div>

<h2>소염진통제 안전하게 먹기</h2>
<ul>
<li><strong>식후</strong>나 음식과 함께 먹어 위 자극을 줄여요.</li>
<li><strong>가장 낮은 효과 용량으로, 가장 짧게</strong> 써요. 오래 계속 먹어야 한다면 의사와 상의해요.</li>
<li>두 가지 이상의 소염진통제를 함께 먹지 않아요. 효과는 늘지 않고 부작용만 커져요.</li>
<li>이런 경우에는 특히 조심해요.
  <ul>
  <li>위궤양, 위장 출혈을 앓은 적이 있어요.</li>
  <li>만성 콩팥병, 심부전이 있어요.</li>
  <li>고혈압이 잘 조절되지 않아요.</li>
  <li>심근경색, 뇌졸중을 앓았어요.</li>
  <li>항응고제, 항혈소판제, 스테로이드를 먹어요.</li>
  <li>65세 이상이에요.</li>
  <li>천식이 있고 진통제로 천식이 악화된 적이 있어요.</li>
  </ul></li>
<li>검은 변, 피를 토함, 심한 복통은 위장 출혈의 신호일 수 있어요. 바로 진료를 받아요.</li>
</ul>

<h2>임신부와 수유부</h2>
<ul>
<li>임신 중 열이나 통증에는 대개 <strong>아세트아미노펜</strong>을 우선 고려해요. 필요할 때 짧게 써요.</li>
<li>소염진통제는 <strong>임신 20주 이후</strong>에는 태아의 콩팥과 심장 혈관에 영향을 줄 수 있어서 피하도록 권고돼요. 임신 중 진통제는 산부인과 의사와 상의해요.</li>
<li>수유 중에는 아세트아미노펜과 이부프로펜이 대체로 쓸 수 있는 약으로 알려져 있어요.</li>
</ul>

<h2>어린이</h2>
<ul>
<li>어린이 해열진통제는 <strong>나이가 아니라 체중</strong>에 맞춰 용량을 정하는 게 정확해요. 제품의 체중별 용량표를 확인해요.</li>
<li>아세트아미노펜 시럽과 이부프로펜 시럽은 사용 가능한 나이가 달라요. 어린 영아는 먼저 진료를 받아요.</li>
<li>어른 약을 쪼개 먹이지 않고, 동봉된 계량컵이나 주사기로 정확히 재요.</li>
<li><strong>어린이와 청소년에게는 아스피린을 쓰지 않아요.</strong> 독감이나 수두 중 먹으면 라이 증후군이라는 심각한 질환이 생길 수 있어요.</li>
<li>두 가지 해열제를 번갈아 먹이는 '교차 복용'은 용량 실수가 생기기 쉬워요. 한 가지로 조절되지 않을 때 의사의 안내에 따라요.</li>
<li>열 자체보다 아이의 상태가 중요해요. 처지거나, 잘 먹지 않거나, 숨쉬기 힘들어하면 진료를 받아요.</li>
</ul>

<h2>복합 진통제와 카페인</h2>
<p>일부 두통약에는 진통 성분과 함께 <strong>카페인</strong>이 들어 있어 효과를 높여요. 하지만 자주 먹으면 카페인 금단 두통과 <strong>약물과용두통</strong>의 원인이 될 수 있어요. 이소프로필안티피린이 들어간 복합제는 국내에서 15세 미만에게 쓰지 않도록 되어 있어요.</p>
<div class="box note"><span class="h">진통제를 너무 자주 먹고 있다면</span>
<p>두통으로 진통제를 한 달에 10~15일 이상 먹는다면 오히려 두통을 늘리는 약물과용두통일 수 있어요. 두통 글에서 자세히 정리했어요.</p></div>

<div class="box"><span class="h">상비약 점검표</span>
<ol>
<li>집에 있는 해열진통제의 성분명 확인하기 (아세트아미노펜인지 이부프로펜인지)</li>
<li>감기약과 두통약 성분이 겹치는지 확인하기</li>
<li>어린이 시럽의 체중별 용량과 유효기간 확인하기</li>
<li>위장 질환, 콩팥병, 항응고제 복용 가족이 있다면 맞는 약 따로 표시하기</li>
<li>유효기간 지난 약은 폐의약품 수거함에</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>진통제를 자주 먹으면 내성이 생기나요?</dt>
<dd>해열진통제는 마약성 진통제처럼 내성이 생기지는 않아요. 다만 자주 먹으면 약물과용두통이 생기거나 장기 부작용이 쌓일 수 있어요.</dd>
<dt>열이 나면 바로 해열제를 먹어야 하나요?</dt>
<dd>열은 몸이 감염과 싸우는 반응이기도 해요. 열이 불편하거나 잠을 못 잘 정도일 때 먹으면 돼요. 숫자 자체보다 전체 상태를 봐요.</dd>
<dt>공복에 이부프로펜을 먹어도 되나요?</dt>
<dd>가끔 한 번은 큰 문제가 없을 수 있지만, 위 자극을 줄이려면 음식과 함께 먹는 게 좋아요. 속이 약하다면 아세트아미노펜을 고려해요.</dd>
</dl>
