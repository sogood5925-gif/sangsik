  data-title="척추관협착증: 걸으면 다리가 저리고 쉬면 풀리는 이유, 디스크와 다른 점, 수술을 고민할 때"
  data-thumb="숙이면|편해지는 다리 저림"
  data-summary="조금만 걸어도 엉덩이와 다리가 저리고 당겨서 쉬어 가야 하는데, 허리를 숙이거나 앉으면 금방 풀린다면 척추관협착증일 수 있어요. 척추관이 좁아지는 원리, 디스크·혈관 질환과의 구별, 걷기를 이어 가는 운동법, 약과 주사, 수술을 고려하는 경우와 바로 병원에 가야 하는 신호를 정리했어요."
  data-tags="척추관협착증,허리통증,다리저림,신경인성파행,질병">
<p class="lead">시장에 가려고 나섰는데 10분도 안 돼 다리가 저리고 무거워 길가에 앉아 쉬어요. 잠시 쉬면 괜찮아져 다시 걷지만 또 멈추게 돼요. 이상하게도 마트 카트를 밀거나 자전거를 탈 때는 괜찮아요. 이런 모습은 나이가 들며 신경이 지나가는 통로가 좁아지는 척추관협착증의 전형적인 신호예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>허리의 신경 통로(척추관)가 좁아져 <strong>걸을 때 다리가 저리고 당기는</strong> 병이에요.</li>
<li><strong>허리를 숙이거나 앉으면 편해지는 것</strong>이 특징이에요. 허리를 펴면 통로가 더 좁아져요.</li>
<li>많은 사람이 운동, 약, 주사로 <strong>수술 없이</strong> 지낼 수 있어요.</li>
<li><strong>대소변 장애, 다리 힘이 점점 빠짐</strong>은 빨리 수술을 검토해야 하는 신호예요.</li>
</ul></div>

<h2>왜 좁아질까</h2>
<p>나이가 들면 척추 뼈 사이의 디스크가 납작해지고, 관절이 두꺼워지고, 뼈 가시가 자라며, 척추 뒤쪽 인대가 두꺼워져요. 이 변화들이 신경이 지나가는 척추관을 조금씩 좁혀요. 주로 <strong>50~60대 이후</strong>에 생기고, 척추뼈가 앞으로 밀리는 척추전방전위증과 함께 오기도 해요.</p>

<h2>증상의 특징</h2>
<ul>
<li>걷거나 오래 서 있으면 <strong>엉덩이, 허벅지, 종아리가 저리고 당기고 무거워요.</strong></li>
<li><strong>앉거나 쪼그려 앉거나 허리를 숙이면</strong> 몇 분 안에 풀려요.</li>
<li>카트를 밀며 걷거나 자전거를 탈 때는 비교적 괜찮아요.</li>
<li>허리 통증보다 다리 증상이 더 괴로운 경우가 많아요.</li>
<li>걸을 수 있는 거리가 점점 줄어들어요.</li>
</ul>

<h2>비슷한 병과의 구별</h2>
<div class="tbl"><table>
<thead><tr><th>질환</th><th>특징</th></tr></thead>
<tbody>
<tr><td>척추관협착증</td><td>50대 이후, 걸을 때 다리 저림, 앉거나 숙이면 풀림, 서 있기만 해도 저릴 수 있어요</td></tr>
<tr><td>허리 디스크(추간판 탈출증)</td><td>비교적 젊은 나이, 앉아 있거나 허리를 숙일 때 더 아프고, 한쪽 다리로 뻗치는 통증</td></tr>
<tr><td>말초동맥질환(혈관성 파행)</td><td>걸을 때 종아리가 조이듯 아프고, <strong>선 채로 쉬기만 해도</strong> 풀려요. 발의 맥박이 약하고, 흡연·당뇨가 있는 사람에게 많아요</td></tr>
<tr><td>고관절 관절염</td><td>사타구니 통증, 다리를 돌릴 때 아파요</td></tr>
</tbody>
<caption>대한척추외과학회, 북미척추학회(NASS) 퇴행성 요추 척추관협착증 진료지침을 바탕으로 정리</caption></table></div>

<h2>치료</h2>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>설명</th></tr></thead>
<tbody>
<tr><td>운동</td><td>실내 자전거, 수중 걷기처럼 허리를 약간 숙인 자세의 운동, 코어 근육 강화, 걷기는 쉬어 가며 조금씩</td></tr>
<tr><td>약</td><td>진통제, 신경병증 통증 약 등. 효과와 부작용을 보며 조절해요</td></tr>
<tr><td>물리치료</td><td>자세 교정, 스트레칭, 근력 운동 지도</td></tr>
<tr><td>신경 주사(경막외 주사)</td><td>통증이 심할 때 일시적으로 줄여 운동을 할 수 있게 도와요</td></tr>
<tr><td>수술</td><td>좁아진 통로를 넓히는 감압술, 불안정하면 고정술을 함께 해요</td></tr>
</tbody>
<caption>북미척추학회(NASS) 진료지침, 대한척추외과학회 자료를 바탕으로 정리</caption></table></div>
<p>척추관협착증은 대부분 서서히 진행하거나 비슷하게 유지돼요. 갑자기 나빠지는 경우는 많지 않아서, 먼저 보존 치료를 충분히 해 보는 경우가 많아요.</p>

<h2>수술을 고려하는 경우</h2>
<ul>
<li>보존 치료를 몇 달 해도 <strong>걸을 수 있는 거리가 너무 짧아</strong> 생활이 어려워요.</li>
<li>다리 힘이 점점 약해져요.</li>
<li>통증 때문에 잠을 못 자고 일상이 무너졌어요.</li>
</ul>
<p>수술은 다리 저림과 걷는 거리를 좋아지게 하는 데 효과가 있어요. 나이와 전신 상태, 기대하는 목표를 의사와 충분히 이야기하고 결정해요. 여러 병원의 의견을 들어 보는 것도 괜찮아요.</p>

<div class="box warn"><span class="h">바로 병원에 가야 할 때</span>
<ul>
<li><strong>소변이나 대변을 보기 어렵거나</strong> 참지 못해요.</li>
<li>엉덩이와 항문 주변(안장이 닿는 부위) 감각이 둔해요.</li>
<li>양쪽 다리 힘이 빠르게 약해져요.</li>
<li>열, 체중 감소와 함께 허리 통증이 심해지거나, 암 병력이 있어요.</li>
</ul>
<p>신경이 심하게 눌리는 마미증후군이나 다른 심각한 원인일 수 있어 응급 진료를 받아요.</p></div>

<h2>일상에서 도움이 되는 것</h2>
<ul>
<li>걸을 때 <strong>조금 쉬어 가며</strong> 거리를 조금씩 늘려요. 지팡이나 보행 보조기를 쓰면 더 멀리 걸을 수 있어요.</li>
<li>오래 서 있을 때는 한쪽 발을 낮은 받침대에 올려요.</li>
<li>허리를 뒤로 젖히는 동작은 증상을 키울 수 있어요.</li>
<li>잘 때는 옆으로 누워 무릎을 조금 굽히거나, 바로 누울 때 무릎 밑에 베개를 받쳐요.</li>
<li>체중을 줄이고 금연하면 척추와 혈관 모두에 좋아요.</li>
</ul>

<div class="box"><span class="h">척추관협착증 체크리스트</span>
<ol>
<li>걷는 거리와 증상 기록</li>
<li>실내 자전거·수중 운동</li>
<li>쉬어 가며 매일 조금씩 걷기</li>
<li>허리 젖히는 동작 줄이기</li>
<li>대소변 이상은 즉시 병원</li>
<li>수술은 목표와 위험을 충분히 상의</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>허리가 아플수록 누워만 있어야 하나요?</dt>
<dd>오래 누워 있으면 근육이 약해져 오히려 걷기가 더 힘들어져요. 편한 범위에서 계속 움직이는 것이 좋아요.</dd>
<dt>협착증은 결국 수술해야 하나요?</dt>
<dd>그렇지 않아요. 많은 사람이 운동과 약, 주사로 생활을 이어 가요. 증상과 생활의 불편함에 따라 결정해요.</dd>
<dt>주사를 자주 맞아도 괜찮나요?</dt>
<dd>스테로이드 주사는 횟수를 제한하는 것이 좋아요. 당뇨가 있으면 혈당이 오를 수 있어요. 담당 의사와 간격을 정해요.</dd>
</dl>
