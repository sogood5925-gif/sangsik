  data-title="집에서 흔한 응급 상황: 기도가 막혔을 때, 화상, 코피, 베인 상처 대처법"
  data-thumb="20분|화상 식히기"
  data-summary="떡이 목에 걸렸을 때, 뜨거운 물에 데었을 때, 코피가 멈추지 않을 때, 칼에 베였을 때. 집에서 흔히 겪는 응급 상황에서 바로 할 일과 하지 말아야 할 일, 병원에 가야 하는 기준을 정리했어요. 영아의 기도폐쇄 대처도 담았어요."
  data-tags="응급처치,하임리히법,화상,코피,상처관리">
<p class="lead">응급 상황에서 몇 분 동안 무엇을 하느냐가 결과를 크게 바꿔요. 그리고 잘못 알려진 민간요법이 오히려 상처를 키우는 경우도 많아요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>음식이 목에 걸려 <strong>말을 못 하고 숨을 못 쉬면</strong> 복부 밀어내기(하임리히법)를 바로 시작해요.</li>
<li>화상은 <strong>흐르는 시원한 물에 20분</strong> 식혀요. 얼음, 된장, 치약은 바르지 않아요.</li>
<li>코피는 <strong>고개를 약간 숙이고</strong> 코의 부드러운 부분을 <strong>10~15분</strong> 꾹 눌러요.</li>
<li>베인 상처는 <strong>눌러서 지혈</strong>하고 흐르는 물로 씻어요.</li>
</ul></div>

<h2>기도가 막혔을 때</h2>
<p>떡, 고기, 사탕처럼 크고 끈적하거나 둥근 음식이 기도를 막으면 몇 분 안에 생명이 위험해져요. 특히 어르신과 어린아이에게 많이 생겨요.</p>
<h3>먼저 구별하기</h3>
<div class="tbl"><table>
<thead><tr><th>부분 폐쇄</th><th>완전 폐쇄</th></tr></thead>
<tbody>
<tr><td>기침을 하고 말을 할 수 있어요</td><td>말을 못 하고, 기침도 소리가 안 나요</td></tr>
<tr><td>→ 계속 <strong>기침하도록</strong> 격려해요. 등을 두드리거나 손가락을 넣지 않아요</td><td>→ 목을 움켜쥐거나 얼굴이 파래져요. <strong>바로 복부 밀어내기</strong></td></tr>
</tbody></table></div>
<h3>성인과 어린이 (만 1세 이상): 복부 밀어내기</h3>
<ol>
<li>"목에 걸렸어요?"라고 묻고, 고개를 끄덕이면 주변에 119 신고를 부탁해요.</li>
<li>환자 <strong>뒤에 서서</strong> 두 팔로 허리를 감싸요.</li>
<li>한 손으로 주먹을 쥐고 엄지 쪽을 <strong>배꼽과 명치 사이</strong>에 대요.</li>
<li>다른 손으로 주먹을 감싸고 <strong>안쪽 위로 힘껏 당기듯</strong> 밀어 올려요.</li>
<li>음식이 나오거나 환자가 의식을 잃을 때까지 반복해요.</li>
</ol>
<p><strong>임신부나 배가 많이 나온 사람</strong>은 배 대신 가슴 가운데에 손을 대고 뒤로 당겨요. 혼자 있을 때 막혔다면 의자 등받이나 테이블 모서리에 배를 대고 세게 밀어붙여요.</p>
<div class="box warn"><span class="h">의식을 잃으면</span>
<p>환자를 바닥에 눕히고 119에 신고한 뒤 바로 <strong>가슴 압박</strong>(심폐소생술)을 시작해요. 가슴 압박이 이물질을 밀어낼 수도 있어요. 입 안에 이물질이 보이면 꺼내되, 보이지 않는데 손가락을 깊이 넣어 휘젓지 않아요.</p></div>
<h3>영아 (만 1세 미만)</h3>
<ol>
<li>아기를 팔 위에 <strong>엎드리게</strong> 하고 머리가 몸보다 낮게 해요. 손으로 턱을 받쳐요.</li>
<li>손바닥 아래쪽으로 <strong>날개뼈 사이를 5번</strong> 세게 두드려요.</li>
<li>아기를 뒤집어 <strong>가슴 가운데를 두 손가락으로 5번</strong> 눌러요.</li>
<li>이물질이 나오거나 아기가 울 때까지 반복해요. 의식을 잃으면 119와 심폐소생술이에요.</li>
</ol>
<p>영아에게는 복부 밀어내기를 하지 않아요. 내장이 다칠 수 있어요.</p>

<h2>화상</h2>
<h3>바로 할 일</h3>
<ol>
<li>열원에서 벗어나고, 옷에 불이 붙었다면 멈추고 엎드려 굴러요.</li>
<li><strong>흐르는 시원한 수돗물에 20분</strong> 식혀요. 다친 직후뿐 아니라 3시간 안이라면 식히는 게 도움이 돼요.</li>
<li>붓기 전에 <strong>반지, 시계, 팔찌</strong>를 빼요. 옷이 피부에 달라붙었다면 억지로 떼지 않아요.</li>
<li>식힌 뒤 깨끗한 랩이나 거즈로 느슨하게 덮어요.</li>
</ol>
<div class="box warn"><span class="h">하지 말아야 할 것</span>
<ul>
<li><strong>얼음이나 얼음물</strong>: 피부 혈관을 수축시켜 손상을 키우고 동상을 일으킬 수 있어요.</li>
<li><strong>된장, 치약, 소주, 감자, 버터</strong>: 감염 위험을 높이고 상처 평가를 어렵게 해요.</li>
<li><strong>물집 터뜨리기</strong>: 물집은 자연 드레싱이에요. 저절로 터지면 깨끗하게 관리해요.</li>
<li>넓은 화상을 오래 찬물에 담가 몸 전체가 떨릴 정도로 식히지 않아요. 특히 아이는 저체온증이 올 수 있어요.</li>
</ul></div>
<h3>병원에 가야 하는 화상</h3>
<ul>
<li>얼굴, 손, 발, 생식기, 관절 부위의 화상</li>
<li>물집이 넓게 생겼거나, 환자 손바닥 크기보다 넓은 화상</li>
<li>피부가 <strong>하얗거나 검게</strong> 변하고 오히려 통증이 적은 화상 (깊은 화상)</li>
<li>전기 화상, 화학물질 화상 (화학물질은 흐르는 물로 20분 이상 씻고 병원으로)</li>
<li>아기, 노인, 당뇨병 환자의 화상</li>
<li>연기를 들이마셔 목소리가 변하거나 숨쉬기 힘든 경우는 응급이에요.</li>
</ul>
<p>핫팩이나 전기장판에 오래 닿아 생기는 <strong>저온 화상</strong>은 겉보기보다 깊은 경우가 많아요. 잘 낫지 않으면 진료를 받아요.</p>

<h2>코피</h2>
<ol>
<li>앉아서 <strong>고개를 약간 앞으로</strong> 숙여요. 피가 목으로 넘어가지 않게 해요.</li>
<li>엄지와 검지로 <strong>코의 부드러운 아래쪽(콧방울)</strong>을 잡고 <strong>10~15분 동안 쉬지 않고</strong> 꾹 눌러요. 중간에 확인하려고 떼지 않아요.</li>
<li>입으로 숨을 쉬고, 입에 고인 피는 뱉어요.</li>
<li>멈춘 뒤 몇 시간은 코를 세게 풀거나 파지 않아요.</li>
</ol>
<div class="box note"><span class="h">흔한 잘못</span>
<ul>
<li><strong>고개를 뒤로 젖히기</strong>: 피가 목으로 넘어가 삼키게 되고, 구역질이나 기도로 넘어갈 수 있어요.</li>
<li><strong>콧대(뼈 부분)를 누르기</strong>: 출혈 부위는 대부분 코 앞쪽 부드러운 부분이에요.</li>
<li><strong>휴지를 깊이 쑤셔 넣기</strong>: 뺄 때 다시 출혈이 생길 수 있어요.</li>
</ul></div>
<p><strong>20분 넘게 눌러도 멈추지 않거나</strong>, 머리나 얼굴을 다친 뒤의 코피, 피가 목 뒤로 많이 넘어가는 경우, 항응고제를 먹는 사람, 자주 반복되는 코피는 진료를 받아요. 겨울철 건조함이 원인이라면 가습기와 보습 연고가 예방에 도움이 돼요.</p>

<h2>베이거나 긁힌 상처</h2>
<ol>
<li><strong>지혈:</strong> 깨끗한 거즈나 천으로 상처를 <strong>5~10분 꾹 누르고</strong>, 가능하면 심장보다 높이 들어요.</li>
<li><strong>세척:</strong> 흐르는 수돗물로 흙과 이물질을 충분히 씻어요. 이것이 감염 예방에 가장 중요해요.</li>
<li><strong>보호:</strong> 상처가 촉촉하게 유지되도록 연고를 얇게 바르고 밴드나 습윤 드레싱으로 덮어요.</li>
</ol>
<p>과산화수소나 포비돈 같은 소독약을 상처 안에 반복해서 쓰면 새로 자라는 세포까지 손상될 수 있어요. 깨끗한 물 세척이 기본이에요.</p>
<h3>병원에 가야 하는 상처</h3>
<ul>
<li>눌러도 <strong>10분 넘게 피가 멈추지 않거나</strong> 피가 뿜어져 나와요.</li>
<li>상처가 <strong>벌어져</strong> 가장자리가 붙지 않거나, 깊어서 지방이나 근육이 보여요. (봉합은 다친 뒤 가능한 빨리 받는 게 좋아요)</li>
<li>얼굴, 관절, 손가락의 깊은 상처</li>
<li>동물이나 사람에게 물린 상처</li>
<li>녹슨 금속, 흙에 오염된 깊은 상처 (파상풍 접종 확인)</li>
<li>며칠 뒤 붓고 빨개지며 열감, 고름, 열이 나요 (감염)</li>
</ul>

<div class="box"><span class="h">집에 두면 좋은 구급상자</span>
<ol>
<li>멸균 거즈, 밴드, 습윤 드레싱, 붕대, 반창고</li>
<li>항생제 연고, 핀셋, 가위</li>
<li>일회용 장갑</li>
<li>해열진통제, 체온계</li>
<li>화상용 젤 드레싱</li>
<li>119와 가까운 응급실 번호 메모</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>떡이 걸렸을 때 물을 마시게 하면 되나요?</dt>
<dd>완전히 막힌 상태에서는 물을 마실 수 없고, 억지로 먹이면 더 위험해요. 기침을 할 수 있다면 기침으로, 못 한다면 복부 밀어내기를 해요.</dd>
<dt>화상에 알로에를 발라도 되나요?</dt>
<dd>가벼운 햇볕 화상에는 진정 효과가 있을 수 있지만, 방금 입은 화상에는 먼저 흐르는 물로 충분히 식히는 게 우선이에요. 깊거나 넓은 화상에는 바르지 말고 병원으로 가요.</dd>
<dt>상처에 딱지가 생기게 말려야 하나요?</dt>
<dd>요즘은 상처를 촉촉하게 유지하는 습윤 치료가 더 빨리, 흉터를 덜 남기며 낫는다고 봐요. 다만 감염 징후가 있으면 진료를 받아요.</dd>
</dl>
