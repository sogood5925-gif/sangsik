  data-title="건선: 옮지 않는 면역 질환, 은백색 각질 판의 정체, 관절과 심혈관까지 함께 보는 치료"
  data-thumb="0%|옮을 가능성"
  data-summary="건선은 피부 세포가 너무 빨리 만들어져 두꺼운 붉은 판과 은백색 각질이 생기는 만성 면역 질환이에요. 옮지 않는다는 사실부터, 건선의 여러 형태, 악화시키는 요인, 관절염·대사질환과의 관계, 바르는 약부터 광선치료·주사 치료까지 단계별 치료, 생활 관리를 정리했어요."
  data-tags="건선,피부질환,자가면역,건선관절염,질병">
<p class="lead">팔꿈치와 무릎, 두피에 두껍고 붉은 판이 생기고 하얀 각질이 떨어져요. 건선을 앓는 사람들은 가려움만큼이나 남의 시선 때문에 힘들어해요. 건선은 불결해서 생기는 병도, 옮는 병도 아니에요. 면역 체계가 피부를 지나치게 자극해 생기는 만성 질환이고, 요즘은 치료 선택지가 많이 늘었어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>건선은 <strong>옮지 않는</strong> 만성 면역 질환이에요. 좋아졌다 나빠졌다를 반복해요.</li>
<li>보통 한 달쯤 걸리는 피부 교체가 <strong>며칠 만에</strong> 일어나 각질이 쌓여요.</li>
<li><strong>관절 통증</strong>, 비만·당뇨·심혈관 질환과도 관련이 있어 몸 전체를 함께 봐요.</li>
<li>바르는 약 → 광선치료 → 먹는 약·주사로 <strong>중증도에 맞춰</strong> 치료해요.</li>
</ul></div>

<h2>건선은 왜 생길까</h2>
<p>유전적으로 건선이 생기기 쉬운 사람에게 감염, 스트레스, 피부 상처 같은 계기가 더해지면 면역세포가 피부에서 염증 신호(인터루킨-17, 인터루킨-23 등)를 과하게 내보내요. 그러면 피부 세포가 너무 빨리 자라 두꺼워지고, 제대로 떨어지지 못한 각질이 은백색으로 쌓여요. 가족 중에 건선이 있으면 생길 가능성이 높아져요.</p>

<h2>건선의 여러 모습</h2>
<div class="tbl"><table>
<thead><tr><th>형태</th><th>특징</th></tr></thead>
<tbody>
<tr><td>판상 건선</td><td>가장 흔해요. 팔꿈치, 무릎, 두피, 허리에 경계가 뚜렷한 붉은 판과 은백색 각질</td></tr>
<tr><td>물방울 건선</td><td>작은 물방울 모양의 반점이 온몸에. 편도염 같은 연쇄상구균 감염 뒤 청소년·젊은 층에 잘 생겨요</td></tr>
<tr><td>역위 건선</td><td>겨드랑이, 사타구니, 가슴 밑처럼 접히는 곳. 각질이 적고 매끈한 붉은 반점</td></tr>
<tr><td>손발바닥 농포 건선</td><td>손발바닥에 노란 고름 물집과 갈라짐</td></tr>
<tr><td>손발톱 건선</td><td>손발톱에 작은 홈, 누렇게 변함, 들뜸. 무좀으로 오해하기 쉬워요</td></tr>
<tr><td>전신 농포·홍피성 건선</td><td>온몸이 붉어지거나 고름 물집, 열과 오한. 입원 치료가 필요한 응급 상황</td></tr>
</tbody>
<caption>대한건선학회, 대한피부과학회 건선 정보를 바탕으로 정리</caption></table></div>

<h2>악화시키는 요인</h2>
<ul>
<li><strong>스트레스</strong>, 수면 부족</li>
<li>감기·편도염 같은 <strong>감염</strong></li>
<li>긁히거나 베인 곳에 새로 생기는 <strong>쾨브너 현상</strong>: 긁을수록 번져요.</li>
<li><strong>흡연과 음주</strong>, 비만</li>
<li>건조하고 추운 겨울, 햇빛이 적은 계절</li>
<li>일부 약(리튬, 일부 베타차단제, 말라리아약 등)과 <strong>스테로이드를 갑자기 끊을 때</strong></li>
</ul>

<h2>피부만의 병이 아니에요</h2>
<ul>
<li><strong>건선 관절염:</strong> 건선 환자의 일부(연구에 따라 약 10~30%)에서 손가락·발가락이 소시지처럼 붓거나, 아침에 관절이 뻣뻣하고, 발뒤꿈치나 허리가 아파요. 관절이 망가지기 전에 치료하는 게 중요해요.</li>
<li><strong>대사·심혈관 질환:</strong> 중증 건선일수록 비만, 당뇨, 고혈압, 이상지질혈증, 심혈관 질환이 더 흔해요. 혈압, 혈당, 콜레스테롤을 정기적으로 확인해요.</li>
<li><strong>마음 건강:</strong> 우울과 불안이 흔해요. 힘들다면 치료 의사에게 이야기해요.</li>
</ul>

<h2>단계별 치료</h2>
<div class="tbl"><table>
<thead><tr><th>중증도</th><th>치료</th></tr></thead>
<tbody>
<tr><td>가벼움(몸의 일부)</td><td>바르는 스테로이드, 비타민 D 유도체(칼시포트리올), 복합 제제, 보습</td></tr>
<tr><td>중간 이상, 또는 바르기 어려운 범위</td><td>광선치료(좁은 파장 자외선 B)</td></tr>
<tr><td>중등도~중증</td><td>먹는 약(메토트렉세이트, 사이클로스포린, 아시트레틴, 아프레밀라스트 등)</td></tr>
<tr><td>기존 치료에 반응이 부족한 중증</td><td>생물학적 제제 주사(TNF-α, 인터루킨-17·23 억제제 등), 먹는 표적 치료제</td></tr>
</tbody>
<caption>대한건선학회 건선 치료 가이드라인, 미국피부과학회·미국건선재단(AAD-NPF) 지침을 바탕으로 정리</caption></table></div>
<p>얼굴, 생식기, 손발, 두피처럼 삶의 질에 큰 영향을 주는 부위는 범위가 좁아도 적극적으로 치료하기도 해요. 약마다 부작용과 검사 일정이 달라 의사와 함께 정해요.</p>

<div class="box warn"><span class="h">이럴 때는 빨리 진료를 받아요</span>
<ul>
<li>온몸이 붉어지거나 고름 물집이 번지면서 <strong>열과 오한</strong>이 나요.</li>
<li>관절이 붓고 아파 움직이기 힘들어요.</li>
<li>치료 중 열, 기침, 상처가 낫지 않는 등 감염 증상이 생겨요.</li>
</ul></div>

<h2>생활 관리</h2>
<ul>
<li><strong>보습제</strong>를 하루 여러 번, 특히 샤워 직후에 발라요.</li>
<li>미지근한 물로 짧게 씻고, 각질을 억지로 벗기거나 때를 밀지 않아요.</li>
<li>금연하고 술을 줄여요. 체중을 줄이면 치료 반응이 좋아진다는 연구가 있어요.</li>
<li>두피 건선은 전용 샴푸와 약을 두피에 직접 발라요.</li>
<li>민간요법이나 검증되지 않은 제품으로 치료를 미루지 않아요.</li>
</ul>

<div class="box"><span class="h">건선 관리 체크리스트</span>
<ol>
<li>보습은 하루 여러 번</li>
<li>긁거나 때밀지 않기</li>
<li>금연, 절주, 적정 체중</li>
<li>관절 통증 있으면 알리기</li>
<li>혈압·혈당·콜레스테롤 확인</li>
<li>스테로이드 스스로 끊지 않기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>건선은 완치되나요?</dt>
<dd>현재로서는 완치보다 오랫동안 증상 없이 지내는 것을 목표로 해요. 치료가 잘 되면 피부가 거의 깨끗한 상태를 유지하는 사람도 많아요.</dd>
<dt>햇볕을 쬐면 좋아진다던데요?</dt>
<dd>자외선이 건선을 좋게 하는 것은 맞지만, 일광 화상은 오히려 악화시켜요. 광선치료는 파장과 시간을 조절한 치료라 병원에서 받는 게 안전해요.</dd>
<dt>수영장이나 목욕탕에 가도 되나요?</dt>
<dd>건선은 옮지 않아요. 다만 소독약과 뜨거운 물이 피부를 건조하게 할 수 있어 나온 뒤 보습을 해요.</dd>
</dl>
