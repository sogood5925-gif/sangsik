  data-title="운동 부상 응급 대처: 삐었을 때 얼음과 압박, 엑스레이가 필요한 신호, 머리 부딪힘"
  data-thumb="20분|얼음찜질 한 번"
  data-summary="발목을 삐거나 근육이 올라왔을 때 처음 며칠의 대처가 회복을 좌우해요. 부상 직후 보호·거상·압박과 얼음찜질 요령, 최근 권고가 달라진 점(소염진통제와 움직임), 뼈가 부러졌을 수 있는 신호와 엑스레이 기준, 운동 중 머리를 부딪혔을 때 경기를 멈춰야 하는 이유, 다시 운동하는 순서를 정리했어요."

<p class="lead">주말 축구나 등산에서 발목을 접질리면 "괜찮겠지" 하고 계속 뛰거나, 반대로 몇 주씩 전혀 움직이지 않기도 해요. 둘 다 회복을 늦출 수 있어요. 처음 이틀은 다친 곳을 보호하고, 그다음부터는 통증이 허락하는 범위에서 조금씩 움직이는 것이 요즘 권고예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>다치면 <strong>바로 멈추고</strong>, 처음 1~3일은 보호·다리 올리기·압박을 해요.</li>
<li>얼음찜질은 수건에 싸서 <strong>한 번에 15~20분</strong>, 피부에 직접 대지 않아요.</li>
<li>며칠 지나면 통증이 허락하는 범위에서 <strong>조금씩 움직이는 것</strong>이 회복을 앞당겨요.</li>
<li>운동 중 <strong>머리를 부딪친 뒤 이상하면</strong> 그날은 경기에 돌아가지 않아요.</li>
</ul></div>

<h2>다친 직후 1~3일: PEACE</h2>
<div class="tbl"><table>
<thead><tr><th>할 일</th><th>요령</th></tr></thead>
<tbody>
<tr><td>보호(Protect)</td><td>통증을 늘리는 동작을 1~3일 피해요. 필요하면 목발이나 보조기를 써요</td></tr>
<tr><td>거상(Elevate)</td><td>다친 부위를 심장보다 높게 올려 붓기를 줄여요</td></tr>
<tr><td>소염제 신중히(Avoid anti-inflammatories)</td><td>초기 염증은 회복 과정의 일부라 고용량 소염진통제를 오래 쓰는 것은 권하지 않아요. 통증 조절은 필요한 만큼 해요</td></tr>
<tr><td>압박(Compress)</td><td>탄력붕대로 감아 붓기를 줄여요. 발가락이 저리거나 차가워지면 너무 조인 거예요</td></tr>
<tr><td>알기(Educate)</td><td>회복에는 시간이 걸린다는 것을 알고, 수동적인 치료에만 의지하지 않아요</td></tr>
</tbody>
<caption>Dubois B, Esculier JF, Soft-tissue injuries simply need PEACE and LOVE, British Journal of Sports Medicine 2020을 바탕으로 정리</caption></table></div>

<h2>얼음찜질 요령</h2>
<ul>
<li>얼음이나 냉찜질 팩을 <strong>얇은 수건에 싸서</strong> 대요. 피부에 직접 대면 동상이 생길 수 있어요.</li>
<li>한 번에 <strong>15~20분</strong>, 처음 하루이틀 동안 몇 시간 간격으로 해요.</li>
<li>얼음찜질은 통증을 줄이는 데 도움이 돼요. 다만 회복 자체를 앞당기는 효과는 연구마다 엇갈려요.</li>
<li>당뇨로 감각이 둔하거나 혈액순환이 나쁜 사람은 짧게, 조심해서 해요.</li>
<li>처음 며칠은 뜨거운 찜질, 사우나, 술을 피해요. 붓기가 늘 수 있어요.</li>
</ul>

<h2>며칠 뒤부터: LOVE</h2>
<ul>
<li><strong>적절한 부하(Load):</strong> 통증이 심하지 않은 범위에서 체중을 싣고 움직이기 시작해요.</li>
<li><strong>낙관(Optimism):</strong> 두려움과 걱정이 회복을 늦출 수 있어요. 대부분 좋아진다는 것을 기억해요.</li>
<li><strong>혈류(Vascularisation):</strong> 걷기, 자전거 같은 통증 없는 유산소 운동으로 혈액순환을 늘려요.</li>
<li><strong>운동(Exercise):</strong> 근력, 가동 범위, 균형 운동으로 다시 다치지 않게 해요. 발목 염좌 뒤 균형 운동은 재발을 줄여요.</li>
</ul>

<h2>뼈를 확인해야 하는 신호</h2>
<p>발목을 삐었을 때 모두 엑스레이가 필요한 건 아니에요. 아래 기준 중 하나라도 해당하면 골절을 확인하기 위해 촬영해요.</p>
<div class="tbl"><table>
<thead><tr><th>확인</th><th>내용</th></tr></thead>
<tbody>
<tr><td>체중 싣기</td><td>다친 직후와 병원에서 <strong>네 걸음</strong>을 걷지 못해요</td></tr>
<tr><td>복사뼈 누르기</td><td>안쪽이나 바깥쪽 복사뼈의 <strong>뒤쪽 가장자리나 끝</strong>을 누르면 아파요</td></tr>
<tr><td>발 누르기</td><td>새끼발가락 쪽 발등 뼈의 시작 부분, 발 안쪽 가운데 뼈(주상골)를 누르면 아파요</td></tr>
</tbody>
<caption>오타와 발목 규칙(Ottawa Ankle Rules)을 바탕으로 정리</caption></table></div>
<div class="box warn"><span class="h">바로 병원이나 응급실로</span>
<ul>
<li>팔다리가 <strong>눈에 띄게 휘거나</strong> 뼈가 튀어나왔어요.</li>
<li>다친 부위 아래가 <strong>차갑고 창백하거나 감각이 없어요.</strong></li>
<li>'뚝' 소리와 함께 무릎이 빠르게 붓거나, 발뒤꿈치 위를 걷어차인 느낌 뒤 발끝으로 서지 못해요(십자인대, 아킬레스건 파열 가능성).</li>
<li>관절을 전혀 움직이지 못해요.</li>
<li>며칠이 지나도 붓기와 통증이 줄지 않아요.</li>
</ul></div>

<h2>운동 중 머리를 부딪혔다면</h2>
<p>공이나 선수와 부딪힌 뒤 <strong>멍함, 두통, 어지러움, 구역질, 시야 흐림, 기억이 잘 안 남</strong> 같은 증상이 있으면 뇌진탕일 수 있어요. 의식을 잃지 않았어도 생길 수 있어요.</p>
<ul>
<li><strong>의심되면 경기에서 빼요.</strong> 그날은 다시 뛰지 않아요. 뇌진탕 직후 다시 부딪히면 위험이 커져요.</li>
<li>하루이틀은 쉬고, 증상이 좋아지면 가벼운 활동부터 단계적으로 늘려요.</li>
<li>의식 저하, 반복되는 구토, 점점 심해지는 두통, 한쪽 마비, 경련, 말이 어눌함이 있으면 <strong>119</strong>를 불러요.</li>
</ul>

<h2>근육 경련(쥐)</h2>
<ul>
<li>경련이 난 근육을 반대 방향으로 천천히 늘려요. 종아리라면 발끝을 몸 쪽으로 당겨요.</li>
<li>가볍게 주물러 풀어 주고, 물이나 이온음료를 마셔요.</li>
<li>더운 날 경련과 함께 두통, 어지러움, 구역질이 있으면 온열질환일 수 있어 그늘에서 쉬고 몸을 식혀요.</li>
</ul>

<div class="box"><span class="h">부상 대처 체크리스트</span>
<ol>
<li>다치면 바로 멈추기</li>
<li>보호·다리 올리기·압박</li>
<li>얼음은 수건에 싸서 15~20분</li>
<li>네 걸음 못 걷거나 뼈를 누르면 아프면 엑스레이</li>
<li>며칠 뒤부터 통증 없는 범위에서 움직이기</li>
<li>머리 부딪히고 이상하면 그날 복귀 금지</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>파스를 붙여도 되나요?</dt>
<dd>파스 같은 바르는·붙이는 소염진통제는 통증을 줄이는 데 도움이 될 수 있어요. 피부가 약하면 짧게 쓰고, 붙인 채 뜨거운 찜질을 하지 않아요.</dd>
<dt>발목을 자주 삐어요.</dt>
<dd>발목 인대가 늘어나고 균형 감각이 떨어져 반복되는 경우가 많아요. 한 발 서기, 밴드 운동 같은 균형·근력 운동이 재발을 줄여요. 불안정감이 계속되면 정형외과 진료를 받아요.</dd>
<dt>언제 다시 운동해도 되나요?</dt>
<dd>통증 없이 걷고, 한 발로 서고, 가볍게 뛰고, 방향을 바꿀 수 있으면 원래 운동으로 조금씩 돌아가요. 통증이 다시 생기면 한 단계 낮춰요.</dd>
</dl>
