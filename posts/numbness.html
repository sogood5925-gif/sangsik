  data-title="손발 저림: 저린 위치로 보는 원인, 혈액순환 탓만은 아니에요, 갑자기 한쪽이 저리면 뇌졸중"
  data-thumb="한쪽·갑자기|119를 불러야 할 저림"
  data-summary="손발 저림은 오래 앉아 있다 생기는 가벼운 저림부터 신경 압박, 당뇨 신경병증, 비타민 B12 결핍, 뇌졸중까지 원인이 다양해요. 저린 위치와 모양으로 짐작해 보는 원인, 흔히 오해하는 혈액순환 문제, 병원에서 받는 검사, 당뇨가 있을 때 발 관리, 즉시 응급실에 가야 할 저림을 정리했어요."
  data-tags="손발저림,말초신경병증,당뇨발,비타민B12,건강상식">
<p class="lead">다리를 꼬고 앉아 있다 일어나면 발이 저린 경험은 누구나 있어요. 금방 풀리는 저림은 신경이 잠깐 눌린 탓이라 걱정하지 않아도 돼요. 하지만 저림이 계속되거나 점점 넓어지거나 힘까지 빠진다면 원인을 찾아야 해요. 흔히 '혈액순환이 안 돼서'라고 생각하지만, 실제로는 <strong>신경</strong>의 문제인 경우가 훨씬 많아요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>손발 저림은 대부분 <strong>신경이 눌리거나 손상</strong>돼서 생겨요.</li>
<li><strong>저린 위치와 모양</strong>(한쪽인지 양쪽인지, 어느 손가락인지)이 원인을 찾는 단서예요.</li>
<li><strong>당뇨, 비타민 B12 결핍, 갑상선, 음주</strong>가 흔한 전신 원인이에요.</li>
<li><strong>갑자기 한쪽</strong> 얼굴·팔·다리가 저리고 힘이 빠지면 뇌졸중일 수 있어 바로 119예요.</li>
</ul></div>

<h2>저린 위치로 보는 원인</h2>
<div class="tbl"><table>
<thead><tr><th>저림의 모양</th><th>흔한 원인</th></tr></thead>
<tbody>
<tr><td>엄지~약지 절반, 밤에 심함</td><td>손목터널증후군</td></tr>
<tr><td>새끼손가락·약지, 팔꿈치 기대면 심함</td><td>팔꿈치 척골신경 압박</td></tr>
<tr><td>목·어깨에서 팔로 뻗침</td><td>목 디스크, 목 척추 협착</td></tr>
<tr><td>엉덩이에서 다리로 뻗침, 걸을 때 심함</td><td>허리 디스크, 척추관협착증</td></tr>
<tr><td>양쪽 발끝부터 양말·장갑 모양으로 올라옴</td><td>말초신경병증(당뇨, 비타민 B12 결핍, 음주, 항암제 등)</td></tr>
<tr><td>추위에 손가락이 하얗게→파랗게→빨갛게</td><td>레이노 현상</td></tr>
<tr><td>걸으면 종아리가 조이고 서서 쉬면 풀림</td><td>말초동맥질환(혈관 문제)</td></tr>
<tr><td>갑자기 한쪽 얼굴·팔·다리</td><td>뇌졸중, 일과성 허혈 발작</td></tr>
</tbody>
<caption>대한신경과학회, 대한말초신경학회 자료를 바탕으로 정리</caption></table></div>

<div class="box warn"><span class="h">바로 119를 불러야 할 저림</span>
<ul>
<li><strong>갑자기</strong> 한쪽 얼굴, 팔, 다리가 저리거나 힘이 빠져요.</li>
<li>말이 어눌하거나, 물체가 둘로 보이거나, 심하게 어지러워요.</li>
<li>양쪽 다리가 저리면서 <strong>대소변 조절이 안 되거나</strong> 항문 주변 감각이 없어요.</li>
<li>며칠 사이에 저림과 힘 빠짐이 <strong>발끝에서 위로 빠르게</strong> 올라와요(길랭-바레 증후군 가능).</li>
</ul>
<p>증상이 잠깐 있다 사라져도 뇌졸중의 경고일 수 있어요. 바로 진료를 받아요.</p></div>

<h2>'혈액순환' 오해</h2>
<p>저리면 혈액순환 개선제나 건강식품을 찾는 경우가 많아요. 하지만 손발 저림의 흔한 원인은 신경 압박과 신경병증이고, 혈관이 원인인 경우(말초동맥질환, 레이노)는 증상 모양이 달라요. 원인을 확인하지 않고 제품에 기대면 당뇨나 디스크 같은 진짜 원인을 놓칠 수 있어요.</p>

<h2>병원에서 받는 검사</h2>
<ul>
<li><strong>혈액 검사:</strong> 혈당·당화혈색소, 비타민 B12, 갑상선 기능, 콩팥·간 기능</li>
<li><strong>신경 전도·근전도 검사:</strong> 어느 신경이 얼마나 손상됐는지 확인</li>
<li><strong>영상 검사:</strong> 목·허리 디스크가 의심되면 MRI 등</li>
<li><strong>혈관 검사:</strong> 말초동맥질환이 의심되면 팔다리 혈압 비교 등</li>
</ul>

<h2>원인별 관리</h2>
<div class="tbl"><table>
<thead><tr><th>원인</th><th>관리</th></tr></thead>
<tbody>
<tr><td>당뇨 신경병증</td><td>혈당 조절로 진행을 늦춰요. 저림·통증 약이 있어요</td></tr>
<tr><td>비타민 B12 결핍</td><td>보충하면 좋아져요. 채식, 위 수술, 메트포르민·위산 억제제 장기 복용이면 확인</td></tr>
<tr><td>음주</td><td>술을 끊고 영양을 보충해요</td></tr>
<tr><td>신경 압박</td><td>자세 교정, 보조기, 주사, 필요하면 수술</td></tr>
<tr><td>레이노</td><td>손발 따뜻하게, 금연, 필요하면 약</td></tr>
</tbody>
<caption>대한신경과학회, 대한당뇨병학회 당뇨병 진료지침을 바탕으로 정리</caption></table></div>

<h2>당뇨가 있다면 발을 매일 봐요</h2>
<ul>
<li>감각이 둔해지면 상처를 모르고 지나가 궤양이 될 수 있어요.</li>
<li><strong>매일 발바닥과 발가락 사이</strong>를 거울로 살펴요.</li>
<li>맨발로 다니지 않고, 발에 맞는 신발을 신어요.</li>
<li>뜨거운 찜질·전기장판에 발을 대지 않아요. 저온 화상을 입어도 모를 수 있어요.</li>
<li>작은 상처라도 붉어지고 붓거나 진물이 나면 바로 진료를 받아요.</li>
</ul>

<div class="box"><span class="h">손발 저림 체크리스트</span>
<ol>
<li>저린 위치·시간·자세 기록</li>
<li>한쪽·갑자기면 즉시 119</li>
<li>혈당·B12·갑상선 검사 상의</li>
<li>술 줄이기, 금연</li>
<li>당뇨라면 매일 발 확인</li>
<li>혈액순환 제품보다 원인 찾기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>자고 일어나면 손이 저린데 괜찮나요?</dt>
<dd>팔을 베고 자서 잠깐 저린 것이라면 괜찮아요. 매일 밤 같은 손가락이 저려 깬다면 손목터널증후군을 확인해요.</dd>
<dt>임신 중 손이 저려요.</dt>
<dd>부종 때문에 손목터널증후군이 잘 생겨요. 대개 출산 뒤 좋아지지만, 심하면 산부인과와 상의해요.</dd>
<dt>비타민 B군을 먹으면 저림이 나아지나요?</dt>
<dd>결핍이 있을 때는 도움이 되지만, 결핍이 없으면 효과가 없어요. 비타민 B6는 오래 많이 먹으면 오히려 신경병증을 일으킬 수 있어요.</dd>
</dl>
