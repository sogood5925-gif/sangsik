<p class="lead">놀이공원, 대형 마트, 축제 현장에서는 잠깐 한눈판 사이에 아이가 사라지는 일이 흔해요. 대부분은 금방 찾지만, 그 몇 분이 부모에게는 몇 시간처럼 느껴져요. 미리 준비한 몇 가지가 아이를 찾는 시간을 크게 줄여 줘요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>경찰의 <strong>지문 등 사전등록</strong>을 해 두면 아이를 찾았을 때 보호자를 빨리 확인할 수 있어요.</li>
<li>외출 전 <strong>그날 옷차림 사진</strong>을 찍어 두면 신고할 때 큰 도움이 돼요.</li>
<li>아이에게 <strong>이름·보호자 전화번호, 그 자리에 멈춰 있기, 도움 청할 사람</strong>을 가르쳐요.</li>
<li>아이를 잃어버리면 바로 <strong>시설 직원과 112(실종 신고 182)</strong>에 알려요. 기다리지 않아요.</li>
</ul></div>

<h2>사전등록 제도</h2>
<p>경찰은 <strong>18세 미만 아동, 지적·자폐성·정신 장애가 있는 사람, 치매 환자</strong>의 지문, 사진, 보호자 연락처를 미리 등록받아요. 길을 잃은 사람을 발견하면 등록 정보로 빠르게 보호자를 찾을 수 있어요.</p>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>내용</th></tr></thead>
<tbody>
<tr><td>가까운 경찰서·지구대·파출소</td><td>보호자와 대상자가 함께 방문해 지문·사진을 등록해요</td></tr>
<tr><td>경찰청 '안전드림' 누리집·앱</td><td>사진과 정보를 등록하고, 지문은 방문해 등록해요</td></tr>
<tr><td>정보 변경</td><td>아이 얼굴이 바뀌면 사진을 새로 올리고, 연락처가 바뀌면 고쳐요</td></tr>
</tbody>
<caption>경찰청 실종아동 등 사전등록 제도 안내를 바탕으로 정리. 아동의 등록 정보는 18세가 되면 폐기되고, 보호자가 요청하면 언제든 삭제돼요</caption></table></div>

<h2>붐비는 곳에 가기 전</h2>
<ul>
<li>그날 입은 <strong>옷과 신발이 다 보이게 아이 사진</strong>을 한 장 찍어요.</li>
<li>눈에 잘 띄는 색 옷을 입혀요.</li>
<li>옷 안쪽이나 팔찌에 <strong>보호자 전화번호</strong>를 적어 둬요. 아이 이름은 겉에 크게 쓰지 않아요. 낯선 사람이 이름을 불러 친한 척할 수 있어요.</li>
<li>도착하면 <strong>만날 장소</strong>를 아이와 함께 정해요. "길을 잃으면 저 분수대 앞 안내 데스크로 가자."</li>
<li>어른이 여럿이면 누가 아이를 볼지 분명히 정해요. "누가 보겠지"가 가장 위험해요.</li>
</ul>

<h2>아이에게 가르칠 세 가지</h2>
<div class="tbl"><table>
<thead><tr><th>가르칠 것</th><th>연습 방법</th></tr></thead>
<tbody>
<tr><td>1. 내 이름, 보호자 이름과 전화번호</td><td>노래나 박자로 외우게 하고, 가끔 물어봐요</td></tr>
<tr><td>2. 길을 잃으면 그 자리에 멈추기</td><td>"찾으러 돌아다니지 말고 멈춰서 기다리면 엄마·아빠가 찾으러 가"</td></tr>
<tr><td>3. 도움을 청할 사람</td><td>명찰을 단 직원, 계산대 직원, 경찰, 아이와 함께 있는 어른에게 "길을 잃었어요"라고 말하기</td></tr>
</tbody>
<caption>경찰청 실종 예방 교육, 미국 실종·착취아동센터(NCMEC) 안내를 바탕으로 정리</caption></table></div>
<p>'낯선 사람은 모두 위험하다'고만 가르치면, 길을 잃었을 때 도움을 청하지 못할 수 있어요. 누구에게 도움을 청할지 구체적으로 알려 주는 게 더 도움이 돼요. 반대로 <strong>먼저 다가와 따라오라는 어른</strong>은 따라가지 않고, 큰 소리로 "싫어요, 도와주세요"라고 말하도록 연습해요.</p>

<div class="box warn"><span class="h">아이를 잃어버렸다면, 첫 10분</span>
<ol>
<li>주변을 크게 부르며 짧게 살펴요.</li>
<li>바로 <strong>시설 직원, 안내 데스크</strong>에 알려요. 대형 시설은 출입구를 통제하고 안내 방송을 하는 실종 대응 절차(코드 아담)가 있어요.</li>
<li><strong>112(또는 실종 신고 182)</strong>에 신고해요. 아이 사진, 옷차림, 마지막으로 본 장소와 시간을 알려요.</li>
<li>한 사람은 <strong>마지막으로 본 곳이나 약속한 장소</strong>에 남아 있어요.</li>
<li>물가, 주차장, 출입구처럼 위험한 곳을 먼저 확인해요.</li>
</ol>
<p>'조금 더 찾아보고 신고해야지'라고 미루지 않아요. 신고가 빠를수록 찾을 가능성이 커요.</p></div>

<h2>나이별로 달라지는 점</h2>
<ul>
<li><strong>걸음마 시기:</strong> 호기심 따라 순식간에 사라져요. 붐비는 곳에서는 유모차나 손목 끈을 고려하고, 물가 가까이서는 손을 놓지 않아요.</li>
<li><strong>유치원·초등 저학년:</strong> 전화번호와 만날 장소를 외울 수 있어요. 역할극으로 연습해요.</li>
<li><strong>초등 고학년:</strong> 휴대폰 위치 공유를 쓸 수 있어요. 다만 기기에만 의존하지 말고 약속 장소와 연락 규칙을 함께 정해요.</li>
</ul>

<h2>치매 어르신 실종 예방</h2>
<ul>
<li>경찰 사전등록과 함께 보건소 치매안심센터의 <strong>배회 가능 어르신 인식표</strong>를 신청할 수 있어요.</li>
<li>평소 자주 가는 곳, 예전에 살던 동네를 기록해 두면 찾을 때 도움이 돼요.</li>
<li>외출 때 최근 사진, 입은 옷 사진을 찍어 둬요.</li>
<li>위치 확인 기기를 쓸 때는 어르신의 동의와 존엄을 함께 생각해요.</li>
</ul>

<div class="box"><span class="h">길 잃음 예방 체크리스트</span>
<ol>
<li>경찰 사전등록 하기</li>
<li>외출 전 옷차림 사진 찍기</li>
<li>옷 안쪽에 보호자 번호</li>
<li>도착하면 만날 장소 정하기</li>
<li>이름·번호·멈추기·도움 청하기 연습</li>
<li>잃어버리면 즉시 직원과 112·182</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>사전등록한 지문 정보는 어디에 쓰이나요?</dt>
<dd>실종 아동 등을 찾는 목적으로만 쓰도록 법에 정해져 있어요. 아동은 18세가 되면 폐기되고, 보호자가 원하면 언제든 삭제할 수 있어요.</dd>
<dt>아이가 전화번호를 못 외워요.</dt>
<dd>아직 어리다면 옷 안쪽 라벨이나 팔찌에 번호를 적어 주세요. 아이에게는 "직원에게 이 팔찌를 보여 줘"라고 알려 줘요.</dd>
<dt>아이를 찾았는데 크게 혼내도 될까요?</dt>
<dd>아이도 많이 놀랐어요. 먼저 안아 주고, 마음이 가라앉은 뒤 다음에는 어떻게 할지 함께 이야기해요.</dd>
</dl>
