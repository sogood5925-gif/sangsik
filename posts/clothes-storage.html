  data-title="옷 보관과 옷좀나방: 빨아서 넣기, 세탁소 비닐 벗기기, 방충제 섞지 않기"

<p class="lead">옷에 구멍을 내는 건 날아다니는 나방이 아니라 그 <strong>애벌레</strong>예요. 애벌레는 땀, 피지, 음식 얼룩이 묻은 양모와 캐시미어를 특히 좋아해요. 그래서 옷 보관의 첫 단계는 방충제가 아니라 세탁이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>보관 전에 <strong>깨끗이 빨고 완전히 말려요.</strong> 한 번 입은 옷의 땀과 얼룩이 벌레와 곰팡이를 불러요.</li>
<li>세탁소 <strong>비닐은 벗기고</strong> 통풍이 되는 부직포 커버를 씌워요.</li>
<li>방충제는 <strong>한 종류만</strong> 쓰고, 다른 성분끼리 섞지 않아요.</li>
<li>옷장은 너무 꽉 채우지 말고, 습기 많은 계절에는 제습제와 환기로 관리해요.</li>
</ul></div>

<h2>옷을 망치는 두 가지: 벌레와 습기</h2>
<div class="tbl"><table>
<thead><tr><th>문제</th><th>잘 생기는 옷과 환경</th><th>흔적</th></tr></thead>
<tbody>
<tr><td>옷좀나방·수시렁이 애벌레</td><td>양모, 캐시미어, 실크, 모피, 깃털. 어둡고 오래 움직이지 않는 곳</td><td>작은 구멍, 실 같은 고치, 모래알 같은 배설물</td></tr>
<tr><td>곰팡이</td><td>면, 가죽, 오래 입은 겉옷. 습하고 통풍이 안 되는 곳</td><td>하얗거나 검은 점, 퀴퀴한 냄새</td></tr>
<tr><td>누렇게 변함</td><td>흰 셔츠, 블라우스. 땀과 피지가 남은 채 보관</td><td>목둘레·겨드랑이의 누런 얼룩</td></tr>
</tbody></table></div>

<h2>계절 옷 정리 순서</h2>
<ol>
<li><strong>세탁:</strong> 한 번만 입었어도 빨아요. 겉보기에 깨끗해도 땀과 피지가 남아 있어요. 드라이클리닝이 필요한 옷은 맡겨요.</li>
<li><strong>완전히 말리기:</strong> 덜 마른 채 넣으면 곰팡이와 냄새가 생겨요.</li>
<li><strong>세탁소 비닐 벗기기:</strong> 아래 설명을 참고해요.</li>
<li><strong>분류:</strong> 소재별로 나누고, 1~2년 동안 한 번도 안 입은 옷은 정리해요.</li>
<li><strong>보관:</strong> 옷장 안을 닦아 말리고, 방충제와 제습제를 넣어요.</li>
</ol>

<h2>세탁소 비닐을 벗겨야 하는 이유</h2>
<ul>
<li>비닐은 공기가 통하지 않아 <strong>습기가 갇혀</strong> 곰팡이와 변색이 생기기 쉬워요.</li>
<li>드라이클리닝 용제가 옷에 조금 남아 있을 수 있어요. 비닐을 벗기고 <strong>바람이 잘 통하는 곳에 몇 시간 걸어</strong> 냄새를 빼요.</li>
<li>보관할 때는 먼지만 막고 공기는 통하는 <strong>부직포 커버</strong>를 씌워요.</li>
</ul>

<h2>방충제 고르고 쓰는 법</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>특징과 주의점</th></tr></thead>
<tbody>
<tr><td>피레스로이드계(엠펜트린 등)</td><td>냄새가 거의 없어 많이 쓰여요. 옷장 크기에 맞는 개수를 넣고 교체 시기를 지켜요</td></tr>
<tr><td>파라디클로로벤젠</td><td>강한 냄새로 벌레를 쫓아요. 밀폐된 곳에서 쓰고, 다른 방충제와 섞으면 녹아 옷에 얼룩을 남길 수 있어요</td></tr>
<tr><td>나프탈렌</td><td>오래 쓰였지만 독성 때문에 요즘은 잘 권하지 않아요. 아이가 삼키면 위험하고 일부 체질(G6PD 결핍)에서 용혈을 일으킬 수 있어요</td></tr>
<tr><td>천연 향(삼나무, 라벤더)</td><td>향으로 약하게 쫓는 정도예요. 이미 생긴 벌레를 없애지는 못해요</td></tr>
</tbody>
<caption>환경부 생활화학제품 안전 사용 안내, 한국소비자원 방충제 안내를 바탕으로 정리</caption></table></div>
<ul>
<li><strong>서로 다른 성분의 방충제를 함께 넣지 않아요.</strong> 화학 반응으로 녹아 옷을 망칠 수 있어요.</li>
<li>방충 성분은 공기보다 무거워 아래로 가라앉아요. 옷장 <strong>위쪽</strong>에 걸거나 서랍 옷 위에 올려요.</li>
<li>아이와 반려동물 손이 닿지 않게 하고, 사탕처럼 보이는 제품은 특히 조심해요.</li>
<li>방충제 냄새가 밴 옷은 입기 전에 바람에 걸어 두어요.</li>
</ul>

<h2>습기 관리</h2>
<ul>
<li>장마철에는 <strong>제습제</strong>를 넣고, 물이 차면 바로 바꿔요. 고인 물이 넘치면 옷과 가구가 상해요.</li>
<li>맑은 날 옷장 문을 열어 환기해요.</li>
<li>옷장을 벽에 바짝 붙이면 뒷면에 결로가 생겨요. 몇 센티미터 띄워 둬요.</li>
<li>옷을 꽉 채우지 않아요. 옷 사이로 공기가 통해야 해요.</li>
</ul>

<h2>소재별 보관 요령</h2>
<ul>
<li><strong>니트, 캐시미어:</strong> 걸면 늘어나요. 개어서 서랍이나 상자에 넣고 방충제를 함께 둬요.</li>
<li><strong>패딩(다운):</strong> 압축팩에 오래 눌러 두면 깃털이 부서지고 복원이 어려워요. 넉넉한 공간에 걸거나 가볍게 접어 둬요.</li>
<li><strong>가죽:</strong> 두꺼운 옷걸이에 걸고 통풍되는 커버를 씌워요. 비닐은 곰팡이를 불러요.</li>
<li><strong>흰 셔츠:</strong> 목과 소매 얼룩까지 깨끗이 빨아 보관해야 누렇게 변하지 않아요.</li>
<li><strong>정장:</strong> 어깨 모양에 맞는 두꺼운 옷걸이에 걸어요.</li>
</ul>

<h2>벌레가 이미 생겼다면</h2>
<ol>
<li>해당 옷장의 옷을 모두 꺼내 햇빛과 바람에 털어요.</li>
<li>세탁 가능한 옷은 빨고, 니트처럼 빨기 어려운 옷은 비닐에 밀봉해 <strong>냉동실에 며칠</strong> 넣었다가 꺼내 털면 애벌레와 알을 줄일 수 있어요.</li>
<li>옷장 구석과 서랍 틈을 진공청소기로 빨아들이고 닦아요.</li>
<li>말린 뒤 방충제를 넣고 다시 정리해요.</li>
</ol>

<div class="box"><span class="h">계절 옷 정리 체크리스트</span>
<ol>
<li>한 번 입은 옷도 빨아서 넣기</li>
<li>완전히 마른 뒤 보관</li>
<li>세탁소 비닐 벗기고 부직포 커버</li>
<li>방충제는 한 종류만, 옷장 위쪽에</li>
<li>제습제 넣고 물 차면 교체</li>
<li>옷장은 벽에서 띄우고 꽉 채우지 않기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>옷에서 나는 퀴퀴한 냄새는 어떻게 없애요?</dt>
<dd>대부분 습기와 곰팡이, 남은 피지 때문이에요. 빨 수 있는 옷은 세탁하고 햇볕에 말리고, 드라이클리닝 옷은 맡긴 뒤 통풍시켜요. 옷장 자체의 습기도 함께 관리해야 다시 생기지 않아요.</dd>
<dt>방충제는 얼마나 자주 바꿔요?</dt>
<dd>제품마다 효과 기간이 달라요. 보통 표시된 기간(몇 달)이 지나면 성분이 날아가니, 사용 시작 날짜를 적어 두고 교체해요.</dd>
<dt>좀벌레와 옷좀나방은 다른가요?</dt>
<dd>네. 흔히 '좀'이라고 부르는 은색 벌레(좀벌레)는 습한 곳의 종이, 풀 성분을 먹고, 옷에 구멍을 내는 건 주로 옷좀나방과 수시렁이 애벌레예요. 둘 다 습기와 먼지를 줄이면 예방에 도움이 돼요.</dd>
</dl>
