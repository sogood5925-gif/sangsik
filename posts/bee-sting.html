  data-title="벌 쏘임: 벌집을 건드렸다면 20m 이상 벗어나기, 침 빼는 법, 15분 안에 오는 위험 신호"
  data-thumb="20m|벌집에서 벗어날 거리"
  data-summary="늦여름과 초가을, 벌초와 성묘, 등산철에는 말벌에 쏘이는 사고가 몰려요. 벌이 공격하기 쉬운 상황과 옷차림, 벌집을 건드렸을 때 피하는 법, 쏘였을 때 침을 빼고 붓기를 가라앉히는 방법, 아나필락시스 신호와 대처, 벌 독 알레르기가 있는 사람의 준비, 집 주변 벌집 처리를 정리했어요."
  data-tags="벌쏘임,말벌,아나필락시스,벌초,생활정보">
<p class="lead">벌은 먼저 사람을 공격하려 하지 않아요. 대부분 벌집 가까이에서 위협을 느낄 때 쏴요. 그런데 풀숲이나 땅속, 무덤가에 숨은 벌집은 눈에 잘 띄지 않아서, 예초기를 돌리거나 발을 디디는 순간 수십 마리가 쏟아져 나오기도 해요. 피하는 법과 쏘였을 때 확인할 신호를 알아 두면 큰 사고를 막을 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>벌 쏘임 사고는 <strong>7~9월, 벌초·성묘·등산</strong> 때 가장 많아요.</li>
<li>벌집을 건드렸다면 <strong>머리를 감싸고 20m 이상</strong> 빠르게 벗어나요. 엎드리지 않아요.</li>
<li>쏘이면 침을 <strong>긁어서 빼고</strong>, 씻은 뒤 냉찜질해요.</li>
<li>쏘인 뒤 <strong>숨참, 온몸 두드러기, 어지러움</strong>이 오면 바로 119예요. 대개 15분~1시간 안에 나타나요.</li>
</ul></div>

<h2>벌이 공격하기 쉬운 상황</h2>
<div class="tbl"><table>
<thead><tr><th>상황</th><th>이유</th></tr></thead>
<tbody>
<tr><td>예초기 사용, 풀 베기</td><td>진동과 소음이 땅속·풀숲 벌집을 자극해요</td></tr>
<tr><td>어두운 색 옷, 검은 머리 노출</td><td>말벌은 검은색 등 어두운 색을 적으로 여기고 공격하는 경향이 있어요</td></tr>
<tr><td>향수, 향이 진한 화장품</td><td>벌을 끌어들일 수 있어요</td></tr>
<tr><td>단 음료, 과일을 들고 있을 때</td><td>벌이 모여들어요</td></tr>
<tr><td>벌집 근처에서 손을 휘두르기</td><td>위협으로 느끼고 공격해요</td></tr>
</tbody>
<caption>소방청·국립공원공단 벌 쏘임 사고 예방 안내를 바탕으로 정리</caption></table></div>

<h2>나가기 전 준비</h2>
<ul>
<li><strong>밝은 색</strong> 긴소매 옷과 챙 넓은 모자를 써요.</li>
<li>향수와 향이 강한 제품은 피해요.</li>
<li>벌초 전에는 <strong>긴 막대로 풀숲을 먼저 건드려</strong> 벌이 나오는지 확인해요.</li>
<li>벌 독 알레르기가 있다면 <strong>에피네프린 자가주사</strong>를 꼭 챙기고 동행에게 알려요.</li>
<li>휴대폰을 충전하고, 산에서는 위치를 알려 줄 수 있는 국가지점번호 표지판을 눈여겨봐요.</li>
</ul>

<h2>벌이 공격해 올 때</h2>
<ol>
<li>팔을 휘두르지 말고, 옷이나 손으로 <strong>머리와 얼굴을 감싸요.</strong></li>
<li>벌집 반대 방향으로 <strong>20m 이상 빠르게</strong> 벗어나요. 벌은 멀리까지 쫓아오지 않는 편이에요.</li>
<li><strong>엎드리거나 웅크려 숨지 않아요.</strong> 계속 쏘여요.</li>
<li>물속으로 뛰어드는 것은 도움이 되지 않을 수 있어요. 물 밖에서 기다리던 벌이 다시 공격해요.</li>
</ol>

<h2>쏘였을 때 처치</h2>
<div class="tbl"><table>
<thead><tr><th>순서</th><th>할 일</th></tr></thead>
<tbody>
<tr><td>1. 침 빼기</td><td>꿀벌은 침이 피부에 남아요. 신용카드 같은 얇은 모서리로 <strong>옆으로 긁어</strong> 빼요. 방법보다 <strong>빨리 빼는 것</strong>이 더 중요해요</td></tr>
<tr><td>2. 씻기</td><td>비누와 물로 씻어요</td></tr>
<tr><td>3. 냉찜질</td><td>얼음을 수건에 싸서 10~15분 대요. 붓기와 통증이 줄어요</td></tr>
<tr><td>4. 반지·시계 빼기</td><td>손이 붓기 전에 빼요</td></tr>
<tr><td>5. 지켜보기</td><td>적어도 30분~1시간은 전신 증상이 없는지 살펴요</td></tr>
</tbody>
<caption>질병관리청·대한응급의학회 벌 쏘임 응급처치 안내를 바탕으로 정리. 말벌은 침이 남지 않고 여러 번 쏠 수 있어요</caption></table></div>
<p>쏘인 곳이 붉게 붓고 가려운 것은 흔한 반응이에요. 부기가 크게 번져도 며칠 안에 가라앉는 경우가 많아요. 불편하면 먹는 항히스타민제나 진통제를 약사와 상의해 써요.</p>

<div class="box warn"><span class="h">바로 119를 불러야 할 때</span>
<ul>
<li><strong>숨이 차거나</strong> 쌕쌕거림, 목이 조이고 목소리가 변해요.</li>
<li>쏘인 곳과 떨어진 곳까지 <strong>온몸에 두드러기</strong>, 얼굴과 입술이 부어요.</li>
<li>어지럽고 쓰러질 것 같거나, 식은땀, 구토, 복통이 생겨요.</li>
<li><strong>입안이나 목</strong>을 쏘였어요.</li>
<li>말벌 등에 <strong>여러 곳(수십 군데)</strong>을 쏘였어요. 알레르기가 없어도 독의 양 때문에 위험해요.</li>
</ul>
<p>에피네프린 자가주사가 있다면 <strong>허벅지 바깥쪽에 바로 주사</strong>하고 119를 불러요. 증상이 좋아져도 다시 나빠질 수 있어 병원에 가요.</p></div>

<h2>벌 독 알레르기가 있다면</h2>
<ul>
<li>예전에 쏘인 뒤 전신 반응이 있었다면 다음에는 더 심할 수 있어요. <strong>알레르기 내과</strong>에서 검사를 받아요.</li>
<li>벌 독 면역치료로 심한 반응 위험을 크게 낮출 수 있어요. 담당 의사와 상의해요.</li>
<li>자가주사를 처방받았다면 가족과 동행에게 사용법을 알려 줘요.</li>
</ul>

<h2>집 주변 벌집</h2>
<p>처마 밑, 베란다, 창고, 나무에 벌집이 보이면 직접 떼거나 불로 태우지 말고 <strong>119</strong>에 신고해요. 스프레이 살충제로 건드리면 벌이 한꺼번에 공격할 수 있어요. 늦여름에서 초가을은 말벌 무리가 가장 커지는 시기예요.</p>

<div class="box"><span class="h">벌 쏘임 예방 체크리스트</span>
<ol>
<li>밝은 색 긴소매, 모자 착용</li>
<li>향수·단 음료 조심</li>
<li>벌초 전 막대로 풀숲 확인</li>
<li>공격받으면 머리 감싸고 20m 이상</li>
<li>침은 긁어서 빼고 냉찜질</li>
<li>숨참·전신 두드러기는 즉시 119</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>된장이나 치약을 바르면 낫나요?</dt>
<dd>근거가 없고 상처를 더럽혀 감염 위험을 키워요. 씻고 냉찜질하는 것이 좋아요.</dd>
<dt>예전에 쏘였을 때 괜찮았으면 다음에도 괜찮나요?</dt>
<dd>꼭 그렇지는 않아요. 쏘인 적이 있는 사람에게 알레르기가 새로 생길 수 있어요. 쏘일 때마다 증상을 지켜봐요.</dd>
<dt>아이가 쏘였어요. 어른과 다르게 해야 하나요?</dt>
<dd>처치는 같아요. 아이는 몸집이 작아 여러 곳을 쏘이면 더 위험해요. 얼굴이나 입을 쏘였거나 여러 번 쏘였다면 바로 병원에 가요.</dd>
</dl>
