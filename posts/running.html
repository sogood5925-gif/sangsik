  data-title="달리기 시작하기: 걷기와 달리기를 섞는 8주 계획, 말할 수 있는 속도, 흔한 부상 피하기"
  data-thumb="주 75분|고강도 운동 권장량"
  data-summary="달리기는 운동화 한 켤레로 시작할 수 있는 가장 쉬운 운동이지만, 처음부터 무리하면 금방 다치고 그만두게 돼요. 걷기와 달리기를 섞어 몸을 적응시키는 8주 계획, 말하면서 달릴 수 있는 속도, 운동화 고르기, 무릎·정강이·발바닥 부상을 줄이는 법, 달리기 전에 건강을 확인해야 하는 사람을 정리했어요."
  data-tags="달리기,러닝,유산소운동,운동부상,건강상식">
<p class="lead">"달리기를 해 보고 싶은데 5분만 뛰어도 숨이 차요." 처음에는 누구나 그래요. 달리기는 심장과 폐, 근육과 뼈가 함께 적응해야 하는 운동이라 시간이 필요해요. 처음 몇 주를 천천히 넘기면 몸이 놀랄 만큼 빨리 따라와요. 중요한 건 오래, 다치지 않고 이어 가는 거예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>처음에는 <strong>걷기와 달리기를 섞어서</strong> 시작하고 조금씩 달리는 시간을 늘려요.</li>
<li>속도는 <strong>짧은 문장으로 말할 수 있을 정도</strong>면 충분해요.</li>
<li>거리와 시간은 <strong>천천히</strong> 늘리고, 일주일에 쉬는 날을 둬요.</li>
<li>달리는 중 <strong>가슴 통증, 심한 숨참, 어지러움</strong>이 생기면 바로 멈추고 진료를 받아요.</li>
</ul></div>

<h2>얼마나 하면 좋을까</h2>
<p>세계보건기구는 성인에게 일주일에 <strong>중강도 운동 150~300분</strong>, 또는 <strong>고강도 운동 75~150분</strong>을 권해요. 가볍게 달리기는 대부분의 사람에게 고강도에 가까워서, 주 3번 25분씩만 달려도 권장량을 채울 수 있어요. 달리는 사람의 사망 위험과 심혈관 질환 위험이 낮았다는 연구가 많고, 적은 양의 달리기로도 이득이 있었어요.</p>

<h2>걷기와 달리기를 섞는 8주 계획(예)</h2>
<div class="tbl"><table>
<thead><tr><th>주차</th><th>한 번의 운동(주 3회)</th></tr></thead>
<tbody>
<tr><td>1주</td><td>5분 걷기 → (1분 달리기 + 2분 걷기) × 6 → 5분 걷기</td></tr>
<tr><td>2주</td><td>(1분 30초 달리기 + 2분 걷기) × 6</td></tr>
<tr><td>3주</td><td>(2분 달리기 + 2분 걷기) × 5</td></tr>
<tr><td>4주</td><td>(3분 달리기 + 1분 30초 걷기) × 4</td></tr>
<tr><td>5주</td><td>(5분 달리기 + 2분 걷기) × 3</td></tr>
<tr><td>6주</td><td>(8분 달리기 + 2분 걷기) × 2 + 5분 달리기</td></tr>
<tr><td>7주</td><td>(10분 달리기 + 1분 걷기) × 2</td></tr>
<tr><td>8주</td><td>쉬지 않고 20~25분 천천히 달리기</td></tr>
</tbody>
<caption>영국 국민보건서비스(NHS) Couch to 5K 등 입문 프로그램을 바탕으로 정리. 앞뒤로 5분씩 걷기를 넣고, 힘들면 한 주를 반복해도 괜찮아요</caption></table></div>

<h2>알맞은 속도</h2>
<ul>
<li><strong>말하기 테스트:</strong> 달리면서 짧은 문장을 말할 수 있으면 적당해요. 노래까지 부를 수 있으면 너무 느리고, 한 단어도 힘들면 너무 빨라요.</li>
<li>처음에는 <strong>걷는 속도보다 조금 빠른 정도</strong>도 충분해요.</li>
<li>기록보다 <strong>꾸준함</strong>이 먼저예요. 주 3회를 몇 달 이어 가면 속도는 저절로 붙어요.</li>
</ul>

<h2>준비물과 자세</h2>
<ul>
<li><strong>운동화:</strong> 비싼 것보다 <strong>신었을 때 편한 것</strong>이 기준이에요. 오후에 발이 부었을 때 신어 보고, 엄지 앞에 손가락 반 마디쯤 여유를 둬요. 수백 km를 달리면 쿠션이 닳아요.</li>
<li><strong>옷:</strong> 땀이 잘 마르는 옷. 겨울에는 얇게 겹쳐 입어요.</li>
<li><strong>자세:</strong> 시선은 앞을 보고, 어깨에 힘을 빼고, 발은 몸 가까이 가볍게 딛어요. 보폭을 작게, 발걸음을 조금 빠르게 하면 무릎 부담이 줄어요.</li>
<li><strong>준비·정리 운동:</strong> 시작 전 5분 걷기와 가벼운 동작, 끝난 뒤 5분 걷기와 스트레칭</li>
</ul>

<h2>흔한 부상과 예방</h2>
<div class="tbl"><table>
<thead><tr><th>부상</th><th>증상</th><th>예방·대처</th></tr></thead>
<tbody>
<tr><td>러너스 니(슬개대퇴 통증)</td><td>무릎 앞쪽, 계단 내려갈 때 통증</td><td>거리 줄이기, 엉덩이·허벅지 근력 운동</td></tr>
<tr><td>정강이 통증(신스플린트)</td><td>정강이 안쪽을 따라 욱신</td><td>갑자기 거리 늘리지 않기, 쉬기, 딱딱한 길 줄이기</td></tr>
<tr><td>피로 골절</td><td>한 점을 누르면 뼈가 아프고 쉬어도 계속 아픔</td><td>즉시 중단하고 진료</td></tr>
<tr><td>족저근막염</td><td>아침 첫발 뒤꿈치 통증</td><td>종아리·발바닥 스트레칭, 신발 점검</td></tr>
<tr><td>아킬레스건염</td><td>발뒤꿈치 위 힘줄 통증</td><td>언덕·속도 훈련 줄이기, 종아리 근력</td></tr>
</tbody>
<caption>미국스포츠의학회(ACSM), 대한스포츠의학회 러닝 부상 안내를 바탕으로 정리</caption></table></div>
<p>부상의 가장 큰 원인은 <strong>너무 빨리, 너무 많이</strong> 늘리는 거예요. 한 주 거리를 크게 늘리지 않고, 통증이 생기면 며칠 쉬거나 걷기로 바꿔요. 근력 운동을 주 2회 더하면 부상이 줄어요.</p>

<div class="box warn"><span class="h">먼저 건강을 확인해요</span>
<ul>
<li>심장병, 고혈압, 당뇨가 있거나 오래 운동하지 않은 중년 이후라면 시작 전에 의사와 상의해요.</li>
<li>달리는 중 <strong>가슴 통증이나 조임, 심한 숨참, 어지러움, 두근거림</strong>이 생기면 즉시 멈추고, 쉬어도 나아지지 않으면 119에 연락해요.</li>
<li>더운 날에는 이른 아침이나 저녁에 달리고 물을 챙겨요. 어지럽고 메스꺼우면 그늘에서 쉬어요.</li>
</ul></div>

<div class="box"><span class="h">달리기 시작 체크리스트</span>
<ol>
<li>걷기+달리기로 시작</li>
<li>말할 수 있는 속도</li>
<li>주 3회, 사이사이 쉬는 날</li>
<li>편한 운동화 고르기</li>
<li>주 2회 근력 운동 더하기</li>
<li>가슴 통증·어지러움은 즉시 중단</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>달리기가 무릎을 망가뜨리나요?</dt>
<dd>적당한 양의 달리기는 무릎 관절염 위험을 높이지 않는다는 연구가 많아요. 다만 이미 무릎 통증이 있거나 체중이 많다면 걷기, 자전거로 시작해 서서히 넘어가요.</dd>
<dt>아침과 저녁 중 언제 달리는 게 좋나요?</dt>
<dd>꾸준히 할 수 있는 시간이 가장 좋아요. 저녁 늦게 강하게 달리면 잠들기 어려운 사람도 있어요.</dd>
<dt>공복에 달려도 되나요?</dt>
<dd>가볍게 짧게 달린다면 괜찮지만, 어지럽거나 당뇨약을 먹는다면 가볍게 먹고 달려요.</dd>
</dl>
