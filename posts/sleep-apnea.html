  data-title="코골이와 수면무호흡: 옆 사람이 먼저 아는 병, 검사와 양압기 치료까지"
  data-thumb="15회|중등도 기준(시간당)"
  data-summary="코골이는 흔하지만, 자다가 숨이 멈추는 수면무호흡은 낮 졸음과 고혈압, 부정맥, 뇌졸중 위험을 높여요. 단순 코골이와 수면무호흡의 차이, 스스로 해 보는 선별 질문, 수면다원검사와 중증도 기준, 양압기·구강 내 장치·체중 감량·수술 치료, 아이 코골이까지 정리했어요."
  data-tags="코골이,수면무호흡,양압기,수면다원검사,건강상식">
<p class="lead">"자다가 숨을 안 쉬다가 갑자기 컥 하고 쉬더라." 수면무호흡은 본인보다 옆에서 자는 가족이 먼저 알아채는 경우가 많아요. 밤마다 수십 번씩 숨이 막히면 몸은 잠을 자도 쉬지 못하고, 혈압과 심장에 부담이 쌓여요. 다행히 진단과 치료 방법이 잘 갖춰져 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>수면무호흡은 잠든 동안 목의 기도가 막혀 <strong>숨이 10초 이상 멈추거나 약해지는</strong> 일이 반복되는 병이에요.</li>
<li><strong>큰 코골이, 숨 멈춤, 낮 졸음, 아침 두통</strong>이 대표 신호예요.</li>
<li>시간당 호흡 이상 횟수로 중증도를 나누고, <strong>15회 이상이면 중등도</strong>예요.</li>
<li>중등도 이상에는 <strong>양압기</strong>가 가장 효과적이고, 국내에서도 조건에 따라 건강보험이 적용돼요.</li>
</ul></div>

<h2>단순 코골이와 수면무호흡</h2>
<p>잠들면 목 주변 근육이 풀리면서 기도가 좁아지고, 그 사이로 공기가 지나가며 떨리는 소리가 코골이예요. 기도가 더 좁아져 <strong>완전히 막히면 무호흡</strong>, 반쯤 막혀 숨이 크게 약해지면 저호흡이라고 해요. 숨이 막히면 산소가 떨어지고 뇌가 잠깐 깨서 숨을 다시 쉬게 해요. 본인은 기억하지 못하지만 잠이 계속 끊겨요.</p>

<h2>이런 신호가 있어요</h2>
<ul>
<li>크고 불규칙한 코골이, 숨을 멈췄다가 '컥' 하며 몰아쉬기</li>
<li>충분히 자도 <strong>낮에 심하게 졸림</strong>(회의, 운전 중에도)</li>
<li>아침에 두통, 입마름, 목 아픔</li>
<li>밤에 소변 보러 자주 깸</li>
<li>집중력·기억력 저하, 짜증, 우울감</li>
<li>잘 조절되지 않는 고혈압</li>
</ul>

<h2>스스로 해 보는 선별 질문(STOP-BANG)</h2>
<div class="tbl"><table>
<thead><tr><th>질문</th><th>예 / 아니오</th></tr></thead>
<tbody>
<tr><td>코골이가 크나요?(닫힌 문 너머로 들릴 정도)</td><td>□ / □</td></tr>
<tr><td>낮에 자주 피곤하거나 졸리나요?</td><td>□ / □</td></tr>
<tr><td>자다가 숨을 멈추는 것을 누가 본 적이 있나요?</td><td>□ / □</td></tr>
<tr><td>고혈압이 있거나 치료 중인가요?</td><td>□ / □</td></tr>
<tr><td>체질량지수가 높나요?(원래 기준 35 이상, 아시아인은 더 낮은 기준을 쓰기도 해요)</td><td>□ / □</td></tr>
<tr><td>50세 이상인가요?</td><td>□ / □</td></tr>
<tr><td>목둘레가 큰가요?(남성 약 43cm, 여성 약 41cm 이상)</td><td>□ / □</td></tr>
<tr><td>남성인가요?</td><td>□ / □</td></tr>
</tbody>
<caption>STOP-BANG 설문(Chung F 외, 2008)을 바탕으로 정리. '예'가 3개 이상이면 수면무호흡 가능성이 높아 검사를 권해요</caption></table></div>

<h2>검사와 중증도</h2>
<p><strong>수면다원검사</strong>는 병원에서 하룻밤 자면서 뇌파, 호흡, 산소포화도, 심전도, 다리 움직임을 함께 기록하는 검사예요. 시간당 무호흡과 저호흡 횟수(무호흡-저호흡 지수, AHI)로 중증도를 나눠요.</p>
<div class="tbl"><table>
<thead><tr><th>중증도</th><th class="num">시간당 횟수(AHI)</th><th>주된 치료</th></tr></thead>
<tbody>
<tr><td>경증</td><td class="num">5~14회</td><td>체중 감량, 자세 조절, 구강 내 장치, 증상이 있으면 양압기</td></tr>
<tr><td>중등도</td><td class="num">15~29회</td><td>양압기가 우선, 구강 내 장치도 고려</td></tr>
<tr><td>중증</td><td class="num">30회 이상</td><td>양압기</td></tr>
</tbody>
<caption>미국수면의학회(AASM) 진단 기준, 대한수면학회 정보를 바탕으로 정리</caption></table></div>
<p>국내에서는 2018년부터 수면다원검사와 양압기 치료에 일정 조건에서 건강보험이 적용돼요. 자세한 기준은 진료 병원에서 안내받아요. 집에서 하는 간이 수면 검사도 있어요.</p>

<h2>치료</h2>
<ul>
<li><strong>양압기(CPAP):</strong> 코나 입에 마스크를 쓰고 일정한 압력의 공기를 불어 넣어 기도가 막히지 않게 해요. 중등도 이상에서 가장 효과적이에요. 처음엔 불편하지만 마스크를 잘 맞추고 몇 주 적응하면 많은 사람이 "몇 년 만에 제대로 잤다"고 느껴요.</li>
<li><strong>체중 감량:</strong> 과체중이라면 체중의 10%만 줄여도 무호흡이 크게 줄 수 있어요.</li>
<li><strong>자세:</strong> 똑바로 누울 때만 심해지는 경우 옆으로 자면 좋아져요.</li>
<li><strong>구강 내 장치:</strong> 잘 때 아래턱을 앞으로 당겨 기도를 넓히는 장치로, 경증~중등도에 써요. 치과에서 맞춰요.</li>
<li><strong>수술:</strong> 편도가 크거나 코 구조 문제처럼 원인이 뚜렷한 경우에 고려해요. 성인 코골이 수술은 효과가 사람마다 달라 신중히 결정해요.</li>
</ul>

<h2>생활에서 할 일</h2>
<ul>
<li><strong>저녁 술을 피해요.</strong> 술은 목 근육을 더 풀어 무호흡을 악화시켜요.</li>
<li>수면제, 신경안정제는 무호흡을 악화시킬 수 있어 의사에게 알려요.</li>
<li>금연해요. 흡연은 기도 염증과 부기를 늘려요.</li>
<li>코막힘이 있으면 비염 치료를 해요.</li>
</ul>

<div class="box warn"><span class="h">운전과 수면무호흡</span>
<p>치료하지 않은 수면무호흡은 <strong>졸음운전 사고 위험</strong>을 크게 높여요. 운전 중 졸음이 자주 오면 운전을 줄이고 먼저 검사와 치료를 받아요. 직업 운전자라면 특히 중요해요.</p></div>

<h2>아이의 코골이</h2>
<p>아이가 매일 밤 코를 골고, 입을 벌리고 자며, 숨을 멈추거나 자면서 심하게 뒤척인다면 <strong>편도와 아데노이드 비대</strong> 때문일 수 있어요. 아이의 수면무호흡은 낮 졸음보다 <strong>산만함, 과잉행동, 성장 부진, 야뇨</strong>로 나타나기도 해요. 소아청소년과나 이비인후과에서 확인해요. 편도·아데노이드 절제술로 좋아지는 경우가 많아요.</p>

<div class="box"><span class="h">수면무호흡 체크리스트</span>
<ol>
<li>가족에게 코골이·숨 멈춤 물어보기</li>
<li>STOP-BANG 3개 이상이면 검사</li>
<li>중등도 이상이면 양압기 적응해 보기</li>
<li>저녁 술·수면제 피하기</li>
<li>체중 줄이기, 옆으로 자기</li>
<li>운전 중 졸음은 먼저 치료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>코골이 방지 밴드나 스프레이는 효과가 있나요?</dt>
<dd>코 밴드는 코막힘으로 인한 가벼운 코골이에 약간 도움이 될 수 있지만, 수면무호흡을 치료하지는 못해요. 숨 멈춤이나 낮 졸음이 있다면 검사부터 받아요.</dd>
<dt>양압기는 평생 써야 하나요?</dt>
<dd>원인이 그대로라면 계속 써야 효과가 유지돼요. 체중을 많이 줄이면 압력을 낮추거나 다시 검사해 필요성을 판단할 수 있어요.</dd>
<dt>마른 사람도 수면무호흡이 있나요?</dt>
<dd>네. 턱이 작거나 뒤로 들어간 얼굴 구조, 큰 편도, 코 구조 문제가 있으면 마른 사람도 생겨요. 한국인은 비만하지 않아도 턱 구조 때문에 수면무호흡이 생기는 경우가 많다고 알려져 있어요.</dd>
</dl>
