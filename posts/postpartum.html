<template data-id="postpartum" data-cat="hea" data-date="2026.09.30"
  data-title="산후우울: 2주 넘게 이어지는 우울은 도움이 필요한 신호, 엄마 탓이 아니에요, 가족이 할 수 있는 것"
  data-thumb="2주|우울감과 우울증을 가르는 기간"
  data-summary="출산 뒤 기분이 오르내리는 것은 흔하지만, 2주가 넘도록 우울하고 아무것도 즐겁지 않다면 산후우울증일 수 있어요. 산후 우울감과 산후우울증, 드물지만 응급인 산후 정신증의 차이, 스스로 점검하는 질문, 수유 중에도 가능한 치료, 잠을 지키는 가족의 역할, 아빠의 우울, 도움 받을 곳을 정리했어요."
  data-tags="산후우울증,출산,산모건강,육아,건강상식">
<p class="lead">아기가 태어나면 행복해야 한다고들 해요. 그런데 이유 없이 눈물이 나고, 아기를 봐도 기쁘지 않고, 내가 좋은 엄마가 아닌 것 같아 괴로운 사람이 많아요. 이런 마음은 약하거나 모성애가 부족해서가 아니에요. 출산 뒤 급격한 호르몬 변화, 수면 부족, 삶의 큰 변화가 겹쳐 생기는 흔한 병이고, 치료로 좋아져요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>출산 직후 며칠~2주 안의 <strong>산후 우울감</strong>은 많은 산모가 겪고 저절로 좋아져요.</li>
<li><strong>2주 넘게</strong> 우울하고 흥미를 잃었다면 <strong>산후우울증</strong>일 수 있어요. 산모 10명 중 1명 남짓이 겪어요.</li>
<li>상담과 약물 치료로 좋아지고, <strong>수유 중에도</strong> 쓸 수 있는 약이 있어요.</li>
<li><strong>아기나 나 자신을 해칠 생각</strong>, 이상한 소리가 들리는 증상은 바로 응급 도움이 필요해요.</li>
</ul></div>

<h2>세 가지를 구별해요</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>얼마나 흔할까(대략)</th><th>모습</th></tr></thead>
<tbody>
<tr><td>산후 우울감</td><td>산모의 절반 이상</td><td>출산 뒤 며칠 안에 시작해 눈물, 예민함, 불안. 대개 2주 안에 좋아져요</td></tr>
<tr><td>산후우울증</td><td>10~15%</td><td>2주 넘게 이어지는 우울, 흥미 상실, 죄책감, 잠·식욕 변화. 출산 뒤 1년 안에 언제든 시작할 수 있어요</td></tr>
<tr><td>산후 정신증</td><td>1,000명 중 1~2명</td><td>보통 출산 뒤 몇 주 안에 갑자기. 혼란, 환청·망상, 극단적인 기분 변화. 응급 상황이에요</td></tr>
</tbody>
<caption>대한산부인과학회, 미국산부인과학회(ACOG) 산후 우울 선별 권고, 세계보건기구(WHO) 모성 정신건강 자료를 바탕으로 정리</caption></table></div>

<h2>스스로 점검해 보기</h2>
<p>지난 일주일 동안 아래 같은 마음이 자주 있었나요?</p>
<ul>
<li>웃을 수 있었고 사물의 재미있는 면을 볼 수 있었다 → 예전보다 훨씬 덜하다.</li>
<li>일이 잘못되면 필요 이상으로 자신을 탓했다.</li>
<li>이유 없이 불안하거나 걱정스러웠다.</li>
<li>너무 불행해서 잠을 잘 못 잤다.</li>
<li>나 자신을 해치는 생각이 들었다.</li>
</ul>
<p>이 질문들은 산후 우울 선별에 쓰는 에든버러 산후우울척도(EPDS)의 일부를 쉽게 옮긴 거예요. 보건소, 산부인과, 소아청소년과 영유아 검진 때 검사를 받을 수 있어요. 점수보다 <strong>마음이 힘들다는 사실</strong>을 말하는 것이 먼저예요.</p>

<h2>위험을 높이는 것</h2>
<ul>
<li>이전 우울증이나 불안장애, 임신 중 우울</li>
<li>가족 중 우울증</li>
<li>잠을 거의 못 자는 생활, 수유의 어려움</li>
<li>배우자·가족의 지지 부족, 경제적 어려움</li>
<li>임신·출산 합병증, 아기의 입원, 계획하지 않은 임신</li>
</ul>

<h2>치료</h2>
<div class="tbl"><table>
<thead><tr><th>치료</th><th>설명</th></tr></thead>
<tbody>
<tr><td>상담·심리치료</td><td>인지행동치료, 대인관계치료가 효과적이에요. 가벼운 경우 먼저 권해요</td></tr>
<tr><td>항우울제</td><td>중등도 이상이면 함께 써요. 설트랄린 등 일부 약은 모유로 가는 양이 적어 <strong>수유 중에도</strong> 쓸 수 있어요</td></tr>
<tr><td>생활 지원</td><td>수면 확보, 가족의 육아 분담, 산후 도우미</td></tr>
</tbody>
<caption>미국산부인과학회(ACOG), 영국 국립보건임상연구원(NICE) 산전·산후 정신건강 지침을 바탕으로 정리. 약은 정신건강의학과·산부인과와 상의해요</caption></table></div>
<p>치료를 받으면 대부분 좋아져요. 치료하지 않으면 몇 달 이상 이어지고, 아기와의 관계와 가족 전체에 영향을 줄 수 있어요. 도움을 청하는 것은 아기를 위한 일이기도 해요.</p>

<div class="box warn"><span class="h">바로 도움이 필요한 경우</span>
<ul>
<li><strong>아기나 나 자신을 해치고 싶은 생각</strong>이 들어요.</li>
<li>남들이 듣지 못하는 소리가 들리거나, 이상한 믿음이 생겼어요.</li>
<li>며칠째 거의 잠을 자지 않는데도 피곤하지 않고 들떠 있어요.</li>
<li>혼란스럽고 현실감이 없어요.</li>
</ul>
<p>산후 정신증이나 심한 우울일 수 있어요. 아기를 안전한 사람에게 맡기고 <strong>119</strong>나 응급실로 가요. 자살예방 상담전화 <strong>109</strong>, 정신건강 상담전화 <strong>1577-0199</strong>도 24시간 열려 있어요.</p></div>

<h2>가족이 할 수 있는 것</h2>
<ul>
<li>산모가 <strong>한 번에 4~5시간은 이어서 잘 수 있게</strong> 밤중 수유나 돌봄을 번갈아 맡아요. 유축한 모유나 분유를 활용할 수 있어요.</li>
<li>"다들 그렇게 키워"보다 <strong>"많이 힘들지, 내가 뭘 하면 될까"</strong>라고 물어요.</li>
<li>집안일, 식사 준비, 방문객 조절을 맡아요.</li>
<li>우울 신호가 보이면 함께 병원에 가자고 제안해요.</li>
<li>정부와 지자체의 <strong>산모·신생아 건강관리 지원사업</strong>(산후 도우미)을 보건소에서 알아봐요.</li>
</ul>

<h2>아빠도 우울할 수 있어요</h2>
<p>출산 뒤 아빠의 우울도 드물지 않아요. 잠 부족, 책임감, 역할 변화가 겹치고, 배우자가 우울하면 함께 우울해지기도 해요. 짜증, 과음, 일에 몰두하며 집을 피하는 모습으로 나타나기도 해요. 아빠도 힘들다면 상담을 받아요.</p>

<div class="box"><span class="h">산후 마음 건강 체크리스트</span>
<ol>
<li>2주 넘는 우울은 알리기</li>
<li>보건소·병원에서 선별 검사</li>
<li>밤 돌봄 나눠 잠 확보</li>
<li>수유 중 치료도 가능하다는 것 기억</li>
<li>산후 도우미 등 지원 알아보기</li>
<li>해치고 싶은 생각이면 즉시 119·109</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>약을 먹으면 모유 수유를 끊어야 하나요?</dt>
<dd>꼭 그렇지 않아요. 수유 중에도 비교적 안전하게 쓸 수 있는 항우울제가 있어요. 의사에게 수유 중이라고 알리고 함께 정해요.</dd>
<dt>아기가 예쁘지 않다는 생각이 들어 죄책감이 들어요.</dt>
<dd>산후우울증에서 흔한 마음이에요. 치료로 우울이 나아지면 아기와의 애착도 자라요. 부끄러워하지 말고 이야기해 주세요.</dd>
<dt>둘째 때도 또 생기나요?</dt>
<dd>한 번 겪었다면 다시 생길 가능성이 높아요. 다음 임신 때 미리 의료진과 계획을 세우면 도움이 돼요.</dd>
</dl>
