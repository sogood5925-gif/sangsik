  data-thumb="40세|위내시경 시작"
  data-summary="위암은 한국에서 오랫동안 가장 흔한 암 중 하나였어요. 동시에 정기 내시경 덕분에 조기에 발견하는 비율이 세계적으로 높은 암이기도 해요. 헬리코박터균과 위암의 관계, 제균 치료를 권하는 경우, 짠 음식과 흡연, 국가검진, 조기 위암의 내시경 치료를 정리했어요."
  data-tags="위암,헬리코박터,위내시경,제균치료,암검진">
<p class="lead">한국은 위암이 많은 나라예요. 하지만 40세부터 2년마다 위내시경을 받는 국가검진 덕분에, 증상이 없을 때 조기 위암으로 발견되는 비율이 높아졌고 치료 결과도 크게 좋아졌어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>40세 이상</strong>은 국가암검진으로 <strong>2년마다 위내시경</strong>을 받을 수 있어요.</li>
<li><strong>헬리코박터균</strong>은 국제암연구소가 정한 1군 발암 요인이에요. 제균하면 위암 위험이 줄어요.</li>
<li><strong>짠 음식, 흡연, 가족력</strong>이 위험을 높이고, 신선한 채소와 과일이 위험을 낮춰요.</li>
<li>조기 위암은 배를 열지 않고 <strong>내시경으로 절제</strong>할 수 있는 경우가 많아요.</li>
</ul></div>

<h2>한국인에게 위암이 많은 이유</h2>
<ul>
<li><strong>헬리코박터균 감염:</strong> 과거 위생 환경 때문에 어릴 때 감염된 사람이 많았어요. 젊은 세대로 갈수록 감염률이 줄고 있어요.</li>
<li><strong>짠 음식과 염장 식품:</strong> 짠 음식은 위 점막을 손상시키고 헬리코박터균의 해로움을 키워요.</li>
<li><strong>흡연과 음주</strong></li>
<li><strong>가족력:</strong> 가족 중 위암 환자가 있으면 위험이 높아져요. 같은 식습관과 헬리코박터균을 공유하는 영향도 있어요.</li>
</ul>

<h2>헬리코박터균과 위암</h2>
<p>헬리코박터 파일로리는 강한 위산 속에서도 살아남는 세균이에요. 감염되면 대부분 증상 없이 수십 년 동안 위에 머물면서 만성 위염을 일으키고, 일부에서는 위 점막이 얇아지는 <strong>위축성 위염</strong>, 장 점막처럼 바뀌는 <strong>장상피화생</strong>을 거쳐 위암으로 이어질 수 있어요.</p>
<p>국제암연구소는 헬리코박터균을 <strong>1군 발암 요인</strong>으로 분류해요. 감염된 사람이 모두 위암에 걸리는 건 아니지만, 위암의 상당 부분이 이 균과 관련돼 있어요.</p>
<h3>제균하면 위암이 줄까</h3>
<p>국내 연구진의 대규모 임상시험에서, <strong>가족 중 위암 환자가 있는 사람</strong>이 헬리코박터균을 제균하자 위암 발생이 크게 줄었어요(NEJM, 2020). 조기 위암을 내시경으로 절제한 뒤 제균한 환자에서도 새로운 위암 발생이 줄었어요(NEJM, 2018).</p>
<h3>제균 치료를 권하는 경우</h3>
<ul>
<li>위궤양, 십이지장궤양이 있거나 있었던 경우</li>
<li>조기 위암을 내시경으로 절제한 경우</li>
<li>위 MALT 림프종</li>
<li>부모·형제자매 중 위암 환자가 있는 경우</li>
<li>위축성 위염, 장상피화생이 있는 경우 (의사와 상의)</li>
</ul>
<p>검사와 치료 대상은 제도와 진료지침에 따라 조금씩 달라요. 내시경을 받을 때 헬리코박터 검사와 제균에 대해 의사와 상의해 보세요.</p>
<h3>제균 치료</h3>
<ul>
<li>위산억제제와 항생제 두세 가지를 함께 <strong>1~2주</strong> 먹어요.</li>
<li>국내에서는 일부 항생제 내성률이 높아서, 내성 검사 결과나 지역 내성 상황을 고려해 약 조합을 골라요.</li>
<li>약을 <strong>빠짐없이 끝까지</strong> 먹는 게 성공의 핵심이에요. 중간에 멈추면 내성균이 생겨 다음 치료가 어려워져요.</li>
<li>치료가 끝나고 4주 이상 지난 뒤 <strong>요소호기검사</strong> 등으로 제균 성공 여부를 꼭 확인해요.</li>
<li>설사, 입맛 변화, 속 불편감 같은 부작용이 흔하지만 대부분 가벼워요. 심하면 의사와 상의해요.</li>
</ul>

<h2>국가 위암 검진</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th>주기</th><th>검사</th></tr></thead>
<tbody>
<tr><td>40세 이상</td><td>2년</td><td>위내시경 (또는 위장조영검사)</td></tr>
</tbody>
<caption>국립암센터·국민건강보험공단 국가암검진 기준</caption></table></div>
<p>위장조영검사보다 <strong>위내시경</strong>이 작은 병변을 더 잘 찾고, 이상이 있으면 바로 조직검사를 할 수 있어서 권장돼요. 가족력이 있거나 위축성 위염·장상피화생이 있다면 의사가 더 자주 받도록 권하기도 해요.</p>
<h3>수면 내시경을 받는다면</h3>
<ul>
<li>당일에는 운전, 중요한 결정, 위험한 기계 작업을 하지 않아요.</li>
<li>보호자와 함께 가는 게 좋아요.</li>
<li>수면제에 대한 반응은 사람마다 달라서, 호흡기 질환이나 심장 질환이 있다면 미리 알려요.</li>
</ul>

<h2>증상은 늦게 나타난다</h2>
<p>조기 위암은 대부분 <strong>증상이 없어요.</strong> 증상이 나타날 때는 진행된 경우가 많아요.</p>
<ul>
<li>계속되는 소화불량, 속쓰림, 명치 통증</li>
<li>식욕 저하, 조금만 먹어도 배부름</li>
<li>의도하지 않은 체중 감소</li>
<li>검은 변, 피를 토함, 빈혈</li>
<li>음식을 삼키기 어렵거나 자주 토함</li>
</ul>
<p>이런 증상이 있다면 검진 시기와 관계없이 진료를 받아요. 특히 40세 이후 새로 생긴 소화불량은 위산억제제만 먹으며 넘기지 말고 내시경으로 확인해요.</p>

<h2>조기 위암의 치료</h2>
<p>암이 위 점막층에 국한되고 크기와 모양 등 조건이 맞으면, 배를 열지 않고 <strong>내시경 점막하 박리술(ESD)</strong>로 암을 떼어낼 수 있어요. 위를 그대로 보존할 수 있어 회복이 빠르고 삶의 질이 좋아요. 조건에 맞지 않으면 복강경이나 로봇, 개복 수술로 위의 일부나 전체를 절제해요.</p>
<p>조기에 발견된 위암은 치료 후 대부분 좋은 결과를 기대할 수 있어요. 정기 검진이 중요한 이유예요.</p>

<h2>위암 위험을 줄이는 생활</h2>
<div class="tbl"><table>
<thead><tr><th>줄일 것</th><th>늘릴 것</th></tr></thead>
<tbody>
<tr><td>짠 음식, 젓갈, 장아찌 같은 염장 식품</td><td>신선한 채소와 과일</td></tr>
<tr><td>흡연</td><td>금연</td></tr>
<tr><td>과음</td><td>정기 위내시경</td></tr>
<tr><td>탄 음식, 가공육</td><td>헬리코박터 검사와 필요시 제균</td></tr>
</tbody></table></div>

<div class="box"><span class="h">위 건강 체크리스트</span>
<ol>
<li>40세 이상이면 최근 2년 안에 위내시경 받았는지 확인하기</li>
<li>가족 중 위암 환자가 있다면 헬리코박터 검사와 제균 상담하기</li>
<li>제균 치료를 받았다면 성공 여부 확인 검사 받기</li>
<li>국물 덜 먹고 싱겁게 먹기</li>
<li>담배 끊기</li>
<li>새로 생긴 소화불량, 체중 감소, 검은 변은 바로 진료</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>헬리코박터균은 옮나요?</dt>
<dd>주로 어린 시절 가족 안에서 침이나 대변을 통해 옮는 것으로 알려져 있어요. 어른이 된 뒤 새로 감염되는 경우는 드물어요. 찌개를 함께 떠먹는 습관, 아이에게 음식을 씹어 먹이는 습관은 피하는 게 좋아요.</dd>
<dt>제균하면 위암에 안 걸리나요?</dt>
<dd>위험이 줄어들지만 0이 되지는 않아요. 특히 이미 위축성 위염이나 장상피화생이 진행됐다면 제균 후에도 정기 내시경을 계속 받아요.</dd>
<dt>위내시경은 매년 받는 게 더 좋은가요?</dt>
<dd>위험 요인이 없는 사람은 2년 간격이 권장돼요. 가족력, 위축성 위염, 장상피화생, 이전 위암 치료력이 있다면 의사가 1년 간격을 권하기도 해요.</dd>
</dl>
