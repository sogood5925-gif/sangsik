<p class="lead">여름 전기요금 고지서가 무서워 에어컨을 켰다 껐다 반복하는 집이 많아요. 그런데 에어컨 종류에 따라 이 습관이 오히려 전기를 더 쓰게 만들기도 해요. 내 에어컨이 어떤 방식인지부터 알아보면 절약법이 달라져요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>설정 온도는 <strong>26°C 안팎</strong>, 바깥과의 차이는 5~6°C 정도가 무난해요.</li>
<li>요즘 대부분인 <strong>인버터 에어컨</strong>은 자주 끄고 켜기보다 적정 온도로 계속 두는 편이 효율적이에요.</li>
<li><strong>선풍기·서큘레이터</strong>를 함께 쓰면 설정 온도를 1~2°C 올려도 시원해요.</li>
<li>필터는 <strong>2주에 한 번</strong> 청소하고, 끄기 전 송풍으로 속을 말리면 곰팡이 냄새가 줄어요.</li>
</ul></div>

<h2>인버터와 정속형</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>작동 방식</th><th>절약 요령</th></tr></thead>
<tbody>
<tr><td>인버터형</td><td>설정 온도에 가까워지면 압축기 속도를 낮춰 약하게 계속 돌아요</td><td>처음에 빠르게 식힌 뒤 적정 온도로 <strong>계속 켜 두는 편</strong>이 효율적이에요. 짧은 외출에는 끄지 않아도 돼요</td></tr>
<tr><td>정속형</td><td>압축기가 최대로 돌다가 멈추기를 반복해요</td><td>충분히 시원해지면 끄거나 온도를 올리고, 더워지면 다시 켜는 식이 나아요</td></tr>
</tbody>
<caption>한국에너지공단 냉방기기 에너지 절약 안내를 바탕으로 정리</caption></table></div>
<p>에어컨 옆면이나 설명서, 에너지소비효율등급 라벨에서 '인버터' 표시를 확인할 수 있어요. 2010년대 중반 이후 나온 가정용 에어컨은 대부분 인버터형이에요.</p>

<h2>전기를 아끼는 습관</h2>
<ul>
<li><strong>처음에는 강풍으로</strong> 빠르게 온도를 낮추고, 시원해지면 자동이나 약풍으로 바꿔요.</li>
<li><strong>선풍기나 서큘레이터</strong>를 에어컨 바람 방향으로 두어 찬 공기를 방 안에 돌려요. 체감 온도가 내려가요.</li>
<li>낮에는 <strong>커튼이나 블라인드</strong>로 햇빛을 막아요. 창으로 들어오는 열이 냉방 부담의 큰 몫이에요.</li>
<li>냉방 중에는 문과 창문을 닫고, 요리할 때는 후드를 켜 열기를 빼요.</li>
<li>실외기 주변에 물건을 쌓지 않고, 햇빛을 가려 주면 효율이 좋아져요. 다만 통풍구를 막지 않아요.</li>
<li>'제습' 모드가 늘 전기를 덜 쓰는 것은 아니에요. 제품마다 달라서, 습한 날 온도는 적당한데 끈적일 때 쓰면 좋아요.</li>
</ul>

<h2>설정 온도와 건강</h2>
<p>정부는 여름철 실내 권장 온도로 26°C 안팎을 안내해요. 너무 낮게 설정하면 전기요금뿐 아니라 몸도 힘들어요.</p>
<ul>
<li>바깥과 실내 온도 차이가 크면 드나들 때마다 몸이 적응하느라 피로, 두통, 소화불량을 느끼기 쉬워요(흔히 '냉방병'이라고 불러요).</li>
<li>찬 바람이 몸에 <strong>직접 오래 닿지 않게</strong> 바람 방향을 위로 두어요.</li>
<li>얇은 겉옷을 챙기고, 1~2시간마다 잠깐 환기해요.</li>
<li>잠잘 때는 예약 끄기나 수면 모드를 써요.</li>
</ul>
<div class="box warn"><span class="h">어르신과 아이는 너무 참지 않아요</span>
<p>전기요금이 걱정돼 폭염에도 에어컨을 켜지 않다가 온열질환을 겪는 어르신이 많아요. 실내 온도가 30°C 가까이 오르면 에어컨이나 선풍기를 쓰고, 어렵다면 무더위쉼터를 이용해요. 에너지 취약계층을 위한 냉방비 지원 제도도 있으니 주민센터에 문의해요.</p></div>

<h2>필터와 곰팡이 냄새</h2>
<p>에어컨은 공기 속 수분을 차가운 열교환기(핀)에 맺히게 해서 식혀요. 끄고 나면 속이 축축한 채로 남아 곰팡이와 세균이 자라고, 다음에 켤 때 <strong>쉰내</strong>가 나요.</p>
<ul>
<li>끄기 전 <strong>송풍 모드로 10~30분</strong> 돌려 속을 말려요. 요즘 제품에는 자동 건조 기능이 있어요.</li>
<li><strong>먼지 필터는 2주에 한 번</strong> 빼서 먼지를 털고, 물로 씻어 그늘에서 완전히 말려 끼워요.</li>
<li>냄새가 계속 나면 열교환기와 송풍팬 속에 곰팡이가 자란 경우가 많아요. 분해 세척은 제조사 서비스나 전문 업체에 맡겨요.</li>
<li>시중의 에어컨 세정 스프레이는 제품 설명대로 쓰고, 뿌린 뒤 충분히 송풍해 말려요. 전기 부품에 약품이 닿지 않게 해요.</li>
</ul>
<div class="tbl"><table>
<thead><tr><th>주기</th><th>할 일</th></tr></thead>
<tbody>
<tr><td>사용할 때마다</td><td>끄기 전 송풍으로 말리기(자동 건조 켜 두기)</td></tr>
<tr><td>2주마다</td><td>먼지 필터 세척·건조</td></tr>
<tr><td>시즌 시작 전</td><td>필터 청소, 배수 호스 막힘 확인, 실외기 주변 정리, 시험 가동</td></tr>
<tr><td>1~2년마다(냄새가 날 때)</td><td>열교환기·송풍팬 전문 세척</td></tr>
</tbody></table></div>

<h2>시즌 시작 전 점검</h2>
<ol>
<li>전원 플러그와 콘센트 상태를 확인해요. 에어컨은 전용 콘센트에 꽂고 멀티탭을 쓰지 않아요.</li>
<li>실외기 주변의 쓰레기와 낙엽을 치우고, 받침대가 녹슬지 않았는지 봐요.</li>
<li>배수 호스가 꺾이거나 막히지 않았는지 확인해요. 물이 실내로 떨어지면 막힌 거예요.</li>
<li>15분쯤 틀어 찬 바람이 잘 나오는지, 이상한 소리가 없는지 확인해요. 시원하지 않으면 냉매 점검을 받아요.</li>
</ol>

<h2>전기요금 구조 이해하기</h2>
<p>주택용 전기요금은 쓰는 양이 많아질수록 단가가 올라가는 <strong>누진 구조</strong>예요. 여름철에는 구간이 조금 넓어지지만, 에어컨을 오래 쓰면 높은 구간으로 넘어가기 쉬워요. 한국전력 앱에서 이번 달 사용량을 중간중간 확인하면 요금 폭탄을 피할 수 있어요. 요금 단가와 구간은 해마다 바뀔 수 있어요.</p>

<div class="box"><span class="h">여름 냉방 체크리스트</span>
<ol>
<li>내 에어컨이 인버터형인지 확인</li>
<li>설정 온도 26°C 안팎 + 선풍기</li>
<li>낮에는 커튼으로 햇빛 가리기</li>
<li>끄기 전 송풍으로 말리기</li>
<li>필터 2주마다 청소</li>
<li>한전 앱으로 사용량 중간 점검</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>외출할 때 끄는 게 나은가요?</dt>
<dd>인버터 에어컨이라면 30분~1시간 정도의 짧은 외출에는 켜 두는 편이 다시 켜서 식히는 것보다 전기를 덜 쓸 수 있어요. 반나절 이상 비운다면 끄는 게 나아요.</dd>
<dt>에어컨을 켜면 목이 아파요.</dt>
<dd>냉방 중에는 습도가 크게 떨어지고 찬 바람이 직접 닿아 목이 마르기 쉬워요. 바람 방향을 바꾸고, 물을 자주 마시고, 필터를 청소해 보세요.</dd>
<dt>실외기에 물을 뿌리면 효율이 좋아지나요?</dt>
<dd>일시적으로 열을 식히는 효과가 있을 수 있지만 부식과 전기 안전 문제가 생길 수 있어요. 그늘을 만들어 주고 통풍을 확보하는 방법이 더 안전해요.</dd>
</dl>
