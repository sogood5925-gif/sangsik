  data-title="정전 대비: 우리 집만인지 확인, 냉장고 문 열지 않기, 엘리베이터 갇힘과 의료기기 준비"
  data-thumb="4시간|닫힌 냉장고가 버티는 시간"
  data-summary="정전은 태풍이나 폭염, 설비 고장으로 예고 없이 찾아와요. 우리 집만 정전인지 확인하는 순서, 신고할 곳, 냉장고·냉동실 음식 관리 기준, 엘리베이터에 갇혔을 때, 촛불과 발전기 사고 예방, 전기 의료기기를 쓰는 가족의 준비, 전기가 돌아온 뒤 할 일을 정리했어요."
  data-tags="정전,냉장고,엘리베이터,재난대비,생활정보">
<p class="lead">불이 한꺼번에 꺼지면 순간 당황하게 돼요. 대부분의 정전은 몇 분에서 몇 시간 안에 복구되지만, 여름 폭염이나 겨울 한파 중이라면, 또 집에 전기 의료기기를 쓰는 가족이 있다면 이야기가 달라져요. 미리 몇 가지를 준비해 두면 차분하게 기다릴 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>먼저 <strong>우리 집 누전차단기</strong>와 이웃집 불빛을 보고, 우리 집만인지 확인해요.</li>
<li>냉장고 문을 열지 않으면 냉장실은 <strong>약 4시간</strong>, 가득 찬 냉동실은 <strong>약 48시간</strong> 버텨요.</li>
<li>조명은 촛불보다 <strong>손전등·랜턴</strong>을 써요. 발전기는 절대 실내에서 돌리지 않아요.</li>
<li>전기 의료기기를 쓰는 가족이 있다면 <strong>예비 전원과 대피 계획</strong>을 미리 세워요.</li>
</ul></div>

<h2>정전이 되면 먼저 확인할 것</h2>
<ol>
<li><strong>이웃집, 복도, 가로등</strong>이 켜져 있는지 봐요.</li>
<li>다른 곳은 켜져 있다면 우리 집 <strong>분전반의 누전차단기</strong>가 내려갔는지 확인해요. 올려도 다시 떨어지면 어느 기기에서 누전이 생긴 것일 수 있어요. 전기 기술자의 점검을 받아요.</li>
<li>아파트 전체가 정전이면 <strong>관리사무소</strong>에 문의해요. 단지 안 설비 문제일 수 있어요.</li>
<li>동네 전체가 정전이면 <strong>한국전력 고객센터(국번 없이 123)</strong>에 신고하거나 복구 예정 시간을 확인해요.</li>
</ol>

<h2>냉장고 음식 관리</h2>
<div class="tbl"><table>
<thead><tr><th>상황</th><th>버티는 시간(문을 닫아 둘 때)</th><th>판단</th></tr></thead>
<tbody>
<tr><td>냉장실</td><td class="num">약 4시간</td><td>정전이 4시간 넘게 이어졌다면 고기, 생선, 달걀, 유제품, 남은 음식은 버리는 것이 안전해요</td></tr>
<tr><td>냉동실(가득 참)</td><td class="num">약 48시간</td><td>얼음 결정이 남아 있거나 냉장 온도(4°C 안팎) 이하라면 다시 얼려도 돼요</td></tr>
<tr><td>냉동실(반쯤 참)</td><td class="num">약 24시간</td><td>완전히 녹아 따뜻해진 고기·생선은 버려요</td></tr>
</tbody>
<caption>미국 농무부(USDA) Food Safety During Power Outage, 식품의약품안전처 식품 보관 안내를 바탕으로 정리</caption></table></div>
<ul>
<li>정전 중에는 <strong>문을 최대한 열지 않아요.</strong></li>
<li>냉장고용 온도계가 있으면 판단이 쉬워요.</li>
<li>의심스러우면 버려요. 냄새나 모양으로는 식중독균을 알 수 없어요.</li>
<li>인슐린처럼 냉장 보관하는 약은 설명서를 확인하고, 오래 걸리면 약국이나 병원에 문의해요.</li>
</ul>

<h2>엘리베이터에 갇혔을 때</h2>
<ul>
<li>당황하지 말고 <strong>비상 호출 버튼</strong>을 눌러 관리실에 알리고, 휴대폰으로 119에 신고해요.</li>
<li>엘리베이터는 정전돼도 줄이 끊어져 떨어지지 않도록 안전장치가 있어요.</li>
<li><strong>문을 억지로 열거나 틈으로 빠져나오려 하지 않아요.</strong> 층 사이에 멈춘 경우 추락할 수 있어요.</li>
<li>구조를 기다리는 동안 앉아서 숨을 고르고, 엘리베이터 번호와 층을 알려요.</li>
</ul>

<h2>조명과 난방·냉방</h2>
<div class="tbl"><table>
<thead><tr><th>대신 쓰는 것</th><th>주의</th></tr></thead>
<tbody>
<tr><td>손전등, 랜턴, 휴대폰 불빛</td><td>가장 안전해요. 여분 건전지와 보조배터리를 준비해요</td></tr>
<tr><td>촛불</td><td>화재 위험. 쓰면 불연성 받침에 두고 절대 자리를 비우지 않아요</td></tr>
<tr><td>휴대용 발전기, 캠핑용 난로</td><td><strong>실내·베란다에서 쓰지 않아요.</strong> 일산화탄소 중독 위험</td></tr>
<tr><td>가스레인지로 난방</td><td>하지 않아요. 일산화탄소와 화재 위험</td></tr>
</tbody>
<caption>소방청, 행정안전부 정전 대비 국민행동요령을 바탕으로 정리</caption></table></div>
<p>여름 정전 때는 창문을 열어 바람을 통하게 하고, 물을 자주 마시며, 어르신과 아이가 더위를 먹지 않게 살펴요. 오래 이어지면 무더위 쉼터처럼 전기가 들어오는 곳으로 옮겨요. 겨울에는 옷을 겹쳐 입고 한 방에 모여 체온을 지켜요.</p>

<div class="box warn"><span class="h">전기 의료기기를 쓰는 가족이 있다면</span>
<p>산소 발생기, 가정용 인공호흡기, 흡인기, 전동 침대 등을 쓴다면 <strong>예비 배터리와 사용 가능 시간</strong>을 미리 확인하고, 산소통 같은 대체 수단을 준비해요. 정전이 길어질 때 갈 병원이나 시설을 정해 두고, 한국전력과 주민센터에 의료기기 사용 가구로 알려 둘 수 있는지 문의해요. 숨이 차거나 기기가 멈추면 바로 119에 연락해요.</p></div>

<h2>고층 아파트라면</h2>
<ul>
<li>물을 끌어올리는 펌프가 멈춰 <strong>단수</strong>가 함께 올 수 있어요. 욕조나 통에 물을 받아 두면 화장실 물로 쓸 수 있어요.</li>
<li>계단을 이용할 때 손전등을 들고 난간을 잡아요.</li>
<li>현관 도어록 배터리가 방전되지 않았는지 확인해요.</li>
</ul>

<h2>전기가 돌아온 뒤</h2>
<ul>
<li>정전 중에는 전기 기기의 <strong>플러그를 뽑아</strong> 두고, 복구되면 하나씩 꽂아요. 전압이 튀어 고장 나는 것을 줄여요.</li>
<li>전등 하나는 켜 두면 복구를 바로 알 수 있어요.</li>
<li>냉장고 음식을 점검하고, 냉동실에 얼음을 새로 만들어 둬요.</li>
<li>물에 잠겼던 기기는 점검 전에 켜지 않아요.</li>
</ul>

<div class="box"><span class="h">정전 대비 체크리스트</span>
<ol>
<li>손전등·랜턴과 여분 건전지</li>
<li>보조배터리 충전해 두기</li>
<li>분전반 위치와 누전차단기 확인법</li>
<li>한국전력 123, 관리사무소 번호 저장</li>
<li>정전 중 냉장고 문 열지 않기</li>
<li>의료기기 예비 전원과 대피 계획</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>계획 정전은 어떻게 알 수 있나요?</dt>
<dd>설비 공사 등으로 미리 정해진 정전은 관리사무소나 한국전력이 안내해요. 아파트 게시판과 문자 안내를 확인해요.</dd>
<dt>정전 중에 컴퓨터가 꺼져 파일이 날아갔어요.</dt>
<dd>중요한 작업은 자주 저장하고, 필요하면 무정전 전원 장치를 쓰면 좋아요. 복구 뒤 기기를 켜기 전에 전압이 안정되기를 잠시 기다려요.</dd>
<dt>냉동실 음식이 반쯤 녹았어요.</dt>
<dd>얼음 결정이 남아 있거나 차갑다면 다시 얼려도 되지만 맛과 식감이 떨어질 수 있어요. 완전히 녹아 따뜻해진 고기·생선은 버려요.</dd>
</dl>
