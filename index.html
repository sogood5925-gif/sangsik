<template data-id="depression" data-cat="dis" data-date="2026.09.29"
  data-title="우울증 바로 알기: 의지의 문제가 아닌 이유, 치료로 좋아지는 병"
  data-thumb="2주|진단 기준 기간"
  data-summary="우울증은 기분이 조금 가라앉은 상태가 아니라 생각, 몸, 일상 전체에 영향을 주는 병이에요. 진단 기준과 증상, 우울감과 우울증의 차이, 약물과 상담 치료가 어떻게 돕는지, 항우울제에 대한 오해, 곁에 있는 사람이 할 수 있는 일과 도움받을 곳을 정리했어요."
  data-tags="우울증,정신건강,항우울제,상담치료,자살예방">
<p class="lead">우울증은 "힘내", "생각을 바꿔봐"라는 말로 낫지 않아요. 감기에 의지로 대응하지 않듯, 우울증도 치료가 필요한 병이에요. 그리고 치료하면 대부분 좋아져요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>우울한 기분이나 흥미 상실이 <strong>2주 넘게</strong> 거의 매일 이어지면 우울증을 의심해요.</li>
<li>잠, 식욕, 집중력, 몸의 기운까지 바뀌는 <strong>온몸의 병</strong>이에요.</li>
<li><strong>약물 치료와 상담 치료</strong> 모두 효과가 있고, 함께하면 더 좋아요.</li>
<li>죽고 싶은 생각이 든다면 지금 <strong>109</strong>(자살예방상담전화)에 연락할 수 있어요. 24시간 열려 있어요.</li>
</ul></div>

<h2>우울감과 우울증은 다르다</h2>
<p>살다 보면 슬프고 무기력한 날이 있어요. 실망하거나 잃었을 때 드는 자연스러운 감정이고, 시간이 지나거나 상황이 바뀌면 나아져요. 우울증은 이런 감정이 <strong>오래, 깊게</strong> 이어지면서 일상을 무너뜨리는 상태예요.</p>
<div class="box note"><span class="h">주요우울장애 진단 기준</span>
<p>아래 증상 중 <strong>5가지 이상</strong>이 <strong>2주 이상</strong> 거의 매일 이어지고, 그중 하나는 1번이나 2번이어야 해요.</p>
<ol>
<li>하루 대부분 우울한 기분 (슬픔, 공허함, 절망감)</li>
<li>거의 모든 활동에 흥미나 즐거움이 줄어듦</li>
<li>식욕이나 체중의 뚜렷한 변화</li>
<li>잠을 못 자거나 너무 많이 잠</li>
<li>몸과 생각이 느려지거나, 안절부절못함</li>
<li>피로하고 기운이 없음</li>
<li>내가 가치 없다는 느낌, 지나친 죄책감</li>
<li>집중력과 결정 능력 저하</li>
<li>죽음이나 자살에 대한 반복적인 생각</li>
</ol>
<p>미국정신의학회 진단 기준(DSM-5)을 바탕으로 정리했어요. 스스로 진단하기보다 전문가와 확인하는 데 참고해요.</p></div>

<h2>얼마나 흔할까</h2>
<p>국내 정신건강 실태조사에서 성인 여러 명 중 한 명꼴로 평생 한 번 이상 우울증을 겪는 것으로 나타났어요. 누구에게나 생길 수 있는 흔한 병이지만, 실제로 치료를 받는 사람은 그중 일부예요. 병이라는 걸 모르거나, 도움을 청하는 걸 망설이기 때문이에요.</p>

<h2>왜 생길까</h2>
<p>한 가지 원인으로 설명되지 않아요. 여러 요인이 겹쳐 생겨요.</p>
<ul>
<li><strong>생물학적 요인:</strong> 가족력, 뇌의 신경전달물질과 스트레스 조절 체계의 변화, 갑상선 질환 같은 신체 질환, 일부 약물</li>
<li><strong>심리적 요인:</strong> 자신을 지나치게 비판하는 생각 습관, 완벽주의, 어린 시절의 상처</li>
<li><strong>사회적 요인:</strong> 상실, 이별, 실직, 경제적 어려움, 고립, 오랜 돌봄 부담</li>
<li><strong>특정 시기:</strong> 출산 후(산후우울증), 폐경기, 노년기, 큰 병을 진단받은 뒤</li>
</ul>
<p>그래서 우울증은 성격이 약하거나 의지가 부족해서 생기는 게 아니에요.</p>

<h2>우울증은 이렇게 보이기도 한다</h2>
<ul>
<li><strong>몸의 증상:</strong> 두통, 소화불량, 여기저기 아픔, 만성 피로로 병원을 다니다 우울증을 발견하는 경우가 많아요.</li>
<li><strong>짜증과 분노:</strong> 특히 남성과 청소년은 슬픔보다 짜증, 공격성, 과음으로 나타나기도 해요.</li>
<li><strong>노인:</strong> 기억력 저하로 나타나 치매처럼 보이기도 해요.</li>
<li><strong>산후:</strong> 출산 후 2주 넘게 이어지는 깊은 우울, 아기를 돌볼 수 없을 것 같은 무력감은 산후우울증일 수 있어요.</li>
</ul>

<h2>치료</h2>
<div class="tbl"><table>
<thead><tr><th>치료</th><th>설명</th></tr></thead>
<tbody>
<tr><td>약물 치료 (항우울제)</td><td>보통 2~4주 뒤부터 효과가 나타나기 시작해 6~12주에 걸쳐 좋아져요. 좋아진 뒤에도 재발을 막기 위해 일정 기간(흔히 6~12개월) 더 유지해요</td></tr>
<tr><td>심리 치료</td><td>인지행동치료는 우울을 키우는 생각과 행동 패턴을 바꾸는 연습을 해요. 대인관계치료 등 다른 방법도 효과가 있어요</td></tr>
<tr><td>병행 치료</td><td>중등도 이상의 우울증에서는 약물과 심리 치료를 함께할 때 효과가 더 좋은 경우가 많아요</td></tr>
<tr><td>그 밖에</td><td>약에 잘 반응하지 않는 경우 경두개자기자극술, 전기경련치료 등이 쓰여요</td></tr>
</tbody></table></div>
<h3>생활 속에서 돕는 것</h3>
<ul>
<li><strong>운동:</strong> 규칙적인 신체 활동은 가벼운~중간 정도의 우울 증상을 줄이는 효과가 있어요.</li>
<li><strong>수면 리듬:</strong> 같은 시간에 일어나고 아침 햇빛을 받아요.</li>
<li><strong>작은 활동:</strong> 기분이 좋아질 때까지 기다리기보다 작은 일(샤워, 짧은 산책)을 먼저 해보는 게 기분을 움직여요.</li>
<li><strong>술 줄이기:</strong> 술은 잠깐 잊게 하지만 우울을 깊게 해요.</li>
</ul>

<h2>항우울제에 대한 오해</h2>
<dl class="qa">
<dt>항우울제는 중독되나요?</dt>
<dd>항우울제는 마약이나 수면제처럼 점점 더 많이 찾게 되는 중독을 일으키지 않아요. 다만 갑자기 끊으면 어지러움, 예민함 같은 중단 증상이 생길 수 있어서, 끊을 때는 의사와 함께 서서히 줄여요.</dd>
<dt>약을 먹으면 성격이 바뀌나요?</dt>
<dd>항우울제는 성격을 바꾸는 약이 아니라 우울증 때문에 잃었던 원래의 나를 되찾도록 돕는 약이에요.</dd>
<dt>약을 먹으면 평생 먹어야 하나요?</dt>
<dd>처음 우울증이라면 좋아진 뒤 일정 기간 유지하고 끊는 경우가 많아요. 여러 번 재발했다면 더 오래 먹기도 해요.</dd>
<dt>정신건강의학과 기록이 남으면 불이익이 있나요?</dt>
<dd>진료 기록은 본인 동의 없이 직장이나 학교에 알려지지 않아요. 치료하지 않은 우울증이 일과 생활에 주는 불이익이 훨씬 커요.</dd>
</dl>

<h2>곁에 있는 사람이 할 수 있는 일</h2>
<ul>
<li><strong>조언보다 들어주기:</strong> "왜 그렇게 생각해?"보다 "많이 힘들었겠다"가 더 힘이 돼요.</li>
<li><strong>재촉하지 않기:</strong> "기운 내", "다들 힘들어" 같은 말은 오히려 고립감을 키울 수 있어요.</li>
<li><strong>치료를 함께 알아보기:</strong> 병원 예약이나 동행을 도와주면 첫걸음이 쉬워져요.</li>
<li><strong>직접 물어보기:</strong> 걱정된다면 "혹시 죽고 싶다는 생각을 해본 적 있어?"라고 물어봐도 괜찮아요. 이런 질문이 위험을 높이지 않고, 오히려 말할 기회를 준다는 연구가 있어요.</li>
<li><strong>나를 돌보기:</strong> 돌보는 사람도 지칠 수 있어요. 혼자 감당하지 말고 도움을 받아요.</li>
</ul>

<div class="box warn"><span class="h">지금 도움이 필요하다면</span>
<ul>
<li><strong>자살예방상담전화 109</strong> (24시간)</li>
<li><strong>정신건강위기상담전화 1577-0199</strong> (24시간)</li>
<li>위험이 급하면 <strong>119, 112</strong></li>
<li>가까운 <strong>정신건강복지센터</strong>, 정신건강의학과</li>
</ul>
<p>혼자 견디지 않아도 돼요. 연락하는 것만으로도 충분히 용기 있는 일이에요.</p></div>

<div class="box"><span class="h">나를 살피는 체크리스트</span>
<ol>
<li>최근 2주 동안 거의 매일 우울하거나 흥미가 없었나요?</li>
<li>잠, 식욕, 기운이 크게 달라졌나요?</li>
<li>일이나 공부, 관계가 어려워졌나요?</li>
<li>나 자신이 쓸모없다고 느끼나요?</li>
<li>해당한다면 정신건강의학과나 정신건강복지센터에 상담해 보세요.</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>상담만으로도 좋아질 수 있나요?</dt>
<dd>가벼운~중간 정도의 우울증은 심리 치료만으로도 좋아지는 경우가 많아요. 증상이 심하거나 오래됐다면 약물 치료를 함께 고려해요. 정부의 심리상담 지원 사업도 있으니 정신건강복지센터에 물어보세요.</dd>
<dt>좋아졌다가 다시 우울해져요.</dt>
<dd>우울증은 재발할 수 있는 병이에요. 재발 초기 신호(잠이 흐트러짐, 흥미가 줄어듦)를 알아두고 빨리 치료를 다시 시작하면 짧게 지나갈 수 있어요.</dd>
<dt>아이도 우울증에 걸리나요?</dt>
<dd>네. 아이와 청소년은 짜증, 성적 저하, 등교 거부, 몸이 아프다는 호소로 나타나기도 해요. 걱정되면 소아청소년 정신건강의학과 상담을 받아요.</dd>
</dl>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>줄여야 할 건 과일·우유의 <strong>천연당</strong>이 아니라, 음식에 넣은 <strong>첨가당</strong>과 주스의 당이에요.</li>
<li>세계보건기구는 첨가당을 <strong>하루 열량의 10% 미만</strong>(약 50g), 가능하면 <strong>5% 미만</strong>(약 25g)으로 권해요.</li>
<li>한국인의 첨가당은 <strong>음료</strong>에서 가장 많이 와요. 음료 하나만 바꿔도 크게 줄어요.</li>
<li>꿀, 조청, 올리고당, 흑설탕도 모두 <strong>당</strong>이에요.</li>
</ul></div>

<h2>천연당과 첨가당</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>예</th><th>특징</th></tr></thead>
<tbody>
<tr><td>천연당 (식품 본래의 당)</td><td>생과일의 과당, 우유의 유당, 채소의 당</td><td>식이섬유, 비타민, 단백질과 함께 있어 흡수가 느리고 포만감을 줘요</td></tr>
<tr><td>첨가당 (넣은 당)</td><td>설탕, 물엿, 액상과당, 시럽, 꿀</td><td>빠르게 흡수되고, 열량은 있지만 다른 영양소가 거의 없어요</td></tr>
<tr><td>주스·농축 당</td><td>과일주스, 스무디의 당</td><td>식이섬유가 빠져서 첨가당처럼 작용해요. 세계보건기구도 '유리당'에 포함해요</td></tr>
</tbody></table></div>
<p>세계보건기구는 줄여야 할 당을 <strong>유리당(free sugars)</strong>이라고 불러요. 첨가당과 꿀, 시럽, 과일주스의 당을 모두 포함해요. 반면 생과일과 우유에 든 당은 여기에 들어가지 않아요.</p>

<h2>얼마나 먹어도 될까</h2>
<div class="tbl"><table>
<thead><tr><th>기준</th><th>권고</th><th>하루 2,000kcal 기준</th></tr></thead>
<tbody>
<tr><td>세계보건기구 강력 권고</td><td>유리당 열량의 10% 미만</td><td class="num">약 50g (각설탕 약 12~16개)</td></tr>
<tr><td>세계보건기구 조건부 권고</td><td>유리당 열량의 5% 미만</td><td class="num">약 25g</td></tr>
<tr><td>한국인 영양소 섭취기준</td><td>총 당류 열량의 10~20%, 특히 첨가당은 10% 이내</td><td class="num">첨가당 약 50g 이내</td></tr>
</tbody>
<caption>세계보건기구(2015), 보건복지부·한국영양학회 2020 한국인 영양소 섭취기준</caption></table></div>

<h2>당이 어디서 올까</h2>
<p>국민건강영양조사 분석에서 한국인이 먹는 첨가당은 <strong>음료류</strong>(탄산음료, 과일음료, 커피 음료 등)에서 가장 많이 와요. 그다음이 과자, 빵, 떡, 설탕을 넣은 양념과 소스예요. 특히 청소년과 젊은 성인은 음료로 먹는 당의 비중이 커요.</p>
<div class="tbl"><table>
<thead><tr><th>음료·식품</th><th>당류 (대략)</th></tr></thead>
<tbody>
<tr><td>콜라 1캔 (250mL)</td><td class="num">약 25~27g</td></tr>
<tr><td>과일주스 1컵 (200mL)</td><td class="num">약 20g</td></tr>
<tr><td>달콤한 커피 음료, 시럽 넣은 라떼</td><td class="num">제품에 따라 20~40g</td></tr>
<tr><td>믹스커피 1봉</td><td class="num">약 5~6g</td></tr>
<tr><td>가당 요거트 1개</td><td class="num">약 10~15g</td></tr>
<tr><td>초코 과자, 케이크 한 조각</td><td class="num">15~30g</td></tr>
</tbody>
<caption>제품마다 차이가 크니 영양성분표의 '당류'를 확인하세요.</caption></table></div>
<p>콜라 한 캔이면 세계보건기구의 이상적 목표(25g)를 한 번에 채워요. 음료의 당은 마셔도 배가 부르지 않아서 다른 음식을 덜 먹게 되지도 않아요. 그래서 열량이 그대로 더해져요.</p>

<h2>많이 먹으면 생기는 일</h2>
<ul>
<li><strong>충치:</strong> 입 안 세균이 당을 먹고 산을 만들어 치아를 녹여요. 양보다 먹는 <strong>횟수</strong>가 더 중요해요.</li>
<li><strong>체중 증가:</strong> 특히 단 음료는 체중 증가와 뚜렷하게 관련돼 있어요.</li>
<li><strong>제2형 당뇨병:</strong> 단 음료를 자주 마시는 사람은 체중과 관계없이 당뇨병 위험이 높았다는 연구들이 있어요.</li>
<li><strong>지방간과 중성지방:</strong> 과당은 간에서 지방으로 쉽게 바뀌어요.</li>
<li><strong>심혈관 질환:</strong> 첨가당 비율이 높을수록 심혈관 질환 사망 위험이 높았다는 연구가 있어요.</li>
</ul>

<h2>숨은 당의 이름</h2>
<p>원재료명에 '설탕'이 없다고 당이 없는 게 아니에요. 아래는 모두 당류예요.</p>
<ul>
<li>설탕, 흑설탕, 황설탕, 원당, 비정제 설탕</li>
<li>물엿, 조청, 올리고당, 당시럽, 캐러멜</li>
<li>액상과당, 고과당 옥수수시럽, 과당, 포도당, 맥아당, 덱스트로스</li>
<li>꿀, 메이플시럽, 아가베시럽, 농축 과즙</li>
</ul>
<p>흑설탕, 꿀, 조청이 백설탕보다 건강하다고 여기기 쉽지만, 미네랄이 약간 더 있을 뿐 <strong>몸에서는 거의 같은 당</strong>으로 작용해요.</p>

<h2>현실적으로 줄이는 방법</h2>
<div class="tbl"><table>
<thead><tr><th>단계</th><th>실천</th></tr></thead>
<tbody>
<tr><td>1. 음료부터</td><td>단 음료를 물, 탄산수, 무가당 차로. 가장 효과가 커요</td></tr>
<tr><td>2. 커피</td><td>시럽을 반으로, 그다음 빼기. 믹스커피는 하루 개수를 정해요</td></tr>
<tr><td>3. 과일은 통째로</td><td>주스 대신 생과일을 씹어 먹어요</td></tr>
<tr><td>4. 간식 바꾸기</td><td>과자 대신 과일, 견과류, 플레인 요거트에 과일</td></tr>
<tr><td>5. 요리</td><td>양념의 설탕·물엿을 조금씩 줄이고 양파, 배즙, 향신료로 단맛과 풍미를 더해요</td></tr>
<tr><td>6. 장보기</td><td>영양성분표의 당류(g)를 비교하고 '무가당' 제품을 골라요</td></tr>
</tbody></table></div>
<p>단맛에 대한 입맛도 짠맛처럼 몇 주면 적응해요. 한 번에 끊기보다 단계적으로 줄이면 훨씬 쉬워요.</p>

<h2>아이에게 단맛은 천천히</h2>
<ul>
<li>여러 소아 보건기관은 <strong>2세 미만</strong> 아이에게는 첨가당을 주지 않도록 권해요.</li>
<li>어릴 때 익숙해진 입맛은 오래가요. 주스보다 과일, 가당 요거트보다 플레인 요거트로 시작해요.</li>
<li>1세 미만 아기에게는 <strong>꿀을 주지 않아요.</strong> 보툴리눔균 포자 때문에 영아 보툴리누스증이 생길 수 있어요.</li>
<li>'어린이 음료', '아기 과자'도 당이 많은 경우가 있으니 영양성분표를 확인해요.</li>
</ul>

<div class="box"><span class="h">일주일 당 줄이기 도전</span>
<ol>
<li>오늘 마신 음료의 당류를 영양성분표로 더해보기</li>
<li>단 음료 하루 한 병을 물이나 탄산수로 바꾸기</li>
<li>커피 시럽 반으로 줄이기</li>
<li>과일주스 대신 생과일</li>
<li>간식 서랍에 견과류 두기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>과일도 당이 많은데 줄여야 하나요?</dt>
<dd>생과일은 식이섬유와 비타민이 함께 있어 첨가당과 다르게 봐요. 하루 1~2회 적당히 먹는 건 건강에 좋아요. 다만 당뇨병이 있다면 양과 종류를 조절하고, 말린 과일과 주스는 적게 먹어요.</dd>
<dt>설탕을 끊으면 금단 증상이 생기나요?</dt>
<dd>처음 며칠은 단것이 강하게 당기고 기분이 가라앉는 느낌이 들 수 있어요. 다만 이를 약물 중독과 같은 '설탕 중독'으로 보기에는 사람 대상 근거가 아직 부족해요. 서서히 줄이면 대부분 적응해요.</dd>
<dt>대체 감미료는 괜찮나요?</dt>
<dd>허용 기준 안에서 쓰여 안전성은 관리되고 있어요. 다만 세계보건기구는 체중 조절 목적으로 쓰는 것을 권하지 않아요. 단 음료를 끊는 징검다리로 쓰고, 결국 물로 바꾸는 게 가장 좋아요.</dd>
</dl>

<h2>참고 자료</h2>

<p class="lead">심장이 멈추면 뇌는 몇 분 만에 손상되기 시작해요. 구급차가 도착하기까지 걸리는 시간 동안 누군가 가슴을 눌러주는 것, 그것이 생명을 이어주는 유일한 방법이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>반응이 없고 <strong>정상적인 호흡이 없으면</strong> 바로 119에 신고하고 가슴 압박을 시작해요.</li>
<li>가슴 한가운데를 <strong>약 5cm 깊이로, 1분에 100~120회</strong> 속도로 눌러요.</li>
<li><strong>자동심장충격기(AED)</strong>는 전원만 켜면 음성으로 안내해요. 누구나 쓸 수 있어요.</li>
<li>선의로 한 응급처치는 법으로 보호돼요. <strong>망설이지 않는 것</strong>이 가장 중요해요.</li>
</ul></div>

<h2>왜 옆 사람이 해야 할까</h2>
<p>심정지가 생기면 뇌에 산소가 공급되지 않아 <strong>4~5분</strong>이 지나면서 뇌 손상이 시작돼요. 구급차가 현장에 도착하는 데는 그보다 오래 걸리는 경우가 많아요. 그 사이 목격한 사람이 심폐소생술을 하면 생존 가능성이 크게 올라가요. 가슴 압박은 멈춘 심장 대신 피를 뇌로 보내는 역할을 해요.</p>

<h2>성인 심폐소생술 순서</h2>
<h3>1. 반응 확인</h3>
<p>쓰러진 사람의 어깨를 가볍게 두드리며 큰 소리로 "괜찮으세요?"라고 물어요.</p>
<h3>2. 도움 요청과 119 신고</h3>
<p>반응이 없으면 주변 사람을 <strong>한 명씩 지목</strong>해서 부탁해요.</p>
<ul>
<li>"당신은 119에 신고해 주세요."</li>
<li>"당신은 자동심장충격기를 가져다주세요."</li>
</ul>
<p>혼자라면 휴대폰을 스피커폰으로 켜고 119에 신고해요. <strong>119 상담원이 전화로 방법을 안내</strong>해 줘요.</p>
<h3>3. 호흡 확인</h3>
<p>얼굴과 가슴을 보며 <strong>10초 이내</strong>로 숨을 쉬는지 확인해요. 숨을 쉬지 않거나, 가끔 헐떡이듯 숨을 몰아쉬는 것(비정상 호흡)은 심정지 신호예요. 헐떡임을 정상 호흡으로 착각하지 않아요.</p>
<h3>4. 가슴 압박</h3>
<div class="tbl"><table>
<thead><tr><th>항목</th><th>방법</th></tr></thead>
<tbody>
<tr><td>위치</td><td>가슴 한가운데, 가슴뼈(흉골)의 아래쪽 절반</td></tr>
<tr><td>손 모양</td><td>한 손바닥 아래쪽(손꿈치)을 대고 다른 손을 겹쳐 깍지 껴요</td></tr>
<tr><td>자세</td><td>팔꿈치를 곧게 펴고, 어깨가 손 바로 위에 오게 해서 체중을 실어 수직으로 눌러요</td></tr>
<tr><td>깊이</td><td>약 5cm (6cm를 넘지 않게)</td></tr>
<tr><td>속도</td><td>1분에 100~120회</td></tr>
<tr><td>이완</td><td>누른 뒤 가슴이 완전히 올라오게 해요. 손은 떼지 않아요</td></tr>
<tr><td>중단</td><td>최소화해요. 구급대원이 올 때까지, 또는 환자가 움직이거나 숨을 쉴 때까지 계속해요</td></tr>
</tbody>
<caption>2020 한국 심폐소생술 가이드라인을 바탕으로 정리</caption></table></div>
<div class="box note"><span class="h">인공호흡은 꼭 해야 할까</span>
<p>인공호흡을 배우지 않았거나 하기 어렵다면 <strong>가슴 압박만 계속하는 것</strong>(가슴압박 소생술)도 효과가 있어요. 교육을 받아 할 수 있다면 가슴 압박 30회 후 인공호흡 2회를 반복해요.</p></div>
<p>1분에 100~120회는 생각보다 빨라요. 1초에 두 번 정도예요. 여러 사람이 있다면 <strong>2분마다 교대</strong>하면 압박의 질을 유지할 수 있어요. 갈비뼈가 부러지는 느낌이 들 수 있지만, 멈추는 것보다 계속하는 것이 훨씬 중요해요.</p>

<h2>자동심장충격기(AED) 사용법</h2>
<p>심정지의 상당수는 심장이 가늘게 떨리기만 하는 부정맥(심실세동) 때문에 생겨요. 자동심장충격기는 심장 리듬을 분석해 필요할 때 전기 충격으로 정상 리듬을 되찾게 해요.</p>
<ol>
<li><strong>전원 켜기:</strong> 뚜껑을 열거나 전원 버튼을 눌러요. 이후 음성 안내를 따라요.</li>
<li><strong>패드 붙이기:</strong> 옷을 벗기고 패드 하나는 <strong>오른쪽 쇄골 바로 아래</strong>, 다른 하나는 <strong>왼쪽 젖꼭지 아래 옆구리</strong>에 붙여요. 패드에 그림이 있어요.</li>
<li><strong>분석:</strong> "심장 리듬을 분석 중입니다"라는 안내가 나오면 <strong>환자에게서 손을 떼요.</strong></li>
<li><strong>충격:</strong> 충격이 필요하다고 하면 모두 떨어지게 한 뒤 깜박이는 <strong>충격 버튼</strong>을 눌러요. 자동으로 충격을 주는 제품도 있어요.</li>
<li><strong>바로 가슴 압박 재개:</strong> 충격 후 곧바로 가슴 압박을 다시 시작해요. 자동심장충격기가 2분마다 다시 분석해요.</li>
</ol>
<p>가슴에 물기가 있으면 닦고, 가슴에 붙은 약 패치는 떼요. 심장박동기가 만져지면 조금 떨어진 곳에 붙여요.</p>
<h3>자동심장충격기는 어디 있을까</h3>
<p>공공기관, 역, 공항, 대형 건물, 그리고 일정 규모 이상의 공동주택에 설치돼 있어요. 응급의료정보 제공 앱이나 누리집에서 가까운 위치를 찾을 수 있어요. 우리 아파트, 회사에 어디 있는지 미리 알아두면 좋아요.</p>

<h2>어린이와 영아</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>어린이 (만 1세~사춘기 전)</th><th>영아 (만 1세 미만)</th></tr></thead>
<tbody>
<tr><td>압박 방법</td><td>한 손 또는 두 손</td><td>두 손가락 (가슴 중앙, 젖꼭지 연결선 바로 아래)</td></tr>
<tr><td>깊이</td><td>가슴 두께의 약 ⅓, 약 4~5cm</td><td>가슴 두께의 약 ⅓, 약 4cm</td></tr>
<tr><td>속도</td><td>1분에 100~120회</td><td>1분에 100~120회</td></tr>
<tr><td>자동심장충격기</td><td>소아용 패드가 있으면 사용, 없으면 성인용 사용</td><td>소아용 패드·모드 권장</td></tr>
</tbody></table></div>
<p>아이의 심정지는 호흡 문제로 생기는 경우가 많아서, 교육을 받았다면 인공호흡을 함께하는 것이 권장돼요.</p>

<h2>법적 보호</h2>
<p>응급의료법에는 선의로 응급처치를 하다 생긴 손해에 대해 고의나 중대한 과실이 없으면 책임을 면제하거나 감경하는 조항(이른바 '선한 사마리아인' 조항)이 있어요. 잘못될까 봐 망설이는 것보다, 아무것도 하지 않는 것이 훨씬 위험해요.</p>

<div class="box"><span class="h">기억할 순서</span>
<ol>
<li>어깨 두드리며 반응 확인</li>
<li>한 사람 지목해 119 신고, 한 사람 지목해 자동심장충격기 요청</li>
<li>10초 안에 호흡 확인</li>
<li>가슴 한가운데, 5cm, 1분에 100~120회</li>
<li>자동심장충격기 오면 전원 켜고 안내 따르기</li>
<li>구급대원이 올 때까지 멈추지 않기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>숨을 쉬는지 잘 모르겠어요.</dt>
<dd>확실하지 않으면 심정지로 보고 가슴 압박을 시작해요. 실제 심정지가 아닌 사람에게 가슴 압박을 해서 생기는 위험보다, 심정지인 사람에게 아무것도 하지 않는 위험이 훨씬 커요.</dd>
<dt>자동심장충격기가 필요 없는 사람에게 충격을 주면 어떡하죠?</dt>
<dd>자동심장충격기는 심장 리듬을 분석해서 충격이 필요한 경우에만 충격을 권해요. 필요 없으면 충격을 주지 않아요.</dd>
<dt>교육은 어디서 받을 수 있나요?</dt>
<dd>지역 소방서, 보건소, 대한심폐소생협회 인증 교육기관에서 심폐소생술 교육을 받을 수 있어요. 한 번 실습해 보면 실제 상황에서 훨씬 덜 망설이게 돼요.</dd>
</dl>

<h2>수돗물: 정수장에서 수도꼭지까지</h2>
<p>수돗물은 정수장에서 여러 단계로 정수하고 염소로 소독한 뒤 공급돼요. 국내 먹는물 수질 기준은 미생물, 중금속, 유기물질, 소독부산물 등 수십 가지 항목으로 관리되고, 정수장과 수도꼭지에서 정기적으로 검사해요.</p>
<p>그런데 정수장을 떠난 물은 수도관을 지나 건물 안의 <strong>물탱크(저수조)와 옥내 배관</strong>을 거쳐요. 오래된 건물은 이 구간에서 녹물이 섞이거나, 물탱크 관리가 부실하면 수질이 나빠질 수 있어요.</p>
<h3>우리 집 수돗물 점검하기</h3>
<ul>
<li><strong>수돗물 안심확인제:</strong> 지자체에 신청하면 집으로 찾아와 수돗물을 <strong>무료로 검사</strong>해 줘요. 거주 지역 상수도사업본부나 환경부 안내를 확인해요.</li>
<li><strong>아파트 저수조:</strong> 관리사무소에 물탱크 청소와 수질 검사 기록을 확인할 수 있어요.</li>
<li><strong>오래 쓰지 않은 물:</strong> 여행에서 돌아왔거나 아침 첫 물은 배관에 고여 있던 물이에요. 잠시 흘려보낸 뒤 마시거나 요리에 써요.</li>
<li><strong>온수는 마시거나 요리에 쓰지 않아요.</strong> 뜨거운 물은 배관의 금속 성분을 더 많이 녹여내요.</li>
</ul>
<div class="box note"><span class="h">수돗물 냄새가 신경 쓰인다면</span>
<p>수돗물의 약한 소독약 냄새는 잔류 염소 때문이에요. 세균이 다시 자라지 않도록 일부러 남겨둔 거예요. 냄새가 싫다면 물을 받아 냉장고에 몇 시간 두거나, <strong>뚜껑을 열고 몇 분 끓이면</strong> 대부분 날아가요. 녹물이나 이상한 색, 평소와 다른 냄새가 난다면 관리사무소나 상수도사업본부에 알려요.</p></div>

<h2>정수기: 방식별 차이</h2>
<div class="tbl"><table>
<thead><tr><th>방식</th><th>원리</th><th>특징</th></tr></thead>
<tbody>
<tr><td>역삼투압 (RO)</td><td>아주 미세한 막으로 물 분자만 통과시켜요</td><td>대부분의 오염물질과 함께 미네랄도 걸러요. 버려지는 물(농축수)이 생겨요</td></tr>
<tr><td>중공사막 (UF) 등 막 여과</td><td>미세한 구멍의 막으로 입자와 세균을 걸러요</td><td>미네랄은 대부분 남아요. 역삼투압보다 걸러내는 범위가 좁아요</td></tr>
<tr><td>활성탄 필터</td><td>숯의 흡착력으로 염소, 냄새, 일부 유기물을 제거해요</td><td>대부분의 정수기에 함께 들어가요</td></tr>
</tbody></table></div>
<p>미네랄이 걸러진다는 점이 논쟁이 되기도 하지만, 우리 몸의 미네랄은 대부분 물이 아닌 <strong>음식</strong>에서 얻어요. 수돗물 자체가 기준을 만족한다면 정수기는 맛과 냄새, 배관 문제에 대한 추가 안전장치 역할이에요.</p>
<h3>정수기 관리가 더 중요하다</h3>
<ul>
<li><strong>필터 교체 주기</strong>를 지켜요. 오래된 필터는 오히려 세균이 자라는 곳이 될 수 있어요.</li>
<li>물이 나오는 <strong>출수구(코크)</strong>를 자주 닦아요. 컵이나 손이 닿으면 오염되기 쉬워요.</li>
<li>저수조가 있는 정수기는 정기적인 살균·세척이 필요해요.</li>
<li>오래 쓰지 않았다면 처음 나오는 물은 흘려보내요.</li>
<li>렌털 제품이라면 관리 방문 기록을 확인해요.</li>
</ul>

<h2>생수: 보관이 핵심</h2>
<ul>
<li>국내 생수는 '먹는샘물'로 수질 기준에 따라 관리돼요. 포장에서 수원지와 유통기한을 확인할 수 있어요.</li>
<li><strong>직사광선과 높은 온도</strong>를 피해 보관해요. 여름철 <strong>차 안</strong>에 오래 두지 않아요.</li>
<li>개봉한 뒤에는 냉장 보관하고 빨리 마셔요.</li>
<li><strong>입을 대고 마신 병</strong>은 입 안 세균이 들어가 실온에서 빠르게 늘어요. 그날 안에 마시거나 버려요.</li>
<li>일회용 생수병을 여러 번 다시 채워 쓰는 건 세척이 어렵고 흠집에 세균이 자랄 수 있어 권하지 않아요.</li>
</ul>
<h3>미세플라스틱</h3>
<p>여러 연구에서 생수에서 미세플라스틱과 더 작은 나노플라스틱이 검출됐어요. 이것이 사람 건강에 얼마나 영향을 주는지는 아직 연구 중이에요. 걱정된다면 뜨거운 곳에 보관하지 않고, 수돗물이나 정수기 물을 유리·스테인리스 병에 담아 다니는 방법도 있어요.</p>

<h2>끓인 물과 보리차</h2>
<ul>
<li>끓인 물은 소독약이 날아가 세균이 다시 자랄 수 있어요. <strong>식힌 뒤 냉장 보관</strong>하고 며칠 안에 마셔요.</li>
<li>보리차, 옥수수차처럼 곡물을 넣고 끓인 물은 세균이 더 잘 자라서 여름에는 특히 빨리 마셔요.</li>
<li>물병과 주전자는 자주 씻고 완전히 말려요.</li>
</ul>

<h2>약수터와 지하수</h2>
<p>산속 약수터나 지하수는 깨끗해 보이지만, 지자체 수질 검사에서 <strong>대장균 등으로 부적합</strong> 판정을 받는 경우가 적지 않아요. 약수터 입구에 게시된 최근 수질 검사 결과를 확인하고, 부적합이거나 결과가 없다면 마시지 않는 게 안전해요. 특히 비가 많이 온 뒤에는 오염 가능성이 커요.</p>

<div class="box"><span class="h">마시는 물 점검표</span>
<ol>
<li>수돗물 안심확인제로 우리 집 수돗물 검사 신청해 보기</li>
<li>아침 첫 물, 여행 후 첫 물은 잠시 흘려보내기</li>
<li>온수는 마시거나 요리에 쓰지 않기</li>
<li>정수기 필터 교체일과 출수구 청소 확인하기</li>
<li>생수는 그늘에, 차 안에 오래 두지 않기</li>
<li>끓인 물·보리차는 냉장 보관하고 빨리 마시기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>수돗물을 그냥 마셔도 되나요?</dt>
<dd>수돗물은 정수장에서 먹는물 기준을 통과해 공급돼요. 집 안 배관과 물탱크가 잘 관리되고 있다면 그대로 마셔도 괜찮아요. 확인하고 싶다면 무료 수질 검사를 이용해 보세요.</dd>
<dt>알칼리 이온수가 더 좋은가요?</dt>
<dd>일부 알칼리 이온수기는 특정 위장 증상 개선 범위로 의료기기 허가를 받았지만, 일반적인 건강 증진이나 질병 예방 효과가 확인된 것은 아니에요. 과장된 광고를 조심해요.</dd>
<dt>물은 하루에 얼마나 마셔야 하나요?</dt>
<dd>필요량은 체격, 활동량, 날씨, 음식으로 먹는 수분에 따라 달라요. 목마를 때 마시고, 소변이 연한 노란색이면 대체로 충분해요. 자세한 내용은 물과 수분 글에서 정리할게요.</dd>
</dl>

  var CAT={life:'생활정보',dis:'질병',nut:'영양소',hea:'건강상식'};
  var ORDER=['life','dis','nut','hea'], PER=10;
  /* 최신 글이 위로: 빌드 순서의 역순 */
  var POSTS=[].map.call(document.querySelectorAll('template[data-id]'),function(t){
    var th=(t.dataset.thumb||'').split('|');
    var text=t.content.textContent.replace(/\s+/g,' ');
    return {id:t.dataset.id,cat:t.dataset.cat,title:t.dataset.title,date:t.dataset.date,sum:t.dataset.summary,
      tags:(t.dataset.tags||'').split(',').filter(Boolean),big:th[0],small:th[1],
      min:Math.max(1,Math.round(text.replace(/ /g,'').length/500)),tpl:t,
      hay:(t.dataset.title+' '+t.dataset.summary+' '+t.dataset.tags+' '+text).toLowerCase()};
  }).reverse();

  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  var main=document.getElementById('main');
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
  function btn(cls,txt,fn){var b=el('button',cls,txt);b.type='button';if(fn)b.addEventListener('click',fn);return b;}
  function go(h){ if(location.hash==='#'+h) route(); else location.hash=h; }
  function inCat(c){return POSTS.filter(function(p){return !c||p.cat===c});}

  /* 메뉴·사이드바 */
  var menu=document.getElementById('menu'), catlist=document.getElementById('catlist');
  function menuBtn(label,hash,n){var b=btn(null,label,function(){go(hash)});b.dataset.h=hash;
    b.appendChild(el('span','n','('+n+')'));return b;}
  menu.appendChild(menuBtn('전체글','home',POSTS.length));
  ORDER.forEach(function(c){menu.appendChild(menuBtn(CAT[c],'cat-'+c,inCat(c).length));});
  function catItem(label,hash,n,sub){var l=el('li',sub?'sub':null);var b=btn(null,null,function(){go(hash)});b.dataset.h=hash;
    b.appendChild(el('span',null,label));b.appendChild(el('span',null,'('+n+')'));l.appendChild(b);catlist.appendChild(l);}
  catItem('전체보기','home',POSTS.length);
  ORDER.forEach(function(c){catItem(CAT[c],'cat-'+c,inCat(c).length,true);});
  var recent=document.getElementById('recent');
  POSTS.slice(0,5).forEach(function(p){var l=el('li');l.appendChild(btn(null,p.title,function(){go('post-'+p.id)}));recent.appendChild(l);});
  var freq={};POSTS.forEach(function(p){p.tags.forEach(function(t){freq[t]=(freq[t]||0)+1;});});
  var tc=document.getElementById('tagcloud');
  Object.keys(freq).sort(function(a,b){return freq[b]-freq[a]}).slice(0,24).forEach(function(t){
    tc.appendChild(btn(null,t,function(){q.value=t;search();}));});
  function mark(h){[].forEach.call(document.querySelectorAll('[data-h]'),function(b){b.setAttribute('aria-current',b.dataset.h===h?'true':'false');});}

  /* 검색 */
  var q=document.getElementById('q');
  function search(){var s=q.value.trim().toLowerCase();if(!s)return;
    var hits=POSTS.filter(function(p){return p.hay.indexOf(s)>=0;});
    if(location.hash) history.replaceState(null,'',location.pathname+location.search);
    list(null,hits,'‘'+q.value.trim()+'’ 검색 결과');window.scrollTo(0,0);}
  document.getElementById('searchform').addEventListener('submit',function(e){e.preventDefault();search();});

  function thumb(p){var d=el('div','thumb t-'+p.cat);d.setAttribute('aria-hidden','true');
    d.appendChild(el('b',null,p.big));d.appendChild(el('small',null,p.small));return d;}

  function list(c,items,label,page){
    items=items||inCat(c); page=page||1;
    mark(label?null:(c?'cat-'+c:'home'));
    main.innerHTML='';
    var head=el('div','listhead');head.appendChild(el('h2',null,label||(c?CAT[c]:'전체글')));
    head.appendChild(el('span',null,items.length+'개의 글'));main.appendChild(head);
    if(!items.length){main.appendChild(el('p','nohit','찾는 글이 없어요. 다른 낱말로 검색해 보세요.'));return;}
    var pages=Math.ceil(items.length/PER); page=Math.min(page,pages);
    var ul=el('ul','postlist');
    items.slice((page-1)*PER,page*PER).forEach(function(p){
      var l=el('li');var b=btn('item',null,function(){go('post-'+p.id)});
      var txt=el('div');txt.style.minWidth='0';
      txt.appendChild(el('span','item-cat k-'+p.cat,CAT[p.cat]));
      txt.appendChild(el('span','item-title',p.title));
      txt.appendChild(el('span','item-sum',p.sum));
      txt.appendChild(el('span','item-meta',p.date+' · 읽는 데 약 '+p.min+'분'));
      b.appendChild(txt);b.appendChild(thumb(p));l.appendChild(b);ul.appendChild(l);});
    main.appendChild(ul);
    if(pages>1){var pg=el('nav','pager');pg.setAttribute('aria-label','페이지');
      for(var i=1;i<=pages;i++)(function(n){var b=btn(null,String(n),function(){list(c,items,label,n);main.scrollIntoView({block:'start'});});
        if(n===page)b.setAttribute('aria-current','page');pg.appendChild(b);})(i);
      main.appendChild(pg);}
  }

  function post(p){
    mark('cat-'+p.cat);
    main.innerHTML='';
    var a=el('article','post');
    a.appendChild(btn('crumb k-'+p.cat,CAT[p.cat],function(){go('cat-'+p.cat)}));
    a.appendChild(el('h2','post-title',p.title));
    var by=el('div','byline');by.appendChild(el('b',null,'상식첩 편집실'));
    by.appendChild(el('span',null,p.date));by.appendChild(el('span',null,'읽는 데 약 '+p.min+'분'));a.appendChild(by);
    var body=el('div','body');body.appendChild(p.tpl.content.cloneNode(true));
    var hs=body.querySelectorAll('h2');
    if(hs.length){var toc=el('nav','toc');toc.setAttribute('aria-label','목차');toc.appendChild(el('p',null,'목차'));
      var ol=el('ol');
      [].forEach.call(hs,function(h,i){h.id='sec'+(i+1);var li=el('li');
        li.appendChild(btn(null,h.textContent,function(){h.scrollIntoView({behavior:'smooth',block:'start'})}));ol.appendChild(li);});
      toc.appendChild(ol);a.appendChild(toc);}
    a.appendChild(body);
    var tg=el('div','tags');p.tags.forEach(function(t){tg.appendChild(el('span',null,'#'+t))});a.appendChild(tg);
    if(p.cat!=='life') a.appendChild(el('p','disclaim','이 글은 일반적인 건강 정보를 정리한 것으로 개인의 진단이나 치료를 대신하지 않아요. 증상이 있거나 약을 복용 중이라면 의사·약사와 상의하세요.'));
    var act=el('div','actions');var key='like-'+p.id;var lk=btn('like',null,function(){put(key,get(key)==='1'?'0':'1');dl();});
    function dl(){var on=get(key)==='1';lk.textContent=on?'♥ 공감했어요':'♡ 공감하기';lk.setAttribute('aria-pressed',on?'true':'false');}
    dl();act.appendChild(lk);a.appendChild(act);
    main.appendChild(a);
    var rel=inCat(p.cat).filter(function(x){return x!==p}).slice(0,5);
    if(rel.length){var rb=el('section','related');rb.appendChild(el('h3',null,'‘'+CAT[p.cat]+'’ 카테고리의 다른 글'));
      var ru=el('ul');rel.forEach(function(x){var l=el('li');l.appendChild(btn(null,x.title,function(){go('post-'+x.id)}));ru.appendChild(l);});
      rb.appendChild(ru);main.appendChild(rb);}
    var i=POSTS.indexOf(p), pn=el('div','pn');
    [[i+1,'이전 글'],[i-1,'다음 글']].forEach(function(x){var o=POSTS[x[0]];var b=btn(null,null,o?function(){go('post-'+o.id)}:null);
      b.appendChild(el('small',null,x[1]));b.appendChild(el('span',null,o?o.title:''));if(!o)b.disabled=true;pn.appendChild(b);});
    main.appendChild(pn);
  }

  function route(){
    var h=location.hash.replace('#','');
    if(h.indexOf('post-')===0){var p=POSTS.filter(function(x){return x.id===h.slice(5)})[0];if(p){post(p);window.scrollTo(0,0);return;}}
    if(h.indexOf('cat-')===0 && CAT[h.slice(4)]){list(h.slice(4));window.scrollTo(0,0);return;}
    list(null);
  }
  document.getElementById('home-link').addEventListener('click',function(e){e.preventDefault();go('home');});
  window.addEventListener('hashchange',route);
  route();
})();
</script>
</body>
</html>
