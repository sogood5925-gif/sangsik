<template data-id="heating" data-cat="life" data-date="2026.09.29"
  data-title="겨울 난방비 줄이는 법: 보일러 사용법부터 단열, 동파 예방까지"
  data-thumb="20°C|실내 권장"
  data-summary="난방비는 보일러를 끄고 켜는 것보다 집에서 새는 열을 막는 데서 더 많이 줄어요. 보일러 모드별 차이, 적정 온도와 습도, 창문과 바닥 단열, 배관 관리, 동파 예방, 전기난방의 함정까지 정리했어요."
  data-tags="난방비,보일러,단열,동파,겨울나기">
<p class="lead">난방비 절약은 '덜 켜는 것'보다 '덜 새게 하는 것'이 먼저예요. 데운 열이 창문과 문틈으로 빠져나가면 보일러는 같은 일을 계속 반복해야 해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>겨울 실내 온도는 <strong>18~20°C</strong>, 습도는 <strong>40~60%</strong>가 적당해요.</li>
<li>짧은 외출에는 보일러를 끄지 말고 <strong>온도를 조금 낮추는 편</strong>이 대체로 효율적이에요.</li>
<li>열은 <strong>창문</strong>으로 가장 많이 새요. 커튼, 단열 에어캡, 문풍지가 효과가 커요.</li>
<li>전기히터는 누진 구간을 넘기기 쉬워요. 보조 난방은 짧게, 좁게 써요.</li>
</ul></div>

<h2>몇 도가 적당할까</h2>
<p>정부는 겨울철 실내 난방 온도를 <strong>20°C 안팎</strong>으로 권장해요. 세계보건기구는 건강을 위해 겨울 실내 온도를 <strong>18°C 이상</strong> 유지하라고 권하고, 노인이나 아기, 만성질환자가 있는 집은 조금 더 따뜻하게 하는 게 좋다고 해요.</p>
<p>설정 온도를 1°C 낮추면 난방에 드는 에너지가 눈에 띄게 줄어요. 대신 체감 온도를 지키는 방법을 함께 쓰면 춥지 않게 아낄 수 있어요.</p>
<ul>
<li><strong>내복과 양말:</strong> 내복을 입으면 체감 온도가 2~3°C 정도 올라간다고 알려져 있어요. 발과 목을 따뜻하게 하면 몸 전체가 덜 추워요.</li>
<li><strong>습도:</strong> 겨울 실내는 매우 건조해져요. 습도를 40~60%로 맞추면 목과 피부의 건조함이 줄고 한결 쾌적해요. 빨래를 실내에 널거나 가습기를 써요.</li>
<li><strong>러그와 카펫:</strong> 바닥의 냉기를 막아줘요. 다만 바닥 난방을 하는 집에서 두꺼운 러그는 열이 올라오는 것도 막으니 앉는 자리 위주로 깔아요.</li>
</ul>

<h2>보일러, 어떻게 쓰는 게 효율적일까</h2>
<h3>모드별 차이</h3>
<div class="tbl"><table>
<thead><tr><th>모드</th><th>작동 방식</th><th>잘 맞는 상황</th></tr></thead>
<tbody>
<tr><td>실내 온도 모드</td><td>설정한 실내 온도에 맞춰 켜지고 꺼져요.</td><td>온도 조절기가 거실 등 생활 공간에 있는 경우</td></tr>
<tr><td>온돌(난방수 온도) 모드</td><td>바닥을 도는 물의 온도를 기준으로 작동해요.</td><td>온도 조절기가 외벽 쪽이나 추운 곳에 있어 실내 온도 모드가 과하게 작동할 때</td></tr>
<tr><td>예약·타이머 모드</td><td>일정 간격으로 켜졌다 꺼져요.</td><td>집이 단열이 잘 되고 일정한 패턴으로 생활할 때</td></tr>
<tr><td>외출 모드</td><td>동파를 막을 정도로 최소한만 작동해요.</td><td>하루 이상 집을 비울 때</td></tr>
</tbody></table></div>
<h3>껐다 켜기 vs 낮춰두기</h3>
<p>보일러는 차가워진 바닥과 물을 다시 데울 때 에너지를 가장 많이 써요. 그래서 몇 시간 외출할 때 완전히 끄면, 돌아와서 다시 데우는 데 오히려 더 쓸 수 있어요. <strong>짧은 외출에는 설정 온도를 2~3°C 낮춰두고</strong>, 하루 이상 비울 때 외출 모드를 쓰는 게 대체로 효율적이에요. 다만 집의 단열 상태에 따라 차이가 있으니 한 달씩 바꿔서 사용량을 비교해 보는 게 가장 정확해요.</p>
<h3>난방수 온도</h3>
<p>콘덴싱 보일러는 난방을 돌고 돌아오는 물의 온도가 낮을수록 효율이 좋아져요. 너무 뜨겁게 설정하기보다 적당한 온도로 오래 돌리는 쪽이 유리할 수 있어요. 제조사 설명서의 권장 설정을 확인해 보세요.</p>
<h3>안 쓰는 방</h3>
<p>안 쓰는 방의 분배기 밸브를 잠그면 쓰는 공간에 열이 집중돼요. 다만 완전히 잠그면 그 방에 결로와 곰팡이가 생기거나, 한파에 배관이 얼 수 있으니 조금 열어두는 게 좋아요.</p>

<h2>열이 새는 곳 막기</h2>
<p>집에서 열이 빠져나가는 가장 큰 통로는 창문이에요. 벽보다 단열 성능이 훨씬 떨어지기 때문이에요.</p>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>효과</th><th>팁</th></tr></thead>
<tbody>
<tr><td>두꺼운 커튼</td><td>창문과 실내 사이에 공기층을 만들어요.</td><td>바닥까지 닿게 길게, 해가 지면 바로 치기</td></tr>
<tr><td>단열 에어캡 (뽁뽁이)</td><td>유리창의 열 손실을 줄여요.</td><td>분무기로 물을 뿌리고 붙이면 떼기도 쉬워요. 채광은 조금 줄어요.</td></tr>
<tr><td>문풍지</td><td>창틀과 문틈의 외풍을 막아요.</td><td>손을 대보거나 촛불·향 연기로 바람 새는 곳 찾기</td></tr>
<tr><td>현관 중문이나 커튼</td><td>현관으로 들어오는 찬 공기를 막아요.</td><td>현관문 하단 틈에 막이 설치</td></tr>
<tr><td>낮에는 커튼 열기</td><td>햇빛으로 실내를 데워요.</td><td>남향 창은 특히 효과가 커요.</td></tr>
</tbody></table></div>

<h2>보일러와 배관 관리</h2>
<ul>
<li><strong>배관 공기 빼기:</strong> 바닥 일부만 미지근하다면 배관에 공기가 찼을 수 있어요. 분배기의 공기 빼기 밸브로 공기를 빼면 순환이 좋아져요. 방법이 익숙하지 않다면 관리사무소나 제조사 서비스에 문의해요.</li>
<li><strong>배관 청소:</strong> 오래된 집은 배관에 찌꺼기가 쌓여 열 전달이 떨어져요. 몇 년에 한 번 청소를 고려해요.</li>
<li><strong>보일러 점검:</strong> 겨울이 오기 전에 점검을 받아요. 가스보일러 배기통이 빠지거나 틈이 있으면 일산화탄소가 실내로 들어올 수 있어 위험해요.</li>
</ul>

<h2>전기난방의 함정</h2>
<p>전기히터와 온풍기는 소비전력이 1,000~2,000W를 넘는 경우가 많아요. 1,500W 히터를 하루 5시간 한 달 쓰면 약 225kWh로, 평소 사용량이 두 배 가까이 늘 수 있어요. 주택용 전기요금은 누진제라서 구간을 넘으면 요금이 가파르게 올라요.</p>
<ul>
<li>보조 난방은 <strong>책상 밑이나 몸 가까이 좁은 공간</strong>에만 짧게 써요.</li>
<li>전기요나 전기장판은 소비전력이 히터보다 훨씬 적어요. 잘 때는 낮은 온도로, 타이머를 맞춰요.</li>
<li>히터 주변 1m 안에는 커튼, 이불, 빨래 같은 불에 타기 쉬운 물건을 두지 않아요.</li>
</ul>

<h2>동파 예방</h2>
<p>기온이 영하로 크게 떨어지면 수도 계량기와 배관이 얼어 터질 수 있어요.</p>
<div class="box warn"><span class="h">한파 전에 확인할 것</span>
<ul>
<li><strong>수도 계량기함</strong>을 헌 옷이나 보온재로 채우고 뚜껑을 테이프로 막아요.</li>
<li>기온이 크게 떨어지는 날(대략 영하 10°C 이하)에는 <strong>수돗물을 아주 가늘게 틀어</strong> 물이 계속 흐르게 해요.</li>
<li>보일러가 있는 베란다나 다용도실의 배관을 보온재로 감싸요.</li>
<li>오래 집을 비울 때는 보일러를 끄지 말고 외출 모드로 둬요.</li>
<li>이미 얼었다면 뜨거운 물을 바로 붓지 말고 미지근한 물이나 헤어드라이어로 천천히 녹여요. 불로 직접 녹이면 화재 위험이 있어요.</li>
</ul></div>

<h2>도움받을 수 있는 제도</h2>
<p>저소득 가구에는 난방비를 지원하는 <strong>에너지바우처</strong>, 도시가스 요금 경감, 지역난방 요금 감면 같은 제도가 있어요. 대상과 금액은 해마다 달라지니 주민센터, 한국에너지공단, 거주 지역 도시가스 회사에 문의해 보세요.</p>

<h2>올겨울 점검표</h2>
<div class="box"><span class="h">난방 시작 전에</span>
<ol>
<li>보일러 점검 받고 배기통 연결 상태 확인하기</li>
<li>창문에 커튼이나 단열 에어캡 준비하기</li>
<li>문틈 외풍 찾아서 문풍지 붙이기</li>
<li>온도 조절기 위치와 모드 확인하기</li>
<li>수도 계량기함 보온하기</li>
<li>가습기나 실내 빨래 널기로 습도 맞추기</li>
<li>지난겨울 가스 사용량과 요금 확인해 두기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>보일러를 계속 켜두는 게 무조건 이득인가요?</dt>
<dd>아니에요. 짧은 외출에는 낮춰두는 게 나을 수 있지만, 긴 시간 집을 비우면 외출 모드가 유리해요. 단열이 좋은 집과 나쁜 집에서 결과가 달라요.</dd>
<dt>가습기를 틀면 난방비가 줄어드나요?</dt>
<dd>습도 자체가 난방비를 직접 줄이지는 않아요. 다만 적정 습도에서는 같은 온도라도 덜 건조하고 쾌적하게 느껴져서 설정 온도를 무리하게 올리지 않게 도와줘요. 가습기는 매일 물을 갈고 자주 세척해요.</dd>
<dt>창문을 닫아두면 환기는 언제 하나요?</dt>
<dd>겨울에도 하루 2~3번, 10분 정도 창문을 열어 환기하는 게 좋아요. 짧고 강하게 맞바람으로 환기하면 벽과 바닥은 식지 않고 공기만 바뀌어요.</dd>
</dl>

  data-tags="지방간,간건강,MASLD,간수치,체중감량">
<p class="lead">간은 '침묵의 장기'라고 불려요. 상당히 망가질 때까지 거의 아프다는 신호를 보내지 않아요. 지방간도 마찬가지예요. 그래서 검진에서 들은 한마디를 그냥 넘기지 않는 게 중요해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>간세포의 <strong>5% 이상</strong>에 지방이 쌓이면 지방간이에요. 국내 성인의 약 3명 중 1명에게 있어요.</li>
<li>술을 마시지 않아도 비만, 당뇨병, 고혈압 같은 대사 이상과 함께 생기는 <strong>대사이상 지방간질환(MASLD)</strong>이 가장 흔해요.</li>
<li>핵심은 지방보다 <strong>섬유화(간이 굳는 것)</strong>예요. 섬유화 정도가 앞으로의 위험을 결정해요.</li>
<li>체중의 <strong>5%</strong>를 줄이면 간 지방이 줄고, <strong>7~10%</strong>를 줄이면 염증과 섬유화까지 좋아질 수 있어요.</li>
</ul></div>

<h2>지방간이란</h2>
<p>간은 남는 에너지를 지방으로 바꿔 내보내는 일을 해요. 그런데 들어오는 에너지가 너무 많거나, 인슐린이 제대로 작동하지 않거나, 술이 지방 처리 과정을 방해하면 지방이 간세포 안에 쌓여요. 간세포의 5% 이상에 지방이 차 있으면 지방간이라고 해요.</p>
<h3>이름이 바뀌었어요</h3>
<p>예전에는 술 때문이면 알코올성, 아니면 '비알코올성 지방간질환(NAFLD)'이라고 불렀어요. 2023년 국제 간학회들은 원인을 더 정확히 드러내기 위해 <strong>대사이상 관련 지방간질환(MASLD)</strong>이라는 이름을 새로 정했어요. 지방간이 있으면서 비만이나 복부비만, 혈당 이상, 고혈압, 중성지방 증가, 낮은 HDL 중 하나 이상이 있으면 여기에 해당해요.</p>
<div class="tbl"><table>
<thead><tr><th>분류</th><th>설명</th></tr></thead>
<tbody>
<tr><td>MASLD (대사이상 지방간질환)</td><td>대사 위험인자가 있고 술은 적게 마시는 경우</td></tr>
<tr><td>MetALD</td><td>대사 위험인자와 함께 음주량이 중간 수준인 경우 (여성 하루 약 20~50g, 남성 약 30~60g의 알코올)</td></tr>
<tr><td>알코올 관련 간질환</td><td>음주량이 그보다 많은 경우</td></tr>
</tbody>
<caption>2023년 다학회 합의 명명법 기준. 소주 한 잔(50mL)에는 알코올이 약 7~8g 들어 있어요.</caption></table></div>

<h2>왜 술을 안 마셔도 생길까</h2>
<p>대사이상 지방간의 중심에는 <strong>인슐린 저항성</strong>이 있어요. 인슐린이 잘 듣지 않으면 지방 조직에서 지방산이 계속 흘러나와 간으로 몰리고, 간은 남는 당을 지방으로 바꾸는 일을 더 많이 해요. 그래서 이런 경우 지방간이 흔해요.</p>
<ul>
<li>복부비만 (허리둘레 남성 90cm, 여성 85cm 이상)</li>
<li>제2형 당뇨병이나 당뇨병 전단계</li>
<li>고혈압, 높은 중성지방</li>
<li>단 음료와 액상과당을 많이 먹는 식습관</li>
<li>운동 부족, 수면 부족</li>
</ul>
<p><strong>마른 지방간</strong>도 있어요. 아시아인은 체질량지수가 정상이어도 복부 내장지방이 많거나 근육이 적으면 지방간이 생기는 경우가 서양인보다 흔해요. "나는 말랐으니 괜찮다"고 넘기지 않아야 해요.</p>

<h2>지방간은 어디로 진행할까</h2>
<ol>
<li><strong>단순 지방간:</strong> 지방만 쌓인 상태. 대부분 여기서 머물러요.</li>
<li><strong>지방간염:</strong> 쌓인 지방 때문에 간세포가 손상되고 염증이 생긴 상태예요.</li>
<li><strong>섬유화:</strong> 손상이 반복되면서 간에 흉터 조직이 생겨요.</li>
<li><strong>간경변:</strong> 섬유화가 심해져 간이 딱딱하게 굳고 기능이 떨어져요.</li>
<li><strong>간암:</strong> 간경변 단계에서 위험이 크게 올라가요. 지방간염에서는 간경변 없이 간암이 생기는 경우도 있어요.</li>
</ol>
<p>지방간이 있는 사람의 사망 원인 1위는 사실 간 질환이 아니라 <strong>심혈관 질환</strong>이에요. 지방간은 온몸의 대사 이상이 간에 드러난 신호라서, 심장과 혈관도 함께 챙겨야 해요.</p>

<h2>간 수치가 정상이면 괜찮을까</h2>
<p>간 수치(AST, ALT)는 간세포가 손상될 때 혈액으로 나오는 효소예요. 지방간이 있어도 <strong>간 수치가 정상인 경우가 많고</strong>, 반대로 섬유화가 진행되면 오히려 수치가 떨어지기도 해요. 그래서 간 수치만으로는 지방간의 심각도를 알기 어려워요.</p>
<h3>섬유화 위험을 가늠하는 법</h3>
<p>진료 현장에서는 혈액검사 결과로 계산하는 <strong>FIB-4 지수</strong>를 많이 써요. 나이, AST, ALT, 혈소판 수치로 계산해요.</p>
<div class="tbl"><table>
<thead><tr><th>FIB-4 값</th><th>해석</th><th>다음 단계</th></tr></thead>
<tbody>
<tr><td class="num">1.3 미만</td><td>진행된 섬유화 가능성 낮음</td><td>생활습관 관리, 정기 재평가</td></tr>
<tr><td class="num">1.3~2.67</td><td>판단 어려움</td><td>간 탄성도 검사(파이브로스캔 등) 고려</td></tr>
<tr><td class="num">2.67 초과</td><td>진행된 섬유화 가능성 높음</td><td>소화기내과 전문 진료</td></tr>
</tbody>
<caption>65세 이상은 하한 기준을 2.0으로 조정하기도 해요. 결과 해석은 의사와 함께하세요.</caption></table></div>
<p>건강검진 결과지에 AST, ALT, 혈소판 수치가 있다면 진료 때 FIB-4를 확인해 달라고 요청해 볼 수 있어요.</p>

<h2>되돌리는 법: 체중이 가장 강력한 치료</h2>
<div class="tbl"><table>
<thead><tr><th>체중 감량</th><th>기대할 수 있는 변화</th></tr></thead>
<tbody>
<tr><td class="num">3~5%</td><td>간 속 지방 감소</td></tr>
<tr><td class="num">7% 이상</td><td>지방간염(염증) 호전</td></tr>
<tr><td class="num">10% 이상</td><td>섬유화 호전 가능성</td></tr>
</tbody>
<caption>미국간학회(AASLD)·대한간학회 진료지침을 바탕으로 정리</caption></table></div>
<p>80kg인 사람이라면 4kg만 줄여도 간 지방이 눈에 띄게 줄 수 있어요. 한 달에 너무 빨리 빼기보다 <strong>6개월~1년에 걸쳐</strong> 천천히 빼는 게 좋아요. 지나치게 급하게 빼면 오히려 간에 부담이 될 수 있어요.</p>
<h3>식사</h3>
<ul>
<li><strong>단 음료, 과일주스, 액상과당을 먼저 끊어요.</strong> 과당은 간에서 곧바로 지방으로 바뀌기 쉬워요.</li>
<li><strong>흰쌀, 흰 빵, 면, 떡</strong> 같은 정제 탄수화물의 양을 줄여요.</li>
<li>채소, 통곡물, 콩, 생선, 올리브유를 중심으로 하는 <strong>지중해식 식단</strong>이 지방간에 도움이 된다는 연구가 많아요.</li>
<li>야식과 과식을 줄이고, 전체 칼로리를 조금 줄여요.</li>
</ul>
<h3>운동</h3>
<ul>
<li>유산소 운동은 체중이 크게 줄지 않아도 간 지방을 줄여요.</li>
<li>일주일에 150분 이상 중강도 운동에 근력 운동을 더해요.</li>
</ul>
<h3>술</h3>
<p>지방간이 있다면 술은 줄이는 게 아니라 <strong>가능하면 끊는 게</strong> 가장 안전해요. 대사이상과 음주가 함께 있으면 간 손상이 더 빨리 진행돼요. 특히 섬유화가 있다면 금주가 필요해요.</p>

<h2>약이 있을까</h2>
<p>오랫동안 지방간 자체를 치료하는 승인된 약이 없었어요. 최근 해외에서 섬유화가 동반된 지방간염에 쓰는 약이 승인되기 시작했지만, 적용 대상이 제한적이고 모든 사람에게 쓰는 약은 아니에요. 당뇨병이 함께 있다면 혈당약 중 일부(GLP-1 수용체 작용제, 피오글리타존 등)가 지방간에도 도움이 되는 것으로 알려져 있어 의사가 함께 고려하기도 해요.</p>
<div class="box warn"><span class="h">'간에 좋다'는 건강식품을 조심하세요</span>
<p>간 보호를 내세운 건강기능식품이나 한약, 민간요법 중에는 오히려 간 손상을 일으키는 사례가 보고돼 있어요. 약물로 인한 간 손상의 적지 않은 부분이 이런 제품에서 생겨요. 새로 먹기 시작한 제품이 있다면 진료 때 꼭 알려요.</p></div>

<h2>관리 점검표</h2>
<div class="box"><span class="h">지방간 진단을 받았다면</span>
<ol>
<li>현재 체중과 허리둘레를 재고, 목표(현재 체중의 5~10% 감량)를 정하기</li>
<li>단 음료와 술 끊기부터 시작하기</li>
<li>혈당, 혈압, 콜레스테롤 수치 함께 확인하기</li>
<li>FIB-4 등으로 섬유화 위험 확인하기</li>
<li>B형·C형 간염, 약물 등 다른 원인이 없는지 확인하기</li>
<li>6개월~1년 뒤 초음파나 혈액검사로 변화 확인하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>커피가 지방간에 좋다는데 사실인가요?</dt>
<dd>커피를 마시는 사람에게서 간 섬유화와 간 질환 위험이 낮다는 관찰 연구가 많아요. 다만 인과관계가 확실하지 않고, 설탕과 시럽을 넣은 커피는 오히려 해로울 수 있어요. 블랙커피를 적당히 마시는 정도라면 괜찮다는 의견이 많아요.</dd>
<dt>지방간은 완전히 없어질 수 있나요?</dt>
<dd>네. 초기 지방간은 체중 감량과 생활습관 개선으로 초음파에서 보이지 않을 정도로 좋아지는 경우가 많아요. 섬유화도 초기라면 호전될 수 있어요.</dd>
<dt>아이도 지방간이 생기나요?</dt>
<dd>소아청소년 비만이 늘면서 아이의 지방간도 늘고 있어요. 비만한 아이라면 소아청소년과에서 간 수치와 초음파 검사를 고려할 수 있어요.</dd>
</dl>

<p class="lead">사람은 대부분의 동물과 달리 비타민 C를 몸에서 만들지 못해요. 그래서 매일 음식으로 먹어야 하는데, 다행히 채소와 과일을 조금만 챙겨도 충분히 얻을 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인 권장섭취량은 하루 <strong>100mg</strong>, 상한섭취량은 <strong>2,000mg</strong>이에요.</li>
<li>파프리카 반 개, 키위 한두 개, 귤 서너 개면 하루 권장량을 채울 수 있어요.</li>
<li>꾸준히 먹어도 일반인의 감기 <strong>발생</strong>은 줄지 않았고, 감기 <strong>기간</strong>이 조금 짧아지는 정도였어요.</li>
<li>고용량은 설사와 신장 결석 위험이 있어요. 많이 먹을수록 좋은 영양소가 아니에요.</li>
</ul></div>

<h2>비타민 C가 하는 일</h2>
<ul>
<li><strong>콜라겐 합성:</strong> 피부, 혈관, 잇몸, 뼈를 이루는 콜라겐을 만드는 데 꼭 필요해요. 부족하면 잇몸에서 피가 나고 상처가 잘 낫지 않아요.</li>
<li><strong>항산화:</strong> 세포를 손상시키는 활성산소를 중화하고, 비타민 E를 재생시켜요.</li>
<li><strong>철분 흡수:</strong> 채소와 콩에 든 비헴철이 흡수되기 쉬운 형태로 바꿔줘요.</li>
<li><strong>면역:</strong> 여러 면역세포 안에 높은 농도로 들어 있고, 면역 기능 유지에 관여해요.</li>
<li><strong>신경전달물질과 호르몬:</strong> 노르에피네프린 같은 물질을 만드는 데 필요해요.</li>
</ul>

<h2>괴혈병: 결핍하면 생기는 병</h2>
<p>비타민 C가 심하게 부족하면 <strong>괴혈병</strong>이 생겨요. 대항해시대 선원들이 오랜 항해 중 신선한 채소와 과일을 먹지 못해 잇몸 출혈, 멍, 상처가 벌어지는 증상으로 많이 목숨을 잃었어요. 하루 10mg 미만을 한 달 이상 먹으면 나타날 수 있어요.</p>
<p>요즘은 드물지만 사라지지 않았어요. 극단적인 편식, 채소와 과일을 거의 먹지 않는 노인, 알코올 의존, 일부 소화기 질환이 있는 사람에게서 여전히 보고돼요.</p>

<h2>하루에 얼마나 필요할까</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th>권장섭취량</th></tr></thead>
<tbody>
<tr><td>성인 (15세 이상)</td><td class="num">100mg</td></tr>
<tr><td>임신부</td><td class="num">110mg</td></tr>
<tr><td>수유부</td><td class="num">140mg</td></tr>
<tr><td>상한섭취량 (성인)</td><td class="num">2,000mg</td></tr>
</tbody>
<caption>보건복지부·한국영양학회, 2020 한국인 영양소 섭취기준</caption></table></div>
<p><strong>흡연자</strong>는 산화 스트레스 때문에 비타민 C가 더 빨리 소모돼요. 미국 기준은 흡연자에게 하루 35mg을 더 먹도록 권해요. 간접흡연에 많이 노출되는 사람도 더 필요할 수 있어요.</p>

<h2>어떤 음식에 많을까</h2>
<div class="tbl"><table>
<thead><tr><th>식품</th><th>분량</th><th>비타민 C (약)</th></tr></thead>
<tbody>
<tr><td>빨간 파프리카 (생)</td><td>½컵</td><td class="num">95mg</td></tr>
<tr><td>오렌지</td><td>중간 1개</td><td class="num">70mg</td></tr>
<tr><td>키위</td><td>중간 1개</td><td class="num">64mg</td></tr>
<tr><td>브로콜리 (익힌 것)</td><td>½컵</td><td class="num">51mg</td></tr>
<tr><td>딸기</td><td>½컵</td><td class="num">49mg</td></tr>
<tr><td>양배추 (익힌 것)</td><td>½컵</td><td class="num">28mg</td></tr>
<tr><td>감자 (구운 것)</td><td>중간 1개</td><td class="num">17mg</td></tr>
<tr><td>토마토</td><td>중간 1개</td><td class="num">17mg</td></tr>
</tbody>
<caption>미국 국립보건원 식이보충제국(ODS) 자료 기준. 품종, 신선도, 조리법에 따라 달라요.</caption></table></div>
<p>귤은 한 개에 대략 20~30mg 정도예요. 우리 식단에서는 김치, 풋고추, 시금치 같은 채소와 제철 과일에서도 비타민 C를 꽤 얻어요. 채소와 과일을 하루 다섯 접시 정도 먹으면 권장량을 넉넉히 넘겨요.</p>

<h2>조리할 때 덜 잃는 법</h2>
<p>비타민 C는 <strong>물에 녹고 열과 공기에 약해요.</strong></p>
<ul>
<li><strong>삶기보다 찌거나 전자레인지로 짧게</strong> 익혀요. 물에 오래 삶으면 국물로 빠져나가요.</li>
<li><strong>먹기 직전에 자르고</strong>, 잘라서 오래 두지 않아요.</li>
<li>국이나 찌개로 먹는다면 국물까지 먹어야 녹아 나온 비타민 C를 얻어요. 다만 나트륨도 함께 먹게 되니 균형이 필요해요.</li>
<li>생으로 먹을 수 있는 채소와 과일은 일부라도 생으로 먹어요.</li>
</ul>

<h2>감기에 효과가 있을까</h2>
<p>1970년대 노벨상 수상자 라이너스 폴링이 고용량 비타민 C가 감기를 막는다고 주장하면서 크게 유행했어요. 그 뒤 수많은 연구가 이어졌고, 여러 연구를 모아 분석한 코크란 리뷰(2013)의 결론은 이래요.</p>
<div class="tbl"><table>
<thead><tr><th>상황</th><th>결과</th></tr></thead>
<tbody>
<tr><td>일반인이 매일 꾸준히 먹을 때: 감기 발생</td><td>줄지 않았어요.</td></tr>
<tr><td>일반인이 매일 꾸준히 먹을 때: 감기 기간</td><td>성인 약 8%, 어린이 약 14% 짧아졌어요. (며칠 앓는 감기라면 반나절 정도)</td></tr>
<tr><td>감기에 걸린 뒤에 먹기 시작할 때</td><td>일관된 효과가 없었어요.</td></tr>
<tr><td>마라톤 선수, 극한 환경 군인처럼 신체 스트레스가 큰 사람</td><td>감기 발생이 약 절반으로 줄었어요.</td></tr>
</tbody>
<caption>Hemilä H, Chalker E. Vitamin C for preventing and treating the common cold. Cochrane Database Syst Rev 2013</caption></table></div>
<p>정리하면, 비타민 C는 감기를 막는 약은 아니에요. 평소 부족하지 않게 먹는 것은 의미가 있지만, 감기에 걸렸을 때 고용량을 한꺼번에 먹는다고 빨리 낫지는 않아요.</p>

<h2>고용량 복용: 효과와 위험</h2>
<p>비타민 C는 한 번에 많이 먹을수록 흡수율이 떨어져요. 하루 200mg 정도면 혈액과 조직이 거의 포화 상태가 되고, 그 이상은 흡수가 줄면서 남는 양은 소변으로 빠져나가요. 그래서 1,000mg을 먹어도 그만큼 몸에 남는 게 아니에요.</p>
<div class="box warn"><span class="h">고용량을 조심해야 하는 경우</span>
<ul>
<li><strong>소화기 증상:</strong> 하루 2,000mg 이상에서 설사, 복통, 속쓰림이 흔해요.</li>
<li><strong>신장 결석:</strong> 비타민 C 일부가 옥살산으로 바뀌어 소변으로 나가요. 고용량을 오래 먹은 남성에서 옥살산칼슘 결석 위험이 높았다는 연구가 있어요. 결석을 앓은 적이 있다면 특히 조심해요.</li>
<li><strong>혈색소침착증:</strong> 철이 과하게 쌓이는 병이 있는 사람은 철 흡수를 늘리는 고용량 비타민 C를 피해요.</li>
<li><strong>콩팥 기능이 떨어진 사람</strong>은 옥살산이 쌓일 수 있어 고용량을 피해요.</li>
<li><strong>검사 결과 왜곡:</strong> 고용량은 일부 혈당 측정기와 대변 잠혈 검사 결과에 영향을 줄 수 있어요. 검사 전에는 복용 사실을 알려요.</li>
</ul></div>
<h3>비타민 C 주사는?</h3>
<p>고용량 비타민 C 정맥주사가 피로 회복이나 암 치료에 도움이 된다는 주장이 있지만, 암 치료 효과를 확인한 근거는 아직 부족해요. 암 치료 중이라면 담당 의사와 먼저 상의해요.</p>

<h2>보충제가 필요한 사람</h2>
<p>채소와 과일을 하루 몇 번씩 먹는 사람이라면 보충제 없이도 충분해요. 이런 경우에는 보충을 고려할 수 있어요.</p>
<ul>
<li>채소와 과일을 거의 먹지 않는 사람</li>
<li>흡연자</li>
<li>음식 섭취가 크게 줄어든 노인이나 환자</li>
<li>흡수에 문제가 있는 소화기 질환이 있는 사람</li>
</ul>
<p>먹는다면 하루 100~500mg 안팎으로 충분한 경우가 많아요. 천연 비타민 C와 합성 비타민 C는 화학적으로 같은 물질이라 몸에서의 효과도 차이가 없어요.</p>

<div class="box"><span class="h">비타민 C 챙기는 하루 예시</span>
<ol>
<li>아침: 키위 1개 또는 귤 2개</li>
<li>점심: 김치와 나물 반찬</li>
<li>간식: 딸기 한 줌이나 방울토마토</li>
<li>저녁: 파프리카나 브로콜리를 넣은 볶음 또는 샐러드</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>비타민 C를 먹으면 피부가 하얘지나요?</dt>
<dd>비타민 C는 멜라닌 생성에 관여하는 효소를 억제하는 작용이 있어서 바르는 화장품에 많이 쓰여요. 하지만 먹는 비타민 C가 피부를 눈에 띄게 하얗게 만든다는 근거는 약해요.</dd>
<dt>공복에 먹으면 속이 쓰려요.</dt>
<dd>비타민 C는 산성이라 공복에 먹으면 속쓰림이 생길 수 있어요. 식사 직후에 먹거나, 산도를 낮춘 완충형 제품을 선택할 수 있어요.</dd>
<dt>과일주스로 채워도 되나요?</dt>
<dd>주스에도 비타민 C가 있지만 당이 많고 식이섬유는 적어요. 생과일로 먹는 게 더 좋아요.</dd>
</dl>

<h2>참고 자료</h2>

</ul>

<template data-id="neck" data-cat="hea" data-date="2026.09.29"
  data-title="거북목 바로잡기: 목에 걸리는 무게, 책상 세팅, 하루 5분 스트레칭"
  data-thumb="27kg|60° 숙일 때"
  data-summary="고개를 숙일수록 목이 버텨야 하는 무게는 몇 배로 늘어나요. 거북목이 생기는 원리, 모니터와 의자 높이 맞추는 법, 하루 5분이면 되는 스트레칭 다섯 가지, 병원에 가야 하는 신호까지 정리했어요."
  data-tags="거북목,목통증,스트레칭,자세,사무실건강">
<p class="lead">사람의 머리는 볼링공 하나 정도의 무게예요. 이 공을 목 위에 똑바로 올려두면 가볍지만, 앞으로 기울일수록 목 뒤 근육이 붙잡고 버텨야 하는 힘이 커져요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>고개를 60° 숙이면 목에 걸리는 부담이 <strong>약 27kg</strong>까지 늘어난다는 모델링 연구가 있어요.</li>
<li>모니터 윗부분이 <strong>눈높이</strong>에 오고, 화면과 눈 사이가 <strong>50~70cm</strong>가 되게 맞춰요.</li>
<li>가장 효과적인 교정은 <strong>30분마다 자세를 바꾸는 것</strong>이에요. 좋은 자세도 오래 유지하면 굳어요.</li>
<li>팔 저림, 손의 힘 빠짐, 걸음이 불안해짐은 <strong>병원에 가야 하는 신호</strong>예요.</li>
</ul></div>

<h2>고개를 숙이면 목에 무엇이 일어날까</h2>
<p>성인의 머리 무게는 약 4.5~5.5kg이에요. 머리를 앞으로 숙이면 지렛대 원리 때문에 목 뒤 근육과 척추가 받는 힘이 커져요.</p>
<div class="tbl"><table>
<thead><tr><th>고개 숙인 각도</th><th>목이 받는 부담 (약)</th></tr></thead>
<tbody>
<tr><td class="num">0° (똑바로)</td><td class="num">4.5~5.5kg</td></tr>
<tr><td class="num">15°</td><td class="num">12kg</td></tr>
<tr><td class="num">30°</td><td class="num">18kg</td></tr>
<tr><td class="num">45°</td><td class="num">22kg</td></tr>
<tr><td class="num">60°</td><td class="num">27kg</td></tr>
</tbody>
<caption>Hansraj KK, Assessment of stresses in the cervical spine caused by posture and position of the head, Surgical Technology International 2014 (컴퓨터 모델링 연구)</caption></table></div>
<p>휴대폰을 볼 때 우리는 흔히 30~60° 정도 고개를 숙여요. 하루 몇 시간씩 이 자세가 이어지면 목 뒤 근육은 쉬지 못하고 계속 긴장해요. 반대로 목 앞쪽의 깊은 근육은 쓰지 않아 약해지고, 가슴 근육은 짧아져 어깨가 안으로 말려요. 이 불균형이 굳어진 상태가 흔히 말하는 <strong>거북목(전방 머리 자세)</strong>이에요.</p>

<h2>거북목이 부르는 증상</h2>
<ul>
<li><strong>목과 어깨 통증, 뻐근함:</strong> 가장 흔한 증상이에요. 오후가 될수록 심해져요.</li>
<li><strong>긴장성 두통:</strong> 뒷머리에서 시작해 머리를 조이는 듯한 두통이 생길 수 있어요.</li>
<li><strong>어깨 결림과 등 윗부분 통증:</strong> 날개뼈 안쪽이 뻐근해요.</li>
<li><strong>피로감과 집중력 저하</strong></li>
</ul>
<p>자세와 통증의 관계는 생각보다 복잡해요. 자세가 나빠도 아프지 않은 사람이 있고, 자세가 좋아도 아픈 사람이 있어요. 연구자들은 <strong>'한 자세로 오래 있는 것'</strong> 자체가 큰 문제라고 봐요. 그래서 완벽한 자세를 찾는 것보다 자주 움직이는 것이 더 중요해요.</p>

<h2>책상과 화면 세팅</h2>
<div class="tbl"><table>
<thead><tr><th>항목</th><th>맞추는 법</th></tr></thead>
<tbody>
<tr><td>모니터 높이</td><td>화면 맨 윗줄이 눈높이이거나 약간 아래. 시선이 살짝 내려다보는 정도</td></tr>
<tr><td>모니터 거리</td><td>팔을 뻗었을 때 손끝이 닿을 정도, 약 50~70cm</td></tr>
<tr><td>의자 높이</td><td>발바닥이 바닥에 닿고 무릎이 엉덩이와 비슷하거나 조금 낮게</td></tr>
<tr><td>등받이</td><td>엉덩이를 끝까지 넣고 허리를 등받이에 기대기, 필요하면 허리 쿠션</td></tr>
<tr><td>키보드·마우스</td><td>팔꿈치가 약 90°로 굽고 어깨가 들리지 않는 높이</td></tr>
<tr><td>노트북</td><td>거치대로 화면을 올리고 외장 키보드·마우스 쓰기</td></tr>
</tbody>
<caption>안전보건공단 VDT 작업 관련 권고 등을 바탕으로 정리</caption></table></div>
<h3>노트북이 거북목의 주범인 이유</h3>
<p>노트북은 화면과 키보드가 붙어 있어서 화면을 눈높이로 올리면 키보드가 너무 높아지고, 키보드를 편하게 두면 화면이 너무 낮아져요. 오래 쓴다면 <strong>거치대와 외장 키보드</strong>를 함께 쓰는 게 가장 확실한 해결책이에요.</p>
<h3>휴대폰은 눈높이로</h3>
<p>휴대폰을 가슴 앞이 아니라 눈앞으로 올려서 보면 고개를 덜 숙이게 돼요. 팔이 피곤하다면 그것도 휴대폰을 내려놓을 신호예요.</p>

<h2>하루 5분 스트레칭</h2>
<p>각 동작을 천천히, 통증이 없는 범위에서 해요. 스트레칭은 <strong>20~30초 유지</strong>, 근력 동작은 10회 반복이 기본이에요.</p>
<h3>1. 턱 당기기</h3>
<p>등을 펴고 앉아 시선은 정면에 둔 채, 턱을 수평으로 뒤로 밀어 이중 턱을 만들어요. 뒷목이 길어지는 느낌이 들면 5초 유지하고 풀어요. 10회. 약해진 목 앞쪽 깊은 근육을 깨우는 거북목 교정의 기본 동작이에요.</p>
<h3>2. 문틀 가슴 펴기</h3>
<p>문틀에 양팔을 90°로 올려 짚고, 한 발을 앞으로 내디디며 가슴을 앞으로 내밀어요. 가슴 앞쪽이 늘어나는 느낌으로 20~30초. 말린 어깨를 펴줘요.</p>
<h3>3. 날개뼈 모으기</h3>
<p>양팔을 옆으로 벌려 W 모양을 만들고, 날개뼈를 등 가운데로 모으며 팔꿈치를 뒤로 당겨요. 3~5초 유지, 10회.</p>
<h3>4. 옆목 늘리기</h3>
<p>오른손으로 의자 밑을 잡고, 왼손으로 머리를 살짝 왼쪽으로 기울여요. 오른쪽 목과 어깨가 늘어나요. 20~30초 후 반대쪽.</p>
<h3>5. 대각선 목 늘리기</h3>
<p>고개를 왼쪽으로 45° 돌린 뒤 코가 겨드랑이를 향하도록 숙여요. 왼손으로 뒷머리를 살짝 눌러 오른쪽 목 뒤를 늘려요. 20~30초 후 반대쪽.</p>
<div class="box note"><span class="h">스트레칭보다 중요한 한 가지</span>
<p>30분에서 1시간마다 일어나서 물을 마시러 가거나, 어깨를 크게 돌리거나, 창밖을 보는 것만으로도 목 근육이 쉬어요. 알람을 맞춰두면 잊지 않아요.</p></div>

<h2>잠자는 자세와 베개</h2>
<ul>
<li><strong>바로 누울 때:</strong> 목의 자연스러운 곡선을 받쳐주고 머리가 너무 들리지 않는 높이가 좋아요. 대략 턱이 가슴 쪽으로 당겨지지 않는 정도예요.</li>
<li><strong>옆으로 누울 때:</strong> 어깨 너비만큼 높이가 필요해요. 머리와 목, 등이 일직선이 되게 해요.</li>
<li><strong>엎드려 자기</strong>는 목을 한쪽으로 오래 돌리고 있게 되어 목에 부담이 커요.</li>
</ul>

<div class="box warn"><span class="h">이런 증상은 병원에 가보세요</span>
<ul>
<li>목 통증과 함께 <strong>팔이나 손이 저리거나 힘이 빠져요</strong>. (목 디스크나 신경 압박 가능성)</li>
<li>단추 채우기, 젓가락질 같은 <strong>손 동작이 둔해졌어요</strong>.</li>
<li><strong>걸음이 불안정</strong>해지거나 다리에 힘이 빠져요. (척수 압박 가능성, 빨리 진료가 필요해요)</li>
<li>넘어지거나 사고로 다친 뒤 목이 아파요.</li>
<li>열, 이유 없는 체중 감소가 함께 있거나 밤에 쉬어도 통증이 심해요.</li>
<li>몇 주 넘게 자세를 바꾸고 스트레칭을 해도 나아지지 않아요.</li>
</ul></div>

<h2>하루 점검표</h2>
<div class="box"><span class="h">목을 위한 하루 습관</span>
<ol>
<li>출근하면 모니터 높이와 거리 확인하기</li>
<li>30~60분마다 일어나거나 자세 바꾸기</li>
<li>점심 뒤 스트레칭 5분</li>
<li>휴대폰은 눈높이로 들고 보기</li>
<li>자기 전 휴대폰은 침대 밖에 두기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>자세 교정기를 쓰면 도움이 되나요?</dt>
<dd>잠깐 자세를 의식하게 하는 데는 도움이 될 수 있지만, 오래 의존하면 스스로 자세를 유지하는 근육이 약해질 수 있어요. 근력 운동과 자주 움직이는 습관이 더 근본적이에요.</dd>
<dt>일자목과 거북목은 같은 건가요?</dt>
<dd>일자목은 엑스레이에서 목뼈의 자연스러운 C자 곡선이 줄어든 모양을 말하고, 거북목은 머리가 몸통보다 앞으로 나온 자세를 말해요. 함께 나타나는 경우가 많지만 같은 말은 아니에요. 일자목이 있어도 증상이 없는 사람이 많아요.</dd>
<dt>마사지를 받으면 나아지나요?</dt>
<dd>근육 긴장을 풀어 통증을 잠시 줄이는 데는 도움이 돼요. 다만 효과가 오래가려면 원인이 되는 자세와 습관을 함께 바꿔야 해요.</dd>
</dl>

<h2>참고 자료</h2>
<ul class="refs">
<li>Hansraj KK, Assessment of stresses in the cervical spine caused by posture and position of the head, Surgical Technology International 2014</li>
<li>안전보건공단, 영상표시단말기(VDT) 취급 근로자 작업관리 지침</li>

</ul>

<template data-id="mold" data-cat="life" data-date="2026.09.29"
  data-title="곰팡이와 결로 잡는 법: 생기는 원리부터 안전한 제거, 다시 안 생기게 하기"
  data-thumb="60%|습도 상한"
  data-summary="겨울마다 창가 벽지가 검게 변한다면 원인은 결로예요. 결로가 생기는 원리, 곰팡이가 건강에 미치는 영향, 표면별 안전한 제거법, 락스를 쓸 때 주의할 점, 다시 생기지 않게 하는 습도와 환기 관리를 정리했어요."
  data-tags="곰팡이,결로,습도,환기,집관리">
<p class="lead">곰팡이는 닦아내는 것보다 다시 생기지 않게 하는 게 훨씬 어려워요. 닦아낸 자리에 또 생긴다면 곰팡이가 아니라 <strong>물기</strong>를 해결해야 해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>곰팡이는 <strong>습기</strong>가 있어야 자라요. 실내 습도는 <strong>40~60%</strong>, 곰팡이가 잘 생기는 집은 50% 안팎으로 유지해요.</li>
<li>결로는 따뜻하고 습한 공기가 <strong>차가운 벽이나 창</strong>에 닿을 때 생겨요.</li>
<li>작은 면적은 직접 제거할 수 있지만 <strong>마스크, 장갑, 환기</strong>는 필수예요.</li>
<li>락스는 <strong>다른 세제와 절대 섞지 않고</strong>, 희석 비율은 제품 설명을 따라요.</li>
</ul></div>

<h2>결로는 왜 생길까</h2>
<p>공기는 온도가 높을수록 수증기를 많이 품을 수 있어요. 따뜻하고 습한 실내 공기가 차가운 유리창이나 외벽에 닿으면 그 부분의 공기가 식으면서 더 이상 수증기를 품지 못하고 물방울로 맺혀요. 이 온도를 <strong>이슬점</strong>이라고 해요. 겨울 아침 차가운 컵 겉면에 물방울이 맺히는 것과 같은 원리예요.</p>
<p>그래서 결로는 이런 곳에 잘 생겨요.</p>
<ul>
<li>유리창과 창틀, 특히 단열이 약한 오래된 창</li>
<li>북쪽 벽, 외벽과 맞닿은 모서리</li>
<li>붙박이장이나 큰 가구 뒤 (공기가 돌지 않아 벽이 차가워요)</li>
<li>베란다를 확장한 공간의 벽</li>
<li>욕실 천장과 벽</li>
</ul>
<p>실내 습도를 높이는 주범은 요리, 샤워, 실내 빨래 건조, 사람의 호흡이에요. 겨울에 창문을 꼭 닫아두면 이 수증기가 빠져나갈 곳이 없어요.</p>

<h2>곰팡이가 건강에 미치는 영향</h2>
<p>세계보건기구는 습기와 곰팡이가 있는 실내 환경이 <strong>호흡기 증상, 천식 발생과 악화, 알레르기</strong>와 관련 있다고 정리했어요.</p>
<ul>
<li>기침, 콧물, 재채기, 눈 가려움 같은 알레르기 증상</li>
<li>천식이 있는 사람의 증상 악화</li>
<li>면역이 약한 사람(항암 치료 중, 장기 이식 후 등)의 곰팡이 감염 위험</li>
</ul>
<p>아이, 노인, 천식이나 알레르기가 있는 사람, 면역이 약한 사람이 있는 집이라면 더 적극적으로 관리하는 게 좋아요.</p>

<h2>직접 제거할까, 전문가에게 맡길까</h2>
<div class="tbl"><table>
<thead><tr><th>상황</th><th>권장</th></tr></thead>
<tbody>
<tr><td>작은 면적 (대략 1m² 미만), 표면에만 있음</td><td>보호구를 갖추고 직접 제거</td></tr>
<tr><td>넓은 면적, 벽지 안쪽이나 석고보드까지 번짐</td><td>전문 업체나 수리 필요</td></tr>
<tr><td>누수나 배관 문제로 생김</td><td>원인(누수) 수리가 먼저</td></tr>
<tr><td>집에 천식 환자나 면역 저하자가 있음</td><td>그 사람은 작업 중 다른 공간에 있게 하기</td></tr>
</tbody>
<caption>미국 환경보호청(EPA) 가정 곰팡이 안내를 바탕으로 정리</caption></table></div>

<h2>표면별 제거 방법</h2>
<div class="box warn"><span class="h">시작 전에 꼭</span>
<ul>
<li><strong>KF94 이상 마스크, 고무장갑, 가능하면 보안경</strong>을 착용해요. 곰팡이 포자를 들이마시지 않게 해요.</li>
<li><strong>창문을 열고</strong> 환기하면서 작업해요.</li>
<li>곰팡이를 <strong>마른 솔로 세게 털지 않아요.</strong> 포자가 공기 중으로 퍼져요. 먼저 물기를 살짝 적셔서 닦아요.</li>
<li>락스를 쓴다면 <strong>식초, 산성 세제, 암모니아가 든 세제와 절대 섞지 않아요.</strong> 독한 가스가 생겨요.</li>
</ul></div>
<h3>타일, 유리, 욕조 같은 매끄러운 표면</h3>
<p>주방세제를 푼 물로 닦아내고 물기를 완전히 말려요. 얼룩이 남으면 욕실용 곰팡이 제거제나 제품 설명서에 따라 희석한 락스를 뿌리고 잠시 둔 뒤 헹궈요. 사용 후에는 환기를 충분히 해요.</p>
<h3>실리콘과 줄눈</h3>
<p>실리콘 속까지 곰팡이가 파고든 경우가 많아서 표면을 닦아도 검은 자국이 남을 수 있어요. 휴지에 곰팡이 제거제를 적셔 덮어두면 약이 오래 머물러 효과가 좋아요. 그래도 남으면 실리콘을 떼어내고 다시 시공하는 게 확실해요.</p>
<h3>벽지</h3>
<p>표면에만 살짝 핀 곰팡이는 소독용 에탄올을 적신 천으로 두드리듯 닦고 완전히 말려요. 락스는 벽지 색을 바래게 하고 벽지 속으로 스며들어 잘 마르지 않을 수 있어요. 벽지 뒷면이나 벽 자체까지 검게 번졌다면 벽지를 떼어내고 벽을 소독하고 말린 뒤 다시 도배해야 해요. 원인인 결로나 누수를 해결하지 않으면 새 벽지에 또 생겨요.</p>
<h3>나무 가구, 옷, 가죽</h3>
<p>햇볕과 바람에 충분히 말린 뒤 곰팡이를 털어내고(야외에서) 에탄올로 닦아요. 옷은 세탁 후 완전히 건조해요. 매트리스나 소파처럼 속까지 번진 경우는 완전히 제거하기 어려워 교체를 고려해요.</p>

<h2>다시 생기지 않게 하는 법</h2>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>실천 요령</th></tr></thead>
<tbody>
<tr><td>습도 관리</td><td>습도계를 두고 40~60%로 유지, 결로가 잦은 집은 50% 안팎으로</td></tr>
<tr><td>환기</td><td>하루 2~3번, 마주 보는 창을 열어 10분 이상. 겨울에도 짧게라도</td></tr>
<tr><td>요리·샤워 후</td><td>주방 후드와 욕실 환풍기를 켜고 끝난 뒤에도 20~30분 더 돌리기</td></tr>
<tr><td>욕실</td><td>샤워 후 벽과 바닥의 물기를 밀대로 제거, 문 열어두기</td></tr>
<tr><td>가구 배치</td><td>외벽에 붙은 가구는 벽에서 5~10cm 띄우기</td></tr>
<tr><td>실내 빨래</td><td>제습기를 함께 틀거나 환기가 잘 되는 곳에서 말리기</td></tr>
<tr><td>창문 결로</td><td>아침마다 물기 닦기, 창에 단열 필름이나 에어캡 붙이기</td></tr>
<tr><td>난방</td><td>집 전체를 너무 춥게 두지 않기. 벽이 차가울수록 결로가 생겨요</td></tr>
</tbody></table></div>
<h3>제습기는 언제 쓸까</h3>
<p>장마철, 실내 빨래를 할 때, 환기가 어려운 방에 효과적이에요. 겨울에도 결로가 심한 방이라면 도움이 돼요. 물통을 자주 비우고 필터를 청소해요.</p>

<h2>세입자라면</h2>
<p>결로나 누수로 인한 곰팡이가 반복된다면 사진을 찍어 날짜와 함께 기록하고 집주인이나 관리사무소에 알려요. 건물 단열이나 누수 같은 구조적인 문제는 세입자의 생활 습관만으로 해결하기 어려워요. 수리 책임은 원인과 계약 내용에 따라 달라서, 다툼이 생기면 주택임대차 분쟁조정위원회 같은 기관에 상담할 수 있어요.</p>

<h2>우리 집 점검표</h2>
<div class="box"><span class="h">곰팡이 예방 체크리스트</span>
<ol>
<li>습도계 하나 사서 거실과 침실에 두기</li>
<li>외벽 쪽 가구 뒤와 붙박이장 안쪽 살펴보기</li>
<li>욕실 환풍기가 제대로 도는지 확인하기 (휴지를 대보면 빨려 들어가야 해요)</li>
<li>창틀 물구멍이 막히지 않았는지 확인하기</li>
<li>아침에 창문 결로를 닦고 10분 환기하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>식초나 베이킹소다로도 곰팡이가 없어지나요?</dt>
<dd>가벼운 표면 곰팡이와 얼룩에는 어느 정도 효과가 있어요. 다만 락스와 식초를 함께 쓰거나 연달아 쓰면 위험한 가스가 생길 수 있으니 한 가지만 쓰고 충분히 헹군 뒤 다른 걸 써요.</dd>
<dt>곰팡이 냄새만 나고 눈에 보이지는 않아요.</dt>
<dd>가구 뒤, 장롱 안, 벽지 뒤, 에어컨 내부, 싱크대 아래처럼 보이지 않는 곳에 있을 수 있어요. 누수 흔적이 있는지도 함께 살펴봐요.</dd>
<dt>에어컨에서 곰팡이 냄새가 나요.</dt>
<dd>냉방 후 내부에 남은 물기 때문이에요. 끄기 전에 송풍 모드로 20~30분 말리고, 필터를 2주에 한 번 청소해요. 냄새가 계속되면 내부 세척을 받아요.</dd>
</dl>

<h2>참고 자료</h2>

</ul>

<p class="lead">골다공증의 첫 증상은 대개 골절이에요. 가볍게 넘어졌을 뿐인데 손목이 부러지거나, 무거운 걸 들다가 허리뼈가 주저앉거나, 키가 몇 cm 줄어든 걸 뒤늦게 알게 돼요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>골밀도 검사의 <strong>T점수 −2.5 이하</strong>면 골다공증, −1.0~−2.5는 골감소증이에요.</li>
<li>폐경 후 여성, 70세 이상 남성, 골절 경험이 있는 사람은 <strong>골밀도 검사</strong>를 받아요.</li>
<li>치료제는 골절을 확실히 줄여요. 특히 <strong>6개월 주사제(데노수맙)는 임의로 끊으면 안 돼요.</strong></li>
<li>골절은 대부분 넘어져서 생겨요. <strong>낙상 예방</strong>이 약만큼 중요해요.</li>
</ul></div>

<h2>뼈는 평생 다시 지어진다</h2>
<p>뼈는 한 번 만들어지면 끝나는 구조물이 아니에요. 오래된 뼈를 녹이는 세포(파골세포)와 새 뼈를 만드는 세포(조골세포)가 평생 일하면서 몇 년에 걸쳐 뼈 전체를 새로 바꿔요. 젊을 때는 만드는 쪽이 더 많아서 20대 후반~30대 초반에 뼈의 양이 최고에 이르러요.</p>
<p>그 뒤로는 녹이는 쪽이 조금씩 앞서요. 특히 여성은 <strong>폐경 후 에스트로겐이 줄면서</strong> 몇 년 동안 뼈가 빠르게 줄어요. 그래서 골다공증은 폐경 후 여성에게 훨씬 흔하지만, 남성도 나이가 들면 적지 않게 생겨요.</p>

<h2>골밀도 검사 결과 읽기</h2>
<p>골밀도는 주로 <strong>이중에너지 X선 흡수법(DXA)</strong>으로 허리뼈와 엉덩이뼈(대퇴골)를 재요. 결과는 두 가지 점수로 나와요.</p>
<div class="tbl"><table>
<thead><tr><th>점수</th><th>비교 대상</th><th>쓰는 사람</th></tr></thead>
<tbody>
<tr><td>T점수</td><td>같은 성별의 젊은 성인 평균</td><td>폐경 후 여성, 50세 이상 남성</td></tr>
<tr><td>Z점수</td><td>같은 나이, 같은 성별 평균</td><td>폐경 전 여성, 50세 미만 남성, 어린이</td></tr>
</tbody></table></div>
<div class="tbl"><table>
<thead><tr><th>T점수</th><th>판정</th></tr></thead>
<tbody>
<tr><td class="num">−1.0 이상</td><td>정상</td></tr>
<tr><td class="num">−1.0 ~ −2.5 사이</td><td>골감소증</td></tr>
<tr><td class="num">−2.5 이하</td><td>골다공증</td></tr>
<tr><td class="num">−2.5 이하 + 골절</td><td>심한 골다공증</td></tr>
</tbody>
<caption>세계보건기구(WHO) 기준. 여러 부위 중 가장 낮은 점수로 판정해요.</caption></table></div>
<p>점수가 −1 낮아질 때마다 골절 위험은 대략 1.5~2배씩 커져요. 또 골밀도가 골감소증 범위라도, 가벼운 충격에 척추나 고관절이 부러졌다면 골다공증으로 보고 치료해요.</p>
<p>젊은 사람의 Z점수가 −2.0 이하로 낮다면 나이에 비해 뼈가 약하다는 뜻이라서, 다른 원인이 있는지 찾아봐야 해요.</p>

<h2>누가 검사를 받아야 할까</h2>
<ul>
<li>65세 이상 여성, 70세 이상 남성</li>
<li>폐경 후 여성과 50세 이상 남성 중 위험인자가 있는 사람</li>
<li>가벼운 충격에 뼈가 부러진 적이 있는 사람</li>
<li>스테로이드를 3개월 이상 먹었거나 먹는 사람</li>
<li>키가 예전보다 3~4cm 이상 줄었거나 등이 굽어가는 사람</li>
</ul>
<p>국가건강검진에서는 <strong>54세와 66세 여성</strong>이 골밀도 검사를 받을 수 있어요.</p>
<div class="tbl"><table>
<thead><tr><th>골다공증 위험을 높이는 것</th></tr></thead>
<tbody>
<tr><td>나이, 여성, 이른 폐경(45세 이전), 마른 체형(저체중)</td></tr>
<tr><td>부모의 고관절 골절 병력</td></tr>
<tr><td>흡연, 하루 3잔 이상의 음주</td></tr>
<tr><td>스테로이드 장기 복용, 류마티스관절염, 갑상선 기능 항진증, 부갑상선 질환</td></tr>
<tr><td>칼슘·비타민 D 부족, 운동 부족</td></tr>
<tr><td>일부 약물 (항경련제, 일부 항암 호르몬제, 위산억제제 장기 복용 등)</td></tr>
</tbody></table></div>

<h2>골절이 무서운 이유</h2>
<ul>
<li><strong>척추 압박골절:</strong> 허리뼈가 납작하게 주저앉아요. 기침이나 물건 들기처럼 가벼운 힘에도 생기고, 통증이 적어 모르고 지나가기도 해요. 키가 줄고 등이 굽는 원인이에요.</li>
<li><strong>손목 골절:</strong> 넘어질 때 손을 짚으며 생겨요. 골다공증의 첫 신호인 경우가 많아요.</li>
<li><strong>고관절 골절:</strong> 가장 심각해요. 대부분 수술이 필요하고, 오래 누워 지내면서 폐렴, 혈전 같은 합병증이 생기기 쉬워요. 고관절 골절 뒤 1년 안에 사망하는 비율이 상당히 높고, 살아도 예전처럼 걷지 못하는 경우가 많아요.</li>
</ul>
<p>한 번 골절이 생기면 <strong>다음 골절 위험이 크게 올라가요.</strong> 특히 첫 골절 후 1~2년이 가장 위험해서, 골절이 생겼다면 그때부터 적극적으로 치료해야 해요.</p>

<h2>치료제의 종류</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>작용</th><th>투여</th><th>주의할 점</th></tr></thead>
<tbody>
<tr><td>비스포스포네이트 (알렌드로네이트, 리세드로네이트, 졸레드론산 등)</td><td>뼈를 녹이는 것을 억제</td><td>주 1회·월 1회 알약, 3개월·1년 주사</td><td>먹는 약은 복용법이 까다로움</td></tr>
<tr><td>데노수맙</td><td>뼈를 녹이는 것을 강하게 억제</td><td>6개월마다 피하주사</td><td><strong>임의 중단 시 급격한 골소실</strong></td></tr>
<tr><td>선택적 에스트로겐 수용체 조절제 (랄록시펜 등)</td><td>뼈에서 에스트로겐처럼 작용</td><td>매일 알약</td><td>혈전 위험, 척추 골절 위주로 효과</td></tr>
<tr><td>테리파라타이드, 로모소주맙</td><td>새 뼈 생성을 촉진</td><td>매일·매주·매달 주사 (종류별)</td><td>골절 위험이 매우 높은 경우 사용, 기간 제한</td></tr>
<tr><td>여성호르몬</td><td>폐경 후 골소실 억제</td><td>알약, 패치</td><td>폐경 증상이 함께 있는 비교적 젊은 여성에서 고려</td></tr>
</tbody>
<caption>대한골대사학회 진료지침을 바탕으로 정리. 약 선택과 기간은 개인의 위험도에 따라 달라요.</caption></table></div>
<h3>먹는 비스포스포네이트 복용법</h3>
<ol>
<li>아침에 일어나자마자 <strong>빈속에</strong> 먹어요.</li>
<li><strong>물 한 컵(약 200mL)</strong>과 함께 먹어요. 커피, 우유, 주스, 생수 외 광천수는 흡수를 방해해요.</li>
<li>먹은 뒤 <strong>30분(약에 따라 60분) 동안 눕지 않고</strong> 아무것도 먹지 않아요. 식도에 약이 걸려 염증이 생기는 것을 막아요.</li>
</ol>
<div class="box warn"><span class="h">데노수맙 주사는 끊는 시기를 반드시 의사와 정하세요</span>
<p>데노수맙은 6개월마다 맞는 주사로 효과가 좋지만, 주사를 제때 맞지 않거나 중단하면 억눌렸던 뼈 녹이는 작용이 한꺼번에 살아나 <strong>골밀도가 빠르게 떨어지고 여러 척추가 한꺼번에 부러지는</strong> 경우가 보고돼 있어요. 중단할 때는 다른 약으로 이어가는 계획이 필요해요. 주사 날짜를 달력에 꼭 적어두세요.</p></div>
<h3>드물지만 알아둘 부작용</h3>
<p>뼈 녹이는 작용을 억제하는 약을 오래 쓰면 아주 드물게 <strong>턱뼈 괴사</strong>나 <strong>비정형 대퇴골 골절</strong>이 생길 수 있어요. 발치나 임플란트 같은 치과 치료 전에는 골다공증 약을 쓰고 있다고 알리고, 허벅지나 사타구니에 새로운 통증이 생기면 진료를 받아요. 다만 약으로 막는 골절이 이런 부작용보다 훨씬 많아서, 위험도가 높은 사람에게는 치료의 이득이 커요.</p>

<h2>약만큼 중요한 생활 관리</h2>
<ul>
<li><strong>칼슘:</strong> 음식으로 하루 700~800mg 이상, 부족하면 보충제로</li>
<li><strong>비타민 D:</strong> 혈중 농도를 확인하고 부족하면 보충</li>
<li><strong>운동:</strong> 걷기 같은 체중 부하 운동, 근력 운동, 균형 운동을 함께</li>
<li><strong>단백질:</strong> 뼈의 틀을 이루는 재료. 끼니마다 챙기기</li>
<li><strong>금연, 절주</strong></li>
</ul>

<h2>넘어지지 않는 집 만들기</h2>
<p>고관절과 손목 골절의 대부분은 넘어져서 생겨요. 집 안에서 넘어지는 경우도 많아요.</p>
<div class="box"><span class="h">낙상 예방 체크리스트</span>
<ol>
<li>바닥의 전선, 문턱, 미끄러지는 러그 정리하기</li>
<li>욕실 바닥에 미끄럼 방지 매트, 변기와 욕조 옆에 손잡이 달기</li>
<li>밤에 화장실 가는 길에 수면등 켜두기</li>
<li>계단에 난간과 밝은 조명 설치하기</li>
<li>뒤꿈치가 있고 미끄럽지 않은 실내화 신기</li>
<li>어지럼증을 일으킬 수 있는 약(수면제, 일부 혈압약 등)이 있는지 의사·약사와 확인하기</li>
<li>시력과 청력을 정기적으로 확인하기</li>
<li>한 발 서기 같은 균형 운동을 매일 하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>골다공증 약은 평생 먹어야 하나요?</dt>
<dd>비스포스포네이트는 3~5년 쓴 뒤 골절 위험이 낮아졌다면 일정 기간 쉬는 '약물 휴지기'를 두기도 해요. 약의 효과가 뼈에 남아 있기 때문이에요. 반면 데노수맙은 쉬는 방식이 맞지 않아요. 약마다 다르니 정기적으로 의사와 재평가해요.</dd>
<dt>남성도 골다공증 검사를 받아야 하나요?</dt>
<dd>네. 남성 골다공증은 덜 알려져 있지만 고관절 골절 후 사망률은 오히려 여성보다 높다는 보고가 있어요. 70세 이상이거나 위험인자가 있다면 검사를 받아요.</dd>
<dt>골감소증이면 약을 먹어야 하나요?</dt>
<dd>골감소증이라도 골절 경험이 있거나, 골절 위험 계산(FRAX 등)에서 위험이 높게 나오면 치료를 고려해요. 그렇지 않다면 칼슘, 비타민 D, 운동으로 관리하며 1~2년마다 다시 확인해요.</dd>
</dl>

<p class="lead">비타민 B12는 하루에 몇 마이크로그램만 있으면 되는 영양소예요. 그런데 흡수되는 과정이 까다로워서, 충분히 먹어도 몸에 들어오지 못하는 경우가 생각보다 많아요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인 권장섭취량은 하루 <strong>2.4μg</strong>이에요. 거의 <strong>동물성 식품</strong>에만 들어 있어요.</li>
<li>흡수에는 <strong>위산과 위에서 나오는 '내인자'</strong>가 필요해요. 그래서 위가 약해진 노인에게 부족하기 쉬워요.</li>
<li>당뇨약 <strong>메트포르민</strong>, 위산억제제를 오래 먹는 사람도 부족해질 수 있어요.</li>
<li>결핍이 오래가면 <strong>신경 손상이 영구적</strong>일 수 있어 일찍 발견하는 게 중요해요.</li>
</ul></div>

<h2>비타민 B12가 하는 일</h2>
<ul>
<li><strong>적혈구 만들기:</strong> 세포가 분열할 때 DNA를 만드는 데 필요해요. 부족하면 적혈구가 제대로 분열하지 못하고 크고 미숙한 상태로 남아요(거대적아구성 빈혈).</li>
<li><strong>신경 보호:</strong> 신경을 감싸는 절연체(수초)를 유지하는 데 필요해요. 부족하면 신경 신호가 제대로 전달되지 않아요.</li>
<li><strong>호모시스테인 대사:</strong> 엽산과 함께 호모시스테인이라는 물질을 처리해요.</li>
</ul>
<p>몸은 간에 비타민 B12를 몇 년 치 저장해 둬요. 그래서 섭취나 흡수가 끊겨도 결핍 증상은 <strong>몇 년 뒤에야</strong> 나타나요. 반대로 말하면, 증상이 나타났을 때는 이미 오랫동안 부족했다는 뜻이에요.</p>

<h2>흡수 과정: 네 개의 관문</h2>
<ol>
<li><strong>위산:</strong> 음식 속 단백질에 붙어 있는 비타민 B12를 떼어내요.</li>
<li><strong>침과 위의 운반 단백질:</strong> 떨어진 비타민 B12를 잠시 붙잡아요.</li>
<li><strong>내인자:</strong> 위벽 세포가 만드는 단백질로, 비타민 B12와 결합해 장으로 함께 내려가요.</li>
<li><strong>소장 끝(회장):</strong> 내인자와 결합한 비타민 B12만 이곳에서 흡수돼요.</li>
</ol>
<p>이 중 어느 한 단계라도 문제가 생기면 흡수가 줄어요. 결핍 원인을 알면 누가 조심해야 하는지 보여요.</p>

<h2>부족해지기 쉬운 사람</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th>이유</th></tr></thead>
<tbody>
<tr><td>엄격한 채식주의자 (비건)</td><td>비타민 B12가 거의 동물성 식품에만 있어요.</td></tr>
<tr><td>노인</td><td>위축성 위염으로 위산이 줄어 음식에서 떼어내지 못해요.</td></tr>
<tr><td>메트포르민 장기 복용자</td><td>소장 흡수를 방해해요. 오래 먹을수록 부족 위험이 커져요.</td></tr>
<tr><td>위산억제제 장기 복용자</td><td>양성자펌프억제제, H2 차단제가 위산을 줄여요.</td></tr>
<tr><td>위 절제 수술, 비만 수술을 받은 사람</td><td>내인자를 만드는 위 부분이 없어지거나 줄어요.</td></tr>
<tr><td>악성 빈혈</td><td>자가면역으로 내인자나 위벽 세포가 공격받아요.</td></tr>
<tr><td>크론병, 회장 절제</td><td>흡수가 일어나는 소장 끝에 문제가 있어요.</td></tr>
<tr><td>아산화질소(웃음가스) 흡입</td><td>비타민 B12를 비활성화시켜 급격한 신경 손상을 일으킬 수 있어요.</td></tr>
</tbody></table></div>

<h2>하루 필요량과 음식</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th>권장섭취량</th></tr></thead>
<tbody>
<tr><td>성인</td><td class="num">2.4μg</td></tr>
<tr><td>임신부</td><td class="num">2.6μg</td></tr>
<tr><td>수유부</td><td class="num">2.8μg</td></tr>
</tbody>
<caption>보건복지부·한국영양학회, 2020 한국인 영양소 섭취기준. 음식과 보충제로 인한 독성이 보고되지 않아 상한섭취량은 정해져 있지 않아요.</caption></table></div>
<p>조개류(특히 바지락, 굴, 대합), 소간, 생선(고등어, 연어, 참치), 소고기, 달걀, 우유와 유제품에 들어 있어요. 조개류와 간은 적은 양으로도 하루 필요량을 훌쩍 넘길 만큼 많아요.</p>
<div class="box note"><span class="h">김과 발효식품은 믿을 만한 공급원일까</span>
<p>김, 클로렐라, 된장 같은 식품에도 비타민 B12가 있다는 이야기가 있어요. 하지만 이 중 상당 부분은 사람에게 작용하지 않는 유사체이거나 함량이 들쭉날쭉해요. 채식을 하는 사람은 이런 식품에 기대기보다 <strong>비타민 B12 강화 식품이나 보충제</strong>로 챙기는 게 확실해요.</p></div>

<h2>결핍하면 나타나는 증상</h2>
<h3>혈액 증상</h3>
<ul>
<li>피로, 숨참, 두근거림, 창백함 (빈혈)</li>
<li>혀가 붉고 매끈해지며 따가움</li>
</ul>
<h3>신경 증상</h3>
<ul>
<li>손발 저림, 찌릿함, 감각 둔화 (양쪽 발끝에서 시작하는 경우가 많아요)</li>
<li>균형 감각 저하, 어두운 곳에서 비틀거림</li>
<li>기억력 저하, 우울, 성격 변화</li>
</ul>
<div class="box warn"><span class="h">신경 증상은 빈혈 없이도 나타날 수 있어요</span>
<p>비타민 B12 결핍의 신경 증상은 빈혈이 없는 상태에서 먼저 올 수 있어요. 또 엽산을 많이 먹으면 빈혈은 가려지지만 신경 손상은 계속 진행될 수 있어요. 손발 저림이 계속되고 위의 위험군에 해당한다면 비타민 B12 검사를 요청해 보세요. 오래 방치된 신경 손상은 치료해도 완전히 회복되지 않을 수 있어요.</p></div>

<h2>검사</h2>
<div class="tbl"><table>
<thead><tr><th>검사</th><th>의미</th></tr></thead>
<tbody>
<tr><td>혈청 비타민 B12</td><td>가장 기본 검사. 대략 200pg/mL 미만이면 결핍, 200~300은 경계로 봐요.</td></tr>
<tr><td>메틸말론산(MMA)</td><td>비타민 B12가 부족하면 올라가요. 경계 수치일 때 확인용으로 써요.</td></tr>
<tr><td>호모시스테인</td><td>비타민 B12나 엽산이 부족하면 올라가요.</td></tr>
<tr><td>일반 혈액검사</td><td>적혈구 크기(MCV)가 커지는 빈혈이 있는지 확인해요.</td></tr>
</tbody>
<caption>기준값은 검사기관마다 조금씩 달라요.</caption></table></div>
<p>미국당뇨병학회는 메트포르민을 오래 먹는 사람, 특히 빈혈이나 말초신경병증이 있는 사람에게 <strong>비타민 B12 수치를 정기적으로 확인</strong>하도록 권해요.</p>

<h2>보충: 먹는 약도 충분할까</h2>
<p>흡수에 내인자가 필요하다면 먹는 약은 소용없지 않을까 싶지만, 그렇지 않아요. 비타민 B12는 내인자 없이도 <strong>약 1% 정도가 장벽을 통해 그냥 흡수</strong>돼요. 그래서 1,000~2,000μg 같은 고용량을 먹으면 내인자가 없어도 필요량을 채울 수 있어요.</p>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>특징</th></tr></thead>
<tbody>
<tr><td>고용량 경구 보충제</td><td>편하고 비용이 적어요. 대부분의 결핍에서 주사만큼 효과적이라는 연구가 있어요.</td></tr>
<tr><td>근육 주사</td><td>결핍이 심하거나 신경 증상이 있을 때, 흡수가 매우 어려울 때 빠르게 채우기 위해 써요.</td></tr>
</tbody></table></div>
<p>음식으로 흡수가 어려운 노인이나 위산억제제 복용자는 강화 식품이나 보충제 형태가 오히려 흡수가 잘 돼요. 이미 단백질에서 떨어진 상태라서 위산이 없어도 되기 때문이에요.</p>

<div class="box"><span class="h">비타민 B12 점검 체크리스트</span>
<ol>
<li>엄격한 채식을 한다면 강화 식품이나 보충제를 꾸준히 먹고 있는지</li>
<li>메트포르민이나 위산억제제를 몇 년째 먹고 있는지</li>
<li>위 수술을 받은 적이 있는지</li>
<li>손발 저림, 균형 이상, 기억력 저하가 있는지</li>
<li>해당한다면 다음 검진이나 진료 때 비타민 B12 검사 요청하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>비타민 B12를 많이 먹으면 피로가 풀리나요?</dt>
<dd>결핍이 있는 사람은 보충 후 피로가 좋아져요. 하지만 결핍이 없는 사람이 고용량을 먹는다고 에너지가 더 생긴다는 근거는 없어요.</dd>
<dt>많이 먹어도 괜찮나요?</dt>
<dd>수용성이라 남는 양은 소변으로 나가서 독성은 거의 보고되지 않았어요. 그래도 필요 없는 고용량을 오래 먹을 이유는 없어요.</dd>
<dt>임신 준비 중인데 채식을 해요.</dt>
<dd>임신과 수유 중에는 아기의 신경 발달에도 비타민 B12가 필요해요. 엄마가 결핍되면 모유를 먹는 아기도 결핍될 수 있어요. 임신 전에 수치를 확인하고 보충제를 챙기는 게 좋아요.</dd>
</dl>

  data-title="눈 건강 총정리: 안구건조증, 블루라이트의 진실, 나이 들며 꼭 받을 검사"
  data-thumb="20·20·20|눈 쉬는 법"
  data-summary="하루 대부분을 화면 앞에서 보내는 요즘, 눈이 뻑뻑하고 침침한 건 흔한 일이에요. 안구건조증이 생기는 원리와 인공눈물 쓰는 법, 블루라이트에 대한 사실, 녹내장·황반변성처럼 조용히 진행하는 병, 응급 신호까지 정리했어요."
  data-tags="눈건강,안구건조증,인공눈물,녹내장,블루라이트">
<p class="lead">눈은 아파야 병원에 가는 기관이 아니에요. 녹내장처럼 시야가 절반 가까이 사라질 때까지 아무 느낌이 없는 병도 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>화면을 볼 때는 눈 깜빡임이 크게 줄어요. <strong>20분마다 20초, 6m 밖</strong>을 보며 쉬어요.</li>
<li>인공눈물을 자주 쓴다면 <strong>보존제 없는 일회용</strong>을 쓰고, 개봉한 건 한 번만 써요.</li>
<li>화면의 블루라이트가 눈을 손상시킨다는 근거는 부족해요. 다만 <strong>밤에는 잠을 방해</strong>할 수 있어요.</li>
<li>40세 이후에는 증상이 없어도 <strong>정기적인 안과 검진</strong>으로 녹내장, 황반변성을 확인해요.</li>
</ul></div>

<h2>화면을 보면 눈이 왜 피곤할까</h2>
<p>가까운 곳을 볼 때 눈 속의 근육(모양체근)은 수정체를 두껍게 만들기 위해 계속 긴장해요. 몇 시간 동안 화면을 보면 이 근육이 쉬지 못해 눈이 뻐근하고 초점이 잘 안 맞게 돼요.</p>
<p>게다가 집중해서 화면을 볼 때는 <strong>눈 깜빡임이 평소보다 크게 줄어요.</strong> 깜빡임은 눈물을 고르게 펴 바르는 와이퍼 역할을 하는데, 이게 줄면 눈 표면이 마르면서 따갑고 뻑뻑해져요. 이런 증상을 묶어 '디지털 눈 피로'라고 해요.</p>
<div class="box note"><span class="h">20-20-20 규칙</span>
<p><strong>20분</strong>마다, <strong>20피트(약 6m)</strong> 떨어진 곳을, <strong>20초</strong> 동안 바라봐요. 창밖을 보는 게 가장 쉬워요. 미국안과학회가 권하는 방법이에요. 이때 의식적으로 눈을 몇 번 꽉 감았다 뜨면 눈물도 다시 퍼져요.</p></div>

<h2>안구건조증: 눈물이 부족하거나 빨리 마르거나</h2>
<p>눈물은 물만으로 되어 있지 않아요. 세 겹으로 되어 있어요.</p>
<div class="tbl"><table>
<thead><tr><th>층</th><th>만드는 곳</th><th>역할</th></tr></thead>
<tbody>
<tr><td>기름층 (가장 바깥)</td><td>눈꺼풀 가장자리의 마이봄샘</td><td>눈물이 증발하지 않게 막아요.</td></tr>
<tr><td>물층 (가운데)</td><td>눈물샘</td><td>눈 표면을 적시고 영양을 공급해요.</td></tr>
<tr><td>점액층 (가장 안쪽)</td><td>결막의 세포</td><td>눈물이 눈 표면에 잘 붙게 해요.</td></tr>
</tbody></table></div>
<p>안구건조증은 크게 두 가지로 나뉘어요. 눈물 양 자체가 적은 경우와, 기름층이 부족해 눈물이 <strong>너무 빨리 증발하는 경우</strong>예요. 실제로는 후자가 더 흔해요. 마이봄샘이 막히면 기름이 나오지 않아 눈물이 금방 말라요.</p>
<h3>흔한 증상</h3>
<ul>
<li>뻑뻑함, 모래가 들어간 듯한 이물감, 따가움</li>
<li>눈이 쉽게 피로하고 오후가 되면 침침해요.</li>
<li>바람이 불면 오히려 눈물이 줄줄 흘러요. 마른 눈을 보호하려는 반사 작용이에요.</li>
<li>렌즈를 오래 끼기 어려워요.</li>
</ul>

<h2>인공눈물 제대로 쓰기</h2>
<ul>
<li><strong>하루 4~6번 이상 자주 쓴다면 보존제 없는 일회용</strong>을 써요. 다회용 제품의 보존제는 자주 쓰면 눈 표면을 자극할 수 있어요.</li>
<li>식품의약품안전처는 <strong>일회용 점안제는 개봉 후 한 번만 쓰고 버리도록</strong> 안내해요. 뚜껑을 다시 닫아 두었다가 쓰면 오염될 수 있어요.</li>
<li>처음 몇 방울은 버리고 쓰면 용기를 딸 때 생긴 미세 조각이 눈에 들어가는 것을 막을 수 있어요.</li>
<li>용기 끝이 눈이나 속눈썹에 닿지 않게 해요.</li>
<li>다른 안약과 함께 쓴다면 5분 이상 간격을 둬요.</li>
</ul>

<h2>기름층을 살리는 눈꺼풀 관리</h2>
<p>마이봄샘이 막힌 경우에는 인공눈물만으로는 부족하고 기름이 잘 나오게 도와야 해요.</p>
<ol>
<li><strong>온찜질:</strong> 따뜻한 수건이나 찜질 안대를 눈에 5~10분 올려 굳은 기름을 녹여요. 너무 뜨겁지 않게 해요.</li>
<li><strong>눈꺼풀 마사지:</strong> 찜질 후 깨끗한 손가락으로 눈꺼풀을 속눈썹 방향으로 부드럽게 쓸어내려요.</li>
<li><strong>눈꺼풀 세정:</strong> 전용 세정제나 순한 세정제로 속눈썹 뿌리 부분을 닦아요.</li>
</ol>
<p>이 밖에 실내 습도를 40~60%로 유지하고, 에어컨이나 히터 바람이 얼굴에 직접 닿지 않게 하는 것도 도움이 돼요. 증상이 계속되면 안과에서 원인에 맞는 치료(항염 안약, 눈물점 마개 등)를 받을 수 있어요.</p>

<h2>블루라이트, 정말 눈에 해로울까</h2>
<p>블루라이트 차단 안경이 많이 팔리지만, 미국안과학회는 <strong>스마트폰과 컴퓨터 화면의 블루라이트가 눈을 손상시킨다는 과학적 근거는 없다</strong>는 입장이에요. 화면에서 나오는 블루라이트의 양은 햇빛에 비해 아주 적어요. 여러 연구를 모은 분석에서도 차단 안경이 눈의 피로를 줄이는 효과는 뚜렷하지 않았어요.</p>
<p>다만 블루라이트는 <strong>생체 시계</strong>에 영향을 줘요. 밤늦게 밝은 화면을 보면 멜라토닌 분비가 늦어져 잠드는 데 방해가 될 수 있어요. 그래서 밤에는 화면 밝기를 낮추고 야간 모드를 쓰거나, 자기 전 한 시간은 화면을 멀리하는 게 좋아요. 디지털 눈 피로는 블루라이트보다 <strong>깜빡임 감소와 초점 근육 긴장</strong> 때문이에요.</p>

<h2>아이의 근시: 밖에서 노는 시간</h2>
<p>근시는 전 세계적으로 빠르게 늘고 있어요. 여러 연구에서 <strong>야외 활동 시간이 긴 아이는 근시가 늦게, 덜 생긴다</strong>는 결과가 반복해서 나왔어요. 대만에서는 학교에서 하루 2시간 야외 활동을 권장한 뒤 아이들의 근시 증가가 줄었다는 보고도 있어요. 가까운 화면을 보는 시간을 줄이고 밝은 바깥에서 노는 시간을 늘리는 게 좋아요.</p>

<h2>나이 들며 조용히 오는 눈의 병</h2>
<div class="tbl"><table>
<thead><tr><th>질환</th><th>특징</th><th>알아채는 법</th></tr></thead>
<tbody>
<tr><td>녹내장</td><td>시신경이 서서히 손상돼 시야가 바깥쪽부터 좁아져요. 한국인은 안압이 정상인 녹내장이 많아요.</td><td>초기에는 증상이 없어요. 안저 검사, 시야 검사로 발견</td></tr>
<tr><td>황반변성</td><td>시력의 중심인 황반이 손상돼 가운데가 흐리거나 선이 휘어 보여요.</td><td>한쪽 눈씩 가리고 격자무늬(암슬러 격자)나 문틀 보기</td></tr>
<tr><td>백내장</td><td>수정체가 뿌옇게 흐려져요. 눈부심, 겹쳐 보임</td><td>서서히 시야가 흐려짐. 수술로 치료</td></tr>
<tr><td>당뇨망막병증</td><td>당뇨병으로 망막 혈관이 손상돼요.</td><td>당뇨병이 있다면 해마다 안저 검사</td></tr>
</tbody></table></div>
<p>녹내장으로 잃은 시야는 되돌릴 수 없어요. 일찍 발견해 안약으로 진행을 늦추는 게 최선이에요. 그래서 <strong>40세 이후에는 증상이 없어도 1~2년마다</strong> 안과에서 안압과 안저 검사를 받아보길 권해요. 가족 중 녹내장이 있거나 고도근시, 당뇨병이 있다면 더 자주 확인해요.</p>

<div class="box warn"><span class="h">바로 안과나 응급실로 가야 하는 신호</span>
<ul>
<li><strong>갑자기</strong> 시력이 떨어지거나 시야 일부가 커튼 친 듯 가려져요.</li>
<li>눈앞에 <strong>번쩍임이 보이고 날파리 같은 점이 갑자기 많이</strong> 생겼어요. (망막박리 가능성)</li>
<li>심한 눈 통증과 두통, 구역질이 함께 오고 눈이 충혈됐어요. (급성 녹내장 가능성)</li>
<li>화학물질이 눈에 들어갔어요. <strong>흐르는 물로 15분 이상 씻어낸 뒤</strong> 바로 병원에 가요.</li>
<li>물체에 눈을 세게 맞았거나 찔렸어요.</li>
</ul></div>

<h2>콘택트렌즈 위생</h2>
<ul>
<li>렌즈를 <strong>수돗물로 헹구거나 보관하지 않아요.</strong> 수돗물의 가시아메바가 심각한 각막 감염을 일으킬 수 있어요.</li>
<li>렌즈를 낀 채 자지 않아요. 수영이나 샤워 중에도 빼는 게 안전해요.</li>
<li>보존액은 매번 새로 갈고, 렌즈 케이스도 정기적으로 바꿔요.</li>
<li>충혈, 통증, 눈부심이 생기면 렌즈를 빼고 진료를 받아요.</li>
</ul>

<h2>눈을 위한 하루 습관</h2>
<div class="box"><span class="h">점검표</span>
<ol>
<li>모니터는 눈높이보다 약간 아래, 50~70cm 거리에 두기</li>
<li>20분마다 먼 곳 보며 눈 깜빡이기</li>
<li>화면 밝기를 주변 조명과 비슷하게 맞추기</li>
<li>밖에서는 자외선 차단 선글라스 쓰기 (UV400 표시 확인)</li>
<li>금연하기 (흡연은 황반변성과 백내장 위험을 높여요)</li>
<li>40세 이후 1~2년마다 안과 검진 받기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>루테인을 먹으면 눈이 좋아지나요?</dt>
<dd>황반변성이 어느 정도 진행된 사람에게 특정 조합의 영양제가 진행을 늦춘다는 연구(AREDS2)가 있어요. 하지만 건강한 사람의 시력을 좋게 하거나 안구건조증을 치료하는 효과는 확인되지 않았어요.</dd>
<dt>어두운 곳에서 휴대폰을 보면 눈이 나빠지나요?</dt>
<dd>눈에 영구적인 손상을 준다는 근거는 없지만, 눈이 더 빨리 피로해지고 잠을 방해해요. 주변 조명을 켜고 보는 게 좋아요.</dd>
<dt>안경을 쓰면 눈이 더 나빠지나요?</dt>
<dd>아니에요. 맞는 안경을 쓴다고 근시가 더 빨리 진행되지는 않아요. 오히려 맞지 않는 안경이나 안경을 쓰지 않아 찡그리며 보는 것이 눈을 더 피로하게 해요.</dd>
</dl>

<template data-id="laundry" data-cat="life" data-date="2026.09.29"
  data-title="세탁 기호 읽는 법과 빨래 냄새 없애기: 옷을 오래 입는 세탁의 기본"
  data-thumb="40°C|물세탁 기호"
  data-summary="옷 안쪽 라벨의 작은 그림들은 옷을 망치지 않는 설명서예요. 물세탁·표백·건조·다림질·드라이클리닝 기호 읽는 법, 빨래에서 쉰내가 나는 진짜 이유와 없애는 법, 세탁기 관리, 과탄산소다 쓸 때 주의점을 정리했어요."
  data-tags="세탁,세탁기호,빨래냄새,과탄산소다,세탁기청소">
<p class="lead">빨래에서 나는 쉰내는 세제가 부족해서가 아니라 <strong>시간</strong> 때문인 경우가 많아요. 젖은 채로 머무는 시간이 길수록 세균이 자라요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>세탁 기호는 <strong>물세탁(대야), 표백(삼각형), 건조(네모), 다림질(다리미), 전문 세탁(원)</strong> 다섯 가지예요.</li>
<li>빨래 냄새는 젖은 섬유에서 자라는 <strong>세균</strong>이 원인이에요. 세탁이 끝나면 바로 꺼내 빨리 말려요.</li>
<li>세제는 많이 넣을수록 좋은 게 아니에요. <strong>정량</strong>을 지켜야 헹굼이 잘 돼요.</li>
<li>세탁기도 <strong>한 달에 한 번</strong> 세탁조를 청소해요.</li>
</ul></div>

<h2>세탁 기호 읽는 법</h2>
<p>옷의 취급 표시는 국가표준(KS)과 국제표준(ISO)의 기호를 주로 써요. 기호 위에 X가 그어져 있으면 '하지 마세요'라는 뜻이에요.</p>
<div class="tbl"><table>
<thead><tr><th>기호 모양</th><th>뜻</th><th>읽는 법</th></tr></thead>
<tbody>
<tr><td>물이 담긴 대야</td><td>물세탁</td><td>안의 숫자는 최고 물 온도(°C). 손이 들어가 있으면 손세탁만. 아래 밑줄이 있으면 약하게(밑줄 두 개는 아주 약하게)</td></tr>
<tr><td>삼각형</td><td>표백</td><td>빈 삼각형은 모든 표백제 가능, 빗금이 있으면 산소계 표백제만, X면 표백 금지</td></tr>
<tr><td>네모 안에 원</td><td>회전식 기계 건조(건조기)</td><td>원 안 점 하나는 낮은 온도, 두 개는 보통 온도, X면 건조기 금지</td></tr>
<tr><td>네모 안에 선</td><td>자연 건조</td><td>세로선은 걸어서, 가로선은 뉘어서 말리기. 왼쪽 위 빗금은 그늘에서</td></tr>
<tr><td>다리미</td><td>다림질</td><td>점 하나 약 110°C, 두 개 약 150°C, 세 개 약 200°C. X면 다림질 금지</td></tr>
<tr><td>원</td><td>전문 세탁(드라이클리닝, 웨트클리닝)</td><td>안의 글자(P, F, W)는 세탁소에서 쓰는 용제와 방식. X면 드라이클리닝 금지</td></tr>
</tbody>
<caption>KS K ISO 3758 섬유제품 취급 표시 기호를 바탕으로 정리. 오래된 옷이나 일부 제품은 한글로 표시하기도 해요.</caption></table></div>
<h3>이런 라벨이 헷갈려요</h3>
<ul>
<li><strong>"드라이클리닝"만 적혀 있고 물세탁에 X가 없다면:</strong> 드라이클리닝이 권장이라는 뜻이고, 물세탁도 조심스럽게 가능한 경우가 있어요. 물세탁 기호에 X가 있다면 물세탁하면 줄어들거나 변형될 수 있어요.</li>
<li><strong>뉘어서 말리기:</strong> 니트, 스웨터처럼 무거운 옷은 걸어 말리면 늘어나서 평평하게 뉘어 말려요.</li>
<li><strong>그늘에서 말리기:</strong> 색이 바래기 쉬운 옷이에요. 뒤집어서 말리면 색 바램이 줄어요.</li>
</ul>

<h2>빨래에서 쉰내가 나는 이유</h2>
<p>빨래를 했는데도 나는 퀴퀴한 냄새, 특히 수건이 젖으면 다시 올라오는 냄새는 섬유에 남아 있는 <strong>세균</strong>이 원인이에요. 일본 연구진은 빨래 냄새의 주요 원인균 중 하나로 <strong>모락셀라균</strong>을 꼽았어요. 이 세균은 사람의 피부에서 떨어진 각질과 피지를 먹고 자라면서 냄새 물질을 만들어요. 건조에 강하고 한 번 자리 잡으면 일반 세탁으로 잘 없어지지 않아요.</p>
<p>세균이 자라기 좋은 조건은 이래요.</p>
<ul>
<li>세탁이 끝난 뒤 세탁기 안에 <strong>젖은 채로 오래</strong> 두기</li>
<li>실내에서 <strong>천천히</strong> 마르기 (마르는 데 5시간 넘게 걸리면 냄새가 나기 쉽다고 해요)</li>
<li>빨래를 <strong>너무 촘촘히</strong> 널기</li>
<li>땀에 젖은 옷을 빨래통에 <strong>며칠씩</strong> 모아두기</li>
<li>세제나 섬유유연제 찌꺼기가 쌓인 <strong>더러운 세탁기</strong></li>
</ul>

<h2>냄새 없애는 방법</h2>
<h3>1. 빨리 꺼내서 빨리 말리기</h3>
<p>가장 효과가 큰 방법이에요. 세탁이 끝나면 바로 꺼내고, 옷 사이 간격을 주먹 하나 정도 띄워 널어요. 실내에서 말린다면 <strong>선풍기나 제습기</strong>를 함께 틀어 건조 시간을 줄여요. 긴 옷과 짧은 옷을 번갈아 널면 공기가 잘 통해요.</p>
<h3>2. 산소계 표백제로 담가 빨기</h3>
<p>이미 냄새가 밴 수건이나 흰 옷은 <strong>과탄산소다(산소계 표백제)</strong>를 40~60°C 정도의 따뜻한 물에 녹여 30분~1시간 담갔다가 세탁해요. 따뜻한 물에서 산소가 나오며 세균과 얼룩을 분해해요.</p>
<h3>3. 삶기</h3>
<p>면 수건이나 흰 속옷처럼 삶아도 되는 옷(물세탁 기호에 95°C 표시)은 삶으면 세균이 확실히 줄어요.</p>
<h3>4. 수건에는 섬유유연제를 빼기</h3>
<p>섬유유연제는 섬유를 코팅해서 흡수력을 떨어뜨리고, 쌓이면 세균이 붙기 좋은 환경이 돼요. 수건만큼은 섬유유연제 없이 세탁해요.</p>
<div class="box warn"><span class="h">과탄산소다 쓸 때 주의</span>
<ul>
<li><strong>울, 실크, 가죽, 금속 장식</strong>이 있는 옷에는 쓰지 않아요.</li>
<li>색깔 옷은 눈에 안 띄는 곳에 먼저 시험해요.</li>
<li><strong>뚜껑을 꽉 닫은 병에 뜨거운 물과 함께 넣지 않아요.</strong> 가스가 생겨 용기가 터질 수 있어요.</li>
<li><strong>락스(염소계 표백제)와 섞지 않아요.</strong></li>
<li>맨손으로 오래 만지지 말고 고무장갑을 껴요.</li>
</ul></div>

<h2>세제는 얼마나 넣어야 할까</h2>
<p>세제를 많이 넣으면 더 깨끗해질 것 같지만, 실제로는 헹굼으로 다 빠지지 않고 섬유에 남아요. 남은 세제는 피부를 자극하고, 옷을 뻣뻣하게 하며, 세균의 먹이가 되기도 해요.</p>
<ul>
<li>세제 포장의 <strong>계량 기준</strong>(물의 양, 빨래 양, 오염 정도)을 따라요.</li>
<li><strong>드럼 세탁기에는 드럼 전용(저거품) 세제</strong>를 써요. 일반 세제는 거품이 너무 많이 생겨 세탁력이 떨어지고 헹굼이 어려워요.</li>
<li>세탁물은 세탁조의 <strong>70~80%</strong> 정도만 채워요. 너무 꽉 채우면 빨래가 움직이지 못해 때가 덜 빠져요.</li>
</ul>

<h2>세탁기 관리</h2>
<div class="tbl"><table>
<thead><tr><th>할 일</th><th>주기</th><th>방법</th></tr></thead>
<tbody>
<tr><td>세탁 후 문 열어두기</td><td>매번</td><td>내부를 말려 곰팡이를 막아요.</td></tr>
<tr><td>드럼 문 고무 패킹 닦기</td><td>매주</td><td>안쪽 주름에 낀 물기와 이물질을 마른 천으로 닦아요.</td></tr>
<tr><td>세제 투입구 청소</td><td>매달</td><td>분리해서 굳은 세제와 곰팡이를 씻어요.</td></tr>
<tr><td>세탁조 청소</td><td>매달</td><td>세탁조 클리너나 과탄산소다를 넣고 '통세척' 코스나 가장 높은 온도로 돌려요.</td></tr>
<tr><td>배수 필터 청소</td><td>1~2개월</td><td>드럼 세탁기 아래쪽 필터의 보풀과 이물질을 빼요. 물이 흘러나오니 수건을 받쳐요.</td></tr>
</tbody></table></div>

<h2>옷 종류별 세탁 요령</h2>
<ul>
<li><strong>니트·울:</strong> 중성세제로 찬물 손세탁하거나 울 코스를 써요. 비틀어 짜지 말고 수건으로 눌러 물기를 뺀 뒤 뉘어 말려요.</li>
<li><strong>청바지:</strong> 뒤집어서 찬물에 세탁하면 물 빠짐이 줄어요.</li>
<li><strong>기능성 운동복:</strong> 섬유유연제를 쓰지 않아요. 땀 배출 기능이 떨어져요.</li>
<li><strong>속옷:</strong> 세탁망에 넣어 따로 세탁하면 모양이 덜 망가져요.</li>
<li><strong>지퍼, 단추:</strong> 지퍼는 잠그고 단추는 풀어서 세탁하면 다른 옷이 덜 상해요.</li>
</ul>

<h2>오늘 바로 해볼 것</h2>
<div class="box"><span class="h">빨래 냄새 없애기 점검표</span>
<ol>
<li>세탁 끝나는 시간에 알람 맞춰서 바로 꺼내기</li>
<li>세제 계량컵으로 정량 넣기</li>
<li>수건은 섬유유연제 없이 따로 세탁하기</li>
<li>냄새나는 수건은 과탄산소다에 담가 두었다 세탁하기</li>
<li>이번 달 세탁조 청소 날짜 정하기</li>
<li>세탁 후 세탁기 문 열어두기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>식초를 넣으면 냄새가 없어지나요?</dt>
<dd>헹굼 단계에 소량 넣으면 세제 찌꺼기를 중화하는 데 도움이 될 수 있어요. 다만 세균을 없애는 효과는 산소계 표백제나 삶기보다 약해요. 락스나 과탄산소다와 같은 세탁에 함께 넣지 않아요.</dd>
<dt>건조기를 쓰면 냄새가 안 나나요?</dt>
<dd>빨리 마르기 때문에 냄새가 훨씬 덜 나요. 다만 이미 세균이 자리 잡은 수건은 건조기로도 냄새가 남을 수 있어요. 건조기 필터는 매번 청소해요.</dd>
<dt>흰 옷이 누렇게 변했어요.</dt>
<dd>피지와 땀이 섬유에 쌓여 산화된 경우가 많아요. 산소계 표백제를 따뜻한 물에 풀어 담가 두면 좋아지는 경우가 많아요. 흰 옷은 입은 뒤 너무 오래 두지 말고 빨리 세탁해요.</dd>
</dl>

<h2>참고 자료</h2>
<ul class="refs">
<li>국가기술표준원, KS K ISO 3758 섬유제품 취급 표시 기호</li>

</ul>

<template data-id="thyroid" data-cat="dis" data-date="2026.09.29"
  data-title="갑상선 질환 총정리: 기능 저하와 항진, 결절과 암까지 한 번에 이해하기"
  data-thumb="TSH|갑상선 검사"
  data-summary="피곤하고 붓고 추위를 탄다면 기능 저하, 두근거리고 살이 빠지고 더위를 탄다면 항진일 수 있어요. 갑상선 호르몬 검사 읽는 법, 두 질환의 원인과 치료, 약 먹는 법, 흔한 갑상선 결절과 갑상선암 검진 논쟁까지 정리했어요."
  data-tags="갑상선,갑상선기능저하증,갑상선기능항진증,갑상선결절,호르몬">
<p class="lead">갑상선은 목 앞쪽에 있는 나비 모양의 작은 기관이에요. 여기서 나오는 호르몬은 몸 전체의 속도를 조절하는 가속 페달 같은 역할을 해요. 너무 적으면 모든 게 느려지고, 너무 많으면 모든 게 빨라져요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>갑상선 기능은 <strong>TSH</strong>와 <strong>유리 T4(FT4)</strong> 두 가지 혈액검사로 먼저 확인해요.</li>
<li>기능 저하증은 대개 <strong>하시모토 갑상선염</strong>, 항진증은 대개 <strong>그레이브스병</strong>이 원인이에요.</li>
<li>갑상선 호르몬제는 <strong>아침 빈속에</strong> 먹고, 칼슘제·철분제와는 시간을 떼어요.</li>
<li>항갑상선제를 먹다가 <strong>고열과 목 통증</strong>이 생기면 약을 멈추고 바로 혈액검사를 받아요.</li>
</ul></div>

<h2>갑상선 호르몬은 어떻게 조절될까</h2>
<p>뇌하수체는 혈액 속 갑상선 호르몬 양을 감시하다가 부족하면 <strong>TSH(갑상선 자극 호르몬)</strong>를 내보내 갑상선에 "더 만들어라"라고 신호를 보내요. 호르몬이 충분하면 TSH를 줄여요. 이 관계 때문에 검사 결과는 반대 방향으로 움직여요.</p>
<div class="tbl"><table>
<thead><tr><th>상태</th><th>TSH</th><th>유리 T4</th></tr></thead>
<tbody>
<tr><td>정상</td><td>정상</td><td>정상</td></tr>
<tr><td>기능 저하증</td><td>높음 ↑</td><td>낮음 ↓</td></tr>
<tr><td>잠재성(무증상) 기능 저하증</td><td>높음 ↑</td><td>정상</td></tr>
<tr><td>기능 항진증</td><td>낮음 ↓</td><td>높음 ↑</td></tr>
<tr><td>잠재성 기능 항진증</td><td>낮음 ↓</td><td>정상</td></tr>
</tbody>
<caption>정상 범위는 검사기관마다 조금씩 달라요. 결과지의 참고치를 함께 보세요.</caption></table></div>
<p>TSH가 높다는 건 뇌가 갑상선을 계속 재촉하고 있다는 뜻이에요. 즉 갑상선 호르몬이 부족하다는 신호예요. 처음 보면 헷갈리지만 이 원리를 알면 결과지가 읽혀요.</p>

<h2>갑상선 기능 저하증</h2>
<h3>원인</h3>
<p>가장 흔한 원인은 <strong>하시모토 갑상선염</strong>이에요. 면역체계가 갑상선을 공격해 서서히 기능이 떨어지는 자가면역 질환이에요. 혈액검사에서 갑상선 자가항체(항TPO 항체)가 양성으로 나와요. 이 밖에 갑상선 수술이나 방사성 요오드 치료 후, 일부 약물(리튬, 아미오다론 등) 때문에도 생겨요.</p>
<h3>증상</h3>
<ul>
<li>피로, 무기력, 졸림</li>
<li>추위를 많이 탐</li>
<li>체중 증가, 얼굴과 손발 부종</li>
<li>변비, 피부 건조, 머리카락 빠짐</li>
<li>우울감, 기억력 저하</li>
<li>월경량 증가나 불규칙, 임신이 잘 안 됨</li>
</ul>
<p>이 증상들은 흔하고 서서히 오기 때문에 "나이 탓", "피곤해서"라고 넘기기 쉬워요.</p>
<h3>치료와 약 먹는 법</h3>
<p>부족한 호르몬을 <strong>레보티록신</strong>(합성 갑상선 호르몬)으로 채워요. 몸에서 만드는 것과 같은 성분이라 정확한 용량을 맞추면 부작용이 거의 없어요.</p>
<ol>
<li><strong>아침 빈속에</strong>, 식사 30~60분 전에 물과 함께 먹어요. (의사에 따라 잠자기 전 복용을 권하기도 해요)</li>
<li><strong>칼슘제, 철분제, 위산억제제, 제산제</strong>는 흡수를 방해하니 4시간 정도 간격을 둬요.</li>
<li>커피와 콩 음식도 흡수에 영향을 줄 수 있어서 약과 바로 함께 먹지 않아요.</li>
<li>용량을 바꾼 뒤에는 <strong>6~8주 뒤</strong> 혈액검사로 확인해요. 호르몬 수치가 안정되는 데 그만큼 걸려요.</li>
</ol>
<div class="box note"><span class="h">임신을 계획하거나 임신했다면</span>
<p>임신 중에는 갑상선 호르몬 필요량이 늘어나요. 기능 저하증으로 약을 먹고 있다면 임신을 확인하는 즉시 의사에게 알리고 용량을 조정해야 해요. 엄마의 갑상선 호르몬 부족은 아기의 뇌 발달에 영향을 줄 수 있어요.</p></div>
<h3>잠재성 기능 저하증은 치료해야 할까</h3>
<p>TSH만 약간 높고 T4가 정상인 경우예요. TSH가 10 이상이거나, 임신을 준비 중이거나, 증상이 뚜렷하면 치료를 고려해요. 그 외에는 대부분 약 없이 6~12개월마다 검사하며 지켜봐요. 특히 노인은 TSH가 조금 높은 게 자연스러울 수 있어요.</p>

<h2>갑상선 기능 항진증</h2>
<h3>원인</h3>
<p>가장 흔한 원인은 <strong>그레이브스병</strong>이에요. 자가항체가 갑상선을 계속 자극해 호르몬이 과하게 나와요. 이 밖에 갑상선에 생긴 결절이 스스로 호르몬을 만들거나, 갑상선염으로 저장된 호르몬이 한꺼번에 새어 나오는 경우도 있어요.</p>
<h3>증상</h3>
<ul>
<li>가슴 두근거림, 빠른 맥박</li>
<li>잘 먹는데도 체중 감소</li>
<li>더위를 많이 탐, 땀이 많아짐</li>
<li>손 떨림, 불안, 신경질, 불면</li>
<li>잦은 배변이나 설사</li>
<li>근력 약화, 월경량 감소</li>
<li>눈이 튀어나오거나 부음, 이물감 (그레이브스 안병증)</li>
</ul>
<h3>치료</h3>
<div class="tbl"><table>
<thead><tr><th>치료</th><th>방법</th><th>특징</th></tr></thead>
<tbody>
<tr><td>항갑상선제</td><td>메티마졸, 프로필티오우라실(PTU)</td><td>국내에서 가장 먼저 쓰는 치료. 보통 1~2년 이상 복용</td></tr>
<tr><td>방사성 요오드</td><td>요오드 캡슐을 먹어 갑상선을 줄임</td><td>재발했거나 약을 쓰기 어려울 때. 이후 기능 저하가 생기는 경우가 많아요</td></tr>
<tr><td>수술</td><td>갑상선 절제</td><td>갑상선이 매우 크거나 다른 치료가 어려울 때</td></tr>
<tr><td>베타 차단제</td><td>프로프라놀롤 등</td><td>두근거림, 떨림 같은 증상을 빠르게 줄이는 보조 치료</td></tr>
</tbody></table></div>
<div class="box warn"><span class="h">항갑상선제 복용 중 이런 증상은 즉시 확인하세요</span>
<p>드물지만 항갑상선제는 백혈구(과립구)를 급격히 줄이는 <strong>무과립구증</strong>을 일으킬 수 있어요. 약을 먹는 중에 <strong>38°C 이상 열, 심한 목 통증, 입 안 헐음</strong>이 생기면 약을 멈추고 바로 병원에서 혈액검사를 받아요. 주로 복용 초기 몇 달 안에 생기지만 언제든 가능해요. 피부 발진, 황달, 짙은 소변도 알려야 할 증상이에요.</p></div>

<h2>갑상선 결절: 대부분은 양성</h2>
<p>갑상선에 생긴 혹을 결절이라고 해요. 초음파로 보면 성인의 상당수에서 발견될 만큼 흔하고, <strong>대부분은 양성</strong>이에요.</p>
<ul>
<li>초음파에서 모양, 경계, 석회화, 크기를 보고 악성 가능성을 분류해요(국내는 K-TIRADS 분류 사용).</li>
<li>의심 소견이 있고 일정 크기 이상이면 가는 바늘로 세포를 뽑는 <strong>미세침흡인검사</strong>를 해요.</li>
<li>양성으로 나오면 대부분 치료 없이 정기적으로 초음파를 보며 지켜봐요.</li>
</ul>

<h2>갑상선암과 검진 논쟁</h2>
<p>국내에서는 2000년대 들어 건강검진에서 갑상선 초음파가 널리 쓰이면서 갑상선암 진단이 폭발적으로 늘었어요. 그런데 같은 기간 갑상선암 사망률은 거의 변하지 않았어요. 크기가 작고 천천히 자라서 평생 문제를 일으키지 않았을 암까지 찾아낸 <strong>과잉진단</strong> 문제가 제기됐어요.</p>
<p>그 뒤 국내 권고안은 <strong>증상이 없는 성인에게 일상적인 갑상선 초음파 선별검사를 권하지 않는</strong> 방향으로 정리됐어요. 다만 목에 혹이 만져지거나, 목소리가 변하거나, 가족 중 갑상선암이 있거나, 어릴 때 목에 방사선 치료를 받은 경우는 검사가 필요해요.</p>
<p>갑상선암의 대부분을 차지하는 유두암은 진행이 느리고 예후가 매우 좋은 편이에요. 1cm 이하의 저위험 미세유두암은 바로 수술하지 않고 정기 초음파로 지켜보는 '적극적 감시'도 선택지로 논의돼요.</p>

<h2>요오드와 해조류</h2>
<p>요오드는 갑상선 호르몬의 재료예요. 한국인은 미역, 김, 다시마 같은 해조류를 많이 먹어서 요오드가 부족한 경우가 드물고, 오히려 많이 먹는 편이에요. 그래서 갑상선 질환이 있다고 요오드 보충제를 따로 먹을 필요는 없어요. 하시모토 갑상선염이 있는 사람이 다시마 환이나 해조류 추출물을 많이 먹으면 기능 저하가 악화될 수 있다는 보고가 있으니, 보통 식사로 먹는 양 이상은 피하는 게 좋아요.</p>

<div class="box"><span class="h">갑상선 검사를 받아볼 만한 경우</span>
<ol>
<li>이유 없이 피로하고 체중이 늘거나 줄었다</li>
<li>추위나 더위를 유난히 탄다</li>
<li>가슴이 자주 두근거리거나 손이 떨린다</li>
<li>월경이 불규칙해지거나 임신이 잘 되지 않는다</li>
<li>목 앞이 부어 보이거나 혹이 만져진다</li>
<li>가족 중 갑상선 질환이 있다</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>갑상선 호르몬제는 평생 먹어야 하나요?</dt>
<dd>하시모토 갑상선염으로 기능이 떨어졌거나 갑상선을 제거했다면 대부분 계속 먹어요. 다만 일시적인 갑상선염 후의 기능 저하는 회복되기도 해서 의사가 재평가해요.</dd>
<dt>갑상선약 먹으면 살이 빠지나요?</dt>
<dd>기능 저하로 늘었던 체중이 약간 줄 수는 있지만, 정상 용량의 갑상선 호르몬제는 체중 감량 약이 아니에요. 체중 감량을 위해 갑상선 호르몬을 먹는 건 심장과 뼈에 해로워요.</dd>
<dt>그레이브스병은 완치되나요?</dt>
<dd>항갑상선제를 1~2년 이상 먹은 뒤 끊었을 때 상당수는 관해 상태를 유지하지만, 재발도 흔해요. 재발하면 약을 다시 쓰거나 방사성 요오드, 수술을 고려해요.</dd>
</dl>

<h2>엽산이 하는 일</h2>
<p>엽산은 비타민 B군의 하나로, 세포가 분열할 때 DNA를 만드는 데 꼭 필요해요. 그래서 세포 분열이 빠르게 일어나는 곳, 즉 <strong>태아와 적혈구를 만드는 골수</strong>에서 특히 중요해요.</p>
<ul>
<li><strong>태아 신경관 형성:</strong> 부족하면 척추갈림증(이분척추), 무뇌증 같은 신경관 결손 위험이 커져요.</li>
<li><strong>적혈구 생성:</strong> 부족하면 비타민 B12 결핍 때와 같은 거대적아구성 빈혈이 생겨요.</li>
<li><strong>호모시스테인 대사:</strong> 비타민 B12, B6와 함께 호모시스테인을 처리해요.</li>
</ul>

</tbody>
<caption>보건복지부·한국영양학회, 2020 한국인 영양소 섭취기준</caption></table></div>
<p><strong>DFE(식이엽산당량)</strong>는 흡수율 차이를 반영한 단위예요. 음식에 자연히 들어 있는 엽산(folate)은 흡수율이 약 50%인데, 보충제나 강화식품의 합성 엽산(folic acid)은 식사와 함께 먹으면 약 85%가 흡수돼요. 그래서 합성 엽산 1μg은 1.7μg DFE로 계산해요.</p>

<h2>음식으로 얼마나 얻을까</h2>
<p>엽산(folate)이라는 이름은 '잎'을 뜻하는 라틴어에서 왔어요. 이름처럼 녹색 잎채소에 많아요.</p>
<ul>
<li><strong>채소:</strong> 시금치, 브로콜리, 아스파라거스, 상추, 쑥갓, 깻잎</li>
<li><strong>콩류:</strong> 대두, 병아리콩, 렌틸콩, 풋콩</li>
<li><strong>기타:</strong> 소간(매우 많음), 달걀노른자, 딸기, 오렌지, 아보카도</li>
</ul>
<p>음식 속 엽산은 <strong>열과 빛에 약하고 물에 녹아요.</strong> 채소를 오래 삶으면 상당량이 파괴되거나 국물로 빠져나가요. 가볍게 데치거나 찌고, 일부는 생으로 먹는 게 좋아요. 음식만으로 임신에 필요한 양을 확실히 채우기는 어려워서 보충제가 권장돼요.</p>

<h2>임신 준비: 언제부터 얼마나</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th>권장 보충량</th><th>기간</th></tr></thead>
<tbody>
<tr><td>임신 가능성이 있는 모든 여성</td><td class="num">하루 400μg</td><td>임신 최소 1개월 전부터 임신 12주까지</td></tr>
<tr><td>이전 임신에서 신경관 결손이 있었던 경우 등 고위험</td><td class="num">하루 4,000μg (4mg)</td><td>의사 처방에 따라</td></tr>
</tbody>
<caption>미국 질병통제예방센터(CDC)·세계보건기구 권고, 국내 산부인과 권고를 바탕으로 정리</caption></table></div>
<p>계획하지 않은 임신도 많아서, 여러 나라 보건기관은 <strong>임신 가능성이 있는 모든 여성</strong>이 평소에 엽산 400μg을 먹도록 권해요. 여러 나라가 밀가루 같은 주식에 엽산을 강화한 뒤 신경관 결손이 크게 줄었어요.</p>
<p>국내 보건소에서는 임신부나 임신을 준비하는 여성에게 엽산제를 지원하기도 해요. 대상과 기간이 지역마다 다를 수 있으니 가까운 보건소에 확인해 보세요. 뇌전증 약(일부 항경련제)이나 당뇨병, 비만이 있는 여성은 필요량이 다를 수 있으니 임신 전에 의사와 상의해요.</p>
<div class="box note"><span class="h">남성도 먹어야 할까</span>
<p>엽산이 정자 건강에 도움이 된다는 이야기가 있지만, 난임 남성에게 엽산과 아연을 보충했을 때 정액 질이나 출산율이 좋아지지 않았다는 대규모 연구(2020, JAMA)가 있어요. 남성은 균형 잡힌 식사로 충분한 경우가 많아요.</p></div>

<h2>MTHFR 유전자와 '활성형 엽산' 논란</h2>
<p>MTHFR은 엽산을 몸에서 쓰는 형태로 바꾸는 효소예요. 이 효소의 기능이 조금 약한 유전자형이 흔한데, 일부에서는 이런 사람은 일반 엽산 대신 비싼 '활성형 엽산(메틸폴레이트)'을 먹어야 한다고 광고해요.</p>
<p>그러나 미국 질병통제예방센터는 <strong>MTHFR 유전자형과 관계없이 일반 합성 엽산이 신경관 결손 예방에 효과적</strong>이며, 이를 위해 유전자 검사를 할 필요는 없다고 안내해요. 신경관 결손 예방 효과가 대규모 연구로 입증된 것은 일반 합성 엽산이에요.</p>

<h2>부족해지기 쉬운 사람</h2>
<ul>
<li>채소와 과일을 거의 먹지 않는 사람</li>
<li><strong>과음</strong>하는 사람 (알코올이 흡수와 대사를 방해해요)</li>
<li>메토트렉세이트, 일부 항경련제, 트리메토프림 같은 약을 먹는 사람</li>
<li>셀리악병, 염증성 장질환처럼 흡수에 문제가 있는 사람</li>
<li>임신부와 수유부</li>
<li>투석 중인 사람</li>
</ul>
<p>결핍하면 피로, 숨참 같은 빈혈 증상, 입안과 혀의 염증이 생길 수 있어요.</p>

<h2>많이 먹으면 생기는 문제</h2>
<div class="box warn"><span class="h">고용량 엽산이 비타민 B12 결핍을 가릴 수 있어요</span>
<p>엽산을 많이 먹으면 비타민 B12 결핍으로 생긴 빈혈이 교정돼 겉으로는 좋아 보여요. 하지만 비타민 B12 부족으로 인한 <strong>신경 손상은 계속 진행</strong>될 수 있어요. 그래서 합성 엽산의 상한섭취량(성인 1,000μg)이 정해져 있어요. 특히 노인이나 채식하는 사람이 고용량 엽산을 먹는다면 비타민 B12 상태도 함께 확인하는 게 좋아요.</p></div>
<p>종합비타민, 임신 영양제, 엽산 단일제를 함께 먹으면 합산량이 생각보다 많아질 수 있어요. 라벨의 함량을 더해보세요.</p>

<div class="box"><span class="h">임신 준비 엽산 체크리스트</span>
<ol>
<li>임신 계획이 있다면 지금부터 엽산 400μg 복용 시작하기</li>
<li>먹고 있는 영양제의 엽산 함량을 모두 더해보기</li>
<li>이전 임신에서 신경관 결손이 있었거나, 항경련제를 먹는다면 산부인과에서 용량 상담하기</li>
<li>보건소 엽산제 지원 여부 확인하기</li>
<li>녹색 채소와 콩을 식단에 꾸준히 넣기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>임신 사실을 늦게 알았어요. 이미 늦었나요?</dt>
<dd>신경관은 임신 초기에 닫히지만, 알게 된 날부터라도 12주까지 먹는 게 좋아요. 걱정된다면 산부인과 진료 때 상담하고 정기 검사를 받으면 돼요. 엽산을 먹지 않은 대부분의 임신에서도 아기는 건강하게 태어나요.</dd>
<dt>엽산은 공복에 먹어야 하나요?</dt>
<dd>식사와 관계없이 먹어도 돼요. 매일 같은 시간에 먹는 습관을 들이는 게 가장 중요해요.</dd>
<dt>엽산을 먹으면 심혈관 질환이 예방되나요?</dt>
<dd>엽산은 호모시스테인을 낮추지만, 이미 식품 섭취가 충분한 사람에게 보충제가 심근경색을 줄인다는 근거는 일관되지 않아요. 일부 연구에서는 뇌졸중 예방 효과가 보고되기도 했지만, 이를 목적으로 고용량을 먹는 것은 권장되지 않아요.</dd>
</dl>

<p class="lead">충치와 잇몸병의 원인은 대부분 치아 표면에 붙은 세균막(치태)이에요. 이 막은 물로 헹궈서는 떨어지지 않고, 문질러야만 떨어져요. 그런데 칫솔이 닿지 않는 곳이 생각보다 많아요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>하루 두 번, <strong>2분 이상</strong>, 불소가 든 치약으로 닦아요.</li>
<li>칫솔은 <strong>잇몸과 치아 경계에 45°</strong>로 대고 짧게 진동하듯 닦아요.</li>
<li>양치 후에는 치약을 <strong>뱉기만 하고 물로는 가볍게</strong> 헹궈요. 불소가 남아야 효과가 있어요.</li>
<li>치아 사이는 칫솔이 닿지 않아요. <strong>치실이나 치간칫솔을 하루 한 번</strong> 써요.</li>
</ul></div>

<h2>치태와 치석: 무엇을 닦아내는 걸까</h2>
<p>식사를 하고 몇 시간만 지나도 치아 표면에는 세균과 음식 찌꺼기가 뭉친 끈적한 막, <strong>치태(플라크)</strong>가 생겨요. 치태 속 세균은 당을 먹고 산을 만들어 치아를 녹이고(충치), 잇몸에 염증을 일으켜요(잇몸병).</p>
<p>치태를 제때 닦아내지 않으면 침 속 미네랄과 만나 딱딱하게 굳어 <strong>치석</strong>이 돼요. 치석은 칫솔로 떨어지지 않아서 치과에서 스케일링으로 제거해야 해요.</p>

<h2>칫솔질 방법</h2>
<h3>잇몸 경계를 닦는 게 핵심</h3>
<p>잇몸병의 시작점은 치아와 잇몸이 만나는 경계예요. 여기에 치태가 가장 잘 쌓여요. 치과에서 권하는 <strong>변형 바스법</strong>은 이래요.</p>
<ol>
<li>칫솔모를 <strong>잇몸과 치아 경계에 45°</strong> 각도로 대요. 모의 일부가 잇몸 틈에 살짝 들어가게 해요.</li>
<li>제자리에서 <strong>짧게 앞뒤로 진동</strong>하듯 10번 정도 움직여요. 세게 문지르지 않아요.</li>
<li>그다음 칫솔을 <strong>잇몸에서 치아 끝 방향으로 쓸어내려요</strong>(위니는 아래로, 아랫니는 위로).</li>
<li>한 번에 두세 개씩 옮겨가며 바깥쪽, 안쪽, 씹는 면을 모두 닦아요.</li>
<li>앞니 안쪽은 칫솔을 세워서 닦아요.</li>
</ol>
<h3>흔한 실수</h3>
<ul>
<li><strong>옆으로 세게 문지르기:</strong> 치아 목 부분이 패이고(치경부 마모) 잇몸이 내려갈 수 있어요.</li>
<li><strong>너무 짧게:</strong> 대부분 1분도 안 되게 닦아요. 타이머를 맞추거나 전동칫솔의 타이머를 이용해요.</li>
<li><strong>늘 같은 곳부터:</strong> 처음 닦는 곳만 꼼꼼하고 마지막은 대충 하게 돼요. 순서를 정해두면 빠뜨리는 곳이 줄어요.</li>
</ul>
<h3>칫솔 고르기</h3>
<ul>
<li>모는 <strong>부드럽거나 중간 정도</strong>, 머리는 입 안쪽 어금니까지 닿을 만큼 작게</li>
<li><strong>3개월마다</strong> 교체하고, 모가 벌어졌다면 더 일찍</li>
<li>전동칫솔은 회전 진동형이 수동 칫솔보다 치태와 잇몸 염증을 조금 더 줄였다는 연구가 있어요. 다만 수동 칫솔도 제대로 쓰면 충분해요.</li>
</ul>

<h2>치약과 불소</h2>
<p>불소는 치아 표면을 단단하게 만들고, 산에 녹기 시작한 부분을 다시 굳히는(재광화) 역할을 해요. 충치 예방 효과가 가장 확실하게 입증된 성분이에요.</p>
<div class="tbl"><table>
<thead><tr><th>나이</th><th>치약 사용량</th><th>메모</th></tr></thead>
<tbody>
<tr><td>첫니가 난 뒤 ~ 3세 미만</td><td>쌀알 크기</td><td>보호자가 닦아주기</td></tr>
<tr><td>3~6세</td><td>완두콩 크기</td><td>삼키지 않고 뱉도록 지도</td></tr>
<tr><td>성인</td><td>칫솔모 길이의 ⅓~½ 정도</td><td>불소 1,000ppm 이상 치약 권장</td></tr>
</tbody>
<caption>미국소아치과학회·미국치과의사협회 권고를 바탕으로 정리</caption></table></div>
<p>치약 포장의 성분표에서 불화나트륨, 일불소인산나트륨 같은 불소 성분과 농도(ppm)를 확인할 수 있어요.</p>
<h3>뱉기만 하고 헹굼은 가볍게</h3>
<p>양치 후 물로 여러 번 세게 헹구면 치아 표면에 남아야 할 불소가 씻겨 나가요. 영국 보건당국은 양치 후 <strong>치약을 뱉기만 하고 물로 헹구지 않는 것</strong>을 권해요. 거품이 불편하다면 적은 물로 한 번만 가볍게 헹궈요.</p>

<h2>식후 바로 양치해도 될까</h2>
<p>대부분의 식사 후에는 바로 닦아도 괜찮아요. 다만 <strong>탄산음료, 과일주스, 식초가 든 음식, 신 과일</strong>처럼 산성이 강한 음식을 먹은 직후에는 치아 표면이 잠시 약해진 상태예요. 이때 바로 칫솔질을 하면 표면이 깎일 수 있어요.</p>
<ul>
<li>산성 음식을 먹은 뒤에는 <strong>물로 입을 헹구고 30분~1시간 뒤</strong>에 닦아요.</li>
<li>산성 음료는 빨대를 쓰거나 한 번에 마시고, 오래 홀짝이지 않아요.</li>
</ul>

<h2>치아 사이: 칫솔이 닿지 않는 곳</h2>
<p>칫솔은 치아 사이 면을 거의 닦지 못해요. 충치와 잇몸병이 치아 사이에서 많이 시작되는 이유예요.</p>
<div class="tbl"><table>
<thead><tr><th>도구</th><th>잘 맞는 경우</th><th>사용 요령</th></tr></thead>
<tbody>
<tr><td>치실</td><td>치아 사이가 좁은 경우, 젊은 사람</td><td>C자 모양으로 치아를 감싸고 잇몸 아래까지 살짝 넣어 위아래로 쓸어요.</td></tr>
<tr><td>치간칫솔</td><td>치아 사이가 넓어진 경우, 잇몸이 내려간 경우, 교정 장치나 브릿지</td><td>틈에 맞는 크기를 골라요. 억지로 넣지 않고 부드럽게 앞뒤로 움직여요.</td></tr>
<tr><td>구강세정기(워터픽)</td><td>교정 장치, 임플란트 주변</td><td>치실이나 치간칫솔의 보조 수단으로 써요.</td></tr>
</tbody></table></div>
<p>처음 치실을 쓰면 잇몸에서 피가 날 수 있어요. 대개 잇몸에 염증이 있다는 신호이고, 1~2주 꾸준히 쓰면 줄어들어요. 계속 피가 난다면 치과 진료를 받아요.</p>

<h2>잇몸병: 조용히 치아를 잃게 하는 병</h2>
<p>잇몸병은 잇몸에만 염증이 있는 <strong>치은염</strong>에서 시작해, 치아를 받치는 뼈까지 녹이는 <strong>치주염</strong>으로 진행해요. 성인이 치아를 잃는 주요 원인이에요.</p>
<h3>이런 신호가 있어요</h3>
<ul>
<li>양치할 때 잇몸에서 피가 나요.</li>
<li>잇몸이 붉게 붓고 물렁해요.</li>
<li>입 냄새가 계속 나요.</li>
<li>잇몸이 내려가 치아가 길어 보이거나, 찬 것에 시려요.</li>
<li>치아가 흔들리거나 사이가 벌어져요.</li>
</ul>
<p>잇몸병은 당뇨병과 서로 영향을 주고받고, 심혈관 질환과도 관련이 있다는 연구가 많아요. 흡연은 잇몸병의 가장 강력한 위험 요인 중 하나예요.</p>

<h2>스케일링과 구강검진</h2>
<ul>
<li><strong>스케일링:</strong> 만 19세 이상은 건강보험으로 <strong>해마다 한 번</strong> 스케일링을 받을 수 있어요. 잇몸병이 있다면 더 자주 필요할 수 있어요.</li>
<li><strong>구강검진:</strong> 국가건강검진에서 일반 건강검진과 함께 구강검진을 받을 수 있어요.</li>
<li>스케일링 후 며칠 시린 건 흔해요. 치석이 덮고 있던 부분이 드러났기 때문이고 대개 좋아져요.</li>
</ul>

<div class="box"><span class="h">오늘부터 바꿀 것</span>
<ol>
<li>칫솔을 잇몸 경계에 45°로 대고 짧게 진동하며 닦기</li>
<li>2분 타이머 맞추기</li>
<li>양치 후 뱉기만 하고 가볍게 한 번 헹구기</li>
<li>자기 전 치실이나 치간칫솔 한 번</li>
<li>혀 뒤쪽을 칫솔이나 혀클리너로 가볍게 닦기</li>
<li>올해 스케일링 받았는지 확인하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>가글(구강청결제)을 쓰면 양치를 대신할 수 있나요?</dt>
<dd>아니에요. 구강청결제는 치태를 물리적으로 떼어내지 못해요. 양치와 치실의 보조 수단으로만 써요. 알코올이 든 제품은 입을 건조하게 할 수 있어요.</dd>
<dt>충치가 없는데 치과에 가야 하나요?</dt>
<dd>충치와 잇몸병은 초기에 아프지 않아요. 6개월~1년에 한 번 검진과 스케일링을 받으면 작은 문제를 일찍 발견해 치료가 간단해져요.</dd>
<dt>단 음식은 양보다 횟수가 문제라던데요?</dt>
<dd>맞아요. 단 것을 먹을 때마다 입 안이 산성으로 바뀌어 치아가 녹기 시작해요. 같은 양이라도 하루 종일 조금씩 자주 먹으면 치아가 회복할 시간이 없어요. 단 음식은 식사 때 한 번에 먹는 게 나아요.</dd>
</dl>

<h2>참고 자료</h2>
<ul class="refs">
<li>대한치과의사협회·대한치주과학회, 올바른 칫솔질 안내</li>
<li>미국치과의사협회(ADA), Fluoride Toothpaste Use for Young Children</li>

<li>Yaacob M 외, Powered versus manual toothbrushing for oral health, Cochrane Review 2014</li>

</ul>

<template data-id="detergent" data-cat="life" data-date="2026.09.29"
  data-title="세제 안전 사용법: 락스를 제대로 희석하는 법과 절대 섞으면 안 되는 조합"
  data-thumb="1:50|락스 희석"
  data-summary="집에서 쓰는 세제도 잘못 섞으면 독가스가 생겨요. 락스의 정체와 올바른 희석 비율, 섞으면 위험한 조합 표, 과탄산소다·베이킹소다·구연산의 쓰임, 사고가 났을 때 대처, 아이가 있는 집의 세제 보관법을 정리했어요."
  data-tags="락스,세제,청소,생활화학제품,안전">
<p class="lead">욕실 청소를 하다가 머리가 아프고 눈이 따가웠던 적이 있다면, 세제 두 가지가 만났을 가능성이 있어요. 각각은 안전해도 섞이면 전혀 다른 물질이 돼요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>락스는 <strong>산성 세제·식초와 섞으면 염소 가스</strong>, <strong>암모니아와 섞으면 클로라민 가스</strong>가 생겨요.</li>
<li>표면 소독용 락스는 대략 <strong>물 1L에 락스 20mL</strong>(가정용 5% 기준, 약 1:50)로 희석해요.</li>
<li>락스는 <strong>찬물</strong>에 희석하고, 만든 날 쓰고, 환기하며 써요.</li>
<li>사고가 나면 <strong>즉시 그 공간을 떠나 환기</strong>하고, 증상이 있으면 119에 연락해요.</li>
</ul></div>

<h2>락스는 무엇일까</h2>
<p>흔히 '락스'라고 부르는 제품은 <strong>차아염소산나트륨</strong> 수용액이에요. 가정용 제품은 보통 4~5% 농도예요. 강한 산화력으로 세균과 바이러스를 없애고, 곰팡이 얼룩을 탈색시켜요. 대신 피부와 점막을 자극하고, 금속을 부식시키며, 옷의 색을 빼요.</p>
<p>락스는 강한 알칼리성이에요. 이 성질 때문에 산성 물질과 만나면 문제가 생겨요.</p>

<h2>절대 섞으면 안 되는 조합</h2>
<div class="tbl"><table>
<thead><tr><th>조합</th><th>생기는 물질</th><th>이런 제품이 해당돼요</th></tr></thead>
<tbody>
<tr><td>락스 + 산성 세제</td><td>염소 가스</td><td>식초, 구연산, 산성 변기 세정제, 물때·녹 제거제</td></tr>
<tr><td>락스 + 암모니아</td><td>클로라민 가스</td><td>일부 유리 세정제, 소변(변기 속), 일부 다목적 세정제</td></tr>
<tr><td>락스 + 알코올</td><td>클로로포름 등 유해 물질</td><td>소독용 에탄올, 알코올 성분 세정제</td></tr>
<tr><td>락스 + 과산화수소·산소계 표백제</td><td>격렬한 반응, 표백 효과 상실</td><td>과탄산소다, 산소계 표백제</td></tr>
<tr><td>서로 다른 변기·배수구 세정제</td><td>성분에 따라 유독 가스나 열</td><td>산성 변기 세정제 + 락스 계열 세정제</td></tr>
</tbody>
<caption>질병관리청, 한국소비자원 등의 생활화학제품 안전 정보를 바탕으로 정리</caption></table></div>
<p>'섞는 것'에는 한 통에 붓는 것만이 아니라 <strong>연달아 쓰는 것</strong>도 포함돼요. 변기에 산성 세정제를 뿌리고 헹구지 않은 채 락스를 부으면 변기 안에서 섞여요. 한 가지 세제를 쓴 뒤에는 물로 충분히 헹구고 다음 세제를 써요.</p>

<h2>락스 희석 비율</h2>
<div class="tbl"><table>
<thead><tr><th>용도</th><th>목표 농도</th><th>만드는 법 (가정용 5% 락스 기준)</th></tr></thead>
<tbody>
<tr><td>일반 표면 소독 (손잡이, 식탁, 변기 등)</td><td class="num">약 0.1% (1,000ppm)</td><td>물 1L에 락스 20mL</td></tr>
<tr><td>구토물·혈액 등 오염이 심한 곳</td><td class="num">약 0.5% (5,000ppm)</td><td>물 1L에 락스 100mL</td></tr>
<tr><td>식기·도마 소독</td><td class="num">약 0.02% 안팎</td><td>제품의 주방용 희석 안내를 따르고 충분히 헹구기</td></tr>
</tbody>
<caption>질병관리청 감염병 환경 소독 안내 등을 바탕으로 정리. 제품마다 농도가 다르니 라벨의 사용 방법을 우선하세요.</caption></table></div>
<p>생수병 뚜껑 하나가 대략 5~7mL 정도예요. 계량컵을 따로 두면 정확하게 맞출 수 있어요. 진하게 쓴다고 효과가 더 좋아지는 게 아니라 자극과 부식만 커져요.</p>
<h3>안전하게 쓰는 법</h3>
<ul>
<li><strong>찬물에 희석해요.</strong> 뜨거운 물에서는 락스가 빨리 분해되고 가스가 더 나와요.</li>
<li><strong>희석액은 만든 날 쓰고</strong> 남으면 버려요. 시간이 지나면 효과가 떨어져요.</li>
<li><strong>뿌리지 말고 천에 적셔 닦아요.</strong> 분무하면 미세한 방울을 들이마시게 돼요.</li>
<li>소독 후 <strong>5~10분 정도 두었다가</strong> 물이나 젖은 천으로 닦아내요.</li>
<li>고무장갑을 끼고, 창문을 열거나 환풍기를 켠 채 작업해요.</li>
<li>희석액은 음료수 병에 담지 않아요. 누군가 마실 수 있어요.</li>
</ul>

<h2>순한 청소 재료의 쓰임</h2>
<div class="tbl"><table>
<thead><tr><th>재료</th><th>성질</th><th>잘 맞는 곳</th><th>주의</th></tr></thead>
<tbody>
<tr><td>베이킹소다</td><td>약한 알칼리, 연마 효과</td><td>기름때, 냄새 제거, 냄비 탄 자국</td><td>세정력은 약한 편</td></tr>
<tr><td>구연산·식초</td><td>산성</td><td>물때, 석회, 전기포트 속 하얀 얼룩</td><td>락스와 절대 섞지 않기. 대리석에 쓰지 않기</td></tr>
<tr><td>과탄산소다 (산소계 표백제)</td><td>물에 녹으면 산소를 내는 알칼리</td><td>흰 옷 표백, 수건 냄새, 행주 삶기 대용</td><td>따뜻한 물에서 효과. 밀폐 용기에 뜨거운 물과 넣지 않기</td></tr>
<tr><td>소독용 에탄올</td><td>빠르게 증발하는 소독제</td><td>손잡이, 전자기기 표면</td><td>불 근처에서 쓰지 않기. 락스와 섞지 않기</td></tr>
</tbody></table></div>
<div class="box note"><span class="h">베이킹소다와 식초를 함께 쓰면?</span>
<p>거품이 부글부글 나서 강력해 보이지만, 실제로는 알칼리와 산이 서로 중화되면서 이산화탄소와 물, 약한 염이 생겨요. 위험하지는 않지만 각자의 세정 효과는 오히려 줄어요. 따로따로 쓰는 게 나아요.</p></div>

<h2>사고가 났을 때</h2>
<div class="box warn"><span class="h">세제 가스를 들이마셨을 때</span>
<ol>
<li><strong>즉시 그 공간을 벗어나</strong> 신선한 공기가 있는 곳으로 가요.</li>
<li>가능하면 창문을 열고 환풍기를 켜되, 오래 머물지 않아요.</li>
<li>기침, 숨참, 가슴 답답함, 쌕쌕거림이 계속되면 <strong>119</strong>에 연락해요. 증상이 몇 시간 뒤에 심해지기도 해요.</li>
<li>어떤 제품을 섞었는지 병원에 알릴 수 있도록 제품 용기를 챙겨요.</li>
</ol></div>
<div class="box warn"><span class="h">눈이나 피부에 묻었을 때, 삼켰을 때</span>
<ul>
<li><strong>눈:</strong> 흐르는 미지근한 물로 <strong>15분 이상</strong> 씻어요. 렌즈를 꼈다면 빼고 씻어요. 그 뒤 안과 진료를 받아요.</li>
<li><strong>피부:</strong> 묻은 옷을 벗고 흐르는 물로 충분히 씻어요.</li>
<li><strong>삼켰을 때:</strong> <strong>억지로 토하게 하지 않아요.</strong> 식도가 다시 손상될 수 있어요. 입을 헹구고 제품을 챙겨 바로 119나 응급실로 가요.</li>
</ul></div>

<h2>아이가 있는 집의 세제 보관</h2>
<ul>
<li>세제는 <strong>아이 손이 닿지 않는 높은 곳</strong>이나 잠금장치가 있는 수납장에 둬요.</li>
<li><strong>캡슐형 세탁 세제</strong>는 사탕이나 젤리처럼 보여서 어린아이가 입에 넣는 사고가 많아요. 반드시 뚜껑을 닫아 보관해요.</li>
<li>세제를 <strong>다른 용기에 옮겨 담지 않아요.</strong> 음료수 병에 담긴 세제를 마시는 사고가 반복돼요.</li>
<li>사용 직후 바로 뚜껑을 닫고 제자리에 둬요.</li>
</ul>

<h2>제품 고를 때 확인할 것</h2>
<p>세정제, 표백제, 방향제, 살균제 같은 생활화학제품 중 일부는 <strong>안전확인대상 생활화학제품</strong>으로 지정돼 있어서 신고번호나 승인번호가 표시돼 있어요. 환경부 '초록누리' 사이트에서 제품 정보를 조회할 수 있어요. 또 가습기에 살균제나 세정제를 넣는 것처럼 <strong>제품 용도 외의 방법</strong>으로 쓰지 않아요. 흡입했을 때의 안전성은 따로 확인되지 않은 경우가 많아요.</p>

<div class="box"><span class="h">청소 전 점검표</span>
<ol>
<li>오늘 쓸 세제 라벨에서 성분과 '혼합 금지' 문구 확인하기</li>
<li>세제는 한 번에 한 가지, 바꿀 때는 물로 충분히 헹구기</li>
<li>창문 열고 환풍기 켜기</li>
<li>고무장갑 끼기</li>
<li>락스는 찬물에 정량 희석하고 천에 적셔 쓰기</li>
<li>청소가 끝나면 세제를 제자리에 잠가 두기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>락스 냄새가 강할수록 소독이 잘 된 건가요?</dt>
<dd>아니에요. 강한 냄새는 너무 진하게 썼거나 환기가 부족하다는 신호예요. 적정 농도로 희석해 충분한 시간 두는 게 효과의 핵심이에요.</dd>
<dt>락스로 과일이나 채소를 씻어도 되나요?</dt>
<dd>식품용으로 허가된 제품과 농도가 아니라면 쓰지 않아요. 과일과 채소는 흐르는 물로 충분히 씻는 것이 기본이에요.</dd>
<dt>천연 세제는 섞어도 안전한가요?</dt>
<dd>식초와 과탄산소다처럼 '천연'으로 불리는 재료도 산과 알칼리, 산화제예요. 특히 식초·구연산은 락스와 섞이면 위험해요. 천연이라는 말이 안전을 보장하지는 않아요.</dd>
</dl>

<template data-id="gerd" data-cat="dis" data-date="2026.09.29"
  data-title="역류성 식도염 완전 정리: 가슴쓰림의 원인, 약 먹는 법, 밤에 덜 올라오게 자는 법"
  data-thumb="3시간|취침 전 공복"
  data-summary="가슴이 타는 듯하고 신물이 올라오는 역류성 식도염은 흔하지만 재발도 잦아요. 식도를 지키는 문이 약해지는 이유, 만성 기침처럼 헷갈리는 증상, 내시경이 필요한 경고 신호, 위산억제제 복용법과 장기 복용의 주의점, 생활습관 교정을 정리했어요."
  data-tags="역류성식도염,위산,가슴쓰림,위산억제제,소화기">
<p class="lead">위와 식도 사이에는 음식은 내려보내고 위산은 올라오지 못하게 막는 '문'이 있어요. 이 문이 헐거워지면 강한 산이 식도로 거슬러 올라와 식도를 태우듯 자극해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>대표 증상은 <strong>가슴쓰림과 신물 역류</strong>이지만, 만성 기침이나 쉰 목소리로만 나타나기도 해요.</li>
<li>삼키기 어려움, 체중 감소, 검은 변, 빈혈이 있으면 <strong>바로 내시경</strong>을 받아요.</li>
<li>양성자펌프억제제(PPI)는 보통 <strong>아침 식사 30~60분 전</strong>에 먹어요.</li>
<li>가장 효과가 확인된 생활습관은 <strong>체중 감량, 잠자기 3시간 전 식사 끝내기, 침대 머리 올리기</strong>예요.</li>
</ul></div>

<h2>왜 거꾸로 올라올까</h2>
<p>식도 아래 끝에는 <strong>하부식도괄약근</strong>이라는 근육 고리가 있어요. 평소에는 꽉 닫혀 있다가 음식을 삼킬 때만 열려요. 이 괄약근이 약해지거나 자주 풀리면, 또는 위 속 압력이 높아지면 위산이 식도로 역류해요.</p>
<h3>역류를 부르는 것들</h3>
<ul>
<li><strong>복부 비만:</strong> 뱃살이 위를 눌러 압력을 높여요. 가장 중요한 위험 요인이에요.</li>
<li><strong>과식과 늦은 식사:</strong> 위가 가득 찬 상태로 누우면 역류가 쉬워요.</li>
<li><strong>술과 담배:</strong> 괄약근을 느슨하게 해요.</li>
<li><strong>기름진 음식:</strong> 위가 비워지는 속도를 늦춰요.</li>
<li><strong>커피, 초콜릿, 박하, 탄산음료, 매운 음식:</strong> 사람에 따라 증상을 악화시켜요. 모두에게 해당하지는 않아요.</li>
<li><strong>열공 탈장:</strong> 위의 일부가 횡격막 위로 올라간 상태로, 역류를 쉽게 만들어요.</li>
<li><strong>임신</strong>, 꽉 끼는 옷, 일부 약물(일부 혈압약, 진정제 등)</li>
</ul>

<h2>증상: 속쓰림만이 아니다</h2>
<div class="tbl"><table>
<thead><tr><th>전형적인 증상</th><th>헷갈리기 쉬운 증상</th></tr></thead>
<tbody>
<tr><td>명치에서 가슴으로 올라오는 타는 듯한 느낌 (가슴쓰림)</td><td>2~3주 넘게 이어지는 마른기침</td></tr>
<tr><td>시거나 쓴 물이 목이나 입으로 올라옴 (역류)</td><td>쉰 목소리, 목에 뭔가 걸린 느낌</td></tr>
<tr><td>식후나 누웠을 때 심해짐</td><td>가슴 통증 (심장 질환과 구별 필요)</td></tr>
<tr><td></td><td>잦은 목 가다듬기, 치아 부식, 천식 악화</td></tr>
</tbody></table></div>
<div class="box warn"><span class="h">가슴 통증은 심장부터 확인하세요</span>
<p>역류성 식도염의 가슴 통증은 협심증이나 심근경색과 비슷할 수 있어요. 특히 <strong>운동할 때 생기는 가슴 압박감, 식은땀, 숨참, 팔이나 턱으로 퍼지는 통증</strong>이 있다면 소화제를 먹고 기다리지 말고 바로 119에 연락해요.</p></div>

<h2>내시경이 필요한 경고 신호</h2>
<p>전형적인 증상만 있고 경고 신호가 없다면 약을 먼저 써보는 경우가 많아요. 하지만 아래 중 하나라도 있으면 <strong>바로 내시경 검사</strong>를 받아야 해요. 식도암, 위암, 궤양 같은 다른 병일 수 있어요.</p>
<ul>
<li>음식을 삼키기 어렵거나 삼킬 때 아파요.</li>
<li>의도하지 않았는데 체중이 줄었어요.</li>
<li>피를 토하거나 검고 끈적한 변을 봐요.</li>
<li>빈혈이 있어요.</li>
<li>구토가 반복돼요.</li>
<li>나이가 들어(대략 40대 이후) 증상이 새로 생겼어요.</li>
<li>약을 먹어도 좋아지지 않아요.</li>
</ul>
<p>국내는 위암이 흔해서 40세 이상은 국가암검진으로 2년마다 위내시경을 받을 수 있어요. 역류 증상이 있다면 검진 때 함께 확인해요.</p>

<h2>약: 종류와 먹는 법</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>대표 성분</th><th>특징</th></tr></thead>
<tbody>
<tr><td>양성자펌프억제제 (PPI)</td><td>오메프라졸, 에소메프라졸, 란소프라졸, 판토프라졸, 라베프라졸</td><td>위산 분비를 강하게 억제. 가장 기본적인 치료제</td></tr>
<tr><td>칼륨경쟁적 위산분비억제제 (P-CAB)</td><td>테고프라잔, 펙수프라잔 등</td><td>효과가 빨리 나타나고 식사 영향을 덜 받아요. 국내에서 개발된 약들이 있어요</td></tr>
<tr><td>H2 수용체 차단제</td><td>파모티딘 등</td><td>PPI보다 약하지만 빠르게 작용. 가벼운 증상이나 보조로</td></tr>
<tr><td>제산제·알긴산 제제</td><td>수산화마그네슘, 알긴산나트륨 등</td><td>이미 나온 산을 중화하거나 막을 만들어 증상을 빨리 가라앉힘</td></tr>
</tbody></table></div>
<h3>PPI 먹는 법</h3>
<ul>
<li>PPI는 위산을 만드는 펌프가 활발히 일할 때 가장 잘 작용해요. 그래서 <strong>아침 식사 30~60분 전</strong>에 먹는 게 일반적이에요. 하루 두 번이라면 저녁 식사 전에도 먹어요.</li>
<li>식후에 먹거나 식사를 거르면 효과가 떨어질 수 있어요.</li>
<li>보통 4~8주 치료하고 증상에 따라 줄이거나 필요할 때만 먹는 방식으로 바꿔요.</li>
</ul>
<h3>오래 먹을 때 알아둘 점</h3>
<p>PPI를 몇 년씩 먹는 사람에게서 비타민 B12와 마그네슘 부족, 골절, 일부 장 감염이 조금 더 많다는 연구들이 있어요. 인과관계가 분명하지 않은 부분도 있지만, 그래서 <strong>필요한 만큼, 가장 낮은 용량으로</strong> 쓰는 게 원칙이에요. 다만 필요한 사람이 이 걱정 때문에 약을 피할 필요는 없어요.</p>
<p>PPI를 오래 먹다가 갑자기 끊으면 위산이 일시적으로 더 많이 나와 증상이 심해질 수 있어요(반동). 끊을 때는 의사와 상의해 용량을 서서히 줄여요.</p>

<h2>생활습관: 효과가 확인된 것부터</h2>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>효과 근거</th><th>실천 요령</th></tr></thead>
<tbody>
<tr><td>체중 감량</td><td>강함</td><td>과체중이라면 체중의 5~10% 감량만으로도 증상이 줄어요.</td></tr>
<tr><td>잠자기 전 식사 피하기</td><td>있음</td><td>저녁은 잠자기 3시간 전에 끝내요. 야식을 줄여요.</td></tr>
<tr><td>침대 머리 올리기</td><td>있음 (밤에 증상이 있는 경우)</td><td>베개를 쌓는 대신 침대 머리 쪽 다리를 15~20cm 높이거나 쐐기형 받침을 써요.</td></tr>
<tr><td>왼쪽으로 누워 자기</td><td>있음</td><td>위의 모양 때문에 왼쪽으로 누우면 역류가 덜하다는 연구가 있어요.</td></tr>
<tr><td>금연·절주</td><td>있음</td><td>괄약근 기능과 식도 회복에 도움이 돼요.</td></tr>
<tr><td>특정 음식 피하기</td><td>개인차 큼</td><td>모든 음식을 끊기보다 나에게 증상을 일으키는 음식을 기록해서 찾아요.</td></tr>
</tbody></table></div>
<div class="box note"><span class="h">베개만 높이면 안 되는 이유</span>
<p>베개를 여러 개 쌓으면 목만 꺾이고 배가 접히면서 오히려 복압이 올라갈 수 있어요. 상체 전체가 비스듬히 올라가도록 침대 자체를 기울이는 게 효과적이에요.</p></div>

<h2>나만의 트리거 찾기</h2>
<div class="box"><span class="h">2주 증상 일기</span>
<ol>
<li>먹은 음식과 음료, 먹은 시간을 적어요.</li>
<li>증상이 생긴 시간과 정도(0~10점)를 적어요.</li>
<li>잠든 시간과 밤중 증상을 적어요.</li>
<li>2주 뒤 증상과 자주 겹치는 음식이나 상황을 찾아요.</li>
<li>의심되는 음식을 1~2주 빼보고 변화를 확인해요.</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>우유를 마시면 속쓰림이 가라앉나요?</dt>
<dd>잠깐 편해질 수 있지만, 우유의 지방과 단백질이 오히려 위산 분비를 자극해 나중에 증상이 심해질 수 있어요. 증상 완화용으로 권장되지 않아요.</dd>
<dt>역류성 식도염이 암이 되나요?</dt>
<dd>오랜 역류로 식도 점막이 변하는 '바렛식도'가 생기면 식도암 위험이 조금 높아져요. 다만 국내에서는 바렛식도가 드문 편이에요. 증상이 오래 지속되면 내시경으로 확인하는 게 좋아요.</dd>
<dt>약을 먹으면 좋아졌다가 끊으면 다시 생겨요.</dt>
<dd>역류성 식도염은 재발이 흔한 만성 질환이에요. 생활습관 교정을 함께 해야 재발이 줄어요. 자주 재발한다면 필요할 때만 먹는 방식이나 유지 치료를 의사와 정할 수 있어요.</dd>
</dl>

<h2>참고 자료</h2>
<ul class="refs">
<li>대한소화기기능성질환·운동학회, 위식도역류질환 진료지침</li>

</ul>

<template data-id="vitamin-a" data-cat="nut" data-date="2026.09.29"
  data-title="비타민 A 총정리: 눈과 피부의 비타민, 부족보다 과잉을 조심해야 하는 이유"
  data-thumb="RAE|레티놀 당량"
  data-summary="비타민 A는 어두운 곳에서 보는 눈과 피부, 면역에 꼭 필요해요. 하지만 한국인은 부족보다 보충제로 인한 과잉을 조심해야 하는 영양소예요. 레티놀과 베타카로틴의 차이, 섭취기준, 임신 중 주의점, 흡연자와 베타카로틴 보충제 연구를 정리했어요."
  data-tags="비타민A,베타카로틴,레티놀,임신,영양제">
<p class="lead">당근을 먹으면 눈이 좋아진다는 말은 절반만 맞아요. 비타민 A가 부족한 사람에게는 맞지만, 이미 충분한 사람에게는 더 먹어도 시력이 좋아지지 않아요. 오히려 보충제로 너무 많이 먹는 게 문제가 될 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>비타민 A는 동물성 식품의 <strong>레티놀</strong>과 식물성 식품의 <strong>베타카로틴</strong>으로 얻어요.</li>
<li>성인 권장섭취량은 남성 <strong>700~800μg RAE</strong>, 여성 <strong>600~650μg RAE</strong>예요.</li>
<li>레티놀은 과하면 독성이 있어요. 상한섭취량은 <strong>3,000μg</strong>이고, <strong>임신 중 고용량은 기형 위험</strong>이 있어요.</li>
<li>흡연자가 <strong>베타카로틴 고용량 보충제</strong>를 먹으면 폐암 위험이 오히려 높아졌다는 연구가 있어요.</li>
</ul></div>

<h2>비타민 A가 하는 일</h2>
<ul>
<li><strong>어두운 곳에서 보기:</strong> 망막의 빛 감지 물질(로돕신)을 만드는 데 필요해요. 부족하면 어두운 곳에서 잘 보이지 않는 <strong>야맹증</strong>이 먼저 나타나요.</li>
<li><strong>피부와 점막:</strong> 눈, 호흡기, 장의 점막 세포가 제대로 자라고 유지되게 해요. 이 점막은 세균이 들어오는 것을 막는 첫 방어선이에요.</li>
<li><strong>면역:</strong> 면역세포가 제대로 기능하는 데 필요해요.</li>
<li><strong>성장과 생식:</strong> 태아 발달, 세포 분화에 관여해요.</li>
</ul>
<p>세계보건기구는 비타민 A 결핍을 개발도상국 어린이의 <strong>예방 가능한 실명의 주요 원인</strong>으로 꼽아요. 한국처럼 식품이 다양한 나라에서는 결핍이 드물어요.</p>

<h2>레티놀과 베타카로틴</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>레티놀 (이미 만들어진 비타민 A)</th><th>베타카로틴 (비타민 A의 원료)</th></tr></thead>
<tbody>
<tr><td>들어 있는 곳</td><td>간, 장어, 달걀노른자, 우유, 버터, 치즈</td><td>당근, 고구마, 단호박, 시금치, 케일, 망고</td></tr>
<tr><td>몸에서</td><td>바로 비타민 A로 쓰여요</td><td>필요한 만큼만 비타민 A로 바뀌어요</td></tr>
<tr><td>과잉 위험</td><td>있음 (간 손상, 기형 등)</td><td>음식으로는 거의 없음 (피부가 노래질 뿐)</td></tr>
</tbody></table></div>
<p>베타카로틴은 몸이 필요한 만큼만 비타민 A로 바꾸기 때문에, 음식으로 많이 먹어도 독성이 생기지 않아요. 귤이나 당근을 많이 먹어 손바닥이 노래지는 <strong>카로틴혈증</strong>은 해가 없고, 먹는 양을 줄이면 사라져요.</p>
<h3>RAE라는 단위</h3>
<p>레티놀과 베타카로틴은 효율이 달라서 <strong>레티놀활성당량(RAE)</strong>으로 환산해요. 음식 속 베타카로틴 12μg이 레티놀 1μg RAE에 해당해요. 베타카로틴은 지용성이라 <strong>기름과 함께 먹으면</strong> 흡수가 훨씬 좋아져요. 당근을 기름에 살짝 볶거나 나물을 들기름에 무치는 조리법이 흡수에 유리해요.</p>

<h2>하루에 얼마나 필요할까</h2>
<div class="tbl"><table>
<thead><tr><th>나이</th><th>남성</th><th>여성</th></tr></thead>
<tbody>
<tr><td>19~49세</td><td class="num">800μg RAE</td><td class="num">650μg RAE</td></tr>
<tr><td>50~64세</td><td class="num">750μg RAE</td><td class="num">600μg RAE</td></tr>
<tr><td>65세 이상</td><td class="num">700μg RAE</td><td class="num">600μg RAE</td></tr>
<tr><td>상한섭취량 (성인)</td><td colspan="2" class="num">3,000μg (레티놀 기준)</td></tr>
</tbody>
<caption>보건복지부·한국영양학회, 2020 한국인 영양소 섭취기준. 상한섭취량은 레티놀(동물성 식품과 보충제)에만 적용돼요.</caption></table></div>
<p>당근 반 개, 단호박 한 조각, 시금치나물 한 접시만으로도 하루 필요량의 상당 부분을 채울 수 있어요. 소간은 적은 양에도 레티놀이 권장량의 몇 배가 들어 있을 만큼 많아요.</p>

<h2>과잉: 보충제를 조심해야 하는 이유</h2>
<h3>급성·만성 독성</h3>
<p>레티놀을 한꺼번에 아주 많이 먹거나 오랫동안 과하게 먹으면 두통, 어지러움, 메스꺼움, 피부 벗겨짐, 탈모가 생기고, 심하면 <strong>간 손상</strong>과 두개내압 상승이 생길 수 있어요. 오랜 과잉 섭취는 <strong>골밀도 감소와 골절 위험 증가</strong>와도 관련이 있다는 연구가 있어요.</p>
<div class="box warn"><span class="h">임신 중에는 레티놀 고용량을 피하세요</span>
<ul>
<li>임신 초기에 레티놀을 고용량으로 먹으면 <strong>태아 기형</strong> 위험이 높아져요. 임신부용이 아닌 일반 고용량 비타민 A 보충제는 피해요.</li>
<li>여드름 치료에 먹는 <strong>이소트레티노인</strong>(비타민 A 유도체)은 강한 기형 유발 약물이에요. 복용 중과 복용 후 일정 기간은 반드시 피임해야 해요.</li>
<li>레티놀이 든 <strong>바르는 화장품</strong>은 흡수량이 적지만, 임신 중에는 사용을 피하도록 권하는 경우가 많아요. 담당 의사와 상의해요.</li>
<li>간 요리를 자주 많이 먹는 것도 임신 중에는 피하는 게 좋아요.</li>
<li>베타카로틴 형태의 비타민 A는 기형 위험과 관련이 없어요.</li>
</ul></div>

<h2>흡연자와 베타카로틴 보충제</h2>
<p>1990년대, 베타카로틴이 항산화 작용으로 폐암을 막아줄 것이라는 기대 속에 대규모 임상시험이 진행됐어요. 결과는 정반대였어요.</p>
<ul>
<li>핀란드의 <strong>ATBC 연구</strong>에서 흡연 남성에게 베타카로틴 보충제를 줬더니 폐암 발생이 오히려 늘었어요.</li>
<li>미국의 <strong>CARET 연구</strong>에서도 흡연자와 석면 노출자에게 베타카로틴과 레티놀을 줬더니 폐암이 늘어 연구가 조기 중단됐어요.</li>
</ul>
<p>그래서 <strong>흡연자나 과거 흡연자는 베타카로틴 고용량 보충제를 먹지 않도록</strong> 권해요. 음식으로 먹는 채소와 과일의 베타카로틴은 이런 위험과 관련이 없어요. 같은 영양소라도 음식으로 먹는 것과 고용량 알약으로 먹는 것은 다르다는 걸 보여준 대표적인 사례예요.</p>

<h2>결핍이 생길 수 있는 경우</h2>
<ul>
<li>지방 흡수에 문제가 있는 질환 (만성 췌장염, 담즙 분비 장애, 크론병, 셀리악병)</li>
<li>비만 수술 후</li>
<li>채소와 동물성 식품을 모두 극단적으로 적게 먹는 식습관</li>
<li>만성 알코올 섭취와 간 질환</li>
</ul>
<p>야맹증, 눈이 심하게 건조해짐, 피부가 거칠어지고 오돌토돌해짐이 나타날 수 있어요. 이런 경우에는 의사가 검사 후 필요한 만큼 보충해요.</p>

<div class="box"><span class="h">비타민 A 현명하게 챙기기</span>
<ol>
<li>주황색·녹색 채소를 하루 한두 번 기름과 함께 조리해 먹기</li>
<li>종합비타민과 눈 영양제 등 먹고 있는 제품의 비타민 A 함량을 모두 더해보기</li>
<li>레티놀 형태로 하루 3,000μg을 넘지 않게 하기</li>
<li>흡연자라면 베타카로틴 고용량 보충제 피하기</li>
<li>임신을 계획 중이면 영양제를 임신부용으로 바꾸기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>눈 영양제에 비타민 A가 들어 있는데 괜찮나요?</dt>
<dd>제품마다 함량과 형태가 달라요. 라벨에서 레티놀(또는 레티닐 팔미테이트 등)인지 베타카로틴인지, 함량이 얼마인지 확인해요. 여러 제품을 함께 먹으면 합산량이 많아질 수 있어요.</dd>
<dt>비타민 A가 여드름에 좋다던데요?</dt>
<dd>여드름 치료에 쓰는 비타민 A 유도체(바르는 레티노이드, 먹는 이소트레티노인)는 의약품이고 용량과 부작용 관리가 필요해요. 비타민 A 보충제를 많이 먹는다고 같은 효과가 나지는 않고 독성 위험만 커져요.</dd>
<dt>아이에게 비타민 A 보충제가 필요한가요?</dt>
<dd>국내 아이들은 대부분 음식으로 충분해요. 일부 개발도상국에서는 결핍 예방을 위해 어린이에게 고용량 비타민 A를 주기도 하지만, 우리나라에서는 의사가 필요하다고 판단한 경우가 아니면 따로 먹일 필요가 없어요.</dd>
</dl>
