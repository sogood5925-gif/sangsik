<template data-id="pneumonia" data-cat="dis" data-date="2026.09.29"
  data-title="폐렴 완전 정리: 노인은 열 없이 올 수 있다, 원인·치료·예방까지"
  data-thumb="3위|국내 사망원인"
  data-summary="폐렴은 국내 사망원인 3위의 흔하고 위험한 병이에요. 감기와 다른 증상, 노인에게 나타나는 '조용한 폐렴', 세균·바이러스·흡인성 폐렴의 차이, 입원이 필요한 경우, 항생제를 끝까지 먹어야 하는 이유, 백신과 구강 관리로 예방하는 법을 정리했어요."
  data-tags="폐렴,폐렴구균,흡인성폐렴,노인건강,호흡기">
<p class="lead">폐렴은 젊고 건강한 사람에게는 며칠 앓고 지나가는 병일 수 있지만, 노인과 만성질환자에게는 생명을 위협하는 병이에요. 통계청 사망원인 통계에서 폐렴은 암, 심장질환에 이어 3위를 차지해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>폐렴은 폐의 공기주머니(폐포)에 생긴 감염으로, <strong>기침, 가래, 열, 숨참</strong>이 대표 증상이에요.</li>
<li>노인은 열과 기침 없이 <strong>기운 없음, 식욕 저하, 헛소리</strong>로만 나타나기도 해요.</li>
<li>항생제는 좋아져도 <strong>처방 기간을 끝까지</strong> 먹어요.</li>
<li>예방의 핵심은 <strong>폐렴구균·독감 백신, 금연, 구강 관리</strong>예요.</li>
</ul></div>

<h2>폐렴은 어떤 병일까</h2>
<p>숨을 들이마시면 공기는 기관지를 지나 포도송이처럼 생긴 수억 개의 작은 공기주머니(폐포)에 도착해요. 여기서 산소가 혈액으로 들어가요. 폐렴은 이 폐포에 세균이나 바이러스가 들어와 염증이 생기고, 공기 대신 고름과 염증 물질이 차는 병이에요. 그래서 산소를 제대로 받아들이지 못해 숨이 차요.</p>

<h2>원인에 따른 종류</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>주요 원인</th><th>특징</th></tr></thead>
<tbody>
<tr><td>세균성 폐렴</td><td>폐렴구균 (가장 흔함), 헤모필루스 등</td><td>갑자기 고열, 누런 가래, 한쪽 폐에 뚜렷한 염증</td></tr>
<tr><td>바이러스성 폐렴</td><td>인플루엔자, RSV, 코로나19 등</td><td>독감 유행 시기에 많음. 세균성 폐렴이 뒤따르기도 함</td></tr>
<tr><td>비정형 폐렴</td><td>마이코플라스마, 클라미디아 등</td><td>어린이와 젊은 층에 흔함. 증상이 비교적 가벼워 '걸어다니는 폐렴'으로 불림. 마른기침이 오래감</td></tr>
<tr><td>흡인성 폐렴</td><td>입 안 세균이 음식물·침과 함께 기도로 넘어감</td><td>삼킴 기능이 떨어진 노인, 뇌졸중 후, 의식 저하 환자에게 흔함</td></tr>
</tbody></table></div>

<h2>증상: 감기와 어떻게 다를까</h2>
<ul>
<li><strong>기침과 가래:</strong> 누렇거나 초록빛, 때로 피가 섞인 가래</li>
<li><strong>열과 오한:</strong> 몸이 떨릴 정도의 오한</li>
<li><strong>숨참:</strong> 조금만 움직여도 숨이 차요. 쉴 때도 숨이 빠르다면 더 심한 상태예요.</li>
<li><strong>가슴 통증:</strong> 숨을 깊게 쉬거나 기침할 때 찌르는 듯한 통증</li>
<li><strong>전신 증상:</strong> 심한 피로, 근육통, 식욕 저하</li>
</ul>
<p>감기는 코와 목이 주로 불편하고 며칠 지나면 나아지는 반면, 폐렴은 <strong>숨참과 고열이 뚜렷하고 점점 심해지는</strong> 경우가 많아요. 감기나 독감이 좋아지는 듯하다가 다시 열이 오르고 기침이 심해진다면 폐렴을 의심해요.</p>
<div class="box warn"><span class="h">노인의 '조용한 폐렴'</span>
<p>노인은 면역 반응이 약해서 <strong>열이 없거나 미열</strong>이고 기침도 심하지 않을 수 있어요. 대신 이런 변화로만 나타나기도 해요.</p>
<ul>
<li>평소보다 기운이 없고 자꾸 누우려 해요.</li>
<li>식사량이 갑자기 줄었어요.</li>
<li>헛소리를 하거나 사람을 못 알아보는 등 정신이 흐려졌어요.</li>
<li>평소보다 숨이 빠르거나 자주 넘어져요.</li>
</ul>
<p>가족 중 어르신에게 이런 변화가 며칠 사이 생겼다면 폐렴 가능성을 생각하고 진료를 받아요.</p></div>

<h2>진단과 입원 기준</h2>
<p>의사는 청진, 흉부 X선, 혈액검사, 산소포화도로 폐렴을 진단해요. 이후 중증도를 평가해 외래 치료와 입원을 결정해요. 흔히 쓰는 기준 중 하나가 <strong>CURB-65</strong>예요.</p>
<div class="tbl"><table>
<thead><tr><th>항목</th><th>기준</th></tr></thead>
<tbody>
<tr><td>C (의식)</td><td>새로 생긴 혼돈, 의식 변화</td></tr>
<tr><td>U (요소)</td><td>혈중 요소질소 상승 (콩팥 기능 저하, 탈수)</td></tr>
<tr><td>R (호흡수)</td><td>1분에 30회 이상</td></tr>
<tr><td>B (혈압)</td><td>수축기 90 미만 또는 이완기 60 이하</td></tr>
<tr><td>65 (나이)</td><td>65세 이상</td></tr>
</tbody>
<caption>해당 항목이 많을수록 중증이에요. 실제 판단은 산소포화도, 동반 질환 등을 함께 봐요.</caption></table></div>

<h2>치료</h2>
<ul>
<li><strong>세균성 폐렴</strong>은 항생제로 치료해요. 외래 치료라면 보통 5~7일 정도 먹어요.</li>
<li>보통 치료 시작 후 <strong>48~72시간 안에</strong> 열이 내리고 좋아지기 시작해요. 사흘이 지나도 나아지지 않거나 나빠지면 다시 진료를 받아요.</li>
<li>좋아졌다고 항생제를 일찍 멈추면 재발하거나 내성균이 생길 수 있어요. <strong>처방 기간을 끝까지</strong> 먹어요.</li>
<li><strong>바이러스성 폐렴</strong>에는 항생제가 듣지 않아요. 독감이 원인이면 항바이러스제를 써요.</li>
<li>물을 충분히 마시고 푹 쉬어요. 기침을 억지로 완전히 막는 약보다 가래를 잘 뱉어내는 게 중요할 때가 많아요.</li>
</ul>
<h3>회복에는 시간이 걸려요</h3>
<p>열이 내린 뒤에도 피로와 기침은 몇 주 이어질 수 있어요. 특히 노인은 폐렴 후 체력과 근력이 크게 떨어지기 쉬워서, 회복기에 잘 먹고 조금씩 움직이는 게 중요해요.</p>

<h2>응급 신호</h2>
<div class="box warn"><span class="h">바로 119나 응급실로</span>
<ul>
<li>쉬고 있어도 숨이 가쁘고 말하기 힘들어요.</li>
<li>입술이나 손끝이 파래져요.</li>
<li>의식이 흐려지거나 깨우기 어려워요.</li>
<li>가정용 산소포화도 측정기에서 평소보다 크게 낮은 값(대략 92~94% 미만)이 계속 나와요.</li>
<li>혈압이 떨어지고 식은땀이 나요.</li>
</ul></div>

<h2>예방: 백신</h2>
<ul>
<li><strong>폐렴구균 백신:</strong> 65세 이상은 국가예방접종으로 무료로 맞을 수 있어요. 만성 심장·폐·간·콩팥 질환, 당뇨병, 면역저하, 흡연자는 더 일찍 맞기를 권해요.</li>
<li><strong>독감 백신:</strong> 해마다 맞아요. 독감 후 세균성 폐렴이 생기는 경우가 많아서 독감 예방이 폐렴 예방으로 이어져요.</li>
<li><strong>코로나19, RSV 백신:</strong> 고위험군에서 해마다 발표되는 권고를 확인해요.</li>
</ul>

<h2>예방: 흡인성 폐렴을 막는 생활</h2>
<p>노인 폐렴의 상당 부분은 입 안의 세균이 침이나 음식과 함께 기도로 넘어가서 생겨요. 그래서 <strong>입 안을 깨끗하게 하는 것</strong>이 폐렴 예방이 돼요.</p>
<ul>
<li>매일 양치하고, 틀니는 매일 빼서 닦고 밤에는 빼두어요.</li>
<li>식사할 때는 <strong>똑바로 앉아서</strong> 천천히, 작은 양씩 먹어요.</li>
<li>식사 후 <strong>30분 정도는 눕지 않아요.</strong></li>
<li>식사 중 자주 사레가 들리거나 목소리가 젖은 듯 변하면 삼킴 기능 평가를 받아요. 음식의 점도를 조절하면 도움이 돼요.</li>
<li>수면제나 진정제는 삼킴과 기침 반사를 떨어뜨릴 수 있어요. 복용 중인 약을 점검해요.</li>
</ul>

<div class="box"><span class="h">폐렴 예방 체크리스트</span>
<ol>
<li>65세 이상이면 폐렴구균 백신 접종 기록 확인하기</li>
<li>올가을 독감 백신 맞기</li>
<li>금연하기 (흡연은 폐의 방어 기능을 망가뜨려요)</li>
<li>어르신은 식후 양치와 틀니 관리 챙기기</li>
<li>식사 중 사레가 잦으면 진료 받기</li>
<li>감기가 좋아지다 다시 열이 나면 진료 받기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>폐렴은 옮나요?</dt>
<dd>폐렴을 일으킨 세균이나 바이러스는 기침과 재채기로 다른 사람에게 옮을 수 있어요. 다만 옮은 사람이 모두 폐렴에 걸리는 건 아니고, 감기나 가벼운 호흡기 감염으로 지나가는 경우가 많아요. 기침 예절과 손 씻기가 중요해요.</dd>
<dt>폐렴구균 백신을 맞으면 폐렴에 안 걸리나요?</dt>
<dd>폐렴구균이 일으키는 폐렴과 심각한 침습성 감염을 줄여주지만, 다른 원인의 폐렴까지 막지는 못해요. 그래도 가장 흔한 원인균을 막는다는 점에서 효과가 커요.</dd>
<dt>엑스레이가 깨끗해질 때까지 얼마나 걸리나요?</dt>
<dd>증상이 좋아진 뒤에도 흉부 X선의 변화는 몇 주 이상 남을 수 있어요. 특히 노인과 흡연자는 회복 후 일정 기간이 지나 다시 촬영해 다른 병이 없는지 확인하기도 해요.</dd>
</dl>

<h2>참고 자료</h2>
<ul class="refs">
<li>통계청, 사망원인통계</li>
<li>대한감염학회·대한결핵및호흡기학회, 성인 지역사회획득 폐렴 항생제 사용지침</li>
<li>질병관리청, 폐렴구균 예방접종 안내</li>
<li>질병관리청 국가건강정보포털, 폐렴</li>
</ul>
</template>

<template data-id="zinc" data-cat="nut" data-date="2026.09.29"
  data-title="아연 총정리: 면역과 미각의 미네랄, 감기에 먹을까와 과다 복용의 함정"
  data-thumb="Zn|아연"
  data-summary="아연은 면역, 상처 회복, 맛과 냄새를 느끼는 데 필요한 미네랄이에요. 하루 필요량과 굴·고기 같은 공급원, 부족해지기 쉬운 사람, 감기에 아연 사탕이 효과가 있는지, 오래 많이 먹으면 생기는 구리 결핍, 코에 뿌리는 아연의 위험까지 정리했어요."
  data-tags="아연,면역,미각,감기,영양제">
<p class="lead">음식 맛이 예전 같지 않거나 상처가 잘 낫지 않는다면 아연이 부족할 수 있어요. 하지만 아연은 적당량을 넘기면 오히려 다른 미네랄을 빼앗는, 균형이 중요한 영양소예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인 권장섭취량은 남성 <strong>10mg</strong>, 여성 <strong>8mg</strong>, 상한섭취량은 <strong>35mg</strong>이에요.</li>
<li><strong>굴</strong>이 가장 많고, 소고기·돼지고기·게·콩·견과류에도 들어 있어요.</li>
<li>아연 사탕이 감기 기간을 줄인다는 연구와 그렇지 않다는 연구가 엇갈려요.</li>
<li>하루 40~50mg 넘게 오래 먹으면 <strong>구리 결핍</strong>으로 빈혈과 신경 손상이 생길 수 있어요.</li>
</ul></div>

<h2>아연이 하는 일</h2>
<ul>
<li><strong>효소:</strong> 몸속 수백 가지 효소가 아연이 있어야 작동해요.</li>
<li><strong>면역:</strong> 면역세포가 자라고 제 기능을 하는 데 필요해요. 부족하면 감염에 약해져요.</li>
<li><strong>상처 회복:</strong> 세포 분열과 단백질 합성에 필요해 상처가 아무는 데 관여해요.</li>
<li><strong>맛과 냄새:</strong> 미각과 후각 기능 유지에 관여해요.</li>
<li><strong>성장과 생식:</strong> 어린이의 성장, 정자 생성에 필요해요.</li>
</ul>
<p>몸은 아연을 저장해두는 곳이 따로 없어서 <strong>매일 꾸준히 먹어야</strong> 해요.</p>

<h2>하루에 얼마나 필요할까</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th>권장섭취량</th></tr></thead>
<tbody>
<tr><td>남성 19~64세</td><td class="num">10mg</td></tr>
<tr><td>남성 65세 이상</td><td class="num">9mg</td></tr>
<tr><td>여성 19~64세</td><td class="num">8mg</td></tr>
<tr><td>여성 65세 이상</td><td class="num">7mg</td></tr>
<tr><td>임신부 / 수유부</td><td class="num">+2.5mg / +5mg</td></tr>
<tr><td>상한섭취량 (성인)</td><td class="num">35mg</td></tr>
</tbody>
<caption>보건복지부·한국영양학회, 2020 한국인 영양소 섭취기준</caption></table></div>

<h2>어떤 음식에 많을까</h2>
<div class="tbl"><table>
<thead><tr><th>식품</th><th>분량</th><th>아연 (약)</th></tr></thead>
<tbody>
<tr><td>굴 (익힌 것)</td><td>85g</td><td class="num">수십 mg (품종에 따라 크게 다름)</td></tr>
<tr><td>소고기 (구운 것)</td><td>85g</td><td class="num">3.8mg</td></tr>
<tr><td>게</td><td>85g</td><td class="num">3~6mg</td></tr>
<tr><td>돼지고기</td><td>85g</td><td class="num">2.9mg</td></tr>
<tr><td>호박씨</td><td>1온스 (약 28g)</td><td class="num">2.2mg</td></tr>
<tr><td>플레인 요거트</td><td>약 230g</td><td class="num">1.7mg</td></tr>
<tr><td>캐슈너트</td><td>1온스</td><td class="num">1.6mg</td></tr>
<tr><td>병아리콩 (익힌 것)</td><td>½컵</td><td class="num">1.3mg</td></tr>
</tbody>
<caption>미국 국립보건원 식이보충제국(ODS) 자료 기준</caption></table></div>
<p>굴은 몇 개만 먹어도 하루 필요량을 훌쩍 넘길 만큼 아연이 많아요. 고기와 해산물의 아연은 흡수가 잘 되고, 곡류와 콩의 아연은 <strong>피트산</strong> 때문에 흡수율이 낮아요. 콩을 불리거나 발효하면 피트산이 줄어 흡수가 나아져요.</p>

<h2>부족해지기 쉬운 사람</h2>
<ul>
<li><strong>채식하는 사람:</strong> 고기와 해산물을 먹지 않고 피트산이 많은 곡류·콩 위주의 식사를 해요. 필요량이 더 많을 수 있어요.</li>
<li><strong>노인:</strong> 식사량이 줄고 흡수도 떨어져요.</li>
<li><strong>과음하는 사람:</strong> 흡수가 줄고 소변으로 배출이 늘어요.</li>
<li><strong>소화기 질환:</strong> 크론병, 만성 설사, 위장관 수술 후</li>
<li><strong>임신부와 수유부</strong></li>
<li>당뇨병, 만성 콩팥병, 일부 이뇨제를 먹는 경우</li>
</ul>
<h3>이런 증상이 나타날 수 있어요</h3>
<ul>
<li>맛과 냄새를 잘 느끼지 못해요.</li>
<li>상처가 더디게 아물어요.</li>
<li>감기 같은 감염이 잦아요.</li>
<li>머리카락이 빠지고, 입 주변이나 손발에 피부염이 생겨요.</li>
<li>식욕이 떨어지고 설사가 생겨요.</li>
</ul>
<p>혈중 아연 검사는 몸 전체 상태를 정확히 반영하지 못하는 한계가 있어서, 의사는 증상과 식습관을 함께 보고 판단해요.</p>

<h2>감기에 아연, 효과가 있을까</h2>
<p>아연을 입 안에서 녹여 먹는 사탕(로젠지)이 감기 바이러스가 코와 목에서 늘어나는 것을 막는다는 가설이 있어요. 연구 결과는 다음과 같아요.</p>
<ul>
<li>일부 연구와 분석에서는 증상이 시작되고 <strong>24시간 안에</strong> 아연 사탕을 먹기 시작하면 감기 기간이 줄었어요.</li>
<li>하지만 최근 여러 연구를 모은 코크란 리뷰(2024)는 연구마다 방법과 결과가 달라 <strong>효과가 확실하지 않다</strong>고 결론 내렸어요.</li>
<li>메스꺼움, 입 안의 금속 맛 같은 부작용이 흔했어요.</li>
</ul>
<div class="box warn"><span class="h">코에 뿌리는 아연은 쓰지 마세요</span>
<p>미국에서 아연이 든 코 스프레이·젤을 쓴 뒤 <strong>냄새를 영구적으로 맡지 못하게 된</strong> 사례가 보고돼, 미국 식품의약국(FDA)이 2009년 사용 중단을 경고했어요. 감기 예방이나 치료 목적으로 아연을 코에 넣지 않아요.</p></div>

<h2>과다 복용의 함정: 구리 결핍</h2>
<p>아연과 구리는 장에서 같은 통로를 두고 경쟁해요. 아연을 오랫동안 많이 먹으면 구리 흡수가 막혀 <strong>구리 결핍</strong>이 생길 수 있어요.</p>
<ul>
<li>구리 결핍은 <strong>빈혈, 백혈구 감소</strong>, 그리고 걸음이 불안정해지고 손발이 저린 <strong>신경 손상</strong>을 일으킬 수 있어요. 신경 손상은 회복이 더딜 수 있어요.</li>
<li>하루 40~50mg 이상을 몇 달씩 먹으면 위험이 커져요.</li>
<li>아연이 많이 든 <strong>틀니 접착제</strong>를 매우 많이 오래 쓴 사람에게서 구리 결핍이 생긴 사례도 보고됐어요.</li>
<li>단기간에 많이 먹으면 메스꺼움, 구토, 복통, 설사가 생겨요.</li>
</ul>

<h2>약과의 상호작용</h2>
<ul>
<li><strong>퀴놀론계, 테트라사이클린계 항생제:</strong> 아연이 흡수를 방해해요. 항생제를 먼저 먹고 몇 시간 뒤에 아연을 먹어요.</li>
<li><strong>철분제:</strong> 고용량 철분제와 아연은 서로 흡수를 방해할 수 있어요. 시간을 떼어 먹어요.</li>
<li><strong>일부 이뇨제</strong>는 소변으로 아연 배출을 늘려요.</li>
</ul>

<div class="box"><span class="h">아연 챙기는 법</span>
<ol>
<li>일주일에 몇 번 고기, 해산물, 달걀 챙기기</li>
<li>채식이라면 콩을 불리거나 발효 콩 식품 활용하기, 견과류와 씨앗 곁들이기</li>
<li>보충제는 먹고 있는 종합비타민·면역 영양제의 아연 함량을 모두 더해보기</li>
<li>하루 합계 35mg을 넘지 않게 하기</li>
<li>항생제를 먹는 동안에는 복용 시간 간격 두기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>아연을 먹으면 탈모가 좋아지나요?</dt>
<dd>아연 결핍으로 생긴 탈모라면 보충 후 좋아질 수 있어요. 하지만 흔한 남성형·여성형 탈모에 아연 보충제가 효과가 있다는 근거는 부족해요.</dd>
<dt>여드름에 아연이 좋다던데요?</dt>
<dd>일부 연구에서 먹는 아연이 여드름을 약간 줄였다는 보고가 있지만, 표준 치료보다 효과가 약하고 위장 부작용이 흔해요. 피부과 진료로 효과가 입증된 치료를 먼저 받는 게 좋아요.</dd>
<dt>코로나19 예방에 아연을 먹어야 하나요?</dt>
<dd>아연 보충이 코로나19를 예방하거나 치료한다는 근거는 확인되지 않았어요. 균형 잡힌 식사로 결핍이 없도록 하는 것이 기본이에요.</dd>
</dl>

<h2>참고 자료</h2>
<ul class="refs">

  data-title="간헐적 단식, 연구는 뭐라고 할까: 16:8의 효과와 한계, 하면 안 되는 사람"
  data-thumb="16:8|시간 제한 식사"
  data-summary="간헐적 단식은 '언제 먹느냐'를 바꾸는 식사법이에요. 16:8, 5:2 같은 방식의 차이, 일반적인 칼로리 제한과 비교한 임상시험 결과, 근육 손실과 폭식 같은 한계, 당뇨약을 먹거나 임신 중인 사람처럼 피해야 할 경우를 정리했어요."
  data-tags="간헐적단식,다이어트,16대8,체중감량,식사습관">
<p class="lead">간헐적 단식은 무엇을 먹을지보다 언제 먹을지를 정하는 방식이에요. 단순해서 시작하기 쉽지만, 기대만큼 특별한 효과가 있는지는 연구를 차분히 볼 필요가 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>대표적인 방식은 하루 8시간만 먹는 <strong>16:8</strong>, 일주일에 이틀만 적게 먹는 <strong>5:2</strong>예요.</li>
<li>임상시험에서 간헐적 단식은 <strong>매일 칼로리를 줄이는 방법과 비슷한 정도</strong>의 감량 효과를 보였어요.</li>
<li>장점은 단순함, 단점은 <strong>근육 손실, 폭식, 지속의 어려움</strong>이에요.</li>
<li><strong>인슐린이나 일부 당뇨약 복용자, 임신·수유부, 섭식장애 경험자, 성장기 청소년</strong>은 하지 않거나 의사와 상의해요.</li>
</ul></div>

<h2>간헐적 단식의 종류</h2>
<div class="tbl"><table>
<thead><tr><th>방식</th><th>방법</th><th>예시</th></tr></thead>
<tbody>
<tr><td>시간 제한 식사 (16:8 등)</td><td>하루 중 정해진 시간(보통 6~10시간) 안에만 먹어요</td><td>오전 11시~오후 7시에만 식사</td></tr>
<tr><td>5:2 방식</td><td>일주일 중 5일은 평소대로, 2일은 약 500~600kcal만 먹어요</td><td>월·목요일에 적게 먹기</td></tr>
<tr><td>격일 단식</td><td>하루는 평소대로, 하루는 매우 적게 먹거나 굶어요</td><td>하루걸러 500kcal 안팎</td></tr>
</tbody></table></div>
<p>가장 많이 하는 방식은 16:8 같은 <strong>시간 제한 식사</strong>예요. 저녁을 일찍 끝내거나 아침을 건너뛰는 식으로 생활에 맞추기 쉬워요.</p>

<h2>왜 살이 빠질까</h2>
<p>간헐적 단식으로 체중이 줄어드는 가장 큰 이유는 결국 <strong>먹는 총량이 줄기 때문</strong>이에요. 먹는 시간이 줄면 간식과 야식 기회가 사라지고, 자연스럽게 하루 섭취 열량이 줄어요.</p>
<p>이 밖에 공복 시간이 길어지면 인슐린 수치가 낮게 유지되고 지방을 에너지로 쓰는 비중이 늘어난다는 설명이 있어요. '자가포식(오토파지)'이 활발해져 세포가 젊어진다는 이야기도 많지만, 이는 주로 동물 실험에서 나온 결과이고 사람에게서 건강 효과로 이어지는지는 아직 확인이 부족해요.</p>

<h2>임상시험 결과</h2>
<div class="tbl"><table>
<thead><tr><th>연구</th><th>비교</th><th>결과</th></tr></thead>
<tbody>
<tr><td>Trepanowski 외, JAMA Internal Medicine 2017</td><td>격일 단식 vs 매일 칼로리 제한 (1년)</td><td>체중 감량 비슷, 격일 단식 그룹의 중도 포기율이 더 높았음</td></tr>
<tr><td>Lowe 외 (TREAT), JAMA Internal Medicine 2020</td><td>16:8 시간 제한 식사 vs 하루 세 끼 (12주)</td><td>체중 차이가 뚜렷하지 않았고, 줄어든 체중 중 근육 비율이 높았음</td></tr>
<tr><td>Liu 외, NEJM 2022</td><td>칼로리 제한 + 8시간 식사 vs 칼로리 제한만 (1년)</td><td>두 그룹의 체중·체지방·대사 지표 변화가 비슷했음</td></tr>
</tbody></table></div>
<p>정리하면 간헐적 단식은 <strong>효과가 있는 여러 방법 중 하나</strong>이고, 칼로리를 줄이는 다른 방법보다 특별히 더 효과적이라는 근거는 아직 부족해요. 나에게 더 지키기 쉬운 방법이라면 좋은 선택이 될 수 있어요.</p>
<div class="box note"><span class="h">새로운 연구 소식을 볼 때</span>
<p>2024년 미국심장협회 학회에서 하루 8시간 이내로 먹는 사람의 심혈관 사망 위험이 높았다는 관찰 연구가 발표돼 화제가 됐어요. 하지만 이는 설문으로 식사 시간을 조사한 학회 초록 단계의 연구라 원인과 결과를 말하기 어렵다는 지적이 많았어요. 반대로 긍정적인 소식도 마찬가지예요. 하나의 연구보다 여러 연구가 쌓인 결론을 보는 게 좋아요.</p></div>

<h2>알아둘 한계</h2>
<ul>
<li><strong>근육 손실:</strong> 먹는 시간이 줄면서 단백질 섭취가 부족해지기 쉬워요. 체중이 줄어도 근육이 많이 빠지면 기초대사량이 떨어져요.</li>
<li><strong>보상 폭식:</strong> 공복이 길어진 뒤 식사 시간에 몰아서 많이 먹거나, 단식하지 않는 날 과식하기 쉬워요.</li>
<li><strong>사회생활:</strong> 회식, 가족 식사 시간과 맞지 않아 오래 이어가기 어려울 수 있어요.</li>
<li><strong>두통, 어지러움, 예민함:</strong> 적응 초기에 흔해요.</li>
</ul>

<h2>하면 안 되거나 상의가 필요한 사람</h2>
<div class="box warn"><span class="h">이런 경우는 간헐적 단식을 피하거나 먼저 의사와 상의하세요</span>
<ul>
<li><strong>인슐린이나 설포닐우레아 계열 당뇨약</strong>을 먹는 사람: 공복 중 <strong>저혈당</strong> 위험이 커요. 약 조정 없이 시작하지 않아요.</li>
<li><strong>임신 중이거나 수유 중</strong>인 사람</li>
<li><strong>섭식장애</strong>(거식증, 폭식증)를 겪었거나 겪고 있는 사람</li>
<li><strong>성장기 어린이와 청소년</strong></li>
<li><strong>저체중</strong>이거나 근육량이 적은 노인</li>
<li>통풍, 담석이 있는 사람 (급격한 단식이 악화시킬 수 있어요)</li>
<li>공복에 먹어야 하는 약이 있거나, 식사와 함께 먹어야 하는 약이 있는 사람</li>
</ul></div>

<h2>한다면 이렇게</h2>
<div class="box"><span class="h">건강하게 시간 제한 식사하기</span>
<ol>
<li><strong>12시간 공복부터 시작해요.</strong> 저녁 8시 이후 먹지 않고 아침 8시에 먹는 것만으로도 시작이에요. 익숙해지면 14시간, 16시간으로 늘려요.</li>
<li><strong>식사 시간대를 가능하면 이르게</strong> 잡아요. 저녁 늦게 몰아 먹기보다 낮 시간에 먹는 편이 혈당 관리에 유리했다는 소규모 연구가 있어요.</li>
<li><strong>끼니마다 단백질</strong>을 충분히 먹어요. 근육 손실을 줄여요.</li>
<li>공복 시간에는 <strong>물, 무가당 차, 블랙커피</strong>를 마셔요.</li>
<li>식사 시간에 폭식하지 않도록 채소와 단백질부터 먹어요.</li>
<li><strong>근력 운동</strong>을 함께 해요.</li>
<li>어지러움, 두근거림이 심하거나 폭식이 반복되면 중단해요.</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>공복 시간에 블랙커피는 괜찮나요?</dt>
<dd>열량이 거의 없는 블랙커피와 무가당 차는 대부분의 방식에서 허용돼요. 설탕, 시럽, 우유를 넣으면 열량이 생겨요. 빈속의 커피가 속을 쓰리게 한다면 양을 줄여요.</dd>
<dt>아침을 거르면 건강에 나쁘지 않나요?</dt>
<dd>아침을 거르는 것 자체보다 하루 전체의 식사 질과 양이 더 중요하다는 연구가 많아요. 다만 아침을 거르고 점심·저녁에 과식하거나 야식이 늘어난다면 오히려 역효과예요.</dd>
<dt>간헐적 단식으로 당뇨병이 좋아지나요?</dt>
<dd>체중이 줄면 혈당이 좋아질 수 있어요. 하지만 당뇨약을 먹는 사람은 저혈당 위험이 있어서, 반드시 의사와 약 용량을 조정하며 진행해야 해요.</dd>
</dl>

<h2>참고 자료</h2>
<ul class="refs">
<li>Trepanowski JF 외, Effect of Alternate-Day Fasting on Weight Loss, JAMA Internal Medicine 2017</li>
<li>Lowe DA 외, Effects of Time-Restricted Eating on Weight Loss (TREAT), JAMA Internal Medicine 2020</li>
<li>Liu D 외, Calorie Restriction with or without Time-Restricted Eating in Weight Loss, NEJM 2022</li>
<li>대한비만학회, 비만 진료지침</li>
</ul>

<template data-id="gas-safety" data-cat="life" data-date="2026.09.29"
  data-title="가스 안전과 일산화탄소: 가스 냄새가 날 때 절대 하면 안 되는 것"
  data-thumb="CO|일산화탄소"
  data-summary="가스 냄새가 날 때 불을 켜거나 스위치를 누르는 순간이 가장 위험해요. 도시가스와 LPG의 차이, 누출 시 행동 순서, 가스레인지와 휴대용 버너 안전 수칙, 냄새 없는 일산화탄소 중독의 증상과 경보기, 조리할 때 환기가 필요한 이유를 정리했어요."
  data-tags="가스안전,일산화탄소,가스누출,부탄가스,보일러">
<p class="lead">가스 사고의 대부분은 작은 습관에서 시작돼요. 중간밸브를 잠그지 않은 것, 휴대용 버너 위에 큰 불판을 올린 것, 보일러 배기통이 살짝 빠진 것처럼요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>가스 냄새가 나면 <strong>불꽃과 전기 스위치를 절대 건드리지 않고</strong>, 밸브를 잠그고 창문을 열어요.</li>
<li><strong>도시가스(LNG)는 위로</strong> 올라가고, <strong>LPG는 바닥에</strong> 깔려요. 환기 방향이 달라요.</li>
<li>휴대용 버너에 <strong>버너보다 큰 불판</strong>을 올리면 부탄캔이 폭발할 수 있어요.</li>
<li>일산화탄소는 <strong>냄새도 색도 없어요.</strong> 가스보일러가 있는 집은 경보기를 달아요.</li>
</ul></div>

<h2>도시가스와 LPG의 차이</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>도시가스 (LNG)</th><th>LPG (액화석유가스)</th></tr></thead>
<tbody>
<tr><td>주성분</td><td>메탄</td><td>프로판, 부탄</td></tr>
<tr><td>공급 방식</td><td>배관으로 공급</td><td>가스통(용기)으로 공급</td></tr>
<tr><td>공기와의 무게</td><td>공기보다 <strong>가벼워 위로</strong> 올라가요</td><td>공기보다 <strong>무거워 바닥에</strong> 깔려요</td></tr>
<tr><td>가스 경보기 위치</td><td>천장 가까이</td><td>바닥 가까이</td></tr>
</tbody></table></div>
<p>원래 가스에는 냄새가 거의 없어요. 누출을 알아차릴 수 있도록 일부러 <strong>썩은 양파나 달걀 같은 냄새</strong>가 나는 물질(부취제)을 넣어요. 이 냄새가 나면 누출을 의심해요.</p>

<h2>가스 냄새가 날 때 행동 순서</h2>
<div class="box warn"><span class="h">절대 하면 안 되는 것</span>
<ul>
<li>라이터, 성냥, 가스레인지 불 켜기</li>
<li>전등 스위치, 환풍기, 전기제품을 <strong>켜거나 끄기</strong> (스위치를 조작할 때 생기는 작은 불꽃이 점화원이 될 수 있어요)</li>
<li>집 안에서 휴대폰으로 통화하기 (안전한 밖으로 나가서 신고해요)</li>
<li>콘센트에서 플러그 뽑기</li>
</ul></div>
<ol>
<li><strong>가스레인지 콕과 중간밸브, 계량기 옆 메인밸브를 잠가요.</strong></li>
<li><strong>창문과 문을 활짝 열어</strong> 환기해요. LPG는 바닥에 깔리므로 빗자루나 방석으로 쓸어내듯 밖으로 내보내요.</li>
<li>가족과 함께 <strong>밖으로 나가요.</strong></li>
<li>안전한 곳에서 <strong>도시가스 회사 고객센터나 119</strong>에 신고해요. LPG라면 가스 판매점에 연락해요.</li>
<li>점검이 끝나기 전에는 다시 가스를 쓰지 않아요.</li>
</ol>

<h2>누출 점검하는 법</h2>
<p>가스 호스와 연결 부위에 <strong>비눗물</strong>을 붓이나 스펀지로 발라 보세요. 거품이 부풀어 오르는 곳이 있다면 가스가 새는 곳이에요. 불로 확인하는 것은 절대 안 돼요.</p>
<ul>
<li>고무 호스는 시간이 지나면 굳고 갈라져요. <strong>갈라지거나 딱딱해진 호스는 교체</strong>해요. 금속 배관이나 전용 호스로 바꾸면 더 안전해요.</li>
<li>호스를 쥐나 반려동물이 갉지 않았는지 확인해요.</li>
<li>가스 회사의 정기 안전 점검은 꼭 받아요.</li>
</ul>

<h2>가스레인지 안전 수칙</h2>
<ul>
<li>요리할 때는 <strong>자리를 비우지 않아요.</strong> 음식이 넘쳐 불이 꺼지면 가스가 샐 수 있어요. (요즘 가스레인지는 불이 꺼지면 가스를 막는 장치가 있지만 과신하지 않아요)</li>
<li>사용 후에는 레인지 콕과 <strong>중간밸브까지</strong> 잠가요.</li>
<li><strong>불꽃 색</strong>을 확인해요. 정상은 파란색이에요. 붉거나 노란 불꽃은 산소가 부족한 불완전연소 신호로, 일산화탄소가 더 많이 나와요. 버너 구멍을 청소하고, 계속되면 점검을 받아요.</li>
<li>주변에 행주, 키친타월, 기름병을 두지 않아요.</li>
<li>기름에 불이 붙으면 <strong>물을 붓지 말고</strong> 뚜껑이나 젖은 수건으로 덮어 산소를 막고, 가스를 잠가요. 주방용 소화기(K급)가 있으면 사용해요.</li>
</ul>

<h2>휴대용 가스레인지와 부탄가스</h2>
<div class="box warn"><span class="h">부탄캔 폭발을 막는 수칙</span>
<ul>
<li><strong>버너보다 큰 불판이나 냄비를 올리지 않아요.</strong> 불판의 열이 아래로 반사돼 부탄캔을 달구면서 폭발할 수 있어요. 가장 흔한 사고 원인이에요.</li>
<li>휴대용 버너 <strong>두 대를 나란히 붙여</strong> 큰 불판을 올리지 않아요.</li>
<li>부탄캔을 끼울 때 홈을 맞춰 제대로 장착해요.</li>
<li>사용 후에는 <strong>부탄캔을 분리</strong>해서 보관해요.</li>
<li>부탄캔은 직사광선, 차 안, 난로 옆처럼 뜨거운 곳에 두지 않아요.</li>
<li>다 쓴 캔은 안에 남은 가스를 완전히 빼고, 지자체 안내에 따라 구멍을 뚫어 버려요. 불 근처에서 하지 않아요.</li>
</ul></div>

<h2>일산화탄소: 냄새 없는 위험</h2>
<p>가스, 숯, 기름, 나무가 불완전하게 타면 <strong>일산화탄소</strong>가 생겨요. 일산화탄소는 혈액의 헤모글로빈과 산소보다 훨씬 강하게 결합해서, 몸이 산소를 나르지 못하게 만들어요. 색도 냄새도 없어서 알아차리기 어려워요.</p>
<h3>이런 곳에서 생겨요</h3>
<ul>
<li>배기통이 빠지거나 막힌 <strong>가스보일러</strong></li>
<li>텐트나 차 안에서 켠 <strong>난로, 숯, 버너</strong></li>
<li>환기가 안 되는 곳에서 쓰는 가스레인지, 숯불 요리</li>
<li>닫힌 차고에서 켜 둔 자동차</li>
</ul>
<h3>증상</h3>
<div class="tbl"><table>
<thead><tr><th>정도</th><th>증상</th></tr></thead>
<tbody>
<tr><td>가벼움</td><td>두통, 어지러움, 메스꺼움, 피로 (감기나 체한 것으로 오해하기 쉬움)</td></tr>
<tr><td>중간</td><td>심한 두통, 구토, 가슴 두근거림, 판단력 저하, 졸림</td></tr>
<tr><td>심함</td><td>의식 저하, 경련, 호흡 곤란, 사망</td></tr>
</tbody></table></div>
<p>같은 공간에 있던 여러 사람이 <strong>함께 두통과 메스꺼움</strong>을 느끼거나, 밖에 나가면 좋아졌다가 집에 들어오면 다시 심해진다면 일산화탄소를 의심해요.</p>
<div class="box warn"><span class="h">일산화탄소 중독이 의심되면</span>
<ol>
<li>즉시 창문을 열고 <strong>신선한 공기가 있는 밖으로</strong> 나가요.</li>
<li>연료를 쓰는 기구를 끌 수 있다면 꺼요. 단, 오래 머물지 않아요.</li>
<li><strong>119</strong>에 신고해요. 증상이 좋아진 것 같아도 병원 진료가 필요해요. 심하면 고압산소 치료를 해요.</li>
<li>회복 후 몇 주 뒤 기억력 저하 같은 신경 증상이 나타날 수 있어 추적 진료를 받아요.</li>
</ol></div>
<h3>일산화탄소 경보기</h3>
<p>가스보일러가 있는 집, 캠핑을 자주 하는 사람은 <strong>일산화탄소 경보기</strong>를 두면 좋아요. 국내에서는 가스보일러를 새로 설치할 때 경보기 설치가 의무화된 경우도 있어요. 보일러실이나 침실 가까이에 달고, 배터리를 정기적으로 확인해요.</p>

<h2>요리할 때 환기가 필요한 이유</h2>
<p>가스레인지는 불이 타면서 일산화탄소와 함께 <strong>이산화질소</strong> 같은 물질을 내놓아요. 음식을 굽고 튀길 때는 미세먼지도 많이 생겨요. 요리할 때는 <strong>레인지 후드를 켜고</strong>, 요리 후에도 한동안 켜두고, 가능하면 창문을 열어 환기해요.</p>

<div class="box"><span class="h">가스 안전 점검표</span>
<ol>
<li>가스레인지 사용 후 중간밸브 잠그기</li>
<li>가스 호스 갈라짐 확인, 비눗물로 연결부 점검하기</li>
<li>불꽃이 파란색인지 확인하기</li>
<li>보일러 배기통 연결 상태와 틈 확인하기</li>
<li>일산화탄소 경보기 설치하고 배터리 확인하기</li>
<li>휴대용 버너에 큰 불판 올리지 않기, 부탄캔 분리 보관</li>
<li>가스 냄새 날 때 행동 순서를 가족과 함께 알아두기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>가스 냄새가 살짝 나다가 사라졌어요.</dt>
<dd>잠깐 새다가 멈췄거나, 냄새에 익숙해져 못 느끼는 것일 수 있어요. 밸브를 잠그고 환기한 뒤 가스 회사에 점검을 요청하는 게 안전해요.</dd>
<dt>인덕션으로 바꾸면 더 안전한가요?</dt>
<dd>인덕션은 불꽃과 연소 가스가 없어서 가스 누출이나 일산화탄소 위험이 없어요. 다만 조리 중 생기는 미세먼지와 연기는 있으니 후드를 켜는 것은 같아요.</dd>
<dt>텐트 안에서 난로를 켜고 잠깐만 자도 괜찮을까요?</dt>
<dd>안 돼요. 텐트 안에서는 일산화탄소가 빠르게 쌓이고, 잠든 사이에는 증상을 알아차리지 못해요. 난방은 전기 제품이나 침낭, 핫팩 같은 방법을 써요.</dd>
</dl>

<h2>참고 자료</h2>
<ul class="refs">
<li>한국가스안전공사, 가정용 가스 안전 사용 요령 및 가스 누출 시 행동요령</li>
<li>한국가스안전공사, 휴대용 부탄가스 안전 수칙</li>
<li>질병관리청 국가건강정보포털, 일산화탄소 중독</li>
<li>미국 질병통제예방센터(CDC), Carbon Monoxide Poisoning</li>
</ul>

<p class="lead">방광염은 흔한 병이지만, 한 번 걸린 사람은 또 걸리기 쉬워요. 재발을 반복하다 보면 "또 그거네" 하고 넘기기 쉬운데, 신장으로 번지는 신호만큼은 놓치면 안 돼요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>대표 증상은 <strong>배뇨통, 빈뇨, 급하게 마려움, 잔뇨감</strong>이에요. 보통 열은 없어요.</li>
<li><strong>고열, 오한, 옆구리 통증, 구토</strong>가 함께 오면 신우신염일 수 있어 빨리 진료를 받아요.</li>
<li>하루 물을 <strong>1.5L 더</strong> 마신 여성에게서 방광염 재발이 약 절반으로 줄었다는 연구가 있어요.</li>
<li>남성의 방광염은 드물어서 <strong>원인을 확인하는 검사</strong>가 필요해요.</li>
</ul></div>

<h2>왜 여성에게 많을까</h2>
<p>방광염은 대부분 장에 사는 <strong>대장균</strong>이 요도를 타고 방광으로 올라가 생겨요. 여성은 요도가 약 4cm로 짧고 항문과 가까워서 세균이 방광까지 올라가기 쉬워요. 남성은 요도가 훨씬 길어서 방광염이 드물어요.</p>
<h3>위험을 높이는 것</h3>
<ul>
<li>성관계 (세균이 요도 쪽으로 밀려 올라가기 쉬워요)</li>
<li>살정제나 살정제가 묻은 콘돔 사용</li>
<li>소변을 오래 참는 습관, 물을 적게 마시는 습관</li>
<li>폐경 후 에스트로겐 감소로 질과 요도 주변의 환경이 바뀜</li>
<li>임신, 당뇨병, 요로 결석, 소변을 완전히 비우지 못하는 상태</li>
</ul>

<h2>증상: 방광염과 신우신염 구별</h2>
<div class="tbl"><table>
<thead><tr><th>방광염 (하부 요로감염)</th><th>신우신염 (상부 요로감염)</th></tr></thead>
<tbody>
<tr><td>소변 볼 때 따갑고 아픔</td><td>38°C 이상 고열과 오한</td></tr>
<tr><td>자주 마렵고 참기 어려움</td><td>옆구리나 등 아래쪽 통증 (한쪽인 경우가 많음)</td></tr>
<tr><td>봐도 시원하지 않은 잔뇨감</td><td>메스꺼움, 구토</td></tr>
<tr><td>아랫배 불편감, 소변이 탁하거나 냄새, 피가 섞임</td><td>방광염 증상이 함께 있거나 없을 수 있음</td></tr>
<tr><td>대개 열 없음</td><td>심하면 패혈증으로 진행 가능</td></tr>
</tbody></table></div>
<div class="box warn"><span class="h">빨리 진료를 받아야 하는 경우</span>
<ul>
<li>열, 오한, 옆구리 통증, 구토가 있어요. (신우신염 가능성)</li>
<li>임신 중이에요.</li>
<li>남성이에요.</li>
<li>당뇨병이나 면역저하가 있어요.</li>
<li>항생제를 먹고 2~3일이 지나도 좋아지지 않아요.</li>
<li>질 분비물, 가려움이 함께 있어요. (질염이나 성매개감염일 수 있어요)</li>
</ul></div>

<h2>진단과 치료</h2>
<p>전형적인 증상이 있는 젊은 여성이라면 소변검사로 확인하고 항생제를 처방받는 경우가 많아요. 재발이 잦거나 치료에 잘 듣지 않으면 <strong>소변 배양 검사</strong>로 원인균과 잘 듣는 항생제를 확인해요.</p>
<ul>
<li>단순 방광염은 보통 <strong>3~5일</strong> 정도 항생제를 먹어요. 약에 따라 한 번만 먹는 경우도 있어요.</li>
<li>국내는 일부 항생제에 대한 대장균 내성률이 높아서, 의사가 지역 내성 상황을 고려해 약을 골라요.</li>
<li>증상이 좋아져도 <strong>처방받은 기간을 끝까지</strong> 먹어요.</li>
<li>남은 항생제를 두었다가 다음에 스스로 먹지 않아요. 맞지 않는 약은 내성균만 키워요.</li>
<li>물을 충분히 마시면 증상 완화에 도움이 돼요.</li>
</ul>

<h2>재발성 방광염</h2>
<p><strong>6개월에 2번 이상, 또는 1년에 3번 이상</strong> 생기면 재발성 방광염이라고 해요. 이 경우 생활습관 교정과 함께 원인 검사, 예방 치료를 고려해요.</p>
<h3>물 마시기의 효과</h3>
<p>방광염이 잦은 폐경 전 여성 약 140명을 1년간 비교한 연구(2018)에서, 평소보다 <strong>하루 1.5L의 물을 더 마신</strong> 그룹은 방광염이 약 절반으로 줄었어요. 소변을 자주 보면 방광에 들어온 세균이 씻겨 나가기 때문이에요. 가장 쉽고 부작용이 없는 예방법이에요. (심부전이나 콩팥병으로 수분 제한이 필요한 사람은 예외예요.)</p>
<h3>생활 습관</h3>
<ul>
<li><strong>소변을 참지 않아요.</strong></li>
<li>성관계 후 소변을 보는 습관이 권장돼요. 근거가 강하진 않지만 해가 없어요.</li>
<li>화장실에서는 <strong>앞에서 뒤로</strong> 닦아요.</li>
<li>살정제를 쓴다면 다른 피임법을 고려해요.</li>
<li>변비가 있다면 함께 관리해요.</li>
</ul>
<h3>크랜베리는 효과가 있을까</h3>
<p>크랜베리의 성분이 대장균이 방광 벽에 붙는 것을 막는다는 가설이 있어요. 2023년 코크란 리뷰는 크랜베리 제품이 <strong>재발성 방광염이 있는 여성</strong>, 어린이, 요로 시술을 받는 사람에서 증상 있는 요로감염을 줄일 수 있다고 정리했어요. 다만 노인이나 방광 기능 장애가 있는 사람에게는 효과가 뚜렷하지 않았어요. 크랜베리 주스는 당이 많을 수 있으니 무가당 제품이나 캡슐을 고려하고, 와파린을 먹는다면 먼저 상의해요.</p>
<h3>폐경 후 여성</h3>
<p>폐경 후에는 질의 유익균이 줄면서 방광염이 잦아질 수 있어요. <strong>질에 바르는 에스트로겐</strong>이 재발을 줄이는 데 효과가 있어요. 먹는 호르몬제와 달리 전신 부작용이 적어요. 산부인과나 비뇨의학과에서 상담해요.</p>
<h3>예방적 항생제</h3>
<p>다른 방법으로도 재발이 잦다면 저용량 항생제를 매일 먹거나 성관계 후에만 먹는 예방 치료를 의사가 고려하기도 해요. 내성 문제가 있어 꼭 필요할 때만 써요.</p>

<h2>특별한 경우</h2>
<ul>
<li><strong>임신부:</strong> 증상이 없어도 소변에 세균이 있으면(무증상 세균뇨) 신우신염과 조산 위험 때문에 치료해요. 임신 중 검사에서 확인해요.</li>
<li><strong>남성:</strong> 요로감염이 생기면 전립선염이나 요로 구조 이상이 원인일 수 있어 추가 검사를 해요.</li>
<li><strong>노인:</strong> 증상 없이 소변에 세균만 있는 경우가 흔한데, 이때는 보통 치료하지 않아요. 불필요한 항생제가 오히려 해로울 수 있어요. 반면 갑자기 정신이 흐려지거나 열이 나면 요로감염을 포함해 원인을 찾아요.</li>
</ul>

<div class="box"><span class="h">방광염 재발 줄이기 체크리스트</span>
<ol>
<li>물병을 들고 다니며 평소보다 하루 6~8잔 더 마시기</li>
<li>소변 참지 않기, 3~4시간마다 화장실 가기</li>
<li>성관계 후 소변 보기</li>
<li>앞에서 뒤로 닦기</li>
<li>재발이 잦으면 소변 배양 검사 요청하기</li>
<li>폐경 후라면 질 에스트로겐 상담하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>방광염은 성병인가요?</dt>
<dd>아니에요. 대부분 자기 몸의 장내 세균 때문에 생겨요. 다만 성관계가 계기가 될 수 있고, 성매개감염이 비슷한 증상을 일으킬 수 있어서 분비물이 있거나 새 파트너가 생겼다면 함께 검사해요.</dd>
<dt>항생제를 먹을 때마다 질염이 생겨요.</dt>
<dd>항생제가 질의 유익균까지 줄여 곰팡이성 질염이 생기기 쉬워요. 반복된다면 진료 때 알려서 대처 방법을 상의해요.</dd>
<dt>반신욕이나 좌욕이 도움이 되나요?</dt>
<dd>따뜻한 물이 불편감을 잠시 줄여줄 수 있지만 치료는 아니에요. 거품 입욕제나 향이 강한 세정제는 오히려 자극이 될 수 있어요.</dd>
</dl>

<p class="lead">짜게 먹지 말라는 말은 익숙하지만, 칼륨을 충분히 먹으라는 말은 덜 알려져 있어요. 사실 혈압에는 나트륨을 줄이는 것만큼 칼륨을 늘리는 것도 중요해요. 다만 모든 사람에게 그런 건 아니에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인 충분섭취량은 하루 <strong>3,500mg</strong>이에요. 많은 한국인이 이보다 적게 먹어요.</li>
<li>칼륨은 소변으로 <strong>나트륨 배출을 돕고 혈관을 이완</strong>시켜 혈압을 낮춰요.</li>
<li>채소, 과일, 콩, 감자, 우유에 많아요. <strong>음식으로 먹는 게 기본</strong>이에요.</li>
<li><strong>만성 콩팥병</strong>이나 일부 혈압약·이뇨제를 먹는 사람은 칼륨이 쌓여 <strong>위험한 부정맥</strong>이 생길 수 있어요.</li>
</ul></div>

<h2>칼륨이 하는 일</h2>
<p>칼륨은 세포 <strong>안쪽</strong>에 가장 많은 미네랄이고, 나트륨은 세포 <strong>바깥쪽</strong>에 많아요. 이 두 미네랄의 농도 차이가 신경이 신호를 보내고, 근육이 수축하고, 심장이 규칙적으로 뛰게 하는 전기의 원천이에요.</p>
<ul>
<li><strong>혈압 조절:</strong> 콩팥에서 나트륨이 소변으로 더 많이 나가게 돕고, 혈관 벽을 이완시켜요.</li>
<li><strong>심장 리듬:</strong> 혈중 칼륨이 너무 높거나 낮으면 심장 박동이 흐트러져요.</li>
<li><strong>근육과 신경:</strong> 근육 수축과 신경 전달에 필요해요.</li>
</ul>

<h2>하루에 얼마나 필요할까</h2>

<p>하루 채소 5~7접시, 과일 1~2개, 콩이나 두부 반찬, 우유 한 잔을 먹으면 충분섭취량에 가까워져요. 칼륨은 물에 녹아 나와서, 채소를 데친 물이나 국물에도 들어 있어요.</p>

<h2>나트륨과 칼륨의 균형</h2>
<p>여러 연구에서 <strong>나트륨은 많고 칼륨은 적은 식사</strong>가 혈압과 심혈관 질환 위험을 가장 높였어요. 가공식품과 외식이 많을수록 나트륨은 늘고 칼륨은 줄어들어요. 반대로 채소와 과일, 통곡물, 저지방 유제품이 풍부한 식사(DASH 식단)는 혈압을 크게 낮췄어요.</p>
<h3>저염 소금(칼륨 소금)의 효과</h3>
<p>일반 소금(염화나트륨) 일부를 염화칼륨으로 바꾼 저염 소금이 있어요. 중국 농촌 지역에서 뇌졸중 병력이 있거나 고령·고혈압인 약 2만 명을 5년간 추적한 연구(SSaSS, 2021)에서, 저염 소금을 쓴 그룹은 <strong>뇌졸중, 심혈관 사건, 사망이 모두 줄었어요.</strong> 나트륨은 줄고 칼륨은 늘어난 효과예요.</p>
<div class="box warn"><span class="h">저염 소금이 위험할 수 있는 사람</span>
<p>칼륨 소금은 <strong>만성 콩팥병</strong>이 있거나, <strong>ACE 억제제·ARB 계열 혈압약, 칼륨 보존 이뇨제(스피로놀락톤 등)</strong>를 먹는 사람에게는 혈중 칼륨을 위험하게 올릴 수 있어요. 이런 경우 저염 소금을 쓰기 전에 반드시 의사와 상의해요.</p></div>

<h2>칼륨이 너무 높을 때: 고칼륨혈증</h2>
<p>건강한 콩팥은 남는 칼륨을 소변으로 잘 내보내서, 음식으로 먹는 칼륨이 쌓이는 경우는 거의 없어요. 하지만 콩팥 기능이 떨어지면 이야기가 달라져요.</p>
<h3>위험한 사람</h3>
<ul>
<li>만성 콩팥병, 특히 투석 전후의 콩팥병</li>
<li>ACE 억제제, ARB, 칼륨 보존 이뇨제를 먹는 사람</li>
<li>소염진통제를 자주 먹는 사람</li>
<li>조절되지 않는 당뇨병, 심한 탈수</li>
</ul>
<h3>증상</h3>
<p>고칼륨혈증은 <strong>증상이 거의 없다가</strong> 갑자기 위험한 부정맥으로 나타날 수 있어요. 근력 저하, 저린 느낌, 가슴 두근거림, 느린 맥박이 생기면 바로 진료를 받아요. 그래서 위험군은 정기적인 혈액검사가 중요해요.</p>

<h2>콩팥병이 있을 때 칼륨 줄이는 조리법</h2>
<p>콩팥병으로 칼륨 제한을 들었다면 채소와 과일을 무조건 끊기보다 조리법으로 칼륨을 줄일 수 있어요.</p>
<ol>
<li>채소는 <strong>잘게 썰어</strong> 표면적을 넓혀요.</li>
<li><strong>따뜻한 물에 2시간 이상 담가두고</strong> 물을 여러 번 갈아요.</li>
<li>많은 물에 <strong>데친 뒤 물을 버려요.</strong> 국물은 먹지 않아요.</li>
<li>감자, 고구마, 바나나, 토마토, 참외, 키위, 말린 과일처럼 칼륨이 많은 식품은 양을 조절해요.</li>
<li>과일은 칼륨이 비교적 적은 사과, 배, 포도 같은 것을 양을 정해 먹어요.</li>
</ol>
<p>칼륨 제한 정도는 콩팥 기능과 혈액검사 결과에 따라 달라요. 병원 영양 상담을 받으면 나에게 맞는 식단을 정할 수 있어요.</p>

<h2>칼륨이 너무 낮을 때: 저칼륨혈증</h2>
<ul>
<li><strong>원인:</strong> 이뇨제(티아지드, 루프 이뇨제), 심한 구토와 설사, 변비약 남용, 감초를 과하게 먹는 경우</li>
<li><strong>증상:</strong> 근력 저하, 근육 경련, 피로, 변비, 가슴 두근거림, 부정맥</li>
<li>이뇨제를 먹는 사람은 정기 혈액검사로 칼륨을 확인해요. 필요하면 의사가 칼륨제를 처방해요.</li>
</ul>

<div class="box"><span class="h">칼륨 체크리스트</span>
<ol>
<li>콩팥 기능(사구체여과율)이 정상인지 검진 결과로 확인하기</li>
<li>정상이라면 끼니마다 채소 두 가지, 하루 과일 한두 개 챙기기</li>
<li>콩, 두부, 감자, 우유를 식단에 넣기</li>
<li>먹고 있는 혈압약 종류 확인하기</li>
<li>콩팥병이 있다면 저염 소금과 칼륨 많은 식품은 의사·영양사와 상의하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>칼륨 보충제를 먹으면 혈압이 내려가나요?</dt>
<dd>음식으로 칼륨을 늘리면 혈압이 내려가는 효과가 있어요. 보충제는 한 번에 많은 양이 들어가 위장 자극과 고칼륨혈증 위험이 있어서, 의사의 처방 없이 먹는 건 권하지 않아요.</dd>
<dt>바나나를 하루에 몇 개까지 먹어도 되나요?</dt>
<dd>콩팥 기능이 정상이라면 바나나 몇 개로 칼륨이 위험해지지 않아요. 다만 당과 열량을 생각해 하루 한두 개가 적당해요. 콩팥병이 있다면 의사가 정한 기준을 따라요.</dd>
<dt>다리에 쥐가 나면 칼륨이 부족한 건가요?</dt>
<dd>저칼륨혈증이 쥐를 일으킬 수는 있지만, 대부분의 다리 쥐는 근육 피로나 다른 원인 때문이에요. 이뇨제를 먹는 중이라면 혈액검사로 확인해 보는 게 좋아요.</dd>
</dl>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>보건복지부 암 예방 수칙은 <strong>하루 한두 잔의 소량 음주도 피하라</strong>고 권해요.</li>
<li>알코올은 국제암연구소가 정한 <strong>1군 발암물질</strong>이에요. 식도암, 간암, 대장암, 유방암 등과 관련 있어요.</li>
<li>술을 마시면 <strong>얼굴이 빨개지는 사람</strong>은 발암물질인 아세트알데히드를 잘 분해하지 못해 더 위험해요.</li>
<li>한 번에 <strong>남성 7잔, 여성 5잔 이상</strong>을 주 2회 넘게 마시면 고위험음주예요.</li>
</ul></div>

<h2>내가 마신 알코올은 몇 g일까</h2>
<p>술의 종류보다 중요한 건 <strong>순수 알코올의 양</strong>이에요. 계산법은 간단해요.</p>
<div class="box note"><span class="h">알코올 양 계산</span>
<p><strong>알코올(g) = 마신 양(mL) × 도수(%) ÷ 100 × 0.8</strong> (0.8은 알코올의 비중)</p></div>
<div class="tbl"><table>
<thead><tr><th>술</th><th>양</th><th>알코올 (약)</th></tr></thead>
<tbody>
<tr><td>소주 (16.5도)</td><td>1병 (360mL)</td><td class="num">48g</td></tr>
<tr><td>소주 (16.5도)</td><td>1잔 (50mL)</td><td class="num">7g</td></tr>
<tr><td>맥주 (4.5도)</td><td>500mL</td><td class="num">18g</td></tr>
<tr><td>막걸리 (6도)</td><td>1병 (750mL)</td><td class="num">36g</td></tr>
<tr><td>와인 (12도)</td><td>1잔 (150mL)</td><td class="num">14g</td></tr>
<tr><td>위스키 (40도)</td><td>1잔 (30mL)</td><td class="num">10g</td></tr>

<p>소주 한 병은 맥주 500mL 두 잔 반, 와인 세 잔 이상과 비슷한 알코올 양이에요. 각 술의 전용 잔 한 잔에 든 알코올은 대략 비슷하게 맞춰져 있다는 것도 알아두면 좋아요.</p>

<h2>'적당한 음주는 건강에 좋다'는 말은 왜 흔들렸을까</h2>
<p>과거 여러 관찰 연구에서 술을 조금 마시는 사람이 전혀 마시지 않는 사람보다 심혈관 질환과 사망률이 낮게 나왔어요. 이 결과가 'J자 곡선'으로 불리며 적당한 음주가 좋다는 근거가 됐어요.</p>
<p>그런데 연구자들은 비교 방법에 문제가 있다는 걸 발견했어요.</p>
<ul>
<li><strong>'마시지 않는 사람' 그룹</strong>에 건강이 나빠져 술을 끊은 사람, 원래 병이 있어 마시지 못하는 사람이 섞여 있었어요. 그래서 비음주자의 건강이 실제보다 나쁘게 보였어요.</li>
<li>적당히 마시는 사람은 소득, 교육, 사회활동 등 다른 면에서 건강에 유리한 경우가 많았어요.</li>
</ul>
<p>이런 문제를 보정한 대규모 분석(2023)에서는 <strong>소량 음주의 사망률 감소 효과가 사라졌어요.</strong> 유전 정보를 이용해 인과관계를 따진 연구들에서도 음주량이 늘수록 고혈압과 심혈관 질환 위험이 꾸준히 올랐어요. 세계보건기구 유럽사무소는 2023년 "건강에 안전한 음주량은 없다"는 입장을 밝혔어요.</p>

<h2>술과 암</h2>
<p>알코올은 국제암연구소(IARC)가 정한 <strong>1군 발암물질</strong>이에요. 담배, 석면과 같은 등급이에요. 이는 암을 일으킨다는 근거가 확실하다는 뜻이에요.</p>
<ul>
<li>관련된 암: 구강암, 인두암, 후두암, <strong>식도암</strong>, <strong>간암</strong>, <strong>대장암</strong>, <strong>유방암</strong></li>
<li>소량이라도 마시는 양에 비례해 위험이 늘어요. 유방암은 하루 한 잔 정도의 음주에서도 위험이 올라가요.</li>
<li><strong>술과 담배를 함께</strong> 하면 구강·식도암 위험이 곱절 이상으로 커져요.</li>
</ul>
<p>그래서 보건복지부의 국민 암 예방 수칙은 2016년 "하루 두 잔 이내로만 마시기"에서 <strong>"암 예방을 위해 하루 한두 잔의 소량 음주도 피하기"</strong>로 바뀌었어요.</p>

<h2>얼굴이 빨개지는 사람은 더 조심해야 한다</h2>
<p>알코올은 간에서 <strong>아세트알데히드</strong>로 바뀌고, 이것이 다시 <strong>알데히드 분해효소(ALDH2)</strong>에 의해 무해한 물질로 분해돼요. 아세트알데히드는 얼굴을 빨갛게 하고 두근거림, 두통을 일으키는 원인이자 <strong>발암물질</strong>이에요.</p>
<p>동아시아인의 상당수는 이 효소의 기능이 약한 유전자를 가지고 있어요. 이런 사람은 술을 조금만 마셔도 얼굴이 빨개지고, 아세트알데히드가 몸에 오래 남아요. 연구에 따르면 <strong>얼굴이 빨개지는 사람이 술을 계속 마시면 식도암 위험이 특히 크게 올라가요.</strong></p>
<div class="box warn"><span class="h">"마시다 보면 늘어요"는 위험한 말이에요</span>
<p>술을 자주 마시면 얼굴이 덜 빨개지는 것처럼 느껴질 수 있지만, 효소 기능이 좋아진 것이 아니라 뇌가 적응한 것에 가까워요. 아세트알데히드의 해로움은 그대로예요. 얼굴이 빨개지는 사람은 술을 권하지도, 받지도 않는 게 좋아요.</p></div>

<h2>고위험음주 기준</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>기준</th></tr></thead>
<tbody>
<tr><td>고위험음주</td><td>한 번에 남성 7잔(여성 5잔) 이상을 주 2회 이상</td></tr>
<tr><td>폭음(월간)</td><td>한 번에 남성 7잔(여성 5잔) 이상을 월 1회 이상</td></tr>
</tbody>
<caption>질병관리청 국민건강영양조사 기준. 잔은 각 술의 전용 잔 기준이에요.</caption></table></div>
<p>여성은 체구가 작고 체내 수분 비율이 낮아 같은 양을 마셔도 혈중 알코올 농도가 더 높아지고 간 손상도 빨리 올 수 있어요.</p>

<h2>술이 몸에 미치는 영향</h2>
<ul>
<li><strong>간:</strong> 지방간 → 알코올성 간염 → 간경변</li>
<li><strong>심장과 혈관:</strong> 고혈압, 심방세동 같은 부정맥 (과음 후 생기는 부정맥을 '홀리데이 하트'라고 불러요)</li>
<li><strong>췌장:</strong> 급성·만성 췌장염</li>
<li><strong>뇌:</strong> 기억력 저하, 치매 위험 증가</li>
<li><strong>수면:</strong> 잠들기는 쉽지만 밤 후반의 잠이 쪼개져 수면의 질이 떨어져요.</li>
<li><strong>정신건강:</strong> 우울과 불안을 악화시키고 극단적 선택 위험을 높여요.</li>
<li><strong>체중:</strong> 알코올 1g은 7kcal예요. 소주 한 병은 400kcal 안팎이고, 안주까지 더해져요.</li>
</ul>

<h2>술과 함께 먹으면 위험한 약</h2>
<div class="box warn"><span class="h">이런 약을 먹는 중이라면 술을 피하세요</span>
<ul>
<li><strong>아세트아미노펜</strong>(해열진통제): 술을 자주 마시는 사람은 간 손상 위험이 커져요.</li>
<li><strong>수면제, 신경안정제, 일부 진통제</strong>: 호흡 억제와 과도한 진정이 생길 수 있어요.</li>
<li><strong>당뇨약, 인슐린</strong>: 저혈당이 생기기 쉬워요.</li>
<li><strong>메트로니다졸 등 일부 항생제</strong>: 심한 메스꺼움, 두근거림이 생겨요.</li>
<li><strong>와파린</strong>: 약효가 불안정해져요.</li>
</ul></div>

<h2>줄이고 싶다면</h2>
<div class="box"><span class="h">절주 실천 방법</span>
<ol>
<li>일주일에 술 마시지 않는 날을 정해요.</li>
<li>술자리 전에 식사를 해서 빈속에 마시지 않아요.</li>
<li>술 한 잔에 물 한 잔을 번갈아 마셔요.</li>
<li>잔을 비우기 전에 채우지 않고, 첨잔을 받지 않아요.</li>
<li>무알코올 음료나 탄산수를 선택지로 두어요.</li>
<li>'오늘은 두 잔까지'처럼 시작 전에 양을 정해요.</li>
<li>술을 권하는 문화가 강한 자리라면 "약을 먹고 있어서요"처럼 미리 말을 준비해요.</li>
</ol></div>
<p>매일 마시지 않으면 불안하거나, 줄이려 해도 잘 안 되거나, 아침에 해장술이 필요하다면 <strong>알코올 사용장애</strong>일 수 있어요. 지역 정신건강복지센터나 중독관리통합지원센터에서 상담을 받을 수 있어요. 오랫동안 많이 마신 사람이 갑자기 끊으면 손 떨림, 환각, 경련 같은 <strong>금단 증상</strong>이 생길 수 있어 의료진의 도움을 받는 게 안전해요.</p>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>레드와인의 폴리페놀은 몸에 좋지 않나요?</dt>
<dd>포도의 폴리페놀은 포도나 다른 과일, 채소로도 얻을 수 있어요. 와인을 마시면 폴리페놀과 함께 알코올도 마시게 되는데, 알코올의 해로움이 더 커요.</dd>
<dt>숙취 해소제는 효과가 있나요?</dt>
<dd>숙취 해소제의 효과를 확인한 연구는 대부분 규모가 작고 근거가 약해요. 숙취를 줄이는 가장 확실한 방법은 적게 마시는 거예요. 물을 충분히 마시고 푹 자는 게 회복에 도움이 돼요.</dd>
<dt>주말에만 몰아서 마시면 괜찮은가요?</dt>
<dd>일주일 총량이 같더라도 한 번에 많이 마시는 폭음은 사고, 부정맥, 급성 간 손상, 췌장염 위험이 더 커요. 나눠서 적게 마시는 것보다 더 해로워요.</dd>
</dl>

<p class="lead">불이 났을 때 판단할 시간은 생각보다 짧아요. 연기가 방을 채우는 데는 몇 분이면 충분해요. 그래서 미리 알아두고, 한 번쯤 머릿속으로 연습해 두는 게 가장 큰 대비예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>불이 작으면 <strong>소화기</strong>로 끄고, <strong>천장에 닿을 만큼 커지면</strong> 끄지 말고 대피해요.</li>
<li>소화기는 <strong>안전핀 뽑기 → 노즐 잡기 → 손잡이 누르기 → 쓸듯이 뿌리기</strong> 순서예요.</li>
<li>식용유 화재에는 <strong>절대 물을 붓지 않아요.</strong></li>
<li>대피할 때는 <strong>자세를 낮추고, 계단으로, 문은 닫고</strong> 나가요. 엘리베이터는 타지 않아요.</li>
</ul></div>

<h2>불을 발견했다면</h2>
<ol>
<li><strong>"불이야!"</strong> 크게 외치고 비상벨을 눌러 주변에 알려요.</li>
<li>불이 작다면(휴지통, 냄비 정도) 소화기로 초기 진화를 시도해요.</li>
<li>불이 커지거나 연기가 많으면 <strong>즉시 대피</strong>해요. 물건을 챙기려고 돌아가지 않아요.</li>
<li>안전한 곳에서 <strong>119</strong>에 신고해요.</li>
</ol>
<div class="box note"><span class="h">119 신고할 때 말할 것</span>
<ul>
<li>정확한 주소 (동·호수까지), 모르면 주변의 큰 건물</li>
<li>무엇이 타고 있는지, 몇 층에서 났는지</li>
<li>안에 사람이 남아 있는지</li>
</ul>
<p>전화를 먼저 끊지 말고 상황실의 질문에 답해요.</p></div>

<h2>소화기 사용법</h2>
<div class="tbl"><table>
<thead><tr><th>순서</th><th>동작</th></tr></thead>
<tbody>
<tr><td>1. 안전핀</td><td>소화기를 불 가까이 가져가 바닥에 놓고, 몸통을 잡은 채 <strong>안전핀을 뽑아요.</strong></td></tr>
<tr><td>2. 노즐</td><td>한 손으로 <strong>노즐(호스)을 잡고</strong> 불 쪽을 향해요.</td></tr>
<tr><td>3. 손잡이</td><td>다른 손으로 <strong>손잡이를 힘껏 움켜쥐어요.</strong></td></tr>
<tr><td>4. 분사</td><td>불꽃이 아니라 <strong>불이 타는 물체의 아래쪽</strong>을 향해 빗자루로 쓸듯이 좌우로 뿌려요.</td></tr>
</tbody>
<caption>소방청 소화기 사용 요령</caption></table></div>
<ul>
<li><strong>바람을 등지고</strong> 뿌려요. 실내라면 출입구를 등 뒤에 두어 대피로를 확보해요.</li>
<li>분말 소화기 한 대가 뿜어져 나오는 시간은 수십 초 정도로 짧아요. 처음부터 불의 뿌리를 겨냥해요.</li>
<li>불이 꺼진 것 같아도 다시 붙을 수 있어요. 불씨를 확인하고 119에 알려요.</li>
</ul>
<h3>소화기 점검</h3>
<ul>
<li><strong>압력계 바늘이 초록색</strong> 범위에 있는지 확인해요.</li>
<li>분말 소화기는 한 달에 한 번 정도 <strong>거꾸로 흔들어</strong> 분말이 굳지 않게 해요.</li>
<li>분말 소화기는 제조일로부터 <strong>10년</strong>이 내용연수예요. 지났다면 교체해요.</li>
<li>현관과 주방 가까이, 누구나 쉽게 꺼낼 수 있는 곳에 두어요.</li>
</ul>

<h2>식용유 화재: 물을 부으면 폭발한다</h2>
<p>튀김 기름에 불이 붙었을 때 물을 부으면, 뜨거운 기름 속으로 들어간 물이 순간적으로 수증기가 되면서 <strong>불붙은 기름을 사방으로 튀겨</strong> 불이 폭발적으로 커져요.</p>
<ol>
<li>가스 불을 끄고 중간밸브를 잠가요.</li>
<li><strong>냄비 뚜껑이나 젖은 큰 수건</strong>으로 덮어 산소를 막아요.</li>
<li>주방용(K급) 소화기가 있으면 사용해요. 일반 분말 소화기는 기름을 튀길 수 있어 조심해요.</li>
<li>채소를 한꺼번에 넣어 온도를 낮추는 방법도 알려져 있지만, 불이 커졌다면 무리하지 말고 대피해요.</li>
</ol>

<h2>연기 속에서 대피하는 법</h2>
<p>화재 사망자의 상당수는 불에 타서가 아니라 <strong>연기와 유독가스</strong>를 마셔서 목숨을 잃어요. 연기는 위로 올라가 천장부터 채우고 내려와요.</p>
<ul>
<li><strong>젖은 수건이나 옷으로 코와 입을 막아요.</strong> 준비할 시간이 없다면 옷소매라도 써요.</li>
<li><strong>자세를 낮추고</strong> 한 손으로 벽을 짚으며 이동해요. 바닥 가까이 공기가 비교적 깨끗해요.</li>
<li><strong>계단</strong>으로 대피하고 엘리베이터는 타지 않아요. 정전으로 멈추거나 연기가 차는 통로가 될 수 있어요.</li>
<li>원칙적으로 <strong>아래층으로</strong> 대피해요. 아래가 불이나 연기로 막혔다면 옥상으로 가요.</li>
<li>문을 열기 전에 <strong>손등으로 손잡이를 만져보고</strong>, 뜨겁다면 열지 말고 다른 길을 찾아요.</li>
<li>나올 때 <strong>문을 닫고</strong> 나와요. 연기와 불이 퍼지는 속도를 크게 늦춰요.</li>
</ul>

<h2>대피할 수 없을 때</h2>
<ol>
<li>연기가 들어오지 않는 방으로 가서 <strong>문을 닫아요.</strong></li>
<li>문틈을 <strong>젖은 수건이나 옷</strong>으로 막아요.</li>
<li>119에 정확한 위치를 알리고, 창문으로 수건을 흔들거나 휴대폰 불빛으로 구조를 요청해요.</li>
<li>뛰어내리지 않고 구조를 기다려요.</li>
</ol>
<h3>아파트의 숨은 대피 시설</h3>
<div class="tbl"><table>
<thead><tr><th>시설</th><th>설명</th></tr></thead>
<tbody>
<tr><td>경량 칸막이</td><td>발코니에서 옆집과 맞닿은 벽 중 일부가 석고보드처럼 얇게 되어 있어요. 발로 차거나 도구로 부수고 옆집으로 대피할 수 있어요. 두드리면 통통 빈 소리가 나요.</td></tr>
<tr><td>대피 공간</td><td>발코니 한쪽에 방화문으로 된 작은 공간이에요. 불과 연기를 일정 시간 막아줘요.</td></tr>
<tr><td>하향식 피난구</td><td>발코니 바닥의 덮개를 열면 사다리로 아래층 발코니로 내려갈 수 있어요.</td></tr>
</tbody>
<caption>설치 시기와 구조에 따라 우리 집에 있는 시설이 달라요.</caption></table></div>
<div class="box warn"><span class="h">대피 시설 앞에 짐을 두지 마세요</span>
<p>경량 칸막이 앞에 붙박이장을 설치하거나, 대피 공간을 창고로 쓰거나, 하향식 피난구 위에 화분을 올려두면 정작 필요할 때 쓸 수 없어요. 오늘 우리 집 발코니를 한번 확인해 보세요.</p></div>

<h2>집에서 불이 나는 흔한 원인</h2>
<ul>
<li><strong>조리 중 자리 비움:</strong> 음식물을 올려두고 잊는 부주의 화재가 매우 흔해요.</li>
<li><strong>전기:</strong> 멀티탭 과부하, 콘센트 먼지, 전선 피복 손상</li>
<li><strong>담배꽁초:</strong> 완전히 끄지 않은 꽁초, 베란다에서 버린 꽁초</li>
<li><strong>난방기구:</strong> 전기히터 주변 이불·빨래, 오래된 전기장판</li>
<li><strong>배터리:</strong> 전동킥보드, 보조배터리를 과충전하거나 정품이 아닌 충전기 사용. 잠자는 동안 침실에서 충전하지 않는 게 좋아요.</li>
<li><strong>양초와 향:</strong> 커튼 가까이, 자리 비울 때 켜두기</li>
</ul>

<h2>주택용 소방시설</h2>
<p>아파트를 제외한 단독주택과 다세대·연립주택에는 <strong>소화기</strong>(층마다 1개 이상)와 <strong>단독경보형 감지기</strong>(방과 거실마다)를 설치하도록 법으로 정해져 있어요. 감지기는 연기를 감지하면 큰 소리로 알려줘서 잠든 사이 화재에 특히 중요해요. 배터리를 정기적으로 확인하고, 시험 버튼을 눌러 작동을 확인해요.</p>

<div class="box"><span class="h">우리 집 화재 대비 점검표</span>
<ol>
<li>소화기 위치 확인하고 압력계 바늘 초록색인지 보기</li>
<li>화재감지기 작동 버튼 눌러보기</li>
<li>현관 외 두 번째 대피 경로 가족과 함께 확인하기</li>
<li>발코니 경량 칸막이, 대피 공간, 하향식 피난구 앞 짐 치우기</li>
<li>멀티탭 과부하와 먼지 점검하기</li>
<li>가족과 불이 나면 모일 장소 정하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>옷에 불이 붙었어요.</dt>
<dd>뛰면 산소가 공급돼 불이 커져요. <strong>멈추고, 엎드려서, 얼굴을 가리고 구르세요.</strong> 주변 사람은 담요나 옷으로 덮어 불을 꺼요. 화상 부위는 흐르는 찬물로 식혀요.</dd>
<dt>아파트에서 불이 나면 무조건 나가야 하나요?</dt>
<dd>우리 집에서 불이 났다면 바로 대피해요. 다른 집에서 불이 났을 때는 상황에 따라 달라요. 연기가 복도와 계단에 가득하다면 무리하게 나가기보다 집 안에서 문을 닫고 틈을 막은 채 119의 안내를 받는 게 안전할 수 있어요. 관리사무소 방송과 119 안내를 따르세요.</dd>
<dt>소화기는 어떤 걸 사야 하나요?</dt>
<dd>가정용으로는 일반적인 분말 소화기(ABC)를 많이 써요. 주방에는 식용유 화재용 K급 소화기를 함께 두면 좋아요. 국가 인증 표시(KFI 등)가 있는 제품을 골라요.</dd>
</dl>

<h2>참고 자료</h2>
<ul class="refs">
<li>소방청, 화재 시 대피 요령 및 소화기 사용법</li>
<li>소방청, 주택용 소방시설 설치 안내</li>
<li>행정안전부, 국민재난안전포털 화재 행동요령</li>
<li>국토교통부, 공동주택 대피 공간 및 경량 칸막이 안내</li>
</ul>

<template data-id="gout" data-cat="dis" data-date="2026.09.29"
  data-title="통풍 완전 정리: 바람만 스쳐도 아픈 이유, 발작 대처, 요산 낮추는 약과 식사"
  data-thumb="6.0|요산 목표"
  data-summary="통풍은 핏속 요산이 결정이 되어 관절에 쌓이는 병이에요. 엄지발가락에 갑자기 오는 극심한 통증의 원리, 발작 때 할 일과 하지 말 일, 요산저하제를 시작해야 하는 경우와 한국인이 먼저 받아야 할 유전자 검사, 음식과 술이 미치는 영향을 정리했어요."
  data-tags="통풍,요산,관절염,알로퓨리놀,퓨린">
<p class="lead">통풍(痛風)은 '바람만 스쳐도 아프다'는 뜻으로 불릴 만큼 통증이 극심해요. 하지만 발작이 지나가면 언제 그랬냐는 듯 멀쩡해져서, 치료를 미루다가 관절이 망가지는 경우가 많아요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>혈중 요산이 약 <strong>6.8mg/dL</strong>을 넘으면 결정이 생기기 시작해요.</li>
<li>발작 때는 <strong>휴식, 냉찜질, 소염 치료</strong>. 이미 먹고 있는 요산저하제는 끊지 않아요.</li>
<li>발작이 잦거나 통풍결절이 있으면 <strong>요산저하제</strong>로 요산을 <strong>6mg/dL 미만</strong>으로 유지해요.</li>
<li>한국인은 알로퓨리놀 시작 전 <strong>HLA-B*5801 유전자 검사</strong>가 권장돼요.</li>
</ul></div>

<h2>요산이 결정이 되는 원리</h2>
<p>요산은 <strong>퓨린</strong>이라는 물질이 분해되고 남는 찌꺼기예요. 퓨린은 몸의 세포에서도 만들어지고 음식으로도 들어와요. 요산은 주로 콩팥을 통해 소변으로 나가는데, 너무 많이 만들어지거나 잘 배출되지 않으면 혈중 농도가 올라가요.</p>
<p>혈중 요산이 약 6.8mg/dL을 넘으면 더 이상 녹아 있지 못하고 <strong>바늘 모양의 결정</strong>이 되어 관절과 주변 조직에 쌓여요. 이 결정을 면역세포가 공격하면서 격렬한 염증이 생기는 게 통풍 발작이에요. 체온이 낮은 곳일수록 결정이 잘 생겨서 <strong>엄지발가락</strong>처럼 몸의 끝에서 흔히 시작돼요.</p>
<p>요산이 높다고 모두 통풍이 되는 건 아니에요. 고요산혈증인 사람 중 일부만 통풍으로 진행해요. 증상이 없는 고요산혈증은 대부분 약으로 치료하지 않고 생활습관을 관리하며 지켜봐요.</p>

<h2>통풍 발작의 특징</h2>
<ul>
<li>주로 <strong>밤이나 새벽</strong>에 갑자기 시작해요.</li>
<li>관절이 <strong>빨갛게 붓고 뜨겁고</strong>, 이불이 닿기만 해도 아파요.</li>
<li>첫 발작의 절반 이상이 <strong>엄지발가락 뿌리 관절</strong>이에요. 발등, 발목, 무릎에도 생겨요.</li>
<li>치료하지 않아도 1~2주면 가라앉지만, 시간이 지나면 발작이 잦아지고 여러 관절로 번져요.</li>
</ul>
<h3>발작을 부르는 계기</h3>
<ul>
<li>술, 특히 <strong>맥주</strong>와 과음</li>
<li>내장, 등푸른 생선, 조개류 같은 퓨린이 많은 음식을 한꺼번에 많이 먹었을 때</li>
<li><strong>과당이 많은 단 음료</strong></li>
<li>탈수, 사우나, 격한 운동 후</li>
<li>수술, 급성 질환, 급격한 체중 감량</li>
<li>일부 약물 (이뇨제, 저용량 아스피린 등)</li>
</ul>

<h2>발작이 왔을 때</h2>
<div class="box note"><span class="h">발작 때 할 일</span>
<ul>
<li>아픈 관절을 <strong>쉬게 하고 높이</strong> 올려요.</li>
<li>얇은 천으로 감싼 얼음팩으로 <strong>냉찜질</strong>해요. 한 번에 15~20분.</li>
<li>가능한 빨리 진료를 받아요. <strong>일찍 치료할수록</strong> 빨리 가라앉아요.</li>
<li>물을 충분히 마셔요.</li>
<li>술은 마시지 않아요.</li>
</ul></div>
<p>급성 발작에는 <strong>콜히친, 소염진통제, 스테로이드</strong> 중 환자의 상태(콩팥 기능, 위장 상태, 다른 약)에 맞는 약을 써요.</p>
<div class="box warn"><span class="h">먹던 요산저하제는 끊지 마세요</span>
<p>요산저하제를 먹는 중에 발작이 오면 약 때문이라 생각해 끊는 경우가 많아요. 하지만 이때 끊으면 요산 수치가 흔들려 오히려 발작이 더 잦아질 수 있어요. 요산저하제는 그대로 먹으면서 발작 치료를 따로 받아요.</p></div>

<h2>요산저하제: 언제, 어떻게</h2>
<h3>시작을 권하는 경우</h3>
<ul>
<li>통풍 발작이 <strong>1년에 2번 이상</strong></li>
<li>피부 아래 요산 덩어리(<strong>통풍결절</strong>)가 있음</li>
<li>엑스레이 등에서 통풍으로 인한 <strong>관절 손상</strong>이 보임</li>
<li>요산 결석, 만성 콩팥병이 함께 있음</li>
</ul>
<h3>목표 수치</h3>
<p>요산저하제를 쓰면 혈중 요산을 <strong>6mg/dL 미만</strong>(통풍결절이 있으면 5mg/dL 미만)으로 꾸준히 유지하는 것이 목표예요. 이 수준이 유지되면 이미 쌓인 결정이 서서히 녹아 발작이 줄고 결절도 작아져요. 그래서 요산저하제는 대개 <strong>오래</strong> 먹어요.</p>
<div class="tbl"><table>
<thead><tr><th>약</th><th>작용</th><th>알아둘 점</th></tr></thead>
<tbody>
<tr><td>알로퓨리놀</td><td>요산 생성을 줄임</td><td>한국인은 시작 전 <strong>HLA-B*5801 유전자 검사</strong> 권장. 저용량부터 서서히 증량</td></tr>
<tr><td>페북소스타트</td><td>요산 생성을 줄임</td><td>심혈관 질환이 있는 사람은 주의가 필요하다는 경고가 있음</td></tr>
<tr><td>벤즈브로마론 등</td><td>요산 배출을 늘림</td><td>요산 결석이 있거나 콩팥 기능이 많이 떨어졌을 때는 제한</td></tr>
</tbody>
<caption>대한류마티스학회 통풍 진료지침 등을 바탕으로 정리</caption></table></div>
<div class="box warn"><span class="h">알로퓨리놀과 HLA-B*5801</span>
<p>알로퓨리놀은 드물게 피부와 점막이 벗겨지는 <strong>중증 피부 이상반응</strong>(스티븐스-존슨 증후군 등)을 일으킬 수 있어요. 이 반응은 <strong>HLA-B*5801</strong>이라는 유전자를 가진 사람에게 훨씬 많이 생기는데, 한국인을 포함한 동아시아인에게 이 유전자가 비교적 흔해요. 그래서 국내 진료지침은 알로퓨리놀을 시작하기 전 이 유전자 검사를 권해요. 약을 먹기 시작한 뒤 발진, 발열, 입 안 헐음이 생기면 바로 약을 멈추고 진료를 받아요.</p></div>
<h3>처음 몇 달은 발작이 늘 수 있어요</h3>
<p>요산 수치가 떨어지면서 쌓여 있던 결정이 움직여 치료 초기에 오히려 발작이 늘 수 있어요. 그래서 요산저하제를 시작할 때 <strong>3~6개월 정도 저용량 콜히친</strong> 같은 예방약을 함께 쓰는 경우가 많아요. 이 시기의 발작 때문에 치료를 포기하지 않는 게 중요해요.</p>

<h2>음식과 생활 관리</h2>
<p>음식만으로 요산을 크게 낮추기는 어려워요. 식사 조절로 떨어지는 요산은 대개 1mg/dL 안팎이라, 약이 필요한 사람은 약이 중심이에요. 그래도 발작을 줄이고 약의 효과를 돕는 데 생활 관리가 중요해요.</p>
<div class="tbl"><table>
<thead><tr><th>줄일 것</th><th>괜찮거나 도움이 되는 것</th></tr></thead>
<tbody>
<tr><td>술, 특히 맥주와 증류주 과음</td><td>물 충분히 (하루 2L 안팎, 수분 제한이 없는 경우)</td></tr>
<tr><td>과당이 많은 단 음료, 과일주스</td><td>저지방 우유와 유제품</td></tr>
<tr><td>간, 곱창 같은 내장류</td><td>채소 (퓨린이 있는 채소도 발작 위험을 높이지 않아요)</td></tr>
<tr><td>멸치, 정어리, 고등어 등 등푸른 생선과 조개류의 과량 섭취</td><td>커피 (관찰 연구에서 통풍 위험이 낮았어요)</td></tr>
<tr><td>진한 고기 국물</td><td>체중 감량 (천천히)</td></tr>
</tbody></table></div>
<ul>
<li><strong>급격한 다이어트와 단식</strong>은 요산을 일시적으로 올려 발작을 부를 수 있어요. 천천히 빼요.</li>
<li>고혈압약을 먹는다면 요산을 올리는 이뇨제 대신 다른 약(로사르탄 등)을 쓸 수 있는지 의사와 상의해 볼 수 있어요.</li>
</ul>

<h2>통풍과 함께 오는 병</h2>
<p>통풍은 관절만의 병이 아니에요. 고혈압, 당뇨병, 이상지질혈증, 비만, 만성 콩팥병, 심혈관 질환과 함께 오는 경우가 많아요. 통풍 진단을 받았다면 이 질환들도 함께 확인하고 관리해요.</p>

<div class="box"><span class="h">통풍 관리 체크리스트</span>
<ol>
<li>혈중 요산 수치를 정기적으로 확인하고 목표(6 미만) 기억하기</li>
<li>요산저하제는 좋아져도 임의로 끊지 않기</li>
<li>발작 때 먹을 약을 미리 처방받아 두기</li>
<li>맥주와 단 음료 줄이기</li>
<li>물 자주 마시기</li>
<li>혈압, 혈당, 콩팥 기능 함께 확인하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>발작이 없는데 약을 계속 먹어야 하나요?</dt>
<dd>발작이 없는 건 약이 요산을 잘 낮추고 있기 때문인 경우가 많아요. 끊으면 요산이 다시 오르고 몇 달~몇 년 안에 발작이 재발하기 쉬워요. 약을 줄이거나 끊는 결정은 의사와 함께해요.</dd>
<dt>여성도 통풍에 걸리나요?</dt>
<dd>폐경 전에는 에스트로겐이 요산 배출을 도와 드물지만, 폐경 후에는 늘어요. 이뇨제를 먹는 노인 여성에게서도 볼 수 있어요.</dd>
<dt>통풍이면 고기를 아예 먹으면 안 되나요?</dt>
<dd>아니에요. 적당한 양의 살코기는 괜찮아요. 내장류와 진한 국물, 한꺼번에 많이 먹는 것을 피하고, 전체 식사 균형과 체중, 술 관리가 더 중요해요.</dd>
</dl>

<h2>참고 자료</h2>
<ul class="refs">
<li>대한류마티스학회, 통풍 진료지침</li>
<li>미국류마티스학회(ACR), Guideline for the Management of Gout (2020)</li>

</ul>

<template data-id="sodium" data-cat="nut" data-date="2026.09.29"
  data-title="나트륨 총정리: 한국인이 짜게 먹는 이유와 입맛을 바꾸는 현실적인 방법"
  data-thumb="2,000mg|WHO 권고"
  data-summary="한국인의 나트륨 섭취는 많이 줄었지만 여전히 권고량을 훌쩍 넘어요. 나트륨과 소금의 환산, 섭취기준, 한국 식단에서 나트륨이 어디서 오는지, 혈압·뇌졸중·위암과의 관계, 몇 주면 바뀌는 짠맛 입맛, 요리와 외식에서 줄이는 방법을 정리했어요."
  data-tags="나트륨,소금,저염식,고혈압,식습관">
<p class="lead">"싱겁게 먹어라"는 말은 누구나 알아요. 그런데 실제로 나트륨이 어디서 오는지, 얼마나 줄여야 하는지는 잘 모르는 경우가 많아요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>세계보건기구 권고는 나트륨 하루 <strong>2,000mg 미만</strong>(소금 약 5g)이에요.</li>
<li>나트륨에 <strong>2.5를 곱하면</strong> 소금 양이 돼요.</li>
<li>한국인 나트륨의 큰 부분이 <strong>국·찌개·면류, 김치, 장류</strong>에서 와요.</li>
<li>짠맛에 대한 입맛은 <strong>몇 주</strong> 꾸준히 싱겁게 먹으면 바뀌어요.</li>
</ul></div>

<h2>나트륨과 소금은 같은 걸까</h2>
<p>소금(염화나트륨)의 약 40%가 나트륨이에요. 영양성분표에는 소금이 아니라 <strong>나트륨(mg)</strong>으로 적혀 있어요.</p>
<div class="box note"><span class="h">환산법</span>
<p><strong>소금(g) = 나트륨(g) × 2.5</strong></p>
<p>예) 나트륨 2,000mg = 2g × 2.5 = 소금 5g (티스푼 하나 정도)</p></div>
<p>나트륨은 소금뿐 아니라 간장, 된장, 고추장, 조미료(글루탐산나트륨), 베이킹소다(탄산수소나트륨), 각종 가공식품 첨가물에도 들어 있어요.</p>

<h2>얼마나 먹어야 할까</h2>
<div class="tbl"><table>
<thead><tr><th>기준</th><th>나트륨</th></tr></thead>
<tbody>
<tr><td>세계보건기구 권고</td><td class="num">하루 2,000mg 미만</td></tr>
<tr><td>한국인 만성질환위험감소섭취량 (성인)</td><td class="num">하루 2,300mg</td></tr>
<tr><td>한국인 충분섭취량 (성인)</td><td class="num">하루 1,500mg</td></tr>
</tbody>
<caption>보건복지부·한국영양학회, 2020 한국인 영양소 섭취기준. 만성질환위험감소섭취량은 이보다 많이 먹으면 만성질환 위험이 커진다는 기준이에요.</caption></table></div>
<p>국민건강영양조사에서 한국인의 나트륨 섭취량은 2010년대 초 하루 4,000mg대에서 꾸준히 줄어 최근에는 3,000mg 안팎이에요. 큰 진전이지만 여전히 권고량보다 50% 가까이 많아요.</p>

<h2>한국인의 나트륨은 어디서 올까</h2>
<p>한국 식단의 특징은 나트륨이 <strong>국물</strong>과 <strong>발효 식품</strong>, <strong>양념</strong>에 넓게 퍼져 있다는 점이에요.</p>
<ul>
<li><strong>면류와 국·찌개·탕:</strong> 라면 한 봉지, 짬뽕 한 그릇, 해장국 한 그릇에 하루 권고량 가까이 또는 그 이상이 들어 있는 경우가 많아요.</li>
<li><strong>김치와 장아찌:</strong> 매 끼니 조금씩이지만 매일 쌓여요.</li>
<li><strong>장류와 양념:</strong> 간장, 된장, 고추장, 쌈장</li>
<li><strong>가공식품:</strong> 햄, 소시지, 어묵, 즉석식품, 과자, 빵</li>
<li><strong>외식과 배달 음식:</strong> 집밥보다 간이 센 경우가 많아요.</li>
</ul>

<h2>짜게 먹으면 생기는 일</h2>
<ul>
<li><strong>혈압 상승:</strong> 나트륨이 몸에 수분을 붙잡아 혈액량이 늘고 혈관이 받는 압력이 커져요. 나이가 많을수록, 고혈압이나 당뇨병이 있을수록 소금에 민감하게 반응해요.</li>
<li><strong>뇌졸중과 심혈관 질환:</strong> 혈압 상승을 통해 위험이 커져요.</li>
<li><strong>위암:</strong> 소금에 절인 음식과 짠 음식은 위 점막을 손상시키고 헬리코박터균의 해로움을 키울 수 있어요. 세계암연구기금은 염장 식품을 위암 위험 요인으로 봐요.</li>
<li><strong>콩팥:</strong> 콩팥에 부담을 주고, 콩팥병의 진행을 빠르게 해요.</li>
<li><strong>뼈:</strong> 소변으로 칼슘이 더 많이 빠져나가요.</li>
<li><strong>부종:</strong> 짜게 먹은 다음 날 얼굴과 손이 붓는 경험이 흔해요.</li>
</ul>

<h2>입맛은 바뀐다</h2>
<p>짠맛에 대한 기호는 타고나는 것이 아니라 <strong>익숙해진 것</strong>이에요. 연구에서 싱겁게 먹기 시작한 사람들은 몇 주가 지나자 예전 음식이 짜다고 느끼고, 싱거운 음식을 더 맛있게 느꼈어요. 처음 1~2주가 가장 힘들고, 그 뒤로는 점점 쉬워져요. 한꺼번에 확 줄이기보다 조금씩 줄여가면 적응이 쉬워요.</p>

<h2>집에서 줄이는 방법</h2>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>요령</th></tr></thead>
<tbody>
<tr><td>국물 줄이기</td><td>국그릇을 작은 것으로 바꾸고 건더기 위주로. 국물을 반만 남겨도 효과가 커요.</td></tr>
<tr><td>간은 마지막에</td><td>조리 중 여러 번 간을 하기보다 불을 끄기 직전이나 먹기 직전에 해요. 표면에 닿는 간이 더 잘 느껴져요.</td></tr>
<tr><td>다른 맛으로 채우기</td><td>식초, 레몬, 겨자, 후추, 마늘, 생강, 들깨, 참기름, 허브로 맛을 더해요.</td></tr>
<tr><td>감칠맛 활용</td><td>다시마, 표고버섯, 멸치 육수로 깊은 맛을 내면 소금을 덜 써도 돼요.</td></tr>
<tr><td>양념은 찍어 먹기</td><td>소스를 부어 먹기보다 찍어 먹으면 훨씬 적게 먹어요.</td></tr>
<tr><td>김치는 덜 짜게</td><td>담글 때 소금을 줄이거나, 먹을 때 양을 조금 줄여요.</td></tr>
<tr><td>온도 조절</td><td>뜨거울 때보다 식으면 짠맛이 더 강하게 느껴져요. 간은 먹을 온도에서 봐요.</td></tr>
</tbody></table></div>

<h2>외식과 가공식품에서 줄이는 방법</h2>
<ul>
<li>주문할 때 <strong>"싱겁게 해주세요"</strong>라고 말해요.</li>
<li>라면은 <strong>스프를 반만</strong> 넣고 국물은 남겨요.</li>
<li>찌개와 탕은 국물보다 건더기를 먹어요.</li>
<li>영양성분표에서 <strong>나트륨 %</strong>를 보고 같은 종류 중 낮은 제품을 골라요.</li>
<li>햄, 소시지, 어묵은 끓는 물에 데치면 나트륨이 조금 빠져요.</li>
<li>채소와 과일을 곁들여 <strong>칼륨</strong>을 늘리면 나트륨 배출을 도와요. 단, 콩팥병이 있다면 의사와 상의해요.</li>
</ul>

<h2>소금 종류에 따라 다를까</h2>
<p>천일염, 죽염, 히말라야 핑크 소금, 맛소금 모두 주성분은 염화나트륨이에요. 미네랄이 조금 더 들어 있다고 해도 그 양은 아주 적어서 건강상의 차이를 만들 만큼은 아니에요. <strong>어떤 소금이냐보다 얼마나 쓰느냐</strong>가 중요해요. 칼륨으로 일부를 바꾼 저염 소금은 나트륨을 실제로 줄이지만, 콩팥병이나 일부 혈압약을 먹는 사람은 주의가 필요해요.</p>

<div class="box note"><span class="h">나트륨을 너무 적게 먹어도 문제일까</span>
<p>일반적인 한국 식단에서 나트륨이 부족해지는 경우는 드물어요. 다만 한여름 야외에서 땀을 많이 흘리며 오래 일하거나 운동하는 경우에는 물과 함께 전해질을 보충해야 해요. 또 일부 질환이나 약 때문에 저나트륨혈증이 생길 수 있는데, 이는 음식보다 몸의 조절 문제인 경우가 많아요.</p></div>

<div class="box"><span class="h">2주 싱겁게 먹기 도전</span>
<ol>
<li>국그릇을 작은 것으로 바꾸기</li>
<li>라면 스프 반만, 국물 남기기</li>
<li>식탁 위 소금통과 간장병 치우기</li>
<li>외식 주문 시 "싱겁게" 말하기</li>
<li>가공식품은 영양성분표에서 나트륨 확인하기</li>
<li>2주 뒤 예전에 먹던 음식을 먹어보고 맛 비교하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>김치를 먹으면 나트륨이 너무 많지 않나요?</dt>
<dd>김치는 식이섬유와 유산균이 있는 좋은 음식이지만 나트륨도 있어요. 한 끼에 몇 조각 정도로 양을 정하고, 덜 짜게 담그거나 겉절이처럼 가볍게 먹는 방법이 있어요.</dd>
<dt>짜게 먹고 물을 많이 마시면 괜찮나요?</dt>
<dd>물을 마시면 소변으로 나트륨이 조금 더 나가지만, 먹은 나트륨의 영향을 없애지는 못해요. 먹는 양 자체를 줄이는 게 근본적인 방법이에요.</dd>
<dt>저혈압인데 짜게 먹어도 되나요?</dt>
<dd>저혈압으로 어지러움이 있는 일부 사람에게 의사가 소금을 조금 더 먹도록 권하기도 해요. 하지만 스스로 판단하지 말고 원인을 먼저 확인해요.</dd>
</dl>

<p class="lead">담배를 끊는 건 의지가 약해서 어려운 게 아니에요. 니코틴은 강한 중독성을 가진 물질이라, 뇌가 적응한 상태를 되돌리는 데 시간과 방법이 필요해요. 방법을 알고 도움을 받으면 성공률이 크게 올라가요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>금연 <strong>20분</strong> 뒤 심박과 혈압이 내려가고, <strong>1년</strong> 뒤 관상동맥질환 위험이 절반으로 줄어요.</li>
<li>금단 증상은 <strong>첫 1~2주</strong>에 가장 심하고, 흡연 욕구는 <strong>몇 분</strong> 지나면 가라앉아요.</li>
<li>의지만으로 끊는 것보다 <strong>약과 상담을 함께</strong> 할 때 성공률이 몇 배 높아요.</li>
<li><strong>보건소 금연클리닉</strong>과 <strong>금연상담전화(1544-9030)</strong>는 무료예요.</li>
</ul></div>

<h2>담배를 끊으면 몸은 이렇게 변해요</h2>
<div class="tbl"><table>
<thead><tr><th>금연 후</th><th>몸의 변화</th></tr></thead>
<tbody>
<tr><td>20분</td><td>심박수와 혈압이 내려가요.</td></tr>
<tr><td>12시간</td><td>혈중 일산화탄소가 정상 수준으로 떨어져요.</td></tr>
<tr><td>2~12주</td><td>혈액순환이 좋아지고 폐 기능이 나아져요.</td></tr>
<tr><td>1~9개월</td><td>기침과 숨참이 줄어들어요.</td></tr>
<tr><td>1년</td><td>관상동맥질환 위험이 흡연자의 약 절반으로 줄어요.</td></tr>
<tr><td>5~15년</td><td>뇌졸중 위험이 비흡연자 수준으로 낮아져요.</td></tr>
<tr><td>10년</td><td>폐암 사망 위험이 흡연자의 약 절반으로 줄어요.</td></tr>
<tr><td>15년</td><td>관상동맥질환 위험이 비흡연자와 비슷해져요.</td></tr>
</tbody>
<caption>세계보건기구(WHO) 금연의 건강 효과 자료</caption></table></div>
<p>어느 나이에 끊어도 이득이 있어요. 연구에 따르면 30대에 끊으면 흡연으로 잃을 수명의 대부분을 되찾고, 60대에 끊어도 수명이 늘어나요.</p>

<h2>니코틴 금단 증상</h2>
<p>니코틴은 뇌에서 도파민을 분비시켜 기분을 좋게 만들어요. 뇌는 니코틴이 있는 상태에 적응해서, 니코틴이 끊기면 불편한 증상이 나타나요.</p>
<ul>
<li>강한 흡연 욕구</li>
<li>짜증, 불안, 초조함</li>
<li>집중력 저하</li>
<li>잠이 잘 안 오거나 자주 깸</li>
<li>식욕 증가</li>
<li>우울감</li>
</ul>
<p>금단 증상은 끊은 뒤 <strong>처음 며칠에서 1~2주 사이</strong>가 가장 심하고, 대부분 <strong>2~4주</strong>에 걸쳐 줄어들어요. 흡연 욕구는 가끔 오래 이어질 수 있지만, 한 번 밀려온 욕구는 <strong>3~5분</strong> 정도 지나면 가라앉아요. 그 몇 분을 넘기는 방법을 준비해 두면 돼요.</p>

<h2>흡연 욕구가 밀려올 때 4D</h2>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>실천</th></tr></thead>
<tbody>
<tr><td>Delay (미루기)</td><td>"5분만 참아보자." 욕구는 파도처럼 지나가요.</td></tr>
<tr><td>Deep breathing (심호흡)</td><td>코로 깊게 들이마시고 입으로 천천히 내쉬기를 몇 번 반복해요.</td></tr>
<tr><td>Drink water (물 마시기)</td><td>찬물을 천천히 마시거나 양치해요.</td></tr>
<tr><td>Do something else (다른 일 하기)</td><td>자리를 옮기고, 걷고, 손을 쓰는 일을 해요.</td></tr>
</tbody></table></div>

<h2>약과 상담: 성공률을 높이는 방법</h2>
<p>의지만으로 금연을 시도했을 때 1년 뒤까지 성공하는 비율은 한 자릿수로 낮다고 알려져 있어요. 반면 <strong>금연 약물과 상담을 함께</strong> 하면 성공률이 여러 배 높아져요. 금연은 도움을 받는 게 당연한 일이에요.</p>
<div class="tbl"><table>
<thead><tr><th>약물</th><th>작용</th><th>특징</th></tr></thead>
<tbody>
<tr><td>니코틴 대체요법 (패치, 껌, 사탕)</td><td>담배 없이 니코틴을 조금씩 공급해 금단 증상을 줄여요</td><td>약국에서 살 수 있어요. 패치(바탕)와 껌·사탕(갑작스러운 욕구)을 <strong>함께 쓰면</strong> 효과가 더 좋아요</td></tr>
<tr><td>바레니클린 성분 약</td><td>뇌의 니코틴 수용체에 작용해 욕구와 흡연의 만족감을 줄여요</td><td>전문의약품. 금연 성공률을 높이는 효과가 큰 편이에요</td></tr>
<tr><td>부프로피온</td><td>금단 증상과 흡연 욕구를 줄여요</td><td>전문의약품. 경련 병력이 있으면 쓰지 않아요</td></tr>
</tbody></table></div>
<p>약은 보통 금연일 1~2주 전부터 시작하거나(바레니클린 등) 금연일부터 쓰고(니코틴 대체요법), 8~12주 정도 사용해요.</p>

<h2>무료로 도움받는 곳</h2>
<ul>
<li><strong>보건소 금연클리닉:</strong> 6개월 동안 금연 상담과 니코틴 대체요법 제품을 무료로 지원해요. 가까운 보건소에 등록하면 돼요.</li>
<li><strong>건강보험 금연치료 지원:</strong> 참여 병·의원에서 12주 프로그램으로 상담과 금연 약물 비용을 지원받을 수 있어요. 끝까지 이수하면 본인 부담이 크게 줄어요.</li>
<li><strong>금연상담전화 1544-9030:</strong> 전화로 전문 상담사의 상담을 받을 수 있어요.</li>
<li><strong>금연길라잡이</strong> 사이트와 앱에서 금연 계획을 세우고 기록할 수 있어요.</li>
</ul>

<h2>금연 준비 5단계</h2>
<div class="box"><span class="h">금연 계획 세우기</span>
<ol>
<li><strong>금연일 정하기:</strong> 2주 안의 날짜로 정하고 주변에 알려요.</li>
<li><strong>나의 흡연 신호 적기:</strong> 아침 커피, 식후, 술자리, 스트레스 받을 때처럼 담배를 찾게 되는 순간을 적어요.</li>
<li><strong>대체 행동 정하기:</strong> 식후에는 바로 양치, 커피 대신 차, 술자리는 한동안 피하기.</li>
<li><strong>환경 정리:</strong> 금연일 전날 담배, 라이터, 재떨이를 모두 버려요.</li>
<li><strong>도움 요청:</strong> 보건소나 병원, 금연상담전화에 등록해요.</li>
</ol></div>

<h2>금연 후 체중 증가</h2>
<p>금연하면 평균 몇 kg 정도 체중이 느는 경우가 많아요. 니코틴이 식욕을 억제하고 대사를 약간 높였던 효과가 사라지고, 입이 심심해 간식이 늘기 때문이에요. 하지만 <strong>체중이 조금 늘어도 금연의 건강 이득이 훨씬 커요.</strong> 물, 무가당 껌, 채소 스틱을 가까이 두고, 걷기를 시작하면 체중 증가를 줄일 수 있어요.</p>

<h2>한 번 피웠다면</h2>
<p>금연 중에 한 대를 피웠다고 실패한 게 아니에요. 대부분의 사람은 여러 번 시도한 끝에 성공해요. 한 대를 피운 상황을 돌아보고(술자리였는지, 스트레스였는지) 다음에 어떻게 대처할지 정한 뒤 바로 다시 금연을 이어가요. "어차피 피웠으니"라며 다시 피우기 시작하는 게 가장 큰 위험이에요.</p>

<h2>전자담배는 덜 해로울까</h2>
<ul>
<li><strong>궐련형 전자담배</strong>(가열 담배)는 연기가 적어 덜 해롭다고 광고되지만, 니코틴과 여러 유해물질이 나와요. 식품의약품안전처 분석에서도 유해물질이 검출됐고, 건강 위험이 낮다는 근거는 충분하지 않아요.</li>
<li><strong>액상형 전자담배</strong>도 니코틴 중독을 유지시키고, 장기적인 건강 영향은 아직 충분히 알려지지 않았어요.</li>
<li>일반 담배와 전자담배를 <strong>함께 피우는 이중 흡연</strong>이 흔한데, 이 경우 해로움이 줄지 않아요.</li>
</ul>
<p>국내 보건당국은 전자담배를 금연 방법으로 권하지 않아요. 효과가 확인된 금연 약물과 상담을 먼저 이용하는 게 좋아요.</p>

<div class="box warn"><span class="h">간접흡연과 3차 흡연</span>
<p>흡연자가 내뿜는 연기(간접흡연)뿐 아니라, 담배 연기의 유해물질이 옷, 머리카락, 벽, 소파, 차 안에 남아 다른 사람에게 노출되는 <strong>3차 흡연</strong>도 문제예요. 특히 아기와 어린이는 바닥과 물건을 만지고 입에 넣기 때문에 더 많이 노출돼요. 밖에서 피우고 들어와도 완전히 안전하지 않아요.</p></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>갑자기 끊는 게 좋나요, 서서히 줄이는 게 좋나요?</dt>
<dd>금연일을 정해 한 번에 끊는 방법이 조금 더 성공률이 높다는 연구가 있지만, 서서히 줄이다 끊는 것도 방법이에요. 중요한 건 '끊는 날'을 정하고 도움을 받는 거예요.</dd>
<dt>하루 몇 개비만 피우면 괜찮지 않나요?</dt>
<dd>하루 1~5개비만 피워도 심혈관 질환 위험이 크게 올라간다는 연구가 있어요. 담배는 줄이는 것만으로는 위험이 비례해 줄지 않아요. 완전히 끊는 게 목표예요.</dd>
<dt>금연하면 기침이 더 심해진 것 같아요.</dt>
<dd>금연 초기에 기관지의 섬모가 회복되면서 쌓인 가래를 내보내느라 기침이 늘 수 있어요. 보통 몇 주면 좋아져요. 몇 주 넘게 계속되거나 피가 섞이면 진료를 받아요.</dd>
</dl>

<h2>참고 자료</h2>
<ul class="refs">
<li>세계보건기구(WHO), Health benefits of smoking cessation</li>
<li>보건복지부·한국건강증진개발원, 금연길라잡이 및 보건소 금연클리닉 안내</li>

</ul>

  data-title="지진·태풍·호우·폭염 행동요령: 재난 문자가 울렸을 때 바로 할 일"
  data-thumb="72h|비상용품 기준"
  data-summary="재난은 준비한 만큼 피해가 줄어요. 지진이 났을 때 흔들리는 동안과 멈춘 뒤의 행동, 태풍 때 창문 테이프보다 효과적인 방법, 지하 공간 침수의 위험, 폭염 특보 기준, 3일을 버틸 비상용품 목록과 가족 재난 계획을 정리했어요."
  data-tags="재난대비,지진,태풍,폭염,비상용품">
<p class="lead">재난 문자가 울리면 무엇부터 해야 할지 몰라 휴대폰만 보게 되는 경우가 많아요. 몇 가지 원칙만 알아두면 그 몇 분이 달라져요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>지진이 나면 흔들리는 동안 <strong>탁자 아래에서 머리를 보호</strong>하고, 멈추면 <strong>계단으로 넓은 곳</strong>으로 대피해요.</li>
<li>태풍 때 창문에 테이프를 붙이는 것보다 <strong>창틀과 유리 사이 틈을 고정</strong>하는 게 효과적이에요.</li>
<li>호우 때 <strong>지하 공간</strong>에 물이 들어오기 시작하면 즉시 나와요. 무릎까지 차면 문을 열기 어려워요.</li>
<li>비상용품은 <strong>최소 3일</strong>을 버틸 수 있게 준비해요.</li>
</ul></div>

<h2>지진</h2>
<h3>흔들리는 동안</h3>
<ul>
<li><strong>튼튼한 탁자 아래</strong>로 들어가 다리를 꽉 잡고 머리를 보호해요. 탁자가 없다면 방석이나 가방으로 머리를 감싸고 몸을 낮춰요.</li>
<li>창문, 유리, 액자, 책장처럼 떨어지거나 깨질 수 있는 것에서 떨어져요.</li>
<li>흔들리는 동안 밖으로 뛰어나가지 않아요. 떨어지는 유리와 간판에 다칠 수 있어요.</li>
<li>엘리베이터 안이라면 <strong>모든 층 버튼을 눌러</strong> 가장 먼저 멈추는 층에서 내리고 계단을 이용해요.</li>
</ul>
<h3>흔들림이 멈추면</h3>
<ol>
<li><strong>가스와 전기</strong>를 차단하고, 불이 났다면 바로 꺼요.</li>
<li>문을 열어 <strong>출구를 확보</strong>해요. 건물이 뒤틀리면 문이 열리지 않을 수 있어요.</li>
<li>신발을 신어요. 깨진 유리가 흩어져 있을 수 있어요.</li>
<li><strong>계단</strong>을 이용해 밖으로 나가요. 엘리베이터는 타지 않아요.</li>
<li>건물, 담장, 전봇대에서 떨어진 <strong>넓은 공터나 운동장</strong>으로 가요.</li>
<li>라디오, 재난 문자, 공식 안내를 확인하고 <strong>여진</strong>에 대비해요.</li>
</ol>
<h3>상황별 행동</h3>
<div class="tbl"><table>
<thead><tr><th>장소</th><th>행동</th></tr></thead>
<tbody>
<tr><td>운전 중</td><td>비상등을 켜고 속도를 줄여 도로 오른쪽에 세워요. 대피할 때는 차 키를 꽂아두고 걸어서 이동해요.</td></tr>
<tr><td>대형 매장, 극장</td><td>진열대나 조명에서 떨어져 가방으로 머리를 보호하고, 흔들림이 멈추면 안내에 따라 차분히 대피해요.</td></tr>
<tr><td>해안가</td><td>지진해일(쓰나미) 특보가 없더라도 <strong>높은 곳</strong>으로 빨리 이동해요.</td></tr>
<tr><td>산이나 경사지</td><td>산사태, 낙석 위험이 있는 곳에서 벗어나요.</td></tr>
</tbody>
<caption>행정안전부 국민재난안전포털 지진 행동요령</caption></table></div>

<h2>태풍</h2>
<h3>오기 전에</h3>
<ul>
<li>기상특보와 태풍 경로를 확인해요.</li>
<li>하수구와 배수구를 청소해 물이 잘 빠지게 해요.</li>
<li>베란다와 옥상의 화분, 간판처럼 날아갈 수 있는 물건을 치우거나 고정해요.</li>
<li><strong>창문 테이프는 효과가 적어요.</strong> 행정안전부는 테이프 대신 <strong>창틀과 유리 사이의 틈을 고정</strong>하고, 창문이 흔들리지 않게 잠그는 것을 권해요.</li>
<li>정전에 대비해 손전등, 보조배터리를 충전해 둬요.</li>
</ul>
<h3>태풍이 지나가는 동안</h3>
<ul>
<li>외출을 자제하고, 창문에서 떨어진 곳에 머물러요.</li>
<li>강한 바람이 부는 해안가, 방파제, 하천변에는 가지 않아요.</li>
<li>공사장, 간판, 가로수 근처를 피해요.</li>
</ul>

<h2>호우와 침수</h2>
<div class="box warn"><span class="h">지하 공간은 가장 위험한 곳이 될 수 있어요</span>
<ul>
<li>지하주차장, 지하상가, 반지하 주택에 물이 들어오기 시작하면 <strong>즉시 지상으로</strong> 나와요.</li>
<li>물이 <strong>무릎 높이</strong>까지 차면 수압 때문에 문을 열기 매우 어려워져요. 망설이지 않아요.</li>
<li>침수가 시작된 지하주차장에 <strong>차를 빼러 들어가지 않아요.</strong> 차보다 사람이 먼저예요.</li>
<li>물이 차오르는 도로나 지하차도에는 진입하지 않아요. 차가 물에 잠기기 시작하면 차를 버리고 높은 곳으로 대피해요.</li>
</ul></div>
<ul>
<li>하천변, 계곡, 산책로는 비가 그친 뒤에도 물이 불어날 수 있어요. 가까이 가지 않아요.</li>
<li>물에 잠긴 도로의 <strong>맨홀</strong>이 열려 있을 수 있어요. 물속을 걷지 않아요.</li>
<li>가로등, 신호등, 전신주 근처 물웅덩이는 <strong>감전</strong> 위험이 있어요.</li>
<li>산 가까이에 산다면 경사면에서 물이 솟거나, 나무가 기울거나, 땅이 갈라지는 산사태 징후에 주의해요.</li>
</ul>

<h2>폭염</h2>
<div class="tbl"><table>
<thead><tr><th>특보</th><th>기준</th></tr></thead>
<tbody>
<tr><td>폭염주의보</td><td>일 최고체감온도 33°C 이상이 2일 이상 지속될 것으로 예상</td></tr>
<tr><td>폭염경보</td><td>일 최고체감온도 35°C 이상이 2일 이상 지속될 것으로 예상</td></tr>
</tbody>
<caption>기상청 폭염특보 기준</caption></table></div>
<ul>
<li>가장 더운 <strong>낮 12시~오후 5시</strong>에는 야외 활동을 줄여요.</li>
<li>목이 마르지 않아도 <strong>물을 자주</strong> 마셔요.</li>
<li>에어컨이 없는 집이라면 지역의 <strong>무더위쉼터</strong>를 이용해요.</li>
<li>혼자 사는 어르신, 만성질환자 이웃의 안부를 확인해요.</li>
<li>어지러움, 두통, 구역질이 생기면 바로 시원한 곳에서 쉬어요. 의식이 흐려지면 119에 연락해요.</li>
</ul>

<h2>비상용품 준비</h2>
<p>큰 재난이 나면 구조와 물자 지원이 닿기까지 시간이 걸려요. <strong>최소 3일(72시간)</strong>을 스스로 버틸 수 있는 물품을 준비해 두면 좋아요.</p>
<div class="tbl"><table>
<thead><tr><th>분류</th><th>준비물</th></tr></thead>
<tbody>
<tr><td>물과 식량</td><td>생수 (1인 하루 약 3L 기준으로 3일분), 조리 없이 먹을 수 있는 비상식량</td></tr>
<tr><td>조명과 통신</td><td>손전등, 여분 배터리, 휴대용 라디오, 보조배터리</td></tr>
<tr><td>건강</td><td>상비약, 복용 중인 약 며칠분, 구급용품, 마스크</td></tr>
<tr><td>위생</td><td>물티슈, 휴지, 위생용품, 비닐봉지</td></tr>
<tr><td>생존용품</td><td>호루라기, 담요나 은박 담요, 목장갑, 우비, 여벌 옷</td></tr>
<tr><td>중요 정보</td><td>신분증 사본, 가족 연락처 메모, 약간의 현금</td></tr>
</tbody>
<caption>행정안전부 비상대비 물품 안내를 바탕으로 정리. 영유아, 노인, 반려동물이 있다면 필요한 물품을 추가해요.</caption></table></div>
<p>가방 하나에 담아 현관 가까이 두고, 물과 식량, 배터리는 반년에 한 번 유통기한을 확인해요.</p>

<h2>가족 재난 계획</h2>
<div class="box"><span class="h">가족과 함께 정할 것</span>
<ol>
<li>집 근처 <strong>대피소와 무더위쉼터</strong> 위치 확인하기 (국민재난안전포털, 안전디딤돌 앱)</li>
<li>휴대폰이 안 될 때 <strong>만날 장소</strong> 두 곳 정하기 (집 근처, 동네 밖)</li>
<li>가족 연락처를 종이에 적어 지갑과 가방에 넣기</li>
<li>가스·전기·수도 차단 방법을 가족 모두가 알기</li>
<li>도움이 필요한 가족(어르신, 장애인, 영유아)을 누가 챙길지 정하기</li>
<li>재난 문자 수신 설정 확인하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>지진 때 문틀 아래에 서 있으면 안전한가요?</dt>
<dd>예전에는 그렇게 알려졌지만, 요즘 집의 문틀은 다른 부분보다 특별히 튼튼하지 않아요. 튼튼한 탁자 아래에서 머리를 보호하는 것이 권장돼요.</dd>
<dt>아파트에서 지진이 나면 무조건 밖으로 나가야 하나요?</dt>
<dd>흔들리는 동안에는 실내에서 몸을 보호하고, 흔들림이 멈춘 뒤 건물에 균열이 생기거나 가스 냄새가 나는 등 위험이 있다면 계단으로 대피해요. 관리사무소 방송과 공식 안내를 함께 확인해요.</dd>
<dt>재난 문자가 너무 자주 와서 꺼두었어요.</dt>
<dd>위급재난문자와 긴급재난문자는 생명과 직결된 정보예요. 안전안내문자는 꺼두더라도 위급·긴급 문자는 켜두는 것을 권해요.</dd>
</dl>

<li>기상청, 폭염특보 기준</li>
<li>행정안전부, 비상대비 생활안전 물품 안내</li>
<li>소방청, 재난 대비 생활 안전 수칙</li>
</ul>

<template data-id="headache" data-cat="dis" data-date="2026.09.29"
  data-title="두통의 종류와 대처: 편두통과 긴장형 두통 구별, 진통제가 두통을 만드는 경우, 위험 신호"
  data-thumb="15일|진통제 과용 기준"
  data-summary="두통은 누구나 겪지만 종류에 따라 대처가 달라요. 가장 흔한 긴장형 두통, 일상을 무너뜨리는 편두통, 극심한 군발두통의 특징과 치료, 진통제를 너무 자주 먹어서 생기는 약물과용두통, 바로 응급실에 가야 하는 두통의 신호를 정리했어요."
  data-tags="두통,편두통,긴장형두통,진통제,신경과">
<p class="lead">두통의 대부분은 뇌에 병이 있어서가 아니라 두통 자체가 병인 '일차성 두통'이에요. 하지만 드물게 뇌출혈이나 뇌수막염 같은 위험한 병의 신호일 수 있어서, 구별하는 법을 아는 게 중요해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>가장 흔한 건 <strong>머리를 조이는 긴장형 두통</strong>, 일상을 멈추게 하는 건 <strong>편두통</strong>이에요.</li>
<li>편두통 약은 <strong>두통 초기에</strong> 먹어야 효과가 좋아요.</li>
<li>진통제를 <strong>한 달에 10~15일 이상</strong> 먹으면 오히려 두통이 늘어나는 약물과용두통이 생길 수 있어요.</li>
<li><strong>갑자기 터지는 듯한 극심한 두통</strong>, 마비나 말 어눌함이 동반된 두통은 바로 119예요.</li>
</ul></div>

<h2>일차성 두통의 세 가지</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>긴장형 두통</th><th>편두통</th><th>군발두통</th></tr></thead>
<tbody>
<tr><td>위치</td><td>양쪽, 머리 전체나 뒷목</td><td>주로 한쪽 (양쪽도 가능)</td><td>한쪽 눈 주위, 관자놀이</td></tr>
<tr><td>느낌</td><td>조이거나 누르는 듯</td><td>욱신욱신 박동성</td><td>눈을 찌르거나 도려내는 듯</td></tr>
<tr><td>강도</td><td>가벼움~중간</td><td>중간~심함</td><td>매우 심함</td></tr>
<tr><td>지속</td><td>30분~며칠</td><td>4~72시간</td><td>15분~3시간, 하루 여러 번</td></tr>
<tr><td>동반 증상</td><td>거의 없음</td><td>메스꺼움·구토, 빛과 소리에 예민</td><td>같은 쪽 눈물, 콧물, 눈 충혈, 눈꺼풀 처짐</td></tr>
<tr><td>움직이면</td><td>그대로</td><td>더 심해짐</td><td>가만히 있지 못하고 서성임</td></tr>
<tr><td>특징</td><td>가장 흔함</td><td>여성에게 2~3배 많음</td><td>남성에게 많고, 특정 시기에 몰려서 옴</td></tr>
</tbody>
<caption>국제두통학회 두통 분류(ICHD-3)를 바탕으로 정리</caption></table></div>

<h2>편두통 제대로 알기</h2>
<p>편두통은 단순히 심한 두통이 아니라 뇌의 신경과 혈관이 관여하는 <strong>신경학적 질환</strong>이에요. 세계적으로 장애를 일으키는 주요 질환 중 하나로 꼽혀요.</p>
<h3>편두통의 단계</h3>
<ul>
<li><strong>전구 증상:</strong> 두통 하루 이틀 전 하품, 피로, 목 뻣뻣함, 특정 음식이 당김</li>
<li><strong>조짐(전조):</strong> 일부 사람에게 두통 전 5~60분 동안 번쩍이는 빛, 지그재그 선, 시야 일부가 안 보이는 증상이 나타나요.</li>
<li><strong>두통기:</strong> 욱신거리는 두통, 메스꺼움, 빛과 소리에 예민해짐</li>
<li><strong>회복기:</strong> 두통이 끝난 뒤 하루 정도 멍하고 피곤함</li>
</ul>
<h3>흔한 유발 요인</h3>
<ul>
<li>수면 부족이나 너무 많이 잠, 불규칙한 수면</li>
<li>끼니 거르기</li>
<li>스트레스, 또는 스트레스가 풀린 주말</li>
<li>월경 주기</li>
<li>술(특히 레드와인), 카페인을 갑자기 끊음</li>
<li>강한 빛, 냄새, 날씨 변화</li>
</ul>
<p>유발 요인은 사람마다 달라요. 두통 일기를 쓰면 나만의 패턴을 찾을 수 있어요.</p>

<h2>편두통 치료</h2>
<h3>급성기 치료: 빨리, 충분히</h3>
<ul>
<li>가벼운 편두통에는 <strong>소염진통제(이부프로펜, 나프록센 등)나 아세트아미노펜</strong>을 써요.</li>
<li>중간 이상이면 편두통 전용 약인 <strong>트립탄</strong> 계열을 써요. 두통이 심해진 뒤보다 <strong>시작 초기</strong>에 먹을 때 효과가 훨씬 좋아요.</li>
<li>트립탄을 쓰기 어려운 사람(심혈관 질환 등)을 위한 새로운 계열의 약도 있어요.</li>
<li>메스꺼움이 심하면 구토 억제제를 함께 써요.</li>
<li>어둡고 조용한 곳에서 쉬는 것도 도움이 돼요.</li>
</ul>
<h3>예방 치료: 이럴 때 고려해요</h3>
<ul>
<li>편두통이 <strong>한 달에 4일 이상</strong>이거나 일상생활에 큰 지장을 줄 때</li>
<li>급성기 약이 잘 듣지 않거나 쓰기 어려울 때</li>
</ul>
<p>혈압약(베타 차단제, 칸데사르탄), 항경련제(토피라메이트 등), 저용량 항우울제(아미트립틸린) 같은 약을 매일 먹거나, 편두통 발생에 관여하는 물질(CGRP)을 막는 주사제를 한 달에 한 번 정도 맞는 방법이 있어요. 만성 편두통에는 보톡스 주사도 쓰여요. 신경과에서 상담해요.</p>

<h2>진통제가 두통을 만든다: 약물과용두통</h2>
<p>두통이 잦아 진통제를 자주 먹으면, 어느 순간 <strong>약 때문에 두통이 더 자주 생기는</strong> 악순환이 생길 수 있어요.</p>
<div class="box warn"><span class="h">약물과용두통 기준</span>
<p>원래 두통이 있던 사람이 <strong>3개월 넘게</strong> 아래처럼 약을 먹으면서, 두통이 <strong>한 달에 15일 이상</strong> 생긴다면 의심해요.</p>
<ul>
<li>아세트아미노펜, 이부프로펜 같은 단일 진통제를 한 달에 <strong>15일 이상</strong></li>
<li>트립탄이나 여러 성분이 섞인 복합 진통제(카페인 포함 등)를 한 달에 <strong>10일 이상</strong></li>
</ul>
<p>치료는 과용한 약을 줄이거나 끊는 것이에요. 처음 몇 주는 두통이 더 심해질 수 있어 신경과의 도움을 받으며 예방 치료를 함께 시작하는 게 좋아요.</p></div>

<h2>긴장형 두통 관리</h2>
<ul>
<li>대부분 일반 진통제로 좋아지지만, 자주 먹지 않도록 주의해요.</li>
<li>오래 같은 자세로 일한다면 30~60분마다 자세를 바꾸고 목과 어깨를 스트레칭해요.</li>
<li>규칙적인 운동, 충분한 수면, 스트레스 관리가 예방에 도움이 돼요.</li>
<li>자주 반복된다면(한 달 15일 이상) 저용량 예방약을 고려해요.</li>
</ul>

<h2>군발두통</h2>
<p>한쪽 눈 주위에 '인간이 겪는 가장 심한 통증' 중 하나로 표현될 만큼 극심한 통증이 몇 주~몇 달 동안 거의 매일 같은 시간대에 반복돼요. 발작 때는 <strong>고농도 산소 흡입</strong>이나 트립탄 주사·코 스프레이가 효과적이고, 몰려오는 시기에는 예방약을 써요. 의심되면 신경과 진료를 받아요.</p>

<h2>바로 응급실로 가야 하는 두통</h2>
<div class="box warn"><span class="h">이런 두통은 119에 연락하세요</span>
<ul>
<li><strong>갑자기 터지는 듯</strong>, 1분 안에 최고조에 이른 극심한 두통 ('벼락두통', 뇌출혈 가능성)</li>
<li>두통과 함께 <strong>한쪽 팔다리 마비, 말이 어눌함, 얼굴 비뚤어짐, 시야 이상</strong></li>
<li>두통과 <strong>고열, 목이 뻣뻣함</strong>, 발진, 의식 저하 (뇌수막염 가능성)</li>
<li>머리를 다친 뒤 점점 심해지는 두통, 반복되는 구토, 졸림</li>
<li>경련이 함께 있음</li>
</ul></div>
<h3>빨리 진료를 받아야 하는 두통</h3>
<ul>
<li><strong>50세 이후 처음</strong> 생긴 두통, 또는 평소와 전혀 다른 양상의 두통</li>
<li>몇 주에 걸쳐 <strong>점점 심해지는</strong> 두통</li>
<li>기침, 힘주기, 눕거나 일어날 때 심해지는 두통</li>
<li>아침에 깨자마자 심하고 구토가 동반되는 두통</li>
<li>암, 면역저하가 있는 사람의 새로운 두통</li>
<li>임신 중이거나 출산 직후의 심한 두통</li>
<li>노인의 관자놀이 통증과 씹을 때 턱 통증, 시력 저하 (측두동맥염 가능성)</li>
</ul>

<div class="box"><span class="h">두통 일기 쓰기</span>
<ol>
<li>두통이 시작된 날짜와 시간</li>
<li>위치, 느낌, 강도(0~10점), 지속 시간</li>
<li>함께 있었던 증상 (메스꺼움, 빛 예민함 등)</li>
<li>그날의 수면, 식사, 스트레스, 월경, 술</li>
<li>먹은 약과 효과</li>
<li>한 달에 진통제를 며칠 먹었는지 세어 보기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>혈압이 높으면 두통이 생기나요?</dt>
<dd>대부분의 고혈압은 두통을 일으키지 않아요. 두통이 없다고 혈압이 정상인 건 아니고, 두통이 있다고 혈압 때문인 것도 아니에요. 다만 혈압이 매우 높으면서 심한 두통이 있으면 응급 상황일 수 있어요.</dd>
<dt>커피를 마시면 두통이 나아지는데 괜찮나요?</dt>
<dd>카페인은 진통제의 효과를 높여 일부 두통약에도 들어 있어요. 하지만 매일 많이 마시다 끊으면 금단 두통이 생기고, 카페인이 든 복합 진통제를 자주 먹으면 약물과용두통의 원인이 될 수 있어요.</dd>
<dt>편두통이 있으면 뇌 MRI를 찍어야 하나요?</dt>
<dd>전형적인 편두통이고 신경학적 이상이 없다면 영상 검사가 꼭 필요하지는 않아요. 위험 신호가 있거나 양상이 변했을 때 의사가 판단해 검사해요.</dd>
</dl>

<h2>참고 자료</h2>
<ul class="refs">
<li>국제두통학회, International Classification of Headache Disorders 3rd edition (ICHD-3)</li>
<li>대한두통학회, 편두통 진료지침 및 두통 건강 정보</li>
<li>미국두통학회(AHS), Consensus Statement on Migraine Treatment (2021)</li>
<li>질병관리청 국가건강정보포털, 편두통·긴장형 두통</li>
</ul>

  data-tags="요오드,갑상선,해조류,미역국,다시마">
<p class="lead">세계보건기구는 요오드 결핍을 '예방 가능한 지적 장애의 가장 흔한 원인'으로 꼽아요. 그래서 많은 나라가 소금에 요오드를 넣어요. 한국은 조금 다른 상황이에요. 해조류 덕분에 부족보다 넘치는 쪽을 살펴야 해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인 권장섭취량은 하루 <strong>150μg</strong>, 한국인 상한섭취량은 <strong>2,400μg</strong>이에요.</li>
<li><strong>다시마</strong>는 적은 양에도 요오드가 매우 많고, 김은 상대적으로 적어요.</li>
<li>하시모토 갑상선염 같은 갑상선 질환이 있다면 <strong>해조류 추출물이나 보충제</strong>는 피하는 게 좋아요.</li>
<li>방사능 사고 대비로 해조류를 많이 먹는 건 효과도 없고 오히려 해로울 수 있어요.</li>
</ul></div>

<h2>요오드가 하는 일</h2>
<p>갑상선은 혈액에서 요오드를 끌어모아 <strong>갑상선 호르몬(T4, T3)</strong>을 만들어요. 이름의 숫자는 호르몬 한 분자에 붙은 요오드 원자의 개수예요. 갑상선 호르몬은 몸의 대사 속도를 조절하고, 특히 <strong>태아와 영아의 뇌 발달</strong>에 꼭 필요해요.</p>
<p>요오드가 부족하면 갑상선 호르몬을 충분히 만들지 못해 갑상선이 커지고(갑상선종), 임신 중 심하게 부족하면 아기의 뇌 발달에 영향을 줄 수 있어요.</p>

<h2>하루에 얼마나 필요할까</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th>권장섭취량</th><th>상한섭취량</th></tr></thead>
<tbody>
<tr><td>성인</td><td class="num">150μg</td><td class="num">2,400μg</td></tr>
<tr><td>임신부</td><td class="num">240μg</td><td class="num">-</td></tr>
<tr><td>수유부</td><td class="num">340μg</td><td class="num">-</td></tr>
</tbody>
<caption>보건복지부·한국영양학회, 2020 한국인 영양소 섭취기준. 한국인의 상한섭취량은 해조류 섭취 문화를 반영해 서구 기준(1,100μg)보다 높게 정해져 있어요.</caption></table></div>

<h2>해조류마다 함량이 크게 다르다</h2>
<p>요오드가 많은 식품은 바다에서 와요. 해조류, 생선과 조개, 그리고 달걀과 우유에도 조금 들어 있어요. 그런데 해조류 사이에서도 <strong>함량 차이가 매우 커요.</strong></p>
<div class="tbl"><table>
<thead><tr><th>식품</th><th>요오드 함량 (상대적)</th><th>메모</th></tr></thead>
<tbody>
<tr><td>다시마</td><td>매우 많음</td><td>마른 다시마 한 조각(몇 g)만으로도 하루 권장량의 수십 배가 될 수 있어요</td></tr>
<tr><td>미역</td><td>많음</td><td>미역국 한 그릇으로 하루 권장량을 크게 넘기는 경우가 많아요</td></tr>
<tr><td>김</td><td>보통</td><td>다시마나 미역보다 훨씬 적어요</td></tr>
<tr><td>생선, 조개류</td><td>보통</td><td>종류에 따라 달라요</td></tr>
<tr><td>달걀, 우유</td><td>적음</td><td></td></tr>
</tbody>
<caption>해조류의 요오드 함량은 품종, 산지, 가공·조리법에 따라 차이가 매우 커서 수치 대신 상대적으로 표시했어요.</caption></table></div>
<p>다시마로 육수를 우리면 요오드의 상당 부분이 국물로 녹아 나와요. 다시마 육수를 매일 진하게 쓰는 집이라면 이 점도 알아두면 좋아요.</p>
<p>국내에서 파는 소금은 대부분 요오드를 따로 넣지 않아요. 한국인의 요오드는 주로 해조류에서 와요.</p>

<h2>많이 먹으면 어떻게 될까</h2>
<p>건강한 갑상선은 요오드가 많이 들어와도 호르몬 생산을 스스로 조절해요. 그래서 가끔 해조류를 많이 먹는다고 문제가 되지는 않아요. 하지만 이런 경우에는 과잉 요오드가 갑상선 기능을 흔들 수 있어요.</p>
<ul>
<li><strong>하시모토 갑상선염</strong>이 있는 사람: 요오드를 많이 먹으면 기능 저하가 드러나거나 악화될 수 있어요.</li>
<li><strong>갑상선 결절</strong>이 있거나 과거 요오드 결핍 지역에 살았던 사람: 기능 항진이 생길 수 있어요.</li>
<li><strong>태아와 신생아</strong>: 갑상선 조절 능력이 미숙해 영향을 받기 쉬워요.</li>
<li>요오드 조영제를 쓰는 CT 검사, 요오드가 든 약(아미오다론)도 요오드 부하가 커요.</li>
</ul>
<div class="box warn"><span class="h">다시마 환, 해조류 추출물, 요오드 보충제는 조심하세요</span>
<p>다시마를 가루나 환으로 만든 제품, 해조류 추출 건강식품은 한 번에 매우 많은 요오드가 들어갈 수 있어요. 갑상선 기능 이상이 생긴 사례도 보고돼 있어요. 한국인은 식사로 요오드가 충분한 경우가 대부분이라 <strong>요오드 보충제는 필요하지 않은 경우가 많아요.</strong> 갑상선 질환이 있다면 특히 피해요.</p></div>

<h2>산모와 미역국</h2>
<p>출산 후 미역국을 먹는 전통은 오래됐어요. 미역에는 요오드와 여러 미네랄이 있어 좋은 음식이지만, <strong>하루 세 끼 큰 그릇으로 몇 주씩</strong> 먹으면 요오드 섭취가 매우 많아지고, 모유 속 요오드 농도도 크게 높아진다는 국내 연구가 있어요. 특히 <strong>미숙아</strong>는 갑상선 조절 능력이 약해 영향을 받을 수 있다는 보고가 있어요.</p>
<ul>
<li>미역국을 먹되 매 끼니 큰 그릇으로 오래 먹기보다 <strong>양과 횟수를 적당히</strong> 조절해요.</li>
<li>미숙아를 출산했거나 아기가 갑상선 검사에서 이상이 있었다면 의료진과 상의해요.</li>
</ul>
<p>반대로 임신 중에는 요오드 필요량이 늘어요. 해조류를 전혀 먹지 않는 식습관이라면 부족할 수도 있으니, 균형 있게 먹는 게 좋아요.</p>

<h2>방사능 사고와 요오드</h2>
<p>원전 사고가 나면 방사성 요오드가 퍼질 수 있고, 이것이 갑상선에 쌓이면 갑상선암 위험이 커져요. 이때 <strong>요오드화칼륨 약</strong>을 미리 먹으면 갑상선을 안정한 요오드로 채워 방사성 요오드가 덜 들어가게 해요.</p>
<ul>
<li>요오드화칼륨은 <strong>정부의 복용 지시가 있을 때만</strong> 정해진 용량을 먹어요. 미리 먹거나 오래 먹으면 부작용이 있어요.</li>
<li><strong>해조류나 요오드 소금으로는 필요한 양을 정확히 채울 수 없고</strong>, 과잉 섭취로 오히려 해로울 수 있어요.</li>
<li>원전 주변 지역에는 지자체가 요오드화칼륨을 비축하고 있어요.</li>
</ul>

<div class="box"><span class="h">요오드 균형 체크리스트</span>
<ol>
<li>미역, 다시마를 매일 많이 먹는지 식습관 돌아보기</li>
<li>다시마 환, 해조류 추출물 건강식품을 먹고 있는지 확인하기</li>
<li>갑상선 질환이 있다면 해조류는 일반 식사 수준으로, 보충제는 피하기</li>
<li>임신 중이라면 해조류를 적당히 포함한 균형 잡힌 식사하기</li>
<li>출산 후 미역국은 양과 횟수를 적당히</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>갑상선 수술을 받았는데 해조류를 먹으면 안 되나요?</dt>
<dd>갑상선 수술 후 호르몬제를 먹고 있다면 일반 식사로 먹는 해조류는 대개 괜찮아요. 다만 방사성 요오드 치료를 앞두고 있다면 치료 전 일정 기간 저요오드 식사를 해야 해서, 병원의 안내를 따라요.</dd>
<dt>김은 매일 먹어도 되나요?</dt>
<dd>김은 미역이나 다시마보다 요오드가 훨씬 적어서 반찬으로 먹는 정도는 대개 문제가 되지 않아요. 조미김은 나트륨이 있으니 양을 조절해요.</dd>
<dt>요오드가 부족하면 어떤 증상이 생기나요?</dt>
<dd>갑상선이 커지고, 피로, 추위 민감, 체중 증가 같은 갑상선 기능 저하 증상이 나타날 수 있어요. 하지만 한국 식단에서는 결핍이 드물어서, 이런 증상이 있다면 요오드보다 다른 갑상선 질환을 먼저 확인해요.</dd>
</dl>

  data-title="스트레스는 몸에 어떻게 쌓일까: 몸의 반응 원리와 효과가 확인된 관리법"
  data-thumb="4·6|들숨·날숨 초"
  data-summary="스트레스 자체는 나쁜 게 아니에요. 문제는 끝나지 않고 계속될 때예요. 스트레스를 받으면 몸에서 일어나는 일, 오래 쌓였을 때 나타나는 신호, 호흡·운동·수면·마음챙김처럼 효과가 확인된 관리법, 전문가의 도움이 필요한 때와 연락할 곳을 정리했어요."
  data-tags="스트레스,정신건강,호흡법,마음챙김,번아웃">
<p class="lead">발표 직전 심장이 빨리 뛰고 손에 땀이 나는 건 몸이 제대로 일하고 있다는 뜻이에요. 스트레스 반응은 위기를 넘기라고 몸이 준비한 장치예요. 이 장치가 꺼지지 않고 계속 켜져 있을 때 문제가 생겨요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>짧은 스트레스는 집중력과 힘을 주지만, <strong>만성 스트레스</strong>는 잠, 소화, 혈압, 면역, 기분을 흔들어요.</li>
<li>천천히 내쉬는 <strong>호흡</strong>은 몇 분 안에 몸의 긴장을 낮추는 가장 빠른 방법이에요.</li>
<li><strong>운동, 수면, 사람과의 연결</strong>이 가장 근거가 탄탄한 장기적 관리법이에요.</li>
<li>2주 넘게 일상이 무너질 만큼 힘들다면 <strong>도움을 요청할 때</strong>예요. 자살예방상담전화는 <strong>109</strong>예요.</li>
</ul></div>

<h2>스트레스를 받으면 몸에서 일어나는 일</h2>
<p>뇌가 위협을 감지하면 두 가지 경로가 동시에 켜져요.</p>
<ol>
<li><strong>교감신경:</strong> 몇 초 만에 아드레날린이 나와 심장이 빨리 뛰고, 혈압이 오르고, 호흡이 빨라지고, 근육에 혈액이 몰려요. '싸우거나 도망가기' 반응이에요.</li>
<li><strong>스트레스 호르몬 축:</strong> 조금 늦게 코르티솔이 나와 혈당을 올려 에너지를 공급하고, 당장 필요 없는 소화와 면역 기능은 잠시 줄여요.</li>
</ol>
<p>위협이 지나가면 부교감신경이 몸을 다시 쉬는 상태로 돌려놓아요. 그런데 업무, 돈, 관계, 돌봄처럼 <strong>끝나지 않는 스트레스</strong>가 이어지면 이 반응이 계속 켜진 채로 남아요.</p>

<h2>스트레스가 쌓였다는 신호</h2>
<div class="tbl"><table>
<thead><tr><th>몸</th><th>마음</th><th>행동</th></tr></thead>
<tbody>
<tr><td>두통, 뒷목과 어깨 뭉침</td><td>짜증, 예민함</td><td>술, 담배, 카페인이 늘어남</td></tr>
<tr><td>잠들기 어렵거나 자주 깸</td><td>불안, 걱정이 멈추지 않음</td><td>폭식하거나 입맛이 없어짐</td></tr>
<tr><td>소화불량, 설사나 변비</td><td>집중력과 기억력 저하</td><td>사람을 피하거나 혼자 있으려 함</td></tr>
<tr><td>잦은 감기, 피부 트러블</td><td>무기력, 의욕 저하</td><td>일을 미루거나 과하게 몰두함</td></tr>
<tr><td>가슴 두근거림, 혈압 상승</td><td>우울감</td><td>휴대폰, 영상에 오래 매달림</td></tr>
</tbody></table></div>

<h2>몇 분 안에 긴장을 낮추는 호흡</h2>
<p>호흡은 스스로 조절할 수 있는 거의 유일한 자율신경 기능이에요. <strong>날숨을 들숨보다 길게</strong> 하면 부교감신경이 활성화되어 심박이 느려지고 몸이 이완돼요.</p>
<div class="box note"><span class="h">4-6 호흡</span>
<ol>
<li>편하게 앉아 어깨 힘을 빼요.</li>
<li>코로 <strong>4초</strong> 동안 배가 부풀도록 들이마셔요.</li>
<li>입으로 <strong>6초</strong> 동안 천천히 내쉬어요.</li>
<li>이렇게 1분에 6번 정도의 속도로 <strong>3~5분</strong> 반복해요.</li>
</ol>
<p>숫자가 버겁다면 "들이마실 때보다 내쉴 때를 길게"만 기억해도 돼요. 어지러우면 잠시 멈추고 평소 호흡으로 돌아와요.</p></div>

<h2>근거가 탄탄한 장기 관리법</h2>
<h3>운동</h3>
<p>규칙적인 운동은 스트레스 호르몬 반응을 줄이고 기분을 좋게 하며 잠을 깊게 해요. 여러 연구에서 운동은 가벼운 우울과 불안 증상을 줄이는 효과가 확인됐어요. 거창할 필요 없이 <strong>빠르게 걷기 20~30분</strong>부터 시작해요.</p>
<h3>수면</h3>
<p>잠이 부족하면 감정을 조절하는 뇌 영역의 기능이 떨어져 같은 일에도 더 크게 반응해요. 스트레스가 심할수록 수면 시간을 먼저 지켜요. 매일 같은 시간에 일어나는 게 핵심이에요.</p>
<h3>사람과의 연결</h3>
<p>믿을 만한 사람에게 이야기하는 것만으로도 스트레스 반응이 줄어요. 사회적 고립은 흡연만큼 건강에 해롭다는 연구도 있어요. 짧은 안부 연락, 산책을 함께하는 것부터 시작해요.</p>
<h3>마음챙김</h3>
<p>지금 이 순간의 호흡, 몸의 감각, 떠오르는 생각을 판단하지 않고 알아차리는 연습이에요. 8주 과정의 마음챙김 기반 스트레스 감소 프로그램(MBSR) 등은 스트레스와 불안을 줄이는 효과가 여러 연구에서 보고됐어요. 하루 5~10분 앱이나 안내 음성을 따라 해보는 것부터 시작할 수 있어요.</p>
<h3>점진적 근육 이완</h3>
<ol>
<li>발가락부터 시작해 한 부위의 근육에 5초 동안 힘을 꽉 줘요.</li>
<li>힘을 탁 풀고 10초 동안 이완되는 느낌에 집중해요.</li>
<li>종아리, 허벅지, 배, 손, 팔, 어깨, 얼굴 순서로 올라가요.</li>
</ol>
<p>잠들기 전에 하면 긴장이 풀려 잠드는 데 도움이 돼요.</p>

<h2>생각을 다루는 기술</h2>
<ul>
<li><strong>걱정 시간 정하기:</strong> 하루 15분 정도 걱정하는 시간을 따로 정하고, 그 외 시간에 걱정이 떠오르면 "그건 걱정 시간에"라며 메모만 해둬요.</li>
<li><strong>바꿀 수 있는 것과 없는 것 나누기:</strong> 바꿀 수 있는 문제는 작은 행동 계획을 세우고, 바꿀 수 없는 문제는 받아들이는 연습을 해요.</li>
<li><strong>생각을 적어보기:</strong> 머릿속을 맴도는 생각을 종이에 적으면 한 걸음 떨어져 볼 수 있어요.</li>
<li><strong>완벽 대신 충분히:</strong> 모든 일을 100%로 하려 하면 쉽게 지쳐요. 우선순위를 정하고 일부는 80%로 괜찮다고 허락해요.</li>
</ul>

<h2>번아웃</h2>
<p>세계보건기구는 번아웃을 질병이 아니라 <strong>제대로 관리되지 않은 만성 직장 스트레스</strong>로 생기는 현상으로 정의해요. 세 가지 특징이 있어요.</p>
<ul>
<li>에너지가 바닥나고 지친 느낌</li>
<li>일에 대한 거리감, 냉소</li>
<li>일의 효율이 떨어짐</li>
</ul>
<p>번아웃은 개인의 노력만으로 해결되지 않는 경우가 많아요. 업무량, 역할, 휴식 구조를 조정하는 것이 함께 필요하고, 우울증이 함께 있는지도 살펴봐야 해요.</p>

<h2>도움이 필요한 때</h2>
<div class="box warn"><span class="h">이럴 때는 전문가의 도움을 받으세요</span>
<ul>
<li>우울하거나 불안한 상태가 <strong>2주 넘게</strong> 이어지며 일, 학업, 관계가 어려워졌어요.</li>
<li>잠이나 식욕이 크게 변했어요.</li>
<li>술이나 약에 기대는 날이 늘었어요.</li>
<li>공황처럼 갑자기 숨이 막히고 죽을 것 같은 느낌이 반복돼요.</li>
<li><strong>죽고 싶다는 생각</strong>이 들어요.</li>
</ul>
<p>정신건강의학과 진료, 지역 정신건강복지센터 상담을 받을 수 있어요. 지금 위기라면 <strong>자살예방상담전화 109</strong>, <strong>정신건강위기상담전화 1577-0199</strong>에 24시간 연락할 수 있고, 위급하면 119나 112에 연락해요.</p></div>

<div class="box"><span class="h">오늘 해볼 수 있는 것</span>
<ol>
<li>4-6 호흡 3분</li>
<li>점심 후 10분 걷기</li>
<li>오늘 잘한 일 한 가지 적기</li>
<li>보고 싶은 사람에게 안부 메시지 보내기</li>
<li>잠들기 한 시간 전 휴대폰 내려놓기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>스트레스를 받으면 왜 단 음식이 당기나요?</dt>
<dd>코르티솔은 식욕, 특히 고열량 음식에 대한 욕구를 높여요. 단 음식은 잠깐 기분을 좋게 하지만 금방 다시 떨어뜨려요. 배고픔인지 스트레스인지 잠깐 멈춰서 확인해 보는 것만으로도 도움이 돼요.</dd>
<dt>스트레스 때문에 병원에 가도 되나요?</dt>
<dd>물론이에요. 스트레스로 잠, 소화, 기분, 일상에 문제가 생겼다면 진료를 받을 충분한 이유가 돼요. 정신건강의학과 진료 기록이 불이익이 될까 걱정하는 경우가 많은데, 진료 기록은 본인 동의 없이 공개되지 않아요.</dd>
<dt>명상이 잘 안 돼요. 생각이 계속 떠올라요.</dt>
<dd>생각이 떠오르는 건 정상이에요. 명상은 생각을 없애는 게 아니라 생각이 떠올랐다는 걸 알아차리고 다시 호흡으로 돌아오는 연습이에요. 돌아오는 그 순간이 연습이 되는 거예요.</dd>
</dl>

  data-title="전월세 계약 전 꼭 확인할 것: 등기부등본 읽는 법부터 전입신고·보증보험까지"
  data-thumb="0시|대항력 발생"
  data-summary="보증금은 대부분의 사람에게 가장 큰 자산이에요. 계약 전 등기부등본의 갑구·을구 읽는 법, 깡통전세를 가늠하는 방법, 건축물대장과 임대인 세금 확인, 계약서 특약, 계약 후 전입신고·확정일자·보증보험, 문제가 생겼을 때 도움받을 곳을 정리했어요."
  data-tags="전세,월세,등기부등본,확정일자,전세보증보험">
<p class="lead">전세 사기 피해가 잇따르면서 계약 전 확인할 것들이 많아졌어요. 복잡해 보이지만 순서대로 하나씩 확인하면 대부분의 위험을 걸러낼 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>계약 전, 계약 당일, 잔금일에 <strong>등기부등본을 세 번</strong> 확인해요.</li>
<li><strong>선순위 대출(근저당) + 내 보증금</strong>이 집값에 가까울수록 위험해요.</li>
<li>입주하면 바로 <strong>전입신고와 확정일자</strong>를 받아요. 대항력은 전입신고 <strong>다음 날 0시</strong>에 생겨요.</li>
<li>가능하면 <strong>전세보증금 반환보증</strong>에 가입해요.</li>
</ul></div>

<h2>1단계: 등기부등본 읽기</h2>
<p>등기부등본(정식 명칭은 등기사항전부증명서)은 그 집의 주인과 빚을 보여주는 서류예요. <strong>대법원 인터넷등기소</strong>에서 누구나 적은 수수료로 열람할 수 있어요.</p>
<div class="tbl"><table>
<thead><tr><th>부분</th><th>담긴 내용</th><th>확인할 것</th></tr></thead>
<tbody>
<tr><td>표제부</td><td>주소, 면적, 구조</td><td>계약하려는 집의 주소·동·호수가 정확한지</td></tr>
<tr><td>갑구</td><td>소유권에 관한 사항</td><td>현재 소유자가 계약하는 사람과 같은지. <strong>압류, 가압류, 가처분, 경매개시결정, 신탁</strong>이 있으면 매우 위험</td></tr>
<tr><td>을구</td><td>소유권 외 권리 (빚)</td><td><strong>근저당권의 채권최고액</strong>, 전세권, 임차권등기 여부</td></tr>
</tbody></table></div>
<ul>
<li><strong>근저당권 채권최고액</strong>은 실제 대출금보다 보통 120~130% 정도 높게 잡혀요. 이 금액이 내 보증금보다 먼저 돌려받는 돈이라고 생각해요.</li>
<li>등기부에 <strong>신탁</strong>이 있다면 실제 권한은 신탁회사에 있어서, 신탁회사의 동의 없이 한 계약은 보호받기 어려워요.</li>
<li>등기부는 <strong>계약 직전과 잔금 치르기 직전</strong>에 다시 열람해 그 사이 새로운 대출이나 압류가 생기지 않았는지 확인해요.</li>
</ul>

<h2>2단계: 깡통전세 가늠하기</h2>
<p>깡통전세는 집값이 대출과 보증금을 합친 금액보다 낮거나 비슷해서, 집이 경매로 넘어가면 보증금을 다 돌려받지 못할 수 있는 집이에요.</p>
<div class="box note"><span class="h">간단한 계산</span>
<p><strong>(근저당 채권최고액 + 선순위 보증금 + 내 보증금) ÷ 집의 시세</strong></p>
<p>이 비율이 높을수록 위험해요. 경매에서는 시세보다 낮은 가격에 팔리는 경우가 많다는 점도 고려해요. 시세는 국토교통부 실거래가 공개시스템, 부동산 시세 사이트, 여러 중개업소를 통해 확인해요. 신축 빌라처럼 거래 사례가 적은 곳은 시세 부풀리기에 특히 주의해요.</p></div>

<h2>3단계: 그 밖에 확인할 서류와 정보</h2>
<div class="tbl"><table>
<thead><tr><th>확인할 것</th><th>어디서</th><th>왜</th></tr></thead>
<tbody>
<tr><td>건축물대장</td><td>정부24</td><td><strong>위반건축물</strong> 여부, 실제 용도(근린생활시설로 되어 있으면 주거용이 아니어서 전입이나 보증보험이 어려울 수 있어요)</td></tr>
<tr><td>임대인의 세금 체납</td><td>세무서·지자체 (임대인 동의 또는 제도에 따른 열람)</td><td>국세·지방세 체납은 경매 시 보증금보다 먼저 가져갈 수 있어요</td></tr>
<tr><td>선순위 임차인 보증금 (다가구 주택)</td><td>임대인에게 요구, 확정일자 부여 현황</td><td>한 건물에 여러 세입자가 있으면 내 앞의 보증금 합계를 알아야 해요</td></tr>
<tr><td>공인중개사 등록</td><td>국가공간정보포털 등</td><td>등록된 중개사무소인지, 중개사고 보증에 가입돼 있는지</td></tr>
<tr><td>임대인 신분</td><td>계약 현장</td><td>신분증과 등기부의 소유자가 같은지. 대리인이면 위임장과 인감증명서</td></tr>
</tbody></table></div>
<p>2023년 법 개정으로 임대인은 계약할 때 선순위 확정일자 정보와 세금 체납 정보를 임차인에게 제시해야 하고, 임차인은 일정 조건에서 임대인의 동의 없이도 미납 세금을 열람할 수 있게 됐어요. 세부 조건은 주택임대차보호법과 국세청 안내를 확인해요.</p>

<h2>4단계: 계약서 쓰기</h2>
<ul>
<li>보증금과 계약금은 <strong>등기부상 소유자 명의의 계좌</strong>로 보내요. 중개인이나 대리인 계좌로 보내지 않아요.</li>
<li>도움이 되는 <strong>특약</strong>을 넣어요.
  <ul>
  <li>"임대인은 잔금일 다음 날까지 근저당 설정 등 새로운 권리를 설정하지 않는다. 위반 시 계약을 해제하고 손해를 배상한다."</li>
  <li>"전세보증금 반환보증 가입이 거절되면 계약을 무효로 하고 계약금을 돌려준다."</li>
  <li>"임대인은 계약 시점에 알린 것 외에 세금 체납이 없음을 확인한다."</li>
  </ul></li>
<li>수리 책임, 관리비 항목, 반려동물, 원상복구 범위도 적어두면 나중에 분쟁이 줄어요.</li>
</ul>

<h2>5단계: 계약 후 바로 할 일</h2>
<div class="tbl"><table>
<thead><tr><th>할 일</th><th>효과</th><th>방법</th></tr></thead>
<tbody>
<tr><td>전입신고</td><td>입주와 함께 하면 <strong>다음 날 0시</strong>부터 대항력 (집주인이 바뀌어도 계속 살 수 있는 권리)</td><td>주민센터 또는 정부24</td></tr>
<tr><td>확정일자</td><td>전입과 함께 갖추면 <strong>우선변제권</strong> (경매 시 순서에 따라 보증금을 돌려받을 권리)</td><td>주민센터, 인터넷등기소, 또는 전월세 신고 시 자동 부여</td></tr>
<tr><td>전월세 신고</td><td>일정 금액 이상 계약은 30일 안에 신고 의무. 신고하면 확정일자도 함께 받아요</td><td>주민센터 또는 부동산 거래관리시스템</td></tr>
<tr><td>전세보증금 반환보증</td><td>집주인이 보증금을 돌려주지 못하면 보증기관이 대신 돌려줘요</td><td>주택도시보증공사(HUG), 한국주택금융공사(HF), 서울보증보험 등</td></tr>
</tbody></table></div>
<div class="box warn"><span class="h">대항력은 '다음 날 0시'부터</span>
<p>전입신고를 한 날 바로 대항력이 생기는 게 아니라 <strong>다음 날 0시</strong>에 생겨요. 그런데 은행 근저당은 설정 당일 효력이 생겨요. 그래서 잔금일에 집주인이 대출을 받으면 내 보증금보다 순서가 앞설 수 있어요. 앞의 특약이 중요한 이유예요.</p></div>

<h2>살면서 알아둘 권리</h2>
<ul>
<li><strong>계약갱신요구권:</strong> 임차인은 한 번 계약을 갱신해 달라고 요구할 수 있어요(2년 추가). 집주인이 직접 살겠다는 등 정해진 사유가 없으면 거절할 수 없어요.</li>
<li><strong>임대료 증액 상한:</strong> 갱신할 때 보증금과 월세 인상은 5% 이내로 제한돼요.</li>
<li><strong>수리 요청:</strong> 보일러, 누수처럼 생활에 필요한 큰 수리는 원칙적으로 임대인의 책임이에요.</li>
</ul>

<h2>보증금을 돌려받지 못할 때</h2>
<ol>
<li>계약 만료 전에 <strong>문자나 내용증명</strong>으로 계약 종료 의사를 분명히 남겨요.</li>
<li>만료일에 보증금을 받지 못했다면 이사를 가기 전에 <strong>임차권등기명령</strong>을 신청해요. 등기가 완료되면 이사를 가도 대항력과 우선변제권이 유지돼요.</li>
<li>보증보험에 가입했다면 보증기관에 이행을 청구해요.</li>
<li>주택임대차분쟁조정위원회, 대한법률구조공단(국번 없이 132), 지자체 전세피해지원센터에서 상담을 받을 수 있어요.</li>
</ol>

<div class="box"><span class="h">계약 전 최종 점검표</span>
<ol>
<li>등기부 갑구: 소유자 일치, 압류·가압류·신탁 없음</li>
<li>등기부 을구: 근저당 채권최고액 확인</li>
<li>근저당 + 선순위 보증금 + 내 보증금 ÷ 시세 계산</li>
<li>건축물대장: 위반건축물·용도 확인</li>
<li>임대인 세금 체납, 선순위 임차인 정보 확인</li>
<li>보증보험 가입 가능 여부 미리 확인</li>
<li>소유자 명의 계좌로 송금, 특약 작성</li>
<li>입주 당일 전입신고·확정일자, 보증보험 가입</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>공인중개사가 괜찮다고 하면 믿어도 되나요?</dt>
<dd>중개사의 설명은 도움이 되지만, 최종 확인은 직접 해야 해요. 서류를 직접 열람하고, 설명이 서류와 다르면 계약을 서두르지 않아요.</dd>
<dt>월세도 이런 확인이 필요한가요?</dt>
<dd>월세도 보증금이 있다면 같은 위험이 있어요. 보증금이 작더라도 등기부 확인, 전입신고, 확정일자는 꼭 해요. 소액 보증금은 일정 금액까지 최우선으로 변제받는 제도도 있어요.</dd>
<dt>시세보다 전세가 싸면 좋은 거 아닌가요?</dt>
<dd>조건이 지나치게 좋다면 이유를 확인해야 해요. 선순위 대출이 많거나, 위반건축물이거나, 보증보험 가입이 안 되는 집일 수 있어요.</dd>
</dl>

<h2>참고 자료</h2>
<ul class="refs">
<li>국토교통부, 전세사기 예방 체크리스트 및 안심전세 안내</li>
<li>법무부, 주택임대차보호법 및 개정 내용</li>
<li>대법원 인터넷등기소, 등기사항전부증명서 열람 안내</li>
<li>주택도시보증공사(HUG), 전세보증금반환보증 안내</li>
</ul>
</template>
