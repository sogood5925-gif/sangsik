  data-thumb="30초|6단계"
  data-summary="손 씻기는 가장 싸고 효과적인 감염 예방법이에요. 손 씻기가 설사와 호흡기 감염을 얼마나 줄이는지, 질병관리청의 6단계 방법, 비누와 손소독제의 차이, 알코올이 잘 듣지 않는 바이러스, 손 말리기와 손 습진 관리까지 정리했어요."
  data-tags="손씻기,감염예방,손소독제,노로바이러스,위생">
<p class="lead">손은 하루 종일 문고리, 휴대폰, 돈, 버스 손잡이를 만지고, 그 손은 무심코 눈과 코와 입으로 가요. 감염병의 상당수는 이 짧은 경로로 옮겨요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>비누로 손을 씻으면 설사 질환은 <strong>약 23~40%</strong>, 호흡기 감염은 <strong>약 16~21%</strong> 줄어들어요.</li>
<li>흐르는 물에 비누로 <strong>30초 이상</strong>, 손가락 사이와 엄지, 손톱 밑까지 문질러요.</li>
<li>손소독제는 <strong>알코올 60% 이상</strong> 제품을 쓰고, 손이 눈에 띄게 더러울 때는 비누로 씻어요.</li>
<li><strong>노로바이러스</strong>는 알코올이 잘 듣지 않아요. 이때는 비누와 물이 기본이에요.</li>
</ul></div>

<h2>손 씻기는 얼마나 효과가 있을까</h2>
<div class="tbl"><table>
<thead><tr><th>감염</th><th>줄어드는 정도 (약)</th></tr></thead>
<tbody>
<tr><td>설사 질환 (일반 인구)</td><td class="num">23~40%</td></tr>
<tr><td>설사 질환 (면역이 약한 사람)</td><td class="num">58%</td></tr>
<tr><td>감기 같은 호흡기 감염</td><td class="num">16~21%</td></tr>
<tr><td>아이들의 위장관 질환으로 인한 결석</td><td class="num">29~57%</td></tr>
</tbody>
<caption>미국 질병통제예방센터(CDC), Show Me the Science – Why Wash Your Hands?</caption></table></div>
<p>백신이나 약처럼 특정 병 하나를 막는 게 아니라, 손을 통해 옮는 거의 모든 감염을 동시에 줄인다는 점에서 효과가 커요. 항생제가 필요한 감염이 줄어드니 항생제 내성을 줄이는 데도 도움이 돼요.</p>

<h2>올바른 손 씻기 6단계</h2>
<p>물에 적시고 비누를 충분히 묻힌 뒤, 아래 여섯 동작을 합쳐 <strong>30초 이상</strong> 문질러요. '생일 축하합니다' 노래를 두 번 부르는 정도의 시간이에요.</p>
<ol>
<li><strong>손바닥과 손바닥</strong>을 마주 대고 문질러요.</li>
<li><strong>손등과 손바닥</strong>을 마주 대고 문질러요. 양손 번갈아서.</li>
<li><strong>손바닥을 마주 대고 손깍지</strong>를 끼고 손가락 사이를 문질러요.</li>
<li><strong>손가락을 마주 잡고</strong> 손가락 등을 문질러요.</li>
<li><strong>엄지손가락</strong>을 다른 편 손바닥으로 감싸 돌려주며 문질러요.</li>
<li><strong>손가락 끝을 반대편 손바닥에 놓고</strong> 문질러 손톱 밑을 깨끗하게 해요.</li>
</ol>
<p>그다음 흐르는 물로 충분히 헹구고, 깨끗한 수건이나 종이타월로 물기를 닦아요. 공중화장실에서는 종이타월로 수도꼭지를 잠그면 다시 오염되는 것을 줄일 수 있어요.</p>
<div class="box note"><span class="h">가장 많이 놓치는 곳</span>
<p>손 씻기 후 오염이 남는 부위를 확인한 연구들에서 <strong>엄지손가락, 손가락 끝, 손톱 밑, 손가락 사이</strong>가 자주 빠졌어요. 손바닥만 비비는 습관이 있다면 3·5·6단계를 의식적으로 해보세요.</p></div>

<h2>언제 씻어야 할까</h2>
<ul>
<li>화장실을 다녀온 뒤, 기저귀를 갈거나 아이의 뒤처리를 도운 뒤</li>
<li>음식을 만들기 전, 만드는 중(특히 날고기와 달걀을 만진 뒤), 만든 뒤</li>
<li>식사하기 전</li>
<li>기침, 재채기, 코를 푼 뒤</li>
<li>외출 후 집에 돌아왔을 때</li>
<li>아픈 사람을 돌보기 전과 후, 상처를 치료하기 전과 후</li>
<li>동물이나 동물의 먹이, 배설물을 만진 뒤</li>
<li>쓰레기를 만진 뒤</li>
</ul>

<h2>비누와 손소독제, 무엇을 쓸까</h2>
<div class="tbl"><table>
<thead><tr><th>상황</th><th>더 나은 선택</th></tr></thead>
<tbody>
<tr><td>손에 흙, 기름, 음식물이 눈에 띄게 묻었을 때</td><td>비누와 물</td></tr>
<tr><td>화장실 이용 후, 설사하는 사람을 돌본 뒤</td><td>비누와 물</td></tr>
<tr><td>노로바이러스가 유행할 때</td><td>비누와 물</td></tr>
<tr><td>화학물질이 묻었을 때</td><td>비누와 물</td></tr>
<tr><td>물과 비누를 쓸 수 없는 외출 중, 손이 눈에 띄게 더럽지 않을 때</td><td>알코올 손소독제</td></tr>
</tbody></table></div>
<h3>손소독제 제대로 쓰기</h3>
<ul>
<li><strong>알코올 60% 이상</strong> 제품을 써요.</li>
<li>손 전체를 적실 만큼 충분히 짜고, 6단계처럼 구석구석 문질러요.</li>
<li><strong>완전히 마를 때까지</strong>(약 20초) 문질러요. 마르기 전에 닦아내면 효과가 떨어져요.</li>
<li>불 가까이에서 쓰지 않고, 아이 손이 닿지 않게 보관해요. 삼키면 알코올 중독이 생길 수 있어요.</li>
</ul>
<div class="box warn"><span class="h">알코올이 잘 듣지 않는 경우</span>
<p><strong>노로바이러스</strong>처럼 겉껍질(외피)이 없는 바이러스와 <strong>클로스트리디오이데스 디피실</strong> 같은 세균의 포자는 알코올로 잘 없어지지 않아요. 겨울철 장염이 유행하거나 가족 중 설사하는 사람이 있다면 반드시 비누와 흐르는 물로 씻어요. 노로바이러스 환자가 쓴 화장실이나 구토물이 묻은 곳은 희석한 락스로 소독해요.</p></div>

<h2>자주 하는 오해</h2>
<h3>항균 비누가 더 좋을까</h3>
<p>미국 식품의약국(FDA)은 2016년, 일반 소비자용 항균 비누에 쓰이던 트리클로산 등 여러 성분이 <strong>일반 비누보다 감염 예방 효과가 낫다는 근거가 없다</strong>며 판매를 금지했어요. 가정에서는 일반 비누로 충분해요.</p>
<h3>뜨거운 물로 씻어야 할까</h3>
<p>손을 씻는 정도의 물 온도로는 세균이 죽지 않아요. 미지근한 물이든 찬물이든 효과는 비슷하다는 연구가 많아요. 오히려 너무 뜨거운 물은 피부를 건조하게 해요. 편한 온도로 충분한 시간 문지르는 게 핵심이에요.</p>
<h3>손을 말리는 것도 중요할까</h3>
<p>젖은 손은 마른 손보다 세균을 더 잘 옮겨요. 씻은 뒤에는 깨끗한 수건이나 종이타월로 물기를 닦아요. 여러 사람이 함께 쓰는 수건은 자주 바꿔요.</p>

<h2>자주 씻으면 손이 트는데</h2>
<p>손을 자주 씻고 소독제를 쓰면 피부 장벽이 손상돼 손 습진이 생기기 쉬워요. 갈라진 피부는 오히려 세균이 머물기 좋은 곳이 돼요.</p>
<ul>
<li>씻은 뒤 물기를 두드려 닦고 <strong>바로 보습제</strong>를 발라요.</li>
<li>설거지나 청소할 때는 고무장갑을 껴요(안에 면장갑을 끼면 땀이 차지 않아요).</li>
<li>자기 전에 보습제를 두껍게 바르고 면장갑을 끼면 도움이 돼요.</li>
<li>갈라지고 진물이 나거나 오래가면 피부과 진료를 받아요.</li>
</ul>

<h2>손 씻기와 함께하면 좋은 습관</h2>
<div class="box"><span class="h">감염 예방 생활 수칙</span>
<ol>
<li>씻지 않은 손으로 눈, 코, 입 만지지 않기</li>
<li>기침과 재채기는 휴지나 옷소매로 가리기</li>
<li>휴대폰, 문고리, 리모컨처럼 자주 만지는 물건 정기적으로 닦기</li>
<li>아플 때는 가능하면 쉬고, 다른 사람과 식기·수건 따로 쓰기</li>
<li>아이에게 6단계 손 씻기를 노래와 함께 알려주기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>물로만 씻어도 효과가 있나요?</dt>
<dd>물로만 씻어도 어느 정도는 줄지만, 비누를 쓰면 기름기와 함께 세균과 바이러스가 훨씬 잘 떨어져요. 비누 분자가 기름과 물을 이어주는 역할을 하기 때문이에요.</dd>
<dt>손소독제를 자주 쓰면 내성균이 생기나요?</dt>
<dd>알코올은 세포막과 단백질을 물리적으로 파괴하는 방식이라 항생제처럼 내성이 생기는 문제는 거의 없어요.</dd>
<dt>손톱이 길면 더 오염되나요?</dt>
<dd>손톱 밑은 세균이 많이 머무는 곳이에요. 음식을 만들거나 아픈 사람을 돌본다면 손톱을 짧게 유지하는 게 좋아요.</dd>
</dl>

  data-title="과일·채소 제대로 씻는 법: 잔류농약과 세균, 무엇으로 얼마나 씻어야 할까"
  data-thumb="5분|담갔다 헹구기"
  data-summary="과일과 채소는 농약보다 세균 때문에 더 꼼꼼히 씻어야 해요. 잔류농약 관리 제도, 물·베이킹소다·식초 세척의 차이, 딸기·포도·상추·브로콜리 등 품목별 세척법, 씻는 시점과 보관, 교차오염을 막는 법을 정리했어요."
  data-tags="과일세척,채소세척,잔류농약,식중독,베이킹소다">
<p class="lead">과일과 채소를 씻는 이유는 두 가지예요. 표면에 남은 농약을 줄이고, 흙과 함께 묻어 온 세균을 떨어뜨리는 거예요. 실제로 식중독 위험으로 보면 두 번째가 더 중요한 경우가 많아요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>기본은 <strong>물에 담갔다가 흐르는 물로 문질러 씻기</strong>예요. 이것만으로 표면 잔류물의 상당 부분이 제거돼요.</li>
<li>베이킹소다 물이 농약 제거에 조금 더 효과적이라는 연구도 있지만, <strong>충분한 물 세척</strong>이 가장 중요해요.</li>
<li>주방 세제는 쓰지 않아요. 쓰려면 <strong>과일·채소용 '1종 세척제'</strong>만 쓰고 충분히 헹궈요.</li>
<li>과일과 채소는 <strong>먹기 직전에</strong> 씻어요. 미리 씻어두면 빨리 물러지고 상해요.</li>
</ul></div>

<h2>잔류농약, 얼마나 걱정해야 할까</h2>
<p>국내에서는 2019년부터 <strong>농약 허용물질 목록 관리제도(PLS)</strong>가 모든 농산물에 적용되고 있어요. 작물마다 사용이 허가된 농약과 잔류 기준을 정해두고, 허가되지 않은 농약은 사실상 검출되지 않아야 하는 수준(0.01mg/kg)으로 엄격하게 관리하는 제도예요.</p>
<p>식품의약품안전처와 지자체는 유통 농산물의 잔류농약을 정기적으로 검사하고, 기준을 넘은 제품은 회수하고 공개해요. 대부분의 농산물은 기준 이내로 관리되고 있어요. 그렇다고 씻지 않아도 된다는 뜻은 아니에요. 씻으면 남은 잔류물을 더 줄일 수 있고, 무엇보다 세균을 떨어뜨릴 수 있어요.</p>

<h2>세균: 생으로 먹는 채소가 더 중요하다</h2>
<p>채소는 흙과 물, 동물, 사람의 손을 거쳐 식탁에 와요. 이 과정에서 병원성 대장균, 살모넬라, 노로바이러스 같은 병원체가 묻을 수 있어요. 익혀 먹는 채소는 가열로 대부분 사라지지만, <strong>샐러드나 쌈 채소처럼 생으로 먹는 채소는 씻는 것이 거의 유일한 안전장치</strong>예요. 실제로 여러 나라에서 새싹채소, 잎채소로 인한 식중독이 반복해서 보고돼 왔어요.</p>

<h2>기본 세척법</h2>
<ol>
<li><strong>담그기:</strong> 넉넉한 물에 담가 5분 정도 두어요. 흙과 이물질이 불어나고 표면의 잔류물이 물에 녹아 나와요.</li>
<li><strong>문지르기:</strong> 흐르는 물에서 손이나 부드러운 솔로 표면을 문질러요. 문지르는 동작이 가장 많은 오염을 떨어뜨려요.</li>
<li><strong>헹구기:</strong> 흐르는 물로 두세 번 충분히 헹궈요.</li>
<li><strong>물기 빼기:</strong> 깨끗한 채반이나 샐러드 스피너로 물기를 빼요. 물기가 많으면 드레싱이 겉돌고 빨리 무를 수 있어요.</li>
</ol>

<h2>베이킹소다, 식초, 세척제는 효과가 있을까</h2>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>알려진 효과</th><th>주의</th></tr></thead>
<tbody>
<tr><td>물에 담갔다가 흐르는 물로 세척</td><td>표면 흙, 이물질, 잔류물의 상당 부분 제거</td><td>충분한 시간과 문지르기가 핵심</td></tr>
<tr><td>베이킹소다 물 (약 1% 농도)</td><td>사과 표면 일부 농약을 물보다 더 잘 제거했다는 연구가 있어요</td><td>효과를 보려면 담그는 시간이 필요해요. 반드시 물로 헹구기</td></tr>
<tr><td>식초 물</td><td>일부 세균을 줄이는 효과가 있지만 농약 제거 효과는 뚜렷하지 않아요</td><td>맛이 배고, 부드러운 과일은 식감이 변할 수 있어요</td></tr>
<tr><td>과일·채소용 1종 세척제</td><td>표면 기름기와 잔류물 제거</td><td>표시된 농도와 시간을 지키고 충분히 헹구기</td></tr>
<tr><td>일반 주방 세제</td><td>권장하지 않아요</td><td>과일·채소용이 아닌 세제는 잔여물이 남을 수 있어요</td></tr>
</tbody></table></div>
<p>정리하면 특별한 재료보다 <strong>충분히 담그고, 문지르고, 흐르는 물로 헹구는 것</strong>이 가장 중요해요. 베이킹소다를 쓴다면 보조 수단으로 생각해요.</p>

<h2>품목별 세척 요령</h2>
<div class="tbl"><table>
<thead><tr><th>품목</th><th>세척 요령</th></tr></thead>
<tbody>
<tr><td>딸기</td><td>꼭지를 떼지 않은 채 물에 잠깐 담갔다가 흐르는 물로 헹궈요. 꼭지를 먼저 떼면 그 자리로 물과 오염물이 스며들어요. 무르기 쉬우니 먹기 직전에 씻어요.</td></tr>
<tr><td>포도</td><td>송이째 물에 담가 흔들어 주고, 흐르는 물로 알알이 헹궈요. 알을 떼어 씻으면 꼭지 부분까지 깨끗해져요. 하얀 가루(과분)는 포도가 스스로 만든 천연 성분이에요.</td></tr>
<tr><td>사과, 배</td><td>껍질째 먹는다면 흐르는 물에서 손이나 솔로 꼼꼼히 문질러요. 꼭지와 꽃받침 오목한 부분을 신경 써요.</td></tr>
<tr><td>상추, 깻잎 같은 쌈 채소</td><td>겉잎 한두 장은 버리고, 한 장씩 흐르는 물에 앞뒤로 씻어요. 깻잎은 잎 표면의 잔털 사이를 문질러요.</td></tr>
<tr><td>양배추</td><td>겉잎 두세 장을 떼어내고, 안쪽 잎은 먹을 만큼 떼어 씻어요.</td></tr>
<tr><td>브로콜리</td><td>송이 부분이 아래로 가게 물에 거꾸로 담가 두면 사이사이에 낀 이물질이 빠져요. 그다음 흐르는 물로 헹궈요.</td></tr>
<tr><td>파, 부추</td><td>뿌리 쪽 흙을 먼저 떼고 흐르는 물로 한 줄기씩 헹궈요.</td></tr>
<tr><td>감자, 당근, 무</td><td>솔로 흙을 문질러 씻어요. 감자의 싹과 초록색으로 변한 부분은 도려내요.</td></tr>
<tr><td>새싹채소</td><td>따뜻하고 습한 환경에서 키워 세균이 자라기 쉬워요. 면역이 약한 사람, 임신부, 어린이는 익혀 먹는 게 안전해요.</td></tr>
</tbody></table></div>

<h2>껍질을 벗길까, 그냥 먹을까</h2>
<p>껍질을 벗기면 표면 잔류물은 확실히 줄지만, 껍질과 그 바로 아래에 많은 식이섬유와 영양소도 함께 버려요. 잘 씻은 과일은 껍질째 먹어도 괜찮아요. 걱정이 크다면 품목에 따라 선택하면 돼요. 흐르는 물로 문질러 씻기 어려운 울퉁불퉁한 표면이라면 껍질을 벗기는 것도 방법이에요.</p>

<h2>씻는 시점과 보관</h2>
<ul>
<li><strong>먹기 직전에 씻어요.</strong> 씻은 뒤 보관하면 표면 물기 때문에 곰팡이가 피거나 빨리 물러져요.</li>
<li>잎채소를 미리 손질해야 한다면 물기를 완전히 빼고 키친타월을 깐 밀폐 용기에 담아 냉장 보관해요.</li>
<li><strong>자른 과일과 채소는 바로 냉장</strong>해요. 자른 면은 세균이 자라기 쉬워요.</li>
<li>'세척 완료', '바로 드세요'라고 표시된 포장 샐러드는 다시 씻지 않아도 돼요. 오히려 주방에서 다시 오염될 수 있어요.</li>
</ul>

<h2>씻은 뒤 다시 오염되지 않게</h2>
<ul>
<li>씻기 전에 <strong>손부터</strong> 씻어요.</li>
<li>날고기를 썬 칼과 도마로 채소를 썰지 않아요. 채소를 먼저 손질하거나 도구를 나눠 써요.</li>
<li>싱크대에서 생닭이나 고기를 씻었다면 개수대를 세척한 뒤 채소를 씻어요.</li>
<li>채반과 샐러드 스피너도 사용 후 잘 씻어 말려요.</li>
</ul>

<div class="box"><span class="h">과일·채소 세척 체크리스트</span>
<ol>
<li>손 씻고 시작하기</li>
<li>물에 5분 정도 담그기</li>
<li>흐르는 물에서 손이나 솔로 문지르기</li>
<li>두세 번 헹구고 물기 빼기</li>
<li>잎채소는 겉잎 떼고 한 장씩 씻기</li>
<li>먹기 직전에 씻고, 자른 건 바로 냉장</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>유기농 채소는 안 씻어도 되나요?</dt>
<dd>유기농도 흙과 세균이 묻어 있어요. 유기 농업에서 쓰는 퇴비나 허용 자재도 있기 때문에 일반 채소와 똑같이 씻어요.</dd>
<dt>과일을 소금물에 씻으면 좋나요?</dt>
<dd>소금물이 물보다 농약을 더 잘 제거한다는 근거는 뚜렷하지 않아요. 소금이 과일에 배어 맛이 변할 수 있어요. 일반 물로 충분히 씻는 게 좋아요.</dd>
<dt>귤이나 바나나처럼 껍질을 까서 먹는 과일도 씻어야 하나요?</dt>
<dd>껍질을 깔 때 손을 통해 표면의 오염물이 과육에 묻을 수 있어요. 가볍게 흐르는 물에 헹군 뒤 까서 먹으면 더 안전해요.</dd>
</dl>

<template data-id="ibs" data-cat="dis" data-date="2026.09.29"
  data-title="과민성 대장 증후군: 검사는 정상인데 배가 아픈 이유와 저포드맵 식사법"
  data-thumb="FODMAP|저포드맵"
  data-summary="대장내시경은 정상인데 복통과 설사, 변비가 반복된다면 과민성 대장 증후군일 수 있어요. 진단 기준과 유형, 장과 뇌가 주고받는 신호, 반드시 검사가 필요한 경고 증상, 저포드맵 식사법과 약물·심리 치료까지 정리했어요."
  data-tags="과민성대장증후군,복통,설사,변비,저포드맵">
<p class="lead">과민성 대장 증후군은 장에 눈에 보이는 병변은 없는데 장이 예민하게 반응하는 상태예요. 검사가 정상이라는 말이 '아무 문제 없다'는 뜻은 아니에요. 증상은 실제로 있고, 관리하는 방법도 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>최근 3개월 동안 <strong>일주일에 한 번 이상</strong> 복통이 있고, 배변과 관련해 변하면 의심해요.</li>
<li>원인은 하나가 아니라 <strong>장의 예민함, 장운동, 장내 세균, 뇌와 장의 신호</strong>가 함께 작용해요.</li>
<li><strong>혈변, 체중 감소, 50세 이후 새로 생긴 증상, 밤에 깨는 설사</strong>는 다른 병을 먼저 확인해야 해요.</li>
<li><strong>저포드맵 식사</strong>는 짧게 제한하고 다시 하나씩 늘려가는 방식이에요. 평생 하는 식단이 아니에요.</li>
</ul></div>

<h2>진단 기준과 유형</h2>
<p>과민성 대장 증후군은 국제 기준(로마 기준 IV)으로 진단해요.</p>
<div class="box note"><span class="h">로마 기준 IV</span>
<p>최근 3개월 동안 <strong>평균 일주일에 1일 이상 반복되는 복통</strong>이 있고, 다음 중 두 가지 이상에 해당해요.</p>
<ul>
<li>배변과 관련이 있다 (배변 후 좋아지거나 나빠짐)</li>
<li>배변 횟수의 변화와 함께 시작된다</li>
<li>대변 모양의 변화와 함께 시작된다</li>
</ul>
<p>증상은 진단 최소 6개월 전에 시작됐어야 해요.</p></div>
<div class="tbl"><table>
<thead><tr><th>유형</th><th>특징</th></tr></thead>
<tbody>
<tr><td>설사형 (IBS-D)</td><td>묽은 변이 잦고 급하게 화장실에 가야 해요.</td></tr>
<tr><td>변비형 (IBS-C)</td><td>딱딱한 변, 배변이 힘들고 덜 본 느낌이 있어요.</td></tr>
<tr><td>혼합형 (IBS-M)</td><td>설사와 변비가 번갈아 나타나요.</td></tr>
<tr><td>분류 불가형</td><td>어느 쪽으로도 뚜렷하지 않아요.</td></tr>
</tbody></table></div>
<p>유형은 증상이 있는 날의 대변 모양으로 나눠요. 대변 모양을 1(딱딱한 덩어리)부터 7(물 같은 변)까지 나눈 <strong>브리스톨 대변 척도</strong>를 쓰면 기록하기 쉬워요.</p>

<h2>왜 생길까</h2>
<ul>
<li><strong>내장 과민성:</strong> 같은 양의 가스나 장의 움직임에도 통증을 더 크게 느껴요.</li>
<li><strong>장운동 이상:</strong> 장이 너무 빨리 움직이면 설사, 너무 느리면 변비가 돼요.</li>
<li><strong>장-뇌 축:</strong> 장과 뇌는 신경과 호르몬으로 끊임없이 신호를 주고받아요. 스트레스와 불안이 장 증상을 악화시키고, 장 증상이 다시 불안을 키워요. 시험이나 발표 전에 배가 아픈 것과 같은 원리예요.</li>
<li><strong>감염 후:</strong> 세균성 장염을 앓은 뒤 과민성 대장 증후군이 생기는 경우가 적지 않아요.</li>
<li><strong>장내 세균 변화, 음식 반응</strong></li>
</ul>

<h2>꼭 검사가 필요한 경고 신호</h2>
<div class="box warn"><span class="h">이런 증상은 과민성 대장 증후군으로 넘기지 마세요</span>
<ul>
<li>대변에 피가 섞이거나 검은 변을 봐요.</li>
<li>의도하지 않은 체중 감소가 있어요.</li>
<li><strong>50세 이후</strong> 처음 증상이 생겼어요.</li>
<li>설사나 복통 때문에 <strong>자다가 깨요.</strong></li>
<li>빈혈, 열이 있어요.</li>
<li>가족 중 대장암, 염증성 장질환(크론병, 궤양성 대장염), 셀리악병이 있어요.</li>
<li>배에서 덩어리가 만져져요.</li>
</ul>
<p>이런 경우 대장내시경과 혈액검사로 대장암, 염증성 장질환 같은 다른 병을 먼저 확인해요.</p></div>

<h2>저포드맵 식사법</h2>
<p><strong>포드맵(FODMAP)</strong>은 소장에서 잘 흡수되지 않고 대장으로 넘어가 장내 세균에 의해 빠르게 발효되는 탄수화물들을 묶어 부르는 말이에요. 발효되면서 가스가 생기고 장 안으로 물을 끌어들여 복부 팽만, 복통, 설사를 일으켜요.</p>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>많이 든 음식 (예)</th></tr></thead>
<tbody>
<tr><td>올리고당 (프럭탄, 갈락탄)</td><td>밀, 보리, 호밀, 양파, 마늘, 파의 흰 부분, 콩류</td></tr>
<tr><td>이당류 (유당)</td><td>우유, 연성 치즈, 아이스크림</td></tr>
<tr><td>단당류 (과당 과잉)</td><td>사과, 배, 수박, 꿀, 액상과당</td></tr>
<tr><td>폴리올 (당알코올)</td><td>자일리톨·솔비톨 등이 든 무설탕 껌·사탕, 버섯, 복숭아, 자두</td></tr>
</tbody>
<caption>음식별 함량과 허용량은 모나시대학 저포드맵 자료 등을 참고해요.</caption></table></div>
<h3>세 단계로 진행해요</h3>
<ol>
<li><strong>제한 (2~6주):</strong> 포드맵이 많은 음식을 줄여요. 증상이 좋아지는지 확인해요.</li>
<li><strong>재도입 (6~8주):</strong> 한 번에 한 종류씩 다시 먹어보며 어떤 음식이 나에게 증상을 일으키는지 찾아요.</li>
<li><strong>개인화:</strong> 나에게 문제가 되는 음식만 줄이고 나머지는 다시 자유롭게 먹어요.</li>
</ol>
<p>포드맵 식품 중에는 장내 좋은 세균의 먹이가 되는 것도 많아서, <strong>오랫동안 제한만 하면 장내 세균의 다양성이 줄 수 있어요.</strong> 가능하면 영양사의 도움을 받아 진행하는 게 좋아요.</p>
<h3>그 밖의 식사 요령</h3>
<ul>
<li><strong>수용성 식이섬유</strong>(차전자피 등)는 설사와 변비 모두에 도움이 될 수 있어요. 반면 밀기울 같은 불용성 섬유는 팽만을 악화시키기도 해요.</li>
<li>규칙적인 시간에, 천천히, 적당한 양을 먹어요.</li>
<li>카페인, 술, 기름진 음식, 매운 음식이 증상을 악화시키는지 확인해요.</li>
<li>탄산음료와 빨대, 껌은 삼키는 공기를 늘려 팽만을 만들 수 있어요.</li>
</ul>

<h2>약물 치료</h2>
<div class="tbl"><table>
<thead><tr><th>증상</th><th>쓰이는 약 (예)</th></tr></thead>
<tbody>
<tr><td>복통, 경련</td><td>진경제, 페퍼민트 오일 제제</td></tr>
<tr><td>설사</td><td>로페라마이드 같은 지사제, 담즙산 결합제, 리팍시민(장내 세균 조절 항생제)</td></tr>
<tr><td>변비</td><td>폴리에틸렌글리콜 같은 삼투성 완하제, 장 분비를 늘리는 약</td></tr>
<tr><td>지속되는 통증</td><td>저용량 삼환계 항우울제 등 신경조절제 (장의 통증 신호를 줄이는 목적)</td></tr>
</tbody>
<caption>대한소화기기능성질환·운동학회 진료지침 등을 바탕으로 정리. 약 선택은 증상과 유형에 따라 의사가 정해요.</caption></table></div>
<p>항우울제를 권유받으면 "내가 우울증이라는 건가?" 싶을 수 있어요. 여기서는 우울증 치료가 아니라 <strong>장과 뇌 사이의 통증 신호를 낮추기 위해</strong> 우울증 치료보다 훨씬 적은 용량으로 써요.</p>

<h2>마음과 장을 함께 다루는 치료</h2>
<p>장-뇌 축이 중요한 만큼 심리적 치료도 효과가 확인돼 있어요. <strong>인지행동치료</strong>와 <strong>장 지향 최면 치료</strong>는 여러 연구에서 증상을 의미 있게 줄였어요. 규칙적인 운동과 충분한 수면도 장 증상을 줄이는 데 도움이 돼요.</p>

<div class="box"><span class="h">증상 관리 일기 (2주)</span>
<ol>
<li>매일 먹은 음식과 시간 적기</li>
<li>복통 정도(0~10점)와 시간 적기</li>
<li>대변 횟수와 모양(브리스톨 척도 1~7) 적기</li>
<li>스트레스, 수면, 월경 주기 함께 적기</li>
<li>진료 때 기록을 가져가기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>과민성 대장 증후군이 대장암이 되나요?</dt>
<dd>아니에요. 과민성 대장 증후군은 대장암이나 염증성 장질환으로 진행하지 않아요. 다만 증상이 겹칠 수 있어서 경고 신호가 있으면 검사가 필요하고, 나이에 맞는 대장암 검진은 따로 받아야 해요.</dd>
<dt>유산균을 먹으면 좋아지나요?</dt>
<dd>일부 균주가 팽만이나 전반적인 증상을 줄였다는 연구가 있지만, 균주마다 효과가 달라 일관된 결론은 없어요. 한 제품을 4주 정도 먹어보고 효과가 없으면 중단하는 방식을 권하기도 해요.</dd>
<dt>글루텐을 끊어야 하나요?</dt>
<dd>밀에 든 프럭탄(포드맵의 일종)이 증상을 일으키는 경우가 많아서 밀을 줄이면 좋아지기도 해요. 다만 셀리악병인지 확인하려면 글루텐을 끊기 전에 검사해야 정확해요.</dd>
</dl>

<h2>참고 자료</h2>
<ul class="refs">
<li>대한소화기기능성질환·운동학회, 과민성 장증후군 진료지침</li>
<li>Rome Foundation, Rome IV Criteria for Irritable Bowel Syndrome</li>
<li>미국소화기학회(ACG), Clinical Guideline: Management of Irritable Bowel Syndrome (2021)</li>
<li>Monash University, Low FODMAP Diet 자료</li>
</ul>
</template>

<template data-id="vitamin-e" data-cat="nut" data-date="2026.09.29"
  data-title="비타민 E 총정리: 견과류 한 줌이면 충분한 이유와 고용량 보충제의 교훈"
  data-thumb="12mg|하루 충분량"
  data-summary="비타민 E는 세포막을 산화로부터 지키는 항산화 비타민이에요. 음식으로 쉽게 채울 수 있어 결핍은 드물어요. 하루 필요량과 많이 든 식품, 결핍이 생기는 경우, 심장병·암 예방을 기대했던 대규모 연구의 결과, 출혈 위험이 있는 약과의 상호작용을 정리했어요."
  data-tags="비타민E,항산화,견과류,영양제,토코페롤">
<p class="lead">비타민 E는 한때 심장병과 암을 막아줄 '항산화 영양제의 왕'으로 기대를 모았어요. 하지만 대규모 연구들이 보여준 결과는 조금 달랐어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인 충분섭취량은 하루 <strong>12mg α-TE</strong>, 상한섭취량은 <strong>540mg</strong>이에요.</li>
<li><strong>식물성 기름, 견과류, 씨앗</strong>에 많아서 아몬드 한 줌이면 절반가량을 채워요.</li>
<li>건강한 사람의 고용량 보충제는 <strong>심혈관 질환과 암을 줄이지 못했고</strong>, 일부 연구에서는 오히려 위험을 높였어요.</li>
<li>항응고제를 먹는 사람은 고용량 비타민 E가 <strong>출혈 위험</strong>을 높일 수 있어요.</li>
</ul></div>

<h2>비타민 E가 하는 일</h2>
<p>비타민 E는 기름에 녹는 비타민으로, 주로 <strong>세포막</strong>에 자리 잡고 있어요. 세포막은 불포화지방산이 많아서 활성산소에 산화되기 쉬운데, 비타민 E가 먼저 산화되면서 세포막을 지켜요. 이렇게 산화된 비타민 E는 비타민 C의 도움으로 다시 원래 상태로 돌아와요.</p>
<ul>
<li>세포막과 LDL 콜레스테롤의 산화 방지</li>
<li>면역세포 기능 유지</li>
<li>신경과 근육 기능 유지</li>
</ul>
<p>비타민 E에는 여러 형태(토코페롤 4종, 토코트리에놀 4종)가 있는데, 몸에서 주로 쓰이고 섭취기준의 기준이 되는 건 <strong>알파-토코페롤</strong>이에요.</p>

<h2>하루에 얼마나 필요할까</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th>충분섭취량</th></tr></thead>
<tbody>
<tr><td>성인 (19세 이상)</td><td class="num">12mg α-TE</td></tr>
<tr><td>수유부</td><td class="num">15mg α-TE</td></tr>
<tr><td>상한섭취량 (성인)</td><td class="num">540mg α-TE</td></tr>
</tbody>
<caption>보건복지부·한국영양학회, 2020 한국인 영양소 섭취기준. α-TE는 알파-토코페롤 당량이에요.</caption></table></div>
<p>보충제 라벨에는 IU(국제단위)로 표시된 경우가 많아요. 천연형(d-알파-토코페롤) 1mg은 약 1.5IU, 합성형(dl-알파-토코페롤) 1mg은 약 2.2IU예요. 천연형이 몸에서 더 효율적으로 쓰여요. 흔한 400IU 제품은 천연형 기준 약 270mg으로, 하루 충분섭취량의 20배가 넘는 양이에요.</p>

<h2>어떤 음식에 많을까</h2>
<div class="tbl"><table>
<thead><tr><th>식품</th><th>분량</th><th>비타민 E (약)</th></tr></thead>
<tbody>
<tr><td>밀배아유</td><td>1큰술</td><td class="num">20mg</td></tr>
<tr><td>해바라기씨 (볶은 것)</td><td>1온스 (약 28g)</td><td class="num">7.4mg</td></tr>
<tr><td>아몬드 (볶은 것)</td><td>1온스 (약 23알)</td><td class="num">6.8mg</td></tr>
<tr><td>해바라기씨유</td><td>1큰술</td><td class="num">5.6mg</td></tr>
<tr><td>헤이즐넛</td><td>1온스</td><td class="num">4.3mg</td></tr>
<tr><td>땅콩버터</td><td>2큰술</td><td class="num">2.9mg</td></tr>
<tr><td>땅콩</td><td>1온스</td><td class="num">2.2mg</td></tr>
<tr><td>시금치 (데친 것)</td><td>½컵</td><td class="num">1.9mg</td></tr>
</tbody>
<caption>미국 국립보건원 식이보충제국(ODS) 자료 기준</caption></table></div>
<p>하루 견과류 한 줌(약 25g), 식물성 기름으로 조리한 나물이나 볶음, 녹색 채소를 먹으면 충분히 채울 수 있어요. 들기름과 참기름, 콩기름에도 비타민 E가 들어 있어요.</p>

<h2>결핍은 언제 생길까</h2>
<p>건강한 사람이 일반 식사를 하면서 비타민 E가 결핍되는 경우는 매우 드물어요. 결핍은 주로 이런 경우에 생겨요.</p>
<ul>
<li><strong>지방 흡수 장애:</strong> 크론병, 낭포성 섬유증, 담즙 분비 장애, 만성 췌장염</li>
<li><strong>유전 질환:</strong> 비타민 E를 운반하는 단백질에 이상이 있는 드문 유전 질환</li>
<li><strong>미숙아:</strong> 체내 저장량이 적어요.</li>
</ul>
<p>결핍하면 말초 신경 손상, 균형 감각 저하, 근력 약화, 시야 이상이 생길 수 있어요.</p>

<h2>고용량 보충제: 기대와 결과</h2>
<p>관찰 연구에서 비타민 E를 많이 먹는 사람에게 심장병이 적다는 결과가 나오자, 1990~2000년대에 대규모 임상시험들이 이어졌어요.</p>
<div class="tbl"><table>
<thead><tr><th>연구</th><th>대상과 용량</th><th>결과</th></tr></thead>
<tbody>
<tr><td>HOPE / HOPE-TOO</td><td>심혈관 위험이 높은 사람, 하루 400IU</td><td>심혈관 사건 감소 없음, 심부전 증가</td></tr>
<tr><td>Physicians' Health Study II</td><td>남성 의사, 격일 400IU</td><td>심혈관 질환·암 감소 없음, 출혈성 뇌졸중 증가</td></tr>
<tr><td>SELECT</td><td>남성, 하루 400IU</td><td>전립선암 약 17% 증가</td></tr>
</tbody>
<caption>미국 국립보건원 식이보충제국(ODS) 비타민 E 자료에 정리된 주요 임상시험</caption></table></div>
<p>이 결과들 때문에 지금은 <strong>건강한 사람이 질병 예방을 목적으로 고용량 비타민 E를 먹는 것은 권장되지 않아요.</strong> 음식으로 먹는 비타민 E와 알약으로 먹는 고용량 비타민 E는 몸에서 다르게 작용할 수 있다는 걸 보여준 사례예요.</p>
<p>예외적으로 중등도 이상의 황반변성이 있는 사람에게는 비타민 E를 포함한 특정 영양제 조합(AREDS)이 진행을 늦추는 효과가 있어 안과에서 권하기도 해요.</p>

<div class="box warn"><span class="h">출혈 위험이 있는 경우 주의하세요</span>
<p>비타민 E는 고용량에서 혈소판 기능과 혈액 응고를 방해할 수 있어요. <strong>와파린 같은 항응고제, 아스피린·클로피도그렐 같은 항혈소판제</strong>를 먹는 사람이 고용량 비타민 E를 더하면 출혈 위험이 커질 수 있어요. 수술이나 시술을 앞두고 있다면 먹고 있는 영양제를 모두 알려요.</p></div>

<h2>바르는 비타민 E와 흉터</h2>
<p>상처 흉터에 비타민 E 오일을 바르면 좋다는 이야기가 많지만, 연구에서는 흉터 개선 효과가 뚜렷하지 않았고 오히려 접촉 피부염이 생긴 경우가 보고됐어요. 흉터 관리는 자외선 차단, 보습, 실리콘 제제가 더 근거가 있어요.</p>
<div class="box note"><span class="h">전자담배와 비타민 E 아세테이트</span>
<p>2019년 미국에서 전자담배 관련 중증 폐 손상이 잇따랐는데, 원인 물질로 대마 성분 액상에 섞인 <strong>비타민 E 아세테이트</strong>가 지목됐어요. 먹거나 바르면 문제가 없는 성분도 가열해 들이마시면 전혀 다른 위험이 될 수 있다는 사례예요.</p></div>

<div class="box"><span class="h">비타민 E 챙기는 법</span>
<ol>
<li>견과류나 씨앗을 하루 한 줌(무염)</li>
<li>나물과 볶음에 식물성 기름을 적당히</li>
<li>녹색 잎채소를 자주</li>
<li>보충제를 먹는다면 함량을 확인하고 고용량은 피하기</li>
<li>항응고제·항혈소판제를 먹는다면 보충제 전에 의사와 상의하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>비타민 E를 먹으면 피부가 좋아지나요?</dt>
<dd>결핍이 없는 사람에게 비타민 E 보충제가 피부 노화를 막는다는 근거는 부족해요. 자외선 차단과 금연, 충분한 수면이 피부에 더 큰 영향을 줘요.</dd>
<dt>종합비타민에 든 비타민 E도 위험한가요?</dt>
<dd>종합비타민에 든 양은 대개 하루 권장량 근처라서 문제가 되지 않아요. 위험이 보고된 건 하루 400IU 이상 고용량을 오래 먹은 경우예요.</dd>
<dt>견과류는 살이 찌지 않나요?</dt>
<dd>견과류는 열량이 높지만 한 줌 정도라면 체중 증가와 관련이 적고, 심혈관 건강에 도움이 된다는 연구가 많아요. 소금이나 설탕을 입히지 않은 것을 고르고 양을 정해 먹어요.</dd>
</dl>

  data-title="어른도 예방접종이 필요하다: 나이별 성인 백신 총정리와 무료 접종 확인법"
  data-thumb="10년|파상풍 추가"
  data-summary="예방접종은 어린이만의 일이 아니에요. 해마다 맞는 독감, 10년마다 파상풍, 50세 이후 대상포진, 65세 이후 폐렴구균까지 성인에게 필요한 백신을 나이와 상황별로 정리했어요. 임신부가 맞아야 할 백신, 접종 기록 조회 방법도 담았어요."
  data-tags="예방접종,백신,독감,대상포진,폐렴구균">
<p class="lead">어릴 때 맞은 백신의 효과는 시간이 지나며 약해지고, 나이가 들면 새로 위험해지는 감염병도 생겨요. 그래서 성인에게도 나이와 건강 상태에 맞춘 예방접종 일정이 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>독감</strong>은 해마다, <strong>파상풍·디프테리아(Td)</strong>는 10년마다 맞아요.</li>
<li><strong>50세 이상</strong>은 대상포진, <strong>65세 이상</strong>은 폐렴구균 백신을 챙겨요.</li>
<li>임신부는 <strong>매 임신마다 백일해 포함 백신(Tdap)</strong>과 독감 백신을 맞아요.</li>
<li>내 접종 기록은 <strong>질병관리청 예방접종도우미</strong>에서 조회할 수 있어요.</li>
</ul></div>

<h2>성인에게 권장되는 백신</h2>
<div class="tbl"><table>
<thead><tr><th>백신</th><th>대상</th><th>접종 방법</th></tr></thead>
<tbody>
<tr><td>인플루엔자 (독감)</td><td>모든 성인, 특히 65세 이상·임신부·만성질환자</td><td>매년 1회 (가을)</td></tr>
<tr><td>Td / Tdap (파상풍·디프테리아·백일해)</td><td>모든 성인</td><td>성인이 된 뒤 Tdap 1회, 이후 10년마다 Td 또는 Tdap</td></tr>
<tr><td>대상포진</td><td>50세 이상</td><td>재조합 백신 2회 또는 생백신 1회</td></tr>
<tr><td>폐렴구균</td><td>65세 이상, 만성질환이 있는 성인</td><td>백신 종류에 따라 1회 또는 순차 접종</td></tr>
<tr><td>B형간염</td><td>항체가 없는 성인</td><td>3회</td></tr>
<tr><td>A형간염</td><td>항체가 없는 성인 (특히 20~40대)</td><td>2회</td></tr>
<tr><td>MMR (홍역·볼거리·풍진)</td><td>면역의 증거가 없는 성인</td><td>1회 이상 (위험군은 2회)</td></tr>
<tr><td>수두</td><td>면역의 증거가 없는 성인</td><td>2회</td></tr>
<tr><td>사람유두종바이러스 (HPV)</td><td>청소년·젊은 성인</td><td>나이에 따라 2~3회</td></tr>
<tr><td>코로나19</td><td>고위험군 중심</td><td>해마다 발표되는 절기별 권고에 따름</td></tr>
</tbody>
<caption>질병관리청·대한감염학회 성인 예방접종 권고를 바탕으로 정리. 구체적인 일정은 건강 상태에 따라 달라요.</caption></table></div>

<h2>독감: 해마다 맞아야 하는 이유</h2>
<p>독감 바이러스는 해마다 조금씩 모양을 바꾸고, 백신으로 생긴 면역도 몇 달이 지나면 약해져요. 그래서 세계보건기구가 그해 유행할 바이러스를 예측해 백신을 새로 만들고, 우리는 <strong>매년 가을</strong>에 맞아요. 접종 후 항체가 생기는 데 약 2주가 걸리니 유행 전인 10~11월에 맞는 게 좋아요.</p>
<p>국가예방접종으로 <strong>65세 이상 어르신, 생후 6개월~13세 어린이, 임신부</strong>는 무료로 맞을 수 있어요. 대상 연령은 해마다 확인해요.</p>
<p>달걀 알레르기가 있어도 대부분 독감 백신을 맞을 수 있어요. 과거 백신에 심한 알레르기 반응이 있었다면 접종 전에 알려요.</p>

<h2>파상풍: 10년마다 잊기 쉬운 백신</h2>
<p>파상풍균은 흙과 녹슨 금속, 동물의 배설물에 흔하고, 상처를 통해 들어와 근육을 굳게 만드는 독소를 만들어요. 치료해도 사망률이 높은 병이에요. 어릴 때 맞은 면역은 시간이 지나면 약해지기 때문에 <strong>10년마다 추가 접종</strong>이 필요해요.</p>
<ul>
<li>성인이 된 뒤 한 번은 <strong>백일해가 포함된 Tdap</strong>으로 맞아요. 백일해는 어른에게는 오래가는 기침 정도지만 아기에게는 치명적일 수 있어서, 아기와 함께 지내는 어른이 맞으면 아기를 보호할 수 있어요.</li>
<li>흙이 묻은 깊은 상처를 입었는데 마지막 접종이 5년 넘었다면 병원에서 추가 접종이 필요할 수 있어요.</li>
</ul>

<h2>대상포진: 50세 이후</h2>
<p>어릴 때 앓은 수두 바이러스는 신경절에 숨어 있다가, 나이가 들거나 면역이 떨어지면 다시 깨어나 대상포진을 일으켜요. 발진이 나은 뒤에도 몇 달, 몇 년씩 이어지는 <strong>대상포진 후 신경통</strong>이 가장 큰 문제예요.</p>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>재조합 백신</th><th>생백신</th></tr></thead>
<tbody>
<tr><td>접종 횟수</td><td>2회 (2~6개월 간격)</td><td>1회</td></tr>
<tr><td>예방 효과</td><td>높고 오래 유지되는 편</td><td>나이가 많을수록 낮아지고 시간이 지나며 감소</td></tr>
<tr><td>면역저하자</td><td>접종 가능</td><td>접종 불가</td></tr>
<tr><td>흔한 이상반응</td><td>접종 부위 통증, 근육통, 피로 (1~3일)</td><td>접종 부위 반응</td></tr>
</tbody></table></div>
<p>대상포진을 앓은 적이 있어도 재발할 수 있어서 회복 후 접종을 권해요. 일부 지자체는 어르신 대상포진 접종비를 지원하니 보건소에 확인해 보세요.</p>

<h2>폐렴구균: 65세 이후</h2>
<p>폐렴구균은 폐렴, 수막염, 균혈증을 일으키는 흔한 세균이에요. 특히 노인과 만성질환자에게 위험해요. <strong>65세 이상은 23가 다당 백신(PPSV23) 1회를 국가예방접종으로 무료</strong>로 맞을 수 있어요. 단백결합 백신(PCV)을 함께 맞는 방법도 있는데, 백신 종류와 순서에 대한 권고가 계속 업데이트되고 있어서 의사와 상의해 정해요.</p>
<p>당뇨병, 만성 심장·폐·간·콩팥 질환, 면역저하, 비장 절제, 흡연자 등은 65세 이전에도 접종을 권해요.</p>

<h2>간염과 소아 백신 따라잡기</h2>
<ul>
<li><strong>A형간염:</strong> 위생 환경이 좋아진 세대인 20~40대는 어릴 때 자연 감염을 겪지 않아 항체가 없는 경우가 많아요. 성인이 걸리면 증상이 심할 수 있어요. 항체 검사 후 2회 접종해요.</li>
<li><strong>B형간염:</strong> 항체가 없다면 3회 접종해요. 가족 중 B형간염 보유자가 있다면 특히 챙겨요.</li>
<li><strong>MMR·수두:</strong> 접종 기록이 없거나 앓은 적이 확실하지 않다면 항체 검사나 접종을 고려해요. 해외에서 홍역이 유행할 때 여행 전 확인하면 좋아요.</li>
</ul>

<h2>임신 전과 임신 중</h2>
<div class="box warn"><span class="h">임신과 백신</span>
<ul>
<li><strong>임신 전:</strong> 풍진, 수두 항체를 확인하고 없으면 접종해요. MMR과 수두는 생백신이라 <strong>접종 후 1개월은 피임</strong>해요.</li>
<li><strong>임신 중:</strong> <strong>독감 백신</strong>(임신 주수와 관계없이)과 <strong>Tdap</strong>(매 임신 27~36주)을 맞아요. 엄마의 항체가 태반을 통해 아기에게 전해져 생후 초기를 지켜줘요.</li>
<li><strong>임신 중 피해야 할 백신:</strong> MMR, 수두, 대상포진 생백신 같은 생백신이에요.</li>
</ul></div>

<h2>접종 전후에 알아둘 것</h2>
<ul>
<li>열이 나거나 몸이 많이 아플 때는 좋아진 뒤에 맞아요. 가벼운 감기는 괜찮은 경우가 많아요.</li>
<li>접종 후 <strong>20~30분</strong>은 접종 기관에 머물며 알레르기 반응이 없는지 확인해요.</li>
<li>접종 부위가 붓고 아프거나 미열, 근육통은 흔하고 대개 1~2일 안에 좋아져요.</li>
<li>여러 백신을 같은 날 맞아도 되는 경우가 많아요. 생백신끼리는 같은 날 맞거나 4주 간격을 둬요.</li>
<li>숨이 차거나 얼굴·목이 붓는 심한 알레르기 반응은 바로 119에 연락해요.</li>
</ul>

<div class="box"><span class="h">나의 백신 점검표</span>
<ol>
<li>질병관리청 예방접종도우미(nip.kdca.go.kr)에서 내 접종 기록 조회하기</li>
<li>마지막 파상풍 접종이 10년 넘었는지 확인하기</li>
<li>올가을 독감 백신 일정 잡기</li>
<li>50세 이상이면 대상포진, 65세 이상이면 폐렴구균 접종 여부 확인하기</li>
<li>A형·B형간염 항체를 모른다면 다음 검진 때 검사하기</li>
<li>임신 계획이 있다면 풍진·수두 항체 확인하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>독감 백신을 맞았는데 독감에 걸렸어요.</dt>
<dd>독감 백신의 예방 효과는 그해 유행 바이러스와 백신이 얼마나 맞는지에 따라 달라요. 걸리더라도 백신을 맞은 사람은 입원이나 중증으로 가는 위험이 줄어든다는 연구가 많아요.</dd>
<dt>백신을 맞으면 그 병에 걸릴 수 있나요?</dt>
<dd>독감 주사, Tdap, 재조합 대상포진 백신처럼 살아 있는 병원체가 없는 백신은 그 병을 일으킬 수 없어요. 생백신은 면역이 크게 떨어진 사람에게는 위험할 수 있어 접종 대상을 가려요.</dd>
<dt>어릴 때 접종 기록이 없어요.</dt>
<dd>기록이 없으면 맞지 않은 것으로 보고 다시 맞는 것이 원칙이에요. 항체 검사로 면역을 확인할 수 있는 백신도 있어요. 예방접종을 추가로 맞아도 대부분 해가 되지 않아요.</dd>
</dl>

<h2>참고 자료</h2>
<ul class="refs">
<li>질병관리청, 성인 예방접종 안내 및 예방접종도우미</li>
<li>대한감염학회, 성인 예방접종 권고</li>
<li>질병관리청, 국가예방접종사업 대상 및 일정</li>
<li>미국 질병통제예방센터(CDC), Adult Immunization Schedule</li>
</ul>

  data-tags="영양성분표,식품표시,나트륨,당류,장보기">
<p class="lead">같은 과자라도 뒷면을 30초만 읽으면 오늘 나트륨을 얼마나 먹게 될지, 이 제품이 한 번 먹을 양인지 세 번 먹을 양인지 알 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>영양성분표는 먼저 <strong>기준량(총 내용량, 100g, 1회 섭취량)</strong>부터 확인해요.</li>
<li>%는 <strong>1일 영양성분 기준치</strong>에 대한 비율이에요. 나트륨 기준치는 <strong>2,000mg</strong>이에요.</li>
<li>'무가당'은 설탕을 넣지 않았다는 뜻이지 <strong>당이 없다는 뜻이 아니에요.</strong></li>
<li>원재료명은 <strong>많이 들어간 순서</strong>로 적혀 있어요.</li>
</ul></div>

<h2>1단계: 기준량부터 보기</h2>
<p>영양성분표 맨 위에는 <strong>무엇을 기준으로 표시했는지</strong>가 적혀 있어요. 제품에 따라 총 내용량당, 100g(mL)당, 1회 섭취참고량당, 단위(1개, 1조각)당으로 표시해요.</p>
<ul>
<li>과자 한 봉지의 총 내용량이 150g인데 영양성분이 "30g당"으로 적혀 있다면, 한 봉지를 다 먹으면 <strong>표시된 숫자의 다섯 배</strong>를 먹는 거예요.</li>
<li>라면처럼 면과 스프가 함께 있는 제품은 전체 한 봉지 기준으로 보는 게 현실적이에요.</li>
<li>두 제품을 비교할 때는 <strong>같은 기준(예: 100g당)</strong>으로 맞춰야 정확해요.</li>
</ul>

<h2>2단계: %가 말해주는 것</h2>
<p>각 영양성분 옆의 %는 <strong>1일 영양성분 기준치</strong>에 대한 비율이에요. 이 제품 하나로 하루 기준치의 몇 %를 먹는지 알려줘요.</p>
<div class="tbl"><table>
<thead><tr><th>영양성분</th><th>1일 영양성분 기준치</th></tr></thead>
<tbody>
<tr><td>나트륨</td><td class="num">2,000mg</td></tr>
<tr><td>탄수화물</td><td class="num">324g</td></tr>
<tr><td>당류</td><td class="num">100g</td></tr>
<tr><td>지방</td><td class="num">54g</td></tr>
<tr><td>포화지방</td><td class="num">15g</td></tr>
<tr><td>콜레스테롤</td><td class="num">300mg</td></tr>
<tr><td>단백질</td><td class="num">55g</td></tr>
<tr><td>식이섬유</td><td class="num">25g</td></tr>
</tbody>
<caption>식품의약품안전처, 식품 등의 표시기준. 트랜스지방은 기준치가 없어 %를 표시하지 않아요.</caption></table></div>
<h3>빠르게 판단하는 요령</h3>
<ul>
<li><strong>5% 이하면 적은 편, 20% 이상이면 많은 편</strong>으로 보면 간단해요.</li>
<li>나트륨, 포화지방, 당류는 %가 <strong>낮은 것</strong>을, 식이섬유와 단백질은 <strong>높은 것</strong>을 고르면 대체로 좋은 선택이에요.</li>
<li>이 기준치는 하루 2,000kcal를 먹는 성인을 가정한 값이라 사람마다 필요량은 달라요.</li>
</ul>

<h2>3단계: 꼭 볼 세 가지</h2>
<h3>나트륨</h3>
<p>한국인에게 가장 과한 영양소예요. 라면, 즉석국, 컵밥, 가공육, 과자에 많아요. 라면 한 봉지는 대개 나트륨 기준치의 상당 부분을 차지해요. 제품을 고를 때 같은 종류 중 나트륨 %가 낮은 걸 고르기만 해도 차이가 커요.</p>
<h3>당류</h3>
<p>영양성분표의 '당류'는 설탕처럼 <strong>넣은 당과 과일·우유에 원래 있는 당을 모두 합친 값</strong>이에요. 세계보건기구는 첨가당(자유당)을 하루 열량의 10% 미만, 가능하면 5% 미만으로 줄이라고 권해요. 하루 2,000kcal라면 10%는 약 50g, 5%는 약 25g이에요. 달콤한 음료 한 병에 20~30g이 들어 있는 경우도 흔해요.</p>
<h3>포화지방과 트랜스지방</h3>
<p>포화지방은 LDL 콜레스테롤을 올려요. 트랜스지방은 LDL을 올리고 HDL을 낮춰 더 해로워요. 국내 표시 기준에서 트랜스지방은 <strong>0.2g 미만이면 '0'으로 표시</strong>할 수 있어서, 원재료명에 '부분경화유'가 있다면 조금 들어 있을 수 있어요.</p>

<h2>강조 표시의 기준</h2>
<div class="tbl"><table>
<thead><tr><th>표시</th><th>뜻 (주요 기준)</th></tr></thead>
<tbody>
<tr><td>무당, 무설탕</td><td>당류가 100g(mL)당 0.5g 미만</td></tr>
<tr><td>무가당</td><td>제조 과정에서 당을 <strong>넣지 않음</strong>. 원재료에 원래 있는 당은 들어 있을 수 있어요</td></tr>
<tr><td>저나트륨</td><td>나트륨이 100g당 120mg 미만</td></tr>
<tr><td>무열량 (제로 칼로리)</td><td>열량이 100mL당 4kcal 미만</td></tr>
<tr><td>저지방</td><td>지방이 100g당 3g 미만 (액체는 100mL당 1.5g 미만)</td></tr>
<tr><td>고식이섬유</td><td>식이섬유가 100g당 6g 이상 등</td></tr>
</tbody>
<caption>식품의약품안전처, 식품 등의 표시기준 영양성분 강조표시 기준을 바탕으로 정리. 세부 조건이 더 있어요.</caption></table></div>
<div class="box note"><span class="h">'제로' 음료는 괜찮을까</span>
<p>제로 칼로리 음료는 설탕 대신 아스파탐, 수크랄로스, 아세설팜칼륨, 에리스리톨 같은 감미료를 써요. 허용 기준 안에서 쓰여 안전성은 관리되고 있어요. 다만 세계보건기구는 2023년 지침에서 체중 조절 목적으로 비당류 감미료를 쓰는 것을 권하지 않는다고 밝혔어요. 단맛에 익숙해지는 습관 자체를 줄이는 게 장기적으로 좋다는 취지예요. 설탕 음료를 줄이는 징검다리로 쓰되, 물로 바꿔가는 게 가장 좋아요.</p></div>

<h2>원재료명 읽기</h2>
<ul>
<li>원재료는 <strong>많이 들어간 순서대로</strong> 적어요. 첫 번째에 설탕이나 물엿이 있다면 가장 많이 들어간 재료가 당이라는 뜻이에요.</li>
<li>설탕은 이름이 여러 가지예요. <strong>설탕, 물엿, 액상과당, 과당, 포도당, 올리고당, 당시럽, 조청</strong> 등이 모두 당류예요. 여러 이름으로 나뉘어 있으면 순서가 뒤로 밀려 보일 수 있어요.</li>
<li>'OO맛', 'OO향'은 그 재료가 들어 있지 않거나 아주 적을 수 있어요. 함량이 표시돼 있는지 확인해요.</li>
</ul>

<h2>알레르기 표시</h2>
<p>식품의약품안전처는 알레르기를 일으키는 주요 원료(달걀, 우유, 메밀, 땅콩, 대두, 밀, 고등어, 게, 새우, 돼지고기, 복숭아, 토마토, 아황산류, 호두, 닭고기, 쇠고기, 오징어, 조개류, 잣 등)를 표시하도록 하고 있어요. 원재료명 근처에 따로 표시돼 있어요. 같은 공장에서 이런 원료를 함께 쓰는 경우 <strong>'같은 제조 시설에서 제조'</strong>라는 문구를 넣기도 해요. 알레르기가 심한 사람은 이 문구도 확인해요.</p>

<h2>건강기능식품과 일반 식품 구별하기</h2>
<ul>
<li><strong>건강기능식품</strong>은 식품의약품안전처가 기능성을 인정한 원료를 쓰고, 포장에 <strong>'건강기능식품' 문구와 인증 마크</strong>가 있어요. 인정된 기능성 문구(예: "뼈 건강에 도움을 줄 수 있음")만 쓸 수 있어요.</li>
<li>'건강식품', '천연식품'처럼 표시된 일반 식품은 기능성을 인정받은 제품이 아니에요.</li>
<li>질병을 예방하거나 치료한다는 표현은 식품에 쓸 수 없어요. 그런 광고를 보면 의심해요.</li>
</ul>

<div class="box"><span class="h">장볼 때 30초 점검</span>
<ol>
<li>기준량과 총 내용량 확인하기 (한 봉지가 몇 회분인지)</li>
<li>나트륨 % 확인하기 (20% 이상이면 많은 편)</li>
<li>당류 g 확인하기 (음료라면 특히)</li>
<li>포화지방·트랜스지방 확인하기</li>
<li>원재료명 첫 세 가지 보기</li>
<li>알레르기 표시와 소비기한 확인하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>영양성분표가 없는 식품도 있나요?</dt>
<dd>즉석에서 만들어 파는 음식이나 일부 농·수산물 등은 표시 의무가 없을 수 있어요. 대형 프랜차이즈 음식점은 영양성분 정보를 매장이나 홈페이지에 공개하는 경우가 많아요.</dd>
<dt>천연 당은 괜찮고 첨가당만 줄이면 되나요?</dt>
<dd>과일이나 우유에 든 당은 식이섬유, 비타민, 단백질과 함께 있어서 첨가당과는 다르게 봐요. 다만 과일주스처럼 당만 농축된 형태는 첨가당과 비슷하게 작용할 수 있어서 적게 먹는 게 좋아요.</dd>
<dt>열량만 보면 되지 않나요?</dt>
<dd>열량이 같아도 나트륨, 당, 포화지방, 식이섬유, 단백질 구성에 따라 건강에 미치는 영향이 달라요. 열량과 함께 이 항목들을 보는 게 좋아요.</dd>
</dl>

<template data-id="shingles" data-cat="dis" data-date="2026.09.29"
  data-title="대상포진 완전 정리: 초기 증상, 72시간 골든타임, 신경통과 백신까지"
  data-thumb="72h|항바이러스제"
  data-summary="몸 한쪽에 띠 모양으로 물집이 생기는 대상포진은 발진보다 통증이 먼저 오는 경우가 많아요. 어릴 때 앓은 수두 바이러스가 다시 깨어나는 원리, 놓치기 쉬운 초기 증상, 빨리 치료해야 하는 이유, 눈과 귀 대상포진, 대상포진 후 신경통, 백신 효과까지 정리했어요."
  data-tags="대상포진,수두,신경통,백신,피부질환">
<p class="lead">대상포진은 새로 걸리는 병이 아니에요. 어릴 때 앓았던 수두 바이러스가 수십 년 동안 신경 속에 숨어 있다가 다시 깨어나는 병이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>평생 동안 <strong>약 3명 중 1명</strong>이 대상포진을 겪어요. 50세 이후 크게 늘어요.</li>
<li>물집보다 <strong>몸 한쪽의 따끔거리는 통증</strong>이 며칠 먼저 오는 경우가 많아요.</li>
<li>항바이러스제는 발진이 생긴 뒤 <strong>72시간 안에</strong> 시작하는 게 좋아요.</li>
<li><strong>이마·코끝</strong>에 생기면 눈, <strong>귀</strong> 주변이면 얼굴 마비와 청력을 확인해야 해요.</li>
</ul></div>

<h2>수두 바이러스가 다시 깨어나는 원리</h2>
<p>수두를 앓고 나면 바이러스는 완전히 사라지지 않고 척수 옆이나 뇌신경의 <strong>신경절</strong>에 잠복해요. 평소에는 면역체계가 바이러스를 눌러두지만, 나이가 들거나 병, 약물, 극심한 피로로 면역이 떨어지면 바이러스가 다시 활동하면서 <strong>신경을 따라 피부로</strong> 내려와요.</p>
<p>그래서 대상포진은 한 신경이 담당하는 피부 영역, 즉 <strong>몸의 한쪽에 띠 모양</strong>으로 나타나요. 몸 가운데 선을 넘지 않는 게 특징이에요. 가슴과 등(흉부)에 가장 흔하고, 얼굴, 목, 허리, 다리에도 생겨요.</p>
<h3>누가 잘 걸릴까</h3>
<ul>
<li>50세 이상 (나이가 들수록 위험이 크게 늘어요)</li>
<li>면역이 약해진 사람: 암 치료 중, 장기 이식, 면역억제제·스테로이드 복용, HIV 감염</li>
<li>당뇨병, 만성 콩팥병 같은 만성질환이 있는 사람</li>
<li>국내에서는 여성에게 조금 더 많이 보고돼요.</li>
</ul>

<h2>증상의 순서</h2>
<div class="tbl"><table>
<thead><tr><th>시기</th><th>증상</th></tr></thead>
<tbody>
<tr><td>전구기 (발진 1~5일 전)</td><td>몸 한쪽 일정 부위의 따끔거림, 화끈거림, 찌르는 듯한 통증, 가려움. 두통, 미열, 피로</td></tr>
<tr><td>발진기</td><td>통증 부위에 붉은 반점 → 물집이 무리 지어 생김</td></tr>
<tr><td>딱지기 (7~10일)</td><td>물집이 터지고 딱지가 앉음</td></tr>
<tr><td>회복기 (2~4주)</td><td>딱지가 떨어지며 회복. 흉터나 색소 변화가 남기도 함</td></tr>
</tbody></table></div>
<p>발진 전의 통증 때문에 디스크, 근육통, 심지어 심장이나 담석 문제로 오해하기도 해요. 몸 한쪽의 특정 부위만 피부가 쓰라리고 옷깃만 스쳐도 아프다면 대상포진을 의심해 볼 수 있어요.</p>

<h2>72시간 안에 치료를 시작해야 하는 이유</h2>
<p>대상포진 치료의 핵심은 <strong>항바이러스제</strong>(아시클로버, 발라시클로버, 팜시클로버)예요. 바이러스가 늘어나는 것을 막아 발진이 빨리 낫고 통증이 줄며, 합병증 위험을 낮춰요. 효과가 가장 좋은 건 <strong>발진이 생긴 뒤 72시간 안에</strong> 시작했을 때예요. 보통 7일 동안 먹어요.</p>
<p>72시간이 지났더라도 새 물집이 계속 생기거나, 눈이나 귀에 생겼거나, 면역이 약한 사람이라면 치료가 도움이 될 수 있어요. 늦었다고 포기하지 말고 진료를 받아요.</p>
<h3>집에서 할 수 있는 관리</h3>
<ul>
<li>물집을 터뜨리거나 긁지 않아요. 세균 감염과 흉터가 생길 수 있어요.</li>
<li>시원하고 젖은 거즈를 대면 통증과 가려움이 줄어요.</li>
<li>헐렁하고 부드러운 면 옷을 입어요.</li>
<li>처방받은 진통제를 제때 먹어요. 통증을 참는 것이 신경통을 막는 데 도움이 되지 않아요.</li>
<li>충분히 쉬고 잘 먹어요.</li>
</ul>

<h2>특히 조심해야 하는 부위</h2>
<div class="box warn"><span class="h">얼굴에 생긴 대상포진은 빨리 진료를 받으세요</span>
<ul>
<li><strong>이마, 눈 주위, 코끝</strong>: 삼차신경의 눈 가지를 침범한 대상포진이에요. 특히 코끝에 물집이 있으면 눈 침범 가능성이 높아요. 각막염, 포도막염으로 시력이 손상될 수 있어 <strong>안과 진료</strong>가 필요해요.</li>
<li><strong>귀 주변, 귓속</strong>: 얼굴 한쪽 마비, 청력 저하, 어지럼증이 함께 올 수 있어요(람세이 헌트 증후군). 빠른 치료가 중요해요.</li>
<li>물집이 몸의 여러 부위로 퍼지거나, 고열·두통·목 경직·의식 변화가 있다면 응급 진료가 필요해요.</li>
</ul></div>

<h2>대상포진 후 신경통</h2>
<p>발진이 다 나은 뒤에도 그 부위에 <strong>3개월 넘게</strong> 통증이 남는 것을 대상포진 후 신경통이라고 해요. 바이러스가 신경을 손상시켜 생기는 통증이에요. 대상포진 환자의 약 10~18%에서 생기고, 나이가 많을수록 위험이 커져요.</p>
<ul>
<li>타는 듯하거나 찌르는 통증, 옷이 스치기만 해도 아픈 통증(이질통)</li>
<li>잠을 못 자고 일상생활이 어려워질 만큼 심할 수 있어요.</li>
<li>치료: 신경병증 통증약(가바펜틴, 프레가발린 등), 일부 항우울제, 리도카인 패치, 신경 차단술 등. 통증 전문 진료가 도움이 돼요.</li>
</ul>

<h2>대상포진은 옮을까</h2>
<p>대상포진 자체가 다른 사람에게 대상포진으로 옮지는 않아요. 하지만 <strong>물집 속 바이러스</strong>가 수두를 앓지 않았거나 수두 백신을 맞지 않은 사람에게 닿으면 <strong>수두</strong>를 일으킬 수 있어요.</p>
<ul>
<li>물집에 딱지가 앉을 때까지는 발진 부위를 옷이나 거즈로 덮어요.</li>
<li>물집을 만진 뒤에는 손을 씻어요.</li>
<li>수두 면역이 없는 임신부, 신생아, 면역이 약한 사람과의 접촉은 피해요.</li>
</ul>

<h2>백신: 얼마나 막아줄까</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>재조합 백신</th><th>생백신</th></tr></thead>
<tbody>
<tr><td>대상</td><td>50세 이상, 18세 이상 면역저하자</td><td>50세 이상 (면역저하자 제외)</td></tr>
<tr><td>접종</td><td>2회 (2~6개월 간격)</td><td>1회</td></tr>
<tr><td>대상포진 예방 효과</td><td>50대 이상에서 약 90% 이상 (임상시험 기준)</td><td>약 50% 안팎, 나이가 많을수록 낮아짐</td></tr>
<tr><td>효과 지속</td><td>여러 해 동안 높게 유지</td><td>시간이 지나며 감소</td></tr>
</tbody>
<caption>ZOE-50·ZOE-70, Shingles Prevention Study 등 임상시험 결과를 바탕으로 정리</caption></table></div>
<p>대상포진을 이미 앓았어도 재발할 수 있어서 회복된 뒤 접종을 권해요. 재조합 백신은 접종 후 1~3일 정도 팔 통증, 근육통, 피로가 흔하지만 대부분 저절로 좋아져요. 백신 선택과 시기는 의사와 상의해요.</p>

<div class="box"><span class="h">대상포진 의심될 때 체크리스트</span>
<ol>
<li>통증이나 발진이 몸의 한쪽에만 있는지 확인하기</li>
<li>발진이 처음 보인 날짜와 시간 기억하기</li>
<li>가능한 한 빨리(72시간 안) 진료 받기</li>
<li>얼굴, 특히 눈과 코끝, 귀 주변이면 안과·이비인후과 진료도 받기</li>
<li>물집은 덮어두고, 임신부·아기와 접촉 피하기</li>
<li>회복 후 백신 접종 상담하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>대상포진은 한 번 걸리면 다시 안 걸리나요?</dt>
<dd>다시 걸릴 수 있어요. 재발률은 높지 않지만, 면역이 약하면 더 흔해요. 그래서 앓은 뒤에도 백신 접종을 권해요.</dd>
<dt>스트레스 때문에 생기나요?</dt>
<dd>스트레스와 피로가 면역을 떨어뜨려 계기가 될 수 있다는 의견이 있지만, 가장 큰 위험 요인은 나이와 면역 저하예요.</dd>
<dt>수두를 앓은 기억이 없는데 대상포진이 생겼어요.</dt>
<dd>어릴 때 가볍게 앓고 지나가 기억하지 못하는 경우가 많아요. 성인 대부분은 수두 바이러스에 노출된 적이 있어요.</dd>
</dl>

<h2>참고 자료</h2>
<ul class="refs">
<li>질병관리청 국가건강정보포털, 대상포진</li>
<li>미국 질병통제예방센터(CDC), Shingles (Herpes Zoster) Clinical Overview</li>
<li>Lal H 외, Efficacy of an adjuvanted herpes zoster subunit vaccine in older adults (ZOE-50), NEJM 2015</li>
<li>대한피부과학회, 대상포진 건강 정보</li>
</ul>
</template>

<template data-id="vitamin-k" data-cat="nut" data-date="2026.09.29"
  data-title="비타민 K 총정리: 피를 멈추게 하는 비타민, 와파린 복용자가 알아야 할 식사법"
  data-thumb="K|응고 비타민"
  data-summary="비타민 K는 피가 굳는 데 꼭 필요한 영양소예요. 녹색 채소의 K1과 발효식품의 K2 차이, 하루 필요량과 식품별 함량, 신생아가 태어나자마자 비타민 K 주사를 맞는 이유, 와파린을 먹는 사람이 녹색 채소를 '일정하게' 먹어야 하는 이유를 정리했어요."
  data-tags="비타민K,와파린,녹색채소,신생아,혈액응고">
<p class="lead">비타민 K의 K는 독일어로 '응고'를 뜻하는 Koagulation에서 왔어요. 이름처럼 피가 멈추게 하는 일을 해요. 그래서 피를 묽게 하는 약을 먹는 사람에게 특히 중요한 영양소예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인 충분섭취량은 남성 <strong>75μg</strong>, 여성 <strong>65μg</strong>이에요. 녹색 잎채소 한 접시면 넉넉히 채워요.</li>
<li>신생아는 비타민 K가 부족하게 태어나서 <strong>출생 직후 비타민 K 주사</strong>를 맞아요.</li>
<li><strong>와파린</strong>을 먹는다면 녹색 채소를 끊지 말고 <strong>매일 비슷한 양</strong>을 먹는 게 핵심이에요.</li>
<li>새로운 먹는 항응고제(DOAC)는 비타민 K의 영향을 거의 받지 않아요.</li>
</ul></div>

<h2>비타민 K가 하는 일</h2>
<p>피가 멈추려면 여러 응고 인자가 차례로 작동해야 해요. 이 중 제2, 7, 9, 10 응고 인자는 간에서 만들어질 때 <strong>비타민 K가 있어야 제 기능</strong>을 해요. 비타민 K가 부족하면 작은 상처에도 피가 잘 멈추지 않고 멍이 쉽게 들어요.</p>
<p>비타민 K는 뼈에서 칼슘을 붙잡는 단백질(오스테오칼신)과 혈관에 칼슘이 쌓이지 않게 하는 단백질을 활성화하는 데도 관여해요. 그래서 뼈와 혈관 건강과의 관계도 연구되고 있어요.</p>

<h2>K1과 K2</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>비타민 K1 (필로퀴논)</th><th>비타민 K2 (메나퀴논)</th></tr></thead>
<tbody>
<tr><td>들어 있는 곳</td><td>시금치, 케일, 브로콜리, 상추, 깻잎 같은 녹색 채소, 식물성 기름</td><td>낫토, 청국장 같은 발효 콩, 치즈, 달걀노른자, 간</td></tr>
<tr><td>특징</td><td>식단에서 가장 주된 비타민 K</td><td>장내 세균도 일부 만들어요. 몸에 머무는 시간이 더 길어요</td></tr>
</tbody></table></div>

<h2>하루 필요량과 식품</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th>충분섭취량</th></tr></thead>
<tbody>
<tr><td>성인 남성</td><td class="num">75μg</td></tr>
<tr><td>성인 여성</td><td class="num">65μg</td></tr>
</tbody>
<caption>보건복지부·한국영양학회, 2020 한국인 영양소 섭취기준. 음식으로 인한 독성이 보고되지 않아 상한섭취량은 정해져 있지 않아요.</caption></table></div>
<div class="tbl"><table>
<thead><tr><th>식품</th><th>분량</th><th>비타민 K (약)</th></tr></thead>
<tbody>
<tr><td>낫토</td><td>85g</td><td class="num">850μg</td></tr>
<tr><td>케일 (생)</td><td>1컵</td><td class="num">113μg</td></tr>
<tr><td>시금치 (생)</td><td>1컵</td><td class="num">145μg</td></tr>
<tr><td>브로콜리 (익힌 것)</td><td>½컵</td><td class="num">110μg</td></tr>
<tr><td>대두 (익힌 것)</td><td>½컵</td><td class="num">43μg</td></tr>
<tr><td>풋콩 (에다마메)</td><td>½컵</td><td class="num">21μg</td></tr>
</tbody>
<caption>미국 국립보건원 식이보충제국(ODS) 자료 기준. 깻잎, 쑥갓, 근대, 부추, 녹차잎 같은 우리 식재료에도 많아요.</caption></table></div>
<p>비타민 K도 지용성이라 나물을 기름에 무치거나 볶으면 흡수가 좋아져요.</p>

<h2>신생아 비타민 K 주사</h2>
<p>아기는 비타민 K를 아주 적게 가지고 태어나요. 태반을 잘 통과하지 못하고, 장에 세균이 아직 자리 잡지 않았으며, 모유에도 비타민 K가 적기 때문이에요. 그래서 드물지만 생후 몇 주~몇 달 사이에 <strong>뇌출혈 같은 심각한 출혈</strong>(비타민 K 결핍성 출혈)이 생길 수 있어요.</p>
<p>이를 막기 위해 국내외에서 <strong>출생 직후 비타민 K 근육주사</strong>를 표준으로 권하고 있어요. 한 번의 주사로 위험한 출혈을 크게 줄일 수 있는, 효과가 분명한 예방법이에요.</p>

<h2>와파린을 먹는다면: '끊지 말고 일정하게'</h2>
<p>와파린은 비타민 K가 응고 인자를 활성화하는 과정을 막아서 피를 묽게 하는 약이에요. 그래서 먹는 비타민 K 양이 갑자기 바뀌면 약효가 흔들려요.</p>
<div class="tbl"><table>
<thead><tr><th>상황</th><th>일어나는 일</th></tr></thead>
<tbody>
<tr><td>녹색 채소를 갑자기 많이 먹음</td><td>와파린 효과 감소 → 혈전 위험 증가 (INR 낮아짐)</td></tr>
<tr><td>녹색 채소를 갑자기 끊음</td><td>와파린 효과 증가 → 출혈 위험 증가 (INR 높아짐)</td></tr>
</tbody></table></div>
<div class="box note"><span class="h">와파린 복용자의 식사 원칙</span>
<ul>
<li>녹색 채소를 피할 필요는 없어요. <strong>매일 비슷한 양</strong>을 먹는 게 중요해요.</li>
<li>녹즙, 청국장·낫토, 케일 주스처럼 비타민 K가 매우 많은 음식을 갑자기 시작하거나 끊지 않아요.</li>
<li>식습관을 크게 바꾸거나(다이어트, 여행, 명절) 새 영양제·한약을 시작할 때는 미리 의사에게 알리고 INR 검사를 받아요.</li>
<li>술, 일부 항생제, 진통제, 한약재도 와파린 효과를 바꿀 수 있어요.</li>
</ul></div>
<p>아픽사반, 리바록사반, 에독사반, 다비가트란 같은 <strong>새로운 먹는 항응고제(DOAC)</strong>는 비타민 K와 다른 방식으로 작용해서 음식의 영향을 거의 받지 않아요. 내가 먹는 약이 무엇인지 확인해 보세요.</p>

<h2>결핍이 생길 수 있는 경우</h2>
<p>건강한 성인은 음식과 장내 세균 덕분에 결핍이 드물어요. 다만 이런 경우에는 부족할 수 있어요.</p>
<ul>
<li>지방 흡수 장애 (담도 폐쇄, 만성 췌장염, 셀리악병, 크론병)</li>
<li>항생제를 오래 먹으면서 식사를 거의 못 하는 경우</li>
<li>비만 수술 후</li>
<li>간 질환 (응고 인자를 만드는 능력 자체가 떨어져요)</li>
</ul>
<p>멍이 쉽게 들고, 코피나 잇몸 출혈이 잦고, 상처에서 피가 잘 멈추지 않는다면 진료를 받아요.</p>

<h2>뼈 건강과 비타민 K2 보충제</h2>
<p>비타민 K가 뼈 단백질을 활성화한다는 점 때문에 골다공증 예방 효과가 기대돼 왔어요. 일본에서는 비타민 K2 제제를 골다공증 치료에 쓰기도 해요. 하지만 여러 연구를 모은 결과는 일관되지 않아서, 대부분의 진료지침은 <strong>골다공증 예방이나 치료 목적으로 비타민 K 보충제를 일반적으로 권하지는 않아요.</strong> 녹색 채소를 충분히 먹는 것이 먼저예요.</p>

<div class="box"><span class="h">비타민 K 체크리스트</span>
<ol>
<li>녹색 잎채소를 하루 한 접시 이상 먹기</li>
<li>와파린을 먹는다면 채소 양을 일정하게 유지하기</li>
<li>녹즙, 새 영양제, 한약을 시작하기 전에 의사·약사와 상의하기</li>
<li>출산을 앞두고 있다면 신생아 비타민 K 주사에 대해 알아두기</li>
<li>이유 없이 멍이 잘 들면 진료 받기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>와파린을 먹으면 시금치를 먹으면 안 되나요?</dt>
<dd>먹어도 돼요. 문제는 양이 들쭉날쭉한 거예요. 평소에 먹던 만큼 꾸준히 먹으면 의사가 그 식습관에 맞춰 약 용량을 조절해요.</dd>
<dt>비타민 K 보충제를 먹으면 혈전이 생기나요?</dt>
<dd>건강한 사람이 비타민 K를 먹는다고 혈전이 생기지는 않아요. 응고 인자는 필요 이상으로 활성화되지 않아요. 다만 와파린 복용자는 약효가 떨어지니 주의해요.</dd>
<dt>종합비타민에도 비타민 K가 들어 있나요?</dt>
<dd>제품에 따라 들어 있어요. 와파린을 먹는다면 종합비타민을 새로 시작하거나 바꿀 때도 의사에게 알려요.</dd>
</dl>

  data-title="건강검진 결과지 읽는 법: 항목별 기준치, 판정의 뜻, 놓치면 안 되는 암 검진"
  data-thumb="2년|국가검진 주기"
  data-summary="건강검진 결과지를 받아도 '정상B'나 '질환의심'이 무슨 뜻인지 헷갈리기 쉬워요. 국가건강검진의 판정 구분, 체질량지수·혈압·혈당·콜레스테롤·간·콩팥·빈혈 항목의 기준, 나이별 국가암검진 일정, 결과를 보고 다음에 할 일을 정리했어요."
  data-tags="건강검진,결과지,국가암검진,혈액검사,예방">
<p class="lead">건강검진은 받는 것보다 결과를 읽고 행동하는 게 더 중요해요. 결과지의 숫자 하나하나가 앞으로 몇 년의 건강을 미리 알려주는 신호예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>국가 일반건강검진은 20세 이상 <strong>2년마다</strong>(비사무직은 매년) 받을 수 있어요.</li>
<li><strong>정상B</strong>는 '지금은 괜찮지만 관리가 필요한 경계'라는 뜻이에요. 그냥 넘기지 않아요.</li>
<li>고혈압·당뇨병 <strong>질환의심</strong>이 나오면 확진 검사를 받을 수 있어요.</li>
<li>암검진은 나이별로 대상이 달라요. <strong>위암 40세, 대장암 50세</strong>부터 시작해요.</li>
</ul></div>

<h2>판정 구분 읽기</h2>
<div class="tbl"><table>
<thead><tr><th>판정</th><th>뜻</th><th>다음에 할 일</th></tr></thead>
<tbody>
<tr><td>정상A</td><td>건강한 상태</td><td>지금의 생활습관 유지</td></tr>
<tr><td>정상B (경계)</td><td>정상이지만 경계 범위에 있는 항목이 있음</td><td>해당 항목의 생활습관 관리, 다음 검진에서 확인</td></tr>
<tr><td>일반질환의심</td><td>질환이 의심되어 추가 진료가 필요함</td><td>병원 진료로 정밀 검사</td></tr>
<tr><td>고혈압·당뇨병 질환의심</td><td>고혈압이나 당뇨병이 의심됨</td><td>확진 검사 받기</td></tr>
<tr><td>유질환자</td><td>이미 진단받고 치료 중인 질환이 있음</td><td>치료 계속, 관리 상태 확인</td></tr>
</tbody>
<caption>국민건강보험공단 일반건강검진 판정 기준을 바탕으로 정리. 판정 명칭은 검진 연도에 따라 조금씩 달라질 수 있어요.</caption></table></div>

<h2>항목별 기준 한눈에 보기</h2>
<h3>비만과 복부비만</h3>
<div class="tbl"><table>
<thead><tr><th>항목</th><th>기준</th></tr></thead>
<tbody>
<tr><td>체질량지수 (체중kg ÷ 키m²)</td><td>18.5 미만 저체중, 18.5~22.9 정상, 23~24.9 비만 전단계, 25 이상 비만</td></tr>
<tr><td>허리둘레</td><td>남성 90cm 이상, 여성 85cm 이상이면 복부비만</td></tr>
</tbody>
<caption>대한비만학회 기준</caption></table></div>
<p>체질량지수가 정상이어도 허리둘레가 기준을 넘으면 내장지방이 많을 수 있어요. 대사 질환 위험은 허리둘레와 더 밀접해요.</p>

<h3>혈압과 혈당</h3>
<div class="tbl"><table>
<thead><tr><th>항목</th><th>정상</th><th>경계</th><th>질환의심</th></tr></thead>
<tbody>
<tr><td>혈압 (mmHg)</td><td class="num">120/80 미만</td><td class="num">120~139 / 80~89</td><td class="num">140/90 이상</td></tr>
<tr><td>공복혈당 (mg/dL)</td><td class="num">100 미만</td><td class="num">100~125</td><td class="num">126 이상</td></tr>
</tbody></table></div>
<p>혈압은 검진 당일 긴장해서 높게 나올 수 있어요. 질환의심이라면 집에서 일주일 정도 아침저녁으로 재보고 확인해요. 자세한 내용은 고혈압 글과 당뇨병 글에 정리해 두었어요.</p>

<h3>콜레스테롤</h3>
<p>국가검진에서는 <strong>남성 24세 이상, 여성 40세 이상</strong>이 4년마다 총콜레스테롤, HDL, LDL, 중성지방을 검사해요. 총콜레스테롤 240mg/dL 이상, LDL 160 이상, HDL 40 미만, 중성지방 200 이상이면 이상 소견이에요. 다만 LDL의 목표는 사람마다 달라서 위험도에 맞춰 판단해요.</p>

<h3>간 기능</h3>
<div class="tbl"><table>
<thead><tr><th>항목</th><th>의미</th><th>참고</th></tr></thead>
<tbody>
<tr><td>AST, ALT</td><td>간세포가 손상되면 올라가는 효소</td><td>지방간, 간염, 음주, 약물, 격한 운동 후에도 올라요</td></tr>
<tr><td>감마지티피 (γ-GTP)</td><td>음주, 담도 질환, 지방간에서 올라감</td><td>술을 자주 마시면 특히 민감하게 올라가요</td></tr>
</tbody></table></div>
<p>간 수치가 정상이어도 지방간이 있을 수 있어요. 반대로 간 수치가 조금 높다고 바로 심각한 병은 아니에요. 원인을 확인하는 게 중요해요.</p>

<h3>콩팥 기능과 소변</h3>
<ul>
<li><strong>혈청 크레아티닌:</strong> 근육에서 나오는 노폐물로, 콩팥이 제대로 걸러내지 못하면 올라가요.</li>
<li><strong>사구체여과율(eGFR):</strong> 크레아티닌과 나이, 성별로 계산한 콩팥 기능이에요. <strong>60 미만</strong>이 3개월 넘게 이어지면 만성 콩팥병으로 봐요.</li>
<li><strong>요단백:</strong> 소변에 단백질이 나오면 콩팥 손상의 신호일 수 있어요. 한 번 양성이면 다시 확인해요.</li>
</ul>

<h3>빈혈</h3>
<p>혈색소(헤모글로빈)가 남성 13g/dL, 여성 12g/dL 미만이면 빈혈이에요. 원인을 확인하는 게 중요하고, 특히 남성과 폐경 후 여성의 빈혈은 위장관 출혈을 먼저 확인해요.</p>

<h2>나이별 국가암검진</h2>
<div class="tbl"><table>
<thead><tr><th>암</th><th>대상</th><th>주기</th><th>검사</th></tr></thead>
<tbody>
<tr><td>위암</td><td>40세 이상</td><td>2년</td><td>위내시경 (또는 위장조영검사)</td></tr>
<tr><td>대장암</td><td>50세 이상</td><td>1년</td><td>분변잠혈검사 → 양성이면 대장내시경</td></tr>
<tr><td>간암</td><td>40세 이상 고위험군 (간경변, B형·C형간염 등)</td><td>6개월</td><td>간 초음파 + 혈액검사(AFP)</td></tr>
<tr><td>유방암</td><td>40세 이상 여성</td><td>2년</td><td>유방촬영</td></tr>
<tr><td>자궁경부암</td><td>20세 이상 여성</td><td>2년</td><td>자궁경부 세포검사</td></tr>
<tr><td>폐암</td><td>54~74세 중 30갑년 이상 흡연력이 있는 고위험군</td><td>2년</td><td>저선량 흉부 CT</td></tr>
</tbody>
<caption>국립암센터·국민건강보험공단 국가암검진 기준. 갑년 = 하루 흡연 갑수 × 흡연 연수</caption></table></div>
<p>대장암 검진의 분변잠혈검사가 <strong>양성으로 나오면 반드시 대장내시경</strong>을 받아야 해요. 양성 결과를 받고도 내시경을 미루는 경우가 많은데, 이 단계를 건너뛰면 검진의 의미가 없어져요.</p>

<h2>그 밖의 생애전환기 검사</h2>
<ul>
<li><strong>골밀도:</strong> 54세, 66세 여성</li>
<li><strong>인지기능 선별:</strong> 66세 이상 2년마다</li>
<li><strong>정신건강(우울증) 선별:</strong> 20·30·40·50·60·70세에 해당하는 해</li>
<li><strong>노인 신체기능 검사:</strong> 66·70·80세</li>
<li><strong>B형간염 검사:</strong> 40세</li>
</ul>
<p>대상 연령과 항목은 제도 개편에 따라 바뀔 수 있으니 국민건강보험공단 홈페이지나 앱에서 올해 내 검진 항목을 확인해요.</p>

<h2>결과지를 받았다면</h2>
<div class="box"><span class="h">결과 확인 후 할 일</span>
<ol>
<li>판정 결과에서 '질환의심' 항목부터 확인하고 진료 예약하기</li>
<li>'정상B' 항목에 형광펜 표시하고 관련 생활습관 한 가지 정하기</li>
<li>작년, 재작년 결과와 숫자를 나란히 놓고 추세 보기</li>
<li>암검진 결과, 특히 분변잠혈 양성이나 추가 검사 권고 확인하기</li>
<li>국민건강보험공단 앱에 결과를 모아 두기</li>
</ol></div>
<div class="box note"><span class="h">숫자 하나보다 추세가 중요해요</span>
<p>공복혈당이 올해 98이라 정상이어도, 3년 전 86, 2년 전 92였다면 꾸준히 오르고 있는 거예요. 반대로 기준을 살짝 넘었어도 한 번의 일시적인 결과일 수 있어요. 결과지를 모아두고 몇 년치를 비교하는 습관이 가장 좋은 건강 관리예요.</p></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>검진 전날 무엇을 조심해야 하나요?</dt>
<dd>보통 전날 저녁 식사 후 8시간 이상 금식해요. 물은 조금 마셔도 되는 경우가 많지만 검사 기관의 안내를 따라요. 전날 과음과 격한 운동은 간 수치와 혈액검사 결과에 영향을 줄 수 있어요. 혈압약 등 복용 중인 약은 기관에 먼저 물어봐요.</dd>
<dt>결과가 참고치를 조금 벗어났어요.</dt>
<dd>참고치는 건강한 사람 대부분이 속하는 범위일 뿐이라, 조금 벗어났다고 모두 병은 아니에요. 다른 항목과 함께, 그리고 이전 결과와 비교해 판단해요. 걱정되면 결과지를 가지고 진료를 받아요.</dd>
<dt>국가검진만 받으면 충분한가요?</dt>
<dd>국가검진은 흔하고 중요한 질환을 효율적으로 찾도록 설계돼 있어요. 가족력이나 증상이 있다면 의사와 상의해 필요한 검사를 추가해요. 비싼 검사를 많이 받는 것이 항상 좋은 건 아니에요.</dd>
</dl>

<h2>참고 자료</h2>
<ul class="refs">
<li>국민건강보험공단, 일반건강검진 및 국가암검진 안내</li>

</ul>

<template data-id="kitchen-hygiene" data-cat="life" data-date="2026.09.29"
  data-title="주방 위생 총정리: 행주·수세미·도마, 세균이 가장 많은 곳부터 관리하기"
  data-thumb="6대|식중독 예방"
  data-summary="집 안에서 세균이 가장 많은 곳은 화장실이 아니라 주방일 수 있어요. 행주와 수세미에 세균이 모이는 이유, 도마 재질별 관리법, 싱크대와 배수구 청소, 식중독 예방 6대 수칙을 주방 동선에 맞춰 정리했어요."
  data-tags="주방위생,행주,수세미,도마,식중독예방">
<p class="lead">주방에서 세균이 가장 좋아하는 조건은 세 가지예요. 물기, 음식 찌꺼기, 따뜻한 온도. 행주와 수세미는 이 세 가지를 하루 종일 품고 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>행주와 수세미는 <strong>쓴 뒤 바로 빨아서 바싹 말리는 것</strong>이 핵심이에요.</li>
<li>수세미는 소독해도 세균이 금방 다시 늘어요. <strong>자주 바꾸는 것</strong>이 가장 확실해요.</li>
<li>도마는 <strong>날고기·생선용과 바로 먹는 음식용</strong>을 나눠 써요.</li>
<li>식약처의 식중독 예방 6대 수칙: <strong>손씻기, 익혀먹기, 끓여먹기, 세척·소독, 구분 사용, 보관 온도 지키기</strong>.</li>
</ul></div>

<h2>주방에서 세균이 많은 곳</h2>
<p>여러 조사에서 가정 안에서 세균이 가장 많이 검출되는 곳으로 <strong>주방 수세미와 행주, 싱크대 배수구, 도마</strong>가 꼽혀요. 늘 젖어 있고, 음식 찌꺼기가 끼어 있고, 여러 번 재사용되기 때문이에요. 문제는 이 도구들이 깨끗해 보이는 그릇과 조리대를 닦는 데 쓰인다는 점이에요. 오염된 행주로 식탁을 닦으면 세균을 식탁 전체에 펴 바르는 셈이 돼요.</p>

<h2>행주 관리</h2>
<ul>
<li><strong>쓴 뒤 바로</strong> 세제로 빨아 헹구고, 펼쳐서 바람이 잘 통하는 곳에 <strong>완전히</strong> 말려요. 젖은 채 뭉쳐두는 게 가장 나빠요.</li>
<li><strong>용도를 나눠요.</strong> 식탁·그릇용, 조리대용, 바닥·가스레인지 주변용을 색깔로 구분하면 편해요.</li>
<li><strong>주기적으로 삶아요.</strong> 끓는 물에 몇 분 이상 삶거나 산소계 표백제에 담가 소독한 뒤 완전히 말려요.</li>
<li>날고기의 핏물이나 달걀 흘린 것을 닦을 때는 행주 대신 <strong>키친타월</strong>을 쓰고 바로 버려요.</li>
<li>냄새가 나거나 얼룩이 빠지지 않으면 새것으로 바꿔요.</li>
</ul>

<h2>수세미 관리</h2>
<p>독일 연구진이 사용 중인 주방 스펀지를 분석한 연구(2017)에서, 스펀지 1cm³ 안에 매우 많은 세균이 살고 있었고, <strong>정기적으로 소독한 스펀지도 세균이 크게 줄지 않았어요.</strong> 소독에서 살아남은 세균이 빈자리를 빠르게 다시 채우기 때문이에요. 연구진은 스펀지를 자주 교체하는 것이 더 현실적이라고 제안했어요.</p>
<ul>
<li>쓴 뒤에는 음식 찌꺼기를 헹구고 <strong>물기를 꽉 짜서</strong> 세워 말려요.</li>
<li>설거지통이나 싱크대 바닥에 두지 않고, 물이 빠지는 걸이에 걸어요.</li>
<li><strong>2~4주마다</strong>, 냄새가 나거나 모양이 망가졌다면 더 일찍 바꿔요.</li>
<li>그릇용과 냄비·팬용, 개수대 청소용을 나눠 써요.</li>
</ul>

<h2>도마 관리</h2>
<div class="tbl"><table>
<thead><tr><th>재질</th><th>장점</th><th>관리 요령</th></tr></thead>
<tbody>
<tr><td>플라스틱</td><td>가볍고 세척·소독이 쉬움, 식기세척기 가능한 제품도 있음</td><td>칼자국이 깊어지면 그 틈에 세균이 남아요. 흠집이 많아지면 교체해요.</td></tr>
<tr><td>나무</td><td>칼날에 부드럽고, 나무 자체가 세균을 흡수해 표면에서 줄어든다는 연구도 있음</td><td>물에 오래 담가두지 않고, 세척 후 세워서 완전히 말려요. 갈라지면 교체해요.</td></tr>
<tr><td>유리·대리석</td><td>위생적이고 냄새가 배지 않음</td><td>칼날이 쉽게 무뎌지고 미끄러워 칼질하기에 불편해요.</td></tr>
</tbody></table></div>
<h3>모든 도마에 공통</h3>
<ul>
<li><strong>용도별로 나눠요.</strong> 최소한 날고기·생선용 하나, 채소·과일·익힌 음식용 하나.</li>
<li>사용 후 뜨거운 물과 세제로 씻고, 솔로 칼자국 사이를 문질러요.</li>
<li>날고기를 썬 뒤에는 세척 후 희석한 락스나 뜨거운 물로 소독하고 충분히 헹궈요.</li>
<li>세워서 말려요. 눕혀두면 아랫면에 물기가 남아요.</li>
</ul>

<h2>싱크대와 배수구</h2>
<ul>
<li>설거지가 끝나면 개수대의 음식 찌꺼기를 비우고 물기를 닦아요.</li>
<li>배수구 거름망은 매일 비우고, 일주일에 한 번 세척해요.</li>
<li>배수구 냄새에는 베이킹소다를 뿌리고 식초를 부은 뒤 뜨거운 물로 헹구는 방법을 많이 써요. 락스를 쓴다면 이 방법과 <strong>같은 날 섞어 쓰지 않아요.</strong></li>
<li>싱크대에서 생닭이나 고기를 씻었다면 개수대와 주변을 세척하고 채소를 씻어요.</li>
</ul>

<h2>놓치기 쉬운 곳</h2>
<ul>
<li><strong>수저통:</strong> 바닥에 물이 고이기 쉬워요. 구멍이 있는 수저통을 쓰고 주기적으로 씻어요.</li>
<li><strong>식기건조대 물받이:</strong> 물때와 곰팡이가 생기기 쉬워요. 일주일에 한 번 비우고 닦아요.</li>
<li><strong>냉장고 손잡이, 전자레인지 버튼, 수도꼭지:</strong> 요리 중 날고기를 만진 손이 닿는 곳이에요. 자주 닦아요.</li>
<li><strong>칼 손잡이와 칼꽂이:</strong> 칼꽂이 안쪽은 청소가 어려워 곰팡이가 생기기 쉬워요.</li>
<li><strong>물병과 텀블러 뚜껑의 고무 패킹:</strong> 분리해서 씻고 말려요.</li>
</ul>

<h2>식중독 예방 6대 수칙</h2>
<div class="tbl"><table>
<thead><tr><th>수칙</th><th>주방에서의 실천</th></tr></thead>
<tbody>
<tr><td>손 씻기</td><td>요리 전, 날고기·달걀을 만진 뒤, 음식 담기 전에 비누로 30초</td></tr>
<tr><td>익혀 먹기</td><td>고기와 달걀은 속까지 충분히 익히기. 중심온도 75°C 1분 이상(어패류 85°C)</td></tr>
<tr><td>끓여 먹기</td><td>물은 끓여 마시고, 지하수 등 확인되지 않은 물은 조심하기</td></tr>
<tr><td>세척·소독하기</td><td>과일·채소는 흐르는 물에 씻고, 조리도구는 세척 후 소독</td></tr>
<tr><td>구분 사용하기</td><td>날 음식과 익힌 음식의 칼·도마·용기를 나눠 쓰기</td></tr>
<tr><td>보관 온도 지키기</td><td>냉장 5°C 이하, 냉동 −18°C 이하, 조리한 음식은 2시간 안에 냉장</td></tr>
</tbody>
<caption>식품의약품안전처, 식중독 예방 6대 수칙</caption></table></div>

<div class="box"><span class="h">주방 위생 루틴</span>
<ol>
<li><strong>매일:</strong> 행주 빨아 말리기, 수세미 짜서 걸기, 배수구 거름망 비우기, 조리대 닦기</li>
<li><strong>매주:</strong> 행주 삶기, 도마 소독, 식기건조대 물받이·수저통 씻기</li>
<li><strong>2~4주마다:</strong> 수세미 교체</li>
<li><strong>매달:</strong> 냉장고 정리, 칼꽂이·전자레인지 내부 청소</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>수세미를 전자레인지에 돌리면 소독되나요?</dt>
<dd>젖은 스펀지를 전자레인지에 돌리면 세균이 줄기는 하지만, 앞서 소개한 연구처럼 금방 다시 늘어나요. 또 마른 상태나 금속이 섞인 수세미는 불이 붙을 수 있어 위험해요. 자주 바꾸는 편이 안전하고 확실해요.</dd>
<dt>식기세척기를 쓰면 소독까지 되나요?</dt>
<dd>식기세척기는 높은 온도의 물과 세제를 써서 손 설거지보다 세균을 더 잘 줄여요. 다만 필터에 음식 찌꺼기가 쌓이면 냄새와 세균이 생기니 필터를 자주 청소해요.</dd>
<dt>나무 도마는 비위생적인가요?</dt>
<dd>잘 관리하면 나무 도마도 위생적으로 쓸 수 있어요. 중요한 건 재질보다 사용 후 세척, 완전한 건조, 용도 구분, 흠집이 깊어지면 교체하는 습관이에요.</dd>
</dl>

  data-title="독감과 감기는 무엇이 다를까: 증상 구별법, 항바이러스제, 등교·출근 기준"
  data-thumb="48h|항바이러스제"
  data-summary="독감은 '심한 감기'가 아니라 다른 바이러스가 일으키는 다른 병이에요. 감기와 독감을 구별하는 증상, 합병증이 위험한 사람, 항바이러스제를 일찍 먹어야 하는 이유와 주의할 부작용, 해열제 고르는 법, 다시 등교·출근해도 되는 기준을 정리했어요."
  data-tags="독감,인플루엔자,감기,타미플루,해열제">
<p class="lead">"감기 걸렸어"와 "독감 걸렸어"는 같은 말처럼 쓰이지만, 원인 바이러스도, 앓는 정도도, 치료도 달라요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>독감은 <strong>갑자기 시작되는 고열, 온몸이 쑤시는 근육통, 심한 피로</strong>가 특징이에요.</li>
<li>항바이러스제는 증상 시작 후 <strong>48시간 안에</strong> 시작할 때 효과가 가장 좋아요.</li>
<li>항바이러스제를 먹는 <strong>소아·청소년</strong>은 이상행동이 없는지 이틀 정도 보호자가 지켜봐요.</li>
<li>해열제 없이 <strong>열이 내린 뒤 24시간</strong>이 지나면 등교·출근을 고려해요.</li>
</ul></div>

<h2>감기와 독감의 차이</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>감기</th><th>독감 (인플루엔자)</th></tr></thead>
<tbody>
<tr><td>원인</td><td>리노바이러스 등 200여 종의 바이러스</td><td>인플루엔자 바이러스 A형, B형</td></tr>
<tr><td>시작</td><td>서서히</td><td>갑자기 (몇 시간 만에)</td></tr>
<tr><td>열</td><td>없거나 미열</td><td>38°C 이상 고열이 흔함</td></tr>
<tr><td>근육통, 오한</td><td>가벼움</td><td>심함, 온몸이 쑤심</td></tr>
<tr><td>피로</td><td>가벼움</td><td>심해서 누워 지내야 할 정도, 회복 후에도 몇 주 지속</td></tr>
<tr><td>콧물, 코막힘, 재채기</td><td>흔함</td><td>있을 수 있음</td></tr>
<tr><td>합병증</td><td>드묾 (중이염, 부비동염)</td><td>폐렴, 심근염, 기저질환 악화</td></tr>
<tr><td>치료</td><td>증상 완화</td><td>항바이러스제</td></tr>
<tr><td>예방</td><td>백신 없음</td><td>매년 백신</td></tr>
</tbody></table></div>
<p>코로나19도 독감과 증상이 비슷해서 증상만으로 구별하기 어려워요. 정확히 알려면 검사가 필요해요.</p>

<h2>누가 특히 조심해야 할까</h2>
<p>건강한 성인은 대부분 1~2주면 회복하지만, 이런 사람은 합병증 위험이 높아요.</p>
<ul>
<li>65세 이상 어르신</li>
<li>5세 미만, 특히 2세 미만 영유아</li>
<li>임신부와 출산 후 2주 이내 산모</li>
<li>만성 폐질환(천식, 만성폐쇄성폐질환), 심장질환, 당뇨병, 만성 콩팥·간 질환이 있는 사람</li>
<li>면역이 약한 사람, 요양시설 거주자</li>
<li>고도비만인 사람</li>
</ul>

<h2>검사: 신속항원검사의 한계</h2>
<p>병원에서 코를 긁어 15분 안에 결과가 나오는 <strong>신속항원검사</strong>를 많이 해요. 빠르고 간편하지만 실제 독감인데도 음성으로 나오는 경우가 적지 않아요. 특히 증상이 시작된 직후나 바이러스 양이 적을 때 그래요. 그래서 독감이 유행하는 시기에 전형적인 증상이 있으면, 검사가 음성이어도 의사가 독감으로 판단해 치료하기도 해요.</p>

<h2>항바이러스제</h2>
<div class="tbl"><table>
<thead><tr><th>성분</th><th>방법</th><th>기간</th></tr></thead>
<tbody>
<tr><td>오셀타미비르</td><td>먹는 약</td><td>하루 2번, 5일</td></tr>
<tr><td>자나미비르</td><td>흡입제</td><td>하루 2번, 5일 (천식 등 호흡기 질환자는 주의)</td></tr>
<tr><td>페라미비르</td><td>주사</td><td>1회</td></tr>
<tr><td>발록사비르</td><td>먹는 약</td><td>1회</td></tr>
</tbody></table></div>
<ul>
<li>증상 시작 후 <strong>48시간 안에</strong> 시작하면 앓는 기간이 하루 정도 줄고 합병증 위험이 낮아져요.</li>
<li>고위험군이나 증상이 심한 사람은 48시간이 지났더라도 치료가 권장돼요.</li>
<li>오셀타미비르는 <strong>5일 동안 끝까지</strong> 먹어요. 열이 내렸다고 멈추지 않아요.</li>
<li>흔한 부작용은 메스꺼움과 구토예요. 음식과 함께 먹으면 줄어요.</li>
</ul>
<div class="box warn"><span class="h">소아·청소년 보호자는 꼭 읽어주세요</span>
<p>독감 항바이러스제를 먹은 소아·청소년에서 드물게 <strong>갑자기 뛰어내리거나 뛰쳐나가는 이상행동</strong>이 보고됐어요. 약 때문인지 독감 자체 때문인지는 분명하지 않지만, 식품의약품안전처는 약을 먹기 시작한 뒤 <strong>최소 이틀 동안 아이가 혼자 있지 않도록</strong> 보호자가 지켜보고, 창문과 현관문을 잠그도록 안내해요.</p></div>

<h2>해열제와 증상 관리</h2>
<ul>
<li><strong>아세트아미노펜</strong>이나 <strong>이부프로펜</strong> 같은 해열진통제로 열과 근육통을 줄여요. 용량과 간격을 지켜요.</li>
<li><strong>소아·청소년에게는 아스피린을 쓰지 않아요.</strong> 독감이나 수두 중 아스피린을 먹으면 뇌와 간에 심각한 손상을 주는 라이 증후군이 생길 수 있어요.</li>
<li>물을 충분히 마시고 푹 쉬어요.</li>
<li>종합감기약에도 해열진통 성분이 들어 있어요. 해열제와 함께 먹으면 같은 성분을 두 번 먹게 될 수 있으니 성분을 확인해요.</li>
</ul>
<h3>감기에 항생제는 필요 없어요</h3>
<p>감기와 독감은 바이러스 감염이라 항생제가 듣지 않아요. 항생제는 세균성 합병증(세균성 폐렴, 중이염, 부비동염)이 생겼을 때 의사가 판단해 써요. 불필요한 항생제는 내성균을 늘리고 설사 같은 부작용만 남겨요.</p>

<h2>병원이나 응급실에 가야 할 때</h2>
<div class="box warn"><span class="h">이런 증상은 바로 진료를 받으세요</span>
<ul>
<li>숨이 차거나 숨 쉬기 힘들어요.</li>
<li>가슴이나 배에 통증이나 압박감이 계속돼요.</li>
<li>어지럽거나 정신이 흐려지고, 깨우기 어려워요.</li>
<li>소변이 거의 나오지 않을 만큼 탈수가 심해요.</li>
<li>열과 기침이 좋아지다가 <strong>다시 심해져요.</strong> (세균성 폐렴 가능성)</li>
<li>경련이 있어요.</li>
<li>아기가 입술이 파래지거나, 먹지 않거나, 처지고 잘 깨지 않아요.</li>
</ul></div>

<h2>언제 다시 등교·출근할 수 있을까</h2>
<p>독감은 증상이 시작되기 하루 전부터 발병 후 5~7일까지 다른 사람에게 옮길 수 있어요. 질병관리청은 학생의 경우 <strong>해열제를 먹지 않은 상태에서 열이 내린 뒤 24시간이 지날 때까지</strong> 등교하지 않도록 안내해요. 성인도 같은 기준을 참고하면 좋아요.</p>
<ul>
<li>기침할 때는 휴지나 옷소매로 입과 코를 가려요.</li>
<li>회복 중에 사람을 만나야 한다면 마스크를 써요.</li>
<li>가족과 수건, 컵을 따로 써요.</li>
</ul>

<div class="box"><span class="h">독감 시즌 체크리스트</span>
<ol>
<li>10~11월에 독감 백신 맞기 (65세 이상, 어린이, 임신부는 무료 대상인지 확인)</li>
<li>집에 체온계와 해열제 준비하기</li>
<li>갑자기 고열과 근육통이 오면 48시간 안에 진료 받기</li>
<li>고위험군 가족이 있다면 증상 초기에 바로 진료 받기</li>
<li>열 내린 뒤 24시간은 집에서 쉬기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>독감에 한 번 걸리면 그해에는 안 걸리나요?</dt>
<dd>A형과 B형, 그리고 A형 안에서도 여러 아형이 있어서 같은 시즌에 다른 유형으로 다시 걸릴 수 있어요.</dd>
<dt>백신을 맞았는데도 독감 검사 양성이 나왔어요.</dt>
<dd>백신이 모든 감염을 막지는 못해요. 하지만 백신을 맞은 사람은 걸리더라도 증상이 가볍고 입원이나 사망 위험이 낮다는 연구가 많아요.</dd>
<dt>가족이 독감이면 예방으로 약을 먹어야 하나요?</dt>
<dd>고위험군 가족이 있거나 요양시설처럼 집단 발생 위험이 큰 경우 의사가 예방적 투약을 고려하기도 해요. 건강한 가족은 보통 증상이 생기면 바로 진료를 받는 방법을 써요.</dd>
</dl>

<h2>참고 자료</h2>
<ul class="refs">
<li>질병관리청, 인플루엔자 관리지침 및 예방수칙</li>
<li>식품의약품안전처, 인플루엔자 치료제 안전사용 정보</li>
<li>미국 질병통제예방센터(CDC), Influenza Antiviral Medications: Summary for Clinicians</li>
<li>대한감염학회, 인플루엔자 치료 권고</li>
</ul>

  data-tags="마그네슘,근육경련,편두통,영양제,미네랄">
<p class="lead">눈 밑이 파르르 떨리면 "마그네슘 부족이야"라는 말을 흔히 들어요. 마그네슘은 분명 중요한 미네랄이지만, 흔한 증상 모두를 설명해 주지는 않아요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인 권장섭취량은 남성 약 <strong>360~370mg</strong>, 여성 <strong>280mg</strong>이에요.</li>
<li>견과류, 씨앗, 통곡물, 콩, 녹색 채소에 많아요. 흰쌀과 흰 밀가루로 바뀌면 많이 줄어요.</li>
<li>노인의 <strong>밤중 다리 쥐</strong>에는 마그네슘 효과가 거의 없다는 연구 정리가 있어요. <strong>편두통 예방</strong>에는 근거가 있어요.</li>
<li>보충제의 상한섭취량은 <strong>350mg</strong>이에요. 콩팥 기능이 떨어진 사람은 특히 조심해요.</li>
</ul></div>

<h2>마그네슘이 하는 일</h2>
<ul>
<li><strong>에너지 만들기:</strong> 세포의 에너지 화폐인 ATP는 마그네슘과 결합한 상태로 작동해요.</li>
<li><strong>근육과 신경:</strong> 근육이 수축한 뒤 이완하고, 신경 신호가 적절히 전달되게 해요.</li>
<li><strong>심장 리듬:</strong> 심장 근육의 전기 신호를 안정시키는 데 관여해요.</li>
<li><strong>뼈:</strong> 몸속 마그네슘의 절반 이상이 뼈에 있어요.</li>
<li><strong>혈당 조절:</strong> 인슐린이 작용하는 과정에 관여해요.</li>
</ul>

<h2>하루에 얼마나 필요할까</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th>권장섭취량</th></tr></thead>
<tbody>
<tr><td>남성 19~29세</td><td class="num">360mg</td></tr>
<tr><td>남성 30세 이상</td><td class="num">370mg</td></tr>
<tr><td>여성 19세 이상</td><td class="num">280mg</td></tr>
<tr><td>임신부</td><td class="num">+40mg</td></tr>

<h2>어떤 음식에 많을까</h2>
<div class="tbl"><table>
<thead><tr><th>식품</th><th>분량</th><th>마그네슘 (약)</th></tr></thead>
<tbody>
<tr><td>호박씨 (볶은 것)</td><td>1온스 (약 28g)</td><td class="num">156mg</td></tr>
<tr><td>치아씨드</td><td>1온스</td><td class="num">111mg</td></tr>
<tr><td>아몬드</td><td>1온스</td><td class="num">80mg</td></tr>
<tr><td>시금치 (데친 것)</td><td>½컵</td><td class="num">78mg</td></tr>
<tr><td>캐슈너트</td><td>1온스</td><td class="num">74mg</td></tr>
<tr><td>검은콩 (익힌 것)</td><td>½컵</td><td class="num">60mg</td></tr>

<p>곡물의 마그네슘은 주로 겨와 배아에 있어서 <strong>도정할수록 크게 줄어요.</strong> 흰쌀밥을 잡곡밥으로 바꾸고, 견과류 한 줌과 콩 반찬, 녹색 채소를 곁들이면 필요량에 가까워져요.</p>

<h2>부족해지기 쉬운 경우</h2>
<ul>
<li><strong>과음:</strong> 소변으로 마그네슘이 많이 빠져나가요.</li>
<li><strong>이뇨제</strong>(일부 혈압약)를 오래 먹는 경우</li>
<li><strong>위산억제제(양성자펌프억제제)</strong>를 1년 넘게 먹는 경우. 미국 식품의약국이 장기 복용 시 저마그네슘혈증 가능성을 경고했어요.</li>
<li>조절되지 않는 <strong>당뇨병</strong> (소변으로 손실)</li>
<li>만성 설사, 크론병, 셀리악병처럼 장으로 잃거나 흡수가 떨어지는 경우</li>
<li>노인 (흡수가 줄고 배설이 늘어요)</li>
</ul>
<p>혈액의 마그네슘은 몸 전체 양의 1%도 안 되기 때문에, 혈액검사가 정상이어도 몸 전체로는 부족할 수 있어요. 반대로 심하게 부족해지면 근육 떨림, 경련, 부정맥이 생기고, 칼륨과 칼슘까지 낮아지기도 해요.</p>

<h2>증상별로 따져보기</h2>
<div class="tbl"><table>
<thead><tr><th>기대하는 효과</th><th>연구 결과</th></tr></thead>
<tbody>
<tr><td>노인의 밤중 다리 쥐</td><td>여러 연구를 모은 코크란 리뷰(2020)에서 마그네슘은 효과가 거의 없을 가능성이 높았어요.</td></tr>
<tr><td>임신 중 다리 쥐</td><td>연구 결과가 엇갈려 결론을 내리기 어려워요.</td></tr>
<tr><td>편두통 예방</td><td>미국 두통 관련 학회 지침에서 편두통 예방에 '효과가 있을 수 있는' 선택지로 분류돼요.</td></tr>
<tr><td>눈꺼풀 떨림</td><td>대부분 피로, 수면 부족, 카페인, 눈의 피로와 관련 있고 저절로 좋아져요. 마그네슘 효과를 확인한 연구는 부족해요.</td></tr>
<tr><td>불면</td><td>노인 대상 소규모 연구에서 약간의 효과가 보고됐지만 근거가 약해요.</td></tr>
<tr><td>변비</td><td>산화마그네슘 등은 장으로 물을 끌어들이는 완하제로 실제 쓰여요.</td></tr>
</tbody></table></div>
<div class="box note"><span class="h">눈 떨림, 이럴 땐 진료를 받으세요</span>
<p>눈꺼풀 떨림은 대부분 며칠에서 몇 주 안에 저절로 사라져요. 하지만 몇 주 넘게 이어지거나, 눈이 완전히 감길 정도로 심하거나, 얼굴의 다른 부위(입꼬리, 뺨)까지 함께 떨린다면 안면 경련 같은 다른 원인일 수 있어 진료를 받아요.</p></div>

<h2>보충제 고르고 먹는 법</h2>
<div class="tbl"><table>
<thead><tr><th>형태</th><th>특징</th></tr></thead>
<tbody>
<tr><td>산화마그네슘</td><td>마그네슘 함량은 높지만 흡수율은 낮은 편. 설사가 잘 생겨 완하제로도 써요.</td></tr>
<tr><td>구연산마그네슘</td><td>흡수가 비교적 잘 되는 편. 설사가 생길 수 있어요.</td></tr>
<tr><td>글리시네이트 등 킬레이트형</td><td>위장 부담이 덜하다고 알려져 있어요.</td></tr>
</tbody></table></div>
<ul>
<li>가장 흔한 부작용은 <strong>설사</strong>예요. 나눠 먹거나 식사와 함께 먹으면 줄어요.</li>
<li><strong>일부 항생제(테트라사이클린, 퀴놀론), 골다공증약(비스포스포네이트), 갑상선 호르몬제</strong>의 흡수를 방해해요. 2~4시간 간격을 둬요.</li>
<li>변비약, 제산제에도 마그네슘이 들어 있는 경우가 많아요. 함께 먹는 제품의 함량을 더해 보세요.</li>
</ul>
<div class="box warn"><span class="h">콩팥 기능이 떨어진 사람은 조심하세요</span>
<p>마그네슘은 콩팥으로 배설돼요. 만성 콩팥병이 있으면 보충제, 마그네슘이 든 제산제와 변비약으로 혈중 마그네슘이 위험하게 높아질 수 있어요. 메스꺼움, 근력 저하, 저혈압, 느린 맥박, 심하면 호흡 억제와 심정지로 이어질 수 있어요. 콩팥 질환이 있다면 마그네슘 제품은 의사와 상의한 뒤에 써요.</p></div>

<div class="box"><span class="h">마그네슘 챙기는 식단</span>
<ol>
<li>흰쌀밥을 잡곡밥으로</li>
<li>견과류나 씨앗 하루 한 줌</li>
<li>두부, 콩 반찬 자주</li>
<li>시금치 같은 녹색 채소 하루 한 번</li>
<li>보충제는 부족 위험이 있을 때, 함량과 상호작용을 확인하고</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>운동 후 쥐가 나는데 마그네슘을 먹을까요?</dt>
<dd>운동 중 근육 경련은 근육 피로와 관련이 크다고 봐요. 충분한 준비운동, 스트레칭, 수분 보충, 운동량을 서서히 늘리는 것이 먼저예요.</dd>
<dt>마그네슘을 먹으면 잠이 잘 오나요?</dt>
<dd>일부 사람에게 도움이 됐다는 보고가 있지만 근거는 약해요. 불면이 계속된다면 수면 습관을 점검하고 진료를 받아보는 게 좋아요.</dd>
<dt>칼슘과 마그네슘을 같이 먹어도 되나요?</dt>
<dd>함께 들어 있는 제품이 많아요. 다만 고용량을 동시에 먹으면 서로 흡수를 조금 방해할 수 있어요. 음식으로 충분히 먹는 게 가장 좋아요.</dd>
</dl>

  data-title="체중과 뱃살의 과학: 허리둘레가 말해주는 것, 요요 없이 빼는 원칙, 비만 치료제까지"
  data-thumb="90·85|허리둘레 기준"
  data-summary="체중계 숫자보다 허리둘레가 건강에 대해 더 많은 걸 알려줄 때가 많아요. 한국인 비만 기준, 뱃살이 위험한 이유, 허리둘레 재는 법, 어떤 식단이든 통하는 감량 원칙, 요요가 생기는 이유, 비만 치료제와 수술의 대상까지 정리했어요."
  data-tags="체중감량,복부비만,허리둘레,다이어트,비만치료제">
<p class="lead">살을 빼는 방법은 수없이 많지만, 오래 유지하는 방법은 생각보다 비슷해요. 그리고 몇 kg을 빼느냐보다 어디서 빠지느냐가 건강에는 더 중요해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>한국인은 체질량지수 <strong>25 이상</strong>을 비만, 허리둘레 <strong>남성 90cm·여성 85cm 이상</strong>을 복부비만으로 봐요.</li>
<li>뱃속 <strong>내장지방</strong>이 당뇨병, 고혈압, 지방간, 심혈관 질환과 가장 밀접해요.</li>
<li>현실적인 목표는 <strong>3~6개월에 체중의 5~10%</strong>예요. 이것만으로도 혈압과 혈당이 좋아져요.</li>
<li>어떤 식단이 가장 좋으냐보다 <strong>내가 오래 지킬 수 있느냐</strong>가 결과를 결정해요.</li>
</ul></div>

<h2>한국인 비만 기준</h2>
<div class="tbl"><table>
<thead><tr><th>체질량지수 (kg/m²)</th><th>분류</th></tr></thead>
<tbody>
<tr><td class="num">18.5 미만</td><td>저체중</td></tr>
<tr><td class="num">18.5~22.9</td><td>정상</td></tr>
<tr><td class="num">23~24.9</td><td>비만 전단계 (과체중)</td></tr>
<tr><td class="num">25~29.9</td><td>1단계 비만</td></tr>
<tr><td class="num">30~34.9</td><td>2단계 비만</td></tr>
<tr><td class="num">35 이상</td><td>3단계 비만 (고도비만)</td></tr>
</tbody>
<caption>대한비만학회 진료지침 기준. 체질량지수 = 체중(kg) ÷ 키(m)²</caption></table></div>
<p>세계보건기구 기준(30 이상 비만)보다 낮은 이유는, 아시아인은 같은 체질량지수에서도 서양인보다 체지방과 내장지방이 많고 당뇨병 같은 대사 질환이 더 일찍 생기기 때문이에요.</p>

<h2>허리둘레가 더 중요한 이유</h2>
<p>지방은 어디에 쌓이느냐에 따라 성격이 달라요. 피부 바로 아래 쌓이는 <strong>피하지방</strong>보다, 배 안쪽 장기 사이에 쌓이는 <strong>내장지방</strong>이 훨씬 해로워요. 내장지방은 염증 물질을 내보내고 간으로 곧바로 지방산을 보내 인슐린 저항성, 지방간, 이상지질혈증을 일으켜요.</p>
<p>그래서 체질량지수가 정상이어도 허리둘레가 기준을 넘으면 대사 질환 위험이 높을 수 있어요. 반대로 근육이 많아 체질량지수가 높게 나오는 사람도 있어요.</p>
<div class="box note"><span class="h">허리둘레 정확하게 재는 법</span>
<ol>
<li>똑바로 서서 발을 25~30cm 벌리고 몸무게를 양발에 고르게 실어요.</li>
<li>옆구리에서 <strong>가장 아래 갈비뼈</strong>와 <strong>골반뼈 맨 위</strong>를 찾아 그 중간 지점에 줄자를 둘러요.</li>
<li>줄자가 바닥과 수평이 되게 하고, 피부를 조이지 않게 해요.</li>
<li><strong>숨을 편안히 내쉰 상태</strong>에서 재요.</li>
</ol>
<p>배꼽 둘레와 위치가 다를 수 있어요. 한 달에 한 번 같은 조건(아침, 식사 전)에서 재면 변화를 보기 좋아요.</p></div>

<h2>5~10%의 힘</h2>
<p>많은 사람이 '정상 체중'을 목표로 삼지만, 그보다 훨씬 적은 감량으로도 건강 지표는 좋아져요.</p>
<ul>
<li>체중의 <strong>5%</strong> 감량: 혈당, 혈압, 중성지방 개선, 간 지방 감소</li>
<li><strong>7%</strong> 안팎 감량: 당뇨병 전단계에서 당뇨병 발생 위험이 크게 감소</li>
<li><strong>10%</strong> 이상 감량: 지방간염, 수면무호흡, 무릎 관절 통증 개선</li>
</ul>
<p>90kg이라면 4.5~9kg이에요. 목표가 가까워 보이면 시작하기도, 이어가기도 쉬워요.</p>

<h2>어떤 식단이든 통하는 원칙</h2>
<p>저탄수화물 식단과 저지방 식단을 1년 동안 비교한 대규모 연구(DIETFITS, 2018)에서 두 그룹의 체중 감량은 비슷했어요. 여러 연구가 같은 결론을 보여줘요. <strong>특정 식단의 마법보다, 섭취 열량이 줄고 그것을 오래 지키는 것</strong>이 핵심이에요.</p>
<div class="tbl"><table>
<thead><tr><th>원칙</th><th>실천 방법</th></tr></thead>
<tbody>
<tr><td>마시는 열량부터 줄이기</td><td>단 음료, 과일주스, 달콤한 커피, 술. 배는 안 부른데 열량은 높아요.</td></tr>
<tr><td>끼니마다 단백질</td><td>포만감이 오래가고 감량 중 근육 손실을 줄여요.</td></tr>
<tr><td>채소를 먼저, 많이</td><td>식이섬유가 포만감을 주고 전체 섭취량을 줄여요.</td></tr>
<tr><td>정제 탄수화물 줄이기</td><td>흰밥, 흰 빵, 면, 떡의 양을 줄이고 잡곡으로 바꿔요.</td></tr>
<tr><td>천천히 먹기</td><td>포만 신호가 뇌에 닿는 데 시간이 걸려요. 한 끼 15~20분 이상.</td></tr>
<tr><td>야식 줄이기</td><td>저녁 식사 후 먹는 시간을 정해두고 그 뒤로는 먹지 않아요.</td></tr>
<tr><td>기록하기</td><td>먹은 것과 체중을 기록하는 사람이 더 많이 빼고 오래 유지해요.</td></tr>
</tbody></table></div>
<p>흔히 하루 500kcal를 덜 먹으면 일주일에 약 0.5kg 빠진다고 계산해요. 하지만 살이 빠질수록 몸이 쓰는 에너지도 줄어서 감량 속도는 점점 느려져요. 정체기는 실패가 아니라 자연스러운 과정이에요.</p>

<h2>운동: 빼는 것보다 유지에 강하다</h2>
<p>운동만으로 체중을 크게 줄이기는 어려워요. 하지만 운동은 <strong>내장지방을 우선적으로 줄이고</strong>, 감량 중 근육을 지키며, <strong>빠진 체중을 유지하는 데 가장 중요한 요인</strong> 중 하나예요. 감량을 유지하는 사람들은 일주일에 200~300분 정도로 꽤 많이 움직이는 경우가 많아요. 근력 운동을 함께 해야 기초대사량을 지킬 수 있어요.</p>

<h2>요요는 왜 생길까</h2>
<ul>
<li><strong>몸의 방어:</strong> 체중이 줄면 식욕을 높이는 호르몬이 늘고 포만 호르몬은 줄어요. 몸은 원래 체중으로 돌아가려고 해요.</li>
<li><strong>근육 손실:</strong> 극단적인 식사 제한은 근육까지 빼서 기초대사량을 떨어뜨려요.</li>
<li><strong>끝이 있는 다이어트:</strong> "목표까지만 참자"는 방식은 목표에 닿는 순간 예전 습관으로 돌아가게 해요.</li>
</ul>
<p>그래서 처음부터 <strong>평생 유지할 수 있는 수준</strong>으로 바꾸는 게 중요해요. 조금 느려도 지킬 수 있는 변화가 빠르지만 지킬 수 없는 변화보다 결과가 좋아요.</p>

<h2>수면과 스트레스</h2>
<p>잠이 부족하면 식욕 호르몬이 흔들려 고열량 음식이 당기고, 스트레스는 폭식과 야식으로 이어지기 쉬워요. 체중 관리가 잘 안 된다면 식사와 운동만큼 <strong>수면 시간</strong>을 점검해 보세요.</p>

<h2>비만 치료제와 수술</h2>
<p>생활습관 교정만으로 충분히 빠지지 않고 비만 관련 질환 위험이 높다면 약물 치료를 고려할 수 있어요. 진료지침은 체질량지수와 동반 질환을 기준으로 약물 치료 대상을 정해요.</p>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>작용</th><th>알아둘 점</th></tr></thead>
<tbody>
<tr><td>GLP-1 계열 주사제 (세마글루타이드, 리라글루타이드, 터제파타이드 등)</td><td>식욕을 줄이고 포만감을 늘림</td><td>메스꺼움, 구토, 변비가 흔해요. 중단하면 다시 체중이 늘기 쉬워요.</td></tr>
<tr><td>오르리스타트</td><td>지방 흡수를 줄임</td><td>기름진 변, 지용성 비타민 흡수 감소</td></tr>
<tr><td>펜터민 계열</td><td>식욕 억제</td><td>향정신성 의약품으로 단기간만 사용. 두근거림, 불면</td></tr>
</tbody></table></div>
<div class="box warn"><span class="h">비만 치료제는 반드시 진료를 거쳐서</span>
<p>비만 치료제는 모두 전문의약품이에요. 온라인이나 지인을 통해 구하는 약은 가짜이거나 함량이 다를 수 있고, 심각한 부작용이 생길 수 있어요. 특히 임신 중이거나 임신을 계획 중이라면 사용하지 않아요. 약은 생활습관 교정을 <strong>대신하는 것이 아니라 돕는 것</strong>이에요.</p></div>
<p>고도비만(체질량지수 35 이상, 또는 30 이상이면서 당뇨병 같은 동반 질환이 있는 경우)에서는 <strong>비만대사수술</strong>도 효과가 확인된 치료예요. 국내에서도 기준에 해당하면 건강보험이 적용돼요.</p>

<div class="box"><span class="h">이번 주에 시작할 것</span>
<ol>
<li>허리둘레 재서 기록하기</li>
<li>현재 체중의 5%를 첫 목표로 정하기</li>
<li>단 음료 한 가지 끊기</li>
<li>끼니마다 단백질 반찬 하나 넣기</li>
<li>저녁 식사 후 먹지 않는 시간 정하기</li>
<li>일주일에 150분 걷기, 근력 운동 2번</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>뱃살만 빼는 운동이 있나요?</dt>
<dd>윗몸일으키기 같은 운동으로 특정 부위의 지방만 빼기는 어려워요. 다만 유산소 운동과 전체적인 감량을 하면 내장지방이 먼저, 많이 줄어드는 경향이 있어요.</dd>
<dt>아침을 굶으면 살이 빠지나요?</dt>
<dd>하루 전체 섭취량이 줄면 빠지지만, 대신 점심과 저녁에 폭식한다면 효과가 없어요. 아침을 먹느냐보다 하루 전체의 양과 질이 중요해요.</dd>
<dt>체중계 숫자가 매일 오르내려요.</dt>
<dd>하루 사이에도 수분, 음식, 배변에 따라 1~2kg은 변할 수 있어요. 매일 같은 시간에 재서 일주일 평균으로 추세를 보는 게 좋아요.</dd>
</dl>

  data-title="계절별 식중독 총정리: 원인균마다 다른 음식과 예방법, 걸렸을 때 대처"
  data-thumb="85°C|노로 가열 기준"

  data-tags="식중독,노로바이러스,살모넬라,비브리오,장염">
<p class="lead">같은 식중독이라도 원인에 따라 잘 생기는 계절, 문제가 되는 음식, 막는 방법이 달라요. 원인을 알면 무엇을 조심할지가 분명해져요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>겨울~봄 노로바이러스</strong>는 굴 같은 조개류와 사람 사이 전파가 주요 경로예요. 85°C에서 1분 이상 익혀요.</li>
<li><strong>여름</strong>에는 달걀·닭(살모넬라, 캠필로박터), 채소(병원성 대장균), 어패류(장염비브리오)를 조심해요.</li>
<li><strong>대량으로 끓인 국과 찜</strong>은 실온에 두면 퍼프린젠스균이 자라요. 작게 나눠 빨리 식혀요.</li>
<li>간 질환이 있다면 여름철 <strong>생굴과 회를 피해요.</strong> 비브리오 패혈증은 치명적일 수 있어요.</li>
</ul></div>

<h2>원인균별 정리</h2>
<div class="tbl"><table>
<thead><tr><th>원인</th><th>많은 시기</th><th>주요 음식·경로</th><th>잠복기 (대략)</th></tr></thead>
<tbody>
<tr><td>노로바이러스</td><td>11월~4월</td><td>굴 등 조개류 생식, 오염된 지하수, 환자의 구토물·손</td><td>12~48시간</td></tr>
<tr><td>병원성 대장균</td><td>여름</td><td>덜 씻은 채소, 덜 익힌 고기, 오염된 물</td><td>1~8일</td></tr>
<tr><td>살모넬라</td><td>여름</td><td>달걀, 덜 익힌 닭고기, 달걀을 만진 손</td><td>6~72시간</td></tr>
<tr><td>캠필로박터</td><td>여름 (삼계탕 철)</td><td>생닭 손질 중 교차오염, 덜 익힌 닭고기</td><td>2~5일</td></tr>
<tr><td>장염비브리오</td><td>여름~초가을</td><td>바닷물 온도가 오를 때의 어패류 생식</td><td>수 시간~1일</td></tr>
<tr><td>클로스트리디움 퍼프린젠스</td><td>봄, 연중</td><td>대량 조리 후 실온에 둔 국, 찜, 카레, 도시락</td><td>6~24시간</td></tr>
<tr><td>황색포도상구균</td><td>연중</td><td>손의 상처나 코를 만진 손으로 만든 김밥, 도시락</td><td>1~6시간</td></tr>
<tr><td>바실루스 세레우스</td><td>연중</td><td>실온에 오래 둔 밥, 볶음밥</td><td>1~16시간</td></tr>
</tbody>
<caption>식품의약품안전처 식중독 통계와 원인균 정보를 바탕으로 정리</caption></table></div>

<h2>겨울의 주범: 노로바이러스</h2>
<ul>
<li><strong>아주 적은 양</strong>으로도 감염되고, 환경에서 오래 살아남아요.</li>
<li>음식뿐 아니라 환자의 구토물, 대변, 손, 문고리를 통해 <strong>사람 사이에 쉽게 퍼져요.</strong> 가족이 한 명씩 차례로 앓는 경우가 흔해요.</li>
<li>굴, 조개는 <strong>중심온도 85°C에서 1분 이상</strong> 익혀 먹어요.</li>
<li>알코올 손소독제가 잘 듣지 않아요. <strong>비누로 손을 씻어요.</strong></li>
<li>구토물은 마스크와 장갑을 끼고 치운 뒤, 희석한 락스(약 0.1~0.5%)로 소독해요.</li>
<li>증상이 사라진 뒤에도 며칠간 바이러스가 나올 수 있어서, 회복 후 <strong>2~3일은 음식을 만들지 않는 것</strong>이 좋아요.</li>
</ul>

<h2>여름: 달걀, 닭, 어패류</h2>
<h3>살모넬라와 달걀</h3>
<ul>
<li>달걀은 냉장 보관하고, 금이 간 달걀은 쓰지 않아요.</li>
<li>달걀을 만진 뒤에는 <strong>반드시 손을 씻어요.</strong> 껍데기에 묻은 균이 손을 통해 다른 음식으로 옮아요.</li>
<li>노른자와 흰자가 완전히 익도록 조리해요. 반숙은 신선한 달걀로, 바로 먹을 때만.</li>
</ul>
<h3>캠필로박터와 생닭</h3>
<ul>
<li>생닭은 씻을 때 물이 튀어 주변을 오염시키기 쉬워요. <strong>채소를 먼저 씻고 닭은 맨 나중에</strong> 씻어요.</li>
<li>닭고기는 속까지 완전히 익혀요. 뼈 주변이 분홍빛이면 더 익혀요.</li>
<li>생닭을 담았던 그릇에 익힌 닭을 다시 담지 않아요.</li>
</ul>
<h3>장염비브리오와 비브리오 패혈증</h3>
<p>바닷물 온도가 올라가는 여름에는 어패류에 비브리오균이 늘어나요. 장염비브리오는 주로 복통과 설사를 일으키지만, <strong>비브리오 불니피쿠스</strong>는 전혀 다른 병을 일으켜요.</p>
<div class="box warn"><span class="h">간 질환이 있다면 여름철 생굴과 회를 피하세요</span>
<p><strong>비브리오 패혈증</strong>은 오염된 어패류를 날로 먹거나 상처가 바닷물에 닿아 감염돼요. 건강한 사람은 드물지만 <strong>만성 간질환(간경변, 만성 간염), 알코올 의존, 당뇨병, 면역저하</strong>가 있는 사람은 걸리기 쉽고 치사율이 매우 높아요. 여름철에는 어패류를 충분히 익혀 먹고, 상처가 있으면 바닷물에 들어가지 않아요. 생선회를 먹고 열, 오한과 함께 다리에 붓고 물집이 생기면 바로 응급실로 가요.</p></div>

<h2>봄과 행사철: 대량 조리 음식</h2>
<p>퍼프린젠스균은 공기를 싫어하는 균으로, 큰 솥에 끓인 국이나 찜의 바닥처럼 산소가 적은 곳에서 잘 자라요. 끓일 때 대부분의 균은 죽지만, 열에 강한 <strong>포자</strong>가 살아남았다가 음식이 천천히 식는 동안 다시 깨어나 폭발적으로 늘어나요.</p>
<ul>
<li>많이 끓인 음식은 <strong>작고 얕은 용기에 나눠 담아</strong> 빨리 식혀요.</li>
<li>식힌 음식은 2시간 안에 냉장고에 넣어요.</li>
<li>다시 먹을 때는 <strong>충분히 끓여서</strong> 먹어요.</li>
<li>나들이 도시락은 아이스박스에 담고, 김밥은 만든 뒤 빨리 먹어요.</li>
</ul>

<h2>가열해도 없어지지 않는 독소</h2>
<p><strong>황색포도상구균</strong>과 <strong>바실루스 세레우스</strong>(구토형)는 음식 속에서 자라며 <strong>열에 강한 독소</strong>를 만들어요. 이미 독소가 생긴 음식은 다시 데워도 식중독을 일으킬 수 있어요. 그래서 이런 음식은 처음부터 실온에 오래 두지 않는 게 중요해요.</p>
<ul>
<li>손에 상처가 있으면 장갑을 끼고 음식을 만들어요.</li>
<li>남은 밥은 실온에 두지 말고 바로 냉장·냉동해요.</li>
</ul>

<h2>식중독에 걸렸다면</h2>
<h3>가장 중요한 건 수분</h3>
<ul>
<li>설사와 구토로 잃은 물과 전해질을 채우는 게 치료의 기본이에요.</li>
<li>약국에서 파는 <strong>경구 수액제(전해질 보충액)</strong>가 가장 좋아요. 없다면 물을 조금씩 자주 마셔요.</li>
<li>스포츠음료나 주스는 당이 많아 설사를 악화시킬 수 있어요. 마신다면 물로 희석해요.</li>
<li>구토가 가라앉으면 죽, 바나나, 흰밥처럼 소화가 쉬운 음식부터 조금씩 먹어요.</li>
</ul>
<h3>지사제는 조심해서</h3>
<p>설사는 몸이 균과 독소를 내보내는 과정이기도 해요. <strong>열이 나거나 혈변이 있는 설사</strong>에 지사제를 먹으면 오히려 균이 장에 머물러 악화될 수 있어요. 지사제는 약사나 의사와 상의해 써요.</p>
<div class="box warn"><span class="h">병원에 가야 하는 신호</span>
<ul>
<li>피가 섞인 설사나 검은 변</li>
<li>38.5°C 이상 고열</li>
<li>소변이 거의 나오지 않거나, 입이 바싹 마르고 어지러운 탈수 증상</li>
<li>물도 마시지 못할 만큼 계속 토함</li>
<li>설사가 3일 넘게 이어짐</li>
<li>영유아, 노인, 임신부, 만성질환자</li>
<li>눈꺼풀 처짐, 말이 어눌해짐, 삼키기 어려움 같은 신경 증상 (보툴리눔 가능성, 응급)</li>
</ul></div>
<p>여러 사람이 같은 음식을 먹고 함께 증상이 생겼다면 <strong>관할 보건소에 신고</strong>해요. 원인 조사로 더 큰 피해를 막을 수 있어요. 먹고 남은 음식이 있다면 버리지 말고 냉장 보관해 두면 조사에 도움이 돼요.</p>

<div class="box"><span class="h">식중독 예방 체크리스트</span>
<ol>
<li>요리 전과 날고기·달걀을 만진 뒤 비누로 손 씻기</li>
<li>채소를 먼저, 날고기와 생닭은 나중에 손질하기</li>
<li>고기·달걀은 속까지, 조개류는 85°C 1분 이상 익히기</li>
<li>많이 끓인 음식은 나눠 담아 빨리 식히고 2시간 안에 냉장</li>
<li>간 질환이 있다면 여름철 어패류 날로 먹지 않기</li>
<li>설사하는 동안과 회복 후 며칠은 가족 음식 만들지 않기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>상한 음식은 냄새로 알 수 있나요?</dt>
<dd>식중독균이 많이 자라도 냄새나 맛이 변하지 않는 경우가 많아요. 냄새로 판단하지 말고 보관 시간과 온도로 판단해요.</dd>
<dt>국은 끓이면 안전하지 않나요?</dt>
<dd>끓이면 대부분의 균은 죽지만 퍼프린젠스균의 포자나 일부 균의 독소는 남을 수 있어요. 끓인 뒤 식히고 보관하는 과정이 더 중요해요.</dd>
<dt>식중독에 걸리면 항생제를 먹어야 하나요?</dt>
<dd>대부분의 식중독은 수분 보충만으로 며칠 안에 좋아져요. 원인균과 증상에 따라 의사가 항생제를 판단하고, 장출혈성 대장균처럼 항생제가 오히려 위험할 수 있는 경우도 있어요.</dd>
</dl>
