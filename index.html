<p class="lead">뇌졸중 치료의 성패는 대부분 병원에 도착하기 전에 결정돼요. 증상을 알아채는 몇 초, 119를 부르는 몇 분이 그 뒤 몇십 년의 삶을 바꿀 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>이웃손발시선</strong>: 이~ 하고 웃기, 두 손 들기, 발음 확인, 시선 확인. 하나라도 이상하면 바로 119예요.</li>
<li>막힌 혈관을 뚫는 약은 증상 시작 <strong>4.5시간 안에</strong> 써야 해요. 시술은 조건에 따라 더 늦게도 가능해요.</li>
<li>집에서 <strong>아스피린이나 물, 음식을 먹이지 않아요.</strong> 뇌출혈일 수 있고, 삼킴 장애로 사레들 수 있어요.</li>
<li>몇 분 만에 사라진 증상도 <strong>뇌졸중의 경고</strong>예요. 그날 바로 진료를 받아요.</li>
</ul></div>

<h2>뇌졸중이란</h2>
<p>뇌졸중은 뇌로 가는 혈관이 <strong>막히거나(뇌경색)</strong> <strong>터져서(뇌출혈)</strong> 뇌 조직이 손상되는 병이에요. 흔히 '중풍'이라고도 불러요.</p>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>원인</th><th>비율</th></tr></thead>
<tbody>
<tr><td>뇌경색 (허혈성)</td><td>혈관이 좁아지거나, 심장 등에서 떨어진 혈전이 뇌혈관을 막음</td><td>국내 뇌졸중의 대부분 (약 4분의 3 이상)</td></tr>
<tr><td>뇌내출혈</td><td>뇌 속의 작은 혈관이 터짐. 고혈압이 주된 원인</td><td>일부</td></tr>
<tr><td>지주막하출혈</td><td>뇌 표면의 혈관(주로 뇌동맥류)이 터짐. 극심한 두통</td><td>일부</td></tr>
</tbody></table></div>
<p>뇌세포는 산소 공급이 끊기면 몇 분 만에 손상되기 시작해요. 뇌경색이 생기면 치료하지 않는 동안 <strong>1분마다 약 190만 개의 신경세포</strong>가 죽는다는 추정도 있어요. 그래서 '시간이 뇌'라는 말이 있어요.</p>

<h2>증상 확인: 이웃손발시선</h2>
<div class="tbl"><table>
<thead><tr><th>확인</th><th>방법</th><th>이상 신호</th></tr></thead>
<tbody>
<tr><td><strong>이</strong>~ 하고 <strong>웃</strong>기</td><td>이를 드러내며 웃어 보게 해요</td><td>한쪽 얼굴이 처지거나 비뚤어져요</td></tr>
<tr><td>두 <strong>손</strong> 들기</td><td>눈을 감고 두 팔을 앞으로 나란히 10초 들게 해요</td><td>한쪽 팔이 힘없이 떨어져요</td></tr>
<tr><td><strong>발</strong>음 확인</td><td>간단한 문장을 따라 말하게 해요</td><td>발음이 어눌하거나 말을 이해하지 못해요</td></tr>
<tr><td><strong>시선</strong> 확인</td><td>눈의 방향과 시야를 확인해요</td><td>한쪽으로 쏠리거나, 한쪽이 안 보이거나, 둘로 보여요</td></tr>
</tbody>
<caption>대한뇌졸중학회 뇌졸중 증상 확인 캠페인. 영어권에서는 FAST(Face, Arm, Speech, Time)로 알려져 있어요.</caption></table></div>
<h3>그 밖의 증상</h3>
<ul>
<li>갑자기 한쪽 팔다리나 얼굴이 저리거나 감각이 없어요.</li>
<li>갑자기 심하게 어지럽고 걷기 어렵거나 균형을 잡지 못해요.</li>
<li>갑자기 이전에 없던 <strong>극심한 두통</strong>이 생겨요 (특히 지주막하출혈).</li>
</ul>
<p>핵심은 <strong>'갑자기'</strong>예요. 뇌졸중 증상은 대부분 몇 초~몇 분 사이에 갑자기 나타나요.</p>

<h2>119를 부른 뒤</h2>
<div class="box warn"><span class="h">해야 할 일, 하지 말아야 할 일</span>
<ul>
<li><strong>바로 119</strong>에 연락해요. 직접 운전하거나 택시를 타는 것보다 구급차가 뇌졸중 치료가 가능한 병원으로 빨리 연결해요.</li>
<li><strong>증상이 시작된 시각</strong>, 또는 마지막으로 정상이었던 시각을 기억해요. 치료 결정에 가장 중요한 정보예요. 자고 일어나 발견했다면 잠들기 전 시각이 기준이에요.</li>
<li>평소 먹는 약(특히 항응고제, 항혈소판제) 목록을 챙겨요.</li>
<li><strong>아스피린을 먹이지 않아요.</strong> 뇌출혈이라면 출혈이 더 심해질 수 있어요.</li>
<li><strong>물이나 음식, 청심환을 먹이지 않아요.</strong> 삼키는 기능이 떨어져 기도로 넘어갈 수 있어요.</li>
<li>손가락을 따거나 주무르는 민간요법으로 시간을 보내지 않아요.</li>
<li>의식이 없고 토하려 하면 옆으로 눕혀 기도를 확보해요.</li>
</ul></div>

<h2>병원에서의 치료</h2>
<ul>
<li><strong>CT 또는 MRI</strong>로 뇌경색인지 뇌출혈인지 먼저 구별해요. 치료가 정반대이기 때문이에요.</li>
<li><strong>정맥 혈전용해제:</strong> 뇌경색이라면 증상 시작 <strong>4.5시간 안에</strong> 막힌 혈관을 녹이는 약을 쓸 수 있어요. 빠를수록 효과가 좋아요.</li>
<li><strong>동맥 내 혈전제거술:</strong> 큰 뇌혈관이 막혔다면 다리나 손목 혈관으로 가는 관을 넣어 혈전을 직접 빼내요. 영상 검사 결과에 따라 증상 시작 후 최대 24시간까지도 고려할 수 있어요.</li>
<li><strong>뇌출혈:</strong> 혈압을 조절하고, 필요하면 수술로 피를 제거하거나 터진 혈관(동맥류)을 막아요.</li>
</ul>
<p>국내에는 대한뇌졸중학회가 인증한 <strong>뇌졸중센터</strong>가 있어요. 우리 동네 가까운 센터를 미리 알아두면 좋아요.</p>

<h2>몇 분 만에 사라진 증상도 경고다</h2>
<p>뇌졸중 증상이 나타났다가 몇 분~몇 시간 안에 완전히 사라지는 것을 <strong>일과성 허혈발작(TIA)</strong>이라고 해요. '미니 뇌졸중'이라고도 불러요. 혈관이 잠깐 막혔다가 다시 뚫린 거예요.</p>
<p>증상이 사라졌다고 안심하면 안 돼요. 일과성 허혈발작 뒤 <strong>며칠 안에</strong> 진짜 뇌졸중이 올 위험이 매우 높아요. 증상이 사라졌더라도 <strong>그날 바로</strong> 응급실이나 신경과 진료를 받아 원인을 찾고 예방 치료를 시작해요.</p>

<h2>위험 요인</h2>
<div class="tbl"><table>
<thead><tr><th>위험 요인</th><th>관리</th></tr></thead>
<tbody>
<tr><td><strong>고혈압</strong></td><td>뇌졸중의 가장 중요한 위험 요인이에요. 혈압을 목표 수준으로 유지해요.</td></tr>
<tr><td><strong>심방세동</strong></td><td>심장에서 생긴 혈전이 뇌혈관을 막아요. 뇌졸중 위험이 약 5배 높아져요. 항응고제로 크게 줄일 수 있어요.</td></tr>
<tr><td>당뇨병</td><td>혈관을 손상시켜 뇌경색 위험을 높여요.</td></tr>
<tr><td>흡연</td><td>뇌졸중 위험을 크게 높여요. 끊으면 몇 년에 걸쳐 위험이 줄어요.</td></tr>
<tr><td>이상지질혈증</td><td>LDL 콜레스테롤을 낮춰요.</td></tr>
<tr><td>과음, 비만, 운동 부족</td><td>생활습관을 개선해요.</td></tr>
<tr><td>나이, 가족력, 이전 뇌졸중</td><td>바꿀 수 없지만, 다른 요인을 더 적극적으로 관리해요.</td></tr>
</tbody></table></div>
<div class="box note"><span class="h">맥박으로 심방세동 확인하기</span>
<p>손목 엄지 쪽에 두 손가락을 대고 30초~1분 동안 맥박을 느껴보세요. 박자가 <strong>불규칙하게 들쭉날쭉</strong>하다면 심방세동일 수 있어요. 65세 이상이라면 가끔 확인하고, 불규칙하면 심전도 검사를 받아요. 일부 스마트워치의 심전도 기능도 참고가 될 수 있지만 진단은 병원에서 해요.</p></div>

<h2>재발 막기</h2>
<p>뇌졸중을 겪은 사람은 다시 뇌졸중이 올 위험이 높아요. 그래서 원인에 맞춘 예방 치료가 평생 중요해요.</p>
<ul>
<li>항혈소판제(아스피린, 클로피도그렐 등) 또는 심방세동이 있다면 항응고제</li>
<li>스타틴으로 LDL 콜레스테롤 관리</li>
<li>혈압과 혈당 조절, 금연, 절주</li>
<li>재활 치료: 발병 초기부터 시작할수록 회복에 유리해요.</li>
<li>뇌졸중 뒤 우울증이 흔해요. 기분 변화도 치료가 필요한 증상이에요.</li>
</ul>

<div class="box"><span class="h">뇌졸중 대비 체크리스트</span>
<ol>
<li>가족 모두 '이웃손발시선'을 외워두기</li>
<li>증상이 보이면 시각을 확인하고 바로 119</li>
<li>가까운 뇌졸중센터 알아두기</li>
<li>복용 중인 약 목록을 휴대폰에 저장해두기</li>
<li>혈압, 혈당, 콜레스테롤 수치 확인하기</li>
<li>65세 이상이면 가끔 맥박 규칙성 확인하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>젊은 사람도 뇌졸중에 걸리나요?</dt>
<dd>나이가 들수록 흔하지만, 젊은 사람도 걸릴 수 있어요. 목 혈관 박리, 심장 이상, 혈액 응고 이상, 뇌동맥류 등이 원인이 될 수 있어요. 나이와 상관없이 증상이 있으면 바로 119예요.</dd>
<dt>손발이 저린데 뇌졸중일까요?</dt>
<dd>양쪽 손발이 모두 저리거나 오래 서서히 저린 건 대개 말초신경이나 혈액순환 문제예요. 하지만 <strong>갑자기, 한쪽만</strong> 저리거나 힘이 빠진다면 뇌졸중을 의심해요.</dd>
<dt>청심환을 먹이면 도움이 되나요?</dt>
<dd>뇌졸중 치료 효과가 확인되지 않았고, 삼키는 기능이 떨어진 상태에서 먹이면 기도로 넘어가 흡인성 폐렴을 일으킬 수 있어요. 아무것도 먹이지 않고 병원으로 가요.</dd>
</dl>

<h2>참고 자료</h2>
<ul class="refs">

<li>Saver JL, Time Is Brain—Quantified, Stroke 2006</li>

</ul>

<template data-id="selenium" data-cat="nut" data-date="2026.09.29"
  data-title="셀레늄 총정리: 브라질너트 한두 알이면 충분한 이유와 과잉의 신호"
  data-thumb="Se|셀레늄"
  data-summary="셀레늄은 아주 적은 양이 필요하고, 조금만 넘쳐도 부작용이 생길 수 있는 미네랄이에요. 하는 일과 하루 필요량, 브라질너트 한 알의 놀라운 함량, 암 예방을 기대했던 연구 결과, 머리카락과 손톱으로 나타나는 과잉 증상을 정리했어요."
  data-tags="셀레늄,브라질너트,항산화,갑상선,영양제">
<p class="lead">셀레늄은 필요한 양과 해로운 양 사이의 간격이 좁은 미네랄이에요. 그래서 '몸에 좋다니 많이'가 특히 통하지 않는 영양소예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인 권장섭취량은 하루 <strong>60μg</strong>, 상한섭취량은 <strong>400μg</strong>이에요.</li>
<li><strong>브라질너트 한 알</strong>에 하루 권장량 이상이 들어 있을 수 있어요. 매일 한 줌씩 먹으면 과잉이 돼요.</li>
<li>셀레늄 보충제가 <strong>암을 예방하지 못했고</strong>, 일부 연구에서는 당뇨병 위험을 높였어요.</li>
<li>과잉하면 <strong>머리카락과 손톱이 빠지고 부서지고</strong>, 숨에서 마늘 냄새가 나요.</li>
</ul></div>

<h2>셀레늄이 하는 일</h2>
<ul>
<li><strong>항산화 효소:</strong> 세포를 손상시키는 과산화물을 없애는 효소(글루타티온 과산화효소)의 핵심 성분이에요.</li>
<li><strong>갑상선 호르몬:</strong> 갑상선 호르몬(T4)을 활성형(T3)으로 바꾸는 효소에 필요해요. 갑상선은 몸에서 셀레늄 농도가 가장 높은 기관 중 하나예요.</li>
<li><strong>면역과 생식:</strong> 면역세포 기능과 정자 생성에 관여해요.</li>
</ul>

<h2>하루에 얼마나 필요할까</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th>권장섭취량</th><th>상한섭취량</th></tr></thead>
<tbody>
<tr><td>성인</td><td class="num">60μg</td><td class="num">400μg</td></tr>
<tr><td>임신부·수유부</td><td class="num">조금 더 필요</td><td class="num">400μg</td></tr>
</tbody>
<caption>보건복지부·한국영양학회, 2020 한국인 영양소 섭취기준</caption></table></div>

<h2>어떤 음식에 많을까</h2>
<div class="tbl"><table>
<thead><tr><th>식품</th><th>분량</th><th>셀레늄 (약)</th></tr></thead>
<tbody>
<tr><td>브라질너트</td><td>1온스 (6~8알)</td><td class="num">544μg</td></tr>
<tr><td>황다랑어(참치)</td><td>85g</td><td class="num">92μg</td></tr>
<tr><td>정어리 통조림</td><td>85g</td><td class="num">45μg</td></tr>
<tr><td>새우</td><td>85g</td><td class="num">40μg</td></tr>
<tr><td>소고기</td><td>85g</td><td class="num">33μg</td></tr>
<tr><td>닭고기</td><td>85g</td><td class="num">22μg</td></tr>
<tr><td>현미밥</td><td>1컵</td><td class="num">19μg</td></tr>
<tr><td>달걀</td><td>큰 것 1개</td><td class="num">15μg</td></tr>
</tbody>
<caption>미국 국립보건원 식이보충제국(ODS) 자료 기준. 식물성 식품의 셀레늄은 재배한 땅의 셀레늄 농도에 따라 크게 달라요.</caption></table></div>
<p>생선, 해산물, 고기, 달걀, 곡류를 골고루 먹으면 대부분 충분히 채워요. 한국인은 일반적인 식사로 셀레늄이 부족한 경우가 드물어요.</p>
<div class="box note"><span class="h">브라질너트는 하루 한두 알</span>
<p>브라질너트 한 알에는 산지에 따라 수십~100μg 가까운 셀레늄이 들어 있을 수 있어요. 한 알로 하루 권장량을 채우고도 남아요. 건강에 좋다고 매일 한 줌(6~8알)씩 먹으면 상한섭취량을 넘을 수 있어요. 다른 견과류와 섞어서 한두 알 정도가 적당해요.</p></div>

<h2>결핍은 드물다</h2>
<p>셀레늄 결핍은 토양에 셀레늄이 매우 적은 일부 지역에서 문제가 돼요. 중국의 일부 지역에서 발견된 심장 근육병(케샨병)이 대표적이에요. 이 밖에 오랫동안 정맥 영양만 받는 사람, 투석 환자, 심한 흡수 장애가 있는 사람에게서 생길 수 있어요. 일반적인 한국 식단에서는 드물어요.</p>

<h2>보충제의 기대와 결과</h2>
<p>셀레늄의 항산화 작용 때문에 암 예방 효과가 기대돼 왔어요.</p>
<ul>
<li>미국의 대규모 연구 <strong>SELECT</strong>에서 남성에게 셀레늄 200μg을 먹게 했지만 <strong>전립선암이 줄지 않았어요.</strong></li>
<li>피부암 예방을 보려던 연구(NPC)의 분석에서는 셀레늄을 먹은 그룹에서 <strong>제2형 당뇨병이 더 많이</strong> 생겼어요.</li>
<li>여러 연구를 모은 코크란 리뷰는 셀레늄 보충이 암을 예방한다는 근거가 없다고 정리했어요.</li>
</ul>
<p>하시모토 갑상선염에서 셀레늄이 갑상선 항체를 낮춘다는 연구도 있지만, 실제 갑상선 기능이나 증상이 좋아지는지는 분명하지 않아요. 복용을 고려한다면 담당 의사와 상의해요.</p>

<h2>과잉의 신호: 셀레늄 중독</h2>
<div class="box warn"><span class="h">이런 증상이 있다면 셀레늄 제품을 확인하세요</span>
<ul>
<li>머리카락이 많이 빠지거나 부서져요.</li>
<li>손톱이 부서지거나 변색되고 빠져요.</li>
<li>숨이나 땀에서 <strong>마늘 냄새</strong>가 나요.</li>
<li>입 안에서 금속 맛이 나요.</li>
<li>피부 발진, 피로, 짜증, 메스꺼움, 설사</li>
<li>손발 저림 같은 신경 증상</li>
</ul>
<p>2008년 미국에서는 셀레늄 함량이 표시보다 수백 배 많게 잘못 제조된 액상 보충제로 여러 사람이 중독된 사례가 있었어요. 보충제는 함량이 정확히 관리되는 제품을 고르고, 여러 제품을 겹쳐 먹지 않아요.</p></div>

<div class="box"><span class="h">셀레늄 현명하게 챙기기</span>
<ol>
<li>생선, 달걀, 고기, 통곡물을 골고루 먹기</li>
<li>브라질너트는 하루 한두 알</li>
<li>종합비타민, 항산화 영양제, 갑상선 영양제의 셀레늄 함량을 모두 더해 보기</li>
<li>하루 합계 400μg 넘지 않기</li>
<li>머리카락과 손톱 이상이 생기면 복용 중인 제품 점검하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>셀레늄이 면역력을 높여주나요?</dt>
<dd>결핍이 있다면 보충하면 면역 기능이 회복돼요. 하지만 충분한 사람이 더 먹는다고 면역력이 더 좋아진다는 근거는 없어요.</dd>
<dt>셀레늄과 비타민 E를 함께 먹으면 좋나요?</dt>
<dd>두 영양소는 몸에서 함께 항산화 작용을 하지만, 두 가지를 함께 보충한 연구에서도 암이나 심혈관 질환 예방 효과는 확인되지 않았어요. 음식으로 균형 있게 먹는 게 좋아요.</dd>
<dt>머리카락이 빠지는데 셀레늄을 먹어야 하나요?</dt>
<dd>셀레늄 결핍으로 인한 탈모는 드물어요. 오히려 과잉이 탈모를 일으킬 수 있어요. 탈모의 원인은 피부과에서 확인하는 게 좋아요.</dd>
</dl>

<h2>참고 자료</h2>

<template data-id="sunscreen" data-cat="hea" data-date="2026.09.29"
  data-title="자외선 차단제 제대로 쓰기: SPF와 PA의 뜻, 바르는 양, 덧바르는 시간"
  data-thumb="SPF|PA++++"
  data-summary="자외선 차단제는 무엇을 고르느냐보다 얼마나, 언제 바르느냐가 더 중요해요. UVA와 UVB의 차이, SPF와 PA 숫자가 뜻하는 것, 제대로 된 효과를 내는 양, 덧바르는 요령, 무기자차와 유기자차, 아기와 흐린 날, 옷과 모자로 막는 법까지 정리했어요."
  data-tags="자외선차단제,선크림,SPF,피부건강,피부암">
<p class="lead">SPF 50 제품을 발랐는데도 탔다면, 제품보다 바른 양이 부족했을 가능성이 커요. 대부분의 사람은 실험실에서 쓰는 양의 절반도 바르지 않아요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>UVB</strong>는 화상과 피부암, <strong>UVA</strong>는 노화와 피부암에 관여해요. 둘 다 막아야 해요.</li>
<li>SPF는 UVB, <strong>PA</strong>는 UVA 차단 정도예요. 일상은 SPF 30·PA+++ 이상이면 충분한 경우가 많아요.</li>
<li>얼굴에는 <strong>손가락 두 마디</strong> 정도의 양을 발라야 표시된 효과가 나요.</li>
<li>밖에 오래 있다면 <strong>2시간마다</strong>, 땀을 흘리거나 물놀이 후에는 바로 덧발라요.</li>
</ul></div>

<h2>자외선 A와 B</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>UVB</th><th>UVA</th></tr></thead>
<tbody>
<tr><td>파장</td><td>짧음</td><td>김</td></tr>
<tr><td>도달 깊이</td><td>피부 표면(표피)</td><td>피부 깊숙이(진피)</td></tr>
<tr><td>주요 영향</td><td>피부가 붉게 타는 화상, 피부암, 비타민 D 합성</td><td>주름, 탄력 저하, 색소 침착, 피부암</td></tr>
<tr><td>특징</td><td>한낮과 여름에 강함, 유리창에 대부분 막힘</td><td>계절과 시간에 따른 변화가 적고, <strong>유리창과 구름을 통과</strong></td></tr>
</tbody></table></div>
<p>그래서 흐린 날, 겨울, 실내 창가에서도 UVA는 꾸준히 들어와요. 운전을 자주 하는 사람의 얼굴 한쪽이 더 늙어 보이는 사례가 알려져 있어요.</p>

<h2>SPF와 PA 읽기</h2>
<h3>SPF (UVB 차단 지수)</h3>
<p>SPF는 차단제를 발랐을 때 피부가 붉어지기까지 걸리는 시간이 몇 배 늘어나는지를 나타내요.</p>
<div class="tbl"><table>
<thead><tr><th>SPF</th><th>UVB 차단율 (약)</th></tr></thead>
<tbody>
<tr><td class="num">15</td><td class="num">93%</td></tr>
<tr><td class="num">30</td><td class="num">97%</td></tr>
<tr><td class="num">50</td><td class="num">98%</td></tr>
</tbody>
<caption>충분한 양(피부 1cm²당 2mg)을 발랐을 때의 실험실 기준</caption></table></div>
<p>SPF 30과 50의 차이는 생각보다 작아요. 숫자가 높을수록 오래 버틴다고 생각해 덧바르기를 소홀히 하는 게 더 큰 문제예요.</p>
<h3>PA (UVA 차단 등급)</h3>
<p>PA는 UVA 차단 정도를 <strong>+의 개수</strong>로 나타내요. PA+부터 PA++++까지 있고, +가 많을수록 차단 효과가 커요. 국내 제품은 SPF를 최대 '50+', PA를 최대 '++++'로 표시해요.</p>
<div class="tbl"><table>
<thead><tr><th>상황</th><th>권장 (대략)</th></tr></thead>
<tbody>
<tr><td>출퇴근, 가벼운 외출</td><td>SPF 15~30, PA++ 이상</td></tr>
<tr><td>야외 활동, 운동</td><td>SPF 30~50, PA+++ 이상</td></tr>
<tr><td>해변, 스키장, 등산, 한여름 장시간</td><td>SPF 50+, PA++++, 워터프루프</td></tr>
</tbody></table></div>

<h2>얼마나 발라야 할까</h2>
<p>SPF와 PA는 피부 1cm²당 2mg을 발랐을 때 측정한 값이에요. 대부분의 사람은 그 <strong>4분의 1~절반</strong> 정도만 발라서 실제 효과가 표시보다 훨씬 낮아요.</p>
<div class="box note"><span class="h">양을 맞추는 쉬운 방법</span>
<ul>
<li><strong>얼굴과 목:</strong> 검지와 중지 두 손가락에 손가락 길이만큼 짜요 (약 1g 안팎).</li>
<li><strong>몸 전체 (수영복 차림):</strong> 소주잔 하나 정도(약 30mL)가 필요해요.</li>
<li>한 번에 두껍게 바르기 어렵다면 <strong>두 번에 나눠</strong> 얇게 겹쳐 발라요.</li>
<li>귀, 목 뒤, 발등, 정수리 가르마, 입술(자외선 차단 립밤)을 빠뜨리지 않아요.</li>
</ul></div>

<h2>언제, 얼마나 자주</h2>
<ul>
<li>외출 <strong>15분쯤 전</strong>에 바르면 고르게 자리 잡아요.</li>
<li>밖에 오래 있다면 <strong>2시간마다</strong> 덧발라요.</li>
<li>땀을 많이 흘렸거나, 물놀이 후, 수건으로 닦은 뒤에는 <strong>바로</strong> 덧발라요. '워터프루프'도 물속에서 40~80분 정도 효과를 유지하는 것이지 영구적이지 않아요.</li>
<li>화장 위에 덧바를 때는 자외선 차단 쿠션이나 파우더, 스틱형 제품을 활용할 수 있어요. 다만 이런 제품만으로는 충분한 양을 바르기 어려워서, 아침에 기본 차단제를 제대로 바르는 게 중요해요.</li>
</ul>

<h2>무기자차와 유기자차</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>무기자차 (물리적 차단제)</th><th>유기자차 (화학적 차단제)</th></tr></thead>
<tbody>
<tr><td>성분</td><td>징크옥사이드, 티타늄디옥사이드</td><td>여러 유기 자외선 흡수 성분</td></tr>
<tr><td>방식</td><td>피부 표면에서 자외선을 반사·산란</td><td>자외선을 흡수해 열로 바꿈</td></tr>
<tr><td>장점</td><td>자극이 적어 민감한 피부, 아이에게 적합</td><td>백탁이 적고 발림성이 좋음</td></tr>
<tr><td>단점</td><td>하얗게 뜨는 백탁, 뻑뻑함</td><td>일부 사람에게 자극이나 알레르기</td></tr>
</tbody></table></div>
<p>국내에서 판매되는 자외선 차단 성분은 식품의약품안전처가 허용한 기준 안에서 쓰여요. 어떤 방식이든 <strong>내가 매일 충분히 바를 수 있는 제품</strong>이 가장 좋은 제품이에요.</p>

<h2>차단제만으로는 부족하다</h2>
<ul>
<li><strong>그늘:</strong> 자외선이 가장 강한 오전 10시~오후 3시에는 그늘을 찾아요.</li>
<li><strong>옷:</strong> 촘촘하게 짜인 긴 소매 옷이 가장 확실한 차단제예요. 자외선 차단 기능이 있는 옷도 있어요.</li>
<li><strong>모자:</strong> 챙이 넓은(7cm 이상) 모자가 얼굴, 귀, 목까지 가려줘요.</li>
<li><strong>선글라스:</strong> UV400 또는 자외선 99~100% 차단 표시를 확인해요. 색이 진하다고 차단이 잘 되는 건 아니에요.</li>
<li><strong>자외선 지수 확인:</strong> 기상청 자외선 지수가 3 이상이면 차단이 필요하고, 8 이상이면 매우 높음이에요.</li>
<li><strong>반사:</strong> 눈은 자외선의 대부분을, 물과 모래도 상당 부분을 반사해요. 스키장과 해변에서는 더 신경 써요.</li>
</ul>

<h2>아기와 어린이</h2>
<ul>
<li><strong>생후 6개월 미만</strong> 아기는 자외선 차단제보다 그늘, 옷, 모자로 보호하는 것이 권장돼요. 불가피하면 얼굴과 손등처럼 드러난 곳에 소량 바를 수 있어요.</li>
<li>6개월 이후에는 자극이 적은 무기자차 제품을 우선 고려해요.</li>
<li>어린 시절의 심한 햇볕 화상은 나중의 피부암 위험을 높여요.</li>
</ul>

<div class="box"><span class="h">매일 자외선 차단 루틴</span>
<ol>
<li>아침 세안과 보습 후 손가락 두 마디 양 바르기</li>
<li>귀, 목, 손등까지 바르기</li>
<li>외출 전 기상청 자외선 지수 확인하기</li>
<li>야외 활동이 길면 2시간마다 덧바르기</li>
<li>모자와 선글라스 챙기기</li>
<li>개봉한 지 오래된 제품은 교체하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>자외선 차단제를 바르면 비타민 D가 부족해지나요?</dt>
<dd>이론적으로는 합성이 줄지만, 실제 생활에서는 완벽하게 바르는 경우가 드물어 차단제 사용이 비타민 D 결핍을 크게 일으키지는 않는다는 연구가 많아요. 비타민 D가 걱정되면 음식과 보충제로 채우는 게 피부를 지키면서 해결하는 방법이에요.</dd>
<dt>실내에만 있어도 발라야 하나요?</dt>
<dd>창가에 오래 앉아 있다면 UVA가 유리를 통과해 들어와요. 창에서 먼 곳에 있거나 짧게 머문다면 크게 걱정하지 않아도 돼요.</dd>
<dt>스프레이형은 괜찮나요?</dt>
<dd>편하지만 충분한 양이 피부에 남기 어렵고, 얼굴에 바로 뿌리면 들이마실 수 있어요. 손에 뿌린 뒤 얼굴에 펴 바르고, 몸에는 넉넉히 뿌린 뒤 문질러 주세요.</dd>
</dl>

<h2>참고 자료</h2>
<ul class="refs">

</ul>

  data-title="보이스피싱·스미싱 예방: 수법별 특징과 피해가 났을 때 바로 할 일"
  data-thumb="112|지급정지 신고"
  data-summary="검찰, 금융감독원, 가족, 택배 회사를 사칭하는 수법은 계속 바뀌지만 원칙은 같아요. 대표 수법과 공통점, 절대 하지 말아야 할 행동, 휴대폰 보안 설정, 피해가 났을 때 몇 분 안에 해야 할 지급정지와 명의도용 차단, 부모님과 미리 정해둘 약속을 정리했어요."
  data-tags="보이스피싱,스미싱,금융사기,개인정보,휴대폰보안">
<p class="lead">보이스피싱은 사람을 급하게 만들고 혼자 판단하게 만드는 범죄예요. "지금 바로", "아무에게도 말하지 마세요"라는 말이 나오면 그 자체가 신호예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>검찰·경찰·금융감독원은 전화로 <strong>돈 이체, 현금 전달, 앱 설치, 개인정보</strong>를 요구하지 않아요.</li>
<li>문자 속 <strong>링크를 누르지 않고</strong>, 출처를 알 수 없는 <strong>앱을 설치하지 않아요.</strong></li>
<li>가족이 급하게 돈을 요구하면 <strong>직접 전화를 걸어</strong> 확인해요.</li>
<li>돈을 보냈다면 즉시 <strong>112나 금융회사 콜센터</strong>에 전화해 지급정지를 요청해요.</li>
</ul></div>

<h2>대표적인 수법</h2>
<div class="tbl"><table>
<thead><tr><th>수법</th><th>이렇게 접근해요</th><th>진실</th></tr></thead>
<tbody>
<tr><td>수사기관 사칭</td><td>"고객님 계좌가 범죄에 연루됐습니다. 안전계좌로 옮겨야 합니다." 가짜 공문이나 영상통화로 검사를 연기하기도 해요</td><td>'안전계좌'는 존재하지 않아요. 수사기관은 돈을 옮기라고 하지 않아요</td></tr>
<tr><td>금융기관·대출 빙자</td><td>"저금리 대환대출이 가능합니다. 기존 대출을 먼저 갚으셔야 합니다."</td><td>대출을 조건으로 먼저 돈을 보내라거나 앱 설치를 요구하면 사기예요</td></tr>
<tr><td>가족·지인 사칭</td><td>"엄마, 나 폰 고장 나서 친구 폰으로 연락해. 급하게 결제할 게 있어."</td><td>원래 번호로 직접 전화하면 바로 확인돼요</td></tr>
<tr><td>택배·청첩장·부고 스미싱</td><td>"주소 불일치로 배송 보류. 확인: (링크)" "모바일 청첩장: (링크)"</td><td>링크를 누르면 악성 앱이 설치돼 개인정보와 금융정보가 빠져나가요</td></tr>
<tr><td>정부 지원금·환급 사칭</td><td>"재난지원금 대상입니다" "세금 환급금이 있습니다"</td><td>공공기관은 문자 링크로 개인정보를 받지 않아요</td></tr>
<tr><td>중고거래·투자 사기</td><td>안전결제를 사칭한 가짜 링크, 고수익 보장 투자 리딩방</td><td>공식 앱 밖의 결제 링크, 원금 보장·고수익 약속은 의심해요</td></tr>
</tbody></table></div>

<h2>수법이 달라도 공통점은 같다</h2>
<ul>
<li><strong>급하게 만들어요.</strong> "오늘 안에 처리하지 않으면", "지금 바로"</li>
<li><strong>고립시켜요.</strong> "보안 사항이니 가족에게도 말하지 마세요", "전화를 끊지 마세요"</li>
<li><strong>권위를 빌려요.</strong> 검사, 금융감독원, 은행 직원의 이름과 직함, 가짜 공문</li>
<li><strong>앱 설치를 유도해요.</strong> 원격 제어 앱이나 가짜 금융 앱을 설치하게 해요. 설치되는 순간 휴대폰을 조종하고, 내가 공식 번호로 전화를 걸어도 사기범에게 연결되게 만들 수 있어요.</li>
</ul>

<h2>절대 하지 말아야 할 것</h2>
<div class="box warn"><span class="h">이런 요구는 무조건 거절하세요</span>
<ul>
<li>전화로 계좌이체나 현금 인출을 요구해요.</li>
<li>현금을 찾아서 누군가에게 전달하거나 어딘가에 보관하라고 해요.</li>
<li>문자나 메신저로 받은 링크의 앱을 설치하라고 해요.</li>
<li>원격 제어 앱을 설치하라고 해요.</li>
<li>신분증 사진, 계좌 비밀번호, 인증번호, 보안카드 번호를 알려달라고 해요.</li>
<li>'안전계좌', '보호계좌'로 돈을 옮기라고 해요.</li>
</ul>
<p>의심되면 일단 <strong>전화를 끊고</strong>, 내가 직접 찾은 공식 번호(기관 홈페이지, 카드 뒷면)로 다시 걸어 확인해요. 받은 문자에 적힌 번호로 걸지 않아요.</p></div>

<h2>휴대폰 보안 설정</h2>
<ul>
<li><strong>출처를 알 수 없는 앱 설치 허용을 끄세요.</strong> 안드로이드 설정의 보안 메뉴에서 확인할 수 있어요.</li>
<li>운영체제와 앱을 최신 버전으로 업데이트해요.</li>
<li>통신사의 스팸·스미싱 차단 서비스와 보안 앱을 활용해요.</li>
<li>모르는 번호로 온 링크는 누르지 않고 삭제해요. 궁금하면 공식 앱이나 홈페이지에 직접 들어가 확인해요.</li>
<li>금융 앱의 <strong>지연 이체</strong>, <strong>입금 계좌 지정</strong>, <strong>해외 IP 차단</strong> 같은 안전 서비스를 설정하면 피해를 막을 시간을 벌 수 있어요.</li>
</ul>

<h2>피해가 났다면 바로 할 일</h2>
<p>돈이 넘어간 직후 몇 분이 가장 중요해요. 사기범은 돈을 받자마자 여러 계좌로 옮기거나 인출해요.</p>
<div class="tbl"><table>
<thead><tr><th>순서</th><th>할 일</th><th>연락처</th></tr></thead>
<tbody>
<tr><td>1</td><td><strong>지급정지 요청</strong>: 내가 돈을 보낸 은행 또는 받은 계좌의 은행에 즉시 연락</td><td>112 (경찰) 또는 해당 금융회사 콜센터</td></tr>
<tr><td>2</td><td>피해 상담과 안내</td><td>금융감독원 1332</td></tr>
<tr><td>3</td><td>개인정보 노출 등록 (추가 금융거래 제한)</td><td>금융감독원 개인정보노출자 사고예방시스템</td></tr>
<tr><td>4</td><td>내 명의 계좌·대출 확인, 일괄 지급정지</td><td>계좌정보통합관리서비스 (어카운트인포)</td></tr>
<tr><td>5</td><td>내 명의 휴대폰 개통 확인·차단</td><td>명의도용방지서비스 (엠세이퍼)</td></tr>
<tr><td>6</td><td>악성 앱 설치가 의심되면 휴대폰 점검 또는 초기화</td><td>통신사 대리점, 보안 앱, 118 (한국인터넷진흥원)</td></tr>
<tr><td>7</td><td>경찰서 방문 신고 후 사건사고사실확인원 발급, 피해구제 신청</td><td>은행에 제출</td></tr>
</tbody></table></div>
<p>신분증 사진을 보냈다면 주민센터에서 신분증을 재발급받고, 비밀번호와 공동인증서를 모두 바꿔요.</p>

<h2>부모님과 미리 정해둘 것</h2>
<div class="box"><span class="h">가족 보이스피싱 예방 약속</span>
<ol>
<li><strong>가족만 아는 암호</strong>를 정해요. 급하게 돈을 요구하면 암호를 물어봐요.</li>
<li>"급하게 돈 보내 달라"는 연락은 <strong>무조건 원래 번호로 전화</strong>해서 확인한다고 약속해요.</li>
<li>모르는 사람이 앱을 깔라고 하면 <strong>가족에게 먼저 물어보기로</strong> 해요.</li>
<li>부모님 휴대폰의 '출처를 알 수 없는 앱 설치'를 꺼두고, 스팸 차단을 설정해요.</li>
<li>피해가 났을 때 112에 바로 전화하는 법을 알려드려요.</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>링크를 눌렀는데 아무 일도 안 일어났어요. 괜찮은가요?</dt>
<dd>링크를 누른 것만으로 바로 피해가 생기는 경우는 드물지만, 앱 설치 화면이 뜨거나 뭔가를 설치했다면 위험해요. 설치한 앱이 있다면 삭제하고, 보안 앱으로 검사하고, 금융 앱 비밀번호를 바꿔요. 걱정되면 휴대폰을 초기화하는 게 가장 확실해요.</dd>
<dt>통장을 빌려달라거나 팔라고 하는데요.</dt>
<dd>내 계좌가 사기에 쓰이는 대포통장이 되면 나도 처벌받고, 금융거래가 제한될 수 있어요. 어떤 이유로도 통장, 체크카드, 인증 정보를 남에게 넘기지 않아요.</dd>
<dt>이미 돈을 인출해서 전달했어요.</dt>
<dd>현금을 직접 전달한 경우는 계좌 지급정지로 막을 수 없어서 더 어려워요. 그래도 즉시 112에 신고해요. 수거책을 추적하는 데 도움이 되고, 추가 피해를 막을 수 있어요.</dd>
</dl>

<h2>참고 자료</h2>

<template data-id="heart-attack" data-cat="dis" data-date="2026.09.29"
  data-title="심근경색 완전 정리: 가슴 통증의 경고, 병원 가기 전 할 일, 스텐트 이후의 삶"
  data-thumb="20분|가슴 통증 지속"
  data-summary="심근경색은 심장 근육에 피를 공급하는 혈관이 막혀 근육이 죽어가는 병이에요. 전형적인 가슴 통증과 여성·노인·당뇨병 환자의 다른 증상, 협심증이라는 경고, 119를 부른 뒤 할 일, 치료 과정, 스텐트 후 약을 끊으면 안 되는 이유를 정리했어요."
  data-tags="심근경색,협심증,가슴통증,스텐트,심장질환">
<p class="lead">심근경색은 막힌 혈관을 얼마나 빨리 뚫느냐에 따라 살릴 수 있는 심장 근육의 양이 달라져요. 증상을 알아채고 119를 부르는 시간이 결과를 좌우해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>가슴 한가운데를 <strong>짓누르고 조이는 통증이 20분 넘게</strong> 이어지면 바로 119예요.</li>
<li>여성, 노인, 당뇨병 환자는 <strong>숨참, 피로, 소화불량</strong>처럼 가슴 통증 없이 나타나기도 해요.</li>
<li>운동할 때만 가슴이 아프다가 쉬면 좋아지는 <strong>협심증</strong>은 심근경색의 경고예요.</li>
<li>스텐트 시술 후 처방받은 <strong>항혈소판제를 임의로 끊으면</strong> 스텐트가 막힐 수 있어요.</li>
</ul></div>

<h2>심근경색은 어떻게 생길까</h2>
<p>심장은 스스로 쉬지 않고 뛰기 위해 <strong>관상동맥</strong>이라는 혈관으로 산소와 영양을 공급받아요. 관상동맥 안쪽 벽에 콜레스테롤과 염증 세포로 된 덩어리(죽상반)가 쌓이다가, 어느 순간 덩어리 표면이 터지면 그 자리에 피떡(혈전)이 생겨 혈관을 막아요. 막힌 혈관 너머의 심장 근육은 산소를 받지 못해 죽기 시작해요.</p>
<p>근육이 죽는 범위는 시간이 지날수록 넓어져요. 그래서 빨리 뚫을수록 심장 기능을 많이 지킬 수 있어요. 막힌 상태에서 심장 박동이 흐트러지면 <strong>심정지</strong>로 이어질 수도 있어요.</p>

<h2>증상: 전형적인 경우와 그렇지 않은 경우</h2>
<div class="tbl"><table>
<thead><tr><th>전형적인 증상</th><th>놓치기 쉬운 증상</th></tr></thead>
<tbody>
<tr><td>가슴 한가운데를 누르는 듯, 조이는 듯, 쥐어짜는 듯한 통증이나 압박감</td><td>가슴 통증 없이 갑자기 숨이 참</td></tr>
<tr><td>20~30분 넘게 이어지고 쉬어도 좋아지지 않음</td><td>심한 피로감, 기운이 빠짐</td></tr>
<tr><td>왼팔, 양팔, 턱, 목, 등, 명치로 퍼지는 통증</td><td>명치 통증, 체한 듯한 소화불량, 메스꺼움</td></tr>
<tr><td>식은땀, 숨참, 메스꺼움, 어지러움</td><td>어지럼증, 실신</td></tr>
</tbody></table></div>
<p><strong>여성, 노인, 당뇨병 환자</strong>는 가슴 통증이 약하거나 없이 오른쪽 열의 증상으로만 나타나는 경우가 많아요. 당뇨병은 신경이 둔해져 통증을 덜 느끼게 만들 수 있어요. 평소와 다른 갑작스러운 숨참이나 소화불량에 식은땀이 함께 있다면 체한 것으로 넘기지 말아요.</p>

<h2>협심증: 미리 오는 경고</h2>
<p>관상동맥이 좁아졌지만 아직 막히지는 않은 상태예요. 심장이 산소를 더 필요로 할 때 부족해져서 통증이 생겨요.</p>
<ul>
<li>계단을 오르거나 빨리 걸을 때, 추운 날 밖에 나갈 때, 무거운 걸 들 때 가슴이 조여요.</li>
<li><strong>쉬면 5분 안에</strong> 좋아져요.</li>
<li>이런 증상이 있다면 가까운 시일 안에 <strong>순환기내과 진료</strong>를 받아요.</li>
</ul>
<div class="box warn"><span class="h">불안정 협심증은 응급이에요</span>
<p>협심증 통증이 <strong>쉬고 있을 때도 생기거나</strong>, 전보다 <strong>자주, 오래, 더 약한 활동에도</strong> 생긴다면 곧 심근경색으로 이어질 수 있는 상태예요. 바로 응급실로 가요.</p></div>

<h2>119를 부른 뒤</h2>
<ol>
<li><strong>바로 119</strong>에 연락해요. 직접 운전해서 가지 않아요. 구급차 안에서 심전도를 찍고 심장 시술이 가능한 병원으로 바로 연결될 수 있어요.</li>
<li>편한 자세로 앉아 안정을 취해요. 걷거나 움직이지 않아요.</li>
<li><strong>아스피린:</strong> 119 상담원이나 의료진이 권하면 아스피린을 <strong>씹어서</strong> 먹을 수 있어요. 아스피린 알레르기가 있거나, 출혈 위험이 크거나, 한쪽 마비·말 어눌함 같은 뇌졸중 증상이 함께 있다면 먹지 않아요.</li>
<li>이미 <strong>니트로글리세린 설하정</strong>을 처방받은 사람은 혀 밑에 넣어요. 5분 뒤에도 좋아지지 않으면 기다리지 말고 119예요.</li>
<li>증상이 시작된 시각과 먹고 있는 약을 기억해 의료진에게 알려요.</li>
</ol>
<div class="box warn"><span class="h">의식을 잃고 쓰러졌다면</span>
<p>반응이 없고 정상적인 호흡이 없다면 <strong>심정지</strong>예요. 119에 신고하고 즉시 <strong>가슴 압박</strong>을 시작하고, 주변에 <strong>자동심장충격기(AED)</strong>를 가져다 달라고 요청해요. 자세한 방법은 심폐소생술 글에 정리해 두었어요.</p></div>

<h2>병원에서의 치료</h2>
<ul>
<li><strong>심전도와 혈액검사</strong>(심장 효소)로 진단해요.</li>
<li><strong>관상동맥 중재술(스텐트):</strong> 손목이나 사타구니 혈관으로 가는 관을 넣어 막힌 혈관을 풍선으로 넓히고 금속 그물망(스텐트)을 넣어 다시 좁아지지 않게 해요. 가장 흔한 치료예요.</li>
<li><strong>혈전용해제:</strong> 시술이 빨리 어려운 경우 약으로 혈전을 녹이기도 해요.</li>
<li><strong>관상동맥 우회술:</strong> 여러 혈관이 심하게 막혔다면 다른 혈관을 이어 우회로를 만드는 수술을 해요.</li>
</ul>

<h2>스텐트 이후의 삶</h2>
<h3>약은 생명줄이에요</h3>
<div class="tbl"><table>
<thead><tr><th>약</th><th>역할</th></tr></thead>
<tbody>
<tr><td>항혈소판제 두 가지 (아스피린 + 다른 항혈소판제)</td><td>스텐트 안에 혈전이 생기지 않게 해요. 보통 일정 기간 두 가지를 함께 먹고, 이후 한 가지로 줄여요</td></tr>
<tr><td>스타틴</td><td>LDL 콜레스테롤을 크게 낮춰 재발을 막아요</td></tr>
<tr><td>베타 차단제, ACE 억제제·ARB 등</td><td>심장 부담을 줄이고 심장 기능을 보호해요</td></tr>
</tbody></table></div>
<div class="box warn"><span class="h">항혈소판제를 임의로 끊지 마세요</span>
<p>스텐트 시술 후 초기에 항혈소판제를 끊으면 스텐트 안에 갑자기 혈전이 생겨 <strong>다시 심근경색</strong>이 올 수 있어요. 치과 치료, 내시경, 수술을 앞두고 있다면 스스로 끊지 말고, 시술을 한 순환기내과 의사와 먼저 상의해요.</p></div>
<h3>심장 재활</h3>
<p>퇴원 후 전문가의 지도 아래 운동과 생활습관 교육을 받는 <strong>심장 재활</strong>은 재발과 사망을 줄이는 효과가 확인돼 있어요. 병원에 심장 재활 프로그램이 있는지 물어봐요.</p>
<h3>생활 관리</h3>
<ul>
<li><strong>금연</strong>은 재발을 막는 가장 강력한 방법이에요. 간접흡연도 피해요.</li>
<li>LDL 콜레스테롤, 혈압, 혈당을 목표 수준으로 유지해요.</li>
<li>의사와 상의한 강도로 규칙적으로 운동해요.</li>
<li>매년 독감 백신을 맞아요. 독감은 심근경색 위험을 일시적으로 높여요.</li>
<li>심근경색 후 우울감이 흔해요. 마음의 변화도 진료 때 이야기해요.</li>
</ul>

<h2>위험 요인</h2>
<ul>
<li>흡연, 고혈압, 당뇨병, 이상지질혈증</li>
<li>비만, 특히 복부비만, 운동 부족</li>
<li>나이 (남성 45세, 여성 55세 이상), 이른 나이에 심장병을 앓은 가족력</li>
<li>만성 스트레스, 수면무호흡</li>
<li>추운 날씨: 겨울 새벽에는 혈관이 수축하고 혈압이 올라 위험이 커져요.</li>
</ul>

<div class="box"><span class="h">심장을 위한 체크리스트</span>
<ol>
<li>가족 모두 심근경색 증상과 119 신고를 알아두기</li>
<li>가슴 통증이 20분 넘게 가면 망설이지 않기</li>
<li>운동할 때 가슴이 조이면 순환기내과 진료 받기</li>
<li>혈압, 혈당, 콜레스테롤 수치를 알고 관리하기</li>
<li>담배 끊기</li>
<li>가까운 곳의 자동심장충격기 위치 알아두기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>가슴이 콕콕 찌르듯 아픈데 심장 때문일까요?</dt>
<dd>손가락으로 짚을 수 있는 한 점이 몇 초씩 콕콕 찌르거나, 누르면 아프거나, 자세를 바꿀 때 아픈 통증은 근육이나 늑골 문제인 경우가 많아요. 심장 통증은 넓은 부위가 묵직하게 조이는 느낌이 흔해요. 하지만 구별이 어렵다면 진료를 받아요.</dd>
<dt>젊은 사람도 심근경색이 오나요?</dt>
<dd>드물지만 흡연, 가족성 고콜레스테롤혈증, 비만, 당뇨병이 있으면 30~40대에도 생길 수 있어요. 나이가 젊다고 가슴 통증을 무시하지 않아요.</dd>
<dt>스텐트를 넣으면 완치된 건가요?</dt>
<dd>스텐트는 막힌 부분 하나를 넓혀준 것이지, 동맥경화라는 병 자체를 없앤 건 아니에요. 다른 혈관도 좁아질 수 있어서 약과 생활 관리를 평생 이어가야 해요.</dd>
</dl>

<h2>참고 자료</h2>
<ul class="refs">
<li>대한심장학회, 급성 심근경색증 진료지침 및 심장 건강 정보</li>
<li>미국심장협회(AHA), Warning Signs of a Heart Attack</li>

</ul>

<template data-id="omega3" data-cat="nut" data-date="2026.09.29"
  data-title="오메가3 총정리: 생선과 영양제는 같을까, 대규모 연구가 말해주는 것"
  data-thumb="주 2회|생선 권장"
  data-summary="오메가3는 가장 많이 팔리는 영양제 중 하나예요. EPA·DHA와 들기름의 ALA 차이, 생선 섭취와 수은 걱정, 심혈관 질환 예방을 본 대규모 연구들의 엇갈린 결과, 중성지방을 낮추는 고용량, 심방세동 위험, 좋은 제품 고르는 법을 정리했어요."
  data-tags="오메가3,EPA,DHA,중성지방,생선">
<p class="lead">생선을 많이 먹는 사람에게 심장병이 적다는 관찰에서 오메가3 이야기는 시작됐어요. 그런데 생선을 먹는 것과 오메가3 캡슐을 먹는 것이 같은 효과를 낼까요? 대규모 연구들의 답은 생각보다 복잡해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>몸에서 주로 일하는 오메가3는 생선에 든 <strong>EPA와 DHA</strong>예요. 들기름의 <strong>ALA</strong>는 몸에서 EPA·DHA로 조금만 바뀌어요.</li>
<li>기름진 생선을 <strong>일주일에 2번</strong> 정도 먹는 것이 여러 기관의 기본 권장이에요.</li>
<li>일반 용량 오메가3 영양제는 대규모 연구에서 <strong>심혈관 질환을 뚜렷하게 줄이지 못했어요.</strong></li>
<li>고용량은 <strong>중성지방</strong>을 낮추지만, <strong>심방세동</strong> 위험을 조금 높일 수 있어요.</li>
</ul></div>

<h2>오메가3의 종류</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>주요 공급원</th><th>특징</th></tr></thead>
<tbody>
<tr><td>EPA (에이코사펜타엔산)</td><td>고등어, 연어, 꽁치, 정어리, 청어</td><td>염증 조절, 중성지방 저하에 관여</td></tr>
<tr><td>DHA (도코사헥사엔산)</td><td>기름진 생선</td><td>뇌와 망막의 주요 구성 성분</td></tr>
<tr><td>ALA (알파리놀렌산)</td><td>들기름, 아마씨, 치아씨드, 호두</td><td>필수지방산이지만 EPA·DHA로 바뀌는 비율은 낮음</td></tr>
</tbody></table></div>
<p>한국 식탁에서 흔한 <strong>들기름</strong>은 ALA가 매우 풍부한 기름이에요. ALA도 필수지방산으로 의미가 있지만, 몸 안에서 EPA로는 일부만, DHA로는 아주 적게 바뀌어요. 그래서 EPA·DHA는 생선에서 얻는 게 효율적이에요.</p>

<h2>얼마나 먹으면 좋을까</h2>
<p>여러 보건기관은 건강한 성인에게 <strong>EPA와 DHA를 합쳐 하루 250~500mg</strong> 정도를 권해요. 이는 기름진 생선을 <strong>일주일에 2번</strong>, 한 번에 손바닥 크기 정도 먹으면 채울 수 있는 양이에요. 고등어 한 토막에는 EPA와 DHA가 1g 넘게 들어 있는 경우도 많아요.</p>

<h2>생선과 수은</h2>
<p>생선은 오메가3 외에도 단백질, 비타민 D, 셀레늄을 주는 좋은 음식이에요. 다만 먹이사슬 위쪽의 큰 생선은 수은이 쌓여 있을 수 있어요.</p>
<div class="box note"><span class="h">임신부와 어린이의 생선 섭취</span>
<ul>
<li>식품의약품안전처는 임신부와 수유부에게 <strong>참치(다랑어)·새치류·상어</strong>는 <strong>일주일에 100g 이하</strong>로 먹도록 권해요.</li>
<li>고등어, 연어, 꽁치, 멸치 같은 일반 어류는 수은 걱정이 적어서 일주일에 여러 번 먹어도 괜찮아요.</li>
<li>참치 통조림은 주로 작은 가다랑어를 써서 수은이 상대적으로 적지만, 양을 조절해요.</li>
</ul></div>

<h2>영양제의 효과: 대규모 연구 결과</h2>
<div class="tbl"><table>
<thead><tr><th>연구</th><th>대상과 용량</th><th>결과</th></tr></thead>
<tbody>
<tr><td>VITAL (2019)</td><td>건강한 성인 약 2만 6천 명, EPA+DHA 1g</td><td>주요 심혈관 사건 전체는 줄지 않았어요</td></tr>
<tr><td>ASCEND (2018)</td><td>당뇨병 환자 약 1만 5천 명, 1g</td><td>심혈관 사건 감소 없음</td></tr>
<tr><td>REDUCE-IT (2019)</td><td>중성지방이 높은 심혈관 고위험군, 정제 EPA 4g</td><td>심혈관 사건이 약 25% 줄었지만, 비교에 쓴 위약(미네랄 오일)이 결과에 영향을 줬다는 논란이 있어요</td></tr>
<tr><td>STRENGTH (2020)</td><td>고위험군, EPA+DHA 4g</td><td>효과 없어 조기 중단</td></tr>
</tbody></table></div>
<p>정리하면 <strong>일반 용량 영양제는 건강한 사람의 심혈관 질환을 뚜렷하게 예방하지 못했어요.</strong> 특정 고위험군에서 고용량 정제 EPA 처방약의 효과가 보고됐지만 해석에 논란이 남아 있어요. 생선을 먹는 사람이 건강한 이유는 오메가3뿐 아니라 생선이 붉은 고기나 가공육을 대신하는 등 식단 전체의 영향일 수 있어요.</p>

<h2>중성지방을 낮추는 효과</h2>
<p>오메가3의 효과가 가장 분명한 부분은 <strong>중성지방</strong>이에요. 하루 2~4g의 고용량을 먹으면 중성지방이 20~30% 정도 떨어질 수 있어요. 그래서 중성지방이 매우 높은 사람에게 처방약으로 쓰여요. 다만 DHA가 포함된 제품은 LDL 콜레스테롤을 조금 올릴 수 있어서, 콜레스테롤 수치를 함께 확인해요.</p>
<p>국내에서 오메가3 건강기능식품은 '혈중 중성지질 개선', '혈행 개선' 등의 기능성으로 인정받아 판매되고 있어요.</p>

<h2>알아둘 부작용</h2>
<div class="box warn"><span class="h">고용량 오메가3와 심방세동</span>
<p>여러 연구를 모은 분석(2021)에서 오메가3를 하루 1g 넘게 먹은 그룹은 <strong>심방세동</strong> 위험이 높아졌어요. 심방세동은 뇌졸중 위험을 높이는 부정맥이에요. 가슴 두근거림이 생기거나 부정맥이 있다면 고용량 복용 전에 의사와 상의해요.</p></div>
<ul>
<li><strong>출혈:</strong> 고용량에서 출혈 경향이 조금 늘 수 있어요. 항응고제나 항혈소판제를 먹는다면 의사에게 알려요.</li>
<li><strong>위장 증상:</strong> 비린 트림, 속쓰림, 설사. 식사와 함께 먹거나 냉동 보관한 캡슐을 먹으면 줄어요.</li>
<li><strong>생선 알레르기</strong>가 있다면 생선 유래 제품을 조심해요.</li>
</ul>

<h2>그 밖의 기대 효과</h2>
<div class="tbl"><table>
<thead><tr><th>기대하는 효과</th><th>연구 결과</th></tr></thead>
<tbody>
<tr><td>안구건조증</td><td>대규모 연구(DREAM, 2018)에서 위약과 차이가 없었어요</td></tr>
<tr><td>치매 예방</td><td>건강한 노인의 인지 저하를 막는다는 근거는 부족해요</td></tr>
<tr><td>우울증</td><td>일부 EPA 위주 제품에서 보조 효과가 보고됐지만 결과가 엇갈려요</td></tr>
<tr><td>임신 중 태아 발달</td><td>임신부의 DHA 섭취는 권장되지만, 생선을 적당히 먹는다면 보충제가 꼭 필요하지는 않아요</td></tr>
</tbody></table></div>

<h2>좋은 제품 고르는 법</h2>
<ul>
<li>라벨에서 <strong>EPA와 DHA 합계 함량</strong>을 확인해요. '오메가3 1,000mg'이라고 적혀 있어도 실제 EPA+DHA는 그보다 적을 수 있어요.</li>
<li><strong>산패</strong>된 제품은 비린내가 심하고 몸에 좋지 않아요. 개봉 후에는 서늘하고 어두운 곳에 보관하고 기한 안에 먹어요.</li>
<li>건강기능식품 인증 마크를 확인해요.</li>
</ul>

<div class="box"><span class="h">오메가3 현명하게 챙기기</span>
<ol>
<li>고등어, 연어, 꽁치 같은 생선을 일주일에 2번 먹기</li>
<li>나물 무침에 들기름 활용하기</li>
<li>호두, 아마씨, 치아씨드를 간식이나 샐러드에</li>
<li>영양제는 목적(중성지방 등)이 분명할 때, 의사와 상의해 용량 정하기</li>
<li>항응고제 복용 중이거나 부정맥이 있다면 고용량 피하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>크릴오일이 더 좋은가요?</dt>
<dd>크릴오일은 오메가3가 인지질 형태로 들어 있어 흡수가 좋다는 주장이 있지만, 캡슐당 EPA·DHA 함량이 적은 경우가 많아요. 일반 생선유보다 건강 효과가 더 좋다는 대규모 연구는 부족해요.</dd>
<dt>들기름만 먹어도 오메가3가 충분한가요?</dt>
<dd>들기름으로 ALA는 충분히 얻을 수 있어요. 하지만 EPA·DHA로는 조금만 바뀌어서, 생선을 전혀 먹지 않는다면 EPA·DHA는 부족할 수 있어요. 채식을 한다면 해조류 유래 DHA 제품을 고려할 수 있어요.</dd>
<dt>오메가3를 먹으면 혈관이 깨끗해지나요?</dt>
<dd>'혈관 청소' 같은 표현은 과장이에요. 이미 쌓인 동맥경화를 녹인다는 근거는 없어요. 동맥경화 관리는 금연, 혈압·콜레스테롤·혈당 조절이 중심이에요.</dd>
</dl>

<h2>복용 시간의 뜻</h2>
<div class="tbl"><table>
<thead><tr><th>표시</th><th>뜻</th><th>이런 약에 많아요</th></tr></thead>
<tbody>
<tr><td>공복</td><td>식사 1시간 전 또는 식후 2시간 이후</td><td>갑상선 호르몬제, 골다공증약(비스포스포네이트), 일부 항생제</td></tr>
<tr><td>식전</td><td>식사 30분~1시간 전</td><td>일부 위장약, 위산억제제(PPI), 일부 당뇨약</td></tr>
<tr><td>식사 직후 또는 식사와 함께</td><td>밥을 먹은 바로 뒤</td><td>소염진통제(위 자극 감소), 메트포르민, 지용성 성분이 든 약</td></tr>
<tr><td>식후 30분</td><td>관행적으로 많이 쓰는 표시</td><td>특별한 이유가 없는 많은 약. 식사와 규칙적으로 연결해 잊지 않게 하는 목적도 있어요</td></tr>
<tr><td>취침 전</td><td>잠자리에 들기 직전</td><td>일부 콜레스테롤약, 변비약, 수면 관련 약</td></tr>
</tbody></table></div>
<p>'식후 30분'이라고 적혀 있어도 특별한 이유가 없는 약은 식사 직후에 먹어도 괜찮은 경우가 많아요. 반대로 공복이나 식전으로 지정된 약은 시간을 지키지 않으면 효과가 크게 떨어질 수 있어요. 헷갈리면 약사에게 "이 약은 시간을 꼭 지켜야 하나요?"라고 물어보세요.</p>

<h2>물 한 컵과 함께</h2>
<ul>
<li>물이 적으면 알약이 식도에 걸려 <strong>식도염이나 궤양</strong>이 생길 수 있어요. 특히 일부 항생제, 소염진통제, 골다공증약, 철분제가 그래요.</li>
<li>먹은 뒤 바로 눕지 않아요.</li>
<li><strong>우유:</strong> 칼슘이 일부 항생제(테트라사이클린, 퀴놀론 계열)와 결합해 흡수를 떨어뜨려요.</li>
<li><strong>커피, 녹차:</strong> 철분제 흡수를 방해하고, 일부 약의 부작용(두근거림)을 키울 수 있어요.</li>
<li><strong>과일주스:</strong> 일부 약의 흡수를 바꿔요.</li>
<li><strong>술:</strong> 수면제, 진통제, 당뇨약, 일부 항생제와 위험한 상호작용이 있어요.</li>
</ul>
<div class="box warn"><span class="h">자몽주스와 약</span>
<p>자몽(그레이프프루트)은 장과 간에서 약을 분해하는 효소를 막아서, 일부 약의 혈중 농도를 크게 높여요. 일부 <strong>콜레스테롤약(심바스타틴, 아토르바스타틴 등)</strong>, 일부 <strong>혈압약(펠로디핀 등 칼슘채널차단제)</strong>, 일부 면역억제제와 부정맥약이 해당돼요. 한 잔으로도 효과가 하루 이상 갈 수 있어요. 이런 약을 먹는다면 자몽과 자몽주스를 피하고, 해당 여부를 약사에게 확인해요.</p></div>

<h2>복용을 잊었을 때</h2>
<ul>
<li>생각난 <strong>즉시</strong> 먹어요.</li>
<li>다음 복용 시간이 가깝다면 <strong>잊은 것은 건너뛰고</strong> 다음 시간에 원래 양만 먹어요.</li>
<li><strong>두 번 치를 한꺼번에 먹지 않아요.</strong></li>
<li>피임약, 항응고제, 항경련제, 인슐린처럼 시간이 중요한 약은 약마다 규칙이 달라요. 설명서를 확인하거나 약사에게 물어봐요.</li>
<li>자주 잊는다면 요일별 약통, 휴대폰 알람을 활용해요.</li>
</ul>

<h2>쪼개거나 가루로 만들면 안 되는 약</h2>
<div class="tbl"><table>
<thead><tr><th>종류</th><th>이유</th></tr></thead>
<tbody>
<tr><td>서방정 (이름에 '서방', 'SR', 'CR', 'XL' 등)</td><td>천천히 녹도록 설계돼 있어서 쪼개면 한꺼번에 흡수돼 부작용이 커질 수 있어요</td></tr>
<tr><td>장용정</td><td>위산에 녹지 않고 장에서 녹도록 코팅돼 있어요. 쪼개면 위를 자극하거나 약효가 떨어져요</td></tr>
<tr><td>캡슐</td><td>대부분 열지 않고 그대로 먹어요</td></tr>
<tr><td>설하정</td><td>혀 밑에서 녹여 흡수시키는 약이라 삼키지 않아요</td></tr>
</tbody></table></div>
<p>알약을 삼키기 어렵다면 임의로 부수지 말고 약사에게 가루약이나 물약 같은 다른 형태가 있는지 물어봐요. 약에 쪼개는 선(분할선)이 있다면 쪼갤 수 있는 경우가 많아요.</p>

<h2>보관</h2>
<ul>
<li>습기와 열, 직사광선을 피해요. <strong>욕실이나 차 안</strong>은 좋지 않아요.</li>
<li>인슐린, 일부 안약과 시럽처럼 <strong>냉장 보관</strong>이 필요한 약은 표시를 확인해요.</li>
<li>조제한 가루약과 시럽은 원래 약보다 사용 기한이 짧아요. 처방 기간이 지나면 남은 약은 버려요.</li>
<li>원래 포장이나 약 봉투에 보관해야 이름과 용법을 알 수 있어요.</li>
<li><strong>아이 손이 닿지 않는 곳</strong>에 보관해요. 특히 철분제, 혈압약, 당뇨약, 진통제는 소량으로도 아이에게 위험해요.</li>
</ul>

<h2>여러 약을 먹는다면</h2>
<p>만성질환이 여러 개인 어르신은 여러 병원에서 약을 받아 하루 10알 넘게 먹는 경우도 많아요. 약이 많아질수록 상호작용과 부작용, 넘어짐 같은 위험이 커져요.</p>
<ul>
<li><strong>복용 중인 약 목록</strong>을 만들어 진료 때마다 보여줘요. 영양제, 한약, 일반의약품도 포함해요.</li>
<li>가능하면 <strong>한 약국</strong>을 이용하면 약사가 전체 약을 확인하기 쉬워요.</li>
<li>건강보험심사평가원의 <strong>'내가 먹는 약! 한눈에'</strong> 서비스에서 최근 처방받은 약을 확인할 수 있어요.</li>
<li>병원과 약국은 처방·조제할 때 <strong>의약품안전사용서비스(DUR)</strong>로 함께 먹으면 안 되는 약이나 중복 처방을 확인해요.</li>
<li>일부 지역과 기관에서는 약사가 집으로 찾아가 약을 점검해 주는 다제약물 관리 서비스도 있어요.</li>
</ul>

<h2>약 먹고 운전해도 될까</h2>
<p>1세대 항히스타민제(일부 감기약, 콧물약, 멀미약), 수면제, 신경안정제, 근이완제, 일부 진통제는 졸음과 판단력 저하를 일으킬 수 있어요. 약 봉투나 설명서에 '졸음' 주의 문구가 있다면 운전과 위험한 기계 작업을 피해요.</p>

<h2>남은 약 버리기</h2>
<p>남은 약을 일반 쓰레기나 변기, 싱크대에 버리면 토양과 물을 오염시켜요.</p>
<div class="box note"><span class="h">폐의약품 버리는 법</span>
<ul>
<li>가까운 <strong>약국, 보건소, 주민센터의 폐의약품 수거함</strong>에 넣어요.</li>
<li>알약은 포장에서 꺼내 알약끼리 모으고, 종이 상자와 설명서는 따로 재활용해요.</li>
<li>가루약은 포장째, 물약은 한 병에 모아 새지 않게 밀봉해요.</li>
<li>일부 지역은 <strong>우체통</strong>에 전용 봉투로 폐의약품(물약 제외)을 넣을 수 있어요. 지자체 안내를 확인해요.</li>
</ul></div>

<div class="box"><span class="h">약 관리 체크리스트</span>
<ol>
<li>복용 중인 약, 영양제, 한약 목록 만들기</li>
<li>공복·식전 약이 있는지 확인하고 알람 맞추기</li>
<li>약은 물 한 컵과 함께</li>
<li>자몽과 함께 먹으면 안 되는 약인지 확인하기</li>
<li>약 보관 장소를 욕실에서 옮기기</li>
<li>유효기간 지난 약 정리해서 수거함에 버리기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>증상이 좋아지면 약을 그만 먹어도 되나요?</dt>
<dd>약마다 달라요. 진통제나 감기약은 증상이 없어지면 멈춰도 되는 경우가 많지만, 항생제, 혈압약, 당뇨약, 항우울제 같은 약은 스스로 멈추면 재발하거나 위험해질 수 있어요. 의사와 상의해요.</dd>
<dt>유효기간이 조금 지난 약을 먹어도 되나요?</dt>
<dd>유효기간이 지나면 효과가 떨어지거나 성분이 변할 수 있어서 권하지 않아요. 특히 조제한 시럽, 안약, 개봉한 연고는 기한을 지켜요.</dd>
<dt>다른 사람이 처방받은 약을 먹어도 되나요?</dt>
<dd>증상이 비슷해 보여도 원인이 다를 수 있고, 나에게 맞지 않는 성분이나 용량일 수 있어요. 처방약은 처방받은 사람만 먹어요.</dd>
</dl>

  data-thumb="2단계|인증 설정"
  data-summary="유출 통지 문자를 받으면 무엇부터 해야 할지 막막하죠. 유출된 정보의 종류에 따른 위험, 비밀번호와 2단계 인증 정리, 휴대폰 개통·금융거래 명의도용을 막는 무료 서비스, 신분증 사진 유출 대처, 주민등록번호 변경 제도, 신고할 곳을 정리했어요."

<p class="lead">개인정보 유출은 이제 드문 일이 아니에요. 유출 자체는 막을 수 없어도, 유출된 정보로 피해가 생기는 것은 상당 부분 막을 수 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>먼저 <strong>무엇이 유출됐는지</strong> 확인해요. 연락처인지, 주민등록번호·계좌·비밀번호인지에 따라 대응이 달라요.</li>
<li>유출된 곳과 <strong>같은 비밀번호를 쓰는 모든 곳</strong>의 비밀번호를 바꾸고, <strong>2단계 인증</strong>을 켜요.</li>
<li><strong>휴대폰 가입 제한(엠세이퍼)</strong>, <strong>개인정보노출자 등록</strong>으로 명의도용을 막아요.</li>
<li>유출 이후에는 그 정보를 이용한 <strong>맞춤형 스미싱</strong>이 늘어요. 링크를 특히 조심해요.</li>
</ul></div>

<h2>1단계: 무엇이 유출됐는지 확인하기</h2>
<p>기업이 보낸 유출 통지에는 유출된 항목이 적혀 있어요. 항목에 따라 위험과 대응이 달라요.</p>
<div class="tbl"><table>
<thead><tr><th>유출 항목</th><th>생길 수 있는 피해</th><th>우선 대응</th></tr></thead>
<tbody>
<tr><td>이름, 전화번호, 이메일, 주소</td><td>스팸, 맞춤형 스미싱·보이스피싱, 택배 사칭</td><td>링크·전화 경계, 스팸 차단</td></tr>
<tr><td>아이디, 비밀번호</td><td>계정 도용, 같은 비밀번호를 쓰는 다른 계정 침입</td><td>비밀번호 변경, 2단계 인증</td></tr>
<tr><td>주민등록번호, 신분증 사본</td><td>명의도용 휴대폰 개통, 대출·계좌 개설</td><td>명의도용 차단 서비스 모두 신청</td></tr>
<tr><td>계좌번호, 카드번호</td><td>부정 결제, 금융사기</td><td>카드 재발급, 결제 알림, 금융회사 연락</td></tr>
<tr><td>휴대폰 유심 정보</td><td>유심 복제, 인증 문자 가로채기</td><td>통신사 유심 보호 서비스, 유심 비밀번호 설정, 필요시 유심 교체</td></tr>
</tbody></table></div>

<h2>2단계: 비밀번호와 계정 정리</h2>
<ul>
<li>유출된 서비스의 비밀번호를 바꾸고, <strong>같거나 비슷한 비밀번호를 쓰는 곳</strong>도 모두 바꿔요. 해커는 유출된 아이디·비밀번호를 다른 사이트에 그대로 넣어보는 방식(크리덴셜 스터핑)을 많이 써요.</li>
<li>비밀번호는 <strong>사이트마다 다르게</strong>, 길게 만들어요. 외우기 어렵다면 <strong>비밀번호 관리 기능</strong>(휴대폰·브라우저 내장 또는 전용 앱)을 활용해요.</li>
<li>이메일, 금융, 쇼핑, 메신저 계정에는 <strong>2단계 인증</strong>을 켜요. 문자보다 인증 앱이나 패스키가 더 안전해요.</li>
<li>계정의 로그인 기록과 연결된 기기를 확인하고, 모르는 기기는 로그아웃시켜요.</li>
<li>쓰지 않는 사이트는 탈퇴해 정보가 남아 있는 곳을 줄여요.</li>
</ul>
<p>개인정보보호위원회의 <strong>'털린 내 정보 찾기'</strong> 서비스에서 내 계정 정보가 불법 유통된 적이 있는지 조회해 볼 수 있어요.</p>

<h2>3단계: 명의도용 차단 서비스</h2>
<div class="tbl"><table>
<thead><tr><th>서비스</th><th>하는 일</th><th>운영</th></tr></thead>
<tbody>
<tr><td>명의도용방지서비스 (엠세이퍼)</td><td>내 명의로 개통된 휴대폰 조회, <strong>신규 가입 제한</strong> 설정, 개통 시 알림</td><td>한국정보통신진흥협회</td></tr>
<tr><td>개인정보노출자 사고예방시스템</td><td>등록하면 금융회사들이 내 명의의 신규 계좌 개설·대출·카드 발급 때 본인 확인을 강화</td><td>금융감독원 (파인)</td></tr>
<tr><td>계좌정보통합관리서비스 (어카운트인포)</td><td>내 명의의 모든 계좌·대출·카드 조회, 모르는 계좌 확인과 정리</td><td>금융결제원</td></tr>
<tr><td>신용정보 조회</td><td>내 신용정보 변동, 조회 기록 확인. 신용조회회사별로 정기적인 무료 조회 가능</td><td>신용평가회사</td></tr>
</tbody></table></div>
<p>주민등록번호나 신분증이 유출됐다면 위 서비스를 <strong>모두</strong> 설정하는 게 좋아요. 휴대폰 가입 제한을 걸어두면 나중에 내가 새로 개통할 때 해제해야 하는 번거로움이 있지만, 명의도용 휴대폰은 금융 사기의 출발점이 되기 쉬워서 효과가 커요.</p>

<h2>신분증 사진이 유출됐다면</h2>
<ol>
<li>주민센터나 정부24에서 <strong>신분증 분실 신고</strong>를 하고 재발급받아요. 재발급하면 예전 신분증은 진위 확인에서 걸러져요.</li>
<li>위의 명의도용 차단 서비스를 모두 신청해요.</li>
<li>금융 앱과 공동인증서의 비밀번호를 바꿔요.</li>
<li>모르는 계좌나 대출이 생겼다면 바로 해당 금융회사와 112에 신고해요.</li>
</ol>

<h2>주민등록번호 변경</h2>
<p>주민등록번호 유출로 생명·신체·재산 피해를 입었거나 입을 우려가 있다면 <strong>주민등록번호 변경</strong>을 신청할 수 있어요. 주민센터에 신청하면 주민등록번호변경위원회가 심사해요. 번호가 바뀌면 금융, 보험, 각종 기관의 정보를 모두 갱신해야 해서 번거롭지만, 피해가 반복되는 경우에는 근본적인 해결책이 될 수 있어요.</p>

<h2>유출 이후의 2차 피해를 조심하기</h2>
<div class="box warn"><span class="h">유출 소식 뒤에 오는 문자를 특히 조심하세요</span>
<ul>
<li>"개인정보 유출 피해 보상 신청", "유출 확인하기" 같은 문자의 <strong>링크</strong>는 누르지 않아요. 유출된 기업의 공식 홈페이지나 앱에 직접 들어가 확인해요.</li>
<li>내 이름, 주소, 주문 내역을 정확히 알고 연락해 오는 경우가 있어요. 정보를 안다고 해서 진짜 기관이나 회사라는 뜻이 아니에요.</li>
<li>"피해 조사를 위해 앱을 설치하라"는 요구는 거절해요.</li>
</ul></div>

<h2>신고하고 도움받을 곳</h2>
<ul>
<li><strong>개인정보침해 신고센터 (국번 없이 118):</strong> 개인정보 침해 신고와 상담</li>
<li><strong>개인정보 분쟁조정위원회:</strong> 유출로 인한 피해 배상 조정</li>
<li><strong>경찰청 사이버범죄 신고시스템:</strong> 계정 도용, 사기 피해 신고</li>
<li><strong>금융감독원 (1332):</strong> 금융 피해 상담</li>
</ul>

<h2>평소 예방 습관</h2>
<div class="box"><span class="h">개인정보 지키기 체크리스트</span>
<ol>
<li>주요 계정 비밀번호를 서로 다르게 바꾸고 비밀번호 관리 기능 쓰기</li>
<li>이메일, 금융, 메신저에 2단계 인증 켜기</li>
<li>휴대폰 화면 잠금과 유심 비밀번호(PIN) 설정하기</li>
<li>엠세이퍼로 내 명의 휴대폰 개통 현황 조회하기</li>
<li>안 쓰는 사이트 탈퇴하기</li>
<li>택배 송장, 영수증은 개인정보를 가리고 버리기</li>
<li>SNS에 생일, 주소, 아이 학교 같은 정보를 공개하지 않기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>이름과 전화번호만 유출됐으면 괜찮은 거죠?</dt>
<dd>직접적인 금융 피해 위험은 낮지만, 이 정보로 나를 겨냥한 스미싱과 보이스피싱이 들어올 수 있어요. 한동안 모르는 연락과 링크를 특히 조심해요.</dd>
<dt>비밀번호는 얼마나 자주 바꿔야 하나요?</dt>
<dd>요즘 권고는 정기적으로 자주 바꾸기보다, 사이트마다 다른 길고 강한 비밀번호를 쓰고 유출 의심이 있을 때 즉시 바꾸는 쪽이에요. 2단계 인증을 함께 쓰는 게 가장 효과적이에요.</dd>
<dt>유출한 회사에서 보상을 받을 수 있나요?</dt>
<dd>회사의 과실이 인정되면 손해배상을 청구할 수 있어요. 개인정보 분쟁조정위원회에 조정을 신청하거나, 집단분쟁조정 절차에 참여하는 방법이 있어요.</dd>
</dl>

<template data-id="ckd" data-cat="dis" data-date="2026.09.29"
  data-title="만성 콩팥병: 증상 없이 진행하는 병, 두 가지 검사로 미리 찾기"
  data-thumb="60|사구체여과율"
  data-summary="콩팥은 기능이 절반 넘게 떨어져도 거의 아프지 않아요. 만성 콩팥병의 정의와 단계, 당뇨병과 고혈압이 가장 큰 원인인 이유, 사구체여과율과 소변 알부민 검사 읽는 법, 콩팥을 지키는 새로운 약, 콩팥에 부담을 주는 약과 습관을 정리했어요."
  data-tags="콩팥병,신장질환,사구체여과율,단백뇨,투석">
<p class="lead">콩팥은 하루에 약 180L의 혈액을 걸러 노폐물과 남는 물을 소변으로 내보내요. 기능이 꽤 떨어져도 남은 부분이 버텨주기 때문에, 증상이 나타날 때는 이미 많이 진행된 경우가 많아요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li><strong>사구체여과율 60 미만</strong> 또는 <strong>소변 알부민 증가</strong>가 3개월 넘게 이어지면 만성 콩팥병이에요.</li>
<li>국내 투석 환자의 가장 큰 원인은 <strong>당뇨병</strong>, 그다음이 <strong>고혈압</strong>이에요.</li>
<li>혈액 검사(크레아티닌)만으로는 부족해요. <strong>소변 알부민 검사</strong>를 함께 해야 일찍 찾을 수 있어요.</li>
<li>진통소염제를 자주 먹거나 성분이 불분명한 <strong>건강식품·한약</strong>은 콩팥에 부담이 될 수 있어요.</li>
</ul></div>

<h2>콩팥이 하는 일</h2>
<ul>
<li><strong>노폐물 배출:</strong> 단백질이 분해되고 남은 요소, 크레아티닌 등을 걸러내요.</li>
<li><strong>수분과 전해질 조절:</strong> 나트륨, 칼륨, 칼슘, 인의 균형을 맞춰요.</li>
<li><strong>혈압 조절:</strong> 혈압을 조절하는 호르몬 체계에 관여해요.</li>
<li><strong>적혈구 생성:</strong> 조혈 호르몬(에리트로포이에틴)을 만들어요. 그래서 콩팥병이 진행되면 빈혈이 생겨요.</li>
<li><strong>뼈 건강:</strong> 비타민 D를 활성형으로 바꿔요.</li>
</ul>

<h2>만성 콩팥병의 정의와 단계</h2>
<p>다음 중 하나가 <strong>3개월 넘게</strong> 이어지면 만성 콩팥병이에요.</p>
<ul>
<li><strong>사구체여과율(eGFR)이 60mL/min/1.73m² 미만</strong></li>
<li><strong>콩팥 손상의 증거</strong>: 소변 알부민 증가, 소변 이상, 영상 검사의 구조적 이상 등</li>
</ul>
<div class="tbl"><table>
<thead><tr><th>단계</th><th>사구체여과율</th><th>상태</th></tr></thead>
<tbody>
<tr><td>1</td><td class="num">90 이상</td><td>기능은 정상이지만 손상의 증거가 있음</td></tr>
<tr><td>2</td><td class="num">60~89</td><td>경미한 감소</td></tr>
<tr><td>3a</td><td class="num">45~59</td><td>경도~중등도 감소</td></tr>
<tr><td>3b</td><td class="num">30~44</td><td>중등도~고도 감소</td></tr>
<tr><td>4</td><td class="num">15~29</td><td>고도 감소, 투석 준비 논의</td></tr>
<tr><td>5</td><td class="num">15 미만</td><td>말기 콩팥병, 투석이나 이식 필요</td></tr>
</tbody>
<caption>국제 콩팥병 진료지침(KDIGO) 기준. 소변 알부민 정도(A1~A3)와 함께 위험도를 평가해요.</caption></table></div>

<h2>원인</h2>
<div class="tbl"><table>
<thead><tr><th>원인</th><th>설명</th></tr></thead>
<tbody>
<tr><td>당뇨병</td><td>높은 혈당이 콩팥의 미세 혈관을 손상시켜요. 국내 신규 투석 환자의 약 절반이 당뇨병 때문이에요.</td></tr>
<tr><td>고혈압</td><td>높은 압력이 콩팥 혈관을 딱딱하게 만들어요. 반대로 콩팥병이 고혈압을 악화시키기도 해요.</td></tr>
<tr><td>사구체신염</td><td>면역 이상으로 콩팥의 여과 장치에 염증이 생겨요. 젊은 사람의 콩팥병 원인으로 흔해요.</td></tr>
<tr><td>다낭성 신장병</td><td>유전 질환으로 콩팥에 물혹이 많이 생겨요.</td></tr>
<tr><td>그 밖에</td><td>반복되는 요로 감염, 요로 폐쇄, 약물, 비만</td></tr>
</tbody></table></div>

<h2>증상: 늦게 나타난다</h2>
<p>초기에는 거의 증상이 없어요. 대한신장학회는 국내 성인 중 적지 않은 사람이 만성 콩팥병을 가지고 있지만, 대부분이 이를 모른다고 알려요. 진행하면 이런 증상이 생길 수 있어요.</p>
<ul>
<li>소변에 <strong>거품</strong>이 많고 오래 남아요 (단백뇨)</li>
<li>눈 주위, 발목이 <strong>붓어요</strong></li>
<li>밤에 소변을 보려고 자주 깨요</li>
<li>피로, 무기력, 식욕 저하, 메스꺼움</li>
<li>피부 가려움, 근육 경련</li>
<li>혈압이 잘 조절되지 않아요</li>
</ul>

<h2>두 가지 검사로 찾는다</h2>
<div class="tbl"><table>
<thead><tr><th>검사</th><th>무엇을 보나</th><th>기준</th></tr></thead>
<tbody>
<tr><td>혈청 크레아티닌 → 사구체여과율(eGFR)</td><td>콩팥이 얼마나 잘 거르는지</td><td>60 미만이면 기능 감소</td></tr>
<tr><td>소변 알부민/크레아티닌 비율(UACR)</td><td>콩팥이 얼마나 손상됐는지. 가장 이른 신호</td><td>30mg/g 이상이면 증가</td></tr>
</tbody></table></div>
<p>일반 건강검진에서는 크레아티닌과 소변 단백(막대 검사)을 보는 경우가 많아요. 막대 검사는 적은 양의 알부민을 놓칠 수 있어서, <strong>당뇨병이나 고혈압이 있다면 해마다 소변 알부민 검사</strong>를 따로 받는 게 좋아요. 사구체여과율이 정상이어도 알부민이 나오면 콩팥 손상이 시작된 거예요.</p>

<h2>진행을 늦추는 치료</h2>
<h3>혈압과 혈당</h3>
<ul>
<li>혈압은 대개 <strong>130/80mmHg 미만</strong>을 목표로 해요. 알부민이 나오면 <strong>ACE 억제제나 ARB</strong> 계열 혈압약이 콩팥을 보호해요.</li>
<li>당뇨병이 있다면 혈당을 조절하고, 콩팥에 부담이 적은 약을 골라요.</li>
</ul>
<h3>콩팥을 지키는 새로운 약</h3>
<p>원래 당뇨병 약으로 개발된 <strong>SGLT2 억제제</strong>는 대규모 연구에서 <strong>당뇨병이 없는 만성 콩팥병 환자에게서도</strong> 콩팥 기능 저하와 투석을 줄였어요. 당뇨병성 콩팥병에서는 피네레논 같은 약도 쓰여요. 나에게 맞는지는 신장내과에서 상담해요.</p>
<h3>식사</h3>
<ul>
<li><strong>싱겁게</strong> 먹어요. 나트륨은 혈압과 부종을 악화시켜요.</li>
<li><strong>단백질은 적당히</strong>: 너무 많이 먹으면 콩팥의 부담이 커져요. 진행된 단계에서는 의사와 영양사가 정한 양을 따라요. 단백질 보충제는 먼저 상의해요.</li>
<li>진행된 단계에서는 <strong>칼륨과 인</strong>을 제한해야 할 수 있어요. 가공식품의 인 첨가물은 흡수가 잘 돼서 특히 조심해요.</li>
</ul>

<h2>콩팥에 부담을 주는 것</h2>
<div class="box warn"><span class="h">콩팥이 약하다면 조심하세요</span>
<ul>
<li><strong>소염진통제</strong>(이부프로펜, 나프록센 등)를 자주, 오래 먹는 것. 진통이 필요하면 아세트아미노펜을 우선 고려하고 의사와 상의해요.</li>
<li>성분이 불분명한 <strong>건강식품, 한약, 민간요법</strong>. 일부 약초 성분은 콩팥을 심하게 손상시킨 사례가 있어요.</li>
<li><strong>조영제</strong>를 쓰는 CT 검사: 검사 전 콩팥병이 있다고 알려요.</li>
<li><strong>탈수</strong>: 설사, 구토, 무더위에 물을 충분히 마셔요 (수분 제한을 받은 경우는 의사 지시를 따라요).</li>
<li>약 용량: 콩팥으로 배출되는 약은 용량 조정이 필요해요. 새 약을 처방받을 때 콩팥병을 알려요.</li>
</ul></div>

<h2>투석과 이식</h2>
<p>콩팥 기능이 15% 아래로 떨어지면 노폐물과 물을 대신 걸러줄 방법이 필요해요.</p>
<ul>
<li><strong>혈액투석:</strong> 일주일에 보통 3번, 한 번에 4시간 정도 병원에서 기계로 혈액을 걸러요.</li>
<li><strong>복막투석:</strong> 배 안의 막을 이용해 집에서 하루 여러 번 또는 밤사이 기계로 해요.</li>
<li><strong>콩팥 이식:</strong> 가장 좋은 치료지만 기증자가 필요해요.</li>
</ul>
<p>4단계부터는 어떤 방법이 나에게 맞을지 미리 상의하고 준비하는 게 좋아요.</p>

<div class="box"><span class="h">콩팥 지키기 체크리스트</span>
<ol>
<li>검진 결과지에서 사구체여과율과 요단백 확인하기</li>
<li>당뇨병·고혈압이 있다면 해마다 소변 알부민 검사 받기</li>
<li>혈압과 혈당을 목표 수준으로 관리하기</li>
<li>진통소염제는 필요할 때만 짧게</li>
<li>성분이 불분명한 건강식품과 한약 피하기</li>
<li>싱겁게 먹고, 금연하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>물을 많이 마시면 콩팥에 좋은가요?</dt>
<dd>탈수를 피하는 건 중요하지만, 필요 이상으로 많이 마신다고 콩팥병이 좋아지지는 않아요. 진행된 콩팥병이나 심부전이 있다면 오히려 수분을 제한해야 할 수 있어요.</dd>
<dt>소변에 거품이 나면 콩팥병인가요?</dt>
<dd>소변을 세게 볼 때 생긴 거품은 금방 사라져요. 거품이 오래 남고 매번 반복된다면 단백뇨일 수 있으니 소변 검사를 받아요.</dd>
<dt>콩팥 기능은 다시 좋아지나요?</dt>
<dd>만성 콩팥병으로 잃은 기능은 대부분 되돌리기 어려워요. 하지만 일찍 발견해 관리하면 진행 속도를 크게 늦춰 평생 투석 없이 지낼 수 있는 경우가 많아요.</dd>
</dl>

<h2>참고 자료</h2>
<ul class="refs">
<li>대한신장학회, 만성콩팥병 건강 정보 및 신장 질환 팩트시트</li>

  data-title="단백질 총정리: 하루 얼마나, 어떻게 나눠 먹을까, 보충제는 필요할까"

<p class="lead">단백질이라고 하면 운동하는 사람의 영양소처럼 느껴지지만, 가장 챙겨야 하는 건 오히려 식사량이 줄어드는 어르신이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인 권장섭취량은 대략 <strong>체중 1kg당 0.9g</strong> 안팎이에요. 남성 60~65g, 여성 50~55g 정도예요.</li>
<li>노인은 근육 유지를 위해 <strong>1kg당 1.0~1.2g</strong> 정도가 필요하다는 전문가 권고가 있어요.</li>
<li>한 끼에 몰아 먹기보다 <strong>세 끼에 20~30g씩</strong> 나눠 먹는 게 근육 합성에 유리해요.</li>
<li>식사로 충분하다면 <strong>보충제는 필요 없어요.</strong> 콩팥병이 있다면 섭취량을 의사와 정해요.</li>
</ul></div>

<h2>단백질이 하는 일</h2>
<p>단백질은 20가지 아미노산이 사슬처럼 이어진 물질이에요. 몸은 이 아미노산을 조립해 필요한 단백질을 만들어요.</p>
<ul>
<li><strong>근육, 뼈, 피부, 머리카락</strong>의 구조</li>
<li>소화와 대사를 돕는 <strong>효소</strong></li>
<li>인슐린 같은 <strong>호르몬</strong></li>
<li>감염과 싸우는 <strong>항체</strong></li>
<li>산소를 나르는 <strong>헤모글로빈</strong></li>
</ul>
<p>20가지 아미노산 중 9가지는 몸에서 만들지 못해 음식으로 먹어야 해요. 이를 <strong>필수아미노산</strong>이라고 해요. 몸은 단백질을 따로 저장해두지 않기 때문에 매일 꾸준히 먹어야 해요.</p>

<h2>하루에 얼마나 필요할까</h2>
<div class="tbl"><table>
<thead><tr><th>나이</th><th>남성 권장섭취량</th><th>여성 권장섭취량</th></tr></thead>
<tbody>
<tr><td>19~29세</td><td class="num">65g</td><td class="num">55g</td></tr>
<tr><td>30~49세</td><td class="num">65g</td><td class="num">50g</td></tr>
<tr><td>50~64세</td><td class="num">60g</td><td class="num">50g</td></tr>
<tr><td>65세 이상</td><td class="num">60g</td><td class="num">50g</td></tr>
<tr><td>임신 중기 / 후기</td><td class="num">-</td><td class="num">+15g / +30g</td></tr>
<tr><td>수유부</td><td class="num">-</td><td class="num">+25g</td></tr>
</tbody>
<caption>보건복지부·한국영양학회, 2020 한국인 영양소 섭취기준</caption></table></div>
<p>권장섭취량은 대부분의 사람이 결핍 없이 지낼 수 있는 양이에요. 근육이 줄어드는 노인, 근력 운동을 열심히 하는 사람, 수술이나 큰 병에서 회복 중인 사람은 이보다 더 필요할 수 있어요.</p>

<h2>음식별 단백질 양</h2>
<div class="tbl"><table>
<thead><tr><th>식품</th><th>분량</th><th>단백질 (약)</th></tr></thead>
<tbody>
<tr><td>닭가슴살 (익힌 것)</td><td>100g</td><td class="num">23~30g</td></tr>
<tr><td>소고기·돼지고기 살코기</td><td>100g</td><td class="num">20~26g</td></tr>
<tr><td>생선 (고등어, 연어 등)</td><td>100g</td><td class="num">20g 안팎</td></tr>
<tr><td>두부</td><td>⅓모 (약 100g)</td><td class="num">8~9g</td></tr>
<tr><td>그릭요거트</td><td>100g</td><td class="num">9~10g</td></tr>
<tr><td>달걀</td><td>1개</td><td class="num">6g</td></tr>
<tr><td>우유</td><td>1컵 (200mL)</td><td class="num">6g</td></tr>
<tr><td>콩 (익힌 것)</td><td>½컵</td><td class="num">7~15g</td></tr>
<tr><td>밥</td><td>1공기 (210g)</td><td class="num">5~6g</td></tr>
</tbody>
<caption>식품의약품안전처 식품영양성분 데이터베이스 등을 참고한 대략적인 값</caption></table></div>
<p>예를 들어 아침에 달걀 2개와 우유 한 잔, 점심에 생선 한 토막, 저녁에 두부 반찬과 고기 조금, 그리고 밥 세 공기를 먹으면 하루 70g 안팎이 돼요.</p>

<h2>동물성과 식물성</h2>
<ul>
<li><strong>동물성 단백질</strong>(고기, 생선, 달걀, 우유)은 필수아미노산이 고루 들어 있고 소화 흡수가 잘 돼요.</li>
<li><strong>식물성 단백질</strong>(콩, 두부, 곡류, 견과류)은 일부 필수아미노산이 상대적으로 적지만, <strong>콩과 곡류를 함께</strong> 먹으면 서로 부족한 부분을 채워요. 콩밥이 좋은 예예요.</li>
<li>식물성 단백질에는 식이섬유가 함께 있고 포화지방이 적어요. 붉은 고기와 가공육을 줄이고 생선, 콩, 닭고기로 바꾸면 심혈관 건강에도 좋아요.</li>
</ul>

<h2>나눠 먹어야 하는 이유</h2>
<p>근육은 단백질을 먹을 때마다 합성이 자극되는데, 한 번에 자극되는 정도에는 한계가 있어요. 그래서 하루 총량이 같아도 <strong>세 끼에 고르게</strong> 나눠 먹을 때 근육 합성에 유리하다는 연구가 많아요.</p>
<p>한국인의 식사는 아침이 가볍고 저녁에 단백질이 몰리는 경우가 많아요. <strong>아침에 달걀, 두부, 우유, 요거트</strong> 중 하나를 더하는 것만으로도 균형이 좋아져요.</p>
<div class="box note"><span class="h">운동 후에는?</span>
<p>근력 운동 후 몇 시간 안에 단백질을 먹으면 근육 회복에 도움이 돼요. 하지만 운동 직후 몇 분 안에 꼭 먹어야 하는 건 아니에요. 운동 전후 식사에 단백질을 챙기는 정도면 충분해요.</p></div>

<h2>노인에게 특히 중요하다</h2>
<p>나이가 들면 같은 양의 단백질을 먹어도 근육이 덜 만들어지고(동화 저항성), 입맛이 줄고 씹기가 어려워 섭취량도 줄어요. 이 두 가지가 겹치면 근육이 빠르게 줄어 <strong>근감소증</strong>과 낙상 위험이 커져요.</p>
<ul>
<li>끼니마다 부드러운 단백질 반찬 하나: 달걀찜, 두부조림, 생선조림, 순두부</li>
<li>우유나 두유, 요거트를 간식으로</li>
<li>씹기 어렵다면 다지거나 갈아서</li>
<li><strong>근력 운동과 함께</strong> 해야 효과가 커요</li>
</ul>

<h2>너무 많이 먹으면</h2>
<ul>
<li>건강한 콩팥을 가진 사람은 체중 1kg당 1.5~2g 정도까지는 대체로 문제없이 견딘다고 알려져 있어요.</li>
<li><strong>만성 콩팥병</strong>이 있다면 단백질이 콩팥의 부담을 키울 수 있어서, 의사와 영양사가 정한 양을 따라요.</li>
<li>단백질 식품으로 <strong>가공육과 붉은 고기</strong>를 많이 먹으면 대장암, 심혈관 질환 위험이 커질 수 있어요.</li>
<li>단백질만 많이 먹고 채소와 곡물이 부족하면 식이섬유가 모자라 변비가 생기기 쉬워요.</li>
</ul>

<h2>단백질 보충제는 필요할까</h2>
<p>대부분의 사람은 식사로 충분히 채울 수 있어요. 보충제가 도움이 될 수 있는 경우는 이래요.</p>
<ul>
<li>입맛이 없거나 씹기가 어려워 식사량이 크게 줄어든 노인</li>
<li>수술이나 큰 병에서 회복 중인 사람 (의료진과 상의)</li>
<li>식사만으로 목표량을 채우기 어려운 운동선수</li>
</ul>
<p>고를 때는 단백질 함량과 함께 <strong>당류와 첨가물</strong>을 확인해요. 일부 제품은 당이 많아요. 보충제는 식사를 대신하는 것이 아니라 보완하는 것이에요.</p>

<div class="box"><span class="h">단백질 챙기는 하루</span>
<ol>
<li>아침: 달걀 1~2개나 두부, 우유 한 잔</li>
<li>점심: 생선이나 고기 반찬 한 가지</li>
<li>저녁: 콩, 두부, 닭고기 중 한 가지</li>
<li>간식: 요거트, 두유, 견과류</li>
<li>근력 운동 주 2회 이상</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>한 번에 30g 이상은 흡수가 안 된다는데요?</dt>
<dd>단백질은 많이 먹어도 대부분 소화 흡수돼요. 다만 한 끼에 많이 먹는 것보다 여러 끼에 나눌 때 근육 합성에 더 유리하다는 연구가 많아서, 나눠 먹기를 권하는 거예요.</dd>
<dt>채식을 하면 단백질이 부족한가요?</dt>
<dd>콩, 두부, 템페, 렌틸콩, 견과류, 통곡물을 다양하게 먹으면 채식으로도 충분히 채울 수 있어요. 비건이라면 콩류를 끼니마다 넣는 게 좋아요.</dd>
<dt>단백질을 많이 먹으면 살이 빠지나요?</dt>
<dd>단백질은 포만감이 오래가고 감량 중 근육 손실을 줄여 체중 관리에 도움이 돼요. 하지만 전체 열량이 많으면 살이 빠지지 않아요.</dd>
</dl>

<p class="lead">항생제는 20세기 의학의 가장 큰 발견 중 하나예요. 그런데 너무 흔하게 쓰면서, 항생제가 듣지 않는 세균이 점점 늘고 있어요. 이 문제는 먼 미래가 아니라 이미 병원에서 벌어지고 있는 일이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>항생제는 <strong>세균</strong>에만 효과가 있어요. 감기와 독감 같은 <strong>바이러스</strong> 감염에는 듣지 않아요.</li>
<li>불필요한 항생제는 내성균을 키우고, 설사 같은 부작용만 남겨요.</li>
<li>처방받은 항생제는 <strong>정해진 용량과 기간</strong>대로 먹고, 남은 약을 나중에 먹거나 나눠주지 않아요.</li>
<li>항생제 내성은 전 세계에서 해마다 <strong>100만 명 넘는</strong> 사망의 직접 원인으로 추정돼요.</li>
</ul></div>

<h2>항생제가 듣는 감염, 듣지 않는 감염</h2>
<div class="tbl"><table>
<thead><tr><th>항생제가 필요 없는 경우 (대부분 바이러스)</th><th>항생제가 필요할 수 있는 경우 (세균)</th></tr></thead>
<tbody>
<tr><td>감기, 독감, 코로나19</td><td>세균성 폐렴</td></tr>
<tr><td>대부분의 목감기(인후염)</td><td>연쇄상구균 인두염 (검사로 확인)</td></tr>
<tr><td>대부분의 급성 기관지염</td><td>요로감염, 방광염</td></tr>
<tr><td>대부분의 급성 장염 설사</td><td>세균성 부비동염 (10일 이상 지속되거나 악화될 때 등)</td></tr>
<tr><td>콧물이 누렇게 변한 것만으로는 세균 감염이 아님</td><td>봉와직염 같은 피부 감염</td></tr>
</tbody>
<caption>질병관리청·대한감염학회 항생제 적정사용 안내를 바탕으로 정리. 판단은 진찰과 검사로 의사가 해요.</caption></table></div>
<p>감기에 항생제를 먹으면 빨리 낫는 것 같지만, 실제로는 감기가 저절로 낫는 시기와 겹쳤을 뿐이에요. 연구에서 감기에 항생제를 먹어도 회복 기간은 줄지 않았고, 설사와 발진 같은 부작용만 늘었어요.</p>

<h2>내성은 어떻게 생길까</h2>
<p>세균은 아주 빠르게 번식하고, 번식하는 동안 우연히 항생제를 견디는 돌연변이가 생겨요. 항생제를 쓰면 약한 세균은 죽고 <strong>견디는 세균만 살아남아</strong> 다시 번식해요. 항생제를 자주, 불필요하게, 불충분하게 쓸수록 이 선택 과정이 반복돼 내성균이 늘어나요.</p>
<p>내성균은 사람에게서 사람으로, 병원과 요양시설, 가축과 환경을 통해 퍼져요. 그래서 항생제 내성은 한 사람의 문제가 아니라 공동체의 문제예요.</p>
<h3>이미 등장한 '슈퍼박테리아'</h3>
<ul>
<li><strong>MRSA</strong>: 메티실린 내성 황색포도상구균</li>
<li><strong>VRE</strong>: 반코마이신 내성 장알균</li>
<li><strong>CRE</strong>: 카바페넴 내성 장내세균 (최후의 항생제로 불리는 약에도 내성)</li>
</ul>
<p>이런 균에 감염되면 쓸 수 있는 약이 적고, 치료 기간이 길어지며, 사망 위험이 높아져요.</p>

<h2>얼마나 심각할까</h2>
<p>국제 연구(2022, Lancet)는 2019년 한 해 전 세계에서 <strong>약 127만 명</strong>이 항생제 내성균 감염으로 직접 사망했다고 추정했어요. 세계보건기구는 항생제 내성을 인류 건강을 위협하는 10대 요인 중 하나로 꼽아요.</p>
<p>한국은 OECD 국가 중 항생제 사용량이 많은 편에 속해요. 특히 감기 같은 급성 상기도 감염에 항생제가 처방되는 비율이 높다는 지적이 있어 정부가 항생제 적정 사용 정책을 펴고 있어요.</p>

<h2>처방받은 항생제 올바르게 먹기</h2>
<ul>
<li><strong>정해진 용량과 시간 간격</strong>을 지켜요. 하루 2번이면 12시간, 3번이면 8시간 간격이 기본이에요.</li>
<li><strong>의사가 정한 기간</strong>대로 먹어요. 증상이 좋아졌다고 스스로 끊지 않아요. 최근에는 필요한 만큼만 짧게 처방하는 추세라서, 처방 기간 자체가 이미 계산된 기간이에요.</li>
<li><strong>남은 항생제를 보관했다가</strong> 다음에 스스로 먹지 않아요. 다른 병에는 맞지 않는 약이고, 불충분한 양은 내성만 키워요.</li>
<li><strong>다른 사람과 나눠 먹지 않아요.</strong></li>
<li>의사에게 <strong>항생제를 요구하지 않아요.</strong> 필요하지 않다고 설명하면 이유를 물어보세요.</li>
<li>우유, 철분제, 칼슘제, 제산제와 함께 먹으면 흡수가 떨어지는 항생제가 있어요. 복용 방법을 약사에게 확인해요.</li>
</ul>

<h2>항생제의 부작용</h2>
<ul>
<li><strong>설사:</strong> 장내 좋은 세균까지 줄어들어 생겨요. 대부분 가볍지만, 심한 설사와 복통, 발열이 있다면 <strong>클로스트리디오이데스 디피실 감염</strong>일 수 있어 진료를 받아요.</li>
<li><strong>발진, 두드러기:</strong> 알레르기일 수 있어요. 숨이 차거나 얼굴·목이 부으면 응급이에요.</li>
<li><strong>질 칸디다증:</strong> 여성에게서 흔해요.</li>
<li><strong>약물 상호작용:</strong> 와파린, 일부 심장약과 상호작용이 있을 수 있어요.</li>
</ul>

<h2>페니실린 알레르기 표시, 정말일까</h2>
<p>'페니실린 알레르기'로 기록된 사람 중 실제로 검사해 보면 <strong>대부분은 알레르기가 아니라는</strong> 연구가 많아요. 어릴 때 항생제를 먹다 생긴 발진이 사실은 감염 때문이었거나, 시간이 지나 알레르기가 사라진 경우예요.</p>
<p>문제는 이 표시 때문에 더 효과가 좋고 안전한 페니실린 계열 대신 <strong>더 광범위한 항생제</strong>를 쓰게 되어 내성균과 부작용 위험이 커진다는 점이에요. 알레르기 기록이 있지만 구체적인 기억이 없다면 알레르기 전문 진료에서 확인해 볼 수 있어요.</p>

<h2>항생제가 필요 없는 감기, 이렇게 관리해요</h2>
<div class="box note"><span class="h">감기 대처법</span>
<ul>
<li>충분히 쉬고 물을 많이 마셔요.</li>
<li>열과 통증에는 해열진통제를, 코막힘에는 식염수 세척을 써볼 수 있어요.</li>
<li>보통 7~10일이면 좋아져요. 기침은 2~3주 갈 수도 있어요.</li>
<li><strong>이럴 때는 다시 진료:</strong> 10일 넘게 좋아지지 않을 때, 좋아지다가 다시 열이 날 때, 숨이 찰 때, 고열이 3일 넘게 이어질 때</li>
</ul></div>

<h2>감염 자체를 줄이는 것이 최선</h2>
<ul>
<li><strong>손 씻기:</strong> 가장 기본적인 감염 예방법</li>
<li><strong>예방접종:</strong> 독감, 폐렴구균 백신은 세균성 합병증과 항생제 사용을 줄여요.</li>
<li><strong>음식 위생:</strong> 식중독 예방</li>
<li><strong>기침 예절</strong>과 아플 때 쉬기</li>
</ul>

<div class="box"><span class="h">항생제 사용 체크리스트</span>
<ol>
<li>감기 증상에 항생제를 요구하지 않기</li>
<li>처방받은 항생제는 용량과 간격, 기간 지키기</li>
<li>남은 항생제는 폐의약품 수거함에 버리기</li>
<li>다른 사람에게 항생제 나눠주지 않기</li>
<li>과거 항생제 알레르기 반응을 정확히 기록해 두기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>누런 콧물이나 가래가 나오면 항생제가 필요한가요?</dt>
<dd>누런 콧물과 가래는 면역세포가 싸우는 흔적이라 바이러스 감염에서도 흔해요. 색깔만으로는 세균 감염을 판단할 수 없어요.</dd>
<dt>항생제를 먹을 때 유산균을 같이 먹으면 좋나요?</dt>
<dd>일부 연구에서 항생제 관련 설사를 줄이는 효과가 보고됐어요. 다만 균주마다 효과가 다르고, 면역이 크게 떨어진 사람은 주의가 필요해요. 항생제와는 몇 시간 간격을 두고 먹어요.</dd>
<dt>내 몸에 내성균이 생기는 건가요?</dt>
<dd>사람의 몸이 항생제에 내성을 갖는 게 아니라, 몸에 사는 <strong>세균</strong>이 내성을 갖게 되는 거예요. 그리고 그 세균은 다른 사람에게도 옮을 수 있어요.</dd>
</dl>

  data-tags="새집증후군,실내공기,라돈,환기,포름알데히드">
<p class="lead">실내 공기는 바깥 공기보다 깨끗할 거라고 생각하기 쉬워요. 하지만 창문을 닫고 지내는 동안 건축 자재, 가구, 요리, 생활용품에서 나온 물질이 차곡차곡 쌓여요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>새 집과 새 가구에서는 <strong>포름알데히드와 휘발성 유기화합물</strong>이 나와 눈·코·목 자극, 두통을 일으켜요.</li>
<li><strong>라돈</strong>은 흡연 다음가는 폐암 원인이에요. 저층과 지하는 측정해 보는 게 좋아요.</li>
<li><strong>요리할 때</strong>는 레인지 후드를 켜고 창문을 열어요. 굽고 튀길 때 미세먼지가 크게 늘어요.</li>
<li>공기청정기는 환기를 <strong>대신하지 못해요.</strong> 하루 몇 번씩 창문을 열어 공기를 바꿔요.</li>
</ul></div>

<h2>새집증후군이란</h2>
<p>새로 짓거나 리모델링한 집, 새 가구를 들인 공간에서 머리가 아프고, 눈이 따갑고, 목이 칼칼하고, 피부가 가려운 증상이 생기는 것을 새집증후군이라고 해요. 주된 원인은 건축 자재와 가구, 접착제, 페인트, 벽지에서 나오는 화학물질이에요.</p>
<div class="tbl"><table>
<thead><tr><th>물질</th><th>주요 발생원</th><th>영향</th></tr></thead>
<tbody>
<tr><td>포름알데히드</td><td>합판·MDF 가구, 붙박이장, 접착제, 벽지</td><td>눈·코·목 자극, 기침, 피부염. 국제암연구소 1군 발암물질</td></tr>
<tr><td>휘발성 유기화합물 (톨루엔, 벤젠, 자일렌 등)</td><td>페인트, 접착제, 바닥재, 방향제, 세정제</td><td>두통, 어지러움, 메스꺼움, 호흡기 자극</td></tr>
</tbody></table></div>
<p>이 물질들은 입주 초기에 가장 많이 나오고 시간이 지나며 줄어들지만, 몇 달에서 몇 년까지 이어질 수 있어요. 온도와 습도가 높을수록 더 많이 방출돼요. 아이, 임신부, 천식이나 아토피가 있는 사람은 더 민감해요.</p>

<h2>새 집에 들어가기 전: 베이크아웃</h2>
<p>베이크아웃은 실내 온도를 높여 건축 자재 속 유해물질을 한꺼번에 방출시킨 뒤 환기로 내보내는 방법이에요.</p>
<ol>
<li>창문과 문을 모두 닫고, 가구의 문과 서랍을 열어둬요.</li>
<li>난방을 높여 실내 온도를 <strong>35~40°C 정도</strong>로 올리고 몇 시간(약 6~10시간) 유지해요.</li>
<li>창문을 모두 열어 <strong>1~2시간 이상</strong> 충분히 환기해요.</li>
<li>이 과정을 여러 번 반복해요.</li>
</ol>
<div class="box warn"><span class="h">베이크아웃할 때 주의</span>
<ul>
<li>진행하는 동안 <strong>사람과 반려동물은 집 밖에</strong> 있어요.</li>
<li>난방기 주변에 불에 타기 쉬운 물건을 두지 않아요.</li>
<li>전기 난방기를 무리하게 여러 대 쓰지 않아요.</li>
<li>입주 후에도 몇 달 동안은 자주 환기해요.</li>
</ul></div>
<p>신축 공동주택은 입주 전 실내공기질을 측정해 공개하도록 되어 있어요. 관리사무소나 지자체에서 측정 결과를 확인할 수 있어요.</p>

<h2>가구를 고를 때</h2>
<ul>
<li>국내 목질 판상 제품은 포름알데히드 방출량에 따라 등급을 매겨요. <strong>SE0, E0</strong> 등급이 방출량이 적은 편이에요.</li>
<li>새 가구는 포장을 뜯어 베란다나 환기가 잘 되는 곳에 며칠 두었다가 들여요.</li>
<li>친환경 인증 마크가 있는 페인트, 벽지, 바닥재를 고르면 도움이 돼요.</li>
</ul>

<h2>라돈: 보이지 않는 발암물질</h2>
<p>라돈은 흙과 바위 속 우라늄이 붕괴하면서 생기는 <strong>자연 방사성 기체</strong>예요. 색도 냄새도 없어서 측정하지 않으면 알 수 없어요. 세계보건기구는 라돈을 <strong>흡연 다음가는 폐암 원인</strong>으로 꼽고, 흡연자가 라돈에 노출되면 위험이 더 커진다고 알려요.</p>
<ul>
<li>땅과 가까운 <strong>지하, 1층, 단독주택</strong>에서 농도가 높기 쉬워요.</li>
<li>바닥과 벽의 균열, 배관 틈으로 들어와요.</li>
<li>화강암 지대에서 높을 수 있어요.</li>
<li>국내 공동주택의 실내 라돈 권고 기준은 <strong>148Bq/m³</strong>이에요.</li>
</ul>
<div class="box note"><span class="h">라돈 줄이는 법</span>
<ul>
<li>일부 지자체와 기관에서 <strong>라돈 측정기를 무료로 대여</strong>해요. 환경부 생활환경정보센터나 지자체에 문의해요.</li>
<li>하루 여러 번 <strong>환기</strong>하면 농도가 크게 떨어져요.</li>
<li>바닥과 벽의 균열, 배관 주변 틈을 메워요.</li>
<li>농도가 높다면 전문 저감 시공을 고려해요.</li>
</ul></div>

<h2>요리할 때 생기는 미세먼지</h2>
<p>고기를 굽거나 생선을 튀기거나 볶음 요리를 할 때, 실내 미세먼지 농도가 바깥의 '매우 나쁨' 수준보다 훨씬 높아질 수 있어요. 가스레인지를 쓰면 이산화질소 같은 연소 물질도 함께 나와요.</p>
<ul>
<li>요리 시작 전부터 <strong>레인지 후드</strong>를 켜고, 요리가 끝난 뒤에도 <strong>15~30분</strong> 더 켜둬요.</li>
<li>가능하면 <strong>창문을 함께 열어</strong> 공기가 빠져나갈 길을 만들어요.</li>
<li>뒤쪽 화구를 쓰면 후드가 연기를 더 잘 빨아들여요.</li>
<li>후드 필터를 정기적으로 청소해요.</li>
</ul>

<h2>생활용품에서 나오는 것들</h2>
<ul>
<li><strong>방향제, 디퓨저, 향초</strong>: 휘발성 유기화합물과 미세먼지를 내보내요. 향으로 냄새를 덮기보다 환기로 원인을 없애요.</li>
<li><strong>스프레이형 세정제·살균제</strong>: 미세한 방울을 들이마실 수 있어요. 천에 뿌려 닦고, 쓰는 동안 환기해요.</li>
<li><strong>담배</strong>: 실내 흡연은 가장 강력한 실내 오염원이에요. 베란다에서 피워도 집 안으로 들어와요.</li>
<li><strong>세탁소 비닐</strong>: 드라이클리닝 옷은 비닐을 벗겨 바람이 통하는 곳에 두었다가 옷장에 넣어요.</li>
</ul>

<h2>환기, 어떻게 할까</h2>
<div class="tbl"><table>
<thead><tr><th>상황</th><th>환기 방법</th></tr></thead>
<tbody>
<tr><td>평소</td><td>하루 2~3번, 마주 보는 창문을 열어 한 번에 10~30분</td></tr>
<tr><td>새 집, 새 가구</td><td>입주 후 몇 달 동안은 더 자주, 더 길게</td></tr>
<tr><td>요리·청소 후</td><td>바로 환기</td></tr>
<tr><td>미세먼지 나쁜 날</td><td>짧게(몇 분씩) 자주 환기하고 공기청정기를 함께. 요리할 때는 미세먼지가 나빠도 환기가 필요해요</td></tr>
<tr><td>겨울</td><td>짧고 강하게 맞바람 환기하면 벽과 바닥이 덜 식어요</td></tr>
</tbody></table></div>
<p>사람이 많은 방을 오래 닫아두면 이산화탄소 농도가 올라가 졸리고 머리가 무거워져요. 이 역시 환기로만 해결돼요.</p>

<h2>공기청정기와 식물</h2>
<ul>
<li><strong>공기청정기</strong>는 미세먼지 같은 입자를 잘 걸러요. 하지만 포름알데히드 같은 기체는 일부 필터만 제한적으로 줄이고, 이산화탄소는 줄이지 못해요. <strong>환기를 대신할 수 없어요.</strong> 필터는 제때 교체해요.</li>
<li><strong>공기정화 식물</strong>은 실험실의 밀폐 공간에서는 효과가 있었지만, 실제 집에서 의미 있는 효과를 내려면 방 하나에 매우 많은 화분이 필요하다는 분석이 있어요. 식물은 마음의 안정에 좋지만, 공기 정화는 환기에 맡겨요.</li>
</ul>

<div class="box"><span class="h">실내 공기 점검표</span>
<ol>
<li>하루 2~3번 창문 열어 환기하기</li>
<li>요리할 때 후드 켜고 요리 후 15분 더 켜두기</li>
<li>새 가구는 포장 벗겨 며칠 바람 쐬고 들이기</li>
<li>방향제·향초 줄이기</li>
<li>저층·단독주택이라면 라돈 측정해 보기</li>
<li>공기청정기 필터 교체 날짜 확인하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>숯이나 양파를 두면 새집 냄새가 빠지나요?</dt>
<dd>숯은 일부 냄새 물질을 흡착하지만 양이 제한적이에요. 양파는 효과가 확인되지 않았어요. 가장 확실한 방법은 베이크아웃과 꾸준한 환기예요.</dd>
<dt>새집증후군 증상은 얼마나 가나요?</dt>
<dd>보통 입주 후 몇 달이 가장 심하고 시간이 지나며 줄어요. 증상이 오래가거나 아이의 아토피와 천식이 심해진다면 환기를 늘리고 진료를 받아요.</dd>
<dt>라돈 측정 결과가 기준을 조금 넘었어요.</dt>
<dd>라돈 농도는 계절과 날씨에 따라 변해요. 여러 번 측정해 평균을 보고, 먼저 환기를 늘려 다시 측정해 보세요. 계속 높다면 저감 시공을 고려해요.</dd>
</dl>

<h2>참고 자료</h2>

<template data-id="dementia" data-cat="dis" data-date="2026.09.29"
  data-title="치매와 경도인지장애: 건망증과 다른 신호, 되돌릴 수 있는 원인, 예방할 수 있는 위험 요인"
  data-thumb="45%|예방 가능 위험"
  data-summary="치매는 한 가지 병이 아니라 기억과 판단이 떨어져 일상생활이 어려워진 상태를 말해요. 건망증과 치매의 차이, 초기 신호, 검사로 찾아야 하는 되돌릴 수 있는 원인, 치료제, 바꿀 수 있는 14가지 위험 요인, 치매안심센터 이용법을 정리했어요."
  data-tags="치매,경도인지장애,알츠하이머,기억력,치매안심센터">
<p class="lead">나이가 들면서 이름이 잘 떠오르지 않는 건 흔한 일이에요. 하지만 방금 한 이야기를 잊고 같은 질문을 반복하거나, 익숙한 길에서 헤맨다면 한 번쯤 확인해 볼 때예요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>국내 65세 이상 <strong>약 10명 중 1명</strong>이 치매로 추정돼요. 가장 흔한 원인은 <strong>알츠하이머병</strong>이에요.</li>
<li>힌트를 주면 떠오르면 건망증, <strong>경험 자체를 잊으면</strong> 치매를 의심해요.</li>
<li>갑상선 기능 저하, 비타민 B12 결핍, 우울증, 약물처럼 <strong>되돌릴 수 있는 원인</strong>도 있어요.</li>
<li>2024년 국제 보고서는 치매의 <strong>약 45%</strong>가 바꿀 수 있는 위험 요인과 관련 있다고 분석했어요.</li>
</ul></div>

<h2>치매는 어떤 상태일까</h2>
<p>치매는 병명이라기보다 <strong>기억력, 언어, 판단력, 계산 능력 같은 인지 기능이 떨어져 혼자서 일상생활을 하기 어려워진 상태</strong>를 말해요. 여러 원인이 있어요.</p>
<div class="tbl"><table>
<thead><tr><th>원인</th><th>특징</th></tr></thead>
<tbody>
<tr><td>알츠하이머병</td><td>가장 흔함. 뇌에 아밀로이드와 타우 단백질이 쌓이며 서서히 진행. 최근 기억부터 흐려짐</td></tr>
<tr><td>혈관성 치매</td><td>뇌졸중이나 작은 뇌혈관 손상이 쌓여 생김. 계단식으로 나빠지기도 함</td></tr>
<tr><td>루이소체 치매</td><td>인지 기능이 날마다 크게 오르내리고, 생생한 환시, 파킨슨 증상이 함께 나타남</td></tr>
<tr><td>전두측두엽 치매</td><td>비교적 젊은 나이에 시작. 기억보다 성격 변화, 충동적 행동, 언어 문제가 먼저 옴</td></tr>
</tbody></table></div>

<h2>건망증과 치매는 어떻게 다를까</h2>
<div class="tbl"><table>
<thead><tr><th>건망증</th><th>치매를 의심할 신호</th></tr></thead>
<tbody>
<tr><td>약속 시간을 깜빡했지만 나중에 떠오름</td><td>약속을 했다는 사실 자체를 기억하지 못함</td></tr>
<tr><td>힌트를 주면 기억해냄</td><td>힌트를 줘도 떠오르지 않음</td></tr>
<tr><td>잊은 것을 스스로 알고 메모로 보완</td><td>잊었다는 것을 잘 모르고, 지적하면 부인하거나 화를 냄</td></tr>
<tr><td>일상생활에 지장이 없음</td><td>돈 관리, 요리, 약 챙기기, 길 찾기 같은 일상이 어려워짐</td></tr>
</tbody></table></div>
<h3>초기에 나타날 수 있는 변화</h3>
<ul>
<li>방금 한 이야기나 질문을 되풀이해요.</li>
<li>물건을 둔 곳을 자주 잊고, 누가 가져갔다고 의심해요.</li>
<li>익숙한 곳에서 길을 잃어요.</li>
<li>계산, 공과금 납부, 돈 관리에서 실수가 잦아져요.</li>
<li>적절한 단어가 떠오르지 않아 '그거, 저거'가 늘어요.</li>
<li>하던 요리의 순서를 헷갈리거나 가전제품 사용을 어려워해요.</li>
<li>의욕이 없어지고 성격이 변하거나 쉽게 화를 내요.</li>
</ul>

<h2>경도인지장애: 치매 이전 단계</h2>
<p>기억력이나 다른 인지 기능이 같은 나이보다 떨어졌지만 <strong>일상생활은 스스로 할 수 있는</strong> 상태를 경도인지장애라고 해요. 경도인지장애가 있는 사람 중 해마다 일부(흔히 10~15% 정도로 알려져 있어요)가 치매로 진행하지만, 그대로 유지되거나 오히려 좋아지는 사람도 있어요. 이 시기에 원인을 확인하고 위험 요인을 관리하는 게 중요해요.</p>

<h2>되돌릴 수 있는 원인부터 확인</h2>
<p>기억력 저하가 모두 퇴행성 치매는 아니에요. 치료하면 좋아지는 원인이 있어서 검사가 꼭 필요해요.</p>
<ul>
<li><strong>갑상선 기능 저하증</strong></li>
<li><strong>비타민 B12 결핍</strong>, 엽산 결핍</li>
<li><strong>우울증</strong>: 노인 우울증은 기억력 저하로 나타나 치매처럼 보이기도 해요.</li>
<li><strong>약물</strong>: 일부 수면제, 신경안정제, 항콜린 작용이 있는 약(일부 방광약, 알레르기약 등)</li>
<li><strong>정상압 수두증</strong>: 걸음이 불안정해지고 소변을 참기 어려워지며 기억력이 떨어져요. 수술로 좋아질 수 있어요.</li>
<li><strong>만성 경막하 출혈</strong>: 넘어진 뒤 몇 주에 걸쳐 서서히 생긴 뇌 표면의 출혈</li>
<li>수면무호흡, 청력 저하, 과음</li>
</ul>

<h2>검사와 치매안심센터</h2>
<ul>
<li><strong>치매안심센터</strong>(보건소): 60세 이상은 무료로 인지 선별검사를 받을 수 있어요. 필요하면 진단검사와 감별검사 비용 지원도 연계해요.</li>
<li><strong>국가건강검진</strong>: 66세 이상은 2년마다 인지기능 선별검사를 받을 수 있어요.</li>
<li>병원에서는 신경인지검사, 혈액검사, 뇌 MRI 등으로 원인을 확인해요.</li>
<li><strong>치매상담콜센터 1899-9988</strong>에서 24시간 상담을 받을 수 있어요.</li>
</ul>

<h2>치료</h2>
<div class="tbl"><table>
<thead><tr><th>치료</th><th>설명</th></tr></thead>
<tbody>
<tr><td>인지 기능 개선제 (도네페질, 리바스티그민, 갈란타민, 메만틴)</td><td>진행을 멈추지는 못하지만 증상을 일정 기간 유지하거나 늦추는 데 도움이 돼요</td></tr>
<tr><td>아밀로이드 항체 치료제</td><td>초기 알츠하이머병에서 뇌의 아밀로이드를 줄여 진행을 늦춰요. 국내에서도 허가됐지만 대상이 제한적이고, 뇌부종·미세출혈 같은 부작용 때문에 정기적인 MRI가 필요해요</td></tr>
<tr><td>혈관성 위험 요인 관리</td><td>혈압, 혈당, 콜레스테롤 관리로 추가 손상을 막아요</td></tr>
<tr><td>비약물 치료</td><td>인지 훈련, 운동, 사회 활동, 음악·미술 활동</td></tr>
</tbody></table></div>
<p>치매 환자의 불안, 수면 문제, 공격적인 행동도 치료와 돌봄 방법으로 줄일 수 있어요. 보호자가 혼자 감당하지 않도록 도움을 받는 게 중요해요.</p>

<h2>바꿀 수 있는 14가지 위험 요인</h2>
<p>국제 학술지 랜싯의 치매 위원회(2024)는 아래 위험 요인을 모두 없앤다면 이론적으로 치매의 약 45%를 예방하거나 늦출 수 있다고 분석했어요.</p>
<div class="tbl"><table>
<thead><tr><th>생애 시기</th><th>위험 요인</th></tr></thead>
<tbody>
<tr><td>어린 시절</td><td>낮은 교육 수준</td></tr>
<tr><td>중년</td><td>청력 저하, 높은 LDL 콜레스테롤, 우울증, 머리 외상, 신체 활동 부족, 당뇨병, 흡연, 고혈압, 비만, 과음</td></tr>
<tr><td>노년</td><td>사회적 고립, 대기오염, 치료하지 않은 시력 저하</td></tr>
</tbody>
<caption>Livingston G 외, Dementia prevention, intervention, and care: 2024 report of the Lancet standing Commission</caption></table></div>
<div class="box note"><span class="h">특히 주목할 점</span>
<ul>
<li><strong>청력 저하</strong>는 중년의 가장 큰 위험 요인 중 하나로 꼽혀요. 보청기를 쓰면 위험이 줄 수 있다는 연구가 있어요.</li>
<li><strong>시력 저하</strong>도 백내장 수술 등으로 치료하면 도움이 될 수 있어요.</li>
<li>혈압 관리는 중년부터 꾸준히 하는 게 중요해요.</li>
</ul></div>

<h2>뇌 건강을 위한 생활</h2>
<div class="box"><span class="h">오늘부터 할 수 있는 것</span>
<ol>
<li>일주일 150분 이상 걷기와 근력 운동</li>
<li>혈압, 혈당, 콜레스테롤 관리</li>
<li>금연, 절주</li>
<li>잘 안 들리면 청력 검사와 보청기 상담</li>
<li>사람들과 자주 만나고 대화하기</li>
<li>새로운 것 배우기 (악기, 외국어, 취미)</li>
<li>충분히 자고, 코골이·수면무호흡 확인하기</li>
<li>우울감이 이어지면 치료 받기</li>
</ol></div>

<h2>보호자를 위한 정보</h2>
<ul>
<li><strong>노인장기요양보험</strong>의 치매 관련 등급을 받으면 방문요양, 주야간보호 같은 서비스를 이용할 수 있어요.</li>
<li><strong>실종 예방</strong>: 경찰에 지문과 사진을 미리 등록하는 '지문 등 사전등록', 배회감지기, 인식표를 활용해요.</li>
<li>치매안심센터에서 가족 교실, 자조 모임, 쉼터 프로그램을 운영해요.</li>
<li>보호자의 우울과 번아웃도 흔해요. 돌보는 사람도 도움을 받아야 오래 돌볼 수 있어요.</li>
</ul>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>치매는 유전되나요?</dt>
<dd>대부분의 치매는 여러 요인이 함께 작용해요. 부모가 치매였다면 위험이 조금 높아질 수 있지만 반드시 걸리는 건 아니에요. 65세 이전에 발병하는 일부 가족성 알츠하이머병은 유전의 영향이 커요.</dd>
<dt>화투나 퍼즐이 치매 예방에 도움이 되나요?</dt>
<dd>머리를 쓰는 활동은 도움이 될 수 있지만, 한 가지 활동만으로 예방된다는 근거는 약해요. 운동, 사회 활동, 혈관 건강 관리를 함께하는 게 더 효과적이에요.</dd>
<dt>은행잎 추출물 같은 영양제가 효과가 있나요?</dt>
<dd>대규모 연구에서 은행잎 추출물이 치매를 예방하지 못했어요. 치매 예방을 내세운 건강식품보다 위험 요인 관리가 확실한 방법이에요.</dd>
</dl>

<h2>참고 자료</h2>
<ul class="refs">
<li>보건복지부·중앙치매센터, 대한민국 치매 현황</li>

<li>중앙치매센터, 치매안심센터 및 치매상담콜센터 안내</li>
</ul>
</template>

<template data-id="fiber" data-cat="nut" data-date="2026.09.29"
  data-title="식이섬유 총정리: 장, 혈당, 콜레스테롤까지, 하루 25g을 채우는 법"
  data-thumb="25~30g|하루 목표"
  data-summary="식이섬유는 소화되지 않는데도 건강에 많은 일을 해요. 수용성과 불용성의 차이, 변비·혈당·콜레스테롤·장내 세균에 미치는 영향, 대규모 분석이 보여준 질병 위험 감소, 식품별 함량, 가스와 더부룩함 없이 늘리는 방법을 정리했어요."
  data-tags="식이섬유,변비,장건강,혈당,통곡물">
<p class="lead">식이섬유는 오랫동안 '영양가 없는 찌꺼기'로 여겨졌어요. 지금은 장내 세균의 먹이이자, 혈당과 콜레스테롤을 조절하는 중요한 영양소로 인정받고 있어요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인 충분섭취량은 남성 <strong>30g</strong>, 여성 <strong>20g</strong>이에요 (65세 이상 남성 25g).</li>
<li>하루 <strong>25~29g</strong>을 먹는 사람은 심혈관 질환, 당뇨병, 대장암, 사망 위험이 낮았다는 대규모 분석이 있어요.</li>
<li><strong>귀리·보리·콩</strong>의 수용성 섬유는 콜레스테롤과 혈당을, <strong>통곡물·채소</strong>의 불용성 섬유는 배변을 도와요.</li>
<li>한꺼번에 늘리면 가스가 차요. <strong>천천히, 물과 함께</strong> 늘려요.</li>
</ul></div>

<h2>식이섬유란</h2>
<p>식이섬유는 식물에 들어 있는 탄수화물 중 사람의 소화 효소로 분해되지 않는 부분이에요. 소장에서 흡수되지 않고 대장까지 내려가 여러 일을 해요. 물에 녹는 성질에 따라 두 가지로 나눠요.</p>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>수용성 식이섬유</th><th>불용성 식이섬유</th></tr></thead>
<tbody>
<tr><td>성질</td><td>물에 녹아 끈적한 젤이 됨</td><td>물에 녹지 않고 물을 흡수해 부피가 커짐</td></tr>
<tr><td>많은 식품</td><td>귀리, 보리, 콩, 사과, 감귤류, 해조류, 차전자피</td><td>통밀, 현미, 채소 줄기, 견과류, 과일 껍질</td></tr>
<tr><td>주요 효과</td><td>콜레스테롤 저하, 혈당 상승 완화, 장내 세균의 먹이</td><td>변의 양을 늘리고 장 통과를 빠르게 함</td></tr>
</tbody></table></div>
<p>대부분의 식물성 식품에는 두 가지가 함께 들어 있어요. 다양한 식물을 먹으면 자연히 두 가지를 모두 얻을 수 있어요.</p>

<h2>식이섬유가 하는 일</h2>
<h3>장과 배변</h3>
<p>식이섬유는 변에 수분을 붙잡아 부드럽게 하고 양을 늘려 배변을 쉽게 해요. 변비 예방과 치료의 기본이에요.</p>
<h3>장내 세균의 먹이</h3>
<p>대장에 사는 세균은 식이섬유를 발효시켜 <strong>짧은사슬지방산</strong>을 만들어요. 이 물질은 대장 세포의 에너지원이 되고, 장벽을 튼튼하게 하며, 염증을 조절하는 데 관여해요. 다양한 식이섬유를 먹을수록 장내 세균도 다양해진다는 연구가 많아요.</p>
<h3>혈당</h3>
<p>수용성 섬유는 음식이 위와 장을 지나는 속도를 늦춰 식후 혈당이 천천히 오르게 해요. 흰쌀밥 대신 잡곡밥을 먹으면 식후 혈당 변화가 완만해져요.</p>
<h3>콜레스테롤</h3>
<p>수용성 섬유는 장에서 담즙산과 결합해 몸 밖으로 내보내요. 간은 새 담즙산을 만들기 위해 혈중 콜레스테롤을 끌어다 써서 LDL이 내려가요. 귀리와 보리의 <strong>베타글루칸</strong>을 하루 3g 정도 먹으면 LDL이 조금 낮아진다는 연구가 많아요.</p>
<h3>포만감과 체중</h3>
<p>식이섬유가 많은 음식은 씹는 시간이 길고 위에 오래 머물러 포만감을 줘요.</p>

<h2>질병 위험과의 관계</h2>
<p>여러 관찰 연구와 임상시험을 종합한 분석(Lancet, 2019)에서 식이섬유를 하루 <strong>25~29g</strong> 먹는 사람은 적게 먹는 사람보다 사망, 관상동맥질환, 뇌졸중, 제2형 당뇨병, 대장암 위험이 <strong>15~30% 정도 낮았어요.</strong> 이보다 더 먹으면 이득이 더 커질 가능성도 보였어요. 세계암연구기금은 식이섬유가 많은 식품이 대장암 위험을 낮춘다고 평가해요.</p>

<h2>하루에 얼마나</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th>충분섭취량</th></tr></thead>
<tbody>
<tr><td>남성 19~64세</td><td class="num">30g</td></tr>
<tr><td>남성 65세 이상</td><td class="num">25g</td></tr>
<tr><td>여성 19세 이상</td><td class="num">20g</td></tr>
</tbody>
<caption>보건복지부·한국영양학회, 2020 한국인 영양소 섭취기준</caption></table></div>

<h2>식품별 식이섬유</h2>
<div class="tbl"><table>
<thead><tr><th>식품</th><th>분량</th><th>식이섬유 (약)</th></tr></thead>
<tbody>
<tr><td>강낭콩·검은콩 (익힌 것)</td><td>½컵</td><td class="num">6~8g</td></tr>
<tr><td>배</td><td>중간 1개</td><td class="num">5~6g</td></tr>
<tr><td>브로콜리 (익힌 것)</td><td>1컵</td><td class="num">5g</td></tr>
<tr><td>사과 (껍질째)</td><td>중간 1개</td><td class="num">4g</td></tr>
<tr><td>고구마 (껍질째)</td><td>중간 1개</td><td class="num">4g</td></tr>
<tr><td>오트밀 (귀리)</td><td>1컵 (익힌 것)</td><td class="num">4g</td></tr>
<tr><td>치아씨드</td><td>1큰술</td><td class="num">4g</td></tr>
<tr><td>아몬드</td><td>1온스 (약 23알)</td><td class="num">3.5g</td></tr>
<tr><td>현미밥·잡곡밥</td><td>1공기</td><td class="num">3~5g</td></tr>
<tr><td>흰쌀밥</td><td>1공기</td><td class="num">1g 미만</td></tr>
</tbody>
<caption>미국 농무부 식품 데이터, 식품의약품안전처 식품영양성분 데이터베이스 등을 참고한 대략적인 값</caption></table></div>
<p>흰쌀밥을 잡곡밥으로 바꾸기만 해도 하루 식이섬유가 몇 g씩 늘어요. 과일은 주스보다 <strong>껍질째</strong> 먹을 때 식이섬유가 많아요.</p>

<h2>늘리는 방법</h2>
<div class="box note"><span class="h">천천히, 물과 함께</span>
<ul>
<li>평소 적게 먹던 사람이 갑자기 많이 먹으면 가스, 복부 팽만, 복통이 생길 수 있어요. <strong>1~2주에 걸쳐</strong> 조금씩 늘려요.</li>
<li>식이섬유는 물을 흡수하므로 <strong>물을 충분히</strong> 마셔요. 물 없이 늘리면 오히려 변비가 생길 수 있어요.</li>
<li>과민성 대장 증후군이 있다면 일부 식이섬유(특히 발효가 빠른 것)가 증상을 악화시킬 수 있어요. 수용성 섬유부터 시도하는 게 좋아요.</li>
</ul></div>
<h3>하루 25g 채우기 예시</h3>
<ol>
<li>아침: 오트밀 또는 잡곡밥, 사과 1개 (약 8g)</li>
<li>점심: 잡곡밥, 나물 두 가지, 콩자반 (약 8g)</li>
<li>간식: 견과류 한 줌 (약 3g)</li>
<li>저녁: 잡곡밥, 브로콜리나 채소 볶음, 미역국 (약 7g)</li>
</ol>

<h2>식이섬유 보충제</h2>
<p>식사로 충분히 먹기 어렵다면 차전자피 같은 보충제를 쓸 수 있어요. 변비에 효과가 있고, 수용성 섬유라 콜레스테롤에도 약간 도움이 돼요.</p>
<ul>
<li><strong>물을 충분히</strong> 함께 마셔요. 물이 부족하면 목이나 장에서 뭉칠 수 있어요.</li>
<li>다른 약의 흡수를 방해할 수 있어서 약과는 <strong>2시간 정도 간격</strong>을 둬요.</li>
<li>보충제는 채소·과일·통곡물이 가진 비타민, 미네랄, 다양한 섬유를 모두 대신하지는 못해요.</li>
</ul>

<div class="box"><span class="h">식이섬유 늘리기 체크리스트</span>
<ol>
<li>흰쌀밥을 잡곡밥으로 (처음엔 잡곡 3할부터)</li>
<li>주스 대신 생과일을 껍질째</li>
<li>끼니마다 채소 반찬 두 가지</li>
<li>일주일에 몇 번 콩, 두부, 콩밥</li>
<li>간식은 과자 대신 견과류나 고구마</li>
<li>물 자주 마시기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>변비인데 식이섬유를 먹으면 더 심해졌어요.</dt>
<dd>물을 충분히 마시지 않았거나, 한꺼번에 너무 많이 늘렸을 수 있어요. 또 장 운동 자체가 느린 변비는 식이섬유만으로 잘 좋아지지 않기도 해요. 오래 이어진다면 진료를 받아요.</dd>
<dt>녹즙이나 스무디로 먹어도 되나요?</dt>
<dd>녹즙처럼 즙을 짜면 식이섬유의 대부분이 찌꺼기로 버려져요. 갈아 만든 스무디는 식이섬유가 남아 있지만, 씹어 먹는 것보다 포만감이 적고 과일을 많이 넣으면 당이 많아질 수 있어요.</dd>
<dt>현미밥은 소화가 안 돼요.</dt>
<dd>충분히 불려서 짓거나, 백미와 섞어 비율을 서서히 늘려보세요. 오래 꼭꼭 씹으면 소화가 한결 편해져요. 보리나 귀리를 섞는 것도 방법이에요.</dd>
</dl>

<h2>아세트아미노펜 안전하게 먹기</h2>
<ul>
<li>성인 <strong>하루 최대 4,000mg</strong>을 넘기지 않아요. 500mg 정제라면 하루 8정이 한계예요.</li>
<li>한 번에 먹는 양과 간격은 제품 설명을 따라요. 일반 정제는 보통 4~6시간 간격, <strong>서방형</strong>(8시간 지속형)은 8시간 간격이에요.</li>
<li><strong>술을 자주 마시는 사람</strong>(하루 3잔 이상 매일)은 간 손상 위험이 커서, 복용 전 의사·약사와 상의하고 용량을 줄여요.</li>
<li>간 질환이 있다면 의사가 정한 용량을 따라요.</li>
</ul>
<div class="box warn"><span class="h">성분 중복에 주의하세요</span>
<p>종합감기약, 코감기약, 몸살약, 일부 수면 보조제에도 <strong>아세트아미노펜이 들어 있는 경우가 많아요.</strong> 두통약과 감기약을 함께 먹으면 모르는 사이 하루 최대량을 넘길 수 있어요. 약을 두 가지 이상 먹는다면 포장의 성분표를 비교해 보세요.</p>
<p>아세트아미노펜을 한꺼번에 많이 먹었다면 처음에는 증상이 거의 없어도 하루 이틀 뒤 심한 간 손상이 생길 수 있어요. <strong>과량 복용이 의심되면 증상이 없어도 바로 응급실</strong>에 가요. 일찍 치료하면 해독제로 간 손상을 막을 수 있어요.</p></div>

<h2>소염진통제 안전하게 먹기</h2>
<ul>
<li><strong>식후</strong>나 음식과 함께 먹어 위 자극을 줄여요.</li>
<li><strong>가장 낮은 효과 용량으로, 가장 짧게</strong> 써요. 오래 계속 먹어야 한다면 의사와 상의해요.</li>
<li>두 가지 이상의 소염진통제를 함께 먹지 않아요. 효과는 늘지 않고 부작용만 커져요.</li>
<li>이런 경우에는 특히 조심해요.
  <ul>
  <li>위궤양, 위장 출혈을 앓은 적이 있어요.</li>
  <li>만성 콩팥병, 심부전이 있어요.</li>
  <li>고혈압이 잘 조절되지 않아요.</li>
  <li>심근경색, 뇌졸중을 앓았어요.</li>
  <li>항응고제, 항혈소판제, 스테로이드를 먹어요.</li>
  <li>65세 이상이에요.</li>
  <li>천식이 있고 진통제로 천식이 악화된 적이 있어요.</li>
  </ul></li>
<li>검은 변, 피를 토함, 심한 복통은 위장 출혈의 신호일 수 있어요. 바로 진료를 받아요.</li>
</ul>

<h2>임신부와 수유부</h2>
<ul>
<li>임신 중 열이나 통증에는 대개 <strong>아세트아미노펜</strong>을 우선 고려해요. 필요할 때 짧게 써요.</li>
<li>소염진통제는 <strong>임신 20주 이후</strong>에는 태아의 콩팥과 심장 혈관에 영향을 줄 수 있어서 피하도록 권고돼요. 임신 중 진통제는 산부인과 의사와 상의해요.</li>
<li>수유 중에는 아세트아미노펜과 이부프로펜이 대체로 쓸 수 있는 약으로 알려져 있어요.</li>
</ul>

<h2>어린이</h2>
<ul>
<li>어린이 해열진통제는 <strong>나이가 아니라 체중</strong>에 맞춰 용량을 정하는 게 정확해요. 제품의 체중별 용량표를 확인해요.</li>
<li>아세트아미노펜 시럽과 이부프로펜 시럽은 사용 가능한 나이가 달라요. 어린 영아는 먼저 진료를 받아요.</li>
<li>어른 약을 쪼개 먹이지 않고, 동봉된 계량컵이나 주사기로 정확히 재요.</li>
<li><strong>어린이와 청소년에게는 아스피린을 쓰지 않아요.</strong> 독감이나 수두 중 먹으면 라이 증후군이라는 심각한 질환이 생길 수 있어요.</li>
<li>두 가지 해열제를 번갈아 먹이는 '교차 복용'은 용량 실수가 생기기 쉬워요. 한 가지로 조절되지 않을 때 의사의 안내에 따라요.</li>
<li>열 자체보다 아이의 상태가 중요해요. 처지거나, 잘 먹지 않거나, 숨쉬기 힘들어하면 진료를 받아요.</li>
</ul>

<h2>복합 진통제와 카페인</h2>
<p>일부 두통약에는 진통 성분과 함께 <strong>카페인</strong>이 들어 있어 효과를 높여요. 하지만 자주 먹으면 카페인 금단 두통과 <strong>약물과용두통</strong>의 원인이 될 수 있어요. 이소프로필안티피린이 들어간 복합제는 국내에서 15세 미만에게 쓰지 않도록 되어 있어요.</p>
<div class="box note"><span class="h">진통제를 너무 자주 먹고 있다면</span>
<p>두통으로 진통제를 한 달에 10~15일 이상 먹는다면 오히려 두통을 늘리는 약물과용두통일 수 있어요. 두통 글에서 자세히 정리했어요.</p></div>

<div class="box"><span class="h">상비약 점검표</span>
<ol>
<li>집에 있는 해열진통제의 성분명 확인하기 (아세트아미노펜인지 이부프로펜인지)</li>
<li>감기약과 두통약 성분이 겹치는지 확인하기</li>
<li>어린이 시럽의 체중별 용량과 유효기간 확인하기</li>
<li>위장 질환, 콩팥병, 항응고제 복용 가족이 있다면 맞는 약 따로 표시하기</li>
<li>유효기간 지난 약은 폐의약품 수거함에</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>진통제를 자주 먹으면 내성이 생기나요?</dt>
<dd>해열진통제는 마약성 진통제처럼 내성이 생기지는 않아요. 다만 자주 먹으면 약물과용두통이 생기거나 장기 부작용이 쌓일 수 있어요.</dd>
<dt>열이 나면 바로 해열제를 먹어야 하나요?</dt>
<dd>열은 몸이 감염과 싸우는 반응이기도 해요. 열이 불편하거나 잠을 못 잘 정도일 때 먹으면 돼요. 숫자 자체보다 전체 상태를 봐요.</dd>
<dt>공복에 이부프로펜을 먹어도 되나요?</dt>
<dd>가끔 한 번은 큰 문제가 없을 수 있지만, 위 자극을 줄이려면 음식과 함께 먹는 게 좋아요. 속이 약하다면 아세트아미노펜을 고려해요.</dd>
</dl>

<p class="lead">미세먼지는 머리카락 굵기보다 훨씬 작아서 코와 기관지에서 걸러지지 않고 폐 깊숙이, 일부는 혈관까지 들어가요. 그래서 호흡기뿐 아니라 심장과 뇌 건강에도 영향을 줘요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>초미세먼지(PM2.5) <strong>36㎍/㎥ 이상은 '나쁨'</strong>, 76 이상은 '매우 나쁨'이에요.</li>
<li>나쁨 이상인 날 외출할 때는 <strong>KF80 이상</strong> 마스크를 <strong>얼굴에 밀착</strong>해서 써요.</li>
<li>미세먼지가 나빠도 <strong>짧게 자주 환기</strong>하는 게 좋아요. 특히 요리할 때는 꼭 환기해요.</li>
<li>호흡기·심장 질환자는 높은 등급 마스크가 숨쉬기를 힘들게 할 수 있어 무리하지 않아요.</li>
</ul></div>

<h2>미세먼지와 초미세먼지</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>크기</th><th>특징</th></tr></thead>
<tbody>
<tr><td>미세먼지 (PM10)</td><td>지름 10㎛ 이하</td><td>코와 기관지에 주로 걸림</td></tr>
<tr><td>초미세먼지 (PM2.5)</td><td>지름 2.5㎛ 이하 (머리카락 굵기의 약 30분의 1)</td><td>폐포 깊숙이 들어가고 일부는 혈액으로 들어감</td></tr>
</tbody></table></div>
<p>미세먼지는 자동차 배기가스, 공장과 발전소, 난방, 건설 현장, 그리고 국외에서 날아온 오염물질 등에서 생겨요. 공기 중의 가스가 화학 반응을 일으켜 새로 만들어지기도 해요. 국제암연구소는 대기오염과 미세먼지를 <strong>1군 발암물질</strong>로 분류해요.</p>

<h2>예보 등급 읽기</h2>
<div class="tbl"><table>
<thead><tr><th>등급</th><th>초미세먼지 PM2.5 (㎍/㎥)</th><th>미세먼지 PM10 (㎍/㎥)</th></tr></thead>
<tbody>
<tr><td>좋음</td><td class="num">0~15</td><td class="num">0~30</td></tr>
<tr><td>보통</td><td class="num">16~35</td><td class="num">31~80</td></tr>
<tr><td>나쁨</td><td class="num">36~75</td><td class="num">81~150</td></tr>
<tr><td>매우 나쁨</td><td class="num">76 이상</td><td class="num">151 이상</td></tr>
</tbody>
<caption>환경부 대기질 예보 등급 기준. 에어코리아 누리집과 앱에서 실시간으로 확인할 수 있어요.</caption></table></div>
<p>건강에는 <strong>초미세먼지(PM2.5)</strong>가 더 중요한 지표예요. 두 수치가 다를 때는 더 나쁜 쪽을 기준으로 행동해요.</p>

<h2>건강에 미치는 영향</h2>
<ul>
<li><strong>호흡기:</strong> 기침, 목 따가움, 천식과 만성폐쇄성폐질환 악화, 폐 기능 저하</li>
<li><strong>심혈관:</strong> 혈관에 염증을 일으키고 혈액을 끈적하게 만들어 심근경색, 뇌졸중, 부정맥 위험을 높여요.</li>
<li><strong>눈과 피부:</strong> 결막염, 가려움, 아토피 피부염 악화</li>
<li><strong>장기 영향:</strong> 폐암, 그리고 치매와의 관련성도 보고되고 있어요.</li>
</ul>
<h3>특히 조심해야 할 사람</h3>
<ul>
<li>어린이 (숨을 빨리 쉬고 폐가 자라는 중이에요)</li>
<li>노인</li>
<li>임신부</li>
<li>천식, 만성폐쇄성폐질환 같은 호흡기 질환자</li>
<li>심장 질환, 뇌혈관 질환이 있는 사람</li>
<li>야외에서 오래 일하는 사람</li>
</ul>

<h2>마스크 고르기와 착용</h2>
<div class="tbl"><table>
<thead><tr><th>등급</th><th>의미</th><th>적합한 상황</th></tr></thead>
<tbody>
<tr><td>KF80</td><td>평균 0.6㎛ 입자를 80% 이상 차단</td><td>미세먼지 나쁨 날 일반 외출</td></tr>
<tr><td>KF94</td><td>평균 0.4㎛ 입자를 94% 이상 차단</td><td>매우 나쁨, 감염병 예방</td></tr>
<tr><td>KF99</td><td>평균 0.4㎛ 입자를 99% 이상 차단</td><td>특수한 작업 환경</td></tr>
</tbody>
<caption>식품의약품안전처 보건용 마스크 기준. 포장의 '의약외품'과 KF 표시를 확인하세요.</caption></table></div>
<div class="box note"><span class="h">올바른 착용법</span>
<ol>
<li>손을 씻고 마스크의 위아래를 확인해요.</li>
<li>코와 입, 턱을 완전히 덮어요.</li>
<li><strong>코 부분의 고정심을 눌러</strong> 코 모양에 맞춰요.</li>
<li>양손으로 마스크를 감싸 숨을 내쉬어 보며 옆으로 공기가 새는지 확인해요.</li>
</ol>
<p>등급이 높아도 <strong>얼굴에 밀착되지 않으면</strong> 옆으로 공기가 들어와 효과가 크게 떨어져요. 수건이나 휴지를 덧대면 밀착이 떨어져 오히려 효과가 줄어요. 보건용 마스크는 세탁하면 성능이 떨어지니 <strong>재사용하지 않아요.</strong></p></div>
<div class="box warn"><span class="h">숨쉬기 힘들면 무리하지 마세요</span>
<p>호흡기 질환이나 심장 질환이 있는 사람, 노인, 어린이는 KF94처럼 등급이 높은 마스크를 쓰면 숨쉬기가 힘들 수 있어요. 어지럽거나 숨이 차면 바로 벗고 쉬어요. 이런 경우 KF80을 쓰거나 외출 자체를 줄이는 게 나아요. 두 돌 이전의 아기에게는 마스크를 씌우지 않아요.</p></div>

<h2>나쁨 이상인 날의 행동</h2>
<ul>
<li>외출과 <strong>격렬한 야외 운동</strong>을 줄여요. 운동은 실내에서 해요.</li>
<li>도로변, 공사장처럼 오염이 심한 곳을 피해요.</li>
<li>외출 후에는 손과 얼굴을 씻고, 옷의 먼지를 털어요.</li>
<li>차 안에서는 <strong>내기 순환</strong>으로 두고, 에어컨 필터를 정기적으로 교체해요.</li>
<li>호흡기·심장 질환자는 평소 약을 잘 챙기고 증상이 심해지면 진료를 받아요.</li>
</ul>

<h2>창문은 언제 열까</h2>
<p>미세먼지가 나쁜 날에는 창문을 계속 닫아두고 싶지만, 실내에도 요리, 청소, 생활에서 생긴 오염물질과 이산화탄소가 쌓여요. 환경부는 미세먼지가 나쁜 날에도 <strong>하루 3번, 10분 정도씩 짧게</strong> 환기하도록 권해요.</p>
<ul>
<li>대기 오염이 비교적 덜한 시간대(교통량이 적은 때)를 골라요.</li>
<li><strong>요리할 때</strong>는 미세먼지가 나빠도 후드를 켜고 환기해요. 굽고 튀길 때 실내 미세먼지가 바깥보다 훨씬 높아질 수 있어요.</li>
<li>환기 후에는 물걸레로 바닥을 닦고 공기청정기를 켜요.</li>
</ul>

<h2>공기청정기 활용</h2>
<ul>
<li>방 크기보다 <strong>여유 있는 용량</strong>의 제품을 골라요.</li>
<li>헤파(HEPA) 필터가 미세먼지를 잘 걸러요. 필터는 사용 설명서의 주기에 맞춰 교체해요.</li>
<li>벽과 가구에서 떨어진 곳, 사람이 주로 머무는 곳 가까이에 둬요.</li>
<li>문을 닫고 사용해야 효과가 좋아요.</li>
<li>공기청정기는 이산화탄소나 일부 가스 물질을 줄이지 못해요. 환기와 함께 써요.</li>
</ul>

<div class="box"><span class="h">미세먼지 대비 체크리스트</span>
<ol>
<li>에어코리아 앱으로 아침마다 초미세먼지 확인하기</li>
<li>현관에 KF80·KF94 마스크 준비하기</li>
<li>나쁨 이상이면 야외 운동을 실내 운동으로</li>
<li>하루 3번 짧게 환기, 요리할 땐 반드시 환기</li>
<li>공기청정기 필터 교체일 확인하기</li>
<li>차량 에어컨 필터 점검하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>삼겹살을 먹으면 미세먼지가 씻겨 나가나요?</dt>
<dd>근거가 없는 이야기예요. 오히려 실내에서 고기를 구우면 미세먼지가 크게 늘어요. 미세먼지를 몸에서 빼내는 특별한 음식은 확인되지 않았어요.</dd>
<dt>물을 많이 마시면 도움이 되나요?</dt>
<dd>충분한 수분은 호흡기 점막을 촉촉하게 유지하는 데 도움이 되지만, 들이마신 미세먼지를 씻어내지는 못해요. 노출 자체를 줄이는 게 핵심이에요.</dd>
<dt>면 마스크나 덴탈 마스크도 효과가 있나요?</dt>
<dd>면 마스크와 일반 덴탈 마스크는 초미세먼지를 거르는 성능이 보건용 마스크보다 훨씬 떨어져요. 미세먼지가 나쁜 날에는 KF 표시가 있는 보건용 마스크를 써요.</dd>
</dl>
