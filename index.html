<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>생활 상식첩</title>
<meta name="description" content="생활정보, 질병, 영양소, 건강상식을 한 주제씩 깊이 있게 정리하는 블로그">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
/* 레이아웃: 블로그 머리(제목·메뉴) 아래, 넓은 화면은 본문 + 오른쪽 사이드바, 좁은 화면은 한 줄로 쌓기 */
:root{
  --bg:#F2F4F1; --paper:#FFFFFF; --ink:#1D2320; --ink-2:#56605B; --ink-3:#88918C; --line:#E2E6E3;
  --accent:#1F8A5B; --accent-soft:#E5F3EB; --on-accent:#FFFFFF;
  --note-bg:#FFF8E0; --note-line:#E3BE52; --warn-bg:#FCEBEA; --warn-line:#D2544F;
  --c-life:#2F7D6B; --c-dis:#B0513A; --c-nut:#B7831A; --c-hea:#3A58A4; --on-thumb:#FFFFFF;
  --k-life:#2F7D6B; --k-dis:#B0513A; --k-nut:#9A6C0F; --k-hea:#3A58A4;
  --f-body:'Nanum Gothic','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-title:'Nanum Myeongjo','AppleMyungjo','Batang',serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101412; --paper:#171C1A; --ink:#E5EAE7; --ink-2:#A8B2AD; --ink-3:#7B8580; --line:#29312D;
  --accent:#55C291; --accent-soft:#1B2D24; --on-accent:#0C1611;
  --note-bg:#2A2514; --note-line:#8D7732; --warn-bg:#2E1B1A; --warn-line:#C2625D;
  --c-life:#276A5B; --c-dis:#94452F; --c-nut:#936914; --c-hea:#314B8C; --on-thumb:#F4F6F5;
  --k-life:#6FC3AE; --k-dis:#E8907A; --k-nut:#E0B452; --k-hea:#93AAEA;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101412; --paper:#171C1A; --ink:#E5EAE7; --ink-2:#A8B2AD; --ink-3:#7B8580; --line:#29312D;
  --accent:#55C291; --accent-soft:#1B2D24; --on-accent:#0C1611;
  --note-bg:#2A2514; --note-line:#8D7732; --warn-bg:#2E1B1A; --warn-line:#C2625D;
  --c-life:#276A5B; --c-dis:#94452F; --c-nut:#936914; --c-hea:#314B8C; --on-thumb:#F4F6F5;
  --k-life:#6FC3AE; --k-dis:#E8907A; --k-nut:#E0B452; --k-hea:#93AAEA;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.8;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;padding-inline:16px;padding-block:0 40px}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto}

/* 블로그 머리 */
.masthead{padding-block:34px 18px;display:grid;gap:4px}
.masthead a{color:inherit;text-decoration:none}
.blogname{font-family:var(--f-title);font-weight:800;font-size:clamp(1.9rem,5vw,2.5rem);letter-spacing:-.02em;margin:0}
.blogdesc{margin:0;color:var(--ink-2);font-size:.95rem}
.menu{display:flex;gap:4px;flex-wrap:wrap;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);
  background:var(--paper);padding:6px 8px;margin-bottom:22px}
.menu button{background:none;border:0;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:.93rem;color:var(--ink-2)}
.menu button:hover{color:var(--ink);background:var(--accent-soft)}
.menu button[aria-current="true"]{color:var(--accent);font-weight:800}
.menu .n{font-size:.78rem;color:var(--ink-3);margin-left:3px}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:22px;align-items:start}
@media (max-width:880px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:4px}

/* 글 목록 */
.listhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}
.listhead h2{margin:0;font-size:1.1rem}
.listhead span{font-size:.85rem;color:var(--ink-3)}
.postlist{list-style:none;margin:0;padding:0}
.postlist li+li{border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:18px;padding:22px 20px;cursor:pointer;
  text-align:left;background:none;border:0;width:100%}
.item:hover .item-title{text-decoration:underline;text-underline-offset:3px}
@media (max-width:560px){.item{grid-template-columns:minmax(0,1fr) 92px;gap:12px;padding:18px 16px}}
.item-cat{font-size:.8rem;font-weight:800}
.item-title{display:block;font-family:var(--f-title);font-weight:800;font-size:1.28rem;line-height:1.45;margin:4px 0 8px;text-wrap:balance}
.item-sum{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink-2);font-size:.93rem;line-height:1.7}
.item-meta{display:block;margin-top:10px;font-size:.8rem;color:var(--ink-3)}
@media (max-width:560px){.item-sum{-webkit-line-clamp:2}.item-title{font-size:1.1rem}}

.thumb{aspect-ratio:1/1;max-width:100%;border-radius:4px;display:grid;place-items:center;align-content:center;gap:2px;
  color:var(--on-thumb);text-align:center;padding:8px}
.thumb b{font-family:var(--f-title);font-size:clamp(1.3rem,4vw,2rem);line-height:1.1;font-variant-numeric:tabular-nums}
.thumb small{font-size:.72rem;opacity:.9;letter-spacing:.04em}
.t-life{background:var(--c-life)} .t-dis{background:var(--c-dis)} .t-nut{background:var(--c-nut)} .t-hea{background:var(--c-hea)}
.k-life{color:var(--k-life)} .k-dis{color:var(--k-dis)} .k-nut{color:var(--k-nut)} .k-hea{color:var(--k-hea)}

/* 글 보기 */
.post{padding:34px clamp(18px,4vw,48px) 30px}
.crumb{font-size:.85rem;font-weight:800;background:none;border:0;padding:0;cursor:pointer}
.post-title{font-family:var(--f-title);font-weight:800;font-size:clamp(1.6rem,4.2vw,2.2rem);line-height:1.4;margin:10px 0 14px;text-wrap:balance;letter-spacing:-.01em}
.byline{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--ink-3);padding-bottom:20px;border-bottom:1px solid var(--line)}
.byline b{color:var(--ink-2)}
.toc{margin:24px 0;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:16px 20px}
.toc p{margin:0 0 6px;font-weight:800;font-size:.9rem}
.toc ol{margin:0;padding-left:1.3em;font-size:.93rem}
.toc button{display:block;background:none;border:0;padding:1px 0;cursor:pointer;color:var(--ink-2);text-align:left}
.toc button:hover{color:var(--accent);text-decoration:underline}

.body{max-width:68ch;margin:0 auto;font-size:1.02rem;line-height:1.95;word-break:keep-all;overflow-wrap:break-word}
.body h2{font-size:1.35rem;line-height:1.5;margin:48px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--ink);text-wrap:balance;scroll-margin-top:16px}
.body h3{font-size:1.1rem;margin:30px 0 8px;color:var(--accent)}
.body p{margin:0 0 16px}
.body ul,.body ol{margin:0 0 18px;padding-left:1.3em}
.body li{margin-bottom:6px}
.body strong{background:linear-gradient(transparent 62%,var(--note-bg) 62%)}
.lead{font-size:1.08rem;color:var(--ink-2);border-left:3px solid var(--accent);padding-left:16px;margin:26px 0}
.box{border:1px solid var(--line);border-radius:4px;padding:16px 20px;margin:22px 0;background:var(--paper)}
.box.sum{background:var(--accent-soft);border-color:transparent}
.box.note{background:var(--note-bg);border-left:4px solid var(--note-line);border-radius:0 4px 4px 0}
.box.warn{background:var(--warn-bg);border-left:4px solid var(--warn-line);border-radius:0 4px 4px 0}
.box .h{display:block;font-weight:800;margin-bottom:6px}
.box ul,.box ol{margin-bottom:0}
.box p:last-child{margin-bottom:0}
.tbl{overflow-x:auto;margin:18px 0 22px;border:1px solid var(--line);border-radius:4px}
.tbl table{border-collapse:collapse;width:100%;min-width:460px;font-size:.92rem;line-height:1.6}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{background:var(--bg);font-weight:800;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl caption{caption-side:bottom;text-align:left;font-size:.8rem;color:var(--ink-3);padding:8px 12px}
.qa dt{font-weight:800;margin-top:16px}
.qa dt::before{content:"Q. ";color:var(--accent)}
.qa dd{margin:4px 0 0}
.qa dd::before{content:"A. ";font-weight:800;color:var(--ink-3)}
.refs{font-size:.88rem;color:var(--ink-2)}
.refs li{margin-bottom:4px}

.tags{display:flex;gap:6px;flex-wrap:wrap;max-width:68ch;margin:34px auto 0}
.tags span{font-size:.83rem;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 11px}
.disclaim{max-width:68ch;margin:26px auto 0;font-size:.84rem;color:var(--ink-3);border-top:1px dashed var(--line);padding-top:14px}
.actions{display:flex;justify-content:center;gap:10px;margin:30px 0 4px}
.like{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:8px 20px;cursor:pointer;font-size:.92rem}
.like[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:800}
.pn{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.pn button{background:none;border:0;padding:16px 20px;text-align:left;cursor:pointer;display:grid;gap:2px;min-width:0}
.pn button+button{border-left:1px solid var(--line);text-align:right}
.pn small{font-size:.78rem;color:var(--ink-3)}
.pn span{font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn button:hover span{color:var(--accent)}
.pn button:disabled{visibility:hidden}

/* 사이드바 */
.side{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.side .panel{padding:18px}
.side h3{margin:0 0 10px;font-size:.9rem;padding-bottom:8px;border-bottom:1px solid var(--line)}
.profile{display:grid;gap:8px}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;
  font-family:var(--f-title);font-weight:800;font-size:1.4rem}
.profile b{font-size:1rem}
.profile p{margin:0;font-size:.86rem;color:var(--ink-2);line-height:1.65}
.catlist,.recent{list-style:none;margin:0;padding:0;font-size:.9rem}
.catlist button,.recent button{background:none;border:0;padding:4px 0;cursor:pointer;text-align:left;width:100%;
  display:flex;justify-content:space-between;gap:8px;color:var(--ink-2)}
.catlist button:hover,.recent button:hover{color:var(--accent)}
.catlist button[aria-current="true"]{color:var(--accent);font-weight:800}
.catlist .sub{padding-left:12px}
.recent button{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagcloud{display:flex;flex-wrap:wrap;gap:6px}
.tagcloud button{background:none;border:0;padding:0;cursor:pointer;font-size:.8rem;color:var(--ink-2)}
.tagcloud button::before{content:"#";color:var(--ink-3)}
.tagcloud button:hover{color:var(--accent)}
.sform{display:flex;gap:6px}
.sform input{flex:1;min-width:0;font:inherit;font-size:.9rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 10px}
.sform button{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:4px;padding:6px 12px;cursor:pointer;font-size:.88rem}
.pager{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;padding:18px;border-top:1px solid var(--line)}
.pager button{min-width:34px;background:none;border:1px solid transparent;border-radius:4px;padding:4px 8px;cursor:pointer;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pager button:hover{border-color:var(--line)}
.pager button[aria-current="page"]{border-color:var(--accent);color:var(--accent);font-weight:800}
.nohit{padding:40px 20px;text-align:center;color:var(--ink-3);margin:0}
.related{border-top:1px solid var(--line);padding:18px clamp(18px,4vw,48px)}
.related h3{margin:0 0 8px;font-size:.92rem}
.related ul{list-style:none;margin:0;padding:0}
.related button{background:none;border:0;padding:4px 0;cursor:pointer;text-align:left;color:var(--ink-2);font-size:.92rem;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.related button:hover{color:var(--accent)}

.foot{margin-top:28px;text-align:center;font-size:.82rem;color:var(--ink-3);line-height:1.7}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

<template data-id="fridge" data-cat="life" data-date="2026.09.29"
  data-title="냉장고 제대로 쓰는 법: 온도, 칸별 보관, 소비기한까지 총정리"
  data-thumb="5°C|냉장 기준"
  data-summary="냉장고에 넣었다고 안전한 게 아니에요. 적정 온도와 칸마다 다른 온도 차이, 넣으면 오히려 손해 보는 식품, 2023년부터 바뀐 소비기한 표시, 남은 음식과 해동의 원칙까지 한 번에 정리했어요."
  data-tags="냉장고,식품보관,소비기한,식중독,해동">
<p class="lead">냉장고는 음식을 '멈추게' 하는 기계가 아니라 '느리게' 하는 기계예요. 이 차이를 알면 냉장고를 쓰는 방식이 꽤 달라져요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>냉장실은 <strong>5°C 이하</strong>, 냉동실은 <strong>−18°C 이하</strong>로 맞춰요.</li>
<li>세균이 빠르게 늘어나는 온도는 대략 <strong>5~60°C</strong>예요. 음식이 이 구간에 머무는 시간을 줄이는 게 핵심이에요.</li>
<li>냉장고는 <strong>70% 정도만</strong> 채우고, 문 칸에는 온도에 민감한 식품을 두지 않아요.</li>
<li>2023년부터 식품 날짜는 유통기한이 아니라 <strong>소비기한</strong>으로 표시돼요.</li>
</ul></div>

<h2>냉장고는 세균을 죽이지 않는다</h2>
<p>식중독을 일으키는 세균 대부분은 사람 체온 근처에서 가장 빨리 늘어나요. 온도가 내려갈수록 증식 속도가 느려지고, 5°C 아래에서는 대부분의 세균이 거의 늘지 못해요. 하지만 죽는 것은 아니에요. 다시 따뜻해지면 멈췄던 증식이 이어져요.</p>
<p>게다가 <strong>리스테리아균</strong>처럼 냉장 온도에서도 천천히 자라는 세균이 있어요. 그래서 "냉장고에 넣어뒀으니 괜찮다"는 생각보다 "냉장고에서 얼마나 오래 있었나"를 따지는 습관이 더 중요해요.</p>
<p>냉동은 조금 달라요. −18°C 아래에서는 세균이 사실상 증식하지 못해요. 다만 이것도 멈춘 것일 뿐이라, 녹이는 순간부터 다시 시간이 흐르기 시작해요.</p>

<h2>적정 온도: 숫자로 확인하기</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>권장 온도</th><th>설명</th></tr></thead>
<tbody>
<tr><td>냉장실</td><td class="num">0~5°C</td><td>식품 관련 법령상 냉장은 0~10°C 범위지만, 식품의약품안전처는 가정 냉장고를 5°C 이하로 유지하길 권해요.</td></tr>
<tr><td>냉동실</td><td class="num">−18°C 이하</td><td>세균 증식이 멈추는 온도예요. 품질 유지를 위해서도 이 이하가 좋아요.</td></tr>
<tr><td>위험 온도대</td><td class="num">약 5~60°C</td><td>세균이 빠르게 늘어나는 구간이에요. 조리한 음식을 이 온도에 오래 두지 않아요.</td></tr>
<tr><td>재가열</td><td class="num">중심 75°C, 1분 이상</td><td>남은 음식을 데울 때 기준이에요. 어패류는 85°C 1분 이상을 권해요.</td></tr>
</tbody>
<caption>식품의약품안전처 권고 기준</caption></table></div>
<p>냉장고 표시창의 숫자는 센서 위치의 온도일 뿐이라 실제 칸마다 온도가 달라요. 3천 원 안팎의 냉장고용 온도계를 가운데 칸에 하나 넣어두면 실제 온도를 확인할 수 있어요.</p>

<h2>칸마다 온도가 다르다: 어디에 무엇을 둘까</h2>
<p>냉장고 안은 한 가지 온도가 아니에요. 찬 공기가 나오는 곳, 문을 여닫을 때 바깥 공기가 닿는 곳, 아래로 가라앉는 곳이 저마다 달라요.</p>
<div class="tbl"><table>
<thead><tr><th>위치</th><th>특징</th><th>잘 맞는 식품</th></tr></thead>
<tbody>
<tr><td>문 칸</td><td>문을 열 때마다 온도가 크게 오르내려요. 가장 따뜻한 곳이에요.</td><td>소스, 잼, 음료, 케첩처럼 잘 상하지 않는 것</td></tr>
<tr><td>위 칸</td><td>온도 변화가 비교적 적어요.</td><td>바로 먹을 반찬, 조리된 음식, 남은 음식</td></tr>
<tr><td>가운데·안쪽</td><td>온도가 가장 안정적이에요.</td><td>우유, 계란, 유제품, 두부</td></tr>
<tr><td>맨 아래 칸</td><td>찬 공기가 가라앉아 차가운 편이에요.</td><td>날고기, 생선 (밀폐 용기에 담아서)</td></tr>
<tr><td>채소 칸</td><td>습도가 유지되도록 설계돼 있어요.</td><td>채소, 과일 (씻지 않은 상태로)</td></tr>
</tbody></table></div>
<h3>날고기와 생선을 맨 아래에 두는 이유</h3>
<p>온도 때문만이 아니에요. 핏물이나 해동 중 나온 물이 아래 칸으로 떨어지면 그대로 먹는 채소나 반찬을 오염시킬 수 있어요. 맨 아래에 두면 떨어질 곳이 없어요.</p>
<h3>계란을 문 칸에 두지 않는 이유</h3>
<p>많은 냉장고에 계란 받침이 문 칸에 있지만, 문 칸은 온도 변화가 가장 커요. 식품의약품안전처도 계란을 냉장고 안쪽에 보관하길 권해요. 계란은 씻지 않은 채 보관하고, 씻으면 껍데기 표면의 보호막이 벗겨져 세균이 들어가기 쉬우니 바로 요리해요.</p>

<h2>70%만 채워야 하는 이유</h2>
<p>냉장실은 찬 공기가 돌면서 온도를 유지해요. 칸이 꽉 차면 공기가 지나갈 길이 막혀서 안쪽 깊숙한 곳의 온도가 올라가고, 냉장고는 더 세게 돌아가느라 전기를 더 써요.</p>
<p>반대로 <strong>냉동실은 어느 정도 채워져 있는 편이 좋아요.</strong> 꽁꽁 언 음식들이 서로를 차갑게 유지해 주기 때문에 문을 열어도 온도가 덜 오르고 효율도 좋아요. 정리하면 이렇게 기억하면 돼요.</p>
<ul><li>냉장실: 비워서 공기를 돌게</li><li>냉동실: 채워서 냉기를 모아두게</li></ul>

<h2>냉장고에 넣으면 오히려 손해인 식품</h2>
<p>모든 식품이 차가울수록 좋은 건 아니에요. 아래 식품들은 냉장 보관하면 맛이나 식감이 빨리 나빠져요.</p>
<div class="tbl"><table>
<thead><tr><th>식품</th><th>냉장하면 생기는 일</th><th>더 나은 보관법</th></tr></thead>
<tbody>
<tr><td>빵</td><td>전분이 굳는 현상(노화)이 냉장 온도에서 가장 빨라서 금방 딱딱해져요.</td><td>2~3일 안에 먹을 건 실온, 그 이상은 한 조각씩 싸서 냉동</td></tr>
<tr><td>바나나</td><td>껍질이 빨리 검게 변해요.</td><td>실온에 걸어두기</td></tr>
<tr><td>감자·고구마</td><td>감자는 식감과 맛이 변하고, 고구마는 저온에 약해 쉽게 상해요.</td><td>서늘하고 어두우며 바람이 통하는 곳</td></tr>
<tr><td>양파</td><td>습기를 먹어 무르기 쉬워요. (깐 양파는 냉장)</td><td>망에 담아 통풍이 잘 되는 곳</td></tr>
<tr><td>토마토 (덜 익은 것)</td><td>숙성이 멈추고 향이 약해져요.</td><td>익을 때까지 실온, 다 익은 뒤 냉장</td></tr>
</tbody></table></div>

<h2>소비기한: 2023년에 바뀐 날짜 읽는 법</h2>
<p>2023년 1월 1일부터 식품에 표시되는 날짜가 <strong>유통기한에서 소비기한으로</strong> 바뀌었어요. 1년의 계도기간을 거쳐 지금은 대부분의 식품에 소비기한이 표시돼요.</p>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>뜻</th><th>설정 방식</th></tr></thead>
<tbody>
<tr><td>유통기한 (예전)</td><td>판매해도 되는 기한</td><td>식품이 안전한 한계 기간의 약 60~70% 수준</td></tr>
<tr><td>소비기한 (현재)</td><td>표시된 방법으로 보관했을 때 먹어도 안전한 기한</td><td>안전한 한계 기간의 약 80~90% 수준</td></tr>
</tbody>
<caption>식품의약품안전처 설명 기준</caption></table></div>
<p>그래서 같은 제품이라도 예전 유통기한보다 소비기한이 조금 더 길게 표시돼요. 대신 의미가 달라요. 유통기한은 지나도 어느 정도 여유가 있었지만, <strong>소비기한은 말 그대로 먹을 수 있는 마지막 날</strong>이라서 지난 제품은 먹지 않는 게 원칙이에요.</p>
<div class="box note"><span class="h">꼭 알아둘 세 가지</span>
<ul>
<li><strong>보관 조건이 전제예요.</strong> "냉장 보관" 제품을 실온에 두었다면 소비기한은 의미가 없어요.</li>
<li><strong>개봉하면 달라져요.</strong> 소비기한은 뜯지 않은 상태 기준이에요. 개봉 후에는 제품에 적힌 안내를 따르고 되도록 빨리 먹어요.</li>
<li><strong>우유는 아직 예외예요.</strong> 우유류는 냉장 유통 환경을 개선할 시간을 두기 위해 2031년부터 소비기한이 적용돼요.</li>
</ul></div>

<h2>남은 음식: 2시간 안에 결정하기</h2>
<p>조리한 음식을 실온에 두는 시간은 <strong>2시간을 넘기지 않는 것</strong>이 널리 쓰이는 기준이에요. 여름처럼 기온이 30°C를 넘는 날에는 1시간으로 줄여 잡아요.</p>
<h3>"뜨거운 음식을 바로 넣으면 안 된다"는 말은 반만 맞아요</h3>
<p>큰 냄비째 뜨거운 국을 넣으면 냉장고 안 온도가 올라가 다른 음식에 영향을 줄 수 있어요. 그렇다고 완전히 식을 때까지 몇 시간씩 실온에 두면 위험 온도대에 오래 머물게 돼요. 좋은 방법은 이거예요.</p>
<ol>
<li>한 김만 식혀요. 김이 크게 오르지 않을 정도면 돼요.</li>
<li><strong>작고 얕은 용기 여러 개에 나눠 담아요.</strong> 표면적이 넓어져 빨리 식어요.</li>
<li>2시간 안에 냉장고에 넣어요.</li>
</ol>
<h3>남은 음식은 언제까지 먹을 수 있을까</h3>
<p>조리한 음식은 냉장 보관해도 보통 <strong>3~4일 안</strong>에 먹는 게 안전하다고 봐요. 그 안에 먹지 못할 것 같으면 처음부터 한 번 먹을 양씩 나눠 냉동하는 게 좋아요. 다시 먹을 때는 속까지 충분히 데워요.</p>

<h2>해동의 원칙: 실온 해동을 피하는 이유</h2>
<p>냉동 고기를 싱크대에 꺼내두면 겉은 금방 녹아 실온에 가까워지지만 속은 한참 얼어 있어요. 그 사이 겉면은 몇 시간 동안 위험 온도대에 머물러요. 그래서 권장되는 해동법은 세 가지예요.</p>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>걸리는 시간</th><th>주의할 점</th></tr></thead>
<tbody>
<tr><td>냉장실 해동</td><td>하루 전날부터</td><td>가장 안전해요. 핏물이 떨어지지 않게 그릇에 받쳐 맨 아래 칸에 둬요.</td></tr>
<tr><td>찬물 해동</td><td>수십 분~몇 시간</td><td>밀봉한 채로 찬물에 담그고, 물을 30분마다 갈아요. 녹으면 바로 조리해요.</td></tr>
<tr><td>전자레인지 해동</td><td>몇 분</td><td>일부가 익기 시작하므로 해동 후 바로 조리해요.</td></tr>
</tbody></table></div>
<p>한 번 녹인 식품을 다시 얼리는 것도 조심해야 해요. 냉장실에서 천천히 녹인 경우는 다시 얼릴 수 있다고 보지만 수분이 빠져 맛과 식감이 크게 떨어져요. 처음부터 <strong>한 번 쓸 양씩 나눠 얼리는 것</strong>이 가장 좋은 해결책이에요.</p>

<h2>교차오염: 냉장고 밖에서 시작되는 문제</h2>
<p>식중독은 냉장고 안보다 도마 위에서 시작되는 경우가 많아요. 날고기에 있던 세균이 칼, 도마, 손을 거쳐 그대로 먹는 채소나 과일로 옮겨가는 것을 교차오염이라고 해요.</p>
<ul>
<li><strong>도마와 칼을 나눠 써요.</strong> 날고기·생선용과 채소·과일용을 색깔로 구분하면 편해요. 한 개뿐이라면 채소를 먼저 손질하고 고기를 나중에 해요.</li>
<li><strong>생닭은 되도록 씻지 않아요.</strong> 씻을 때 튄 물방울이 주변으로 세균을 퍼뜨릴 수 있어요. 씻어야 한다면 물이 튀지 않게 조심하고, 채소를 먼저 씻은 뒤 마지막에 씻어요.</li>
<li><strong>손은 재료가 바뀔 때마다 씻어요.</strong> 특히 날고기와 계란을 만진 뒤에는 꼭 씻어요.</li>
</ul>

<h2>한눈에 보는 냉장고 점검표</h2>
<div class="box"><span class="h">이번 주말에 한 번 확인해 보세요</span>
<ol>
<li>냉장실 온도가 5°C 이하인지 온도계로 확인하기</li>
<li>문 칸에 있는 우유와 계란을 안쪽으로 옮기기</li>
<li>날고기와 생선을 밀폐 용기에 담아 맨 아래 칸으로</li>
<li>소비기한이 지난 식품, 조리한 지 4일 넘은 반찬 정리하기</li>
<li>냉장실이 70% 넘게 차 있다면 정리하고, 냉동실 빈 공간은 채워두기</li>
<li>문 고무 패킹에 틈이나 곰팡이가 없는지 확인하기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>김치냉장고에 일반 식품을 보관해도 되나요?</dt>
<dd>김치냉장고는 온도 변화가 적어서 채소나 과일, 육류를 보관하기에 좋은 편이에요. 다만 모드마다 설정 온도가 다르니 보관하려는 식품에 맞는 모드를 골라요.</dd>
<dt>통조림을 따고 남은 건 캔째 넣어도 되나요?</dt>
<dd>캔을 연 뒤에는 금속 성분이 음식으로 옮겨가거나 맛이 변할 수 있어요. 유리나 플라스틱 밀폐 용기에 옮겨 담아 보관해요.</dd>
<dt>냉동실에 넣어두면 몇 달이 지나도 괜찮나요?</dt>
<dd>−18°C 이하라면 세균은 늘지 않지만 수분이 빠지고 산화가 일어나 품질은 계속 떨어져요. 냉동 날짜를 적어두고 가급적 몇 달 안에 먹는 게 좋아요.</dd>
</dl>

  data-tags="고혈압,혈압측정,가정혈압,나트륨,심혈관질환">
<p class="lead">고혈압은 대부분 아무 증상이 없어요. 그래서 "괜찮은 것 같은데"라는 느낌은 혈압에 관해서는 거의 아무것도 말해주지 않아요. 숫자만이 답을 줘요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>진료실에서 잰 혈압이 <strong>140/90mmHg 이상</strong>이면 고혈압이에요. 집에서 잰 혈압은 <strong>135/85mmHg 이상</strong>이 기준이에요.</li>
<li>뒷목이 뻐근하거나 머리가 아픈 것으로 고혈압을 알아채기는 어려워요. <strong>정기적으로 재는 것</strong>이 유일한 방법이에요.</li>
<li>싱겁게 먹기, 체중 줄이기, 운동, 절주만으로도 혈압이 의미 있게 내려가요.</li>
<li>혈압약은 <strong>스스로 끊지 않아요.</strong> 조절이 잘 된다는 건 약이 일하고 있다는 뜻이에요.</li>
</ul></div>

<h2>혈압이란 무엇이고, 두 숫자는 무슨 뜻일까</h2>
<p>혈압은 심장이 피를 내보낼 때 혈관 벽이 받는 압력이에요. 혈압계에 두 숫자가 나오는데 각각 이런 뜻이에요.</p>
<ul>
<li><strong>수축기 혈압 (위 숫자):</strong> 심장이 수축하며 피를 내보내는 순간의 압력</li>
<li><strong>이완기 혈압 (아래 숫자):</strong> 심장이 쉬면서 다시 피를 받는 동안 혈관에 남은 압력</li>
</ul>
<p>단위인 mmHg는 수은 기둥을 몇 mm 밀어 올리는 압력인지를 뜻해요. 혈압이 높다는 건 혈관이 매 순간 더 큰 힘을 견디고 있다는 뜻이고, 이 부담이 수년, 수십 년 쌓이면서 혈관이 딱딱해지고 좁아져요.</p>

<h2>혈압 단계: 국내 진료지침 기준</h2>
<div class="tbl"><table>
<thead><tr><th>분류</th><th>수축기 (mmHg)</th><th></th><th>이완기 (mmHg)</th></tr></thead>
<tbody>
<tr><td>정상 혈압</td><td class="num">120 미만</td><td>그리고</td><td class="num">80 미만</td></tr>
<tr><td>주의 혈압</td><td class="num">120~129</td><td>그리고</td><td class="num">80 미만</td></tr>
<tr><td>고혈압 전단계</td><td class="num">130~139</td><td>또는</td><td class="num">80~89</td></tr>
<tr><td>고혈압 1기</td><td class="num">140~159</td><td>또는</td><td class="num">90~99</td></tr>
<tr><td>고혈압 2기</td><td class="num">160 이상</td><td>또는</td><td class="num">100 이상</td></tr>
<tr><td>수축기 단독 고혈압</td><td class="num">140 이상</td><td>그리고</td><td class="num">90 미만</td></tr>
</tbody>
<caption>대한고혈압학회 고혈압 진료지침(2022) 기준, 진료실 혈압</caption></table></div>
<p>여기서 중요한 건 <strong>'또는'</strong>이에요. 위 숫자와 아래 숫자 중 하나만 기준을 넘어도 그 단계로 분류해요. 예를 들어 128/92라면 위 숫자는 주의 혈압이지만 아래 숫자 때문에 고혈압 1기예요.</p>
<p>또 한 번 잰 숫자로 진단하지 않아요. 서로 다른 날 여러 번 재거나, 가정혈압이나 24시간 활동혈압을 함께 보고 판단해요.</p>

<h2>얼마나 흔한 병일까</h2>
<p>대한고혈압학회는 국내 20세 이상 성인 가운데 고혈압이 있는 사람을 1,200만~1,300만 명 수준으로 추산해요. 성인 서너 명 가운데 한 명꼴이에요. 나이가 들수록 비율이 크게 올라가서 60대 이상에서는 절반 이상이 고혈압이에요.</p>
<p>더 눈여겨볼 점은 <strong>젊은 층의 인지율</strong>이에요. 20~30대는 고혈압이 있어도 본인이 모르는 경우가 훨씬 많아요. 건강검진에서 숫자가 조금 높게 나와도 "긴장해서 그렇겠지" 하고 넘기는 경우가 흔해요.</p>

<h2>왜 생길까: 원인과 위험 요인</h2>
<p>고혈압의 <strong>90~95%는 뚜렷한 원인 하나를 찾을 수 없는 '본태성 고혈압'</strong>이에요. 유전, 나이, 생활습관이 겹쳐서 생겨요. 나머지 5~10%는 콩팥 질환, 호르몬 이상(알도스테론증, 갑상선 질환 등), 수면무호흡, 특정 약물처럼 원인이 따로 있는 '이차성 고혈압'이에요.</p>
<div class="tbl"><table>
<thead><tr><th>바꿀 수 없는 요인</th><th>바꿀 수 있는 요인</th></tr></thead>
<tbody>
<tr><td>나이 (혈관이 점점 딱딱해져요)</td><td>짜게 먹는 식습관</td></tr>
<tr><td>가족력 (부모가 고혈압이면 위험이 높아요)</td><td>과체중과 복부비만</td></tr>
<tr><td>성별 (젊을 때는 남성, 폐경 후에는 여성의 위험이 빠르게 올라가요)</td><td>과음, 흡연</td></tr>
<tr><td></td><td>운동 부족, 수면 부족, 수면무호흡</td></tr>
</tbody></table></div>
<p>젊은 나이에 혈압이 많이 높거나, 약을 먹어도 잘 조절되지 않거나, 갑자기 혈압이 올랐다면 이차성 고혈압일 수 있어서 원인 검사를 해보는 게 좋아요.</p>

<h2>'침묵의 살인자'라고 불리는 이유</h2>
<p>흔히 뒷목이 뻐근하거나 두통이 있으면 혈압을 의심하지만, 실제로 <strong>대부분의 고혈압은 아무 증상이 없어요.</strong> 두통과 혈압의 관계도 생각보다 약해서, 두통이 없다고 혈압이 정상인 것은 아니에요.</p>
<p>문제는 증상이 없는 동안에도 혈관과 장기가 계속 손상된다는 점이에요. 오래 방치된 고혈압은 이런 병으로 이어질 수 있어요.</p>
<ul>
<li><strong>뇌:</strong> 뇌졸중(뇌출혈, 뇌경색), 혈관성 치매</li>
<li><strong>심장:</strong> 심근경색, 협심증, 심부전, 부정맥</li>
<li><strong>콩팥:</strong> 만성 콩팥병 (반대로 콩팥병이 고혈압을 악화시키기도 해요)</li>
<li><strong>눈:</strong> 망막 혈관이 손상되는 고혈압성 망막병증</li>
<li><strong>혈관:</strong> 대동맥류, 말초동맥 질환</li>
</ul>
<div class="box warn"><span class="h">바로 119에 연락해야 하는 경우</span>
<p>혈압이 180/120mmHg 이상으로 매우 높으면서 심한 두통, 가슴 통증, 숨참, 한쪽 팔다리 마비나 저림, 말이 어눌해짐, 시야 이상 같은 증상이 함께 있다면 응급 상황일 수 있어요. 집에서 약을 더 먹으며 기다리지 말고 바로 도움을 요청하세요.</p></div>

<h2>집에서 정확하게 재는 법</h2>
<p>병원에서 재면 긴장해서 혈압이 높게 나오는 사람이 있어요(<strong>백의 고혈압</strong>). 반대로 병원에서는 정상인데 평소에는 높은 사람도 있어요(<strong>가면 고혈압</strong>). 그래서 진료지침은 집에서 재는 <strong>가정혈압</strong>을 매우 중요하게 봐요. 가정혈압은 병원 혈압보다 조금 낮게 나오기 때문에 기준도 <strong>135/85mmHg</strong>로 조금 낮아요.</p>
<h3>재는 시간</h3>
<ul>
<li><strong>아침:</strong> 일어나서 1시간 안에, 소변을 본 뒤, 혈압약과 아침 식사 전</li>
<li><strong>저녁:</strong> 잠자리에 들기 전</li>
<li>매번 1~2분 간격으로 두 번 재서 평균을 기록해요.</li>
<li>처음 진단받을 때나 약을 바꿨을 때는 최소 5~7일 연속으로 재요.</li>
</ul>
<h3>재는 자세</h3>
<ol>
<li>등받이가 있는 의자에 앉아 <strong>5분 이상</strong> 조용히 쉬어요.</li>
<li>재기 30분 전에는 커피, 흡연, 운동을 피해요.</li>
<li>다리를 꼬지 않고 발바닥을 바닥에 붙여요.</li>
<li>팔을 책상 위에 올려 커프가 <strong>심장 높이</strong>에 오게 해요.</li>
<li>옷을 걷어 맨살에 커프를 감아요. 두꺼운 옷 위나 걷어 올린 소매가 팔을 조이면 부정확해요.</li>
<li>재는 동안에는 말하지 않아요.</li>
</ol>
<div class="box note"><span class="h">혈압계 고르는 팁</span>
<p>손목형보다 <strong>위팔(상완)형</strong>이 더 정확해요. 커프 크기가 팔 둘레에 맞아야 하는데, 팔이 굵은 사람이 작은 커프를 쓰면 혈압이 실제보다 높게 나와요. 구입 후 병원에 가져가 병원 혈압계와 비교해 보면 더 좋아요.</p></div>

<h2>약 없이 혈압을 낮추는 생활습관</h2>
<p>생활습관 개선은 고혈압 전단계에서는 치료 그 자체이고, 약을 먹는 사람에게도 약의 양을 줄이는 데 도움이 돼요. 진료지침에 제시된 대략적인 효과는 이 정도예요.</p>
<div class="tbl"><table>
<thead><tr><th>생활요법</th><th>권장 내용</th><th>수축기/이완기 감소 효과 (약)</th></tr></thead>
<tbody>
<tr><td>싱겁게 먹기</td><td>소금 하루 6g 이하</td><td class="num">−5.1 / −2.7 mmHg</td></tr>
<tr><td>체중 감량</td><td>체질량지수 25 미만 목표</td><td class="num">체중 1kg당 −1.1 / −0.9 mmHg</td></tr>
<tr><td>절주</td><td>남성 하루 2잔, 여성 1잔 이하</td><td class="num">−3.9 / −2.4 mmHg</td></tr>
<tr><td>규칙적인 운동</td><td>하루 30~50분, 일주일에 5일 이상</td><td class="num">−4.9 / −3.7 mmHg</td></tr>
<tr><td>식사 조절</td><td>채소·과일·통곡물·저지방 유제품 위주, 포화지방 줄이기</td><td class="num">−11.4 / −5.5 mmHg</td></tr>
<tr><td>금연</td><td>담배 끊기</td><td>혈압 자체보다 심혈관 질환 위험을 크게 낮춰요</td></tr>
</tbody>
<caption>대한고혈압학회 진료지침에 제시된 생활요법 효과를 바탕으로 정리, 개인차가 커요</caption></table></div>
<p>여러 가지를 함께 실천하면 효과가 더해져요. 혈압약 한 가지가 수축기 혈압을 대략 10mmHg 안팎 낮춘다는 점을 생각하면, 생활습관의 힘이 약 못지않다는 걸 알 수 있어요.</p>
<h3>싱겁게 먹기를 현실적으로 하는 법</h3>
<p>한국인의 나트륨 섭취는 세계보건기구 권고량(하루 2,000mg, 소금 약 5g)보다 꽤 많아요. 가장 큰 원인은 국, 찌개, 면류, 김치 같은 음식이에요.</p>
<ul>
<li><strong>국물은 건더기 위주로.</strong> 국물을 반만 남겨도 나트륨이 크게 줄어요.</li>
<li><strong>라면은 스프를 반만.</strong> 라면 한 봉지에는 하루 권고량에 가까운 나트륨이 들어 있어요.</li>
<li><strong>양념은 찍어 먹기.</strong> 부어 먹는 것보다 훨씬 적게 먹게 돼요.</li>
<li><strong>칼륨이 많은 채소와 과일 곁들이기.</strong> 칼륨은 나트륨 배출을 돕지만, 콩팥 기능이 떨어진 사람은 칼륨을 제한해야 할 수 있으니 의사와 상의해요.</li>
<li><strong>영양성분표 보는 습관.</strong> 가공식품은 1회 제공량과 총 내용량을 함께 확인해요.</li>
</ul>

<h2>혈압약에 대한 흔한 오해</h2>
<p>혈압약은 크게 다섯 계열이 쓰여요. 안지오텐신 전환효소 억제제(ACE 억제제), 안지오텐신 수용체 차단제(ARB), 칼슘 채널 차단제, 이뇨제, 베타 차단제예요. 나이, 동반 질환, 혈압 수준에 따라 한 가지 또는 여러 가지를 조합해서 써요.</p>
<dl class="qa">
<dt>혈압약은 한 번 먹으면 평생 먹어야 하나요?</dt>
<dd>많은 경우 오래 먹게 되지만, 체중을 많이 줄이거나 생활습관을 크게 바꿔서 약을 줄이거나 끊는 사람도 있어요. 다만 그 결정은 반드시 의사와 함께해요. 혈압이 잘 조절되는 이유가 약 때문인 경우가 대부분이라, 스스로 끊으면 혈압이 다시 오르고 그 사이 뇌졸중 같은 위험이 커져요.</dd>
<dt>혈압이 정상으로 나오는 날은 약을 걸러도 되나요?</dt>
<dd>안 돼요. 오늘 정상인 건 어제 먹은 약이 효과를 내고 있기 때문이에요. 날마다 같은 시간에 먹는 것이 가장 중요해요.</dd>
<dt>혈압약을 먹으면 콩팥이 나빠지나요?</dt>
<dd>오히려 반대예요. 조절되지 않는 고혈압이 콩팥을 망가뜨리는 주요 원인이에요. 일부 약은 콩팥을 보호하는 효과도 있어요. 정기 검사에서 콩팥 수치를 함께 확인하니 걱정되는 점은 진료 때 물어보세요.</dd>
<dt>감기약이나 진통제를 같이 먹어도 되나요?</dt>
<dd>일부 코감기약(혈관을 수축시키는 성분)과 소염진통제는 혈압을 올리거나 혈압약 효과를 떨어뜨릴 수 있어요. 약국에서 약을 살 때 혈압약을 먹고 있다고 꼭 말해요.</dd>
</dl>

<h2>오늘부터 해볼 수 있는 것</h2>
<div class="box"><span class="h">나의 혈압 관리 시작하기</span>
<ol>
<li>최근 건강검진 결과지에서 혈압 숫자를 찾아보기</li>
<li>130/80 이상이었다면 위팔형 혈압계로 일주일간 아침·저녁 재보기</li>
<li>평균이 135/85 이상이면 진료 예약하기</li>
<li>이번 주 국물 요리를 먹을 때 국물 반 남기기</li>
<li>하루 30분 빠르게 걷기를 일주일에 5번 목표로 시작하기</li>
</ol></div>

<p class="lead">비타민 D는 음식보다 햇빛으로 더 많이 얻는, 조금 특이한 영양소예요. 그래서 실내에서 지내는 시간이 긴 요즘 사람들에게 유독 부족해지기 쉬워요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>비타민 D의 가장 확실한 역할은 <strong>칼슘 흡수를 도와 뼈를 지키는 것</strong>이에요.</li>
<li>한국인 성인의 하루 충분섭취량은 <strong>10μg(400IU)</strong>, 65세 이상은 <strong>15μg(600IU)</strong>, 상한섭취량은 <strong>100μg(4,000IU)</strong>이에요.</li>
<li>음식만으로 채우기 어려워서 햇볕과 보충제가 함께 거론돼요.</li>
<li>보충제는 부족한 사람에게 의미가 있지만, 건강한 사람이 먹는다고 암이나 심장병을 막아준다는 근거는 아직 약해요.</li>
</ul></div>

<h2>비타민 D는 몸에서 어떻게 만들어질까</h2>
<p>비타민 D는 이름은 비타민이지만 몸 안에서 호르몬처럼 작동해요. 만들어지는 과정은 세 단계예요.</p>
<ol>
<li><strong>피부:</strong> 햇빛 속 자외선 B(UVB)가 피부에 닿으면, 피부에 있는 콜레스테롤 유사 물질(7-디하이드로콜레스테롤)이 비타민 D3로 바뀌어요.</li>
<li><strong>간:</strong> 피부에서 만들어졌거나 음식으로 들어온 비타민 D가 간에서 <strong>25-하이드록시비타민 D</strong>로 바뀌어요. 혈액 검사로 재는 게 바로 이 형태예요.</li>
<li><strong>콩팥:</strong> 필요할 때 콩팥에서 한 번 더 바뀌어 실제로 작용하는 활성형(1,25-다이하이드록시비타민 D)이 돼요.</li>
</ol>
<p>그래서 간이나 콩팥 기능이 떨어진 사람은 비타민 D를 충분히 먹어도 활성형으로 잘 바뀌지 않을 수 있어요.</p>

<h2>무슨 일을 할까</h2>
<h3>확실한 역할: 뼈와 칼슘</h3>
<p>비타민 D는 장에서 칼슘과 인이 흡수되도록 도와요. 비타민 D가 부족하면 칼슘을 아무리 먹어도 흡수가 잘 되지 않아서, 몸은 뼈에서 칼슘을 꺼내 혈중 농도를 맞춰요. 이런 상태가 오래 이어지면 어린이는 뼈가 휘는 <strong>구루병</strong>, 성인은 뼈가 물러지는 <strong>골연화증</strong>이 생기고, 나이 든 사람은 <strong>골다공증</strong>과 골절 위험이 커져요.</p>
<h3>연구 중인 역할: 근육, 면역, 그 밖의 질환</h3>
<p>비타민 D 수용체는 근육, 면역세포 등 몸 곳곳에 있어요. 그래서 근력, 낙상, 감염, 우울감, 심혈관 질환, 암과의 관계가 활발히 연구돼 왔어요. 혈중 비타민 D가 낮은 사람에게 이런 질환이 많다는 관찰 연구는 많지만, <strong>보충제를 먹였을 때 그 병이 줄어드는지</strong>를 확인한 대규모 연구의 결과는 기대보다 약했어요. 이 부분은 뒤에서 다시 다룰게요.</p>

<h2>한국인은 왜 부족하기 쉬울까</h2>
<p>국내 여러 조사에서 성인의 절반 이상, 조사에 따라서는 70% 이상이 권장 기준보다 낮은 혈중 비타민 D 수치를 보였어요. 이유는 여러 가지가 겹쳐요.</p>
<ul>
<li><strong>실내 생활:</strong> 출퇴근, 사무실, 학교, 학원까지 햇빛을 받는 시간이 짧아요.</li>
<li><strong>유리창은 UVB를 막아요.</strong> 창가에서 햇볕을 쬐어도 비타민 D는 거의 만들어지지 않아요.</li>
<li><strong>자외선 차단제와 가림:</strong> 피부 건강에는 좋지만 비타민 D 합성은 크게 줄어요.</li>
<li><strong>위도와 계절:</strong> 서울 정도의 위도에서는 겨울철 햇빛의 UVB가 약해서 피부에서 만들어지는 양이 크게 줄어요.</li>
<li><strong>대기 오염:</strong> 미세먼지가 많은 날에는 지표에 닿는 자외선이 줄어요.</li>
<li><strong>나이:</strong> 나이가 들수록 피부에서 만드는 능력이 떨어져요.</li>
</ul>

<h2>하루에 얼마나 필요할까</h2>
<div class="tbl"><table>
<thead><tr><th>나이</th><th>충분섭취량</th><th>상한섭취량</th></tr></thead>
<tbody>
<tr><td>1~11세</td><td class="num">5μg (200IU)</td><td class="num">30~60μg</td></tr>
<tr><td>12~64세</td><td class="num">10μg (400IU)</td><td class="num">100μg (4,000IU)</td></tr>
<tr><td>65세 이상</td><td class="num">15μg (600IU)</td><td class="num">100μg (4,000IU)</td></tr>
<tr><td>임신·수유부</td><td class="num">10μg (400IU)</td><td class="num">100μg (4,000IU)</td></tr>
</tbody>
<caption>보건복지부·한국영양학회, 2020 한국인 영양소 섭취기준. 1μg = 40IU. 어린이 상한은 나이대별로 달라요.</caption></table></div>
<p><strong>충분섭취량</strong>은 이 정도면 대부분의 사람에게 충분하다고 보는 양이에요. <strong>상한섭취량</strong>은 장기간 먹어도 건강 문제가 생기지 않을 최대치예요. 보충제의 단위가 μg인지 IU인지 헷갈리기 쉬운데, 1μg은 40IU예요. 예를 들어 1,000IU는 25μg이에요.</p>

<h2>음식으로는 얼마나 얻을 수 있을까</h2>
<p>비타민 D가 들어 있는 식품은 생각보다 적어요. 기름진 생선과 일부 버섯, 달걀노른자 정도가 주요 공급원이에요.</p>
<div class="tbl"><table>
<thead><tr><th>식품</th><th>분량</th><th>비타민 D (약)</th></tr></thead>
<tbody>
<tr><td>대구 간유</td><td>1큰술</td><td class="num">34μg (1,360IU)</td></tr>
<tr><td>송어 (양식, 조리)</td><td>85g</td><td class="num">16μg (645IU)</td></tr>
<tr><td>연어 (홍연어, 조리)</td><td>85g</td><td class="num">14μg (570IU)</td></tr>
<tr><td>양송이버섯 (자외선 처리)</td><td>½컵</td><td class="num">9μg (366IU)</td></tr>
<tr><td>달걀 (큰 것)</td><td>1개</td><td class="num">1.1μg (44IU)</td></tr>
<tr><td>참치 통조림</td><td>85g</td><td class="num">1μg (40IU)</td></tr>
</tbody>
<caption>미국 국립보건원 식이보충제국(ODS) 자료 기준. 품종, 양식 여부, 조리법에 따라 차이가 커요.</caption></table></div>
<p>연어나 송어 한 토막이면 하루 필요량을 채울 수 있지만, 매일 먹기는 쉽지 않아요. 달걀로 채우려면 하루 열 개 가까이 먹어야 해요. 해외에서는 우유나 시리얼에 비타민 D를 강화하는 경우가 많지만, 국내 제품은 강화되지 않은 경우가 많아서 영양성분표를 확인해야 해요.</p>
<div class="box note"><span class="h">버섯은 햇볕에 말리면 비타민 D가 늘어요</span>
<p>버섯에는 자외선을 받으면 비타민 D2로 바뀌는 물질이 있어요. 표고버섯이나 양송이를 요리하기 전에 갓 안쪽이 위를 향하게 해서 햇볕에 한두 시간 두면 비타민 D 함량이 늘어나요.</p></div>

<h2>햇볕은 얼마나 쬐어야 할까</h2>
<p>흔히 "팔과 다리를 드러내고 한낮에 10~30분, 일주일에 두세 번"이라는 기준이 쓰여요. 하지만 실제 필요한 시간은 여러 조건에 따라 크게 달라요.</p>
<ul>
<li><strong>시간대:</strong> 해가 높이 뜬 오전 10시~오후 3시 사이에 UVB가 강해요.</li>
<li><strong>계절:</strong> 여름에는 짧게도 충분하지만, 겨울에는 오래 있어도 합성량이 적어요.</li>
<li><strong>피부색:</strong> 피부색이 짙을수록 같은 양을 만드는 데 시간이 더 걸려요.</li>
<li><strong>노출 면적:</strong> 얼굴과 손만 드러내면 합성량이 적어요.</li>
</ul>
<p>다만 자외선은 피부 노화와 피부암의 원인이기도 해요. 피부가 붉어질 정도로 쬐는 건 지나쳐요. 짧게 산책하는 정도로 충분하고, 그 이상은 자외선 차단제를 바르는 게 좋아요. 이 균형이 어렵기 때문에 많은 전문가가 햇볕만으로 해결하기보다 음식과 필요시 보충제를 함께 고려하라고 말해요.</p>

<h2>혈액 검사 수치 읽는 법</h2>
<p>비타민 D 상태는 혈중 <strong>25-하이드록시비타민 D</strong> 농도로 확인해요. 판정 기준은 기관마다 조금씩 다르지만 대체로 이렇게 봐요.</p>
<div class="tbl"><table>
<thead><tr><th>혈중 농도 (ng/mL)</th><th>일반적인 해석</th></tr></thead>
<tbody>
<tr><td class="num">12 미만</td><td>결핍 (뼈 건강에 문제가 생길 수 있는 수준)</td></tr>
<tr><td class="num">12~20</td><td>부족 (대부분의 사람에게 충분하지 않을 수 있음)</td></tr>
<tr><td class="num">20 이상</td><td>대부분의 사람에게 충분</td></tr>
<tr><td class="num">50 초과</td><td>지나치게 높을 수 있음, 원인 확인 필요</td></tr>
</tbody>
<caption>미국 국립보건원 식이보충제국(ODS) 해석 기준. 일부 학회와 검사기관은 20 미만을 결핍, 20~30을 부족으로 보기도 해요.</caption></table></div>
<p>결과지에 nmol/L 단위로 나오면 2.5로 나누면 ng/mL가 돼요. 예를 들어 50nmol/L는 20ng/mL예요.</p>

<h2>보충제, 누가 어떻게 먹어야 할까</h2>
<h3>챙겨볼 만한 사람</h3>
<ul>
<li>검사에서 부족이나 결핍으로 나온 사람</li>
<li>65세 이상, 특히 골다공증이 있거나 넘어진 적이 있는 사람</li>
<li>햇볕을 거의 보지 못하는 사람 (야간 근무, 거동이 불편한 사람, 요양 시설 거주자)</li>
<li>비만한 사람 (비타민 D가 지방 조직에 저장돼 혈중 농도가 낮아지기 쉬워요)</li>
<li>지방 흡수에 문제가 있는 질환이 있거나 위 절제 수술을 받은 사람</li>
<li>모유만 먹는 영아 (모유에는 비타민 D가 적어서 소아청소년과에서 보충을 권하는 경우가 많아요)</li>
</ul>
<h3>먹는 방법</h3>
<ul>
<li><strong>D3(콜레칼시페롤)가 일반적이에요.</strong> D2보다 혈중 농도를 올리는 효과가 조금 더 좋다는 연구가 많아요.</li>
<li><strong>식사와 함께 먹어요.</strong> 지용성 비타민이라 지방이 있는 음식과 먹으면 흡수가 좋아져요.</li>
<li><strong>매일 먹는 게 기본이에요.</strong> 주 1회나 월 1회 고용량 제품도 있지만, 고용량 요법은 의사의 판단에 따라요.</li>
<li><strong>다른 제품과 겹치지 않는지 확인해요.</strong> 종합비타민, 칼슘제, 오메가3 제품에 비타민 D가 함께 들어 있는 경우가 많아요. 모두 더한 양이 상한섭취량을 넘지 않게 해요.</li>
</ul>
<div class="box warn"><span class="h">많이 먹으면 생기는 문제</span>
<p>비타민 D는 지용성이라 몸에 쌓여요. 오랫동안 과하게 먹으면 혈중 칼슘이 지나치게 높아지는 <strong>고칼슘혈증</strong>이 생길 수 있어요. 메스꺼움, 구토, 변비, 심한 갈증과 잦은 소변, 근력 저하가 나타나고 심하면 신장 결석이나 콩팥 손상, 부정맥으로 이어질 수 있어요. 햇볕으로 인한 과다는 생기지 않고, 문제는 거의 항상 보충제 과량 복용이에요.</p></div>

<h2>보충제의 효과, 어디까지 알려졌을까</h2>
<p>한때 비타민 D는 거의 만능처럼 이야기됐어요. 하지만 대규모 임상시험 결과는 좀 더 차분한 그림을 보여줘요.</p>
<ul>
<li><strong>미국의 VITAL 연구(2019)</strong>는 건강한 성인 약 2만 6천 명에게 하루 2,000IU의 비타민 D를 5년 넘게 먹게 했는데, 암이나 심혈관 질환 발생을 줄이지 못했어요.</li>
<li>같은 연구의 후속 분석에서는 골절 예방 효과도 뚜렷하지 않았어요. 다만 연구 대상 대부분이 처음부터 비타민 D가 부족하지 않은 사람들이었다는 한계가 있어요.</li>
<li>반면 <strong>실제로 결핍된 사람</strong>이 보충하면 뼈 건강에 도움이 된다는 점은 비교적 분명해요.</li>
</ul>
<p>정리하면, 비타민 D 보충제는 부족한 사람의 부족분을 채워주는 데 의미가 있어요. 이미 충분한 사람이 더 먹는다고 추가 효과가 생기는 건 아니에요. 그래서 막연히 고용량을 먹기보다 <strong>내 상태를 먼저 확인하는 것</strong>이 합리적이에요.</p>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>칼슘제와 같이 먹어야 하나요?</dt>
<dd>비타민 D는 칼슘 흡수를 돕기 때문에 뼈 건강이 목적이라면 칼슘도 충분히 섭취하는 게 좋아요. 다만 칼슘은 우유, 멸치, 두부, 녹색 채소 같은 음식으로 먼저 채우고, 부족할 때 보충제를 고려하는 편이 권장돼요.</dd>
<dt>아침과 저녁 중 언제 먹는 게 좋나요?</dt>
<dd>시간보다 <strong>꾸준히, 식사와 함께</strong> 먹는 게 더 중요해요. 가장 기름진 식사와 함께 먹으면 흡수에 유리해요.</dd>
<dt>여름에도 먹어야 하나요?</dt>
<dd>여름에 바깥 활동이 많다면 필요량이 줄 수 있어요. 반대로 여름에도 대부분 실내에 있다면 계절과 관계없이 부족할 수 있어요.</dd>
<dt>주사로 맞는 게 더 좋나요?</dt>
<dd>고용량 주사는 결핍이 심하거나 먹는 약의 흡수가 어려운 경우에 의사가 판단해서 써요. 결핍이 없는 사람이 주사로 맞는다고 더 좋아지지는 않아요.</dd>
</dl>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인은 하루 <strong>7~9시간</strong>, 65세 이상은 <strong>7~8시간</strong>이 권장돼요.</li>
<li>잠은 약 <strong>90분짜리 주기</strong>가 하룻밤에 4~6번 반복되는 구조예요.</li>
<li>가장 효과가 큰 습관은 <strong>매일 같은 시간에 일어나기</strong>와 <strong>아침 햇빛</strong>이에요.</li>
<li>불면이 석 달 넘게 이어지거나, 코골이 중 숨이 멈춘다는 말을 들었다면 진료를 받아보세요.</li>
</ul></div>

<h2>얼마나 자야 할까: 나이별 권장 수면 시간</h2>
<div class="tbl"><table>
<thead><tr><th>나이</th><th>권장 수면 시간</th></tr></thead>
<tbody>
<tr><td>신생아 (0~3개월)</td><td class="num">14~17시간</td></tr>
<tr><td>영아 (4~11개월)</td><td class="num">12~15시간</td></tr>
<tr><td>1~2세</td><td class="num">11~14시간</td></tr>
<tr><td>3~5세</td><td class="num">10~13시간</td></tr>
<tr><td>6~13세</td><td class="num">9~11시간</td></tr>
<tr><td>14~17세</td><td class="num">8~10시간</td></tr>
<tr><td>18~64세</td><td class="num">7~9시간</td></tr>
<tr><td>65세 이상</td><td class="num">7~8시간</td></tr>
</tbody>
<caption>미국수면재단(National Sleep Foundation) 권고</caption></table></div>
<p>개인차는 있어요. 하지만 "나는 5시간만 자도 괜찮은 체질"이라고 느끼는 사람 중 실제로 그런 경우는 매우 드물어요. 대부분은 수면 부족에 익숙해져서 떨어진 상태를 정상으로 느끼는 거예요.</p>
<p>한국은 OECD 국가 가운데 평균 수면 시간이 가장 짧은 편에 속하는 나라예요. 특히 입시를 준비하는 청소년과 직장인의 수면 부족이 두드러져요.</p>

<h2>하룻밤 잠은 어떻게 구성될까</h2>
<p>잠은 한 가지 상태가 아니라 여러 단계가 순환하는 과정이에요. 크게 <strong>비렘(NREM) 수면</strong>과 <strong>렘(REM) 수면</strong>으로 나뉘어요.</p>
<div class="tbl"><table>
<thead><tr><th>단계</th><th>특징</th><th>하는 일</th></tr></thead>
<tbody>
<tr><td>N1 (얕은 잠)</td><td>잠이 드는 몇 분. 쉽게 깨요.</td><td>깨어 있음에서 잠으로 넘어가는 다리</td></tr>
<tr><td>N2</td><td>전체 수면의 약 절반. 체온과 심박이 내려가요.</td><td>기억 정리, 특히 운동 기술 학습</td></tr>
<tr><td>N3 (깊은 잠)</td><td>깨우기 가장 어려운 단계. 뇌파가 느리고 커요.</td><td>몸의 회복, 성장호르몬 분비, 면역, 뇌 노폐물 정리</td></tr>
<tr><td>REM</td><td>눈이 빠르게 움직이고 꿈을 생생하게 꿔요. 몸 근육은 풀려 있어요.</td><td>감정 정리, 기억 통합, 창의적 연결</td></tr>
</tbody></table></div>
<p>이 네 단계가 약 <strong>90분</strong>(사람과 밤에 따라 70~120분)마다 한 바퀴씩 돌고, 하룻밤에 4~6번 반복돼요. 흥미로운 점은 <strong>주기마다 구성이 다르다</strong>는 거예요. 밤 초반에는 깊은 잠(N3)이 많고, 새벽으로 갈수록 렘수면이 길어져요.</p>
<p>그래서 늦게 자고 일찍 일어나면 잃는 것이 달라요. 6시간만 자면 뒤쪽 주기가 잘려서 주로 <strong>렘수면</strong>을 많이 잃게 돼요. 감정 조절이 어려워지고 예민해지는 이유 중 하나예요.</p>

<h2>잠이 부족하면 생기는 일</h2>
<h3>당장 다음 날</h3>
<ul>
<li><strong>집중력과 반응 속도가 떨어져요.</strong> 오래 깨어 있으면 술을 마신 것과 비슷한 수준까지 반응이 느려진다는 연구가 있어요. 졸음운전이 위험한 이유예요.</li>
<li><strong>감정 조절이 어려워져요.</strong> 부정적인 자극에 더 크게 반응해요.</li>
<li><strong>식욕이 늘어요.</strong> 배고픔 호르몬(그렐린)은 늘고 포만감 호르몬(렙틴)은 줄어서 단 음식과 고열량 음식이 당겨요.</li>
</ul>
<h3>오래 이어지면</h3>
<ul>
<li>비만, 제2형 당뇨병, 고혈압, 심혈관 질환 위험이 높아져요.</li>
<li>면역력이 떨어져 감염에 약해지고 백신 효과도 줄어든다는 연구가 있어요.</li>
<li>우울과 불안이 악화될 수 있어요. 불면과 우울은 서로를 악화시키는 관계예요.</li>
</ul>

<h2>몸 안의 두 시계: 잠이 오는 원리</h2>
<p>잠이 오는 데는 두 가지 힘이 작용해요.</p>
<ol>
<li><strong>수면 압력:</strong> 깨어 있는 동안 뇌에 아데노신이라는 물질이 쌓이면서 졸음이 커져요. 자는 동안 정리돼요.</li>
<li><strong>생체 시계:</strong> 약 24시간 주기로 돌아가는 몸의 시계예요. 빛, 특히 <strong>아침 햇빛</strong>으로 매일 다시 맞춰져요. 저녁이 되어 어두워지면 멜라토닌이 분비되며 잠잘 준비를 해요.</li>
</ol>
<p>이 원리를 알면 수면 습관이 왜 효과가 있는지 이해돼요. <strong>카페인</strong>은 아데노신이 작용하지 못하게 막아서 졸음을 가려요. <strong>밤늦은 밝은 빛</strong>은 생체 시계에 "아직 낮"이라는 신호를 줘요. <strong>긴 낮잠</strong>은 쌓여야 할 수면 압력을 미리 풀어버려요.</p>

<h2>과학적으로 검증된 수면 습관</h2>
<div class="tbl"><table>
<thead><tr><th>습관</th><th>이유</th></tr></thead>
<tbody>
<tr><td><strong>매일 같은 시간에 일어나기</strong> (주말 포함)</td><td>생체 시계를 고정하는 가장 강력한 방법이에요. 자는 시간보다 일어나는 시간이 더 중요해요.</td></tr>
<tr><td>아침에 햇빛 쬐기</td><td>생체 시계를 맞추고, 밤에 멜라토닌이 제때 나오게 해요. 흐린 날 바깥 빛도 실내 조명보다 훨씬 밝아요.</td></tr>
<tr><td>오후 이후 카페인 피하기</td><td>카페인의 반감기는 평균 약 5시간(사람에 따라 2~10시간)이에요. 오후 3시에 마신 커피의 절반이 밤 8시에도 남아 있어요.</td></tr>
<tr><td>잠자리 전 술 피하기</td><td>술은 잠드는 건 돕지만 밤 후반의 잠을 얕게 쪼개고 렘수면을 줄여요.</td></tr>
<tr><td>늦은 저녁 과식 피하기</td><td>소화 활동과 역류가 잠을 방해해요. 잠들기 2~3시간 전에는 식사를 마쳐요.</td></tr>
<tr><td>규칙적으로 운동하기</td><td>깊은 잠을 늘려요. 다만 잠들기 직전의 격한 운동은 피해요.</td></tr>
<tr><td>침실은 어둡고 조용하고 서늘하게</td><td>잠들 때 체온이 내려가야 해요. 조금 서늘하다 싶은 온도가 잠들기 좋아요.</td></tr>
<tr><td>자기 전 1시간은 화면 줄이기</td><td>빛뿐 아니라 내용 자체가 뇌를 깨워요. 알림을 끄고 휴대폰을 침대에서 멀리 둬요.</td></tr>
<tr><td>낮잠은 20~30분, 오후 3시 전에</td><td>짧은 낮잠은 개운하지만, 길거나 늦은 낮잠은 밤잠을 방해해요.</td></tr>
</tbody></table></div>

<h2>잠이 안 올 때 침대에서 버티지 않기</h2>
<p>불면이 있는 사람이 가장 흔히 하는 실수는 <strong>잠이 안 와도 침대에 계속 누워 있는 것</strong>이에요. 이렇게 되면 뇌가 '침대 = 뒤척이며 걱정하는 곳'으로 학습해요.</p>
<ol>
<li>누운 지 20분쯤 지나도 잠이 안 오면 (시계를 보지 말고 느낌으로) 일어나요.</li>
<li>어두운 조명 아래서 지루한 일을 해요. 종이책 읽기, 빨래 개기 같은 것이요.</li>
<li>졸음이 오면 다시 침대로 가요.</li>
<li>침대에서는 잠자는 것 말고 다른 일(휴대폰, 업무, 영상)을 하지 않아요.</li>
</ol>
<p>이 방법은 <strong>자극 조절법</strong>이라고 불리며, 불면증 인지행동치료(CBT-I)의 핵심 요소 중 하나예요.</p>

<h2>불면증: 언제 치료가 필요할까</h2>
<p>잠들기 어렵거나, 자다가 자주 깨거나, 너무 일찍 깨서 다시 잠들지 못하는 일이 <strong>일주일에 3번 이상, 3개월 넘게</strong> 이어지고 낮 생활에 지장을 준다면 만성 불면증으로 볼 수 있어요.</p>
<h3>1차 치료는 수면제가 아니라 인지행동치료</h3>
<p>국내외 진료지침은 만성 불면증의 1차 치료로 <strong>불면증 인지행동치료(CBT-I)</strong>를 권해요. 보통 4~8회 정도의 상담으로 진행하며 이런 내용을 다뤄요.</p>
<ul>
<li><strong>수면 제한:</strong> 침대에 있는 시간을 실제로 자는 시간에 맞춰 줄여서 수면 압력을 높여요.</li>
<li><strong>자극 조절:</strong> 앞에서 설명한 침대와 잠의 연결 다시 만들기</li>
<li><strong>인지 교정:</strong> "오늘 못 자면 내일 망한다" 같은 생각이 긴장을 키우는 고리를 끊어요.</li>
<li><strong>수면 위생 교육과 이완 훈련</strong></li>
</ul>
<p>효과가 나타나기까지 몇 주가 걸리지만, 치료를 마친 뒤에도 효과가 오래 유지된다는 장점이 있어요. 수면제는 단기간 도움이 될 수 있지만 반드시 의사의 처방과 지시에 따라 써야 해요.</p>
<div class="box note"><span class="h">멜라토닌에 대해</span>
<p>해외에서는 멜라토닌을 영양제처럼 사지만, 국내에서는 <strong>전문의약품</strong>이라 의사의 처방이 필요해요. 해외 직구 제품은 함량이 표시와 다른 경우도 보고되니 주의가 필요해요. 멜라토닌은 수면제라기보다 생체 시계를 조정하는 신호에 가까워서, 시차 적응이나 생체 리듬 문제에 더 잘 맞아요.</p></div>

<h2>코골이와 수면무호흡: 놓치기 쉬운 병</h2>
<p><strong>폐쇄성 수면무호흡</strong>은 자는 동안 목 안의 기도가 좁아지거나 막혀서 숨이 반복적으로 멈추는 병이에요. 숨이 멈출 때마다 뇌가 잠깐씩 깨서 숨을 쉬게 하기 때문에, 본인은 모르지만 잠이 계속 조각나요.</p>
<h3>이런 신호가 있다면 의심해 보세요</h3>
<ul>
<li>코를 심하게 골고, 숨이 멈췄다가 컥 하며 다시 쉰다는 말을 들었어요.</li>
<li>충분히 자도 낮에 심하게 졸려요. 회의나 운전 중에 졸아요.</li>
<li>아침에 두통이 있거나 입이 바싹 말라 있어요.</li>
<li>밤에 소변 때문에 자주 깨요.</li>
<li>혈압이 잘 조절되지 않아요.</li>
</ul>
<p>수면무호흡은 고혈압, 부정맥, 뇌졸중, 당뇨병 위험을 높이고 졸음운전 사고의 원인이 되기도 해요. 진단은 하룻밤 병원에서 자며 뇌파, 호흡, 산소포화도 등을 재는 <strong>수면다원검사</strong>로 해요. 국내에서는 2018년부터 수면다원검사와 양압기 치료에 건강보험이 적용되고 있어요.</p>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>주말에 몰아서 자면 평일 부족분이 채워지나요?</dt>
<dd>어느 정도 피로는 풀리지만 완전히 되돌리지는 못해요. 게다가 주말에 늦게 일어나면 생체 시계가 뒤로 밀려서 일요일 밤에 잠들기 어려워지고 월요일 아침이 더 힘들어져요. 이를 '사회적 시차'라고 해요. 주말에도 평소보다 1~2시간 이상 늦게 일어나지 않는 게 좋아요.</dd>
<dt>자다가 한두 번 깨는 건 문제인가요?</dt>
<dd>밤중에 잠깐 깨는 건 정상이에요. 수면 주기가 바뀔 때 누구나 짧게 깨요. 다시 쉽게 잠들고 낮에 피곤하지 않다면 걱정하지 않아도 돼요.</dd>
<dt>잠들기 전 휴대폰을 야간 모드로 보면 괜찮나요?</dt>
<dd>블루라이트를 줄이는 효과는 조금 있지만, 흥미로운 내용이 뇌를 깨우는 문제는 그대로예요. 화면 자체를 줄이는 게 더 효과적이에요.</dd>
<dt>나이가 들면 잠이 줄어드는 게 정상인가요?</dt>
<dd>나이가 들수록 깊은 잠이 줄고 자주 깨며, 일찍 자고 일찍 일어나는 쪽으로 리듬이 바뀌는 건 자연스러운 변화예요. 하지만 필요한 수면 시간 자체가 크게 줄어드는 건 아니어서, 낮 생활에 지장이 있다면 확인해 보는 게 좋아요.</dd>
</dl>

<p class="lead">당뇨병은 혈당이 높은 병이라기보다, 높은 혈당이 오랫동안 온몸의 혈관을 조금씩 상하게 하는 병이에요. 그래서 진단받은 날보다 그 뒤 10년, 20년의 관리가 더 중요해요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>공복혈당 <strong>126mg/dL 이상</strong> 또는 당화혈색소 <strong>6.5% 이상</strong>이면 당뇨병으로 진단해요.</li>
<li>공복혈당 100~125, 당화혈색소 5.7~6.4%는 <strong>당뇨병 전단계</strong>예요. 이때 생활습관을 바꾸면 진행을 크게 늦출 수 있어요.</li>
<li>체중의 <strong>5~7%</strong>만 줄여도 당뇨병 발생 위험이 절반 가까이 줄었다는 대규모 연구가 있어요.</li>
<li>합병증은 증상 없이 진행해요. 눈, 콩팥, 발 검사를 <strong>해마다</strong> 받아요.</li>
</ul></div>

<h2>혈당은 왜 오를까</h2>
<p>밥이나 빵 같은 탄수화물을 먹으면 소화되어 포도당이 되고 혈액으로 들어가요. 이때 췌장에서 <strong>인슐린</strong>이 나와 포도당을 근육, 간, 지방 세포 안으로 들여보내요. 인슐린은 세포의 문을 여는 열쇠 같은 역할을 해요.</p>
<p>당뇨병은 이 열쇠가 부족하거나(인슐린 분비 저하), 열쇠를 꽂아도 문이 잘 열리지 않을 때(인슐린 저항성) 생겨요. 포도당이 세포 안으로 들어가지 못하고 혈액에 남아서 혈당이 높게 유지돼요.</p>
<div class="tbl"><table>
<thead><tr><th>유형</th><th>원인</th><th>특징</th></tr></thead>
<tbody>
<tr><td>제1형</td><td>면역 이상으로 인슐린을 만드는 세포가 파괴됨</td><td>주로 어린 나이에 시작, 인슐린 주사가 반드시 필요</td></tr>
<tr><td>제2형</td><td>인슐린 저항성과 분비 저하가 함께 진행</td><td>국내 당뇨병의 대부분(90% 이상), 비만·나이·가족력과 관련</td></tr>
<tr><td>임신성</td><td>임신 중 호르몬 변화로 인슐린 저항성 증가</td><td>출산 후 대개 회복되지만 나중에 제2형 위험이 높아짐</td></tr>
</tbody></table></div>

<h2>진단 기준: 숫자 읽는 법</h2>
<div class="tbl"><table>
<thead><tr><th>검사</th><th>정상</th><th>당뇨병 전단계</th><th>당뇨병</th></tr></thead>
<tbody>
<tr><td>공복혈당 (8시간 이상 금식)</td><td class="num">100 미만</td><td class="num">100~125</td><td class="num">126 이상</td></tr>
<tr><td>당화혈색소 (HbA1c)</td><td class="num">5.7% 미만</td><td class="num">5.7~6.4%</td><td class="num">6.5% 이상</td></tr>
<tr><td>경구 포도당 부하 2시간 혈당</td><td class="num">140 미만</td><td class="num">140~199</td><td class="num">200 이상</td></tr>
</tbody>
<caption>대한당뇨병학회 진료지침 기준, 혈당 단위 mg/dL. 당뇨병은 원칙적으로 다른 날 다시 확인해요.</caption></table></div>
<p><strong>당화혈색소</strong>는 적혈구의 혈색소에 포도당이 얼마나 붙어 있는지를 보는 검사예요. 적혈구는 약 120일을 살기 때문에, 이 수치는 <strong>지난 2~3개월의 평균 혈당</strong>을 반영해요. 전날 식사에 크게 흔들리지 않아서 관리 상태를 보는 데 가장 많이 써요.</p>
<p>갈증, 잦은 소변, 이유 없는 체중 감소 같은 전형적인 증상이 있으면서 아무 때나 잰 혈당이 200mg/dL 이상이면 한 번의 검사로도 진단할 수 있어요.</p>

<h2>얼마나 흔할까</h2>
<p>대한당뇨병학회의 자료에 따르면 국내 30세 이상 성인의 약 15~16%, 여섯 명 중 한 명 정도가 당뇨병이에요. 여기에 전단계까지 더하면 30세 이상 성인의 절반을 넘어요. 그런데 당뇨병이 있는 사람 가운데 상당수가 자신이 당뇨병인 줄 모르고, 알고 있어도 목표 수준으로 조절되는 비율은 높지 않아요.</p>

<h2>증상이 없을 때가 더 많다</h2>
<p>혈당이 아주 높으면 많이 마시고(다음), 많이 먹고(다식), 소변을 자주 보는(다뇨) 증상이 나타나요. 넘친 포도당이 소변으로 빠져나가면서 물을 함께 끌고 나가기 때문이에요. 하지만 초기 제2형 당뇨병은 <strong>대부분 증상이 없어서</strong> 건강검진에서 우연히 발견되는 경우가 많아요.</p>
<p>이런 경우는 증상이 없어도 정기적으로 검사를 받는 게 좋아요.</p>
<ul>
<li>35세 이상 성인 (국내 진료지침은 35세 이상 모든 성인에게 선별검사를 권해요)</li>
<li>과체중이나 복부비만이 있는 경우</li>
<li>부모나 형제가 당뇨병인 경우</li>
<li>고혈압, 이상지질혈증이 있는 경우</li>
<li>임신성 당뇨병을 앓았던 경우</li>
</ul>

<h2>합병증: 혈관이 상하는 병</h2>
<p>높은 혈당은 혈관 안쪽 벽을 손상시켜요. 가는 혈관이 많은 곳부터, 그리고 큰 혈관까지 영향을 받아요.</p>
<div class="tbl"><table>
<thead><tr><th>부위</th><th>합병증</th><th>확인하는 검사</th></tr></thead>
<tbody>
<tr><td>눈</td><td>당뇨병성 망막병증 (실명의 주요 원인)</td><td>안저 검사, 해마다</td></tr>
<tr><td>콩팥</td><td>당뇨병성 콩팥병 (투석의 가장 흔한 원인)</td><td>소변 알부민, 혈액 크레아티닌, 해마다</td></tr>
<tr><td>신경</td><td>손발 저림, 감각 저하, 소화·배뇨 이상</td><td>발 감각 검사, 해마다</td></tr>
<tr><td>발</td><td>상처가 잘 낫지 않는 당뇨발, 심하면 절단</td><td>매일 스스로 발 살피기</td></tr>
<tr><td>큰 혈관</td><td>심근경색, 뇌졸중, 말초동맥 질환</td><td>혈압·콜레스테롤 관리, 필요시 심혈관 검사</td></tr>
</tbody></table></div>
<p>당뇨병 관리가 혈당만의 문제가 아닌 이유가 여기 있어요. <strong>혈압과 콜레스테롤</strong>을 함께 조절해야 심혈관 합병증을 막을 수 있고, <strong>금연</strong>은 그 어떤 약보다 혈관을 지키는 효과가 커요.</p>

<h2>전단계에서 되돌리는 법</h2>
<p>미국에서 당뇨병 전단계인 사람 3천여 명을 대상으로 한 <strong>당뇨병 예방 프로그램(DPP) 연구</strong>는 중요한 결과를 보여줬어요. 체중을 약 7% 줄이고 일주일에 150분 운동하도록 도운 그룹은, 그렇지 않은 그룹보다 당뇨병 발생이 <strong>58% 적었어요.</strong> 약을 먹은 그룹보다도 효과가 컸어요.</p>
<h3>식사</h3>
<ul>
<li><strong>양을 먼저 줄여요.</strong> 무엇을 먹느냐만큼 얼마나 먹느냐가 중요해요.</li>
<li><strong>흰쌀밥, 흰 빵, 면 대신 잡곡과 통곡물</strong>로 조금씩 바꿔요. 식이섬유가 혈당이 오르는 속도를 늦춰요.</li>
<li><strong>채소와 단백질 반찬을 먼저</strong> 먹고 밥을 나중에 먹으면 식후 혈당이 덜 오른다는 연구가 있어요.</li>
<li><strong>단 음료를 끊는 것</strong>이 가장 효과가 큰 한 가지예요. 과일주스도 마찬가지예요.</li>
</ul>
<h3>운동</h3>
<ul>
<li>빠르게 걷기 같은 유산소 운동을 일주일에 150분 이상, <strong>이틀 넘게 연속으로 쉬지 않게</strong> 나눠 해요.</li>
<li>근력 운동을 일주일에 2~3번 더해요. 근육은 포도당을 가장 많이 쓰는 곳이라 근육이 늘면 인슐린이 더 잘 들어요.</li>
<li>식사 후 10~15분 걷기만 해도 식후 혈당이 덜 올라요.</li>
</ul>

<h2>치료: 약은 어떻게 쓰나</h2>
<p>제2형 당뇨병은 생활습관 관리와 함께 먹는 약으로 시작하는 경우가 많아요. 대표적인 약은 이래요.</p>
<ul>
<li><strong>메트포르민:</strong> 간에서 포도당이 만들어지는 것을 줄여요. 오래 쓰인 기본 약이에요.</li>
<li><strong>SGLT2 억제제:</strong> 콩팥에서 포도당을 소변으로 더 내보내요. 심장과 콩팥을 보호하는 효과가 확인됐어요.</li>
<li><strong>DPP-4 억제제:</strong> 식사 후 인슐린 분비를 돕는 호르몬이 오래 작용하게 해요.</li>
<li><strong>GLP-1 수용체 작용제:</strong> 주로 주사제로, 혈당을 낮추고 식욕을 줄여 체중 감소에도 도움이 돼요.</li>
<li><strong>인슐린:</strong> 제1형에는 필수이고, 제2형에서도 혈당이 많이 높거나 다른 약으로 조절되지 않을 때 써요.</li>
</ul>
<p>관리 목표는 사람마다 달라요. 국내 진료지침은 제2형 당뇨병 성인의 당화혈색소 목표를 일반적으로 <strong>6.5% 미만</strong>으로 제시하지만, 나이가 많거나 저혈당 위험이 큰 사람은 더 여유 있게 잡아요.</p>

<h2>저혈당: 반드시 알아둘 응급 대처</h2>
<p>약이나 인슐린을 쓰는 사람은 혈당이 너무 떨어지는 <strong>저혈당</strong>을 겪을 수 있어요. 혈당이 70mg/dL 아래로 내려가면 식은땀, 떨림, 가슴 두근거림, 심한 배고픔, 어지러움이 나타나요.</p>
<div class="box warn"><span class="h">저혈당 대처: 15-15 규칙</span>
<ol>
<li>빨리 흡수되는 당분 <strong>15g</strong>을 먹어요. 주스나 일반 콜라 반 컵(약 150~200mL), 설탕 한 큰술, 사탕 3~4개 정도예요.</li>
<li><strong>15분</strong> 뒤 혈당을 다시 재요.</li>
<li>여전히 70mg/dL 아래라면 한 번 더 반복해요.</li>
<li>회복되면 다음 식사가 한 시간 넘게 남았을 때 간단한 간식을 먹어요.</li>
</ol>
<p>의식이 흐려지거나 삼키지 못하면 입에 음식을 넣지 말고 바로 119에 연락해요. 초콜릿처럼 지방이 많은 간식은 흡수가 느려서 저혈당 응급 대처에는 맞지 않아요.</p></div>

<h2>매일 하는 관리</h2>
<div class="box"><span class="h">당뇨병 관리 체크리스트</span>
<ol>
<li>처방받은 대로 약 먹기, 혈당 측정이 필요하면 기록하기</li>
<li>하루 한 번 발 살피기: 상처, 물집, 색 변화, 발톱 이상</li>
<li>맨발로 다니지 않고 발에 맞는 신발 신기</li>
<li>3개월마다 당화혈색소 확인하기 (안정되면 6개월마다)</li>
<li>해마다 안저 검사, 소변 알부민 검사 받기</li>
<li>혈압 재기, 콜레스테롤 수치 확인하기</li>
<li>외출할 때 사탕이나 포도당 알약 챙기기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>과일은 먹으면 안 되나요?</dt>
<dd>먹어도 돼요. 과일에는 식이섬유와 비타민이 있어요. 다만 한 번에 많이 먹지 말고 사과라면 반 개, 귤이라면 한두 개 정도로 양을 정해요. 주스나 말린 과일은 당이 농축돼 있어서 피하는 게 좋아요.</dd>
<dt>당뇨병 전단계라는데 약을 먹어야 하나요?</dt>
<dd>대부분 생활습관 개선이 먼저예요. 다만 위험이 큰 경우 의사가 약을 고려하기도 해요. 전단계는 경고등이지 병이 확정된 게 아니라서, 이때 움직이는 것이 가장 효과적이에요.</dd>
<dt>한번 당뇨병이면 평생 가나요?</dt>
<dd>제2형 당뇨병은 초기에 체중을 크게 줄이면 약 없이 정상 범위로 돌아오는 경우가 있어요. 이를 '관해'라고 해요. 다만 완치라기보다 잘 조절된 상태라서 계속 관리하고 정기 검사를 받아야 해요.</dd>
<dt>설탕만 안 먹으면 되나요?</dt>
<dd>밥, 빵, 면, 떡 같은 탄수화물도 모두 포도당이 돼요. 설탕만 끊고 밥 양은 그대로라면 혈당이 기대만큼 내려가지 않아요. 전체 식사량과 탄수화물의 질을 함께 봐야 해요.</dd>
</dl>

</ul></div>

<h2>철분은 몸에서 무슨 일을 할까</h2>
<p>몸속 철분의 대부분은 적혈구의 <strong>헤모글로빈</strong>에 들어 있어요. 헤모글로빈은 폐에서 산소를 받아 온몸으로 나르는 단백질인데, 그 중심에 철이 자리 잡고 산소와 결합해요. 근육에서 산소를 저장하는 미오글로빈, 에너지를 만드는 효소에도 철이 필요해요.</p>
<p>몸은 철을 적극적으로 내보내는 방법이 거의 없어요. 그래서 <strong>장에서 흡수하는 양을 조절</strong>해서 균형을 맞춰요. 철이 부족하면 흡수를 늘리고, 충분하면 흡수를 줄여요. 한편 피를 흘리면 철도 함께 잃기 때문에, 출혈은 철 결핍의 가장 중요한 원인이에요.</p>

<h2>하루에 얼마나 필요할까</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th>권장섭취량</th><th>이유</th></tr></thead>
<tbody>
<tr><td>성인 남성 (19~64세)</td><td class="num">10mg</td><td></td></tr>
<tr><td>여성 (19~49세)</td><td class="num">14mg</td><td>월경으로 잃는 철을 채워야 해요</td></tr>
<tr><td>여성 (50세 이상)</td><td class="num">8mg 안팎</td><td>폐경 후 필요량이 줄어요</td></tr>
<tr><td>임신부</td><td class="num">24mg</td><td>혈액량이 늘고 태아에게 철을 공급해요</td></tr>
<tr><td>상한섭취량 (성인)</td><td class="num">45mg</td><td>보충제를 포함한 전체 섭취 기준</td></tr>
</tbody>
<caption>보건복지부·한국영양학회, 2020 한국인 영양소 섭취기준</caption></table></div>

<h2>헴철과 비헴철: 같은 철이 아니다</h2>
<div class="tbl"><table>
<thead><tr><th>구분</th><th>들어 있는 식품</th><th>흡수율 (대략)</th></tr></thead>
<tbody>
<tr><td>헴철</td><td>소고기, 돼지고기, 간, 선지, 생선, 조개류</td><td class="num">15~35%</td></tr>
<tr><td>비헴철</td><td>콩, 두부, 시금치 같은 채소, 곡류, 달걀, 철 강화 식품, 보충제</td><td class="num">2~20%</td></tr>
</tbody></table></div>
<p>헴철은 다른 음식의 영향을 거의 받지 않고 꾸준히 흡수돼요. 비헴철은 함께 먹는 음식에 따라 흡수율이 몇 배씩 달라져요. 그래서 채식을 하는 사람은 철이 든 음식을 먹는 것만큼 <strong>어떻게 조합하느냐</strong>가 중요해요.</p>
<p>식품별 대략적인 함량은 이래요.</p>
<div class="tbl"><table>
<thead><tr><th>식품</th><th>분량</th><th>철 (약)</th><th>종류</th></tr></thead>
<tbody>
<tr><td>굴 (익힌 것)</td><td>85g</td><td class="num">8mg</td><td>헴철 포함</td></tr>
<tr><td>흰강낭콩 (익힌 것)</td><td>1컵</td><td class="num">8mg</td><td>비헴철</td></tr>
<tr><td>소 간</td><td>85g</td><td class="num">5mg</td><td>헴철 포함</td></tr>
<tr><td>렌틸콩 (익힌 것)</td><td>½컵</td><td class="num">3mg</td><td>비헴철</td></tr>
<tr><td>시금치 (데친 것)</td><td>½컵</td><td class="num">3mg</td><td>비헴철</td></tr>
<tr><td>두부 (단단한 것)</td><td>½컵</td><td class="num">3mg</td><td>비헴철</td></tr>
<tr><td>소고기</td><td>85g</td><td class="num">2mg</td><td>헴철 포함</td></tr>
<tr><td>정어리 통조림</td><td>85g</td><td class="num">2mg</td><td>헴철 포함</td></tr>
</tbody>
<caption>미국 국립보건원 식이보충제국(ODS) 자료 기준. 조리법과 품종에 따라 달라요.</caption></table></div>
<p>시금치는 "철분의 왕"으로 알려져 있지만, 옥살산이 많아 실제 흡수되는 양은 적은 편이에요. 철분 공급원으로는 조개류, 붉은 고기, 콩류가 더 효율적이에요.</p>

<h2>흡수를 돕는 것, 막는 것</h2>
<div class="tbl"><table>
<thead><tr><th>돕는 것</th><th>막는 것</th></tr></thead>
<tbody>
<tr><td><strong>비타민 C</strong> (귤, 키위, 딸기, 파프리카, 브로콜리)</td><td><strong>차와 커피</strong>의 폴리페놀, 탄닌</td></tr>
<tr><td>고기나 생선을 조금 곁들이기</td><td><strong>칼슘</strong> (우유, 칼슘 보충제)</td></tr>
<tr><td>발효나 불린 곡류·콩</td><td>통곡물과 콩의 <strong>피트산</strong></td></tr>
<tr><td></td><td>위산을 줄이는 약 (장기 복용 시)</td></tr>
</tbody></table></div>
<h3>실천하기 쉬운 조합</h3>
<ul>
<li>시금치나물이나 두부 반찬에 <strong>파프리카나 과일을 곁들이기</strong></li>
<li>식사 후 커피와 녹차는 <strong>한두 시간 뒤</strong>로 미루기</li>
<li>철분제를 먹는다면 칼슘제나 우유와 <strong>시간을 떼어</strong> 먹기</li>
</ul>

<h2>철이 부족하면 어떤 순서로 나빠질까</h2>
<p>철 결핍은 한 번에 빈혈로 오지 않아요. 세 단계를 거쳐요.</p>
<ol>
<li><strong>저장철 감소:</strong> 간 등에 저장된 철(페리틴)이 줄어요. 아직 헤모글로빈은 정상이라 일반 혈액검사에서 잘 드러나지 않아요.</li>
<li><strong>철 결핍:</strong> 적혈구를 만들 철이 모자라기 시작해요.</li>
<li><strong>철결핍 빈혈:</strong> 헤모글로빈이 기준 아래로 떨어져요. 세계보건기구는 성인 남성 13g/dL, 임신하지 않은 성인 여성 12g/dL 미만을 빈혈로 봐요.</li>
</ol>
<p>그래서 헤모글로빈이 정상이어도 피곤함이 계속된다면 <strong>페리틴 검사</strong>를 함께 해보는 게 도움이 될 수 있어요.</p>
<h3>이런 증상이 나타날 수 있어요</h3>
<ul>
<li>쉽게 피곤하고 숨이 차요. 계단을 오를 때 가슴이 두근거려요.</li>
<li>얼굴과 눈 아래 결막이 창백해요.</li>
<li>손톱이 얇아지고 잘 부서지거나 숟가락처럼 오목해져요.</li>
<li>얼음이나 흙처럼 음식이 아닌 것을 씹고 싶어져요(이식증).</li>
<li>밤에 다리가 불편해 움직이고 싶어지는 하지불안 증상이 생기거나 심해져요.</li>
</ul>

<h2>왜 부족해질까: 원인 찾기가 먼저</h2>
<ul>
<li><strong>월경량이 많은 경우:</strong> 가임기 여성 철 결핍의 가장 흔한 원인이에요. 생리가 7일 넘게 이어지거나 한두 시간마다 패드를 갈아야 한다면 산부인과 진료가 필요해요.</li>
<li><strong>임신과 수유</strong></li>
<li><strong>위장관 출혈:</strong> 위궤양, 치질, 대장 용종이나 대장암처럼 눈에 띄지 않게 조금씩 피가 나는 경우예요.</li>
<li><strong>흡수 문제:</strong> 위 절제 수술, 셀리악병, 헬리코박터 감염, 위산 억제제 장기 복용</li>
<li><strong>섭취 부족:</strong> 극단적인 다이어트, 균형이 맞지 않는 채식</li>
<li><strong>잦은 헌혈이나 격한 운동</strong></li>
</ul>
<div class="box warn"><span class="h">남성과 폐경 후 여성의 빈혈은 그냥 넘기지 마세요</span>
<p>이들은 월경으로 철을 잃지 않기 때문에, 철결핍 빈혈이 있다면 <strong>위장관 어딘가에서 출혈이 있을 가능성</strong>을 먼저 생각해요. 철분제만 먹고 끝내지 말고 위·대장 내시경 등으로 원인을 확인하는 게 중요해요. 검은 변이나 피가 섞인 변이 보이면 바로 진료를 받아요.</p></div>

<h2>철분제 제대로 먹는 법</h2>
<p>철결핍이 확인됐다면 음식만으로 채우기는 어려워서 보충제를 쓰는 경우가 많아요.</p>
<ul>
<li><strong>빈속에 먹으면 흡수가 가장 좋아요.</strong> 하지만 속쓰림, 메스꺼움, 변비가 생기기 쉬워서, 불편하면 식후에 먹어도 돼요. 꾸준히 먹는 것이 더 중요해요.</li>
<li><strong>비타민 C가 든 음식이나 주스와 함께</strong> 먹으면 흡수를 도와요.</li>
<li><strong>하루걸러 먹는 방법</strong>도 연구되고 있어요. 철을 먹으면 흡수를 막는 호르몬(헵시딘)이 하루 가까이 올라가서, 격일로 먹었을 때 흡수율이 더 좋았다는 연구가 있어요. 복용 방법은 의사와 상의해요.</li>
<li><strong>변이 검게 변하는 건 정상이에요.</strong> 흡수되지 않은 철 때문이에요. 다만 끈적하고 냄새가 심한 짜장면 같은 검은 변은 출혈일 수 있으니 구분해요.</li>
<li><strong>효과 확인:</strong> 보통 몇 주 안에 헤모글로빈이 오르기 시작하지만, 저장철까지 채우려면 빈혈이 회복된 뒤에도 몇 달 더 먹는 경우가 많아요.</li>
</ul>
<div class="box note"><span class="h">철분은 많을수록 좋은 영양소가 아니에요</span>
<p>몸이 철을 잘 내보내지 못하기 때문에, 부족하지 않은 사람이 오래 과하게 먹으면 쌓일 수 있어요. 유전적으로 철이 과도하게 흡수되는 <strong>혈색소침착증</strong>이 있는 사람은 특히 위험해요. 또 어린아이가 어른의 철분제를 여러 알 삼키면 <strong>급성 중독</strong>이 생길 수 있으니 반드시 손이 닿지 않는 곳에 보관해요.</p></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>철분제를 먹고 변비가 심해요.</dt>
<dd>흔한 부작용이에요. 물과 식이섬유를 충분히 먹고, 식후로 시간을 바꾸거나, 의사와 상의해 용량이나 제형(철 성분의 종류)을 바꿔볼 수 있어요.</dd>
<dt>빈혈이 아니라는데 철분제를 먹어도 되나요?</dt>
<dd>검사로 부족함이 확인되지 않았다면 굳이 먹을 필요는 없어요. 특히 남성과 폐경 후 여성은 과잉 섭취가 되기 쉬워요. 종합비타민에 든 소량의 철은 대개 문제 되지 않아요.</dd>
<dt>채식을 하는데 철분이 걱정돼요.</dt>
<dd>콩류, 두부, 통곡물, 짙은 녹색 채소를 충분히 먹고 비타민 C가 든 채소나 과일을 끼니마다 곁들여요. 채식을 하는 사람은 권장량의 1.8배 정도가 필요하다는 의견도 있어서, 정기적으로 검사해 보는 게 좋아요.</dd>
</dl>

  data-title="걷기의 과학: 하루 몇 보가 적당할까, 얼마나 빠르게 걸어야 할까"
  data-thumb="150분|주간 목표"
  data-summary="만 보라는 숫자는 어디서 왔고, 연구는 뭐라고 말할까요. 세계보건기구의 신체활동 권고, 중강도 운동을 알아보는 법, 나이별로 효과가 나타나는 걸음 수, 부상 없이 걷는 자세까지 정리했어요."
  data-tags="걷기,유산소운동,만보,신체활동,운동습관">
<p class="lead">걷기는 장비도 비용도 거의 들지 않는 운동이에요. 그런데 "얼마나, 어떻게"를 조금만 알면 같은 시간을 걸어도 얻는 것이 꽤 달라져요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>성인은 일주일에 <strong>중강도 150~300분</strong> 또는 고강도 75~150분의 유산소 활동이 권장돼요.</li>
<li>중강도는 <strong>말은 할 수 있지만 노래는 어려운</strong> 정도예요. 걸음으로는 대략 분당 100보 이상이에요.</li>
<li>연구에서 사망 위험 감소 효과는 60세 이상은 하루 <strong>6천~8천 보</strong>, 60세 미만은 <strong>8천~1만 보</strong> 근처에서 대체로 평평해졌어요.</li>
<li>걷기에 더해 <strong>근력 운동을 일주일에 2일 이상</strong> 하는 것이 권장돼요.</li>
</ul></div>

<h2>권장 운동량: 세계보건기구 기준</h2>
<div class="tbl"><table>
<thead><tr><th>대상</th><th>유산소 활동</th><th>근력 운동</th><th>추가 권고</th></tr></thead>
<tbody>
<tr><td>성인 (18~64세)</td><td>주 150~300분 중강도 또는 75~150분 고강도</td><td>주 2일 이상</td><td>앉아 있는 시간 줄이기</td></tr>
<tr><td>65세 이상</td><td>성인과 같음</td><td>주 2일 이상</td><td>균형 운동을 포함해 주 3일 이상 다양한 활동</td></tr>
<tr><td>어린이·청소년 (5~17세)</td><td>하루 평균 60분 이상 중강도 이상</td><td>주 3일 이상</td><td>화면 앞 여가 시간 줄이기</td></tr>
</tbody>
<caption>세계보건기구(WHO) 신체활동 및 좌식행동 지침(2020). 보건복지부 한국인 신체활동 지침도 같은 기준을 따라요.</caption></table></div>
<p>하루 30분씩 5일이면 150분이에요. 한 번에 몰아서 할 필요도 없어요. 2020년 지침부터는 "10분 이상 이어서 해야 한다"는 조건이 빠졌어요. <strong>짧게 여러 번 움직여도 모두 더해진다</strong>는 뜻이에요.</p>

<h2>'중강도'는 어느 정도일까</h2>
<p>운동의 강도는 몇 가지 방법으로 가늠할 수 있어요.</p>
<div class="tbl"><table>
<thead><tr><th>방법</th><th>중강도</th><th>고강도</th></tr></thead>
<tbody>
<tr><td>말하기 검사</td><td>대화는 되지만 노래는 어려움</td><td>몇 마디 이상 말하기 어려움</td></tr>
<tr><td>걸음 속도</td><td>분당 약 100보 이상</td><td>분당 약 130보 이상 (빠른 걷기, 가벼운 달리기)</td></tr>
<tr><td>심박수</td><td>최대심박수의 약 64~76%</td><td>최대심박수의 약 77~93%</td></tr>
<tr><td>느낌 (0~10점)</td><td>5~6점</td><td>7~8점</td></tr>
</tbody>
<caption>최대심박수는 흔히 '220 − 나이'로 어림해요. 심박수 구간은 미국 질병통제예방센터(CDC) 기준.</caption></table></div>
<p>예를 들어 50세라면 최대심박수는 약 170회, 중강도 구간은 분당 약 109~129회예요. 다만 혈압약 중 베타 차단제를 먹는 사람은 심박수가 잘 오르지 않아서 말하기 검사나 느낌으로 판단하는 게 더 정확해요.</p>
<p>분당 100보는 1초에 두 걸음이 조금 안 되는 속도예요. 스마트폰으로 1분 동안 걸음 수를 세어보면 내 평소 속도를 알 수 있어요. 산책하듯 걷는 속도는 대개 이보다 느려요.</p>

<h2>만 보는 어디서 왔을까</h2>
<p>'하루 만 보'는 과학 연구가 아니라 1960년대 일본에서 나온 만보계 이름에서 널리 퍼진 숫자라는 이야기가 잘 알려져 있어요. 그 뒤 연구자들이 실제로 걸음 수와 건강의 관계를 조사했어요.</p>
<ul>
<li>미국 고령 여성을 추적한 연구(2019)에서는 하루 약 4,400보만 걸어도 가장 적게 걷는 그룹보다 사망 위험이 낮았고, 약 7,500보 근처에서 효과가 더 늘지 않았어요.</li>
<li>여러 나라 연구를 모은 분석(2022)에서는 <strong>60세 이상은 하루 6천~8천 보, 60세 미만은 8천~1만 보</strong> 근처에서 사망 위험 감소 효과가 평평해졌어요.</li>
</ul>
<p>정리하면 <strong>만 보가 꼭 필요한 문턱은 아니에요.</strong> 지금 하루 3천 보를 걷는 사람이라면 5천 보로 늘리는 것만으로도 의미가 있어요. 또 같은 걸음 수라도 일부를 빠르게 걸으면 효과가 더 크다는 연구들이 있어요.</p>

<h2>걸으면 무엇이 좋아질까</h2>
<ul>
<li><strong>심장과 혈관:</strong> 혈압이 내려가고, 좋은 콜레스테롤(HDL)이 늘고, 심혈관 질환 위험이 줄어요.</li>
<li><strong>혈당:</strong> 근육이 포도당을 쓰면서 인슐린이 더 잘 들어요. 식후 10~15분 걷기는 식후 혈당을 낮추는 데 특히 효과적이에요.</li>
<li><strong>뼈:</strong> 발로 체중을 싣는 운동이라 뼈에 적당한 자극을 줘요.</li>
<li><strong>기분과 잠:</strong> 우울과 불안 증상이 줄고, 낮에 햇빛을 받으며 걸으면 밤잠에도 도움이 돼요.</li>
<li><strong>뇌:</strong> 규칙적인 신체활동은 인지 기능 저하와 치매 위험이 낮은 것과 관련돼요.</li>
</ul>

<h2>바르게 걷는 자세</h2>
<ol>
<li><strong>시선은 10~15m 앞</strong>을 봐요. 휴대폰을 보며 걸으면 목이 앞으로 빠지고 넘어질 위험도 커요.</li>
<li><strong>어깨는 힘을 빼고</strong> 가슴을 가볍게 펴요.</li>
<li><strong>팔은 90도 정도 굽혀</strong> 자연스럽게 앞뒤로 흔들어요. 팔을 흔들면 속도가 자연스럽게 빨라져요.</li>
<li><strong>발뒤꿈치부터 닿고</strong> 발바닥, 발끝 순서로 굴러가듯 딛어요.</li>
<li>보폭을 억지로 넓히기보다 <strong>걸음 수를 빠르게</strong> 해서 속도를 올려요. 보폭을 과하게 넓히면 무릎과 정강이에 부담이 커요.</li>
</ol>

<h2>부상 없이 오래 걷기</h2>
<h3>신발</h3>
<ul>
<li>발볼에 여유가 있고 뒤꿈치를 잘 잡아주는 신발을 골라요.</li>
<li>발은 오후에 붓기 때문에 <strong>오후에 신어보고</strong> 사는 게 좋아요.</li>
<li>쿠션이 꺼졌거나 밑창이 한쪽으로 닳았다면 바꿀 때예요.</li>
</ul>
<h3>천천히 늘리기</h3>
<p>평소 거의 걷지 않던 사람이 갑자기 하루 1만 보를 걸으면 족저근막염이나 정강이 통증이 생기기 쉬워요. <strong>일주일에 10~20%씩</strong> 늘려가는 게 안전해요.</p>
<h3>계절별 주의</h3>
<ul>
<li><strong>여름:</strong> 한낮을 피해 아침이나 저녁에 걷고, 물을 챙겨요.</li>
<li><strong>겨울:</strong> 몸을 충분히 푼 뒤 나가요. 추운 새벽에는 혈압이 오르기 쉬워서 고혈압이나 심장질환이 있다면 해가 뜬 뒤가 좋아요. 빙판길에서는 보폭을 줄여요.</li>
</ul>
<div class="box warn"><span class="h">운동을 멈추고 진료를 받아야 하는 신호</span>
<p>걷는 중에 가슴이 조이거나 누르는 통증, 평소보다 심한 숨참, 어지러움, 식은땀이 나타나면 바로 멈춰요. 쉬어도 나아지지 않으면 119에 연락해요. 심장질환, 당뇨병 합병증, 관절 질환이 있다면 운동 강도를 의사와 먼저 상의하는 게 좋아요.</p></div>

<h2>습관으로 만드는 방법</h2>
<div class="box"><span class="h">일상에 걷기 끼워 넣기</span>
<ol>
<li>지금 하루 평균 걸음 수를 일주일 동안 확인해요.</li>
<li>평균에 2천 보를 더한 숫자를 첫 목표로 정해요.</li>
<li>점심 식사 후 10분, 저녁 식사 후 10분 걷기부터 시작해요.</li>
<li>엘리베이터 대신 두세 층은 계단을 이용해요.</li>
<li>버스 한 정거장 먼저 내리거나 조금 먼 곳에 주차해요.</li>
<li>일주일에 두 번은 20~30분 동안 숨이 조금 찰 만큼 빠르게 걸어요.</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>뒤로 걷기나 맨발 걷기가 더 좋은가요?</dt>
<dd>뒤로 걷기는 다른 근육을 쓰고 균형 훈련이 되지만 넘어질 위험이 커요. 맨발 걷기는 발의 감각과 근육을 자극하지만 상처와 감염 위험이 있어요. 특히 당뇨병이 있는 사람은 맨발로 걷지 않는 게 안전해요. 기본은 신발을 신고 앞으로 빠르게 걷는 거예요.</dd>
<dt>무릎이 아픈데 걸어도 되나요?</dt>
<dd>퇴행성 관절염이 있어도 적당한 걷기는 관절 주변 근육을 키워 오히려 통증을 줄이는 데 도움이 돼요. 다만 걷고 나서 통증이 심해지거나 붓는다면 시간과 강도를 줄이고, 평지나 실내 자전거, 수중 걷기로 바꿔볼 수 있어요.</dd>
<dt>걷기만으로 살이 빠지나요?</dt>
<dd>걷기는 체중 감량에 도움이 되지만 식사 조절 없이 걷기만으로 크게 빼기는 어려워요. 대신 감량한 체중을 유지하는 데 신체활동이 특히 중요하다는 연구가 많아요.</dd>
</dl>

  data-tags="전기요금,누진제,에너지절약,대기전력,가전제품">
<p class="lead">전기요금은 쓴 만큼 똑같이 오르지 않아요. 계단처럼 올라가요. 그래서 계단 하나를 넘느냐 마느냐가 절약의 핵심이에요.</p>

<div class="box sum"><span class="h">이 글의 핵심</span>
<ul>
<li>주택용 전기는 <strong>사용량 구간이 올라갈수록 단가가 비싸지는 3단계 누진제</strong>예요.</li>
<li>7~8월은 구간이 넓어져요. 나머지 달은 <strong>200kWh·400kWh</strong>, 여름은 <strong>300kWh·450kWh</strong>가 경계예요.</li>
<li>사용량은 <strong>소비전력(W) × 사용 시간 ÷ 1,000</strong>으로 계산할 수 있어요.</li>
<li>효과가 큰 건 <strong>열을 만드는 가전</strong>(전기난방, 건조기, 보온)과 <strong>에어컨 사용 습관</strong>이에요.</li>
</ul></div>

<h2>누진제는 어떻게 작동할까</h2>
<p>주택용 전기요금은 한 달 사용량을 구간으로 나누고, <strong>구간마다 다른 단가</strong>를 적용해요. 중요한 점은 사용량 전체에 비싼 단가가 붙는 게 아니라, <strong>그 구간을 넘은 만큼만</strong> 비싼 단가가 붙는다는 거예요. 여기에 기본요금은 마지막으로 도달한 구간 기준으로 매겨져요.</p>
<div class="tbl"><table>
<thead><tr><th>구간</th><th>1~6월, 9~12월</th><th>7~8월 (하계)</th></tr></thead>
<tbody>
<tr><td>1단계</td><td class="num">200kWh 이하</td><td class="num">300kWh 이하</td></tr>
<tr><td>2단계</td><td class="num">201~400kWh</td><td class="num">301~450kWh</td></tr>
<tr><td>3단계</td><td class="num">400kWh 초과</td><td class="num">450kWh 초과</td></tr>
</tbody>
<caption>한국전력공사 주택용 전력(저압) 기준. 단가는 요금 조정에 따라 바뀌므로 한전 홈페이지에서 확인해요.</caption></table></div>
<p>여기에 겨울(12~2월)과 여름(7~8월)에 한 달 1,000kWh를 넘게 쓰면 가장 높은 단가가 붙는 '슈퍼유저' 구간이 따로 있어요. 일반 가정에서는 드물지만, 전기난방을 많이 쓰는 집이라면 확인해 볼 필요가 있어요.</p>
<h3>예를 들어 볼게요</h3>
<p>4인 가족이 평소 한 달 380kWh를 쓰다가, 겨울에 전기히터를 들여 50kWh를 더 썼다고 해볼게요. 합계 430kWh로 3단계에 들어가면서, 넘은 30kWh에 가장 비싼 단가가 붙고 기본요금도 3단계 금액으로 바뀌어요. <strong>늘어난 사용량은 13%인데 요금은 그보다 훨씬 많이 오르는</strong> 이유예요.</p>

<h2>고지서 읽는 법</h2>
<div class="tbl"><table>
<thead><tr><th>항목</th><th>뜻</th></tr></thead>
<tbody>
<tr><td>기본요금</td><td>도달한 누진 구간에 따라 정해지는 고정 금액</td></tr>
<tr><td>전력량요금</td><td>구간별 단가 × 구간별 사용량의 합</td></tr>
<tr><td>기후환경요금</td><td>신재생에너지, 탄소 배출 관련 비용을 사용량에 비례해 부과</td></tr>
<tr><td>연료비조정요금</td><td>발전 연료 가격 변동을 분기마다 반영</td></tr>
<tr><td>부가가치세</td><td>전기요금의 10%</td></tr>
<tr><td>전력산업기반기금</td><td>전기요금에 일정 비율로 붙는 법정 부담금</td></tr>
</tbody></table></div>
<p>아파트에 사는 경우 관리비에 전기요금이 포함돼 나오는데, 아파트의 계약 방식에 따라 계산이 조금 달라질 수 있어요. 세대별 사용량(kWh)은 관리비 고지서나 한전 앱에서 확인할 수 있어요.</p>

<h2>우리 집 사용량 계산하기</h2>
<p>가전제품 뒷면이나 설명서에 적힌 <strong>소비전력(W)</strong>만 알면 대략적인 사용량을 계산할 수 있어요.</p>
<div class="box note"><span class="h">계산 공식</span>
<p><strong>한 달 사용량(kWh) = 소비전력(W) × 하루 사용 시간 × 30일 ÷ 1,000</strong></p>
<p>예) 1,500W 전기히터를 하루 5시간 쓰면 1,500 × 5 × 30 ÷ 1,000 = <strong>225kWh</strong>. 평소 200kWh를 쓰던 집이라면 이것만으로 사용량이 두 배가 돼요.</p></div>
<p>에어컨이나 냉장고처럼 켜고 꺼지기를 반복하는 제품은 표시된 소비전력만큼 계속 쓰지 않아서 실제 사용량이 계산보다 적어요. 정확히 알고 싶다면 1만 원 안팎의 <strong>전력 측정 콘센트</strong>를 쓰면 제품별 실제 사용량을 볼 수 있어요.</p>

<h2>효과가 큰 절약 포인트</h2>
<p>전기를 가장 많이 쓰는 건 <strong>열을 만들거나 식히는 가전</strong>이에요. 조명이나 휴대폰 충전기를 아끼는 것보다 이쪽을 손보는 게 훨씬 효과가 커요.</p>
<h3>에어컨</h3>
<ul>
<li><strong>설정 온도는 26°C 전후</strong>로 하고 선풍기로 공기를 돌려요. 체감 온도가 내려가 설정 온도를 낮추지 않아도 돼요.</li>
<li><strong>인버터 에어컨</strong>은 목표 온도에 도달하면 약하게 계속 도는 방식이라, 30분~1시간 외출에 끄고 켜기를 반복하기보다 켜두는 게 나을 수 있어요. 오래 비울 때는 꺼요.</li>
<li><strong>정속형(구형) 에어컨</strong>은 켜고 끄는 방식이라 적정 온도가 되면 끄고 선풍기로 유지하는 게 유리해요.</li>
<li>필터를 2주에 한 번 청소하고, 실외기 주변에 물건을 두지 않아요.</li>
<li>커튼이나 블라인드로 한낮의 햇빛을 막으면 냉방 부담이 크게 줄어요.</li>
</ul>
<h3>난방용 전기제품</h3>
<ul>
<li>전기히터, 온풍기는 소비전력이 1,000~2,000W를 넘는 경우가 많아 누진 구간을 넘기는 주범이에요. 몸 가까이 좁은 공간만 데우는 용도로 짧게 써요.</li>
<li>전기요와 전기장판은 히터보다 소비전력이 훨씬 적어요. 잘 때 낮은 단계로 쓰고 타이머를 맞춰요.</li>
</ul>
<h3>주방과 세탁</h3>
<ul>
<li><strong>전기밥솥 보온</strong>은 하루 종일 켜두면 생각보다 많은 전기를 써요. 밥은 한 번 먹을 양씩 나눠 냉동하고 데워 먹는 게 전기도 맛도 나아요.</li>
<li><strong>건조기</strong>는 한 번 돌릴 때 전기를 많이 써요. 탈수를 한 번 더 하고 넣으면 건조 시간이 줄어요. 날씨가 좋은 날은 자연 건조를 섞어요.</li>
<li><strong>냉장고</strong>는 벽에서 10cm 이상 띄워 열이 빠지게 하고, 냉장실은 70% 정도만 채워요.</li>
<li>세탁기는 모아서 돌리고, 심하게 더럽지 않다면 찬물 세탁으로 충분해요. 물 데우는 데 전기가 많이 들어요.</li>
</ul>
<h3>대기전력</h3>
<p>플러그가 꽂혀 있으면 꺼진 상태에서도 전기가 조금씩 새요. 셋톱박스, 컴퓨터, 전자레인지, 게임기가 대표적이에요. 하나하나는 작지만 24시간 365일 새기 때문에 모이면 무시할 수 없어요. <strong>스위치가 달린 멀티탭</strong>으로 한 번에 끄면 편해요. 냉장고, 인터넷 공유기처럼 계속 켜둬야 하는 제품은 예외예요.</p>

<h2>가전을 살 때 볼 것</h2>
<p>에너지소비효율등급은 <strong>1등급부터 5등급</strong>까지 있고, 1등급이 가장 효율이 좋아요. 등급 라벨에는 <strong>월간 소비전력량(kWh)</strong>이나 연간 에너지 비용이 함께 적혀 있어서 같은 종류 제품끼리 비교할 수 있어요. 오래 쓰는 냉장고, 에어컨, 김치냉장고는 등급 차이가 몇 년 동안 쌓여 차이가 커요.</p>
<p>정부나 지자체에서 고효율 가전 구매 환급이나 전기 절약 실적에 따라 요금을 돌려주는 제도(에너지캐시백 등)를 운영하기도 해요. 운영 여부와 조건이 해마다 달라지니 한국전력공사와 한국에너지공단 홈페이지에서 확인해요.</p>

<h2>이번 달 바로 해볼 것</h2>
<div class="box"><span class="h">전기요금 점검표</span>
<ol>
<li>한전 앱이나 관리비 고지서에서 지난 12개월 사용량 확인하기</li>
<li>누진 구간 경계(200·400kWh, 여름 300·450kWh)에 얼마나 가까운지 보기</li>
<li>집에서 소비전력이 1,000W 넘는 제품 목록 만들기</li>
<li>밥솥 보온 끄기, 셋톱박스와 컴퓨터를 멀티탭 스위치로 끄기</li>
<li>에어컨 필터 청소하고 설정 온도 26°C 전후로 맞추기</li>
</ol></div>

<h2>자주 묻는 질문</h2>
<dl class="qa">
<dt>에어컨을 계속 켜두는 게 더 싸다는 말이 맞나요?</dt>
<dd>인버터 에어컨에서, 짧게 외출하는 경우에는 맞을 수 있어요. 처음 온도를 낮출 때 전기를 가장 많이 쓰기 때문이에요. 하지만 몇 시간 이상 비운다면 끄는 게 나아요. 정속형은 해당되지 않아요.</dd>
<dt>충전기를 꽂아두면 전기가 많이 새나요?</dt>
<dd>요즘 휴대폰 충전기의 대기전력은 아주 작아서 요금에 미치는 영향은 크지 않아요. 다만 오래된 제품이나 뜨거워지는 충전기는 화재 예방 차원에서 뽑아두는 게 좋아요.</dd>
<dt>전기요금 복지할인은 누가 받을 수 있나요?</dt>
<dd>장애인, 국가유공자, 기초생활수급자, 차상위계층, 다자녀 가구, 출산 가구, 대가족, 생명유지장치 사용 가구 등을 대상으로 할인 제도가 있어요. 대상과 할인 폭은 바뀔 수 있으니 한전 고객센터(국번 없이 123)나 홈페이지에서 신청 조건을 확인해요.</dd>
</dl>

<h2>참고 자료</h2>
<ul class="refs">
<li>한국전력공사, 주택용 전기요금표 및 요금 계산 안내</li>
<li>한국에너지공단, 에너지소비효율등급 표시제도</li>
<li>산업통상자원부, 여름·겨울철 에너지 절약 요령</li>
</ul>
</template>

<script>
(function(){
  var CAT={life:'생활정보',dis:'질병',nut:'영양소',hea:'건강상식'};
  var ORDER=['life','dis','nut','hea'], PER=10;
  /* 최신 글이 위로: 빌드 순서의 역순 */
  var POSTS=[].map.call(document.querySelectorAll('template[data-id]'),function(t){
    var th=(t.dataset.thumb||'').split('|');
    var text=t.content.textContent.replace(/\s+/g,' ');
    return {id:t.dataset.id,cat:t.dataset.cat,title:t.dataset.title,date:t.dataset.date,sum:t.dataset.summary,
      tags:(t.dataset.tags||'').split(',').filter(Boolean),big:th[0],small:th[1],
      min:Math.max(1,Math.round(text.replace(/ /g,'').length/500)),tpl:t,
      hay:(t.dataset.title+' '+t.dataset.summary+' '+t.dataset.tags+' '+text).toLowerCase()};
  }).reverse();

  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  var main=document.getElementById('main');
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
  function btn(cls,txt,fn){var b=el('button',cls,txt);b.type='button';if(fn)b.addEventListener('click',fn);return b;}
  function go(h){ if(location.hash==='#'+h) route(); else location.hash=h; }
  function inCat(c){return POSTS.filter(function(p){return !c||p.cat===c});}

  /* 메뉴·사이드바 */
  var menu=document.getElementById('menu'), catlist=document.getElementById('catlist');
  function menuBtn(label,hash,n){var b=btn(null,label,function(){go(hash)});b.dataset.h=hash;
    b.appendChild(el('span','n','('+n+')'));return b;}
  menu.appendChild(menuBtn('전체글','home',POSTS.length));
  ORDER.forEach(function(c){menu.appendChild(menuBtn(CAT[c],'cat-'+c,inCat(c).length));});
  function catItem(label,hash,n,sub){var l=el('li',sub?'sub':null);var b=btn(null,null,function(){go(hash)});b.dataset.h=hash;
    b.appendChild(el('span',null,label));b.appendChild(el('span',null,'('+n+')'));l.appendChild(b);catlist.appendChild(l);}
  catItem('전체보기','home',POSTS.length);
  ORDER.forEach(function(c){catItem(CAT[c],'cat-'+c,inCat(c).length,true);});
  var recent=document.getElementById('recent');
  POSTS.slice(0,5).forEach(function(p){var l=el('li');l.appendChild(btn(null,p.title,function(){go('post-'+p.id)}));recent.appendChild(l);});
  var freq={};POSTS.forEach(function(p){p.tags.forEach(function(t){freq[t]=(freq[t]||0)+1;});});
  var tc=document.getElementById('tagcloud');
  Object.keys(freq).sort(function(a,b){return freq[b]-freq[a]}).slice(0,24).forEach(function(t){
    tc.appendChild(btn(null,t,function(){q.value=t;search();}));});
  function mark(h){[].forEach.call(document.querySelectorAll('[data-h]'),function(b){b.setAttribute('aria-current',b.dataset.h===h?'true':'false');});}

  /* 검색 */
  var q=document.getElementById('q');
  function search(){var s=q.value.trim().toLowerCase();if(!s)return;
    var hits=POSTS.filter(function(p){return p.hay.indexOf(s)>=0;});
    if(location.hash) history.replaceState(null,'',location.pathname+location.search);
    list(null,hits,'‘'+q.value.trim()+'’ 검색 결과');window.scrollTo(0,0);}
  document.getElementById('searchform').addEventListener('submit',function(e){e.preventDefault();search();});

  function thumb(p){var d=el('div','thumb t-'+p.cat);d.setAttribute('aria-hidden','true');
    d.appendChild(el('b',null,p.big));d.appendChild(el('small',null,p.small));return d;}

  function list(c,items,label,page){
    items=items||inCat(c); page=page||1;
    mark(label?null:(c?'cat-'+c:'home'));
    main.innerHTML='';
    var head=el('div','listhead');head.appendChild(el('h2',null,label||(c?CAT[c]:'전체글')));
    head.appendChild(el('span',null,items.length+'개의 글'));main.appendChild(head);
    if(!items.length){main.appendChild(el('p','nohit','찾는 글이 없어요. 다른 낱말로 검색해 보세요.'));return;}
    var pages=Math.ceil(items.length/PER); page=Math.min(page,pages);
    var ul=el('ul','postlist');
    items.slice((page-1)*PER,page*PER).forEach(function(p){
      var l=el('li');var b=btn('item',null,function(){go('post-'+p.id)});
      var txt=el('div');txt.style.minWidth='0';
      txt.appendChild(el('span','item-cat k-'+p.cat,CAT[p.cat]));
      txt.appendChild(el('span','item-title',p.title));
      txt.appendChild(el('span','item-sum',p.sum));
      txt.appendChild(el('span','item-meta',p.date+' · 읽는 데 약 '+p.min+'분'));
      b.appendChild(txt);b.appendChild(thumb(p));l.appendChild(b);ul.appendChild(l);});
    main.appendChild(ul);
    if(pages>1){var pg=el('nav','pager');pg.setAttribute('aria-label','페이지');
      for(var i=1;i<=pages;i++)(function(n){var b=btn(null,String(n),function(){list(c,items,label,n);main.scrollIntoView({block:'start'});});
        if(n===page)b.setAttribute('aria-current','page');pg.appendChild(b);})(i);
      main.appendChild(pg);}
  }

  function post(p){
    mark('cat-'+p.cat);
    main.innerHTML='';
    var a=el('article','post');
    a.appendChild(btn('crumb k-'+p.cat,CAT[p.cat],function(){go('cat-'+p.cat)}));
    a.appendChild(el('h2','post-title',p.title));
    var by=el('div','byline');by.appendChild(el('b',null,'상식첩 편집실'));
    by.appendChild(el('span',null,p.date));by.appendChild(el('span',null,'읽는 데 약 '+p.min+'분'));a.appendChild(by);
    var body=el('div','body');body.appendChild(p.tpl.content.cloneNode(true));
    var hs=body.querySelectorAll('h2');
    if(hs.length){var toc=el('nav','toc');toc.setAttribute('aria-label','목차');toc.appendChild(el('p',null,'목차'));
      var ol=el('ol');
      [].forEach.call(hs,function(h,i){h.id='sec'+(i+1);var li=el('li');
        li.appendChild(btn(null,h.textContent,function(){h.scrollIntoView({behavior:'smooth',block:'start'})}));ol.appendChild(li);});
      toc.appendChild(ol);a.appendChild(toc);}
    a.appendChild(body);
    var tg=el('div','tags');p.tags.forEach(function(t){tg.appendChild(el('span',null,'#'+t))});a.appendChild(tg);
    if(p.cat!=='life') a.appendChild(el('p','disclaim','이 글은 일반적인 건강 정보를 정리한 것으로 개인의 진단이나 치료를 대신하지 않아요. 증상이 있거나 약을 복용 중이라면 의사·약사와 상의하세요.'));
    var act=el('div','actions');var key='like-'+p.id;var lk=btn('like',null,function(){put(key,get(key)==='1'?'0':'1');dl();});
    function dl(){var on=get(key)==='1';lk.textContent=on?'♥ 공감했어요':'♡ 공감하기';lk.setAttribute('aria-pressed',on?'true':'false');}
    dl();act.appendChild(lk);a.appendChild(act);
    main.appendChild(a);
    var rel=inCat(p.cat).filter(function(x){return x!==p}).slice(0,5);
    if(rel.length){var rb=el('section','related');rb.appendChild(el('h3',null,'‘'+CAT[p.cat]+'’ 카테고리의 다른 글'));
      var ru=el('ul');rel.forEach(function(x){var l=el('li');l.appendChild(btn(null,x.title,function(){go('post-'+x.id)}));ru.appendChild(l);});
      rb.appendChild(ru);main.appendChild(rb);}
    var i=POSTS.indexOf(p), pn=el('div','pn');
    [[i+1,'이전 글'],[i-1,'다음 글']].forEach(function(x){var o=POSTS[x[0]];var b=btn(null,null,o?function(){go('post-'+o.id)}:null);
      b.appendChild(el('small',null,x[1]));b.appendChild(el('span',null,o?o.title:''));if(!o)b.disabled=true;pn.appendChild(b);});
    main.appendChild(pn);
  }

  function route(){
    var h=location.hash.replace('#','');
    if(h.indexOf('post-')===0){var p=POSTS.filter(function(x){return x.id===h.slice(5)})[0];if(p){post(p);window.scrollTo(0,0);return;}}
    if(h.indexOf('cat-')===0 && CAT[h.slice(4)]){list(h.slice(4));window.scrollTo(0,0);return;}
    list(null);
  }
  document.getElementById('home-link').addEventListener('click',function(e){e.preventDefault();go('home');});
  window.addEventListener('hashchange',route);
  route();
})();
</script>
</body>
</html>
